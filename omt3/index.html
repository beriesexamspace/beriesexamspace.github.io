<style>
  :root{
    --bg:#f4f2ee; --bg2:#ebe8e2; --card:#ffffff; --ink:#1b232c; --muted:#5d6873;
    --line:#e2ddd4; --accent:#0f6e6a; --accent-ink:#0b4f4c; --accent-soft:#dcefed;
    --amber:#c9821f; --amber-soft:#f7ecd9; --violet:#6d5bd0; --violet-soft:#e9e6fa;
    --good:#1f8a4c; --good-soft:#e2f3e8; --bad:#c23b54; --bad-soft:#fbe5ea;
    --shadow:0 1px 2px rgba(20,30,40,.05),0 6px 18px rgba(20,30,40,.05);
    --shadow-lg:0 2px 6px rgba(20,30,40,.06),0 18px 40px rgba(20,30,40,.10);
    --r:14px; --r-lg:20px; --ease:cubic-bezier(.2,.8,.2,1);
  }
  html[data-theme="dark"]{
    --bg:#11151a; --bg2:#161b22; --card:#1b222b; --ink:#e7ecf1; --muted:#9aa6b2;
    --line:#2a323c; --accent:#3fb9b2; --accent-ink:#7fd6d0; --accent-soft:#163230;
    --amber:#e0a64a; --amber-soft:#2e2515; --violet:#a99cf0; --violet-soft:#221d3a;
    --good:#46c178; --good-soft:#16301f; --bad:#ef6b82; --bad-soft:#331620;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 2px 8px rgba(0,0,0,.4),0 22px 48px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;letter-spacing:-.01em}
  button,a{font-family:inherit;cursor:pointer;color:inherit}
  .wrap{max-width:880px;margin:0 auto;padding:0 18px 96px}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
  .ic{width:1.25em;height:1.25em;flex:none;vertical-align:-.18em;stroke:currentColor;stroke-width:1.75;
    stroke-linecap:round;stroke-linejoin:round;fill:none}

  header.top{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(160%) blur(16px);-webkit-backdrop-filter:saturate(160%) blur(16px);box-shadow:inset 0 -1px 0 0 rgba(0,0,0,.04)}
  .topin{max-width:880px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:700}
  .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,var(--accent),var(--accent-ink));
    color:#fff;display:grid;place-items:center;font-family:Georgia,serif;font-weight:700;font-size:16px;flex:none;
    box-shadow:0 2px 6px rgba(15,110,106,.35)}
  .brand small{display:block;font-weight:500;color:var(--muted);font-size:11px}
  .spacer{flex:1}
  .iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:38px;
    padding:7px 11px;font-size:13.5px;display:inline-flex;gap:7px;align-items:center;text-decoration:none;
    transition:border-color .2s var(--ease),transform .12s var(--ease)}
  .iconbtn:hover{border-color:var(--accent)} .iconbtn:active{transform:scale(.96)}
  nav.tabs{display:flex;gap:2px;overflow:auto;max-width:880px;margin:0 auto;padding:6px 12px 0;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{border:none;background:none;color:var(--muted);padding:10px 13px;border-radius:9px 9px 0 0;
    font-size:14px;font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px;transition:color .2s var(--ease)}
  nav.tabs button .ic{width:16px;height:16px}
  nav.tabs button.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
  nav.tabs button:hover{color:var(--ink)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:20px}
  .muted{color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
  .pill.amber{background:var(--amber-soft);color:var(--amber)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;gap:14px}
  @media(min-width:620px){.g2{grid-template-columns:1fr 1fr}}

  .hero{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin:20px 0 8px}
  .count{flex:none;background:linear-gradient(150deg,var(--accent),var(--accent-ink));color:#fff;border-radius:var(--r);padding:14px 20px;text-align:center;min-width:118px;box-shadow:0 8px 20px rgba(15,110,106,.28)}
  .count b{font-family:Georgia,serif;font-size:32px;display:block;line-height:1}
  .count span{font-size:12px;opacity:.92}
  .herotext h1{margin:0 0 4px;font-size:25px}
  .herotext p{margin:0;color:var(--muted)}

  .brandstrip{display:flex;align-items:center;gap:13px;width:100%;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 16px;margin:14px 0 2px;box-shadow:var(--shadow);transition:border-color .2s var(--ease),transform .15s var(--ease)}
  .brandstrip:hover{border-color:var(--accent);transform:translateY(-1px)}
  .brandstrip .bs-logo{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:17px;background:linear-gradient(145deg,var(--accent),var(--accent-ink))}
  .brandstrip .bs-txt{flex:1;min-width:0} .brandstrip .bs-txt b{display:block;font-size:14.5px} .brandstrip .bs-txt small{color:var(--muted);font-size:12.5px}
  .brandstrip .bs-go{color:var(--accent-ink);flex:none;display:inline-flex} .brandstrip .bs-go .ic{width:18px;height:18px}

  .seclabel{display:flex;align-items:center;gap:8px;margin:24px 0 12px;font-weight:700;font-size:15px}
  .seclabel .ic{width:18px;height:18px;color:var(--accent-ink)}
  .backlink{display:inline-flex;align-items:center;gap:5px;border:none;background:none;color:var(--muted);font-size:13.5px;font-weight:600;padding:6px 0;margin-bottom:4px;transition:color .2s var(--ease)}
  .backlink:hover{color:var(--accent-ink)} .backlink .ic{width:16px;height:16px}
  .tracks{display:grid;gap:14px} @media(min-width:600px){.tracks{grid-template-columns:1fr 1fr}}
  .track{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);transition:transform .22s var(--ease),border-color .22s var(--ease),box-shadow .22s var(--ease)}
  .track:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow-lg)} .track:active{transform:translateY(-1px) scale(.995)}
  .track .tile{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;margin-bottom:4px;background:linear-gradient(150deg,var(--accent),var(--accent-ink))}
  .track.alt .tile{background:linear-gradient(150deg,var(--violet),#4f40a8)} .track .tile .ic{width:24px;height:24px}
  .track b{font-size:18px} .track small{color:var(--muted);font-size:13.5px;line-height:1.5}
  .track .go{margin-top:6px;display:inline-flex;align-items:center;gap:6px;color:var(--accent-ink);font-weight:600;font-size:13.5px} .track.alt .go{color:var(--violet)} .track .go .ic{width:16px;height:16px}
  .toggle{width:48px;height:28px;border-radius:999px;border:none;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s var(--ease)}
  .toggle .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s var(--ease)}
  .toggle.on{background:var(--violet)} .toggle.on .knob{left:23px}
  .warmcard{border-color:var(--violet)!important;background:var(--violet-soft)} .warmcard .ic{width:22px;height:22px;color:var(--violet);flex:none}
  .modebanner{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:11px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent-ink);font-size:13.5px;font-weight:600}
  .modebanner.v{background:var(--violet-soft);color:var(--violet)} .modebanner .ic{width:18px;height:18px} .modebanner a,.modebanner .bnlink{margin-left:auto;font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;color:inherit;border:none;background:none;font-family:inherit;padding:0}
  html.snappy .card,html.snappy .mode,html.snappy .tip,html.snappy .track{animation-duration:.12s!important}
  .mode{display:flex;flex-direction:column;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:17px;gap:7px;box-shadow:var(--shadow);transition:transform .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease)}
  .mode:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .mode .me{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)} .mode .me .ic{width:22px;height:22px}
  .mode b{font-size:16px} .mode small{color:var(--muted);font-size:13px}

  label.fld{display:block;font-size:13px;font-weight:600;margin:16px 0 7px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;min-height:38px;padding:7px 13px;font-size:13.5px;transition:all .18s var(--ease)}
  .chip:hover{border-color:var(--accent)} .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:11px;min-height:46px;padding:12px 20px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;box-shadow:0 4px 12px rgba(15,110,106,.25);transition:background .2s var(--ease),transform .12s var(--ease)}
  .btn:hover{background:var(--accent-ink)} .btn:active{transform:scale(.97) translateY(1px)} .btn .ic{width:18px;height:18px}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none} .btn.ghost:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  input[type=search],input[type=text],input[type=email],textarea{font-family:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
  input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .runtop{display:flex;align-items:center;gap:12px;margin:2px 0 14px;font-size:13px;color:var(--muted)}
  .bar{height:8px;border-radius:6px;background:var(--bg2);overflow:hidden;flex:1}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .7s var(--ease)}
  .qtext{font-size:19px;font-weight:600;margin:8px 0 16px;font-family:Georgia,serif;line-height:1.45}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px 15px;margin-bottom:10px;font-size:15px;transition:border-color .15s var(--ease),background .15s var(--ease),transform .12s var(--ease)}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)} .opt:active:not(:disabled){transform:scale(.99)}
  .opt .k{flex:none;width:27px;height:27px;border-radius:8px;background:var(--bg2);color:var(--muted);display:grid;place-items:center;font-weight:700;font-size:13px}
  .opt.correct{border-color:var(--good);background:var(--good-soft)} .opt.correct .k{background:var(--good);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default}
  .feedback{border-radius:12px;padding:13px 15px;margin:4px 0 12px;font-size:14.5px}
  .feedback.ok{background:var(--good-soft);color:var(--good)} .feedback.no{background:var(--bad-soft);color:var(--bad)}
  .feedback b{font-weight:700} .feedback .sub{display:block;margin-top:3px;color:var(--ink);font-weight:500;opacity:.92}
  .whybtn{border:1px solid var(--line);background:var(--card);color:var(--accent-ink);border-radius:10px;min-height:40px;padding:9px 14px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:border-color .2s var(--ease),background .2s var(--ease)}
  .whybtn:hover{border-color:var(--accent);background:var(--accent-soft)} .whybtn .ic{width:16px;height:16px}
  .whybox{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:14px 16px;margin:12px 0 4px;font-size:14px;line-height:1.55}
  .whybox h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent-ink);font-family:system-ui;display:flex;align-items:center;gap:7px}
  .whybox .ic{width:16px;height:16px}

  .acc{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
  .acc>summary{padding:15px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:11px}
  .acc>summary::-webkit-details-marker{display:none}
  .acc>summary .n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
  .acc>summary .caret{margin-left:auto;color:var(--muted);transition:transform .25s var(--ease)} .acc[open]>summary .caret{transform:rotate(90deg)}
  .acc[open]>summary{border-bottom:1px solid var(--line)} .acc .body{padding:6px 18px 16px}
  .acc h4{margin:14px 0 6px;font-size:13px;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.4px;font-family:system-ui}
  .acc ul{margin:0;padding-left:20px} .acc li{margin:6px 0;font-size:14.5px;line-height:1.5}
  .acc.hack li::marker{content:"💡  "} .acc.hack>summary .n{background:var(--violet-soft);color:var(--violet)}
  mark{background:var(--amber-soft);color:inherit;padding:0 2px;border-radius:3px}

  .tip{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}
  .tip h4{margin:0 0 5px;font-size:14.5px;display:flex;align-items:center;gap:8px;font-family:system-ui} .tip h4 .ic{width:18px;height:18px;color:var(--violet)}
  .tip p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}
  .tipgrid{display:grid;gap:12px} @media(min-width:620px){.tipgrid{grid-template-columns:1fr 1fr}}

  .results .big{font-family:Georgia,serif;font-size:54px;text-align:center;margin:8px 0;line-height:1}
  .center{text-align:center} .hide{display:none!important}
  footer{margin-top:34px;text-align:center;color:var(--muted);font-size:13px}
  .kbd{font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--muted)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.03)}100%{transform:scale(1)}}
  @keyframes optIn{from{opacity:0;transform:translateX(-9px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: no-preference){
    .card,.mode,.tip{animation:fadeUp .34s var(--ease) both}
    .acc{animation:fadeUp .32s var(--ease) both}
    .opt{animation:optIn .3s var(--ease) backwards;animation-delay:var(--oi,0s)}
    .chip.on{animation:pop .22s var(--ease)}
    .feedback{animation:slideIn .26s var(--ease) both} .whybox{animation:slideIn .28s var(--ease) .07s both} .opt.correct{animation:pop .34s var(--ease)}
  }
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  /* ---- Premium launch (Gemini-stijl) + header-logo gloed ---- */
  @property --bes-a{syntax:'<angle>';initial-value:0deg;inherits:false}
  #splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(125% 125% at 50% 38%,var(--bg2) 0%,var(--bg) 68%);transition:opacity .6s var(--ease),transform .7s var(--ease)}
  #splash.hide{opacity:0;transform:scale(1.07);pointer-events:none}
  .sp-inner{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
  .sp-mark{position:relative;width:100px;height:100px;display:grid;place-items:center}
  .sp-mark::before{content:"";position:absolute;inset:-16px;border-radius:34px;z-index:0;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));filter:blur(17px);opacity:.75}
  .sp-mark::after{content:"";position:absolute;inset:-3px;border-radius:27px;z-index:1;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));padding:3px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .sp-logo{position:relative;z-index:2;width:92px;height:92px;border-radius:24px;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:46px;background:linear-gradient(150deg,var(--accent),var(--accent-ink));box-shadow:0 14px 38px rgba(15,110,106,.4)}
  .sp-spark{position:absolute;z-index:3;top:-7px;right:-7px;width:30px;height:30px;color:#fff;filter:drop-shadow(0 2px 7px rgba(0,0,0,.35))}
  .sp-name{position:relative;font-family:Georgia,serif;font-size:26px;font-weight:700;letter-spacing:-.01em;color:var(--ink);overflow:hidden}
  .sp-name::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(-130%)}
  .sp-tag{font-size:13px;color:var(--muted);margin-top:-8px;letter-spacing:.03em}
  @media (prefers-reduced-motion: no-preference){
    .sp-mark::before{animation:bes-spin 3s linear infinite,bes-breathe 2.4s var(--ease) infinite}
    .sp-mark::after{animation:bes-spin 3s linear infinite}
    .sp-logo{animation:bes-pop .7s var(--ease) both}
    .sp-spark{animation:bes-pop .6s var(--ease) .12s both,bes-twinkle 1.9s var(--ease) .9s infinite}
    .sp-name{animation:bes-rise .6s var(--ease) .14s both}
    .sp-name::after{animation:bes-shimmer 1.5s var(--ease) .5s 1}
    .sp-tag{animation:bes-rise .6s var(--ease) .26s both}
  }
  @keyframes bes-spin{to{--bes-a:360deg}}
  @keyframes bes-breathe{0%,100%{opacity:.55;filter:blur(16px)}50%{opacity:.95;filter:blur(22px)}}
  @keyframes bes-shimmer{to{transform:translateX(130%)}}
  @keyframes bes-twinkle{0%,100%{opacity:1;transform:scale(1) rotate(0deg)}50%{opacity:.65;transform:scale(.82) rotate(18deg)}}
  @keyframes bes-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  /* mobiel: header-knoppen alleen iconen zodat niks zijwaarts overflowt */
  @media(max-width:440px){ header.top .iconbtn span{display:none} header.top .iconbtn{padding:7px 9px;min-width:38px;justify-content:center} .topin{gap:8px} }
</style>
</head>
<body>
<div id="splash"><div class="sp-inner">
  <div class="sp-mark">
    <div class="sp-logo">O3</div>
    <svg class="sp-spark" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.5c.4 4.6 2.4 6.6 7 7-4.6.4-6.6 2.4-7 7-.4-4.6-2.4-6.6-7-7 4.6-.4 6.6-2.4 7-7Z"/></svg>
  </div>
  <div><div class="sp-name">Onderzoeksmethoden & -technieken III</div><div class="sp-tag">slim oefenen voor je examen</div></div>
</div></div>
<header class="top">
  <div class="topin">

<script>
window.O3 = {"questions":[{"t":"1","q":"Wat is volgens de brontekst het kernverschil tussen kwalitatief en kwantitatief onderzoek?","o":["Kwalitatief onderzoek is gebaseerd op statistiek, terwijl kwantitatief onderzoek subjectieve ervaringen bestudeert.","Kwalitatief onderzoek is objectief, terwijl kwantitatief onderzoek subjectief is.","Kwalitatief onderzoek is natuurwetenschappelijk, terwijl kwantitatief onderzoek sociologisch is.","Kwalitatief onderzoek richt zich op het begrijpen van complexe fenomenen en individuele perspectieven, terwijl kwantitatief onderzoek harde cijfers en generalisaties verzamelt."],"a":3,"u":"Kwalitatief onderzoek wil complexe fenomenen en individuele perspectieven begrijpen, terwijl kwantitatief onderzoek harde cijfers verzamelt om te generaliseren."},{"t":"1","q":"Wat wordt in de brontekst bedoeld met het \"kwantitatief imperatief\" in de psychologie?","o":["De opvatting dat wetenschappelijk onderzoek van een fenomeen neerkomt op meten, zodat methodes die niet meten als pre-wetenschappelijk gelden.","De verplichting om elk onderzoek te laten reviewen door statistici.","De eis dat kwalitatieve data altijd omgezet worden naar getallen voor publicatie.","De regel dat elk psychologisch experiment een controlegroep nodig heeft."],"a":0,"u":"Volgens het kwantitatief imperatief (o.a. Brower, 1949) betekent wetenschappelijk onderzoek meten, waardoor niet-metende methodes als niet- of pre-wetenschappelijk worden beschouwd."},{"t":"1","q":"Waarom lukt het zoeken naar universele wetmatigheden zoals in de fysica niet binnen de psychologie?","o":["Omdat er te weinig proefpersonen beschikbaar zijn voor grote experimenten.","Omdat mensen niet altijd exact hetzelfde reageren op dezelfde situatie.","Omdat psychologen te weinig statistische kennis hebben.","Omdat menselijk gedrag niet observeerbaar is."],"a":1,"u":"De psychologie kan geen wetmatigheden vinden die altijd gelden, omdat mensen niet altijd op precies dezelfde manier reageren. Het is een en-en-verhaal, geen of-verhaal."},{"t":"1","q":"Welke term hoort volgens het schema in de brontekst bij de KWALITATIEVE benadering?","o":["Operationeel","Nomothetisch","Idiografisch","Analytisch"],"a":2,"u":"In het overzicht staat de kwalitatieve benadering voor onder meer subjectief, soft, teleologisch, idiografisch en synoptisch, tegenover de nomothetische en analytische kwantitatieve pool."},{"t":"1","q":"Wat was de overkoepelende conclusie van het onderzoek van Povee en Roberts (2014)?","o":["De methodologie moet gekozen worden op basis van de onderzoeksvraag.","Mixed-methodonderzoek levert altijd betrouwbaardere resultaten op.","Kwalitatief onderzoek is superieur aan kwantitatief onderzoek.","Studenten vermijden kwalitatief onderzoek omdat het te weinig statistiek bevat."],"a":0,"u":"Povee en Roberts concludeerden dat de keuze van methodologie afhangt van de onderzoeksvraag, en dat kwantitatief, kwalitatief en mixed method elk hun eigen waarde hebben."},{"t":"1","q":"Wat houdt \"saturatie\" in kwalitatief onderzoek in?","o":["De verzadiging van een tijdschrift met te veel kwalitatieve artikelen.","Het moment waarop respondenten weigeren nog verder deel te nemen.","Het punt waarop nieuwe data niets nieuws meer opleveren.","Het punt waarop de steekproef statistisch significant wordt."],"a":2,"u":"Saturatie is het punt waarop er niets nieuws meer wordt verteld. De kans op saturatie is groter in homogene groepen dan in heterogene groepen."},{"t":"1","q":"Een onderzoeker vraagt een patiënt met chronische pijn om zijn pijn een cijfer op tien te geven, maar de patiënt geeft nooit een hoog cijfer omdat de pijn zijn normaal is geworden. Welke karakteristiek van kwalitatief onderzoek illustreert dit vooral?","o":["Concern with capturing the individual's perspective","Rejection of positivism","About emerging theory and concepts","Examination of the constraints of everyday life"],"a":0,"u":"Dit voorbeeld toont dat een cijfer op tien het individuele perspectief niet vat, wat de karakteristiek \"capturing the individual's perspective\" onderstreept."},{"t":"1","q":"Hoe verhouden kwalitatief en kwantitatief onderzoek zich tot theorie volgens de brontekst?","o":["Kwalitatief onderzoek vermijdt theorie volledig en beschrijft alleen feiten.","Kwalitatief onderzoek confirmeert theorie, terwijl kwantitatief onderzoek theorie ontdekt.","Beide zijn er enkel op gericht bestaande hypotheses te confirmeren.","Kwalitatief onderzoek ontdekt theorie en concepten, terwijl kwantitatief onderzoek theorie confirmeert."],"a":3,"u":"Kwalitatief onderzoek gaat over het ontdekken van theorie en concepten (die daarna geconfirmeerd kunnen worden), terwijl kwantitatief onderzoek gericht is op het confirmeren van theorie en hypothesetesten."},{"t":"1","q":"Wat bedoelde Josselson (2014) met haar visie op de verhouding tussen kwalitatief en kwantitatief onderzoek?","o":["Beide benaderingen sluiten elkaar volledig uit en kunnen niet samengaan.","Kwalitatief onderzoek zal binnenkort volledig verdwijnen uit de psychologie.","Er heeft een echte paradigmashift plaatsgevonden waarbij kwalitatief onderzoek het kwantitatieve vervangt.","Er is geen echte paradigmaverandering, maar eerder een co-existentie van beide benaderingen."],"a":3,"u":"Josselson spreekt van een paradigmashift, maar de brontekst nuanceert dat het eigenlijk geen paradigmaverandering is, wel een co-existentie van beide benaderingen."},{"t":"1","q":"In welke visie op wetenschap past de stelling dat mensen de echte wereld nooit direct kunnen observeren en collectief en sociaal handelen?","o":["De natuurwetenschappelijke benadering van Pythagoras en Fechner.","De positivistische, kwantitatieve conceptualisering van wetenschap.","Wetenschap als een toolbox van methodes en procedures.","Wetenschap als sociale constructie, verbonden met de kwalitatieve benadering."],"a":3,"u":"In de visie \"wetenschap als sociaal construct\" (kwalitatief) kunnen mensen de echte wereld nooit direct observeren en handelen ze collectief en sociaal, tegenover de objectieve, reële wereld van de kwantitatieve conceptualisering."},{"t":"2","q":"Wat is het centrale doel van een kwalitatief interview, in tegenstelling tot kwantitatieve methodes?","o":["Een representatieve steekproef bereiken","De duur van het onderzoek verkorten","Theorie genereren en inzicht krijgen","Hypotheses statistisch verifiëren"],"a":2,"u":"Volgens de bron dient het kwalitatief interview om theorie te genereren en inzicht te krijgen, terwijl kwantitatieve methodes aan verificatie doen."},{"t":"2","q":"Een onderzoeker wil weten HOE vrouwen postnatale depressie ervaren. Welke aanpak past hier het best bij?","o":["Quota sampling via CAPI","Een gestructureerd telefoononderzoek met multiple-choice","Een kwalitatief interview dat diepere betekenissen zoekt","Een kwantitatieve survey met het oog op generaliseerbaarheid"],"a":2,"u":"De bron gebruikt net dit voorbeeld: bij een 'hoe ervaren'-vraag past een kwalitatief interview dat diepere betekenissen zoekt, zonder nadruk op generaliseerbaarheid."},{"t":"2","q":"Wat betekent 'saturatie' in de context van kwalitatief interviewen?","o":["De maximale duur die een interview mag hebben","Het punt waarop het opnametoestel vol is","Het moment waarop je niets nieuws meer hoort","Het bereiken van een statistisch significant aantal"],"a":2,"u":"De bron omschrijft saturatie als het moment waarop je niets nieuws meer hoort, wat mede bepaalt hoeveel mensen je uiteindelijk interviewt."},{"t":"2","q":"Wat kenmerkt het gestructureerde uiteinde van het interviewcontinuüm?","o":["Nieuwe vragen worden tijdens het gesprek verzonnen","De geïnterviewde bepaalt zelf het gespreksonderwerp","Rijke data en flexibele vraagstelling","Op voorhand geschreven, gesloten vragen met beperkte antwoordmogelijkheden"],"a":3,"u":"Gestructureerde interviews werken volgens de bron met op voorhand geschreven, gesloten vragen en beperkte antwoordmogelijkheden, en leunen aan bij de kwantitatieve benadering."},{"t":"2","q":"Welke rol neemt de interviewer (I) op in een semigestructureerd interview?","o":["Hij beantwoordt de vragen van de geïnterviewde uitgebreid","Hij controleert gesprek, flow, inhoud en structuur en doet aan doorvragen","Hij vinkt antwoordopties aan op een beeldscherm","Hij houdt zich strikt aan een vast scenario"],"a":1,"u":"In het semigestructureerde interview controleert de interviewer gesprek, flow, inhoud en structuur, doet aan retentie, evaluatie en doorvragen, en beantwoordt zelf geen vragen."},{"t":"2","q":"Wat is een risico wanneer een insider (bv. iemand die in de organisatie werkt) de interviews afneemt?","o":["Te veel afstand tot de geïnterviewden","De noodzaak van specifieke training vooraf","Een persoonlijke focus die de interpretatie bedreigt","Gebrek aan kennis over de organisatie"],"a":2,"u":"Volgens de bron heeft een insider veel kennis en vertrouwen, maar loopt hij het gevaar van een persoonlijke focus waardoor de interpretatie bedreigd wordt."},{"t":"2","q":"Waarom kan het bij theorieontwikkeling (emerging topics) beter zijn om je vooraf niet te veel in te lezen?","o":["Om tijd en middelen uit te sparen","Om de betrouwbaarheid statistisch te verhogen","Om te vermijden dat je vragen sturend geformuleerd worden","Omdat inlezen bij kwalitatief onderzoek verboden is"],"a":2,"u":"De bron stelt dat je bij emerging topics beter niet te veel inleest, zodat je vragen niet sturend geformuleerd worden en de theorie kan opborrelen uit de data."},{"t":"2","q":"Hoe moet je de interviewleidraad volgens de bron het best opvatten?","o":["Als een aanpasbare lijst met topics, niet als scenario","Als een document dat na de pilot niet meer wijzigt","Als een gesloten vragenlijst voor kwantitatieve analyse","Als een exhaustief scenario met vaste volgorde"],"a":0,"u":"De leidraad is volgens de bron een niet-exhaustieve, aanpasbare lijst met topics met een niet-stringente volgorde, bedoeld als leidraad en niet als scenario, met de geïnterviewde centraal."},{"t":"2","q":"Welk kwaliteitskenmerk hoort bij een goed kwalitatief interview?","o":["De interviewer geeft zelf veel voorbeelden en onderbreekt vaak","De geïnterviewde is veel meer aan het woord en de interviewer luistert actief","De interviewer is duidelijk meer aan het woord dan de geïnterviewde","Het tempo wordt volledig door de interviewer bepaald"],"a":1,"u":"De bron benadrukt dat de geïnterviewde veel meer aan het woord is dan de interviewer, die actief luistert, weinig praat, stiltes toelaat en niet onderbreekt."},{"t":"2","q":"Wat is een belangrijk verschil tussen een gewone conversatie en een kwalitatief interview?","o":["Bij een interview verzamel je enkel data van de interviewer","Een interview verloopt volledig zonder enig doel of richting","Een interview mag nooit worden opgenomen","Een interview is een conversatie met een doel, met een veel actievere interactiecomponent"],"a":3,"u":"De bron stelt dat een interview geen gewone dagdagelijkse conversatie is maar een conversatie met een doel, waarbij de interactiecomponent veel actiever en groter is en je data van alle deelnemers verzamelt."},{"t":"2","q":"Waarom is het bij een kwalitatief interview bijna essentieel om het gesprek op te nemen?","o":["Om een kwantitatieve analyse van de antwoorden mogelijk te maken","Om de aandacht bij het interview te kunnen houden en de transcriptie te bevorderen","Omdat de wet opname bij elk wetenschappelijk gesprek verplicht","Om de duur van het interview op voorhand te kunnen voorspellen"],"a":1,"u":"Volgens de bron helpt opnemen de interviewer om de aandacht bij het gesprek te houden en bevordert het de transcriptie, waardoor het bijna essentieel is bij kwalitatieve interviews."},{"t":"2","q":"Wat is het typische kenmerk van een ongestructureerd interview?","o":["De vragen liggen volledig op voorhand vast in een strikt scenario","De analyse is uitsluitend kwantitatief","De geïnterviewde bepaalt zelf het gespreksonderwerp, zonder zicht op begin- of eindpunt","Er wordt gewerkt met multiple-choice en quota sampling"],"a":2,"u":"De bron beschrijft het ongestructureerde interview, bijvoorbeeld bij daklozen, waarbij de persoon zelf het gespreksonderwerp bepaalt en je geen zicht hebt op waar je begint of uitkomt."},{"t":"3","q":"Wat kenmerkt participerende observatie als onderzoeksstrategie het best?","o":["Het uitsluitend registreren van meetbare gedragsfrequenties zonder betrokkenheid van de onderzoeker","Het capteren en analyseren van de observaties van een onderzoeker in een bepaalde setting, waarbij verschillende soorten gegevens verzameld kunnen worden","Het afnemen van gestandaardiseerde vragenlijsten bij een aselecte steekproef van respondenten","Het achteraf coderen van bestaande documenten en archiefmateriaal over een groep"],"a":1,"u":"Participerende observatie draait om het capteren en analyseren van de observaties van een onderzoeker in een setting (groep, cultuur, subcultuur). Het is een strategie om verschillende soorten gegevens te verzamelen, die enkel uit observatie kan bestaan maar ook verrijkt kan worden met ander materiaal."},{"t":"3","q":"Waarom is het belangrijk om in veldnota's zuivere observatie strikt te scheiden van interpretatie?","o":["Omdat alleen interpretaties bruikbaar zijn voor de uiteindelijke analyse","Omdat de geobserveerde personen anders inzage kunnen eisen in de nota's","Omdat objectiviteit een probleem vormt en de veldnota moet noteren wat objectief geobserveerd werd, los van de analytische duiding","Omdat interpretaties sneller neer te schrijven zijn dan observaties"],"a":2,"u":"Objectiviteit wordt in etnografisch onderzoek als probleem gezien, daarom worden veldnota's en interpretaties gescheiden. In de veldnota noteer je objectief wat geobserveerd werd, bijvoorbeeld dat Debby niet lachte bij aankomst, en niet de interpretatie dat ze vijandig was."},{"t":"3","q":"Een politieagent doet in het geheim onderzoek binnen het eigen politiekorps en observeert werk, arrestaties en geweld. Welke combinatie van rol en context past hierbij?","o":["Openlijke rol in een gesloten setting","Geheime rol in een open setting","Openlijke rol in een open setting","Geheime rol in een gesloten setting"],"a":1,"u":"De brontekst geeft dit expliciet als voorbeeld van een geheime rol in een open setting: de agent maakt zijn onderzoeksrol niet bekend, maar de politiecontext zelf is een open setting."},{"t":"3","q":"Wat wordt bedoeld met het verschil tussen een overte en een coverte onderzoekersrol?","o":["Overt betekent dat je in een open setting werkt, covert dat je in een gesloten setting werkt","Overt betekent dat het onderzoek kort duurt, covert dat het jaren duurt","Overt betekent dat je bekendmaakt dat je onderzoeker bent, covert dat je dit niet bekendmaakt","Overt betekent dat je enkel observeert, covert dat je ook deelneemt"],"a":2,"u":"De aard van de rol wordt gedefinieerd als overt of covert: bij een overte rol maak je bekend dat je onderzoeker bent, bij een coverte rol niet. Deze keuze wordt beinvloed door setting, context en de competenties van de onderzoeker."},{"t":"3","q":"Welke rol speelde de gatekeeper genaamd doc in de studie Street Corner Society?","o":["Een tweede onderzoeker die de veldnota's op accuraatheid controleerde","Een leidinggevende die het onderzoek probeerde te saboteren","Een respondent die enkel via diepteinterviews bevraagd werd","Een sleutelfiguur die de onderzoeker toegang gaf tot de anders gesloten gemeenschap"],"a":3,"u":"De onderzoeker bestudeerde een Italiaanse gemeenschap die gesloten was voor buitenstaanders. Hij vond een persoon (doc) die als gatekeeper fungeerde en hem toegang verschafte tot de hele gemeenschap."},{"t":"3","q":"Wat betekent data saturatie als criterium om te stoppen met veldwerk?","o":["Dat verdere observaties niets meer bijdragen aan het onderzoek","Dat de beschikbare middelen en tijd voor het onderzoek volledig opgebruikt zijn","Dat de onderzoeker ontmaskerd is en de setting gedwongen moet verlaten","Dat er voldoende respondenten aselect gesampled zijn uit de populatie"],"a":0,"u":"Data saturatie houdt in dat verdere observaties niets meer bijdragen. De bron merkt op dat je sneller saturatie bereikt naarmate je gerichter kijkt."},{"t":"3","q":"Waarom gaan mensen zich bij een zeer langdurige observatie doorgaans opnieuw normaal gedragen?","o":["Omdat ze de observator na lange tijd niet meer als observator opmerken","Omdat langdurig onderzoek verplicht met verborgen camera's werkt","Omdat de onderzoeker na verloop van tijd zijn rol altijd bekendmaakt","Omdat data saturatie hen automatisch minder alert maakt"],"a":0,"u":"Bij de duur van het onderzoek geldt dat mensen bij zeer langdurige observatie de onderzoeker niet meer als observator opmerken, waardoor ze zich niet langer anders gedragen."},{"t":"3","q":"Welke samplingbenadering past bij het bewust kiezen van situaties waar het antwoord op de onderzoeksvraag te vinden is, zoals de politie observeren bij geweld en arrestaties?","o":["Data saturatie","Purposive sampling","Aselecte steekproef van Vlaamse gemeenten","Random sampling"],"a":1,"u":"Purposive sampling betekent gericht situaties, contexten of settings kiezen waar een antwoord op de onderzoeksvraag gevonden zal worden, zoals de politie bekijken op momenten van geweld en arrestaties. Dit staat tegenover een random sample."},{"t":"4","q":"Wat is een focusgroep het best omschreven?","o":["Een reeks individuele diepte-interviews die achteraf samengevoegd worden","Een gestandaardiseerde enquete die klassikaal wordt afgenomen bij een grote groep","Een groepsinterview met meestal 6 tot 10 deelnemers, begeleid door een getrainde moderator rond een of meerdere topics","Een observatie van spontaan gedrag zonder tussenkomst van een onderzoeker"],"a":2,"u":"Een focusgroep is een groepsinterview met doorgaans 6 tot 10 deelnemers (max. ongeveer 12), waarbij een getrainde moderator het gesprek rond een of meerdere topics begeleidt. De data is wat de participanten zeggen."},{"t":"4","q":"Op welke basis worden deelnemers voor een focusgroep geselecteerd?","o":["Omdat ze elkaar al goed kennen en vlot samenwerken","Via een aselecte (random) steekproef uit de bevolking","Op basis van een zo groot mogelijke leeftijdsspreiding","Op basis van hun expertise en competenties met betrekking tot het onderwerp"],"a":3,"u":"Deelnemers worden gekozen via purposive sampling op basis van hun expertise en competenties, bijvoorbeeld koks die in een woonzorgcentrum werken. Er wordt uitdrukkelijk geen random sampling gebruikt."},{"t":"4","q":"Wat is een essentieel verschil tussen een gewoon interview en een focusgroep?","o":["Bij een interview leidt de moderator de groepsdynamiek, bij een focusgroep ligt de nadruk op een geinterviewde","Bij een focusgroep worden vooraf geen topics bepaald, bij een interview wel","Een interview duurt langer dan een focusgroep en levert altijd meer data op","Bij een interview ligt de nadruk op de geinterviewde, terwijl de moderator bij een focusgroep meer controle heeft en speelt met de interactie tussen deelnemers"],"a":3,"u":"Bij een klassiek interview ligt de nadruk op de geinterviewde. Bij een focusgroep heeft de moderator veel meer controle en stuurt hij of zij het groepsproces en de interactie tussen de deelnemers."},{"t":"4","q":"Waarom worden bij een focusgroep meestal geen leidinggevenden en uitvoerend personeel samen in dezelfde groep gezet?","o":["Omdat de moderator dan te veel controle verliest over de topiclijst","Omdat dat de duur van het gesprek te veel zou verlengen","Omdat leidinggevenden geen expertise hebben over het onderwerp","Omdat mensen dan hun echte opinie niet durven uiten door het statusverschil"],"a":3,"u":"Een focusgroep is een sociaal gebeuren dat een veilige sfeer vereist. Deelnemers hebben best min of meer dezelfde status, want een statusverschil verhindert dat mensen hun echte mening uiten."},{"t":"4","q":"In welke situatie is een focusgroep GEEN geschikte methode?","o":["Bij het begrijpen waarom mensen bepaalde zaken doen","Wanneer statistische en generaliseerbare resultaten verwacht worden","Bij het verdiepen van resultaten uit voorafgaand kwantitatief onderzoek","Bij de exploratie van topics die nog nauwelijks onderzocht werden"],"a":1,"u":"Focusgroepen zijn niet geschikt wanneer men statistische en generaliseerbare resultaten wil. Ze zijn ook minder geschikt voor attitudes (sociale wenselijkheid), levensverhalen en zeer gevoelige topics."},{"t":"4","q":"Wat wordt bedoeld met de collectieve activiteit als kenmerk van een focusgroep?","o":["Dat elke deelnemer individueel een vragenlijst invult die later wordt samengeteld","Dat de groepsdynamiek het genereren van ideeen stimuleert, waardoor het resultaat groter is dan bij vele losse interviews","Dat de moderator actief meediscussieert om de groep op gang te brengen","Dat de deelnemers samen een eindconclusie moeten formuleren waarover consensus bestaat"],"a":1,"u":"Als collectieve activiteit stimuleert de groepsdynamiek het genereren van ideeen. Door de interactie is het resultaat altijd groter dan bij vele individuele interviews samen."},{"t":"4","q":"Een vraag als 'Is de buurt veilig en aangenaam om te wonen?' is problematisch. Waarom?","o":["Ze is te specifiek en veronderstelt te veel voorkennis bij de deelnemers","Ze bevraagt twee items tegelijk, terwijl er per keer maar een item mag worden voorgelegd","Ze bevat een negatieve lading die de deelnemers ontmoedigt","Ze is te algemeen geformuleerd en hoort helemaal aan het einde van het gesprek"],"a":1,"u":"Vragen moeten goed opgesteld zijn met een item per keer. 'Veilig' en 'aangenaam' zijn twee aparte items, waardoor de vraag verkeerd geinterpreteerd kan worden."},{"t":"4","q":"Welk gedrag hoort bij de rol van de moderator tijdens een focusgroep?","o":["Actief meediscussieren om de eigen visie te toetsen bij de groep","Iedereen evenveel aandacht geven, dominante personen afremmen en stillere deelnemers beschermen zonder de eigen opinie te geven","Instemmend knikken om aan te geven welke meningen de juiste zijn","Streven naar consensus zodat de groep tot een gedeeld eindstandpunt komt"],"a":1,"u":"De moderator geeft geen persoonlijke opinie of beoordeling, neemt niet deel aan de discussie en geeft iedereen evenveel aandacht. Dominante personen worden afgeremd en stillere deelnemers beschermd, en consensus is geen doel."},{"t":"4","q":"Wat is een genoemd voordeel van een focusgroep tegenover individuele interviews?","o":["Deelnemers moeten getraind zijn in gespreksvoering vooraleer ze kunnen bijdragen","Er is veel informatie op relatief korte tijd, doordat deelnemers hun ervaringen en meningen actief met elkaar vergelijken","De moderator kan de attitudes van deelnemers foutloos meten zonder sociale wenselijkheid","Focusgroepen leveren altijd statistisch generaliseerbare resultaten op"],"a":1,"u":"Focusgroepen zijn goedkoop en snel te organiseren en leveren veel informatie op korte tijd, doordat deelnemers hun ervaringen en meningen actief vergelijken. Bovendien hoeven deelnemers geen specifieke vaardigheden te bezitten."},{"t":"4","q":"Wat houdt purposive sampling bij het samenstellen van een focusgroep in?","o":["Een aselecte trekking waarbij elke persoon evenveel kans maakt om deel te nemen","Het uitsluitend rekruteren van professionals via een betaalde vergoeding vooraf","Het toevoegen van zoveel mogelijk verschillende profielen om de spreiding te maximaliseren","Een doelgerichte selectie van wie kan bijdragen aan de discussie en het denk- en discussieproces"],"a":3,"u":"Purposive sampling is een doelgerichte selectie: men kiest deelnemers die kunnen bijdragen aan de discussie en aan het denk- en discussieproces. Er wordt uitdrukkelijk geen random sampling gebruikt."},{"t":"4","q":"Waarom stelt een onderzoeker vaak meerdere focusgroepen (bijvoorbeeld 3 a 4) samen rond eenzelfde onderwerp?","o":["Om per groep telkens een andere moderator te kunnen inzetten","Om saturatie te bereiken, het punt waarop nieuwe groepen geen nieuwe informatie meer opleveren","Omdat een moderator per gesprek maar twee deelnemers tegelijk aankan","Om statistisch significante en generaliseerbare cijfers te kunnen berekenen"],"a":1,"u":"Men organiseert best meerdere focusgroepen, met een suggestie van 3 a 4, om saturatie te bereiken. Saturatie treedt sneller op bij homogene groepen, zoals mantelzorgers die allemaal voor een bejaarde moeder zorgen."},{"t":"5","q":"Wat houdt een verbatim transcriptie in?","o":["Enkel de thema's samenvatten die uit het gesprek naar boven komen","Het gesprek herschrijven in opgekuiste, correcte spreektaal","Letterlijk uittypen wat er gezegd werd, zonder te selecteren of te vertalen","Alleen non-verbale geluiden en bewegingen noteren"],"a":2,"u":"Verbatim transcriptie betekent dat je letterlijk uittypt wat er gezegd werd. Een nadeel is wel dat je je enkel op het gesproken woord baseert."},{"t":"5","q":"Een respondent klopt tijdens het interview met de vuist op tafel om iets kracht bij te zetten. Onder welk soort taalgebruik valt dit dat bij een gewone verbatim transcriptie verloren gaat?","o":["Paralinguïstisch taalgebruik","Kinesisch taalgebruik","Tijd bij taalgebruik","Proxemisch taalgebruik"],"a":1,"u":"Kinesisch taalgebruik betreft houding en beweging tijdens een gesprek, zoals knikken of op tafel kloppen. Bij een verbatim transcriptie op basis van enkel het gesproken woord gaat dit verloren."},{"t":"5","q":"Wat is het verschil tussen proxemisch en paralinguïstisch taalgebruik?","o":["Proxemisch gaat over pauzes, paralinguïstisch over dialectgebruik","Proxemisch gaat over de snelheid van praten, paralinguïstisch over houding en beweging","Proxemisch gaat over volume en toonhoogte, paralinguïstisch over de afstand tussen sprekers","Proxemisch gaat over het gebruik van afstand tijdens een gesprek, paralinguïstisch over volume en toonhoogte"],"a":3,"u":"Proxemisch taalgebruik verwijst naar het gebruik van afstand tijdens een gesprek, terwijl paralinguïstisch taalgebruik zaken als volume en toonhoogte betreft."},{"t":"5","q":"Wat is het doel van de Jefferson-methode bij het transcriberen?","o":["Details van de interactie naar boven brengen en onderzoeken hoe wat gezegd werd het gesprek beïnvloedt","Alle interviews op exact dezelfde gestructureerde manier selectief transcriberen","Zo snel mogelijk enkel de inhoud van het gesprek uittypen","De taal opkuisen zodat het transcript vlot leesbaar wordt"],"a":0,"u":"De Jefferson-methode wil de details van de interactie naar boven brengen en onderzoeken hoe wat gezegd wordt het gesprek beïnvloedt. Daarbij worden ook alle non-verbale geluiden in de transcriptie opgenomen."},{"t":"5","q":"Waarom stelt de tekst dat volledige overeenstemming tussen opname en transcript utopisch is?","o":["Omdat een transcriptie geconstrueerd en selectief is en verschillende transcribenten dezelfde opname verschillend uittypen","Omdat respondenten tijdens het interview vaak dingen zeggen die ze later terugtrekken","Omdat de Jefferson-methode verplicht is en te veel detail toevoegt","Omdat de opname altijd technische fouten bevat die niet te herstellen zijn"],"a":0,"u":"Een transcriptie is geconstrueerd en selectief, waardoor ze nooit het échte interview volledig capteert. Bovendien produceren verschillende transcribenten van dezelfde opname verschillende transcripten."},{"t":"5","q":"Wat wordt in de tekst bedoeld met member checking als uitdaging bij transcriberen?","o":["Het opsplitsen van een focusgroeptranscript per persoon in kolommen","Het vergelijken van transcripten van twee verschillende transcribenten","Het laten controleren van de opnamekwaliteit door een technicus","Het valideren van bijvoorbeeld niet begrepen woorden door de deelnemers zelf"],"a":3,"u":"Member checking is het laten valideren door de deelnemers, in dit geval van woorden die de transcribent niet begreep. Zo krijg je zekerheid over de betekenis van dialect of insider-taal."},{"t":"5","q":"Waarom is thematische analyse volgens de tekst de meest toegankelijke vorm van kwalitatieve data-analyse, en wat is meteen de belangrijkste kritiek erop?","o":["Ze vereist geavanceerde software, maar die is duur en moeilijk aan te leren","Ze steunt volledig op de Jefferson-methode, wat te tijdrovend is","Ze is toegankelijk en heeft weinig regels, maar wordt bekritiseerd om haar methodologisch zwakke en theoretisch weinig gesofisticeerde basis","Ze levert altijd kwantitatieve beschrijvingen op, maar mist daardoor diepgang"],"a":2,"u":"Thematische analyse is de meest toegankelijke vorm van kwalitatieve analyse en kent weinig regels. De kritiek luidt dat ze een methodologisch zwakke en theoretisch weinig gesofisticeerde basis heeft, maar dat maakt ze nog geen niet-wetenschappelijk onderzoek."},{"t":"5","q":"Bij stap 3 van een thematische analyse worden codes als 'sla', 'hond' en 'courgette' samengebracht onder 'groenten' en 'dieren'. Wat gebeurt hier?","o":["De onderzoeker schrijft het eindrapport met illustratieve citaten","De onderzoeker groepeert codes in betekenisvolle categorieën waarbij het abstractieniveau toeneemt","De onderzoeker codeert de tekst lijn per lijn met initiële codes","De onderzoeker familiariseert zich voor het eerst met de data"],"a":1,"u":"In stap 3 gaat de onderzoeker via een analytische zoektocht naar patronen codes categoriseren in betekenisvolle groepen, waarbij het abstractieniveau toeneemt (bijvoorbeeld van 'sla' naar 'groenten')."},{"t":"5","q":"Een onderzoeker rapporteert: 'Van de 10 geïnterviewde weduwen misten er 8 hun partner.' Waarom past dit niet bij een thematische analyse?","o":["Omdat thematische analyse beschrijvend werkt en geen kwantitatieve tellingen mag bevatten","Omdat het aantal respondenten te klein is om een thema te vormen","Omdat de onderzoeker eerst de Jefferson-methode had moeten toepassen","Omdat citaten altijd letterlijk moeten worden overgenomen"],"a":0,"u":"Thematische analyse is primair een beschrijvende benadering die weergeeft wat in de data voorkomt, zonder kwantitatieve beschrijvingen zoals aantallen of verhoudingen."},{"t":"5","q":"Volgens de tekst deelt thematische analyse kenmerken met grounded theory en content analyse. Hoe worden die twee kort getypeerd?","o":["Grounded theory labelt, content analyse beschrijft","Grounded theory beschrijft, content analyse labelt","Beide zijn louter kwantitatieve tel-methoden","Beide richten zich uitsluitend op non-verbale geluiden"],"a":0,"u":"In de tekst wordt grounded theory omschreven als labelen en content analyse als beschrijven, bijvoorbeeld het beschrijven van woorden of thema's in krantenartikelen."},{"t":"5","q":"Waarom is transparantie noodzakelijk bij een thematische analyse?","o":["Om te bewijzen dat er geen theorie werd gebruikt bij het interviewen","Om aan te tonen dat er meer respondenten waren dan bij ander onderzoek","Om duidelijk te maken hoe de thema's tot stand zijn gekomen, over alle bronnen heen","Om de opname vlot leesbaar te maken voor buitenstaanders"],"a":2,"u":"Transparantie is nodig om te tonen hoe de thema's tot stand zijn gekomen en dat ze over alle bronnen heen gelden. Zo blijft de analyse navolgbaar en verantwoord."},{"t":"6","q":"Wat is het centrale doel van grounded theory als analysebenadering?","o":["Het aantal woorden in een tekst tellen om patronen bloot te leggen","Bestaande hypotheses toetsen met een vaste, herbruikbare procedure","Een allesomvattende grand theory ontwerpen los van de data","Theorieontwikkeling op basis van empirisch verzamelde kwalitatieve data"],"a":3,"u":"Grounded theory is een rigoureuze benadering gericht op theorieontwikkeling (middle range theorieen) die ontstaat uit en aansluit bij empirisch verzamelde data."},{"t":"6","q":"Waar verwijzen de twee delen van de term 'grounded theory' naar?","o":["'Grounded' naar de empirische basis en 'theory' als reactie op speculatieve grand theories","'Grounded' naar de onderzoeker en 'theory' naar de respondent","'Grounded' naar codering en 'theory' naar de onderzoeksvraag","'Grounded' naar kwantificering en 'theory' naar statistiek"],"a":0,"u":"De term ontstond als antwoord op de eis tot meer strengheid: 'grounded' verwijst naar de empirische basis en 'theory' vormt een reactie op speculatieve grand theories."},{"t":"6","q":"Wat houdt 'theoretische sampling' binnen grounded theory in?","o":["De steekproef wordt bepaald door statistische representativiteit","De zich ontwikkelende theorie bepaalt welke data in een volgende fase verzameld worden","Alle databronnen worden uit een enkel type document gehaald","Een grote, aselecte steekproef wordt vooraf volledig vastgelegd"],"a":1,"u":"Bij theoretische sampling stuurt de theorieontwikkeling de dataverzameling: op basis van wat de theorie nodig heeft, wordt gericht en met een kleine n nieuwe data gezocht om ideeen te definieren of te falsifieren."},{"t":"6","q":"Welke coderingsstap draait vooral om het aan elkaar relateren van codes en het identificeren van sleutelconcepten?","o":["Open coderen","Selectief coderen","Axiaal coderen","Content analyse"],"a":2,"u":"Axiaal coderen relateert codes aan elkaar, verloopt zowel inductief als deductief en identificeert de sleutelconcepten, terwijl open coderen dicht bij de data blijft en selectief coderen hoofd- en subthema's bepaalt."},{"t":"6","q":"Wat betekent 'saturatie' in het analyseproces van grounded theory?","o":["Uit nieuwe data komt niets nieuws meer en er ontstaan geen nieuwe categorieen","De data zijn statistisch significant geworden","De literatuur bevestigt volledig de gevonden resultaten","Er is een vooraf bepaald aantal interviews afgenomen"],"a":0,"u":"Saturatie wil zeggen dat de constante vergelijking geen nieuwe informatie of categorieen meer oplevert; de metafoor is een Google-zoekopdracht waarbij je na enkele bronnen al weet wat je moet weten."},{"t":"6","q":"Hoe verschilt de omgang met categorieen in grounded theory van datareductie via factoranalyse in kwantitatief onderzoek?","o":["Grounded theory laat alles vallen wat niet correleert, net als factoranalyse","Beide streven naar zo weinig mogelijk categorieen","Grounded theory categoriseert maximaal met exclusieve en exhaustieve categorieen, zonder afbreuk te doen aan de data","Grounded theory gebruikt uitsluitend correlaties om categorieen te vormen"],"a":2,"u":"Waar factoranalyse aan datareductie doet en laat vallen wat niet correleert, includeert grounded theory zo maximaal mogelijk in exclusieve en exhaustieve categorieen zonder afbreuk te doen aan de data."},{"t":"6","q":"Welke stelling geeft correct een verschil weer tussen de posities van Glaser en Strauss na hun divergentie in 1990?","o":["Glaser vertrekt altijd vanuit een bepaald idee, Strauss van een blanco blad","Glaser haalt credibiliteit uit rigoureuze methode, Strauss uit de basis in de data","Glaser gaat uit van een 'empty mind' waarbij de theorie in de data zit, Strauss vertrekt vanuit een bepaald idee en interpreteert de theorie","Glaser ziet de onderzoeker als actief, Strauss als passief gedisciplineerd"],"a":2,"u":"Volgens Glaser zit de theorie in de data ('empty mind', passief gedisciplineerde onderzoeker, credibiliteit door basis in data), terwijl Strauss vertrekt vanuit een idee, de theorie interpreteert en credibiliteit haalt uit rigoureuze methode."},{"t":"6","q":"Wat is volgens de slotbemerkingen NIET wat grounded theory is?","o":["Het presenteren van rauwe data en het tellen van woorden","Een aanpak met duidelijkere focus op theorieontwikkeling dan thematische analyse","Een arbeids- en tijdsintensief, grondig analytisch proces","Een alternatief voor hypothesetesten dat op data gebaseerd is"],"a":0,"u":"Grounded theory is uitdrukkelijk niet het presenteren van rauwe data, theorietesten, content analyse of woorden tellen; het is een arbeidsintensief, theorievormend proces gebaseerd op de data."},{"t":"6","q":"Hoe wordt in de oorspronkelijke grounded theory validiteit nagestreefd?","o":["Door een vooraf herbruikbaar catalogeersysteem toe te passen","Door de theorie enkel aan bestaande literatuur te toetsen","Door statistische significantietoetsen op de gecodeerde data","Door member validation, waarbij bevindingen bij de betrokkenen zelf worden afgetoetst"],"a":3,"u":"Bij het ontstaan van grounded theory werd validiteit bereikt via member validation: de data leiden tot theorie die vervolgens bij de betrokkenen wordt getoetst."},{"t":"6","q":"Wat kenmerkt de verhouding tussen inductie en deductie in grounded theory?","o":["Inductie primeert boven deductie: concepten en ideeen komen uit de data","Inductie en deductie spelen geen rol, enkel beschrijving telt","Deductie primeert, want hypotheses worden vanaf het begin getest","Enkel deductie wordt gebruikt om een grand theory af te leiden"],"a":0,"u":"In grounded theory primeert het inductieve proces boven het deductieve: concepten en ideeen komen uit de data, en het testen van hypotheses gebeurt pas in de laatste fasen."},{"t":"7","q":"Wat is volgens Potter & Wetherell de kern van discoursanalyse?","o":["Het samenvatten van interviews tot een neutraal overzicht van meningen","Het meten van hoe lang iemand aan het woord is en welke woorden voorkomen","Het tellen van de frequentie van kernwoorden in een tekstcorpus","De studie van hoe spraak en teksten worden ingezet om handelingen te verrichten"],"a":3,"u":"Discoursanalyse wordt omschreven als de studie van hoe talk en texts worden gebruikt om acties te verrichten. Het gaat dus niet om zuiver linguistisch tellen, maar om wat taal doet."},{"t":"7","q":"Waarom wordt een zuiver linguistische analyse in de sociaal constructionistische discoursanalyse als te beperkt gezien?","o":["Omdat linguistiek te veel op grammatica en te weinig op woordenschat let","Omdat de analyse de taal en de losse woorden overstijgt en de sociale interactie meeneemt","Omdat interviews nooit als bruikbare data mogen dienen","Omdat alleen geschreven bronnen mogen worden bestudeerd"],"a":1,"u":"De benadering focust op taal maar overstijgt die: niet enkel hoe lang iemand spreekt of welke woorden vallen, maar wat taal teweegbrengt in de sociale interactie waaruit het discours ontstaat."},{"t":"7","q":"De uiting 'Ik beloof dat ik dat zal doen' illustreert vooral welk kernconcept over taal?","o":["Taal doet iets en is actiegeoriënteerd in plaats van enkel beschrijvend","Taal is altijd contextloos en universeel te interpreteren","Taal is een neutraal doorgeefluik van objectieve feiten","Taal is louter beschrijvend, zoals bij 'Op de parking staat een rode auto'"],"a":0,"u":"Wittgenstein kwam tot het inzicht dat er ook niet-beschrijvende taal bestaat. Een belofte beschrijft niets maar verricht een handeling, wat het actiegeoriënteerde karakter van taal toont."},{"t":"7","q":"In het Milgram-experiment werden zinnen als 'The experiment requires that you continue' gebruikt. Welk kenmerk van taal illustreert dit vooral?","o":["Dat concepten uit de cognitieve psychologie vaststaand zijn","De retorische, situatiegevoelige kracht waarmee taal een bepaalde uitkomst stuurt","Het footing- of eigenaarschapsverschil tussen ik en wij","Dat taal een louter beschrijvende functie heeft"],"a":1,"u":"De opklimmende zinnen zijn een voorbeeld van retoriek onder het kenmerk dat taal context- en situatiegevoelig is: de formulering stuurt de reactie van de proefpersoon."},{"t":"7","q":"Het verschil tussen 'we wisten dat niet' en 'ons is dat niet verteld' is in de discoursanalyse een voorbeeld van:","o":["Een deviante case die de interpretatie ondermijnt","Eigenaarschap of footing dat de betekenis van de uiting verschuift","Een zuiver grammaticale correctie zonder betekenisgevolg","Een cirkelredenering binnen de analyse"],"a":1,"u":"Footing verwijst naar eigenaarschapsverschillen zoals ik, we, ons en zij. Wisselen tussen deze posities verandert de verantwoordelijkheid en dus de betekenis van de uiting."},{"t":"7","q":"Waarom worden concepten als motieven, geheugen en attitude in deze benadering niet als vaststaand gezien?","o":["Omdat ze biologisch bepaald zijn en niet in taal voorkomen","Omdat ze pas op macroniveau door instituten worden opgelegd","Omdat ze in interactie en coproductie worden geconstrueerd, zoals bij het belang van Facebook-likes","Omdat ze enkel in gesloten vragenlijsten meetbaar zijn"],"a":2,"u":"Taal is een sociaal construct: iets krijgt betekenis in interactie en coproductie. Concepten uit de cognitieve psychologie staan niet vast maar worden geconstrueerd, zoals likes die belangrijker worden als vrienden dat vinden."},{"t":"7","q":"Wat houdt 'coderen' in bij een sociaal constructionistische discoursanalyse?","o":["Tekststukken groeperen omdat er iets gebeurt, zonder een samenvattend label te plakken","Een codeboek vooraf vastleggen en de tekst daaraan afvinken","De frequentie van codes statistisch toetsen aan een hypothese","Elk fragment een samenvattend label geven dat de inhoud kort weergeeft"],"a":0,"u":"Coderen wordt hier beschreven als het bouwen van een verzameling: geen samenvattend label, maar tekststukken groeperen omdat er iets gebeurt in de interactie."},{"t":"7","q":"Wat is een typisch valkuil of slotbemerking bij een zwak uitgevoerde sociaal constructionistische discoursanalyse?","o":["Te veel objectiviteit doordat de onderzoeker geen enkel standpunt inneemt","Overmatig gebruik van uitsluitend zeer rijke, betekenisvolle fragmenten","Het volledig weglaten van tekstillustraties bij de validatie","Cirkelredeneringen waarbij tekstfragmenten via ideologie diezelfde fragmenten verklaren"],"a":3,"u":"Bij de slotbemerkingen wordt cirkelredenering genoemd: tekstfragmenten leiden tot een ideologie die vervolgens weer diezelfde tekstfragmenten verklaart. Dat is een zwakte van de analyse."},{"t":"7","q":"Waarom wordt aan beginnende onderzoekers vaak replicatieonderzoek aangeraden voor discoursanalyse?","o":["Omdat discoursanalyse geen transcriptie of opname vereist","Omdat replicatie sneller resultaat oplevert dan tijdsintensieve analyse","Omdat replicatie de enige toegestane vorm van discoursanalyse is","Omdat je eigenlijk al ervaren moet zijn voordat je een discoursanalyse zelfstandig uitvoert"],"a":3,"u":"Discoursanalyse is reeds een high-level analyse waarvoor je eigenlijk al ervaren moet zijn. Voor beginnende onderzoekers is het daarom vaak interessant om eerst replicatieonderzoek te doen."},{"t":"7","q":"Hoe verschilt Foucauldiaanse discoursanalyse van die van Potter & Wetherell?","o":["Ze verwerpt interviews en media-output als bruikbaar materiaal","Ze werkt op microniveau dicht bij het materiaal en is apolitiek","Ze is strikt linguistisch en negeert macht en maatschappij","Ze is politiek en werkt op macroniveau rond macht, onderdrukking en ongelijkheid"],"a":3,"u":"Potter & Wetherell werken academisch en radicaal op microniveau. De Foucauldiaanse variant is politiek, situeert zich op macroniveau en gebruikt begrippen als onderdrukking, macht, weerstand en ongelijkheid."},{"t":"7","q":"Wat wordt in de Foucauldiaanse benadering bedoeld met de stelling dat macht 'productief' is?","o":["Dat macht mee vormgeeft en aanzet tot handelen, zoals reclame die aanzet tot het kopen van Camel-sigaretten","Dat macht altijd direct en expliciet zichtbaar is in de tekst","Dat macht uitsluitend bij overheden en niet in interactie ligt","Dat macht enkel onderdrukt en handelingen tegenhoudt"],"a":0,"u":"Macht werkt binnen interactie en is productief: ze zet bijvoorbeeld aan tot het kopen van Camel-sigaretten. Macht deelt mensen in, bepaalt identiteit en positie en is gesitueerd binnen de tijd."},{"t":"7","q":"Waarom is 'war on drugs' volgens een Foucauldiaanse analyse een sociaal construct?","o":["Omdat het beleidsbeslissingen legitimeert en individuen tegenover elkaar positioneert als burger, gebruiker, dealer of politieagent","Omdat het uitsluitend op microniveau tussen twee sprekers speelt","Omdat het een zuiver medische diagnose is zonder maatschappelijke lading","Omdat drugs objectief gevaarlijker zijn dan in de Victoriaanse tijd"],"a":0,"u":"War on drugs legitimeert beleid en de uitvoering ervan en positioneert mensen ten opzichte van elkaar. Kritisch bekeken gebruiken de meeste gebruikers probleemloos en was opium ooit legaal, wat het construct blootlegt."},{"t":"7","q":"In History of madness stelt Foucault dat 'madness' (waanzin) vooral:","o":["Enkel op microniveau in gesprekken zichtbaar wordt","Een sociaal construct is waarmee via wetenschappelijke kennis macht wordt uitgeoefend","Een universele, biologisch vaststaande categorie is","Een neutraal medisch begrip is dat objectief werd verbeterd"],"a":1,"u":"Volgens Foucault is waanzin geen bestaande, universele categorie maar een sociaal construct. Wetenschappelijke kennis wordt ingezet om subjecten te objectiveren en zo macht te winnen."},{"t":"8","q":"Wat is de kern van de klassieke (Husserliaanse) fenomenologie?","o":["Betekenis toekennen aan ervaringen binnen een historische en culturele context","Gedragingen verklaren vanuit psychologische theorieën en verklaringsmodellen","Statistische patronen in surveydata zoeken en interpreteren","Participanten helpen om hun ervaring in zoveel mogelijk detail te beschrijven, zonder interpretaties of reflecties"],"a":3,"u":"Klassieke fenomenologie ondersteunt participanten om hun ervaringen zo gedetailleerd mogelijk te beschrijven, met een open geest en zonder voorafgaandelijke assumpties, interpretaties of reflecties."},{"t":"8","q":"Wat wordt in de fenomenologie bedoeld met de 'real world'?","o":["De som van alle sociale interacties tussen individuen","De wereld zoals ze door het bewustzijn cognitief verwerkt wordt","De wereld zoals die door taal volledig te vatten is","De objectieve wereld die niet rechtstreeks te kennen is, enkel via de subjectieve beschrijving van bewuste ervaring"],"a":3,"u":"De real world is niet rechtstreeks te kennen; ze is enkel te benaderen via de subjectieve wereld, door de bewuste ervaring van fenomenen te beschrijven. De life world is hoe mensen de omgeving ervaren."},{"t":"8","q":"Wat houdt 'bracketing' in binnen fenomenologisch onderzoek?","o":["De interpretatie van de onderzochte opnieuw interpreteren","Het loslaten van gedachten, overtuigingen, vooroordelen en theorieën om de ervaring zuiver te analyseren","Ervaringen in vaste categorieën onderbrengen voor kwantitatieve analyse","Enkel geïnterviewden selecteren die homogeen zijn qua achtergrond"],"a":1,"u":"Bracketing is het zuiver analyseren van de ervaring van het individu, waarbij zowel onderzoeker als onderzochte gedachten, overtuigingen, voorafnames, vooroordelen, opinies en theorieën loslaten. Dit is nooit 100% mogelijk, waarvoor epoché de oplossing is."},{"t":"8","q":"Waarom wordt het begrip 'epoché' geïntroduceerd naast bracketing?","o":["Omdat epoché de ervaring verklaart in plaats van beschrijft","Omdat bracketing enkel bij de onderzoeker en niet bij de onderzochte geldt","Omdat alle veronderstellingen en voorafnames volledig loslaten nooit 100% mogelijk is","Omdat epoché de sociale context van de deelnemer meeneemt"],"a":2,"u":"Bracketing is nooit volledig mogelijk; epoché erkent dat je de ervaring van een ander nooit 100% kan aanvoelen en dat je niet alle veronderstellingen kan loslaten. De nadruk blijft op beschrijven in plaats van verklaren."},{"t":"8","q":"Wat is het belangrijkste verschil tussen klassieke en interpretatieve fenomenologie?","o":["Klassieke fenomenologie gebruikt interviews, interpretatieve fenomenologie gebruikt surveys","Klassieke fenomenologie is arbeidsintensiever dan interpretatieve fenomenologie","Klassieke fenomenologie laat participanten hun ervaring beschrijven, interpretatieve fenomenologie helpt hen betekenis te geven aan die ervaring","Klassieke fenomenologie werkt deductief, interpretatieve fenomenologie werkt met vaste hypothesen"],"a":2,"u":"Bij klassieke fenomenologie beschrijven participanten hun ervaringen zonder gedachten of reflecties, terwijl interpretatieve fenomenologie participanten ondersteunt om betekenis te geven aan hun ervaringen, waarbij de persoon expert is in zijn eigen ervaring."},{"t":"8","q":"Wat betekent 'dubbele hermeneutiek' in de context van IPA?","o":["De onderzoeker interpreteert de interpretatie die de onderzochte van zijn eigen ervaring maakt","De deelnemer wordt tweemaal geïnterviewd over hetzelfde fenomeen","De data worden zowel kwalitatief als kwantitatief geanalyseerd","Twee onderzoekers analyseren onafhankelijk dezelfde transcriptie"],"a":0,"u":"Hermeneutiek zoekt naar de verborgen betekenis binnen historische, culturele en sociale context. De dubbele hermeneutiek verwijst ernaar dat de onderzoeker de interpretatie van de onderzochte interpreteert."},{"t":"8","q":"Een onderzoeker plant een IPA-studie. Welke aanpak past het best bij de methode?","o":["Een kleine, homogene sample met semidiepte-interviews, waarbij eerst vertrouwen wordt opgebouwd","Intensief probing gebruiken vanaf de eerste minuut van het interview","Een grote, heterogene sample verzamelen om generaliseerbaarheid te verhogen","Een strikte interviewleidraad volgen die niet afwijkt van de vragenlijst"],"a":0,"u":"IPA is arbeidsintensief, dus de sample is klein en homogeen. Men bouwt eerst vertrouwen op voor het hoofdthema wordt aangesneden, is zuinig met probing en volgt een niet stringente leidraad die de geïnterviewde volgt."},{"t":"8","q":"Welke stelling over de rol van taal in de fenomenologische analyse klopt?","o":["Taal moet door de onderzoeker gecorrigeerd worden bij foutief gebruik","Taal is de eigenlijke focus van de analyse en wordt woord voor woord bestudeerd","Taal is een middel om ervaringen te verduidelijken, maar de analyse richt zich op wat achter de taal zit","Taal geeft de ervaring 100% correct en volledig weer"],"a":2,"u":"Taal is de expressie van lived experiences en een medium om ervaringen te verduidelijken, maar het is slechts een benadering van de werkelijke beleving. De analyse focust niet op de taal zelf maar op wat erachter zit."},{"t":"9","q":"Wat is de kern van een 'narratief' zoals bedoeld in de narratieve analyse?","o":["Een statistische samenvatting van gedragspatronen binnen een groep","Een neutrale opsomming van gebeurtenissen zonder onderliggende betekenis","Wat een individu over zichzelf vertelt, waarmee mensen hun identiteit construeren","Een objectieve, feitelijke reconstructie van wat een persoon werkelijk is overkomen"],"a":2,"u":"Een narratief is wat een individu over zichzelf vertelt. Door verhalen te vertellen construeren mensen hun identiteit en brengen ze orde in wanorde en betekenis aan."},{"t":"9","q":"Welke eigenschap van een narratief verwijst naar de 'plot' die zorgt voor samenhang in het levensverhaal?","o":["Emplotment","Familiarisatie","Transcriptie","Intersubjectiviteit"],"a":0,"u":"Emplotment is de plot die voor coherentie in het levensverhaal zorgt. Het maakt dat een verhaal coherent is en dat er linken te vinden zijn tussen de verschillende delen die verteld worden."},{"t":"9","q":"Vanuit het sociaal constructionisme, dat aan de narratieve analyse ten grondslag ligt, geldt dat identiteit:","o":["als een objectief meetbaar kenmerk bestaat","volledig door biologische factoren wordt bepaald","een aangeboren en onveranderlijk gegeven is","niet als object bestaat, maar wordt geconstrueerd"],"a":3,"u":"Volgens het sociaal constructionisme bestaat identiteit niet als een object, maar wordt ze geconstrueerd. De constructie van het narratief hangt af van verteller, toehoorder, sociale context en sociale interactie."},{"t":"9","q":"Een onderzoeker gebruikt de McAdams-methode. Welke instructie past bij deze aanpak?","o":["Vat het leven samen in een doorlopend verhaal zonder onderverdeling","Verdeel het leven in hoofdstukken, met een maximum van acht, en benoem elk hoofdstuk","Analyseer enkel de laatste week uit het leven van de geinterviewde","Registreer uitsluitend non-verbale signalen tijdens het gesprek"],"a":1,"u":"Bij de McAdams-methode verdeelt de geinterviewde het leven in hoofdstukken (maximaal 8), benoemt en licht elk hoofdstuk toe, en identificeert de drie belangrijkste hoofdstukken. Het is een tijds- en arbeidsintensieve leidraad."},{"t":"9","q":"Wat wordt bedoeld met het identificeren van de 'narratieve toon' bij een narratieve analyse?","o":["De inhoud en de manier waarop iets gezegd wordt, inclusief de gebruikte beeldspraak en waar die vandaan komt","Het bepalen van de politieke orientatie van de verteller","Het tellen van hoe vaak bepaalde woorden voorkomen","Het meten van de spreeksnelheid en toonhoogte in decibel"],"a":0,"u":"De narratieve toon betreft de inhoud en de manier waarop iets gezegd wordt, de gebruikte beeldspraak en waar die beeldspraak vandaan komt. Het gaat dus verder dan enkel de letterlijke inhoud."},{"t":"9","q":"Wat is het onderwerp van een conversatie-analyse?","o":["De studie van natuurlijke conversaties met aandacht voor de constructie van wendingen, problemen en probleemhantering en non-verbale communicatie","De invloed van maatschappelijke machtsstructuren op taalgebruik","De onderliggende motivaties en attitudes achter een gesprek","Het opstellen van een samenvatting van diverse levensverhalen"],"a":0,"u":"Conversatie-analyse is de studie van natuurlijke conversaties, met specifieke aandacht voor de constructie van delen van de conversatie (wendingen), problemen en probleemhantering en non-verbale communicatie."},{"t":"9","q":"Welke aanname hoort bij de conversatie-analyse?","o":["De onderzoeker focust op wat er gebeurt en niet op wat er gezegd wordt, want gesprekken zijn actie","De onderzoeker vult het gesprek aan met interpretaties van de verteller","De onderzoeker zoekt naar de diepere betekenis, zoals motivaties en attitudes","De onderzoeker analyseert vooral de onderliggende sociale structuren, cultuur en macht"],"a":0,"u":"In de conversatie-analyse geldt dat gesprekken actie zijn, waardoor de onderzoeker focust op wat er gebeurt en niet op wat er gezegd wordt. Er is geen zoektocht naar diepere betekenis of naar sociale structuren, cultuur en macht."},{"t":"9","q":"Een student wil data verzamelen voor een conversatie-analyse. Welke keuze sluit het best aan bij de methode?","o":["Natuurlijke conversaties zoals telefoongesprekken, getranscribeerd volgens de Jefferson-methode","Een levensverhaal-interview volgens de McAdams-leidraad","Een schriftelijke autobiografie die de deelnemer thuis heeft geschreven","Een gestructureerd interview waarin de onderzoeker sterk sturend optreedt"],"a":0,"u":"Conversatie-analyse werkt met natuurlijke conversaties zoals telefoongesprekken; een interview is in principe niet van toepassing. Voor de transcriptie gaat de voorkeur uit naar de Jefferson-methode."},{"t":"10","q":"Wat wordt in de brontekst gezien als een fout uitgangspunt over de doelstelling van kwalitatief onderzoek?","o":["Dat de doelstelling is om rijke data te verzamelen","Dat de doelstelling is om concepten te synthetiseren","Dat de doelstelling is om reflexief te werken","Dat de doelstelling van kwalitatief onderzoek is om te generaliseren"],"a":3,"u":"De brontekst benoemt expliciet als foute stelling dat de doelstelling van kwalitatief onderzoek zou zijn om te generaliseren. Kwalitatief onderzoek streeft veeleer naar contextgevoelig begrip dan naar generalisatie."},{"t":"10","q":"Wat houdt reflexiviteit van de onderzoeker in een goed kwalitatief rapport in?","o":["Het statistisch controleren van meetfouten in de dataset","Rapporteren hoe de onderzoeker zelf staat tegenover de onderzochte mensen en het onderzoek, inclusief aannames en stereotypes","Het laten spreken van de data voor zichzelf zonder interpretatie","Het herhalen van het onderzoek in een andere context"],"a":1,"u":"Reflexiviteit betekent dat de onderzoeker zijn eigen positie, aannames, stereotypes en betrokkenheid ten opzichte van de deelnemers en het onderzoek benoemt, om confirmation bias te vermijden."},{"t":"10","q":"Wat is volgens de brontekst een kenmerk van een coherent en intellectueel overtuigend argument in kwalitatief onderzoek?","o":["De data die voor zichzelf spreken zonder verdere interpretatie","Een doordacht rationeel verhaal (storyline) dat via literatuur, data en analyse naar een conclusie leidt","Een zo groot mogelijk aantal quotes zonder verbindende commentaar","Een emotioneel appel dat de betrokkenheid van de onderzoeker toont"],"a":1,"u":"Een sterk argument is coherent en intellectueel (niet emotioneel) overtuigend: een storyline met logische argumentatie van literatuur naar data naar analyse naar conclusie. Toewijding mag aanwezig zijn maar blijft onzichtbaar in de argumentatie."},{"t":"10","q":"Wat is data-triangulatie als kwaliteitstool in kwalitatief onderzoek?","o":["De data door drie onafhankelijke codeurs laten coderen","Verschillende dataverzamelingsmethodes gebruiken die tot dezelfde resultaten leiden","Data verzamelen op drie verschillende tijdstippen bij dezelfde groep","Dezelfde vraag driemaal aan dezelfde persoon stellen om consistentie te toetsen"],"a":1,"u":"Data-triangulatie, een soort mixed methods, combineert verschillende dataverzamelingsmethodes (zoals focusgroep, interview en observatie) om na te gaan of ze dezelfde resultaten opleveren."},{"t":"10","q":"Bij welke techniek gaat de onderzoeker na of zijn interpretatie van de gegevens correct is door dit aan de deelnemers voor te leggen?","o":["Het incorporeren van afwijkende cases","Coherentie met vorige studies","Member check of respondent validering","Data-triangulatie"],"a":2,"u":"Bij member check of respondent validering legt de onderzoeker de interpretatie terug voor aan de deelnemers om na te gaan of ze correct is, op micro- of macroniveau."},{"t":"10","q":"Waarom worden afwijkende cases (outliers) in kwalitatief onderzoek anders behandeld dan in kwantitatief onderzoek?","o":["Ze worden apart gerapporteerd maar niet in de analyse opgenomen","Ze worden verwijderd om de gemiddelden niet te vertekenen","Ze worden geincorporeerd, omdat een concept ook beschreven wordt door te tonen wat het niet is","Ze worden statistisch gewogen zodat hun invloed daalt"],"a":2,"u":"In tegenstelling tot kwantitatief onderzoek worden outliers in kwalitatief onderzoek juist geincorporeerd. Zo kan een concept ook beschreven worden door aan te geven wat het niet is."},{"t":"10","q":"Welke nadruk legt de Verklaring van Helsinki (1964) volgens de brontekst?","o":["Informed consent, welzijn van proefpersonen, rechtvaardige selectie, minimale risico's en onafhankelijke ethische beoordeling","Het scheiden van ID-gegevens en data op beveiligde servers","Het gebruik van implied consent bij vragenlijstonderzoek","Verplichte publicatie van alle onderzoeksresultaten in open access"],"a":0,"u":"De brontekst noemt als nadruk van de Declaration of Helsinki: informed consent, welzijn van proefpersonen, rechtvaardige selectie, minimale risico's en een onafhankelijke ethische beoordeling van het onderzoek."},{"t":"10","q":"Een onderzoeker verandert bewust een aantal meetwaarden in de dataset zodat het resultaat beter aansluit bij de hypothese. Welke vorm van research misconduct is dit?","o":["Plagiëren","Fabriceren","Conflict of interest","Falsifiëren"],"a":3,"u":"Falsifiëren is het manipuleren van data door ze te veranderen, weg te laten of aan te passen. Fabriceren is resultaten volledig verzinnen en plagiëren is werk overnemen zonder bronvermelding."},{"t":"10","q":"Wat is volgens de brontekst het verschil tussen anonimiteit en confidentialiteit?","o":["Anonimiteit geldt enkel bij kwantitatief onderzoek en confidentialiteit enkel bij kwalitatief onderzoek","Bij anonimiteit worden de data vernietigd, bij confidentialiteit worden ze bewaard","Confidentialiteit betekent dat er geen informed consent nodig is, anonimiteit wel","Bij anonimiteit kent de onderzoeker de identiteit van de deelnemer niet, terwijl bij confidentialiteit de identiteit wel gekend is maar strikt databeheer geldt"],"a":3,"u":"Bij anonimiteit bevraagt de onderzoeker de identiteit van de deelnemer niet, bijvoorbeeld bij een vragenlijst. Bij confidentialiteit kent de onderzoeker de ident
