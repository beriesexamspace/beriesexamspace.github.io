iteit wel, bijvoorbeeld bij een interview, en gelden specifieke eisen voor databeheer."},{"t":"10","q":"Wat is de kern van een informed consent zoals beschreven in de brontekst?","o":["Een document dat enkel de verwerkingstermijn van de data vastlegt","Een toestemming die impliciet verondersteld wordt zodra iemand een vragenlijst opent","Een contract tussen onderzoeker en deelnemer met alle informatie die nodig is om onderbouwd te beslissen over deelname","Een verklaring die de onderzoeker achteraf ondertekent na afloop van het onderzoek"],"a":2,"u":"Informed consent is een contract tussen onderzoeker en participant dat alle informatie over de studie bevat die de deelnemer nodig heeft om een onderbouwde beslissing te nemen over deelname."},{"t":"10","q":"Waarom is klassieke betrouwbaarheid, zoals ingevuld in kwantitatief onderzoek, volgens de brontekst weinig relevant in kwalitatief onderzoek?","o":["Omdat betrouwbaarheid in kwalitatief onderzoek door member check volledig gegarandeerd is","Omdat de werkelijkheid geconstrueerd wordt en het onderzoek contextgevoelig is","Omdat kwalitatieve steekproeven altijd te klein zijn voor herhaalmetingen","Omdat kwalitatief onderzoek geen data verzamelt maar enkel theorie ontwikkelt"],"a":1,"u":"In kwalitatief onderzoek is er weinig animo voor betrouwbaarheid zoals in kwantitatief onderzoek, omdat de werkelijkheid geconstrueerd wordt (bijvoorbeeld getuigeninterviews worden minder betrouwbaar naarmate de tijd vordert) en omwille van de contextgevoeligheid."}],"theory":[{"h":"Wat is kwalitatief onderzoek?","items":["Kwalitatief onderzoek: onderzoek gericht op het begrijpen van complexe fenomenen en individuele perspectieven zonder harde cijfers of statistiek.","Kwantitatief onderzoek: onderzoek gericht op het verzamelen van harde cijfers, meten en generaliseren via statistiek.","Positivisme: natuurwetenschappelijke benadering die universele wetten zoekt via experiment, meten en reductionisme.","Kwantitatief imperatief: opvatting dat wetenschap meten betekent, waardoor niet-metende methodes als pre-wetenschappelijk gelden.","Nomothetisch: gericht op algemene, wetgevende regels; hoort bij de kwantitatieve pool.","Idiografisch: gericht op het individu als individu; hoort bij de kwalitatieve pool.","Wetenschap als sociaal construct: visie dat mensen de echte wereld nooit direct zien en collectief en sociaal kennis vormen.","Saturatie: het punt waarop nieuwe data niets nieuws meer opleveren, sneller bereikt in homogene groepen.","Rejection of positivism: kwalitatief onderzoek verwerpt de gedachte dat enkel meetbare, universele wetten wetenschappelijk zijn.","Emerging theory: kwalitatief onderzoek ontdekt theorie en concepten, terwijl kwantitatief onderzoek theorie confirmeert.","Povee en Roberts (2014): studie die concludeert dat de methodologie op basis van de onderzoeksvraag gekozen moet worden.","Co-existentie (Josselson, 2014): kwalitatief en kwantitatief onderzoek zijn geen echte paradigmawissel maar bestaan naast elkaar.","Grounded theory: methode van Glaser en Strauss waarbij theorie uit de data groeit.","Introspectie (Wundt, 1879): exploratie van gevoelens, observaties en interpretaties, met een draaiboek om biases te vermijden."]},{"h":"Kwalitatief interviewen","items":["Kwalitatief interview: gesprek dat wetenschappelijke eisen en ethische grondbeginselen respecteert en gericht is op theoriegeneratie in plaats van verificatie.","Confidentialiteit: het beschermen van de identiteit van het individu, wat bij een interview extra aandacht vraagt omdat er minder privacy is dan bij een survey.","Saturatie: het moment waarop je in de interviews niets nieuws meer hoort, wat mee bepaalt hoeveel mensen je interviewt.","Continuüm van structuur: interviews lopen van gestructureerd, over semigestructureerd, tot ongestructureerd.","Gestructureerd interview: kwantitatieve benadering met op voorhand geschreven, gesloten vragen, beperkte antwoorden en methodes zoals CAPI en CATI.","Semigestructureerd interview: kwalitatieve benadering waarbij vragen vooraf zijn vastgelegd maar het onderwerp belangrijker is dan de exacte vraagstelling.","Ongestructureerd interview: de geïnterviewde bepaalt zelf het gespreksonderwerp, bijvoorbeeld bij daklozen, zonder zicht op begin- of eindpunt.","Insider versus outsider: een insider heeft veel kennis en vertrouwen maar riskeert een persoonlijke focus, een outsider houdt afstand maar heeft vaak specifieke training nodig.","Theorieontwikkeling versus theoriebevestiging: bij emerging topics lees je beter weinig in om niet sturend te zijn, bij bevestiging toets je bestaande theorie af.","Interviewleidraad: aanpasbare, niet-exhaustieve lijst met topics met hoofdvragen en bijvragen, gebruikt als leidraad en niet als scenario.","Pilotstudie: proefinterview om de skills van de interviewer, de flow, de timing en de aangepastheid van de vragen aan het doelpubliek te testen.","Snowballsampling: rekruteringsmethode waarbij geschikte deelnemers via andere deelnemers of stakeholders gevonden worden, want random selectie is zeldzaam.","Informed consent: het document en akkoord waarbij de deelnemer grondig geïnformeerd wordt over doel, duur, inhoud, privacy en ethiek.","Actief luisteren: kernhouding van de interviewer die weinig praat, stiltes toelaat, niet onderbreekt en de geïnterviewde centraal stelt."]},{"h":"Etnografie & participerende observatie","items":["Etnografie: intensieve, betrokken datacollectie via observatie voor de studie van culturen, historisch de oudste vorm van dit onderzoek.","Participerende observatie: het capteren en analyseren van de observaties van een onderzoeker in een setting, als strategie om verschillende soorten gegevens te verzamelen.","Veldnota's: verzameling van observaties waarbij zuivere observatie (zonder interpretatie) gescheiden wordt van de analytische interpretatie.","Overt versus covert: de onderzoeker maakt zijn rol als onderzoeker wel (overt) of niet (covert) bekend aan de geobserveerden.","Rol van de observator: keuze tussen enkel observeren of zelf deelnemen aan de setting.","Open versus gesloten context: een setting die toegankelijk is voor buitenstaanders (open) of afgesloten en enkel via toelating toegankelijk (gesloten).","Gatekeeper: een sleutelpersoon die de onderzoeker toegang verschaft tot een gemeenschap, zoals doc in de studie Street Corner Society.","Sleutelfiguren: leden met een belangrijke rol in de groep, meer interesse in het onderzoek, een specifieke relatie met de onderzoeker en toegang tot specifieke informatie.","Purposive sampling: bewust situaties, contexten of settings kiezen waar het antwoord op de onderzoeksvraag te vinden is.","Data saturatie: het punt waarop verdere observaties niets meer bijdragen aan het onderzoek.","Exit-strategie: een gepland of geforceerd einde van het veldwerk, bijvoorbeeld na ontmaskering, spanningen of ethische overwegingen.","Voortdurende toegang: het aanhouden van contact en het geloofwaardig blijven volhouden van de rol tijdens langdurig veldwerk.","Objectiviteit als probleem: omdat volledige objectiviteit lastig is, worden veldnota's snel na de observatie en los van de interpretaties genoteerd.","Duur en gedrag: bij langdurige observatie merken mensen de observator niet meer op en gedragen ze zich weer normaal."]},{"h":"Focusgroepen","items":["Focusgroep: groepsinterview met meestal 6 tot 10 deelnemers (max. ongeveer 12), begeleid door een getrainde moderator rond een of meerdere topics.","Moderator: getrainde begeleider die het gesprek stuurt, de interactie bevordert en geen eigen mening of beoordeling geeft.","Data: bij een focusgroep is de data wat de participanten zeggen tijdens de discussie.","Merton (1946): grondlegger van de focusgroep met de onderzoeksvraag hoe het publiek reageerde op oorlogspropaganda.","Georganiseerde discussie: de moderator heeft veel controle en werkt met een lijst topics als basis, aangevuld met nieuwe topics uit de groep.","Collectieve activiteit: de groepsdynamiek stimuleert het genereren van ideeen, waardoor het resultaat groter is dan bij vele losse interviews.","Sociaal gebeuren: deelnemers kennen elkaar meestal niet en hebben best dezelfde status, zodat een veilige sfeer ontstaat.","Interactie: deelnemers stellen elkaar vragen, luisteren, krijgen ideeen van elkaar en verdiepen hun eigen argumentatie.","Purposive sampling: doelgerichte selectie van deelnemers op basis van expertise, geen random sampling.","Saturatie: het punt waarop nieuwe focusgroepen geen nieuwe informatie meer opleveren, sneller bereikt bij homogene groepen.","Single category design: alle deelnemers behoren tot dezelfde categorie, wat sneller tot saturatie leidt.","Multiple-categorie design: verschillende groepen per categorie, bijvoorbeeld kankerpatienten, familieleden en artsen apart.","Incentives: op voorhand niks beloven, maar na afloop een kleine attentie geven, zonder aan te zetten tot deelname.","Voordelen: goedkoop en snel te organiseren, veel informatie in korte tijd en deelnemers hebben geen specifieke vaardigheden nodig.","Wanneer niet gebruiken: bij attitudes (sociale wenselijkheid), levensverhalen, zeer gevoelige topics en wanneer statistische, generaliseerbare resultaten verwacht worden."]},{"h":"Transcriberen & thematische analyse","items":["Transcriptie: de overgang van het gesproken woord naar het geschreven woord, waarbij je voortdurend keuzes maakt.","Verbatim transcriptie: letterlijk uittypen wat gezegd werd, met als nadeel dat je je enkel op het gesproken woord baseert.","Proxemisch taalgebruik: het gebruik van afstand tussen sprekers tijdens een gesprek.","Kinesisch taalgebruik: houding en beweging tijdens een gesprek, zoals knikken of op tafel kloppen.","Paralinguïstisch taalgebruik: volume, toonhoogte en dergelijke tijdens het gesprek.","Transcribent: de persoon die de opname transcribeert en daarbij selectieve keuzes maakt.","Jefferson-methode: een specifieke transcriptievorm die details van de interactie en alle non-verbale geluiden vastlegt om te onderzoeken hoe iets gezegd wordt.","Insider-outsider: uitdaging waarbij dialect of insider-betekenissen onbegrijpelijk zijn voor de transcribent, tenzij verduidelijking gevraagd wordt.","Member checking: validering door de deelnemers zelf, bijvoorbeeld van woorden die de transcribent niet begreep.","Thematische analyse: de meest toegankelijke kwalitatieve analyse die thema's uit de data laat 'opkomen', beschrijvend werkt en met citaten illustreert.","Theorie- versus datagestuurd: thematische analyse kan vertrekken vanuit bestaande theorie of vanuit pure exploratie van de data.","Beschrijvende benadering: thematische analyse beschrijft wat in de data voorkomt zonder kwantitatieve tellingen en is niet gericht op theorievorming.","Transparantie: het is noodzakelijk te tonen hoe thema's tot stand kwamen, over alle bronnen heen.","Grounded theory en content analyse: verwante methoden, waarbij grounded theory vooral labelt en content analyse vooral beschrijft.","Stappen thematische analyse: familiariseren, initieel coderen, thema's zoeken, thema's reviewen, thema's definiëren, rapport schrijven."]},{"h":"Grounded theory","items":["Grounded theory: rigoureuze kwalitatieve benadering gericht op theorieontwikkeling die voortkomt uit empirische data.","Middle range theorie: het eindresultaat, geen allesomvattende grand theory maar een theorie die grondig op de data is geevalueerd en toepasbaar is.","Constante vergelijking: doorlopend heen en weer bewegen tussen data en analyse (data, analyse, data, analyse ...) en tussen data en categorieen.","Theoretische sampling: de zich ontwikkelende theorie bepaalt met een kleine, gerichte n welke data in de volgende fase worden verzameld.","Inductief proces: in grounded theory primeert inductie boven deductie; concepten en ideeen komen uit de data.","Open coderen: dicht bij de data blijven en beschrijven wat er gebeurt, lijn per lijn betekenis geven.","Axiaal coderen: codes aan elkaar relateren, inductief en deductief, en sleutelconcepten identificeren.","Selectief coderen: hoofd- en subthema's bepalen in het materiaal.","Saturatie: punt waarop nieuwe data en constante vergelijking geen nieuwe informatie of categorieen meer opleveren (metafoor Google search).","Conceptuele densiteit: nadruk op reductie en grondige beschrijving van categorieen met tegelijk maximale verklaring van de data.","Exclusieve en exhaustieve categorieen: maximaal includeren en categoriseren zonder afbreuk te doen aan de data, in tegenstelling tot datareductie via factoranalyse.","Glaser vs. Strauss: Glaser gaat uit van een 'empty mind' met theorie in de data en een passief gedisciplineerde onderzoeker; Strauss vertrekt vanuit een idee, interpreteert de theorie en werkt actief.","Member validation: validiteit bereiken door bevindingen af te toetsen bij de betrokkenen zelf.","Grounded theory is niet: rauwe data presenteren, theorietesten, content analyse, woorden tellen of een vaste routine."]},{"h":"Discoursanalyse (constructionist & Foucauldiaans)","items":["Discours: het vertoog, taalgebruik dat via interactie ontstaat en dat de losse woorden en de taal overstijgt.","Sociaal constructionistische discoursanalyse: benadering (Potter & Wetherell) die bestudeert hoe spraak en teksten worden gebruikt om handelingen te verrichten, op microniveau dicht bij het materiaal.","Actiegeorienteerdheid: taal beschrijft niet enkel maar doet iets, zoals een belofte of een vraag die een bepaalde uitkomst stuurt.","Context- en situatiegevoeligheid: betekenis hangt af van setting, sequentie (geschiedenis van het gesprek) en retoriek.","Footing (eigenaarschap): verschuiven tussen ik, we, ons en zij verandert de verantwoordelijkheid en betekenis van een uiting.","Taal als sociaal construct: concepten zoals motieven, geheugen en attitude staan niet vast maar worden in interactie en coproductie geconstrueerd.","Iteratief proces: open-ended zoeken naar patronen zonder vooraf te weten hoe die eruitzien, met blind faith en veel tijd, en replicatie voor beginners.","Coderen: geen samenvattend label plakken maar tekststukken groeperen omdat er iets gebeurt in de interactie.","Valideren: interne coherentie, deviante cases, overeenstemming met vorige studies en externe evaluatie door lezers met tekstillustraties.","Cirkelredenering: valkuil waarbij tekstfragmenten een ideologie voeden die vervolgens diezelfde fragmenten verklaart.","Foucauldiaanse discoursanalyse: politieke, macro-analyse die fenomenen herformuleert in termen van macht, onderdrukking, weerstand en ongelijkheid.","Macht (Foucault): productief en werkzaam binnen interactie, deelt mensen in, bepaalt identiteit en positie en is gesitueerd in tijd.","Sociaal construct binnen macht: bv. war on drugs legitimeert beleid en positioneert individuen zoals burger, gebruiker, dealer en agent.","History of madness: werk waarin waanzin geen universele categorie maar een sociaal construct is dat via wetenschappelijke kennis macht uitoefent."]},{"h":"Fenomenologie & IPA","items":["Life world: hoe mensen de wereld ervaren, slechts benaderend te vatten in taal.","Real world: de objectieve wereld die niet rechtstreeks te kennen is, enkel via subjectieve beschrijving van bewuste ervaring.","Intentionaliteit: het bewustzijn geeft continu aandacht, zonder aandacht is er geen bewustzijn.","Fenomeen: alles wat waarneembaar is zoals het door het individu ervaren wordt, niet zoals het cognitief verwerkt wordt.","Bracketing: het loslaten van gedachten, overtuigingen, voorafnames en theorieën om de ervaring zuiver te analyseren.","Epoché: de erkenning dat volledig loslaten van veronderstellingen nooit 100% mogelijk is, met nadruk op beschrijven in plaats van verklaren.","Husserl: descriptieve fenomenologie, ervaringen leren kennen via gedetailleerde beschrijving.","Heidegger: interpretatieve fenomenologie binnen een specifieke context, voorloper van IPA.","Imaginative variation: een fenomeen begrijpen door te onderzoeken wat het niet is.","Hermeneutiek: het zoeken naar verborgen betekenis binnen historische, culturele en sociale context.","Dubbele hermeneutiek: de onderzoeker interpreteert de interpretatie die de onderzochte van zijn ervaring maakt.","Symbolisch interactionisme: de betekenis die mensen geven aan verschijnselen ontstaat tijdens sociale interacties en is essentieel om de mens te begrijpen.","Inductieve benadering: van data naar interpretatie, waarbij deelnemers experts zijn over hun eigen ervaringen.","IPA-sampling: kleine, homogene sample met semidiepte-interviews, arbeidsintensief en individueel georiënteerd."]},{"h":"Narratieve & conversatie-analyse","items":["Narratief: wat een individu over zichzelf vertelt, waarmee identiteit wordt geconstrueerd en orde in wanorde komt.","Coherentie: de samenhang in een verhaal, waarbij linken bestaan tussen de verschillende delen; obscuur blijvende aspecten zeggen ook iets.","Emplotment: de plot die voor coherentie in het levensverhaal zorgt.","Tijdsdimensie: een verhaal heeft begin, midden en einde en kan door de tijd heen veranderen, afhankelijk van het moment van interviewen.","Sociaal constructionisme: identiteit bestaat niet als object, maar wordt geconstrueerd via verteller, toehoorder, sociale context en interactie.","McAdams-methode: tijds- en arbeidsintensieve leidraad die het leven in hoofdstukken (max. 8) verdeelt en sleutelmomenten en belangrijke personen bevraagt.","Sleutelmomenten: hoogtepunt, dieptepunt, keerpunt, vroegste herinnering en herinneringen uit kindertijd, adolescentie en volwassenheid.","Narratieve toon: de inhoud en de manier waarop iets gezegd wordt, de gebruikte beeldspraak en waar die vandaan komt.","Familiarisatie: vertrouwd raken met het getranscribeerde materiaal als stap in de analyse.","Conversatie-analyse: studie van natuurlijke conversaties met aandacht voor wendingen, problemen, probleemhantering en non-verbale communicatie.","Gesprekken zijn actie: de focus ligt op wat er gebeurt in het gesprek, niet op de letterlijke inhoud of op diepere betekenis.","Intersubjectiviteit: gesprek als actie-reactie binnen bepaalde regels tussen deelnemers.","Jefferson-methode: voorkeursmethode voor het gedetailleerd transcriberen van conversaties.","Natuurlijke conversaties: geschikte data voor conversatie-analyse, zoals telefoongesprekken of een focusgroep waarin de geleider weinig tussenkomt."]},{"h":"Kwaliteit, rapportage & ethiek","items":["Reflexiviteit: de onderzoeker rapporteert zijn eigen positie, aannames en betrokkenheid ten opzichte van de deelnemers om confirmation bias te vermijden.","Transparantie: helder verantwoorden van sampling, quotes en interpretatie zodat de jury weet wat, hoe en waarom iets gedaan is.","Storyline: een doordacht rationeel verhaal dat via literatuur, data en analyse naar een coherente conclusie leidt, zonder emotionele argumentatie.","Reactiviteit: het verschijnsel dat deelnemers reageren op of veranderen door het feit dat er vragen gesteld worden.","Data-triangulatie: verschillende dataverzamelingsmethodes combineren om na te gaan of ze dezelfde resultaten opleveren.","Member check (respondent validering): de interpretatie voorleggen aan de deelnemers om te controleren of ze correct is.","Afwijkende cases: outliers worden in kwalitatief onderzoek juist geincorporeerd, want een concept beschrijven kan ook door te tonen wat het niet is.","Generaliseerbaarheid: door sommigen als nutteloos gezien omdat de werkelijkheid geconstrueerd wordt, maar bruikbaar binnen een sociaal-maatschappelijke context.","Betrouwbaarheid: weinig animo in kwalitatief onderzoek door de geconstrueerde werkelijkheid en contextgevoeligheid.","Informed consent: contract tussen onderzoeker en deelnemer met alle info die nodig is voor een onderbouwde beslissing over deelname.","Implied consent: veronderstelde toestemming, bijvoorbeeld bij het invullen van een vragenlijst.","Proces consent: bij meerdere (narratieve) interviews de informed consent opnieuw raadplegen als er geen substantiële wijzigingen zijn.","Anonimiteit vs. confidentialiteit: bij anonimiteit kent de onderzoeker de identiteit niet, bij confidentialiteit wel maar geldt strikt databeheer.","Ethische principes: beneficence en nonmaleficence, fidelity en responsibility, integrity, equity, en respect voor rechten en waardigheid.","Research misconduct: fabriceren (verzinnen), falsifiëren (data manipuleren), plagiëren, onrechtmatig eigenaarschap en conflicts of interest, met retraction en imagoschade als gevolg."]}],"hacks":[{"h":"SIT: Subjectief, Idiografisch, Teleologisch","t":"Onthoud de kwalitatieve pool met SIT: Subjectief, Idiografisch en Teleologisch (zoekt naar doel). De kwantitatieve tegenhanger is dan telkens het spiegelbeeld: objectief, nomothetisch en analytisch."},{"h":"GSO-continuüm","t":"Onthoud de drie structuurvormen met G-S-O: Gestructureerd, Semigestructureerd, Ongestructureerd. Hoe verder je in het alfabet gaat, hoe minder structuur en hoe meer de geïnterviewde het gesprek bepaalt."},{"h":"OVERT of COVERT","t":"Onthoud dat OVERt begint als OPEN en betekent dat je je rol OPENlijk bekendmaakt, terwijl COVERt verwant is aan COVER (dekmantel) en betekent dat je je rol verbergt. Zo verwar je de twee onderzoekersrollen nooit meer."},{"h":"MIS-SI: de vier kenmerken","t":"Onthoud de vier kenmerken van een focusgroep met 'MIS-SI': Moderator-gestuurde discussie, Ideeen via collectieve activiteit, Sociaal gebeuren en Interactie tussen deelnemers. Zo mis je geen kernkenmerk op het examen."},{"h":"PKP: de drie soorten taalgebruik","t":"Onthoud Proxemisch, Kinesisch, Paralinguïstisch met 'Positie, Kop, Piep': Proxemisch = Positie/afstand, Kinesisch = Kop/lichaam dat beweegt, Paralinguïstisch = Piep/toonhoogte en volume. Zo verwar je de drie termen niet."},{"h":"OAS: van open naar scherp","t":"De drie coderingsstappen onthoud je met OAS: Open (dicht bij de data, wat gebeurt er), Axiaal (codes aan elkaar relateren en sleutelconcepten vinden) en Selectief (hoofd- en subthema's bepalen). Je gaat dus van breed en beschrijvend naar steeds scherper en theoretischer."},{"h":"ACES voor de kernconcepten van taal","t":"Onthoud dat taal Actiegeorienteerd, Contextgevoelig, Eigenaarschap (footing) toont en een Sociaal construct is met het woord ACES. Zo herinner je de vier kernkenmerken van taal in de constructionistische discoursanalyse."},{"h":"BE-HID voor de kernbegrippen","t":"Onthoud BE-HID: Bracketing en Epoché horen bij de klassieke, beschrijvende fenomenologie (loslaten en beschrijven), terwijl Hermeneutiek, Interpretatie en Dubbele hermeneutiek bij IPA horen (betekenis achterhalen)."},{"h":"NARRATIEF kijkt naar het WAT, conversatie naar het HOE","t":"Bij narratieve analyse draait het om het verhaal en de betekenis: WAT vertelt iemand over zichzelf. Bij conversatie-analyse draait het om de actie: HOE komt een gesprek tot stand en verloopt het, zonder te zoeken naar diepere betekenis."},{"h":"Vier ethische principes: BIER","t":"Onthoud de kern van de ethische principes met BIER: Beneficence (geen schade), Integrity (eerlijk en accuraat), Equity (gelijke behandeling en bewust van biases) en Respect (voor rechten, privacy en vrijwillige deelname). Zo bewaar je overzicht over waar het bij ethische clearance om draait."}]};
</script>

      '<label class="fld" for="fbEmail">Je e-mail <span class="muted">(optioneel, als je een antwoord wilt)</span></label><input type="email" id="fbEmail" placeholder="naam@voorbeeld.be">'+
      '<input type="text" id="fbBot" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0">'+
      '<div class="row" style="margin-top:16px;align-items:center"><button class="btn" id="fbSend">'+ic("send")+'Versturen</button><span id="fbStatus" style="font-size:13px"></span></div></div>';
    setHTML(html);
    document.getElementById("fbSend").onclick=function(){
      var status=document.getElementById("fbStatus");
      if(document.getElementById("fbBot").value) return;
      var msg=document.getElementById("fbMsg").value.trim();
      if(!msg){ status.style.color="var(--bad)"; status.textContent="Schrijf eerst een bericht."; return; }
      var btn=document.getElementById("fbSend"); btn.disabled=true; status.style.color="var(--muted)"; status.textContent="Versturen…";
      var em=document.getElementById("fbEmail").value.trim();
      var nm=document.getElementById("fbNaam").value.trim();
      var waar=document.getElementById("fbWaar").value.trim();
      var payload={_subject:"Onderzoeksmethoden & -technieken III-tool: feedback", _template:"table", _captcha:"false",
        Naam:nm||"-", Over_welke_vraag:waar||"-", email:em||"-", Bericht:msg};
      if(em) payload._replyto=em;
      // vangnet: als de verzenddienst blokkeert (bv. spamfilter) of er is geen verbinding,
      // bieden we een directe mailto-knop aan zodat de melding NOOIT stilletjes verdwijnt.
      function failFallback(reden){
        var body="Feedback Onderzoeksmethoden & -technieken III-tool%0D%0A%0D%0ANaam: "+encodeURIComponent(nm||"-")+"%0D%0AOver welke vraag: "+encodeURIComponent(waar||"-")+"%0D%0AE-mail: "+encodeURIComponent(em||"-")+"%0D%0A%0D%0ABericht:%0D%0A"+encodeURIComponent(msg);
        var mailto="mailto:berat007yildirim@gmail.com?subject="+encodeURIComponent("Onderzoeksmethoden & -technieken III-tool: feedback")+"&body="+body;
        setHTML('<div class="card pad"><h2 style="margin-top:0">Automatisch versturen lukte niet</h2><p class="muted">'+reden+' Geen zorgen, klik hieronder en je melding wordt geopend in je e-mail, helemaal klaar om te versturen:</p><a class="btn" href="'+mailto+'">'+ic("send")+'Mail mijn melding direct</a><div style="margin-top:14px"><button class="btn ghost" id="bk">Terug naar start</button></div></div>');
        document.getElementById("bk").onclick=function(){go("home");};
      }
      fetch("https://formsubmit.co/ajax/Berat007yildirim@gmail.com",{method:"POST",headers:{Accept:"application/json"},body:new URLSearchParams(payload)})
        .then(function(r){return r.json();}).then(function(d){
          if(d&&(d.success===true||d.success==="true")){ setHTML('<div class="card pad results center"><div style="font-size:42px">✅</div><h2 style="margin:6px 0">Bedankt!</h2><p class="muted">Je melding is verstuurd.</p><button class="btn" id="bk" style="margin-top:8px">Terug naar start</button></div>'); document.getElementById("bk").onclick=function(){go("home");}; }
          else { failFallback("Het automatisch versturen lukte niet."); }
        }).catch(function(){ failFallback("Er was even geen verbinding."); });
    };
  }

  document.addEventListener("keydown",function(e){ if(state.key) state.key(e); });
  // bezoeker tellen (1x per toestel)
  try{ if(!localStorage.getItem("omt3_seen")){ localStorage.setItem("omt3_seen","1"); bump("berat-omt3","gebruikers"); } }catch(e){ bump("berat-omt3","gebruikers"); }
  // traject vanuit de hub overnemen → direct naar de oefenpagina
  try{ var _q=new URLSearchParams(location.search); var _m=_q.get("m");
    if(_m==="training"||_m==="herkansing"){ state.track=_m; lset("omt3_track",_m);
      var _c=_q.get("calm"); if(_c!=null){ calm=(_c!=="0"); lset("omt3_calm",calm); applyCalm(); }
      state.step="practice"; state.fromHub=true; }
  }catch(e){}
  render();
  // launch-splash netjes laten verdwijnen
  (function(){ var _sp=document.getElementById("splash"); if(!_sp) return; var _red=false; try{_red=window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){} setTimeout(function(){ _sp.classList.add("hide"); setTimeout(function(){ if(_sp&&_sp.parentNode) _sp.parentNode.removeChild(_sp); }, 700); }, _red?300:1850); })();
})();
</script>
