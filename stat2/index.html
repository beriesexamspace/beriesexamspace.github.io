<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<!-- Berie's exam space © 2026 Berat Yildirim. Alle rechten voorbehouden. Originele bron: https://beriesexamspace.github.io  Kopieren of hergebruiken zonder schriftelijke toestemming is niet toegestaan. -->
<style>
  :root{
    --bg:#f4f2ee; --bg2:#ebe8e2; --card:#ffffff; --ink:#1b232c; --muted:#5d6873;
    --line:#e2ddd4; --accent:#0f6e6a; --accent-ink:#0b4f4c; --accent-soft:#dcefed;
    --amber:#c9821f; --amber-soft:#f7ecd9; --violet:#6d5bd0; --violet-soft:#e9e6fa;
    --good:#1f8a4c; --good-soft:#e2f3e8; --bad:#c23b54; --bad-soft:#fbe5ea;
    --shadow:0 1px 2px rgba(20,30,40,.05),0 6px 18px rgba(20,30,40,.05);
    --shadow-lg:0 2px 6px rgba(20,30,40,.06),0 18px 40px rgba(20,30,40,.10);
    --r:14px; --r-lg:20px; --ease:cubic-bezier(.2,.8,.2,1);
  }
  html[data-theme="dark"]{
    --bg:#11151a; --bg2:#161b22; --card:#1b222b; --ink:#e7ecf1; --muted:#9aa6b2;
    --line:#2a323c; --accent:#3fb9b2; --accent-ink:#7fd6d0; --accent-soft:#163230;
    --amber:#e0a64a; --amber-soft:#2e2515; --violet:#a99cf0; --violet-soft:#221d3a;
    --good:#46c178; --good-soft:#16301f; --bad:#ef6b82; --bad-soft:#331620;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 2px 8px rgba(0,0,0,.4),0 22px 48px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;letter-spacing:-.01em}
  button,a{font-family:inherit;cursor:pointer;color:inherit}
  .wrap{max-width:880px;margin:0 auto;padding:0 18px 96px}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
  .ic{width:1.25em;height:1.25em;flex:none;vertical-align:-.18em;stroke:currentColor;stroke-width:1.75;
    stroke-linecap:round;stroke-linejoin:round;fill:none}

  header.top{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(160%) blur(16px);-webkit-backdrop-filter:saturate(160%) blur(16px);box-shadow:inset 0 -1px 0 0 rgba(0,0,0,.04)}
  .topin{max-width:880px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:700}
  .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,var(--accent),var(--accent-ink));
    color:#fff;display:grid;place-items:center;font-family:Georgia,serif;font-weight:700;font-size:16px;flex:none;
    box-shadow:0 2px 6px rgba(15,110,106,.35)}
  .brand small{display:block;font-weight:500;color:var(--muted);font-size:11px}
  .spacer{flex:1}
  .iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:38px;
    padding:7px 11px;font-size:13.5px;display:inline-flex;gap:7px;align-items:center;text-decoration:none;
    transition:border-color .2s var(--ease),transform .12s var(--ease)}
  .iconbtn:hover{border-color:var(--accent)} .iconbtn:active{transform:scale(.96)}
  nav.tabs{display:flex;gap:2px;overflow:auto;max-width:880px;margin:0 auto;padding:6px 12px 0;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{border:none;background:none;color:var(--muted);padding:10px 13px;border-radius:9px 9px 0 0;
    font-size:14px;font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px;transition:color .2s var(--ease)}
  nav.tabs button .ic{width:16px;height:16px}
  nav.tabs button.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
  nav.tabs button:hover{color:var(--ink)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:20px}
  .muted{color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
  .pill.amber{background:var(--amber-soft);color:var(--amber)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;gap:14px}
  @media(min-width:620px){.g2{grid-template-columns:1fr 1fr}}

  .hero{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin:20px 0 8px}
  .count{flex:none;background:linear-gradient(150deg,var(--accent),var(--accent-ink));color:#fff;border-radius:var(--r);padding:14px 20px;text-align:center;min-width:118px;box-shadow:0 8px 20px rgba(15,110,106,.28)}
  .count b{font-family:Georgia,serif;font-size:32px;display:block;line-height:1}
  .count span{font-size:12px;opacity:.92}
  .herotext h1{margin:0 0 4px;font-size:25px}
  .herotext p{margin:0;color:var(--muted)}

  .brandstrip{display:flex;align-items:center;gap:13px;width:100%;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 16px;margin:14px 0 2px;box-shadow:var(--shadow);transition:border-color .2s var(--ease),transform .15s var(--ease)}
  .brandstrip:hover{border-color:var(--accent);transform:translateY(-1px)}
  .brandstrip .bs-logo{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:17px;background:linear-gradient(145deg,var(--accent),var(--accent-ink))}
  .brandstrip .bs-txt{flex:1;min-width:0} .brandstrip .bs-txt b{display:block;font-size:14.5px} .brandstrip .bs-txt small{color:var(--muted);font-size:12.5px}
  .brandstrip .bs-go{color:var(--accent-ink);flex:none;display:inline-flex} .brandstrip .bs-go .ic{width:18px;height:18px}

  .seclabel{display:flex;align-items:center;gap:8px;margin:24px 0 12px;font-weight:700;font-size:15px}
  .seclabel .ic{width:18px;height:18px;color:var(--accent-ink)}
  .backlink{display:inline-flex;align-items:center;gap:5px;border:none;background:none;color:var(--muted);font-size:13.5px;font-weight:600;padding:6px 0;margin-bottom:4px;transition:color .2s var(--ease)}
  .backlink:hover{color:var(--accent-ink)} .backlink .ic{width:16px;height:16px}
  .tracks{display:grid;gap:14px} @media(min-width:600px){.tracks{grid-template-columns:1fr 1fr}}
  .track{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);transition:transform .22s var(--ease),border-color .22s var(--ease),box-shadow .22s var(--ease)}
  .track:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow-lg)} .track:active{transform:translateY(-1px) scale(.995)}
  .track .tile{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;margin-bottom:4px;background:linear-gradient(150deg,var(--accent),var(--accent-ink))}
  .track.alt .tile{background:linear-gradient(150deg,var(--violet),#4f40a8)} .track .tile .ic{width:24px;height:24px}
  .track b{font-size:18px} .track small{color:var(--muted);font-size:13.5px;line-height:1.5}
  .track .go{margin-top:6px;display:inline-flex;align-items:center;gap:6px;color:var(--accent-ink);font-weight:600;font-size:13.5px} .track.alt .go{color:var(--violet)} .track .go .ic{width:16px;height:16px}
  .toggle{width:48px;height:28px;border-radius:999px;border:none;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s var(--ease)}
  .toggle .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s var(--ease)}
  .toggle.on{background:var(--violet)} .toggle.on .knob{left:23px}
  .warmcard{border-color:var(--violet)!important;background:var(--violet-soft)} .warmcard .ic{width:22px;height:22px;color:var(--violet);flex:none}
  .modebanner{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:11px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent-ink);font-size:13.5px;font-weight:600}
  .modebanner.v{background:var(--violet-soft);color:var(--violet)} .modebanner .ic{width:18px;height:18px} .modebanner a,.modebanner .bnlink{margin-left:auto;font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;color:inherit;border:none;background:none;font-family:inherit;padding:0}
  html.snappy .card,html.snappy .mode,html.snappy .tip,html.snappy .track{animation-duration:.12s!important}
  .mode{display:flex;flex-direction:column;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:17px;gap:7px;box-shadow:var(--shadow);transition:transform .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease)}
  .mode:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .mode .me{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)} .mode .me .ic{width:22px;height:22px}
  .mode b{font-size:16px} .mode small{color:var(--muted);font-size:13px}

  label.fld{display:block;font-size:13px;font-weight:600;margin:16px 0 7px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;min-height:38px;padding:7px 13px;font-size:13.5px;transition:all .18s var(--ease)}
  .chip:hover{border-color:var(--accent)} .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:11px;min-height:46px;padding:12px 20px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;box-shadow:0 4px 12px rgba(15,110,106,.25);transition:background .2s var(--ease),transform .12s var(--ease)}
  .btn:hover{background:var(--accent-ink)} .btn:active{transform:scale(.97) translateY(1px)} .btn .ic{width:18px;height:18px}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none} .btn.ghost:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  input[type=search],input[type=text],input[type=email],textarea{font-family:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
  input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .runtop{display:flex;align-items:center;gap:12px;margin:2px 0 14px;font-size:13px;color:var(--muted)}
  .bar{height:8px;border-radius:6px;background:var(--bg2);overflow:hidden;flex:1}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .7s var(--ease)}
  .qtext{font-size:19px;font-weight:600;margin:8px 0 16px;font-family:Georgia,serif;line-height:1.45}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px 15px;margin-bottom:10px;font-size:15px;transition:border-color .15s var(--ease),background .15s var(--ease),transform .12s var(--ease)}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)} .opt:active:not(:disabled){transform:scale(.99)}
  .opt .k{flex:none;width:27px;height:27px;border-radius:8px;background:var(--bg2);color:var(--muted);display:grid;place-items:center;font-weight:700;font-size:13px}
  .opt.correct{border-color:var(--good);background:var(--good-soft)} .opt.correct .k{background:var(--good);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default}
  .feedback{border-radius:12px;padding:13px 15px;margin:4px 0 12px;font-size:14.5px}
  .feedback.ok{background:var(--good-soft);color:var(--good)} .feedback.no{background:var(--bad-soft);color:var(--bad)}
  .feedback b{font-weight:700} .feedback .sub{display:block;margin-top:3px;color:var(--ink);font-weight:500;opacity:.92}
  .whybtn{border:1px solid var(--line);background:var(--card);color:var(--accent-ink);border-radius:10px;min-height:40px;padding:9px 14px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:border-color .2s var(--ease),background .2s var(--ease)}
  .whybtn:hover{border-color:var(--accent);background:var(--accent-soft)} .whybtn .ic{width:16px;height:16px}
  .whybox{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:14px 16px;margin:12px 0 4px;font-size:14px;line-height:1.55}
  .whybox h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent-ink);font-family:system-ui;display:flex;align-items:center;gap:7px}
  .whybox .ic{width:16px;height:16px}

  .acc{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
  .acc>summary{padding:15px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:11px}
  .acc>summary::-webkit-details-marker{display:none}
  .acc>summary .n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
  .acc>summary .caret{margin-left:auto;color:var(--muted);transition:transform .25s var(--ease)} .acc[open]>summary .caret{transform:rotate(90deg)}
  .acc[open]>summary{border-bottom:1px solid var(--line)} .acc .body{padding:6px 18px 16px}
  .acc h4{margin:14px 0 6px;font-size:13px;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.4px;font-family:system-ui}
  .acc ul{margin:0;padding-left:20px} .acc li{margin:6px 0;font-size:14.5px;line-height:1.5}
  .acc.hack li::marker{content:"💡  "} .acc.hack>summary .n{background:var(--violet-soft);color:var(--violet)}
  mark{background:var(--amber-soft);color:inherit;padding:0 2px;border-radius:3px}

  .tip{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}
  .tip h4{margin:0 0 5px;font-size:14.5px;display:flex;align-items:center;gap:8px;font-family:system-ui} .tip h4 .ic{width:18px;height:18px;color:var(--violet)}
  .tip p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}
  .tipgrid{display:grid;gap:12px} @media(min-width:620px){.tipgrid{grid-template-columns:1fr 1fr}}

  .results .big{font-family:Georgia,serif;font-size:54px;text-align:center;margin:8px 0;line-height:1}
  .center{text-align:center} .hide{display:none!important}
  footer{margin-top:34px;text-align:center;color:var(--muted);font-size:13px}
  .kbd{font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--muted)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.03)}100%{transform:scale(1)}}
  @keyframes optIn{from{opacity:0;transform:translateX(-9px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: no-preference){
    .card,.mode,.tip{animation:fadeUp .34s var(--ease) both}
    .acc{animation:fadeUp .32s var(--ease) both}
    .opt{animation:optIn .3s var(--ease) backwards;animation-delay:var(--oi,0s)}
    .chip.on{animation:pop .22s var(--ease)}
    .feedback{animation:slideIn .26s var(--ease) both} .whybox{animation:slideIn .28s var(--ease) .07s both} .opt.correct{animation:pop .34s var(--ease)}
  }
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  /* ---- Premium launch (Gemini-stijl) + header-logo gloed ---- */
  @property --bes-a{syntax:'<angle>';initial-value:0deg;inherits:false}
  #splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(125% 125% at 50% 38%,var(--bg2) 0%,var(--bg) 68%);transition:opacity .6s var(--ease),transform .7s var(--ease)}
  #splash.hide{opacity:0;transform:scale(1.07);pointer-events:none}
  .sp-inner{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
  .sp-mark{position:relative;width:100px;height:100px;display:grid;place-items:center}
  .sp-mark::before{content:"";position:absolute;inset:-16px;border-radius:34px;z-index:0;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));filter:blur(17px);opacity:.75}
  .sp-mark::after{content:"";position:absolute;inset:-3px;border-radius:27px;z-index:1;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));padding:3px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .sp-logo{position:relative;z-index:2;width:92px;height:92px;border-radius:24px;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:46px;background:linear-gradient(150deg,var(--accent),var(--accent-ink));box-shadow:0 14px 38px rgba(15,110,106,.4)}
  .sp-spark{position:absolute;z-index:3;top:-7px;right:-7px;width:30px;height:30px;color:#fff;filter:drop-shadow(0 2px 7px rgba(0,0,0,.35))}
  .sp-name{position:relative;font-family:Georgia,serif;font-size:26px;font-weight:700;letter-spacing:-.01em;color:var(--ink);overflow:hidden}
  .sp-name::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(-130%)}
  .sp-tag{font-size:13px;color:var(--muted);margin-top:-8px;letter-spacing:.03em}
  @media (prefers-reduced-motion: no-preference){
    .sp-mark::before{animation:bes-spin 3s linear infinite,bes-breathe 2.4s var(--ease) infinite}
    .sp-mark::after{animation:bes-spin 3s linear infinite}
    .sp-logo{animation:bes-pop .7s var(--ease) both}
    .sp-spark{animation:bes-pop .6s var(--ease) .12s both,bes-twinkle 1.9s var(--ease) .9s infinite}
    .sp-name{animation:bes-rise .6s var(--ease) .14s both}
    .sp-name::after{animation:bes-shimmer 1.5s var(--ease) .5s 1}
    .sp-tag{animation:bes-rise .6s var(--ease) .26s both}
  }
  @keyframes bes-spin{to{--bes-a:360deg}}
  @keyframes bes-breathe{0%,100%{opacity:.55;filter:blur(16px)}50%{opacity:.95;filter:blur(22px)}}
  @keyframes bes-shimmer{to{transform:translateX(130%)}}
  @keyframes bes-twinkle{0%,100%{opacity:1;transform:scale(1) rotate(0deg)}50%{opacity:.65;transform:scale(.82) rotate(18deg)}}
  @keyframes bes-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  /* mobiel: header-knoppen alleen iconen zodat niks zijwaarts overflowt */
  @media(max-width:440px){ header.top .iconbtn span{display:none} header.top .iconbtn{padding:7px 9px;min-width:38px;justify-content:center} .topin{gap:8px} }
</style>
</head>
<body>
<div id="splash"><div class="sp-inner">
  <div class="sp-mark">
    <div class="sp-logo">S2</div>
    <svg class="sp-spark" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.5c.4 4.6 2.4 6.6 7 7-4.6.4-6.6 2.4-7 7-.4-4.6-2.4-6.6-7-7 4.6-.4 6.6-2.4 7-7Z"/></svg>
  </div>
  <div><div class="sp-name">Statistiek II</div><div class="sp-tag">slim oefenen voor je examen</div></div>
</div></div>
<header class="top">
  <div class="topin">

<script>
window.S2 = {"questions":[{"t":"1","q":"Welke uitspraak over deelverzamelingen is juist?","o":["De lege verzameling is een deelverzameling van elke verzameling","De lege verzameling heeft geen enkele deelverzameling","Alleen verzamelingen met evenveel elementen kunnen deelverzamelingen zijn","Een verzameling is nooit een deelverzameling van zichzelf"],"a":0,"u":"Twee afspraken horen bij de definitie: elke verzameling is een deelverzameling van zichzelf, en de lege verzameling is een deelverzameling van elke verzameling.","k":"t"},{"t":"1","q":"In een Venn-diagram is het gebied 'A of B' gearceerd. Welke bewerking is dat?","o":["De doorsnede van A en B","De unie van A en B","Het verschil A minus B","Het complement van A"],"a":1,"u":"'A of B' is de unie: alles wat in A zit, in B zit, of in allebei. 'A en B' is de doorsnede, dus enkel het gemeenschappelijke deel.","k":"t"},{"t":"1","q":"Wanneer vormen de deelverzamelingen A1 tot An een partitie van A?","o":["Als hun doorsnede gelijk is aan A","Als elke deelverzameling minstens twee elementen heeft","Als hun unie A oplevert en ze twee aan twee uitsluitend zijn","Als ze allemaal evenveel elementen tellen"],"a":2,"u":"Een partitie moet aan twee voorwaarden voldoen: samen dekken de delen heel A, en ze overlappen nergens (twee aan twee een lege doorsnede).","k":"t"},{"t":"1","q":"Omega is de uitkomstenruimte en A een gebeurtenis daarin. Wat stelt het complement van A voor?","o":["Het grootste deel van A","De unie van A met Omega","Alles wat zowel in A als in Omega zit","Alles in Omega dat niet in A zit"],"a":3,"u":"Het complement van A, genoteerd als niet-A, bevat precies de uitkomsten van Omega die buiten A vallen.","k":"t"},{"t":"1","q":"Een cijferslot heeft vier posities en op elke positie kan een cijfer van 0 tot 9 staan. Hoeveel codes zijn mogelijk?","o":["10000","3628800","40","5040"],"a":0,"u":"Herhaling is toegelaten, dus elke positie heeft 10 keuzes: 10 x 10 x 10 x 10 = 10^4 = 10000.","k":"o"},{"t":"1","q":"Hoeveel volgorden kan je maken met de tien cijfers 0 tot 9, waarbij elk cijfer precies een keer voorkomt?","o":["9! = 362880","10! = 3628800","10^10 = 10 miljard","C(10,10) = 1"],"a":1,"u":"Dit is een permutatie van de hele verzameling: 10 x 9 x 8 x ... x 1 = 10! = 3628800.","k":"o"},{"t":"1","q":"Hoeveel geordende groepjes van drie verschillende cijfers kan je vormen uit de cijfers 0 tot 9?","o":["30","120","720","1000"],"a":2,"u":"Dit is een variatie: de volgorde is belangrijk en herhaling mag niet. 10 x 9 x 8 = 720.","k":"o"},{"t":"1","q":"Uit tien cijfers kies je een groepje van drie, waarbij de volgorde niet uitmaakt. Hoeveel groepjes zijn er?","o":["30","1000","720","120"],"a":3,"u":"Dit is een combinatie: C(10,3) = (10 x 9 x 8) / (3 x 2 x 1) = 720 / 6 = 120.","k":"o"},{"t":"1","q":"Wat is het verschil tussen een variatie en een combinatie?","o":["Bij een variatie telt de volgorde mee, bij een combinatie niet","Bij een combinatie telt de volgorde mee, bij een variatie niet","Een variatie laat herhaling toe, een combinatie nooit","Een combinatie gebruikt de hele verzameling, een variatie maar een deel"],"a":0,"u":"Beide kiezen r elementen uit n. Alleen bij variaties zijn dezelfde elementen in een andere volgorde twee verschillende uitkomsten.","k":"t"},{"t":"1","q":"Op hoeveel manieren kan je vijf objecten kiezen uit acht, zonder op de volgorde te letten?","o":["336","56","40320","6720"],"a":1,"u":"C(8,5) = 8! / (5! x 3!) = (8 x 7 x 6) / (3 x 2 x 1) = 56.","k":"o"},{"t":"1","q":"Je kiest twee kleuren uit vier en de volgorde is belangrijk. Hoeveel mogelijkheden zijn er?","o":["6","8","12","24"],"a":2,"u":"Variatie van 2 uit 4: 4 x 3 = 12. Zonder volgorde zouden het er 6 zijn.","k":"o"},{"t":"1","q":"Hoeveel deelverzamelingen heeft A = {rood, groen, blauw} in totaal, de lege verzameling en A zelf meegerekend?","o":["9","3","6","8"],"a":3,"u":"Per element kies je of het meedoet of niet: 2^3 = 8. Uitgeschreven: 1 lege, 3 met een kleur, 3 met twee kleuren en 1 met alle drie.","k":"o"},{"t":"1","q":"Waarom is het aantal permutaties een speciaal geval van het aantal variaties?","o":["Omdat een permutatie een variatie is waarbij r gelijk is aan n","Omdat een permutatie de volgorde negeert","Omdat een permutatie altijd op de lege verzameling slaat","Omdat een permutatie herhaling toelaat"],"a":0,"u":"Een variatie ordent r gekozen elementen uit n. Neem je alle n elementen, dus r = n, dan krijg je alle volgorden van de hele verzameling: n!.","k":"t"},{"t":"1","q":"Een onderzoekster kiest 7 testen uit 10 (volgorde maakt niet uit). De promotor koos al 4 vaste testen die er sowieso bij moeten. Hoeveel testbatterijen kan ze samenstellen?","o":["P(3) = 6","C(4,4)+C(6,3) = 21","C(6,3) = 20","V(3 uit 6) = 120"],"a":2,"u":"4 testen liggen vast, dus ze kiest nog 3 uit de overige 6, en de volgorde maakt niet uit → combinatie C(6,3) = 20.","k":"o"},{"t":"1","q":"Je stelt een team van 5 samen uit 16 sporters (10 gemiddelde, 6 topsporters). Het team moet exact 2 óf exact 3 topsporters bevatten. Hoeveel teams kun je maken?","o":["2700","200","32400","270"],"a":0,"u":"Exact 2 top: C(6,2)·C(10,3) = 15·120 = 1800. Exact 3 top: C(6,3)·C(10,2) = 20·45 = 900. Samen = 1800 + 900 = 2700. (De volgorde maakt niet uit → combinaties.)","k":"o"},{"t":"2","q":"Wanneer noem je een fenomeen toevallig (random)?","o":["Als het resultaat op geen enkele manier te voorspellen valt, ook niet op lange termijn","Als de losse uitkomsten onzeker zijn maar op lange termijn regelmatig verdeeld","Als het experiment maar een keer kan worden uitgevoerd","Als elke individuele uitkomst even waarschijnlijk is"],"a":1,"u":"Bij toeval kan je de losse uitkomst niet voorspellen, maar over heel veel herhalingen tekent zich een duidelijk patroon af. Gelijke kansen zijn geen voorwaarde.","k":"t"},{"t":"2","q":"Hoe wordt de kans op een uitkomst frequentieel gedefinieerd?","o":["Als de verhouding tussen gunstige en ongunstige gebeurtenissen in een steekproef","Als het gemiddelde van alle mogelijke uitkomsten","Als de proportie keren dat die uitkomst voorkomt bij zeer veel herhalingen","Als het aantal keer dat de uitkomst in tien pogingen voorkomt"],"a":2,"u":"De frequentiele definitie kijkt naar de lange termijn: de kans is de proportie waar de relatieve frequentie naartoe gaat bij een zeer groot aantal herhalingen.","k":"t"},{"t":"2","q":"Onder welke voorwaarde is het langetermijnpatroon van herhaalde pogingen voorspelbaar?","o":["Als elke poging hetzelfde resultaat geeft","Als de uitkomstenruimte maar twee elementen bevat","Als het aantal pogingen even is","Als de pogingen onderling onafhankelijk zijn"],"a":3,"u":"De uitkomst van een nieuwe poging mag niet beinvloed worden door het resultaat van de vorige. Zonder die onafhankelijkheid gaat de redenering niet op.","k":"t"},{"t":"2","q":"Waaruit bestaat een kansmodel?","o":["Uit een uitkomstenruimte S en de kans van elke uitkomst","Uit een nulhypothese en een alternatieve hypothese","Uit een histogram en een dichtheidskromme","Uit een steekproef en een populatiegemiddelde"],"a":0,"u":"Een kansmodel beschrijft een toevalsverschijnsel: de lijst van alle mogelijke uitkomsten (S) plus de waarschijnlijkheid van elk daarvan.","k":"t"},{"t":"2","q":"Wat is een gebeurtenis (event) in de kansrekening?","o":["Een uitkomst met een kans van precies 0,5","Een uitkomst of een verzameling uitkomsten van een toevalsverschijnsel","Altijd de volledige uitkomstenruimte, dus nooit een losse uitkomst apart","Elke waarde die groter is dan het gemiddelde"],"a":1,"u":"Een gebeurtenis kan een enkele uitkomst zijn, maar evengoed een groep uitkomsten, bijvoorbeeld 'een even aantal ogen'.","k":"t"},{"t":"2","q":"Je gooit een eerlijke dobbelsteen. Wat is P(even aantal ogen) volgens de klassieke definitie?","o":["1/6, omdat elke zijde van de dobbelsteen een kans van 1/6 heeft","2/6, omdat alleen 2 en 4 als even tellen","1/2, omdat de zes uitkomsten even waarschijnlijk zijn","5/6, omdat enkel de 1 als oneven telt"],"a":2,"u":"A = {2, 4, 6} en S = {1, 2, 3, 4, 5, 6}, dus P(A) = 3/6 = 1/2. De klassieke definitie mag hier omdat alle uitkomsten even waarschijnlijk zijn.","k":"o"},{"t":"2","q":"Iemand berekent de kans om een val van 200 meter te overleven als 1/2, want je overleeft of je overleeft niet. Wat is de fout?","o":["Hij had de complementregel moeten gebruiken","Kansen mogen nooit als breuk geschreven worden","De uitkomstenruimte is verkeerd opgesteld, want er bestaan meer dan twee mogelijke afloopwijzen","De twee uitkomsten zijn niet even waarschijnlijk, dus de klassieke definitie geldt niet"],"a":3,"u":"De klassieke definitie deelt het aantal gunstige uitkomsten door het totaal, maar dat mag alleen als alle uitkomsten even waarschijnlijk zijn. Overleven en niet overleven zijn dat duidelijk niet.","k":"t"},{"t":"2","q":"Je werpt een oranje en een blauwe dobbelsteen en noteert beide resultaten. Hoe ziet het kansmodel eruit?","o":["36 uitkomsten die elk een kans van 1/36 hebben","12 uitkomsten die elk een kans van 1/12 hebben","6 uitkomsten die elk een kans van 1/6 hebben","11 uitkomsten met verschillende kansen"],"a":0,"u":"Elk paar (oranje, blauw) is een aparte uitkomst: 6 x 6 = 36 gelijk waarschijnlijke uitkomsten, elk met kans 1/36.","k":"t"},{"t":"2","q":"Je noteert enkel het totaal aantal ogen van twee eerlijke dobbelstenen. Wat is P(totaal = 5)?","o":["2/36","4/36","5/36","1/36"],"a":1,"u":"Vier van de 36 paren geven samen 5: (1,4), (4,1), (2,3) en (3,2). Dus 4/36 = 1/9.","k":"o"},{"t":"2","q":"Waarom hebben de elf mogelijke totalen bij twee dobbelstenen geen gelijke kansen?","o":["Omdat de uitkomstenruimte oneindig is","Omdat de dobbelstenen niet eerlijk zijn","Omdat sommige totalen op meer manieren tot stand komen dan andere","Omdat 7 het gemiddelde van de verdeling is en daardoor altijd zwaarder doorweegt"],"a":2,"u":"Een totaal van 2 kan enkel via (1,1), maar een totaal van 7 kan op zes manieren. Hoe meer paren tot hetzelfde totaal leiden, hoe groter de kans.","k":"t"},{"t":"2","q":"Vier mensen antwoorden willekeurig ja of nee op een opiniepeiling. Welk model past daarop?","o":["Een keer een dobbelsteen gooien","Vier kaarten trekken uit een spel zonder de getrokken kaarten terug te leggen","Een normaalverdeling met gemiddelde 4","Vier keer een muntstuk opgooien en het aantal keer kruis tellen"],"a":3,"u":"Bij willekeurig antwoorden zijn ja en nee even waarschijnlijk, net als kruis en munt. De uitkomstenruimte voor het aantal keer ja is S = {0, 1, 2, 3, 4}, precies zoals bij vier muntworpen.","k":"t"},{"t":"2","q":"Een rat kiest bij elke trial uit vier foto's en gokt puur op toeval. Hoeveel correcte keuzes verwacht je gemiddeld op 20 trials?","o":["5","10","20","4"],"a":0,"u":"Per trial is de kans op de juiste foto 1/4. Over 20 trials verwacht je 20 x 1/4 = 5 toevalstreffers. Alleen resultaten die daar duidelijk boven liggen wijzen op meer dan toeval.","k":"o"},{"t":"2","q":"Een kansmodel geeft de leeftijdsgroepen 18 tot 23 (0,57), 24 tot 29 (0,17), 30 tot 39 (0,14) en 40 of meer (0,12). Wat is de kans dat een student niet in de groep 18 tot 23 zit?","o":["0,29","0,43","0,57","0,88"],"a":1,"u":"Complementregel: P(niet A) = 1 - P(A) = 1 - 0,57 = 0,43. De vier kansen samen geven 1, dus het model klopt.","k":"o"},{"t":"2","q":"Historische muntexperimenten gaven proporties kruis van 0,5069, 0,5016 en 0,5067. Wat illustreren die cijfers?","o":["Dat kansen alleen theoretisch bestaan","Dat echte munten door slijtage systematisch naar een van beide zijden neigen","Dat de proportie kruis bij zeer veel worpen dicht bij 0,5 komt te liggen","Dat de kans op kruis afhangt van wie er gooit"],"a":2,"u":"De veronderstelling P(kruis) = 1/2 wordt bevestigd door de praktijk: hoe meer worpen, hoe dichter de waargenomen proportie bij de theoretische kans komt.","k":"t"},{"t":"2","q":"Welke twee basisregels moeten altijd gelden in een kansmodel?","o":["Elke kans is groter dan 0, en de som is kleiner dan 1","Elke kans is een breuk, en de noemer is het aantal uitkomsten","Elke kans is even groot, en er zijn minstens twee uitkomsten","Elke kans ligt tussen 0 en 1, en de som van alle kansen is 1"],"a":3,"u":"Regel 1: 0 is kleiner dan of gelijk aan P(A), en P(A) is kleiner dan of gelijk aan 1. Regel 2: P(S) = 1, dus alle kansen samen geven precies 1.","k":"t"},{"t":"3","q":"Wat is de algemene somregel voor twee willekeurige gebeurtenissen A en B?","o":["P(A of B) = P(A) + P(B) - P(A en B)","P(A of B) = P(A) x P(B)","P(A of B) = P(A) + P(B) + P(A en B)","P(A of B) = P(A) + P(B)"],"a":0,"u":"Wie gewoon optelt, telt de overlap dubbel. Daarom trek je P(A en B) er weer af. Zijn A en B disjunct, dan is die doorsnede leeg en valt de correctie weg.","k":"t"},{"t":"3","q":"A, B en C zijn disjuncte gebeurtenissen. Wat is de kans dat er minstens een van de drie optreedt?","o":["1 - P(A) - P(B) - P(C)","P(A) + P(B) + P(C)","P(A) + P(B) + P(C) - P(A en B en C)","P(A) x P(B) x P(C)"],"a":1,"u":"Disjunct betekent dat de gebeurtenissen geen enkele uitkomst delen. Er valt dus niets dubbel geteld te worden en je mag de kansen gewoon optellen.","k":"t"},{"t":"3","q":"Van een gebeurtenis A weet je dat P(A) = 0,35. Wat is de kans op het complement van A?","o":["0,35","0,50","0,65","Dat hangt af van de andere gebeurtenissen in S"],"a":2,"u":"Complementregel: P(niet A) = 1 - P(A) = 1 - 0,35 = 0,65. Je hebt daarvoor verder niets over S nodig.","k":"o"},{"t":"3","q":"Hoe is de voorwaardelijke kans P(A gegeven B) gedefinieerd?","o":["P(A en B) gedeeld door P(A)","P(A) gedeeld door P(A of B)","P(A) x P(B)","P(A en B) gedeeld door P(B)"],"a":3,"u":"Je verkleint de uitkomstenruimte tot B: van alle gevallen waarin B optreedt, kijk je welk deel ook A oplevert. Vandaar P(A en B) / P(B), met P(B) niet gelijk aan 0.","k":"t"},{"t":"3","q":"Je gooit een eerlijke dobbelsteen. A = meer dan 2 ogen, B = een even aantal ogen. Wat is P(A gegeven B)?","o":["2/3","3/4","1/3","1/2"],"a":0,"u":"B = {2, 4, 6}, en daarvan zijn er twee groter dan 2 (namelijk 4 en 6). Dus P(A gegeven B) = 2/3. Zonder die voorwaarde was het 4/6 geweest.","k":"o"},{"t":"3","q":"Zelfde dobbelsteen. A = een even aantal ogen, B = minstens 4 ogen. Wat is P(B gegeven A)?","o":["1/2","2/3","1/6","1/3"],"a":1,"u":"A = {2, 4, 6}. Daarvan zijn 4 en 6 minstens 4, dus P(B gegeven A) = 2/3. Let op: je deelt door het aantal even ogen, niet door 6.","k":"o"},{"t":"3","q":"Wat zegt de algemene productregel voor twee gebeurtenissen?","o":["P(A en B) = P(A gegeven B) gedeeld door P(B)","P(A en B) = P(A) x P(B)","P(A en B) = P(B) x P(A gegeven B)","P(A en B) = P(A) + P(B) - P(A of B)"],"a":2,"u":"Dit volgt rechtstreeks uit de definitie van de voorwaardelijke kans en geldt ook als A en B afhankelijk zijn. Enkel bij onafhankelijkheid wordt het P(A) x P(B).","k":"t"},{"t":"3","q":"Je trekt drie harten na elkaar uit een spel van 52 kaarten, zonder teruglegging. Hoe bereken je die kans?","o":["(13/52) + (12/51) + (11/50)","(13 x 12 x 11) gedeeld door 52","(13/52) x (13/52) x (13/52)","(13/52) x (12/51) x (11/50)"],"a":3,"u":"Zonder teruglegging verandert de situatie na elke trekking. Met de productregel voor afhankelijke gebeurtenissen: (13/52) x (12/51) x (11/50), ongeveer 1,3 procent.","k":"o"},{"t":"3","q":"Welk paar gebeurtenissen is waarschijnlijk NIET onafhankelijk?","o":["Correct antwoorden op twee opeenvolgende meerkeuzevragen","Het geslacht van twee babys van twee verschillende moeders","Twee keer na elkaar een dobbelsteen gooien","Correct gokken op twee opeenvolgende meerkeuzevragen"],"a":0,"u":"Wie de eerste vraag echt kent, kent de tweede vaak ook: kennis werkt door. Bij zuiver gokken speelt dat niet, en dobbelstenen of babys van verschillende moeders hebben geen onderling verband.","k":"t"},{"t":"3","q":"Je gooit twee keer een eerlijke munt. Wat is de kans op twee keer kruis?","o":["1/3","1/4","3/4","1/2"],"a":1,"u":"De steekproefruimte is KK, KM, MK en MM, allemaal even waarschijnlijk. P(KK) = 1/4, wat ook uit de productregel volgt: 1/2 x 1/2.","k":"o"},{"t":"3","q":"Van de internetgebruikers is 29 procent 18 tot 29 jaar (47 procent daarvan chat), 47 procent is 30 tot 49 jaar (21 procent chat) en 24 procent is 50-plus (7 procent chat). Hoe groot is de kans dat een toevallige gebruiker chat?","o":["Ongeveer 33 procent","Ongeveer 14 procent","Ongeveer 25 procent","Ongeveer 47 procent"],"a":2,"u":"Je telt de drie takken van het boomdiagram op: 0,29 x 0,47 + 0,47 x 0,21 + 0,24 x 0,07 = 0,1363 + 0,0987 + 0,0168 = 0,2518, dus ongeveer 25 procent.","k":"o"},{"t":"3","q":"Een student neemt in 30 procent van de gevallen de bus (kans op controle 20 procent) en anders de metro (kans op controle 10 procent). Hij wordt gecontroleerd. Wat is de kans dat dit in de bus gebeurde?","o":["60 procent","20 procent","30 procent","46 procent"],"a":3,"u":"P(bus en controle) = 0,3 x 0,2 = 0,06 en P(metro en controle) = 0,7 x 0,1 = 0,07, samen 0,13. Bayes: 0,06 / 0,13 = 0,46, dus ongeveer 46 procent.","k":"o"},{"t":"3","q":"Diezelfde student heeft per traject 13 procent kans om gecontroleerd te worden. Wat is de kans dat hij op vijf trajecten nooit betrapt wordt?","o":["Ongeveer 50 procent","Ongeveer 65 procent","Ongeveer 87 procent","Ongeveer 35 procent"],"a":0,"u":"Per traject is de kans om niet betrapt te worden 0,87. De trajecten zijn onafhankelijk, dus 0,87^5 = 0,498, dus ongeveer 50 procent.","k":"o"},{"t":"3","q":"Bij vrouwen van 20 tot 30 jaar is de incidentie van borstkanker 0,04 procent. Een mammografie detecteert 80 procent van de gevallen, maar geeft bij gezonde vrouwen 10 procent vals-positieven. Hoe groot is P(kanker gegeven positieve test)?","o":["Ongeveer 8 procent","Ongeveer 0,3 procent","Ongeveer 80 procent","Ongeveer 20 procent"],"a":1,"u":"Bayes: (0,0004 x 0,8) gedeeld door (0,0004 x 0,8 + 0,9996 x 0,1) = 0,00032 / 0,10028 = 0,0032. Omdat de ziekte zo zeldzaam is, zijn bijna alle positieve uitslagen vals-positief.","k":"o"},{"t":"3","q":"Wat leert het mammografievoorbeeld over een goede test bij een zeldzame aandoening?","o":["Vals-positieven verdwijnen als de test vaker wordt herhaald","Een hoge sensitiviteit garandeert een hoge kans op ziekte na een positieve test","Zelfs bij een goede test kunnen de meeste positieve uitslagen vals-positief zijn","De kans op ziekte na een positieve test is gelijk aan de sensitiviteit"],"a":2,"u":"P(positief gegeven kanker) en P(kanker gegeven positief) zijn twee verschillende dingen. Bij een lage incidentie wegen de vals-positieven uit de grote gezonde groep veel zwaarder.","k":"t"},{"t":"3","q":"Waarvoor gebruik je een boomdiagram in de kansrekening?","o":["Om de spreiding van een continue variabele in beeld te brengen met een kromme","Om te tonen dat twee gebeurtenissen disjunct zijn","Om een steekproefgemiddelde te schatten","Om opeenvolgende gebeurtenissen en hun kansen stap voor stap uit te tekenen"],"a":3,"u":"Elke tak is een stap met een voorwaardelijke kans. Vermenigvuldigen langs een tak geeft de kans op dat pad, en optellen over de takken geeft de totale kans.","k":"t"},{"t":"3","q":"Je gooit twee dobbelstenen. Wat is de kans dat je exact één 6 gooit?","o":["10/36","12/36","1/6","5/36"],"a":0,"u":"Eén 6 kan op twee manieren: (6, geen 6) of (geen 6, 6). P = 2 × (1/6)(5/6) = 10/36 ≈ 27,8%.","k":"o"},{"t":"3","q":"100 personen: 60% is vrouw, 70% vlucht, en 75% van de mannen vlucht. Wat is P(man | niet-vluchten)?","o":["25%","33,33%","80%","10%"],"a":1,"u":"P(man)=0,4. P(niet vluchten | man)=1−0,75=0,25. P(niet vluchten)=1−0,70=0,30. Bayes: P(man | niet vl.) = 0,25·0,4 / 0,30 = 0,1/0,3 = 33,33%.","k":"o"},{"t":"3","q":"2500 deelnemers: 1200 hebben chronische stress, 1150 hebben slaaptekort, 785 hebben beide. Welke uitspraak is FOUT?","o":["P(stress ∪ slaaptekort) = 62,60%","P(stress ∩ géén slaaptekort) = 16,60%","Stress en slaaptekort zijn niet-disjunct","P(stress ∩ slaaptekort) = 31,70%"],"a":3,"u":"P(stress ∩ slaaptekort) = 785/2500 = 31,40% (niet 31,70%). De rest klopt: ∪ = (1200+1150−785)/2500 = 62,60%; stress ∩ géén slaaptekort = (1200−785)/2500 = 16,60%.","k":"o"},{"t":"3","q":"4 ballen (zwart, geel, rood, groen). Je trekt ze alle 4 zonder teruglegging. Wat is de kans dat je zwart–geel–rood in die volgorde trekt (de eerste drie)?","o":["0,25","0,0166","0,0833","0,0417"],"a":3,"u":"P = 1/4 · 1/3 · 1/2 = 1/24 ≈ 0,0417. (De vierde bal is dan automatisch groen.)","k":"o"},{"t":"3","q":"Wanneer zijn twee gebeurtenissen A en B stochastisch ONAFHANKELIJK?","o":["Als P(A∩B) = P(A) + P(B)","Als P(A∩B) = P(A) · P(B)","Als ze disjunct zijn","Als P(A) = P(B)"],"a":1,"u":"Onafhankelijk ⇔ P(A∩B) = P(A)·P(B) (en dan ook P(B|A) = P(B)). Let op: disjunct (elkaar uitsluitend) is iets ánders dan onafhankelijk.","k":"t"},{"t":"3","q":"Studenten doen mee aan experiment A (60%), experiment B (70%), of geen experiment (10%). Wat is de kans dat iemand aan énkel experiment B meedoet?","o":["50%","30%","40%","20%"],"a":1,"u":"P(A of B) = 1 − P(geen) = 0,90. P(A én B) = P(A) + P(B) − P(A∪B) = 0,6 + 0,7 − 0,9 = 0,4. P(alleen B) = P(B) − P(A én B) = 0,7 − 0,4 = 0,30.","k":"o"},{"t":"4","q":"Wat is een stochastische variabele?","o":["Een variabele met getalwaarden die de uitkomsten van een toevalsproces beschrijven","Elke variabele die in een steekproef gemeten wordt","Een variabele waarvan de waarde vooraf vastligt","Een variabele die enkel nominale categorieen aanneemt en dus niet berekend kan worden"],"a":0,"u":"Een stochastische variabele koppelt getallen aan de uitkomsten van een toevalsproces. De kansverdeling geeft daarbij welke waarden mogelijk zijn en met welke kans.","k":"t"},{"t":"4","q":"Je gooit drie keer een eerlijke munt en X is het aantal keer kruis. Wat is P(X = 2)?","o":["2/8","3/8","4/8","1/8"],"a":1,"u":"Van de acht even waarschijnlijke uitkomsten geven er drie precies twee keer kruis: KKM, KMK en MKK. Dus 3/8.","k":"o"},{"t":"4","q":"Zelfde experiment met drie muntworpen. Wat is P(X groter dan of gelijk aan 2)?","o":["1/8","3/8","1/2","5/8"],"a":2,"u":"P(X = 2) + P(X = 3) = 3/8 + 1/8 = 4/8 = 1/2.","k":"o"},{"t":"4","q":"Waaraan moeten de kansen in een discrete kansverdeling voldoen?","o":["Elke kans is groter dan 0, en samen geven ze minder dan 1","Alle kansen zijn even groot","De grootste kans hoort bij de grootste waarde","Elke kans ligt tussen 0 en 1, en samen geven ze 1"],"a":3,"u":"Dat zijn precies de twee voorwaarden. De kans op een gebeurtenis is dan de som van de kansen van de waarden die tot die gebeurtenis horen.","k":"t"},{"t":"4","q":"Wat is het verschil tussen een discrete en een continue stochastische variabele?","o":["Een discrete variabele neemt een op te sommen verzameling waarden aan, een continue alle waarden in een interval","Een discrete variabele kan negatief zijn, een continue niet","Een discrete variabele heeft geen verwachting","Een discrete variabele komt voort uit metingen met een toestel, terwijl een continue variabele uit tellingen ontstaat"],"a":0,"u":"Tellen geeft meestal discrete variabelen, meten meestal continue. Bij een continue variabele zitten er tussen twee waarden altijd nog oneindig veel andere.","k":"t"},{"t":"4","q":"Waarom krijgt elke afzonderlijke waarde van een continue variabele kans 0?","o":["Omdat continue variabelen in de praktijk altijd worden afgerond, waardoor een exacte waarde nooit voorkomt","Omdat er oneindig veel mogelijke waarden zijn, zodat enkel intervallen een kans groter dan 0 hebben","Omdat de dichtheidskromme onder de x-as ligt","Omdat de kans altijd wordt afgerond"],"a":1,"u":"Bij een continue variabele is de kans de oppervlakte onder de dichtheidskromme. De oppervlakte boven een enkel punt is nul, dus alleen intervallen hebben een kans.","k":"t"},{"t":"4","q":"Hoe lees je een kans af bij een continue stochastische variabele?","o":["Als het gemiddelde van de twee grenswaarden van het gekozen interval","Als de hoogte van de dichtheidskromme op dat punt","Als de oppervlakte onder de dichtheidskromme boven dat interval","Als de helling van de dichtheidskromme"],"a":2,"u":"De kans is altijd een oppervlakte. De totale oppervlakte onder de dichtheidskromme is 1, precies zoals de som van alle kansen bij een discrete variabele.","k":"t"},{"t":"4","q":"X is uniform verdeeld tussen 0 en 1. Wat is P(X kleiner dan of gelijk aan 0,5 of X groter dan 0,8)?","o":["0,8","0,3","0,5","0,7"],"a":3,"u":"De twee stukken zijn disjunct, dus je telt de oppervlakten op: 0,5 + 0,2 = 0,7. De hoogte van de uniforme dichtheidskromme is hier 1.","k":"o"},{"t":"4","q":"Hoe worden normaalverdelingen in de kansrekening gebruikt?","o":["Als dichtheidskromme, zodat je kansen van intervallen kan berekenen","Als telmethode om het aantal discrete uitkomsten in de steekproef te bepalen","Als vervanging voor de somregel","Enkel om steekproeven te trekken"],"a":0,"u":"De normaalverdeling is een dichtheidskromme. Door te standaardiseren naar z-scores herleid je elke normaalverdeling tot de standaardnormaalverdeling N(0,1), waarvan de oppervlakten in tabellen staan.","k":"t"},{"t":"4","q":"Wat doet standaardiseren met een normaal verdeelde variabele?","o":["Het maakt de verdeling symmetrisch","Het herleidt N(mu, sigma) via een lineaire transformatie tot N(0,1)","Het verandert de vorm van de verdeling van scheef naar symmetrisch normaal","Het verkleint de steekproef"],"a":1,"u":"De z-score (x min mu, gedeeld door sigma) is een lineaire transformatie. De vorm blijft dus gelijk, alleen het centrum wordt 0 en de standaardafwijking 1.","k":"t"},{"t":"4","q":"De APGAR-scores 0 tot 10 hebben kansen die samen 1 geven, met de grootste kansen bij 8 en 9. Hoe beschrijf je die verdeling?","o":["Uniform, want alle scores zijn even waarschijnlijk","Symmetrisch rond 5","Links-scheef, want de meeste babys halen een vrij hoge score","Rechts-scheef, want lage scores komen het vaakst voor"],"a":2,"u":"De hoge waarden dragen het grootste deel van de kansmassa en de staart loopt naar links uit. De kans op een score onder 6 is klein.","k":"t"},{"t":"4","q":"Voor de APGAR-verdeling geldt P(X groter dan of gelijk aan 7) = 0,908. Hoe interpreteer je dat?","o":["Ruim 90 procent van de pasgeborenen behaalt precies de score 7 bij de eerste meting","De gemiddelde score is 0,908","Score 7 komt in 90,8 procent van de gevallen voor","Ruim 90 procent van de pasgeborenen haalt een score die op een gezonde baby wijst"],"a":3,"u":"Je telt de kansen van de waarden 7 tot en met 10 op. De kans dat een toevallig gekozen pasgeborene in die groep valt, is 0,908.","k":"t"},{"t":"5","q":"Hoe bereken je de verwachting E(X) van een discrete stochastische variabele?","o":["Als de som van elke waarde vermenigvuldigd met haar kans","Als de waarde met de grootste kans","Als de som van alle waarden gedeeld door het aantal waarden","Als de mediaan van de kansverdeling"],"a":0,"u":"De verwachting is een gewogen gemiddelde: elke uitkomst telt mee volgens haar kans. Een gewoon gemiddelde van de waarden zou de kansen negeren.","k":"t"},{"t":"5","q":"Bij een loterij noem je een getal van 0 tot 999 en win je 500 euro bij een treffer. Wat is de verwachting van de opbrengst?","o":["500 euro","0,50 euro","1 euro","5 euro"],"a":1,"u":"E(X) = 500 x (1/1000) + 0 x (999/1000) = 0,50 euro. Kost deelnemen 1 euro, dan verlies je gemiddeld 0,50 euro per spel.","k":"o"},{"t":"5","q":"De verwachting van de APGAR-score is 8,128. Wat betekent dat getal?","o":["Dat 8,128 de mediaan van de verdeling is","Dat 8,128 de score is die bij pasgeborenen het vaakst wordt waargenomen in de kliniek","Dat de gemiddelde score op lange termijn 8,128 bedraagt bij heel veel toevallig gekozen babys","Dat elke baby ongeveer 8,128 scoort"],"a":2,"u":"De verwachting is het langetermijngemiddelde over heel veel herhalingen. Het is geen typische score van een individuele baby.","k":"t"},{"t":"5","q":"Moet de verwachting van een stochastische variabele zelf een mogelijke uitkomst zijn?","o":["Ja, maar alleen bij discrete variabelen","Nee, maar ze ligt altijd precies in het midden van alle mogelijke uitkomsten","Ja, anders is de berekening fout","Nee, het is een berekende waarde die zelfs geen geheel getal hoeft te zijn"],"a":3,"u":"De APGAR-verwachting 8,128 is geen mogelijke score, want er zijn enkel gehele scores. De verwachting geeft het te verwachten gemiddelde, niet een concrete uitkomst.","k":"t"},{"t":"5","q":"Wat zegt de wet van de grote getallen?","o":["Dat het steekproefgemiddelde het populatiegemiddelde mu benadert naarmate het aantal waarnemingen toeneemt","Dat de variantie kleiner wordt naarmate de waarden groter worden","Dat elke reeks waarnemingen vanzelf perfect symmetrisch rond het populatiegemiddelde komt te liggen","Dat grote steekproeven altijd normaal verdeeld zijn"],"a":0,"u":"Neem je onafhankelijke waarnemingen uit een populatie met eindige verwachting mu, dan schuift het steekproefgemiddelde bij toenemende n steeds dichter naar mu.","k":"t"},{"t":"5","q":"Waarom is de intuitie over korte reeksen vaak fout, bijvoorbeeld bij drie keer kruis na elkaar?","o":["Omdat de wet van de grote getallen enkel opgaat bij dobbelstenen en niet bij munten","Omdat mensen verwachten dat het langetermijnpatroon ook in korte reeksen zichtbaar is","Omdat munten in korte reeksen niet eerlijk zijn","Omdat de kans op kruis stijgt na elke munt"],"a":1,"u":"De regelmaat geldt pas op lange termijn. In korte reeksen zijn series juist gewoon, en toch worden hun kansen stelselmatig onderschat.","k":"t"},{"t":"5","q":"Hoe bereken je de variantie van een discrete stochastische variabele X met verwachting mu?","o":["Als het kwadraat van de verwachting","Als de som van de kwadraten van alle mogelijke waarden in de verdeling, gedeeld door hun aantal","Als de som van (x min mu) in het kwadraat, telkens vermenigvuldigd met de kans van x","Als het gemiddelde van de afwijkingen van mu"],"a":2,"u":"Je weegt de kwadratische afwijkingen van mu met hun kansen. De standaardafwijking is daarna de vierkantswortel uit die variantie.","k":"t"},{"t":"5","q":"De standaarddeviatie van de APGAR-score is 1,437 bij een verwachting van 8,128. Wat betekent dat?","o":["Dat de laagste score 1,437 is","Dat de variantie 1,437 bedraagt","Dat 1,437 procent van de pasgeborenen afwijkt van de gemiddelde score van 8,128","Dat een toevallig gekozen score gemiddeld ongeveer 1,4 punten van 8,128 afwijkt"],"a":3,"u":"De standaarddeviatie is de typische afstand tot de verwachting, in dezelfde eenheid als de scores. De variantie is hier het kwadraat, ongeveer 2,065.","k":"t"},{"t":"5","q":"De gemiddelde temperatuur is 10,54 graden Celsius. Wat is het gemiddelde in Fahrenheit, met F = 32 + 9/5 x C?","o":["50,97","59,00","18,97","42,54"],"a":0,"u":"Regel 1 voor verwachtingen: mu(a + bX) = a + b x mu(X). Dus 32 + 1,8 x 10,54 = 50,97 graden Fahrenheit.","k":"o"},{"t":"5","q":"Studenten maken gemiddeld 1,3 spelfouten en 3,2 redeneerfouten. Hoeveel fouten van beide soorten samen verwacht je gemiddeld?","o":["4,16","4,5","1,9","2,25"],"a":1,"u":"Regel 2 voor verwachtingen: mu(X + Y) = mu(X) + mu(Y) = 1,3 + 3,2 = 4,5. Dit geldt altijd, ook als de twee soorten fouten samenhangen.","k":"o"},{"t":"5","q":"X is een stochastische variabele en a en b zijn vaste getallen. Wat is de variantie van a + bX?","o":["sigma kwadraat van X","b x sigma kwadraat van X","b kwadraat x sigma kwadraat van X","a + b kwadraat x sigma kwadraat van X"],"a":2,"u":"Een constante optellen verschuift de verdeling zonder de spreiding te veranderen, dus a valt weg. Vermenigvuldigen met b schaalt de standaardafwijking met b, en dus de variantie met b kwadraat.","k":"t"},{"t":"5","q":"X en Y zijn onafhankelijk. Wat geldt voor de variantie van het verschil X min Y?","o":["Ze is altijd 0","Ze is gelijk aan de variantie van X","Ze is gelijk aan de variantie van X min die van Y","Ze is gelijk aan de som van beide varianties"],"a":3,"u":"Bij onafhankelijkheid tellen varianties op, ook bij een verschil: sigma kwadraat van X min Y is sigma kwadraat van X plus sigma kwadraat van Y. Onzekerheid trek je niet van elkaar af.","k":"t"},{"t":"5","q":"X en Y zijn positief gecorreleerd. Wat gebeurt er met de variantie van X + Y ten opzichte van het geval zonder samenhang?","o":["Ze wordt groter, want er komt een term met de covariantie bij","Ze wordt kleiner, want de samenhang dempt de spreiding","Ze blijft precies gelijk","Ze wordt altijd nul"],"a":0,"u":"Regel 3: sigma kwadraat van X + Y = sigma kwadraat van X + sigma kwadraat van Y + 2 x de covariantie. Bij een positieve correlatie is die extra term positief.","k":"t"},{"t":"5","q":"Wat wordt bedoeld met steekproevenvariabiliteit?","o":["Dat de metingen binnen een steekproef onderling van persoon tot persoon verschillen","Dat de waarde van een steekproefgrootheid verschilt van steekproef tot steekproef","Dat de populatie zelf verandert in de tijd","Dat een steekproef nooit aselect kan zijn"],"a":1,"u":"Elke nieuwe aselecte steekproef geeft een ander steekproefgemiddelde. Precies die variabiliteit maakt het nodig om met kansen en betrouwbaarheidsintervallen te werken.","k":"t"},{"t":"5","q":"Een variabele N = W − H. De correlatie tussen W en H is −0,7; de variantie van W is 25 en van H is 16. Wat is de variantie van N?","o":["9","13","69","41"],"a":2,"u":"Var(W − H) = Var(W) + Var(H) − 2·Cov(W,H). Cov = r·σ_W·σ_H = −0,7·√25·√16 = −0,7·5·4 = −14. Dus Var = 25 + 16 − 2·(−14) = 41 + 28 = 69.","k":"o"},{"t":"6","q":"Wat is het verschil tussen een parameter en een karakteristieke waarde?","o":["Een parameter is geschat, een karakteristieke waarde is exact gekend in de populatie","Een parameter beschrijft een steekproef, een karakteristieke waarde de populatie","Een parameter beschrijft de populatie, een karakteristieke waarde wordt uit de steekproefdata berekend","Een parameter is altijd een gemiddelde, terwijl een karakteristieke waarde altijd een proportie in de steekproef is"],"a":2,"u":"Parameters horen bij de populatie en krijgen Griekse letters, zoals mu en sigma. Een karakteristieke waarde (een statistiek) reken je uit op je steekproef en gebruik je vaak als schatter van de parameter.","k":"t"},{"t":"6","q":"Wat is een steekproevenverdeling (sampling distribution)?","o":["De verdeling van de meetfouten in een onderzoek","De frequentieverdeling van alle waarden die in een concrete steekproef zijn gemeten en genoteerd","De verdeling van de waarden in de hele populatie","De verdeling van een steekproefgrootheid over alle mogelijke steekproeven van dezelfde grootte"],"a":3,"u":"Let op het verschil met de steekproefverdeling, die je gewoon in je data ziet. De steekproevenverdeling is theoretisch: ze zegt hoe bijvoorbeeld het gemiddelde varieert van steekproef tot steekproef.","k":"t"},{"t":"6","q":"Aan welke vier voorwaarden moet een binomiale situatie voldoen?","o":["Binair, onafhankelijk, vooraf bepaald aantal pogingen, constante succeskans","Normaal verdeeld, voldoende groot, zuiver aselect en zonder uitschieters in de data","Binair, gepaard, groot en symmetrisch","Onafhankelijk, continu, aselect en met teruglegging"],"a":0,"u":"Het ezelsbruggetje is BOAS: Binair (succes of mislukking), Onafhankelijk, Aantal pogingen n ligt vooraf vast, en de Succeskans p blijft bij elke poging gelijk.","k":"t"},{"t":"6","q":"Wat geeft de binomiaalcoefficient C(n,k) weer?","o":["De kans op k successen","Het aantal volgorden waarin k successen kunnen voorkomen in n pogingen","Het gemiddelde aantal successen","Het aantal mislukkingen dat je bij n opeenvolgende pogingen mag verwachten"],"a":1,"u":"C(n,k) telt de plaatsingen: op hoeveel manieren k successen over n pogingen verdeeld kunnen liggen. Vermenigvuldig je dat met de kans op een specifieke volgorde, dan krijg je de binomiale kans.","k":"t"},{"t":"6","q":"Hoe luidt de binomiale kansformule voor P(X = k)?","o":["n x p^k x (1 - p)","p^k x (1 - p)^(n - k)","C(n,k) x p^k x (1 - p)^(n - k)","C(n,k) x p x (1 - p)"],"a":2,"u":"De kans op een bepaalde volgorde met k successen is p^k x (1-p)^(n-k). Omdat de volgorde niet uitmaakt, vermenigvuldig je met het aantal mogelijke volgorden, C(n,k).","k":"t"},{"t":"6","q":"Twee ouders hebben per kind 25 procent kans op bloedgroep O en krijgen vijf kinderen. Wat is de kans dat precies drie kinderen bloedgroep O hebben?","o":["Ongeveer 25 procent","Ongeveer 60 procent","Ongeveer 1,5 procent","Ongeveer 8,8 procent"],"a":3,"u":"X is binomiaal met n = 5 en p = 0,25. P(X = 3) = C(5,3) x 0,25^3 x 0,75^2 = 10 x 0,015625 x 0,5625 = 0,088.","k":"o"},{"t":"6","q":"Bij diezelfde ouders is de kans op meer dan drie kinderen met bloedgroep O ongeveer 1,5 procent. Wat besluit je daaruit?","o":["Vier of vijf kinderen met bloedgroep O is een opmerkelijk resultaat","Dat is een heel gewoon resultaat bij p = 0,25","De kans op bloedgroep O moet in dit gezin groter zijn dan de opgegeven 0,25","De binomiale verdeling is hier niet bruikbaar"],"a":0,"u":"P(X = 4) + P(X = 5) = 0,0146 + 0,0010 = 0,0156. Zoiets gebeurt in ongeveer een op de 64 gezinnen, dus het is zeldzaam genoeg om verbaasd te zijn.","k":"o"},{"t":"6","q":"Bij tien procent van de CDs zit een ernstige fout. Je controleert er tien uit een levering van 10000. Waarom mag je hier de binomiale verdeling gebruiken?","o":["Omdat je met teruglegging trekt","Omdat de populatie veel groter is dan de steekproef, met als vuistregel N groter dan of gelijk aan 20n","Omdat tien een even getal is","Omdat de fouten bij de productie normaal verdeeld zijn rond een vast gemiddelde per levering van tienduizend stuks"],"a":1,"u":"Strikt genomen trek je zonder teruglegging, dus de pogingen zijn niet perfect onafhankelijk. Bij N groter dan of gelijk aan 20n is dat verschil verwaarloosbaar en werkt B(n, p) als benadering.","k":"t"},{"t":"6","q":"X is binomiaal verdeeld met n = 10 en p = 0,1. Wat is P(X = 0)?","o":["0,9000","0,1000","0,3487","0,5000"],"a":2,"u":"P(X = 0) = 0,9^10 = 0,3487. Er is dus ruim 34 procent kans dat een controle van tien stuks geen enkele fout opmerkt.","k":"o"},{"t":"6","q":"Wat zijn de verwachting en de standaarddeviatie van een binomiaal verdeelde X?","o":["mu = p en sigma = wortel uit p(1 - p)","mu = n(1 - p) en sigma = np","mu = np en sigma = np(1 - p)","mu = np en sigma = wortel uit np(1 - p)"],"a":3,"u":"Deze formules gelden uitsluitend voor binomiale verdelingen. Vergeet de vierkantswortel niet: np(1-p) zonder wortel is de variantie.","k":"t"},{"t":"6","q":"In een steekproef van 2500 mensen is p = 0,60. Wat is de verwachting van het aantal successen?","o":["1500","2500","600","1000"],"a":0,"u":"mu = np = 2500 x 0,60 = 1500. De standaarddeviatie is de wortel uit 2500 x 0,6 x 0,4 = wortel uit 600, dus ongeveer 24,5.","k":"o"},{"t":"6","q":"Wat is het verschil tussen een steekproefaantal en een steekproeffractie?","o":["Er is geen verschil, het zijn twee namen voor hetzelfde","Een aantal loopt van 0 tot n, een fractie is een proportie tussen 0 en 1","Een aantal is continu, een fractie is discreet","Een aantal hoort bij de populatie, een fractie bij de steekproef"],"a":1,"u":"De fractie is het aantal gedeeld door n. Beide beschrijven hetzelfde resultaat, maar op een andere schaal, en ze hebben dus ook een andere standaarddeviatie.","k":"t"},{"t":"6","q":"Wat is de standaarddeviatie van een steekproefproportie?","o":["p(1 - p) gedeeld door de wortel uit n","De wortel uit p(1 - p)","De wortel uit de breuk p(1 - p)/n","De wortel uit np(1 - p)"],"a":2,"u":"Voor de proportie deel je de binomiale spreiding door n, wat de wortel uit p(1-p)/n oplevert. De spreiding krimpt dus naarmate de steekproef groeit.","k":"t"},{"t":"6","q":"Wanneer mag je een binomiale verdeling benaderen met een normaalverdeling?","o":["Als p ongeveer 0,5 bedraagt","Als de populatie waaruit je de steekproef trekt zelf al normaal verdeeld is","Als n groter is dan 30","Als np groter dan of gelijk aan 10 en n(1 - p) groter dan of gelijk aan 10"],"a":3,"u":"Beide voorwaarden moeten samen gelden, want anders is de binomiale verdeling nog te scheef. Bij n = 2500 en p = 0,6 zijn np = 1500 en n(1-p) = 1000, dus ruim voldoende.","k":"t"},{"t":"6","q":"Waarom heb je een continuiteitscorrectie nodig bij die benadering?","o":["Omdat de binomiale verdeling discreet is en de normaalverdeling continu","Omdat de steekproef te klein is","Omdat p onbekend is","Omdat de normaalverdeling bij kleine n te scheef uitvalt om bruikbaar te zijn"],"a":0,"u":"Een discrete waarde als X = 8 komt overeen met de strook tussen 7,5 en 8,5 onder de normaalkromme. Zonder die halve eenheid wordt de benadering merkbaar onnauwkeurig.","k":"t"},{"t":"6","q":"Je wil P(X groter dan of gelijk aan 1520) benaderen met de normaalverdeling. Welke grens gebruik je?","o":["1520","1519,5","1520,5","1521"],"a":1,"u":"De klasse rond 1520 loopt van 1519,5 tot 1520,5. Omdat 1520 zelf moet meetellen, begin je de oppervlakte bij de ondergrens 1519,5.","k":"o"},{"t":"6","q":"Voor n = 20 en p = 0,4 is de exacte binomiale P(X kleiner dan of gelijk aan 9) gelijk aan 0,755. Zonder continuiteitscorrectie geeft de normaalbenadering 0,676, met correctie 0,753. Wat leert dat?","o":["Dat de correctie alleen bij grote n nodig is","Dat de normaalbenadering bij deze waarden van n en p nooit bruikbaar is","Dat de correctie de benadering sterk verbetert wanneer np klein is","Dat de exacte berekening fout is"],"a":2,"u":"Bij np = 8 zit je onder de vuistregel van 10, dus de benadering is wankel. De halve eenheid haalt het resultaat toch tot dicht bij de exacte waarde.","k":"t"},{"t":"6","q":"De kans op een glimlach is 0,5% (p = 0,005). Wat is de kans dat exact 2 van de 15 mensen glimlachen?","o":["Kan niet berekend worden","0,25%","2,5%","95%"],"a":1,"u":"Binomiaal B(n=15; p=0,005). P(X=2) = C(15,2)·0,005²·0,995¹³ ≈ 0,25%.","k":"o"},{"t":"6","q":"80% van de kinderen lust ontbijtgranen. Wat is de kans dat minstens 3 van de 8 kleuters ze NIET lusten?","o":["20,31%","79,69%","14,8%","48%"],"a":0,"u":"Niet lusten: p = 0,20. X ~ B(8; 0,20). P(X ≥ 3) = 1 − P(X ≤ 2) = 1 − (0,168 + 0,336 + 0,294) = 1 − 0,797 = 20,31%.","k":"o"},{"t":"6","q":"Ongeveer 30% van de patiënten komt binnen met een depressie. Wat is de kans dat minstens 15 van de 40 patiënten een depressie hebben?","o":["6,2%","19,49%","88,69%","50%"],"a":1,"u":"X ~ B(40; 0,30): µ = 12, σ = √(40·0,3·0,7) = 2,90. Met continuïteitscorrectie: z = (14,5−12)/2,90 = 0,86 → P(Z>0,86) ≈ 19,5% (exact ≈ 19,3%).","k":"o"},{"t":"6","q":"Wat is FOUT?","o":["Inductieve statistiek = op basis van een steekproef een uitspraak doen over de hele populatie","De normaalverdeling is symmetrisch rond het gemiddelde","Een binomiale verdeling is altijd symmetrisch","Bij een continue verdeling maakt het niet uit of je P(X≤a) of P(X<a) neemt"],"a":2,"u":"Een binomiale verdeling is alleen symmetrisch als p = 0,5; bij andere p is ze scheef. De andere uitspraken kloppen: bij een continue verdeling is P(X=x)=0, dus ≤ en < geven hetzelfde; inductieve (inferentiële) statistiek veralgemeent van steekproef naar populatie; de normaalverdeling is inderdaad symmetrisch.","k":"t"},{"t":"7","q":"Waarom noemt men het steekproefgemiddelde een zuivere schatter van mu?","o":["Omdat de berekening enkel opgaat bij populaties die exact normaal verdeeld zijn","Omdat het geen standaardfout heeft","Omdat het altijd exact gelijk is aan mu","Omdat het gemiddeld noch systematisch boven, noch systematisch onder mu ligt"],"a":3,"u":"Zuiver betekent dat de verwachting van de schatter gelijk is aan de parameter. Losse steekproeven wijken uiteraard wel af, maar zonder systematische richting, ook bij scheve populaties.","k":"t"},{"t":"7","q":"Wat is de standaardfout van het steekproefgemiddelde?","o":["sigma gedeeld door de wortel uit n","sigma gedeeld door n","de wortel uit sigma gedeeld door n","sigma"],"a":0,"u":"De standaardfout is de standaarddeviatie van de steekproevenverdeling: sigma gedeeld door de wortel uit n. Ze is dus kleiner dan de spreiding van de individuele waarnemingen.","k":"t"},{"t":"7","q":"Waarom zijn steekproefgemiddelden minder variabel dan individuele waarnemingen?","o":["Omdat het gemiddelde de uitschieters verwijdert","Omdat extreme waarden binnen een steekproef elkaar deels opheffen","Omdat steekproeven altijd aselect zijn","Omdat de populatie bij elke trekking kleiner wordt en daardoor stabieler meet"],"a":1,"u":"In een gemiddelde compenseren hoge en lage waarden elkaar. Daarom krimpt de spreiding met een factor wortel uit n, en niet met n zelf.","k":"t"},{"t":"7","q":"Een populatie is normaal verdeeld met gemiddelde mu en standaarddeviatie sigma. Hoe is het steekproefgemiddelde dan verdeeld?","o":["Altijd rechts scheef","Uniform tussen de kleinste en de grootste waarde","Exact normaal, met gemiddelde mu en standaardfout sigma gedeeld door de wortel uit n","Bij benadering normaal, maar uitsluitend wanneer de steekproef minstens dertig eenheden telt"],"a":2,"u":"Bij een normaal verdeelde populatie is het gemiddelde exact normaal verdeeld, ongeacht n. De centrale limietstelling heb je pas nodig als de populatie niet normaal is.","k":"t"},{"t":"7","q":"Een populatie is sterk rechts scheef. Wat gebeurt er met de steekproevenverdeling van het gemiddelde als n toeneemt van 1 naar 25?","o":["Ze blijft identiek aan de populatieverdeling","Ze wordt uniform","Ze wordt steeds schever","Ze wordt steeds symmetrischer en smaller"],"a":3,"u":"Bij n = 1 is de steekproevenverdeling gelijk aan de populatieverdeling. Hoe groter n, hoe meer de vorm naar een normaalverdeling neigt en hoe kleiner de standaardfout wordt.","k":"t"},{"t":"7","q":"Een onderhoudsbeurt duurt gemiddeld 1 uur met sigma = 1, sterk rechts scheef. Voor 70 toestellen budgetteer je 1,1 uur per toestel. Hoe pak je dit aan?","o":["Je gebruikt de centrale limietstelling, want n = 70 is groter dan 30","Je kan hier niets berekenen zonder de volledige data","Je gebruikt de binomiale verdeling","Je gebruikt de populatieverdeling zelf, want die is sterk rechts scheef"],"a":0,"u":"Met n = 70 mag je de steekproevenverdeling van het gemiddelde als normaal beschouwen: N(1; 1 gedeeld door wortel 70), dus N(1; 0,12). De scheefheid van de populatie zelf speelt dan geen rol meer.","k":"t"},{"t":"7","q":"In dat voorbeeld is er ongeveer 20 procent kans dat het gemiddelde boven 1,1 uur uitkomt. Wat betekent dat voor het budget?","o":["Het budget is zeker voldoende","Er is een op vijf kans dat de techniekers te weinig tijd hebben","Het budget is in 80 procent van de gevallen te ruim berekend","Het gemiddelde zal altijd 1,1 uur bedragen"],"a":1,"u":"Twintig procent kans op overschrijding is niet verwaarloosbaar. Wil je meer zekerheid, dan moet je per toestel meer tijd inschrijven.","k":"t"},{"t":"7","q":"Je verviervoudigt de steekproefgrootte van n naar 4n. Wat gebeurt er met de standaardfout?","o":["Ze wordt twee keer groter","Ze wordt vier keer kleiner","Ze wordt twee keer kleiner","Ze blijft gelijk"],"a":2,"u":"De standaardfout is sigma gedeeld door de wortel uit n. De wortel uit 4n is 2 keer de wortel uit n, dus de standaardfout halveert. Meer precisie kost dus onevenredig veel extra deelnemers.","k":"t"},{"t":"7","q":"X en Y zijn onafhankelijk en normaal verdeeld. Wat geldt voor hun som?","o":["De som is binomiaal verdeeld","De som is uniform verdeeld","Over de som valt niets te zeggen","De som is opnieuw normaal verdeeld"],"a":3,"u":"Elke lineaire combinatie van onafhankelijke normaal verdeelde variabelen is opnieuw normaal verdeeld. De gemiddelden tellen op en, bij onafhankelijkheid, ook de varianties.","k":"t"},{"t":"7","q":"Bij een normaal verdeelde steekproevenverdeling ligt welk aandeel van de steekproefgemiddelden binnen een standaardfout van mu?","o":["Ongeveer 68 procent","Ongeveer 95 procent","Ongeveer 99,7 procent","Ongeveer 50 procent"],"a":0,"u":"Dit is de vuistregel voor normaalverdelingen toegepast op de steekproevenverdeling: ongeveer 68 procent binnen een standaardfout, ongeveer 95 procent binnen twee.","k":"t"},{"t":"7","q":"Het aantal seconden dat wolven huilen is scheef verdeeld met gemiddelde 25 s en standaarddeviatie 7 s. Wat is de kans dat 49 wolven gemiddeld minstens 26 s huilen (door toeval)?","o":["84,13%","ongeveer 20%","Niet genoeg gegevens","15,87%"],"a":3,"u":"Standaardfout = σ/√n = 7/√49 = 1. z = (26−25)/1 = 1, dus P(Z>1) = 1−0,8413 = 15,87%. De centrale limietstelling geldt (n=49 ≥ 30), dus de steekproevenverdeling is ongeveer normaal, ook al is de populatie scheef.","k":"o"},{"t":"7","q":"6 kleuren snoep, je verwacht 1/6 van elke kleur. Merel koopt een kleine zak, Christine een grote. A: minder dan 10% groen. B: meer dan 25% rood. Wat is juist?","o":["A bij klein, B bij groot","Op toevalsbasis niet te zeggen","A én B zijn waarschijnlijker bij de kleine zak","A én B zijn waarschijnlijker bij de grote zak"],"a":2,"u":"A en B zijn beide afwijkingen van het verwachte 1/6 (≈16,7%). Bij een kleinere steekproef is de standaardfout groter, dus zulke afwijkingen zijn waarschijnlijker → beide bij de kleine zak.","k":"t"},{"t":"7","q":"Wat zegt de centrale limietstelling?","o":["De populatie wordt normaalverdeeld bij grote n","Bij n ≥ 30 gaat de verdeling van de steekproef steeds meer op de verdeling van de populatie lijken, ongeacht haar vorm","Als de steekproef groot genoeg is, benadert de steekproevenverdeling een normaalverdeling, ongeacht de vorm van de populatie","Bij n ≥ 30 pas je altijd continuïteitscorrectie toe"],"a":2,"u":"De CLT gaat over de verdeling van het steekproef-GEMIDDELDE: bij voldoende grote n is die ongeveer normaal, ongeacht de vorm van de populatie.","k":"t"},{"t":"7","q":"Wat gebeurt er met de standaardfout (σ/√n) als n toeneemt?","o":["Ze wordt kleiner","Ze blijft gelijk","Ze wordt 0","Ze wordt groter"],"a":0,"u":"Standaardfout = σ/√n. Een grotere n → grotere noemer → kleinere standaardfout → een preciezere schatting van het gemiddelde.","k":"t"},{"t":"8","q":"Wat is het verschil tussen een puntschatting en een intervalschatting?","o":["Een puntschatting werkt enkel bij proporties","Een puntschatting geeft een getal, een intervalschatting geeft een reeks aannemelijke waarden met een betrouwbaarheidsniveau","Een puntschatting is altijd juist, een intervalschatting bij benadering","Een puntschatting hoort bij de populatie, terwijl een intervalschatting enkel iets zegt over de steekproef die je getrokken hebt"],"a":1,"u":"Een puntschatting is een enkele waarde, bijvoorbeeld het steekproefgemiddelde als schatting van mu. Een betrouwbaarheidsinterval geeft er een marge bij en zegt hoe vaak die methode de parameter vangt.","k":"t"},{"t":"8","q":"Welke drie kwaliteitseisen stelt men aan een goede schatter?","o":["Groot, aselect en zonder uitschieters","Discreet, continu en lineair","Zuiver, efficient en consistent","Normaal, symmetrisch en robuust"],"a":2,"u":"Zuiver: gemiddeld gelijk aan de parameter. Efficient: zo klein mogelijke standaardfout. Consistent: bij grotere n komt de schatter dichter bij de echte waarde. Consequent is geen statistische eigenschap.","k":"t"},{"t":"8","q":"Welke schatter is efficienter wanneer twee schatters allebei zuiver zijn?","o":["Die met de grootste verwachting","Die op de mediaan is gebaseerd","Die met de grootste steekproef","Die met de kleinste standaardfout"],"a":3,"u":"Bij gelijke zuiverheid kijk je naar de spreiding: hoe kleiner de standaardfout, hoe minder de schatting van steekproef tot steekproef zwalkt.","k":"t"},{"t":"8","q":"Waarom deel je bij de steekproefvariantie door n min 1 en niet door n?","o":["Omdat delen door n een onzuivere schatter van sigma kwadraat oplevert","Omdat de steekproef altijd te klein is","Omdat de mediaan anders verschuift","Omdat de berekening met n min 1 in de praktijk eenvoudiger uit te voeren is"],"a":0,"u":"Delen door n onderschat de populatievariantie systematisch, want je meet afwijkingen ten opzichte van het steekproefgemiddelde zelf. Delen door n min 1 herstelt die vertekening.","k":"t"},{"t":"8","q":"Waaruit bestaat een betrouwbaarheidsinterval altijd?","o":["Uit het populatiegemiddelde plus of min de standaarddeviatie","Uit de schatting plus of min de foutmarge","Uit de kleinste en de grootste waarneming","Uit de p-waarde en het significantieniveau"],"a":1,"u":"De algemene vorm is schatting plus of min foutmarge. Bij een gemiddelde met gekende sigma is die foutmarge gelijk aan z-ster maal sigma gedeeld door de wortel uit n.","k":"t"},{"t":"8","q":"Bij 500 leerlingen is het gemiddelde 461 en is sigma gelijk aan 100. De standaardfout is dan ongeveer 4,5. Hoe luidt het 95 procent betrouwbaarheidsinterval bij benadering?","o":["Van 459 tot 463","Van 456,5 tot 465,5","Van 452 tot 470","Van 361 tot 561"],"a":2,"u":"Bij 95 procent hoort ongeveer twee standaardfouten: 2 x 4,5 = 9. Het interval loopt dus van 461 min 9 tot 461 plus 9.","k":"o"},{"t":"8","q":"Wat betekent een betrouwbaarheidsniveau van 95 procent precies?","o":["Dat 95 procent van alle waarnemingen in de steekproef netjes binnen het interval valt","Dat de schatting in 95 procent van de gevallen exact klopt","Dat de kans 95 procent is dat mu in dit ene interval ligt","Dat 95 procent van alle mogelijke steekproeven een interval oplevert dat mu bevat"],"a":3,"u":"Het niveau slaat op de methode, niet op dit ene interval. Mu ligt er wel of niet in, dus over een concreet interval mag je geen kansuitspraak doen.","k":"t"},{"t":"8","q":"Welke formulering is fout bij een 95 procent betrouwbaarheidsinterval van 39,02 tot 40,98?","o":["De kans dat mu tussen 39,02 en 40,98 ligt bedraagt 95 procent","Op basis van deze steekproef schatten we mu tussen 39,02 en 40,98","Bij herhaald steekproeven zou 5 procent van de intervallen mu missen","De gevolgde methode vangt mu in 95 procent van alle mogelijke steekproeven"],"a":0,"u":"Mu is een vaste, onbekende waarde en niet toevallig. Zodra het interval berekend is, ligt mu erin of niet, en dan hoort er geen kans meer bij.","k":"t"},{"t":"8","q":"Je verkleint de steekproef van n = 100 naar n = 25. Wat gebeurt er met de breedte van het betrouwbaarheidsinterval?","o":["Ze blijft gelijk","Ze verdubbelt","Ze wordt vier keer groter","Ze halveert"],"a":1,"u":"De foutmarge hangt af van de wortel uit n. Deel je n door vier, dan wordt de wortel gehalveerd en verdubbelt de foutmarge.","k":"t"},{"t":"8","q":"Wat moet je doen om een betrouwbaarheidsinterval te halveren?","o":["Sigma halveren, wat altijd mogelijk is","De steekproefgrootte verdubbelen","De steekproefgrootte verviervoudigen","Het betrouwbaarheidsniveau verdubbelen"],"a":2,"u":"Omdat de wortel uit n in de noemer staat, moet n vier keer groter om de marge te halveren. Meer precisie kost dus snel veel extra deelnemers.","k":"t"},{"t":"8","q":"Je wil mu schatten met een foutmarge van hoogstens 5 punten en 95 procent betrouwbaarheid, met sigma = 100. Hoeveel deelnemers heb je minstens nodig?","o":["2500","Dat hangt af van de populatiegrootte N","400","1537"],"a":3,"u":"n is minstens (1,96 x 100 gedeeld door 5) in het kwadraat, dus 1536,6, wat je naar boven afrondt tot 1537. De grootte van de populatie speelt hierbij geen rol.","k":"o"},{"t":"8","q":"Welke maatregel maakt een betrouwbaarheidsinterval NIET smaller?","o":["Een grotere populatie bestuderen","Een grotere steekproef nemen","Een lager betrouwbaarheidsniveau kiezen","De spreiding sigma verkleinen door betere meetprocedures"],"a":0,"u":"De formule bevat n, sigma en z-ster, maar niet de populatiegrootte N. Een grotere populatie verandert dus niets aan de precisie.","k":"t"},{"t":"8","q":"Onder welke voorwaarden gelden de klassieke formules voor een betrouwbaarheidsinterval voor mu?","o":["Bij elke steekproef, zolang n groter is dan 10","Bij een enkelvoudige aselecte steekproef, met een gekende sigma en zonder grote vertekening","Enkel bij een volledige populatie","Enkel wanneer het waargenomen steekproefgemiddelde samenvalt met de mediaan van de verdeling"],"a":1,"u":"De werkhypothesen zijn streng: een EAS, geen non-respons, een normaal verdeelde variabele en een gekende sigma. Bij ad-hocsteekproeven met onbekende vertekening bestaat er geen correcte inferentie.","k":"t"},{"t":"8","q":"Waarom is het gemiddelde een gevoelige basis voor een betrouwbaarheidsinterval?","o":["Omdat het enkel bij discrete variabelen bestaat","Omdat het niet zuiver is","Omdat het niet robuust is voor uitschieters","Omdat het altijd kleiner is dan de mediaan"],"a":2,"u":"Een enkele extreme waarde trekt het gemiddelde mee en verplaatst het hele interval. Bij kleine steekproeven worden de intervallen bovendien vaak te smal geschat.","k":"t"},{"t":"8","q":"Waarvoor dient bootstrapping?","o":["Om uitschieters te verwijderen","Om sigma te vervangen door de mediaan","Om de steekproef kunstmatig groter te maken dan de populatie waaruit ze getrokken werd, zodat de foutmarge daalt","Om de steekproevenverdeling te benaderen door heel veel hersteekproeven met teruglegging uit de eigen steekproef"],"a":3,"u":"De klassieke formules veronderstellen normaliteit of een grote n. Bij kleine steekproeven uit niet-normale populaties kan je met duizend hersteekproeven de steekproevenverdeling nabootsen.","k":"t"},{"t":"8","q":"Welke eigenschap hoort NIET bij een goede schatter?","o":["Zuiver (onvertekend)","Consistent","Efficiënt","Consequent"],"a":3,"u":"Een goede schatter is zuiver (gemiddeld correct), consistent (beter bij grotere n) en efficiënt (zo klein mogelijke variantie). 'Consequent' is geen statistische eigenschap, verwarring met 'consistent'.","k":"t"},{"t":"9","q":"Wat is het doel van een significantietoets?","o":["Nagaan hoe sterk de data pleiten tegen een bewering over een populatieparameter","De grootte van een effect meten","Een steekproef representatief maken","Sluitend aantonen dat de nulhypothese in de bestudeerde populatie wel degelijk waar is"],"a":0,"u":"Een toets vergelijkt de waargenomen data met een claim. Het resultaat is een kans die aangeeft in welke mate de data met die claim te verzoenen zijn.","k":"t"},{"t":"9","q":"Welke hypothese wordt door de statistische toets zelf getoetst?","o":["De alternatieve hypothese","De nulhypothese","De rivale hypothese","Beide tegelijk"],"a":1,"u":"De toets evalueert de sterkte van de evidentie tegen H0. De alternatieve hypothese is de bewering die je met je onderzoek net wil ondersteunen.","k":"t"},{"t":"9","q":"Een speler beweert 80 procent van zijn vrije worpen te scoren en haalt 32 op 50. Hoe luiden de hypothesen?","o":["H0: p = 0,80 en Ha: p verschillend van 0,64","H0: p = 0,64 en Ha: p groter dan 0,64","H0: p = 0,80 en Ha: p kleiner dan 0,80","H0: p kleiner dan 0,80 en Ha: p = 0,80"],"a":2,"u":"De claim van de speler komt in H0. Omdat de steekproefproportie 0,64 lager ligt, toets je eenzijdig: Ha stelt dat de echte succeskans onder 0,80 ligt.","k":"o"},{"t":"9","q":"Wanneer gebruik je een tweezijdige alternatieve hypothese?","o":["Als de steekproef klein is","Als sigma onbekend is","Als de p-waarde groter uitvalt dan het gekozen significantieniveau","Als je vooraf geen richting van het verschil vooropstelt"],"a":3,"u":"Eenzijdig toets je als je stelt dat de parameter groter of juist kleiner is. Weet je enkel dat er een verschil zou kunnen zijn, dan is Ha tweezijdig.","k":"t"},{"t":"9","q":"Wat drukt de z-toetsingsgrootheid uit?","o":["Hoeveel standaardfouten de schatter afwijkt van de waarde in H0","De kans dat H0 waar is","De grootte van het effect in de populatie","Het aantal waarnemingen dat boven het steekproefgemiddelde uitkomt"],"a":0,"u":"z = (steekproefgemiddelde min mu0) gedeeld door de standaardfout. Grote absolute waarden betekenen dat de data slecht bij H0 passen.","k":"t"},{"t":"9","q":"Wat is de juiste definitie van de p-waarde?","o":["De kans dat de nulhypothese waar is","De kans op een toetsingsgrootheid die minstens zo extreem is, als H0 waar zou zijn","De kans dat je een fout besluit trekt","Het significantieniveau dat de onderzoeker vooraf heeft vastgelegd voor deze toets"],"a":1,"u":"De p-waarde is een voorwaardelijke kans, berekend onder de veronderstelling dat H0 klopt. Ze zegt niets over de kans dat H0 zelf waar is.","k":"t"},{"t":"9","q":"Wat betekent een kleine p-waarde?","o":["Dat H0 met zekerheid onjuist is","Dat het effect groot is","Dat de data een resultaat opleveren dat uitzonderli
