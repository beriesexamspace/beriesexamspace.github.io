jk zou zijn als H0 klopt","Dat de steekproef wel groot genoeg was om het effect betrouwbaar op te pikken"],"a":2,"u":"Kleine p-waarden vormen sterke evidentie tegen H0, want het waargenomen resultaat past er slecht bij. Over de grootte van het effect zegt de p-waarde niets.","k":"t"},{"t":"9","q":"Bij 18 bandwerkers is het gemiddelde verschil 17 punten, met sigma = 60. Wat is de toetsingsgrootheid?","o":["z = 2,04","z = 17,00","z = 0,28","z = 1,20"],"a":3,"u":"De standaardfout is 60 gedeeld door de wortel uit 18, dus ongeveer 14,14. z = 17 gedeeld door 14,14 = 1,20.","k":"o"},{"t":"9","q":"Bij die tweezijdige toets met z = 1,20 hoort een p-waarde van 0,2302. Wat besluit je?","o":["H0 kan niet verworpen worden, het resultaat is niet uitzonderlijk onder H0","H0 wordt aanvaard, er is geen verschil","Het onderzoek moet worden overgedaan met een eenzijdige toets en meer deelnemers","H0 wordt verworpen, want 0,2302 is groter dan 0,05"],"a":0,"u":"Bij 23 procent kans op zo een resultaat onder H0 is er geen sterke evidentie tegen H0. Je besluit dat je H0 niet kan verwerpen, niet dat H0 juist is.","k":"t"},{"t":"9","q":"Waarom schrijf je nooit 'we aanvaarden H0'?","o":["Omdat H0 altijd fout is","Omdat geen bewijs tegen H0 nog geen bewijs voor H0 is","Omdat de nulhypothese enkel bij tweezijdige toetsen bestaat","Omdat de p-waarde dan negatief zou zijn"],"a":1,"u":"Absence of evidence is not evidence of absence. Mogelijk was je steekproef te klein of je meetinstrument te ruw om een bestaand verschil op te pikken.","k":"t"},{"t":"9","q":"Wat is het significantieniveau alfa?","o":["Het getal dat je bekomt door de p-waarde van een af te trekken na afloop van de toets","De kans dat H0 waar is","De vooraf gekozen grens waaronder je de p-waarde klein genoeg vindt om H0 te verwerpen","De kans op een grote steekproef"],"a":2,"u":"Alfa leg je vooraf vast, meestal op 0,05. Is p kleiner dan alfa, dan noem je het resultaat statistisch significant op dat niveau.","k":"t"},{"t":"9","q":"Welke volgorde hoort bij een significantietoets in vier stappen?","o":["Conclusie in APA-stijl, hypothesen, p-waarde, toetsingsgrootheid","p-waarde, hypothesen, conclusie, toetsingsgrootheid","Toetsingsgrootheid, hypothesen, conclusie, p-waarde","Hypothesen, toetsingsgrootheid, p-waarde, conclusie in APA-stijl"],"a":3,"u":"Eerst formuleer je H0 en Ha, dan bereken je de toetsingsgrootheid, daarna de overschrijdingskans, en pas op het einde volgt de conclusie in de context van het onderzoek.","k":"t"},{"t":"9","q":"Welk verband bestaat er tussen een tweezijdige toets en een betrouwbaarheidsinterval?","o":["C is gelijk aan 1 min alfa, en beide gebruiken dezelfde grenzen rond een centrum","Er bestaat geen verband tussen beide technieken","Een toets werkt altijd op 99 procent, terwijl een interval altijd op 95 procent werkt","Het interval ligt rond het steekproefgemiddelde, de toets ook"],"a":0,"u":"Een tweezijdige toets op niveau alfa lijkt op een betrouwbaarheidsinterval met niveau C = 1 min alfa, maar dan met de waarde uit H0 als centrum. Valt je resultaat buiten dat aanvaardingsinterval, dan verwerp je H0.","k":"t"},{"t":"9","q":"Een p-waarde zegt niet alles. Wat mis je als je enkel meldt dat p kleiner is dan 0,05?","o":["De steekproefgrootte","Het interval van waarschijnlijke waarden voor mu","De hypothesen waarop de hele analyse gebaseerd is","Het significantieniveau"],"a":1,"u":"De p-waarde geeft alleen de sterkte van de evidentie tegen H0. Waar de parameter waarschijnlijk ligt, lees je pas af uit een betrouwbaarheidsinterval.","k":"t"},{"t":"9","q":"Wat zegt statistische significantie NIET?","o":["Dat de data slecht passen bij H0","Dat het resultaat moeilijk door toeval alleen te verklaren is","Hoe groot en hoe belangrijk het effect in de praktijk is","Dat de p-waarde onder alfa ligt"],"a":2,"u":"Significantie gaat enkel over de vraag of er een effect is, niet hoe groot het is. Bij zeer grote steekproeven wordt ook een verwaarloosbaar effect significant.","k":"t"},{"t":"9","q":"Een medicijn verlaagt de lichaamstemperatuur betrouwbaar met 0,4 graden (p kleiner dan 0,01), terwijl klinisch minstens 1 graad nodig is. Hoe beoordeel je dat?","o":["Niet significant, dus zonder waarde","Significant en dus klinisch bruikbaar","De p-waarde moet groter zijn om iets te betekenen","Statistisch significant, maar klinisch niet betekenisvol"],"a":3,"u":"De toets toont aan dat het effect niet louter toeval is, maar de effectgrootte blijft onder de drempel die in de praktijk telt. Significant en belangrijk zijn twee verschillende dingen.","k":"t"},{"t":"9","q":"Er wordt geen significant verschil gevonden tussen twee groepen. Wat mag je daaruit besluiten?","o":["Dat er in deze data onvoldoende bewijs is voor een verschil, meer niet","Dat het verschil in werkelijkheid nul is","Dat de nulhypothese bewezen is","Dat beide groepen met zekerheid uit een en dezelfde populatie afkomstig zijn"],"a":0,"u":"Een niet-significant resultaat weerlegt H0 niet en bevestigt ze evenmin. Twee heel verschillende populaties kunnen bovendien toevallig gelijke wiskundige kenmerken hebben.","k":"t"},{"t":"9","q":"Hoe gaat APA om met de grens tussen significant en niet significant?","o":["Enkel p kleiner dan 0,05 telt als resultaat, en alle andere bevindingen worden uit het verslag geweerd zonder vermelding","Significant vanaf p kleiner dan 0,05 en marginaal significant vanaf p kleiner dan 0,10, met vermelding van de precieze p-waarde","Alles onder 0,20 mag significant genoemd worden","De grens hangt af van de steekproefgrootte"],"a":1,"u":"Vage uitdrukkingen als 'vrij significant' of 'sterk significant' vermijd je beter. Hanteer de cutoff ook niet absoluut: 4,9 procent en 5,1 procent liggen dicht bij elkaar.","k":"t"},{"t":"9","q":"Waarom kan het bij een pilotstudie zinvol zijn om een hogere alfa te kiezen?","o":["Omdat de p-waarde dan kleiner wordt","Om sneller klaar te zijn met de analyse","Om bij kleine steekproeven geen interessante aanwijzingen over het hoofd te zien","Omdat resultaten uit kleine steekproeven anders bijna nooit significant genoemd worden"],"a":2,"u":"Bij verkennend werk met weinig deelnemers is de kans groot dat een echt effect onder een strenge drempel blijft. De keuze van alfa hangt af van de gevolgen van een verkeerde beslissing.","k":"t"},{"t":"9","q":"Normaal geneest 50% na 3 maanden. Een therapeut beweert dat haar therapie beter werkt: 8 van haar 10 patiënten genazen. Hoe gaat ze na of dit significant is?","o":["Mét teruglegging modelleren met 2 'balletjes' (50/50, de populatie) en kijken hoe vaak je ≥ 8 haalt","Zónder teruglegging modelleren met 10 balletjes die haar eigen patiënten voorstellen","Gewoon aannemen dat het betrouwbaar is","Kan niet, want minder dan 30 patiënten"],"a":0,"u":"Je simuleert onder H0 (p=0,5): trek mét teruglegging uit een model met 2 gelijke uitkomsten (genezen/niet), 10 keer, en kijk hoe vaak je ≥ 8 genezingen krijgt. Is dat zeldzaam (< 5%), dan is het significant.","k":"t"},{"t":"9","q":"Een steekproef geeft gemiddelde 33; populatiegemiddelde = 30; σ = 16; n = 64. Verschilt 33 significant van 30 (α = 10%, tweezijdig)?","o":["Niet-significant, z = 1,5, p = 0,1336","Niet-significant, z = 1,5, p = 0,9839","Significant, z = 2,5, p = 0,0124","Significant, z = 1,5, p = 0,0062"],"a":0,"u":"Standaardfout = 16/√64 = 2. z = (33−30)/2 = 1,5. Tweezijdig: p = 2·P(Z>1,5) = 2·0,0668 = 0,1336 = 13,36% > 10% → niet significant.","k":"o"},{"t":"9","q":"Reactietijd: µ = 0,5 s, σ = 0,12 s. Een steekproef (n = 36) geeft gemiddeld 0,55 s. Reageren ze significant trager? (eenzijdig)","o":["Kan niet berekend worden","Ja, significant trager, z = 2,5 (p = 0,0062)","Nee, niet significant, z = 2,5 (p = 0,9475)","Significant sneller, z = 2,5"],"a":1,"u":"Standaardfout = 0,12/√36 = 0,02. z = (0,55−0,5)/0,02 = 2,5. Eenzijdig p = P(Z>2,5) = 0,0062 < 5% → significant. 0,55 > 0,5 betekent een lángere reactietijd = trager.","k":"o"},{"t":"9","q":"Wanneer verwerp je de nulhypothese?","o":["Nooit","Als p > α","Als p ≤ α","Altijd bij n ≥ 30"],"a":2,"u":"Is de p-waarde kleiner dan of gelijk aan het significantieniveau α (bv. 0,05), dan verwerp je H0: het resultaat is significant. Ezelsbruggetje: 'p klein → H0 weg'.","k":"t"},{"t":"9","q":"Wat is een Type I-fout?","o":["H0 behouden terwijl H0 fout is","De steekproef te klein kiezen","Een rekenfout maken","H0 verwerpen terwijl H0 waar is"],"a":3,"u":"Type I (α) = je verwerpt H0 onterecht (vals alarm). Type II (β) = je behoudt H0 terwijl Ha waar is (een gemiste vondst).","k":"t"},{"t":"9","q":"Een tweezijdige toets geeft een waargenomen z = 2,51 (significantieniveau α = 1%). Wat is de p-waarde en de conclusie?","o":["p = 0,006 → H0 verwerpen","p = 0,012 → H0 verwerpen","p = 0,06 → H0 niet verwerpen","p = 0,012 → H0 niet verwerpen"],"a":3,"u":"Tweezijdig: p = 2·P(Z > 2,51) = 2·0,006 = 0,012. Vergelijk met α = 0,01: omdat 0,012 > 0,01 verwerp je H0 NIET (net niet significant).","k":"o"},{"t":"10","q":"Je wil een csv-bestand met je data inlezen in SPSS. Waar begin je?","o":["File > Open > Data, en bij Files of type kies je Text","Analyze > Descriptive Statistics > Frequencies","Transform > Compute Variable","Data > Select Cases"],"a":0,"u":"Inlezen doe je via File, Open, Data. Zet Files of type op Text, anders ziet SPSS je csv-bestand niet staan.","k":"t"},{"t":"10","q":"In stap 4 van de Import Wizard moet je twee dingen goed zetten. Welke?","o":["Het scheidingsteken, en of de eerste rij de variabelenamen bevat","Het meetniveau en de labels van elke variabele","Het aantal decimalen en de ontbrekende waarden","De naam van het bestand en de map waarin het staat"],"a":0,"u":"Bij stap 4 vink je aan welk scheidingsteken gebruikt wordt, meestal komma of puntkomma, en geef je aan of de variabelenamen bovenaan staan.","k":"t"},{"t":"10","q":"Bij de laatste stap van de Import Wizard vraagt SPSS of je de syntax wil plakken. Waarom kies je Yes?","o":["Zodat je de actie later opnieuw kan uitvoeren via de Syntax Editor","Omdat de data anders niet wordt ingelezen","Omdat SPSS anders de variabelenamen weggooit","Omdat je anders geen grafieken kan maken"],"a":0,"u":"Met de geplakte syntax kan je dezelfde bewerking later opnieuw draaien. Je selecteert ze en klikt op de groene Run-knop.","k":"t"},{"t":"10","q":"Wat mag je nooit gebruiken in de kolom Name van de Variable View?","o":["Spaties","Hoofdletters","Cijfers","Afkortingen"],"a":0,"u":"Een spatie in Name geeft meteen foutmeldingen in SPSS. Gebruik bijvoorbeeld een liggend streepje of schrijf de naam aan elkaar.","k":"t"},{"t":"10","q":"Waarvoor dient de kolom Values in de Variable View?","o":["Om betekenis te geven aan getallen, bijvoorbeeld 1 = man en 2 = vrouw","Om te bepalen hoeveel decimalen getoond worden","Om aan te geven welke waarden ontbrekend zijn","Om het meetniveau van de variabele vast te leggen"],"a":0,"u":"Bij Values koppel je een label aan een getal. Dat is vooral belangrijk bij binaire en categorische variabelen, anders staan er in je output alleen kale cijfers.","k":"t"},{"t":"10","q":"Je codeert ontbrekende antwoorden als 999. Wat doe je in SPSS zodat die niet meetellen?","o":["Bij Missing kiezen voor Discrete missing values en 999 invoeren","De rijen met 999 handmatig verwijderen uit de Data View","Bij Values het label ontbrekend toekennen aan 999","Bij Measure het meetniveau op Nominal zetten"],"a":0,"u":"Via de kolom Missing geef je aan welke codes als ontbrekend behandeld worden. Doe je dat niet, dan telt SPSS 999 gewoon mee in het gemiddelde.","k":"t"},{"t":"10","q":"Een variabele meet tevredenheid van 1 is helemaal oneens tot 5 is helemaal eens. Wat zet je in de kolom Measure?","o":["Ordinal","Scale","Nominal","Ratio"],"a":0,"u":"Een Likertschaal heeft een duidelijke ordening maar geen gelijke afstanden, dus ordinaal. Scale is voor interval- en rationiveau.","k":"o"},{"t":"10","q":"Je vraagt beschrijvende maten op voor de nominale variabele afdeling. Wat vink je aan bij Frequencies > Statistics?","o":["Enkel Mode","Mean en Std. deviation","Median en Quartiles","Minimum en Maximum"],"a":0,"u":"Bij nominaal niveau mag je alleen de modus rapporteren. Een gemiddelde of spreidingsmaat heeft daar geen betekenis.","k":"o"},{"t":"10","q":"Voor een ordinale variabele vraag je de vijf-getallensamenvatting op. Wat vink je aan?","o":["Mode en Median, plus Quartiles en Minimum en Maximum","Enkel Mean en Std. deviation","Enkel Mode","Skewness en Kurtosis"],"a":0,"u":"Vanaf ordinaal niveau mag je modus, mediaan en kwartielen gebruiken. Samen met minimum en maximum heb je de vijf-getallensamenvatting.","k":"o"},{"t":"10","q":"SPSS berekent probleemloos een gemiddelde voor een nominale variabele als je het aanvinkt. Waarom doe je dat toch niet?","o":["Het is methodologisch fout en levert puntenaftrek op","SPSS geeft dan altijd een foutmelding in de output","Het gemiddelde wordt dan verkeerd berekend door het programma","Het mag wel, zolang je het maar niet rapporteert"],"a":0,"u":"Het programma controleert je meetniveau niet. Het rekent gewoon, ook als de uitkomst inhoudelijk nergens op slaat. Die controle moet jij zelf doen.","k":"t"},{"t":"10","q":"In je output staat een scheefheid van g1 = 0,84. Hoe beschrijf je die verdeling?","o":["Rechts-scheef, met de staart naar rechts en de meeste waarnemingen links","Links-scheef, met de staart naar links","Symmetrisch, want de waarde ligt dicht bij nul","Leptokurtisch, dus gepiekter dan normaal"],"a":0,"u":"Een positieve g1 betekent rechts-scheef: de staart loopt naar rechts en het gros van de waarnemingen ligt links.","k":"o"},{"t":"10","q":"Je vindt een gepiektheid van g2 = -1,20. Wat betekent dat?","o":["Platykurtisch, dus platter met dunnere staarten dan de normaalverdeling","Leptokurtisch, dus steiler met dikkere staarten","Mesokurtisch, dus een perfecte klokvorm","Links-scheef verdeeld"],"a":0,"u":"Een negatieve g2 wijst op een plattere verdeling dan de normaalverdeling. Positief is juist steiler en gepiekter.","k":"o"},{"t":"10","q":"Een vraag gaat enkel over militairen die minstens 15 scoorden op de posttest. Wat doe je eerst?","o":["Data > Select Cases, optie If condition is satisfied, en dan post >= 15","Transform > Recode into Different Variables","De rijen met een lagere score verwijderen uit de Data View","Analyze > Compare Means > One-Sample T Test"],"a":0,"u":"Met Select Cases filter je op een voorwaarde. In de Data View zie je daarna schuine strepen door de rijnummers die niet meedoen.","k":"o"},{"t":"10","q":"Je filtert op een tekstwaarde, bijvoorbeeld de provincie Antwerpen. Hoe typ je die voorwaarde?","o":["provincie = 'Antwerpen', dus de waarde tussen aanhalingstekens","provincie = Antwerpen, zonder aanhalingstekens","provincie >= Antwerpen","provincie CONTAINS Antwerpen"],"a":0,"u":"Kwalitatieve of tekstcriteria zet je tussen enkele of dubbele aanhalingstekens. Bij getallen doe je dat juist niet.","k":"o"},{"t":"10","q":"Je wil enkel de Franstalige sergeanten selecteren, dus taal gelijk aan 2 en graad gelijk aan 3. Wat typ je?","o":["(taal = 2) & (graad = 3)","(taal = 2) | (graad = 3)","taal = 2 OF graad = 3","taal en graad = 2 en 3"],"a":0,"u":"Het teken & staat voor EN, het teken | voor OF. Haakjes bepalen de volgorde, dus zet je voorwaarden er netjes tussen.","k":"o"},{"t":"10","q":"Wat moet je absoluut doen nadat je een analyse op een gefilterde subgroep hebt uitgevoerd?","o":["De filter meteen uitzetten via Select Cases en All cases","Het databestand opnieuw inlezen","De output opslaan voor je verder gaat","De variabele opnieuw hercoderen"],"a":0,"u":"Een actieve filter blijft staan. Vergeet je hem uit te zetten, dan zijn al je volgende opgaven op de gefilterde groep berekend en dus fout.","k":"t"},{"t":"10","q":"Waarom kies je Recode into Different Variables en niet Recode into Same Variables?","o":["Om je originele data niet te overschrijven","Omdat Same Variables geen labels ondersteunt","Omdat Same Variables alleen bij nominale variabelen werkt","Omdat je anders geen syntax kan plakken"],"a":0,"u":"Hercodeer altijd naar een nieuwe variabele. Overschrijf je de originele kolom, dan ben je je ruwe data kwijt en kan je niets meer controleren.","k":"t"},{"t":"10","q":"Je wil alle scores van 15 tot en met de hoogste in één nieuwe categorie stoppen. Welke optie kies je bij Old and New Values?","o":["Range, value through HIGHEST","Range, LOWEST through value","All other values","System-missing"],"a":0,"u":"Range, value through HIGHEST vangt alles vanaf een bepaalde waarde tot het maximum. De tegenhanger LOWEST through value doet hetzelfde aan de onderkant.","k":"o"},{"t":"10","q":"In je bestand staan push-ups per minuut, maar je hebt het aantal per tien seconden nodig. Wat doe je?","o":["Transform > Compute Variable, met als expressie push / 6","Transform > Recode into Different Variables","Data > Select Cases met push / 6","Analyze > Descriptives met de optie Divide"],"a":0,"u":"Een nieuwe variabele bereken je met Compute Variable. Een minuut telt zes keer tien seconden, dus deel je door zes.","k":"o"},{"t":"10","q":"Je wil per respondent het gemiddelde over item1 tot en met item10 berekenen. Wat typ je bij Numeric Expression?","o":["MEAN(item1 to item10)","SUM(item1 to item10)","AVERAGE(item1 : item10)","MEAN(item1 + item10)"],"a":0,"u":"De functie MEAN met het woordje to pakt de hele reeks in één keer. Je kan de items ook los opsommen met komma's.","k":"o"},{"t":"10","q":"Waar vind je in deze cursus de klassieke grafiekfuncties?","o":["Graphs > Legacy Dialogs","Analyze > Descriptive Statistics","Transform > Visual Binning","Graphs > Chart Builder"],"a":0,"u":"In deze cursus werk je met Legacy Dialogs. Titels en labels voeg je achteraf toe door in de output op de grafiek te dubbelklikken, dat opent de Chart Editor.","k":"t"},{"t":"10","q":"Je wil de verdeling van graad tonen, opgesplitst per geslacht, met de staafjes naast elkaar. Welk type staafdiagram kies je?","o":["Clustered","Simple","Stacked","Pie"],"a":0,"u":"Clustered zet de staafjes van de subgroepen naast elkaar. Stacked stapelt ze binnen één staaf, en Simple toont maar één variabele.","k":"o"},{"t":"10","q":"Voor welk soort variabele mag je een histogram gebruiken?","o":["Uitsluitend voor continue kwantitatieve variabelen op interval- of rationiveau","Voor elke variabele, ongeacht het meetniveau","Enkel voor nominale variabelen","Vanaf ordinaal niveau"],"a":0,"u":"Een histogram hoort bij continue data, daarom plakken de staven aan elkaar. Voor categorische variabelen gebruik je een staaf- of cirkeldiagram.","k":"t"},{"t":"10","q":"Je maakt een scatterplot om te onderzoeken of gewicht de lichaamslengte voorspelt. Wat zet je op de Y-as?","o":["Lichaamslengte, want dat is de verklaarde variabele","Gewicht, want dat is de verklarende variabele","Dat maakt niet uit voor een scatterplot","Beide variabelen, elk op een eigen as naar keuze"],"a":0,"u":"Op de Y-as staat de variabele die voorspeld wordt, op de X-as de verklarende variabele. De onderzoeksvraag bepaalt dus welke waar komt.","k":"o"},{"t":"10","q":"Hoe voeg je de regressierechte toe aan een scatterplot?","o":["Dubbelklikken op de grafiek en in de Chart Editor kiezen voor Add Fit Line at Total","Bij het maken van de scatterplot de optie Regression aanvinken","Via Analyze > Regression > Linear met de optie Plot","Dat kan niet in SPSS, dat teken je zelf"],"a":0,"u":"De rechte voeg je achteraf toe in de Chart Editor. SPSS tekent dan meteen de lijn met de bijhorende formule erbij.","k":"t"},{"t":"10","q":"Je gooit zes keer met een toestel dat in 70 procent van de gevallen lukt. Hoe bereken je de kans op precies drie keer succes?","o":["PDF.BINOM(3, 6, 0.7)","CDF.BINOM(3, 6, 0.7)","1 - CDF.BINOM(3, 6, 0.7)","IDF.BINOM(3, 6, 0.7)"],"a":0,"u":"PDF geeft de kans op exact dat aantal successen. CDF is cumulatief en telt alles tot en met dat aantal op.","k":"o"},{"t":"10","q":"Bij dezelfde binomiale verdeling wil je de kans op minder dan drie successen. Wat typ je?","o":["CDF.BINOM(2, 6, 0.7)","CDF.BINOM(3, 6, 0.7)","PDF.BINOM(2, 6, 0.7)","1 - CDF.BINOM(3, 6, 0.7)"],"a":0,"u":"Aantallen zijn discreet, dus minder dan drie is hetzelfde als hoogstens twee. Daarom vul je k min 1 in.","k":"o"},{"t":"10","q":"En de kans op minstens drie successen?","o":["1 - CDF.BINOM(2, 6, 0.7)","1 - CDF.BINOM(3, 6, 0.7)","CDF.BINOM(3, 6, 0.7)","PDF.BINOM(3, 6, 0.7)"],"a":0,"u":"Minstens drie is het complement van hoogstens twee. Je trekt dus de cumulatieve kans tot en met k min 1 af van één.","k":"o"},{"t":"10","q":"Scores zijn normaal verdeeld met gemiddelde 75 en standaardafwijking 8. Hoe bereken je de kans op een score tussen 55 en 85?","o":["CDF.NORMAL(85, 75, 8) - CDF.NORMAL(55, 75, 8)","CDF.NORMAL(85, 75, 8) + CDF.NORMAL(55, 75, 8)","PDF.NORMAL(85, 75, 8) - PDF.NORMAL(55, 75, 8)","IDF.NORMAL(0.85, 75, 8) - IDF.NORMAL(0.55, 75, 8)"],"a":0,"u":"De oppervlakte tussen twee grenzen krijg je door de cumulatieve kans tot de bovengrens te verminderen met die tot de ondergrens.","k":"o"},{"t":"10","q":"Bij diezelfde verdeling wil je weten onder welke score de laagste 5 procent valt. Wat gebruik je?","o":["IDF.NORMAL(0.05, 75, 8)","CDF.NORMAL(0.05, 75, 8)","PDF.NORMAL(0.05, 75, 8)","1 - CDF.NORMAL(0.05, 75, 8)"],"a":0,"u":"IDF is de inverse functie: je geeft een kans en krijgt de bijhorende grenswaarde terug. Voor de hoogste 5 procent vul je 0.95 in.","k":"o"},{"t":"10","q":"Waarom is PDF.NORMAL bij een continue verdeling geen kans?","o":["Omdat de kans op exact één waarde bij een continue verdeling altijd nul is, het is een dichtheid","Omdat SPSS die functie alleen voor discrete verdelingen kan gebruiken","Omdat de uitkomst altijd groter is dan één","Omdat je daarvoor eerst moet standaardiseren"],"a":0,"u":"PDF geeft bij een continue verdeling de hoogte van de klokcurve, niet een kans. Kansen lees je af als oppervlakten, dus via CDF.","k":"t"},{"t":"10","q":"Je onderzoekt de samenhang tussen twee nominale variabelen. Welke procedure gebruik je?","o":["Analyze > Descriptive Statistics > Crosstabs, met Chi-square en eventueel Lambda","Analyze > Correlate > Bivariate met Pearson","Analyze > Regression > Linear","Analyze > Compare Means > One-Way ANOVA"],"a":0,"u":"Twee nominale variabelen zet je in een kruistabel. Chi-kwadraat toetst de afhankelijkheid, lambda geeft de proportionele foutenreductie.","k":"o"},{"t":"10","q":"Eén variabele is ordinaal, de andere op rationiveau. Wat vink je aan bij Correlate > Bivariate?","o":["Spearman en Kendall's tau-b, en Pearson uit","Enkel Pearson","Pearson en Spearman samen","Chi-square"],"a":0,"u":"Zodra één van beide ordinaal is, werk je met rangcorrelaties. Pearson veronderstelt dat beide variabelen minstens intervalniveau hebben.","k":"o"},{"t":"10","q":"Hoe stel je in SPSS een betrouwbaarheidsinterval op voor een populatiegemiddelde?","o":["Analyze > Compare Means > One-Sample T Test, en het niveau instellen bij Options","Analyze > Descriptive Statistics > Descriptives","Analyze > Regression > Linear met de optie Save","Analyze > Nonparametric Tests > 1-Sample K-S"],"a":0,"u":"De One-Sample T Test geeft in de output de onder- en bovengrens onder de kolom Confidence Interval of the Difference.","k":"t"},{"t":"10","q":"Voor een ANOVA moet je eerst de normaliteit per groep controleren. Hoe doe je dat?","o":["Analyze > Descriptive Statistics > Explore, met bij Plots de optie Normality plots with tests","Analyze > Compare Means > One-Way ANOVA met de optie Descriptive","Analyze > Correlate > Bivariate","Graphs > Legacy Dialogs > Histogram per groep"],"a":0,"u":"Via Explore zet je de afhankelijke variabele bij Dependent List en de groepsvariabele bij Factor List. Met Normality plots with tests krijg je Kolmogorov-Smirnov en Shapiro-Wilk per groep.","k":"t"},{"t":"10","q":"In de tabel Tests of Normality staat bij elke groep een p-waarde boven 0,05. Wat besluit je?","o":["De normaliteitsveronderstelling mag aangenomen worden","De verdeling wijkt significant af van normaal","De groepen hebben een gelijke variantie","De ANOVA mag zeker niet uitgevoerd worden"],"a":0,"u":"Een p-waarde groter dan alfa betekent dat de verdeling niet significant afwijkt van de normaalverdeling. Je mag dus van normaliteit uitgaan.","k":"o"},{"t":"10","q":"Je wil de gemiddelden van een continue variabele vergelijken tussen vier onafhankelijke groepen. Welke procedure?","o":["Analyze > Compare Means > One-Way ANOVA","Analyze > Compare Means > One-Sample T Test","Analyze > Correlate > Bivariate","Analyze > Descriptive Statistics > Crosstabs"],"a":0,"u":"Vanaf drie of meer onafhankelijke groepen gebruik je een one-way ANOVA. Bij Options vink je Descriptive en Means plot aan.","k":"t"},{"t":"10","q":"Je wil met de 1-Sample K-S toetsen tegen een normaalverdeling met mu 1500 en sigma 500. Hoe doe je dat?","o":["In de syntax de regel aanpassen naar /K-S(NORMAL, 1500, 500) = variabele","In het venster de waarden invullen bij Test Distribution","Eerst de variabele standaardiseren via Compute","Dat kan niet, SPSS gebruikt altijd het steekproefgemiddelde"],"a":0,"u":"Vooropgestelde parameters kan je niet in het venster kwijt. Je plakt de syntax en typt de twee waarden er zelf achter NORMAL bij.","k":"t"},{"t":"10","q":"Je wil nagaan of de categorieën van jobcategorie gelijkmatig verdeeld zijn. Welke toets en welke instelling?","o":["Nonparametric Tests > Chi-square, met All categories equal","Crosstabs met Chi-square","One-Way ANOVA met Descriptive","1-Sample K-S met Test Distribution Normal"],"a":0,"u":"De aanpassingstoets vergelijkt waargenomen met verwachte frequenties. All categories equal toetst op een uniforme verdeling, met Values vul je eigen verwachtingen in.","k":"o"},{"t":"10","q":"Je hebt een lineaire regressie gedraaid. Waar lees je de determinatiecoëfficiënt af?","o":["In de tabel Model Summary, onder R Square","In de tabel Model Summary, onder R","In de tabel Coefficients, onder B","In de tabel ANOVA, onder Sig."],"a":0,"u":"Onder R staat de correlatiecoëfficiënt, onder R Square de proportie verklaarde variantie.","k":"o"},{"t":"10","q":"In de tabel Coefficients staat bij (Constant) de waarde 11,048 en bij gewicht 1,859. Wat is de regressievergelijking?","o":["Lengte = 11,048 + 1,859 maal gewicht","Lengte = 1,859 + 11,048 maal gewicht","Lengte = 11,048 maal 1,859 maal gewicht","Gewicht = 11,048 + 1,859 maal lengte"],"a":0,"u":"De waarde bij (Constant) is b0, het snijpunt met de Y-as. De waarde bij de onafhankelijke variabele is b1, de helling.","k":"o"},{"t":"10","q":"Jonathan weegt 100 kg. Hoe bereken je zijn voorspelde lengte met bovenstaand model?","o":["Transform > Compute Variable met de expressie 11.048 + (1.859 * 100)","Data > Select Cases met gewicht = 100","Analyze > Descriptives op de variabele gewicht","Dat kan alleen als 100 kg in de dataset voorkomt"],"a":0,"u":"Je vult het getal in de regressieformule in en laat SPSS rekenen. Het kan ook via Regression > Save met Unstandardized predicted values.","k":"o"},{"t":"10","q":"Je hebt onderaan in de Data View een extra regel toegevoegd om een voorspelling te laten berekenen. Wat doe je daarna?","o":["Die regel meteen wissen, zodat de dataset niet vervuild raakt","De regel laten staan als bewijs van je berekening","Het bestand onder een nieuwe naam opslaan met die regel erin","De regel omzetten naar een missing value"],"a":0,"u":"Een extra case verandert je aantallen en dus al je volgende resultaten. Klik met de rechtermuisknop op het rijnummer en kies Clear.","k":"t"}],"theory":[{"h":"Verzamelingen en combinatieleer","items":["Unie A ∪ B = 'A of B' (alles wat in minstens een van beide zit). Doorsnede A ∩ B = 'A en B' (enkel het gemeenschappelijke deel).","Verschil A \\ B = 'A minus B'. Complement van A = alles in Ω dat niet in A zit, genoteerd als niet-A.","Elke verzameling is een deelverzameling van zichzelf, en de lege verzameling is een deelverzameling van elke verzameling.","Partitie: deelverzamelingen die samen A dekken en twee aan twee een lege doorsnede hebben. Geen overlap, geen gaten.","Met herhaling: k posities en n keuzes per positie geeft n^k mogelijkheden (cijferslot: 10^4 = 10000 codes).","Permutatie = alle n elementen ordenen = n! Voorbeeld: 10! = 3 628 800 volgorden.","Variatie = r elementen kiezen uit n, volgorde telt mee: n × (n−1) × … × (n−r+1). Voorbeeld: 10 × 9 × 8 = 720.","Combinatie = r elementen kiezen uit n, volgorde telt niet mee: C(n,r) = n! / (r! (n−r)!). Voorbeeld: C(10,3) = 120.","Ezelsbrug: volgorde belangrijk → variatie, volgorde onbelangrijk → combinatie. Een permutatie is de variatie met r = n.","Een verzameling met n elementen heeft 2^n deelverzamelingen, de lege verzameling en de verzameling zelf meegerekend."]},{"h":"Toeval en kansmodellen","items":["Toevalsverschijnsel: de losse uitkomst is onzeker, maar over veel herhalingen ontstaat een regelmatig patroon.","Frequentiële definitie: de kans is de proportie keren dat de uitkomst voorkomt bij een zeer groot aantal herhalingen.","Die regelmaat geldt enkel als de pogingen onderling onafhankelijk zijn.","Uitkomstenruimte S = alle mogelijke uitkomsten. Gebeurtenis = een uitkomst of een verzameling uitkomsten.","Kansmodel = uitkomstenruimte S plus de kans van elke uitkomst.","Klassieke definitie P(A) = aantal gunstige uitkomsten / aantal mogelijke uitkomsten, maar enkel bij gelijke kansen.","Fout gebruik van die formule: 'overleven of niet' is geen 50/50, want de twee uitkomsten zijn niet even waarschijnlijk.","Twee dobbelstenen apart noteren geeft 36 gelijk waarschijnlijke uitkomsten, elk 1/36. Enkel het totaal noteren geeft 11 uitkomsten met ongelijke kansen.","Basisregels: 0 ≤ P(A) ≤ 1 en P(S) = 1. De kansen van alle uitkomsten samen geven precies 1.","Modellen zijn uitwisselbaar: vier mensen die willekeurig ja of nee antwoorden = vier keer een munt opgooien."]},{"h":"Rekenregels en voorwaardelijke kans","items":["Somregel: P(A of B) = P(A) + P(B) − P(A en B). Bij disjuncte gebeurtenissen valt de laatste term weg.","Complementregel: P(niet A) = 1 − P(A).","Voorwaardelijke kans: P(A | B) = P(A en B) / P(B), met P(B) niet gelijk aan 0. Je verkleint de uitkomstenruimte tot B.","Algemene productregel: P(A en B) = P(B) × P(A | B). Die geldt ook als A en B afhankelijk zijn.","Zonder teruglegging verandert de kans per trekking: drie harten uit 52 kaarten = (13/52)(12/51)(11/50).","Onafhankelijk betekent P(A | B) = P(A), en dan geldt P(A en B) = P(A) × P(B).","Onafhankelijk is niet hetzelfde als disjunct. Disjuncte gebeurtenissen zijn juist sterk afhankelijk: als de ene optreedt, kan de andere niet meer.","Boomdiagram: vermenigvuldig langs een tak, tel op over de takken. Een kruistabel doet hetzelfde werk.","Regel van Bayes: van P(test | ziekte) naar P(ziekte | test). Die twee zijn niet gelijk.","Bij een zeldzame aandoening zijn de meeste positieve testuitslagen vals-positief, ook bij een goede test. Mammografie: 80 procent detectie, maar P(kanker | positief) is toch maar ongeveer 0,3 procent."]},{"h":"Stochastische variabelen","items":["Stochastische variabele: getalwaarden die de uitkomsten van een toevalsproces beschrijven. De kansverdeling geeft de waarden en hun kansen.","Discreet = op te sommen waarden (tellen). Continu = alle waarden in een interval (meten).","Discrete kansverdeling: elke kans ligt tussen 0 en 1 en de som van de kansen is 1.","Kans op een gebeurtenis = som van de kansen van de waarden die tot die gebeurtenis behoren.","Drie muntworpen, X = aantal kruis: kansen 1/8, 3/8, 3/8, 1/8. Dus P(X = 2) = 3/8 en P(X ≥ 2) = 1/2.","Bij een continue variabele is de kans op een exacte waarde 0. Enkel intervallen hebben een kans groter dan 0.","De kans is de oppervlakte onder de dichtheidskromme boven dat interval. De totale oppervlakte is 1.","Uniforme verdeling tussen 0 en 1: P(X ≤ 0,5 of X > 0,8) = 0,5 + 0,2 = 0,7.","Normaalverdelingen dienen als dichtheidskromme. Standaardiseren met z = (x − µ) / σ herleidt N(µ, σ) tot N(0,1).","Standaardiseren is een lineaire transformatie: de vorm blijft, enkel het centrum (0) en de eenheid (1) veranderen."]},{"h":"Verwachting en variantie","items":["Verwachting E(X) = som van elke waarde maal haar kans. Het is een gewogen gemiddelde, geen gewoon gemiddelde van de waarden.","De verwachting hoeft zelf geen mogelijke uitkomst te zijn. De APGAR-verwachting 8,128 komt als score niet voor.","Interpretatie: het gemiddelde op lange termijn, over heel veel herhalingen.","Loterij: 500 euro winst met kans 1/1000 geeft E(X) = 0,50 euro. Kost het spel 1 euro, dan verlies je gemiddeld 0,50 euro.","Wet van de grote getallen: naarmate n stijgt, benadert het steekproefgemiddelde het populatiegemiddelde µ.","Intuïtie over korte reeksen is onbetrouwbaar: series zoals KKK worden stelselmatig onderschat.","Variantie van X = som van (x − µ)² maal de kans van x. De standaarddeviatie is de wortel daaruit.","Regels voor verwachtingen: µ(a + bX) = a + b·µ(X) en µ(X + Y) = µ(X) + µ(Y), altijd, ook bij samenhang.","Regels voor varianties: σ²(a + bX) = b²·σ²(X). Een constante optellen verandert de spreiding niet.","Bij onafhankelijke X en Y: σ²(X + Y) = σ²(X − Y) = σ²(X) + σ²(Y). Varianties tel je op, ook bij een verschil.","Met correlatie: σ²(X ± Y) = σ²(X) + σ²(Y) ± 2·covariantie, met covariantie = r·σ(X)·σ(Y).","Steekproevenvariabiliteit: de waarde van een steekproefgrootheid verschilt van steekproef tot steekproef."]},{"h":"Binomiale verdeling en proporties","items":["Parameter = kenmerk van de populatie (Griekse letter, µ en σ). Karakteristieke waarde = berekend op de steekproef, gebruikt als schatter.","Steekproefverdeling = de verdeling in je data. Steekproevenverdeling = de verdeling van een steekproefgrootheid over alle mogelijke steekproeven.","BOAS-check voor een binomiale situatie: Binair, Onafhankelijk, Aantal pogingen vooraf vast, Succeskans p constant.","Binomiale kans: P(X = k) = C(n,k) · p^k · (1 − p)^(n−k). C(n,k) telt de volgorden, de rest is de kans op een volgorde.","Trekking zonder teruglegging mag je binomiaal benaderen als de populatie veel groter is dan de steekproef: N ≥ 20n.","Voorbeeld: n = 5 en p = 0,25 geeft P(X = 3) = 10 × 0,015625 × 0,5625 = 0,088, en P(X > 3) = 0,0156.","Verwachting en spreiding: µ = np en σ = wortel uit np(1 − p). Deze formules gelden alleen binomiaal.","Steekproefproportie = X/n. De verwachting is p en de standaarddeviatie is de wortel uit p(1 − p)/n.","Normaalbenadering mag als np ≥ 10 én n(1 − p) ≥ 10.","Continuïteitscorrectie: de discrete waarde 8 komt overeen met de strook 7,5 tot 8,5. Voor P(X ≥ 1520) reken je vanaf 1519,5.","Zonder die correctie loopt de benadering flink mis: bij n = 20 en p = 0,4 geeft ze 0,676 in plaats van 0,755."]},{"h":"Steekproevenverdeling en CLS","items":["Het steekproefgemiddelde is een zuivere schatter van µ: gemiddeld ligt het noch te hoog, noch te laag.","Standaardfout van het gemiddelde = σ/√n. Steekproefgemiddelden zijn dus minder variabel dan losse waarnemingen.","Vier keer zoveel deelnemers halveert de standaardfout, want de wortel uit 4n is 2 keer de wortel uit n.","Normaal verdeelde populatie → het gemiddelde is exact normaal verdeeld, ongeacht n.","Centrale limietstelling: bij een willekeurig verdeelde populatie benadert de steekproevenverdeling van het gemiddelde een normaalverdeling zodra n groot genoeg is (vuistregel n ≥ 30).","De CLS gaat over het gemiddelde, niet over de ruwe data. De populatie blijft even scheef als ze was.","Bij n = 1 valt de steekproevenverdeling samen met de populatieverdeling. Hoe groter n, hoe symmetrischer en smaller.","Voorbeeld: µ = 1 uur, σ = 1, n = 70 geeft N(1; 0,12). De kans op een gemiddelde boven 1,1 uur is ongeveer 20 procent.","Ongeveer 68 procent van de steekproefgemiddelden ligt binnen een standaardfout van µ, ongeveer 95 procent binnen twee.","Elke lineaire combinatie van onafhankelijke normaal verdeelde variabelen is opnieuw normaal verdeeld."]},{"h":"Betrouwbaarheidsintervallen","items":["Puntschatting = een getal. Intervalschatting = een reeks aannemelijke waarden met een betrouwbaarheidsniveau erbij.","Goede schatter: zuiver (gemiddeld juist), efficiënt (kleinste standaardfout) en consistent (beter bij grotere n).","De steekproefvariantie deelt door n − 1, want delen door n geeft een onzuivere schatter van σ².","BI = schatting ± foutmarge, met foutmarge = z* · σ/√n. Voor 95 procent is z* = 1,96, in de praktijk vaak afgerond op 2.","Interpretatie: 95 procent van alle mogelijke steekproeven levert een interval op dat µ bevat. Zeg niet dat de kans 95 procent is dat µ in dít interval ligt.","Voorbeeld: gemiddelde 461, σ = 100, n = 500 geeft standaardfout 4,5 en dus een interval van ongeveer 452 tot 470.","Steekproefgrootte delen door vier verdubbelt de breedte. Het interval halveren vraagt dus vier keer zoveel deelnemers.","Vooraf plannen: n ≥ (z* · σ / foutmarge)². Voor σ = 100 en een marge van 5 punten: n ≥ 1537.","De populatiegrootte N speelt in die formule geen rol. Enkel n, σ en het gekozen niveau tellen.","Smaller interval: grotere n, kleinere σ, of een lager betrouwbaarheidsniveau. Hoger niveau (99 in plaats van 95 procent) maakt het interval breder.","Voorwaarden: een enkelvoudige aselecte steekproef, geen non-respons, een normaal verdeelde variabele en een gekende σ.","Het gemiddelde is niet robuust voor uitschieters. Bij kleine steekproeven uit scheve populaties biedt de bootstrap een alternatief."]},{"h":"Significantietoetsen","items":["Een significantietoets vergelijkt data met een bewering over een parameter en drukt het resultaat uit als een kans.","H0 = geen effect, geen verschil. Ha = wat je met je onderzoek wil ondersteunen. De toets evalueert de evidentie tegen H0.","Eenzijdig als je een richting vooropstelt (groter of kleiner), tweezijdig als je enkel 'verschillend van' beweert.","Toetsingsgrootheid: z = (steekproefgemiddelde − µ0) / (σ/√n). Ze telt hoeveel standaardfouten je van H0 af zit.","p-waarde = de kans op een minstens zo extreme toetsingsgrootheid, áls H0 waar zou zijn. Niet de kans dat H0 waar is.","Klein p → sterke evidentie tegen H0. Groot p → het resultaat is gewoon plausibel onder H0.","Beslissing: p < α → H0 verwerpen en besluiten tot Ha. p ≥ α → H0 niet verwerpen. Schrijf nooit 'H0 aanvaarden'.","Vier stappen: hypothesen formuleren, toetsingsgrootheid berekenen, overschrijdingskans bepalen, conclusie in APA-stijl.","Tweezijdig: p = 2 × P(Z > |z|). Voorbeeld: z = 1,20 geeft p = 2 × 0,1151 = 0,2302, dus H0 blijft staan.","Een tweezijdige toets op niveau α hoort bij een betrouwbaarheidsinterval met C = 1 − α, maar dan rond de waarde uit H0.","Type I-fout = H0 onterecht verwerpen (vals alarm, kans α). Type II-fout = een echt effect missen (kans β).","Significantie zegt niets over de grootte van een effect. Bij zeer grote steekproeven wordt ook een onbeduidend verschil significant.","Geen significantie is geen bewijs van afwezigheid. Mogelijk was de steekproef te klein of het meetinstrument te ruw.","APA: significant vanaf p < 0,05, marginaal significant vanaf p < 0,10. Vermeld de precieze p-waarde en vermijd 'sterk significant'."]},{"h":"Software kort: SPSS en R","items":["Frequencies en Descriptives geven de beschrijvende statistiek per variabele.","Crosstabs met Chi-square toetst de samenhang tussen categorische variabelen.","Compare Means en ANOVA vergelijken gemiddelden van groepen. Kijk naar de sig-waarde, dat is de p-waarde.","Correlate geeft Pearson bij scale-variabelen, Spearman of Kendall bij ordinale variabelen.","Transform → Compute of Recode maakt nieuwe variabelen. Data → Select Cases beperkt de analyse tot een groep.","In R: pbinom(k, n, p) geeft de binomiale kans tot en met k, pnorm(x, mean, sd) de oppervlakte links van x onder de normaalkromme.","sample(x, n, replace = TRUE) simuleert trekkingen met teruglegging, handig om toeval na te bootsen.","Het examen bestaat uit twee delen: theorie plus oefeningen in meerkeuze, en een softwaredeel in SPSS of R."]},{"h":"Begrippen in het kort","items":["Deductief tegenover inductief: deductief is beschrijvend, je vertrekt van wat je hebt en beschrijft het. Inductief is verklarend, je gebruikt de steekproef om uitspraken te doen over de hele populatie.","Disjunct: twee gebeurtenissen die elkaar uitsluiten, de doorsnede is leeg. Bij niet-disjunct is er wel overlap, en die overlap moet je aftrekken als je de kansen optelt.","Partitie: deelverzamelingen vormen een partitie van A als ze samen heel A opleveren en elkaar nergens overlappen.","Combinatie tegenover variatie: bij een combinatie doet de volgorde er niet toe, bij een variatie wel. Is r gelijk aan n, dan heet het een permutatie. Bij een herhalingsvariatie mag dezelfde uitkomst meermaals voorkomen.","Faculteit: het product van een getal met alle kleinere gehele getallen, dus 4! is 4 maal 3 maal 2 maal 1.","Toeval: de afzonderlijke uitkomsten liggen niet vast, maar op lange termijn ontstaat er wel een vast patroon.","Kans: de proportie keren dat een uitkomst voorkomt als je het experiment heel vaak zou herhalen.","Met of zonder teruglegging: met teruglegging blijven de trekkingen onafhankelijk, zonder teruglegging beïnvloeden ze elkaar.","Kansmodel: de lijst van alle mogelijke uitkomsten met de kans op elk daarvan. De uitkomstenruimte S is de verzameling van al die mogelijke uitkomsten.","Voorwaardelijke kans: de kans op A gegeven dat B al gebeurd is. Je rekent dan enkel nog binnen B.","Stochastische variabele: een grootheid waarvan de waarde door toeval bepaald wordt, bijvoorbeeld het aantal klanten per uur.","Discreet tegenover continu: discrete variabelen tel je, elke waarde heeft een eigen kans en samen tellen die op tot 1. Continue variabelen meet je, daar werk je met een dichtheidsfunctie en zijn kansen oppervlakten.","EAS: een eenvoudige aselecte steekproef, waarbij iedereen in de populatie evenveel kans heeft om gekozen te worden.","De vijf kansregels: elke kans ligt tussen 0 en 1, de kans op de hele uitkomstenruimte is 1, de optelregel is P(A of B) = P(A) + P(B) min P(A en B), de complementregel is P(niet A) = 1 min P(A), en de productregel is P(A en B) = P(A) maal P(B gegeven A).","Stochastische onafhankelijkheid: A en B zijn onafhankelijk als B geen invloed heeft op de kans op A. Dan geldt P(A gegeven B) = P(A) en P(A en B) = P(A) maal P(B).","Regel van Bayes: hiermee keer je een voorwaardelijke kans om, dus van de kans op B gegeven A naar de kans op A gegeven B.","Standaardnormaalverdeling: door waarden om te zetten naar z-scores herleid je elke normaalverdeling tot N(0,1), zodat je alle kansen uit één tabel kan aflezen.","Wet van de grote getallen: hoe groter je steekproef, hoe dichter het steekproefgemiddelde bij het echte populatiegemiddelde komt te liggen.","Steekproefvariabiliteit: elke nieuwe steekproef geeft een ander gemiddelde, ook al verandert er niets aan de populatie.","Parameter tegenover statistiek: een parameter beschrijft de populatie en is theoretisch, meestal met een Griekse letter. Een statistiek bereken je uit je eigen steekproef.","Steekproefverdeling tegenover steekproevenverdeling: de steekproefverdeling is die van je eigen steekproef, die ken je en kan je meten. De steekproevenverdeling is theoretisch, namelijk de verdeling van het gemiddelde over alle mogelijke steekproeven. Het is die tweede die bij voldoende grote n naar een normaalverdeling neigt. Deze twee worden op het examen graag verwisseld.","Standaardfout: de standaardafwijking van de steekproevenverdeling van het gemiddelde. Ze zegt hoe hard je gemiddelde zou schommelen als je heel veel steekproeven zou nemen.","Een grotere steekproef maakt je schatting stabieler en de standaardfout kleiner, maar lost systematische fouten niet op.","Centrale limietstelling: bij voldoende grote n benadert de steekproevenverdeling van het gemiddelde een normaalverdeling, ook als de populatie zelf niet normaal verdeeld is.","Binomiale situatie, te onthouden als BOAS: binair, onafhankelijk, aantal pogingen ligt vooraf vast, en steeds dezelfde succeskans. Dat laatste betekent met teruglegging.","Binomiaalcoëfficiënt: het aantal volgorden waarop k successen kunnen voorkomen in n waarnemingen. De binomiale kans is dat aantal maal de kans op elke afzonderlijke volgorde.","Vorm van de binomiale verdeling: ligt de kans dicht bij nul, dan is ze scheef. Hoe dichter bij vijftig procent, hoe symmetrischer.","Normale benadering van de binomiale verdeling: toegestaan als n maal p en n maal q allebei minstens 10 zijn. Omdat je iets discreets benadert met iets continus, hoort daar een continuïteitscorrectie bij.","Vuistregel N groter dan of gelijk aan 20n: bij een heel grote populatie maakt het nauwelijks nog verschil of je met of zonder teruglegging trekt.","Zuiver, efficiënt en consistent: een schatter is zuiver als hij gemiddeld precies de echte waarde geeft, efficiënt als de schattingen dicht bij elkaar liggen, en consistent als hij nauwkeuriger wordt naarmate n groeit.","Twee manieren van inferentie: met een betrouwbaarheidsinterval schat je waar de populatiewaarde ongeveer ligt, met een significantietoets controleer je of een bestaande claim klopt.","Puntschatting tegenover intervalschatting: één exact getal tegenover een gebied met een foutenmarge eromheen.","Overschrijdingskans p: de kans op een resultaat dat minstens zo extreem is als het jouwe, in de veronderstelling dat H0 waar is.","Alfa: de grootste toevalskans die je nog aanvaardbaar vindt, meestal vijf procent. Is p kleiner dan alfa, dan is het resultaat significant.","H0 en HA: de nulhypothese gaat uit van geen effect. Verwerp je H0 niet, dan heb je onvoldoende bewijs, wat iets anders is dan bewijs dat H0 waar is. Eenzijdig toets je op groter of kleiner, tweezijdig op verschillend.","De vier stappen van een significantietoets: hypothesen en voorwaarden opschrijven, de toetsingsgrootheid berekenen, de overschrijdingskans bepalen, en besluiten in APA-stijl.","z-waarde tegenover kritieke z-waarde: de z-waarde zegt hoeveel standaardafwijkingen jouw waarde van het gemiddelde ligt. De kritieke z-waarde is de vaste grens uit de tabel en is altijd positief.","Significant: het resultaat is zo extreem dat toeval als verklaring onwaarschijnlijk wordt. Niet significant betekent dat toeval het nog steeds kan verklaren."]}],"hacks":[{"h":"p klein → H0 weg","t":"Is de p-waarde kleiner dan α (meestal 0,05)? Dan verwerp je H0 en is het resultaat significant. Grote p betekent enkel: geen bewijs, niet dat H0 klopt."},{"h":"BOAS voor binomiaal","t":"Binair, Onafhankelijk, Aantal pogingen vooraf vast, Succeskans constant. Ontbreekt er een letter, dan is de binomiale verdeling niet de juiste keuze."},{"h":"Volgorde telt? Dan variatie","t":"Volgorde belangrijk → variatie of permutatie. Volgorde onbelangrijk → combinatie C(n,r). Een permutatie is gewoon de variatie waarbij je alle n elementen neemt."},{"h":"Standaardfout: meer data, kleiner foutje","t":"σ/√n heeft n in de noemer. Vier keer zoveel deelnemers halveert de standaardfout en dus ook de foutmarge, want de wortel groeit maar half zo snel."},{"h":"CLS gaat over gemiddelden","t":"De centrale limietstelling maakt het gemiddelde normaal, niet je ruwe data. De populatie blijft even scheef als ze altijd was."},{"h":"Onafhankelijk is niet disjunct","t":"Onafhankelijk: P(A en B) = P(A)·P(B), de ene zegt niets over de andere. Disjunct: P(A en B) = 0, ze sluiten elkaar uit en zijn dus juist sterk afhankelijk."},{"h":"Bayes: draai de voorwaarde niet om","t":"P(positieve test | ziek) en P(ziek | positieve test) zijn twee verschillende dingen. Bij een zeldzame ziekte is de tweede veel kleiner dan je denkt."},{"h":"De methode vangt, niet dit interval","t":"Bij 95 procent betrouwbaarheid vangt de methode µ in 95 van de 100 steekproeven. Over dit ene berekende interval mag je geen kansuitspraak doen."},{"h":"Type I is vals alarm","t":"Type I (α): je verwerpt H0 terwijl ze klopt, je 'vindt' iets dat er niet is. Type II (β): je mist een effect dat er wel degelijk is."},{"h":"Significant is niet hetzelfde als belangrijk","t":"Een daling van 0,4 graden kan significant zijn en klinisch toch niets betekenen. Kijk altijd naar de effectgrootte, niet enkel naar de p-waarde."},{"h":"Halve eenheid bij de overstap","t":"Ga je van binomiaal naar normaal, tel dan 0,5 mee. X ≥ 1520 wordt dus vanaf 1519,5. Zonder die correctie wordt je antwoord merkbaar fout."},{"h":"Varianties tel je op, ook bij min","t":"Bij onafhankelijke variabelen geldt σ²(X − Y) = σ²(X) + σ²(Y). Onzekerheid trek je nooit van elkaar af, ook niet bij een verschilscore."}]};
</script>

          tl.textContent=Math.round(doel*e);
          if(p<1) requestAnimationFrame(stap); else tl.textContent=doel; }); } }
    var i2=document.querySelector(".bar>i"); requestAnimationFrame(function(){ if(i2) i2.style.width=i2.getAttribute("data-w")+"%"; });
    document.getElementById("backBtn").onclick=function(){ state.quiz=null; renderQuizGate(); };
    var optBtns=[].slice.call(document.querySelectorAll("#opts .opt"));
    var nb=document.getElementById("nextBtn"); nb.onclick=next; var pb=document.getElementById("prevBtn"); if(pb)pb.onclick=function(){ if(Q.idx>0){ Q.idx--; renderQuiz(); } };
    function showAnswered(i){
      optBtns.forEach(function(b){ var bi=+b.dataset.i; b.disabled=true; if(cur.opts[bi].ok)b.classList.add("correct"); else if(bi===i)b.classList.add("wrong"); });
      var ok=cur.opts[i].ok, fb=document.getElementById("fb"); fb.className="feedback "+(ok?"ok":"no");
      var juist=cur.opts.filter(function(o){return o.ok;})[0].text;
      fb.innerHTML=ok?"<b>"+rnd(PRAISE)+" ✓</b>":"<b>"+wrongLead()+"</b><span class=\"sub\">Juiste antwoord: "+esc(juist)+"</span>";
      var w=document.createElement("div"); w.innerHTML='<div class="whybox"><h4>'+ic("sparkles")+'Waarom?</h4>'+esc(q.u)+'</div>'; fb.appendChild(w);
      nb.classList.remove("hide"); nb.innerHTML=(Q.idx+1>=Q.items.length)?"Bekijk resultaat "+ic("arrowR"):"Volgende "+ic("arrowR");
    }
    function pick(i){ if(Q.answered)return; Q.answered=true; Q.picked=i; Q.picks[Q.idx]=i; var ok=cur.opts[i].ok; if(ok)Q.correct++; else Q.wrong.push(q); recordProg(q.id, ok); showAnswered(i); nb.focus(); }
    optBtns.forEach(function(b){ b.onclick=function(){ pick(+b.dataset.i); }; });
    function next(){ if(!Q.answered)return; Q.idx++; Q.answered=false; Q.picked=-1; if(Q.idx>=Q.items.length)Q.done=true; renderQuiz(); }
    if(Q.answered) showAnswered(Q.picked);
    state.key=function(e){ if(!Q.answered){ var k=e.key.toLowerCase(); var idx="abcde".indexOf(k); if(idx<0&&/[1-5]/.test(k))idx=+k-1; if(idx>=0&&idx<cur.opts.length){pick(idx);e.preventDefault();} } else if(e.key==="Enter"||e.key===" "){ next(); e.preventDefault(); } };
  }

  function renderResult(){
    var Q=state.quiz, p=pct(Q.correct,Q.items.length);
    var msg=p>=80?"Sterk werk! 🎉":p>=60?"Goed bezig 👍":"Blijf oefenen, je komt er 💪";
    var html='<div class="card pad results center"><span class="pill">Statistiek II</span><div class="big">'+p+'%</div>'+
      '<p style="font-weight:600;margin:0 0 4px;font-size:17px">'+msg+'</p><p class="muted">'+Q.correct+' van '+Q.items.length+' juist</p>'+
      '<div class="row" style="justify-content:center;margin-top:14px">'+
        (Q.wrong.length?'<button class="btn" id="retry">Herhaal '+Q.wrong.length+' foute vragen</button>':'')+
        '<button class="btn ghost" id="again">Nieuwe ronde</button><button class="btn ghost" id="home">Naar start</button></div></div>';
    setHTML(html);
    var rt=document.getElementById("retry"); if(rt) rt.onclick=function(){ startQuiz(shuffle(Q.wrong)); };
    document.getElementById("again").onclick=function(){ state.quiz=null; renderQuizGate(); };
    document.getElementById("home").onclick=function(){ state.quiz=null; go("home"); };
    state.key=null;
  }

  function renderTheory(){
    var q=state.sumq||"";
    var html='<div class="card pad" style="margin-bottom:14px"><h2 style="text-align:center;margin:0 0 8px">Theorie en samenvatting</h2>'+
      '<input type="search" id="sq" placeholder="Zoek een begrip… (bv. mediaan, z-score, Spearman)" value="'+esc(q)+'"></div><div id="list">'+theoryList(q)+'</div>';
    setHTML(html);
    var si=document.getElementById("sq"); si.oninput=function(){ state.sumq=si.value; document.getElementById("list").innerHTML=theoryList(si.value); si.focus(); };
  }
  function theoryList(query){
    var Q=query.trim().toLowerCase(), out="", n=0;
    D.theory.forEach(function(sec){
      var items=sec.items.filter(function(it){ return !Q || it.toLowerCase().indexOf(Q)>=0 || sec.h.toLowerCase().indexOf(Q)>=0; });
      if(!items.length) return; n++;
      out+='<details class="acc"'+(Q?" open":(n===1?" open":""))+'><summary><span class="n">'+ic("search")+'</span>'+esc(sec.h)+ic("chevR","caret")+'</summary><div class="body"><ul>'+items.map(function(it){return '<li>'+hl(esc(it),Q)+'</li>';}).join("")+'</ul></div></details>';
    });
    return out||'<p class="muted center">Geen resultaten voor "'+esc(query)+'".</p>';
  }
  function hl(t,q){ if(!q)return t; try{ return t.replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>"); }catch(e){ return t; } }

  function renderHacks(){
    var html='<div class="card pad" style="margin-bottom:16px"><h2 style="text-align:center;margin:0 0 6px">Studie-hacks</h2><p class="muted" style="text-align:center;margin:0">Ezelsbruggetjes om de kernideeën van statistiek te onthouden.</p></div>'+
      '<div class="tipgrid">'+D.hacks.map(function(t){return '<div class="tip"><h4>'+ic("bulb")+esc(t.h)+'</h4><p>'+esc(t.t)+'</p></div>';}).join("")+'</div>';
    setHTML(html);
  }

  function renderFeedback(){
    var html='<div class="card pad"><h2 style="text-align:center;margin-top:0">Feedback &amp; klachten</h2>'+
      '<p class="muted" style="text-align:center">Fout in een vraag, een idee, of werkt iets niet? Laat het hier weten, het komt rechtstreeks bij de maker terecht. Een review of compliment mag ook: de mooiste tonen we op de hub. 💬</p>'+
      '<label class="fld" for="fbMsg">Je bericht</label><textarea id="fbMsg" rows="3" placeholder="Beschrijf de fout of je idee…"></textarea>'+
      '<div class="fbextra"><div class="fbveld fbwaar"><label class="fld" for="fbWaar">Over welke vraag? <span class="muted">(optioneel)</span></label><input type="text" id="fbWaar" placeholder="bv. de vraag over de p-waarde"></div>'+
      '<div class="fbveld"><label class="fld" for="fbNaam">Je naam <span class="muted">(optioneel)</span></label><input type="text" id="fbNaam" placeholder="zodat we je kunnen bedanken"></div>'+
      '<div class="fbveld"><label class="fld" for="fbEmail">Je e-mail <span class="muted">(optioneel, als je een antwoord wilt)</span></label><input type="email" id="fbEmail" placeholder="naam@voorbeeld.be"></div></div>'+
      '<input type="text" id="fbBot" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0">'+
      '<div class="row" style="margin-top:16px;align-items:center"><button class="btn" id="fbSend">'+ic("send")+'Versturen</button><span id="fbStatus" style="font-size:13px"></span></div></div>';
    setHTML(html);
    document.getElementById("fbSend").onclick=function(){
      var status=document.getElementById("fbStatus");
      if(document.getElementById("fbBot").value) return;
      var msg=document.getElementById("fbMsg").value.trim();
      if(!msg){ status.style.color="var(--bad)"; status.textContent="Schrijf eerst een bericht."; return; }
      var btn=document.getElementById("fbSend"); btn.disabled=true; status.style.color="var(--muted)"; status.textContent="Versturen…";
      var em=document.getElementById("fbEmail").value.trim();
      var nm=document.getElementById("fbNaam").value.trim();
      var waar=document.getElementById("fbWaar").value.trim();
      var payload={_subject:"Statistiek II-tool: feedback", _template:"table", _captcha:"false",
        Naam:nm||"-", Over_welke_vraag:waar||"-", email:em||"-", Bericht:msg};
      if(em) payload._replyto=em;
      // vangnet: als de verzenddienst blokkeert (bv. spamfilter) of er is geen verbinding,
      // bieden we een directe mailto-knop aan zodat de melding NOOIT stilletjes verdwijnt.
      function failFallback(reden){
        var body="Feedback Statistiek II-tool%0D%0A%0D%0ANaam: "+encodeURIComponent(nm||"-")+"%0D%0AOver welke vraag: "+encodeURIComponent(waar||"-")+"%0D%0AE-mail: "+encodeURIComponent(em||"-")+"%0D%0A%0D%0ABericht:%0D%0A"+encodeURIComponent(msg);
        var mailto="mailto:berat007yildirim@gmail.com?subject="+encodeURIComponent("Statistiek II-tool: feedback")+"&body="+body;
        setHTML('<div class="card pad"><h2 style="margin-top:0">Automatisch versturen lukte niet</h2><p class="muted">'+reden+' Geen zorgen, klik hieronder en je melding wordt geopend in je e-mail, helemaal klaar om te versturen:</p><a class="btn" href="'+mailto+'">'+ic("send")+'Mail mijn melding direct</a><div style="margin-top:14px"><button class="btn ghost" id="bk">Terug naar start</button></div></div>');
        document.getElementById("bk").onclick=function(){go("home");};
      }
      fetch("https://formsubmit.co/ajax/Berat007yildirim@gmail.com",{method:"POST",headers:{Accept:"application/json"},body:new URLSearchParams(payload)})
        .then(function(r){return r.json();}).then(function(d){
          if(d&&(d.success===true||d.success==="true")){ setHTML('<div class="card pad results center"><div style="font-size:42px">✅</div><h2 style="margin:6px 0">Bedankt!</h2><p class="muted">Je melding is verstuurd.</p><button class="btn" id="bk" style="margin-top:8px">Terug naar start</button></div>'); document.getElementById("bk").onclick=function(){go("home");}; }
          else { failFallback("Het automatisch versturen lukte niet."); }
        }).catch(function(){ failFallback("Er was even geen verbinding."); });
    };
  }

  document.addEventListener("keydown",function(e){ if(state.key) state.key(e); });
  // bezoeker tellen (1x per toestel)
  try{ if(!localStorage.getItem("stat2_seen")){ localStorage.setItem("stat2_seen","1"); bump("berat-stat","gebruikers"); } }catch(e){ bump("berat-stat","gebruikers"); }
  // traject vanuit de hub overnemen → direct naar de oefenpagina
  try{ var _q=new URLSearchParams(location.search); var _m=_q.get("m");
    if(_m==="training"||_m==="herkansing"){ state.track=_m; lset("stat2_track",_m);
      var _c=_q.get("calm"); if(_c!=null){ calm=(_c!=="0"); lset("stat2_calm",calm); applyCalm(); }
      state.step="practice"; state.fromHub=true; }
  }catch(e){}
  render();
  // launch-splash netjes laten verdwijnen
  (function(){ var _sp=document.getElementById("splash"); if(!_sp) return; var _red=false; try{_red=window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){} setTimeout(function(){ _sp.classList.add("hide"); setTimeout(function(){ if(_sp&&_sp.parentNode) _sp.parentNode.removeChild(_sp); }, 700); }, _red?300:1850); })();
})();
</script>
<script>
/* gedeelde interactie: klik-animatie en zacht openschuivende theorieblokken */
(function(){
  // Elk theorieblok krijgt precies een wikkel-element, anders klapt een blok met
  // meerdere kinderen niet volledig dicht (MBG had er tien).
  function wikkel(){
    var lijst=document.querySelectorAll(".acc>.body");
    for(var i=0;i<lijst.length;i++){
      var b=lijst[i];
      if(b.children.length===1 && b.firstElementChild && b.firstElementChild.className==="bes-wrap") continue;
      var w=document.createElement("div"); w.className="bes-wrap";
      while(b.firstChild) w.appendChild(b.firstChild);
      b.appendChild(w);
    }
  }
  var gepland=false;
  function planWikkel(){ if(gepland)return; gepland=true; setTimeout(function(){ gepland=false; wikkel(); },0); }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",wikkel); else wikkel();
  try{ new MutationObserver(planWikkel).observe(document.documentElement,{childList:true,subtree:true}); }catch(e){}
  var KLIK="button,.btn,.iconbtn,.opt,.track,.chrow,.backlink,.chip,.mode,.toggle,.scard,.ccard,.qcard,.srclink,.bnlink,.navlink,.ycard,.excat,.brandstrip,summary";
  document.addEventListener("pointerdown",function(e){
    var el=(e.target&&e.target.closest)?e.target.closest(KLIK):null; if(!el)return;
    el.classList.remove("bes-klik"); void el.offsetWidth; el.classList.add("bes-klik");
    setTimeout(function(){ el.classList.remove("bes-klik"); },260);
  },true);
  document.addEventListener("click",function(e){
    var s=(e.target&&e.target.closest)?e.target.closest("details.acc>summary"):null; if(!s)return;
    var d=s.parentNode; if(!d) return;
    e.preventDefault();
    if(d.open){
      d.classList.add("bes-dicht");
      setTimeout(function(){ d.open=false; d.classList.remove("bes-dicht"); },250);
    } else {
      d.open=true; d.classList.add("bes-open");
      var los=function(){ d.classList.remove("bes-open"); };
      requestAnimationFrame(function(){ requestAnimationFrame(los); });
      setTimeout(los,400);
    }
  },false);
})();
</script>
