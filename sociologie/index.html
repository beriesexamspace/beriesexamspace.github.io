id van het sociale.",0],["De ethnomethodologie heeft een aantal mechanismen (zoals humor, afwachten, tact) aan het licht gebracht die ervoor zorgen dat het vertrouwen in normen en verwachtingen niet geheel geschaad wordt door het afwijken of frustreren ervan.",1],["Ethnomethodologen nemen aan dat het mogelijk is om alle praktische kennis om te zetten in discursieve kennis.",0],["Ethnomethodologen zijn ervan overtuigd dat de sociale constructie van de werkelijkheid transparant en eenvoudig te achterhalen is.",0]],"note":null,"q_en":"Ethnomethodology has a specific approach to social reality. Which statements are correct?","o_en":["Ethnomethodologists try, on the basis of the study of everyday actions and communication, to discover the fundamental rules of living together (a social grammar).","The renewal of roles, norms and conventions is not possible within ethnomethodology given the robustness of the social.","Ethnomethodology has brought to light a number of mechanisms (such as humour, waiting, tact) that ensure that trust in norms and expectations is not entirely damaged by deviation from or frustration of them.","Ethnomethodologists assume that it is possible to convert all practical knowledge into discursive knowledge.","Ethnomethodologists are convinced that the social construction of reality is transparent and easy to uncover."],"note_en":null},{"c":7,"sel":"juiste","pick":2,"q":"'Tact', humor en 'uitleggen' zijn mechanismen die…","o":[["ertoe bijdragen dat het sociale leven draaglijk wordt.",0],["ertoe bijdragen dat de gevolgen van gefrustreerde verwachtingen beperkt worden.",1],["ertoe bijdragen dat overtredingen van normen opgevangen worden zonder dat deviantie wordt vastgesteld.",1],["ertoe bijdragen dat de sociale orde zonder veel problemen verstoord kan worden.",0],["ertoe bijdragen dat sociale controle ontweken kan worden.",0]],"note":null,"q_en":"'Tact', humour and 'explaining' are mechanisms that…","o_en":["contribute to making social life bearable.","contribute to limiting the consequences of frustrated expectations.","contribute to absorbing violations of norms without deviance being established.","contribute to social order being disrupted without much difficulty.","contribute to social control being evaded."],"note_en":null},{"c":8,"sel":"juiste","pick":1,"q":"Wanneer we iemand een negatieve sanctie willen opleggen door in te spelen op overtuigingen:","o":[["is de voorwaarde solidariteit.",0],["noemen we dat bestraffen.",0],["kan deze sanctie circuleren via het symbolische medium invloed.",0],["activeren we de waardengetrouwheid.",1],["krijgt de gesanctioneerde schuldgevoelens en bevestigen wij zijn verbondenheid.",0],["is de voorwaarde voor de sanctionering veralgemeende waarden.",0],["gebruiken we beïnvloeding als sanctionering.",0],["is het gevolg waardengetrouwheid.",0],["gebruiken we reguliere macht.",0],["is de basis de controle over nuttige middelen.",0]],"note":null,"q_en":"When we want to impose a negative sanction on someone by appealing to convictions:","o_en":["the condition is solidarity.","we call that punishing.","this sanction can circulate through the symbolic medium of influence.","we activate value-commitment.","the sanctioned person develops feelings of guilt and we confirm his bond.","the condition for the sanctioning is generalized values.","we use influencing as sanctioning.","the result is value-commitment.","we use regular power.","the basis is control over useful means."],"note_en":null},{"c":8,"sel":"juiste","pick":2,"q":"Wat verstaan sociologen onder 'sociale controle'?","o":[["Het geheel van handelingen om het gedrag van anderen te beïnvloeden.",1],["Het geheel van handelingen die afwijking begrijpelijk en aanvaardbaar maken.",0],["Het geheel van handelingen die gesteld worden om afwijking of krenking van verwachtingen te voorkomen.",1],["Het geheel van sanctionerende handelingen die ingrijpen op de basisbehoeftes van de mens, namelijk veiligheid en fysiek welzijn.",0],["Het geheel van handelingen die specifieke verboden en geboden overbodig maken.",0]],"note":null,"q_en":"What do sociologists understand by 'social control'?","o_en":["The set of actions to influence the behaviour of others.","The set of actions that make deviation understandable and acceptable.","The set of actions taken to prevent deviation from or violation of expectations.","The set of sanctioning actions that intervene in the basic needs of humans, namely safety and physical well-being.","The set of actions that make specific prohibitions and commandments superfluous."],"note_en":null},{"c":8,"sel":"juiste","pick":2,"q":"Welke twee dichotomieën worden gekruist om de vier fundamentele typen van sancties te onderscheiden?","o":[["Cognitieve versus emotionele sancties.",1],["Inspelen op de materiële omstandigheden vs. inspelen op overtuigingen en gevoelens.",1],["Primaire versus secundaire sancties.",0],["Belonen versus bestraffen.",0],["Positief versus negatief sanctioneren.",0]],"note":"Verificatie betwist 'cognitief vs emotioneel', wellicht 'positief vs negatief'. Nakijken met cursus.","q_en":"Which two dichotomies are crossed to distinguish the four fundamental types of sanctions?","o_en":["Cognitive versus emotional sanctions.","Appealing to material circumstances vs. appealing to convictions and feelings.","Primary versus secondary sanctions.","Rewarding versus punishing.","Positive versus negative sanctioning."],"note_en":"Verification disputes 'cognitive vs emotional', probably 'positive vs negative'. Check against the course material."},{"c":8,"sel":"juiste","pick":2,"q":"Welke verschuiving in sanctioneringswijzen signaleert Foucault sedert de 18e eeuw?","o":[["Van negatieve naar positieve sancties.",0],["Van wetten naar normen.",0],["Van externe naar interne sancties.",1],["Van bestraffen naar activeren van waardengetrouwheid.",1],["Van straffen naar belonen.",0]],"note":null,"q_en":"Which shift in modes of sanctioning does Foucault identify since the 18th century?","o_en":["From negative to positive sanctions.","From laws to norms.","From external to internal sanctions.","From punishing to activating value-commitment.","From punishing to rewarding."],"note_en":null},{"c":8,"sel":"juiste","pick":1,"q":"Als in het kader van de sanctioneringswijzen wordt gesproken van 'beïnvloeden', dan wordt daarmee bedoeld:","o":[["Het beroep doen op een machtspositie waardoor de ander de opgelegde gedragsregel wel moet aanvaarden.",0],["Het in het vooruitzicht stellen van een beloning.",0],["Het steunen op de veronderstelling dat men in het beste belang van iemand handelt.",1],["Het rekenen op een overeenstemming van overtuigingen en waarden.",0]],"note":null,"q_en":"When, in the context of modes of sanctioning, one speaks of 'influencing', this means:","o_en":["Appealing to values and ideals.","Holding out the prospect of a reward.","Relying on the assumption that one is acting in someone's best interest.","Counting on an agreement of convictions and values."],"note_en":null},{"c":8,"sel":"foute","pick":2,"q":"Het begrip 'discours' neemt een centrale plaats in bij Foucault. Wat verstaan we eronder? Duid de twee FOUTE antwoorden.","o":[["Een discours is een manier van spreken die de spreker meteen ook opvattingen en waarden aanreikt.",0],["Een discours is een bepaalde perceptie van de werkelijkheid die zelfonderhoudend is; door het aanhouden ervan bevestigt men ze steeds.",0],["Een discours situeert mensen in een bepaalde werkelijkheid en beïnvloedt zo hun voelen en denken.",0],["Een discours is een strijdlustig betoog dat mensen wil aanzetten tot actie.",1],["Een discours is een reconstructie van een dialoog tussen historische figuren.",1]],"note":null,"q_en":"The concept of 'discourse' occupies a central place in Foucault's work. What do we understand by it? Select the two INCORRECT answers.","o_en":["A discourse is a way of speaking that immediately also provides the speaker with views and values.","A discourse is a particular perception of reality that is self-sustaining; by maintaining it one constantly confirms it.","A discourse situates people in a particular reality and thereby influences their feeling and thinking.","A discourse is a combative argument that aims to incite people to action.","A discourse is a reconstruction of a dialogue between historical figures."],"note_en":null},{"c":8,"sel":"juiste","pick":2,"q":"Parsons onderscheidde vier vormen van sanctionering, waaronder 'waardengetrouwheid'. Welke stellingen sluiten aan bij deze vorm?","o":[["Amira en Beril zijn goede vrienden; ze kunnen elkaar een gunst vragen in naam van hun vriendschap, maar dan is een materiële beloning of dreiging met straf nodig.",0],["Als Noor een diepgelovige christen is, kan men haar tot bepaalde handelingen brengen door te zeggen dat die voor christenen een heilige plicht zijn.",1],["Als Alex zichzelf als socialist ziet, voelt hij zich aangemoedigd het systeem van sociale zekerheid te verdedigen als de partijvoorzitter zegt dat goede socialisten dat doen.",1],["Zodra mensen waarden delen, kunnen zij elkaars gedrag sanctioneren omdat zij weten met welke materiële beloningen en straffen ze elkaar het best beïnvloeden.",0],["Het veranderen van mening of overtuiging wordt gesanctioneerd omdat je op dat moment niet trouw bent aan je waarden.",0]],"note":null,"q_en":"Parsons distinguished four forms of sanctioning, including 'value-commitment'. Which statements correspond to this form?","o_en":["Amira and Beril are good friends; they can ask each other a favour in the name of their friendship, but then a material reward or threat of punishment is needed.","If Noor is a devout Christian, one can bring her to certain actions by saying that these are a sacred duty for Christians.","If Alex sees himself as a socialist, he feels encouraged to defend the system of social security when the party chairman says that good socialists do so.","As soon as people share values, they can sanction each other's behaviour because they know with which material rewards and punishments they can best influence each other.","Changing one's opinion or conviction is sanctioned because at that moment you are not being true to your values."],"note_en":null},{"c":9,"sel":"juiste","pick":1,"q":"Marx ziet hoe steeds meer menselijke activiteiten tegen geld geruild en als koopwaar verhandeld worden. Hoe noemt Marx dit proces?","o":[["Fanatisme",0],["Sociale ongelijkheid",0],["Verpaupering",0],["Gentrificatie",0],["Commodificatie",1],["Kapitalisme",0],["Geldzucht",0],["Globalisering",0],["Speculatie",0],["Waardestimulatie",0]],"note":null,"q_en":"Marx observes how more and more human activities are exchanged for money and traded as commodities. What does Marx call this process?","o_en":["Fanaticism","Social inequality","Pauperization","Gentrification","Commodification","Capitalism","Greed for money","Globalization","Speculation","Value stimulation"],"note_en":null},{"c":9,"sel":"juiste","pick":2,"q":"Welke uitspraken over de versymbolisering en schaalvergroting van de sanctioneringswijzen zijn juist?","o":[["De eerbied voor reguliere macht is afhankelijk van het geloof in de omzetbaarheid ervan in een daadwerkelijke straf.",1],["De waarde van geld ligt besloten in zijn directe gebruiksmogelijkheden.",0],["De schaalvergroting van de sanctioneringswijzen gaat de versymbolisering vooraf.",0],["Om herkozen te worden zal een politicus vooral een beroep doen op de eerbied die we hebben voor reguliere macht.",0],["Een afname van vertrouwen in symbolen leidt tot een terugkeer naar meer kleinschalige netwerken.",1]],"note":null,"q_en":"Which statements about the symbolization and scaling-up of the modes of sanctioning are correct?","o_en":["Respect for regular power depends on the belief in its convertibility into an actual punishment.","The value of money lies in its direct possibilities for use.","The scaling-up of the modes of sanctioning precedes their symbolization.","In order to be re-elected, a politician will mainly appeal to the respect we have for regular power.","A decline in trust in symbols leads to a return to more small-scale networks."],"note_en":null},{"c":9,"sel":"foute","pick":2,"q":"Wat verstaan we onder de veralgemening of versymbolisering van sanctioneringsmogelijkheden? Duid de twee FOUTE antwoorden.","o":[["Dit betekent dat de sancties vervagen en vervlakken zodat het vertrouwen in deze sancties heel kwetsbaar wordt.",1],["Dit betekent dat de sancties in een groter aantal levenssferen erkend en toepasbaar worden.",0],["Dit betekent dat de sanctioneringsmogelijkheden overdraagbaar of doorgeefbaar worden.",0],["Dit betekent dat de sancties eenzelfde betekenis behouden onder gelijke omstandigheden.",0],["Dit betekent dat de sancties een zeer algemene betekenis krijgen.",1]],"note":null,"q_en":"What do we mean by the generalization or symbolization of sanctioning possibilities? Select the two INCORRECT answers.","o_en":["This means that the sanctions blur and flatten out, so that trust in these sanctions becomes very vulnerable.","This means that the sanctions become recognized and applicable in a greater number of spheres of life.","This means that the sanctioning possibilities become transferable or passable on to others.","This means that the sanctions retain the same meaning under equal circumstances.","This means that the sanctions acquire a very general meaning."],"note_en":null},{"c":9,"sel":"juiste","pick":2,"q":"Welke processen signaleert Talcott Parsons in verband met de sanctioneringswijzen?","o":[["Versymbolisering",1],["Activering",0],["Schaalvergroting",1],["Informalisering",0],["Regularisering",0]],"note":null,"q_en":"Which processes does Talcott Parsons identify in connection with the modes of sanctioning?","o_en":["Symbolization","Activation","Scaling-up","Informalization","Regularization"],"note_en":null},{"c":9,"sel":"juiste","pick":2,"q":"Welke twee uitspraken over 'geld' zijn juist?","o":[["Geld is op zich waardeloos maar krijgt waarde door zijn onmiddellijke gebruikswaarde.",0],["In periodes van economische recessie verliest geld zijn rol in het verlenen van sociale status.",0],["Geld is een voorstelling van de belofte dat iemand anders het zal aanvaarden in ruil voor intrinsiek waardevolle goederen.",1],["Geld symboliseert de mogelijkheid een ander te kunnen straffen.",0],["Het gebruik van geld is afhankelijk van het vertrouwen in zijn ruilwaarde.",1]],"note":null,"q_en":"Which two statements about 'money' are correct?","o_en":["Money is worthless in itself but acquires value through its immediate use value.","In periods of economic recession, money loses its role in conferring social status.","Money is a representation of the promise that someone else will accept it in exchange for intrinsically valuable goods.","Money symbolizes the possibility of being able to punish another person.","The use of money depends on trust in its exchange value."],"note_en":null},{"c":9,"sel":"juiste","pick":2,"q":"…(in verband met) straffen wordt reguliere macht als…","o":[["de straffen eerder symbolisch zijn (bv. een geldboete) dan fysiek.",0],["de straf niet langer afhankelijk is van personen die fysiek de straf kunnen uitvoeren, maar van personen die vanuit hun bevoegdheid een reeks handelingen kunnen stellen die uiteindelijk tot een straf leiden.",1],["er meer gedreigd wordt dan gestraft.",0],["de tekenen die erop wijzen dat iemand de bedreiging met straf daadwerkelijk kan uitvoeren, vervangen worden door symbolen.",1],["het dreigen met straf op zich volstaat om sociale controle uit te oefenen en het uitvoeren van straffen zeldzaam wordt.",0]],"note":null,"q_en":"…(in connection with) punishment, regular power becomes …","o_en":["the punishments are rather symbolic (e.g. a fine) than physical.","the punishment no longer depends on persons who can physically carry out the punishment, but on persons who, by virtue of their authority, can perform a series of actions that ultimately lead to a punishment.","there is more threatening than punishing.","the signs indicating that someone can actually carry out the threat of punishment are replaced by symbols.","the mere threat of punishment is sufficient to exercise social control, and the actual carrying out of punishments becomes rare."],"note_en":null},{"c":9,"sel":"juiste","pick":2,"q":"In welke zin is het uniform van de agent een 'versymbolisering' van de reguliere macht?","o":[["Omdat in onze maatschappij het uniform een maat van status en orde is geworden.",1],["Omdat het uniform de macht voorstelt om te beboeten en te bestraffen.",0],["Omdat het uniform in onze samenleving een groot symbolisch belang heeft.",0],["Omdat men door het dragen van het uniform iemand symbolisch kan bestraffen.",0],["Omdat in onze maatschappij alle mensen het uniform van de agent erkennen als een teken van reguliere macht.",1]],"note":null,"q_en":"In what sense is the police officer's uniform a 'symbolization' of regular power?","o_en":["Because in our society the uniform has become a measure of status and order.","Because the uniform represents the power to fine and punish.","Because the uniform has great symbolic significance in our society.","Because by wearing the uniform one can symbolically punish someone.","Because in our society all people recognize the police officer's uniform as a sign of regular power."],"note_en":null},{"c":10,"sel":"juiste","pick":1,"q":"In welke theorie over criminaliteit wordt crimineel gedrag verklaard via het verband tussen de succescriteria/verwachtingen in een samenleving en de toegang tot wettelijke middelen om dat succes te verwerven?","o":[["Frenologie",0],["Anomietheorie",1],["Subcultuurtheorie",0],["Sociale-disorganisatietheorie",0],["Gebroken-vensters-theorie",0],["Rationele keuze-theorie",0],["New Criminology",0],["Ethnomethodologie",0],["Etiketteringstheorie",0],["Controletheorie",0]],"note":null,"q_en":"In which theory of crime is criminal behavior explained through the relationship between the criteria for success/expectations in a society and access to the legal means to achieve that success?","o_en":["Phrenology","Anomie theory","Subculture theory","Social disorganization theory","Broken windows theory","Rational choice theory","New Criminology","Ethnomethodology","Labeling theory","Control theory"],"note_en":null},{"c":10,"sel":"foute","pick":2,"q":"Welke twee stellingen over criminaliteit zijn FOUT?","o":[["Volgens de rationele keuzetheorie zal iemand een misdaad plegen als de verwachte baten opwegen tegen het risico gepakt en gestraft te worden.",0],["Alle overtredingen van normen en regels worden in de maatschappij gezien als crimineel gedrag.",1],["Anomie maakt het waarschijnlijker dat mensen criminele middelen gaan gebruiken om hun doelen te bereiken.",0],["Criminaliteit is een contingent begrip.",0],["Gerechtelijke statistieken zullen een hoger aantal overtredingen bevatten dan politiestatistieken.",1]],"q_en":"Which two statements about crime are INCORRECT?","o_en":["According to rational choice theory, someone will commit a crime if the expected benefits outweigh the risk of being caught and punished.","All violations of norms and rules are seen as criminal behavior in society.","Anomie makes it more likely that people will use criminal means to achieve their goals.","Crime is a contingent concept.","Judicial statistics will contain a higher number of offenses than police statistics."],"why":"Twee stellingen kloppen niet. Ten eerste geldt niet elke overtreding van een norm als criminaliteit: pas wat strafbaar is gesteld telt mee, en dat verschilt per tijd en plaats. Ten tweede bevatten politiestatistieken juist meer feiten dan gerechtelijke statistieken, want onderweg vallen zaken af door seponering, gebrek aan bewijs of een minnelijke schikking."},{"c":10,"sel":"foute","pick":2,"q":"Sociologische verklaringen van misdadigheid steunen op de volgende inzichten. Duid de twee FOUTE antwoorden.","o":[["Een criminele persoonlijkheid kan niet op basis van uiterlijke, morfologische kenmerken geïdentificeerd worden, maar wel op basis van dieperliggende, genetische eigenschappen.",1],["Misdadigheid wordt in de hand gewerkt door sommige subculturen.",0],["Misdadigheid is geen kenmerk van het biologische organisme, maar van de persoonlijkheid.",1],["Misdadigheid wordt in de hand gewerkt door een discrepantie tussen de doelen die mensen menen te moeten verwezenlijken en de wettelijke middelen waarover zij beschikken.",0],["Criminaliteit is een kwestie van evaluatie.",0]],"note":"Tweede sleutel verificatie-discutabel, nakijken met cursus.","q_en":"Sociological explanations of crime rest on the following insights. Select the two INCORRECT answers.","o_en":["A criminal personality cannot be identified on the basis of external, morphological features, but it can on the basis of deeper-lying, genetic characteristics.","Crime is encouraged by certain subcultures.","Crime is not a characteristic of the biological organism, but of the personality.","Crime is encouraged by a discrepancy between the goals that people believe they must achieve and the legal means at their disposal.","Crime is a matter of evaluation."],"note_en":"Second key disputable in verification - check against the course."},{"c":10,"sel":"juiste","pick":2,"q":"Als bepaalde strafbare gedragingen (bv. vandalisme, kleine criminaliteit) minder frequent worden, is het dan mogelijk dat de criminele statistiek tóch op een toename wijst?","o":[["Neen, tenzij er iets gebeurt zoals een verandering in het gedrag van de politie.",1],["Neen, want we leiden de frequentie van crimineel gedrag immers af uit de criminele statistiek.",0],["Neen, want de statistiek registreert de som van het reële gedrag en het meldingsgedrag.",0],["Ja, als het meldingsgedrag van de burgers verandert.",1],["Neen, aangezien de statistiek de frequentie van dat gedrag registreert.",0]],"note":"De twee aangeduide opties lijken tegenstrijdig, controleer in de cursus.","q_en":"If certain punishable behaviors (e.g. vandalism, petty crime) become less frequent, is it possible that the crime statistics nevertheless indicate an increase?","o_en":["No, unless something happens such as a change in the behavior of the police.","No, because we deduce the frequency of criminal behavior from the crime statistics.","No, because the statistics record the sum of actual behavior and reporting behavior.","Yes, if the reporting behavior of citizens changes.","No, since the statistics record the frequency of that behavior."],"note_en":"The two marked options seem contradictory - check in the course."},{"c":10,"sel":"juiste","pick":2,"q":"Conflictsociologen en functionalisten verklaren criminaliteit verschillend. Welke elementen horen eerder bij een functionalistische benadering?","o":[["Criminele subculturen-theorie en de wijze waarop personen binnen een groep status verwerven.",1],["Discriminatie op de arbeidsmarkt en hoe dit leidt tot afwijkend gedrag.",0],["De proportioneel ongelijke berechting van witteboordencriminaliteit en winkeldiefstal.",0],["De grotere efficiëntie van zero-tolerance policing in de strijd tegen criminaliteit.",0],["Het verband tussen de gewijzigde houding ten aanzien van verkrachting en de grotere gelijkheid tussen man en vrouw.",1]],"note":null,"q_en":"Conflict sociologists and functionalists explain crime differently. Which elements belong rather to a functionalist approach?","o_en":["Criminal subculture theory and the way in which individuals acquire status within a group.","Discrimination in the labor market and how this leads to deviant behavior.","The proportionally unequal prosecution of white-collar crime and shoplifting.","The greater efficiency of zero-tolerance policing in the fight against crime.","The connection between the changed attitude toward rape and the greater equality between men and women."],"note_en":null},{"c":10,"sel":"juiste","pick":2,"q":"Welke twee maatregelen ter bestrijding van criminaliteit zou een verdediger van de rational choice-theorie NIET suggereren?","o":[["De pakkans verhogen en de straffen verzwaren.",0],["Armoede bestrijden.",0],["In het verenigingsleven investeren.",1],["Meer politieagenten op straat laten patrouilleren.",0],["Gangsterfilms verbieden.",1]],"note":null,"q_en":"Which two measures to combat crime would a defender of rational choice theory NOT suggest?","o_en":["Increasing the likelihood of being caught and increasing the severity of punishments.","Combating poverty.","Investing in community and associational life.","Having more police officers patrol the streets.","Banning gangster films."],"note_en":null},{"c":10,"sel":"juiste","pick":2,"q":"Het condoomverbod van Paus Leo XII (syfilis) en het latere pleidooi om in de strijd tegen AIDS wél condooms toe te laten, sociologisch bekeken blijkt hieruit:","o":[["Dat wat we als afwijkend gedrag beschouwen een biologische motivatie kent.",0],["Dat ziekten een morele betekenis kunnen krijgen.",1],["Dat de begrippen ziekte, zonde en misdaad niet altijd even duidelijk gescheiden worden.",1],["Dat de ontdekking van de juiste, wetenschappelijke betekenis van syfilis en AIDS van recente datum is.",0],["Dat de toegenomen geneeskundige kennis ziektes onthecht van ethische ideeën.",0]],"note":null,"q_en":"The condom ban of Pope Leo XII (syphilis) and the later plea to allow condoms in the fight against AIDS - viewed sociologically, this shows:","o_en":["That what we consider deviant behavior has a biological motivation.","That diseases can acquire a moral meaning.","That the concepts of disease, sin and crime are not always clearly separated.","That the discovery of the correct, scientific meaning of syphilis and AIDS is of recent date.","That increased medical knowledge detaches diseases from ethical ideas."],"note_en":null},{"c":11,"sel":"juiste","pick":1,"q":"Welke sociologische term komt hier aan bod: leerlingen die het in de klas minder goed doen, worden vaak toonaangevend in de peergroup met tegengestelde normen, om zo wat aanzien te verwerven?","o":[["stratificatie",0],["etikettering",0],["Mattheus-effect",0],["labeling",0],["roldistantie",0],["symbolisch determinisme",0],["commodificatie",0],["zelfbevestigende voorspelling",0],["statuscompensatie",1],["sociale dispositie",0]],"note":null,"q_en":"Which sociological term applies here: pupils who perform less well in class often become trend-setters in the peer group with opposing norms, in order to gain some prestige?","o_en":["stratification","labeling","Matthew effect","labeling","role distance","symbolic determinism","commodification","self-fulfilling prophecy","status compensation","social disposition"],"note_en":null},{"c":11,"sel":"juiste","pick":2,"q":"Welke inzichten leverde Pierre Bourdieu over de relatie tussen smaakpatronen/vrijetijdsbesteding en sociale positie?","o":[["Volgens Bourdieu kenmerken innovatie en creativiteit, bij gebrek aan financiële middelen, het smaakpatroon van de lage sociale klassen.",0],["Bourdieu meent dat spilzucht en opzichtigheid het smaakpatroon van de elite kenmerken.",0],["Bourdieu bekritiseert het idee dat het louter de financiële middelen zijn die het smaakpatroon van een sociale klasse bepalen.",1],["Bourdieu introduceert het concept 'habitus' dat later door Norbert Elias gepopulariseerd werd.",0],["Via het opgroeien in een bepaald sociaal milieu verwerft men vaardigheden, middelen en sociale contacten die een specifiek smaakpatroon mogelijk en voorspelbaar maken.",1]],"note":null,"q_en":"What insights did Pierre Bourdieu provide on the relationship between taste patterns/leisure activities and social position?","o_en":["According to Bourdieu, innovation and creativity, in the absence of financial means, characterize the taste pattern of the lower social classes.","Bourdieu holds that extravagance and ostentation characterize the taste pattern of the elite.","Bourdieu criticizes the idea that it is merely financial means that determine the taste pattern of a social class.","Bourdieu introduces the concept of 'habitus', which was later popularized by Norbert Elias.","By growing up in a particular social milieu, one acquires skills, resources and social contacts that make a specific taste pattern possible and predictable."],"note_en":null},{"c":11,"sel":"foute","pick":2,"q":"Geef de twee FOUTE uitspraken in verband met klasse en kasten.","o":[["Het lidmaatschap van een kaste heeft niets met persoonlijke verdienste te maken.",0],["Het kastensysteem, in zijn klassieke vorm, hield geen oordeel over personen in en droeg een sterke legitimering in zich.",0],["In een maatschappij met een klassenkarakter wordt de plaats die men op de maatschappelijke ladder inneemt, formeel door de geboorte bepaald.",1],["Met de overstap van kaste en stand naar een klassenmaatschappij zijn we een formeel egalitaire, maar in de feiten ongelijke samenleving geworden.",0],["Kaste en klasse zijn twee termen die naar hetzelfde begrip verwijzen.",1]],"q_en":"Give the two INCORRECT statements about class and castes.","o_en":["Membership of a caste has nothing to do with personal merit.","The caste system, in its classical form, did not entail any judgement of individuals and carried a strong legitimation within itself.","In a society of a class character, the position one occupies on the social ladder is formally determined by birth.","With the transition from caste and estate to a class society, we have become a formally egalitarian but in fact unequal society.","Caste and class are two terms that refer to the same concept."],"why":"Twee uitspraken kloppen niet. In een klassenmaatschappij ligt je plaats formeel niet bij geboorte vast, dat is juist het verschil met een kastensysteem. En kaste en klasse zijn geen synoniemen: een kaste erf je en kan je niet verlaten, een klasse hangt samen met je positie op de markt."},{"c":11,"sel":"juiste","pick":2,"q":"Wat bedoelen sociologen als ze spreken over een 'egalitaire maatschappij'?","o":[["Ongelijkheid wordt niet langer verantwoord in termen van goddelijke wilsbeschikking of opvattingen over de aard van de kosmos.",1],["Het individu is de belangrijkste verantwoordelijke voor het verwerven van zijn/haar sterke maatschappelijke positie.",1],["De meest grove vormen van ongelijkheid zijn onder meer dankzij de welvaartsstaat verdwenen.",0],["Dat een individu geen schuld treft wanneer hij minder welstellend is.",0],["Dat het streven naar gelijkheid in de wetten is ingeschreven.",0]],"note":null,"q_en":"What do sociologists mean when they speak of an 'egalitarian society'?","o_en":["Inequality is no longer justified in terms of divine providence or notions about the nature of the cosmos.","The individual is the main party responsible for acquiring his/her strong social position.","The most blatant forms of inequality have disappeared, partly thanks to the welfare state.","That an individual is not at fault when he is less well-off.","That the pursuit of equality is enshrined in the laws."],"note_en":null},{"c":11,"sel":"juiste","pick":2,"q":"In 'The Theory of the Leisure Class' heeft Thorstein Veblen het over 'conspicuous consumption'. Wat bedoelt hij daarmee?","o":[["Het vrijetijdspatroon van de eind-19e-eeuwse Amerikaanse elite.",1],["Het onoordeelkundig gebruik van beschikbare middelen bij de invulling van de vrijetijdsbesteding.",0],["Het compenseren van een lage sociale positie via overdreven grote uitgaven aan luxeproducten.",0],["Het doorbreken van klassengebonden smaakpatronen.",0],["De spilzuchtige, opzichtige besteding van bezit en vermogen voor het zich aanmeten van status.",1]],"note":null,"q_en":"In 'The Theory of the Leisure Class', Thorstein Veblen speaks of 'conspicuous consumption'. What does he mean by this?","o_en":["The leisure pattern of the late-19th-century American elite.","The injudicious use of available means in filling one's leisure time.","Compensating for a low social position through excessively large expenditures on luxury products.","The breaking through of class-bound taste patterns.","The extravagant, ostentatious expenditure of property and wealth in order to assume status."],"note_en":null},{"c":11,"sel":"juiste","pick":2,"q":"Welke inzichten leverde Veblen met 'The Theory of the Leisure Class'?","o":[["Dat een hogere sociale positie zich altijd uitdrukt in 'conspicuous consumption'.",0],["Dat een sociale positie zich symbolisch uitdrukt onder de vorm van een specifiek smakenpatroon.",1],["Dat in elke samenleving de elite zich wil laten onderscheiden van de lagere sociale klassen via onder meer zijn smakenpatroon.",1],["Dat de vrijetijdsbesteding van een persoon een compensatie of uitlaatklep kan bieden voor zijn/haar minder sterke sociale positie.",0],["Dat men niet enkel geld, maar ook kennis en vaardigheden nodig heeft om zich via smaak en consumptie een bepaalde status aan te meten.",0]],"note":null,"q_en":"What insights did Veblen provide with 'The Theory of the Leisure Class'?","o_en":["That a higher social position always expresses itself in 'conspicuous consumption'.","That a social position expresses itself symbolically in the form of a specific taste pattern.","That in every society the elite wants to distinguish itself from the lower social classes through, among other things, its taste pattern.","That a person's leisure activities can offer compensation or an outlet for his/her weaker social position.","That one needs not only money but also knowledge and skills to assume a particular status through taste and consumption."],"note_en":null},{"c":11,"sel":"juiste","pick":2,"q":"Welke twee mechanismen schuilen onder de etiketteringstheorie?","o":[["Mensen die de slechte reputatie van een persoon kennen, gaan zijn/haar gedrag sneller interpreteren als afwijkend.",1],["De geëtiketteerde persoon internaliseert na verloop van tijd het negatieve beeld dat de anderen van hem/haar hebben.",1],["Personen in een sociaal zwakke positie zoeken compensatie via het 'zwartmaken' van welgestelde individuen.",0],["Het toekennen van een 'etiket' aan personen die afwijkend handelden, verkleint de kans dat ze recidiveren.",0],["Het statuscompenserende gedrag van personen uit een lage sociale klasse krijgt sneller een negatieve interpretatie.",0]],"note":null,"q_en":"Which two mechanisms lie behind labeling theory?","o_en":["People who know a person's bad reputation are quicker to interpret his/her behaviour as deviant.","Over time the labeled person internalizes the negative image that others have of him/her.","Persons in a socially weak position seek compensation by 'smearing' well-off individuals.","Assigning a 'label' to persons who acted deviantly reduces the chance that they will reoffend.","The status-compensating behaviour of persons from a low social class is more quickly given a negative interpretation."],"note_en":null},{"c":12,"sel":"juiste","pick":1,"q":"Welke vorm van macht uit zich via het belonen met schaarse en begeerde goederen of diensten?","o":[["Intellectuele macht",0],["Grondwettelijke macht",0],["Politieke macht",0],["Culturele macht",0],["Sanctionerende macht",0],["Geregulariseerde macht",0],["Economische macht",1],["Sociale macht",0],["Wetgevende macht",0],["Fysieke macht",0]],"note":null,"q_en":"Which form of power expresses itself through rewarding with scarce and coveted goods or services?","o_en":["Intellectual power","Constitutional power","Political power","Cultural power","Sanctioning power","Regularized power","Economic power","Social power","Legislative power","Physical power"],"note_en":null},{"c":12,"sel":"juiste","pick":2,"q":"Duncan en Blau ontwikkelden een basismodel van statusverwerving. Welke uitspraken over onderwijsniveau en beroepsstatus gaan op voor de Vlaamse en Nederlandse context?","o":[["Naast het onderwijsniveau van de ouders zijn ook hun culturele praktijken (zoals mediavoorkeur) van invloed op het onderwijsniveau van het kind.",1],["De invloed van de beroepsstatus van de vader op het onderwijsniveau van het kind is toegenomen.",0],["De invloed van het verworven diploma op de eigen loopbaan is mettertijd veel groter geworden.",1],["Het onderwijsniveau en de beroepsstatus van de vader hebben geen van beide invloed verloren op het onderwijsniveau van het kind.",0],["De beroepsstatus van de vader heeft een grotere invloed op het onderwijsniveau van het kind dan het onderwijsniveau van de vader.",0]],"note":null,"q_en":"Duncan and Blau developed a basic model of status attainment. Which statements about educational level and occupational status hold true for the Flemish and Dutch context?","o_en":["Besides the parents' educational level, their cultural practices (such as media preference) also influence the child's educational level.","The influence of the father's occupational status on the child's educational level has increased.","The influence of the acquired diploma on one's own career has become much greater over time.","Neither the educational level nor the occupational status of the father has lost influence on the child's educational level.","The father's occupational status has a greater influence on the child's educational level than the father's educational level does."],"note_en":null},{"c":12,"sel":"juiste","pick":2,"q":"Welke stellingen verdedigen Herrnstein en Murray in hun boek 'The Bell Curve'?","o":[["Het aandeel personen met een hoog IQ in de lagere sociale klassen zal toenemen.",0],["Het democratiseren van het onderwijssysteem zal het gemiddelde IQ drastisch verhogen en de normaalverdeling doorbreken.",0],["Mensen zijn geneigd te huwen met een sociaal gelijke, d.i. homogamie.",1],["Een samenleving die een open onderwijssysteem en een efficiënte organisatie nastreeft, zal gaandeweg meer macht geven aan mensen met een hoog IQ.",1],["Het IQ van een persoon is niet biologisch maar sociaal erfelijk.",0]],"note":null,"q_en":"Which claims do Herrnstein and Murray defend in their book 'The Bell Curve'?","o_en":["The share of persons with a high IQ in the lower social classes will increase.","Democratizing the education system will drastically raise the average IQ and break through the normal distribution.","People tend to marry a social equal, i.e. homogamy.","A society that pursues an open education system and an efficient organization will gradually give more power to people with a high IQ.","A person's IQ is not biologically but socially heritable."],"note_en":null},{"c":12,"sel":"foute","pick":2,"q":"Welke drie principes van stratificatie onderscheidt Max Weber? Duid de twee FOUTE antwoorden. (correct = klasse, stand, partij)","o":[["Klasse",0],["Stand",0],["Partij",0],["Kaste",1],["Beroepsgroep",1]],"note":null,"q_en":"Which three principles of stratification does Max Weber distinguish? Select the two INCORRECT answers. (correct = class, estate, party)","o_en":["Class","Estate","Party","Caste","Occupational group"],"note_en":null},{"c":12,"sel":"juiste","pick":2,"q":"Welke principes en ideeën horen bij de term 'meritocratie' zoals Michael Young die beschreef?","o":[["Opwaartse sociale mobiliteit is uitsluitend een gevolg van inzet en prestatie.",1],["Talent en intelligentie zijn gelijk verdeeld over de diverse sociale klassen.",0],["Onderwijskansen worden geboden op basis van talent en intelligentie.",1],["Sociale mobiliteit is onvoorspelbaar.",0],["Laaggeschoolden en mensen in sociaal zwakke posities hebben pech gehad.",0]],"note":null,"q_en":"Which principles and ideas belong to the term 'meritocracy' as described by Michael Young?","o_en":["Upward social mobility is exclusively a result of effort and achievement.","Talent and intelligence are equally distributed across the various social classes.","Educational opportunities are offered on the basis of talent and intelligence.","Social mobility is unpredictable.","The low-skilled and people in socially weak positions have had bad luck."],"note_en":null},{"c":12,"sel":"juiste","pick":2,"q":"Waar doelde Max Weber op met het onderscheid tussen 'een klasse op zichzelf' en 'een klasse voor zichzelf'?","o":[["Het is niet omdat mensen een aantal economische levenscondities delen dat ze zich daarom noodzakelijk zullen verenigen of politiek organiseren.",1],["Met dit begrippenpaar verwijst Weber naar het bewustwordingsproces van lotgenoten uit eenzelfde sociale klasse.",1],["Met dit begrippenpaar maakt Weber duidelijk dat de Geest van het Kapitalisme moet doordringen in het bewustzijn van de arbeidersklasse.",0],["Niet de gemeenschappelijke smaakpatronen maar de gedeelde ervaring van gelijke economische condities zijn van belang voor groepsvorming.",0],["Een 'klasse voor zichzelf' groepeert mensen met een gelijke economische situatie; we spreken van een 'klasse op zichzelf' wanneer deze mensen zich ook bewust zijn van hun gedeelde lot.",0]],"note":null,"q_en":"What was Max Weber referring to with the distinction between 'a class in itself' and 'a class for itself'?","o_en":["The fact that people share a number of economic living conditions does not mean they will therefore necessarily unite or organize politically.","With this pair of concepts Weber refers to the process by which fellow members of the same social class become aware of one another.","With this pair of concepts Weber makes clear that the Spirit of Capitalism must penetrate the consciousness of the working class.","It is not the shared taste patterns but the shared experience of equal economic conditions that matter for group formation.","A 'class for itself' groups together people with an equal economic situation; we speak of a 'class in itself' when these people are also aware of their shared fate."],"note_en":null},{"c":12,"sel":"juiste","pick":2,"q":"Welke twee tendensen inzake stratificatie en ongelijkheid gelden in onze huidige samenleving?","o":[["Voor de levenskansen van mensen is hun cultureel kapitaal steeds meer van doorslaggevend belang.",1],["Laaggeschoolden lopen een hoog risico op uitsluiting, die bovendien snel beschouwd wordt als het gevolg van een gebrek aan persoonlijke inzet of verdienste.",1],["Armoede en uitsluiting blijven, ook voor laaggeschoolden, in grote mate een onvoorspelbaar ongeluk.",0],["Onderzoek wijst uit dat sociale posities in toenemende mate toegewezen en steeds minder verworven worden.",0],["De invloed van de beroepsstatus van de vader op het onderwijsniveau (en dus de levenskansen) van het kind is de afgelopen decennia toegenomen.",0]],"note":null,"q_en":"Which two tendencies regarding stratification and inequality apply in our present-day society?","o_en":["For people's life chances, their cultural capital is increasingly of decisive importance.","The low-skilled run a high risk of exclusion, which is moreover quickly regarded as the result of a lack of personal effort or merit.","Poverty and exclusion remain, even for the low-skilled, to a large extent an unpredictable misfortune.","Research shows that social positions are increasingly ascribed and ever less achieved.","The influence of the father's occupational status on the child's educational level (and thus life chances) has increased over recent decades."],"note_en":null},{"c":13,"sel":"juiste","pick":1,"q":"Met welke term verwijzen sociale wetenschappers naar het bestaan van verzuiling?","o":[["Ideologische concentratie",0],["Socio-culturele insluiting",0],["Cultureel pluralisme",0],["Ideologische pilaarvorming",0],["Gesegmenteerd pluralisme",1],["Waardenconcentratie",0],["Socio-culturele stratificatie",0],["Subcultureel solidarisme",0],["Socio-culturele demodificatie",0],["Socio-culturele etikettering",0]],"note":null,"q_en":"What term do social scientists use to refer to the existence of pillarization?","o_en":["Ideological concentration","Socio-cultural enclosure","Cultural pluralism","Ideological pillar formation","Segmented pluralism","Value concentration","Socio-cultural stratification","Subcultural solidarism","Socio-cultural decommodification","Socio-cultural labeling"],"note_en":null},{"c":13,"sel":"juiste","pick":2,"q":"Welke stellingen over Marshalls essay 'Citizenship and Social Class' zijn correct?","o":[["Volgens Marshall zijn basisrechten de voorwaarde en toegang tot volwaardig burgerschap.",0],["Marshall signaleert dat migratie het vraagstuk van burgerschap complexer maakt.",0],["Marshall benadert burgerschap als een giftrelatie waarin de regels van proportionaliteit en reciprociteit gelden.",0],["Hedendaagse samenlevingen garanderen, via het koppelen van diverse soorten rechten aan het burgerschap, een minimum aan macht voor alle burgers.",1],["Marshall benadrukt in dit essay onvoldoende het idee dat rechten gekoppeld moeten worden aan plichten.",1]],"note":null,"q_en":"Which statements about Marshall's essay 'Citizenship and Social Class' are correct?","o_en":["According to Marshall, basic rights are the precondition for and the gateway to full citizenship.","Marshall notes that migration makes the question of citizenship more complex.","Marshall approaches citizenship as a gift relationship governed by the rules of proportionality and reciprocity.","Contemporary societies guarantee, by linking various kinds of rights to citizenship, a minimum of power for all citizens.","In this essay Marshall does not sufficiently emphasize the idea that rights must be linked to duties."],"note_en":null},{"c":13,"sel":"juiste","pick":2,"q":"De scheiding der machten poogt ongeoorloofde transformaties van macht te verhinderen. Welke zijn voorbeelden van zulke ongeoorloofde transformaties?","o":[["Cliëntelisme, waarbij bijvoorbeeld een partij kiezers aan zich bindt via persoonlijke economische voordelen.",1],["Corruptie, waarbij bijvoorbeeld een ambtenaar zijn reguliere macht gebruikt om zich persoonlijk te verrijken.",1],["Staking, waarbij werknemers de activiteiten stilleggen om beslissingen van werkgevers te beïnvloeden.",0],["Sponsoring, waarbij bedrijven sportclubs financieren in ruil voor reclame.",0],["Promotie, waarbij een werknemer een hogere functie in de hiërarchie inneemt en een hoger aanzien krijgt.",0]],"note":null,"q_en":"The separation of powers seeks to prevent illegitimate transformations of power. Which are examples of such illegitimate transformations?","o_en":["Clientelism, in which, for example, a party binds voters to itself through personal economic advantages.","Corruption, in which, for example, an official uses his regular power to enrich himself personally.","A strike, in which workers halt activities in order to influence employers' decisions.","Sponsorship, in which companies finance sports clubs in exchange for advertising.","Promotion, in which an employee takes up a higher position in the hierarchy and gains greater prestige."],"note_en":null},{"c":13,"sel":"juiste","pick":2,"q":"Welke kritieken formuleren de aanhangers van een pluralistische visie op macht aan het adres van de theorie van de heersende klasse?","o":[["Pluralisten wijzen op de heterogene samenstelling van de elite en op de belangenconflicten binnen de groep van machtigen.",1],["De aanhangers van een multidimensioneel perspectief pleiten voor een verregaande omzetbaarheid van de diverse machtsvormen.",0],["Volgens de pluralisten zijn de leden van de elite onderling verbonden via netwerken en ontmoetingsplaatsen.",0],["Ten gevolge van de commercialisering van kunst en cultuur hebben deze hun maatschappijkritische functie verloren.",0],["De aanhangers van de meerdimensionale kijk op macht menen dat verschillende machtsvormen tegen elkaar gebruikt kunnen worden.",1]],"note":null,"q_en":"What criticisms do the proponents of a pluralist view of power level against the theory of the ruling class?","o_en":["Pluralists point to the heterogeneous composition of the elite and to the conflicts of interest within the group of the powerful.","The proponents of a multidimensional perspective argue for a far-reaching convertibility of the various forms of power.","According to the pluralists, the members of the elite are interconnected through networks and meeting places.","As a result of the commercialization of art and culture, these have lost their socially critical function.","The proponents of the multidimensional view of power hold that different forms of power can be used against one another."],"note_en":null},{"c":13,"sel":"juiste","pick":2,"q":"Esping-Andersen construeerde een typologie van verzorgingsstaten. Welke twee vormen van uitgebouwde welvaartsstaten onderscheidt hij?","o":[["Neo-corporatistische type.",0],["Sociaaldemocratische type.",1],["Conservatief-corporatistische type.",1],["Liberale type.",0],["Rijnlandse type.",0]],"note":null,"q_en":"Esping-Andersen constructed a typology of welfare states. Which two forms of developed welfare states does he distinguish?","o_en":["Neo-corporatist type.","Social-democratic type.","Conservative-corporatist type.","Liberal type.","Rhineland type."],"note_en":null},{"c":13,"sel":"juiste","pick":2,"q":"Welke stellingen vinden we terug in Alexis de Tocquevilles boek 'De la démocratie en Amérique'?","o":[["Burgers zijn geen klanten van de overheid of de staat, maar dienen volwaardige leden van de gemeenschap te zijn.",1],["De democratie in Europa is meer ontwikkeld dan in Amerika.",0],["Naast sociale, politieke en burgerrechten dient een samenleving eveneens te voorzien in culturele rechten.",0],["Sociale en politieke participatie zijn van groot belang om de democratie niet te laten verworden tot een totalitair regime.",1],["De individuele vrijheid is ondergeschikt aan de overheid en de gemeenschap.",0]],"note":null,"q_en":"Which statements are found in Alexis de Tocqueville's book 'De la démocratie en Amérique'?","o_en":["Citizens are not clients of the government or the state, but should be full members of the community.","Democracy in Europe is more developed than in America.","In addition to social, political and civil rights, a society should also provide cultural rights.","Social and political participation are of great importance to keep democracy from degenerating into a totalitarian regime.","Individual freedom is subordinate to the government and the community."],"note_en":null},{"c":13,"sel":"juiste","pick":2,"q":"Volgens Lipset en Rokkan moeten we de huidige maatschappij begrijpen als product van een reeks conflictueuze transformaties. Welke twee maatschappelijke ontwikkelingen zijn volgens hen cruciaal voor de huidige breuklijnen?","o":[["Moderne staatsvorming",1],["Reformatie",0],["Expansie van het onderwijs",0],["Naoorlogse verzorgingsstaat",0],["Industriële revolutie",1]],"note":null,"q_en":"According to Lipset and Rokkan, we must understand present-day society as the product of a series of conflictual transformations. Which two societal developments do they consider crucial for the current cleavages?","o_en":["Modern state formation","Reformation","Expansion of education","Post-war welfare state","Industrial revolution"],"note_en":null},{"c":14,"sel":"juiste","pick":1,"q":"In het kader van de moderniseringstheorie wordt onder de 'rationalisering van het mens- en maatschappijbeeld' het volgende verstaan:","o":[["De opkomst en bloei van het protestantisme.",0],["De groei van doeltreffende, gebureaucratiseerde staten.",0],["De expansie van het kapitalisme.",0],["De schaalvergroting in de handel.",0],["De groei van vertrouwen in de kenbaarheid van de werkelijkheid op basis van empirisch-rationele kennis.",1],["De toenemende inzet van technische hulpmiddelen waarmee productieprocessen doelmatiger werden georganiseerd.",0],["De achteruitgang van het geloof.",0],["Het ontstaan van een doeltreffende samenwerking tussen wetenschappers en ambachtslui.",0],["De spectaculaire groei van het onderwijssysteem.",0],["De groei van de individuele keuzevrijheid door redelijke individuen.",0]],"note":null,"q_en":"Within modernization theory, the 'rationalization of the image of humanity and society' is understood to mean the following:","o_en":["The rise and flourishing of Protestantism.","The growth of effective, bureaucratized states.","The expansion of capitalism.","The scaling-up of trade.","The growth of confidence in the knowability of reality on the basis of empirical-rational knowledge.","Technological progress.","The decline of faith.","The emergence of effective cooperation between scientists and craftsmen.","The spectacular growth of the educational system.","The growth of individual freedom of choice by rational individuals."],"note_en":null},{"c":14,"sel":"juiste","pick":2,"q":"Welke stellingen verdedigde Robert Malthus in 'Essay on the Principle of Population'?","o":[["Mensen planten zich zodanig ongebreideld voort dat hongersnood en armoede onafwendbaar zijn.",1],["Malthus rekende op de inventiviteit en het aanpassingsvermogen van mensen om de nefaste gevolgen van overbevolking te overwinnen.",0],["De overheid dient op repressieve wijze vruchtbaarheidsremmende maatregelen te nemen.",0],["Een toename van welvaart en een efficiënt sociaal beleid leiden tot een afname van vruchtbaarheid.",0],["Geboortebeperking is niet enkel nefast voor de moraal maar zou bovendien enkel binnen de 'betere' lagen van de bevolking opgevolgd worden.",1]],"note":null,"q_en":"Which statements did Robert Malthus defend in 'Essay on the Principle of Population'?","o_en":["People reproduce so unchecked that famine and poverty are inevitable.","Malthus counted on the inventiveness and adaptability of people to overcome the disastrous consequences of overpopulation.","The government should take fertility-curbing measures in a repressive manner.","An increase in prosperity and an efficient social policy lead to a decline in fertility.","Birth control is not only harmful to morality but would moreover be followed only within the 'better' strata of the population."],"note_en":null},{"c":14,"sel":"juiste","pick":2,"q":"Een belangrijke discussie in de sociologie betreft die tussen idealisten en materialisten. Welke uitspraken zijn correct?","o":[["Materialisten menen dat waardeverandering geïnduceerd wordt door variaties of veranderingen in condities en situatie.",1],["In zijn studie naar de groei van het kapitalisme poogt Max Weber idealistische en materialistische posities te verzoenen.",1],["Kunst, ideeën en overtuigingen zijn volgens Weber, net als volgens Marx, gevolgen van de bestaande machtsrelaties.",0],["Wetenschap en technologie zijn volgens de idealisten de drijvende krachten achter verandering.",0],["Max Weber kan worden beschouwd als een materialist.",0]],"note":null,"q_en":"An important debate in sociology concerns that between idealists and materialists. Which statements are correct?","o_en":["Materialists hold that changes in values are induced by variations or changes in conditions and situation.","In his study of the rise of capitalism, Max Weber attempts to reconcile idealist and materialist positions.","According to Weber, just as according to Marx, art, ideas and convictions are consequences of the existing power relations.","According to the idealists, science and technology are the driving forces behind change.","Max Weber can be regarded as a materialist."],"note_en":null},{"c":14,"sel":"juiste","pick":2,"q":"Waarom kon de 'geest van het kapitalisme' volgens Weber economisch succes in de hand werken?","o":[["De geest van het kapitalisme maakte, zoals Benjamin Franklin opmerkte, het krijgen van krediet gemakkelijker.",0],["De geest van het kapitalisme stimuleerde het streven naar eigenbelang.",0],["De geest van het kapitalisme kon zich emanciperen van zijn religieuze oorsprong en stimuleerde daardoor het kapitalisme.",0],["De geest van het kapitalisme verantwoordde het verdienen van geld.",1],["De geest van het kapitalisme zette aan tot sober leven en verhoogde dus de kans op sparen en investeren.",1]],"note":null,"q_en":"Why, according to Weber, could the 'spirit of capitalism' foster economic success?","o_en":["The spirit of capitalism made obtaining credit easier, as Benjamin Franklin observed.","The spirit of capitalism stimulated the pursuit of self-interest.","The spirit of capitalism was able to emancipate itself from its religious origin and thereby stimulated capitalism.","The spirit of capitalism justified the making of money.","The spirit of capitalism prompted a frugal life and thus increased the likelihood of saving and investing."],"note_en":null},{"c":14,"sel":"juiste","pick":2,"q":"Welke fundamentele kenmerken van de protestantse ethiek hebben volgens Weber bijgedragen tot de verspreiding van de geest van het kapitalisme?","o":[["Binnen de protestantse ethiek werd het werken een belangrijke religieuze plicht.",1],["De puriteinse sekten verdedigden sterk de groei van het kapitalisme.",0],["De protestantse ethiek werkte een flexibele houding in de hand die het kapitalisme bevorderde.",0],["Binnen het protestantse geloof werden wereldlijke en religieuze zaken strikt van elkaar gescheiden.",0],["Het streven naar succes in het beroep was een uiterlijk teken van het uitverkoren zijn.",1]],"note":null,"q_en":"Which fundamental features of the Protestant ethic contributed, according to Weber, to the spread of the spirit of capitalism?","o_en":["Within the Protestant ethic, work became an important religious duty.","The Puritan sects strongly defended the growth of capitalism.","The Protestant ethic fostered a flexible attitude that promoted capitalism.","Within the Protestant faith, worldly and religious matters were strictly separated from each other.","The pursuit of success in one's occupation was an outward sign of being among the elect."],"note_en":null},{"c":14,"sel":"foute","pick":2,"q":"Voor Weber is de 'geest van het kapitalisme'… Duid de twee FOUTIEVE antwoorden.","o":[["gekenmerkt door een sterke nadruk op zuinigheid.",0],["gekenmerkt door een koppeling van nut aan geld.",0],["duidelijk terug te vinden in de geschriften van Benjamin Franklin.",0],["een oorzaak van de protestantse ethiek.",1],["een noodzakelijke en voldoende voorwaarde voor de groei van het kapitalisme.",1]],"note":null,"q_en":"For Weber, the 'spirit of capitalism' is… Select the two INCORRECT answers.","o_en":["characterized by a strong emphasis on thrift.","characterized by a linking of usefulness to money.","clearly to be found in the writings of Benjamin Franklin.","a cause of the Protestant ethic.","a necessary and sufficient condition for the growth of capitalism."],"note_en":null},{"c":14,"sel":"juiste","pick":2,"q":"Het verband tussen protestantisme en kapitalistisch succes is volgens Weber een gevolg van religieuze ontwikkelingen die niet tot materiële oorzaken herleidbaar zijn. Welke ontwikkelingen had Weber voor ogen?","o":[["Het overdreven winstbejag van de protestanten.",0],["Het feit dat protestanten meer geneigd waren te leven als Renaissance-mensen en zo hun talenten beter ontwikkelden.",0],["De contrareformatie.",0],["De leer van de tekenen van gratie (predestinatieleer).",1],["Het belang dat wordt gehecht aan ascese in de wereld.",1]],"note":null,"q_en":"According to Weber, the connection between Protestantism and capitalist success is a consequence of religious developments that cannot be reduced to material causes. Which developments did Weber have in mind?","o_en":["The excessive pursuit of profit by the Protestants.","The fact that Protestants were more inclined to live like Renaissance people and thus developed their talents better.","The Counter-Reformation.","The doctrine of the signs of grace (the doctrine of predestination).","The importance attached to asceticism in the world."],"note_en":null},{"c":15,"sel":"juiste","pick":1,"q":"Wat bevordert volgens de visie op modernisering van Barrington Moore de ontwikkeling van een parlementaire democratie?","o":[["De aanwezigheid van een economisch en politiek sterke burgerij.",1],["Een sterk gecentraliseerde staat, maar een weinig ontwikkelde burgerij.",0],["Wanneer grootgrondbezitters de initiatiefnemers zijn van het moderniseringsproces.",0],["De aanwezigheid van een matig ontwikkelde burgerij.",0],["De aanwezigheid van een economisch en politiek zwakke burgerij.",0],["Wanneer het initiatief van de modernisering ligt bij de traditionele elite rond een koningshuis.",0],["Fascistische regimes resulteren uit een vertraagd en niet voltooid moderniseringsproces.",0],["Wanneer de boerenbevolking in traditionele, niet-commerciële dorpsgemeenschappen is georganiseerd.",0],["Het hebben van verschillende kolonies (dependencia-theorie).",0],["Het hebben van een ondernemende cultuur die zich uit in de 'Geest van het Kapitalisme'.",0]],"note":null,"q_en":"According to Barrington Moore's view of modernization, what promotes the development of a parliamentary democracy?","o_en":["The presence of an economically and politically strong bourgeoisie.","A strongly centralized state, but a weakly developed bourgeoisie.","When large landowners are the initiators of the modernization process.","The presence of a moderately developed bourgeoisie.","The presence of an economically and politically weak bourgeoisie.","When the initiative for modernization lies with the traditional elite surrounding a royal house.","Fascist regimes result from a delayed and incomplete modernization process.","When the peasant population is organized in traditional, non-commercial village communities.","Having several colonies (dependency theory).","Having an entrepreneurial culture that expresses itself in the 'Spirit of Capitalism'."],"note_en":null},{"c":15,"sel":"foute","pick":2,"q":"Welke twee uitspraken over het moderniseringsproces zijn FOUT? (Tijdens het moderniseringsproces is…)","o":[["het belang van de internationale handel toegenomen.",1],["het gezin als basis-eenheid van de maatschappij verdwenen.",1],["de rol van wetenschappelijk onderzoek ten opzichte van de landbouw belangrijker geworden.",0],["de gemiddelde levensverwachting toegenomen.",0],["de mate van politieke centralisatie afgenomen.",0]],"note":"Volgens de bron is 'internationale handel toegenomen' fout, maar dat is sociologisch juist een ware trend, mogelijk boekfout. Nakijken met cursus.","q_en":"Which two statements about the modernization process are INCORRECT? (During the modernization process...)","o_en":["the importance of international trade has increased.","the family as the basic unit of society has disappeared.","the role of scientific research relative to agriculture has become more important.","the average life expectancy has increased.","the degree of political centralization has decreased."],"note_en":"According to the source, 'international trade has increased' is marked incorrect, but sociologically this is actually a true trend - possibly an error in the textbook. Check against the course materials."},{"c":15,"sel":"juiste","pick":2,"q":"Welke twee stellingen verdedigen de aanhangers van de dependentie- en wereldsysteemtheorieën?","o":[["De onderontwikkeling van Latijns-Amerikaanse landen is te wijten aan de ongelijke relaties tussen deze landen en de meer ontwikkelde landen.",1],["De economische afhankelijkheid uit zich onder meer in de verplichting zich te specialiseren in de productie van welbepaalde goederen.",1],["Binnen het wereldsysteem onderscheiden de dependistas drie sferen: centrum, periferie en multinationale ondernemingen.",0],["Het gebrek aan interne dynamiek van de ontwikkelingslanden is verantwoordelijk voor hun achterstandspositie.",0],["Een toename van welvaart in de ontwikkelingslanden is afhankelijk van hun democratiseringsproces.",0]],"q_en":"Which two statements are defended by supporters of dependency and world-system theories?","o_en":["The underdevelopment of Latin American countries is due to the unequal relations between these countries and the more developed countries.","Economic dependence manifests itself, among other things, in the obligation to specialize in the production of specific goods.","Within the world system, the dependistas distinguish three spheres: core, periphery, and multinational corporations.","The lack of internal dynamism in the developing countries is responsible for their disadvantaged position.","An increase in prosperity in developing countries depends on their democratization process."],"why":"Dependistas leggen de oorzaak buiten het land: ongelijke verhoudingen met rijkere landen, en een opgelegde specialisatie in enkele producten of grondstoffen. De drie sferen van het wereldsysteem zijn centrum, periferie en semiperiferie, niet multinationals. En wie de oorzaak bij een gebrek aan interne dynamiek legt, verdedigt juist de tegenovergestelde visie."},{"c":15,"sel":"juiste","pick":2,"q":"Als we moderniseringsprocessen in diverse landen vergelijken, tot welke vaststellingen komt deze vergelijkende studie?","o":[["Dat, al naar gelang het moment waarop het moderniseringsproces zich begint af te tekenen, de patronen van moderniteit sterk kunnen variëren.",1],["Dat modernisering steeds het werk is van een 'nieuwe' klasse, in casu de nieuwe elite.",0],["Dat modernisering leidt tot convergentie.",0],["Dat de machtsrelaties in het moderniseringsproces in essentie ongeschonden blijven.",0],["Dat er zich in het moderniseringsproces verschillende patronen van moderniteit kunnen aftekenen.",1]],"note":null,"q_en":"If we compare modernization processes across various countries, what findings does this comparative study arrive at?","o_en":["That, depending on the moment at which the modernization process begins to take shape, the patterns of modernity can vary greatly.","That modernization is always the work of a 'new' class, in this case the new elite.","That modernization leads to convergence.","That the power relations in the modernization process remain essentially intact.","That different patterns of modernity can take shape within the modernization process."],"note_en":null},{"c":15,"sel":"juiste","pick":2,"q":"Volgens Barrington Moore wordt de kans op een linkse dictatuur (communisme) groter als:","o":[["een land in het Oostblok ligt.",0],["een land tot de eerste golf van moderniseerders behoort.",0],["de burgerij in een land economisch en/of politiek zwak is.",1],["het grondbezit in een land niet geconcentreerd is.",1],["het grondbezit in een land geconcentreerd is.",0]],"note":"Moore-theorie: het tweede antwoord is theoretisch betwistbaar, nakijken met cursus.","q_en":"According to Barrington Moore, the likelihood of a left-wing dictatorship (communism) increases when:","o_en":["a country lies in the Eastern Bloc.","a country belongs to the first wave of modernizers.","the bourgeoisie in a country is economically and/or politically weak.","land ownership in a country is not concentrated.","land ownership in a country is concentrated."],"note_en":"Moore's theory: the second answer is theoretically debatable - check against the course materials."},{"c":15,"sel":"juiste","pick":2,"q":"In de aanloop naar de modernisering winnen de ideeën van de puriteinen en de verlichtingsdenkers veld. Welke gemeenschappelijke kenmerken hadden zij?","o":[["Het geloof in persoonlijke kennis en verantwoordelijkheid.",1],["Het geloof in een verlosser die zal komen en de zin van het leven zal vrijgeven.",0],["Het denken over God en de mens door het kerkelijk gezag opleggen.",0],["Het teruggrijpen naar conventionele wijzen van denken en doen.",0],["Het geloof in de transformeerbaarheid van de natuurlijke en sociale werkelijkheid.",1]],"note":null,"q_en":"In the run-up to modernization, the ideas of the Puritans and the Enlightenment thinkers gained ground. What common characteristics did they share?","o_en":["The belief in personal knowledge and responsibility.","The belief in a savior who will come and reveal the meaning of life.","Having thought about God and humankind imposed by ecclesiastical authority.","Reverting to conventional ways of thinking and doing.","The belief in the transformability of natural and social reality."],"note_en":null},{"c":15,"sel":"juiste","pick":2,"q":"Welke stellingen omschrijven de neoklassieke of neoliberale theorie (over waarom sommige landen meer welvaart bieden)?","o":[["De neoliberale theorie gaat ervan uit dat economische ontwikkeling waarschijnlijker is als vrij verkeer van goederen en kapitaal zoveel mogelijk wordt gestimuleerd.",1],["De neoliberale theorie schrijft maatregelen voor die de internationale concurrentie opdrijven (zoals het afschaffen van exportsubsidies en protectionistische maatregelen).",1],["De neoliberale theorie benadrukt de rol van de staat: de motor voor ontwikkeling is een stevig en dynamisch overheidsapparaat.",0],["De neoliberale theorie richt de aandacht op sociaal-culturele factoren; de cultuur bepaalt de werktechniek en zo de economische ontwikkeling.",0],["De neoliberale theorie steunt op het vrijheidsbegrip en hecht vooral waarde aan de vrijheid van denken en handelen als motor van welvaart.",0]],"note":null,"q_en":"Which statements describe the neoclassical or neoliberal theory (about why some countries offer more prosperity)?","o_en":["The neoliberal theory assumes that economic development is more likely if the free movement of goods and capital is stimulated as much as possible.","The neoliberal theory prescribes measures that increase international competition (such as abolishing export subsidies and protectionist measures).","The neoliberal theory emphasizes the role of the state: the engine of development is a robust and dynamic government apparatus.","The neoliberal theory focuses attention on socio-cultural factors; culture determines work techniques and thereby economic development.","The neoliberal theory rests on the concept of freedom and attaches particular value to freedom of thought and action as the engine of prosperity."],"note_en":null},{"c":16,"sel":"foute","pick":1,"q":"In primaire interactiekaders… Selecteer het FOUTE antwoord.","o":[["zijn face-to-face relaties belangrijk.",0],["is directe communicatie belangrijk.",0],["wordt vaak een eigen taal ontwikkeld.",0],["zijn de contacten intiem.",0],["kunnen verschillende doelen nagestreefd worden.",0],["zijn de relaties particularistisch.",0],["zijn de relaties persoonlijk.",0],["voelen mensen zich onderling verbonden.",0],["zijn de doelen gespecificeerd.",1],["hebben de gevolgen van veranderingen in individuele leden een grote invloed.",0]],"note":null,"q_en":"In primary interaction frames... Select the INCORRECT answer.","o_en":["face-to-face relationships are important.","direct communication is important.","a language of their own is often developed.","the contacts are intimate.","various goals can be pursued.","the relationships are particularistic.","the relationships are personal.","people feel mutually connected.","the goals are specified.","changes in individual members have a major impact in their consequences."],"note_en":null},{"c":16,"sel":"juiste","pick":2,"q":"Welke uitspraken over interactiekaders zijn correct?","o":[["Primaire interactiekaders kenmerken zich door particularistische doelstellingen.",0],["Interactiekaders veranderen van aard of karakter wanneer er een wijziging in lidmaatschap plaatsvindt.",0],["Het traditionele of pre-moderne gezin leunde op het continuüm van interactiekaders nauwer aan bij de pool van het primaire interactiekader dan het moderne gezin.",0],["De grenzen van interactiekaders liggen in de verwachtingen die de leden tegenover elkaar koesteren.",1],["Het gezin verwierf mettertijd steeds meer het karakter van een primair interactiekader.",1]],"note":null,"q_en":"Which statements about interaction frames are correct?","o_en":["Primary interaction frames are characterized by particularistic goals.","Interaction frames change in nature or character when a change in membership occurs.","The traditional or pre-modern family was closer, on the continuum of interaction frames, to the pole of the primary interaction frame than the modern family.","The boundaries of interaction frames lie in the expectations that the members hold toward one another.","Over time, the family increasingly acquired the character of a primary interaction frame."],"note_en":null},{"c":16,"sel":"foute","pick":2,"q":"Primaire groepen, formele organisaties en interdependenties zijn verschillende interactiekaders. Welke twee uitspraken zijn FOUT?","o":[["In primaire groepen zijn de relaties nog onpersoonlijk.",1],["De meeste ondernemingen zijn formele organisaties.",0],["In formele organisaties zijn de relaties particularistischer dan in interdependenties.",0],["In interdependenties voelen mensen zich onderling sterk verbonden.",1],["In formele organisaties zijn de doelen meer gespecificeerd dan in primaire groepen.",0]],"note":null,"q_en":"Primary groups, formal organizations, and interdependencies are different interaction frames. Which two statements are INCORRECT?","o_en":["In primary groups, the relationships are still impersonal.","Most enterprises are formal organizations.","In formal organizations, the relationships are more particularistic than in interdependencies.","In interdependencies, people feel strongly connected to one another.","In formal organizations, the goals are more specified than in primary groups."],"note_en":null},{"c":16,"sel":"juiste","pick":2,"q":"Onder welke basisvoorwaarden houdt een primair interactiekader op 'primair' te zijn?","o":[["Als de leden van het interactiekader ver uit elkaar gaan wonen.",0],["Als er zich fundamentele veranderingen in de persoonlijkheid van één of meerdere leden hebben voltrokken.",0],["Als individuen in het primair interactiekader ophouden met elkaar in contact te komen.",1],["Als de leden enkel nog samenkomen om specifieke doelen na te streven, maar de persoonlijke relaties hebben stopgezet.",1],["Als de emotionele banden binnen het interactiekader veranderd zijn.",0]],"note":null,"q_en":"Under which basic conditions does a primary interaction frame cease to be 'primary'?","o_en":["When the members of the interaction frame go to live far apart.","When fundamental changes have taken place in the personality of one or more members.","When individuals in the primary interaction frame stop coming into contact with one another.","When the members only come together to pursue specific goals, but have ceased their personal relationships.","When the emotional bonds within the interaction frame have changed."],"note_en":null},{"c":16,"sel":"juiste","pick":2,"q":"In welk opzicht heeft het proces van structureel-functionele differentiatie de betekenis van kinderen in onze samenleving veranderd?","o":[["Er is een grotere gevoeligheid voor kindermishandeling ontstaan.",1],["Er is een stijging van de kindermishandeling waar te nemen, vooral vanaf de jaren negentig van de twintigste eeuw.",0],["Het kind is voorwerp geworden van economische berekening.",0],["Er ontstond een groeiende kloof tussen de leefwereld van het kind en de leefwereld van het werk.",1],["Utilitaire beweegredenen in de opvoeding zijn legitiem geworden.",0]],"note":null,"q_en":"In what respect has the process of structural-functional differentiation changed the meaning of children in our society?","o_en":["A greater sensitivity to child abuse has emerged.","An increase in child abuse can be observed, especially from the 1990s onward.","The child has become an object of economic calculation.","A growing gap arose between the world of the child and the world of work.","Utilitarian motives in child-rearing have become legitimate."],"note_en":null},{"c":16,"sel":"foute","pick":2,"q":"Waarom is het aantal echtscheidingen gestegen? Duid de twee FOUTE antwoorden.","o":[["Het huwelijk werd in de eerste plaats een emotionele aangelegenheid.",0],["Vrouwen kennen een grotere economische onafhankelijkheid ten aanzien van de echtgenoot en het gezin.",0],["De nieuwe huwelijksmoraal (cfr. het romantische huwelijk) stelt zowel beide huwelijkspartners als hun kinderen in staat gemakkelijk en zonder veel conflicten nieuwe gezinnen te vormen.",1],["Steeds minder mensen kiezen voor ongehuwd samenwonen.",1],["Steeds minder huwelijken steunen op zakelijke overwegingen.",0]],"note":null,"q_en":"Why has the number of divorces increased? Select the two INCORRECT answers.","o_en":["Marriage became primarily an emotional matter.","Women have greater economic independence relative to the husband and the family.","The new marital morality (cf. the romantic marriage) enables both marriage partners as well as their children to form new families easily and without much conflict.","Fewer and fewer people choose unmarried cohabitation.","Fewer and fewer marriages rest on business considerations."],"note_en":null},{"c":16,"sel":"foute","pick":2,"q":"Welke twee uitspraken over structureel-functionele differentiatie zijn FOUT?","o":[["We spreken van differentiatie wanneer het aantal functies dat door een interactiekader wordt verricht, toeneemt.",1],["Bepaalde evoluties in het ouderlijke gezag kunnen beschouwd worden als een gevolg van differentiatie.",0],["De differentiatie van gezin en productie-eenheid bevordert het romantische huwelijk.",0],["Echtscheidingen zijn vaak het gevolg van de differentiatie van de huwelijkspartners.",1],["De affectieve relatie tussen ouders en kinderen is een gevolg van de differentiatie van werk en gezin.",0]],"note":null,"q_en":"Which two statements about structural-functional differentiation are INCORRECT?","o_en":["We speak of differentiation when the number of functions performed by an interaction frame increases.","Certain developments in parental authority can be regarded as a consequence of differentiation.","The differentiation of the family and the unit of production promotes the romantic marriage.","Divorces are often the result of the differentiation of the marriage partners.","The affective relationship between parents and children is a consequence of the differentiation of work and family."],"note_en":null},{"c":17,"sel":"juiste","pick":1,"q":"Van welke theoretische stroming is de etiketteringstheorie een toepassing?","o":[["sociaal darwinisme",0],["utilitarisme",0],["structureel functionalisme",0],["etnomethodologie",0],["symbolisch interactionisme",1],["dramaturgische benadering",0]],"why":"De etiketteringstheorie draait om hoe mensen deviant worden gemaakt door de betekenis en het label dat anderen hen opplakken, en dat is precies de kern van het symbolisch interactionisme. Etnomethodologie en de dramaturgische benadering horen bij dezelfde interpretatieve familie, maar het etiket zelf komt uit het symbolisch interactionisme."},{"c":17,"sel":"juiste","pick":1,"q":"Bij welke manier van omgaan met culturele minderheden sluit het meltingpot-model het nauwst aan?","o":[["assimilatie",1],["integratie",0],["selectiviteit",0],["predestinatie",0],["confiscatie",0]],"why":"In de meltingpot gaan minderheidsgroepen op in de dominante cultuur en geven ze hun eigen cultuur grotendeels op, en dat is assimilatie. Bij integratie doe je volwaardig mee in de samenleving terwijl je je eigen cultuur behoudt, dus daar ligt het accent net omgekeerd."},{"c":17,"sel":"juiste","pick":1,"q":"Bij de scouts moet iedereen mee gaan wandelen, maar een lid weigert. De leiding zegt: een echte scout wandelt mee uit solidariteit met zijn medescouts. Om welke sanctioneringswijze gaat het?","o":[["het activeren van waardegetrouwheid",1],["het bestraffen van het lid",0],["een interne sanctie bij het lid zelf",0],["een externe sanctie door de leiding",0],["een positieve sanctie voor het lid",0]],"why":"De leiding deelt geen straf en geen beloning uit, maar doet een beroep op een waarde die het lid zelf zou moeten delen, namelijk solidariteit. Dat heet het activeren van waardegetrouwheid. Een interne sanctie komt van de persoon zelf, bijvoorbeeld een schuldgevoel achteraf."},{"c":17,"sel":"foute","pick":2,"q":"Een sociale ordening is contingent en wordt daarom gelegitimeerd door te verwijzen naar een derde. Welke twee horen niet bij die legitimerende derden?","o":[["de samenhang met het geheel",0],["de natuur der dingen",0],["de geschiedenis",0],["de modernisering",1],["praktische kennis",1]],"why":"Een contingente orde wordt gelegitimeerd door te verwijzen naar de natuur, naa
