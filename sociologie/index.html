<style>
  :root{
    --bg:#f4f2ee; --bg2:#ebe8e2; --card:#ffffff; --ink:#1b232c; --muted:#5d6873;
    --line:#e2ddd4; --accent:#0f6e6a; --accent-ink:#0b4f4c; --accent-soft:#dcefed;
    --amber:#c9821f; --amber-soft:#f7ecd9; --violet:#6d5bd0; --violet-soft:#e9e6fa;
    --good:#1f8a4c; --good-soft:#e2f3e8; --bad:#c23b54; --bad-soft:#fbe5ea;
    --shadow:0 1px 2px rgba(20,30,40,.05),0 6px 18px rgba(20,30,40,.05);
    --shadow-lg:0 2px 6px rgba(20,30,40,.06),0 18px 40px rgba(20,30,40,.10);
    --r:14px; --r-lg:20px; --ease:cubic-bezier(.2,.8,.2,1);
  }
  html[data-theme="dark"]{
    --bg:#11151a; --bg2:#161b22; --card:#1b222b; --ink:#e7ecf1; --muted:#9aa6b2;
    --line:#2a323c; --accent:#3fb9b2; --accent-ink:#7fd6d0; --accent-soft:#163230;
    --amber:#e0a64a; --amber-soft:#2e2515; --violet:#a99cf0; --violet-soft:#221d3a;
    --good:#46c178; --good-soft:#16301f; --bad:#ef6b82; --bad-soft:#331620;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 2px 8px rgba(0,0,0,.4),0 22px 48px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;letter-spacing:-.01em}
  button,a{font-family:inherit;cursor:pointer;color:inherit}
  .wrap{max-width:880px;margin:0 auto;padding:0 18px 96px}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
  .ic{width:1.25em;height:1.25em;flex:none;vertical-align:-.18em;stroke:currentColor;stroke-width:1.75;
    stroke-linecap:round;stroke-linejoin:round;fill:none}

  header.top{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(160%) blur(16px);-webkit-backdrop-filter:saturate(160%) blur(16px);box-shadow:inset 0 -1px 0 0 rgba(0,0,0,.04)}
  .topin{max-width:880px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:700}
  .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,var(--accent),var(--accent-ink));
    color:#fff;display:grid;place-items:center;font-family:Georgia,serif;font-weight:700;font-size:16px;flex:none;
    box-shadow:0 2px 6px rgba(15,110,106,.35)}
  .brand small{display:block;font-weight:500;color:var(--muted);font-size:11px}
  .spacer{flex:1}
  .iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:38px;
    padding:7px 11px;font-size:13.5px;display:inline-flex;gap:7px;align-items:center;text-decoration:none;
    transition:border-color .2s var(--ease),transform .12s var(--ease)}
  .iconbtn:hover{border-color:var(--accent)} .iconbtn:active{transform:scale(.96)}
  nav.tabs{display:flex;gap:2px;overflow:auto;max-width:880px;margin:0 auto;padding:6px 12px 0;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{border:none;background:none;color:var(--muted);padding:10px 13px;border-radius:9px 9px 0 0;
    font-size:14px;font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px;transition:color .2s var(--ease)}
  nav.tabs button .ic{width:16px;height:16px}
  nav.tabs button.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
  nav.tabs button:hover{color:var(--ink)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:20px}
  .muted{color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
  .pill.amber{background:var(--amber-soft);color:var(--amber)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;gap:14px}
  @media(min-width:620px){.g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr}
  @media(min-width:760px){.g3{grid-template-columns:1fr 1fr 1fr}}}

  .hero{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin:20px 0 8px}
  .count{flex:none;background:linear-gradient(150deg,var(--accent),var(--accent-ink));color:#fff;border-radius:var(--r);padding:14px 20px;text-align:center;min-width:118px;box-shadow:0 8px 20px rgba(15,110,106,.28)}
  .count b{font-family:Georgia,serif;font-size:32px;display:block;line-height:1}
  .count span{font-size:12px;opacity:.92}
  .herotext h1{margin:0 0 4px;font-size:25px}
  .herotext p{margin:0;color:var(--muted)}

  .brandstrip{display:flex;align-items:center;gap:13px;width:100%;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 16px;margin:14px 0 2px;box-shadow:var(--shadow);transition:border-color .2s var(--ease),transform .15s var(--ease)}
  .brandstrip:hover{border-color:var(--accent);transform:translateY(-1px)}
  .brandstrip .bs-logo{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:17px;background:linear-gradient(145deg,var(--accent),var(--accent-ink))}
  .brandstrip .bs-txt{flex:1;min-width:0} .brandstrip .bs-txt b{display:block;font-size:14.5px} .brandstrip .bs-txt small{color:var(--muted);font-size:12.5px}
  .brandstrip .bs-go{color:var(--accent-ink);flex:none;display:inline-flex} .brandstrip .bs-go .ic{width:18px;height:18px}

  .seclabel{display:flex;align-items:center;gap:8px;margin:24px 0 12px;font-weight:700;font-size:15px}
  .seclabel .ic{width:18px;height:18px;color:var(--accent-ink)}
  .backlink{display:inline-flex;align-items:center;gap:5px;border:none;background:none;color:var(--muted);font-size:13.5px;font-weight:600;padding:6px 0;margin-bottom:4px;transition:color .2s var(--ease)}
  .backlink:hover{color:var(--accent-ink)} .backlink .ic{width:16px;height:16px}
  .tracks{display:grid;gap:14px} @media(min-width:600px){.tracks{grid-template-columns:1fr 1fr}}
  .track{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);transition:transform .22s var(--ease),border-color .22s var(--ease),box-shadow .22s var(--ease)}
  .track:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow-lg)} .track:active{transform:translateY(-1px) scale(.995)}
  .track .tile{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;margin-bottom:4px;background:linear-gradient(150deg,var(--accent),var(--accent-ink))}
  .track.alt .tile{background:linear-gradient(150deg,var(--violet),#4f40a8)} .track .tile .ic{width:24px;height:24px}
  .track b{font-size:18px} .track small{color:var(--muted);font-size:13.5px;line-height:1.5}
  .track .go{margin-top:6px;display:inline-flex;align-items:center;gap:6px;color:var(--accent-ink);font-weight:600;font-size:13.5px} .track.alt .go{color:var(--violet)} .track .go .ic{width:16px;height:16px}
  .toggle{width:48px;height:28px;border-radius:999px;border:none;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s var(--ease)}
  .toggle .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s var(--ease)}
  .toggle.on{background:var(--violet)} .toggle.on .knob{left:23px}
  .warmcard{border-color:var(--violet)!important;background:var(--violet-soft)} .warmcard .ic{width:22px;height:22px;color:var(--violet);flex:none}
  .modebanner{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:11px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent-ink);font-size:13.5px;font-weight:600}
  .modebanner.v{background:var(--violet-soft);color:var(--violet)} .modebanner .ic{width:18px;height:18px} .modebanner a,.modebanner .bnlink{margin-left:auto;font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;color:inherit;border:none;background:none;font-family:inherit;padding:0}
  html.snappy .card,html.snappy .mode,html.snappy .tip,html.snappy .track{animation-duration:.12s!important}
  .mode{display:flex;flex-direction:column;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:17px;gap:7px;box-shadow:var(--shadow);transition:transform .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease)}
  .mode:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .mode .me{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)} .mode .me .ic{width:22px;height:22px}
  .mode b{font-size:16px} .mode small{color:var(--muted);font-size:13px}

  label.fld{display:block;font-size:13px;font-weight:600;margin:16px 0 7px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;min-height:38px;padding:7px 13px;font-size:13.5px;transition:all .18s var(--ease)}
  .chip:hover{border-color:var(--accent)} .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:11px;min-height:46px;padding:12px 20px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;box-shadow:0 4px 12px rgba(15,110,106,.25);transition:background .2s var(--ease),transform .12s var(--ease)}
  .btn:hover{background:var(--accent-ink)} .btn:active{transform:scale(.97) translateY(1px)} .btn .ic{width:18px;height:18px}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none} .btn.ghost:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  input[type=search],input[type=text],input[type=email],textarea{font-family:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
  input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .runtop{display:flex;align-items:center;gap:12px;margin:2px 0 14px;font-size:13px;color:var(--muted)}
  .bar{height:8px;border-radius:6px;background:var(--bg2);overflow:hidden;flex:1}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .7s var(--ease)}
  .qtext{font-size:19px;font-weight:600;margin:8px 0 16px;font-family:Georgia,serif;line-height:1.45}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px 15px;margin-bottom:10px;font-size:15px;transition:border-color .15s var(--ease),background .15s var(--ease),transform .12s var(--ease)}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)} .opt:active:not(:disabled){transform:scale(.99)}
  .opt .k{flex:none;width:27px;height:27px;border-radius:8px;background:var(--bg2);color:var(--muted);display:grid;place-items:center;font-weight:700;font-size:13px}
  .opt.correct{border-color:var(--good);background:var(--good-soft)} .opt.correct .k{background:var(--good);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default}
  .feedback{border-radius:12px;padding:13px 15px;margin:4px 0 12px;font-size:14.5px}
  .feedback.ok{background:var(--good-soft);color:var(--good)} .feedback.no{background:var(--bad-soft);color:var(--bad)}
  .feedback b{font-weight:700} .feedback .sub{display:block;margin-top:3px;color:var(--ink);font-weight:500;opacity:.92}
  .whybtn{border:1px solid var(--line);background:var(--card);color:var(--accent-ink);border-radius:10px;min-height:40px;padding:9px 14px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:border-color .2s var(--ease),background .2s var(--ease)}
  .whybtn:hover{border-color:var(--accent);background:var(--accent-soft)} .whybtn .ic{width:16px;height:16px}
  .whybox{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:14px 16px;margin:12px 0 4px;font-size:14px;line-height:1.55}
  .whybox h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent-ink);font-family:system-ui;display:flex;align-items:center;gap:7px}
  .whybox .ic{width:16px;height:16px}

  .acc{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
  .acc>summary{padding:15px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:11px}
  .acc>summary::-webkit-details-marker{display:none}
  .acc>summary .n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
  .acc>summary .caret{margin-left:auto;color:var(--muted);transition:transform .25s var(--ease)} .acc[open]>summary .caret{transform:rotate(90deg)}
  .acc[open]>summary{border-bottom:1px solid var(--line)} .acc .body{padding:6px 18px 16px}
  .acc h4{margin:14px 0 6px;font-size:13px;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.4px;font-family:system-ui}
  .acc ul{margin:0;padding-left:20px} .acc li{margin:6px 0;font-size:14.5px;line-height:1.5}
  .acc.hack li::marker{content:"💡  "} .acc.hack>summary .n{background:var(--violet-soft);color:var(--violet)}
  mark{background:var(--amber-soft);color:inherit;padding:0 2px;border-radius:3px}

  .tip{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}
  .tip h4{margin:0 0 5px;font-size:14.5px;display:flex;align-items:center;gap:8px;font-family:system-ui} .tip h4 .ic{width:18px;height:18px;color:var(--violet)}
  .tip p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}
  .tipgrid{display:grid;gap:12px} @media(min-width:620px){.tipgrid{grid-template-columns:1fr 1fr}}

  .results .big{font-family:Georgia,serif;font-size:54px;text-align:center;margin:8px 0;line-height:1}
  .center{text-align:center} .hide{display:none!important}
  footer{margin-top:34px;text-align:center;color:var(--muted);font-size:13px}
  .kbd{font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--muted)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.03)}100%{transform:scale(1)}}
  @keyframes optIn{from{opacity:0;transform:translateX(-9px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: no-preference){
    .card,.mode,.tip{animation:fadeUp .34s var(--ease) both}
    .acc{animation:fadeUp .32s var(--ease) both}
    .opt{animation:optIn .3s var(--ease) backwards;animation-delay:var(--oi,0s)}
    .chip.on{animation:pop .22s var(--ease)}
    .feedback{animation:slideIn .26s var(--ease) both} .whybox{animation:slideIn .28s var(--ease) .07s both} .opt.correct{animation:pop .34s var(--ease)}
  }
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  /* ---- Premium launch (Gemini-stijl) + header-logo gloed ---- */
  @property --bes-a{syntax:'<angle>';initial-value:0deg;inherits:false}
  #splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(125% 125% at 50% 38%,var(--bg2) 0%,var(--bg) 68%);transition:opacity .6s var(--ease),transform .7s var(--ease)}
  #splash.hide{opacity:0;transform:scale(1.07);pointer-events:none}
  .sp-inner{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
  .sp-mark{position:relative;width:100px;height:100px;display:grid;place-items:center}
  .sp-mark::before{content:"";position:absolute;inset:-16px;border-radius:34px;z-index:0;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));filter:blur(17px);opacity:.75}
  .sp-mark::after{content:"";position:absolute;inset:-3px;border-radius:27px;z-index:1;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));padding:3px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .sp-logo{position:relative;z-index:2;width:92px;height:92px;border-radius:24px;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:46px;background:linear-gradient(150deg,var(--accent),var(--accent-ink));box-shadow:0 14px 38px rgba(15,110,106,.4)}
  .sp-spark{position:absolute;z-index:3;top:-7px;right:-7px;width:30px;height:30px;color:#fff;filter:drop-shadow(0 2px 7px rgba(0,0,0,.35))}
  .sp-name{position:relative;font-family:Georgia,serif;font-size:26px;font-weight:700;letter-spacing:-.01em;color:var(--ink);overflow:hidden}
  .sp-name::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(-130%)}
  .sp-tag{font-size:13px;color:var(--muted);margin-top:-8px;letter-spacing:.03em}
  @media (prefers-reduced-motion: no-preference){
    .sp-mark::before{animation:bes-spin 3s linear infinite,bes-breathe 2.4s var(--ease) infinite}
    .sp-mark::after{animation:bes-spin 3s linear infinite}
    .sp-logo{animation:bes-pop .7s var(--ease) both}
    .sp-spark{animation:bes-pop .6s var(--ease) .12s both,bes-twinkle 1.9s var(--ease) .9s infinite}
    .sp-name{animation:bes-rise .6s var(--ease) .14s both}
    .sp-name::after{animation:bes-shimmer 1.5s var(--ease) .5s 1}
    .sp-tag{animation:bes-rise .6s var(--ease) .26s both}
  }
  @keyframes bes-spin{to{--bes-a:360deg}}
  @keyframes bes-breathe{0%,100%{opacity:.55;filter:blur(16px)}50%{opacity:.95;filter:blur(22px)}}
  @keyframes bes-shimmer{to{transform:translateX(130%)}}
  @keyframes bes-twinkle{0%,100%{opacity:1;transform:scale(1) rotate(0deg)}50%{opacity:.65;transform:scale(.82) rotate(18deg)}}
  @keyframes bes-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  /* mobiel: header-knoppen alleen iconen zodat niks zijwaarts overflowt */
  @media(max-width:440px){ header.top .iconbtn span{display:none} header.top .iconbtn{padding:7px 9px;min-width:38px;justify-content:center} .topin{gap:8px} }
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)} .opt.sel .k{background:var(--accent);color:#fff}
/* ===== gedeelde interactie-verbeteringen (fixronde augustus 2026) ===== */
@media (prefers-reduced-motion: no-preference){
  @keyframes bes-klik{0%{transform:scale(1)}38%{transform:scale(.955)}100%{transform:scale(1)}}
  .bes-klik{animation:bes-klik .2s cubic-bezier(.22,.61,.36,1)}
  @keyframes bes-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

<script>
window.SOCIO = {"chapters":{"1":"De sociologische verzuchting","2":"De taak en houding van de socioloog","3":"De ontdekking van de samenleving I (individualistisch)","4":"De ontdekking van de samenleving II (collectivistisch)","5":"Rol en zelf","6":"Verwachten en verklaren","7":"Socialisatie en methoden van samenleven","8":"Sociale controle","9":"Maatschappelijke schaalvergroting","10":"Criminaliteit","11":"Ongelijkheid","12":"Macht en stratificatie","13":"Macht en de architectuur van de samenleving","14":"De aanloop tot modernisering","15":"De transformatie","16":"De transformatie van interactiekaders","17":"Examenreconstructies","18":"Oude examenvragen"},"chapters_en":{"1":"The sociological longing","2":"The task and attitude of the sociologist","3":"Discovery of society I (individualist)","4":"Discovery of society II (collectivist)","5":"Role and self","6":"Expecting and explaining","7":"Socialization and methods of living together","8":"Social control","9":"Societal scaling-up","10":"Crime","11":"Inequality","12":"Power and stratification","13":"Power and the architecture of society","14":"The run-up to modernization","15":"The transformation (modernization)","16":"The transformation of interaction frames","17":"Exam reconstructions","18":"Past exam questions"},"questions":[{"c":1,"sel":"juiste","pick":1,"q":"Welke 'legitimerend verhaal' duikt op in Marx' theorie wanneer hij het heeft over de evolutie naar een klasseloze maatschappij?","o":[["Samenhang",0],["Differentiatie van arbeid",0],["Conflict",0],["Orde",0],["Empirische evidentie",0],["Collectieve actie",0],["Geschiedenis",1],["Rechtvaardigheid",0],["Ongelijke arbeidsverhoudingen",0],["Zelfvervullende voorspelling",0]],"note":null,"q_en":"Which 'legitimizing narrative' surfaces in Marx's theory when he discusses the evolution towards a classless society?","o_en":["Cohesion","Division of labour","Conflict","Order","Empirical evidence","Collective action","History","Justice","Unequal labour relations","Self-fulfilling prophecy"],"note_en":null},{"c":1,"sel":"foute","pick":2,"q":"Waarin verschillen de posities van Luhmann en Habermas ten aanzien van het arbitraire? Duid de twee FOUTE antwoorden.","o":[["Habermas meent dat via open en redelijke communicatie keuzes gemaakt kunnen worden die het arbitraire opheffen.",0],["Habermas zet zich af tegen de ideeën van de Verlichting en ziet geen heil in redelijke oplossingen; instellingen als religie en traditie zijn beter geplaatst.",1],["Luhmann is een overtuigde Verlichtingsdenker; wetenschap is de enige echte methode om zeker te weten wat de waarheid is.",1],["Volgens Luhmann moeten we leren leven met het arbitraire; een consensus is immers onmogelijk.",0],["Volgens Habermas kan de wetenschap ons niet vertellen wat we moeten nastreven maar enkel hoe we vooropgestelde doelstellingen kunnen bereiken.",0]],"note":null,"q_en":"In what way do the positions of Luhmann and Habermas differ with respect to the arbitrary? Select the two INCORRECT answers.","o_en":["Habermas believes that through open and reasonable communication, choices can be made that resolve the arbitrary.","Habermas opposes the ideas of the Enlightenment and sees no value in reasonable solutions; institutions such as religion and tradition are better placed.","Luhmann is a committed Enlightenment thinker; science is the only true method for knowing with certainty what the truth is.","According to Luhmann, we must learn to live with the arbitrary; a consensus is, after all, impossible.","According to Habermas, science cannot tell us what we should pursue, but only how we can achieve predetermined goals."],"note_en":null},{"c":1,"sel":"juiste","pick":2,"q":"Welke inzichten en bijdragen leverde Comte aan het ontstaan en de ontwikkeling van de sociologie als wetenschap?","o":[["Dat vooroordelen en belangen een realistische en nuchtere kijk op sociale fenomenen versluieren.",0],["Dat de sociologie zich moet bezighouden met het zoeken naar regelmaten in het handelen van mensen en geen metafysische vragen moet stellen over de oorsprong van de mens.",1],["Dat sociologen een zekere afstandelijkheid aan de dag moeten leggen ten aanzien van hun onderzoeksobject.",0],["Het idee dat het sociale van natuurlijke oorsprong is.",0],["Een positivistische benadering van de sociale werkelijkheid: een zakelijke, op wetenschappelijke observatie en logica steunende onderzoekswijze van de samenleving.",1]],"note":null,"q_en":"What insights and contributions did Comte make to the emergence and development of sociology as a science?","o_en":["That prejudices and interests obscure a realistic and sober view of social phenomena.","That sociology should concern itself with searching for regularities in human action and should not raise metaphysical questions about the origin of humankind.","That sociologists must maintain a certain detachment with respect to their object of study.","The idea that the social is of natural origin.","A positivist approach to social reality: a matter-of-fact way of studying society grounded in scientific observation and logic."],"note_en":null},{"c":1,"sel":"juiste","pick":2,"q":"Een belangrijke sociologische les is dat alles contingent is maar daarom nog niet arbitrair. Welke twee uitspraken zijn in overeenstemming met die les?","o":[["Onze instituties hadden ook een totaal andere vorm kunnen aannemen.",1],["Er is geen goede reden voor de vorm die instituties bij ons hebben aangenomen.",0],["Iets is noch noodzakelijk, noch onmogelijk.",1],["De samenleving en de geschiedenis zijn totaal beheersbaar.",0],["Wetten, reglementen en gewoonten berusten op natuurwetten.",0]],"note":null,"q_en":"An important sociological lesson is that everything is contingent but not therefore arbitrary. Which two statements are consistent with that lesson?","o_en":["Our institutions could also have taken on a completely different form.","There is no good reason for the form that institutions have taken on in our society.","Something is neither necessary nor impossible.","Society and history are completely controllable.","Laws, regulations and customs rest on natural laws."],"note_en":null},{"c":1,"sel":"juiste","pick":2,"q":"Wat bedoelen sociologen als ze het hebben over '(het probleem van de) orde'?","o":[["Het behoud van de mogelijkheid om tot nageleefde regels te komen.",1],["Het behoud van de bestaande machtsverhoudingen, wetten, gewoontes, verwachtingen, enzovoort.",0],["Het besef dat bij te hoge criminaliteit het samenleven sterk bemoeilijkt wordt.",0],["Het geheel van regels, verwachtingen, normen, enzovoort, die het leven een zekere voorspelbaarheid en berekenbaarheid geven.",1],["Het besef dat over de tijd gewoontes, instellingen en wetten variabel zijn.",0]],"note":null,"q_en":"What do sociologists mean when they speak of '(the problem of) order'?","o_en":["The preservation of the possibility of arriving at rules that are observed.","The preservation of the existing power relations, laws, customs, expectations, and so on.","The awareness that, when crime is too high, living together becomes greatly hindered.","The whole of rules, expectations, norms, and so on, that give life a certain predictability and calculability.","The awareness that, over time, customs, institutions and laws are variable."],"note_en":null},{"c":1,"sel":"foute","pick":2,"q":"Op welke basis legitimeren samenlevingen (die beseffen dat hun organisatie contingent is) hun wetten, gewoontes en instellingen? Duid de twee FOUTE antwoorden.","o":[["Geschiedenis",0],["Natuur",0],["Samenhang",0],["Conflict",1],["Materiële noodzaak",1]],"note":null,"q_en":"On what basis do societies (which realize that their organization is contingent) legitimize their laws, customs and institutions? Select the two INCORRECT answers.","o_en":["History","Nature","Cohesion","Conflict","Material necessity"],"note_en":null},{"c":1,"sel":"juiste","pick":2,"q":"Alcoholische dranken worden in België legaal geconsumeerd, verkocht en gestockeerd, maar dat is niet zo in alle landen. Dit is een voorbeeld van…","o":[["Een doorgedreven fanatisme.",0],["Het arbitraire van gedragsregels.",0],["Een waardenconflict.",0],["De wet als constructie en conventie.",1],["Het contingente van de sociale regels.",1]],"note":null,"q_en":"Alcoholic beverages are legally consumed, sold and stored in Belgium, but this is not the case in all countries. This is an example of…","o_en":["An extreme fanaticism.","The arbitrary nature of rules of conduct.","A conflict of values.","Law as construction and convention.","The contingent nature of social rules."],"note_en":null},{"c":2,"sel":"juiste","pick":2,"q":"Voor Durkheim was godsdienst een verschijnsel ('feit') dat op empirisch-analytische wijze moest worden verklaard. Welke conclusies kunnen we trekken over de manier waarop Durkheim godsdienst bestudeert?","o":[["Dat geloof en rite slechts vergissingen, onwetenschappelijke opvattingen en barbaarse gebruiken zijn.",0],["Dat stellingen uit godsdienstige bronnen als waarheden beschouwd moeten worden door sociologen.",0],["Dat de houding van Durkheim getuigt van een sociologisch respect voor de gelijkwaardigheid van verschijnselen.",1],["Dat volgens Durkheim religie weinig betekenis heeft, zowel voor gelovigen als voor wie op een andere manier zingeving zoekt.",0],["Dat religie niet gebruikt kan worden om gedrag te verklaren; het is een feit dat los staat van de samenleving.",0],["Dat volgens Durkheim instellingen die wijdverspreid en duurzaam zijn, niet kunnen afgedaan worden als berustend op een leugen of een vergissing.",1],["Dat een socioloog alleen de algemene religieuze voorschriften moet bestuderen.",0],["Dat religie volgens Durkheim, net als alle sociale fenomenen, een rationele grondslag heeft.",0],["De houding van Durkheim toont dat hij het symbolisch interactionisme aanhangt.",0],["Dat religies altijd zullen blijven bestaan omdat het eigen is aan de menselijke natuur.",0]],"note":null,"q_en":"For Durkheim, religion was a phenomenon ('fact') that had to be explained in an empirical-analytical way. What conclusions can we draw about the way in which Durkheim studies religion?","o_en":["That faith and ritual are merely errors, unscientific notions and barbaric practices.","That claims from religious sources must be regarded as truths by sociologists.","That Durkheim's stance reflects a sociological respect for the equal standing of phenomena.","That, according to Durkheim, religion has little meaning, both for believers and for those who seek meaning in another way.","That religion cannot be used to explain behaviour; it is a fact that stands apart from society.","That, according to Durkheim, institutions that are widespread and enduring cannot be dismissed as resting on a lie or an error.","That a sociologist should study only the general religious precepts.","That, according to Durkheim, religion, like all social phenomena, has a rational basis.","Durkheim's stance shows that he adheres to symbolic interactionism.","That religions will always continue to exist because it is inherent in human nature."],"note_en":null},{"c":2,"sel":"juiste","pick":2,"q":"Men kan Marx en Freud beschouwen als inspiratiebronnen van de kritische sociologie omdat zij…","o":[["…het oneens waren met de bestaande maatschappijorganisatie en deze wilden veranderen.",0],["…gekant waren tegen de bestaande, heersende klassen.",0],["…betrokken waren bij revolutionaire bewegingen.",0],["…van oordeel waren dat er achter de schijnbare werkelijkheid een diepere, meer betekenisvolle werkelijkheid schuilgaat.",1],["…meenden dat kennis kan leiden tot bevrijding en emancipatie van mensen.",1]],"note":null,"q_en":"One can regard Marx and Freud as sources of inspiration for critical sociology because they…","o_en":["…disagreed with the existing organization of society and wanted to change it.","…were opposed to the existing, ruling classes.","…were involved in revolutionary movements.","…held the view that behind the apparent reality lies a deeper, more meaningful reality.","…believed that knowledge can lead to the liberation and emancipation of people."],"note_en":null},{"c":2,"sel":"juiste","pick":2,"q":"Respect voor het studieobject betekent volgens Durkheim…","o":[["Dat alle sociale gedragingen gelijkwaardig zijn.",0],["Dat men slechts het gedrag van mensen van de eigen cultuur kan begrijpen.",0],["Dat men voor elk soort gedrag naar een verklaring dient te zoeken.",1],["Dat het gedrag van mensen altijd op wetenschappelijk correcte gronden berust.",0],["Dat men gedrag niet meteen aan een vergissing mag toeschrijven.",1]],"note":null,"q_en":"According to Durkheim, respect for the object of study means…","o_en":["That all social behaviours are of equal standing.","That one can only understand the behaviour of people of one's own culture.","That for every kind of behaviour one must seek an explanation.","That people's behaviour always rests on scientifically correct grounds.","That one must not immediately attribute behaviour to an error."],"note_en":null},{"c":2,"sel":"juiste","pick":2,"q":"Welke regels of principes onderbouwen het geven van geschenken (Marcel Mauss)?","o":[["Functionaliteit",0],["Proportionaliteit",1],["Normativiteit",0],["Reciprociteit",1],["Vermogendheid",0]],"note":"Mogelijke boekfout: 'proportionaliteit' is geen klassiek Maussiaans principe (kern = reciprociteit). Nakijken met cursus.","q_en":"Which rules or principles underpin the giving of gifts (Marcel Mauss)?","o_en":["Functionality","Proportionality","Normativity","Reciprocity","Wealth"],"note_en":"Possible textbook error: 'proportionality' is not a classic Maussian principle (the core = reciprocity). Check against the course material."},{"c":2,"sel":"foute","pick":2,"q":"Hieronder staan uitspraken over de taken van de socioloog. Welke twee zijn FOUT?","o":[["De kritische sociologie kan de bestaande waarden en overtuigingen niet aanvaarden.",1],["De kritische socioloog wil door inzicht in het functioneren van de samenleving de zelfgemaakte, doch verborgen beperkingen ervan aan het licht brengen.",0],["Het doel van de empirisch-analytische kennis is de bestaande belangenconstellaties in de maatschappij te doorbreken.",1],["De praktische sociologie wil ons door inzicht ook van de waarneming van de sociale werkelijkheid laten genieten.",0],["Het ontsluieren van de werkelijkheid die doorgaans verborgen blijft, is het belangrijkste doel van de sociologie.",0]],"note":null,"q_en":"Below are statements about the tasks of the sociologist. Which two are INCORRECT?","o_en":["Critical sociology cannot accept the existing values and convictions.","Through insight into the functioning of society, the critical sociologist wants to bring to light its self-made yet hidden limitations.","The aim of empirical-analytical knowledge is to break through the existing constellations of interests in society.","Practical sociology wants, through insight, to let us also take pleasure in the perception of social reality.","Unveiling the reality that usually remains hidden is the most important aim of sociology."],"note_en":null},{"c":2,"sel":"juiste","pick":2,"q":"Beck en Giddens verdedigen dat zich een proces van individualisering voordoet. Wat bedoelen ze hiermee?","o":[["Mensen hebben geen oog meer voor de problemen van anderen en handelen steeds meer uit louter eigenbelang.",0],["Jonge mensen geven in toenemende mate hun eigen levensloop vorm en bepalen zelf wat/wanneer ze studeren, met wie ze huwen, waar ze wonen enz.",1],["Steeds meer mensen vinden dat ze hun bezit mogen verdedigen met wapens.",0],["Kenmerken als sociale klasse of geslacht bieden weinig tot geen voorspellingskracht voor de opvattingen of smaken van individuen.",1],["Mensen informeren zich steeds minder bij experts en maken steeds meer op intuïtieve, haast instinctieve wijze keuzes.",0]],"note":null,"q_en":"Beck and Giddens argue that a process of individualization is taking place. What do they mean by this?","o_en":["People no longer have any regard for the problems of others and act increasingly out of pure self-interest.","Young people increasingly shape their own life course and decide for themselves what/when they study, whom they marry, where they live, and so on.","More and more people believe that they may defend their property with weapons.","Characteristics such as social class or sex offer little to no predictive power for the views or tastes of individuals.","People increasingly inform themselves less from experts and increasingly make choices in an intuitive, almost instinctive way."],"note_en":null},{"c":2,"sel":"juiste","pick":2,"q":"Wat wordt bedoeld met de 'empirische gezindheid' van de socioloog?","o":[["Dat de socioloog zich niet mag inlaten met de ideeën, vooroordelen en passies van de mensen/groepen die hij bestudeert.",0],["Dat de socioloog er steeds van moet uitgaan dat mensen rationeel en uit eigenbelang handelen.",0],["Dat de socioloog steeds bereid moet zijn de eigen opvattingen zonder vooroordelen te toetsen aan zijn waarnemingen en aan die van anderen.",1],["Dat de socioloog zich steeds op de rand van de samenleving moet houden en geen eigen opvatting mag hebben.",0],["Dat de socioloog zich niet mag laten verleiden tot abstracte opvattingen over het 'ware' wezen van de mens zonder deze te toetsen aan de empirische werkelijkheid.",1]],"note":null,"q_en":"What is meant by the 'empirical disposition' of the sociologist?","o_en":["That the sociologist must not become entangled with the ideas, prejudices and passions of the people/groups he studies.","That the sociologist must always assume that people act rationally and out of self-interest.","That the sociologist must always be willing to test his own views, without prejudice, against his observations and those of others.","That the sociologist must always keep to the margins of society and may not hold any view of his own.","That the sociologist must not be tempted into abstract notions about the 'true' essence of humankind without testing these against empirical reality."],"note_en":null},{"c":3,"sel":"juiste","pick":1,"q":"Een aangekondigde treinstaking deed een nooit geziene verkeersdrukte voorspellen; veel mensen pasten hun gedrag aan en de drukte bleef uit. Dit is een goed voorbeeld van…","o":[["een misplaatst gebruik van functionele analyse.",0],["een self-fulfilling prophecy.",0],["een Mattheus-effect.",0],["een Gropius-curve.",0],["een Popper-gevolg.",0],["de perverse effecten van rationeel sociaal handelen.",0],["de problemen bij extrapolaties uit statistische analyses zonder rekening te houden met intentioneel gedrag.",0],["een zelfvernietigende voorspelling.",1],["een onbedoeld gevolg van de mogelijkheid tot telewerken.",0],["een verkeerde definitie van de situatie van de verkeersdeskundigen.",0]],"note":null,"q_en":"An announced train strike led forecasts to predict unprecedented traffic congestion; many people adjusted their behavior and the congestion failed to materialize. This is a good example of…","o_en":["a misguided use of functional analysis.","a self-fulfilling prophecy.","a Matthew effect.","a Gropius curve.","a Popper effect.","the perverse effects of rational social action.","the problems with extrapolations from statistical analyses that fail to take intentional behavior into account.","a self-defeating prophecy.","an unintended consequence of the possibility of teleworking.","an incorrect definition of the situation by the traffic experts."],"note_en":null},{"c":3,"sel":"juiste","pick":2,"q":"Onder het probleem van de collectieve actie (Olson) verstaan we:","o":[["het gegeven dat, tenzij collectieve goederen worden omgezet in individuele beloningen of straffen, een rationeel handelend individu zich niet zal inzetten voor het verwerven van die goederen.",1],["de problemen veroorzaakt door betogingen en protestacties.",0],["de moeilijkheden bij het coördineren van het handelen van verschillende personen.",0],["het probleem dat politieke bewegingen altijd geleid worden door wie het meeste tijd heeft.",0],["het feit dat individuen die rationeel en in hun eigen belang handelen, zich in grote groep niet inzetten voor het behartigen van collectieve belangen.",1]],"note":null,"q_en":"By the problem of collective action (Olson) we mean:","o_en":["the fact that, unless collective goods are converted into individual rewards or punishments, a rationally acting individual will not commit to acquiring those goods.","the problems caused by demonstrations and protest actions.","the difficulties in coordinating the action of different people.","the problem that political movements are always led by those who have the most time.","the fact that individuals who act rationally and in their own self-interest will, in a large group, not commit to pursuing collective interests."],"note_en":null},{"c":3,"sel":"juiste","pick":2,"q":"Wat is het Mattheus-effect?","o":[["Merton wees met het Mattheus-effect op het cumulatieve karakter van wetenschappelijke erkenning: gereputeerde wetenschappers krijgen meer aandacht en middelen voor hun onderzoek.",1],["Het stelt dat welgestelde mensen, mits ze rationeel handelen, intelligenter en zorgvuldiger met hun geld omspringen dan minder welgestelden.",0],["Het toont aan dat individueel redelijk gedrag steeds tot redelijke uitkomsten leidt.",0],["Het wijst op de onbedoelde herverdelende invloed van veel sociaal beleid ('aan wie weinig heeft, zal genomen worden').",0],["Het Mattheus-effect is een voorbeeld van een onbedoeld, soms zelfs pervers effect.",1]],"note":null,"q_en":"What is the Matthew effect?","o_en":["With the Matthew effect, Merton pointed to the cumulative character of scientific recognition: renowned scientists receive more attention and resources for their research.","It holds that well-off people, provided they act rationally, manage their money more intelligently and carefully than the less well-off.","It demonstrates that individually reasonable behavior always leads to reasonable outcomes.","It points to the unintended redistributive influence of much social policy ('from those who have little, will be taken').","The Matthew effect is an example of an unintended, sometimes even perverse, effect."],"note_en":null},{"c":3,"sel":"juiste","pick":2,"q":"Welke uitspraken horen eerder thuis bij de Rational Choice-theorie dan bij Durkheims opvattingen over het sociale?","o":[["Wat individuen doen verschijnt als gevolg van regels, rollen en verwachtingen; het sociale schuilt in dergelijke verwachtingen.",0],["De eigensoortigheid van het sociale wordt aangetoond door de relatieve autonomie van het sociale t.o.v. andere werkelijkheidsniveaus.",0],["Het sociale is een onbedoeld, vaak ongewenst gevolg van het feit dat verschillende individuen tegelijkertijd rationeel en geïnteresseerd handelen.",1],["Het is de ontwikkeling van het sociale zelf die mensen ertoe brengt op weloverwogen, rationele wijze uit eigenbelang te handelen.",0],["Het eigensoortige van het sociale kan aangetoond worden door het bestaan van effecten die aan de individuele bedoelingen ontsnappen.",1]],"note":"Tweede sleutel ('effecten die aan individuele bedoelingen ontsnappen') lijkt eerder Durkheim, nakijken met cursus.","q_en":"Which statements belong more with Rational Choice theory than with Durkheim's views on the social?","o_en":["What individuals do appears as a consequence of rules, roles and expectations; the social resides in such expectations.","The distinctive nature of the social is demonstrated by the relative autonomy of the social with respect to other levels of reality.","The social is an unintended, often undesired consequence of the fact that different individuals act rationally and self-interestedly at the same time.","It is the development of the social self that leads people to act deliberately and rationally out of self-interest.","The distinctive nature of the social can be demonstrated by the existence of effects that escape individual intentions."],"note_en":"The second key ('effects that escape individual intentions') seems to belong rather to Durkheim, check against the course material."},{"c":3,"sel":"juiste","pick":2,"q":"Als mensen een gemeenschappelijk belang hebben dat via wetgeving kan worden opgelost, zullen zij volgens Olsons theorie van de collectieve actie…","o":[["Verenigingen oprichten om dat belang te behartigen.",0],["Zich verzetten tegen verenigingen die dat belang behartigen.",0],["Niet uit eigen beweging aansluiten bij organisaties die dat belang behartigen.",1],["Slechts onder druk bij dergelijke acties aansluiten.",1],["De belangen van anderen dienen.",0]],"note":null,"q_en":"If people have a common interest that can be addressed through legislation, then according to Olson's theory of collective action they will…","o_en":["Set up associations to pursue that interest.","Resist associations that pursue that interest.","Not join organizations that pursue that interest of their own accord.","Join such actions only under pressure.","Serve the interests of others."],"note_en":null},{"c":3,"sel":"foute","pick":2,"q":"Welke elementen vinden we terug bij de denkers van de Verlichting? Duid de twee FOUTE antwoorden.","o":[["Het belang van het individu.",0],["Het geloof in de universele rede en moraal.",0],["Het geloof dat opvattingen die strijdig zijn met de rede aan de traditie kunnen worden geweten.",0],["Het principe van de gelijkheid van alle culturen.",1],["De opvatting dat mensen niet het eigenbelang maar het redelijke belang nastreven.",1]],"note":null,"q_en":"Which elements do we find among the thinkers of the Enlightenment? Select the two INCORRECT answers.","o_en":["The importance of the individual.","The belief in universal reason and morality.","The belief that views which conflict with reason can be attributed to tradition.","The principle of the equality of all cultures.","The view that people pursue not self-interest but reasonable interest."],"note_en":null},{"c":3,"sel":"juiste","pick":2,"q":"Slechts twee van onderstaande uitspraken zijn juist. Welke?","o":[["Perverse effecten zijn tegennatuurlijk.",0],["Alle perverse effecten zijn onbedoelde effecten.",1],["Alle onbedoelde effecten zijn perverse effecten.",0],["Een zelf-bevestigende voorspelling is een voorbeeld van een onbedoeld effect.",1],["Het Mattheus-effect is een vorm van zelf-bevestigende voorspelling.",0]],"note":null,"q_en":"Only two of the statements below are correct. Which ones?","o_en":["Perverse effects are unnatural.","All perverse effects are unintended effects.","All unintended effects are perverse effects.","A self-fulfilling prophecy is an example of an unintended effect.","The Matthew effect is a form of self-fulfilling prophecy."],"note_en":null},{"c":4,"sel":"juiste","pick":1,"q":"Problematische handelingen worden steeds meer gezien als ontoereikendheden waarvoor men niet verantwoordelijk is en die via artsen/medische technologie behandeld worden. Hoe omschrijf je deze ontwikkeling het meest precies?","o":[["Toename van professionalisering",0],["Groeiende tolerantie",0],["Medicalisering",1],["Toename van het gezag van geneesheren",0],["Groeiende onbekwaamheid van de medische wetenschap",0],["Expansie van de medische sector",0],["Het gevolg van andere dan organische etiologieën",0],["De responsabilisering van de zieken",0],["'Blaming the victim'",0],["Een onbedoeld gevolg van de differentiatie van de ziekterol",0]],"note":null,"q_en":"Problematic actions are increasingly seen as inadequacies for which one is not responsible and which are treated through doctors/medical technology. How would you describe this development most precisely?","o_en":["Increase in professionalization","Growing tolerance","Medicalization","Increase in the authority of physicians","Growing incompetence of medical science","Expansion of the medical sector","The consequence of etiologies other than organic ones","The responsibilization of the sick","'Blaming the victim'","An unintended consequence of the differentiation of the sick role"],"note_en":null},{"c":4,"sel":"juiste","pick":2,"q":"Welke twee visies op 'de sociale werkelijkheid' kleuren de zoektocht naar het object van de sociologie?","o":[["Het sociale is een afgeleide van de natuur.",0],["Het sociale is een groepsgebeuren.",0],["Het sociale resulteert uit het individueel handelen-in-het-meervoud en de onbedoelde gevolgen hiervan.",1],["Het sociale verschilt van het natuurlijke.",1],["Het sociale is contingent.",0]],"note":null,"q_en":"Which two views of 'social reality' color the search for the object of sociology?","o_en":["The social is a derivative of nature.","The social is a group phenomenon.","The social results from individual action-in-the-plural and its unintended consequences.","The social differs from the natural.","The social is contingent."],"note_en":null},{"c":4,"sel":"juiste","pick":2,"q":"Durkheim verzet zich tegen de rational choice-theorieën. Welke argumenten haalt hij hiertoe aan?","o":[["Hij meent dat het individu-zijn verschilt van samenleving tot samenleving, van cultuur tot cultuur.",1],["Hij aanvaardt het theoretisch uitgangspunt dat a priori een onderscheid maakt tussen individu en samenleving.",0],["Hij meent dat mensen nooit uit eigenbelang handelen.",0],["Hij meent dat individueel gedrag slechts te begrijpen is vanuit de materiële condities waaraan het handelen gebonden is.",0],["Hij meent dat de samenleving meer is dan de som van de individuen en dus niet begrepen kan worden als een (ongewenst) bijproduct van het individuele handelen.",1]],"note":null,"q_en":"Durkheim opposes rational choice theories. Which arguments does he put forward to do so?","o_en":["He holds that being an individual differs from society to society, from culture to culture.","He accepts the theoretical premise that a priori distinguishes between individual and society.","He holds that people never act out of self-interest.","He holds that individual behavior can only be understood from the material conditions to which action is bound.","He holds that society is more than the sum of individuals and therefore cannot be understood as an (undesired) by-product of individual action."],"note_en":null},{"c":4,"sel":"juiste","pick":2,"q":"Welke argumenten hanteren de tegenstanders van de rational choice-theorieën?","o":[["Het is slechts een veronderstelling dat mensen steevast uit eigenbelang handelen.",1],["De verdedigers van de rational choice-theorie hebben enkel oog voor de sociale context waarbinnen preferenties tot stand komen.",0],["De aanhangers ontkennen dat collectieve actie door dwang of geweld tot stand kan komen.",0],["De rational choice-theorieën zijn gericht op een status quo van de bestaande machtsverhoudingen.",0],["De aanhangers stellen zich niet de vraag vanwaar de preferenties van mensen komen.",1]],"note":null,"q_en":"Which arguments do the opponents of rational choice theories use?","o_en":["It is merely an assumption that people invariably act out of self-interest.","The defenders of rational choice theory have an eye only for the social context within which preferences come about.","Its adherents deny that collective action can come about through coercion or violence.","Rational choice theories are oriented toward a status quo of the existing power relations.","Its adherents do not ask where people's preferences come from."],"note_en":null},{"c":4,"sel":"juiste","pick":2,"q":"Het voorbeeld van de 'ziekterol' maakt duidelijk dat…","o":[["…rollen en gedragsverwachtingen vaak fundamenteler zijn dan individuele belangen en preferenties.",1],["…sociale verschijnselen uiteindelijk ook herleidbaar zijn tot objectieve, natuurlijke fenomenen.",0],["…gedragsverwachtingen uiteindelijk ook beschouwd kunnen worden als onbedoelde gevolgen van intentionele handelingen.",0],["…individuele belangen en preferenties aan de basis liggen van rollen en gedragsverwachtingen.",0],["…het sociale meer is dan een onbedoeld gevolg van intentionele handelingen.",1]],"note":null,"q_en":"The example of the 'sick role' makes clear that…","o_en":["…roles and behavioral expectations are often more fundamental than individual interests and preferences.","…social phenomena are ultimately also reducible to objective, natural phenomena.","…behavioral expectations can ultimately also be regarded as unintended consequences of intentional actions.","…individual interests and preferences underlie roles and behavioral expectations.","…the social is more than an unintended consequence of intentional actions."],"note_en":null},{"c":4,"sel":"juiste","pick":2,"q":"Het verschil tussen de verschijnselen ziekte en ziekterol blijkt onder meer uit het feit dat:","o":[["de gezondheid kan worden omschreven als een toestand van volledig fysiek welzijn.",0],["er tegen de uitbreiding van de ziekterol al heel wat reacties zijn gekomen.",0],["de hedendaagse ziekterol onvoldoende betekenis kan geven aan de verschijnselen 'lijden' en 'dood'.",0],["de uitbreiding van de ziekterol niet aan ontwikkelingen in de medische wetenschap kan worden toegeschreven.",1],["het gebruik van de ziekterol niet tot de kennis van de natuur kan worden gereduceerd.",1]],"note":null,"q_en":"The difference between the phenomena of illness and the sick role becomes apparent, among other things, from the fact that:","o_en":["health can be described as a state of complete physical well-being.","considerable reactions have already arisen against the expansion of the sick role.","the contemporary sick role cannot adequately give meaning to the phenomena of 'suffering' and 'death'.","the expansion of the sick role cannot be attributed to developments in medical science.","the use of the sick role cannot be reduced to knowledge of nature."],"note_en":null},{"c":4,"sel":"juiste","pick":2,"q":"Welke kenmerken of inzichten koppelde Parsons aan de ziekterol?","o":[["Iemand aan wie de ziekterol is toegekend moet via uiterlijke kenmerken aan de omgeving duidelijk maken dat hij/zij werkelijk ziek is.",0],["Een persoon aan wie de ziekterol is toegekend hoeft niet normaal te functioneren; de ziekterol is een 'sociale' vertaling van de objectieve condities van het lichaam.",0],["De zieke wordt niet gestraft omwille van zijn onbekwaamheid, maar dient wel blijk te geven van een wil tot genezen.",1],["Enkel gediplomeerde geneesheren kunnen in onze samenleving de ziekterol toewijzen.",0],["Bij de toekenning van de ziekterol vervalt de verwachting dat deze persoon zich 'normaal' dient te gedragen; hij hoeft niet te voldoen aan de gangbare gedragsverwachtingen.",1]],"note":null,"q_en":"Which characteristics or insights did Parsons link to the sick role?","o_en":["Someone who has been assigned the sick role must make clear to those around them, through outward signs, that he/she is genuinely ill.","A person who has been assigned the sick role does not have to function normally; the sick role is a 'social' translation of the objective conditions of the body.","The sick person is not punished for their incapacity, but must nonetheless show a will to recover.","Only certified physicians can assign the sick role in our society.","When the sick role is assigned, the expectation that this person should behave 'normally' lapses; he/she does not have to meet the usual behavioral expectations."],"note_en":null},{"c":5,"sel":"juiste","pick":1,"q":"Onder 'geïnternaliseerde' regels verstaan we de regels die:","o":[["als het ware 'tweede natuur' zijn geworden.",1],["deel zijn geworden van de groep of organisatie.",0],["die een cultuur zich eigen heeft gemaakt.",0],["die men niet kan overtreden zonder geïnterneerd te worden in een psychiatrische instelling.",0],["die eerst in etiquetteboeken werden geformuleerd en dan vanzelfsprekend zijn geworden.",0],["men aanleert wanneer men in een psychiatrische instelling geïnterneerd wordt.",0],["het scenario vormen voor het vlot spelen van onze rollen.",0],["de interne structuur van organisaties vastleggen.",0],["men gemakkelijk kan overtreden.",0]],"note":null,"q_en":"By 'internalized' rules we mean the rules that:","o_en":["have become, as it were, 'second nature'.","have become part of the group or organization.","a culture has made its own.","one cannot break without being committed to a psychiatric institution.","were first formulated in etiquette books and then became self-evident.","one learns when committed to a psychiatric institution.","form the script for smoothly playing out our roles.","establish the internal structure of organizations.","one can easily break."],"note_en":null},{"c":5,"sel":"juiste","pick":2,"q":"Wat wordt bedoeld met roldistantie?","o":[["Als we rollen spelen identificeren we ons vaak met de andere personen in de interactie (bv. de lesgever die zich identificeert met de student).",1],["Roldistantie doet zich voor wanneer iemand een rol speelt die hij/zij eigenlijk niet kan of mag spelen (bv. de portier die professor speelt).",0],["Roldistantie treedt op wanneer mensen hun 'maskers' afleggen en uit hun rollen treden, of in Goffmans termen: als men 'backstage' is.",1],["Roldistantie is een begrip uit de dramaturgische roltheorie; het verwijst naar situaties waarbij bewust een rol wordt gespeeld ('impression management') zonder dat het echte 'zelf' erbij betrokken is.",0],["Roldistantie treedt op wanneer aan de verwachtingen die met een bepaalde rol verbonden zijn niet langer voldaan wordt.",0]],"note":"Let op (mogelijke boekfout): het 1e gemarkeerde antwoord beschrijft eigenlijk rol-IDENTIFICATIE, niet roldistantie. Volgens Goffman is alleen 'maskers afleggen / backstage' juist. Nakijken met cursus.","q_en":"What is meant by role distance?","o_en":["When we play roles, we often identify with the other people in the interaction (e.g. the teacher who identifies with the student).","Role distance occurs when someone plays a role that he/she actually cannot or may not play (e.g. the doorman who plays professor).","Role distance occurs when people take off their 'masks' and step out of their roles, or in Goffman's terms: when one is 'backstage'.","Role distance is a concept from dramaturgical role theory; it refers to situations in which a role is deliberately played ('impression management') without the real 'self' being involved.","Role distance occurs when the expectations associated with a particular role are no longer met."],"note_en":"Note (possible textbook error): the 1st highlighted answer actually describes role IDENTIFICATION, not role distance. According to Goffman, only 'taking off masks / backstage' is correct. Check with the course material."},{"c":5,"sel":"juiste","pick":2,"q":"Hoe verhouden Goffmans dramaturgische benadering en het symbolisch interactionisme (Mead) zich tot elkaar?","o":[["Volgens Goffman is complete roldistantie niet mogelijk, rolgedrag daarentegen wel.",0],["Zowel Mead als Goffman beschouwen de sociale werkelijkheid vanuit het perspectief van de actor en de rollen die hij/zij speelt.",1],["Volgens Mead is de dramaturgische benadering te individualistisch: volgens hem bestaan individuen dankzij de rollen die ze spelen.",1],["Goffman stelt dat individuen via de kennis van verschillende rollen zelfbewustzijn verwerven.",0],["Zowel Mead als Goffman hanteren een rationeel-utilitair mensbeeld.",0]],"note":null,"q_en":"How do Goffman's dramaturgical approach and symbolic interactionism (Mead) relate to each other?","o_en":["According to Goffman, complete role distance is not possible, whereas role behavior is.","Both Mead and Goffman view social reality from the perspective of the actor and the roles he/she plays.","According to Mead, the dramaturgical approach is too individualistic: in his view, individuals exist thanks to the roles they play.","Goffman argues that individuals acquire self-awareness through knowledge of different roles.","Both Mead and Goffman employ a rational-utilitarian view of humanity."],"note_en":null},{"c":5,"sel":"juiste","pick":2,"q":"Welke verschillen kunnen we onderscheiden tussen de conflictsociologie en de functionalistische sociologie? (variant)","o":[["Functionalisten maken volgens conflictsociologen te vaak gebruik van samenhang als legitimerend verhaal.",1],["Conflictsociologen hebben doorgaans meer oog voor de rol van dwang in het sturen van het menselijk gedrag dan functionalisten.",1],["Functionalisten zullen meer dan conflictsociologen veel aandacht hebben voor sociale ongelijkheid.",0],["Functionalisten zijn meer geneigd de verklaring van menselijk gedrag te zoeken in de socialisatie en internalisatie van opvattingen en houdingen.",0],["Conflictsociologen hebben geen aandacht voor het belang van rollen in de samenleving.",0]],"note":null,"q_en":"What differences can we distinguish between conflict sociology and functionalist sociology? (variant)","o_en":["According to conflict sociologists, functionalists too often make use of cohesion as a legitimating narrative.","Conflict sociologists generally pay more attention to the role of coercion in directing human behavior than functionalists do.","Functionalists will, more than conflict sociologists, pay a great deal of attention to social inequality.","Functionalists are more inclined to seek the explanation of human behavior in the socialization and internalization of beliefs and attitudes.","Conflict sociologists pay no attention to the importance of roles in society."],"note_en":null},{"c":5,"sel":"juiste","pick":2,"q":"Wat is een 'sociale rol'?","o":[["Het geheel van normen en regels die mensen wel weten te gebruiken, doch niet uitdrukkelijk kunnen formuleren.",0],["Een mechanisme dat het handelen van anderen een mate van voorspelbaarheid geeft.",1],["Het geheel van verwachtingen ten opzichte van iemand in een bepaalde, zich herhalende situatie.",1],["Het geheel van geïnternaliseerde gedragsverwachtingen die bepalen hoe ego moet reageren op alter in contacten tussen vreemde culturen.",0],["Het sociale leven kan beschouwd worden als een reeds geschreven stuk waarin iedereen de rol speelt die voor hem/haar is weggelegd.",0]],"note":null,"q_en":"What is a 'social role'?","o_en":["The set of norms and rules that people do know how to use, yet cannot explicitly formulate.","A mechanism that gives the behavior of others a degree of predictability.","The set of expectations toward someone in a particular, recurring situation.","The set of internalized behavioral expectations that determine how ego must respond to alter in contacts between foreign cultures.","Social life can be regarded as an already-written play in which everyone plays the role assigned to him/her."],"note_en":null},{"c":5,"sel":"juiste","pick":2,"q":"Welke verschillen kunnen we maken tussen de conflictsociologie en de functionalistische sociologie?","o":[["Conflictsociologen maken volgens de functionalisten te veel gebruik van samenhang als legitimerende derde.",0],["Conflictsociologen hebben doorgaans meer oog voor de rol van dwang in het sturen van het menselijke gedrag dan functionalisten.",1],["Functionalisten zullen meer dan de hedendaagse conflictsociologen aandacht hebben voor sociale ongelijkheid.",0],["Functionalisten zijn meer geneigd de verklaring van menselijk gedrag te zoeken in de socialisatie en internalisatie van opvattingen en houdingen.",1],["Conflictsociologen hebben geen aandacht voor het belang van rollen in de samenleving.",0]],"note":null,"q_en":"What differences can we distinguish between conflict sociology and functionalist sociology?","o_en":["According to functionalists, conflict sociologists make too much use of cohesion as a legitimating third.","Conflict sociologists generally pay more attention to the role of coercion in directing human behavior than functionalists do.","Functionalists will, more than contemporary conflict sociologists, pay attention to social inequality.","Functionalists are more inclined to seek the explanation of human behavior in the socialization and internalization of beliefs and attitudes.","Conflict sociologists pay no attention to the importance of roles in society."],"note_en":null},{"c":5,"sel":"juiste","pick":2,"q":"Welke kritieken krijgen de functionalistische theorieën?","o":[["Dat in sommige van deze theorieën verondersteld wordt dat fenomenen die een duidelijke functie hebben voor de samenleving, zich wel degelijk zullen voordoen.",1],["Dat deze theorieën het individualistische micro-perspectief overmatig beklemtonen, ten nadele van een globale macro-analyse.",0],["Dat deze theorieën te veel oog hebben voor de rol van conflict en dwang.",0],["Dat deze theorieën niets vertellen over het waarom van individuele preferenties.",0],["Dat in deze theorieën te vaak naar samenhang als legitimerende derde wordt gegrepen en zo een status quo van de bestaande orde wordt verdedigd.",1]],"note":null,"q_en":"What criticisms are leveled at functionalist theories?","o_en":["That in some of these theories it is assumed that phenomena which have a clear function for society will indeed occur.","That these theories overly emphasize the individualistic micro-perspective, at the expense of a comprehensive macro-analysis.","That these theories pay too much attention to the role of conflict and coercion.","That these theories say nothing about the why of individual preferences.","That in these theories cohesion is too often invoked as a legitimating third, thereby defending a status quo of the existing order."],"note_en":null},{"c":6,"sel":"juiste","pick":1,"q":"Hoe noemt men de studie die regelmaten in het menselijk handelen niet enkel meet, maar ook plaatst/verklaart in het licht van de interpretaties, opvattingen en verwachtingen van de betrokkenen?","o":[["Zelfwerk",0],["Waardengetrouw",0],["Hermeneutiek",1],["Verwantschapsleer",0],["Veldwerk",0],["Voluntarisme",0],["Functionele analyse",0],["Confucianisme",0],["Eugenetica",0],["Introspectief",0]],"note":null,"q_en":"What is the name of the study that not only measures regularities in human action, but also situates/explains them in light of the interpretations, beliefs and expectations of those involved?","o_en":["Self-work","Value-committed","Hermeneutics","Kinship studies","Fieldwork","Voluntarism","Functional analysis","Confucianism","Eugenics","Introspective"],"note_en":null},{"c":6,"sel":"juiste","pick":2,"q":"Welke kritieken geeft de hermeneutische benadering van Wilhelm Dilthey op de 'Verstehende methode' van Max Weber?","o":[["Webers benadering is te collectivistisch door de klemtoon op de gedetermineerdheid van handelen.",0],["Weber spiegelt zijn benadering te veel aan de natuurwetenschappen.",0],["De Verstehende methode houdt geen rekening met motieven die mensen hebben om bepaalde handelingen te stellen.",0],["Weber gaat er te veel vanuit dat alle individuen op eenzelfde manier reageren in sociale situaties.",1],["Dilthey vestigt, in tegenstelling tot Weber, de aandacht op het belang van culturele verschillen in het begrijpen van handelingen.",1]],"note":null,"q_en":"What criticisms does Wilhelm Dilthey's hermeneutic approach make of Max Weber's 'interpretive (Verstehen) method'?","o_en":["Weber's approach is too collectivistic because of its emphasis on the determined nature of action.","Weber models his approach too closely on the natural sciences.","The interpretive (Verstehen) method does not take into account the motives people have for performing certain actions.","Weber assumes too much that all individuals react in the same way in social situations.","Dilthey, unlike Weber, draws attention to the importance of cultural differences in understanding actions."],"note_en":null},{"c":6,"sel":"juiste","pick":2,"q":"De situationele aspecten van de handeling omvatten:","o":[["een definitie van de situatie.",0],["symbolen via dewelke de handeling kan worden voorgesteld.",0],["de middelen die ter beschikking van de actor staan.",1],["de condities waaraan de actor onderhevig is.",1],["de doelen waarop de handeling gericht is.",0]],"note":null,"q_en":"The situational aspects of action comprise:","o_en":["a definition of the situation.","symbols through which the action can be represented.","the means available to the actor.","the conditions to which the actor is subject.","the ends at which the action is directed."],"note_en":null},{"c":6,"sel":"juiste","pick":2,"q":"Welke van onderstaande uitspraken over de sociale handeling zijn juist?","o":[["Symbolen en hun betekenissen zijn communicatieve aspecten van de handeling.",1],["Een hermeneutische benadering zal vooral het kennen en begrijpen van de intentionele aspecten (doelen, normen) als een wetenschappelijk probleem formuleren.",0],["Aanhangers van het Utilitarisme menen dat de intentionele aspecten van de handeling in alle culturen dezelfde zijn.",1],["De definitie van de situatie biedt een inventaris van middelen en condities.",0],["De kennis die de middel-doelrelaties onderbouwt, is universeel en objectief.",0]],"note":"Tweede sleutel (Utilitarisme: intentionele aspecten in alle culturen dezelfde), nakijken met cursus.","q_en":"Which of the following statements about social action are correct?","o_en":["Symbols and their meanings are communicative aspects of action.","A hermeneutic approach will primarily formulate the knowing and understanding of the intentional aspects (ends, norms) as a scientific problem.","Adherents of Utilitarianism hold that the intentional aspects of action are the same in all cultures.","The definition of the situation provides an inventory of means and conditions.","The knowledge that underpins the means-ends relations is universal and objective."],"note_en":"Second key (Utilitarianism: intentional aspects the same in all cultures), check with the course material."},{"c":6,"sel":"foute","pick":2,"q":"Duid de twee FOUTE uitspraken over het Utilitarisme aan.","o":[["Het Utilitarisme acht de culturele componenten doel en norm onbelangrijk.",1],["Het Utilitarisme maakt een onderscheid tussen universele doelen en natuurlijke doelen.",0],["Eerlijkheid, rechtvaardigheid en waarheid zijn volgens het Utilitarisme natuurlijke doelen.",1],["Het Utilitarisme gaat ervan uit dat er een aantal natuurlijk gegeven doelen zijn.",0],["Volgens het Utilitarisme streeft de mens zijn doelen zo rationeel mogelijk na.",0]],"note":null,"q_en":"Select the two INCORRECT statements about Utilitarianism.","o_en":["Utilitarianism considers the cultural components end and norm unimportant.","Utilitarianism makes a distinction between universal ends and natural ends.","According to Utilitarianism, honesty, justice and truth are natural ends.","Utilitarianism assumes that there are a number of naturally given ends.","According to Utilitarianism, the human being pursues his ends as rationally as possible."],"note_en":null},{"c":6,"sel":"juiste","pick":2,"q":"Welke bedenkingen kunnen worden geformuleerd bij de Verstehende-methode van Weber?","o":[["De aanhangers focussen in hun studie van de sociale werkelijkheid overmatig op causaliteit.",0],["Deze methode biedt weinig mogelijkheden om de interpretatie van de onderzoeker te toetsen; ze blijft erg subjectief.",1],["Het volstaat niet om statistische regelmaten te observeren.",0],["Deze methode werkt beter dicht bij huis en voor de eigen groep dan voor groepen of culturen die geografisch of in de tijd ver verwijderd zijn.",1],["Deze methode verliest de praktische taak van de socioloog uit het oog.",0]],"note":null,"q_en":"What objections can be formulated regarding Weber's interpretive (Verstehen) method?","o_en":["Its adherents focus excessively on causality in their study of social reality.","This method offers few possibilities for testing the researcher's interpretation; it remains very subjective.","It is not sufficient to observe statistical regularities.","This method works better close to home and for one's own group than for groups or cultures that are geographically or temporally far removed.","This method loses sight of the practical task of the sociologist."],"note_en":null},{"c":6,"sel":"juiste","pick":2,"q":"Wat bedoelt Luhmann als hij zegt: 'Normen zijn verwachtingen die niet leren.'?","o":[["Als normatieve verwachtingen niet worden nageleefd, wordt sanctionerend opgetreden.",1],["Het frustreren van cognitieve verwachtingen wekt hevige reacties van afkeer of walging op.",0],["Cognitieve verwachtingen worden na verloop van tijd aangepast of veranderd wanneer ze niet nageleefd worden.",1],["Normatieve verwachtingen passen zich niet aan maar worden na verloop van tijd cognitief van aard.",0],["Normatieve verwachtingen steunen louter op discursieve kennis.",0]],"note":null,"q_en":"What does Luhmann mean when he says: 'Norms are expectations that do not learn.'?","o_en":["If normative expectations are not complied with, sanctioning action is taken.","Frustrating cognitive expectations provokes intense reactions of aversion or disgust.","Cognitive expectations are adjusted or changed over time when they are not complied with.","Normative expectations do not adapt but become cognitive in nature over time.","Normative expectations rest solely on discursive knowledge."],"note_en":null},{"c":7,"sel":"juiste","pick":1,"q":"Sociale regels en betekenissen die we onbewust kennen en hanteren (bv. niet te lang aanstaren in de lift, niet slurpen). Hoe noemen sociologen dit?","o":[["Rolverwachtingen",0],["Discursieve kennis",0],["Internalisatie",0],["Elementaire kennis",0],["Socialisatie",0],["Normatieve kennis",0],["Symbolische kennis",0],["Praktische kennis",1],["Interactionele kennis",0],["Ethnomethodologische kennis",0]],"note":null,"q_en":"Social rules and meanings that we know and use unconsciously (e.g. not staring too long in the lift, not slurping). What do sociologists call this?","o_en":["Role expectations","Discursive knowledge","Internalization","Elementary knowledge","Socialization","Normative knowledge","Symbolic knowledge","Practical knowledge","Interactional knowledge","Ethnomethodological knowledge"],"note_en":null},{"c":7,"sel":"juiste","pick":2,"q":"Welke twee uitspraken over sanctioneren zijn juist?","o":[["Beïnvloeden veronderstelt solidariteit.",1],["Bij het activeren van waardengetrouwheid zal men de verbondenheid bevestigen.",0],["Geld is het symbolische medium voor bestraffen.",0],["Schuldgevoelens zijn het gevolg van beïnvloeding.",1],["Bij positieve sancties wordt de belofte ten uitvoer gebracht als de verwachting wordt ingelost.",0]],"note":"Tweede sleutel (schuldgevoelens horen volgens het schema bij waardengetrouwheid, niet beïnvloeding), nakijken met cursus.","q_en":"Which two statements about sanctioning are correct?","o_en":["Influencing presupposes solidarity.","When value-commitment is activated, the bond will be confirmed.","Money is the symbolic medium for punishing.","Feelings of guilt are the result of influencing.","With positive sanctions, the promise is carried out when the expectation is fulfilled."],"note_en":"Second key (feelings of guilt belong, according to the scheme, to value-commitment, not influencing), check against the course material."},{"c":7,"sel":"juiste","pick":2,"q":"Waarom kunnen technologische innovaties (videoconferentie, e-mail) volgens Boden en Molotch face-to-face interactie niet volledig vervangen?","o":[["Face-to-face contact biedt meer informatieoverdracht, via onder andere non-verbale kanalen.",1],["Face-to-face contacten laten toe om 'frontstage' de intenties van de ander te toetsen aan zijn/haar gedrag als hij/zij 'backstage' gaat.",0],["Face-to-face contact maakt 'interactioneel vandalisme' onmogelijk.",0],["Face-to-face contact biedt de mogelijkheid om sneller te anticiperen bij storingen in de communicatie.",1],["Face-to-face contact is indringender omdat men hierbij de persoonlijke ruimte van de ander kan binnendringen.",0]],"note":null,"q_en":"Why, according to Boden and Molotch, can technological innovations (video conferencing, e-mail) not fully replace face-to-face interaction?","o_en":["Face-to-face contact offers more information transfer, including through non-verbal channels.","Face-to-face contacts allow one to test the other's intentions 'frontstage' against his/her behaviour when he/she goes 'backstage'.","Face-to-face contact makes 'interactional vandalism' impossible.","Face-to-face contact offers the possibility of anticipating more quickly when there are disruptions in communication.","Face-to-face contact is more intrusive because it allows one to enter the other's personal space."],"note_en":null},{"c":7,"sel":"juiste","pick":1,"q":"Welke uitspraak over kennis en socialisatie is juist?","o":[["Socialisatie kan slechts ten dele uit onderwijs bestaan omdat de kennis die erbij verworven wordt in grote mate praktisch eerder dan discursief is.",1],["De kennis van gedragscodes die voorschrijven hoe mensen zich dienen te gedragen, noemen we praktische kennis.",0],["De kennis die steunt op de regelmaten die zich voordoen in het leven, noemen we discursieve kennis.",0],["Van normatieve verwachtingen maakt men al snel gedragsregelmaten, met andere woorden cognitieve verwachtingen.",0],["Normatieve verwachtingen worden meteen bijgesteld zodra iemand ze schendt, terwijl cognitieve verwachtingen ook na herhaalde teleurstelling onveranderd blijven.",0]],"q_en":"Which statement about knowledge and socialization is correct?","o_en":["Socialization can only partly consist of education because the knowledge acquired through it is largely practical rather than discursive.","The knowledge of codes of conduct that prescribe how people should behave is what we call practical knowledge.","The knowledge that rests on the regularities that occur in life is what we call discursive knowledge.","Normative expectations are quickly turned into behavioural regularities, in other words cognitive expectations.","People change their cognitive expectations when these are not complied with."],"why":"Alleen de eerste uitspraak klopt. De andere vier draaien de begrippen om: gedragscodes die voorschrijven horen bij normatieve verwachtingen, kennis die op regelmaten steunt is cognitief, en normatieve verwachtingen hou je juist vast als iemand ze schendt, terwijl je cognitieve verwachtingen bijstelt."},{"c":7,"sel":"juiste","pick":2,"q":"Welke zijn de centrale doelstellingen van de 'blauwdruk-theorie' van de sociale orde?","o":[["De meeste mensen kennen en respecteren de regels van het sociale leven; aldus ontstaat een grote mate van voorspelbaarheid in de samenleving.",1],["Discursieve regels dienen omgezet te worden tot praktische regels om het begrip van het alledaagse leven te vergroten.",0],["Het is quasi onmogelijk om alle praktische betekenissen, regels en normen van het alledaagse sociale leven te verwoorden.",0],["De regels die het gedrag van mensen sturen, worden op jonge leeftijd geïnternaliseerd en onveranderd van generatie op generatie doorgegeven.",0],["Via observatie kan men de regels die het sociale leven beheersen, ontdekken.",1]],"note":null,"q_en":"What are the central premises of the 'blueprint theory' of social order?","o_en":["Most people know and respect the rules of social life; in this way a large degree of predictability arises in society.","Discursive rules need to be converted into practical rules in order to increase the understanding of everyday life.","It is virtually impossible to put into words all the practical meanings, rules and norms of everyday social life.","The rules that guide people's behaviour are internalized at a young age and passed on unchanged from generation to generation.","Through observation one can discover the rules that govern social life."],"note_en":null},{"c":7,"sel":"juiste","pick":2,"q":"De ethnomethodologie kent een specifieke benadering van de sociale werkelijkheid. Welke uitspraken zijn correct?","o":[["Ethnomethodologen proberen op basis van de studie van dagelijkse handelingen en communicatie de fundamentele regels van het samenleven (een sociale grammatica) te ontdekken.",1],["Vernieuwing van rollen, normen en conventies is binnen de ethnomethodologie niet mogelijk gezien de robuusthe
