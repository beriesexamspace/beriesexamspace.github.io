        '<button class="mode" id="quickStart"><span class="me">'+ic("rocket")+'</span><b>'+L("Snelle ronde","Quick round")+'</b><small>'+L("15 willekeurige vragen uit alle hoofdstukken.","15 random questions from all chapters.")+'</small></button>'+
        '<button class="mode" id="recoStart"><span class="me">'+ic("sparkles")+'</span><b>'+L("Examenreconstructies","Exam reconstructions")+'</b><small>'+L("51 vragen uit vier examens, opgeschreven door studenten na afloop.","51 questions from four exams, written down by students afterwards.")+'</small></button>'+
        '<button class="mode" id="oudStart"><span class="me">'+ic("sparkles")+'</span><b>'+L("Oude examenvragen","Past exam questions")+'</b><small>'+L("24 vragen uit oude examens, met uitleg bij elk antwoord.","24 questions from past exams, with an explanation for every answer.")+'</small></button>'+
      '</div>';
    setHTML(html);
    document.getElementById("backBtn").onclick=function(){ if(state.fromHub){ location.href="https://beriesexamspace.github.io/"; return; } state.step=(herk?"herkansing":"track"); renderHome(); window.scrollTo(0,0); };
    document.getElementById("changeMode").onclick=function(){ if(state.fromHub){ location.href="https://beriesexamspace.github.io/"; return; } state.step="track"; renderHome(); window.scrollTo(0,0); };
    document.querySelector('[data-mode="quiz"]').onclick=function(){ go("quiz"); };
    document.getElementById("quickStart").onclick=function(){ state.view="quiz"; tabBtns.forEach(function(b){b.classList.toggle("on",b.dataset.view==="quiz");}); startQuiz(shuffle(D.questions.slice()).slice(0,15)); window.scrollTo(0,0); };
    var rb=document.getElementById("recoStart");
    if(rb) rb.onclick=function(){ state.view="quiz"; tabBtns.forEach(function(b){b.classList.toggle("on",b.dataset.view==="quiz");}); startQuiz(shuffle(D.questions.filter(function(q){return String(q.c)==="17";}))); window.scrollTo(0,0); };
    var ob=document.getElementById("oudStart");
    if(ob) ob.onclick=function(){ state.view="quiz"; tabBtns.forEach(function(b){b.classList.toggle("on",b.dataset.view==="quiz");}); startQuiz(shuffle(D.questions.filter(function(q){return String(q.c)==="18";}))); window.scrollTo(0,0); };
    var rb=document.getElementById("recoStart");
    if(rb) rb.onclick=function(){ state.view="quiz"; tabBtns.forEach(function(b){b.classList.toggle("on",b.dataset.view==="quiz");}); startQuiz(shuffle(D.questions.filter(function(q){return String(q.c)==="17";}))); window.scrollTo(0,0); };
    var ob=document.getElementById("oudStart");
    if(ob) ob.onclick=function(){ state.view="quiz"; tabBtns.forEach(function(b){b.classList.toggle("on",b.dataset.view==="quiz");}); startQuiz(shuffle(D.questions.filter(function(q){return String(q.c)==="18";}))); window.scrollTo(0,0); };
  }

  function renderQuizGate(){
    if(state.quiz) return renderQuiz();
    var s=state.sel;
    function pool(){ return D.questions.filter(function(q){return s.topics[q.t];}); }
    var html='<div class="card pad"><h2 style="text-align:center;margin-top:0">'+L("Oefenvragen","Practice questions")+'</h2>'+
      '<p class="muted" style="text-align:center">'+L("Kies hoofdstukken en het aantal vragen. Na elke vraag krijg je meteen feedback.","Pick chapters and the number of questions. You get instant feedback after each one.")+'</p>'+
      '<label class="fld">'+L("Hoofdstukken","Chapters")+'</label>'+
      '<div class="chips" style="margin-bottom:8px"><button class="chip" id="selAll">'+L("Alle","All")+'</button><button class="chip" id="selNone">'+L("Geen","None")+'</button></div>'+
      '<div class="chips" id="tps">'+
        Object.keys(D.chapters).map(function(k){return '<button class="chip'+(s.topics[k]?" on":"")+'" data-tp="'+k+'">H'+k+' · '+esc(chName(k))+'</button>';}).join("")+'</div>'+
      '<label class="fld">'+L("Aantal vragen","Number of questions")+'</label><div class="chips" id="cnt">'+
        [10,15,20,999].map(function(n){return '<button class="chip'+(s.count===n?" on":"")+'" data-n="'+n+'">'+(n===999?L("Alle","All"):n)+'</button>';}).join("")+'</div>'+
      '<label class="fld">'+L("Willekeurige volgorde","Random order")+'</label><div class="chips" id="ord">'+'<button class="chip'+(s.shuffle?" on":"")+'" data-sh="1">'+L("Door elkaar","Shuffled")+'</button>'+'<button class="chip'+(s.shuffle?"":" on")+'" data-sh="0">'+L("Op volgorde","In order")+'</button>'+'</div>'+
      '<div class="row" style="margin-top:18px"><button class="btn" id="startQ">'+L("Start","Start")+' '+ic("arrowR")+'</button><span class="muted" id="poolN"></span></div></div>';
    setHTML(html);
    function refresh(){ var n=pool().length; document.getElementById("poolN").textContent=n+" "+L("vragen beschikbaar","questions available"); document.getElementById("startQ").disabled=n===0; }
    [].slice.call(document.querySelectorAll("#tps .chip")).forEach(function(b){ b.onclick=function(){ s.topics[b.dataset.tp]=!s.topics[b.dataset.tp]; b.classList.toggle("on"); refresh(); }; });
    document.getElementById("selAll").onclick=function(){ Object.keys(D.chapters).forEach(function(k){s.topics[k]=true;}); renderQuizGate(); };
    document.getElementById("selNone").onclick=function(){ Object.keys(D.chapters).forEach(function(k){s.topics[k]=false;}); renderQuizGate(); };
    [].slice.call(document.querySelectorAll("#cnt .chip")).forEach(function(b){ b.onclick=function(){ s.count=+b.dataset.n; renderQuizGate(); }; });
    [].slice.call(document.querySelectorAll("#ord .chip")).forEach(function(b){ b.onclick=function(){ s.shuffle=b.dataset.sh==="1"; [].slice.call(document.querySelectorAll("#ord .chip")).forEach(function(x){x.classList.toggle("on",x===b);}); }; });
    document.getElementById("startQ").onclick=function(){ var p=pool(); if(s.shuffle)p=shuffle(p); if(s.count<p.length)p=p.slice(0,s.count); startQuiz(p); };
    refresh();
  }

  function startQuiz(items){ bump("berat-socio", state.track==="herkansing"?"herkansing":"training");
    state.quiz={ items: items.map(function(q){ return { q:q, opts:shuffle(q.o.map(function(pair,i){return {i:i, ok:pair[1]===1};})), picked:[], done:false }; }), idx:0, correct:0, wrong:[], done:false }; renderQuiz(); }

  function renderQuiz(){
    var Q=state.quiz; if(Q.done) return renderResult();
    var cur=Q.items[Q.idx], q=cur.q;
    var instr = q.sel==="foute"
      ? L("Selecteer de "+(q.pick>1?q.pick+" ":"")+"FOUTE antwoord"+(q.pick>1?"en":""),"Select the "+(q.pick>1?q.pick+" ":"")+"INCORRECT answer"+(q.pick>1?"s":""))
      : L("Selecteer "+(q.pick>1?"de "+q.pick+" juiste antwoorden":"het juiste antwoord"),"Select "+(q.pick>1?"the "+q.pick+" correct answers":"the correct answer"));
    var html='<button class="backlink" id="backBtn">'+ic("back")+L("Terug","Back")+'</button>'+
      '<div class="card pad">'+
      '<div class="runtop"><span class="pill">'+esc("H"+q.c+" · "+chName(q.c))+'</span><div class="bar"><i data-w="'+pct(Q.idx,Q.items.length)+'"></i></div><span>'+(Q.idx+1)+'/'+Q.items.length+'</span></div>'+
      '<div style="font-size:13px;font-weight:700;color:var(--accent-ink);margin:2px 0 2px">'+esc(instr)+'</div>'+
      '<div class="qtext">'+esc(qF(q,"q"))+'</div>'+
      '<div id="opts">'+cur.opts.map(function(o,i){return '<button class="opt" data-i="'+i+'" style="--oi:'+(i*45)+'ms"><span class="k">'+String.fromCharCode(65+i)+'</span><span>'+esc(LANG==="en"&&q.o_en?q.o_en[o.i]:q.o[o.i][0])+'</span></button>';}).join("")+'</div>'+
      (qF(q,"note")?'<div class="feedback" style="background:var(--amber-soft);color:var(--amber)">⚠️ '+esc(qF(q,"note"))+'</div>':'')+
      '<div id="fb"></div>'+
      '<div class="row" style="justify-content:space-between;margin-top:6px">'+(Q.idx>0?'<button class="btn ghost" id="prevBtn">'+ic("back")+L("Vorige","Previous")+'</button>':'<span></span>')+'<button class="btn" id="actBtn" disabled>'+L("Controleer","Check")+'</button></div></div>';
    setHTML(html);
    var tl=document.querySelector("b[data-telop]");
    if(tl){ var doel=+tl.getAttribute("data-telop")||0;
      var stil=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if(stil||doel<=0){ tl.textContent=doel; }
      else { tl.textContent=0; var t0=null, duur=900;
        requestAnimationFrame(function stap(ts){ if(t0===null)t0=ts;
          var p=Math.min(1,(ts-t0)/duur), e=1-Math.pow(1-p,3);
          tl.textContent=Math.round(doel*e);
          if(p<1) requestAnimationFrame(stap); else tl.textContent=doel; }); } }
    var i2=document.querySelector(".bar>i"); requestAnimationFrame(function(){ if(i2) i2.style.width=i2.getAttribute("data-w")+"%"; });
    document.getElementById("backBtn").onclick=function(){ state.quiz=null; renderQuizGate(); };
    var optBtns=[].slice.call(document.querySelectorAll("#opts .opt"));
    var act=document.getElementById("actBtn");
    function refreshBtn(){ if(cur.done){ act.disabled=false; act.innerHTML=(Q.idx+1>=Q.items.length?L("Bekijk resultaat","See result"):L("Volgende","Next"))+" "+ic("arrowR"); } else { act.disabled=cur.picked.length!==q.pick; act.textContent=L("Controleer","Check"); } }
    optBtns.forEach(function(b){ b.onclick=function(){ if(cur.done)return; var i=+b.dataset.i; var p=cur.picked.indexOf(i); if(p>=0){ cur.picked.splice(p,1); b.classList.remove("sel"); } else { if(cur.picked.length>=q.pick) return; cur.picked.push(i); b.classList.add("sel"); } refreshBtn(); }; });
    function reveal(){
      cur.done=true; var allCorrect=true;
      optBtns.forEach(function(b){ var i=+b.dataset.i, o=cur.opts[i]; b.disabled=true; b.classList.remove("sel"); var picked=cur.picked.indexOf(i)>=0; if(o.ok){ b.classList.add("correct"); if(!picked) allCorrect=false; } else if(picked){ b.classList.add("wrong"); allCorrect=false; } });
      var fb=document.getElementById("fb"); fb.className="feedback "+(allCorrect?"ok":"no");
      fb.innerHTML=allCorrect?("<b>"+rnd(PRAISE)+" ✓</b>"):("<b>"+wrongLead()+"</b><span class=\"sub\">"+L("De juiste antwoorden staan in het groen.","The correct answers are shown in green.")+"</span>");
      if(!cur.scored){ cur.scored=true; if(allCorrect)Q.correct++; else Q.wrong.push(q); }
      var w=qF(q,"why"); if(w){ var wb=document.createElement("div"); wb.className="whybox"; wb.innerHTML="<h4>"+ic("sparkles")+L("Waarom?","Why?")+"</h4>"+esc(w); fb.appendChild(wb); }
      refreshBtn(); act.focus();
    }
    act.onclick=function(){ if(!cur.done){ if(cur.picked.length!==q.pick) return; reveal(); } else { Q.idx++; if(Q.idx>=Q.items.length)Q.done=true; renderQuiz(); } };
    var pb=document.getElementById("prevBtn"); if(pb)pb.onclick=function(){ if(Q.idx>0){ Q.idx--; renderQuiz(); } };
    if(cur.done) reveal();
  }

  function renderResult(){
    var Q=state.quiz, p=pct(Q.correct,Q.items.length);
    var msg=p>=80?L("Sterk werk! 🎉","Strong work! 🎉"):p>=60?L("Goed bezig 👍","Nice going 👍"):L("Blijf oefenen, je komt er 💪","Keep practising, you'll get there 💪");
    var html='<div class="card pad results center"><span class="pill">Sociologie</span><div class="big">'+p+'%</div>'+
      '<p style="font-weight:600;margin:0 0 4px;font-size:17px">'+msg+'</p><p class="muted">'+Q.correct+' '+L("van","of")+' '+Q.items.length+' '+L("juist","correct")+'</p>'+
      '<div class="row" style="justify-content:center;margin-top:14px">'+
        (Q.wrong.length?'<button class="btn" id="retry">'+L("Herhaal","Repeat")+' '+Q.wrong.length+' '+L("foute vragen","wrong questions")+'</button>':'')+
        '<button class="btn ghost" id="again">'+L("Nieuwe ronde","New round")+'</button><button class="btn ghost" id="home">'+L("Naar start","To start")+'</button></div></div>';
    setHTML(html);
    var rt=document.getElementById("retry"); if(rt) rt.onclick=function(){ startQuiz(shuffle(Q.wrong)); };
    document.getElementById("again").onclick=function(){ state.quiz=null; renderQuizGate(); };
    document.getElementById("home").onclick=function(){ state.quiz=null; go("home"); };
  }

  function renderTheory(){
    var q=state.sumq||"";
    var html='<div class="card pad" style="margin-bottom:14px"><h2 style="text-align:center;margin:0 0 8px">'+L("Samenvatting","Summary")+'</h2>'+
      '<input type="search" id="sq" placeholder="'+L("Zoek een begrip… (bv. contingentie, Durkheim, macht)","Search a concept… (e.g. contingency, Durkheim, power)")+'" value="'+esc(q)+'"></div><div id="list">'+theoryList(q)+'</div>';
    setHTML(html);
    var si=document.getElementById("sq"); si.oninput=function(){ state.sumq=si.value; document.getElementById("list").innerHTML=theoryList(si.value); si.focus(); };
  }
  function theoryList(query){
    var arr=(LANG==="en"&&D.theory_en)?D.theory_en:D.theory;
    var Q=query.trim().toLowerCase(), out="", n=0;
    arr.forEach(function(sec){
      var items=sec.items.filter(function(it){ return !Q || it.toLowerCase().indexOf(Q)>=0 || sec.h.toLowerCase().indexOf(Q)>=0; });
      if(!items.length) return; n++;
      out+='<details class="acc"'+(Q?" open":(n===1?" open":""))+'><summary><span class="n">'+ic("search")+'</span>'+esc(sec.h)+ic("chevR","caret")+'</summary><div class="body"><ul>'+items.map(function(it){return '<li>'+hl(esc(it),Q)+'</li>';}).join("")+'</ul></div></details>';
    });
    return out||'<p class="muted center">'+L("Geen resultaten voor","No results for")+' "'+esc(query)+'".</p>';
  }
  function hl(t,q){ if(!q)return t; try{ return t.replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>"); }catch(e){ return t; } }

  function renderHacks(){
    var html='<div class="card pad" style="margin-bottom:16px"><h2 style="text-align:center;margin:0 0 6px">'+L("Studie-hacks","Study hacks")+'</h2><p class="muted" style="text-align:center;margin:0">'+L("Slimme tips om sociologie sneller onder de knie te krijgen.","Smart tips to master sociology faster.")+'</p></div>'+
      '<div class="tipgrid">'+D.hacks.map(function(t){return '<div class="tip"><h4>'+ic("bulb")+esc(L(t.h,t.h_en))+'</h4><p>'+esc(L(t.t,t.t_en))+'</p></div>';}).join("")+'</div>';
    setHTML(html);
  }

  function renderFeedback(){
    var html='<div class="card pad"><h2 style="text-align:center;margin-top:0">'+L("Feedback & klachten","Feedback & issues")+'</h2>'+
      '<p class="muted" style="text-align:center">'+L("Fout in een vraag, een idee, of werkt iets niet? Laat het hier weten, het komt rechtstreeks bij de maker terecht. Een review of compliment mag ook: de mooiste tonen we op de hub. 💬","Mistake in a question, an idea, or something not working? Let us know here, it goes straight to the maker. A review or compliment is welcome too: we feature the best ones on the hub. 💬")+'</p>'+
      '<label class="fld" for="fbMsg">'+L("Je bericht","Your message")+'</label><textarea id="fbMsg" rows="3" placeholder="'+L("Beschrijf de fout of je idee…","Describe the mistake or your idea…")+'"></textarea>'+
      '<div class="fbextra"><div class="fbveld fbwaar"><label class="fld" for="fbWaar">'+L("Over welke vraag?","Which question?")+' <span class="muted">('+L("optioneel","optional")+')</span></label><input type="text" id="fbWaar" placeholder="'+L("bv. de vraag over roldistantie","e.g. the question on role distance")+'"></div>'+
      '<div class="fbveld"><label class="fld" for="fbNaam">'+L("Je naam","Your name")+' <span class="muted">('+L("optioneel","optional")+')</span></label><input type="text" id="fbNaam" placeholder="'+L("zodat we je kunnen bedanken","so we can thank you")+'"></div>'+
      '<div class="fbveld"><label class="fld" for="fbEmail">'+L("Je e-mail","Your email")+' <span class="muted">('+L("optioneel, als je een antwoord wilt","optional, if you want a reply")+')</span></label><input type="email" id="fbEmail" placeholder="naam@voorbeeld.be"></div></div>'+
      '<input type="text" id="fbBot" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0">'+
      '<div class="row" style="margin-top:16px;align-items:center"><button class="btn" id="fbSend">'+ic("send")+L("Versturen","Send")+'</button><span id="fbStatus" style="font-size:13px"></span></div></div>';
    setHTML(html);
    document.getElementById("fbSend").onclick=function(){
      var status=document.getElementById("fbStatus");
      if(document.getElementById("fbBot").value) return;
      var msg=document.getElementById("fbMsg").value.trim();
      if(!msg){ status.style.color="var(--bad)"; status.textContent=L("Schrijf eerst een bericht.","Please write a message first."); return; }
      var btn=document.getElementById("fbSend"); btn.disabled=true; status.style.color="var(--muted)"; status.textContent=L("Versturen…","Sending…");
      var em=document.getElementById("fbEmail").value.trim();
      var nm=document.getElementById("fbNaam").value.trim();
      var waar=document.getElementById("fbWaar").value.trim();
      var payload={_subject:"Sociologie-tool: feedback", _template:"table", _captcha:"false",
        Naam:nm||"-", Over_welke_vraag:waar||"-", email:em||"-", Bericht:msg};
      if(em) payload._replyto=em;
      function failFallback(reden){
        var body="Feedback Sociologie-tool%0D%0A%0D%0ANaam: "+encodeURIComponent(nm||"-")+"%0D%0AOver welke vraag: "+encodeURIComponent(waar||"-")+"%0D%0AE-mail: "+encodeURIComponent(em||"-")+"%0D%0A%0D%0ABericht:%0D%0A"+encodeURIComponent(msg);
        var mailto="mailto:berat007yildirim@gmail.com?subject="+encodeURIComponent("Sociologie-tool: feedback")+"&body="+body;
        setHTML('<div class="card pad"><h2 style="margin-top:0">'+L("Automatisch versturen lukte niet","Automatic sending failed")+'</h2><p class="muted">'+reden+' '+L("Geen zorgen, klik hieronder en je melding wordt geopend in je e-mail, klaar om te versturen:","No worries, click below and your message opens in your email, ready to send:")+'</p><a class="btn" href="'+mailto+'">'+ic("send")+L("Mail mijn melding direct","Email my message directly")+'</a><div style="margin-top:14px"><button class="btn ghost" id="bk">'+L("Terug naar start","Back to start")+'</button></div></div>');
        document.getElementById("bk").onclick=function(){go("home");};
      }
      fetch("https://formsubmit.co/ajax/Berat007yildirim@gmail.com",{method:"POST",headers:{Accept:"application/json"},body:new URLSearchParams(payload)})
        .then(function(r){return r.json();}).then(function(d){
          if(d&&(d.success===true||d.success==="true")){ setHTML('<div class="card pad results center"><div style="font-size:42px">✅</div><h2 style="margin:6px 0">'+L("Bedankt!","Thanks!")+'</h2><p class="muted">'+L("Je melding is verstuurd.","Your message has been sent.")+'</p><button class="btn" id="bk" style="margin-top:8px">'+L("Terug naar start","Back to start")+'</button></div>'); document.getElementById("bk").onclick=function(){go("home");}; }
          else { failFallback(L("Het automatisch versturen lukte niet.","Automatic sending failed.")); }
        }).catch(function(){ failFallback(L("Er was even geen verbinding.","There was no connection just now.")); });
    };
  }

  // bezoeker tellen (1x per toestel)
  try{ if(!localStorage.getItem("socio_seen")){ localStorage.setItem("socio_seen","1"); bump("berat-socio","gebruikers"); } }catch(e){ bump("berat-socio","gebruikers"); }
  // traject vanuit de hub overnemen → direct naar de oefenpagina
  try{ var _q=new URLSearchParams(location.search); var _m=_q.get("m");
    if(_m==="training"||_m==="herkansing"){ state.track=_m; lset("socio_track",_m);
      var _c=_q.get("calm"); if(_c!=null){ calm=(_c!=="0"); lset("socio_calm",calm); applyCalm(); }
      state.step="practice"; state.fromHub=true; }
  }catch(e){}
  render();
  (function(){ var _sp=document.getElementById("splash"); if(!_sp) return; var _red=false; try{_red=window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){} setTimeout(function(){ _sp.classList.add("hide"); setTimeout(function(){ if(_sp&&_sp.parentNode) _sp.parentNode.removeChild(_sp); }, 700); }, _red?300:1850); })();
})();

</script>
<script>
/* gedeelde interactie: klik-animatie en zacht openschuivende theorieblokken */
(function(){
  // Elk theorieblok krijgt precies een wikkel-element, anders klapt een blok met
  // meerdere kinderen niet volledig dicht (MBG had er tien).
  function wikkel(){
    var lijst=document.querySelectorAll(".acc>.body");
    for(var i=0;i<lijst.length;i++){
      var b=lijst[i];
      if(b.children.length===1 && b.firstElementChild && b.firstElementChild.className==="bes-wrap") continue;
      var w=document.createElement("div"); w.className="bes-wrap";
      while(b.firstChild) w.appendChild(b.firstChild);
      b.appendChild(w);
    }
  }
  var gepland=false;
  function planWikkel(){ if(gepland)return; gepland=true; setTimeout(function(){ gepland=false; wikkel(); },0); }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",wikkel); else wikkel();
  try{ new MutationObserver(planWikkel).observe(document.documentElement,{childList:true,subtree:true}); }catch(e){}
  var KLIK="button,.btn,.iconbtn,.opt,.track,.chrow,.backlink,.chip,.mode,.toggle,.scard,.ccard,.qcard,.srclink,.bnlink,.navlink,.ycard,.excat,.brandstrip,summary";
  document.addEventListener("pointerdown",function(e){
    var el=(e.target&&e.target.closest)?e.target.closest(KLIK):null; if(!el)return;
    el.classList.remove("bes-klik"); void el.offsetWidth; el.classList.add("bes-klik");
    setTimeout(function(){ el.classList.remove("bes-klik"); },260);
  },true);
  document.addEventListener("click",function(e){
    var s=(e.target&&e.target.closest)?e.target.closest("details.acc>summary"):null; if(!s)return;
    var d=s.parentNode; if(!d) return;
    e.preventDefault();
    if(d.open){
      d.classList.add("bes-dicht");
      setTimeout(function(){ d.open=false; d.classList.remove("bes-dicht"); },250);
    } else {
      d.open=true; d.classList.add("bes-open");
      var los=function(){ d.classList.remove("bes-open"); };
      requestAnimationFrame(function(){ requestAnimationFrame(los); });
      setTimeout(los,400);
    }
  },false);
})();
</script>
