r de geschiedenis of naar de samenhang met het grotere geheel. Modernisering is een historisch proces en praktische kennis is een soort kennis, geen legitimerende derde."},{"c":17,"sel":"foute","pick":2,"q":"Weber bekijkt sociale ongelijkheid via klasse, stand en partij. Welke twee uitspraken daarover zijn fout?","o":[["Klassen worden bepaald door bezit van productiemiddelen, opleidingsniveau en positie in de gezagshiërarchie.",0],["Partijen ontstaan vooral omdat hun leden economische macht willen verwerven.",1],["Klassen worden bepaald door de opdeling arbeidersklasse en onderwijsniveau.",1],["Weber onderscheidt klasse, stand en partij als drie aparte dimensies van ongelijkheid.",0],["Mensen binnen dezelfde klasse beschikken over ongeveer evenveel economische macht.",0]],"why":"Bij Weber draaien partijen om politieke macht en invloed, dus om greep krijgen op besluitvorming, en niet om economische macht. Klasse hangt bij hem samen met je economische positie en marktkansen, niet met een simpele opdeling in arbeidersklasse plus onderwijsniveau."},{"c":17,"sel":"foute","pick":1,"q":"Welke uitspraak over primaire relaties en primaire groepen klopt niet?","o":[["Wordt de affectieve band negatief, dan is er per definitie geen primaire relatie meer.",1],["Nauwe familiebanden vormen het klassieke voorbeeld van een primaire groep.",0],["Primaire relaties vervullen belangrijke functies, zoals een luisterend oor bij problemen.",0],["In primaire relaties kiezen we voor de persoon zelf, niet voor wat die persoon oplevert.",0]],"why":"Een primaire relatie is affectief geladen, maar die lading mag ook negatief zijn: ruzie met je ouders of een broer maakt de relatie niet plots secundair. Kenmerkend is dat de band persoonlijk, veelzijdig en duurzaam is, niet dat de gevoelens altijd positief blijven."},{"c":17,"sel":"foute","pick":2,"q":"Een jaarlijks onderzoek brengt sociale thema's in Europese landen in kaart. Welke twee uitspraken passen niet bij de empirisch-analytische taak van de socioloog?","o":[["hypotheses opstellen en die aan observaties toetsen",0],["het beleid van de Europese Unie verdedigen",1],["verschillen en gelijkenissen tussen Europese samenlevingen afleiden",0],["juiste feiten over de samenleving verwerven",0],["meer begrip kweken voor de waarden van de samenleving",1]],"why":"In de empirisch-analytische taak neem je een zo objectief mogelijke positie in: je toetst hypotheses en stelt feiten vast. Beleid verdedigen is een normatieve stellingname, en begrip kweken voor waarden hoort bij de interpretatieve taak, dus allebei vallen ze buiten het empirisch-analytische werk."},{"c":17,"sel":"foute","pick":1,"q":"Welke uitspraak over de conflictsociologie klopt niet?","o":[["De conflictsociologie telt maar twee theorieën: communisme en sociaal darwinisme.",1],["Samenleven is een voortdurende strijd tussen groepen met botsende belangen.",0],["Instellingen zoals het onderwijs zijn mee het resultaat van conflict tussen groepen.",0],["Rollen en posities worden verdeeld via conflict en de bestaande machtsverhoudingen.",0],["Mensen streven volgens deze visie naar macht en materieel gewin.",0]],"why":"De conflictsociologie is een brede familie van benaderingen rond macht, belangen en strijd, en valt niet samen met twee theorieën. Het marxisme en het sociaal darwinisme zijn er twee bekende varianten van, maar communisme is een politiek systeem en geen sociologische theorie."},{"c":17,"sel":"juiste","pick":1,"q":"Wat is de kern van Durkheims kritiek op de rationele-keuzetheorie?","o":[["dat ze vooraf al een scheiding maakt tussen individu en maatschappij",0],["dat ze de maatschappij voorstelt als de optelsom van de individuen",1],["dat ze individueel handelen volledig uit rollen afleidt",0],["dat ze de mens als emotioneel en impulsief wezen voorstelt",0]],"why":"Voor Durkheim is de samenleving een realiteit sui generis: ze is meer dan de som van haar leden en oefent via sociale feiten dwang uit op het individu. De rationele-keuzetheorie rekent de maatschappij net op uit losse individuele keuzes, en dat is precies wat hij afwijst."},{"c":17,"sel":"foute","pick":1,"q":"Welke uitspraak over Webers geest van het kapitalisme klopt niet?","o":[["Weber ziet het protestantisme als een van de belangrijkste oorzaken ervan.",0],["Er wordt benadrukt dat alle mensen in hun handelen naar nut streven.",0],["Dat nut neemt in de eerste plaats de vorm van geld en winst aan.",0],["Het streven naar geldelijk gewin geldt als noodzakelijk en waardevol.",0],["Het protestantisme is de noodzakelijke en voldoende oorzaak ervan.",1],["Weber illustreert die geest met bekende teksten van Benjamin Franklin.",0]],"why":"Weber ziet de protestantse ethiek als een belangrijke oorzaak, maar niet als een oorzaak die op zichzelf volstaat; er moesten ook economische en institutionele voorwaarden aanwezig zijn. Noodzakelijk en voldoende zou betekenen dat protestantisme altijd en overal automatisch kapitalisme oplevert, en dat beweert hij nergens."},{"c":17,"sel":"juiste","pick":2,"q":"Welke twee processen horen bij de grote transformaties van de modernisering?","o":[["de vorming van de moderne staat",1],["de dekolonisatie van de wereld",0],["het inperken van wetenschap en technologie",0],["de verlichting en de rationalisering",1]],"why":"Modernisering wordt beschreven aan de hand van transformaties zoals moderne staatsvorming, industrialisering en de verlichting met haar rationalisering. Wetenschap en techniek breidden daarbij net uit in plaats van ingeperkt te worden, en dekolonisatie is een veel latere politieke ontwikkeling."},{"c":17,"sel":"juiste","pick":1,"q":"Een beleid bestraft elke vorm van crimineel gedrag, ook de allerkleinste overtreding, om te vermijden dat het later opnieuw of erger gebeurt. Bij welke theorie hoort die aanpak?","o":[["Broken window theorie",1],["Rationele controletheorie",0],["Rationele keuzetheorie",0],["Sociale desorganisatietheorie",0],["Controletheorie",0]],"why":"De broken window theorie zegt dat je kleine overtredingen meteen moet aanpakken, want zichtbare verloedering nodigt uit tot zwaardere criminaliteit. De andere theorieën vertrekken van kosten en baten of van de structuur van de buurt, niet van dat streng aanpakken van elk klein feit."},{"c":17,"sel":"foute","pick":1,"q":"Sociale verschijnselen zijn contingent en in zekere zin arbitrair: ze hadden ook anders kunnen lopen. Welke uitspraak past niet bij dat idee?","o":[["Elke samenleving gaat vroeg of laat over naar dezelfde vrije markteconomie.",1],["Mensen kiezen vaak een partner uit hun eigen milieu, wat sociologen homogamie noemen.",0],["Of er op zondag gewerkt wordt, verschilt van land tot land en verandert door de tijd.",0],["Hoe mensen met de dood omgaan, ziet er hier heel anders uit dan in veel andere culturen.",0],["Wat als een gepaste emotie geldt, wordt sterk gestuurd door de omgeving waarin je opgroeit.",0]],"why":"Contingentie betekent dat het ook anders had kunnen zijn, dat niets sociaal noodzakelijk is. De uitspraak dat alle landen bij dezelfde vrije markteconomie uitkomen is net een noodzakelijkheidsdenken en veegt alle culturele en historische variatie weg."},{"c":17,"sel":"juiste","pick":1,"q":"Jan wil een moestuin om gezonder te eten en geld te besparen. Hij koopt zaden en gerief, maar door de klimaatverandering zit er te weinig voeding meer in de grond. Gelukkig weet hij hoe hij die grond weer vruchtbaar krijgt. Welke component van het handelen bij Parsons komt in dit verhaal niet voor?","o":[["Morele normen",1],["Waarden",0],["Cognitieve normen",0],["De situatie",0]],"why":"Gezonder eten en geld besparen zijn waarden, weten hoe je de grond vruchtbaar maakt is een cognitieve norm, en de uitgeputte grond hoort bij de situatie. Over wat moreel wel of niet mag zegt het verhaal niets, dus die component ontbreekt."},{"c":17,"sel":"juiste","pick":1,"q":"Norbert Elias beschrijft omgangsregels die we ons zo eigen hebben gemaakt dat ze een tweede natuur zijn: overtreed je ze, dan volgt een lichamelijke reactie zoals walging. Hoe noemt hij dat?","o":[["Zelfdwang",1],["Praktische regels",0],["Culturele norm",0],["Praktische taak",0],["Stagnatie",0]],"why":"Bij Elias verschuift de dwang van buitenaf naar dwang van binnenuit, en dat is zelfdwang: er hoeft niemand meer te straffen, je lichaam reageert zelf met schaamte of afkeer. Praktische regels en taken zijn aangeleerde handigheden, geen ingebouwde rem."},{"c":17,"sel":"juiste","pick":1,"q":"Welk voorbeeld is een echte zelfbevestigende voorspelling?","o":[["Er gaan geruchten dat koffie schaars wordt, iedereen slaat in, en zo stijgt de prijs echt.",1],["Een leerkracht raadt een leerling aan goed te studeren voor het examen, en die slaagt ook.",0],["Een commentator ziet een ploeg verliezen omdat ze ongemotiveerd oogt, en ze verliest ook.",0],["Een peiling voorspelt verlies voor een partij, waarop haar kiezers massaal opdagen en ze wint.",0],["Een krant meldt dat een bank er slecht voor staat, en de jaarcijfers bevestigen dat later.",0]],"why":"Bij een zelfbevestigende voorspelling maakt de voorspelling zichzelf waar via het gedrag dat ze uitlokt: door het hamsteren wordt koffie echt duurder. De commentator en de krant voorspellen enkel correct zonder de uitkomst te veroorzaken, de leerkracht geeft advies, en de peiling levert net het omgekeerde op, een zelfvernietigende voorspelling."},{"c":17,"sel":"foute","pick":1,"q":"Reductionisme en emergentisme kijken elk anders naar ziekte en de ziekterol. Welke uitspraak is fout?","o":[["Bij reductionisme is ziekte puur fysiek, bij emergentisme puur sociaal en cultureel.",1],["Bij reductionisme bepaalt de geneeskunde wat ziekte is, bij emergentisme spelen normen mee.",0],["Bij reductionisme is het sociale een vertaling van het biologische, bij emergentisme staat het losser.",0],["Bij reductionisme blijft ziekte een lichamelijk defect, bij emergentisme hoort er een ziekterol bij.",0]],"why":"Emergentisme ontkent het lichamelijke niet, het zegt dat er bovenop het biologische iets sociaals ontstaat dat je niet tot dat biologische kan herleiden. Daarom is uitsluitend sociaal en cultureel veel te sterk, terwijl de andere uitspraken het verschil wel juist beschrijven."},{"c":17,"sel":"juiste","pick":1,"q":"Wat klopt er over ongelijkheid in de huidige samenleving?","o":[["Door de expansie van het onderwijs is armoede minder goed voorspelbaar geworden.",1],["Sociale status wordt vandaag meer toegeschreven dan verworven, net zoals vroeger.",0],["Het beroep van de vader heeft geen enkele invloed meer op de positie van het kind.",0],["Laaggeschoolden worden vandaag even hoog gewaardeerd als wie lang gestudeerd heeft.",0]],"why":"Nu bijna iedereen langer naar school gaat, valt armoede minder goed af te lezen aan je afkomst alleen, het risico is individueler en grilliger geworden. Afkomst is daarmee niet weg: het beroep van de ouders werkt nog altijd door, en laaggeschoolden krijgen net minder waardering."},{"c":17,"sel":"juiste","pick":1,"q":"Wat is juist over de etnomethodologie?","o":[["Met humor en tact herstellen mensen na een schending het vertrouwen in de gewone gang van zaken.",1],["Etnomethodologie bestudeert vooral grote structuren zoals de staat, de markt en de sociale klassen.",0],["Etnomethodologie meet met grote enquêtes hoe robuust de normen in een samenleving nog zijn.",0]],"why":"Etnomethodologie kijkt naar de methodes waarmee mensen samen de alledaagse werkelijkheid overeind houden. In doorbrekingsexperimenten zie je hoe een schending wordt opgevangen met humor, tact of een uitleg, zodat de vanzelfsprekende orde blijft kloppen."},{"c":17,"sel":"juiste","pick":1,"q":"Waarom bestaat de scheiding der machten?","o":[["Om te vermijden dat verschillende soorten macht in dezelfde handen samenkomen.",1],["Om elk bestuursorgaan tot een enkele, strikt afgebakende functie te beperken.",0],["Omdat de politiek nu eenmaal ontstaan is om macht gelijk over iedereen te verdelen.",0],["Om elke machtsdrager volledige autonomie te geven, zonder verantwoording aan anderen.",0],["Omdat een groeiende bureaucratie vanzelf tot gescheiden machten leidt.",0]],"why":"De bedoeling is machtsconversie tegengaan: wie politieke, economische en culturele macht in dezelfde handen krijgt, wordt onaantastbaar. Functies afbakenen is daarbij een middel en geen doel op zich, en volledige autonomie zonder tegengewicht is net het omgekeerde van wat de scheiding wil."},{"c":17,"sel":"foute","pick":1,"q":"Welke uitspraak over de houding van een socioloog is fout?","o":[["Een sociologische uitspraak moet opgaan voor elke deelnemer afzonderlijk.",1],["Een socioloog bekijkt gedrag altijd in samenhang met de samenleving errond.",0],["Een socioloog oordeelt niet en blijft respectvol tegenover wie hij bestudeert.",0],["Een socioloog werkt met een nieuwsgierigheid die geen enkel onderwerp uitsluit.",0],["Afstandelijke betrokkenheid betekent je expertise gebruiken om mee in debat te gaan.",0]],"why":"Sociologie zoekt patronen en regelmatigheden op het niveau van groepen, geen wet die bij elk individu apart moet kloppen. Uitzonderingen maken zo een vaststelling dus niet ongeldig."},{"c":17,"sel":"juiste","pick":1,"q":"Wat is juist over macht en sociale gelaagdheid?","o":[["Iemands sociale status steunt op meerdere soorten macht tegelijk.",1],["Volgens Max Weber komt macht enkel uit de verdeling van de productiemiddelen.",0],["Een beroepsclassificatie is uitsluitend gebaseerd op culturele macht.",0],["Uitsluiting van groepen heeft uitsluitend met economische macht te maken.",0],["De macht van de hoge klasse meet je door te kijken wat de lage klasse ermee zou doen.",0]],"why":"Status is een optelsom van economische, culturele en sociale macht, en die vallen niet samen: je kan cultureel hoog staan en economisch laag. Macht enkel aan de productiemiddelen koppelen is de lezing van Marx, terwijl Weber naast bezit ook status en partij als machtsbronnen zag."},{"c":17,"sel":"juiste","pick":1,"q":"Vanuit welke invloedrijke conflicttheorie worden mensen beschouwd als berekende egoïsten die zich bij het nastreven van hun belangen niet laten remmen door waarden en normen?","o":[["Neoliberalisme",0],["Absolute macht",0],["One-Dimensional Man",0],["Rijnlands kapitalisme",0],["Protectionisme",0],["Sociaaldarwinisme",1],["Puritanisme",0],["Patronage",0],["Postfordisme",0],["Statuscompensatie",0]],"why":"Het sociaaldarwinisme trekt de strijd om het bestaan door naar de samenleving: de sterkste haalt het en waarden of normen houden niemand tegen. Daarom is het een conflicttheorie met een puur berekenend mensbeeld."},{"c":17,"sel":"juiste","pick":1,"q":"Regels zijn door mensen gemaakt en dus contingent, maar volgens Rousseau mogen ze niet willekeurig overkomen. Op welke instelling doet hij een beroep om die niet-arbitraire contingentie op te lossen?","o":[["Wetenschap",0],["Religie",1],["Natuur",0],["Geschiedenis",0],["Ideologie",0]],"why":"Rousseau laat zijn wetgever een beroep doen op iets buiten de mens, en dat is bij hem de religie. De regels blijven mensenwerk, maar zolang ze van hogerhand lijken te komen, voelen ze niet willekeurig aan. Religie speelt hier dus de rol van legitimerende derde."},{"c":17,"sel":"juiste","pick":1,"q":"Je doet boodschappen voor je buren. Ze betalen je het bedrag terug en stoppen je daar bovenop nog wat extra geld toe. Om welke vorm van sanctionering gaat het?","o":[["Externe sanctie",0],["Interne sanctie",0],["Belonende sanctie",1],["Beïnvloeding",0],["Gevoelsmatige sanctie",0]],"why":"Het extra geld is een positieve prikkel voor gedrag dat gewaardeerd wordt, dus een belonende sanctie. Dat de buren ze geven, maakt de sanctie ook extern, maar dat zegt alleen waar ze vandaan komt en niet welk soort sanctie het is."},{"c":17,"sel":"juiste","pick":1,"q":"Wat is een sociale rol?","o":[["Een mechanisme dat het gedrag van mensen in de samenleving voorspelbaar maakt",0],["Een bundel verwachtingen die hoort bij een positie in een terugkerende situatie",1],["Het idee dat het leven een toneelstuk is waarin ieder zijn stuk speelt",0],["De praktische kennis die je nodig hebt om in een groep mee te draaien",0],["Het aanleren van de betekenis die anderen aan symbolen en tekens geven",0]],"why":"Een sociale rol is het pakket verwachtingen dat vasthangt aan een positie, denk aan student, arts of ouder. Dat rollen het gedrag voorspelbaar maken, is een gevolg van rollen en geen definitie ervan."},{"c":17,"sel":"foute","pick":2,"q":"Welke twee uitspraken over het primaire interactiekader zijn fout?","o":[["Primaire relaties lopen via direct contact van aangezicht tot aangezicht",0],["Primaire relaties draaien om specifieke doelen die de partners willen bereiken",1],["Bij nauwe banden zoals in een gezin spreken we van een primaire groep",0],["Primaire relaties zijn affectief en dragen daardoor enkel positieve gevoelens",1],["Primaire relaties zijn particularistisch: ze bestaan omwille van de persoon zelf",0]],"why":"Primaire relaties zijn net diffuus: ze hebben geen afgebakend doel, want dat hoort bij secundaire relaties. Affectief betekent bovendien geladen met gevoel, dus ook ruzie, jaloezie en haat passen binnen een primaire relatie."},{"c":17,"sel":"juiste","pick":1,"q":"Wat verstaat Foucault onder individualisering?","o":[["Het individu wordt losgemaakt van de natuur, denk aan het beeld van man en vrouw",0],["Het individu denkt rationeel en volgt zijn eigenbelang, zoals op de vrije markt",0],["Het individu gaat aan zichzelf werken en wil zichzelf verbeteren en ontplooien",1],["Het individu probeert het beeld dat anderen van hem hebben op te poetsen",0],["Sociale relaties worden losser, de grote familie krimpt tot een kerngezin",0]],"why":"Bij Foucault draait individualisering om zelfwerk: je wordt voortdurend aangespoord om aan jezelf te sleutelen, jezelf te disciplineren en jezelf te ontplooien. Het gaat dus niet over rationeel eigenbelang of over kleiner wordende gezinnen."},{"c":17,"sel":"juiste","pick":1,"q":"Wat is kenmerkend voor de meritocratie zoals Michael Young ze beschrijft?","o":[["Mensen uit de lagere klassen hebben vooral pech en ongeluk gehad",0],["Elke sociale klasse telt evenveel mensen met intelligentie en talent",0],["Je positie hangt enkel af van bekwaamheid, inzet en geleverde prestatie",1],["Het onderwijs biedt iedereen precies dezelfde kansen op elk niveau",0],["Het valt op voorhand te voorspellen wie in welke klasse zal belanden",0]],"why":"Bij Young komt merit neer op intelligentie plus inzet: wie stijgt, doet dat op basis van prestatie. Net daardoor wordt talent naar boven gesorteerd, waardoor de klassen juist geen gelijke portie talent meer bevatten."},{"c":17,"sel":"foute","pick":2,"q":"Welke twee uitspraken over het mattheüseffect zijn fout?","o":[["Wie niets heeft zal krijgen, en wie bezit heeft zal het afgenomen worden",1],["Het gaat om een onbedoeld en zelfs pervers effect van maatregelen",0],["Bekende wetenschappers krijgen meer erkenning dan onbekende collega's",0],["Welgestelden gaan nu eenmaal zorgvuldiger met hun geld om dan anderen",1],["Het sluit aan bij het mechanisme van de zelfbevestigende voorspelling",0]],"why":"Het mattheüseffect zegt precies het omgekeerde: wie al heeft, krijgt erbij, en wie weinig heeft, verliest ook dat nog. Het gaat bovendien om een onbedoeld effect van collectieve voorzieningen die vooral bij de betere klassen belanden, niet om een karaktertrek van rijke mensen."},{"c":17,"sel":"foute","pick":2,"q":"Geld is een voorbeeld van versymbolisering. Welke twee uitspraken daarover zijn fout?","o":[["Door de versymbolisering met geld neemt de commodificatie af",1],["Geld heeft zelf geen gebruikswaarde en wordt geruild voor echte goederen",0],["Of mensen vertrouwen hebben in geld, doet er voor de samenleving weinig toe",1],["Geld is een symbool dat pas beloont door wat je ermee kan kopen",0]],"why":"Geld zorgt er net voor dat steeds meer zaken te koop komen te staan, dus de commodificatie neemt toe. En geld werkt alleen zolang iedereen erop vertrouwt dat het aanvaard wordt, dat vertrouwen is de kern van het symbool."},{"c":17,"sel":"foute","pick":2,"q":"Welke twee uitspraken over etikettering zijn fout?","o":[["De geëtiketteerde neemt na verloop van tijd het negatieve beeld van anderen over",0],["De geëtiketteerde past zijn gedrag aan om het etiket te weerleggen",1],["Bij een slechte reputatie wordt gedrag sneller als storend gelezen",0],["Volgens Willis komt afwijkend gedrag voort uit een sterke sociale positie",1],["Etikettering sluit nauw aan bij het symbolisch interactionisme",0]],"why":"Etikettering werkt net de andere kant op: het etiket gaat leven en de persoon groeit ernaartoe in plaats van het te ontkrachten. En de jongeren die Willis bestudeerde, zaten juist in een zwakke sociale positie en presteerden zwak op school."},{"c":17,"sel":"foute","pick":2,"q":"Welke twee uitspraken over de opvattingen rond deviant gedrag zijn fout?","o":[["Functionalisten willen vooral de levensomstandigheden en de ongelijkheid aanpakken",1],["De rationelekeuzetheorie wil vooral de armoede bestrijden om de misdaad te doen dalen",1],["Rationele keuze: verhoog de pakkans en verzwaar de straf, dan loont misdaad minder",0],["Wat in de ene cultuur crimineel heet, geldt in een andere cultuur niet als misdaad",0],["Anomie: er gaapt een kloof tussen de culturele doelen en de toegelaten middelen",0],["De theorie van de gebroken ruiten wil afwijkend gedrag meteen in de kiem smoren",0]],"why":"Functionalisten zoeken de oorzaak in sociale desorganisatie en willen die herstellen, terwijl het aanpakken van ongelijkheid eerder bij de anomietheorie hoort. De rationelekeuzetheorie mikt niet op armoede maar op een hogere pakkans en zwaardere straffen, net zoals de sociaal-culturele controletheorieën."},{"c":17,"sel":"juiste","pick":2,"q":"Verzuiling ontstaat uit een waardeconflict. Welke twee omschrijvingen van verzuiling zijn juist?","o":[["Groepen leven gesegmenteerd naast elkaar en vormen samen een pluralistisch geheel",1],["Verzuiling zorgt voor samenhang, want zonder zuilen zou er chaos heersen",0],["Mensen leven naast elkaar, wat onvermijdelijk tot conflict in de samenleving leidt",0],["Een levensbeschouwelijke groep bouwt eigen scholen, vakbonden en verenigingen uit",1],["Verzuiling komt uitsluitend op het Europese vasteland voor",0]],"why":"Een zuil is een levensbeschouwelijke groep met een eigen netwerk van scholen, vakbonden, ziekenfondsen en verenigingen. Die zuilen leven gescheiden naast elkaar, maar samen vormen ze wel een pluralistische samenleving."},{"c":17,"sel":"juiste","pick":2,"q":"Moore beschrijft verschillende wegen naar de moderniteit. Welke twee uitspraken zijn juist?","o":[["Een economisch en politiek sterke burgerij bevordert een parlementaire democratie",1],["Een centrale staat met een zwakke burgerij en zwakke landadel leidt tot een communistisch regime",1],["Traditionele elites die zelf het initiatief tot modernisering nemen, leiden tot een parlementaire democratie",0],["Grootgrondbezitters met veel macht en een matige burgerij leiden tot een links regime",0],["Een fascistisch regime komt er wanneer de modernisering onvoldragen en van bovenaf blijft",0]],"why":"Moore vat het samen als: geen burgerij, geen democratie. Een sterk gecentraliseerde staat met een zwakke burgerij en zwakke grootgrondbezitters laat ruimte voor een boerenrevolutie en dus voor een communistisch regime. Nemen de traditionele elites zelf het initiatief, dan krijg je een revolutie van bovenaf en beland je bij het fascisme. Een matig ontwikkelde burgerij naast politiek sterke grootgrondbezitters leidt dus tot een rechts en niet tot een links regime."},{"c":17,"sel":"juiste","pick":2,"q":"Wat schreef Bourdieu in La distinction over smaak? Duid de twee juiste uitspraken aan.","o":[["Hij bekritiseert het idee dat enkel je financiële middelen je smaak bepalen",1],["De hoogste klasse heet bij hem de petite bourgeoisie met haar goût de luxe",0],["Het milieu waarin je opgroeit stuurt je levensstijl en je smaakvoorkeuren",1],["Mensen kiezen hun smaak in alle vrijheid, los van hun sociale afkomst",0],["Bij gebrek aan middelen zijn de lagere klassen net innovatief en creatief",0]],"why":"Bourdieu laat zien dat smaak niet alleen van geld afhangt maar vooral van cultureel kapitaal en van het milieu waarin je grootgebracht bent, dus van je habitus. De lagere klassen hebben bij hem een goût de nécessité, een smaak van de noodzaak, en de top van de ladder is de grande bourgeoisie."},{"c":17,"sel":"juiste","pick":2,"q":"Wat is de kritiek van Dilthey op de verstehende methode van Weber? Duid de twee juiste uitspraken aan.","o":[["Weber leunt veel te sterk op de methode van de natuurwetenschappen",0],["Weber gaat ervan uit dat iedereen op dezelfde manier reageert",1],["Volgens Dilthey moet je juist de culturele verschillen bestuderen",1],["Weber moet bij het interpreteren ook de motieven van mensen meenemen",0],["Volgens Weber ligt het handelen van mensen niet op voorhand vast",0]],"why":"Dilthey verwijt Weber dat zijn verstehen vertrekt van een algemene mens die overal op dezelfde manier reageert. Wie wil begrijpen wat gedrag betekent, moet volgens Dilthey net kijken naar de culturele verschillen tussen groepen en tijdperken."},{"c":17,"sel":"juiste","pick":1,"q":"Sommige sociale regels en betekenissen kennen en gebruiken we zonder erbij na te denken, en we zouden ze maar moeilijk onder woorden kunnen brengen. Denk aan de regel dat je onbekenden in de lift niet te lang aanstaart. Hoe noemen sociologen dit soort kennis?","o":[["Rolverwachtingen",0],["Discursieve kennis",0],["Interactiekennis",0],["Internalisatie",0],["Elementaire kennis",0],["Socialisatie",0],["Symbolische kennis",0],["Etnomethodologische kennis",0],["Praktische kennis",1],["Normatieve kennis",0]],"why":"Praktische kennis is kennis die je vlot toepast maar niet kunt uitleggen. Discursieve kennis is net het omgekeerde: die kun je wel onder woorden brengen. Niet staren in de lift is een schoolvoorbeeld van praktische kennis."},{"c":17,"sel":"foute","pick":1,"q":"Welk van onderstaande mechanismen hoort niet thuis bij de gordels van sociale controle?","o":[["Routine",0],["Integratie in een veld van gesanctioneerde verwachtingen",0],["Socialisatie",0],["Informele sancties",0],["Uitlaatkleppen zoals carnaval",0],["Zelfontplooiing",1],["Buffers zoals humor",0],["Formele sancties",0],["Internalisering",0],["Geen van bovenstaande",0]],"why":"De gordels van sociale controle zijn de lagen waarmee een samenleving gedrag in het gareel houdt: routine, socialisatie en internalisering, verwachtingen, formele en informele sancties, buffers en uitlaatkleppen. Zelfontplooiing is een persoonlijk streven en geen controlemechanisme."},{"c":17,"sel":"foute","pick":2,"q":"Welke twee tegenstellingen horen niet bij de klassieke breuklijnen in België?","o":[["links tegenover rechts in de economie",0],["Franstalig tegenover Nederlandstalig",0],["conservatief tegenover progressief",1],["hooggeschoold tegenover laaggeschoold",1],["de kerk tegenover de wereldlijke staat",0]],"why":"De drie klassieke breuklijnen zijn de levensbeschouwelijke (kerk tegenover staat), de taaletnische (Nederlands tegenover Frans) en de sociaaleconomische (links tegenover rechts). Conservatief tegenover progressief en het opleidingsniveau vormen geen klassieke breuklijn."},{"c":17,"sel":"juiste","pick":2,"q":"In welke zin is het uniform van de politieagent een versymbolisering van de reguliere macht? Duid de twee juiste antwoorden aan.","o":[["Omdat het uniform in onze maatschappij vooral een teken van status en hiërarchie is",0],["Omdat het uniform de macht om te beboeten en te bestraffen zichtbaar maakt",1],["Omdat het uniform toont dat de agent kan optreden zonder tussenkomst van een rechter",0],["Omdat je door zelf een uniform te dragen iemand symbolisch kunt bestraffen",0],["Omdat iedereen het uniform herkent als een teken van de reguliere macht",1]],"why":"Versymbolisering wil zeggen dat de macht niet in de persoon zit maar in een teken dat algemeen herkend wordt. Het uniform staat voor de bevoegdheid om te sanctioneren en wordt door iedereen gelezen als teken van reguliere, dus erkende macht."},{"c":17,"sel":"juiste","pick":2,"q":"Welke twee tendensen signaleert Talcott Parsons als het gaat over de sanctioneringswijzen in moderne samenlevingen?","o":[["Schaalvergroting",1],["Informalisering",0],["Versymbolisering",1],["Regularisering",0],["Activering",0]],"why":"Volgens Parsons worden sancties op een steeds grotere schaal georganiseerd en verlopen ze steeds meer via symbolen in plaats van via direct lijfelijk ingrijpen. Dat zijn de tendensen schaalvergroting en versymbolisering."},{"c":17,"sel":"foute","pick":2,"q":"Max Weber onderscheidt drie principes van stratificatie. Welke twee begrippen hieronder horen daar niet bij?","o":[["Klasse",0],["Partij",0],["Stand",0],["Beweging",1],["Kaste",1]],"why":"Bij Weber is stratificatie meerlagig: klasse (economische positie), stand (sociaal aanzien en levensstijl) en partij (politieke macht). Beweging en kaste horen niet bij die drie."},{"c":17,"sel":"juiste","pick":2,"q":"Wat kenmerkt een pervers effect? Duid de twee juiste antwoorden aan.","o":[["verdorven",0],["verkeerd",0],["onbedoeld",1],["ongewenst",1],["tegennatuurlijk",0]],"why":"Een pervers effect is een uitkomst die niemand zo bedoeld heeft en die bovendien negatief uitpakt. Het woord pervers slaat hier dus niet op moraal of natuur, maar op het onbedoelde en ongewenste karakter van het gevolg."},{"c":17,"sel":"juiste","pick":2,"q":"Welke twee ontwikkelingen koppelen sociologen aan de demografische transitie die samenging met de modernisering in het Westen?","o":[["Een vergroening van de bevolking door veel meer geboorten",0],["Een betere hygiëne, voeding en medische zorg",1],["Een sterke toename van het aantal echtscheidingen",0],["Een gestegen vruchtbaarheidscijfer bij jonge vrouwen",0],["Een sterke daling van de kindersterfte",1]],"why":"De demografische transitie begint met een dalende sterfte door betere leefomstandigheden en zorg, waarna ook de vruchtbaarheid daalt. Het Westen kreeg dus vergrijzing en minder kindersterfte, geen vergroening en geen hogere vruchtbaarheid."},{"c":17,"sel":"juiste","pick":2,"q":"Welke twee uitspraken geven een juist verschil weer tussen de conflictsociologie en de functionalistische sociologie?","o":[["Conflictsociologen hebben geen enkele aandacht voor het belang van rollen in de samenleving",0],["Functionalisten gebruiken volgens conflictsociologen te vaak samenhang als legitimerende derde",1],["Conflictsociologen hebben meer oog voor de rol van dwang bij het sturen van menselijk gedrag",1],["Functionalisten hebben veel meer aandacht voor sociale ongelijkheid dan conflictsociologen",0]],"why":"Functionalisten verklaren de samenleving vanuit samenhang en gedeelde waarden, en net dat vinden conflictsociologen een te makkelijke legitimering. Conflictsociologen leggen de nadruk op macht, dwang en ongelijkheid, dus de laatste optie draait de zaak om."},{"c":17,"sel":"juiste","pick":2,"q":"Welke twee uitspraken over sociale verwachtingen kloppen?","o":[["Ze zijn contingent, ze hadden ook anders kunnen zijn",1],["Een interactie stopt zodra een verwachting geschonden wordt",0],["We zijn ons meestal bewust van onze eigen verwachtingen",0],["Ze voelen voor de betrokkenen vanzelfsprekend aan",1]],"why":"Verwachtingen worden beleefd als vanzelfsprekend, maar ze zijn sociaal gemaakt en dus contingent: in een andere tijd of cultuur zouden ze anders liggen. Bij een schending volgt meestal herstelwerk, niet het einde van de interactie."},{"c":17,"sel":"foute","pick":2,"q":"Armoede kan op verschillende manieren gemeten worden. Welke twee omschrijvingen hieronder zijn fout?","o":[["De budget- of korfmethode, waarbij je aan de bevolking vraagt wat als minimum geldt voor een bepaald gezinstype, en wie minder heeft als arm telt",1],["De deprivatiemethode, waarbij je als arm geldt als je je de goederen niet kunt veroorloven die voor een modaal huishouden als noodzakelijk gelden",0],["De relatieve methode, waarbij je als arm geldt als je minder hebt dan een bepaald percentage van het mediane of gemiddelde beschikbare gezinsinkomen",0],["De subjectieve methode, waarbij een korf van goederen wordt samengesteld die mensen minimaal nodig hebben, en de waarde daarvan de armoedegrens is",1],["Het wettelijk erkende minimum, waarbij het beleid en de wetgever via bijvoorbeeld het bestaansminimum in de praktijk vastleggen wat een economisch minimum is",0]],"why":"De twee omschrijvingen zijn omgewisseld. Bij de budget- of korfmethode stelt men zelf een korf van noodzakelijke goederen samen en is de waarde daarvan de armoedegrens, terwijl men bij de subjectieve methode aan mensen zelf vraagt wat zij als minimum beschouwen."},{"c":17,"sel":"juiste","pick":1,"q":"Welke uitspraak hoort eerder thuis bij de rational choice theorie dan bij de opvattingen van Emile Durkheim over het sociale?","o":[["Wat individuen doen volgt uit regels, rollen en verwachtingen, en daarin schuilt het sociale",0],["Het sociale is eigensoortig door zijn relatieve autonomie tegenover andere werkelijkheidsniveaus",0],["Het sociale is een onbedoeld gevolg van individuen die tegelijk rationeel en uit eigenbelang handelen",1],["Het is de ontwikkeling van het sociale zelf die mensen rationeel uit eigenbelang doet handelen",0],["Het eigensoortige van het sociale blijkt uit effecten die aan de bedoelingen van individuen ontsnappen",0]],"why":"Rational choice vertrekt bij het individu en ziet de sociale orde als bijproduct van mensen die elk hun eigen voordeel zoeken. Durkheim werkt net omgekeerd en behandelt het sociale als een eigen werkelijkheidsniveau met een eigen dwingende kracht."},{"c":17,"sel":"foute","pick":2,"q":"Welke twee stellingen horen niet thuis bij het denken van de Verlichting?","o":[["Mensen handelen in de eerste plaats uit eigenbelang",1],["Samenleven kan enkel als het individuele handelen begrensd wordt",1],["Rationeel denken leidt tot geluk en vooruitgang",0],["Rousseau zag een civiele religie als bindmiddel voor de samenleving",0]],"why":"De Verlichting vertrouwt op de rede, de vrijheid en de vooruitgang van het individu. Het beeld van de mens als egoïst die met opgelegde grenzen in toom gehouden moet worden, hoort bij de tegen-Verlichting."},{"c":17,"sel":"foute","pick":2,"q":"Welke twee uitspraken over de typische liberale welvaartsstaat volgens Esping-Andersen zijn fout?","o":[["De welvaartsstaat is er eerder zwak en residueel ontwikkeld",0],["Er is conflict over levensbeschouwing tussen de zuilen",1],["De werkloosheidsgraad ligt er relatief laag",0],["Er komt in verhouding veel armoede voor",0],["De staat herverdeelt goederen op een sterke manier",1]],"why":"De liberale welvaartsstaat is residueel: weinig herverdeling, lage uitkeringen, veel armoede en een soepele arbeidsmarkt met relatief lage werkloosheid. Conflict over levensbeschouwing past bij het conservatief-corporatistische type, sterke herverdeling bij het sociaaldemocratische type."},{"c":18,"sel":"juiste","pick":1,"q":"Welke sociologische term wordt hier beschreven: tegenstellingen die voor lange tijd de politieke conflictmaterie bepalen en de strijdende kampen en partijen afbakenen?","o":[["Stratificatie",0],["Decommodificatie",0],["Stand",0],["Corporatie",0],["Breuklijn",1],["Zuil",0],["Segmentatie",0],["Homogamie",0],["Klasse",0],["Sociaal conflict",0]],"why":"Een breuklijn (cleavage) is een diepe tegenstelling die de politieke strijd langdurig structureert, zoals arbeid tegenover kapitaal of kerk tegenover staat. Een zuil is de organisatorische uitbouw die zich rond zo een breuklijn vormt, dus dat is het gevolg en niet de tegenstelling zelf."},{"c":18,"sel":"foute","pick":2,"q":"Welke kenmerken passen eerder bij niet-primaire relaties dan bij primaire relaties? Duid de twee kenmerken aan die er NIET bij horen.","o":[["Een gevoel van verbondenheid",1],["Indirecte communicatie",0],["De relatie heeft een specifiek doel",0],["Een intiem karakter",1],["De relatie is onpersoonlijk",0]],"why":"Niet-primaire of secundaire relaties zijn onpersoonlijk, doelgericht en verlopen vaak indirect. Verbondenheid en intimiteit zijn juist de kenmerken van primaire relaties, dus die twee horen niet in het rijtje thuis."},{"c":18,"sel":"juiste","pick":2,"q":"Een handeling bestaat uit intentionele en communicatieve aspecten. Welke twee horen bij het intentionele deel?","o":[["Doelen en waarden",1],["Symbolen",0],["Definities van de situatie",0],["Betekenissen",0],["Normen",1]],"why":"Het intentionele deel gaat over wat iemand wil bereiken en waaraan hij zich houdt: doelen, waarden en normen. Symbolen, betekenissen en definities van de situatie horen bij het communicatieve deel, want daarmee maak je je handelen verstaanbaar voor anderen."},{"c":18,"sel":"juiste","pick":1,"q":"Waardoor wordt het gevoel van onmacht en vervreemding of trivialisering van het individu in formele organisaties onder meer veroorzaakt?","o":[["Door het ontstaan van informele organisaties binnen de formele organisatie",0],["Door de maximale omvang en indringendheid van de controle in formele organisaties",0],["Door de bureaucratisering en de inefficiëntie die daaruit voortvloeit",0],["Door de ijzeren wet van de oligarchie, die voor alle formele organisaties geldt",0],["Door de instrumentalisering van het rolgedrag in formele organisaties",0],["Door het gebrek aan beheersbaarheid van formele organisaties",0],["Doordat de eigen, persoonlijke identiteit in formele organisaties afneemt",1],["Door de differentiatie binnen de formele organisatie",0],["Door het verschil tussen formele en informele organisaties",0],["Doordat formele organisaties vaak een totalitair karakter hebben",0]],"why":"In een formele organisatie tel je mee als functiehouder en niet als persoon. Dat je eigen identiteit daarbij naar de achtergrond verdwijnt, is precies wat het gevoel van onmacht en trivialisering oproept."},{"c":18,"sel":"juiste","pick":2,"q":"Welke twee termen ontbreken in dit citaat? '... is een overgeleverd geheel van betekenissen die vervat zijn in ...; een geheel van opvattingen uitgedrukt in de ... via dewelke mensen met elkaar communiceren, hun kennis van en houdingen ten opzichte van het leven ontwikkelen en doorgeven.'","o":[["Een maatschappij",0],["Een rol",0],["Vormen",0],["Symbolen",1],["Cultuur",1]],"why":"Dit is de klassieke omschrijving van cultuur als een historisch overgeleverd patroon van betekenissen dat in symbolen vervat zit. Cultuur is dus het eerste ontbrekende woord en symbolen het tweede."},{"c":18,"sel":"juiste","pick":1,"q":"In een maatschappij worden steeds meer problematische handelingen gezien als het gevolg van tekorten waarvoor de betrokkene niet verantwoordelijk is, en men gaat ervan uit dat die persoon met een gepaste aanpak genezen kan worden. Voor het benoemen en behandelen ervan doet men een beroep op artsen, medische technologie en medische organisaties. Hoe noem je die ontwikkeling?","o":[["Groeiende tolerantie",0],["Een onbedoeld gevolg van de uitbreiding van de ziekterol",0],["Groeiende onbekwaamheid van de medische wetenschap",0],["Toename van professionalisering",0],["Toename van het gezag van geneesheren",0],["Expansie van de medische sector",0],["De responsabilisering van de zieken",0],["Blaming the victim",0],["Medicalisering",1],["Het gevolg van andere dan organische etiologieën",0]],"why":"Medicalisering betekent dat gedrag dat vroeger moreel of juridisch werd beoordeeld, voortaan als een medisch probleem wordt gedefinieerd en behandeld. De arts wordt daarmee de instantie die bepaalt wat normaal is."},{"c":18,"sel":"juiste","pick":1,"q":"Voor 31 juli wordt op de Franse autowegen een nooit geziene verkeersdrukte voorspeld. Die voorspelling wordt wekenlang in de media besproken. Veel reizigers verplaatsen daarom hun vertrek of nemen een andere route, waardoor er op 31 juli net weinig drukte is. Waarvan is dit een voorbeeld?","o":[["Een verkeerde definitie van de situatie door de hulpdiensten",0],["Een Popper-gevolg",0],["Een self-fulfilling prophecy",0],["Een onbedoeld gevolg van de informatisering van de toeristische sector",0],["Een zelfvernietigende voorspelling",1],["Een Gropius-curve",0],["Een fout die ontstaat wanneer je op basis van statistiek extrapoleert zonder rekening te houden met het intentionele karakter van handelen",0],["Een misplaatst gebruik van functionele analyse",0],["Een Mattheüs-effect",0],["Een pervers effect van rationeel sociaal handelen",0]],"why":"Omdat de voorspelling bekend raakt, passen mensen hun gedrag aan en komt ze net niet uit. Dat is een zelfvernietigende voorspelling, het spiegelbeeld van de zelfvervullende voorspelling."},{"c":18,"sel":"juiste","pick":2,"q":"Bij de studie van de manier waarop een interactiekader of een organisatie haar leden beïnvloedt en controleert, maken auteurs een onderscheid tussen kenmerken van het lidmaatschap. Welke twee kenmerken worden daarbij weerhouden?","o":[["Kosten",0],["Omvang",1],["Prestige",0],["Indringendheid",1],["Gulzigheid van de organisatie",0]],"why":"Het gaat om de omvang van het lidmaatschap, dus hoeveel van je leven het opeist, en om de indringendheid, dus hoe diep de organisatie in je persoonlijke leven doordringt. Gulzige instituties zijn een voorbeeld waarin beide hoog scoren, maar dat is geen apart kenmerk."},{"c":18,"sel":"juiste","pick":1,"q":"Het theorema van W.I. Thomas luidt: als mensen situaties voor werkelijk houden, dan zijn die ook reëel in hun gevolgen. Wat verklaart dat theorema?","o":[["Het geloof dat de modernisering tot een gevoelsarme wereld heeft geleid",0],["Het mechanisme van de zelfvervullende voorspelling",1],["Het relatieve belang van discursieve theorieën",0],["De godsdienst als ervaring",0],["De ijzeren wet van de oligarchie",0],["Het onderscheid tussen normatieve en cognitieve verwachtingen",0],["De dominantie van waarden boven de structurele kenmerken van het sociale",0],["Het probleem van de collectieve actie",0],["De robuustheid van het sociale",0],["De Gemeinschaft-nostalgie bij bepaalde groepen",0]],"why":"Omdat mensen handelen naar hun definitie van de situatie, maken ze die definitie ook waar. Precies dat mechanisme zit achter de zelfvervullende voorspelling, bijvoorbeeld bij een bankrun."},{"c":18,"sel":"foute","pick":2,"q":"Welke twee uitspraken over de ziekterol zijn fout?","o":[["De ziekte is een straf",1],["De klachten worden erdoor gelegitimeerd",0],["Afwijkend gedrag wordt erdoor niet gesanctioneerd",0],["Het is een aanvaard element in de sociale werkelijkheid",0],["Het is een voorbeeld van instrumenteel activisme",1]],"why":"De ziekterol ontslaat je tijdelijk van je gewone verplichtingen zonder dat je daarvoor gestraft wordt, en legitimeert je klachten. Ziekte als straf hoort bij een moraliserende kijk die de ziekterol net vervangt, en instrumenteel activisme staat er haaks op, want dat gaat over actief presteren."},{"c":18,"sel":"juiste","pick":1,"q":"De kennis van normen, gedragscodes en regels die mensen wel weten te gebruiken, doch niet altijd uitdrukkelijk kunnen formuleren, noemen we:","o":[["beredeneerde kennis",0],["praktische kennis",1],["wetenschappelijke kennis",0],["normatieve kennis",0],["universele kennis",0],["manifeste kennis",0],["discursieve kennis",0],["regelkennis",0],["technische kennis",0]],"why":"Praktische kennis is het soort weten dat je in je vingers hebt zonder het te kunnen uitleggen, zoals weten hoe dicht je bij iemand mag gaan staan. Discursieve kennis is het tegenovergestelde: kennis die je wel onder woorden kan brengen."},{"c":18,"sel":"juiste","pick":1,"q":"De eerste voorwaarden waaraan een spion moet voldoen is een perfecte kennis van de taal, zonder dewelke hij niet kan overleven, laat staan zijn opdracht vervullen. Zo’n kennis slaat op meer dan een perfect gebruik van de taal. De agent moet zich als een inboorling weten te gedragen, denken we maar eens aan al die onbenullige details die we kennen omdat we ergens zijn opgegroeid: kinderversjes, spreekwoorden, liedjes, de namen van sportmannen en filmsterren, het geheel van die verhoudingen waaruit regionale en klassenverschillen blijken, …’ (E. Cookridge). In deze opmerking betreffende de opleiding van spionnen wordt de nadruk gelegd op:","o":[["het probleem van de dubbele contingentie",0],["het bestaan van algemene codes",0],["het belang van de definitie van de situatie",0],["de socialisatie",0],["normatieve verwachtingen",0],["praktische kennis",1],["sanctioneren",0],["totale controle",0],["talige communicatie",0],["regionalisme",0]],"why":"De spion kent de regels niet alleen in theorie, hij weet ze ook toe te passen zonder erbij na te denken. Dat onuitgesproken kunnen meedraaien is precies praktische kennis."},{"c":18,"sel":"juiste","pick":1,"q":"Het is geweten dat de houders van diploma X gemakkelijker aan werk geraken dan de houders van diploma Y. Op basis van die kennis kiezen een groot aantal studenten studierichting X. Als zij afstuderen stellen zij vast dat heel wat personen met diploma X zich op de arbeidsmarkt aanbieden, en dat de tewerkstellingskansen van de houders van dit diploma bijzonder ongunstig wordt. Dit is een voorbeeld van:","o":[["een Mattheüs-effect",0],["een Gropius-curve",0],["een Popper-gevolg",0],["een zelfvernietigende voorspelling",1],["een misplaatst gebruik van de ziekterol",0],["een onbedoeld gevolg van de snelle universitaire expansie",0],["een bewijs dat een universitair diploma aan waarde verliest",0],["een illustratie van het probleem van de collectieve actie",0]],"why":"Doordat de voorspelling bekend raakt, kiezen zoveel studenten die richting dat het voordeel verdwijnt. De voorspelling ondergraaft zichzelf, dat is een zelfvernietigende voorspelling."},{"c":18,"sel":"juiste","pick":2,"q":"Welke twee stellingen horen bij de reductionistische visie op de ziekterol? Duid de twee juiste antwoorden aan.","o":[["De afwijkingen en onbekwaamheden die in de ziekterol toelaatbaar zijn, worden beschouwd als rechtstreekse gevolgen van de ziekte zelf",1],["De fysieke toestand van het organisme is kenbaar via de medische wetenschap. Er kan dan ook objectief bepaald worden of iemand al dan niet ziek is",1],["De ziekterol is een sociaal verschijnsel dat niet kan worden teruggebracht tot een toestand van het organisme",0],["De fysieke toestand van het organisme bepaalt wanneer iemand als ziek wordt beschouwd en het sociaal- cultureel gegeven bepaalt hoe de ziekterol wordt ingevuld",0],["De ziekterol bepaalt hoe men in een bepaalde cultuur de ziekte benadert en oefent dus ook invloed uit op specifieke manier waarop de kunst van het genezen en de medische wetenschap zich daar ontwikkelen",0]],"why":"De reductionistische visie brengt de ziekterol terug tot het lichaam: wat je mag, volgt rechtstreeks uit de aandoening, en de geneeskunde stelt objectief vast of je ziek bent. De andere uitspraken zien de ziekterol juist als een sociaal en cultureel verschijnsel."},{"c":18,"sel":"juiste","pick":2,"q":"Duid de twee juiste stellingen aan over de taken en de houding van een socioloog.","o":[["Met de praktische taak wordt bedoeld dat de socioloog met zijn onderzoeksresultaten en theorieën vaak tegen bestaande belangen en vooroordelen ingaat. Hij verschijnt dan als een soort mythejager. Achter de werkelijkheid zoals zij lijkt te zijn, toont hij een dieperliggende werkelijkheid",0],["Met de kritische taak wordt bedoeld dat sociologen slechts tot echte inzichten in de samenleving kunnen komen als ze de samenhang van diverse verschijnselen weten te vatten en verschijnselen in hun samenhang met andere leren zien",0],["Empirisch-analytische kennis kan nuttig zijn bij het evalueren van beleid. Het aanleren van de methoden om die kennis verwerven, neemt dan ook een belangrijke plaats in de opleiding van sociologen",1],["De Belgische socioloog Claude Javeau opteert voor een sociologie van het ‘dagelijks leven’ waarin de socioloog het gedrag niet beschrijft in termen van theorieën die dan worden getoetst, maar in de terminologie en de voorstellingswijzen die de mensen zelf gebruiken. Dit sluit aan bij de praktische taak van de socioloog",1],["Een goede socioloog moet kiezen tussen het nastreven de praktische taak, de kritische taak en de empirische- analytische taak. Het is niet mogelijk meer dan één van deze taken tegelijk na te streven",0]],"why":"De eerste twee uitspraken verwisselen de taken: de mythejager hoort bij de kritische taak, niet bij de praktische. En een socioloog moet niet kiezen tussen de drie taken, die kunnen samengaan."},{"c":18,"sel":"juiste","pick":2,"q":"Het probleem van de collectieve actie, zoals geformuleerd door Olson, maakt duidelijk dat... Duid de twee juiste antwoorden aan.","o":[["... in grote groepen een rationeel, eigenbelang handelend individu zich niet zal inzetten voor collectieve actie",1],["... het sociale zelfregulerend is en dat er dus geen sociale instellingen nodig zijn om collectieve actie te sturen of collectieve goederen te voorzien",0],["... de vrije markt de staat moet onderwerpen, net omdat de principes van de vrije mark nu éénmaal in de natuur van de mens liggen",0],["... oprecht en belangloos idealisme bestaan maar deze bedreigend zijn voor de sociale orde",0],["...enkel dwang of persoonlijke winsten mensen ertoe overhalen deel te nemen aan collectieve actie",1]],"why":"Olson toont dat wie zuiver zijn eigenbelang volgt in een grote groep beter kan meeliften op de inspanning van anderen. Alleen dwang of een persoonlijk voordeel dat enkel naar de deelnemers gaat, krijgt mensen toch in beweging."},{"c":18,"sel":"juiste","pick":2,"q":"Wat stelt Habermas over terrorisme? Duid de twee juiste antwoorden aan.","o":[["De kracht van het terrorisme vloeit uit het onverwachte voort: een aanslag kan altijd en overal plaatsvinden",1],["Het is belangrijk dat een staat die wordt geconfronteerd met terrorisme ook een ‘oorlog tegen terrorisme’ start. Op die manier zal de bevolking zich geruster voelen omdat ze weten er effectief wordt opgetreden tegen dat terrorisme",0],["Terrorisme is zo beangstigend omdat we de acties kunnen plaatsen in een te verwachten schema van handelingen, hoe afkeurenswaardig ook",0],["Er is veel meer angst voor een terroristische aanslag dan voor een verkeersongeval omdat de persoonlijke gevolgen in het eerste geval veel groter zijn",0],["De impact van terrorisme vloeit veel meer voor uit de reacties die het teweegbrengt dan uit de gruwel van de aanslagen zelf",1]],"why":"Volgens Habermas zit de kracht van terrorisme in de onvoorspelbaarheid en vooral in de reactie die het uitlokt. De maatschappelijke ontwrichting komt dus grotendeels van hoe wij erop reageren."},{"c":18,"sel":"foute","pick":2,"q":"Welke kritieken zouden conflictsociologen geven op het functionalisme? Duid de twee foute antwoorden aan.","o":[["Wat bestaat, wordt al te snel gelijkgesteld aan wat functioneel en nuttig is",0],["Functionalisten hebben een gebrek aan aandacht voor verschijnselen als belangen, strategisch handelen uit eigenbelang, macht en conflicten die daaruit voortvloeien",0],["Er wordt te frequent naar samenhang gegrepen als een legitimerende derde en zo wordt het status quo, de bestaande orde, verdedigd",0],["Functionalisten leggen te veel nadruk op machtsrelaties die het handelen sturen en beslissen over de verdeling van de goederen",1],["Het functionalisme wordt te sterk gebaseerd op de idee van een struggle for existence of struggle for survival",1]],"why":"Conflictsociologen verwijten het functionalisme net te weinig oog voor macht en belangen, dus die eerste uitspraak keert het verwijt om. En de struggle for existence hoort bij het sociaal darwinisme, niet bij het functionalisme."},{"c":18,"sel":"foute","pick":2,"q":"Voor de empirisch-analytische taak van de socioloog is de onderzoekscyclus een belangrijk element. Welke stappen maken deel uit van een onderzoekscyclus? Duid de twee foute antwoorden.","o":[["Indien een hypothese wordt weerlegd, wordt de onderzoekscyclus eigenlijk verbroken en moet opnieuw beginnen met het onderzoek",1],["Het opstellen van een hypothese. Dit is een stelling die wordt afgeleid uit theorie, met andere woorden uit een meer algemene visie op hoe de sociale werkelijkheid in elkaar uit",0],["De conclusies na het doorlopen van een volledige onderzoekscyclus kunnen ertoe leiden dat de theorie wordt aangepast",0],["Een hypothese moet door onderzoek worden getoetst. Er wordt dan geobserveerd of de stelling strookt met de empirische realiteit",0],["Indien een hypothese niet klopt komt het er eigenlijk op neer dat de theorie terzijde moet worden geschoven omdat ze onbruikbaar is",1]],"why":"Een weerlegde hypothese breekt de onderzoekscyclus niet af, ze stuurt hem juist: je past de theorie aan en toetst opnieuw. En een theorie gaat niet meteen de vuilbak in omdat een afgeleide hypothese niet klopt."},{"c":18,"sel":"juiste","pick":2,"q":"Culturalisten en aanhangers van de dependentietheorie verklaren de achterstelling van landen anders. Welke twee uitspraken kloppen?","o":[["Culturalisten stellen dat het verschil te verwijten is aan endogene factoren, zoals de ligging van het land of bepaalde culturele eigenschappen van bevolking",1],["Dependistas stellen dat het verschil te wijten is aan ongelijke relaties tussen landen",1],["Dependistas stellen dat verschil te wijten is aan een verouderd mensbeeld met te weinig aandacht voor wetenschap in de achtergestelde landen",0],["Culturalisten stellen dat het verschil te wijten is aan het (neo)kolonialisme, waarbij arme landen als bron goedkope grondstoffen worden gebruikt",0],["Culturalisten stellen dat het verschil kan verklaard worden door militaire onevenwichten tussen landen",0]],"why":"Culturalisten zoeken de oorzaak binnen het land zelf, bij factoren zoals cultuur en mentaliteit. Dependistas kijken juist naar de verhouding tussen landen: arme landen blijven arm door ongelijke relaties en koloniale erfenis. De twee andere uitspraken draaien die posities net om."},{"c":18,"sel":"juiste","pick":2,"q":"Het probleem van collectieve actie, zoals voorgesteld door Olson verklaart niet waarom er dan toch zoveel collectieve acties zijn (bv stakingsacties, betogingen,...). Hoe verklaart Olson dit? Duid de twee juiste antwoorden aan.","o":[["Olson heeft zijn theorie later bijgesteld. Initieel blijft het probleem van collectieve actie bestaan, maar na verloop van tijd kan door middel van communicatie duidelijk worden dat er genoeg mensen aan bepaald belang delen en zullen ze zich toch verenigen rondom dit gedeeld belang",0],["Olson heeft toegegeven dat zijn redenering fout was. Hij heeft later namelijk gezegd dat wanneer er dwang in het spel is, mensen zich hierdoor gaan inzetten voor collectieve acties. In die redenering klopt zijn uitgangspunt dat mensen handelen als rationeel handelende individuen niet meer",0],["Olson zegt dat wanneer er dwang in het spel is, mensen zich hierdoor gaan inzetten voor collectieve acties",1],["Olson stelt dat de collectieve acties die er wel zijn, eerder moeten gezien worden als uitzonderingen die de regel bevestigen. Er zijn nog altid heel veel onderwerpen waarrond mensen een gedeeld belang hebben maar waarbij er geen collectieve actie is ontstaan",0],["Olson stelt dat voordelen van deelname aan collectieve actie geparticulariseerd kunnen worden, wat betekent dat mensen een duidelijk persoonlijk voordeel kunnen halen uit hun lidmaatschap",1]],"why":"Olson houdt vast aan zijn redenering en verklaart bestaande acties op twee manieren: dwang, bijvoorbeeld verplicht lidmaatschap, en voordelen die alleen naar de deelnemers gaan. Zonder een van die twee blijft meeliften voor het individu de slimste keuze."},{"c":18,"sel":"foute","pick":2,"q":"Er bestaan verschillende manieren om armoede te meten. Welke twee beschrijvingen kloppen NIET?","o":[["De budget- of korfmethode die bij de bevolking nagaat wat in een gegeven samenleving wordt beschouwd als een minimum aan macht voor een bepaald gezinstype. Mensen die minder hebben worden in dat geval als arm beschouwd",1],["De deprivatiemethode. Daarbij wordt men als arm beschouwd als men zich niet de goederen kan veroorloven die voor een modaal huishouden noodzakelijk worden geacht",0],["De relatieve methode gebruikt. Daarbij wordt iemand beschouwd als arm als hij minder dan een bepaald percentage van het in het land gemiddelde of mediane beschikbare gezinsinkomen heeft, ook wanneer die grens per land en per gezinssamenstelling verschilt",0],["De subjectieve methode, waarbij een denkbeeldige korf van goederen samengesteld wordt die mensen minimaal moeten kunnen consumeren. De geldwaarde van die korf is dan de armoedegrens",1],["Het wettelijke erkende minimum. Het beleid en de wetgever hanteren bijvoorbeeld bij het uitkeren van een bestaansminimum, de facto een defintie van wat een economisch minimum is",0]],"why":"De twee beschrijvingen zijn verwisseld. De budget- of korfmethode stelt een korf samen van goederen die je minimaal moet kunnen kopen, terwijl de subjectieve methode aan mensen zelf vraagt wat zij als minimum beschouwen."},{"c":18,"sel":"juiste","pick":1,"q":"De socioloog zoekt de verklaring van het menselijk gedrag in (1 antwoord):","o":[["Goddelijke wilsbeschikking",0],["De wetten van de natuur",0],["De individuele behoeften",0],["De wetten van de stand",0],["De invloed van bekende tv-presentatoren en sociale media",0],["Geen van bovenstaande mogelijkheden is juist",1]],"why":"Een socioloog zoekt de verklaring niet bij god, de natuur of losse individuele behoeften, maar bij de sociale verhoudingen waarin mensen leven. Geen van de opgesomde mogelijkheden dekt dat, dus de laatste optie is de juiste."},{"c":18,"sel":"juiste","pick":2,"q":"De ‘etiketteringtheorie’ heeft een eigen perspectief ontwikkeld op afwijkend gedrag. Kies uit de onderstaande mechanismen de twee die in de etiketteringtheorie een belangrijke rol spelen bij de verklaring van de dynamiek van afwijkend gedrag.","o":[["Personen met een neiging tot afwijkend gedrag zijn vaak herkenbaar aan een aantal zogenaamde ‘etiketterende’ kenmerken",0],["Personen die het slachtoffer zijn van etikettering ontwikkelen vaak een zelfbeeld dat tegemoet komt aan de negatieve verwachtingen van anderen",1],["De handelingen van personen met een slechte reputatie worden veel sneller als afwijkend geïnterpreteerd dan de handelingen van andere personen",1],["Personen die slecht presteren in een bepaalde context hebben vaak de neiging dit te compenseren met afwijkend gedrag in andere contexten",0],["Samenlevingen waar formele gelijkheid bestaat zijn geneigd om de bestaande ongelijkheden toe te schrijven aan individuele onbekwaamheid",0]],"why":"De etiketteringstheorie draait om wat het label met iemand doet. Wie als afwijkend bestempeld wordt, gaat zich naar dat beeld gedragen, en zijn gedrag wordt door anderen ook sneller als afwijkend gelezen. Zo versterkt het etiket zichzelf."}],"theory":[{"h":"H1: De sociologische verzuchting","items":["Contingentie: instituties en regels zijn noch noodzakelijk, noch onmogelijk, ze hadden anders kunnen zijn, maar daarom niet arbitrair (niet zomaar willekeur).","Sociale orde: hoe komen samenlevingen tot gedeelde, nageleefde regels? Dat is de centrale vraag.","Egalitaire maatschappij: ongelijkheid wordt niet meer verantwoord via goddelijke wil; gelijkheid zit in de wetten.","Marx gebruikt 'geschiedenis' als legitimerend verhaal richting een klasseloze maatschappij."]},{"h":"H2: De taak en houding van de socioloog","items":["Onderzoekscyclus: theorie → hypothese → toetsen/observeren → conclusie (theorie eventueel bijstellen).","Comte: positivisme, zoeken naar regelmaten, geen metafysische vragen.","Kritische functie: de socioloog stelt zich 'aan de rand' op, relatief onafhankelijk van dominante belangen.","Cultuurrelativisme (radicaal): culturen laten zich niet in elkaar vertalen; geen waardeoordeel mogelijk.","Kennisoverdracht is lastig: inzichten druisen vaak in tegen het 'gezond verstand' en tegen groepsbelangen."]},{"h":"H3: Ontdekking van de samenleving I (individualistisch)","items":["Individualistische benadering: het sociale ontstaat als onbedoeld gevolg van rationeel handelende individuen.","Rational choice / ruiltheorie: vertrekt van een rationeel individu dat uit eigenbelang handelt.","Mattheus-effect (Merton): wie al veel heeft, krijgt nog meer (bv. beurzen die vooral de middenklasse helpen).","Olson, collectieve actie: het free-rider-probleem; rationele individuen dragen niet bij aan een collectief goed.","Onbedoelde vs perverse effecten: self-fulfilling prophecy tegenover de zelfvernietigende voorspelling (de filedrukte die net uitblijft)."]},{"h":"H4: Ontdekking van de samenleving II (collectivistisch)","items":["Durkheim: rollen, normen en verwachtingen liggen aan de basis van voorkeuren; het sociale heeft een relatieve autonomie (meer dan de som van individuen).","Normatief handelend individu: symbolisch interactionisme, etnomethodologie en dramaturgie, tegenover het rationele individu van H3.","Individu en samenleving 'maken elkaar': vrijheid hangt af van de middelen om naar voorkeur te handelen."]},{"h":"H5: Rol en zelf","items":["Sociale handeling: intentionele aspecten (doelen, waarden) + communicatieve aspecten (symbolen, betekenissen).","Definitie van de situatie (Thomas): de betekenis van handelen hangt af van hoe de situatie gedefinieerd wordt.","Goffman, dramaturgie: impression management; roldistantie = afstand nemen van je rol (verschil tussen 'echte' en 'gepresenteerde' zelf).","Cultuur: overgeleverd geheel van betekenissen in symbolen, waarmee mensen communiceren en kennis doorgeven."]},{"h":"H6: Verwachten en verklaren","items":["Primaire relaties: affectief, intiem, persoonlijk, diffuus, veranderen van aard als een lid wegvalt.","Niet-primaire relaties: onpersoonlijk, gericht op een specifiek doel, instrumenteel, indirecte communicatie.","Verwachtingen en rollen sturen gedrag; in primaire relaties werkt de 'stille taal' van tekens en houdingen."]},{"h":"H7: Socialisatie en methoden van samenleven","items":["Socialisatie: het internaliseren van normen, waarden en rollen.","Bourdieu, habitus: opgroeien in een milieu levert een voorspelbaar smaakpatroon; smaak is niet louter een kwestie van geld.","Mauss, de gift: geschenken berusten op reciprociteit (wederkerigheid)."]},{"h":"H8: Sociale controle","items":["Gordels van sociale controle: routine, socialisatie, internalisering, informele en formele sancties, buffers (humor), uitlaatkleppen (carnaval). Zelfontplooiing hoort er NIET bij.","Vier vormen van macht: economisch (belonen), politiek (dwang/straf), sociaal (invloed), cultureel (waardengetrouwheid activeren).","Versymbolisering & schaalvergroting: geld als symbolisch sanctioneringsmiddel; eerbied voor macht steunt op het geloof in omzetbaarheid in echte straf."]},{"h":"H9: Maatschappelijke schaalvergroting","items":["Geld als medium: een overdraagbare sanctioneringsmogelijkheid, een 'geschreven belofte'.","Bureaucratie (Weber): geschreven archief, sterke arbeids-/bevoegdheidsverdeling, duidelijke hiërarchie.","Merton, ritualisme: het middel wordt belangrijker dan het doel.","Michels: ijzeren wet van de oligarchie; trivialisering van het individu in formele organisaties.","Informele organisatie: rollen en netwerken die buiten de 'blauwdruk' om ontstaan."]},{"h":"H10: Criminaliteit","items":["Criminele statistiek = reëel gedrag + meldingsgedrag; een stijging kan louter door veranderd meldings- of politiegedrag komen.","Functies van straf: afschrikking, vergelding/wraak, herstel.","Medicalisering: probleemgedrag wordt steeds vaker als 'ziekte' gezien buiten de verantwoordelijkheid van de persoon (uitbreiding van de ziekterol)."]},{"h":"H11: Ongelijkheid","items":["Sociale ongelijkheid = verschil in waardering tussen (groepen) mensen, niet zomaar verscheidenheid; uit zich soms als klassensysteem.","Armoede meten: budget-/korfmethode, deprivatiemethode, relatieve methode (% van mediaaninkomen), subjectieve methode, wettelijk minimum.","Esping-Andersen, welvaartsstaattypes: liberaal, corporatistisch, sociaaldemocratisch."]},{"h":"H12: Macht en stratificatie","items":["Foucault, macht: vooral de macht om een definitie van de werkelijkheid door anderen te laten aanvaarden, niet enkel belonen/straffen.","Scheiding der machten verhindert ongeoorloofde transformatie van macht: cliëntelisme, corruptie, omkoping.","Prestige = het bezit van sociale en politieke macht."]},{"h":"H13: Macht en de architectuur van de samenleving","items":["Totale instelling (Goffman): via initiatierituelen wordt een nieuw lid symbolisch 'vernietigd' en losgemaakt van zijn vroegere identiteit.","Motivatie via overtuigingen: een organisatie die leden bindt via hun overtuigingen kan moeilijk van doel veranderen of leden afdanken."]},{"h":"H14: De aanloop tot modernisering","items":["Gemeinschaft vs Gesellschaft (Tönnies): gemeenschap/geborgenheid tegenover rationeel/zakelijk.","Gemeenschapsverzuchting: nostalgie naar gemeenschap als reactie op modernisering; verklaard door differentiatietheorie (gezin en productie groeien uiteen).","Culturalisten vs dependistas (onderontwikkeling): endogene factoren (cultuur, ligging) tegenover ongelijke relaties tussen landen ((neo)kolonialisme)."]},{"h":"H15: De transformatie (modernisering)","items":["Differentiatie van gezin en productie: het vaderlijk gezag regelt de economie niet meer; de zoon neemt het beroep niet automatisch over → gevoel van overbodigheid.","Sacralisering van het kind (Zelizer): in het emotionelere gezin wordt het kind 'heilig'/onbetaalbaar.","Ziekte & moraliteit: ziekte kan een morele betekenis krijgen; ziekte, zonde en misdaad werden niet altijd duidelijk gescheiden."]},{"h":"H16: De transformatie van interactiekaders","items":["Breuklijnen (cleavages): langdurige tegenstellingen die de politiek bepalen (bv. taalstrijd) en de definitie van de gemeenschap raken.","Verzuiling = sociologisch gesegmenteerd pluralisme.","Verschuiving van primaire naar secundaire interactiekaders door schaalvergroting en differentiatie."]},{"h":"🔑 Sleuteldenkers (kort)","items":["Durkheim: sociale feiten, collectivistische visie, relatieve autonomie van het sociale.","Weber: bureaucratie, gezag, Verstehen.","Merton: Mattheus-effect, ritualisme, self-fulfilling prophecy.","Goffman: dramaturgie, impression management, roldistantie, totale instelling.","Foucault: macht als definitie van de werkelijkheid.","Bourdieu: habitus, smaak & sociale positie.","Tönnies: Gemeinschaft/Gesellschaft. &nbsp; Mauss: de gift & reciprociteit. &nbsp; Olson: collectieve actie & free-rider.","Esping-Andersen: types welvaartsstaat. &nbsp; Zelizer: sacralisering van het kind. &nbsp; Michels: ijzeren wet van de oligarchie."]}],"theory_en":[{"h":"H1: The sociological longing","items":["Contingency: institutions and rules are neither necessary nor impossible, they could have been otherwise, but they are not therefore arbitrary (not just random).","Social order: how do societies arrive at shared, observed rules? That is the central question.","Egalitarian society: inequality is no longer justified through divine will; equality is embedded in the laws.","Marx uses 'history' as a legitimizing narrative leading toward a classless society."]},{"h":"H2: The task and attitude of the sociologist","items":["Research cycle: theory → hypothesis → testing/observing → conclusion (theory possibly revised).","Comte: positivism, searching for regularities, no metaphysical questions.","Critical function: the sociologist positions themselves 'at the margin', relatively independent of dominant interests.","Cultural relativism (radical): cultures cannot be translated into one another; no value judgement is possible.","Transferring knowledge is difficult: insights often run counter to 'common sense' and to group interests."]},{"h":"H3: Discovery of society I (individualist)","items":["Individualist approach: the social arises as an unintended consequence of rationally acting individuals.","Rational choice / exchange theory: starts from a rational individual who acts out of self-interest.","Matthew effect (Merton): those who already have much get even more (e.g. grants that mainly help the middle class).","Olson, collective action: the free-rider problem; rational individuals do not contribute to a collective good.","Unintended vs perverse effects: the self-fulfilling prophecy versus the self-defeating prediction (the traffic jam that fails to occur)."]},{"h":"H4: Discovery of society II (collectivist)","items":["Durkheim: roles, norms and expectations underlie preferences; the social has a relative autonomy (more than the sum of individuals).","Normatively acting individual: symbolic interactionism, ethnomethodology and dramaturgy, opposed to the rational individual of H3.","Individual and society 'make each other': freedom depends on the means to act according to one's preferences."]},{"h":"H5: Role and self","items":["Social action: intentional aspects (goals, values) + communicative aspects (symbols, meanings).","Definition of the situation (Thomas): the meaning of action depends on how the situation is defined.","Goffman, dramaturgy: impression management; role distance = distancing yourself from your role (the difference between the 'real' and the 'presented' self).","Culture: a transmitted whole of meanings in symbols, through which people communicate and pass on knowledge."]},{"h":"H6: Expecting and explaining","items":["Primary relationships: affective, intimate, personal, diffuse, they change in nature when a member drops out.","Non-primary relationships: impersonal, aimed at a specific goal, instrumental, indirect communication.","Expectations and roles guide behaviour; in primary relationships the 'silent language' of signs and attitudes is at work."]},{"h":"H7: Socialization and methods of living together","items":["Socialization: the internalizing of norms, values and roles.","Bourdieu, habitus: growing up in a milieu produces a predictable pattern of taste; taste is not merely a matter of money.","Mauss, the gift: gifts rest on reciprocity (mutual exchange)."]},{"h":"H8: Social control","items":["Belts of social control: routine, socialization, internalization, informal and formal sanctions, buffers (humour), safety valves (carnival). Self-fulfilment is NOT part of it.","Four forms of power: economic (rewarding), political (coercion/punishment), social (influence), cultural (activating loyalty to values).","Symbolization & scaling-up: money as a symbolic means of sanctioning; respect for power rests on the belief in its convertibility into real punishment."]},{"h":"H9: Societal scaling-up","items":["Money as a medium: a transferable possibility of sanctioning, a 'written promise'.","Bureaucracy (Weber): written archive, strong division of labour/authority, clear hierarchy.","Merton, ritualism: the means becomes more important than the goal.","Michels: iron law of oligarchy; trivialization of the individual in formal organizations.","Informal organization: roles and networks that arise outside the 'blueprint'."]},{"h":"H10: Crime","items":["Crime statistics = actual behaviour + reporting behaviour; an increase can be due purely to changed reporting or policing behaviour.","Functions of punishment: deterrence, retribution/revenge, restoration.","Medicalization: problem behaviour is increasingly seen as an 'illness' beyond the person's responsibility (an expansion of the sick role)."]},{"h":"H11: Inequality","items":["Social inequality = a difference in valuation between (groups of) people, not just diversity; it sometimes manifests as a class system.","Measuring poverty: budget/basket method, deprivation method, relative method (% of median income), subjective method, legal minimum.","Esping-Andersen, welfare state types: liberal, corporatist, social-democratic."]},{"h":"H12: Power and stratification","items":["Foucault, power: above all the power to have a definition of reality accepted by others, not merely rewarding/punishing.","Separation of powers prevents the illegitimate transformation of power: clientelism, corruption, bribery.","Prestige = the possession of social and political power."]},{"h":"H13: Power and the architecture of society","items":["Total institution (Goffman): through initiation rituals a new member is symbolically 'destroyed' and detached from their former identity.","Motivation through convictions: an organization that binds members through their convictions can hardly change its goal or dismiss members."]},{"h":"H14: The run-up to modernization","items":["Gemeinschaft vs Gesellschaft (Tönnies): community/security versus rational/businesslike.","Longing for community: nostalgia for community as a reaction to modernization; explained by differentiation theory (family and production grow apart).","Culturalists vs dependistas (underdevelopment): endogenous factors (culture, location) versus unequal relations between countries ((neo)colonialism)."]},{"h":"H15: The transformation (modernization)","items":["Differentiation of family and production: paternal authority no longer governs the economy; the son does not automatically take over the occupation → a sense of redundancy.","Sacralization of the child (Zelizer): in the more emotional family the child becomes 'sacred'/priceless.","Illness & morality: illness can take on a moral meaning; illness, sin and crime were not always clearly separated."]},{"h":"H16: The transformation of interaction frames","items":["Cleavages: long-lasting oppositions that shape politics (e.g. the language struggle) and touch on the definition of the community.","Pillarization = sociologically segmented pluralism.","Shift from primary to secondary interaction frames due to scaling-up and differentiation."]},{"h":"🔑 Key thinkers (brief)","items":["Durkheim: social facts, collectivist view, relative autonomy of the social.","Weber: bureaucracy, authority, Verstehen.","Merton: Matthew effect, ritualism, self-fulfilling prophecy.","Goffman: dramaturgy, impression management, role distance, total institution.","Foucault: power as the definition of reality.","Bourdieu: habitus, taste & social position.","Tönnies: Gemeinschaft/Gesellschaft. &nbsp; Mauss: the gift & reciprocity. &nbsp; Olson: collective action & free-rider.","Esping-Andersen: types of welfare state. &nbsp; Zelizer: sacralization of the child. &nbsp; Michels: iron law of oligarchy."]}],"hacks":[{"h":"Denk in tegenstellingen","t":"Sociologie draait vaak om twee tegengestelde scholen (individualistisch vs. collectivistisch, conflict vs. functionalisme, Gemeinschaft vs. Gesellschaft). Leer ze als paar.","h_en":"Think in contrasts","t_en":"Sociology often revolves around two opposing schools (individualist vs. collectivist, conflict vs. functionalism, Gemeinschaft vs. Gesellschaft). Learn them as a pair."},{"h":"Koppel elke theorie aan zijn denker","t":"Maak een lijstje naam → kernbegrip (Durkheim, Weber, Marx, Goffman, Bourdieu, Foucault…). Veel examenvragen testen precies dat.","h_en":"Link each theory to its thinker","t_en":"Make a name → key-concept list (Durkheim, Weber, Marx, Goffman, Bourdieu, Foucault…). Many exam questions test exactly that."},{"h":"Lees de vraagstelling goed","t":"Let op 'duid de 2 FOUTE' versus 'de juiste'. Hier verlies je makkelijk punten door te snel te lezen.","h_en":"Read the question carefully","t_en":"Watch for 'select the 2 INCORRECT' versus 'the correct'. Easy to lose points by reading too fast."},{"h":"Begrijp, stamp niet","t":"Sociologie gaat over mechanismen (contingentie, onbedoelde effecten). Snap het 'waarom' en de rest onthoud je vanzelf.","h_en":"Understand, don't cram","t_en":"Sociology is about mechanisms (contingency, unintended effects). Grasp the 'why' and the rest follows."},{"h":"Gebruik voorbeelden","t":"Koppel elk begrip aan een voorbeeld (de ziekterol, de afgelaste filestaking = zelfvernietigende voorspelling). Voorbeelden blijven beter hangen.","h_en":"Use examples","t_en":"Link each concept to an example (the sick role, the cancelled traffic jam = self-defeating prophecy). Examples stick better."},{"h":"Oefen met oude examenvragen","t":"De vragen hier zijn de echte examenpool. Herhaal de foute tot je ze allemaal beheerst.","h_en":"Practise with past exam questions","t_en":"The questions here are the real exam pool. Repeat the ones you got wrong until you've mastered them all."}]};
