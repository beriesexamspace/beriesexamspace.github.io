<style>
  :root{
    --bg:#f4f2ee; --bg2:#ebe8e2; --card:#ffffff; --ink:#1b232c; --muted:#5d6873;
    --line:#e2ddd4; --accent:#0f6e6a; --accent-ink:#0b4f4c; --accent-soft:#dcefed;
    --amber:#c9821f; --amber-soft:#f7ecd9; --violet:#6d5bd0; --violet-soft:#e9e6fa;
    --good:#1f8a4c; --good-soft:#e2f3e8; --bad:#c23b54; --bad-soft:#fbe5ea;
    --shadow:0 1px 2px rgba(20,30,40,.05),0 6px 18px rgba(20,30,40,.05);
    --shadow-lg:0 2px 6px rgba(20,30,40,.06),0 18px 40px rgba(20,30,40,.10);
    --r:14px; --r-lg:20px; --ease:cubic-bezier(.2,.8,.2,1);
  }
  html[data-theme="dark"]{
    --bg:#11151a; --bg2:#161b22; --card:#1b222b; --ink:#e7ecf1; --muted:#9aa6b2;
    --line:#2a323c; --accent:#3fb9b2; --accent-ink:#7fd6d0; --accent-soft:#163230;
    --amber:#e0a64a; --amber-soft:#2e2515; --violet:#a99cf0; --violet-soft:#221d3a;
    --good:#46c178; --good-soft:#16301f; --bad:#ef6b82; --bad-soft:#331620;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 2px 8px rgba(0,0,0,.4),0 22px 48px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;letter-spacing:-.01em}
  button,a{font-family:inherit;cursor:pointer;color:inherit}
  .wrap{max-width:880px;margin:0 auto;padding:0 18px 96px}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
  .ic{width:1.25em;height:1.25em;flex:none;vertical-align:-.18em;stroke:currentColor;stroke-width:1.75;
    stroke-linecap:round;stroke-linejoin:round;fill:none}

  header.top{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(160%) blur(16px);-webkit-backdrop-filter:saturate(160%) blur(16px);box-shadow:inset 0 -1px 0 0 rgba(0,0,0,.04)}
  .topin{max-width:880px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:700}
  .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,var(--accent),var(--accent-ink));
    color:#fff;display:grid;place-items:center;font-family:Georgia,serif;font-weight:700;font-size:16px;flex:none;
    box-shadow:0 2px 6px rgba(15,110,106,.35)}
  .brand small{display:block;font-weight:500;color:var(--muted);font-size:11px}
  .spacer{flex:1}
  .iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:38px;
    padding:7px 11px;font-size:13.5px;display:inline-flex;gap:7px;align-items:center;text-decoration:none;
    transition:border-color .2s var(--ease),transform .12s var(--ease)}
  .iconbtn:hover{border-color:var(--accent)} .iconbtn:active{transform:scale(.96)}
  nav.tabs{display:flex;gap:2px;overflow:auto;max-width:880px;margin:0 auto;padding:6px 12px 0;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{border:none;background:none;color:var(--muted);padding:10px 13px;border-radius:9px 9px 0 0;
    font-size:14px;font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px;transition:color .2s var(--ease)}
  nav.tabs button .ic{width:16px;height:16px}
  nav.tabs button.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
  nav.tabs button:hover{color:var(--ink)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:20px}
  .muted{color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
  .pill.amber{background:var(--amber-soft);color:var(--amber)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;gap:14px}
  @media(min-width:620px){.g2{grid-template-columns:1fr 1fr}}

  .hero{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin:20px 0 8px}
  .count{flex:none;background:linear-gradient(150deg,var(--accent),var(--accent-ink));color:#fff;border-radius:var(--r);padding:14px 20px;text-align:center;min-width:118px;box-shadow:0 8px 20px rgba(15,110,106,.28)}
  .count b{font-family:Georgia,serif;font-size:32px;display:block;line-height:1}
  .count span{font-size:12px;opacity:.92}
  .herotext h1{margin:0 0 4px;font-size:25px}
  .herotext p{margin:0;color:var(--muted)}

  .brandstrip{display:flex;align-items:center;gap:13px;width:100%;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 16px;margin:14px 0 2px;box-shadow:var(--shadow);transition:border-color .2s var(--ease),transform .15s var(--ease)}
  .brandstrip:hover{border-color:var(--accent);transform:translateY(-1px)}
  .brandstrip .bs-logo{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:17px;background:linear-gradient(145deg,var(--accent),var(--accent-ink))}
  .brandstrip .bs-txt{flex:1;min-width:0} .brandstrip .bs-txt b{display:block;font-size:14.5px} .brandstrip .bs-txt small{color:var(--muted);font-size:12.5px}
  .brandstrip .bs-go{color:var(--accent-ink);flex:none;display:inline-flex} .brandstrip .bs-go .ic{width:18px;height:18px}

  .seclabel{display:flex;align-items:center;gap:8px;margin:24px 0 12px;font-weight:700;font-size:15px}
  .seclabel .ic{width:18px;height:18px;color:var(--accent-ink)}
  .backlink{display:inline-flex;align-items:center;gap:5px;border:none;background:none;color:var(--muted);font-size:13.5px;font-weight:600;padding:6px 0;margin-bottom:4px;transition:color .2s var(--ease)}
  .backlink:hover{color:var(--accent-ink)} .backlink .ic{width:16px;height:16px}
  .tracks{display:grid;gap:14px} @media(min-width:600px){.tracks{grid-template-columns:1fr 1fr}}
  .track{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);transition:transform .22s var(--ease),border-color .22s var(--ease),box-shadow .22s var(--ease)}
  .track:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow-lg)} .track:active{transform:translateY(-1px) scale(.995)}
  .track .tile{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;margin-bottom:4px;background:linear-gradient(150deg,var(--accent),var(--accent-ink))}
  .track.alt .tile{background:linear-gradient(150deg,var(--violet),#4f40a8)} .track .tile .ic{width:24px;height:24px}
  .track b{font-size:18px} .track small{color:var(--muted);font-size:13.5px;line-height:1.5}
  .track .go{margin-top:6px;display:inline-flex;align-items:center;gap:6px;color:var(--accent-ink);font-weight:600;font-size:13.5px} .track.alt .go{color:var(--violet)} .track .go .ic{width:16px;height:16px}
  .toggle{width:48px;height:28px;border-radius:999px;border:none;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s var(--ease)}
  .toggle .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s var(--ease)}
  .toggle.on{background:var(--violet)} .toggle.on .knob{left:23px}
  .warmcard{border-color:var(--violet)!important;background:var(--violet-soft)} .warmcard .ic{width:22px;height:22px;color:var(--violet);flex:none}
  .modebanner{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:11px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent-ink);font-size:13.5px;font-weight:600}
  .modebanner.v{background:var(--violet-soft);color:var(--violet)} .modebanner .ic{width:18px;height:18px} .modebanner a,.modebanner .bnlink{margin-left:auto;font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;color:inherit;border:none;background:none;font-family:inherit;padding:0}
  html.snappy .card,html.snappy .mode,html.snappy .tip,html.snappy .track{animation-duration:.12s!important}
  .mode{display:flex;flex-direction:column;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:17px;gap:7px;box-shadow:var(--shadow);transition:transform .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease)}
  .mode:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .mode .me{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)} .mode .me .ic{width:22px;height:22px}
  .mode b{font-size:16px} .mode small{color:var(--muted);font-size:13px}

  label.fld{display:block;font-size:13px;font-weight:600;margin:16px 0 7px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;min-height:38px;padding:7px 13px;font-size:13.5px;transition:all .18s var(--ease)}
  .chip:hover{border-color:var(--accent)} .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:11px;min-height:46px;padding:12px 20px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;box-shadow:0 4px 12px rgba(15,110,106,.25);transition:background .2s var(--ease),transform .12s var(--ease)}
  .btn:hover{background:var(--accent-ink)} .btn:active{transform:scale(.97) translateY(1px)} .btn .ic{width:18px;height:18px}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none} .btn.ghost:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  input[type=search],input[type=text],input[type=email],textarea{font-family:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
  input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .runtop{display:flex;align-items:center;gap:12px;margin:2px 0 14px;font-size:13px;color:var(--muted)}
  .bar{height:8px;border-radius:6px;background:var(--bg2);overflow:hidden;flex:1}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .7s var(--ease)}
  .qtext{font-size:19px;font-weight:600;margin:8px 0 16px;font-family:Georgia,serif;line-height:1.45}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px 15px;margin-bottom:10px;font-size:15px;transition:border-color .15s var(--ease),background .15s var(--ease),transform .12s var(--ease)}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)} .opt:active:not(:disabled){transform:scale(.99)}
  .opt .k{flex:none;width:27px;height:27px;border-radius:8px;background:var(--bg2);color:var(--muted);display:grid;place-items:center;font-weight:700;font-size:13px}
  .opt.correct{border-color:var(--good);background:var(--good-soft)} .opt.correct .k{background:var(--good);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default}
  .feedback{border-radius:12px;padding:13px 15px;margin:4px 0 12px;font-size:14.5px}
  .feedback.ok{background:var(--good-soft);color:var(--good)} .feedback.no{background:var(--bad-soft);color:var(--bad)}
  .feedback b{font-weight:700} .feedback .sub{display:block;margin-top:3px;color:var(--ink);font-weight:500;opacity:.92}
  .whybtn{border:1px solid var(--line);background:var(--card);color:var(--accent-ink);border-radius:10px;min-height:40px;padding:9px 14px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:border-color .2s var(--ease),background .2s var(--ease)}
  .whybtn:hover{border-color:var(--accent);background:var(--accent-soft)} .whybtn .ic{width:16px;height:16px}
  .whybox{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:14px 16px;margin:12px 0 4px;font-size:14px;line-height:1.55}
  .whybox h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent-ink);font-family:system-ui;display:flex;align-items:center;gap:7px}
  .whybox .ic{width:16px;height:16px}

  .acc{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
  .acc>summary{padding:15px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:11px}
  .acc>summary::-webkit-details-marker{display:none}
  .acc>summary .n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
  .acc>summary .caret{margin-left:auto;color:var(--muted);transition:transform .25s var(--ease)} .acc[open]>summary .caret{transform:rotate(90deg)}
  .acc[open]>summary{border-bottom:1px solid var(--line)} .acc .body{padding:6px 18px 16px}
  .acc h4{margin:14px 0 6px;font-size:13px;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.4px;font-family:system-ui}
  .acc ul{margin:0;padding-left:20px} .acc li{margin:6px 0;font-size:14.5px;line-height:1.5}
  .acc.hack li::marker{content:"💡  "} .acc.hack>summary .n{background:var(--violet-soft);color:var(--violet)}
  mark{background:var(--amber-soft);color:inherit;padding:0 2px;border-radius:3px}

  .tip{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}
  .tip h4{margin:0 0 5px;font-size:14.5px;display:flex;align-items:center;gap:8px;font-family:system-ui} .tip h4 .ic{width:18px;height:18px;color:var(--violet)}
  .tip p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}
  .tipgrid{display:grid;gap:12px} @media(min-width:620px){.tipgrid{grid-template-columns:1fr 1fr}}

  .results .big{font-family:Georgia,serif;font-size:54px;text-align:center;margin:8px 0;line-height:1}
  .center{text-align:center} .hide{display:none!important}
  footer{margin-top:34px;text-align:center;color:var(--muted);font-size:13px}
  .kbd{font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--muted)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.03)}100%{transform:scale(1)}}
  @keyframes optIn{from{opacity:0;transform:translateX(-9px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: no-preference){
    .card,.mode,.tip{animation:fadeUp .34s var(--ease) both}
    .acc{animation:fadeUp .32s var(--ease) both}
    .opt{animation:optIn .3s var(--ease) backwards;animation-delay:var(--oi,0s)}
    .chip.on{animation:pop .22s var(--ease)}
    .feedback{animation:slideIn .26s var(--ease) both} .whybox{animation:slideIn .28s var(--ease) .07s both} .opt.correct{animation:pop .34s var(--ease)}
  }
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  /* ---- Premium launch (Gemini-stijl) + header-logo gloed ---- */
  @property --bes-a{syntax:'<angle>';initial-value:0deg;inherits:false}
  #splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(125% 125% at 50% 38%,var(--bg2) 0%,var(--bg) 68%);transition:opacity .6s var(--ease),transform .7s var(--ease)}
  #splash.hide{opacity:0;transform:scale(1.07);pointer-events:none}
  .sp-inner{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
  .sp-mark{position:relative;width:100px;height:100px;display:grid;place-items:center}
  .sp-mark::before{content:"";position:absolute;inset:-16px;border-radius:34px;z-index:0;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));filter:blur(17px);opacity:.75}
  .sp-mark::after{content:"";position:absolute;inset:-3px;border-radius:27px;z-index:1;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));padding:3px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .sp-logo{position:relative;z-index:2;width:92px;height:92px;border-radius:24px;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:46px;background:linear-gradient(150deg,var(--accent),var(--accent-ink));box-shadow:0 14px 38px rgba(15,110,106,.4)}
  .sp-spark{position:absolute;z-index:3;top:-7px;right:-7px;width:30px;height:30px;color:#fff;filter:drop-shadow(0 2px 7px rgba(0,0,0,.35))}
  .sp-name{position:relative;font-family:Georgia,serif;font-size:26px;font-weight:700;letter-spacing:-.01em;color:var(--ink);overflow:hidden}
  .sp-name::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(-130%)}
  .sp-tag{font-size:13px;color:var(--muted);margin-top:-8px;letter-spacing:.03em}
  @media (prefers-reduced-motion: no-preference){
    .sp-mark::before{animation:bes-spin 3s linear infinite,bes-breathe 2.4s var(--ease) infinite}
    .sp-mark::after{animation:bes-spin 3s linear infinite}
    .sp-logo{animation:bes-pop .7s var(--ease) both}
    .sp-spark{animation:bes-pop .6s var(--ease) .12s both,bes-twinkle 1.9s var(--ease) .9s infinite}
    .sp-name{animation:bes-rise .6s var(--ease) .14s both}
    .sp-name::after{animation:bes-shimmer 1.5s var(--ease) .5s 1}
    .sp-tag{animation:bes-rise .6s var(--ease) .26s both}
  }
  @keyframes bes-spin{to{--bes-a:360deg}}
  @keyframes bes-breathe{0%,100%{opacity:.55;filter:blur(16px)}50%{opacity:.95;filter:blur(22px)}}
  @keyframes bes-shimmer{to{transform:translateX(130%)}}
  @keyframes bes-twinkle{0%,100%{opacity:1;transform:scale(1) rotate(0deg)}50%{opacity:.65;transform:scale(.82) rotate(18deg)}}
  @keyframes bes-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  /* mobiel: header-knoppen alleen iconen zodat niks zijwaarts overflowt */
  @media(max-width:440px){ header.top .iconbtn span{display:none} header.top .iconbtn{padding:7px 9px;min-width:38px;justify-content:center} .topin{gap:8px} }
</style>
</head>
<body>
<div id="splash"><div class="sp-inner">
  <div class="sp-mark">
    <div class="sp-logo">R2</div>
    <svg class="sp-spark" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.5c.4 4.6 2.4 6.6 7 7-4.6.4-6.6 2.4-7 7-.4-4.6-2.4-6.6-7-7 4.6-.4 6.6-2.4 7-7Z"/></svg>
  </div>
  <div><div class="sp-name">Onderzoeksmethoden II (RMT)</div><div class="sp-tag">slim oefenen voor je examen</div></div>
</div></div>
<header class="top">
  <div class="topin">

<script>
window.RMT2 = {"questions":[{"t":"1","q":"Wat vat de theorie-data cyclus het beste samen?","o":["Theorieën ontstaan volledig los van data en hoeven nooit getest te worden","Je leidt hypotheses af uit theorieën om via testen aan data te komen, maar zonder data kun je ook geen theorieën vormen","Data komt altijd eerst, waardoor theorieën overbodig zijn geworden","Hypotheses toetsen kan enkel wanneer je geen theorie als vertrekpunt neemt"],"a":1,"u":"De cyclus is wederkerig, je trekt hypotheses uit theorieën om via testen data te krijgen, maar zonder data kun je geen theorieën vormen."},{"t":"1","q":"Een onderzoeker vertrekt zonder vaste theorie en speurt in observaties naar nieuwe patronen en algemene inzichten. Welk type onderzoek en welke redeneervorm is dit?","o":["Confirmatory onderzoek via deductie","Confirmatory onderzoek via inductie","Exploratory onderzoek via deductie","Exploratory onderzoek via inductie"],"a":3,"u":"Exploratory onderzoek werkt inductief, je gaat van observaties naar algemene inzichten zonder van een vaste theorie te vertrekken."},{"t":"1","q":"Wat is kenmerkend voor confirmatory (deductief) onderzoek?","o":["Je zoekt zonder vooraf idee naar toevallige patronen in de data","Je vertrekt van een bestaande theorie en toetst een afgeleide hypothese met data","Je verzamelt eerst data en bedenkt pas achteraf een theorie","Je vermijdt elke hypothese om bias te voorkomen"],"a":1,"u":"Bij confirmatory onderzoek redeneer je deductief van theorie naar hypothese, die je vervolgens met data toetst."},{"t":"1","q":"In het Harlow-experiment bleven de aapjes vooral bij de zachte 'mama' zonder eten en gingen ze enkel voor voedsel naar de andere kooi. Welke theorie krijgt hierdoor steun?","o":["De cupboard theory, want hechting draait om wie het eten geeft","Geen van beide, want er ontbrak een controlegroep","De contact comfort theory, want hechting draait om comfort en liefde","Beide even sterk, want de aapjes gebruikten allebei de kooien"],"a":2,"u":"De aapjes verbleven voornamelijk in de comfortkooi, wat wijst op de contact comfort theory, hechting draait om comfort en liefde en niet om wie het eten geeft."},{"t":"1","q":"Twee theorieën verklaren een verschijnsel even goed, maar de ene steunt op minder aannames. Welk principe zegt dat je de eenvoudigste kiest?","o":["Occam's Razor (parsimonie)","Georganiseerd scepticisme","Directionality problem","Present/present bias"],"a":0,"u":"Occam's Razor stelt dat bij twee even goede theorieën de meest spaarzame, met de minste aannames, wint. De simpelste verklaring is de beste."},{"t":"1","q":"Waarom is replicatie zo belangrijk voor goede wetenschap?","o":["Omdat een theorie definitief bewezen is zodra ze één keer blijkt te kloppen","Omdat replicatie een theorie onfalsifieerbaar maakt","Omdat een theorie nooit echt bewezen kan worden, alleen gefalsifieerd, en meer bevestigende data ons zekerder maakt","Omdat één sterk onderzoek volstaat en replicatie dus overbodig is"],"a":2,"u":"Een theorie kan nooit echt bewezen worden, enkel gefalsifieerd. Hoe meer data dezelfde evidentie opleveren, hoe zekerder we worden, daarom is replicatie essentieel."},{"t":"1","q":"Een onderzoeker doet labo-onderzoek naar of kinderen beter presteren op een test na meditatie, met het oog op latere praktische toepassing maar zonder directe klinische implicaties. Welk soort onderzoek is dit?","o":["Basis onderzoek","Translationeel onderzoek","Toegepast onderzoek","Exploratory onderzoek"],"a":1,"u":"Translationeel onderzoek is nog vrij abstract zoals basis onderzoek, maar gebeurt met het oog op latere praktische implicaties. Het meditatie-labo is precies dat voorbeeld."},{"t":"1","q":"Het bloodletting-verhaal van Dr Rush toont vooral het belang van welk element in onderzoek?","o":["Een grotere steekproef, om de externe validiteit te verhogen","Willekeurige selectie, om naar de populatie te generaliseren","Occam's Razor, om de simpelste verklaring te kiezen","Een controlegroep, om te weten of het herstel echt door de behandeling komt"],"a":3,"u":"Zonder controlegroep zie je enkel de gevallen die genezen. Pas door te vergelijken met een groep zonder behandeling weet je of bloodletting echt effect heeft."},{"t":"1","q":"Iemand denkt dat een supplement werkt omdat hij zich beter voelt als hij het inneemt, maar negeert de keren dat hij zich ook zonder supplement goed voelde. Welke cognitieve bias is dit?","o":["Availability heuristic","A good story-bias","Present/present bias","Bias blind spot"],"a":2,"u":"Bij de present/present bias let je enkel op situaties waarin twee dingen samen voorkomen en negeer je de gevallen waarin er één ontbreekt, precies zoals bij dit supplement."},{"t":"1","q":"In een experiment worden uitsluitend mannen getest. Wat is 'gender' dan binnen dat experiment?","o":["Een afhankelijke variabele","Een onafhankelijke variabele","Een constante","Een confounder"],"a":2,"u":"Iets is pas een variabele als het varieert in het experiment. Neem je alleen mannen, dan varieert gender niet en is het een constante."},{"t":"1","q":"'Medewerkers die met veel agressieve klanten omgaan, hebben meer kans op een burnout.' Welk type claim is dit?","o":["Frequentie claim","Association claim","Causal claim","Construct claim"],"a":1,"u":"Woorden als 'meer kans op' duiden een samenhang aan zonder oorzaak-gevolg. Het is een association claim, niet causaal, want er kan een derde variabele meespelen."},{"t":"2","q":"Wat betekent 'deception through omission' (misleiden) binnen ethisch onderzoek?","o":["Je geeft de deelnemer niet alle informatie, zonder actief te liegen","Je geeft de deelnemer bewust foute informatie over de studie","Je verzint volledig nieuwe data om je hypothese te steunen","Je haalt deelnemers uit je dataset na de analyse"],"a":0,"u":"Bij misleiden (omission) houd je informatie achter zonder actief te liegen. Actief foute informatie geven valt onder 'commission' (liegen)."},{"t":"2","q":"In welk geval is debriefen volgens de richtlijnen sowieso verplicht?","o":["Alleen bij dierenonderzoek","Enkel wanneer de ethische commissie erom vraagt","Zodra je in je studie deceptie hebt toegepast","Nooit, het blijft altijd optioneel"],"a":2,"u":"Debriefen is verplicht zodra je aan deceptie doet, en vaak ook bij studies met academisch nut. Voor de rest wordt het sterk aangeraden."},{"t":"2","q":"Een onderzoeker bekijkt eerst de binnengekomen resultaten en verzint pas daarna een hypothese die netjes bij die data past. Hoe heet deze twijfelachtige praktijk?","o":["HARKing","Fabricatie","Falsificatie","Plagiaat"],"a":0,"u":"HARKing staat voor het opstellen of aanpassen van je hypothese nadat je de data al hebt gezien. Het is een QRS, geen regelrechte fraude zoals fabricatie."},{"t":"2","q":"Wat is het verschil tussen fabricatie en falsificatie van onderzoeksdata?","o":["Fabricatie is data van iemand anders stelen, falsificatie is je hypothese achteraf veranderen","Fabricatie is data verzinnen zonder onderzoek, falsificatie is bestaande data aanpassen of deelnemers weglaten","Beide betekenen hetzelfde, namelijk plagiaat plegen","Fabricatie is bestaande data aanpassen, falsificatie is helemaal nieuwe data verzinnen"],"a":1,"u":"Bij fabricatie verzin je data zonder echt onderzoek te doen. Bij falsificatie heb je wel echte data, maar verander of verwijder je gegevens, vaak om je hypothese te steunen."},{"t":"2","q":"Waarom kiezen onderzoekers er soms bewust voor om deceptie toe te passen?","o":["Omdat het goedkoper is dan deelnemers volledig informeren","Omdat de ethische commissie deceptie altijd verplicht stelt","Omdat deelnemers de informed consent toch niet lezen","Omdat volledige informatie het gedrag van deelnemers, en dus de validiteit, zou beïnvloeden"],"a":3,"u":"Deceptie wordt ingezet wanneer volledige informatie het gedrag zou sturen en zo de validiteit zou aantasten. Het mag alleen onder voorwaarden, met toestemming en verplichte debriefing achteraf."},{"t":"2","q":"Wat is de kerntaak van een Institutional Review Board (ethische commissie) bij onderzoek?","o":["De data verzamelen en analyseren voor de onderzoekers","Vooraf nagaan of het onderzoek ethisch verantwoord is en mag doorgaan","Zorgen dat de resultaten in een wetenschappelijk tijdschrift verschijnen","Deelnemers werven en hen betalen voor deelname"],"a":1,"u":"Een ethische commissie beoordeelt je onderzoek vooraf op ethische aspecten om te bepalen of je het mag uitvoeren. Bij totaal geen risico op negatieve gevolgen is dit niet altijd nodig."},{"t":"2","q":"Welke informatie hoort volgens de richtlijnen thuis in een geldige informed consent?","o":["Enkel de naam en de leeftijd van de onderzoeker","Alleen de einddatum van de studie","De procedure, risico's, voordelen en wat er met de data gebeurt","Uitsluitend de vergoeding die de deelnemer krijgt"],"a":2,"u":"Informed consent informeert deelnemers over de procedure, de risico's, de voordelen, wat er met hun data gebeurt en of er wordt opgenomen of gefilmd. Een bekend probleem is dat deelnemers dit vaak niet lezen."},{"t":"2","q":"Waar staat de 'R' van Refinement (verfijning) voor binnen de 3 R's van dierenonderzoek?","o":["Dieren waar mogelijk vervangen door bijvoorbeeld computermodellen","Zo weinig mogelijk dieren gebruiken met nog betrouwbare resultaten","Het onderzoek zo diervriendelijk mogelijk maken door stress en pijn te minimaliseren","De resultaten herhaaldelijk laten controleren door andere labs"],"a":2,"u":"Refinement betekent het onderzoek zo diervriendelijk mogelijk maken door stress en pijn te beperken. Vervanging is Replacement en zo min mogelijk dieren gebruiken is Reduction."},{"t":"3","q":"Wat is volgens de tekst de verhouding tussen betrouwbaarheid en validiteit?","o":["Validiteit is een noodzakelijke voorwaarde voor betrouwbaarheid","Betrouwbaarheid en validiteit betekenen precies hetzelfde","Een test kan valide zijn zonder ooit betrouwbaar te meten","Betrouwbaarheid is nodig voor validiteit, maar op zich niet genoeg"],"a":3,"u":"De tekst stelt dat betrouwbaarheid een noodzakelijke, maar geen voldoende voorwaarde is voor validiteit. Een test moet dus eerst consistent meten voordat hij geldig kan zijn."},{"t":"3","q":"Een onderzoeker laat dezelfde vragenlijst tweemaal invullen door dezelfde groep, met enkele weken ertussen, en vergelijkt de scores. Welke vorm van betrouwbaarheid onderzoekt hij?","o":["Interne consistentie","Test-hertest betrouwbaarheid","Inhoudsvaliditeit","Convergente validiteit"],"a":1,"u":"Bij test-hertest laat je de test op twee tijdstippen afleggen. De scores horen te correleren omdat het construct stabiel wordt verondersteld."},{"t":"3","q":"Waarom verwacht je bij test-hertest betrouwbaarheid dat de twee metingen sterk samenhangen?","o":["Omdat de vragen elke keer anders worden geformuleerd","Omdat er telkens andere beoordelaars scoren","Omdat het gemeten construct stabiel hoort te zijn over de tijd","Omdat de steekproef elke keer verandert"],"a":2,"u":"Een stabiel construct hoort op verschillende momenten ongeveer dezelfde score te geven, dus horen de test- en hertestscores samen te hangen."},{"t":"3","q":"Voor welke situatie is interbeoordelaarsbetrouwbaarheid volgens de tekst vooral bedoeld?","o":["Bij tests met heel veel items op een Likertschaal","Bij observatie of kwalitatief onderzoek","Bij het meten van fysiologische variabelen zoals bloeddruk","Bij het voorspellen van toekomstig gedrag"],"a":1,"u":"Volgens de tekst wordt interbeoordelaarsbetrouwbaarheid vooral gebruikt bij observatie of kwalitatief onderzoek, waar de scores van beide observatoren met elkaar zouden moeten correleren."},{"t":"3","q":"Twee observatoren beoordelen gedrag dat wordt genoteerd als een categorische (nominale) variabele. Welke maat gebruik je dan volgens de tekst in plaats van de gewone correlatie r?","o":["Cronbach's Alfa","Omega","Mahalanobis D","Cohen's Kappa"],"a":3,"u":"Normaal gebruik je r voor interbeoordelaarsbetrouwbaarheid, maar bij een categorische (nominale) variabele gebruik je Cohen's Kappa."},{"t":"3","q":"Wat controleer je met interne consistentie betrouwbaarheid?","o":["Of items die hetzelfde construct meten goed met elkaar correleren","Of twee verschillende observatoren hetzelfde scoren","Of de test op twee tijdstippen dezelfde score geeft","Of de test een bepaald gedrag kan voorspellen"],"a":0,"u":"Interne consistentie is voor tests met meerdere items: items die hetzelfde construct meten horen onderling goed te correleren."},{"t":"3","q":"Waarom is Omega volgens de tekst vaak beter dan Cronbach's Alfa voor interne consistentie?","o":["Omdat Omega geschikt is voor nominale variabelen","Omdat Alfa ervan uitgaat dat alle items even zwaar wegen, terwijl sommige items in werkelijkheid harder doorwegen","Omdat Omega geen cut-offwaarde nodig heeft","Omdat Alfa alleen bij observatie werkt"],"a":1,"u":"Cronbach's Alfa gaat ervan uit dat alle items dezelfde waarde hebben, terwijl sommige items in werkelijkheid zwaarder doorwegen. Omega houdt daar rekening mee en is daarom beter."},{"t":"3","q":"Welke cut-offwaarde wordt volgens de tekst typisch gehanteerd bij Cronbach's Alfa?","o":["0,50","0,70","0,90","0,30"],"a":1,"u":"De tekst noemt 0,70 als de typische cut-offwaarde voor Cronbach's Alfa."},{"t":"3","q":"Wat wordt bedoeld met content validity (inhoudsvaliditeit)?","o":["Of de test een bepaald gedrag in de toekomst kan voorspellen","Of de meting alle relevante aspecten van het construct bevat","Of participanten vinden dat de test een goede meting lijkt","Of twee verwante constructen ook samenhangen in de scores"],"a":1,"u":"Inhoudsvaliditeit gaat over de vraag of de meting alle relevante aspecten van het construct dekt. Een IQ-test hoort bijvoorbeeld niet enkel wiskunde te meten."},{"t":"3","q":"Wat doe je volgens de tekst bij face validity (indruksvaliditeit)?","o":["Je berekent de correlatie tussen twee testafnames","Je vergelijkt twee groepen met en zonder diagnose","Je vraagt aan participanten of ze vinden dat de test een goede meting lijkt voor het construct","Je controleert of de standaarddeviatie van de antwoorden klein is"],"a":2,"u":"Face validity is een subjectieve manier om constructvaliditeit te beoordelen: je vraagt participanten of de test volgens hen een goede meting van het construct lijkt."},{"t":"3","q":"Face validity en content validity worden in de tekst omschreven als manieren om constructvaliditeit te beoordelen. Welk kenmerk delen ze vooral?","o":["Ze zijn beide subjectief","Ze zijn beide puur statistisch","Ze vereisen beide twee meetmomenten","Ze werken beide alleen met nominale variabelen"],"a":0,"u":"De tekst noemt face validity en content validity de twee subjectieve manieren om constructvaliditeit te beoordelen, tegenover de empirische manieren zoals criterium-, convergente en discriminante validiteit."},{"t":"3","q":"Een onderzoeker wil weten of een IQ-test schools succes kan voorspellen. Welke vorm van validiteit onderzoekt hij daarmee?","o":["Inhoudsvaliditeit","Face validity","Criteriumvaliditeit","Discriminante validiteit"],"a":2,"u":"Criteriumvaliditeit gaat over de relatie tussen het construct en bepaald gedrag, bijvoorbeeld of een IQ-test schools succes voorspelt."},{"t":"3","q":"Hoe toets je criteriumvaliditeit volgens het known groups paradigm?","o":["Je vergelijkt scores op twee tijdstippen bij dezelfde groep","Je laat een groep met en een groep zonder diagnose een test afleggen en kijkt of de test accuraat onderscheidt","Je vraagt participanten of de test er geloofwaardig uitziet","Je bekijkt of alle items even zwaar wegen"],"a":1,"u":"In het known groups paradigm laat je bijvoorbeeld mensen met en zonder diagnose een test afleggen die geluk meet, om te zien of de test accuraat onderscheid maakt tussen de groepen."},{"t":"3","q":"Je verwacht dat twee constructen positief samenhangen. De tests die deze constructen meten vertonen inderdaad datzelfde positieve verband. Welke validiteit ondersteunt dit?","o":["Discriminante validiteit","Inhoudsvaliditeit","Test-hertest betrouwbaarheid","Convergente validiteit"],"a":3,"u":"Convergente validiteit: als je een verband (positief of negatief) tussen twee variabelen verwacht, horen de tests die deze constructen meten datzelfde verband te volgen."},{"t":"3","q":"Wat verwacht je bij goede discriminante validiteit tussen twee constructen waarvan je denkt dat ze niets met elkaar te maken hebben?","o":["Dat de tests van deze twee variabelen ook geen verband vertonen","Dat de tests een sterk positief verband vertonen","Dat de tests op twee tijdstippen dezelfde score geven","Dat beide tests dezelfde items bevatten"],"a":0,"u":"Discriminante validiteit betekent dat als je geen verband tussen twee variabelen verwacht, de tests die deze variabelen meten ook geen verband horen te vertonen."},{"t":"4","q":"Wat is het verschil tussen de 'sampling frame' en de uiteindelijke 'sample' (n)?","o":["De sampling frame is de subgroep die je uit je population of interest haalt, terwijl de sample het deel van die subgroep is dat echt meedoet","De sampling frame is de hele populatie, terwijl de sample het deel is dat je wilt onderzoeken","De sampling frame en de sample zijn twee namen voor exact hetzelfde ding","De sampling frame is altijd kleiner dan de sample omdat mensen afvallen"],"a":0,"u":"De sampling frame is de subgroep die je uit de population of interest trekt, bv. psychologiestudenten aan de VUB. De sample is het deel daarvan dat uiteindelijk echt participeert, want sommigen willen niet meedoen."},{"t":"4","q":"Waar verwijst externe validiteit precies naar?","o":["De mate waarin je binnen je experiment zeker bent over oorzaak en gevolg","De mate waarin je meetinstrument echt meet wat het moet meten","De mate waarin je de bevindingen uit je sample kunt generaliseren naar de populatie","De mate waarin je resultaat statistisch significant is"],"a":2,"u":"Externe validiteit gaat over generaliseerbaarheid: in hoeverre kun je de vondsten op basis van je sample doortrekken naar de hele populatie."},{"t":"4","q":"Wat is volgens de tekst het belangrijkste voor de externe validiteit van een studie?","o":["Een zo groot mogelijke steekproef nemen","De manier waarop je aan je sample komt","Een korte, gepersonaliseerde survey gebruiken","Zoveel mogelijk controlevariabelen meten"],"a":1,"u":"De steekproefgrootte is niet echt doorslaggevend voor de externe validiteit. Hoe je aan je sample komt, bv. via random sampling, is veel belangrijker."},{"t":"4","q":"Wat gebeurt er bij 'sampling bias'?","o":["Het gemiddelde verschil tussen elk steekproefresultaat en de echte populatiewaarde","De onderzoeker verwijdert bewust uitschieters uit de dataset","De steekproef is te klein om betrouwbare conclusies te trekken","Bepaalde groepen uit de populatie hebben meer kans om in de steekproef te belanden dan andere"],"a":3,"u":"Bij sampling bias hebben sommige groepen een grotere kans om in de steekproef te komen, waardoor de resultaten scheefgetrokken kunnen worden. De oplossing is een onbiased, representatieve steekproef zoals random sampling."},{"t":"4","q":"Bij welke steekproeftechniek geef je iedereen in de populatie een nummer en laat je een computer willekeurige nummers kiezen?","o":["Cluster sampling","Systematic sampling","Simple random sampling","Quota sampling"],"a":2,"u":"Bij simple random sampling heb je data van iedereen in de populatie en kies je volledig ad random personen, bv. door ze te nummeren en een computer random nummers te laten genereren. Iedereen heeft evenveel kans."},{"t":"4","q":"Je wilt de Belgische bevolking onderzoeken: eerst kies je via clusters een aantal steden, dan random enkele straten, dan om de zoveel huisnummers een adres. Welke techniek gebruik je?","o":["Multistage sampling","Stratified random sampling","Convenience sampling","Snowball sampling"],"a":0,"u":"Multistage sampling combineert meerdere technieken: eerst cluster sampling (steden), dan random sampling (straten), dan systematic sampling (huisnummers)."},{"t":"4","q":"Waarin verschilt een stratified random sample van een cluster sample?","o":["Bij een stratified sample bevraag je iedereen in een gekozen groep, bij een cluster sample slechts een paar per groep","Bij een stratified sample verdeel je in subgroepen en selecteer je random binnen elke subgroep, bij een cluster sample kies je random clusters waarvan je iedereen bevraagt","Bij een stratified sample selecteer je niet random, bij een cluster sample wel","Er is geen verschil, beide verdelen de populatie in strata"],"a":1,"u":"Bij een stratified random sample verdeel je de populatie in strata en trek je random mensen uit elke strata. Bij een cluster sample kies je random hele clusters en bevraag je iedereen binnen die clusters."},{"t":"4","q":"Wat betekent 'oversampling' bij een gestratificeerde steekproef?","o":["Je neemt per ongeluk meer mensen dan je populatie groot is","Je neemt zoveel mensen dat de margin of error nul wordt","Het aandeel van subgroepen in je sample komt niet overeen met de verdeling in je populatie","Je selecteert dezelfde persoon meerdere keren"],"a":2,"u":"Oversampling betekent dat de verhoudingen van subgroepen in je sample niet representatief zijn voor de populatie, bv. 5 vrouwen en 5 mannen terwijl de populatie 80% vrouwen telt."},{"t":"4","q":"Wat houdt 'raking' in als correctietechniek?","o":["Extra mensen bijwerven tot elke subgroep gelijk vertegenwoordigd is","Uitschieters uit de dataset verwijderen","De steekproef opnieuw random trekken","Bepaalde data zwaarder of lichter laten doorwegen om een accurater populatiebeeld te krijgen"],"a":3,"u":"Met raking laat je bepaalde data zwaarder doorwegen dan andere, bv. de data van mannen minder gewicht geven en die van vrouwen meer, zodat het beeld beter aansluit bij de populatie."},{"t":"4","q":"Welke steekproefmethode is een biased (niet-representatieve) techniek?","o":["Simple random sampling","Stratified random sampling","Convenience sampling","Systematic sampling"],"a":2,"u":"Convenience sampling is een biased methode: je selecteert participanten omdat ze makkelijk te bereiken of te overtuigen zijn, bv. psychologiestudenten of een poll op een website (zelfselectie)."},{"t":"4","q":"Wanneer is een biased sample volgens de tekst vooral problematisch?","o":["Altijd, een biased sample maakt elke conclusie ongeldig","Wanneer je frequentieclaims maakt, omdat externe validiteit dan cruciaal is","Alleen bij causale of associatieclaims","Alleen wanneer de steekproef ook nog eens klein is"],"a":1,"u":"Bij frequentieclaims is externe validiteit cruciaal en is bias dus problematisch. Bij causale of associatieclaims is het minder problematisch, tenzij datgene dat de sample biased maakt relevant is voor wat je meet."},{"t":"4","q":"Waar staat de afkorting WEIRD voor bij het bekritiseren van steekproeven met psychologiestudenten?","o":["White, educated, industrialised, rich, democratic","Wealthy, ethical, informed, rational, diverse","Western, employed, insured, resident, digital","Willing, engaged, invested, reliable, dedicated"],"a":0,"u":"WEIRD staat voor white, educated, industrialised, rich en democratic. Slechts ongeveer 12% van de wereldbevolking valt onder deze criteria, dus zulke samples zijn niet representatief."},{"t":"5","q":"In een experiment past de onderzoeker de portiegrootte aan om te bekijken hoeveel mensen eten. Wat is hier de onafhankelijke variabele?","o":["De portiegrootte die de onderzoeker zelf instelt","De hoeveelheid voedsel die de deelnemers uiteindelijk opeten","De kleur van het bord die overal constant gehouden wordt","De gemiddelde leeftijd van de deelnemersgroep"],"a":0,"u":"De onafhankelijke variabele is wat de onderzoeker manipuleert, zoals de grootte van het bord of de portie. De gegeten hoeveelheid is juist de afhankelijke variabele."},{"t":"5","q":"Waarom houdt een onderzoeker bepaalde variabelen, zoals de kleur van het bord, bewust constant tussen de groepen?","o":["Om de afhankelijke variabele kunstmatig groter te maken","Zodat de groepen enkel op de onafhankelijke variabele verschillen","Om meer deelnemers te kunnen opnemen in de studie","Om de manipulatie te verbergen voor de deelnemers"],"a":1,"u":"Controlevariabelen worden constant gehouden zodat de groepen alleen op de onafhankelijke variabele van elkaar verschillen. Verschillen ze ook op andere zaken, dan krijg je confounders."},{"t":"5","q":"Binnen het potential outcomes framework heeft elke deelnemer twee mogelijke uitkomsten, Y(0) en Y(1). Waarom kan je die twee nooit allebei bij dezelfde persoon waarnemen?","o":["Omdat de afhankelijke variabele te veel ruis bevat","Omdat random toewijzing de twee uitkomsten uitmiddelt","Omdat een persoon maar in een van beide condities kan zitten, wat het fundamentele probleem van causale inferentie is","Omdat de ethische commissie slechts een van beide uitkomsten laat meten"],"a":2,"u":"Y(0) is de uitkomst in de controlegroep en Y(1) in de experimentele groep. Per deelnemer zie je maar een van beide, en dat heet het fundamentele probleem van causale inferentie."},{"t":"5","q":"Wat drukt het average treatment effect (ATE) uit?","o":["Het verschil in aantal deelnemers tussen de twee groepen","De kans dat een deelnemer aan zelfselectie doet","De mate waarin de controlevariabelen constant gebleven zijn","Het gemiddelde effect van de behandeling, als het gemiddelde verschil tussen Y(1) en Y(0)"],"a":3,"u":"Het ATE is gedefinieerd als E(Y(1) - Y(0)) en geeft het gemiddelde effect van de behandeling over de deelnemers in beide groepen."},{"t":"5","q":"Een onderzoeker wil kunnen zeggen dat de onafhankelijke variabele de afhankelijke variabele veroorzaakt. Welke drie voorwaarden moeten daarvoor vervuld zijn?","o":["Covariantie, de juiste tijdvolgorde en het uitsluiten van alternatieve verklaringen","Een grote steekproef, hoge power en een dubbele meting","Random toewijzing, matching en counterbalancing","Een pretest, een posttest en minstens een controlevariabele"],"a":0,"u":"Voor causaliteit heb je covariantie (de groepen verschillen op de DV), de juiste tijdvolgorde (de IV komt voor de DV) en het uitsluiten van alternatieve verklaringen zoals confounds en volgorde-effecten nodig."},{"t":"5","q":"Wat is kenmerkend voor een design confound als bedreiging voor de interne validiteit?","o":["Een deelnemer raadt het doel van de studie en past zijn gedrag aan","De volgorde van de condities beinvloedt de deelnemer","Een derde variabele varieert systematisch mee met de onafhankelijke variabele die je aanpast","De onderzoeker meet per ongeluk de verkeerde afhankelijke variabele"],"a":2,"u":"Bij een design confound loopt een derde variabele systematisch mee met de gemanipuleerde IV. Daardoor weet je niet of het effect door de IV of door die confounder komt."},{"t":"5","q":"Bij welk type design speelt het selectie-effect als bedreiging, en wat zijn de aangewezen oplossingen?","o":["Vooral bij between-subjects designs, op te lossen met random assignment en matching","Vooral bij within-subjects designs, op te lossen met counterbalancing","Enkel bij concurrent measures, op te lossen met een baseline-meting","Bij elk design even sterk, op te lossen met extra controlevariabelen"],"a":0,"u":"Een selectie-effect is een systematisch verschil tussen groepen en is alleen relevant bij between-subjects designs, zeker bij zelfselectie. Random assignment en matching zijn de oplossingen."},{"t":"5","q":"Een onderzoeker laat elke deelnemer alle condities doorlopen. Welk voordeel en welk nadeel horen typisch bij dit within-subjects design?","o":["Voordeel: geen demand characteristics, nadeel: meer deelnemers nodig","Voordeel: minder druk op de deelnemer, nadeel: geen baseline mogelijk","Voordeel: automatische counterbalancing, nadeel: lagere power","Voordeel: geen selectie-effecten en meer power, nadeel: risico op order-effecten en demand characteristics"],"a":3,"u":"In een within-subjects design is elke deelnemer zijn eigen controle, dus geen selectie-effecten en meer power met minder deelnemers. Nadelen zijn onder meer order-effecten en meer risico op demand characteristics, die je met counterbalancing aanpakt."},{"t":"6","q":"Kinderen worden aan het begin en het einde van het schooljaar getest en hun taalvaardigheid blijkt gestegen. Welke dreiging voor de interne validiteit kan dit verklaren zonder dat er een interventie plaatsvond?","o":["Maturatie: kinderen veranderen vanzelf naarmate de tijd verstrijkt","History threat: een gebeurtenis van buitenaf drukt op de scores","Instrumentation: het meetinstrument is onderweg gewijzigd","Placebo-effect: verbetering doordat men in de behandeling gelooft"],"a":0,"u":"Maturatie is spontane verandering over tijd, zoals natuurlijke groei, los van welke interventie dan ook. Een controlegroep laat zien of beide groepen meebewegen."},{"t":"6","q":"Je vergelijkt een therapiegroep met een controlegroep. Wanneer wijst dit volgens de tekst op maturatie plus een echt therapie-effect?","o":["Enkel de therapiegroep verandert, de controlegroep beweegt totaal niet","Beide groepen veranderen, maar de therapiegroep verandert significant sterker","Geen van beide groepen laat verschil zien tussen pre- en posttest","De controlegroep verandert sterker dan de therapiegroep"],"a":1,"u":"Als beide groepen hun scores verlagen, wijst dat op maturatie. Verlaagt de therapiegroep significant meer, dan is er bovenop de maturatie ook een therapie-effect."},{"t":"6","q":"Wat houdt regression to the mean in?","o":["Een externe gebeurtenis die alle deelnemers gelijktijdig raakt","Systematische uitval die de resultaten vertekent","Toevallig extreme pretest-scores die in de posttest terug naar het gemiddelde neigen","Vermoeidheid of oefening door meermaals testen"],"a":2,"u":"Bij regression to the mean bewegen toevallig extreme pretest-scores in de posttest vanzelf richting het gemiddelde, puur door toeval en niet door de interventie."},{"t":"6","q":"Deelnemers doen wel de pretest maar niet de posttest, en dat verloopt niet willekeurig. Om welke dreiging gaat het en wat adviseert de tekst?","o":["History threat: meet de externe gebeurtenis apart","Uitval: verwijder de data van wie de posttest niet aflegde","Maturatie: voeg een controlegroep toe","Testeffect: laat de pretest weg"],"a":1,"u":"Systematische uitval verstoort de testresultaten. De tekst raadt aan de data te schrappen van deelnemers die wel de pretest, maar niet de posttest deden."},{"t":"6","q":"Waarom kan het meermaals afnemen van dezelfde test een probleem opleveren (testeffect)?","o":["Omdat het meetinstrument zelf verandert tussen pre- en posttest","Omdat vermoeidheid of oefening door het herhaalde testen het gedrag beinvloedt","Omdat een externe gebeurtenis de tweede meting verstoort","Omdat de scores toevallig richting het gemiddelde neigen"],"a":1,"u":"Een testeffect ontstaat doordat herhaalde tests het gedrag beinvloeden, bijvoorbeeld via vermoeidheid of oefening op de test zelf."},{"t":"6","q":"Waarvoor gebruik je volgens de tekst het Solomon four-group design?","o":["Om na te gaan of er testeffecten zijn, door groepen met en zonder pretest te vergelijken","Om regression to the mean te vermijden door extreme scores te schrappen","Om het placebo-effect uit te sluiten met een suikerpil","Om de steekproef te vergroten en zo individuele verschillen te dempen"],"a":0,"u":"Bij het Solomon four-group design doen sommige groepen wel en andere geen pretest, zodat je door vergelijken kunt zien of er testeffecten optreden."},{"t":"6","q":"Welke situatie hoort bij een double-blind design?","o":["Enkel de deelnemer weet niet in welke conditie hij zit","Zowel de deelnemer als de onderzoeker weet niet wie de echte behandeling of het placebo krijgt","Enkel de onderzoeker weet niet in welke conditie de deelnemer zit","Beiden kennen de conditie wel, maar ze wordt geheim gerapporteerd"],"a":1,"u":"Bij een double-blind design weet noch de deelnemer noch de onderzoeker wie de echte behandeling of het placebo krijgt. Bij een masked oftewel single-blind design weet alleen de deelnemer het niet."},{"t":"6","q":"Instrumentation betekent dat het meetinstrument verandert tussen pre- en posttest. Welke oplossing hoort daar volgens de tekst NIET bij?","o":["Counterbalancing van de testvolgorde","Een studie die aantoont dat de twee testmethoden equivalent zijn","De pretest verwijderen","Een suikerpil als placebo geven aan de controlegroep"],"a":3,"u":"Tegen instrumentation noemt de tekst de pretest verwijderen, aantonen dat beide methoden equivalent zijn, en counterbalancing van de volgorde. Een placebo hoort bij het placebo-effect, niet bij instrumentation."},{"t":"7","q":"Een onderzoeksdesign wordt aangeduid als 2x3. Wat zeg je hiermee correct over het aantal onafhankelijke variabelen en hun niveaus?","o":["Twee IV's: de eerste heeft 2 niveaus, de tweede 3 niveaus","Drie IV's die elk 2 niveaus hebben","Twee IV's die elk 3 niveaus hebben","Zes IV's met telkens 1 niveau"],"a":0,"u":"Het aantal cijfers geeft het aantal IV's (hier 2), en elk cijfer geeft het aantal niveaus van die variabele (hier 2 en 3)."},{"t":"7","q":"Hoe omschrijf je een main effect het best binnen een factorieel design?","o":["Het verschil tussen de verschillen van twee variabelen","Het effect van één onafhankelijke variabele","Het effect van één IV binnen één specifiek niveau van een andere IV","Het effect dat alleen optreedt bij random assignment"],"a":1,"u":"Een main effect is het effect van één onafhankelijke variabele op de afhankelijke variabele, los van de andere IV's."},{"t":"7","q":"Wat is kenmerkend voor een interactie-effect volgens de tekst?","o":["Het effect van slechts één IV apart bekeken","De som van de scores binnen één variabele","Het verschil tussen de verschillen, dus of de verschillen van elkaar verschillen","Het effect binnen één vast niveau van een andere IV"],"a":2,"u":"Een interactie-effect gaat over de verschillen tussen de verschillen: het effect van de ene variabele hangt af van het niveau van de andere."},{"t":"7","q":"Je bekijkt een grafiek met twee lijnen die perfect parallel lopen. Wat concludeer je over een interactie-effect?","o":["Er is zeker een interactie-effect","Er is geen interactie-effect","Er is zeker geen enkel main effect","De variabelen zijn niet gemanipuleerd"],"a":1,"u":"Parallelle lijnen betekenen geen interactie-effect; een interactie herken je juist aan lijnen die kruisen."},{"t":"7","q":"Wat beschrijft een simple main effect het best?","o":["Het gemiddelde effect van alle IV's samen","Het effect van één IV, maar enkel binnen één specifiek niveau van een andere IV","Het verschil van de verschillen tussen twee variabelen","Het effect dat je enkel in een within-subjects design krijgt"],"a":1,"u":"Een simple main effect is het effect van één onafhankelijke variabele binnen één bepaald niveau van een andere onafhankelijke variabele."},{"t":"7","q":"Een onderzoeker gebruikt een factorieel design om na te gaan of het effect van variabele A afhangt van variabele B. Welk doel past hier het best bij?","o":["Het testen van moderatie","Het uitsluiten van elke vorm van bias","Het vermijden van een controlegroep","Het garanderen van externe validiteit"],"a":0,"u":"Factoriële designs zijn geschikt om moderatie te testen: nagaan of het effect van A afhangt van B, bijvoorbeeld of iets alleen in een bepaalde populatie speelt."},{"t":"7","q":"Wat is het bepalende verschil tussen een quasi-experimenteel design en een echt experiment?","o":["Bij een quasi-experiment worden variabelen nooit gemanipuleerd, enkel gemeten","Bij een quasi-experiment ontbreekt random assignment","Bij een quasi-experiment is er nooit een afhankelijke variabele","Bij een quasi-experiment kun je geen niveaus onderscheiden"],"a":1,"u":"Een quasi-experimenteel design is hetzelfde als een experimenteel design, maar zonder random assignment. Manipulatie van variabelen kan nog steeds gebeuren."},{"t":"7","q":"Waarom is de interne validiteit van quasi-experimenten vaak bedreigd door een selection effect?","o":["Omdat de steekproef altijd te klein is voor statistische toetsing","Omdat er geen afhankelijke variabele gemeten wordt","Omdat zonder randomisatie de groepen vrijwel zeker systematisch van elkaar verschillen","Omdat de onderzoeker de hypothese achteraf aanpast"],"a":2,"u":"Zonder randomisatie is een selection effect vrijwel gegarandeerd: de groepen verschillen systematisch, en je weet nog niet of dat verschil uitmaakt voor je onderzoek."},{"t":"7","q":"Bij welk small-N design voer je de interventie in, keer je terug naar baseline en voer je de interventie daarna opnieuw in?","o":["Multiple baseline design","Stable baseline design","Mixed design","Reversal design (ABAB)"],"a":3,"u":"Het reversal design (ABAB) wisselt baseline en treatment af. Verandert het gedrag telkens mee met elke fase, dan is dat sterk causaal bewijs."}],"theory":[{"h":"Wetenschappelijk handelen","items":["Theorie-data cyclus: je leidt hypotheses af uit theorieën om via testen data te krijgen, maar zonder data kun je geen theorieën vormen","Inductie (exploratory): van losse observaties naar algemene inzichten zoeken, zonder vaste theorie vooraf","Deductie (confirmatory): vertrekken van een bestaande theorie en een afgeleide hypothese toetsen met data","Falsifieerbaarheid: een goede theorie moet weerlegd kunnen worden, ze kan nooit echt bewezen worden, alleen gefalsifieerd","Parsimonie (Occam's Razor): bij twee even goede theorieën wint de spaarzaamste, die met de minste aannames","Onafhankelijke vs afhankelijke variabele: de onafhankelijke (oorzaak) manipuleer je om het effect op de afhankelijke variabele te zien","Meten vs manipuleren: meten is registreren zoals het is, manipuleren is actief een variabele instellen bij groepen","Operationalisatie: een conceptueel construct concreet en meetbaar maken, van conceptuele definitie naar concrete meting","Frequentie claim: beschrijft hoe vaak iets voorkomt, bijvoorbeeld een percentage","Association claim: beschrijft een correlatie zonder oorzaak-gevolg (correleert, voorspelt, meer kans op)","Causal claim: geeft oorzaak en gevolg aan (verhoogt, veroorzaakt, leidt tot)","Voorwaarden voor causaliteit: covariantie, temporele precedentie en geen andere verklaringen","Random assignment vs random selection: willekeurig toewijzen aan groepen dient interne validiteit, willekeurig selecteren uit de populatie dient externe validiteit","Confounding: een derde variabele C veroorzaakt zowel A als B, hou je C constant dan verdwijnt de correlatie tussen A en B"]},{"h":"Ethische richtlijnen","items":["Geïnformeerde toestemming (informed consent): deelnemers vooraf informeren over de procedure, risico's, voordelen en wat er met hun data gebeurt.","Respect voor de mens: mensen respecteren, toestemming vragen en kwetsbare groepen beschermen tegen misbruik.","Baatzucht (beneficence): de voordelen voor deelnemer en maatschappij moeten opwegen tegen de risico's, en persoonlijke info moet beschermd worden.","Rechtvaardigheid: wie meedoet aan de studie zou ook deel moeten uitmaken van de groep die van de resultaten profiteert.","Non-maleficence: geen kwaad doen aan de deelnemers.","Deceptie: informatie verbergen omdat volledige info het gedrag en dus de validiteit zou beïnvloeden.","Deception through omission (misleiden): niet alle informatie geven, zonder actief te liegen.","Deception through commission (liegen): bewust foute informatie geven aan deelnemers.","Debriefen: deelnemers achteraf informeren; verplicht bij deceptie, herstelt vertrouwen en laat hen iets leren.","Institutional Review Board (ethische commissie): controleert je onderzoek vooraf op ethiek en beslist of je het mag doen.","Privacy: persoonlijke informatie van deelnemers beschermen en hun privacy niet binnendringen.","Falsificatie: echte data aanpassen of deelnemers weglaten om je hypothese te steunen.","Fabricatie: data volledig verzinnen zonder echt onderzoek te doen.","QRS (Questionable Research Practices): geen echte fraude, maar je data toch in de richting van je hypothese duwen, zoals HARKing of selectief rapporteren."]},{"h":"Goede metingen herkennen","items":["Betrouwbaarheid: de mate waarin een test consistent meet; noodzakelijke maar niet voldoende voorwaarde voor validiteit.","Test-hertest betrouwbaarheid: dezelfde test op twee tijdstippen afnemen; de scores horen te correleren omdat het construct stabiel is.","Interbeoordelaarsbetrouwbaarheid: mate waarin verschillende observatoren gedrag hetzelfde scoren; vooral bij observatie en kwalitatief onderzoek.","Cohen's Kappa: maat voor interbeoordelaarsbetrouwbaarheid bij categorische (nominale) variabelen, in plaats van de correlatie r.","Interne consistentie: mate waarin items die hetzelfde construct meten onderling goed correleren.","Cronbach's Alfa: meest gebruikte maat voor interne consistentie, typische cut-off 0,70; gaat ervan uit dat alle items even zwaar wegen.","Omega: alternatief voor Alfa dat beter is omdat het toelaat dat sommige items harder doorwegen dan andere.","Validiteit: de mate waarin een test echt meet wat hij hoort te meten.","Face validity: subjectief oordeel; participanten vragen of de test een goede meting van het construct lijkt.","Content validity (inhoudsvaliditeit): of de meting alle relevante aspecten van het construct dekt, bijvoorbeeld een IQ-test die meer dan enkel wiskunde meet.","Criteriumvaliditeit: of er een relatie is tussen het construct en bepaald gedrag, bijvoorbeeld of IQ schools succes voorspelt.","Known groups paradigm: criteriumvaliditeit toetsen door groepen met en zonder diagnose dezelfde test te laten afleggen.","Convergente validiteit: als je een verband tussen twee variabelen verwacht, horen de tests van die constructen datzelfde verband te vertonen.","Discriminante validiteit: als je geen verband tussen twee variabelen verwacht, mogen de tests van die constructen ook geen verband vertonen."]},{"h":"Sampling","items":["Population of interest (N): het deel van de populatie dat je wilt onderzoeken, bv. psychologiestudenten.","Sampling frame: de subgroep die je uit je population of interest haalt, bv. psychologiestudenten aan de VUB.","Sample (n): het deel van de sampling frame dat echt meedoet aan je studie, want sommigen willen niet participeren.","Externe validiteit: de mate waarin je de bevindingen uit je sample kunt generaliseren naar de populatie.","Sampling error: het verschil tussen een steekproefresultaat en de werkelijke waarde in de populatie.","Sampling bias: wanneer bepaalde groepen meer kans hebben om in de steekproef te komen, waardoor resultaten scheef trekken.","Probability sampling: steekproeven op basis van kans waarbij iedereen evenveel kans heeft om geselecteerd te worden, met sterke externe validiteit.","Simple random sampling: uit een lijst van iedereen volledig willekeurig mensen kiezen, zodat iedereen evenveel kans heeft.","Cluster sample: de populatie in clusters verdelen, random clusters kiezen en daarbinnen iedereen bevragen.","Stratified random sample: de populatie in strata verdelen en random mensen kiezen binnen elke strata, proportioneel aan de populatie.","Systematic sampling: vanaf een lijst elke k-de persoon selecteren, bv. om de 5 personen een selecteren.","Convenience sample: participanten kiezen omdat ze makkelijk te bereiken of te overtuigen zijn; een biased methode.","Snowball sample: mensen uit je netwerk vragen mee te doen en zij vragen hun netwerk; handig voor moeilijk bereikbare groepen maar weinig representatief.","WEIRD samples: samples van vooral white, educated, industrialised, rich en democratic mensen, die niet representatief zijn voor de hele bevolking."]},{"h":"Simpel experimenteel onderzoek","items":["Onafhankelijke variabele (IV): de variabele die de onderzoeker zelf manipuleert, bijvoorbeeld de grootte van het bord.","Afhankelijke variabele (DV): de variabele die je meet als uitkomst, bijvoorbeeld hoeveel er gegeten wordt.","Controlevariabele: een variabele die je bewust constant houdt zodat groepen enkel op de IV verschillen, bijvoorbeeld de kleur van het bord.","Confounder: een derde variabele die het effect vertroebelt doordat groepen op meer dan de IV verschillen.","Potential outcomes framework: het idee dat elke deelnemer twee mogelijke uitkomsten heeft, Y(0) in de controlegroep en Y(1) in de experimentele groep.","Fundamenteel probleem van causale inferentie: je kan per deelnemer maar een van beide potentiele uitkomsten waarnemen, nooit allebei.","Average treatment effect (ATE): het gemiddelde effect van de behandeling, berekend als het gemiddelde verschil Y(1) - Y(0) over alle deelnemers.","Voorwaarden voor causaliteit: covariantie, juiste tijdvolgorde en het uitsluiten van alternatieve verklaringen.","Design confound: een derde variabele die systematisch meevariert met de gemanipuleerde IV, waardoor je effect en confounder niet uit elkaar kan halen.","Selectie-effect: een systematisch verschil tussen groepen, vooral een dreiging bij between-subjects designs en bij zelfselectie; op te lossen met random assignment en matching.","Between-subjects design: elke deelnemer krijgt slechts een conditie (posttest-only of pretest-posttest).","Within-subjects design: elke deelnemer ondergaat alle condities (repeated measures of concurrent measures).","Demand characteristics: signalen waardoor een deelnemer het doel van de studie doorheeft en zijn gedrag aanpast.","Order-effect: de volgorde van de condities beinvloedt de deelnemer (bijvoorbeeld oefen- of carry-over-effecten), op te lossen met counterbalancing."]},{"h":"Dreigingen voor validiteit","items":["Maturatie: deelnemers veranderen vanzelf over tijd, los van de interventie","History threat: een externe gebeurtenis buiten de studie beinvloedt de resultaten","Regression to the mean: toevallig extreme pretest-scores neigen in de posttest weer naar het gemiddelde","Uitval (attrition): systematische, niet-willekeurige uitval van deelnemers verstoort de resultaten","Testeffect: herhaald testen verandert het gedrag door vermoeidheid of oefening","Instrumentation: het meetinstrument zelf verandert tussen pre- en posttest","Controlegroep: vergelijkingsgroep waarmee je maturatie en testeffecten kunt zichtbaar maken","Solomon four-group design: sommige groepen doen wel, andere geen pretest, om testeffecten op te sporen","Counterbalancing: de volgorde van tests afwisselen om volgorde-effecten te controleren","Observer bias: verwachtingen van de onderzoeker kleuren de interpretatie van de resultaten","Demand characteristics: deelnemers passen hun gedrag aan aan wat ze denken dat het doel is","Double-blind design: noch deelnemer noch onderzoeker weet wie de echte behandeling of placebo krijgt","Masked (single blind) design: alleen de deelnemer weet niet in welke conditie hij zit","Placebo-effect: verbetering die ontstaat door het geloof in de behandeling zelf"]},{"h":"Meer IVs & quasi-experimenten","items":["Factorieel design: experiment met meer dan 1 IV, waarbij de cijfers (bv. 2x3) het aantal IV's en hun aantal niveaus aangeven.","Main effect: het effect van één onafhankelijke variabele op de afhankelijke variabele, los van de andere.","Interactie-effect: het verschil tussen de verschillen, oftewel of het effect van de ene IV afhangt van het niveau van de andere; in een grafiek herkenbaar aan kruisende lijnen.","Simple main effect: het effect van één IV binnen één specifiek niveau van een andere IV.","Moderatie: nagaan of het effect van variabele A afhangt van variabele B, of het bij iedereen of enkel in een bepaalde populatie optreedt.","Between/within/mixed design: elke participant krijgt 1 conditie (between), elke conditie (within), of een combinatie van beide (mixed).","Quasi-experimenteel design: zelfde als een experimenteel design, maar zonder random assignment.","Selection effect: zonder randomisatie verschillen groepen bijna zeker systematisch van elkaar.","Design confound: een andere variabele die onbedoeld samenhangt met de gemanipuleerde variabele, bijna onvermijdelijk zonder randomisatie of matching.","Small-N design: onderzoek met weinig deelnemers (1-5) die individueel gemeten worden, zonder generalisatie naar de populatie.","Multiple baseline design: de interventie op verschillende tijdstippen invoeren om zeker te zijn dat het gedrag niet toevallig verandert bij de start van de treatment.","Reversal design (ABAB): baseline, interventie, terug baseline, terug interventie; verandert gedrag telkens mee, dan is dat sterk causaal bewijs.","Directe vs. conceptuele replicatie: exact hetzelfde onderzoek herhalen (is het effect echt?) versus dezelfde hypothese met andere methode testen (blijft het effect bestaan?).","Externe validiteit: de generaliseerbaarheid naar EEN populatie, met ecologische validiteit als onderdeel (generalisatie naar realistische contexten)."]}],"hacks":[{"h":"CATCH voor causaliteit: Covariantie, Aopvolging, Toewijzing, Confounders","t":"Onthoud de drie voorwaarden voor causaliteit met 'CTG': Covariantie (er is een verband), Tijdvolgorde/temporele precedentie (oorzaak komt vóór gevolg) en Geen andere verklaringen. Die laatste dek je af met random Assignment (willekeurige toewijzing aan groepen). Ezelsbrug: 'Cause moet eerst Tikken, dan Groeperen', C voor verband, T voor timing, G voor geen alternatieven via willekeurige indeling."},{"h":"OMISSIE = weglaten, COMMISSIE = liegen","t":"Onthoud de twee soorten deceptie zo: bij oMissie Mis je informatie (je laat iets weg), bij Commissie Commit je een leugen (je geeft actief foute info). De M van 'missen' koppelt aan 'weglaten', de leugen zit in de actieve daad van commissie."},{"h":"CCID: de vier constructvaliditeiten op een rij","t":"Content, Criterium, Convergent, Discriminant. Content en face zijn de subjectieve (je oordeelt of het klopt en compleet lijkt), Criterium, Convergent en Discriminant zijn de empirische (je toetst met data). Onthoud het verschil convergent versus discriminant zo: convergent = verwacht verband komt Csamen, discriminant = verwacht geen verband, dus blijven Distanced. Verwacht verband en het is er: convergent. Verwacht geen verband en het is er ook niet: discriminant."},{"h":"CSS-triple voor de random methodes: Cluster, Stratified, Systematic","t":"Onthoud de drie 'nette' probability-methodes met C-S-S. Cluster = hele groepen kiezen (Compleet bevragen). Stratified = Strata, dus proportioneel per subgroep. Systematic = Stapsgewijs elke k-de persoon. Zo verwar je ze niet met de biased methodes (Convenience, Purposive, Snowball, Quota)."},{"h":"SORT: de 3 voorwaarden voor causaliteit","t":"Onthoud SORT: Samenhang (covariantie, groepen verschillen op de DV), Ordening in tijd (de IV komt voor de DV) en Rivalen uiTsluiten (geen alternatieve verklaringen, dus controle voor confounds, selectie en volgorde-effecten). Heb je alle drie, dan mag je van een causaal verband spreken."},{"h":"MHRUTI: de zes klassieke bedreigers op een rij","t":"Denk aan 'M-H-R-U-T-I' voor de kern-dreigingen van interne validiteit: Maturatie, History, Regressie naar het gemiddelde, Uitval, Testeffect, Instrumentation. Onthoud er meteen de tegenzet bij: de controlegroep vangt maturatie en history, het Solomon-design en 'geen pretest' vangen testeffecten, en 'equivalente methoden plus counterbalancing' vangt instrumentation."},{"h":"GRAFIEK: Lijnen Kruisen = Interactie","t":"Onthoud twee simpele checks bij een grafiek. Stijgt of daalt een lijn, dan is er een main effect. Kruisen de twee lijnen, dan is er een interactie; lopen ze parallel, dan geen interactie. Kort: 'Kruisen = interactie, parallel = niet'."}]};
</script>

</style>
<script>
(function(){
  "use strict";
  var D=window.RMT2, app=document.getElementById("app");
  var P={
    book:'<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
    bulb:'<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>',
