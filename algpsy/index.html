<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<style>
  :root{
    --bg:#f4f2ee; --bg2:#ebe8e2; --card:#ffffff; --ink:#1b232c; --muted:#5d6873;
    --line:#e2ddd4; --accent:#0f6e6a; --accent-ink:#0b4f4c; --accent-soft:#dcefed;
    --amber:#c9821f; --amber-soft:#f7ecd9; --violet:#6d5bd0; --violet-soft:#e9e6fa;
    --good:#1f8a4c; --good-soft:#e2f3e8; --bad:#c23b54; --bad-soft:#fbe5ea;
    --shadow:0 1px 2px rgba(20,30,40,.05),0 6px 18px rgba(20,30,40,.05);
    --shadow-lg:0 2px 6px rgba(20,30,40,.06),0 18px 40px rgba(20,30,40,.10);
    --r:14px; --r-lg:20px; --ease:cubic-bezier(.2,.8,.2,1);
  }
  html[data-theme="dark"]{
    --bg:#11151a; --bg2:#161b22; --card:#1b222b; --ink:#e7ecf1; --muted:#9aa6b2;
    --line:#2a323c; --accent:#3fb9b2; --accent-ink:#7fd6d0; --accent-soft:#163230;
    --amber:#e0a64a; --amber-soft:#2e2515; --violet:#a99cf0; --violet-soft:#221d3a;
    --good:#46c178; --good-soft:#16301f; --bad:#ef6b82; --bad-soft:#331620;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 2px 8px rgba(0,0,0,.4),0 22px 48px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;letter-spacing:-.01em}
  button,a{font-family:inherit;cursor:pointer;color:inherit}
  .wrap{max-width:880px;margin:0 auto;padding:0 18px 96px}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
  .ic{width:1.25em;height:1.25em;flex:none;vertical-align:-.18em;stroke:currentColor;stroke-width:1.75;
    stroke-linecap:round;stroke-linejoin:round;fill:none}

  header.top{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(160%) blur(16px);-webkit-backdrop-filter:saturate(160%) blur(16px);box-shadow:inset 0 -1px 0 0 rgba(0,0,0,.04)}
  .topin{max-width:880px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:700}
  .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,var(--accent),var(--accent-ink));
    color:#fff;display:grid;place-items:center;font-family:Georgia,serif;font-weight:700;font-size:16px;flex:none;
    box-shadow:0 2px 6px rgba(15,110,106,.35)}
  .brand small{display:block;font-weight:500;color:var(--muted);font-size:11px}
  .spacer{flex:1}
  .iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:38px;
    padding:7px 11px;font-size:13.5px;display:inline-flex;gap:7px;align-items:center;text-decoration:none;
    transition:border-color .2s var(--ease),transform .12s var(--ease)}
  .iconbtn:hover{border-color:var(--accent)} .iconbtn:active{transform:scale(.96)}
  nav.tabs{display:flex;gap:2px;overflow:auto;max-width:880px;margin:0 auto;padding:6px 12px 0;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{border:none;background:none;color:var(--muted);padding:10px 13px;border-radius:9px 9px 0 0;
    font-size:14px;font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px;transition:color .2s var(--ease)}
  nav.tabs button .ic{width:16px;height:16px}
  nav.tabs button.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
  nav.tabs button:hover{color:var(--ink)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:20px}
  .muted{color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
  .pill.amber{background:var(--amber-soft);color:var(--amber)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;gap:14px}
  @media(min-width:620px){.g2{grid-template-columns:1fr 1fr}}

  .hero{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin:20px 0 8px}
  .count{flex:none;background:linear-gradient(150deg,var(--accent),var(--accent-ink));color:#fff;border-radius:var(--r);padding:14px 20px;text-align:center;min-width:118px;box-shadow:0 8px 20px rgba(15,110,106,.28)}
  .count b{font-family:Georgia,serif;font-size:32px;display:block;line-height:1}
  .count span{font-size:12px;opacity:.92}
  .herotext h1{margin:0 0 4px;font-size:25px}
  .herotext p{margin:0;color:var(--muted)}

  .brandstrip{display:flex;align-items:center;gap:13px;width:100%;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 16px;margin:14px 0 2px;box-shadow:var(--shadow);transition:border-color .2s var(--ease),transform .15s var(--ease)}
  .brandstrip:hover{border-color:var(--accent);transform:translateY(-1px)}
  .brandstrip .bs-logo{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:17px;background:linear-gradient(145deg,var(--accent),var(--accent-ink))}
  .brandstrip .bs-txt{flex:1;min-width:0} .brandstrip .bs-txt b{display:block;font-size:14.5px} .brandstrip .bs-txt small{color:var(--muted);font-size:12.5px}
  .brandstrip .bs-go{color:var(--accent-ink);flex:none;display:inline-flex} .brandstrip .bs-go .ic{width:18px;height:18px}

  .seclabel{display:flex;align-items:center;gap:8px;margin:24px 0 12px;font-weight:700;font-size:15px}
  .seclabel .ic{width:18px;height:18px;color:var(--accent-ink)}
  .backlink{display:inline-flex;align-items:center;gap:5px;border:none;background:none;color:var(--muted);font-size:13.5px;font-weight:600;padding:6px 0;margin-bottom:4px;transition:color .2s var(--ease)}
  .backlink:hover{color:var(--accent-ink)} .backlink .ic{width:16px;height:16px}
  .tracks{display:grid;gap:14px} @media(min-width:600px){.tracks{grid-template-columns:1fr 1fr}}
  .track{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);transition:transform .22s var(--ease),border-color .22s var(--ease),box-shadow .22s var(--ease)}
  .track:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow-lg)} .track:active{transform:translateY(-1px) scale(.995)}
  .track .tile{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;margin-bottom:4px;background:linear-gradient(150deg,var(--accent),var(--accent-ink))}
  .track.alt .tile{background:linear-gradient(150deg,var(--violet),#4f40a8)} .track .tile .ic{width:24px;height:24px}
  .track b{font-size:18px} .track small{color:var(--muted);font-size:13.5px;line-height:1.5}
  .track .go{margin-top:6px;display:inline-flex;align-items:center;gap:6px;color:var(--accent-ink);font-weight:600;font-size:13.5px} .track.alt .go{color:var(--violet)} .track .go .ic{width:16px;height:16px}
  .toggle{width:48px;height:28px;border-radius:999px;border:none;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s var(--ease)}
  .toggle .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s var(--ease)}
  .toggle.on{background:var(--violet)} .toggle.on .knob{left:23px}
  .warmcard{border-color:var(--violet)!important;background:var(--violet-soft)} .warmcard .ic{width:22px;height:22px;color:var(--violet);flex:none}
  .modebanner{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:11px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent-ink);font-size:13.5px;font-weight:600}
  .modebanner.v{background:var(--violet-soft);color:var(--violet)} .modebanner .ic{width:18px;height:18px} .modebanner a,.modebanner .bnlink{margin-left:auto;font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;color:inherit;border:none;background:none;font-family:inherit;padding:0}
  html.snappy .card,html.snappy .mode,html.snappy .tip,html.snappy .track{animation-duration:.12s!important}
  .mode{display:flex;flex-direction:column;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:17px;gap:7px;box-shadow:var(--shadow);transition:transform .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease)}
  .mode:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .mode .me{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)} .mode .me .ic{width:22px;height:22px}
  .mode b{font-size:16px} .mode small{color:var(--muted);font-size:13px}

  label.fld{display:block;font-size:13px;font-weight:600;margin:16px 0 7px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;min-height:38px;padding:7px 13px;font-size:13.5px;transition:all .18s var(--ease)}
  .chip:hover{border-color:var(--accent)} .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:11px;min-height:46px;padding:12px 20px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;box-shadow:0 4px 12px rgba(15,110,106,.25);transition:background .2s var(--ease),transform .12s var(--ease)}
  .btn:hover{background:var(--accent-ink)} .btn:active{transform:scale(.97) translateY(1px)} .btn .ic{width:18px;height:18px}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none} .btn.ghost:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  input[type=search],input[type=text],input[type=email],textarea{font-family:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
  input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .runtop{display:flex;align-items:center;gap:12px;margin:2px 0 14px;font-size:13px;color:var(--muted)}
  .bar{height:8px;border-radius:6px;background:var(--bg2);overflow:hidden;flex:1}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .7s var(--ease)}
  .qtext{font-size:19px;font-weight:600;margin:8px 0 16px;font-family:Georgia,serif;line-height:1.45}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px 15px;margin-bottom:10px;font-size:15px;transition:border-color .15s var(--ease),background .15s var(--ease),transform .12s var(--ease)}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)} .opt:active:not(:disabled){transform:scale(.99)}
  .opt .k{flex:none;width:27px;height:27px;border-radius:8px;background:var(--bg2);color:var(--muted);display:grid;place-items:center;font-weight:700;font-size:13px}
  .opt.correct{border-color:var(--good);background:var(--good-soft)} .opt.correct .k{background:var(--good);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default}
  .feedback{border-radius:12px;padding:13px 15px;margin:4px 0 12px;font-size:14.5px}
  .feedback.ok{background:var(--good-soft);color:var(--good)} .feedback.no{background:var(--bad-soft);color:var(--bad)}
  .feedback b{font-weight:700} .feedback .sub{display:block;margin-top:3px;color:var(--ink);font-weight:500;opacity:.92}
  .whybtn{border:1px solid var(--line);background:var(--card);color:var(--accent-ink);border-radius:10px;min-height:40px;padding:9px 14px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:border-color .2s var(--ease),background .2s var(--ease)}
  .whybtn:hover{border-color:var(--accent);background:var(--accent-soft)} .whybtn .ic{width:16px;height:16px}
  .whybox{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:14px 16px;margin:12px 0 4px;font-size:14px;line-height:1.55}
  .whybox h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent-ink);font-family:system-ui;display:flex;align-items:center;gap:7px}
  .whybox .ic{width:16px;height:16px}

  .acc{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
  .acc>summary{padding:15px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:11px}
  .acc>summary::-webkit-details-marker{display:none}
  .acc>summary .n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
  .acc>summary .caret{margin-left:auto;color:var(--muted);transition:transform .25s var(--ease)} .acc[open]>summary .caret{transform:rotate(90deg)}
  .acc[open]>summary{border-bottom:1px solid var(--line)} .acc .body{padding:6px 18px 16px}
  .acc h4{margin:14px 0 6px;font-size:13px;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.4px;font-family:system-ui}
  .acc ul{margin:0;padding-left:20px} .acc li{margin:6px 0;font-size:14.5px;line-height:1.5}
  .acc.hack li::marker{content:"💡  "} .acc.hack>summary .n{background:var(--violet-soft);color:var(--violet)}
  mark{background:var(--amber-soft);color:inherit;padding:0 2px;border-radius:3px}

  .tip{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}
  .tip h4{margin:0 0 5px;font-size:14.5px;display:flex;align-items:center;gap:8px;font-family:system-ui} .tip h4 .ic{width:18px;height:18px;color:var(--violet)}
  .tip p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}
  .tipgrid{display:grid;gap:12px} @media(min-width:620px){.tipgrid{grid-template-columns:1fr 1fr}}

  .results .big{font-family:Georgia,serif;font-size:54px;text-align:center;margin:8px 0;line-height:1}
  .center{text-align:center} .hide{display:none!important}
  footer{margin-top:34px;text-align:center;color:var(--muted);font-size:13px}
  .kbd{font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--muted)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.03)}100%{transform:scale(1)}}
  @keyframes optIn{from{opacity:0;transform:translateX(-9px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: no-preference){
    .card,.mode,.tip{animation:fadeUp .34s var(--ease) both}
    .acc{animation:fadeUp .32s var(--ease) both}
    .opt{animation:optIn .3s var(--ease) backwards;animation-delay:var(--oi,0s)}
    .chip.on{animation:pop .22s var(--ease)}
    .feedback{animation:slideIn .26s var(--ease) both} .whybox{animation:slideIn .28s var(--ease) .07s both} .opt.correct{animation:pop .34s var(--ease)}
  }
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  /* ---- Premium launch (Gemini-stijl) + header-logo gloed ---- */
  @property --bes-a{syntax:'<angle>';initial-value:0deg;inherits:false}
  #splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(125% 125% at 50% 38%,var(--bg2) 0%,var(--bg) 68%);transition:opacity .6s var(--ease),transform .7s var(--ease)}
  #splash.hide{opacity:0;transform:scale(1.07);pointer-events:none}
  .sp-inner{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
  .sp-mark{position:relative;width:100px;height:100px;display:grid;place-items:center}
  .sp-mark::before{content:"";position:absolute;inset:-16px;border-radius:34px;z-index:0;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));filter:blur(17px);opacity:.75}
  .sp-mark::after{content:"";position:absolute;inset:-3px;border-radius:27px;z-index:1;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));padding:3px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .sp-logo{position:relative;z-index:2;width:92px;height:92px;border-radius:24px;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:46px;background:linear-gradient(150deg,var(--accent),var(--accent-ink));box-shadow:0 14px 38px rgba(15,110,106,.4)}
  .sp-spark{position:absolute;z-index:3;top:-7px;right:-7px;width:30px;height:30px;color:#fff;filter:drop-shadow(0 2px 7px rgba(0,0,0,.35))}
  .sp-name{position:relative;font-family:Georgia,serif;font-size:26px;font-weight:700;letter-spacing:-.01em;color:var(--ink);overflow:hidden}
  .sp-name::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(-130%)}
  .sp-tag{font-size:13px;color:var(--muted);margin-top:-8px;letter-spacing:.03em}
  @media (prefers-reduced-motion: no-preference){
    .sp-mark::before{animation:bes-spin 3s linear infinite,bes-breathe 2.4s var(--ease) infinite}
    .sp-mark::after{animation:bes-spin 3s linear infinite}
    .sp-logo{animation:bes-pop .7s var(--ease) both}
    .sp-spark{animation:bes-pop .6s var(--ease) .12s both,bes-twinkle 1.9s var(--ease) .9s infinite}
    .sp-name{animation:bes-rise .6s var(--ease) .14s both}
    .sp-name::after{animation:bes-shimmer 1.5s var(--ease) .5s 1}
    .sp-tag{animation:bes-rise .6s var(--ease) .26s both}
  }
  @keyframes bes-spin{to{--bes-a:360deg}}
  @keyframes bes-breathe{0%,100%{opacity:.55;filter:blur(16px)}50%{opacity:.95;filter:blur(22px)}}
  @keyframes bes-shimmer{to{transform:translateX(130%)}}
  @keyframes bes-twinkle{0%,100%{opacity:1;transform:scale(1) rotate(0deg)}50%{opacity:.65;transform:scale(.82) rotate(18deg)}}
  @keyframes bes-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  /* mobiel: header-knoppen alleen iconen zodat niks zijwaarts overflowt */
  @media(max-width:440px){ header.top .iconbtn span{display:none} header.top .iconbtn{padding:7px 9px;min-width:38px;justify-content:center} .topin{gap:8px} }
</style>
</head>
<body>
<div id="splash"><div class="sp-inner">
  <div class="sp-mark">
    <div class="sp-logo">AP</div>
    <svg class="sp-spark" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.5c.4 4.6 2.4 6.6 7 7-4.6.4-6.6 2.4-7 7-.4-4.6-2.4-6.6-7-7 4.6-.4 6.6-2.4 7-7Z"/></svg>
  </div>
  <div><div class="sp-name">Algemene Psychologie</div><div class="sp-tag">slim oefenen voor je examen</div></div>
</div></div>
<header class="top">
  <div class="topin">

<script>
window.AP = {"questions":[{"t":"1","q":"Wat is volgens de bron de beste definitie van psychologie?","o":["De wetenschap van het gedrag en de mentale processen","De kunst om via intuïtie het gedrag van anderen te voorspellen","Het bestuderen van de onaantastbare ziel los van het lichaam","Een verzameling volkswijsheden over hoe de mens denkt"],"a":0,"u":"De bron omschrijft psychologie als de wetenschap van het gedrag en de mentale processen: het meetbare externe gedrag wordt gebruikt om interne processen te begrijpen."},{"t":"1","q":"Iemand beweert stellig dat mensen bij volle maan agressiever worden, zonder enig onderbouwd bewijs, en presenteert dit als een wetenschappelijk feit. Onder welke term valt dit?","o":["Introspectie","Pseudopsychologie","Lekenpsychologie","Functionalisme"],"a":1,"u":"Pseudopsychologie zijn niet-onderbouwde psychologische aannames die zich als wetenschappelijke waarheid voordoen, precies wat hier gebeurt."},{"t":"1","q":"Waarom gebruikt de bron visuele illusies zoals de Muller-illusie om het nut van psychologie te illustreren?","o":["Om te bewijzen dat onze zintuigen altijd betrouwbaar zijn","Om te laten zien dat kennis volledig aangeboren is","Om aan te tonen dat onze intuïtie dikwijls fout of contra-intuïtief is","Om het verschil tussen geocentrisme en heliocentrisme te verduidelijken"],"a":2,"u":"De illusies tonen aan dat wat we denken niet altijd klopt: zelfs als je de illusie kent, blijft de indruk bestaan, wat bewijst dat intuïtie vaak fout is."},{"t":"1","q":"De uitspraak 'Psychologie heeft een lang verleden maar een korte geschiedenis' verwijst naar welk idee?","o":["Psychologie is de oudste van alle natuurwetenschappen","Psychologie bestaat pas sinds de oude Grieken maar wordt zelden bestudeerd","De wortels liggen in de filosofie, maar als aparte wetenschap begon ze pas rond 1879","De geschiedenis duurde lang terwijl het verleden juist heel kort was"],"a":2,"u":"Het lange verleden verwijst naar de filosofische en evolutionaire wortels, terwijl de korte geschiedenis start bij de oprichting van het eerste psychologische laboratorium door Wundt in 1879."},{"t":"1","q":"Volgens het empirisme (Hobbes, Locke, Hume) is de geest bij de geboorte te vergelijken met een 'tabula rasa'. Wat betekent dit?","o":["De geest bevat aangeboren kennis om de mens via de rede te begrijpen","De geest is een leeg blad en kennis ontstaat door zintuiglijke ervaring","De geest en het lichaam zijn twee volledig aparte identiteiten","De geest is het onaantastbare, hoogste deel van de mens"],"a":1,"u":"Empirisme stelt dat kennis niet aangeboren is maar tot stand komt via zintuiglijke ervaringen en associaties: de geest is bij de geboorte een leeg blad."},{"t":"1","q":"Welk koppel begrippen sluit het best aan bij het nature-nurture-debat zoals de bron het beschrijft?","o":["Rationalisme versus empirisme","Geocentrisme versus heliocentrisme","Structuralisme versus functionalisme","Positivisme versus dualisme"],"a":0,"u":"De bron koppelt rationalisme (nativisme, aanleg, nature) aan empirisme (tabula rasa, ervaring en opvoeding, nurture) als de filosofische kern van het nature-nurture-debat."},{"t":"1","q":"Wat was het centrale kritiekpunt op de introspectieve methode van het structuralisme?","o":["Ze was te sterk gericht op observeerbaar gedrag","Ze negeerde de rol van het bewustzijn volledig","Ze was subjectief en onbetrouwbaar en dus moeilijk reproduceerbaar","Ze werd enkel bij dieren toegepast, waardoor de resultaten niet golden voor mensen"],"a":2,"u":"Introspectie was subjectief en onbetrouwbaar: het bewustzijn verschilt per dag en per persoon, waardoor resultaten niet reproduceerbaar zijn en het praktisch nut beperkt bleef."},{"t":"1","q":"'Het geheel is meer dan de som der delen.' Bij welke stroming hoort deze kernuitspraak, en waarop richt die zich?","o":["Behaviorisme, gericht op stimulus-respons","Gestaltpsychologie, gericht op perceptie","Psychoanalyse, gericht op het onbewuste","Structuralisme, gericht op de bouwstenen van de geest"],"a":1,"u":"De gestaltpsychologie stelt dat het geheel meer is dan de som der delen en focust op perceptie, waarbij de totaalconfiguratie de waarneming van de afzonderlijke delen stuurt."},{"t":"1","q":"Watson beweerde een willekeurige baby te kunnen opvoeden tot om het even welk type specialist. Welke visie op de mens illustreert dit?","o":["Dat gedrag volledig door de omgeving gevormd kan worden via leerprincipes","Dat onbewuste conflicten uit de vroege kindertijd het latere gedrag blijvend bepalen","Dat de geest bestaat uit vaste, ondeelbare bouwstenen","Dat eigenschappen vooral bepaald worden door aanleg"],"a":0,"u":"Deze uitspraak van het behaviorisme benadrukt dat je door de omgeving aan te passen iemand tot van alles kunt vormen: stimulus lokt respons uit, verklaard via leerprincipes."},{"t":"1","q":"Waarom noemt men de behavioristische benadering ook wel 'black box'-psychologie?","o":["Omdat men enkel de verborgen driften in het onbewuste bestudeert en waarneembaar gedrag onbelangrijk vindt","Omdat men de menselijke geest in een donkere kamer observeert","Omdat men alle interne processen wel meet maar het gedrag negeert","Omdat wat zich in het hoofd afspeelt niet meetbaar is, dus richt men zich enkel op stimulus en respons"],"a":3,"u":"Het hoofd is de black box: de verwerking van de stimulus is niet te registreren, dus bestudeert men enkel de observeerbare stimulus en respons."},{"t":"1","q":"De bron noemt een belangrijk verwijt aan Freuds psychoanalyse. Welk?","o":["Ze richtte zich uitsluitend op observeerbaar gedrag","Ze ontkende het bestaan van onbewuste processen en verklaarde klachten enkel vanuit bewuste keuzes","Ze was niet gebaseerd op wetenschappelijk onderzoek maar op persoonlijke interpretaties","Ze steunde volledig op gecontroleerde laboratoriumexperimenten"],"a":2,"u":"Freud wees op het belang van het onbewuste, maar zijn theorie was niet gebaseerd op wetenschappelijk onderzoek, wel op zijn persoonlijke interpretaties, wat veel kritiek opleverde."},{"t":"1","q":"Een onderzoeker wil weten of suiker in frisdrank de concentratie van kinderen aantast. Ze geeft de ene groep frisdrank met suiker en een vergelijkbare groep frisdrank zonder suiker. Welke onderzoeksmethode is dit, en waarom?","o":["Beschrijvend onderzoek, omdat de onderzoeker het gedrag enkel observeert zonder in te grijpen","Correlationeel onderzoek, omdat twee variabelen samenhangen","Experimenteel onderzoek, omdat de onafhankelijke variabele gemanipuleerd wordt","Een gevalstudie, omdat een enkel kind intensief bestudeerd wordt"],"a":2,"u":"Bij experimenteel onderzoek manipuleert de onderzoeker de onafhankelijke variabele (hoeveelheid suiker) en meet het effect op de afhankelijke variabele; het is de enige methode die oorzakelijke verbanden kan vastleggen."},{"t":"2","q":"Wat gebeurt er bij Pavlovs klassieke conditionering wanneer een neutrale prikkel zoals een bel herhaaldelijk samen met voedsel wordt aangeboden?","o":["De bel gaat op zichzelf een kwijlreactie uitlokken doordat er een associatie ontstaat","De hond stopt met kwijlen bij het zien van voedsel","De bel wordt een ongeconditioneerde stimulus die reflexmatig honger veroorzaakt","De hond leert alleen te kwijlen bij de verzorger en nooit meer bij voedsel"],"a":0,"u":"Door meerdere koppelingen tussen voedsel (OS) en de bel legt de hond een associatie, waardoor de bel als geconditioneerde stimulus zelf de kwijlreactie oproept."},{"t":"2","q":"Iemand is gebeten door een bepaalde agressieve hond en wordt daarna bang voor alle honden. Welk kenmerk van klassieke conditionering is dit?","o":["Extinctie","Spontaan herstel","Stimulusgeneralisatie","Stimulusdiscriminatie"],"a":2,"u":"Bij stimulusgeneralisatie breidt de aangeleerde reactie zich uit naar gelijksoortige prikkels, zoals angst voor alle honden na een beet."},{"t":"2","q":"Wat houdt extinctie in bij klassieke conditionering, en is de respons daarna definitief afgeleerd?","o":["De reactie wordt sterker doordat de CS vaker wordt aangeboden","De CR verzwakt als de CS herhaaldelijk zonder de OS komt, maar is niet definitief afgeleerd","De CR verdwijnt al na een enkele aanbieding zonder de OS en kan daarna nooit meer spontaan terugkeren","De CS wordt vervangen door een nieuwe ongeconditioneerde stimulus"],"a":1,"u":"Extinctie is de uitdoving of verzwakking van de CR wanneer de CS herhaaldelijk zonder de OS wordt aangeboden. Het is niet hetzelfde als afleren, want een enkele koppeling kan de reactie terugbrengen."},{"t":"2","q":"Volgens de behavioristen is klassieke conditionering het efficiëntst bij welke volgorde van bel en voedsel?","o":["Backward pairing, waarbij het voedsel voor de bel komt","Simultaneous pairing, waarbij bel en voedsel exact tegelijk komen","Trace conditioning, waarbij enkele minuten verstrijken tussen het einde van de bel en het voedsel","Forward pairing, waarbij de bel het voedsel ongeveer een halve seconde voorafgaat"],"a":3,"u":"Bij forward pairing gaat de CS (bel) de OS (voedsel) kort vooraf, ongeveer 0,5 seconde, en dat is volgens de behavioristen het effectiefst."},{"t":"2","q":"Wat toont het onderzoek met ratten die zoet water met licht en geluid kregen (de smaakaversie- en shockproeven) vooral aan?","o":["Contiguïteit is de enige noodzakelijke voorwaarde om te leren","Ratten leggen enkel associaties wanneer beide prikkels tot dezelfde zintuiglijke modaliteit behoren","Biologische predisposities bepalen mee welke associaties makkelijk geleerd worden","Alle prikkels zijn even makkelijk aan elk gevolg te koppelen"],"a":2,"u":"Ratten koppelen smaak makkelijk aan misselijkheid en licht of geluid aan pijn, wat aantoont dat biologische factoren (nature) meespelen bij welke associaties vlot geleerd worden."},{"t":"2","q":"Wat is het verschil tussen positieve en negatieve bekrachtiging bij operante conditionering?","o":["Positieve bekrachtiging dient een aangename prikkel toe, negatieve bekrachtiging neemt een onaangename prikkel weg","Positieve bekrachtiging verlaagt gedrag, negatieve bekrachtiging verhoogt gedrag","Beide zijn vormen van straf, waarbij positieve straf iets onaangenaams toedient en negatieve bekrachtiging het gedrag afremt","Positieve bekrachtiging neemt iets weg, negatieve bekrachtiging voegt iets pijnlijks toe"],"a":0,"u":"Positieve bekrachtiging (+R) dient een aangename prikkel toe en negatieve bekrachtiging (-R) neemt een onaangename prikkel weg. Beide leiden tot een toename van het gedrag."},{"t":"2","q":"Een trainer beloont een rat eerst als hij in de buurt van de hendel komt, daarna als hij hem aanraakt, en pas daarna als hij hem indrukt. Welk principe wordt hier gebruikt?","o":["Extinctie","Stimulusdiscriminatie","Shaping","Negatieve straf"],"a":2,"u":"Shaping vormt gedrag gradueel door successieve benaderingen van het gewenste gedrag te bekrachtigen, zoals het stap voor stap belonen richting het indrukken van de hendel."},{"t":"2","q":"Waarom is een partieel (intermitterend) bekrachtigingsschema beter bestand tegen extinctie dan continue bekrachtiging?","o":["Omdat elk gedrag altijd beloond wordt en dat gedrag daardoor niet verzwakt","Omdat het gedrag trager wordt aangeleerd maar men langer blijft reageren zonder bekrachtiging","Omdat continue bekrachtiging het gedrag nooit aanleert","Omdat partiële bekrachtiging enkel op vaste tijdstippen beloont en het gedrag daardoor een vaste gewoonte wordt"],"a":1,"u":"Bij partiële bekrachtiging wordt gedrag niet telkens beloond, waardoor het trager wordt verworven maar beter bestand is tegen extinctie. Men blijft langer reageren ook als de bekrachtiging uitblijft."},{"t":"2","q":"Wat leerden de honden uit de shocked groep in Seligmans onderzoek waarbij ze eerst geen ontsnapping hadden?","o":["Ze leerden sneller dan de controlegroep te ontsnappen","Ze bleven ook in een nieuwe situatie apathisch zitten en vermeden de shock niet","Ze vertoonden meteen efficiënt vermijdingsgedrag","Ze reageerden agressief op elke shock en probeerden voortdurend uit de kooi te ontsnappen"],"a":1,"u":"De shocked honden leerden zich hulpeloos te gedragen, en bleven zelfs toen ontsnappen wel mogelijk was apathisch zitten. Dit illustreert aangeleerde hulpeloosheid."},{"t":"3","q":"Volgens de James-Lange theorie is de juiste volgorde bij een emotie:","o":["Stimulus, lichamelijke reactie, emotie","Stimulus, emotie, lichamelijke reactie","Stimulus, interpretatie, arousal","Lichamelijke reactie en emotie tegelijk vanuit de thalamus"],"a":0,"u":"James-Lange stelt dat een prikkel eerst een reflexmatige lichamelijke reactie uitlokt, die de hersenen daarna interpreteren als emotie. Vandaar: we zijn verdrietig omdat we huilen, niet omgekeerd."},{"t":"3","q":"Wat is het kenmerkende verschil van de Cannon-Bard theorie tegenover James-Lange?","o":["De cognitieve beoordeling van de prikkel komt altijd eerst","De lichamelijke reactie en de emotie ontstaan langs twee onafhankelijke routes tegelijk","De emotie ontstaat pas nadat het lichaam volledig is gekalmeerd","De thalamus stuurt het signaal eerst naar de hersenschors en pas daarna door naar het lichaam"],"a":1,"u":"Bij Cannon-Bard splitst de prikkel zich vanuit de thalamus in twee onafhankelijke routes, zodat lichamelijke reactie en emotie samen optreden in plaats van na elkaar zoals bij James-Lange."},{"t":"3","q":"Iemand ziet in het donker een man met een pistool en beoordeelt dit als een negatieve prikkel, waarna angst en arousal volgen. Welke theorie past hier het best bij?","o":["Homeostatische driftreductietheorie","James-Lange theorie","Cognitieve appraisal theorie","Instincttheorie"],"a":2,"u":"In de cognitieve appraisal theorie komt de interpretatie (beoordeling) van de prikkel eerst, waarna arousal en emotie volgen. Het voorbeeld van de man met pistool als negatieve prikkel illustreert precies die beoordelingsstap."},{"t":"3","q":"Welke rol speelt de amygdala volgens dit hoofdstuk in het emotionele brein?","o":["Ze regelt vooral honger en dorst via homeostase","Ze zorgt voor de automatische angstreactie en reageert het sterkst bij angst","Ze onderdrukt kortetermijnverlangens ten voordele van langetermijndoelen","Ze bepaalt of een glimlach echt of gespeeld is"],"a":1,"u":"De amygdala is een deel van het limbisch circuit, staat centraal in het emotionele brein en zorgt voor de automatische angstreactie, met de sterkste reactie bij angst."},{"t":"3","q":"Is de fysiologische respons emotiespecifiek volgens de bron?","o":["Ja, elke emotie heeft een uniek en betrouwbaar herkenbaar patroon","Nee, er zijn verschillen maar niet specifiek genoeg om het type emotie uit af te leiden","Ja, bij walging en angst is de reactie zo specifiek dat je de emotie er meteen uit kunt afleiden","Nee, er zijn helemaal geen fysiologische verschillen tussen emoties"],"a":1,"u":"Volgens de tekst zijn er wel verschillen in fysiologische respons tussen emoties, maar ze zijn niet specifiek genoeg om er het exacte type emotie uit af te leiden."},{"t":"3","q":"Wat voorspelt de facial feedback hypothese?","o":["Dat gelaatsuitdrukkingen bij complexe emoties volledig aangeboren zijn","Dat je gezichtsuitdrukking je emotionele beleving beinvloedt","Dat de leugendetector emoties feilloos kan aflezen","Dat arousal een curvilineair verband heeft met prestatie"],"a":1,"u":"De facial feedback hypothese stelt dat de gezichtsuitdrukking zelf de emotionele beleving beinvloedt. In het experiment met de stift ervaren mensen cartoons als grappiger wanneer hun gezichtsspieren in een lachstand staan."},{"t":"3","q":"Wat is volgens dit hoofdstuk het beste voorbeeld van intrinsieke motivatie?","o":["Studeren om niet als dom over te komen bij anderen","De les aantrekkelijk maken met spelletjes zodat een kind toch wil meedoen","Een activiteit doen puur voor het plezier en de voldoening ervan zelf","Een marshmallow uitstellen om er later twee te krijgen"],"a":2,"u":"Intrinsieke motivatie betekent plezier en voldoening halen uit de activiteit zelf, zonder bijkomend doel. Je doet het voor jezelf, in tegenstelling tot extrinsieke motivatie die op een extern doel gericht is."},{"t":"3","q":"Wat beschrijft de wet van Yerkes-Dodson over de relatie tussen arousal en prestatie?","o":["Hoe meer arousal, hoe beter de prestatie, zonder bovengrens","Er bestaat een optimaal punt van arousal; te weinig of te veel is nadelig voor de prestatie","Arousal en prestatie staan los van elkaar, zodat spanning de uitvoering van een taak nooit beïnvloedt","Prestatie is maximaal bij volledige afwezigheid van arousal"],"a":1,"u":"De wet van Yerkes-Dodson beschrijft een curvilineair verband: er is een optimaal (bepaald) punt van arousal, terwijl zowel te weinig als te veel arousal de prestatie ondermijnt."},{"t":"4","q":"Volgens de psychoanalyse van Freud is het deel van de psyche dat het gedrag het sterkst stuurt vooral:","o":["het bewuste, waar we op elk moment aan denken","het onbewuste, met verlangens en conflicten waar we geen toegang toe hebben","het voorbewuste, dat we makkelijk kunnen oproepen","de introspectie, waarmee we onze eigen gedachten stap voor stap kunnen ontleden"],"a":1,"u":"Freud vergeleek het bewuste met het topje van de ijsberg; de niet-bewuste processen onderaan (onbewuste verlangens en conflicten) bepalen volgens hem de persoonlijkheid."},{"t":"4","q":"Een kind van drie dat meteen wil eten of geknuffeld worden zonder rekening te houden met de situatie, laat vooral het werk zien van:","o":["het superego dat morele normen oplegt","het ego dat met de realiteit onderhandelt","het id dat het lustprincipe volgt","het ego-ideaal dat het ideale zelf voorstelt"],"a":2,"u":"Het id is het primitieve, onbewuste deel dat sinds de geboorte aanwezig is en het lustprincipe volgt: onmiddellijke bevrediging en het vermijden van pijn."},{"t":"4","q":"Wat is volgens Rogers kenmerkend voor een GEZONDE persoonlijkheidsontwikkeling?","o":["een grote kloof tussen het actuele en het ideale zelf","congruentie tussen de fenomenologische en de objectieve realiteit","een blijvende fixatie in een vroeg psychoseksueel stadium van de ontwikkeling","het onderdrukken van de drang naar zelfactualisatie"],"a":1,"u":"Bij Rogers is een gezonde ontwikkeling er een waarbij de fenomenologische realiteit gelijk is aan de objectieve realiteit (congruentie), zodat de persoon zich kan ontplooien zoals hij of zij wil."},{"t":"4","q":"Een radicale behaviorist zou over persoonlijkheid het meest waarschijnlijk stellen dat:","o":["persoonlijkheid vooral bepaald wordt door aangeboren trekken","de mens start als een onbeschreven blad en het resultaat is van zijn conditioneringsgeschiedenis","onbewuste conflicten uit de kindertijd het gedrag sturen","de drang naar zelfactualisatie de belangrijkste drijfveer is en persoonlijkheid van binnenuit groeit"],"a":1,"u":"Radicale behavioristen zien de mens als een tabula rasa (onbeschreven blad); persoonlijkheid is volgens hen het resultaat van de unieke conditioneringsgeschiedenis en persoonlijkheidsproblemen zijn verkeerd aangeleerd gedrag."},{"t":"4","q":"Iemand met een sterke overtuiging dat wat hem overkomt vooral in zijn eigen handen ligt, scoort hoog op een intern soort van:","o":["locus of control","fenomenologische realiteit","castratieangst","catharsis"],"a":0,"u":"Locus of control verwijst naar de overtuiging of wat je overkomt onder interne of externe controle staat, oftewel of je je lot in eigen handen hebt of niet."},{"t":"4","q":"Wat is het belangrijkste bezwaar tegen de MBTI zoals dat in de leerstof wordt genoemd?","o":["hij meet te veel trekken tegelijk om bruikbaar te zijn","hij gebruikt een categorische aanpak terwijl persoonlijkheid eerder op een continuum ligt","hij is enkel gebaseerd op lichaamsbouw en deelt mensen in endomorfe, ectomorfe en mesomorfe types in","hij houdt geen rekening met introversie en extraversie"],"a":1,"u":"De MBTI zet mensen in vaste hokjes (categorische benadering), maar persoonlijkheidseigenschappen zijn normaal verdeeld en liggen op een continuum; daarom is het onderscheid in types niet terug te vinden in metingen."},{"t":"4","q":"De trekbenadering verschilt vooral van de typebenadering doordat ze ervan uitgaat dat:","o":["je een eigenschap ofwel volledig hebt ofwel helemaal niet","mensen meer of minder van een bepaald kenmerk hebben op een continuum","persoonlijkheid volledig door de omgeving wordt bepaald","de verhouding van de vier lichaamsvochten je persoonlijkheidstype vastlegt"],"a":1,"u":"De trekbenadering is dimensioneel in plaats van categorisch: iedereen wordt beschreven met hetzelfde beperkte aantal kenmerken waarvan men meer of minder heeft, in plaats van in aparte vakjes."},{"t":"4","q":"Welke reeks factoren hoort bij het Big Five-model (OCEAN)?","o":["bloed, slijm, zwarte gal en gele gal","openheid, extraversie, dominantie, emotionele stabiliteit en zelfvertrouwen","openheid, conscientieusheid, extraversie, aangenaamheid en neuroticisme","denken, voelen, oordelen en percipieren"],"a":2,"u":"De Big Five (OCEAN) bestaat uit openheid voor ervaringen, conscientieusheid, extraversie, aangenaamheid en neuroticisme (emotionele stabiliteit)."},{"t":"4","q":"Uit tweelingonderzoek naar de Big Five concludeert de leerstof dat persoonlijkheid:","o":["volledig vastligt in de genen en dus na de geboorte niet meer verandert","volledig door de omgeving wordt gevormd","deels erfelijk is, ongeveer half aangeboren en half omgeving","geen enkele erfelijke component heeft"],"a":2,"u":"Op basis van tweelingvoorbeelden stelt de leerstof dat persoonlijkheid deels erfelijk is, met een verdeling van ongeveer 50% aangeboren en 50% omgeving."},{"t":"4","q":"Bij projectieve testen zoals de Rorschach en de TAT is het uitgangspunt dat:","o":["er een duidelijk juist antwoord is dat objectief gescoord wordt","de persoon onbewuste preoccupaties projecteert op vaag materiaal","enkel de reactietijd de persoonlijkheid meet","de betrouwbaarheid en validiteit uitstekend zijn aangetoond"],"a":1,"u":"Projectieve testen gaan uit van het principe van projectie: zonder juist antwoord projecteert de persoon onbewuste preoccupaties op het materiaal; de kritiek is juist dat de betrouwbaarheid en validiteit onvoldoende zijn aangetoond."},{"t":"5","q":"Wat is het verschil tussen gewaarwording en waarneming volgens het hoofdstuk?","o":["Beide begrippen betekenen precies hetzelfde en worden door elkaar gebruikt","Gewaarwording is het actief toekennen van betekenis, waarneming is enkel ruwe zintuigprikkeling","Gewaarwording is de stimulatie van de zintuigen zonder betekenis, waarneming is het actief interpreteren ervan door het brein","Gewaarwording gebeurt volledig in het brein, terwijl waarneming zich in de zintuigen zelf afspeelt en daar al betekenis krijgt"],"a":2,"u":"Gewaarwording is de betekenisloze stimulatie van de zintuigen door de buitenwereld. Waarneming is het actieve proces waarbij de hersenen die gewaarwording interpreteren en er betekenis aan geven."},{"t":"5","q":"Waarom kan een blinde vlek in het oog ons meestal niet opvallen?","o":["Omdat de fovea het scherpste deel van het beeld overneemt","Omdat er in de blinde vlek juist extra receptoren zitten","Omdat het brein de ontbrekende informatie actief aanvult","Omdat we voortdurend knipperen en zo de vlek wegwerken"],"a":2,"u":"De blinde vlek is de plek waar de oogzenuw het oog verlaat en waar geen receptoren zitten. De hersenen vullen dit gat op, waardoor we geen vlek zien."},{"t":"5","q":"Iemand loopt van je weg, waardoor het beeld op je netvlies steeds kleiner wordt, maar toch blijf je die persoon als even groot waarnemen. Welk fenomeen beschrijft dit?","o":["Binoculaire dispariteit","Grootteconstantie","Apparente beweging","Laterale inhibitie"],"a":1,"u":"Perceptuele constantie houdt de waarneming stabiel ondanks een wisselend retinaal beeld. Grootteconstantie zorgt ervoor dat een persoon even groot lijkt, ook al krimpt het netvliesbeeld."},{"t":"5","q":"Wat is het verschil tussen een proximale en een distale stimulus?","o":["De proximale stimulus is het voorwerp zelf, de distale stimulus is het beeld op de retina","De proximale stimulus is de fysische energie die je receptoren raakt, de distale stimulus is het voorwerp dat die energie produceert","Beide verwijzen naar hetzelfde voorwerp, alleen bekijk je het bij de proximale stimulus van dichtbij en bij de distale van ver","De distale stimulus stimuleert de receptoren, de proximale stimulus is het verre voorwerp"],"a":1,"u":"De proximale stimulus is het geheel van fysische energie dat de sensorische receptoren raakt, zoals lichtgolven op de retina. De distale stimulus is het voorwerp dat die energie reflecteert of produceert."},{"t":"5","q":"Waarom noemt het hoofdstuk waarneming een heuristisch interpretatieproces?","o":["Omdat het brein alle mogelijke distale stimuli even waarschijnlijk acht en pas na een volledige berekening van elke optie een keuze maakt","Omdat waarneming altijd een foutloze reconstructie van de wereld oplevert","Omdat de hersenen op basis van veronderstellingen de meest waarschijnlijke distale stimulus reconstrueren, wat meestal maar niet altijd klopt","Omdat waarneming enkel op de proximale stimulus steunt en verder niets veronderstelt"],"a":2,"u":"Een proximale stimulus kan van verschillende distale stimuli komen. Het brein reconstrueert daarom de meest waarschijnlijke distale stimulus op basis van veronderstellingen, wat meestal klopt maar bij illusies faalt."},{"t":"5","q":"Wat is het belangrijkste verschil tussen bottom-up en top-down verwerking?","o":["Bottom-up gaat van kennis en verwachtingen naar de buitenwereld, top-down van de omgevingsstimuli naar het individu","Bottom-up wordt gestuurd door de kenmerken van de omgevingsstimuli, top-down door kennis en verwachtingen","Beide worden volledig gestuurd door de kenmerken van de stimulus","Bottom-up speelt enkel bij herkenning, top-down enkel bij de primaire schets"],"a":1,"u":"Bottom-up verwerking loopt van de receptoren naar de hogere hersencentra en wordt gestuurd door de stimuluskenmerken. Top-down verwerking wordt gestuurd door kennis en verwachtingen, van individu naar buitenwereld."},{"t":"5","q":"In welke volgorde verlopen de drie stadia van de computationele theorie van Marr?","o":["Perceptuele organisatie, primaire schets, patroon- en objectherkenning","Patroon- en objectherkenning, primaire schets, perceptuele organisatie","Primaire schets, perceptuele organisatie, patroon- en objectherkenning","Primaire schets, patroon- en objectherkenning, perceptuele organisatie"],"a":2,"u":"Volgens Marr begint de verwerking met de primaire schets (2D vereenvoudiging van vlekken en lijnen), gevolgd door perceptuele organisatie (2,5D schets) en tot slot patroon- en objectherkenning (3D voorwerpgericht beeld)."},{"t":"5","q":"Je herkent een banaan doordat je hem opdeelt in de kenmerken geel en krom in plaats van hem met een compleet opgeslagen plaatje te vergelijken. Welk mechanisme van patroonherkenning is dit?","o":["Template-matching","Figuur-achtergrondscheiding","Kenmerkherkenning","Bewegingsparallax"],"a":2,"u":"Bij kenmerkherkenning worden voorwerpen herkend op basis van hun karakteristieke kenmerken (banaan = geel en krom). Template-matching zou het geheel juist met een opgeslagen sjabloon vergelijken."},{"t":"5","q":"Wat toont het woordsuperioriteitseffect aan over waarneming?","o":["Dat losse letters altijd sneller herkend worden dan letters in een woord","Dat context geen rol speelt bij het herkennen van letters","Dat een letter beter herkend wordt wanneer ze in een vertrouwd woord staat dan los, dankzij top-downprocessen","Dat een letter enkel beter herkend wordt wanneer ze groter wordt afgebeeld, doordat de bottom-upverwerking dan sterker is"],"a":2,"u":"Een letter wordt beter herkend als ze in een vertrouwd woord verschijnt dan wanneer ze los wordt getoond. Die vertrouwde context uit het geheugen ondersteunt de herkenning via top-downprocessen."},{"t":"6","q":"Wat gebeurt er volgens de spraakschaduw-experimenten met de boodschap die je moet negeren?","o":["Zowel de fysische als de inhoudelijke kenmerken worden bewust opgepikt","De fysische kenmerken zoals stemgeslacht en toon worden opgepikt, maar de inhoud niet","Enkel de inhoud wordt onthouden, de fysische kenmerken vallen weg","Er wordt niets van de te negeren boodschap opgepikt, ook je eigen naam valt volledig weg"],"a":1,"u":"Uit de spraakschaduw-taken bleek dat proefpersonen de fysische kenmerken (geslacht van de stem, toon, intensiteit) van het genegeerde oor wel oppikten, maar inhoudelijke veranderingen zoals een andere taal niet."},{"t":"6","q":"Waar plaatst het filtermodel de plek waar de selectie gebeurt?","o":["Pas na de semantische analyse, dus laat in het verwerkingsproces","Ergens tussen de twee verwerkingskanalen, dus vroeg in het proces","Helemaal aan het einde, in het langetermijngeheugen","Er is geen filter, enkel verzwakking van signalen"],"a":1,"u":"Het filtermodel gaat uit van vroege selectie: de filter zit ergens tussen beide verwerkingskanalen, nog voor de inhoud volledig verwerkt is."},{"t":"6","q":"Iemand roept plots jouw naam in een genegeerd gesprek en je pikt dat op. Welke verklaring past hier het best bij?","o":["De attenuatie-theorie, die stelt dat het genegeerde kanaal niet volledig wordt geblokkeerd maar verzwakt","Het strikte alles-of-niets-filtermodel, dat het genegeerde kanaal volledig afsluit","De feature integration theory, waarbij aandacht kenmerken bindt","Het pop-out effect, waarbij een opvallend kenmerk zoals je eigen naam er vanzelf uitspringt zonder aandacht"],"a":0,"u":"De attenuatie-theorie stelt dat er geen harde filtering is maar verzwakking, waardoor betekenisvolle info zoals je eigen naam toch kan doordringen. Dit wijst op late selectie."},{"t":"6","q":"Waarom is 'vind de rode L tussen de blauwe L-en' makkelijker dan een zoektaak waarbij je kenmerken moet combineren?","o":["Omdat conjunctiezoeken automatisch verloopt en geen aandacht vraagt","Omdat het aantal afleiders bij kenmerkzoeken de zoektijd sterk verhoogt","Omdat bij kenmerkzoeken een distinctief kenmerk eruit springt via het pop-out effect en geen aandacht vraagt","Omdat kleur door het visuele systeem altijd eerder verwerkt wordt dan vorm, waardoor kleurtaken los van aandacht verlopen"],"a":2,"u":"Bij kenmerkzoeken volstaat een onderscheidend kenmerk dat er automatisch uitspringt (pop-out), wat geen aandacht vraagt en niet afhangt van het aantal afleiders. Conjunctiezoeken vraagt wel aandacht."},{"t":"6","q":"Wat is volgens de feature integration theory de kernrol van aandacht?","o":["Aandacht verzwakt irrelevante signalen zonder ze te blokkeren","Aandacht werkt als lijm die de losse kenmerken van een object samenbindt","Aandacht selecteert enkel op de fysische kenmerken van een stimulus","Aandacht maakt kenmerkzoeken trager naarmate er meer afleiders zijn"],"a":1,"u":"Volgens de feature integration theory zorgt aandacht voor de integratie van kenmerken: aandacht is de lijm die de losse eigenschappen van een object aan elkaar bindt."},{"t":"6","q":"Waarom kunnen we volgens het hoofdstuk niet echt twee taken tegelijk uitvoeren?","o":["Omdat het brein twee taken perfect parallel verwerkt zonder verlies","Omdat we in werkelijkheid voortdurend afwisselen tussen taken, met taakwisselkosten tot gevolg","Omdat elke taak automatisch verloopt en dus geen aandacht vraagt","Omdat de aandachtsfilter beide taken volledig blokkeert zodra er meer dan één boodschap tegelijk binnenkomt"],"a":1,"u":"Volgens het hoofdstuk combineren we taken nooit echt samen maar wisselen we voortdurend af (taakwissel), wat taakwisselkosten oplevert waardoor de taken slechter worden uitgevoerd."},{"t":"6","q":"Waarom lukt het bij de Strooptaak niet om vlot de inktkleur van een kleurwoord te benoemen?","o":["Omdat kleur benoemen een automatisch proces is dat het lezen verstoort","Omdat lezen automatisch verloopt en botst met het gecontroleerde proces van de juiste kleur benoemen","Omdat beide taken volledig automatisch zijn en elkaar versterken","Omdat de kleurinformatie pas beschikbaar komt nadat de betekenis van het woord volledig verwerkt is"],"a":1,"u":"Lezen is een automatisch proces dat in de weg zit van het gecontroleerde proces (de inktkleur benoemen). De Strooptaak lokt zo een conflict uit tussen automatische en gecontroleerde processen."},{"t":"7","q":"Wat verstaat de tekst onder 'bewustzijn'?","o":["De subjectieve ervaring van gedachten, herinneringen, emoties en omgevingsprikkels waar je op dit moment besef van hebt","Het geheel van prikkels dat je hersenen registreren zonder dat je er ooit besef van hebt","Een vaste hersengolf die alleen tijdens diepe slaap voorkomt","De opslag van alle informatie in het langetermijngeheugen, waaruit je herinneringen ophaalt zodra je aandacht ergens op richt"],"a":0,"u":"Bewustzijn is volgens de bron de subjectieve ervaring van dat waar je nu besef van hebt, zoals gedachten, herinneringen, emoties en omgevingsstimuli."},{"t":"7","q":"In het semantische-primingonderzoek moesten proefpersonen een lexicale beslissing nemen. Wat hield die beslissing precies in?","o":["Zo snel mogelijk aangeven hoe mooi of aangenaam ze de aangeboden prikkel vonden op een schaal","Zo snel mogelijk beslissen of een reeks letters een echt woord vormde of niet","Aangeven waar op het scherm een stimulus verscheen","Een woord onthouden en het een week later herkennen"],"a":1,"u":"Bij een lexicale beslissing moet je zo snel mogelijk oordelen of de aangeboden letters wel of geen bestaand woord vormen, zoals 'tafel' tegenover 'falet'."},{"t":"7","q":"Iemand ziet heel kort het woord 'tafel' (een prime) en daarna 'stoel'. Volgens het primingonderzoek reageert die persoon dan sneller. Waarom?","o":["Omdat het tweede woord van een reeks altijd sneller herkend wordt, ongeacht wat eraan voorafging","Omdat de prime bewust en langdurig werd aangeboden","Omdat de prime en het doelwoord semantisch gerelateerd zijn en elkaar activeren","Omdat de persoon de prime niet heeft waargenomen"],"a":2,"u":"Als prime en doelwoord tot dezelfde inhoudelijke context horen (semantisch gerelateerd), reageren mensen sneller. Dit effect blijft zelfs bestaan als de prime maar in een flits verschijnt."},{"t":"7","q":"Wat is kenmerkend voor blindsightpatiënten?","o":["Ze hebben schade aan de hypothalamus en verliezen hun slaapritme","Ze zien alles bewust maar kunnen er niets over zeggen","Ze zeggen blind te zijn, maar gokken locatie of beweging van prikkels beter dan op kans te verwachten","Ze zijn door hun hersenschade extra gevoelig voor subliminale reclame en sturen hun koopgedrag onbewust bij"],"a":2,"u":"Door schade aan de primaire visuele cortex nemen deze patiënten prikkels in hun aangetaste gezichtsveld enkel onbewust waar, maar ze gokken locatie, richting en beweging beter dan het toeval, dus eigenlijk 'zien' ze wel."},{"t":"7","q":"Wat is de conclusie van de bron over subliminale reclame, zoals in het bioscooponderzoek?","o":["Het onderzoek toonde overtuigend aan dat verborgen boodschappen het koopgedrag sterk sturen","De onderzoeksresultaten bleken vervalst en er is geen degelijk bewijs dat subliminale berichten koopgedrag veranderen","Subliminale boodschappen werken enkel bij kinderen, omdat hun aandacht nog te weinig ontwikkeld is om ze te filteren","Verborgen reclame werkt beter dan gewone reclame in het dagelijks leven"],"a":1,"u":"De bekende bioscoopresultaten bleken gefraudeerd. Geen enkel zorgvuldig onderzoek heeft aangetoond dat subliminale boodschappen het koopgedrag echt veranderen."},{"t":"7","q":"Welke hersenstructuur wordt in de tekst beschreven als onze 'interne klok' die het biologisch ritme regelt?","o":["De hersenstam","De primaire visuele cortex","De hersenschors","De nucleus suprachiasmaticus"],"a":3,"u":"De nucleus suprachiasmaticus is volgens de bron verantwoordelijk voor ons biologisch ritme en werkt als onze interne klok, die zelfs zonder licht-donkersignalen doorloopt."},{"t":"7","q":"Wat is typisch voor de REM-slaap volgens de tekst?","o":["Trage deltagolven en de diepste slaap van de nacht","De hoge amplitude van de K-complex en slaapspoelen","Ontspannen alfagolven waarbij de aandacht losser wordt en de ademhaling regelmatiger","Droomslaap met spierverlamming en verhoogde hersenactiviteit die op stadium 1 lijkt"],"a":3,"u":"REM is de droomslaap met spierverlamming, terwijl de hersenactiviteit weer toeneemt en op stadium 1 gaat lijken. Per nacht kom je 4 a 5 keer in REM, telkens langer."},{"t":"7","q":"Hoe verklaart de activatiesynthesetheorie het ontstaan van dromen?","o":["Hogere hersencentra proberen willekeurige ruis uit lagere hersencentra betekenis te geven","De hersenen worden tijdens de slaap volledig uitgeschakeld","Dromen dienen enkel om herinneringen letterlijk te kopiëren naar het kortetermijngeheugen","Dromen ontstaan door externe reclameboodschappen tijdens de slaap"],"a":0,"u":"Volgens deze theorie produceren lagere hersencentra in de hersenstam willekeurige elektrische ruis, en dromen zijn de poging van de cortex om die ruis betekenis te geven."},{"t":"8","q":"Wat is het kenmerkende verloop van de vergeetcurve van Ebbinghaus?","o":["We vergeten de eerste dagen nauwelijks iets en verliezen daarna steeds sneller informatie","We vergeten eerst snel en daarna steeds trager, waarbij een deel permanent blijft","We vergeten alles even snel, ongeacht hoeveel tijd er verstrijkt","We onthouden eerst weinig en gaan pas na weken echt vergeten"],"a":1,"u":"Volgens de bron vergeten we snel in de eerste dagen na het leren en daarna veel trager, terwijl een deel permanent behouden blijft."},{"t":"8","q":"In het iconisch-geheugenexperiment van Sperling scoorden proefpersonen bijna foutloos wanneer ze na een toon een bepaalde rij letters moesten geven, terwijl ze bij het rapporteren van alle letters maar 4 van de 9 juist hadden. Wat toont dit vooral aan?","o":["Dat het iconisch geheugen maar 4 letters tegelijk kan opslaan","Dat een toon als geheugensteun maakt dat auditieve info beter blijft hangen dan visuele","Dat we heel veel visuele info kort registreren, maar dat die zeer snel vervaagt","Dat aandacht geen enkele rol speelt bij het rapporteren van letters"],"a":2,"u":"De bron stelt dat we heel veel info kort bijhouden (80-85%), maar dat die binnen minder dan 500 ms vervaagt. Daarom kon men bij gerichte rapportage nog een volledige rij weergeven."},{"t":"8","q":"Iemand noemt eenmalig een telefoonnummer en je probeert het te onthouden zonder het op te schrijven. Op welk geheugensysteem en welke grens doe je dan vooral een beroep?","o":["Het kortetermijngeheugen, met een capaciteit rond de 7 items","Het sensorisch register, dat de info uren vasthoudt","Het langetermijngeheugen, dat onbeperkt cijfers opslaat","Het procedureel geheugen, dat vooral vaardigheden bewaart"],"a":0,"u":"Volgens Miller slagen de meeste mensen erin 5 tot 9 items correct te rapporteren (het magische getal 7 plus of min 2). Dit is de capaciteit van het kortetermijngeheugen."},{"t":"8","q":"Wat is het verschil tussen het primacy- en het recency-effect in de seriele positiecurve?","o":["Primacy betreft de laatste woorden vanuit het KTG, recency de eerste woorden vanuit het LTG","Primacy en recency slaan allebei op de middelste woorden van de lijst, die het langst in het werkgeheugen circuleren","Beide effecten ontstaan doordat de woorden nog in het sensorisch register zitten","Primacy betreft de eerste woorden die naar het LTG gaan, recency de laatste woorden die nog vers in het KTG zitten"],"a":3,"u":"De bron beschrijft het primacy-effect als de eerste woorden die via herhaling in het LTG komen, en het recency-effect als de laatste woorden die nog het verst in het KTG zitten."},{"t":"8","q":"Een fietser kan perfect fietsen maar vindt het lastig om in woorden uit te leggen hoe dat precies gaat. Bij welk geheugentype hoort dit vooral?","o":["Semantisch (talig) kennisgeheugen","Procedureel (impliciet) geheugen","Episodisch geheugen","Declaratief geheugen"],"a":1,"u":"Het procedureel geheugen is onbewust en impliciet: het gaat over hoe je iets doet en is moeilijk exact in woorden te beschrijven, zoals bij fietsen."},{"t":"8","q":"Volgens de tweevoudige codeertheorie van Paivio onthoud je stof beter wanneer je ze op twee manieren codeert. Welke aanpak past hier het best bij?","o":["De les woord voor woord letterlijk herhalen tot je ze uit je hoofd kent","De stof zowel visueel (bijvoorbeeld met kleur of schema's) als verbaal in eigen woorden verwerken","De stof in een keer instuderen zonder pauzes, zodat de leerstof als een aaneengesloten blok wordt opgeslagen","Enkel de eerste letter van elk begrip proberen te onthouden"],"a":1,"u":"Paivio's dubbele codering stelt dat twee codes, een visuele en een verbale, beter worden onthouden dan een. Je zet de les dus om in eigen woorden en gebruikt bijvoorbeeld fluostiften of een inhoudstafel."},{"t":"8","q":"In het experiment van Craik en Tulving moesten mensen bij woorden verschillende vragen beantwoorden. Welke vraag leidde tot de beste herinnering?","o":["Of het woord in hoofdletters geschreven was","Of het woord rijmde op een ander woord","Of het woord een dier aanduidde","Of het woord uit vier letters bestond"],"a":2,"u":"De betekenisvraag (is het een dier?) zorgt voor diepere verwerking en werd volgens de bron het best onthouden: hoe dieper je verwerkt, hoe beter je geheugen."},{"t":"8","q":"Bij het duikersexperiment van Godden en Baddeley leerden duikers woorden aan land of onder water en werden ze in dezelfde of een andere context getest. Welk principe illustreert dit?","o":["Retroactieve interferentie, waarbij nieuwe info oudere info verdringt","De hypothese van codeerspecificiteit: herinnering verbetert als de oproepcontext lijkt op de leercontext","Het toetseffect, waarbij jezelf testen de opslag bevordert","Het magische getal zeven: het kortetermijngeheugen houdt maar een beperkt aantal eenheden tegelijk vast"],"a":1,"u":"Volgens de codeerspecificiteitshypothese bevordert een oproepcontext die lijkt op de leercontext het oproepingsproces. Het duikersexperiment toont dit."},{"t":"9","q":"Wat wordt in dit hoofdstuk verstaan onder analytische intelligentie?","o":["Het geheel van verstandelijke vermogens om abstract, logisch en consistent te redeneren","Het vermogen om problemen in een concrete, alledaagse situatie op te lossen","Het aangeboren talent voor muziek, sport of sociale omgang dat je zonder oefening al bezit","De vaardigheid om je in te leven in wat een ander denkt of voelt"],"a":0,"u":"Analytische intelligentie is het geheel van verstandelijke vermogens om abstract, logisch en consistent te redeneren, wat belangrijk is voor schoolse en professionele prestaties."},{"t":"9","q":"Volgens de klassieke IQ-formule van Stern (ML/CL x 100) ontstaat er een probleem. Welk?","o":["De formule houdt geen rekening met de culturele achtergrond van de testpersoon","De formule geeft altijd een score boven de 100","De formule werkt bij kinderen maar loopt mis bij volwassenen","De formule kan enkel bij tweelingen worden toegepast"],"a":2,"u":"De formule mentale leeftijd / chronologische leeftijd x 100 werkt bij kinderen, maar niet bij volwassenen. Een vader van 40 met dezelfde prestatie als zijn zoon van 20 zou zo een veel lager IQ krijgen."},{"t":"9","q":"Waarin verschillen de verbale en de performale subtests van de Wechsler-test?","o":["Verbale meet klassieke schoolse kennis, performale meet niet-taalgebonden, praktische en motorische opdrachten","Verbale is voor kinderen, performale enkel voor volwassenen","Verbale meet erfelijkheid, performale meet omgevingsinvloeden","Verbale meet vooral verwerkingssnelheid, performale meet uitsluitend het geheugen voor cijfers en figuren"],"a":0,"u":"Bij Wechsler staat de verbale schaal voor de klassieke schoolse intelligentie, terwijl de performale schaal niet-taalgebonden kennis meet via praktische en motorische opdrachten."},{"t":"9","q":"Voor welke testpersoon is een niet-verbale test zoals de Raven progressive matrices het meest geschikt?","o":["Iemand die uitzonderlijk hoog scoort op schoolse taaltests","Iemand bij wie je wil nagaan hoeveel van de intelligentie erfelijk bepaald is","Iemand met verbale problemen, weinig educatie of een andere culturele achtergrond","Iemand van wie je enkel de gekristalliseerde kennis wil meten"],"a":2,"u":"Bij verbale problemen, weinig genoten onderwijs of een andere culturele achtergrond zijn taalgevoelige, schoolse tests niet bruikbaar. Een niet-verbale test die redeneren meet, zoals de Raven matrices, is dan wel geschikt."},{"t":"9","q":"Een intelligentietest is een psychometrische test. Wat betekent dat in dit hoofdstuk?","o":["Dat de test uitsluitend zichtbaar gedrag meet en geen innerlijke kenmerken","Dat het een objectief meetinstrument is voor psychische kwaliteiten","Dat de score meteen exact 100% betrouwbaar is","Dat de test geen normsteekproef nodig heeft"],"a":1,"u":"Een psychometrische test is het meten van psychologische kenmerken. De intelligentietest is zo'n objectief meetinstrument voor psychische kwaliteiten."},{"t":"9","q":"Een IQ van 97 wordt gerapporteerd met een 95%-betrouwbaarheidsinterval van 90 tot 104. Wat betekent dit?","o":["Dat het IQ met zekerheid precies 97 is","Dat 95 procent van de testpersonen een IQ tussen 90 en 104 behaalt","Dat er 95% zekerheid is dat het werkelijke IQ tussen 90 en 104 ligt","Dat het IQ elke test met 5 punten stijgt"],"a":2,"u":"Geen enkele test is 100% betrouwbaar, er zit altijd meetfout op. Het interval geeft aan dat men met 95% zekerheid kan zeggen dat het werkelijke IQ tussen 90 en 104 ligt."},{"t":"9","q":"Waarom is een hoge betrouwbaarheid wel noodzakelijk maar niet voldoende voor een goede validiteit?","o":["Omdat een test consistent kan meten en toch niet meten wat hij beweert te meten","Omdat de betrouwbaarheid pas meetelt zodra de validiteit van de test al is aangetoond","Omdat validiteit altijd hoger is dan betrouwbaarheid","Omdat een betrouwbare test per definitie ook valide is"],"a":0,"u":"Betrouwbaarheid gaat over consistente, herhaalbare resultaten, terwijl validiteit gaat over of de test meet wat hij beweert. Een uurwerk dat in de winter op zomeruur staat, meet consistent maar toch fout."},{"t":"9","q":"Wat stelde Spearman met zijn onderscheid tussen de g-factor en de s-factoren?","o":["Dat intelligentie volledig aangeboren en onveranderlijk is","Dat er een algemene intelligentie (g-factor) bestaat naast specifieke mentale vaardigheden (s-factoren)","Dat er acht van elkaar losstaande intelligenties zijn","Dat schoolse tests enkel taalvaardigheid meten en dus niets zeggen over iemands algemene denkvermogen"],"a":1,"u":"Spearman onderscheidde een algemene intelligentie, de g-factor, van specifieke mentale vaardigheden, de s-factoren, zoals verbale vaardigheden."},{"t":"9","q":"Wat is volgens Cattell het verschil tussen vloeiende en gekristalliseerde intelligentie?","o":["Vloeiende komt voort uit opgebouwde kennis, gekristalliseerde uit abstract denken","Vloeiende gaat over problemen oplossen en abstract denken, gekristalliseerde over opgebouwde kennis","Beide verwijzen uitsluitend naar de snelheid waarmee iemand eenvoudige motorische taken uitvoert","Vloeiende is enkel bij kinderen aanwezig, gekristalliseerde enkel bij dieren"],"a":1,"u":"Vloeiende intelligentie gaat over problemen oplossen, abstract denken en nieuwe dingen leren, terwijl gekristalliseerde intelligentie voortkomt uit de kennis die je doorheen je leven opbouwt."},{"t":"9","q":"Hoe verandert intelligentie doorgaans naarmate iemand ouder wordt?","o":["Zowel vloeiende als gekristalliseerde intelligentie nemen sterk af","Gekristalliseerde intelligentie verdwijnt, vloeiende blijft gelijk","Beide vormen nemen elk decennium licht toe doordat levenservaring het denkvermogen blijft aanscherpen","Vloeiende intelligentie neemt af, gekristalliseerde intelligentie blijft op peil en bouwt op"],"a":3,"u":"Bij het ouder worden neemt de vloeiende intelligentie af (snelheid en nauwkeurigheid van informatieverwerking daalt), terwijl de gekristalliseerde intelligentie, de algemene kennis, niet afneemt en blijft opbouwen."},{"t":"9","q":"Iemand haalt geen hoge score op een klassieke IQ-test, maar is uitzonderlijk goed in muziek en beweging. Bij welke theorie past deze visie het best?","o":["Spearmans g-factor, waarbij één algemene factor alles bepaalt","De theorie van de meervoudige intelligenties van Gardner","Sterns IQ-formule met mentale en chronologische leeftijd","Het CHC-model met een strikt drielagige structuur"],"a":1,"u":"Gardner stelt dat je niet hoog hoeft te scoren op een IQ-test om uitzonderlijke kwaliteiten te hebben. In zijn theorie van de meervoudige intelligenties is intelligentie de vaardigheid om problemen op te lossen in een bepaald gebied, zoals het muzikale of lichamelijk-kinesthetische domein."},{"t":"10","q":"Wat zijn de drie klassieke criteria om te bepalen of iets een mentale stoornis is?","o":["Statistisch, sociaal en persoonlijk criterium","Biologisch, psychologisch en spiritueel criterium","Genetisch, omgevings- en cultureel criterium","Diagnostisch, prognostisch en therapeutisch criterium"],"a":0,"u":"De drie criteria zijn: statistisch (grote afwijking van de normaalverdeling), sociaal (overtreding van sociale normen, cultuurafhankelijk) en persoonlijk (chronisch lijden/schade). Geen enkel criterium is op zich waterdicht, maar samen dekken ze de meerderheid van mentale stoornissen."},{"t":"10","q":"Wat stelt het diathese-stressmodel?","o":["Een stoornis ontstaat door de combinatie van een onderliggende kwetsbaarheid (diathese) en een uitlokkende gebeurtenis (stress)","Elke stress leidt automatisch tot een mentale stoornis","Diathese en stress zijn twee namen voor hetzelfde biologische proces","Enkel biologische kwetsbaarheid speelt een rol, omgeving niet"],"a":0,"u":"Het diathese-stressmodel (onderdeel van het biopsychosociale model) verklaart waarom mensen met dezelfde trigger (stress) verschillend reageren: het hangt af van hun onderliggende (biologische, psychologische, sociale) kwetsbaarheid (diathese)."},{"t":"10","q":"Wat is comorbiditeit?","o":["Wanneer iemand tegelijk voldoet aan de criteria van meerdere aandoeningen","Het overlijden ten gevolge van een mentale stoornis","Een verouderde term voor psychose","Het herstel van een aandoening zonder behandeling"],"a":0,"u":"Comorbiditeit betekent dat iemand niet aan slechts 1 diagnose voldoet, maar aan de criteria van meerdere aandoeningen tegelijk — dit komt in de praktijk vaak voor."},{"t":"10","q":"Wat is het verschil tussen positieve en negatieve symptomen bij psychose?","o":["Positieve symptomen zijn iets dat aanwezig is dat er normaal niet hoort te zijn; negatieve symptomen zijn de afwezigheid van iets dat er normaal wél hoort te zijn","Positieve symptomen zijn prettig voor de patiënt, negatieve zijn onprettig","Negatieve symptomen komen enkel voor bij bipolaire stoornis","Positieve symptomen verschijnen enkel bij herstel"],"a":0,"u":"Positieve symptomen (hallucinaties, wanen, gebrek aan samenhang, bizar gedrag) voegen iets abnormaals toe. Negatieve symptomen (affectvervlakking, terugtrekking, apathie) zijn de afwezigheid van normaal functioneren, vaak na een acute psychotische periode."},{"t":"10","q":"Wat is het verschil tussen een hallucinatie en een waan(beeld)?","o":["Een hallucinatie is een perceptie zonder aanwezige prikkel, een waan is een verkeerde interpretatie van een wél aanwezige prikkel","Beide zijn identiek en worden door elkaar gebruikt","Een waan is altijd auditief, een hallucinatie altijd visueel","Een hallucinatie komt enkel voor bij depressie"],"a":0,"u":"Een hallucinatie is een perceptie (vaak auditief, zoals stemmen) zonder dat er een prikkel aanwezig is. Een waan is een verkeerde interpretatie van een sensorische prikkel die wél aanwezig is (bv. achtervolgingswaan, betrekkingswaan, grootheidswaan)."},{"t":"10","q":"Hoe werken antipsychotica (dopamine-antagonisten) biologisch?","o":["Ze blokkeren dopaminereceptoren zodat het te hoge dopaminegehalte bij psychose niet meer kan doorgegeven worden tussen neuronen","Ze verhogen het dopaminegehalte in het brein","Ze werken enkel in op serotonine, niet op dopamine","Ze herstellen beschadigde hersencellen"],"a":0,"u":"Psychose gaat gepaard met een te hoog dopaminegehalte. Antipsychotica blokkeren de dopaminereceptor (het 'slot'), zodat dopamine (de 'sleutel') niet meer kan doorgegeven worden van het ene neuron naar het andere."},{"t":"10","q":"Wat is het verband tussen serotonine en de behandeling van depressie?","o":["Bij depressie is er te weinig serotonine; medicatie zorgt dat serotonine minder snel wordt afgebroken/heropgenomen","Bij depressie is er te veel serotonine, medicatie verlaagt dit","Serotonine speelt geen rol bij depressie, enkel dopamine","Medicatie tegen depressie werkt via cortisol, niet serotonine"],"a":0,"u":"Bij depressie is er te weinig serotonine (een neurotransmitter) in het brein. Medicatie zorgt ervoor dat het postsynaptische neuron serotonine niet terug opneemt/afbreekt, waardoor het serotoninegehalte op peil blijft."},{"t":"10","q":"Wat kenmerkt een bipolaire stoornis?","o":["Afwisselende depressieve en manische episodes, die niet terugkeren naar een basisniveau maar doorschieten","Enkel langdurige depressieve episodes zonder manie","Een stoornis die uitsluitend bij kinderen voorkomt","Constante, stabiele stemming zonder wisselingen"],"a":0,"u":"Bipolaire stoornis kenmerkt zich door afwisselende depressieve en manische episodes (rusteloosheid, impulsief/roekeloos gedrag) die niet terugkeren naar een neutraal basisniveau, maar telkens doorschieten naar de andere pool."},{"t":"10","q":"Wat is exposure-therapie met responspreventie, en bij welke stoornis wordt het vooral gebruikt?","o":["Blootstelling aan de angstwekkende situatie zonder de compulsie uit te voeren, vooral bij obsessief-compulsieve stoornis","Medicatie die compulsies chemisch onderdrukt, gebruikt bij depressie","Een vorm van hypnose die enkel bij dissociatieve stoornissen gebruikt wordt","Het vermijden van elke blootstelling aan de angstwekkende prikkel"],"a":0,"u":"Bij OCS doorbreekt exposuretherapie met responspreventie de vicieuze cirkel: de persoon wordt blootgesteld aan de angstwekkende trigger (bv. deur aanraken) zonder de compulsie (handen wassen) uit te voeren, waardoor de angst uitdooft."},{"t":"10","q":"Wat is dissociatie?","o":["Een deel van het bewustzijn dat zich afsplitst, met een gevoel van loskomen van zichzelf of de omgeving","Een synoniem voor een manische episode","Het volledig verlies van korte- en langetermijngeheugen door veroudering","Een positief symptoom van schizofrenie"],"a":0,"u":"Dissociatie is het gevoel dat een deel van het bewustzijn zich afsplitst van zichzelf of de omgeving, vaak als manier om angst en stress te ontlopen; het komt vooral voor bij mensen met ernstig, herhaald of langdurig trauma."},{"t":"10","q":"Wat is het verschil tussen dissociatieve amnesie en dissociatieve identiteitsstoornis?","o":["Dissociatieve amnesie is geheugenverlies met psychologische oorzaak; dissociatieve identiteitsstoornis is de afwisseling van twee of meer persoonlijkheden","Beide termen zijn identiek","Dissociatieve identiteitsstoornis is een vorm van geheugenverlies zonder identiteitsverandering","Dissociatieve amnesie komt enkel voor bij schizofrenie"],"a":0,"u":"Dissociatieve amnesie is (deels of veralgemeend) geheugenverlies met een psychologische oorzaak, zonder biologisch defect. Dissociatieve identiteitsstoornis is het afwisselen van twee of meer persoonlijkheden, meestal getriggerd door zware stress."},{"t":"10","q":"Waarom wordt de theory of mind vaak getest bij autismespectrumstoornis (ASS)?","o":["Omdat mensen met ASS vaak moeite hebben om het perspectief van een ander (bv. bij de Sally-Anne test) juist in te schatten","Omdat theory of mind enkel bij volwassenen met ASS ontwikkelt","Omdat theory of mind losstaat van sociale communicatie","Omdat het een biologische marker is die ASS met een bloedtest aantoont"],"a":0,"u":"Theory of mind is het vermogen om te begrijpen dat anderen andere gedachten, wensen en kennis hebben dan jijzelf. Mensen met ASS hebben hier vaak moeite mee, wat blijkt uit taken zoals de Sally-Anne test (false belief)."},{"t":"nieuw","q":"Wat is transductie volgens het materiaal?","o":["Het omzetten van stimulusenergie in een zenuwimpuls","Het opslaan van informatie in het langetermijngeheugen","Het toekennen van betekenis aan een percept","Het herhalen van een prikkel tot ze verdwijnt"],"a":0,"u":"Transductie is de omzetting van stimulusinformatie (fysische energie) in een zenuwimpuls, het neurale bericht."},{"t":"nieuw","q":"Koud water voelt na enige tijd minder koud aan, ook al blijft de temperatuur gelijk. Welk proces verklaart dit volgens het materiaal?","o":["Sensorische adaptatie","De absolute drempel","Signaaldetectie","Gestaltvorming"],"a":0,"u":"Bij sensorische adaptatie worden receptorcellen minder gevoelig als de stimulus lang op hetzelfde niveau blijft."},{"t":"nieuw","q":"Welke uitspraak over de wet van Weber klopt volgens het materiaal?","o":["Het juist waarneembare verschil is evenredig met de intensiteit van de stimulus","Het juist waarneembare verschil is voor alle stimuli even groot","Een stimulus wordt altijd opgemerkt boven de absolute drempel","Mensen merken alleen veranderingen die het dubbele zijn"],"a":0,"u":"Volgens de wet van Weber is het juist waarneembaar verschil groot bij sterke stimuli en klein bij zwakke stimuli."},{"t":"nieuw","q":"Een persoon ziet in een donkere ruimte alleen grijstinten en geen kleuren. Welke fotoreceptoren zijn dan vooral actief?","o":["Staafjes","Kegeltjes","De blinde vlek","De fovea"],"a":0,"u":"Staafjes zijn gevoelig voor zwak licht maar niet voor kleuren; kegeltjes zijn gevoelig voor kleuren en fel licht."},{"t":"nieuw","q":"Wat is de functie van de blinde vlek in het oog volgens het materiaal?","o":["Daar verlaat de optische zenuw het oog en zijn geen fotoreceptoren","Daar wordt het licht gefilterd door de iris","Daar bevindt zich de visuele cortex","Daar wordt het scherpste zicht gevormd"],"a":0,"u":"De blinde vlek is de plaats waar de optische zenuw het oog verlaat; daar zijn geen fotoreceptoren."},{"t":"nieuw","q":"Welke theorie stelt dat kleurzicht ontstaat door drie soorten kegeltjes, gevoelig voor rood, blauw en groen?","o":["De trichromatische theorie van Thomas Young","De opponente-procestheorie","De plaatstheorie","De wet van Weber"],"a":0,"u":"De trichromatische theorie van Thomas Young verklaart de initiele stadia van kleurzicht met drie soorten kegeltjes."},{"t":"nieuw","q":"Welk fysisch kenmerk van zichtbaar licht bepaalt volgens het materiaal de tint van de kleurervaring?","o":["De golflengte","De amplitude","De frequentie van het geluid","De temperatuur van het oppervlak"],"a":0,"u":"De golflengte bepaalt de tint, terwijl de amplitude (intensiteit) de helderheid bepaalt."},{"t":"nieuw","q":"Welk fysisch kenmerk van een geluidsgolf bepaalt volgens het materiaal het volume dat we horen?","o":["De amplitude","De frequentie","De complexiteit van de golf","De snelheid van het geluid"],"a":0,"u":"Volume wordt geproduceerd door de amplitude of intensiteit van de geluidsgolf."},{"t":"nieuw","q":"Elementen die dicht bij elkaar staan worden als groep waargenomen. Welke Gestaltwet is dit volgens het materiaal?","o":["Nabijheid","Gelijkenis","Continuering","Prägnanz"],"a":0,"u":"De wet van nabijheid stelt dat elementen die dicht bij elkaar staan als een geheel worden gezien."},{"t":"nieuw","q":"Welke verwerking benadrukt volgens het materiaal de verwachtingen, concepten en herinneringen van de waarnemer?","o":["Top-down verwerking","Bottom-up verwerking","Transductie","Sensorische adaptatie"],"a":0,"u":"Top-down verwerking benadrukt de cognitieve factoren van de waarnemer, zoals verwachtingen en herinneringen."},{"t":"nieuw","q":"Welk visueel pad verwerkt volgens het materiaal informatie over waar iets zich in de ruimte bevindt?","o":["Het waar-pad","Het wat-p
