ad","De auditieve cortex","De fonologische lus"],"a":0,"u":"Het 'waar'-pad, dat naar de pariëtale kwab loopt, verwerkt waar iets staat; het 'wat'-pad verwerkt kleur en vorm."},{"t":"nieuw","q":"Wat is de ongeconditioneerde stimulus in het experiment van Pavlov volgens het materiaal?","o":["Voedsel","De bel","De speekselafscheiding na de bel","De geconditioneerde reflex"],"a":0,"u":"De ongeconditioneerde stimulus (UCS) is het voedsel dat automatisch een speekselrespons oproept."},{"t":"nieuw","q":"Wat is uitdoving bij klassieke conditionering volgens het materiaal?","o":["De geleidelijke afname van de geconditioneerde associatie door het uitblijven van de ongeconditioneerde stimulus","Het onthouden van een associatie na vele jaren","Het aanleren van een volledig nieuwe reflex","Het opnieuw koppelen van een neutrale stimulus aan voedsel"],"a":0,"u":"Bij uitdoving verdwijnt de associatie wanneer de ongeconditioneerde stimulus wegblijft, al wordt de respons vooral onderdrukt."},{"t":"nieuw","q":"Iemand die angstig is voor één hond wordt ook angstig voor andere honden. Hoe noemt het materiaal dit proces?","o":["Stimulusgeneralisatie","Stimulusdiscriminatie","Uitdoving","Spontaan herstel"],"a":0,"u":"Stimulusgeneralisatie is de uitbreiding van een aangeleerde respons naar stimuli die lijken op de geconditioneerde stimulus."},{"t":"nieuw","q":"Wat kenmerkt aangeleerde smaakaversie volgens het materiaal?","o":["Na een enkele ervaring leert een organisme een voedsel te vermijden als het door ziekte werd gevolgd","Het vereist tientallen herhalingen van dezelfde ervaring","Het komt alleen voor bij dieren en niet bij mensen","Het treedt op zonder dat er ziekte optreedt"],"a":0,"u":"Aangeleerde smaakaversie is een biologische neiging om na een enkele ervaring voedsel te mijden dat met ziekte geassocieerd werd."},{"t":"nieuw","q":"Welk bekrachtigingsschema is volgens het materiaal het sterkste voor het volhouden van gedrag?","o":["Variabele ratio","Vast interval","Vaste ratio","Variabel interval"],"a":0,"u":"Het materiaal noemt de variabele ratio het sterkste schema, omdat het aantal benodigde responsen steeds verschilt."},{"t":"nieuw","q":"Een leerling krijgt een premie na elke tiende volledig afgewerkte taak. Welk schema is dit?","o":["Vaste ratio","Variabele ratio","Vast interval","Variabel interval"],"a":0,"u":"Bij een vaste ratio wordt de bekrachtiging na een vast aantal responsen aangeboden."},{"t":"nieuw","q":"Het weghalen van een aantrekkelijke stimulus na een respons noemt het materiaal:","o":["Negatieve straf","Positieve straf","Negatieve bekrachtiging","Primaire bekrachtiging"],"a":0,"u":"Negatieve straf is het weghalen van een aantrekkelijke stimulus na een respons; het vermindert het gedrag."},{"t":"nieuw","q":"Sultan, een chimpansee, combineerde dozen en stokken om fruit te bereiken. Welk type leren beschreef Köhler hiermee?","o":["Inzichtelijk leren door perceptuele reorganisatie","Klassieke conditionering","Operante conditionering met shaping","Habituatie"],"a":0,"u":"Köhler toonde aan dat de dieren door inzicht leerden: ze reorganiseerden hun perceptie van het probleem."},{"t":"nieuw","q":"Welke factoren bepalen volgens het materiaal of gedrag van een model wordt nagebootst bij leren door observatie?","o":["De gevolgen die het model ondervindt en de macht of het prestige van het model","De leeftijd van de observator en de kleur van de kamer","Alleen de frequentie van het gedrag","Enkel de intensiteit van de straf"],"a":0,"u":"Bandura toonde dat de gevolgen van het model en diens macht of prestige bepalen of gedrag wordt gekopieerd."},{"t":"nieuw","q":"Welk niveau van bewustzijn volgens Freud bevat informatie die nu niet in het bewustzijn is maar die bewust gemaakt kan worden als er aandacht naar gaat?","o":["Onbewuste","Voorbewuste","Bewuste","Perifeer bewustzijn"],"a":1,"u":"Het voorbewuste bevat informatie die op aandacht bewust gemaakt kan worden, zoals wat je gisteren op tv zag."},{"t":"nieuw","q":"Hoe vaak herhalen circadiaanse ritmes zich volgens het materiaal ongeveer?","o":["Ongeveer elke 24 uur","Ongeveer elke 90 minuten","Ongeveer elke week","Ongeveer elke 12 uur"],"a":0,"u":"Circadiaanse ritmes zijn fysiologische patronen die zich ongeveer elke 24 uur herhalen en gereguleerd worden door een interne klok in de hypothalamus."},{"t":"nieuw","q":"Wanneer vindt het dromen volgens het materiaal vooral plaats?","o":["Tijdens de REM-slaap","Tijdens stadium 4 van de NREM-slaap","Tijdens het slaapwandelen","Tijdens stadium 1 bij het inslapen"],"a":0,"u":"Het materiaal stelt dat dromen tijdens de REM-slaap plaatsvindt, terwijl slaapwandelen bij NREM hoort."},{"t":"nieuw","q":"In welke slaapfase vinden nachtelijke paniekaanvallen (night terror) volgens het materiaal plaats?","o":["Stadium 4 van de NREM-slaap","Tijdens de REM-slaap","Tijdens het wakker zijn","Tijdens stadium 1 van de slaap"],"a":0,"u":"Night terror gebeurt in stadium 4, daarom is het niet gelijk aan nachtmerries die in de REM-slaap voorkomen."},{"t":"nieuw","q":"Welke onderzoeker stelde het idee van de 'verborgen observator' voor bij hypnose?","o":["Hilgard","Watson","Pavlov","Köhler"],"a":0,"u":"Hilgard stelde dat een verborgen observator tijdens hypnose onbewust blijft, naast het normale bewustzijn."},{"t":"nieuw","q":"Wat is tolerantie volgens het materiaal?","o":["Een grotere dosis is nodig om hetzelfde effect te bekomen","Het lichaam stopt met het aanmaken van neurotransmitters","Een intens psychologisch verlangen naar het middel","Het verdwijnen van onthoudingsverschijnselen"],"a":0,"u":"Tolerantie betekent dat steeds meer van een middel nodig is om hetzelfde effect te krijgen."},{"t":"nieuw","q":"Welke vier onderdelen vormen volgens het materiaal een emotie?","o":["Fysiologische arousal, cognitieve interpretatie, subjectieve gevoelens en gedragsmatige expressie","Waarneming, geheugen, aandacht en taal","Stimulus, respons, bekrachtiging en straf","Eros, libido, thanatos en ego"],"a":0,"u":"Een emotie is een viervoudig proces van fysiologische arousal, cognitieve interpretatie, subjectieve gevoelens en gedragsmatige expressie."},{"t":"nieuw","q":"Welke zeven emoties herkennen mensen overal ter wereld volgens het materiaal (Ekman)?","o":["Verdriet, angst, woede, afkeer, minachting, geluk en verrassing","Vreugde, vertrouwen, angst, verrassing, verdriet, afkeer, woede en verwachting","Liefde, haat, hoop, schaamte, schuld, trots en jaloezie","Honger, dorst, pijn, slaap, kou, warmte en vermoeidheid"],"a":0,"u":"Ekman toonde aan dat deze zeven emoties cross-cultureel herkend worden, wat wijst op een universele biologische basis."},{"t":"nieuw","q":"Wat stelt de James-Lange theorie volgens het materiaal?","o":["De lichamelijke respons gaat vooraf en veroorzaakt de emotie","De emotie gaat vooraf en veroorzaakt de lichamelijke respons","Beide ontstaan gelijktijdig zonder oorzakelijk verband","Een emotie ontstaat zonder enige lichamelijke reactie"],"a":0,"u":"Volgens James-Lange komen gevoelens voort uit fysieke sensaties; we zijn bang omdat we lopen, niet andersom."},{"t":"nieuw","q":"Welke theorie stelt dat een emotie ontstaat uit een cognitieve inschatting van lichamelijke arousal en een externe stimulus?","o":["De tweefactorentheorie van Schachter","De theorie van James-Lange","De theorie van Cannon-Bard","De emotietheorie van Plutchik"],"a":0,"u":"Schachter stelde dat emotie ontstaat uit de interpretatie van arousal en een externe situatie, die verward kunnen worden."},{"t":"nieuw","q":"Wat zegt de omgekeerde U-functie volgens het materiaal?","o":["Zowel lage als hoge arousal leiden tot slechtere prestaties dan een gemiddeld niveau","Hoe meer arousal, hoe beter de prestatie altijd","Prestatie is onafhankelijk van arousal","Lage arousal leidt altijd tot betere prestaties"],"a":0,"u":"De omgekeerde U beschrijft dat een gemiddeld arousalniveau de beste prestaties oplevert."},{"t":"nieuw","q":"Welke van de volgende is een component van emotionele intelligentie volgens het materiaal?","o":["Emoties waarnemen","Emoties vermijden","Emoties uitschakelen","Emoties negeren"],"a":0,"u":"De vier componenten zijn emoties waarnemen, gebruiken, begrijpen en controleren."},{"t":"nieuw","q":"Wat zijn uitingsregels (display rules) volgens het materiaal?","o":["Toegelaten manieren om emoties te tonen in een samenleving, die vroeg worden geleerd","Wetten die de politie gebruikt bij verhoren","Regels voor het afnemen van hersenscans","Systemen die de intensiteit van arousal meten"],"a":0,"u":"Uitingsregels zijn culturele regels over welke emoties men mag tonen en met welke intensiteit."},{"t":"nieuw","q":"Je woont naast een spoorlijn en hoort de voorbijrazende treinen na een paar weken niet meer bewust. Welk proces verklaart dit?","o":["Stimulusdiscriminatie","Sensorische adaptatie","Top-down verwerking","Perceptuele constantie"],"a":1,"u":"Sensorische adaptatie betekent dat receptoren minder gevoelig worden bij aanhoudende, gelijkblijvende stimulatie. Dit speelt zich af op het niveau van de receptor zelf."},{"t":"nieuw","q":"Wat zegt de wet van Weber over het Juist Waarneembaar Verschil (JWV)?","o":["Het is een vast absoluut getal dat voor alle stimuli geldt","Het is een vaste proportie van de oorspronkelijke stimulusintensiteit","Het is de minimale intensiteit waarbij een stimulus in de helft van de gevallen wordt waargenomen","Het is het verschil tussen bottom-up en top-down verwerking"],"a":1,"u":"Volgens de wet van Weber is het JWV een vaste proportie van de oorspronkelijke intensiteit, geen vast absoluut getal."},{"t":"nieuw","q":"Volgens de signaaldetectietheorie hangt het al dan niet detecteren van een zwakke stimulus af van:","o":["Enkel de intensiteit van de stimulus","De stimulus, de achtergrondruis en de beslissingscriteria of verwachtingen van de waarnemer","Enkel de motivatie van de waarnemer","De absolute drempel, die voor iedereen identiek is"],"a":1,"u":"Signaaldetectietheorie stelt dat detectie geen vaste drempel is, maar een combinatie van sensatie, context en subjectieve besluitvorming."},{"t":"nieuw","q":"Wanneer je van een goed verlicht lokaal naar een donkere bioscoopzaal loopt, duurt het even voor je weer goed kunt zien. Wat verklaart dit vooral?","o":["De staafjes, die gevoelig zijn voor zwak licht, moeten het zicht overnemen en dat kost tijd","De pupillen zijn volledig gesloten en laten geen licht door","De fovea neemt het zicht in het donker volledig over","De staafjes zijn tijdelijk uitgeschakeld en de kegeltjes werken niet"],"a":0,"u":"Bij het overschakelen naar donker moeten de staafjes het werk overnemen. Dat vergt tijd, en daarom zie je in het donker moeilijker kleuren, want staafjes zijn ongevoelig voor kleur."},{"t":"nieuw","q":"Wat houdt de Gestaltwet van prägnanz (het minimumprincipe) in?","o":["Mensen geven voorkeur aan de interpretatie die de minste cognitieve inspanning vergt","Mensen groeperen objecten die dicht bij elkaar liggen","Mensen groeperen objecten die op elkaar lijken","Mensen nemen bewegende objecten waar als één geheel"],"a":0,"u":"Prägnanz is het overkoepelende principe om de eenvoudigste interpretatie te kiezen. Nabijheid, gelijkenis en gemeenschappelijk lot zijn afzonderlijke Gestaltwetten."},{"t":"nieuw","q":"Welke combinatie beschrijft het juiste verband tussen de trichromatische theorie en de opponentprocestheorie van kleurenzien?","o":["Beide verklaren exact hetzelfde proces op hetzelfde niveau","Trichromatisch verklaart nabeelden, opponent-proces verklaart kleurenblindheid","Trichromatisch verklaart de eerste fase met drie typen kegeltjes, opponent-proces een latere fase met complementaire paren zoals rood-groen en blauw-geel","Beide theorieën zijn ondertussen volledig weerlegd"],"a":2,"u":"De theorieën zijn complementair: de trichromatische theorie verklaart de receptoren, de opponentprocestheorie een latere verwerkingsstap die bijvoorbeeld nabeelden verklaart."},{"t":"nieuw","q":"Een persoon heeft schade aan de 'wat'-route in de temporale kwab, maar niet aan de 'waar'-route in de pariëtale kwab. Welk verschijnsel past hier het best?","o":["Objecten niet kunnen lokaliseren, maar wel kunnen benoemen","Objecten niet bewust kunnen herkennen, maar er toch onbewust correct op kunnen reageren (blindzicht)","Volledig blind zijn","Enkel kleuren niet meer kunnen zien"],"a":1,"u":"Dit beschrijft blindzicht: schade aan de wat-route verstoort de bewuste identificatie van objecten, terwijl de waar-route intact blijft."},{"t":"nieuw","q":"Een hond kwijlt bij het zien van zijn etensbak, nog voordat er voedsel in zit, omdat hij heeft geleerd dat de bak het voedsel voorspelt. Wat is in dit voorbeeld de geconditioneerde stimulus?","o":["Het voedsel","Het kwijlen bij het zien van de bak","De etensbak","Het kwijlen bij het zien van voedsel"],"a":2,"u":"De bak was oorspronkelijk neutraal en werd door associatie met voedsel een geconditioneerde stimulus. Het voedsel is de ongeconditioneerde stimulus."},{"t":"nieuw","q":"Iemand wordt ernstig ziek na het eten van garnalen en ontwikkelt daarna blijvende weerzin tegen garnalen. Welk fenomeen verklaart waarom deze conditionering zo snel en hardnekkig optreedt?","o":["Stimulusgeneralisatie","Biologische voorbereiding (prepared learning) en selectieve associaties, zoals Garcia en Koeling aantoonden","Operante conditionering","Habituatie"],"a":1,"u":"Organismen zijn evolutionair voorbereid om bepaalde associaties, zoals smaak en ziekte, sneller te leren, zelfs met een vertraging van uren. Dat is bij klassieke conditionering normaal niet mogelijk."},{"t":"nieuw","q":"Een kind krijgt een snoepje telkens het zijn kamer opruimt. Later krijgt het maar af en toe, onvoorspelbaar, een snoepje. Wat is het effect ten opzichte van continue bekrachtiging?","o":["Het gedrag verdwijnt sneller","Het gedrag wordt resistenter tegen uitdoving en houdt langer stand zonder bekrachtiging","Er is geen verschil tussen beide schema's","Het kind leert het gedrag trager aan in het begin"],"a":1,"u":"Intermitterende bekrachtiging maakt gedrag resistenter tegen extinctie dan continue bekrachtiging, omdat het organisme het wegvallen van de beloning minder snel opmerkt."},{"t":"nieuw","q":"Een leraar wil een verlegen leerling stap voor stap leren een vraag te stellen. Eerst beloont hij het opsteken van de hand, dan het zeggen van iets, en uiteindelijk een volledige, relevante vraag. Dit is een voorbeeld van:","o":["Premack-principe","Shaping","Stimulusdiscriminatie","Negatieve bekrachtiging"],"a":1,"u":"Shaping is het stapsgewijs bekrachtigen van gedrag dat steeds dichter het uiteindelijke doelgedrag benadert."},{"t":"nieuw","q":"Welke situatie is een voorbeeld van negatieve bekrachtiging, en niet van straf?","o":["Een kind krijgt huisarrest omdat het gelogen heeft","Een automobilist doet zijn gordel om, waardoor het piepgeluid stopt, en doet dit daarna vaker","Een werknemer krijgt een bonus voor goede prestaties","Een hond krijgt een schok van een halsband wanneer hij blaft"],"a":1,"u":"Negatieve bekrachtiging betekent het wegnemen van een onaangename stimulus, waardoor het gedrag toeneemt. Negatief betekent hier wegnemen, niet slecht."},{"t":"nieuw","q":"Tolman liet ratten een doolhof verkennen zonder beloning. Toen er later voedsel aan het einde werd gelegd, vonden de ratten onmiddellijk de kortste weg. Wat toont dit aan?","o":["Klassieke conditionering is sterker dan operante conditionering","Er heeft latent leren plaatsgevonden, gebaseerd op een cognitieve kaart, zonder zichtbare bekrachtiging","Ratten hebben geen cognitieve processen","Beloning is noodzakelijk voor elke vorm van leren"],"a":1,"u":"Latent leren toont aan dat leren kan plaatsvinden zonder zichtbare bekrachtiging en pas zichtbaar wordt wanneer er een reden is om het te tonen. Dit was een bewijs tegen het strikte behaviorisme."},{"t":"nieuw","q":"In Bandura's Bobo-pop experiment zagen kinderen een volwassen model dat beloond werd voor agressief gedrag. Die kinderen vertoonden zelf meer agressie dan kinderen die zagen dat het model gestraft werd. Welk concept verklaart dit het best?","o":["Klassieke conditionering","Vicariële bekrachtiging, de bekrachtiging via observatie van een ander","Habituatie","Stimulusgeneralisatie"],"a":1,"u":"Bij leren door observatie hoeft het kind zelf niet bekrachtigd te worden. Het leert door te zien welke gevolgen het gedrag van het model heeft."},{"t":"nieuw","q":"Wat is het belangrijkste verschil tussen klassieke en operante conditionering wat betreft de aard van de respons?","o":["Bij klassieke conditionering is de respons vrijwillig, bij operante onvrijwillig","Bij klassieke conditionering is de respons een reflex, passief en onvrijwillig; bij operante conditionering is de respons vrijwillig en actief gesteld gedrag","Er is geen verschil, beide types betreffen reflexen","Klassieke conditionering werkt enkel bij dieren, operante enkel bij mensen"],"a":1,"u":"Bij klassieke conditionering wordt een bestaande reflex gekoppeld aan een nieuwe stimulus. Bij operante conditionering stelt het organisme actief gedrag dat gevolgen heeft."},{"t":"nieuw","q":"Een proefpersoon krijgt een beloning voor een drukreactie, maar de wachttijd tussen twee beschikbare beloningen varieert onvoorspelbaar: soms na 10 seconden, soms na 2 minuten. Welk bekrachtigingsschema is dit?","o":["Vast-ratio","Variabel-ratio","Vast-interval","Variabel-interval"],"a":3,"u":"Interval-schema's zijn gebaseerd op tijd en niet op het aantal responsen. Een wisselende tijd hoort bij het variabel-interval. Variabel-ratio is gebaseerd op een wisselend aantal responsen."},{"t":"nieuw","q":"Wat is het kernverschil tussen sensatie en perceptie?","o":["Sensatie is de interpretatie van prikkels, perceptie is de fysieke registratie ervan","Sensatie is de fysieke omzetting van stimulatie in neurale signalen; perceptie is het proces waarbij aan die signalen betekenis wordt toegekend","Beide termen zijn synoniem in de psychologie","Sensatie gebeurt enkel bewust, perceptie enkel onbewust"],"a":1,"u":"Sensatie is het registreren en omzetten van fysieke energie in neurale signalen. Perceptie is het interpreteren en er betekenis aan geven."},{"t":"nieuw","q":"Wat is het verschil tussen positieve bekrachtiging en negatieve straf?","o":["Beide nemen een aangename stimulus weg","Positieve bekrachtiging voegt iets aangenaams toe om gedrag te versterken; negatieve straf neemt iets aangenaams weg om gedrag te verzwakken","Beide voegen een onaangename stimulus toe","Er bestaat geen verschil, positief en negatief zijn louter beschrijvend"],"a":1,"u":"Positief en negatief slaan op toevoegen of wegnemen van een stimulus, bekrachtiging en straf op versterken of verzwakken van gedrag. Zo ontstaan vier combinaties."},{"t":"nieuw","q":"Tijdens REM-slaap zijn de willekeurige spieren tijdelijk verlamd, terwijl de hersenen erg actief zijn. Hoe noemt men deze spierverlamming?","o":["Kataplexie","Slaapverlamming tijdens REM","Narcolepsie","Slaapapneu"],"a":1,"u":"Slaapverlamming tijdens REM is normaal en voorkomt dat je je dromen uitvoert. Kataplexie is de wakkere vorm die bij narcolepsie optreedt."},{"t":"nieuw","q":"Welke uitspraak over de activatie-synthesetheorie van dromen, tegenover de theorie van Freud, is correct?","o":["Beide theorieën stellen dat dromen betekenisloos zijn","Activatie-synthese stelt dat dromen beginnen als willekeurige neurale activiteit die achteraf geïnterpreteerd wordt; Freud stelde dat dromen verhulde, betekenisvolle wensvervulling zijn","Freud en de activatie-synthesetheorie zijn identiek, enkel andere terminologie","Activatie-synthese stelt dat dromen altijd seksuele inhoud bevatten"],"a":1,"u":"Freud zag dromen als psychologisch betekenisvol, terwijl de activatie-synthesetheorie een biologisch startpunt veronderstelt waaraan de cortex achteraf betekenis geeft."},{"t":"nieuw","q":"Wat verwijst het concept van de 'verborgen waarnemer' (hidden observer) van Hilgard bij hypnose naar?","o":["Het idee dat hypnose niet werkt en mensen gewoon doen alsof","Een dissociatieve verklaring: een deel van het bewustzijn registreert nog steeds pijn, ook al rapporteert het hoofdbewustzijn geen pijn","De hypnotiseur die observeert wat de patiënt doet","Het feit dat hypnose hetzelfde is als slaap"],"a":1,"u":"In Hilgards experimenten gaven gehypnotiseerde proefpersonen aan geen pijn te voelen, maar gaven via een ander kanaal aan dat een deel van hen de pijn wel registreerde."},{"t":"nieuw","q":"Welk verschil bestaat er tussen een instinct en een drijfveer (drive) als verklaring voor gemotiveerd gedrag?","o":["Instincten zijn aangeleerd, drijfveren zijn aangeboren","Instincten zijn vaste, aangeboren gedragspatronen; drijfveren zijn psychologische spanningstoestanden die ontstaan door een biologisch tekort en die aanzetten tot actie","Beide termen zijn volledig synoniem","Drijfveren verwijzen enkel naar menselijk gedrag, instincten enkel naar diergedrag"],"a":1,"u":"Een instinct is een vast, aangeboren gedragspatroon dat onafhankelijk van leren optreedt. Een drijfveer is een spanningstoestand door een tekort die het organisme aanzet tot actie om de spanning te verminderen."},{"t":"nieuw","q":"Erica ziet haar ex-vriend en merkt dat haar hart sneller begint te kloppen. Kun je op basis van de tweefactortheorie van Schachter en Singer zeggen of ze blij of bang is?","o":["Ze is bang, want haar sympathische zenuwstelsel is actief","Ze is blij, want hartkloppingen wijzen altijd op positieve emoties","Dat hangt af van hoe zij de situatie cognitief interpreteert","Het is onmogelijk te zeggen, want ze vertoont geen elementaire emotie"],"a":2,"u":"De tweefactortheorie stelt dat een emotie bestaat uit fysiologische arousal en een cognitieve interpretatie. Dezelfde arousal kan als angst of als opwinding gelabeld worden, afhankelijk van de context."},{"t":"nieuw","q":"Welk motivatiebegrip past het best bij zalmen die tegen de stroom in zwemmen om kuit te schieten?","o":["Drijfveer (drive)","Behoefte","Homeostase","Instinct"],"a":3,"u":"Dit is een klassiek voorbeeld van een instinct: een vast, aangeboren en soortspecifiek gedragspatroon dat niet aangeleerd hoeft te worden."},{"t":"nieuw","q":"Maslows behoeftehiërarchie heeft moeite om welke situatie te verklaren?","o":["Een kind dat eet wanneer het honger heeft","Twee collega's die verliefd worden","Een moeder die haar leven riskeert om haar kind te redden","Een student die hard studeert voor een goed cijfer"],"a":2,"u":"De hiërarchie stelt dat hogere behoeften pas actief worden als lagere behoeften, zoals veiligheid en overleven, bevredigd zijn. Een moeder die haar eigen leven riskeert, stelt een hogere behoefte boven overleven."},{"t":"nieuw","q":"Welke situatie is GEEN voorbeeld van operant gedrag?","o":["Een meisje dat haar huiswerk maakt omdat ze een compliment verwacht","Een kind dat rustig speelt omdat zijn ouder werkt","Een hond die met zijn ogen knippert bij fel licht","Een rat die op een hendel drukt omdat hij eerder voedsel kreeg"],"a":2,"u":"Knipperen bij fel licht is een reflex, een automatische en onvrijwillige respons. Operant gedrag is vrijwillig en wordt beïnvloed door de gevolgen."},{"t":"nieuw","q":"Iemand met een depressie zal het best terecht kunnen bij een ___.","o":["Sportpsycholoog","Forensisch psycholoog","Arbeids- en organisatiepsycholoog","Klinisch psycholoog"],"a":3,"u":"Een klinisch psycholoog helpt mensen met psychische klachten zoals depressie. Dit staat in het oefenmateriaal van hoofdstuk 1 als juiste antwoord."},{"t":"nieuw","q":"Wat is een formele definitie van psychologie?","o":["Psychologie is de wetenschap van de menselijke natuur.","Psychologie is de leer van groepen mensen.","Psychologie is de wetenschap van gedrag en mentale processen.","Psychologie is de wetenschap van psychische stoornissen."],"a":2,"u":"In het materiaal wordt psychologie gedefinieerd als de wetenschap van gedrag en mentale processen."},{"t":"nieuw","q":"Horoscopen en grafologie (handschriftkunde) zijn allebei een voorbeeld van ___.","o":["Wetenschappelijk onderzoek","Toegepaste psychologie","Pseudopsychologie","Experimentele psychologie"],"a":2,"u":"Horoscopen en grafologie worden in het materiaal als pseudopsychologie gezien, omdat ze geen wetenschappelijke onderbouwing hebben."},{"t":"nieuw","q":"Welke vraag kan goed worden beantwoord met de wetenschappelijke methode?","o":["Is het gedrag van een corrupte politieagent zondig?","Verdient Madonna de titel Queen of Pop eigenlijk wel?","Zijn mannen gewelddadiger dan vrouwen?","Is een schilderij mooi of lelijk?"],"a":2,"u":"Een vraag die met gegevens te toetsen is, zoals of mannen gewelddadiger zijn dan vrouwen, kan wetenschappelijk worden onderzocht. Vragen over zonde of titels zijn geen empirische vragen."},{"t":"nieuw","q":"Wat houdt introspectie in?","o":["Het meten van hersenactiviteit met bijvoorbeeld fMRI","Het observeren van de interactie tussen mensen","Het beschrijven van interne gewaarwordingen, denken en emoties","Het bestuderen van kinderen in plaats van volwassenen"],"a":2,"u":"Introspectie is het beschrijven van je eigen innerlijke gewaarwordingen, gedachten en emoties."},{"t":"nieuw","q":"Door welke benadering in de psychologie werd benadrukt dat de onbewuste geest invloed heeft op het gedrag van mensen?","o":["Structuralisme","Cognitieve psychologie","Functionalisme","Psychodynamische psychologie"],"a":3,"u":"De psychodynamische psychologie legt de nadruk op onbewuste processen die gedrag beinvloeden."},{"t":"nieuw","q":"Wat is het grootste verschil tussen een experiment en een correlatieonderzoek?","o":["Bij een correlatieonderzoek worden variabelen gemanipuleerd, bij een experiment niet.","Bij een experiment worden variabelen gemanipuleerd, bij een correlatieonderzoek niet.","Een experiment onderzoekt alleen groepen, een correlatieonderzoek alleen individuen.","Een experiment en een correlatieonderzoek verschillen niet in de manier waarop variabelen worden onderzocht."],"a":1,"u":"Bij een experiment manipuleert de onderzoeker een variabele. Bij correlatieonderzoek wordt de relatie tussen variabelen bestudeerd zonder dat er iets wordt gemanipuleerd."},{"t":"nieuw","q":"Welke van de volgende correlaties vertoont het sterkste verband tussen twee variabelen?","o":["+0,4","+0,38","-0,7","0,05"],"a":2,"u":"De sterkte van een verband hangt af van de absolute waarde van de correlatiecoefficient. Een correlatie van -0,7 is het sterkst."},{"t":"nieuw","q":"Welke van de volgende definities is een operationele definitie van angst?","o":["Een intens gevoel van vrees en afgrijzen als we aan een dreigende situatie denken","Paniek","Een verlangen om iets te vermijden","Afstand nemen van een prikkel"],"a":3,"u":"Afstand nemen van een prikkel is een gedrag dat objectief waarneembaar is. Daarom is dit de enige operationele definitie."},{"t":"nieuw","q":"Hoe noem je een deel van het chromosoom dat codeert voor een bepaalde erfelijke eigenschap?","o":["Autosoom","DNA","Gen","Genotype"],"a":2,"u":"Een gen is een stukje van een chromosoom waarin de code voor een erfelijke eigenschap is opgeslagen. Een gen bestaat uit DNA."},{"t":"nieuw","q":"Welke functie heeft myeline?","o":["Het produceren van neurotransmitters","Het versnellen van de neurale impuls","Het monitoren van de neurale activiteit","Het ontvangen van signalen van andere neuronen"],"a":1,"u":"De myelineschede isoleert het axon en verhoogt de geleidingssnelheid van impulsen langs het axon."},{"t":"nieuw","q":"Langs welke weg reist een zenuwimpuls?","o":["Eindknopjes, axon, soma, dendrieten","Dendrieten, axon, soma, eindknopjes","Dendrieten, soma, axon, eindknopjes","Axon, soma, dendrieten, eindknopjes"],"a":2,"u":"Het neuron ontvangt impulsen via de dendrieten en het soma. Vanuit het soma gaat de impuls via het axon naar de eindknopjes."},{"t":"nieuw","q":"Welk deel van de hersenstam regelt de ademhaling en de hartslag?","o":["Medulla","Formatio reticularis","Pons","Amygdala"],"a":0,"u":"De medulla in de hersenstam regelt onder meer de ademhaling en de hartslag."},{"t":"nieuw","q":"Het hebben van dorst wordt in de hersenen geregeld door de ___.","o":["Cerebellum","Thalamus","Hypothalamus","Amygdala"],"a":2,"u":"De hypothalamus regelt basisbehoeften zoals dorst."},{"t":"nieuw","q":"Welk onderdeel van de hersenen stelt je in staat om te tapdansen of over te koorddansen?","o":["Cerebellum","Hippocampus","Hypothalamus","Amygdala"],"a":0,"u":"Het cerebellum is verantwoordelijk voor gecoordineerde bewegingen."},{"t":"nieuw","q":"Onderzoekers denken dat schizofrenie het gevolg is van een verstoring in de huishouding van de neurotransmitter ___.","o":["Acetylcholine","Serotonine","Dopamine","Endorfine"],"a":2,"u":"In het materiaal wordt schizofrenie in verband gebracht met een verstoring van dopamine."},{"t":"nieuw","q":"Het ___ onderdeel van het autonome zenuwstelsel verhoogt je hartslag snel als je schrikt.","o":["Sympathische","Somatosensorische","Limbische","Parasympathische"],"a":0,"u":"Het sympathische deel van het autonome zenuwstelsel bereidt het lichaam voor op actie en versnelt de hartslag."},{"t":"nieuw","q":"Een meisje erft van haar vader een ___ chromosoom en van haar moeder een ___ chromosoom.","o":["X, Y","Y, X","X, X","Y, Y"],"a":2,"u":"Een meisje heeft twee X-chromosomen: een van haar vader en een van haar moeder."},{"t":"nieuw","q":"Welke functie heeft de frontaalkwab?","o":["Herinneringen, emoties en motivatie","Denken en waarnemen","Beweging, denken en persoonlijkheid","Langdurige herinneringen"],"a":2,"u":"De frontaalkwab is betrokken bij beweging, denken en persoonlijkheid. Beschadiging ervan kan de persoonlijkheid veranderen."},{"t":"nieuw","q":"Welke van de onderstaande constateringen is een goed voorbeeld van de Wet van Weber?","o":["Als je ouder wordt, kun je steeds minder goed contrasten tussen licht en donker zien.","Als je naast een spoorweg woont, hoor je na een tijdje de trein niet meer voorbijrazen.","Een hond kan hogere geluidsfrequenties waarnemen dan een mens.","Je merkt eerder dat een slanke filmster drie kilo is aangekomen dan dat je stevige tante drie kilo zwaarder is geworden."],"a":3,"u":"Volgens de Wet van Weber hangt het juist waarneembare verschil af van de intensiteit van de stimulus. Drie kilo is bij een slank persoon relatief veel."},{"t":"nieuw","q":"Welke van de volgende situaties is een goed voorbeeld van sensorische adaptatie?","o":["Je zus, die dierenarts is, ziet eerder het verschil tussen twee buurtkatten dan jij.","Je wordt je bewust van het gewicht van je rugzak als je hem oppakt.","Je leest een boek en hebt klassieke muziek op de achtergrond aanstaan. Na een tijdje hoor je de muziek niet meer.","De schok die je voelt als je in koud water duikt."],"a":2,"u":"Sensorische adaptatie betekent dat je reactie op een constante stimulus afneemt. De muziek wordt na verloop van tijd niet meer opgemerkt."},{"t":"nieuw","q":"Welk verwerkingsproces wordt bepaald door je verwachtingen en kennis, en niet alleen door de kenmerken van de stimulus?","o":["Olfactie","Bottom-up verwerking","Vormconstantie","Top-down verwerking"],"a":3,"u":"Bij top-down verwerking sturen verwachtingen en kennis de waarneming, zoals wanneer je het kattenluikje hoort en aanneemt dat het je kat is."},{"t":"nieuw","q":"Bij welke psychologische benadering hoort het idee dat een geheel percept meer is dan de som van de sensorische delen?","o":["Sociocultureel perspectief","Concluderen door leren","De gestaltbenadering","Bottom-up verwerking"],"a":2,"u":"De gestaltpsychologie stelt dat het geheel meer is dan de som van de delen."},{"t":"nieuw","q":"Welk deel van het netvlies is de blinde vlek?","o":["Het deel waar je slecht kunt focussen","Het deel waar je minder kegeltjes dan staafjes hebt","Het deel waar de oogzenuw doorheen loopt","Het deel waar je minder staafjes dan kegeltjes hebt"],"a":2,"u":"Op de plek waar de oogzenuw het netvlies verlaat zijn geen fotoreceptoren. Dit is de blinde vlek."},{"t":"nieuw","q":"Wat is een ander woord voor het juist waarneembare verschil (JWV)?","o":["De absolute drempel","Transductie","Verschildrempel","Sensorische adaptatie"],"a":2,"u":"Het juist waarneembare verschil wordt ook wel verschildrempel genoemd: het kleinste verschil in intensiteit dat je kunt waarnemen."},{"t":"nieuw","q":"Welk Gestaltprincipe maakt het zo moeilijk om spelfoutjes in je eigen tekst te zien?","o":["De wet van gelijkenis","De wet van nabijheid","De wet van Prägnanz","De wet van continuering"],"a":2,"u":"De wet van Pregnanz stelt dat de perceptie de eenvoudigste ordening kiest. Bij het proeflezen lees je daardoor over fouten heen."},{"t":"nieuw","q":"Welke hersenstructuur wordt ook wel het koppelstation van de hersenen genoemd en ligt recht boven de hersenstam?","o":["Amygdala","Thalamus","Hypothalamus","Hippocampus"],"a":1,"u":"De thalamus is het centrale koppelstation: bijna alle boodschappen die de hersenen bereiken of verlaten, gaan hier doorheen."},{"t":"nieuw","q":"Pavlov en zijn medewerkers konden de geconditioneerde responsen van hun honden weer wegpoetsen door alleen de CS aan te bieden en de UCS achterwege te laten. Hoe noemen we dit verschijnsel?","o":["Stimulusgeneralisatie","Spontaan herstel","Stimulusdiscriminatie","Extinctie"],"a":3,"u":"Extinctie is de afname van een geconditioneerde associatie doordat de ongeconditioneerde stimulus afwezig is."},{"t":"nieuw","q":"Welke uitspraak over operante conditionering is waar?","o":["Continue bekrachtiging leidt tot gedrag dat zich langer handhaaft dan gedrag dat is geleerd door intermitterende bekrachtiging.","Intermitterende bekrachtiging leidt tot gedrag dat zich langer handhaaft, omdat het organisme een mogelijke bekrachtiging blijft verwachten.","Zowel intermitterende als continue bekrachtiging leiden niet tot gedragsverandering op de lange termijn.","Continue en intermitterende bekrachtiging leiden tot gedrag dat zich even lang handhaaft."],"a":1,"u":"Bij intermitterende bekrachtiging verwacht het organisme dat een bekrachtiging mogelijk komt, daarom houdt het gedrag langer stand."},{"t":"nieuw","q":"Welk verschijnsel is het leren zonder bekrachtiging en zonder zichtbaar bewijs dat er een leerproces plaatsvindt?","o":["Placebo leren","Operant leren","Inzichtelijk leren","Latent leren"],"a":3,"u":"Latent leren is het concept van Tolman: leren zonder bekrachtiging en zonder zichtbaar bewijs."},{"t":"nieuw","q":"Het verschijnsel dat we leren door naar het gedrag van anderen te kijken, heet ___.","o":["Inzichtelijk leren","Extinctie","Cognitieve dissonantie","Sociaal leren"],"a":3,"u":"Bij sociaal leren leert iemand gedrag door anderen te observeren. Bandura toonde dit aan."},{"t":"nieuw","q":"Iemand met een allergie voor echte bloemen krijgt een niesbui als hij een papieren bloem ziet. Hoe noemen we dit verschijnsel?","o":["Spontaan herstel","Stimulusdiscriminatie","Stimulusgeneralisatie","Habituatie"],"a":2,"u":"Stimulusgeneralisatie is de uitbreiding van een aangeleerde respons naar stimuli die lijken op de geconditioneerde stimulus, zoals een papieren bloem."},{"t":"nieuw","q":"Als je een geluid hoort, zetten je oren de geluidgolven om in zenuwimpulsen die door de hersenen worden geinterpreteerd. Hoe heet dit proces?","o":["Elaboratie","Opslaan","Coderen","Evaluatie"],"a":2,"u":"Coderen is het omzetten van een stimulus in een vorm die het geheugen kan verwerken."},{"t":"nieuw","q":"Als proefpersonen een rijtje letters moeten opnoemen dat ze net hebben gezien, verwarren ze vaak letters die ongeveer gelijk klinken, zoals de m en de n. Waardoor worden deze fouten veroorzaakt?","o":["Gebrekkige consolidatie","Chunking-eenheden","Infantiele amnesie","Akoestische codering"],"a":3,"u":"Het werkgeheugen codeert klinkende letters akoestisch, daardoor verwar je letters die gelijk klinken."},{"t":"nieuw","q":"Jelle vraagt Naima om de woorden hoppen, moppen en kloppen te zeggen. Daarna vraagt hij wat je bij een groen verkeerslicht doet, en zij antwoordt: stoppen. Waardoor gaf ze dit antwoord?","o":["Door foutieve attributie","Door specificiteit van codering","Door het puntje-van-de-tongfenomeen","Door priming"],"a":3,"u":"Priming is een techniek waarbij een eerdere prikkel het terughalen van een verwante herinnering stimuleert zonder dat je het verband bewust opmerkt."},{"t":"nieuw","q":"Wat is een voorbeeld van een taak waarbij je een beroep doet op je prospectief geheugen?","o":["Je probeert te onthouden dat je vanmiddag een brief moet posten als je naar de supermarkt gaat.","Je probeert de melodie van een zomerhit van een paar weken geleden te herinneren.","Je probeert het nieuwe mobiele nummer van je vriend uit je hoofd te leren.","Je probeert een nieuwe combinatie van zetten te onthouden die je tijdens het schaken kunt gebruiken."],"a":0,"u":"Prospectief geheugen is het onthouden dat je later een bepaalde actie moet uitvoeren."},{"t":"nieuw","q":"Wat moet een baby volgens Erikson ontwikkelen tijdens het eerste psychosociale stadium?","o":["Zelfvertrouwen en initiatief","Een gevoel van vertrouwen in de omgeving","Het verkennen en manipuleren van objecten","Een gevoel van autonomie"],"a":1,"u":"Volgens Erikson ontwikkelt een baby in het eerste stadium een gevoel van vertrouwen in de omgeving."},{"t":"nieuw","q":"Tijdens REM-slaap ___.","o":["ervaar je korte uitbarstingen van hersenactiviteit, zogenaamde slaapspoelen","zijn je bewuste spieren verlamd","focust je mentale activiteit op gewone dagelijkse zaken","kun je slaapwandelen en praten in je slaap"],"a":1,"u":"Tijdens REM-slaap zijn de bewuste spieren verlamd, zodat je droombeelden niet in beweging omzet."},{"t":"nieuw","q":"Wat is de term die we gebruiken voor alle processen die te maken hebben met de aanzet, de richting, de intensiteit en het volhouden van lichamelijke en psychische activiteiten?","o":["Arousal","Motivatie","Emotie","Prestatiedrang"],"a":1,"u":"Motivatie omvat alle processen die gedrag activeren, richting geven, intensiteit bepalen en volhouden."},{"t":"nieuw","q":"Welke term hoort niet thuis bij de Big Five persoonlijkheidsdimensies?","o":["Gelijkmatig versus nerveus","Intelligent versus dom","Betrouwbaar versus onbetrouwbaar","Open versus gesloten"],"a":1,"u":"De Big Five zijn openheid, consciëntieusheid, extraversie, aangenaamheid en neuroticisme. Intelligentie is geen van deze vijf dimensies."}]};

    function next(){ if(!Q.answered)return; Q.idx++; Q.answered=false; Q.picked=-1; if(Q.idx>=Q.items.length)Q.done=true; renderQuiz(); }
    if(Q.answered) showAnswered(Q.picked);
    state.key=function(e){ if(!Q.answered){ var k=e.key.toLowerCase(); var idx="abcde".indexOf(k); if(idx<0&&/[1-5]/.test(k))idx=+k-1; if(idx>=0&&idx<cur.opts.length){pick(idx);e.preventDefault();} } else if(e.key==="Enter"||e.key===" "){ next(); e.preventDefault(); } };
  }

  function renderResult(){
    var Q=state.quiz, p=pct(Q.correct,Q.items.length);
    var msg=p>=80?"Sterk werk! 🎉":p>=60?"Goed bezig 👍":"Blijf oefenen, je komt er 💪";
    var html='<div class="card pad results center"><span class="pill">Algemene Psychologie</span><div class="big">'+p+'%</div>'+
      '<p style="font-weight:600;margin:0 0 4px;font-size:17px">'+msg+'</p><p class="muted">'+Q.correct+' van '+Q.items.length+' juist</p>'+
      '<div class="row" style="justify-content:center;margin-top:14px">'+
        (Q.wrong.length?'<button class="btn" id="retry">Herhaal '+Q.wrong.length+' foute vragen</button>':'')+
        '<button class="btn ghost" id="again">Nieuwe ronde</button><button class="btn ghost" id="home">Naar start</button></div></div>';
    setHTML(html);
    var rt=document.getElementById("retry"); if(rt) rt.onclick=function(){ startQuiz(shuffle(Q.wrong)); };
    document.getElementById("again").onclick=function(){ state.quiz=null; renderQuizGate(); };
    document.getElementById("home").onclick=function(){ state.quiz=null; go("home"); };
    state.key=null;
  }

  function renderTheory(){
    var q=state.sumq||"";
    var html='<div class="card pad" style="margin-bottom:14px"><h2 style="text-align:center;margin:0 0 8px">Theorie en samenvatting</h2>'+
      '<input type="search" id="sq" placeholder="Zoek een begrip… (bv. conditionering, gestalt, tabula rasa)" value="'+esc(q)+'"></div><div id="list">'+theoryList(q)+'</div>';
    setHTML(html);
    var si=document.getElementById("sq"); si.oninput=function(){ state.sumq=si.value; document.getElementById("list").innerHTML=theoryList(si.value); si.focus(); };
  }
  function theoryList(query){
    var Q=query.trim().toLowerCase(), out="", n=0;
    D.theory.forEach(function(sec){
      var items=sec.items.filter(function(it){ return !Q || it.toLowerCase().indexOf(Q)>=0 || sec.h.toLowerCase().indexOf(Q)>=0; });
      if(!items.length) return; n++;
      out+='<details class="acc"'+(Q?" open":(n===1?" open":""))+'><summary><span class="n">'+ic("search")+'</span>'+esc(sec.h)+ic("chevR","caret")+'</summary><div class="body"><ul>'+items.map(function(it){return '<li>'+hl(esc(it),Q)+'</li>';}).join("")+'</ul></div></details>';
    });
    return out||'<p class="muted center">Geen resultaten voor "'+esc(query)+'".</p>';
  }
  function hl(t,q){ if(!q)return t; try{ return t.replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>"); }catch(e){ return t; } }

  function renderHacks(){
    var html='<div class="card pad" style="margin-bottom:16px"><h2 style="text-align:center;margin:0 0 6px">Studie-hacks</h2><p class="muted" style="text-align:center;margin:0">Ezelsbruggetjes om de kernideeën van algemene psychologie te onthouden.</p></div>'+
      '<div class="tipgrid">'+D.hacks.map(function(t){return '<div class="tip"><h4>'+ic("bulb")+esc(t.h)+'</h4><p>'+esc(t.t)+'</p></div>';}).join("")+'</div>';
    setHTML(html);
  }

  function renderFeedback(){
    var html='<div class="card pad"><h2 style="text-align:center;margin-top:0">Feedback &amp; klachten</h2>'+
      '<p class="muted" style="text-align:center">Fout in een vraag, een idee, of werkt iets niet? Laat het hier weten, het komt rechtstreeks bij de maker terecht. Een review of compliment mag ook: de mooiste tonen we op de hub. 💬</p>'+
      '<label class="fld" for="fbMsg">Je bericht</label><textarea id="fbMsg" rows="3" placeholder="Beschrijf de fout of je idee…"></textarea>'+
      '<div class="fbextra"><div class="fbveld fbwaar"><label class="fld" for="fbWaar">Over welke vraag? <span class="muted">(optioneel)</span></label><input type="text" id="fbWaar" placeholder="bv. de vraag over de p-waarde"></div>'+
      '<div class="fbveld"><label class="fld" for="fbNaam">Je naam <span class="muted">(optioneel)</span></label><input type="text" id="fbNaam" placeholder="zodat we je kunnen bedanken"></div>'+
      '<div class="fbveld"><label class="fld" for="fbEmail">Je e-mail <span class="muted">(optioneel, als je een antwoord wilt)</span></label><input type="email" id="fbEmail" placeholder="naam@voorbeeld.be"></div></div>'+
      '<input type="text" id="fbBot" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0">'+
      '<div class="row" style="margin-top:16px;align-items:center"><button class="btn" id="fbSend">'+ic("send")+'Versturen</button><span id="fbStatus" style="font-size:13px"></span></div></div>';
    setHTML(html);
    document.getElementById("fbSend").onclick=function(){
      var status=document.getElementById("fbStatus");
      if(document.getElementById("fbBot").value) return;
      var msg=document.getElementById("fbMsg").value.trim();
      if(!msg){ status.style.color="var(--bad)"; status.textContent="Schrijf eerst een bericht."; return; }
      var btn=document.getElementById("fbSend"); btn.disabled=true; status.style.color="var(--muted)"; status.textContent="Versturen…";
      var em=document.getElementById("fbEmail").value.trim();
      var nm=document.getElementById("fbNaam").value.trim();
      var waar=document.getElementById("fbWaar").value.trim();
      var payload={_subject:"Algemene Psychologie-tool: feedback", _template:"table", _captcha:"false",
        Naam:nm||"-", Over_welke_vraag:waar||"-", email:em||"-", Bericht:msg};
      if(em) payload._replyto=em;
      // vangnet: als de verzenddienst blokkeert (bv. spamfilter) of er is geen verbinding,
      // bieden we een directe mailto-knop aan zodat de melding NOOIT stilletjes verdwijnt.
      function failFallback(reden){
        var body="Feedback Algemene Psychologie-tool%0D%0A%0D%0ANaam: "+encodeURIComponent(nm||"-")+"%0D%0AOver welke vraag: "+encodeURIComponent(waar||"-")+"%0D%0AE-mail: "+encodeURIComponent(em||"-")+"%0D%0A%0D%0ABericht:%0D%0A"+encodeURIComponent(msg);
        var mailto="mailto:berat007yildirim@gmail.com?subject="+encodeURIComponent("Algemene Psychologie-tool: feedback")+"&body="+body;
        setHTML('<div class="card pad"><h2 style="margin-top:0">Automatisch versturen lukte niet</h2><p class="muted">'+reden+' Geen zorgen, klik hieronder en je melding wordt geopend in je e-mail, helemaal klaar om te versturen:</p><a class="btn" href="'+mailto+'">'+ic("send")+'Mail mijn melding direct</a><div style="margin-top:14px"><button class="btn ghost" id="bk">Terug naar start</button></div></div>');
        document.getElementById("bk").onclick=function(){go("home");};
      }
      fetch("https://formsubmit.co/ajax/Berat007yildirim@gmail.com",{method:"POST",headers:{Accept:"application/json"},body:new URLSearchParams(payload)})
        .then(function(r){return r.json();}).then(function(d){
          if(d&&(d.success===true||d.success==="true")){ setHTML('<div class="card pad results center"><div style="font-size:42px">✅</div><h2 style="margin:6px 0">Bedankt!</h2><p class="muted">Je melding is verstuurd.</p><button class="btn" id="bk" style="margin-top:8px">Terug naar start</button></div>'); document.getElementById("bk").onclick=function(){go("home");}; }
          else { failFallback("Het automatisch versturen lukte niet."); }
        }).catch(function(){ failFallback("Er was even geen verbinding."); });
    };
  }

  document.addEventListener("keydown",function(e){ if(state.key) state.key(e); });
  // bezoeker tellen (1x per toestel)
  try{ if(!localStorage.getItem("algpsy_seen")){ localStorage.setItem("algpsy_seen","1"); bump("berat-algpsy","gebruikers"); } }catch(e){ bump("berat-algpsy","gebruikers"); }
  // traject vanuit de hub overnemen → direct naar de oefenpagina
  try{ var _q=new URLSearchParams(location.search); var _m=_q.get("m");
    if(_m==="training"||_m==="herkansing"){ state.track=_m; lset("algpsy_track",_m);
      var _c=_q.get("calm"); if(_c!=null){ calm=(_c!=="0"); lset("algpsy_calm",calm); applyCalm(); }
      state.step="practice"; state.fromHub=true; }
  }catch(e){}
  render();
  // launch-splash netjes laten verdwijnen
  (function(){ var _sp=document.getElementById("splash"); if(!_sp) return; var _red=false; try{_red=window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){} setTimeout(function(){ _sp.classList.add("hide"); setTimeout(function(){ if(_sp&&_sp.parentNode) _sp.parentNode.removeChild(_sp); }, 700); }, _red?300:1850); })();
})();
</script>
<script>
/* gedeelde interactie: klik-animatie en zacht openschuivende theorieblokken */
(function(){
  // Elk theorieblok krijgt precies een wikkel-element, anders klapt een blok met
  // meerdere kinderen niet volledig dicht (MBG had er tien).
  function wikkel(){
    var lijst=document.querySelectorAll(".acc>.body");
    for(var i=0;i<lijst.length;i++){
      var b=lijst[i];
      if(b.children.length===1 && b.firstElementChild && b.firstElementChild.className==="bes-wrap") continue;
      var w=document.createElement("div"); w.className="bes-wrap";
      while(b.firstChild) w.appendChild(b.firstChild);
      b.appendChild(w);
    }
  }
  var gepland=false;
  function planWikkel(){ if(gepland)return; gepland=true; setTimeout(function(){ gepland=false; wikkel(); },0); }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",wikkel); else wikkel();
  try{ new MutationObserver(planWikkel).observe(document.documentElement,{childList:true,subtree:true}); }catch(e){}
  var KLIK="button,.btn,.iconbtn,.opt,.track,.chrow,.backlink,.chip,.mode,.toggle,.scard,.ccard,.qcard,.srclink,.bnlink,.navlink,.ycard,.excat,.brandstrip,summary";
  document.addEventListener("pointerdown",function(e){
    var el=(e.target&&e.target.closest)?e.target.closest(KLIK):null; if(!el)return;
    el.classList.remove("bes-klik"); void el.offsetWidth; el.classList.add("bes-klik");
    setTimeout(function(){ el.classList.remove("bes-klik"); },260);
  },true);
  document.addEventListener("click",function(e){
    var s=(e.target&&e.target.closest)?e.target.closest("details.acc>summary"):null; if(!s)return;
    var d=s.parentNode; if(!d) return;
    e.preventDefault();
    if(d.open){
      d.classList.add("bes-dicht");
      setTimeout(function(){ d.open=false; d.classList.remove("bes-dicht"); },250);
    } else {
      d.open=true; d.classList.add("bes-open");
      var los=function(){ d.classList.remove("bes-open"); };
      requestAnimationFrame(function(){ requestAnimationFrame(los); });
      setTimeout(los,400);
    }
  },false);
})();
</script>
