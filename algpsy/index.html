<script>
window.AP = {"questions":[{"t":"1","q":"Wat is volgens de bron de beste definitie van psychologie?","o":["De wetenschap van het gedrag en de mentale processen","De kunst om via intuïtie het gedrag van anderen te voorspellen","Het bestuderen van de onaantastbare ziel los van het lichaam","Een verzameling volkswijsheden over hoe de mens denkt"],"a":0,"u":"De bron omschrijft psychologie als de wetenschap van het gedrag en de mentale processen: het meetbare externe gedrag wordt gebruikt om interne processen te begrijpen."},{"t":"1","q":"Iemand beweert stellig dat mensen bij volle maan agressiever worden, zonder enig onderbouwd bewijs, en presenteert dit als een wetenschappelijk feit. Onder welke term valt dit?","o":["Introspectie","Pseudopsychologie","Lekenpsychologie","Functionalisme"],"a":1,"u":"Pseudopsychologie zijn niet-onderbouwde psychologische aannames die zich als wetenschappelijke waarheid voordoen, precies wat hier gebeurt."},{"t":"1","q":"Waarom gebruikt de bron visuele illusies zoals de Muller-illusie om het nut van psychologie te illustreren?","o":["Om te bewijzen dat onze zintuigen altijd betrouwbaar zijn","Om te laten zien dat kennis volledig aangeboren is","Om aan te tonen dat onze intuïtie dikwijls fout of contra-intuïtief is","Om het verschil tussen geocentrisme en heliocentrisme te verduidelijken"],"a":2,"u":"De illusies tonen aan dat wat we denken niet altijd klopt: zelfs als je de illusie kent, blijft de indruk bestaan, wat bewijst dat intuïtie vaak fout is."},{"t":"1","q":"De uitspraak 'Psychologie heeft een lang verleden maar een korte geschiedenis' verwijst naar welk idee?","o":["Psychologie is de oudste van alle natuurwetenschappen","Psychologie bestaat pas sinds de oude Grieken maar wordt zelden bestudeerd","De wortels liggen in de filosofie, maar als aparte wetenschap begon ze pas rond 1879","De geschiedenis duurde lang terwijl het verleden juist heel kort was"],"a":2,"u":"Het lange verleden verwijst naar de filosofische en evolutionaire wortels, terwijl de korte geschiedenis start bij de oprichting van het eerste psychologische laboratorium door Wundt in 1879."},{"t":"1","q":"Volgens het empirisme (Hobbes, Locke, Hume) is de geest bij de geboorte te vergelijken met een 'tabula rasa'. Wat betekent dit?","o":["De geest bevat aangeboren kennis om de mens via de rede te begrijpen","De geest is een leeg blad en kennis ontstaat door zintuiglijke ervaring","De geest en het lichaam zijn twee volledig aparte identiteiten","De geest is het onaantastbare, hoogste deel van de mens"],"a":1,"u":"Empirisme stelt dat kennis niet aangeboren is maar tot stand komt via zintuiglijke ervaringen en associaties: de geest is bij de geboorte een leeg blad."},{"t":"1","q":"Welk koppel begrippen sluit het best aan bij het nature-nurture-debat zoals de bron het beschrijft?","o":["Rationalisme versus empirisme","Geocentrisme versus heliocentrisme","Structuralisme versus functionalisme","Positivisme versus dualisme"],"a":0,"u":"De bron koppelt rationalisme (nativisme, aanleg, nature) aan empirisme (tabula rasa, ervaring en opvoeding, nurture) als de filosofische kern van het nature-nurture-debat."},{"t":"1","q":"Wat was het centrale kritiekpunt op de introspectieve methode van het structuralisme?","o":["Ze was te sterk gericht op observeerbaar gedrag","Ze negeerde de rol van het bewustzijn volledig","Ze was subjectief en onbetrouwbaar en dus moeilijk reproduceerbaar","Ze steunde te veel op experimenten met dieren"],"a":2,"u":"Introspectie was subjectief en onbetrouwbaar: het bewustzijn verschilt per dag en per persoon, waardoor resultaten niet reproduceerbaar zijn en het praktisch nut beperkt bleef."},{"t":"1","q":"'Het geheel is meer dan de som der delen.' Bij welke stroming hoort deze kernuitspraak, en waarop richt die zich?","o":["Behaviorisme, gericht op stimulus-respons","Gestaltpsychologie, gericht op perceptie","Psychoanalyse, gericht op het onbewuste","Structuralisme, gericht op de bouwstenen van de geest"],"a":1,"u":"De gestaltpsychologie stelt dat het geheel meer is dan de som der delen en focust op perceptie, waarbij de totaalconfiguratie de waarneming van de afzonderlijke delen stuurt."},{"t":"1","q":"Watson beweerde een willekeurige baby te kunnen opvoeden tot om het even welk type specialist. Welke visie op de mens illustreert dit?","o":["Dat gedrag volledig door de omgeving gevormd kan worden via leerprincipes","Dat het onbewuste ons gedrag stuurt","Dat de geest bestaat uit vaste, ondeelbare bouwstenen","Dat eigenschappen vooral bepaald worden door aanleg"],"a":0,"u":"Deze uitspraak van het behaviorisme benadrukt dat je door de omgeving aan te passen iemand tot van alles kunt vormen: stimulus lokt respons uit, verklaard via leerprincipes."},{"t":"1","q":"Waarom noemt men de behavioristische benadering ook wel 'black box'-psychologie?","o":["Omdat men enkel het onbewuste bestudeert en gedrag negeert","Omdat men de menselijke geest in een donkere kamer observeert","Omdat men alle interne processen wel meet maar het gedrag negeert","Omdat wat zich in het hoofd afspeelt niet meetbaar is, dus richt men zich enkel op stimulus en respons"],"a":3,"u":"Het hoofd is de black box: de verwerking van de stimulus is niet te registreren, dus bestudeert men enkel de observeerbare stimulus en respons."},{"t":"1","q":"De bron noemt een belangrijk verwijt aan Freuds psychoanalyse. Welk?","o":["Ze richtte zich uitsluitend op observeerbaar gedrag","Ze ontkende het bestaan van onbewuste processen","Ze was niet gebaseerd op wetenschappelijk onderzoek maar op persoonlijke interpretaties","Ze steunde volledig op gecontroleerde laboratoriumexperimenten"],"a":2,"u":"Freud wees op het belang van het onbewuste, maar zijn theorie was niet gebaseerd op wetenschappelijk onderzoek, wel op zijn persoonlijke interpretaties, wat veel kritiek opleverde."},{"t":"1","q":"Een onderzoeker wil weten of suiker in frisdrank de concentratie van kinderen aantast. Ze geeft de ene groep frisdrank met suiker en een vergelijkbare groep frisdrank zonder suiker. Welke onderzoeksmethode is dit, en waarom?","o":["Beschrijvend onderzoek, omdat er enkel geobserveerd wordt","Correlationeel onderzoek, omdat twee variabelen samenhangen","Experimenteel onderzoek, omdat de onafhankelijke variabele gemanipuleerd wordt","Een gevalstudie, omdat een enkel kind intensief bestudeerd wordt"],"a":2,"u":"Bij experimenteel onderzoek manipuleert de onderzoeker de onafhankelijke variabele (hoeveelheid suiker) en meet het effect op de afhankelijke variabele; het is de enige methode die oorzakelijke verbanden kan vastleggen."},{"t":"2","q":"Wat gebeurt er bij Pavlovs klassieke conditionering wanneer een neutrale prikkel zoals een bel herhaaldelijk samen met voedsel wordt aangeboden?","o":["De bel gaat op zichzelf een kwijlreactie uitlokken doordat er een associatie ontstaat","De hond stopt met kwijlen bij het zien van voedsel","De bel wordt een ongeconditioneerde stimulus die reflexmatig honger veroorzaakt","De hond leert alleen te kwijlen bij de verzorger en nooit meer bij voedsel"],"a":0,"u":"Door meerdere koppelingen tussen voedsel (OS) en de bel legt de hond een associatie, waardoor de bel als geconditioneerde stimulus zelf de kwijlreactie oproept."},{"t":"2","q":"Iemand is gebeten door een bepaalde agressieve hond en wordt daarna bang voor alle honden. Welk kenmerk van klassieke conditionering is dit?","o":["Extinctie","Spontaan herstel","Stimulusgeneralisatie","Stimulusdiscriminatie"],"a":2,"u":"Bij stimulusgeneralisatie breidt de aangeleerde reactie zich uit naar gelijksoortige prikkels, zoals angst voor alle honden na een beet."},{"t":"2","q":"Wat houdt extinctie in bij klassieke conditionering, en is de respons daarna definitief afgeleerd?","o":["De reactie wordt sterker doordat de CS vaker wordt aangeboden","De CR verzwakt als de CS herhaaldelijk zonder de OS komt, maar is niet definitief afgeleerd","De reactie verdwijnt volledig en kan nooit meer terugkeren","De CS wordt vervangen door een nieuwe ongeconditioneerde stimulus"],"a":1,"u":"Extinctie is de uitdoving of verzwakking van de CR wanneer de CS herhaaldelijk zonder de OS wordt aangeboden. Het is niet hetzelfde als afleren, want een enkele koppeling kan de reactie terugbrengen."},{"t":"2","q":"Volgens de behavioristen is klassieke conditionering het efficiëntst bij welke volgorde van bel en voedsel?","o":["Backward pairing, waarbij het voedsel voor de bel komt","Simultaneous pairing, waarbij bel en voedsel exact tegelijk komen","Een pauze van enkele minuten tussen bel en voedsel","Forward pairing, waarbij de bel het voedsel ongeveer een halve seconde voorafgaat"],"a":3,"u":"Bij forward pairing gaat de CS (bel) de OS (voedsel) kort vooraf, ongeveer 0,5 seconde, en dat is volgens de behavioristen het effectiefst."},{"t":"2","q":"Wat toont het onderzoek met ratten die zoet water met licht en geluid kregen (de smaakaversie- en shockproeven) vooral aan?","o":["Contiguïteit is de enige noodzakelijke voorwaarde om te leren","Ratten kunnen helemaal geen associaties leggen tussen prikkels","Biologische predisposities bepalen mee welke associaties makkelijk geleerd worden","Alle prikkels zijn even makkelijk aan elk gevolg te koppelen"],"a":2,"u":"Ratten koppelen smaak makkelijk aan misselijkheid en licht of geluid aan pijn, wat aantoont dat biologische factoren (nature) meespelen bij welke associaties vlot geleerd worden."},{"t":"2","q":"Wat is het verschil tussen positieve en negatieve bekrachtiging bij operante conditionering?","o":["Positieve bekrachtiging dient een aangename prikkel toe, negatieve bekrachtiging neemt een onaangename prikkel weg","Positieve bekrachtiging verlaagt gedrag, negatieve bekrachtiging verhoogt gedrag","Beide zijn vormen van straf die het gedrag doen afnemen","Positieve bekrachtiging neemt iets weg, negatieve bekrachtiging voegt iets pijnlijks toe"],"a":0,"u":"Positieve bekrachtiging (+R) dient een aangename prikkel toe en negatieve bekrachtiging (-R) neemt een onaangename prikkel weg. Beide leiden tot een toename van het gedrag."},{"t":"2","q":"Een trainer beloont een rat eerst als hij in de buurt van de hendel komt, daarna als hij hem aanraakt, en pas daarna als hij hem indrukt. Welk principe wordt hier gebruikt?","o":["Extinctie","Stimulusdiscriminatie","Shaping","Negatieve straf"],"a":2,"u":"Shaping vormt gedrag gradueel door successieve benaderingen van het gewenste gedrag te bekrachtigen, zoals het stap voor stap belonen richting het indrukken van de hendel."},{"t":"2","q":"Waarom is een partieel (intermitterend) bekrachtigingsschema beter bestand tegen extinctie dan continue bekrachtiging?","o":["Omdat elk gedrag altijd beloond wordt en dat gedrag daardoor niet verzwakt","Omdat het gedrag trager wordt aangeleerd maar men langer blijft reageren zonder bekrachtiging","Omdat continue bekrachtiging het gedrag nooit aanleert","Omdat partiële bekrachtiging alleen bij straf werkt"],"a":1,"u":"Bij partiële bekrachtiging wordt gedrag niet telkens beloond, waardoor het trager wordt verworven maar beter bestand is tegen extinctie. Men blijft langer reageren ook als de bekrachtiging uitblijft."},{"t":"2","q":"Wat leerden de honden uit de shocked groep in Seligmans onderzoek waarbij ze eerst geen ontsnapping hadden?","o":["Ze leerden sneller dan de controlegroep te ontsnappen","Ze bleven ook in een nieuwe situatie apathisch zitten en vermeden de shock niet","Ze vertoonden meteen efficiënt vermijdingsgedrag","Ze gingen agressief reageren op de shock"],"a":1,"u":"De shocked honden leerden zich hulpeloos te gedragen, en bleven zelfs toen ontsnappen wel mogelijk was apathisch zitten. Dit illustreert aangeleerde hulpeloosheid."},{"t":"3","q":"Volgens de James-Lange theorie is de juiste volgorde bij een emotie:","o":["Stimulus, lichamelijke reactie, emotie","Stimulus, emotie, lichamelijke reactie","Stimulus, interpretatie, arousal","Lichamelijke reactie en emotie tegelijk vanuit de thalamus"],"a":0,"u":"James-Lange stelt dat een prikkel eerst een reflexmatige lichamelijke reactie uitlokt, die de hersenen daarna interpreteren als emotie. Vandaar: we zijn verdrietig omdat we huilen, niet omgekeerd."},{"t":"3","q":"Wat is het kenmerkende verschil van de Cannon-Bard theorie tegenover James-Lange?","o":["De cognitieve beoordeling van de prikkel komt altijd eerst","De lichamelijke reactie en de emotie ontstaan langs twee onafhankelijke routes tegelijk","De emotie ontstaat pas nadat het lichaam volledig is gekalmeerd","Enkel de amygdala bepaalt of er een emotie ontstaat"],"a":1,"u":"Bij Cannon-Bard splitst de prikkel zich vanuit de thalamus in twee onafhankelijke routes, zodat lichamelijke reactie en emotie samen optreden in plaats van na elkaar zoals bij James-Lange."},{"t":"3","q":"Iemand ziet in het donker een man met een pistool en beoordeelt dit als een negatieve prikkel, waarna angst en arousal volgen. Welke theorie past hier het best bij?","o":["Drifttheorie","James-Lange theorie","Cognitieve appraisal theorie","Instincttheorie"],"a":2,"u":"In de cognitieve appraisal theorie komt de interpretatie (beoordeling) van de prikkel eerst, waarna arousal en emotie volgen. Het voorbeeld van de man met pistool als negatieve prikkel illustreert precies die beoordelingsstap."},{"t":"3","q":"Welke rol speelt de amygdala volgens dit hoofdstuk in het emotionele brein?","o":["Ze regelt vooral honger en dorst via homeostase","Ze zorgt voor de automatische angstreactie en reageert het sterkst bij angst","Ze onderdrukt kortetermijnverlangens ten voordele van langetermijndoelen","Ze bepaalt of een glimlach echt of gespeeld is"],"a":1,"u":"De amygdala is een deel van het limbisch circuit, staat centraal in het emotionele brein en zorgt voor de automatische angstreactie, met de sterkste reactie bij angst."},{"t":"3","q":"Is de fysiologische respons emotiespecifiek volgens de bron?","o":["Ja, elke emotie heeft een uniek en betrouwbaar herkenbaar patroon","Nee, er zijn verschillen maar niet specifiek genoeg om het type emotie uit af te leiden","Ja, maar enkel bij walging is het patroon duidelijk","Nee, er zijn helemaal geen fysiologische verschillen tussen emoties"],"a":1,"u":"Volgens de tekst zijn er wel verschillen in fysiologische respons tussen emoties, maar ze zijn niet specifiek genoeg om er het exacte type emotie uit af te leiden."},{"t":"3","q":"Wat voorspelt de facial feedback hypothese?","o":["Dat gelaatsuitdrukkingen bij complexe emoties volledig aangeboren zijn","Dat je gezichtsuitdrukking je emotionele beleving beinvloedt","Dat de leugendetector emoties feilloos kan aflezen","Dat arousal een curvilineair verband heeft met prestatie"],"a":1,"u":"De facial feedback hypothese stelt dat de gezichtsuitdrukking zelf de emotionele beleving beinvloedt. In het experiment met de stift ervaren mensen cartoons als grappiger wanneer hun gezichtsspieren in een lachstand staan."},{"t":"3","q":"Wat is volgens dit hoofdstuk het beste voorbeeld van intrinsieke motivatie?","o":["Studeren om niet als dom over te komen bij anderen","Lessen opleuken zodat een kind toch meedoet","Een activiteit doen puur voor het plezier en de voldoening ervan zelf","Een marshmallow uitstellen om er later twee te krijgen"],"a":2,"u":"Intrinsieke motivatie betekent plezier en voldoening halen uit de activiteit zelf, zonder bijkomend doel. Je doet het voor jezelf, in tegenstelling tot extrinsieke motivatie die op een extern doel gericht is."},{"t":"3","q":"Wat beschrijft de wet van Yerkes-Dodson over de relatie tussen arousal en prestatie?","o":["Hoe meer arousal, hoe beter de prestatie, zonder bovengrens","Er bestaat een optimaal punt van arousal; te weinig of te veel is nadelig voor de prestatie","Arousal heeft geen enkel effect op prestatie","Prestatie is maximaal bij volledige afwezigheid van arousal"],"a":1,"u":"De wet van Yerkes-Dodson beschrijft een curvilineair verband: er is een optimaal (bepaald) punt van arousal, terwijl zowel te weinig als te veel arousal de prestatie ondermijnt."},{"t":"4","q":"Volgens de psychoanalyse van Freud is het deel van de psyche dat het gedrag het sterkst stuurt vooral:","o":["het bewuste, waar we op elk moment aan denken","het onbewuste, met verlangens en conflicten waar we geen toegang toe hebben","het voorbewuste, dat we makkelijk kunnen oproepen","de introspectie van alledaagse gedachten"],"a":1,"u":"Freud vergeleek het bewuste met het topje van de ijsberg; de niet-bewuste processen onderaan (onbewuste verlangens en conflicten) bepalen volgens hem de persoonlijkheid."},{"t":"4","q":"Een kind van drie dat meteen wil eten of geknuffeld worden zonder rekening te houden met de situatie, laat vooral het werk zien van:","o":["het superego dat morele normen oplegt","het ego dat met de realiteit onderhandelt","het id dat het lustprincipe volgt","het ego-ideaal dat het ideale zelf voorstelt"],"a":2,"u":"Het id is het primitieve, onbewuste deel dat sinds de geboorte aanwezig is en het lustprincipe volgt: onmiddellijke bevrediging en het vermijden van pijn."},{"t":"4","q":"Wat is volgens Rogers kenmerkend voor een GEZONDE persoonlijkheidsontwikkeling?","o":["een grote kloof tussen het actuele en het ideale zelf","congruentie tussen de fenomenologische en de objectieve realiteit","een fixatie in een vroeg psychoseksueel stadium","het onderdrukken van de drang naar zelfactualisatie"],"a":1,"u":"Bij Rogers is een gezonde ontwikkeling er een waarbij de fenomenologische realiteit gelijk is aan de objectieve realiteit (congruentie), zodat de persoon zich kan ontplooien zoals hij of zij wil."},{"t":"4","q":"Een radicale behaviorist zou over persoonlijkheid het meest waarschijnlijk stellen dat:","o":["persoonlijkheid vooral bepaald wordt door aangeboren trekken","de mens start als een onbeschreven blad en het resultaat is van zijn conditioneringsgeschiedenis","onbewuste conflicten uit de kindertijd het gedrag sturen","zelfactualisatie de belangrijkste drijfveer is"],"a":1,"u":"Radicale behavioristen zien de mens als een tabula rasa (onbeschreven blad); persoonlijkheid is volgens hen het resultaat van de unieke conditioneringsgeschiedenis en persoonlijkheidsproblemen zijn verkeerd aangeleerd gedrag."},{"t":"4","q":"Iemand met een sterke overtuiging dat wat hem overkomt vooral in zijn eigen handen ligt, scoort hoog op een intern soort van:","o":["locus of control","fenomenologische realiteit","castratieangst","catharsis"],"a":0,"u":"Locus of control verwijst naar de overtuiging of wat je overkomt onder interne of externe controle staat, oftewel of je je lot in eigen handen hebt of niet."},{"t":"4","q":"Wat is het belangrijkste bezwaar tegen de MBTI zoals dat in de leerstof wordt genoemd?","o":["hij meet te veel trekken tegelijk om bruikbaar te zijn","hij gebruikt een categorische aanpak terwijl persoonlijkheid eerder op een continuum ligt","hij is enkel gebaseerd op lichaamsbouw","hij houdt geen rekening met introversie en extraversie"],"a":1,"u":"De MBTI zet mensen in vaste hokjes (categorische benadering), maar persoonlijkheidseigenschappen zijn normaal verdeeld en liggen op een continuum; daarom is het onderscheid in types niet terug te vinden in metingen."},{"t":"4","q":"De trekbenadering verschilt vooral van de typebenadering doordat ze ervan uitgaat dat:","o":["je een eigenschap ofwel volledig hebt ofwel helemaal niet","mensen meer of minder van een bepaald kenmerk hebben op een continuum","persoonlijkheid volledig door de omgeving wordt bepaald","enkel lichaamsvochten de persoonlijkheid bepalen"],"a":1,"u":"De trekbenadering is dimensioneel in plaats van categorisch: iedereen wordt beschreven met hetzelfde beperkte aantal kenmerken waarvan men meer of minder heeft, in plaats van in aparte vakjes."},{"t":"4","q":"Welke reeks factoren hoort bij het Big Five-model (OCEAN)?","o":["bloed, slijm, zwarte gal en gele gal","endomorf, ectomorf en mesomorf","openheid, conscientieusheid, extraversie, aangenaamheid en neuroticisme","denken, voelen, oordelen en percipieren"],"a":2,"u":"De Big Five (OCEAN) bestaat uit openheid voor ervaringen, conscientieusheid, extraversie, aangenaamheid en neuroticisme (emotionele stabiliteit)."},{"t":"4","q":"Uit tweelingonderzoek naar de Big Five concludeert de leerstof dat persoonlijkheid:","o":["volledig aangeboren en dus onveranderlijk is","volledig door de omgeving wordt gevormd","deels erfelijk is, ongeveer half aangeboren en half omgeving","geen enkele erfelijke component heeft"],"a":2,"u":"Op basis van tweelingvoorbeelden stelt de leerstof dat persoonlijkheid deels erfelijk is, met een verdeling van ongeveer 50% aangeboren en 50% omgeving."},{"t":"4","q":"Bij projectieve testen zoals de Rorschach en de TAT is het uitgangspunt dat:","o":["er een duidelijk juist antwoord is dat objectief gescoord wordt","de persoon onbewuste preoccupaties projecteert op vaag materiaal","enkel de reactietijd de persoonlijkheid meet","de betrouwbaarheid en validiteit uitstekend zijn aangetoond"],"a":1,"u":"Projectieve testen gaan uit van het principe van projectie: zonder juist antwoord projecteert de persoon onbewuste preoccupaties op het materiaal; de kritiek is juist dat de betrouwbaarheid en validiteit onvoldoende zijn aangetoond."},{"t":"5","q":"Wat is het verschil tussen gewaarwording en waarneming volgens het hoofdstuk?","o":["Beide begrippen betekenen precies hetzelfde en worden door elkaar gebruikt","Gewaarwording is het actief toekennen van betekenis, waarneming is enkel ruwe zintuigprikkeling","Gewaarwording is de stimulatie van de zintuigen zonder betekenis, waarneming is het actief interpreteren ervan door het brein","Gewaarwording gebeurt in het brein, waarneming in de zintuigen"],"a":2,"u":"Gewaarwording is de betekenisloze stimulatie van de zintuigen door de buitenwereld. Waarneming is het actieve proces waarbij de hersenen die gewaarwording interpreteren en er betekenis aan geven."},{"t":"5","q":"Waarom kan een blinde vlek in het oog ons meestal niet opvallen?","o":["Omdat de fovea het scherpste deel van het beeld overneemt","Omdat er in de blinde vlek juist extra receptoren zitten","Omdat het brein de ontbrekende informatie actief aanvult","Omdat we voortdurend knipperen en zo de vlek wegwerken"],"a":2,"u":"De blinde vlek is de plek waar de oogzenuw het oog verlaat en waar geen receptoren zitten. De hersenen vullen dit gat op, waardoor we geen vlek zien."},{"t":"5","q":"Iemand loopt van je weg, waardoor het beeld op je netvlies steeds kleiner wordt, maar toch blijf je die persoon als even groot waarnemen. Welk fenomeen beschrijft dit?","o":["Binoculaire dispariteit","Grootteconstantie","Apparente beweging","Laterale inhibitie"],"a":1,"u":"Perceptuele constantie houdt de waarneming stabiel ondanks een wisselend retinaal beeld. Grootteconstantie zorgt ervoor dat een persoon even groot lijkt, ook al krimpt het netvliesbeeld."},{"t":"5","q":"Wat is het verschil tussen een proximale en een distale stimulus?","o":["De proximale stimulus is het voorwerp zelf, de distale stimulus is het beeld op de retina","De proximale stimulus is de fysische energie die je receptoren raakt, de distale stimulus is het voorwerp dat die energie produceert","Beide verwijzen naar het voorwerp, maar op verschillende afstanden","De distale stimulus stimuleert de receptoren, de proximale stimulus is het verre voorwerp"],"a":1,"u":"De proximale stimulus is het geheel van fysische energie dat de sensorische receptoren raakt, zoals lichtgolven op de retina. De distale stimulus is het voorwerp dat die energie reflecteert of produceert."},{"t":"5","q":"Waarom noemt het hoofdstuk waarneming een heuristisch interpretatieproces?","o":["Omdat het brein elke mogelijke distale stimulus even waarschijnlijk acht","Omdat waarneming altijd een foutloze reconstructie van de wereld oplevert","Omdat de hersenen op basis van veronderstellingen de meest waarschijnlijke distale stimulus reconstrueren, wat meestal maar niet altijd klopt","Omdat waarneming enkel op de proximale stimulus steunt en verder niets veronderstelt"],"a":2,"u":"Een proximale stimulus kan van verschillende distale stimuli komen. Het brein reconstrueert daarom de meest waarschijnlijke distale stimulus op basis van veronderstellingen, wat meestal klopt maar bij illusies faalt."},{"t":"5","q":"Wat is het belangrijkste verschil tussen bottom-up en top-down verwerking?","o":["Bottom-up gaat van kennis en verwachtingen naar de buitenwereld, top-down van de omgevingsstimuli naar het individu","Bottom-up wordt gestuurd door de kenmerken van de omgevingsstimuli, top-down door kennis en verwachtingen","Beide worden volledig gestuurd door de kenmerken van de stimulus","Bottom-up speelt enkel bij herkenning, top-down enkel bij de primaire schets"],"a":1,"u":"Bottom-up verwerking loopt van de receptoren naar de hogere hersencentra en wordt gestuurd door de stimuluskenmerken. Top-down verwerking wordt gestuurd door kennis en verwachtingen, van individu naar buitenwereld."},{"t":"5","q":"In welke volgorde verlopen de drie stadia van de computationele theorie van Marr?","o":["Perceptuele organisatie, primaire schets, patroon- en objectherkenning","Patroon- en objectherkenning, primaire schets, perceptuele organisatie","Primaire schets, perceptuele organisatie, patroon- en objectherkenning","Primaire schets, patroon- en objectherkenning, perceptuele organisatie"],"a":2,"u":"Volgens Marr begint de verwerking met de primaire schets (2D vereenvoudiging van vlekken en lijnen), gevolgd door perceptuele organisatie (2,5D schets) en tot slot patroon- en objectherkenning (3D voorwerpgericht beeld)."},{"t":"5","q":"Je herkent een banaan doordat je hem opdeelt in de kenmerken geel en krom in plaats van hem met een compleet opgeslagen plaatje te vergelijken. Welk mechanisme van patroonherkenning is dit?","o":["Template-matching","Figuur-achtergrondscheiding","Kenmerkherkenning","Bewegingsparallax"],"a":2,"u":"Bij kenmerkherkenning worden voorwerpen herkend op basis van hun karakteristieke kenmerken (banaan = geel en krom). Template-matching zou het geheel juist met een opgeslagen sjabloon vergelijken."},{"t":"5","q":"Wat toont het woordsuperioriteitseffect aan over waarneming?","o":["Dat losse letters altijd sneller herkend worden dan letters in een woord","Dat context geen rol speelt bij het herkennen van letters","Dat een letter beter herkend wordt wanneer ze in een vertrouwd woord staat dan los, dankzij top-downprocessen","Dat beweging nodig is om letters te kunnen herkennen"],"a":2,"u":"Een letter wordt beter herkend als ze in een vertrouwd woord verschijnt dan wanneer ze los wordt getoond. Die vertrouwde context uit het geheugen ondersteunt de herkenning via top-downprocessen."},{"t":"6","q":"Wat gebeurt er volgens de spraakschaduw-experimenten met de boodschap die je moet negeren?","o":["Zowel de fysische als de inhoudelijke kenmerken worden bewust opgepikt","De fysische kenmerken zoals stemgeslacht en toon worden opgepikt, maar de inhoud niet","Enkel de inhoud wordt onthouden, de fysische kenmerken vallen weg","Er wordt helemaal niets van de te negeren boodschap opgepikt"],"a":1,"u":"Uit de spraakschaduw-taken bleek dat proefpersonen de fysische kenmerken (geslacht van de stem, toon, intensiteit) van het genegeerde oor wel oppikten, maar inhoudelijke veranderingen zoals een andere taal niet."},{"t":"6","q":"Waar plaatst het filtermodel de plek waar de selectie gebeurt?","o":["Pas nadat de betekenis volledig verwerkt is","Ergens tussen de twee verwerkingskanalen, dus vroeg in het proces","Helemaal aan het einde, in het langetermijngeheugen","Er is geen filter, enkel verzwakking van signalen"],"a":1,"u":"Het filtermodel gaat uit van vroege selectie: de filter zit ergens tussen beide verwerkingskanalen, nog voor de inhoud volledig verwerkt is."},{"t":"6","q":"Iemand roept plots jouw naam in een genegeerd gesprek en je pikt dat op. Welke verklaring past hier het best bij?","o":["De attenuatie-theorie, die stelt dat het genegeerde kanaal niet volledig wordt geblokkeerd maar verzwakt","Het strikte alles-of-niets-filtermodel, dat het genegeerde kanaal volledig afsluit","De feature integration theory, waarbij aandacht kenmerken bindt","Het pop-out effect bij kenmerkzoeken"],"a":0,"u":"De attenuatie-theorie stelt dat er geen harde filtering is maar verzwakking, waardoor betekenisvolle info zoals je eigen naam toch kan doordringen. Dit wijst op late selectie."},{"t":"6","q":"Waarom is 'vind de rode L tussen de blauwe L-en' makkelijker dan een zoektaak waarbij je kenmerken moet combineren?","o":["Omdat conjunctiezoeken automatisch verloopt en geen aandacht vraagt","Omdat het aantal afleiders bij kenmerkzoeken de zoektijd sterk verhoogt","Omdat bij kenmerkzoeken een distinctief kenmerk eruit springt via het pop-out effect en geen aandacht vraagt","Omdat kleur altijd sneller verwerkt wordt dan vorm"],"a":2,"u":"Bij kenmerkzoeken volstaat een onderscheidend kenmerk dat er automatisch uitspringt (pop-out), wat geen aandacht vraagt en niet afhangt van het aantal afleiders. Conjunctiezoeken vraagt wel aandacht."},{"t":"6","q":"Wat is volgens de feature integration theory de kernrol van aandacht?","o":["Aandacht verzwakt irrelevante signalen zonder ze te blokkeren","Aandacht werkt als lijm die de losse kenmerken van een object samenbindt","Aandacht selecteert enkel op de fysische kenmerken van een stimulus","Aandacht maakt kenmerkzoeken trager naarmate er meer afleiders zijn"],"a":1,"u":"Volgens de feature integration theory zorgt aandacht voor de integratie van kenmerken: aandacht is de lijm die de losse eigenschappen van een object aan elkaar bindt."},{"t":"6","q":"Waarom kunnen we volgens het hoofdstuk niet echt twee taken tegelijk uitvoeren?","o":["Omdat het brein twee taken perfect parallel verwerkt zonder verlies","Omdat we in werkelijkheid voortdurend afwisselen tussen taken, met taakwisselkosten tot gevolg","Omdat elke taak automatisch verloopt en dus geen aandacht vraagt","Omdat de filter beide taken volledig blokkeert"],"a":1,"u":"Volgens het hoofdstuk combineren we taken nooit echt samen maar wisselen we voortdurend af (taakwissel), wat taakwisselkosten oplevert waardoor de taken slechter worden uitgevoerd."},{"t":"6","q":"Waarom lukt het bij de Strooptaak niet om vlot de inktkleur van een kleurwoord te benoemen?","o":["Omdat kleur benoemen een automatisch proces is dat het lezen verstoort","Omdat lezen automatisch verloopt en botst met het gecontroleerde proces van de juiste kleur benoemen","Omdat beide taken volledig automatisch zijn en elkaar versterken","Omdat de fysische kenmerken van het woord niet verwerkt worden"],"a":1,"u":"Lezen is een automatisch proces dat in de weg zit van het gecontroleerde proces (de inktkleur benoemen). De Strooptaak lokt zo een conflict uit tussen automatische en gecontroleerde processen."},{"t":"7","q":"Wat verstaat de tekst onder 'bewustzijn'?","o":["De subjectieve ervaring van gedachten, herinneringen, emoties en omgevingsprikkels waar je op dit moment besef van hebt","Het geheel van prikkels dat je hersenen registreren zonder dat je er ooit besef van hebt","Een vaste hersengolf die alleen tijdens diepe slaap voorkomt","De opslag van informatie in het langetermijngeheugen"],"a":0,"u":"Bewustzijn is volgens de bron de subjectieve ervaring van dat waar je nu besef van hebt, zoals gedachten, herinneringen, emoties en omgevingsstimuli."},{"t":"7","q":"In het semantische-primingonderzoek moesten proefpersonen een lexicale beslissing nemen. Wat hield die beslissing precies in?","o":["Beoordelen hoe mooi ze een prikkel vonden","Zo snel mogelijk beslissen of een reeks letters een echt woord vormde of niet","Aangeven waar op het scherm een stimulus verscheen","Een woord onthouden en het een week later herkennen"],"a":1,"u":"Bij een lexicale beslissing moet je zo snel mogelijk oordelen of de aangeboden letters wel of geen bestaand woord vormen, zoals 'tafel' tegenover 'falet'."},{"t":"7","q":"Iemand ziet heel kort het woord 'tafel' (een prime) en daarna 'stoel'. Volgens het primingonderzoek reageert die persoon dan sneller. Waarom?","o":["Omdat 'stoel' korter is dan 'tafel'","Omdat de prime bewust en langdurig werd aangeboden","Omdat de prime en het doelwoord semantisch gerelateerd zijn en elkaar activeren","Omdat de persoon de prime niet heeft waargenomen"],"a":2,"u":"Als prime en doelwoord tot dezelfde inhoudelijke context horen (semantisch gerelateerd), reageren mensen sneller. Dit effect blijft zelfs bestaan als de prime maar in een flits verschijnt."},{"t":"7","q":"Wat is kenmerkend voor blindsightpatiënten?","o":["Ze hebben schade aan de hypothalamus en verliezen hun slaapritme","Ze zien alles bewust maar kunnen er niets over zeggen","Ze zeggen blind te zijn, maar gokken locatie of beweging van prikkels beter dan op kans te verwachten","Ze zijn extra vatbaar voor subliminale reclame"],"a":2,"u":"Door schade aan de primaire visuele cortex nemen deze patiënten prikkels in hun aangetaste gezichtsveld enkel onbewust waar, maar ze gokken locatie, richting en beweging beter dan het toeval, dus eigenlijk 'zien' ze wel."},{"t":"7","q":"Wat is de conclusie van de bron over subliminale reclame, zoals in het bioscooponderzoek?","o":["Het onderzoek toonde overtuigend aan dat verborgen boodschappen het koopgedrag sterk sturen","De onderzoeksresultaten bleken vervalst en er is geen degelijk bewijs dat subliminale berichten koopgedrag veranderen","Subliminale reclame werkt alleen bij kinderen","Verborgen reclame werkt beter dan gewone reclame in het dagelijks leven"],"a":1,"u":"De bekende bioscoopresultaten bleken gefraudeerd. Geen enkel zorgvuldig onderzoek heeft aangetoond dat subliminale boodschappen het koopgedrag echt veranderen."},{"t":"7","q":"Welke hersenstructuur wordt in de tekst beschreven als onze 'interne klok' die het biologisch ritme regelt?","o":["De hersenstam","De primaire visuele cortex","De hersenschors","De nucleus suprachiasmaticus"],"a":3,"u":"De nucleus suprachiasmaticus is volgens de bron verantwoordelijk voor ons biologisch ritme en werkt als onze interne klok, die zelfs zonder licht-donkersignalen doorloopt."},{"t":"7","q":"Wat is typisch voor de REM-slaap volgens de tekst?","o":["Trage deltagolven en de diepste slaap van de nacht","De hoge amplitude van de K-complex en slaapspoelen","Alfagolven waarbij je aandacht wat losser wordt","Droomslaap met spierverlamming en verhoogde hersenactiviteit die op stadium 1 lijkt"],"a":3,"u":"REM is de droomslaap met spierverlamming, terwijl de hersenactiviteit weer toeneemt en op stadium 1 gaat lijken. Per nacht kom je 4 a 5 keer in REM, telkens langer."},{"t":"7","q":"Hoe verklaart de activatiesynthesetheorie het ontstaan van dromen?","o":["Hogere hersencentra proberen willekeurige ruis uit lagere hersencentra betekenis te geven","De hersenen worden tijdens de slaap volledig uitgeschakeld","Dromen dienen enkel om herinneringen letterlijk te kopiëren naar het kortetermijngeheugen","Dromen ontstaan door externe reclameboodschappen tijdens de slaap"],"a":0,"u":"Volgens deze theorie produceren lagere hersencentra in de hersenstam willekeurige elektrische ruis, en dromen zijn de poging van de cortex om die ruis betekenis te geven."},{"t":"8","q":"Wat is het kenmerkende verloop van de vergeetcurve van Ebbinghaus?","o":["We vergeten in het begin traag en later steeds sneller","We vergeten eerst snel en daarna steeds trager, waarbij een deel permanent blijft","We vergeten alles even snel, ongeacht hoeveel tijd er verstrijkt","We onthouden eerst weinig en gaan pas na weken echt vergeten"],"a":1,"u":"Volgens de bron vergeten we snel in de eerste dagen na het leren en daarna veel trager, terwijl een deel permanent behouden blijft."},{"t":"8","q":"In het iconisch-geheugenexperiment van Sperling scoorden proefpersonen bijna foutloos wanneer ze na een toon een bepaalde rij letters moesten geven, terwijl ze bij het rapporteren van alle letters maar 4 van de 9 juist hadden. Wat toont dit vooral aan?","o":["Dat het iconisch geheugen maar 4 letters tegelijk kan opslaan","Dat auditieve prikkels beter worden onthouden dan visuele","Dat we heel veel visuele info kort registreren, maar dat die zeer snel vervaagt","Dat aandacht geen enkele rol speelt bij het rapporteren van letters"],"a":2,"u":"De bron stelt dat we heel veel info kort bijhouden (80-85%), maar dat die binnen minder dan 500 ms vervaagt. Daarom kon men bij gerichte rapportage nog een volledige rij weergeven."},{"t":"8","q":"Iemand noemt eenmalig een telefoonnummer en je probeert het te onthouden zonder het op te schrijven. Op welk geheugensysteem en welke grens doe je dan vooral een beroep?","o":["Het kortetermijngeheugen, met een capaciteit rond de 7 items","Het sensorisch register, dat de info uren vasthoudt","Het langetermijngeheugen, dat onbeperkt cijfers opslaat","Het procedureel geheugen, dat vooral vaardigheden bewaart"],"a":0,"u":"Volgens Miller slagen de meeste mensen erin 5 tot 9 items correct te rapporteren (het magische getal 7 plus of min 2). Dit is de capaciteit van het kortetermijngeheugen."},{"t":"8","q":"Wat is het verschil tussen het primacy- en het recency-effect in de seriele positiecurve?","o":["Primacy betreft de laatste woorden vanuit het KTG, recency de eerste woorden vanuit het LTG","Primacy en recency verwijzen allebei naar de middelste woorden van de lijst","Beide effecten ontstaan doordat de woorden nog in het sensorisch register zitten","Primacy betreft de eerste woorden die naar het LTG gaan, recency de laatste woorden die nog vers in het KTG zitten"],"a":3,"u":"De bron beschrijft het primacy-effect als de eerste woorden die via herhaling in het LTG komen, en het recency-effect als de laatste woorden die nog het verst in het KTG zitten."},{"t":"8","q":"Een fietser kan perfect fietsen maar vindt het lastig om in woorden uit te leggen hoe dat precies gaat. Bij welk geheugentype hoort dit vooral?","o":["Semantisch geheugen","Procedureel (impliciet) geheugen","Episodisch geheugen","Declaratief geheugen"],"a":1,"u":"Het procedureel geheugen is onbewust en impliciet: het gaat over hoe je iets doet en is moeilijk exact in woorden te beschrijven, zoals bij fietsen."},{"t":"8","q":"Volgens de tweevoudige codeertheorie van Paivio onthoud je stof beter wanneer je ze op twee manieren codeert. Welke aanpak past hier het best bij?","o":["De les woord voor woord letterlijk herhalen tot je ze uit je hoofd kent","De stof zowel visueel (bijvoorbeeld met kleur of schema's) als verbaal in eigen woorden verwerken","Alles in een keer instuderen zonder pauzes ertussen","Enkel de eerste letter van elk begrip proberen te onthouden"],"a":1,"u":"Paivio's dubbele codering stelt dat twee codes, een visuele en een verbale, beter worden onthouden dan een. Je zet de les dus om in eigen woorden en gebruikt bijvoorbeeld fluostiften of een inhoudstafel."},{"t":"8","q":"In het experiment van Craik en Tulving moesten mensen bij woorden verschillende vragen beantwoorden. Welke vraag leidde tot de beste herinnering?","o":["Of het woord in hoofdletters geschreven was","Of het woord rijmde op een ander woord","Of het woord een dier aanduidde","Of het woord uit vier letters bestond"],"a":2,"u":"De betekenisvraag (is het een dier?) zorgt voor diepere verwerking en werd volgens de bron het best onthouden: hoe dieper je verwerkt, hoe beter je geheugen."},{"t":"8","q":"Bij het duikersexperiment van Godden en Baddeley leerden duikers woorden aan land of onder water en werden ze in dezelfde of een andere context getest. Welk principe illustreert dit?","o":["Retroactieve interferentie, waarbij nieuwe info oudere info verdringt","De hypothese van codeerspecificiteit: herinnering verbetert als de oproepcontext lijkt op de leercontext","Het toetseffect, waarbij jezelf testen de opslag bevordert","Het magische getal 7, over de capaciteit van het KTG"],"a":1,"u":"Volgens de codeerspecificiteitshypothese bevordert een oproepcontext die lijkt op de leercontext het oproepingsproces. Het duikersexperiment toont dit."},{"t":"9","q":"Wat wordt in dit hoofdstuk verstaan onder analytische intelligentie?","o":["Het geheel van verstandelijke vermogens om abstract, logisch en consistent te redeneren","Het vermogen om problemen in een concrete, alledaagse situatie op te lossen","Een aangeboren talent voor muziek, sport of sociale omgang","De vaardigheid om je in te leven in wat een ander denkt of voelt"],"a":0,"u":"Analytische intelligentie is het geheel van verstandelijke vermogens om abstract, logisch en consistent te redeneren, wat belangrijk is voor schoolse en professionele prestaties."},{"t":"9","q":"Volgens de klassieke IQ-formule van Stern (ML/CL x 100) ontstaat er een probleem. Welk?","o":["De formule houdt geen rekening met de culturele achtergrond van de testpersoon","De formule geeft altijd een score boven de 100","De formule werkt bij kinderen maar loopt mis bij volwassenen","De formule kan enkel bij tweelingen worden toegepast"],"a":2,"u":"De formule mentale leeftijd / chronologische leeftijd x 100 werkt bij kinderen, maar niet bij volwassenen. Een vader van 40 met dezelfde prestatie als zijn zoon van 20 zou zo een veel lager IQ krijgen."},{"t":"9","q":"Waarin verschillen de verbale en de performale subtests van de Wechsler-test?","o":["Verbale meet klassieke schoolse kennis, performale meet niet-taalgebonden, praktische en motorische opdrachten","Verbale is voor kinderen, performale enkel voor volwassenen","Verbale meet erfelijkheid, performale meet omgevingsinvloeden","Verbale test snelheid, performale test enkel geheugen"],"a":0,"u":"Bij Wechsler staat de verbale schaal voor de klassieke schoolse intelligentie, terwijl de performale schaal niet-taalgebonden kennis meet via praktische en motorische opdrachten."},{"t":"9","q":"Voor welke testpersoon is een niet-verbale test zoals de Raven progressive matrices het meest geschikt?","o":["Iemand die uitzonderlijk hoog scoort op schoolse taaltests","Iemand die zijn erfelijkheidsgraad wil laten bepalen","Iemand met verbale problemen, weinig educatie of een andere culturele achtergrond","Iemand van wie je enkel de gekristalliseerde kennis wil meten"],"a":2,"u":"Bij verbale problemen, weinig genoten onderwijs of een andere culturele achtergrond zijn taalgevoelige, schoolse tests niet bruikbaar. Een niet-verbale test die redeneren meet, zoals de Raven matrices, is dan wel geschikt."},{"t":"9","q":"Een intelligentietest is een psychometrische test. Wat betekent dat in dit hoofdstuk?","o":["Dat de test enkel motorische snelheid meet","Dat het een objectief meetinstrument is voor psychische kwaliteiten","Dat de score meteen exact 100% betrouwbaar is","Dat de test geen normsteekproef nodig heeft"],"a":1,"u":"Een psychometrische test is het meten van psychologische kenmerken. De intelligentietest is zo'n objectief meetinstrument voor psychische kwaliteiten."},{"t":"9","q":"Een IQ van 97 wordt gerapporteerd met een 95%-betrouwbaarheidsinterval van 90 tot 104. Wat betekent dit?","o":["Dat het IQ met zekerheid precies 97 is","Dat de test 90% van de tijd faalt","Dat er 95% zekerheid is dat het werkelijke IQ tussen 90 en 104 ligt","Dat het IQ elke test met 5 punten stijgt"],"a":2,"u":"Geen enkele test is 100% betrouwbaar, er zit altijd meetfout op. Het interval geeft aan dat men met 95% zekerheid kan zeggen dat het werkelijke IQ tussen 90 en 104 ligt."},{"t":"9","q":"Waarom is een hoge betrouwbaarheid wel noodzakelijk maar niet voldoende voor een goede validiteit?","o":["Omdat een test consistent kan meten en toch niet meten wat hij beweert te meten","Omdat betrouwbaarheid enkel bij kinderen telt","Omdat validiteit altijd hoger is dan betrouwbaarheid","Omdat een betrouwbare test per definitie ook valide is"],"a":0,"u":"Betrouwbaarheid gaat over consistente, herhaalbare resultaten, terwijl validiteit gaat over of de test meet wat hij beweert. Een uurwerk dat in de winter op zomeruur staat, meet consistent maar toch fout."},{"t":"9","q":"Wat stelde Spearman met zijn onderscheid tussen de g-factor en de s-factoren?","o":["Dat intelligentie volledig aangeboren en onveranderlijk is","Dat er een algemene intelligentie (g-factor) bestaat naast specifieke mentale vaardigheden (s-factoren)","Dat er acht van elkaar losstaande intelligenties zijn","Dat schoolse tests geen enkele waarde hebben"],"a":1,"u":"Spearman onderscheidde een algemene intelligentie, de g-factor, van specifieke mentale vaardigheden, de s-factoren, zoals verbale vaardigheden."},{"t":"9","q":"Wat is volgens Cattell het verschil tussen vloeiende en gekristalliseerde intelligentie?","o":["Vloeiende komt voort uit opgebouwde kennis, gekristalliseerde uit abstract denken","Vloeiende gaat over problemen oplossen en abstract denken, gekristalliseerde over opgebouwde kennis","Beide gaan uitsluitend over motorische vaardigheden","Vloeiende is enkel bij kinderen aanwezig, gekristalliseerde enkel bij dieren"],"a":1,"u":"Vloeiende intelligentie gaat over problemen oplossen, abstract denken en nieuwe dingen leren, terwijl gekristalliseerde intelligentie voortkomt uit de kennis die je doorheen je leven opbouwt."},{"t":"9","q":"Hoe verandert intelligentie doorgaans naarmate iemand ouder wordt?","o":["Zowel vloeiende als gekristalliseerde intelligentie nemen sterk af","Gekristalliseerde intelligentie verdwijnt, vloeiende blijft gelijk","Beide nemen elk decennium met 3 à 5 punten toe","Vloeiende intelligentie neemt af, gekristalliseerde intelligentie blijft op peil en bouwt op"],"a":3,"u":"Bij het ouder worden neemt de vloeiende intelligentie af (snelheid en nauwkeurigheid van informatieverwerking daalt), terwijl de gekristalliseerde intelligentie, de algemene kennis, niet afneemt en blijft opbouwen."},{"t":"9","q":"Iemand haalt geen hoge score op een klassieke IQ-test, maar is uitzonderlijk goed in muziek en beweging. Bij welke theorie past deze visie het best?","o":["Spearmans g-factor, waarbij één algemene factor alles bepaalt","De theorie van de meervoudige intelligenties van Gardner","Sterns IQ-formule met mentale en chronologische leeftijd","Het CHC-model met een strikt drielagige structuur"],"a":1,"u":"Gardner stelt dat je niet hoog hoeft te scoren op een IQ-test om uitzonderlijke kwaliteiten te hebben. In zijn theorie van de meervoudige intelligenties is intelligentie de vaardigheid om problemen op te lossen in een bepaald gebied, zoals het muzikale of lichamelijk-kinesthetische domein."}],"theory":[{"h":"Inleiding & geschiedenis","items":["Psychologie: de wetenschap van het gedrag en de mentale processen, waarbij meetbaar gedrag gebruikt wordt om interne processen te begrijpen.","Lekenpsychologie: het alledaagse idee dat je op basis van gezond verstand en volkswijsheden wel weet hoe de mens denkt.","Pseudopsychologie: niet-onderbouwde psychologische aannames die zich ten onrechte als wetenschappelijke waarheid voordoen.","Introspectie: het bestuderen van je eigen bewustzijn door nauwkeurig je gevoelens, gedachten en herinneringen te rapporteren.","Structuralisme: stroming die zoekt uit welke bouwstenen de geest bestaat en hoe die samen mentale structuren vormen.","Functionalisme: tegenbeweging die onderzoekt hoe het bewustzijn functioneert en nuttig is voor het aanpassen aan de omgeving.","Gestaltpsychologie: stroming die stelt dat het geheel meer is dan de som der delen en focust op perceptie.","Behaviorisme: stroming die enkel observeerbaar gedrag bestudeert via stimulus en respons, zonder aandacht voor het onmeetbare hoofd (black box).","Psychoanalyse: benadering van Freud die stelt dat onbewuste processen en impulsen ons gedrag sturen, met kritiek dat ze niet wetenschappelijk onderbouwd is.","Biopsychosociale benadering: hedendaagse visie die gedrag verklaart op biologisch, psychologisch en sociaal niveau tegelijk.","Correlatie: de mate waarin twee variabelen samenhangen, uitgedrukt in richting (plus of min) en sterkte (0 tot 1), zonder oorzakelijk verband te bewijzen.","Illusoire correlatie: het menen te zien van een verband tussen twee variabelen terwijl dat er in werkelijkheid niet is.","Operationalisatie: het vertalen van de variabelen die je wil meten naar concrete en meetbare handelingen.","Falsifieerbaarheid: de eis dat een goede theorie toetsbaar moet zijn en dus in principe weerlegd kan worden."]},{"h":"Conditionering & leren","items":["Ongeconditioneerde stimulus (OS): een prikkel die vanzelf, zonder aanleren, een reactie uitlokt, zoals voedsel dat kwijlen veroorzaakt.","Geconditioneerde stimulus (CS): een oorspronkelijk neutrale prikkel die na koppeling met de OS zelf een reactie gaat uitlokken.","Verwerving: het opbouwen van een associatie tussen de OS en de CS door meerdere koppelingen.","Stimulusgeneralisatie: het uitbreiden van een aangeleerde reactie naar gelijksoortige prikkels.","Stimulusdiscriminatie: het beperken van een aangeleerde reactie tot een specifiekere groep prikkels door onderscheid te maken.","Extinctie: het verzwakken of uitdoven van een geconditioneerde reactie doordat de CS herhaaldelijk zonder de OS wordt aangeboden, zonder dat het gedrag definitief verdwijnt.","Spontaan herstel: het opnieuw opduiken van een uitgedoofde reactie na extinctie, maar in verzwakte vorm.","Operante respons: gedrag dat wordt aangeleerd via bekrachtiging of straf, waarbij bevredigende gevolgen het gedrag versterken.","Positieve bekrachtiging: het toedienen van een aangename prikkel waardoor de kans op het gedrag toeneemt.","Negatieve bekrachtiging: het wegnemen van een onaangename prikkel waardoor het gedrag toeneemt.","Shaping: gedrag geleidelijk vormen door successieve benaderingen van het gewenste gedrag te bekrachtigen.","Partiële bekrachtiging: gedrag dat niet telkens wordt bekrachtigd, waardoor het trager wordt geleerd maar beter bestand is tegen extinctie.","Positieve versus negatieve straf: positieve straf voegt een onaangename prikkel toe, negatieve straf neemt een aangename prikkel weg, en beide verlagen de kans op het gedrag.","Aangeleerde hulpeloosheid: apathisch, lusteloos gedrag dat ontstaat door het gevoel geen controle te hebben over de omgeving."]},{"h":"Emotie & motivatie","items":["James-Lange theorie: een prikkel lokt eerst een lichamelijke reactie uit, die de hersenen daarna als emotie interpreteren.","Cannon-Bard theorie: vanuit de thalamus lopen twee onafhankelijke routes zodat lichamelijke reactie en emotie tegelijk ontstaan.","Cognitieve appraisal theorie: de cognitieve beoordeling van een prikkel komt eerst, waarna arousal en emotie volgen.","Amygdala: kern van het emotionele brein binnen het limbisch circuit die de automatische angstreactie verzorgt en het sterkst reageert bij angst.","Valentie: de dimensie van emotie die aangeeft hoe aangenaam of onaangenaam iets is.","Arousal: de dimensie van emotie die de intensiteit en mate van fysiologische activatie weergeeft.","Fight-flight-or-freeze respons: automatische reactie op dreiging via aanvallen, vluchten of stilstaan.","Facial feedback hypothese: je gezichtsuitdrukking beinvloedt je emotionele beleving, dus een vrolijk gezicht versterkt positieve gevoelens.","Culturele uitingsregels: sociale normen die bepalen hoe sterk je een basisemotie in je gelaat mag tonen.","Homeostase: het streven naar een stabiele interne toestand, geregeld door de hypothalamus, dat gedrag in een bepaalde richting duwt.","Drifttheorie: een interne behoefte duwt het lichaam tot gedrag dat de drift vermindert en het evenwicht herstelt.","Intrinsieke versus extrinsieke motivatie: intrinsiek doe je iets voor de voldoening van de activiteit zelf, extrinsiek om een extern doel te bereiken.","Delayed gratification: via zelfcontrole een kortetermijnverlangen onderdrukken om een langetermijndoel te realiseren.","Prestatiemotivatie volgens Elliot: taakmotivatie is gericht op interesse in de taak, terwijl egodoelen gericht zijn op een goede indruk via toenadering of vermijding."]},{"h":"Persoonlijkheid","items":["Onbewuste: het deel van de psyche waartoe we geen toegang hebben, maar dat volgens Freud de belangrijkste kracht achter ons psychisch leven vormt.","Id, ego, superego: het primitieve lustdeel (id), het rationele bemiddelende deel dat met de realiteit omgaat (ego) en het morele deel met normen en waarden (superego).","Psychoseksuele stadia: vijf fasen (oraal, anaal, fallisch, latentie, genitaal) waarin de lust op een bepaalde lichaamszone gericht is en waarin je persoonlijkheid gevormd wordt.","Fixatie: blijven vasthangen in een stadium door trauma of te veel of te weinig bevrediging, wat een bepaald persoonlijkheidstype of zelfs een stoornis kan opleveren.","Catharsis: de emotionele ontlading en het inzicht die ontstaan wanneer onbewuste conflicten in het bewustzijn worden gebracht.","Projectieve test: een test zonder juist antwoord (bv. Rorschach of TAT) waarbij iemand onbewuste preoccupaties op vaag materiaal projecteert.","Zelfactualisatie: het humanistische streven om jezelf maximaal te ontplooien, centraal bij Rogers en Maslow.","Fenomenologische realiteit: de bewuste, subjectieve manier waarop iemand de werkelijkheid rondom zich waarneemt, die zijn gedrag en gevoelens bepaalt.","Congruentie versus incongruentie: overeenstemming (gezond) of een kloof (ongezond) tussen het actuele en het ideale zelf.","Tabula rasa: de behavioristische opvatting dat de mens als onbeschreven blad start en gevormd wordt door zijn conditioneringsgeschiedenis.","Locus of control: de overtuiging of wat je overkomt onder interne of externe controle staat, dus of je je lot in eigen handen hebt.","Trekbenadering: een dimensionele aanpak die iedereen beschrijft met hetzelfde beperkte aantal kenmerken waarvan men meer of minder heeft.","Big Five (OCEAN): het huidige model met vijf grote factoren, openheid, conscientieusheid, extraversie, aangenaamheid en neuroticisme, deels erfelijk bevonden.","Persoonlijkheidsstoornis: een onaangepast, star en duurzaam patroon van gedachten, gevoelens en gedragingen dat afwijkt van de populatie, in de DSM-5 verdeeld in clusters A, B en C."]},{"h":"Waarneming","items":["Gewaarwording: de betekenisloze stimulatie van je zintuigen door energie uit de buitenwereld.","Waarneming: het actieve proces waarbij je brein die gewaarwording interpreteert en er betekenis aan geeft.","Blinde vlek: de plek in de retina waar de oogzenuw het oog verlaat en receptoren ontbreken, maar die je niet opmerkt omdat het brein de gaten opvult.","Fovea: het centrale deel van het netvlies waarmee je enkel het middelpunt van je blikveld scherp ziet.","Perceptuele constantie: het stabiel houden van je waarneming ondanks een voortdurend veranderend retinaal beeld.","Proximale stimulus: het geheel van fysische energie dat je sensorische receptoren rechtstreeks raakt, zoals lichtgolven op de retina.","Distale stimulus: het voorwerp in de buitenwereld dat de fysische energie (licht of geluid) reflecteert of produceert.","Heuristisch interpretatieproces: het reconstrueren van de meest waarschijnlijke distale stimulus op basis van veronderstellingen en de proximale stimulus.","Bottom-up verwerking: waarneming die van de receptoren naar hogere hersencentra loopt en gestuurd wordt door de kenmerken van de stimulus.","Top-down verwerking: waarneming die gestuurd wordt door je kennis en verwachtingen, van individu naar buitenwereld.","Primaire schets: het eerste Marr-stadium, een ruwe 2D vereenvoudiging van vlekken en lijnen op basis van helderheidsranden.","Gestaltpsychologie: de visie dat het geheel meer is dan de som der delen, waarbij groepering en figuur-achtergrondscheiding centraal staan.","Template-matching: patroonherkenning door een voorwerp te vergelijken met een compleet opgeslagen sjabloon in je geheugen.","Binoculaire dispariteit: de dieptaanwijzing die ontstaat doordat je twee ogen (65 mm uit elkaar) elk een licht verschillend beeld opvangen."]},{"h":"Aandacht","items":["Selectieve aandacht: het richten van je waarneming op een beperkt aantal stimuli omdat je aandachtscapaciteit begrensd is.","Filtering: het selecteren van één boodschap terwijl je de andere binnenkomende boodschappen negeert.","Cocktailpartyeffect: het vermogen om je in veel lawaai te focussen op één gesprek en de rest weg te filteren, terwijl belangrijke info zoals je naam er toch doorkomt.","Spraakschaduwen: een taak waarbij je de boodschap uit één oor moet herhalen en de andere moet negeren, om te testen wat je van het genegeerde kanaal oppikt.","Vroege selectie: het idee dat de filter vroeg werkt, waardoor enkel fysische kenmerken verwerkt worden en de inhoud niet.","Late selectie: het idee dat betekenis mee verwerkt wordt, zodat de filter pas na de inhoudelijke verwerking komt.","Filtermodel: model dat de filter tussen de twee verwerkingskanalen plaatst en uitgaat van vroege selectie.","Attenuatie-theorie: theorie die stelt dat het genegeerde kanaal niet geblokkeerd maar verzwakt wordt, zodat betekenisvolle info er toch kan doorkomen.","Kenmerkzoeken: zoeken op basis van één onderscheidend kenmerk dat automatisch opvalt (pop-out) en geen aandacht vraagt.","Conjunctiezoeken: zoeken via een combinatie van kenmerken, wat aandacht vraagt en trager wordt naarmate er meer afleiders zijn.","Feature integration theory: theorie waarin aandacht de 'lijm' is die de losse kenmerken van een object tot één geheel bindt.","Inattentional blindness: het over het hoofd zien van evidente zaken omdat je aandacht ergens anders op gericht is.","Taakwissel: het voortdurend heen en weer schakelen tussen taken in plaats van ze echt tegelijk uit te voeren, met taakwisselkosten.","Strooptaak: taak die een conflict uitlokt tussen het automatische lezen en het gecontroleerd benoemen van de inktkleur."]},{"h":"Bewustzijn, slaap & hypnose","items":["Bewustzijn: de subjectieve ervaring van gedachten, emoties en prikkels waar je op dit moment besef van hebt.","Subliminale perceptie: informatie die in je onbewuste zit en verwerkt wordt zonder dat je er bewust van bent.","Semantische priming: sneller reageren op een woord doordat er vooraf een inhoudelijk verwant woord werd aangeboden.","Lexicale beslissing: zo snel mogelijk oordelen of een letterreeks wel of geen bestaand woord vormt.","Blindsight: door schade aan de primaire visuele cortex prikkels enkel onbewust waarnemen, maar toch beter dan toeval gokken.","Subliminale reclame: verborgen boodschappen die koopgedrag zouden sturen, waarvoor geen degelijk bewijs bestaat.","Circadiaans ritme: de biologische cyclus van ongeveer 24 uur die onze waak-slaapafwisseling regelt.","Nucleus suprachiasmaticus: het hersendeel dat als interne klok het biologisch ritme aanstuurt, ook zonder licht-donkersignalen.","EEG: het meten van hersenactiviteit via elektroden die elektrische veranderingen op de schedel registreren.","Slaapstadia 1 tot 4: opeenvolgende fasen waarin de golffrequentie daalt en de amplitude stijgt richting diepe slaap.","Deltagolven: trage golven met hoge amplitude die horen bij de diepe slaap (slow wave sleep).","REM-slaap: droomslaap met spierverlamming en verhoogde hersenactiviteit, met 4 a 5 steeds langere periodes per nacht.","Consolidatie: het proces waarbij belangrijke informatie van het kortetermijn- naar het langetermijngeheugen gaat.","Activatiesynthesetheorie: de theorie dat de cortex willekeurige ruis uit lagere hersencentra betekenis probeert te geven, wat dromen oplevert.","Hypnose: een toestand met verhoogde vatbaarheid voor suggesties, zonder objectieve EEG-tekenen van een trance."]},{"h":"Geheugen","items":["Sensorisch register: apart geheugen per zintuig dat prikkels heel kort vasthoudt tussen gewaarwording en waarneming.","Iconisch geheugen: sensorisch register voor visuele info, dat veel registreert maar binnen minder dan 500 ms vervaagt.","Kortetermijngeheugen: geheugen voor info waaraan je nu aandacht besteedt, met een capaciteit van ongeveer 7 items (plus of min 2) en een duur van 20 tot 30 seconden.","Langetermijngeheugen: permanente opslag van info waarvan je je nu niet bewust bent en die je niet meer kwijtraakt.","Seriële positiecurve: u-vormige curve die aantoont dat de eerste en laatste woorden van een lijst het best worden herinnerd.","Primacy-effect: het beter onthouden van de eerste woorden doordat ze via herhaling in het LTG komen.","Recency-effect: het beter onthouden van de laatste woorden doordat ze nog vers in het KTG zitten.","Declaratief geheugen: bewuste kennis waarvan je weet dat ze de inhoud van je geheugen is, onderverdeeld in semantisch (feiten) en episodisch (gebeurtenissen).","Procedureel geheugen: onbewust, impliciet geheugen voor hoe je iets doet, moeilijk in woorden uit te leggen.","Dubbele codering: stof beter onthouden door ze zowel visueel als verbaal te coderen, want twee codes werken beter dan een.","Diepe verwerking: hoe meer je op betekenis verwerkt, hoe beter je iets onthoudt.","Gedistribueerd leren: leren met pauzes ertussen, wat beter werkt dan alles in een keer instuderen (massief leren).","Toetseffect: jezelf regelmatig testen bevordert de opslag in het langetermijngeheugen.","Oproepingsaanwijzingen: trucjes of gerichte vragen (retrieval cues) die helpen om iets uit het LTG naar het KTG te halen."]},{"h":"Intelligentie","items":["Analytische intelligentie: het geheel van verstandelijke vermogens om abstract, logisch en consistent te redeneren, belangrijk voor schoolse en professionele prestaties.","Mentale leeftijd: het prestatieniveau van een kind uitgedrukt in de leeftijd waarop dat niveau gemiddeld hoort, zoals bij de test van Binet en Simon.","Intelligentiequotiënt (Stern): een score berekend als mentale leeftijd gedeeld door chronologische leeftijd maal 100, die goed werkt bij kinderen maar niet bij volwassenen.","Verbale versus performale subtests (Wechsler): verbaal meet klassieke schoolse intelligentie, performaal meet niet-taalgebonden, praktische en motorische vaardigheden.","Niet-verbale test: een test zoals de Raven matrices die redeneren meet zonder taal, bruikbaar bij taalproblemen of een andere culturele achtergrond.","Psychometrische test: een objectief meetinstrument om psychologische kenmerken zoals intelligentie of persoonlijkheid te meten.","Normsteekproef: een groep leeftijdsgenoten waarmee je iemands score vergelijkt om te zien of die gemiddeld, beter of slechter is.","Betrouwbaarheid: de mate waarin een test consistente en herhaalbare resultaten geeft, bijvoorbeeld via test-hertest of split-half.","Betrouwbaarheidsinterval: het bereik waarbinnen het werkelijke IQ met een bepaalde zekerheid ligt, omdat geen enkele test volledig foutloos meet.","Validiteit: de geldigheid van een test, dus of hij echt meet wat hij beweert te meten, met vormen zoals inhouds-, criterium- en predictieve validiteit.","G-factor en s-factoren (Spearman): de g-factor is de algemene intelligentie, de s-factoren zijn specifieke mentale vaardigheden zoals verbaal vermogen.","Vloeiende versus gekristalliseerde intelligentie (Cattell): vloeiend is abstract denken en nieuwe problemen oplossen, gekristalliseerd is opgebouwde kennis.","Flynn-effect: de vastgestelde stijging van het gemiddelde IQ met ongeveer 3 à 5 punten per decennium, onder meer door omgevingsfactoren.","Praktische intelligentie (Sternberg): het vermogen om problemen in een concrete situatie op te lossen, waarbij vaak meerdere oplossingen mogelijk zijn.","Meervoudige intelligenties (Gardner): de visie dat intelligentie bestaat uit meerdere domeinen zoals linguïstisch, muzikaal, ruimtelijk en interpersoonlijk.","Sociale en emotionele intelligentie: moeilijk meetbare vaardigheden om met sociale situaties en emoties om te gaan, met sterke overlap met praktische intelligentie."]}],"hacks":[{"h":"De stromingen op een rij: Struc-Func-Ges-Beha-Psycho","t":"Onthoud de vijf grote scholen met het zinnetje 'Structuur Functioneert, Gestalt Bekijkt, Psyche Verbergt'. Structuralisme zoekt de BOUWSTENEN, Functionalisme kijkt naar de FUNCTIE, Gestalt zegt het GEHEEL is meer dan de delen, Behaviorisme meet enkel het GEDRAG (black box), en Psychoanalyse graaft in het ONBEWUSTE. Zo koppel je elke naam meteen aan het juiste kernidee."},{"h":"Bekrachtiging verhoogt, Straf verlaagt (en +/- gaat over toevoegen of wegnemen)","t":"Onthoud dat het WOORD (Bekrachtiging of Straf) zegt wat er met het gedrag gebeurt: Bekrachtiging = gedrag stijgt, Straf = gedrag daalt. Het TEKEN (+ of -) zegt alleen of je iets toevoegt (+) of wegneemt (-), niet of het aangenaam of pijnlijk is. Zo weet je meteen: negatieve bekrachtiging = iets vervelends wegnemen zodat gedrag toeneemt (denk aan de zeurende gordelzoemer die stopt zodra je je gordel omdoet)."},{"h":"J-L, C-B, appraisal: de volgorde onthouden","t":"Denk aan de zin 'Lijf-Later, Beide-Bam, Brein-Boordeelt'. James-Lange: eerst het Lijf, Later de emotie. Cannon-Bard: Beide samen, Bam tegelijk vanuit de thalamus. Appraisal: het Brein Boordeelt eerst, dan pas arousal en emotie."},{"h":"OCEAN houdt de Big Five drijvend","t":"Onthoud de vijf trekken met het woord OCEAN: Openheid, Conscientieusheid, Extraversie, Aangenaamheid en Neuroticisme. Denk aan een oceaan, want net als bij een normaalverdeling zit de meeste massa in het midden en drijven de meeste mensen ergens tussen de twee uitersten in, niet aan de extremen."},{"h":"Marr in 3 stappen: Schets, Sorteer, Snap","t":"Onthoud de drie stadia van Marr met de 3 S'en. Schets = primaire schets (ruwe 2D lijnen en vlekken, zwart-wit). Sorteer = perceptuele organisatie (welke randen horen bij elkaar, 2,5D). Snap = patroon- en objectherkenning (je snapt wat het is, 3D voorwerpgericht). De dimensies lopen mooi op: 2D · 2,5D · 3D."},{"h":"VLAT: Vroeg = fysisch, Laat = inhoud","t":"Onthoud 'Vroeg Lekt Amper Toe'. Bij VROEGE selectie raakt bijna niets van de betekenis binnen, want de filter blokkeert al na de fysische kenmerken (stem, toon, intensiteit). Bij LATE selectie is de inhoud al meeverwerkt, dus daar lekt betekenis wel door (je hoort je naam). Kort: Vroeg = enkel fysisch, Laat = ook inhoud."},{"h":"BLED helpt je de vier slaapstadia onthouden","t":"Denk aan het woord 'BLED' voor de volgorde richting diepe slaap: Betagolven wanneer je wakker en alert bent, dan Losser met Alfagolven, dan de lichte slaap met slaapspoel en K-complex, en ten slotte de Diepe slaap met trage Deltagolven. Onthoud ook: hoe verder je zakt, hoe lager de frequentie en hoe hoger de amplitude, dus 'trager maar groter'. En de examenval: van de stadia wordt REM juist NIET door REM-slaap gekenmerkt, dus 4 stadia zonder REM."},{"h":"PIEP-ER voor primacy en recency","t":"Onthoud dat het Primacy-effect over de eerste woorden gaat (P van Primair, ook Prille begin) en het Recency-effect over de laatste (R van Recent, wat net gebeurd is). Ezelsbrug: 'Primacy = Prille start naar het LTG, Recency = Recent nog in het KTG.' Zo verwar je nooit meer welk effect bij welk uiteinde van de lijst hoort."},{"h":"Vloeiend loopt weg, kennis blijft plakken","t":"Denk aan water: Vloeiende intelligentie stroomt weg als je ouder wordt (snelheid en nieuw redeneren dalen). Gekristalliseerde intelligentie is als kristal dat blijft plakken en aangroeit, want je opgebouwde kennis verdwijnt niet. Zo weet je meteen welke van de twee afneemt met de leeftijd en welke op peil blijft."}]};
</script>

  function getProg(){ var p=lget("algpsy_prog",{ans:{}}); if(!p||typeof p!=="object"||!p.ans)p={ans:{}}; return p; }

  function resetProg(){ lset("algpsy_prog",{ans:{}}); }
  function chapterStats(){ var p=getProg(); var st={}; Object.keys(TOPICS).forEach(function(k){st[k]={total:0,done:0,correct:0};}); D.questions.forEach(function(q){ var s=st[q.t]; if(!s)return; s.total++; if(Object.prototype.hasOwnProperty.call(p.ans,q.id)){ s.done++; if(p.ans[q.id])s.correct++; } }); return st; }
  function startChapter(k){ var items=shuffle(D.questions.filter(function(q){return q.t===k;})); state.view="quiz"; tabBtns.forEach(function(b){b.classList.toggle("on",b.dataset.view==="quiz");}); startQuiz(items); window.scrollTo(0,0); }

  var TABS=[{v:"home",l:"Start",i:"book"},{v:"quiz",l:"Oefenvragen",i:"target"},{v:"theory",l:"Theorie",i:"search"},{v:"hacks",l:"Studie-hacks",i:"bulb"},{v:"feedback",l:"Feedback",i:"msg"}];

  tabsEl.innerHTML=TABS.map(function(t){return '<button data-view="'+t.v+'"'+(t.v==="home"?' class="on"':'')+'>'+ic(t.i)+'<span>'+t.l+'</span></button>';}).join("");
  var tabBtns=[].slice.call(tabsEl.querySelectorAll("button"));

  var state={view:"home", step:"track", track:lget("algpsy_track","training"), quiz:null, sel:{topics:{"1":true,"2":true,"3":true,"4":true,"5":true,"6":true,"7":true,"8":true,"9":true}, count:15, shuffle:true}, sumq:""};

  function renderHerkansing(){
