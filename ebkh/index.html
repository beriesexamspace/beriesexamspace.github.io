<script>
window.EB = {"questions":[{"t":"1","q":"Wat is volgens de omschrijving van De Bruyn (2003) het kenmerkende doel van diagnostiek als zoek- en beslissingsproces?","o":["De persoonlijke normen en waarden van de diagnosticus vastleggen in een verslag","Problemen onderkennen en analyseren om te komen tot advies dat gericht is op het oplossen ervan","Zoveel mogelijk testgegevens over de cliënt verzamelen om een volledig dossier te vormen","Nagaan of de cliënt aan de criteria van een zeldzame stoornis voldoet"],"a":1,"u":"Volgens De Bruyn zoekt de diagnosticus in dialoog met de cliënt naar verklaringen voor de problemen, met als doel advies dat gericht is op het oplossen van die problemen. Het proces vertrekt vanuit de hulpvraag."},{"t":"1","q":"Een diagnosticus houdt vast aan zijn eerste diagnose en stelt telkens dezelfde diagnose, ook wanneer nieuwe gegevens die tegenspreken. Welke oordeelsfout illustreert dit vooral?","o":["Excessive data collection","Illusory correlation","Belief perseverance","Search for the exotic"],"a":2,"u":"Belief perseverance is het vasthouden aan de juistheid van de eigen mening ondanks informatie die deze ontkracht of weerlegt. Het steeds herhalen van hetzelfde oordeel is daar een voorbeeld van."},{"t":"1","q":"Wat is het verschil tussen confirmation bias en het primacy effect zoals beschreven bij de oordeelsfouten?","o":["Confirmation bias zoekt vooral informatie die met de eigen visie strookt, terwijl het primacy effect het zwaarder laten wegen van eerst verkregen of levendige informatie betreft","Confirmation bias overschat de kwaliteit van het eigen oordeel, terwijl het primacy effect verbanden veronderstelt die niet bestaan","Confirmation bias betreft mondeling verkregen informatie, terwijl het primacy effect enkel op schriftelijke informatie slaat","Confirmation bias overschat zeldzame problemen, terwijl het primacy effect te veel irrelevante gegevens verzamelt"],"a":0,"u":"Bij confirmation bias wordt vooral informatie gezocht of onthouden die consistent is met de eigen visie. Bij het primacy effect weegt informatie die het eerst verkregen is, levendig is of emoties oproept zwaarder door in keuzeprocessen."},{"t":"1","q":"Een diagnosticus overschat systematisch hoe vaak een zeldzaam probleem voorkomt en gaat vooral op zoek naar het buitengewone. Welke oordeelsfout is hier aan de orde?","o":["Belief perseverance","Confirmation bias","Search for the exotic","Overconfidence in own capability"],"a":2,"u":"Search for the exotic is het zoeken naar het buitengewone, wat onder meer leidt tot de neiging om de prevalentie van weinig voorkomende problemen te overschatten."},{"t":"1","q":"Op welke wijze is diagnostiek volgens de tekst wetenschappelijker?","o":["Naarmate men sneller vasthoudt aan het eerste idee en de diagnose bevestigt","Naarmate men meer gegevens verzamelt, ook als die niet noodzakelijk relevant zijn","Naarmate persoonlijke normen en waarden een grotere rol krijgen bij ernstige problematiek","Naarmate men expliciet met theorieën werkt, denkstappen vastlegt en resultaten met collega's uitwisselt"],"a":3,"u":"Diagnostiek is wetenschappelijker naarmate men explicieter met theorieën werkt en theorieniveaus verbindt, de denkstappen naar het advies vastlegt en de resultaten van het eigen werk met collega's uitwisselt."},{"t":"1","q":"Welke rollen vervult de diagnosticus volgens de tekst, waardoor hij een praktijkwetenschapper wordt genoemd?","o":["Neutraal observator die zich niet met de cliënt inlaat","Vertegenwoordiger van de instelling, boekhouder en administrator","Enkel expert gedragswetenschapper die objectieve tests afneemt","Expert gedragswetenschapper, partner in dialoog met de cliënt en, indien nodig, verdediger van de belangen van het kind"],"a":3,"u":"De diagnosticus verricht meerdere rollen: expert gedragswetenschapper, partner in dialoog met de cliënt en indien nodig verdediger van de belangen van het kind. Die combinatie maakt hem tot praktijkwetenschapper."},{"t":"1","q":"Wat wordt bedoeld met excessive data collection als valkuil bij het diagnostisch handelen?","o":["Het veronderstellen van verbanden die in werkelijkheid niet bestaan","Het overschatten van de kwaliteit van het eigen oordeelsvermogen","Het verzamelen van veel informatie die niet noodzakelijk relevant is, bijvoorbeeld via overbodige testbatterijen","Het uitsluitend zoeken naar informatie die de eigen visie bevestigt"],"a":2,"u":"Excessive data collection houdt in dat er veel informatie wordt verzameld die niet noodzakelijk relevant is. In de tekst wordt dit gekoppeld aan het aanleggen van overbodige testbatterijen waarvan de gegevens niet benut worden."},{"t":"1","q":"Wat gebeurt er volgens de tekst met beslissingen naarmate de problematiek van de cliënt ernstiger wordt?","o":["De hulpvraag van de cliënt verdwijnt uit het beslissingsproces","De beslissingen worden rationeler en de invloed van persoonlijke normen neemt af","De beslissingen worden irrationeler en de invloed van persoonlijke normen en waarden neemt toe","De beslissingen worden volledig door formele regels overgenomen"],"a":2,"u":"De tekst stelt dat naarmate de problematiek ernstiger is, beslissingen irrationeler worden en de invloed van persoonlijke normen en waarden groter wordt."},{"t":"2","q":"Welke vier uitgangspunten vormen samen het theoretisch kader van handelingsgerichte diagnostiek?","o":["Diagnostiek, behandeling, evaluatie en nazorg als vaste fasen","Objectief, kwantitatief, normatief en gestandaardiseerd meten","Doelgericht, transactioneel, samenwerken en systematisch/transparant werken","Onderkennend, verklarend, indicerend en evaluerend werken"],"a":2,"u":"De uitgangspunten die het theoretisch kader vormen zijn: de werkwijze is doelgericht, het referentiekader is transactioneel, samenwerking is belangrijk, en de werkwijze en procedures zijn systematisch en transparant."},{"t":"2","q":"Wat wordt bedoeld met de stelling dat diagnostiek doelgericht is?","o":["Diagnostiek is een doel op zich, gericht op een zo volledig mogelijk beeld van de cliënt","Diagnostiek richt zich vooral op het verzamelen van zoveel mogelijk testgegevens","Diagnostiek is een middel om de vraag van de cliënt te beantwoorden, niet een doel op zich","Diagnostiek dient om de diagnosticus een wetenschappelijk oordeel te laten vormen"],"a":2,"u":"Diagnostiek is geen doel op zich, maar een middel om de vraag van de cliënt te beantwoorden. Er wordt informatie verzameld die bijdraagt aan advisering, zodat het advies bruikbaar is."},{"t":"2","q":"Volgens welk principe wordt informatie verzameld die bijdraagt tot advisering binnen doelgerichte diagnostiek?","o":["Het stimulus-responsprincipe","Het trial-and-errorprincipe","Het als-dan-principe","Het oorzaak-gevolgprincipe"],"a":2,"u":"Doelgerichte diagnostiek werkt volgens het als-dan-principe: informatie wordt verzameld die bijdraagt tot advisering, zodat het advies bruikbaar is."},{"t":"2","q":"Hoe worden problemen binnen het transactionele referentiekader opgevat?","o":["Als afstemmingsproblemen tussen het kind en zijn omgeving","Als aangeboren kenmerken die uitsluitend in het kind liggen","Als tijdelijke ontwikkelingsfasen die vanzelf overgaan","Als gevolg van uitsluitend fouten in de opvoeding door de ouders"],"a":0,"u":"In het transactionele referentiekader liggen problemen niet alleen in kenmerken van het kind; de omgeving bepaalt mede in hoeverre ontwikkelingsmogelijkheden tot stand komen. Problemen zijn dus afstemmingsproblemen tussen kind en omgeving."},{"t":"2","q":"Waarnaar verwijst de ecologische validiteit van diagnostiek binnen het transactionele uitgangspunt?","o":["Naar de kostenefficiëntie van de gekozen onderzoeksmethode","Naar het onderzoeken van het kind in de context, dus ook de opvoedings- en onderwijsleersituatie","Naar het gebruik van genormeerde en gestandaardiseerde testinstrumenten","Naar de mate waarin resultaten herhaalbaar zijn bij een tweede afname"],"a":1,"u":"Bij het transactionele uitgangspunt wordt niet alleen het kind onderzocht, maar ook de opvoedings- en onderwijsleersituatie. Dit onderzoek in de context wordt de ecologische validiteit van diagnostiek genoemd."},{"t":"2","q":"Welke houding past bij het uitgangspunt samenwerken in de diagnostiek?","o":["Zo weinig mogelijk uitleg geven om de resultaten niet te beïnvloeden","Praten met de cliënt en niet over de cliënt, met gedetailleerde uitleg over onderzoek","Enkel de diagnosticus laat het onderzoek uitvoeren zonder betrokkenheid van ouders","Ouders zoveel mogelijk buiten het onderzoeksproces houden"],"a":1,"u":"Samenwerken houdt in dat diagnosten samenwerken met leerling, school en ouders, dat men praat met de cliënt en niet over de cliënt, en dat gedetailleerd wordt uitgelegd wat, waarom en hoe men onderzoekt. Ouders worden als ervaringsdeskundigen beschouwd."},{"t":"2","q":"Waarom is bij samenwerken specifieke aandacht voor positieve aspecten nodig?","o":["Omdat ouders anders weigeren mee te werken aan het onderzoek","Omdat diagnostiek sterk op problemen is gericht waardoor positieve aspecten vaak worden vergeten","Omdat positieve aspecten wettelijk verplicht in elk verslag moeten staan","Omdat positieve aspecten de enige betrouwbare bron van informatie vormen"],"a":1,"u":"Diagnostiek is sterk gericht op problemen, waardoor positieve aspecten vaak worden vergeten. Aandacht hiervoor biedt tegengewicht voor het negatieve beeld en werkt competentieverhogend; soms is het versterken van positieve aspecten meer haalbaar dan het verminderen van negatieve."},{"t":"2","q":"Welke analyse hoort bij een indicerende vraag binnen het systematische procesmodel?","o":["De indicatieanalyse, die leidt tot aanbeveling","De verklaringsanalyse, die leidt tot verklaring","De klachtenanalyse, die leidt tot verheldering","De probleemanalyse, die leidt tot classificatie"],"a":0,"u":"Verschillende vragen zijn geassocieerd met verschillende analyses. De indicerende vraag hoort bij de indicatieanalyse, die uitmondt in een aanbeveling."},{"t":"3","q":"Welke vier doelen zijn bereikt aan het einde van de intakefase?","o":["Het integratief beeld is klaar, de doelen zijn SMARTI geformuleerd, de aanpak is gekozen en het handelingsplan is opgesteld","De onderzoeksvragen zijn beantwoord, de toetsingscriteria zijn vastgelegd, de gegevens verzameld en geinterpreteerd","De hypothesen zijn getoetst, de onderzoeksmiddelen gekozen, het advies opgesteld en geevalueerd","De context van de aanmelding is helder, de samenwerkingsrelatie is gestart, de diagnostische vraagstellingen zijn bekend en de werkafspraken zijn gemaakt"],"a":3,"u":"De intakefase eindigt wanneer de context van de aanmelding helder is, de samenwerkingsrelatie is gestart, de diagnostische vraagstellingen bekend zijn en de werkafspraken zijn gemaakt."},{"t":"3","q":"Wat is het belangrijkste doel van de strategiefase?","o":["Het beantwoorden van de onderzoeksvragen met geschikte tests","Het uitstippelen van het diagnostisch traject via een reflectie op de reeds verkregen informatie","Het bespreken van het advies met alle betrokken partijen","Het formuleren van een integratief beeld en concrete hulpverleningsdoelen"],"a":1,"u":"In de strategiefase wordt het diagnostisch traject uitgestippeld. Het is een reflectieve fase waarin de informatie uit de intake gewogen en beoordeeld wordt om te bepalen hoe verder te gaan."},{"t":"3","q":"In de strategiefase maakt men bij het clusteren van de informatie minstens drie clusters. Waarom minstens drie?","o":["Omdat elke onderzoeksvraag afzonderlijk in een cluster moet worden geplaatst","Omdat het proces transactioneel is en men dus niet enkel naar het kind maar ook naar school en opvoeding kijkt","Omdat er drie soorten hypothesen zijn: onderkennend, verklarend en indicerend","Omdat de DSM-5 drie hoofdcategorieen van stoornissen onderscheidt"],"a":1,"u":"Omdat het transactioneel is, kijkt men niet alleen naar het kind maar ook naar de omgeving. Daarom maakt men minstens drie clusters: kind, school en opvoeding."},{"t":"3","q":"Een diagnosticus wil de informatie dimensioneel clusteren in plaats van categoriaal. Welk instrument past het best bij deze dimensionele aanpak?","o":["De ICD-10","De DSM-5","De CBCL of Achenbach-vragenlijst","De criteria van Rutter"],"a":2,"u":"Een dimensionele clustering gebeurt bijvoorbeeld met de Achenbach- of CBCL-vragenlijst, terwijl de DSM-5 een voorbeeld is van categoriaal clusteren."},{"t":"3","q":"Waarvoor gebruikt men in de strategiefase de criteria van Rutter?","o":["Om de betrouwbaarheid en validiteit van een test te beoordelen","Om de haalbaarheid van een advies in te schatten","Om de ernst van het gerapporteerde probleem in te schatten","Om te bepalen wie aanwezig moet zijn bij het adviesgesprek"],"a":2,"u":"De criteria van Rutter, zoals leeftijdsadequaatheid, duur, frequentie, intensiteit en situatiegebondenheid, worden gebruikt om de ernst van het probleem in te schatten."},{"t":"3","q":"Welk van de criteria van Rutter wordt in de brontekst uitdrukkelijk als zeer belangrijk criterium aangeduid?","o":["De leeftijdsadequaatheid van de klachten","De situatiegebondenheid, dus of het gedrag in een of meer situaties voorkomt","De socioculturele setting van het gezin","Het type problemen en de mate van voorkomen in de populatie"],"a":1,"u":"De situatiegebondenheid, of het gedrag zich in een of meer situaties voordoet (bijvoorbeeld enkel op school of ook thuis), wordt in de bron als zeer belangrijk criterium aangeduid."},{"t":"3","q":"Uit welke drie componenten bestaat een diagnostische hypothese volgens de brontekst?","o":["Een onderzoeksvraag, een toetsingscriterium en een onderzoeksmiddel","Een of meer problemen, een of meer factoren die van invloed zijn en de aard van die invloed","Een beginsituatie, een einddoel en een tussendoel","Een aanmeldingsreden, een werkafspraak en een feedbackmoment"],"a":1,"u":"Een diagnostische hypothese omvat een of meer problemen, een of meer factoren die van invloed zijn en de aard van die invloed, namelijk veroorzakend, in stand houdend of versterkend."},{"t":"3","q":"Een diagnosticus stelt: 'De rekenproblemen van Piet zijn het gevolg van een lage intelligentie.' Om welk type hypothese gaat het?","o":["Een verklarende hypothese","Een indicerende hypothese","Een onderkennende hypothese","Een veranderingshypothese"],"a":0,"u":"Deze uitspraak legt een oorzakelijk verband tussen een probleem en een factor en is dus een verklarende hypothese, terwijl een onderkennende hypothese eerder beschrijvend is."},{"t":"3","q":"Wat houdt differentiaaldiagnostisch denken bij het opstellen van hypothesen in?","o":["Uitsluitend focussen op de risicofactoren en de beschermende factoren negeren","Het probleem altijd monocausaal en niet multicausaal verklaren","Enkel hypothesen opstellen die volledig los staan van wetenschappelijke inzichten","Steeds openstaan voor alternatieve verklaringen in plaats van meteen te besluiten dat symptoom A altijd wijst op stoornis B"],"a":3,"u":"Differentiaaldiagnostisch denken betekent openstaan voor alternatieve verklaringen. Sociale problemen wijzen niet automatisch op ASS, want er zijn kinderen met sociale problemen zonder ASS en omgekeerd."},{"t":"3","q":"Welke opeenvolging van stappen hoort bij de onderzoeksfase?","o":["Integratief beeld, doelen formuleren, aanpak kiezen en handelingsplan opstellen","Aanmelding, reden van aanmelding, voorgeschiedenis en werkafspraken","Wat weten we al, moeten we meer weten, wat moeten we nog weten en afronding","Operationaliseren van de begrippen, keuze van onderzoeksmiddelen, formuleren van toetsingscriteria, informeren, verzamelen en interpreteren van de gegevens"],"a":3,"u":"De onderzoeksfase verloopt via het operationaliseren van begrippen, de keuze van onderzoeksmiddelen, het formuleren van toetsingscriteria, het informeren van betrokkenen en het verzamelen en interpreteren van de gegevens."},{"t":"3","q":"Bij de keuze van de onderzoeksmiddelen let men op psychometrische criteria. Wat betekent het criterium validiteit?","o":["De mate waarin de test meet wat ze pretendeert te meten","De mate waarin een test hetzelfde resultaat geeft bij een test-hertest","De mate waarin het resultaat onafhankelijk is van de gebruiker","De verhouding tussen de kosten en de baten van de test"],"a":0,"u":"Validiteit verwijst naar de mate waarin een test meet wat ze pretendeert te meten. Betrouwbaarheid gaat over de test-hertest en objectiviteit over onafhankelijkheid van de gebruiker."},{"t":"3","q":"Wat wordt bedoeld met de SMARTI-eis dat een doel 'positief oplossingsgericht' moet zijn?","o":["Men kiest steeds voor de goedkoopste interventie","Men stelt een doel zo breed mogelijk zodat er ruimte is voor interpretatie","Men legt de nadruk uitsluitend op het laten verdwijnen van negatief gedrag","Men formuleert liever een doel als 'we willen goede interactie in de les' dan 'we willen minder agressie en storend gedrag'"],"a":3,"u":"Positief oplossingsgericht betekent dat men het gewenste positieve gedrag benadrukt, bijvoorbeeld 'goede interactie in de les', in plaats van te focussen op het laten verdwijnen van negatief gedrag."},{"t":"3","q":"In de indiceringsfase weegt de diagnosticus verschillende hulpverleningsmogelijkheden af met de zogenaamde 5 B's. Welke reeks geeft deze 5 B's correct weer?","o":["Betrouwbaarheid, bruikbaarheid, beschikbaarheid, bevestiging en beloop","Beginsituatie, betrokkenen, behoeften, beloop en besluit","Beschrijving, beoordeling, beslissing, begeleiding en bespreking","Beschikbaarheid, bereikbaarheid, bruikbaarheid, betaalbaarheid en begrijpbaarheid"],"a":3,"u":"De 5 B's zijn beschikbaarheid, bereikbaarheid, bruikbaarheid, betaalbaarheid en begrijpbaarheid. Hiermee weegt men hulpverleningsmogelijkheden tegen elkaar af."},{"t":"3","q":"Wat kenmerkt de transdiagnostische visie op psychopathologie?","o":["Elke stoornis wordt strikt categoriaal beschouwd als aanwezig of afwezig","Men verklaart elke stoornis vanuit exact een unieke onderliggende oorzaak","Men beperkt de diagnose tot de waarneembare symptoomclusters uit de DSM-5","Dezelfde onderliggende genetische, neurobiologische en psychologische mechanismen kunnen leiden tot verschillende stoornissen"],"a":3,"u":"De transdiagnostische visie gaat ervan uit dat dezelfde onderliggende genetische, neurobiologische en psychologische mechanismen tot verschillende stoornissen kunnen leiden en probeert zo het categoriale denken te overstijgen."},{"t":"4","q":"Wat is het uitgangspunt bij het kiezen van een diagnostisch instrument volgens de handelingsgerichte diagnostiek?","o":["Men neemt zoveel mogelijk tests af om niets over het hoofd te zien","Het beschikbare testmateriaal in de instelling bepaalt de vraagstelling","Het instrument met de meeste voldoendes in de COTAN-beoordeling wordt altijd gekozen","De onderzoeksvraag bepaalt het onderzoeksmiddel, en niet omgekeerd"],"a":3,"u":"De brontekst benadrukt dat de onderzoeksvraag het onderzoeksmiddel bepaalt en niet andersom; de context van de individuele client is bepalend voor de instrumentkeuze, niet het aantal voldoendes."},{"t":"4","q":"Handelingsgerichte diagnostiek onderscheidt drie typen diagnostische vraagstellingen. Welke rij benoemt ze correct?","o":["Onderkennend, verklarend en adviserend","Kwantitatief, kwalitatief en gemengd","Intakend, strategisch en evaluerend","Beschrijvend, normerend en toetsend"],"a":0,"u":"HGD kan worden toegepast op onderkennende (wat is er aan de hand), verklarende (waarom zijn de problemen er) en adviserende (welke ondersteuning is gewenst) vraagstellingen."},{"t":"4","q":"Een diagnosticus wil weten welke factoren van de client en zijn omgeving de problemen in stand houden. Om welk type vraagstelling gaat het?","o":["Normerende vraagstelling","Onderkennende vraagstelling","Adviserende vraagstelling","Verklarende vraagstelling"],"a":3,"u":"Bij een verklarende vraagstelling gaat men na waarom de problemen er zijn en welke factoren van de client en zijn sociale omgeving ze in stand houden."},{"t":"4","q":"Wat houdt het principe van relevantie in bij de keuze van een psychodiagnostisch instrument?","o":["Het instrument moet zo recent mogelijk zijn uitgegeven","De afnametijd van het instrument moet zo kort mogelijk zijn","Aannemelijk moet zijn dat het instrument bijdraagt aan het beantwoorden van de diagnostische vraagstelling","Het instrument moet in de eigen instelling beschikbaar en betaalbaar zijn"],"a":2,"u":"Relevantie verwijst naar een instrumentkeuze waarvan aannemelijk is dat ze zal bijdragen aan het beantwoorden van de diagnostische vraagstelling; het gebruik moet in relatie staan tot de toetsing van een hypothese."},{"t":"4","q":"Hoe verhouden betrouwbaarheid en validiteit zich volgens de brontekst tot elkaar?","o":["Validiteit is een voorwaarde voor betrouwbaarheid, niet omgekeerd","Betrouwbaarheid en validiteit staan volledig los van elkaar","Een betrouwbare test is per definitie ook valide, maar niet omgekeerd","Een valide test is per definitie ook betrouwbaar, maar een betrouwbare test hoeft niet valide te zijn"],"a":3,"u":"Een test kan alleen valide zijn als hij ook betrouwbaar is, maar het omgekeerde geldt niet: betrouwbaarheid garandeert geen validiteit."},{"t":"4","q":"Volgens de klassieke testtheorie geldt: testscore (X) = betrouwbare score (T) + E. Waar staat E voor?","o":["De normscore van de vergelijkingsgroep","De systematische afwijking door de beoordelaar","De effect size van de test","De toevallige meetfout"],"a":3,"u":"In de formule X = T + E staat E voor de meetfout; toevallige meetfouten zoals fysieke toestand, gokken of omgevingsgeluid verhogen of verlagen de geobserveerde score willekeurig ten opzichte van de true score."},{"t":"4","q":"Twee gelijkwaardige tests die beide extraversie meten worden afgenomen en hun scores worden gecorreleerd. Welke vorm van betrouwbaarheid wordt zo bepaald?","o":["Split-half betrouwbaarheid","Test-hertestbetrouwbaarheid","Interbeoordelaarsbetrouwbaarheid","Paralleltestbetrouwbaarheid"],"a":3,"u":"Paralleltestbetrouwbaarheid gebruikt twee gelijkwaardige tests die hetzelfde meten en berekent de correlatie tussen de scores op beide tests."},{"t":"4","q":"Een test voor extraversie en een test voor introversie leveren scores op die negatief met elkaar correleren. Welke validiteitsvorm wordt hiermee ondersteund?","o":["Divergente constructvaliditeit","Inhoudsvaliditeit","Predictieve validiteit","Convergente constructvaliditeit"],"a":0,"u":"Bij divergente constructvaliditeit meet de ene test een kenmerk en de andere het tegenovergestelde; de correlatie tussen beide resultaten hoort dan negatief te zijn."},{"t":"4","q":"De score op een IQ-test blijkt samen te hangen met latere schoolresultaten. Welk begrip beschrijft deze eigenschap het best?","o":["Inhoudsvaliditeit","Interne consistentie","Predictieve validiteit","Fairness"],"a":2,"u":"Predictieve validiteit gaat over de voorspellende waarde van testscores; het IQ-testvoorbeeld toont hoe testscores samenhangen met een latere maat zoals schoolresultaten."},{"t":"4","q":"Wat wordt in de brontekst bedoeld met de fairness van een diagnostisch instrument?","o":["De onpartijdigheid, of het instrument een zuiver beeld geeft ongeacht leeftijd, sekse, taal of cultuur","De mate waarin herhaalde metingen stabiele resultaten geven","De mate waarin de normgroep recent en Vlaams is","De verhouding tussen de baten en de kosten van de afname"],"a":0,"u":"Fairness verwijst naar de onpartijdigheid van een instrument: of het een zuiver beeld van de client geeft ongeacht diens leeftijd, sekse, taal of cultuur. De COTAN ontwikkelde hiervoor een fairnessmatrijs."},{"t":"4","q":"Welke organisatie vormt het klassieke Nederlandse beoordelingssysteem voor de psychometrische kwaliteit van tests?","o":["De COTAN","Het Kwaliteitscentrum voor Diagnostiek (KCD)","Het CAP-Basisvademecum","De Testcommissie van de BFP"],"a":0,"u":"De COTAN, de Commissie Testaangelegenheden Nederland, heeft een eigen Nederlands beoordelingssysteem en procedure voor tests; het CAP-vademecum en de BFP-Testcommissie zijn Vlaamse initiatieven."},{"t":"4","q":"Waarom is de SON-R 2-8 bijzonder geschikt voor kinderen met taal- of communicatieproblemen en voor anderstalige kinderen?","o":["Het is een oudervragenlijst zonder tastbaar materiaal","Het is een zelfrapportagevragenlijst voor adolescenten","Het meet uitsluitend aandacht en respons-inhibitie","Het is een niet-verbale intelligentietest"],"a":3,"u":"De SON-R 2-8 is een niet-verbale intelligentietest, waardoor ze geschikt is voor kinderen met problemen op het gebied van taal en communicatie en voor anderstalige kinderen voor wie Nederlandstalig materiaal minder geschikt is."},{"t":"5","q":"Wat betekent het woord \"best\" in de definitie \"Evidence-based practice is the integration of the best available research (...)\"?","o":["Dat er een hiërarchie in evidentie bestaat, waarbij men de sterkst beschikbare evidentie gebruikt maar soms met minder sterke moet werken","Dat alleen randomized clinical trials als evidentie tellen en al het andere onderzoek verworpen wordt","Dat de behandeling het meeste effect heeft bij de cliënt die het best geselecteerd is","Dat enkel het onderzoek met de grootste effectgrootte gebruikt mag worden"],"a":0,"u":"Het woord \"best\" wijst op een hiërarchie: bepaalde evidentie is sterker dan andere. Omdat sterkere evidentie niet altijd voorhanden is, spreekt men van \"best available research\" en moet men soms met minder sterke evidentie werken."},{"t":"5","q":"Volgens de definitie van evidence-based practice gaat het niet alleen over behandeling of begeleiding. Welke onderdelen horen er onder meer ook bij?","o":["Alleen het opstellen van wetenschappelijke publicaties","Uitsluitend het financieel beheer van de zorginstelling","Diagnostiek, indicatiestelling en het aangaan van een goede relatie met de cliënt","Enkel de keuze van medicatie en de dosering"],"a":2,"u":"EBPP wil de psychologische praktijk effectiever maken door empirisch onderbouwde principes toe te passen op assessment, case formulation, therapeutische relatie en interventie. Het gaat dus ook over diagnostiek, indicatiestelling en de relatie met de cliënt."},{"t":"5","q":"Wat is het typische kenmerk van een casestudy als vorm van evidentie?","o":["Effectgroottes van meerdere studies worden kwantitatief gemiddeld","Het is een narratieve beschrijving en kwalitatieve analyse van een casus zonder controle","Deelnemers worden at random over een experiment- en controlegroep verdeeld","Men vergelijkt met een wachtlijstconditie of placebogroep zonder randomisatie"],"a":1,"u":"Een casestudy is een narratieve beschrijving en kwalitatieve analyse van een casus, nuttig om uit te leggen hoe een vorm van begeleiding werkt. Het resultaat kan echter het gevolg zijn van een idiosyncratische reactie, gebiaste observatie of niet-gerelateerde gebeurtenissen."},{"t":"5","q":"Wat is het belangrijkste verschil tussen een gecontroleerde studie en een RCT?","o":["Bij een RCT worden deelnemers at random verdeeld over experiment- en controlegroep, bij een gecontroleerde studie gebeurt de toewijzing niet at random","Een RCT werkt zonder controlegroep, een gecontroleerde studie mét","Een gecontroleerde studie gebruikt altijd een placebogroep, een RCT nooit","Bij een gecontroleerde studie wordt enkel een nameting gedaan, bij een RCT enkel een voormeting"],"a":0,"u":"Een gecontroleerde studie vergelijkt met bijvoorbeeld een wachtlijst-, placebo- of CAU-groep, maar zonder aselecte toewijzing. Bij een RCT worden de deelnemers wel at random over de groepen verdeeld, of gematcht op belangrijke variabelen als randomisatie niet mogelijk is."},{"t":"5","q":"Waarom vervangt men bij een goede RCT de term \"uitval\" door \"intention-to-treat\"?","o":["Omdat uitvallers een heel ander resultaat kunnen geven, zodat men ook hen in de analyse moet betrekken in plaats van ze weg te laten","Omdat men de uitvallers uit de resultaten wil verwijderen om de effectgrootte te verhogen","Omdat uitvallers automatisch meegeteld worden als een succesvolle behandeling","Omdat men enkel deelnemers wil analyseren die zeer gemotiveerd zijn"],"a":0,"u":"Vroeger loste men uitval op door wegvallende respondenten uit de analyse te halen, maar dan kijkt men enkel naar wie de behandeling kan volhouden. Omdat uitvallers een ander resultaat kunnen geven, betrekt men hen wel via het \"intention-to-treat\"-principe."},{"t":"5","q":"Wat verwacht men bij multiple baseline onderzoek voordat men van evidentie mag spreken?","o":["Twee onafhankelijke meta-analyses","Eén enkele baseline met een groot effect","Minstens negen baselines die hetzelfde effect tonen","Een controlegroep van minstens dertig deelnemers"],"a":2,"u":"Bij multiple baseline onderzoek toont men effect doordat de verandering samenvalt met het startmoment van de therapie. Men verwacht eerst minstens negen baselines die hetzelfde effect tonen voordat men van evidentie spreekt."},{"t":"5","q":"Wat is het verschil tussen werkzaamheidsonderzoek (efficacy) en doeltreffendheidsonderzoek (effectiveness)?","o":["Efficacy onderzoekt het proces, effectiveness onderzoekt de uitkomst","Efficacy gebeurt door gewone therapeuten met normale caseload, effectiveness door streng getrainde therapeuten","Efficacy levert altijd kleinere effecten op dan effectiveness","Efficacy toont effect aan in strikte laboratoriumomstandigheden met streng geselecteerde cliënten, effectiveness onderzoekt de interventie in routineomstandigheden met gewone cliënten"],"a":3,"u":"Efficacy toont aan dat een interventie werkt onder strikte omstandigheden in een labo, met streng geselecteerde cliënten en getrainde therapeuten. Effectiveness onderzoekt diezelfde interventie flexibel in routineomstandigheden met gewone therapeuten en cliënten, en levert vaak kleinere effecten op."},{"t":"5","q":"Op welk niveau van de effectladder (Van Yperen) bevindt een interventie zich wanneer men een veranderingsonderzoek doet met normgerelateerde instrumenten en een normgroep als controle?","o":["Niveau 2 (theoretisch onderbouwen)","Niveau 4 (veranderingsonderzoek met normgroep)","Niveau 3 (veranderingsonderzoek zonder normgroep)","Niveau 5 (meer-experimentele designs)"],"a":1,"u":"Niveau 3 is een veranderingsonderzoek met voor- en/of nameting zonder normgroep. Op niveau 4 gebruikt men normgerelateerde instrumenten en een normgroep die als controlegroep fungeert. Niveau 5 omvat de meer-experimentele designs zoals RCTs en ESTs."},{"t":"5","q":"Wat is een van de Chambless-criteria (1998) waaraan een goed onderbouwde interventie (EST) moet voldoen?","o":["De interventie moet uitgevoerd zijn door minstens tien verschillende therapeuten in hetzelfde ziekenhuis","De effecten moeten aangetoond zijn door minstens twee verschillende onderzoekers of onderzoeksteams","De interventie mag niet in een handleiding beschreven zijn zodat therapeuten vrij kunnen werken","Er moet minstens één casestudy met positieve uitkomst beschikbaar zijn"],"a":1,"u":"Chambless vereist onder meer dat de effecten door minstens twee verschillende onderzoekers of teams zijn aangetoond. Dit criterium komt doordat een interventie effectief blijkt te blijven zolang de ontwerper aanwezig is, en de effectiviteit vaak zakt zodra die wegvalt."},{"t":"5","q":"Waarom is cliënttevredenheid volgens de tekst een betwiste effectparameter?","o":["Omdat de correlatie tussen tevredenheid en effect groot is (r > .70) en dus overbodig","Omdat de relatie tussen tevredenheid en effect klein is (r < .30) en tevredenheid sterker samenhangt met cliëntkenmerken dan met effectiviteit","Omdat tevredenheid alleen bij kinderen betrouwbaar gemeten kan worden","Omdat tevredenheid onmogelijk te bevragen is bij cliënten na afloop van de behandeling"],"a":1,"u":"De relatie tussen tevredenheid en effect is klein (r < .30), terwijl tevredenheid sterker samenhangt met cliëntkenmerken. Wie tevredenheid meet, meet dus eerder cliëntkenmerken dan de effectiviteit van de interventie, waardoor tevredenheid een betwiste parameter is."},{"t":"6","q":"Wat is de gemiddelde drop-outratio bij psychotherapie volgens de brontekst, en bij welke groepen komt uitval extra vaak voor?","o":["Ongeveer 10%, vooral bij hoogopgeleide cliënten met veel motivatie","Ongeveer 15%, vooral bij cliënten die zelf een hulpvraag stellen","Ongeveer 47%, vooral bij minderheidsgroepen, lager opgeleiden en lagere inkomens","Ongeveer 30%, vooral bij cliënten met een korte wachttijd"],"a":2,"u":"De brontekst noemt een gemiddelde drop-out van ongeveer 47%, die vooral groot is bij minderheidsgroepen, lager opgeleiden en lagere inkomens. De 10% verwijst naar cliënten die deterioreren, niet naar uitval."},{"t":"6","q":"Een therapeut wil bij kinderen met gedragsproblemen een groepstherapie opzetten. Waarom waarschuwt de leerstof hiervoor?","o":["Omdat het een harmful intervention kan zijn door contaminatie tussen de jongeren","Omdat groepstherapie enkel werkt bij volwassenen met angstklachten","Omdat groepstherapie voor kinderen altijd duurder is dan individuele therapie","Omdat kinderen in een groep geen therapeutische relatie kunnen opbouwen"],"a":0,"u":"Groepstherapie voor jongeren met gedragsproblemen wordt genoemd als voorbeeld van een schadelijke interventie, juist vanwege de contaminatie tussen de jongeren onderling. Harmful interventions kunnen cliënten doen achteruitgaan."},{"t":"6","q":"Volgens de verdeling van werkzame factoren in de brontekst: welk percentage van de werkzaamheid is toe te schrijven aan extra-therapeutische factoren zoals cliënt- en omgevingsfactoren?","o":["Veertig procent","Vijftien procent","Dertig procent","Zes procent"],"a":0,"u":"Volgens de brontekst is veertig procent van de werkzaamheid te wijten aan extra-therapeutische factoren, zoals cliëntfactoren (bijvoorbeeld intelligentie) en omgevingsfactoren (bijvoorbeeld huwelijksproblemen). Dertig procent komt van algemeen werkzame factoren en vijftien procent van het placeboeffect."},{"t":"6","q":"Wat is het verschil tussen algemeen werkzame factoren en specifiek werkzame ingrediënten?","o":["Algemeen werkzame factoren gelden enkel bij volwassenen, specifieke ingrediënten enkel bij kinderen","Algemeen werkzame factoren dragen bij ongeacht behandeling en doelgroep, specifieke ingrediënten gelden enkel voor bepaalde interventies, doelen en doelgroepen","Algemeen werkzame factoren zijn altijd effectiever dan specifieke ingrediënten","Specifiek werkzame ingrediënten dragen bij ongeacht de behandeling, algemene factoren enkel bij een bepaald protocol"],"a":1,"u":"Algemeen (non-specifiek) werkzame factoren dragen bij aan het resultaat ongeacht de soort behandeling en doelgroep. Specifiek werkzame ingrediënten gelden alleen voor bepaalde typen interventies, in de context van bepaalde doelen en voor bepaalde doelgroepen."},{"t":"6","q":"De leerstof stelt dat motivatie geen voorwaarde vooraf is om met een interventie te starten. Welke uitspraak sluit hierbij aan?","o":["Zonder voorafgaande motivatie draagt geen enkele interventie iets bij","Een cliënt moet volledig gemotiveerd zijn voordat de hulp kan beginnen","Motivatie en de wens tot verandering kunnen worden ontwikkeld en aangemoedigd tijdens de begeleiding","Motivatie is een vaste eigenschap die niet te veranderen is"],"a":2,"u":"De brontekst noemt het een denkfout dat een cliënt eerst gemotiveerd moet zijn voordat hulp kan starten. Motivatie is geen kwestie van wel of niet, maar kan worden ontwikkeld en aangemoedigd, bijvoorbeeld met motiverende technieken."},{"t":"6","q":"Wat wordt bedoeld met programma-integriteit als algemeen werkzame factor?","o":["Dat een interventie daadwerkelijk wordt uitgevoerd zoals bedoeld","Dat de therapeut voldoende salariëring en ondersteuning krijgt","Dat de cliënt eerlijk is over zijn klachten tijdens de begeleiding","Dat een behandeling nooit mag worden aangepast aan de cliënt"],"a":0,"u":"Programma-integriteit gaat over de vraag of een interventie wordt uitgevoerd zoals bedoeld. Zeggen dat men een methodiek gebruikt, betekent niet automatisch dat die ook correct wordt toegepast. De initiator speelt hierbij een cruciale rol."},{"t":"6","q":"Uit onderzoek dat de brontekst aanhaalt, blijkt dat maatwerk niet beter is dan gestandaardiseerde behandeling. Wat volgt hier volgens de richtlijnen uit?","o":["Men gebruikt beperkte flexibiliteit en bewaart de essentiële werkzame elementen van het protocol","Gestandaardiseerde behandelingen mogen enkel bij lichte problematiek worden ingezet","De therapeut moet steeds volledig afwijken van het protocol om de noden van de cliënt te volgen","Elke behandeling moet volledig op maat worden gemaakt om effectief te zijn"],"a":0,"u":"Omdat maatwerk niet beter blijkt dan gestandaardiseerde behandeling, luidt de richtlijn om beperkte flexibiliteit te gebruiken en de essentiële werkzame elementen te bewaren. Therapeuten neigen naar afwijken van het protocol, maar dat blijkt niet veel beter te werken."},{"t":"6","q":"Welke uitspraak over comorbiditeit sluit aan bij de richtlijnen voor het gebruik van evidence-based practices?","o":["Bij comorbiditeit is een eenvoudige werkwijze altijd minder effectief dan een complexe werkwijze","Comorbiditeit is een absoluut beletsel voor behandelsucces en vraagt altijd een complexe aanpak","Comorbiditeit maakt evidence-based practices per definitie ongeschikt voor de cliënt","Comorbiditeit hoeft geen probleem te zijn, want verbetering van de primaire klacht heeft vaak ook een positief effect op comorbide klachten"],"a":3,"u":"Volgens de richtlijnen hoeft comorbiditeit geen probleem te zijn. Een positieve evolutie van de primaire klacht heeft vaak ook een gunstig effect op comorbide klachten, en een eenvoudige concrete werkwijze is vaak effectiever dan een complexe."},{"t":"7","q":"Wat is de kern van de transdiagnostische visie op psychopathologie?","o":["Symptomen zijn binair, dus aanwezig of afwezig, en dat maakt classificatie eenvoudig","Dezelfde onderliggende genetische, neurobiologische en psychologische mechanismen kunnen tot verschillende stoornissen leiden","Elke stoornis heeft een uniek biologisch substraat dat losstaat van andere stoornissen","De DSM-checklist is de beste manier om comorbiditeit weg te werken"],"a":1,"u":"De transdiagnostische visie gaat ervan uit dat gedeelde onderliggende mechanismen, zoals gelijke copingstrategieën, cognitieve factoren en neurobiologische factoren, aan de basis liggen van uiteenlopende stoornissen."},{"t":"7","q":"Welke beperking van de DSM wordt geïllustreerd door het gegeven dat een majeure depressieve stoornis meer dan 16000 verschillende symptoomprofielen kan opleveren?","o":["Fenotypische plasticiteit in functie van tijd","Heterogeniteit binnen een diagnose","Sequentiële comorbiditeit","Het ontbreken van gevalideerde stoorniscategorieën"],"a":1,"u":"Omdat de DSM een checklist van symptomen is die men aanvinkt, ontstaan er zeer veel mogelijke combinaties. Twee mensen met dezelfde diagnose kunnen zo sterk verschillende profielen hebben, wat heterogeniteit binnen de diagnose wordt genoemd."},{"t":"7","q":"Wat is het verschil tussen parallelle en sequentiële comorbiditeit?","o":["Parallelle verwijst naar internaliserende problemen, sequentiële naar externaliserende problemen","Parallelle betekent dat een stoornis het risico op een andere verhoogt, sequentiële betekent meerdere stoornissen tegelijk","Beide begrippen slaan op het feit dat symptomen fluctueren binnen één stoornis","Parallelle betekent meerdere aandoeningen tegelijk, sequentiële betekent dat een aandoening het risico op een andere verhoogt"],"a":3,"u":"Bij parallelle comorbiditeit zijn meerdere aandoeningen gelijktijdig aanwezig. Bij sequentiële comorbiditeit vormt een aandoening een risico voor het ontwikkelen van een andere, bijvoorbeeld ADHD dat een risico is voor een gedragsstoornis."},{"t":"7","q":"Wat kenmerkt de Hierarchical Taxonomy of Psychopathology (HITOP)?","o":["Ze bepaalt scherp vanaf welk punt gedrag klinisch afwijkend is","Ze vervangt symptomen volledig door hersencircuits als analyse-eenheid","Ze is data-driven en dimensioneel, en probeert comorbiditeit te verklaren via hogere orde dimensies","Ze is theoriegedreven en werkt met een vaste set biologische markers"],"a":2,"u":"HITOP is een data-driven en dimensionele benadering die comorbiditeit probeert te verklaren met hogere orde dimensies. Een beperking is juist dat ze atheoretisch is en dat de grens met klinisch afwijkend gedrag onduidelijk blijft."},{"t":"7","q":"Waarop is het Research Domain Criteria (RDoC) model gebaseerd en hoe is het opgebouwd?","o":["Op een checklist van 541 diagnostische categorieën","Op een zuiver biomedisch model met enkel genetische constructen","Op de DSM-categorieën, aangevuld met T-scores per symptoom","Op een biopsychosociaal model, met een matrix van constructen en verschillende eenheden van analyse zoals genen, cellen, hersencircuits en gedrag"],"a":3,"u":"RDoC vertrekt van een biopsychosociaal model en gebruikt een onderzoeksmatrix met constructen als rijen en eenheden van analyse als kolommen, gaande van genen en moleculen tot hersencircuits, gedrag en zelfrapportage."},{"t":"7","q":"Welke vier transdiagnostische mechanismen beschreven Fairburn en collega's (2003) bij de behandeling van eetstoornissen?","o":["Klinisch perfectionisme, laag kernzelfbeeld, stemmingsintolerantie en interpersoonlijke moeilijkheden","Angst, neuroticisme, gedragsinhibitie en positief affect","Vermijding, ruminatie, sociale afwijzing en aandachtsstoornissen","Variatie, selectie, retentie en context"],"a":0,"u":"Fairburn en collega's benoemden klinisch perfectionisme, een laag kernzelfbeeld, stemmingsintolerantie en interpersoonlijke moeilijkheden als vier transdiagnostische mechanismen die klinische complexiteit en comorbiditeit helpen verklaren."},{"t":"7","q":"Welke twee kerntemperamentsfactoren met sterke genetische basis staan centraal in het model van Brown en Barlow?","o":["Primary control coping en secondary control coping","Angst/neuroticisme/gedragsinhibitie en extraversie/gedragsactivatie/positief affect","Alerting en orienting binnen het aandachtssysteem","Variatie en selectie"],"a":1,"u":"Het model van Brown en Barlow onderscheidt angst, neuroticisme en gedragsinhibitie (negatieve affectiviteit) enerzijds en extraversie, gedragsactivatie en positief affect anderzijds als twee kerntemperamentsfactoren. Depressie kenmerkt zich bijvoorbeeld door hoog op de eerste en laag op de tweede."},{"t":"7","q":"Wat is het verschil tussen universele en modulaire transdiagnostische interventies?","o":["Er is geen inhoudelijk verschil, enkel een verschil in naamgeving","Universele interventies gebruiken één set therapeutische technieken voor verschillende diagnoses, modulaire interventies zoeken een goodness-of-fit tussen modules en de klinische presentatie","Universele interventies passen behandelmodules aan per casus, modulaire interventies gebruiken één vaste set voor alle diagnoses","Universele interventies richten zich enkel op kinderen, modulaire enkel op volwassenen"],"a":1,"u":"Universele interventies volgen een one-size-fits-all benadering met een vaste set technieken voor meerdere diagnoses, zoals het Unified Protocol. Modulaire interventies zoeken juist een goodness-of-fit tussen welke modules passen bij de specifieke klinische presentatie van een casus."},{"t":"7","q":"Volgens de brontekst blijkt uit meta-analyses dat secundaire copingstrategieën zoals cognitieve herwaardering en acceptatie vooral werken als:","o":["een buffer tussen stress en externaliserende en internaliserende symptomen","een onmisbaar onderdeel van elke medicamenteuze behandeling","een vorm van vermijdingscoping die symptomen versterkt","de directe oorzaak van internaliserende symptomen"],"a":0,"u":"Studies tonen dat secundaire copingstrategieën, zoals cognitieve herwaardering en acceptatie, fungeren als buffer tussen stress en zowel externaliserende als internaliserende symptomen. Voor primaire en disengagement-strategieën is die bufferende werking minder duidelijk."},{"t":"7","q":"Waarom wordt ruminatie in de brontekst beschreven als een belangrijke transdiagnostische risicofactor?","o":["Omdat het een vorm van positieve bekrachtiging is die veerkracht opbouwt","Omdat het enkel depressie voorspelt en verder geen invloed heeft","Omdat het, als een vorm van cognitieve vermijding, meerdere internaliserende en externaliserende problemen voorspelt zoals depressie, angst, eetpathologie en zelfbeschadiging","Omdat het uitsluitend bij volwassenen voorkomt en niet bij jongeren"],"a":2,"u":"Ruminatie, door sommigen omschreven als cognitieve vermijding, voorspelt bij jongeren een brede waaier aan problemen, waaronder depressie, angst, eetpathologie, binge drinking en zelfbeschadigend gedrag. Daarom geldt het als transdiagnostische risicofactor."},{"t":"7","q":"Wat is volgens Hayes en Hofmann kenmerkend voor process-based CBT tegenover de protocol-voor-syndromen benadering?","o":["Ze koppelt elk protocol strikt aan één DSM-diagnose","Ze richt zich op theoretisch afgeleide en empirisch onderbouwde processen van verandering, waarbij problemen als een netwerk van verbonden subproblemen worden bekeken","Ze meet vooruitgang niet en werkt niet data-gedreven","Ze verwerpt oude CBT-technieken zoals exposure en zelfmonitoring volledig"],"a":1,"u":"Process-based CBT richt zich op empirisch onderbouwde veranderingsprocessen in plaats van op protocollen per syndroom, en ziet psychologische problemen zoals depressie als een netwerk van verbonden subproblemen zoals ruminatie, zelfkritiek en eenzaamheid."},{"t":"8","q":"Wat is het kernverschil tussen outcome monitoring en progress monitoring?","o":["Outcome monitoring gebruikt enkel niet-gevalideerde instrumenten, progress monitoring uitsluitend psychometrisch degelijke instrumenten","Outcome monitoring richt zich op de therapeutische relatie, progress monitoring op symptoomreductie","Outcome monitoring meet de effectiviteit minstens voor en na de behandeling, terwijl progress monitoring de vooruitgang regelmatig tijdens de therapie meet met terugkoppeling aan de therapeut","Outcome monitoring gebeurt uitsluitend door een externe observator, progress monitoring altijd door de cliënt zelf"],"a":2,"u":"Outcome monitoring evalueert de patiëntuitkomsten met psychometrisch degelijke instrumenten minstens pre- en posttreatment, terwijl progress monitoring de vooruitgang regelmatig (bijvoorbeeld wekelijks) meet met feedback aan de therapeut."},{"t":"8","q":"Waarin verschillen PROMs van PREMs?","o":["PROMs gaan over het zorgproces en de bejegening, PREMs meten de ervaren gezondheid","PROMs worden enkel na afloop gemeten, PREMs met herhaalde metingen","PROMs en PREMs meten beide uitsluitend de algemene tevredenheid via de Net Promotor Score","PROMs meten de ervaren gezondheid en kwaliteit van leven (vaak met herhaalde metingen), terwijl PREMs vooral over het zorgproces en de ervaring daarvan gaan en meestal alleen achteraf worden gemeten"],"a":3,"u":"PROMs (Patient Reported Outcome Measures) meten de ervaren gezondheid en kwaliteit van leven, vaak met herhaalde metingen, terwijl PREMs (Patient Reported Experience Measures) over het zorgproces en de ervaring gaan en meestal alleen na afloop worden afgenomen."},{"t":"8","q":"Een PROMIS-itembank combineert Item Response Theorie met Computer Adaptief Testen. Wat is hiervan het belangrijkste voordeel?","o":["Het meet uitsluitend lichamelijk functioneren en sluit psychische en sociale domeinen uit","De computer kiest na een startvraag telkens een volgende, moeilijkere of makkelijkere vraag op basis van het antwoord, waardoor men een heel specifiek beeld van iemands functioneren op een domein krijgt","De items worden willekeurig aangeboden zodat leereffecten worden vermeden","Elke patiënt krijgt exact dezelfde vaste vragenlijst voorgelegd, wat de onderlinge vergelijkbaarheid maximaliseert"],"a":1,"u":"Bij Computer Adaptief Testen selecteert de computer na een startvraag telkens de volgende, moeilijkere of makkelijkere vraag op basis van het antwoord, zodat men een veel specifieker en fijner beeld krijgt van iemands functioneren op een bepaald domein."},{"t":"8","q":"Wat houdt de CDOI-benadering (Client Direct Outcome Informed) in?","o":["Het afstemmen van de psychotherapie op elke cliënt door systematisch cliëntfeedback te verzamelen en te gebruiken om de behandeling bij te sturen","Het standaardiseren van behandelingen zodat elke cliënt exact hetzelfde protocol krijgt zonder afwijking","Het enkel na afloop van de volledige behandeling verzamelen van tevredenheidscijfers","Het uitsluitend baseren van de therapie op het klinisch oordeel van de therapeut zonder cliëntfeedback"],"a":0,"u":"CDOI stemt de behandeling af op elke cliënt op basis van systematisch verzamelde cliëntfeedback, waarbij onder meer de veranderingstheorie van de cliënt en psychometrisch degelijke metingen van proces en uitkomst worden gebruikt om de therapie bij te sturen."},{"t":"8","q":"Wat meten de Outcome Rating Scale (ORS) en de Session Rating Scale (SRS) binnen de CDOI-benadering?","o":["De ORS meet de door de cliënt waargenomen distress, terwijl de SRS een engagementschaal is die feedback ontlokt om de therapeutische relatie (alliance) te verbeteren","De ORS meet de kosten van de behandeling, terwijl de SRS de duur van de sessies registreert","Beide meten uitsluitend de symptoomernst zoals waargenomen door de therapeut","De ORS meet de therapeutische relatie, terwijl de SRS de distress van de cliënt meet"],"a":0,"u":"De ORS is een schaal die de door de cliënt waargenomen distress meet en feedback geeft over het therapieresultaat, terwijl de SRS een engagementschaal is die bedoeld is om feedback te ontlokken en zo de alliance oftewel therapeutische relatie te verbeteren."},{"t":"8","q":"Waarom volstaat statistische significantie niet en spreekt men in de klinische praktijk van klinische significantie?","o":["Omdat statistische significantie altijd een grotere verandering aantoont dan klinische significantie","Omdat klinische significantie beoordeelt of de verandering ook betekenisvol is, door de cliënt te positioneren ten opzichte van de verdelingen van een gezonde en een disfunctionerende normgroep","Omdat klinische significantie geen normgroepen nodig heeft en enkel de begin- en eindscore vergelijkt","Omdat klinische significantie enkel kijkt naar de betrouwbaarheid van het meetinstrument"],"a":1,"u":"Statistische significantie vertelt niet of een verandering ook betekenisvol is; klinische significantie vertrekt van de distributies (gemiddelde en standaarddeviatie) van een gezonde en een disfunctionerende groep en kijkt waar de cliënt voor en na de behandeling valt ten opzichte van die normgroepen."},{"t":"8","q":"Een cliënt met depressie scoort na behandeling 9 op de BDI-II. De gezonde groep heeft M = 6.2 en SD = 6.2. Volgens welk criterium is deze eindscore klinisch significant omdat hij binnen het bereik van de gezonde groep valt?","o":["De reliable change index, die enkel de begin- en eindmeting vergelijkt","Criterium C, dat uitsluitend gebaseerd is op de verdeling van de disfunctionerende groep","Criterium B, waarbij de eindscore lager is dan de cutoff van twee standaarddeviaties boven het gemiddelde van de gezonde groep (hier 18.6)","Criterium A, waarbij de cliënt niet langer binnen twee standaarddeviaties van het gemiddelde van de disfunctionerende groep valt"],"a":2,"u":"Bij criterium B valt de eindscore binnen het bereik van de gezonde groep: de cutoff is 6.2 + (2 x 6.2) = 18.6, en omdat 9 lager is dan 18.6 is de score volgens dit criterium klinisch significant."},{"t":"8","q":"Wat toont de reliable change index (RCI) aan dat klinische significantie alleen niet aantoont, en vanaf welke waarde spreekt men van een betrouwbare verandering?","o":["De RCI vervangt de normgroepen volledig en werkt zonder de standaardfout van het verschil","De RCI toont de kosteneffectiviteit van de behandeling aan, en men spreekt van betrouwbare verandering bij een waarde boven 0.5","De RCI houdt rekening met de onbetrouwbaarheid van het instrument en toont of de verandering tussen begin- en eindmeting echt is, met een grenswaarde boven 1.96","De RCI toont aan of het startpunt binnen de normale range viel, en men spreekt van betrouwbare verandering bij een waarde onder 1.96"],"a":2,"u":"De reliable change index vergelijkt de eind- en beginmeting en houdt rekening met de onbetrouwbaarheid van het instrument, zodat een verandering niet aan meetfluctuaties wordt toegeschreven; bij een RCI groter dan 1.96 spreekt men van een reliable change."}],"theory":[{"h":"Wetenschappelijke diagnostiek & oordeelsfouten","items":["Diagnostiek (De Bruyn): een zoek- en beslissingsproces waarin de diagnosticus problemen onderkent en analyseert in dialoog met de cliënt, op zoek naar verklaringen en advies.","Doel van diagnostiek: gericht informatie verzamelen met het oog op verantwoorde besluitvorming, vertrekkend vanuit de hulpvraag.","Praktijkwetenschapper: de diagnosticus als expert gedragswetenschapper, partner in dialoog en, waar nodig, verdediger van de belangen van het kind.","Belief perseverance: vasthouden aan de juistheid van de eigen mening ondanks informatie die deze ontkracht of weerlegt.","Confirmation bias: vooral informatie zoeken of onthouden die consistent is met de eigen visie.","Primacy effect: informatie die het eerst, levendig, emotioneel of mondeling verkregen is, weegt zwaarder door in keuzeprocessen.","Excessive data collection: veel informatie verzamelen die niet noodzakelijk relevant is, zoals bij overbodige testbatterijen.","Search for the exotic: zoeken naar het buitengewone, met de neiging de prevalentie van weinig voorkomende problemen te overschatten.","Illusory correlation: het veronderstellen van verbanden die in werkelijkheid niet bestaan.","Overconfidence in own capability: het overschatten van de kwaliteit van het eigen oordeelsvermogen.","Invloed van ernst: naarmate de problematiek ernstiger is, worden beslissingen irrationeler en wegen persoonlijke normen en waarden zwaarder door.","Empirische of regulatieve cyclus: hypothesen worden geformuleerd en getoetst, gebaseerd op wetenschappelijke theorieën (deductie) en op informatie over de cliënt (inductie).","Bedreigingen voor diagnostiek: geen systematische werkwijze, impliciete of ongetoetste hypothesen, niet-geëxpliciteerde beslissingscriteria en onbruikbare adviezen.","Wetenschappelijker werken: expliciet met theorieën werken, denkstappen vastleggen, theoriekeuzes verantwoorden en resultaten met collega's uitwisselen."]},{"h":"Uitgangspunten van handelingsgerichte diagnostiek","items":["Uitgangspunten: het theoretisch kader bestaande uit doelgericht, transactioneel, samenwerken en systematisch/transparant werken.","Doelgericht: diagnostiek is geen doel op zich maar een middel om de vraag van de cliënt te beantwoorden.","Als-dan-principe: informatie wordt verzameld die bijdraagt tot advisering, zodat een bruikbaar advies ontstaat.","Bruikbaar advies: een goed advies is gericht op wenselijke oplossingen en op veranderbare kenmerken.","Transactioneel referentiekader: de omgeving bepaalt mede in hoeverre ontwikkelingsmogelijkheden tot stand komen.","Afstemmingsproblemen: problemen zitten niet enkel in het kind maar in de afstemming tussen kind en omgeving.","Onderwijs- en opvoedingsbehoeften: deze staan centraal, en ook leraren en ouders met hun ondersteuningsbehoeften doen ertoe.","Ecologische validiteit: onderzoek gebeurt in de context, dus ook de opvoedings- en onderwijsleersituatie wordt onderzocht.","Risico- en protectieve factoren: advies is gericht op betere afstemming, wegnemen van risicofactoren en vergroten van protectieve factoren.","Samenwerken: diagnosten werken samen met leerling, school en ouders in intake-, onderzoeks- en adviesfase.","Praten met en niet over de cliënt: ouders worden als ervaringsdeskundigen beschouwd en krijgen uitleg over wat, waarom en hoe.","Positieve aspecten: nodig als tegengewicht voor het negatieve beeld en competentieverhogend, soms meer haalbaar dan problemen verminderen.","Systematisch werken: volgens een prescriptief procesmodel met verschillende fasen, gebaseerd op de empirische cyclus en methodologische regels.","Analyses en vragen: klachtenanalyse geeft verheldering, probleemanalyse geeft classificatie, verklaringsanalyse geeft verklaring, indicatieanalyse geeft een aanbeveling."]},{"h":"De vijf fasen van handelingsgerichte diagnostiek","items":["Intakefase: startfase waarin de context van de aanmelding wordt verhelderd, de samenwerkingsrelatie start, de diagnostische vraagstelling wordt bepaald en werkafspraken worden gemaakt.","Strategiefase: reflectieve fase waarin de reeds verzamelde informatie wordt gewogen en het diagnostisch traject wordt uitgestippeld via als-dan-redeneringen.","Transactioneel proces: uitgangspunt dat men niet enkel naar het kind kijkt maar ook naar school en opvoeding, met aandacht voor risico- en beschermende factoren.","Categoriaal versus dimensioneel clusteren: categoriaal denkt in aanwezig of afwezig zoals de DSM-5, dimensioneel in gradaties zoals de CBCL- of Achenbach-vragenlijst.","Criteria van Rutter: reeks criteria om de ernst van een probleem in te schatten, zoals leeftijdsadequaatheid, duur, frequentie, intensiteit en de zeer belangrijke situatiegebondenheid.","Diagnostische hypothese: wetenschappelijk gefundeerde bewering met een of meer problemen, een of meer beinvloedende factoren en de aard van de invloed (veroorzakend, in stand houdend of versterkend).","Onderkennende hypothese: beschrijvende hypothese, bijvoorbeeld dat er sprake is van een depressieve stoornis, zonder de oorzaak te benoemen.","Verklarende hypothese: hypothese die een oorzakelijk verband legt, bijvoorbeeld dat rekenproblemen het gevolg zijn van een lage intelligentie.","Differentiaaldiagnostisch denken: steeds openstaan voor alternatieve verklaringen, omdat eenzelfde symptoom niet automatisch op eenzelfde stoornis wijst.","Onderzoeksfase: fase die de onderzoeksvragen beantwoordt via operationaliseren, keuze van onderzoeksmiddelen, toetsingscriteria, informeren, verzamelen en interpreteren.","Psychometrische criteria: kwaliteitskenmerken van een onderzoeksmiddel, namelijk objectiviteit, betrouwbaarheid, validiteit en normen.","SMARTI-doelen: doelen die specifiek, meetbaar, aanvaardbaar, realistisch, tijdsgebonden, inspirerend en positief oplossingsgericht zijn.","De 5 B's: afwegingskader in de indiceringsfase met beschikbaarheid, bereikbaarheid, bruikbaarheid, betaalbaarheid en begrijpbaarheid.","Transdiagnostische visie: opvatting dat dezelfde onderliggende mechanismen tot verschillende stoornissen kunnen leiden, als antwoord op de beperkingen van categoriale systemen als DSM-5 en ICD-10."]},{"h":"Diagnostische instrumenten","items":["Handelingsgerichte diagnostiek (HGD): doelgericht, flexibel en op maat onderzoek dat via intake, strategie, onderzoek, advies en evaluatie naar een oplossing voor de hulpvraag toewerkt.","Drie vraagstellingen: onderkennend (wat is er aan de hand), verklarend (waarom en welke instandhoudende factoren) en adviserend (welke begeleiding of behandeling is gewenst).","Kennen, kiezen en gebruiken: de drie fasen waarin je bepaalt welke info je nodig hebt, welk testmateriaal je kiest en hoe je het onderzoek plant en uitvoert.","Relevantie: het instrument is pas gepast als aannemelijk is dat het bijdraagt aan het toetsen van de hypothese en het beantwoorden van de onderzoeksvraag.","Betrouwbaarheid: de mate waarin geobserveerde scores consistent zijn met true scores, uitgedrukt in een correlatiecoefficient (testscore X = ware score T + meetfout E).","Betrouwbaarheidsvormen: interbeoordelaars-, test-hertest-, paralleltest- en interne consistentie (split-half, Cronbachs alfa, Kuder-Richardson 20).","Validiteit: meet een test wat hij beoogt te meten; een test kan alleen valide zijn als hij ook betrouwbaar is, maar het omgekeerde geldt niet.","Validiteitsvormen: inhouds-, begrips- of constructvaliditeit (convergent en divergent), criteriumvaliditeit en predictieve validiteit.","Normen: de gegevens waarmee je scores vergelijkt; ze moeten recent, representatief en groot genoeg zijn voor de beoogde doelgroep.","Fairness: de onpartijdigheid van een instrument, of het een zuiver beeld geeft ongeacht leeftijd, sekse, taal of cultuur; recent toegevoegd naast betrouwbaarheid en validiteit.","COTAN: Nederlandse commissie die tests beoordeelt op testconstructie, testmateriaal, handleiding, normen, betrouwbaarheid en validiteit.","CAP-Basisvademecum en BFP-Testcommissie: Vlaamse instanties die de kwaliteit van tests en testgebruik beoordelen en bevorderen.","Rechten van de geteste: recht op een valide, betrouwbare en fair test, op informatie vooraf, op informed consent, op confidentialiteit en op feedback achteraf.","Standaardisatie en objectiviteit: minimale variatie in afname en het beperken van storende invloeden van de beoordelaar zorgen voor betrouwbare, vergelijkbare resultaten."]},{"h":"Evidence based practice: hiërarchie van evidentie","items":["Evidence-based practice: het integreren van de best beschikbare research met klinische expertise, rekening houdend met kenmerken, cultuur en voorkeuren van de cliënt.","Best available research: het \"best\" wijst op een hiërarchie, waarbij men de sterkste evidentie gebruikt maar soms met minder sterke moet werken.","Casestudy: narratieve, kwalitatieve beschrijving van één casus, kwetsbaar voor idiosyncratische reacties, bias en niet-gerelateerde gebeurtenissen.","Veranderingsonderzoek: onderzoek zonder controlegroep, meestal met een voor- en nameting, dat toont dat het effect niet louter een idiosyncratische reactie is.","Gecontroleerde studie: vergelijking met een wachtlijst-, placebo-, CAU- of andere therapiegroep, maar zonder aselecte toewijzing.","RCT (randomized clinical trial): deelnemers worden at random verdeeld over experiment- en controlegroep, of gematcht als randomisatie niet kan.","Intention-to-treat: uitvallers worden mee opgenomen in de analyse omdat ze een ander resultaat kunnen geven, in plaats van hen weg te laten.","Multiple baseline onderzoek: N=1-achtig design dat effect toont via verandering bij de start van therapie, met minstens negen baselines nodig voor evidentie.","Meta-analyse: kwantitatieve manier om resultaten van verschillende studies samen te brengen door effectgroottes te berekenen en te middelen.","Effectgrootte (Cohen's d): maat voor de omvang van het effect, berekend als het verschil tussen metingen gedeeld door de pooled standaarddeviatie.","Effectladder (Van Yperen): ordening van niveau 1 (weten wat je doet) tot 5 (meer-experimentele designs zoals RCTs en ESTs), waarbij elk niveau het vorige impliceert.","EST (empirically supported treatment): interventie die voldoet aan de strenge Chambless-criteria en een deelverzameling vormt van evidence-based practice.","Efficacy versus effectiveness: efficacy toont werking in strikte labo-omstandigheden, effectiveness toont werking in routineomstandigheden met gewone cliënten.","Effectparameters: uitval, probleemreductie, doelrealisatie, cliënttevredenheid en kwaliteit van leven, waarbij cliënttevredenheid betwist is omdat ze weinig samenhangt met effect."]},{"h":"Effectiviteit van psychotherapie & EBP","items":["Evidence-based practice (EBP): behandeling waarvan de effectiviteit onderzocht is, blijkt effectiever dan care-as-usual, ook bij echte cliënten (d = .29).","Care-as-usual (CAU): de gebruikelijke, niet specifiek onderzochte behandeling met een zeer kleine effectgrootte, waarbij cliënten soms achteruitgaan.","Harmful interventions: schadelijke interventies zoals bootcamps, scarestraight, critical incident stress debriefing en rouwbegeleiding bij normale rouw, die cliënten kunnen doen deterioreren.","Deterioratie: het verschijnsel dat ongeveer 10% van de cliënten achteruitgaat tijdens of door de behandeling.","Drop-out: voortijdige uitval, gemiddeld ongeveer 47%, en groter bij minderheidsgroepen, lager opgeleiden, lagere inkomens en langere wachttijden.","Algemeen werkzame factoren: non-specifieke onderdelen die bijdragen aan het resultaat ongeacht behandeling en doelgroep, zoals de therapeutische relatie en motivatie.","Specifiek werkzame ingrediënten: werkzame factoren die enkel gelden voor bepaalde interventies, doelen en doelgroepen.","Verdeling werkzaamheid: 40% extra-therapeutische factoren, 30% algemeen werkzame factoren, 15% placeboeffect en ongeveer 15% de gebruikte methode (effectgrootte 0.06).","Placeboeffect: het deel van de werkzaamheid (ongeveer 15%) dat verklaard wordt door hoop en verwachting van de cliënt.","Programma-integriteit: de mate waarin een interventie daadwerkelijk wordt uitgevoerd zoals bedoeld, waarbij de initiator een cruciale rol speelt.","Therapeutische relatie: kwaliteit van de band tussen cliënt en hulpverlener, met kenmerken als warmte, respect, betrouwbaarheid en openheid, en activiteiten als exploreren en reflecteren.","Beperkte flexibiliteit: het bewaren van de essentiële werkzame elementen van een protocol, omdat maatwerk niet beter blijkt dan gestandaardiseerde behandeling.","Comorbiditeit: het samen voorkomen van meerdere klachten, wat geen beletsel is voor behandelsucces omdat verbetering van de primaire klacht ook comorbide klachten kan verbeteren.","Voordeel van protocollen: ze zijn overdraagbaar en aanleerbaar, bevorderen communicatie, hebben een eigenstandig effect (40 tot 60%) en werken sterker naarmate de problematiek ernstiger is."]},{"h":"Transdiagnostische interventies","items":["DSM: beschrijvend classificatiesysteem in de vorm van een symptoomchecklist, met voordelen zoals communicatie en herkenning, maar beperkingen zoals heterogeniteit en comorbiditeit.","Heterogeniteit binnen diagnose: doordat men symptomen aanvinkt ontstaan zeer veel verschillende symptoomprofielen, waardoor mensen met dezelfde diagnose sterk kunnen verschillen.","Parallelle comorbiditeit: het gelijktijdig aanwezig zijn van meerdere aandoeningen bij dezelfde persoon.","Sequentiële comorbiditeit: een aandoening die het risico verhoogt op het later ontwikkelen van een andere aandoening, zoals ADHD dat risico geeft op een gedragsstoornis.","Transdiagnostische visie: het idee dat gedeelde genetische, neurobiologische en psychologische mechanismen tot verschillende stoornissen kunnen leiden.","HITOP: een data-driven, dimensionele taxonomie die comorbiditeit probeert te verklaren via hogere orde dimensies, maar atheoretisch is.","RDoC: een op het biopsychosociaal model gebaseerde onderzoeksmatrix met constructen en eenheden van analyse zoals genen, cellen, hersencircuits en gedrag.","Unified Protocol (Barlow): een invloedrijke universele transdiagnostische interventie voor emotionele stoornissen.","Model van Brown en Barlow: twee kerntemperamentsfactoren, namelijk negatieve affectiviteit (angst en gedragsinhibitie) en positief affect (extraversie en gedragsactivatie), plus vermijdingsgedrag.","Universele interventies: een one-size-fits-all set therapeutische technieken die op verschillende diagnoses toepasbaar is.","Modulaire interventies: interventies die per casus zoeken naar een goodness-of-fit tussen behandelmodules en de klinische presentatie.","Transdiagnostische processen: onderliggende processen zoals coping, aandachtsdisfunctie, vermijding, ruminatie en sociale relaties die bijdragen aan het ontstaan van problemen.","Third wave CBT: derde generatie gedragstherapie, zoals DBT, MBCT, ACT en MCT, met focus op context en functie van symptomen in plaats van louter inhoud.","Process-based CBT (Hayes en Hofmann): een multidimensionele, netwerkgebaseerde en data-gedreven benadering die inwerkt op empirisch onderbouwde veranderingsprocessen via variatie, selectie, retentie en context."]},{"h":"Monitoring & uitkomstmeting","items":["Outcome monitoring: evaluatie van patiëntuitkomsten met psychometrisch degelijke instrumenten, minstens voor en na de behandeling.","Progress monitoring: regelmatige meting van de vooruitgang tijdens de therapie met terugkoppeling aan de therapeut ten opzichte van normen en eerdere metingen.","PROMs: Patient Reported Outcome Measures die de ervaren gezondheid en kwaliteit van leven meten, vaak met herhaalde metingen.","PREMs: Patient Reported Experience Measures die vooral het zorgproces en de ervaring daarvan meten, meestal alleen na afloop.","PROM-cyclus: onderdeel van de PROM-toolbox over de selectie en toepassing van PROMs, met stappen als doel bepalen, selecteren, testen en gebruiken.","PROMIS: een door het NIH ontwikkeld meetsysteem dat outcome measures definieert op lichamelijk, psychisch en sociaal terrein.","Itembank: een grote set vragen die hetzelfde construct meten en met Item Response Theorie op moeilijkheid worden geordend.","Computer Adaptief Testen: methode waarbij de computer op basis van het vorige antwoord telkens een passender vraag kiest voor een specifieker beeld.","CDOI (Client Direct Outcome Informed): benadering die de therapie afstemt op elke cliënt via systematisch verzamelde cliëntfeedback.","ORS (Outcome Rating Scale): schaal die de door de cliënt waargenomen distress meet en feedback geeft over het therapieresultaat.","SRS (Session Rating Scale): engagementschaal die feedback ontlokt om de therapeutische relatie of alliance te verbeteren.","Klinische significantie: beoordeling of een verandering betekenisvol is door de cliënt te positioneren ten opzichte van een gezonde en een disfunctionerende normgroep.","Criteria A, B en C: drie manieren om klinische significantie te bepalen, respectievelijk buiten de disfunctionerende groep, binnen de gezonde groep, of dichter bij het gemiddelde van de gezonde dan de disfunctionerende groep.","Reliable change index (RCI): index die de betrouwbaarheid van de verandering toetst; bij een waarde boven 1.96 is de verandering niet toe te schrijven aan meetonbetrouwbaarheid."]}],"hacks":[{"h":"PECSIO voor de oordeelsfouten","t":"Onthoud de zes oordeelsfouten met PECSIO: Primacy effect, Excessive data collection, Confirmation bias, Search for the exotic, Illusory correlation en Overconfidence (plus Belief perseverance als de koppige 'ik blijf erbij'). Zo overloop je systematisch de valkuilen bij het diagnostisch oordelen."},{"h":"DTSS voor de vier uitgangspunten","t":"Onthoud DTSS: Doelgericht, Transactioneel, Samenwerken en Systematisch/transparant. Deze vier letters dekken samen het volledige theoretisch kader van handelingsgerichte diagnostiek."},{"h":"ISOIA voor de vijf fasen","t":"Onthoud de vijf fasen met 'Iedereen Start Onderzoek In Actie': Intake, Strategie, Onderzoek, Indicering en Advies. Zo weet je meteen de juiste volgorde van eerst verhelderen, dan plannen, dan onderzoeken, dan integreren en ten slotte adviseren."},{"h":"OVA voor de drie vraagstellingen","t":"Onthoud OVA: Onderkennend (wat is het), Verklarend (waarom is het er) en Adviserend (wat doen we eraan). Zo dek je de volgorde van HGD-vraagstellingen af in een woord."},{"h":"De effectladder: \"Weten, Waarom, Wijzigen, Wijzen naar de norm, Wetenschappelijk experiment\"","t":"Onthoud de vijf treden van de effectladder met vijf W's: 1 Weten wat je doet, 2 Waarom (theoretische onderbouwing), 3 Wijzigen aantonen (veranderingsonderzoek), 4 Wijzen naar de norm (met normgroep) en 5 Wetenschappelijk experiment (RCTs en ESTs). Elke trede veronderstelt dat de vorige al in orde is."},{"h":"40-30-15-15 voor de werkzaamheid","t":"Onthoud de verdeling van wat therapie doet werken als 40-30-15-15: 40% extra-therapeutische factoren (cliënt en omgeving), 30% algemeen werkzame factoren (relatie, motivatie), 15% placebo en 15% de eigenlijke methode. De grootste hap zit dus buiten de gekozen techniek."},{"h":"VSRC voor process-based therapie","t":"Onthoud VSRC: Variatie, Selectie, Retentie en Context. Eerst brengt de therapeut variatie in vastgeroeste patronen, dan selecteert men wat werkt voor de cliënt, vervolgens bestendigt men die verandering (retentie) en steeds houdt men rekening met de context, want gedrag dat adaptief is in de ene situatie kan maladaptief zijn in de andere."},{"h":"ABC van klinische significantie","t":"Onthoud de drie criteria met A-B-C: A staat voor Af van de disfunctionerende groep (buiten twee SD van de zieke groep), B voor Binnen de gezonde groep (onder de cutoff van de gezonde verdeling), en C voor Combinatie (het snijpunt van beide verdelingen)."}]};
</script>
