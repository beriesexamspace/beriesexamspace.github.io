<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<style>
  :root{
    --bg:#f4f2ee; --bg2:#ebe8e2; --card:#ffffff; --ink:#1b232c; --muted:#5d6873;
    --line:#e2ddd4; --accent:#0f6e6a; --accent-ink:#0b4f4c; --accent-soft:#dcefed;
    --amber:#c9821f; --amber-soft:#f7ecd9; --violet:#6d5bd0; --violet-soft:#e9e6fa;
    --good:#1f8a4c; --good-soft:#e2f3e8; --bad:#c23b54; --bad-soft:#fbe5ea;
    --shadow:0 1px 2px rgba(20,30,40,.05),0 6px 18px rgba(20,30,40,.05);
    --shadow-lg:0 2px 6px rgba(20,30,40,.06),0 18px 40px rgba(20,30,40,.10);
    --r:14px; --r-lg:20px; --ease:cubic-bezier(.2,.8,.2,1);
  }
  html[data-theme="dark"]{
    --bg:#11151a; --bg2:#161b22; --card:#1b222b; --ink:#e7ecf1; --muted:#9aa6b2;
    --line:#2a323c; --accent:#3fb9b2; --accent-ink:#7fd6d0; --accent-soft:#163230;
    --amber:#e0a64a; --amber-soft:#2e2515; --violet:#a99cf0; --violet-soft:#221d3a;
    --good:#46c178; --good-soft:#16301f; --bad:#ef6b82; --bad-soft:#331620;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 2px 8px rgba(0,0,0,.4),0 22px 48px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;letter-spacing:-.01em}
  button,a{font-family:inherit;cursor:pointer;color:inherit}
  .wrap{max-width:880px;margin:0 auto;padding:0 18px 96px}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
  .ic{width:1.25em;height:1.25em;flex:none;vertical-align:-.18em;stroke:currentColor;stroke-width:1.75;
    stroke-linecap:round;stroke-linejoin:round;fill:none}

  header.top{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(160%) blur(16px);-webkit-backdrop-filter:saturate(160%) blur(16px);box-shadow:inset 0 -1px 0 0 rgba(0,0,0,.04)}
  .topin{max-width:880px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:700}
  .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,var(--accent),var(--accent-ink));
    color:#fff;display:grid;place-items:center;font-family:Georgia,serif;font-weight:700;font-size:16px;flex:none;
    box-shadow:0 2px 6px rgba(15,110,106,.35)}
  .brand small{display:block;font-weight:500;color:var(--muted);font-size:11px}
  .spacer{flex:1}
  .iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:38px;
    padding:7px 11px;font-size:13.5px;display:inline-flex;gap:7px;align-items:center;text-decoration:none;
    transition:border-color .2s var(--ease),transform .12s var(--ease)}
  .iconbtn:hover{border-color:var(--accent)} .iconbtn:active{transform:scale(.96)}
  nav.tabs{display:flex;gap:2px;overflow:auto;max-width:880px;margin:0 auto;padding:6px 12px 0;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{border:none;background:none;color:var(--muted);padding:10px 13px;border-radius:9px 9px 0 0;
    font-size:14px;font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px;transition:color .2s var(--ease)}
  nav.tabs button .ic{width:16px;height:16px}
  nav.tabs button.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
  nav.tabs button:hover{color:var(--ink)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:20px}
  .muted{color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
  .pill.amber{background:var(--amber-soft);color:var(--amber)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;gap:14px}
  @media(min-width:620px){.g2{grid-template-columns:1fr 1fr}}

  .hero{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin:20px 0 8px}
  .count{flex:none;background:linear-gradient(150deg,var(--accent),var(--accent-ink));color:#fff;border-radius:var(--r);padding:14px 20px;text-align:center;min-width:118px;box-shadow:0 8px 20px rgba(15,110,106,.28)}
  .count b{font-family:Georgia,serif;font-size:32px;display:block;line-height:1}
  .count span{font-size:12px;opacity:.92}
  .herotext h1{margin:0 0 4px;font-size:25px}
  .herotext p{margin:0;color:var(--muted)}

  .brandstrip{display:flex;align-items:center;gap:13px;width:100%;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 16px;margin:14px 0 2px;box-shadow:var(--shadow);transition:border-color .2s var(--ease),transform .15s var(--ease)}
  .brandstrip:hover{border-color:var(--accent);transform:translateY(-1px)}
  .brandstrip .bs-logo{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:17px;background:linear-gradient(145deg,var(--accent),var(--accent-ink))}
  .brandstrip .bs-txt{flex:1;min-width:0} .brandstrip .bs-txt b{display:block;font-size:14.5px} .brandstrip .bs-txt small{color:var(--muted);font-size:12.5px}
  .brandstrip .bs-go{color:var(--accent-ink);flex:none;display:inline-flex} .brandstrip .bs-go .ic{width:18px;height:18px}

  .seclabel{display:flex;align-items:center;gap:8px;margin:24px 0 12px;font-weight:700;font-size:15px}
  .seclabel .ic{width:18px;height:18px;color:var(--accent-ink)}
  .backlink{display:inline-flex;align-items:center;gap:5px;border:none;background:none;color:var(--muted);font-size:13.5px;font-weight:600;padding:6px 0;margin-bottom:4px;transition:color .2s var(--ease)}
  .backlink:hover{color:var(--accent-ink)} .backlink .ic{width:16px;height:16px}
  .tracks{display:grid;gap:14px} @media(min-width:600px){.tracks{grid-template-columns:1fr 1fr}}
  .track{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);transition:transform .22s var(--ease),border-color .22s var(--ease),box-shadow .22s var(--ease)}
  .track:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow-lg)} .track:active{transform:translateY(-1px) scale(.995)}
  .track .tile{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;margin-bottom:4px;background:linear-gradient(150deg,var(--accent),var(--accent-ink))}
  .track.alt .tile{background:linear-gradient(150deg,var(--violet),#4f40a8)} .track .tile .ic{width:24px;height:24px}
  .track b{font-size:18px} .track small{color:var(--muted);font-size:13.5px;line-height:1.5}
  .track .go{margin-top:6px;display:inline-flex;align-items:center;gap:6px;color:var(--accent-ink);font-weight:600;font-size:13.5px} .track.alt .go{color:var(--violet)} .track .go .ic{width:16px;height:16px}
  .toggle{width:48px;height:28px;border-radius:999px;border:none;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s var(--ease)}
  .toggle .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s var(--ease)}
  .toggle.on{background:var(--violet)} .toggle.on .knob{left:23px}
  .warmcard{border-color:var(--violet)!important;background:var(--violet-soft)} .warmcard .ic{width:22px;height:22px;color:var(--violet);flex:none}
  .modebanner{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:11px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent-ink);font-size:13.5px;font-weight:600}
  .modebanner.v{background:var(--violet-soft);color:var(--violet)} .modebanner .ic{width:18px;height:18px} .modebanner a,.modebanner .bnlink{margin-left:auto;font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;color:inherit;border:none;background:none;font-family:inherit;padding:0}
  html.snappy .card,html.snappy .mode,html.snappy .tip,html.snappy .track{animation-duration:.12s!important}
  .mode{display:flex;flex-direction:column;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:17px;gap:7px;box-shadow:var(--shadow);transition:transform .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease)}
  .mode:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .mode .me{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)} .mode .me .ic{width:22px;height:22px}
  .mode b{font-size:16px} .mode small{color:var(--muted);font-size:13px}

  label.fld{display:block;font-size:13px;font-weight:600;margin:16px 0 7px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;min-height:38px;padding:7px 13px;font-size:13.5px;transition:all .18s var(--ease)}
  .chip:hover{border-color:var(--accent)} .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:11px;min-height:46px;padding:12px 20px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;box-shadow:0 4px 12px rgba(15,110,106,.25);transition:background .2s var(--ease),transform .12s var(--ease)}
  .btn:hover{background:var(--accent-ink)} .btn:active{transform:scale(.97) translateY(1px)} .btn .ic{width:18px;height:18px}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none} .btn.ghost:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  input[type=search],input[type=text],input[type=email],textarea{font-family:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
  input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .runtop{display:flex;align-items:center;gap:12px;margin:2px 0 14px;font-size:13px;color:var(--muted)}
  .bar{height:8px;border-radius:6px;background:var(--bg2);overflow:hidden;flex:1}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .7s var(--ease)}
  .qtext{font-size:19px;font-weight:600;margin:8px 0 16px;font-family:Georgia,serif;line-height:1.45}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px 15px;margin-bottom:10px;font-size:15px;transition:border-color .15s var(--ease),background .15s var(--ease),transform .12s var(--ease)}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)} .opt:active:not(:disabled){transform:scale(.99)}
  .opt .k{flex:none;width:27px;height:27px;border-radius:8px;background:var(--bg2);color:var(--muted);display:grid;place-items:center;font-weight:700;font-size:13px}
  .opt.correct{border-color:var(--good);background:var(--good-soft)} .opt.correct .k{background:var(--good);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default}
  .feedback{border-radius:12px;padding:13px 15px;margin:4px 0 12px;font-size:14.5px}
  .feedback.ok{background:var(--good-soft);color:var(--good)} .feedback.no{background:var(--bad-soft);color:var(--bad)}
  .feedback b{font-weight:700} .feedback .sub{display:block;margin-top:3px;color:var(--ink);font-weight:500;opacity:.92}
  .whybtn{border:1px solid var(--line);background:var(--card);color:var(--accent-ink);border-radius:10px;min-height:40px;padding:9px 14px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:border-color .2s var(--ease),background .2s var(--ease)}
  .whybtn:hover{border-color:var(--accent);background:var(--accent-soft)} .whybtn .ic{width:16px;height:16px}
  .whybox{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:14px 16px;margin:12px 0 4px;font-size:14px;line-height:1.55}
  .whybox h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent-ink);font-family:system-ui;display:flex;align-items:center;gap:7px}
  .whybox .ic{width:16px;height:16px}

  .acc{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
  .acc>summary{padding:15px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:11px}
  .acc>summary::-webkit-details-marker{display:none}
  .acc>summary .n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
  .acc>summary .caret{margin-left:auto;color:var(--muted);transition:transform .25s var(--ease)} .acc[open]>summary .caret{transform:rotate(90deg)}
  .acc[open]>summary{border-bottom:1px solid var(--line)} .acc .body{padding:6px 18px 16px}
  .acc h4{margin:14px 0 6px;font-size:13px;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.4px;font-family:system-ui}
  .acc ul{margin:0;padding-left:20px} .acc li{margin:6px 0;font-size:14.5px;line-height:1.5}
  .acc.hack li::marker{content:"💡  "} .acc.hack>summary .n{background:var(--violet-soft);color:var(--violet)}
  mark{background:var(--amber-soft);color:inherit;padding:0 2px;border-radius:3px}

  .tip{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}
  .tip h4{margin:0 0 5px;font-size:14.5px;display:flex;align-items:center;gap:8px;font-family:system-ui} .tip h4 .ic{width:18px;height:18px;color:var(--violet)}
  .tip p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}
  .tipgrid{display:grid;gap:12px} @media(min-width:620px){.tipgrid{grid-template-columns:1fr 1fr}}

  .results .big{font-family:Georgia,serif;font-size:54px;text-align:center;margin:8px 0;line-height:1}
  .center{text-align:center} .hide{display:none!important}
  footer{margin-top:34px;text-align:center;color:var(--muted);font-size:13px}
  .kbd{font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--muted)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.03)}100%{transform:scale(1)}}
  @keyframes optIn{from{opacity:0;transform:translateX(-9px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: no-preference){
    .card,.mode,.tip{animation:fadeUp .34s var(--ease) both}
    .acc{animation:fadeUp .32s var(--ease) both}
    .opt{animation:optIn .3s var(--ease) backwards;animation-delay:var(--oi,0s)}
    .chip.on{animation:pop .22s var(--ease)}
    .feedback{animation:slideIn .26s var(--ease) both} .whybox{animation:slideIn .28s var(--ease) .07s both} .opt.correct{animation:pop .34s var(--ease)}
  }
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  /* ---- Premium launch (Gemini-stijl) + header-logo gloed ---- */
  @property --bes-a{syntax:'<angle>';initial-value:0deg;inherits:false}
  #splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(125% 125% at 50% 38%,var(--bg2) 0%,var(--bg) 68%);transition:opacity .6s var(--ease),transform .7s var(--ease)}
  #splash.hide{opacity:0;transform:scale(1.07);pointer-events:none}
  .sp-inner{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
  .sp-mark{position:relative;width:100px;height:100px;display:grid;place-items:center}
  .sp-mark::before{content:"";position:absolute;inset:-16px;border-radius:34px;z-index:0;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));filter:blur(17px);opacity:.75}
  .sp-mark::after{content:"";position:absolute;inset:-3px;border-radius:27px;z-index:1;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));padding:3px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .sp-logo{position:relative;z-index:2;width:92px;height:92px;border-radius:24px;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:46px;background:linear-gradient(150deg,var(--accent),var(--accent-ink));box-shadow:0 14px 38px rgba(15,110,106,.4)}
  .sp-spark{position:absolute;z-index:3;top:-7px;right:-7px;width:30px;height:30px;color:#fff;filter:drop-shadow(0 2px 7px rgba(0,0,0,.35))}
  .sp-name{position:relative;font-family:Georgia,serif;font-size:26px;font-weight:700;letter-spacing:-.01em;color:var(--ink);overflow:hidden}
  .sp-name::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(-130%)}
  .sp-tag{font-size:13px;color:var(--muted);margin-top:-8px;letter-spacing:.03em}
  @media (prefers-reduced-motion: no-preference){
    .sp-mark::before{animation:bes-spin 3s linear infinite,bes-breathe 2.4s var(--ease) infinite}
    .sp-mark::after{animation:bes-spin 3s linear infinite}
    .sp-logo{animation:bes-pop .7s var(--ease) both}
    .sp-spark{animation:bes-pop .6s var(--ease) .12s both,bes-twinkle 1.9s var(--ease) .9s infinite}
    .sp-name{animation:bes-rise .6s var(--ease) .14s both}
    .sp-name::after{animation:bes-shimmer 1.5s var(--ease) .5s 1}
    .sp-tag{animation:bes-rise .6s var(--ease) .26s both}
  }
  @keyframes bes-spin{to{--bes-a:360deg}}
  @keyframes bes-breathe{0%,100%{opacity:.55;filter:blur(16px)}50%{opacity:.95;filter:blur(22px)}}
  @keyframes bes-shimmer{to{transform:translateX(130%)}}
  @keyframes bes-twinkle{0%,100%{opacity:1;transform:scale(1) rotate(0deg)}50%{opacity:.65;transform:scale(.82) rotate(18deg)}}
  @keyframes bes-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  /* mobiel: header-knoppen alleen iconen zodat niks zijwaarts overflowt */
  @media(max-width:440px){ header.top .iconbtn span{display:none} header.top .iconbtn{padding:7px 9px;min-width:38px;justify-content:center} .topin{gap:8px} }
</style>
</head>
<body>
<div id="splash"><div class="sp-inner">
  <div class="sp-mark">
    <div class="sp-logo">Dp</div>
    <svg class="sp-spark" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.5c.4 4.6 2.4 6.6 7 7-4.6.4-6.6 2.4-7 7-.4-4.6-2.4-6.6-7-7 4.6-.4 6.6-2.4 7-7Z"/></svg>
  </div>
  <div><div class="sp-name">Differentiële Psychologie</div><div class="sp-tag">slim oefenen voor je examen</div></div>
</div></div>
<header class="top">
  <div class="topin">

<script>
window.DP = {"questions":[{"t":"1","q":"Wat kenmerkt de meeste klassieke persoonlijkheidstheorieen tegenover hedendaags onderzoek?","o":["Ze vertrekken vanuit een universele benadering die geldt voor alle mensen","Ze bestuderen uitsluitend culturele verschillen tussen groepen","Ze leggen de nadruk op individuele en groepsverschillen","Ze richten zich enkel op de biologische basis van gedrag"],"a":0,"u":"Klassieke theorieen zoals die van Freud gaan uit van fundamentele processen die voor iedereen gelden. Hedendaags onderzoek legt juist de nadruk op verschillen, wat de kern is van differentiele psychologie."},{"t":"1","q":"Waarom heet het vakgebied 'differentiele psychologie'?","o":["Omdat het uitsluitend het verschil tussen gezondheid en ziekte onderzoekt","Omdat het zich beperkt tot verschillen tussen bewuste en onbewuste processen","Omdat hedendaags onderzoek de nadruk legt op individuele en groepsverschillen","Omdat het vertrekt van een universeel model dat voor iedereen identiek is"],"a":2,"u":"Anders dan de klassieke universele theorieen richt hedendaags onderzoek zich op individuele en groepsverschillen. Die nadruk op verschillen gaf het vakgebied de naam differentiele psychologie."},{"t":"1","q":"Wat is volgens de tekst een kennisdomein binnen de psychologie?","o":["Een verzameling losse feiten zonder onderlinge samenhang of expertise","Een gespecialiseerd gebied dat zich richt op specifieke, beperkte aspecten van de menselijke natuur","Een universele theorie die het volledige beeld van de persoonlijkheid geeft","Een methode om persoonlijkheidsstoornissen te diagnosticeren"],"a":1,"u":"Een kennisdomein is een gespecialiseerd gebied waarin psychologen zich richten op specifieke en beperkte aspecten van de menselijke natuur. Integratie van de domeinen is nodig voor een volledig beeld van de persoonlijkheid."},{"t":"1","q":"Een onderzoeker bestudeert de genetische, fysiologische en evolutionaire basis van persoonlijkheid. Bij welk kennisdomein hoort dit?","o":["Het intrapsychiatrische domein","Het domein van aanpassing","Het biologische domein","Het cognitief en ervaringsdomein"],"a":2,"u":"Het biologische domein ziet mensen in de eerste plaats als verzamelingen van biologische systemen. Het bestudeert de genetische, fysiologische en evolutionaire basis van persoonlijkheid als bouwstenen voor gedrag, denken en emoties."},{"t":"1","q":"Welk kennisdomein bestudeert mentale mechanismen die vaak niet op bewust niveau werken, zoals onderdrukking, ontkenning en projectie?","o":["Het sociale en culturele domein","Het dispositionele domein","Het biologische domein","Het intrapsychiatrische domein"],"a":3,"u":"Het intrapsychiatrische domein richt zich op mentale mechanismen die vaak niet bewust zijn. Het omvat Freuds klassieke theorie en modernere psychoanalyse met afweermechanismen zoals onderdrukking, ontkenning en projectie."},{"t":"1","q":"Welk kennisdomein richt zich op de manieren waarop individuen van elkaar verschillen en doorkruist daardoor alle andere domeinen?","o":["Het domein van aanpassing","Het cognitief en ervaringsdomein","Het sociale en culturele domein","Het dispositionele domein"],"a":3,"u":"Het dispositionele domein richt de aandacht op hoe individuen van elkaar verschillen en doorkruist daardoor alle andere domeinen. Het centrale doel is de fundamentele disposities te identificeren, dit zijn de belangrijkste manieren waarop individuen verschillen."},{"t":"1","q":"Een student onderzoekt hoe iemands zelfconcept, streefdoelen en intelligentie samenhangen met bewuste gedachten en gevoelens. Bij welk kennisdomein hoort dit?","o":["Het sociale en culturele domein","Het biologische domein","Het cognitief en ervaringsdomein","Het intrapsychiatrische domein"],"a":2,"u":"Het cognitief en ervaringsdomein heeft aandacht voor cognitie en subjectieve ervaringen zoals bewuste gedachten, gevoelens en overtuigingen. Daaronder vallen onder meer het zelf en zelfconcept, streefdoelen, emotionele ervaringen en intelligentie."},{"t":"2","q":"Wat wordt bedoeld met rangorde stabiliteit (rank-order stability) van een persoonlijkheidstrek?","o":["De trek is volledig biologisch bepaald en verandert nooit","De trek uit zich in verschillende gedragingen naarmate iemand ouder wordt","De relatieve positie van een persoon ten opzichte van anderen blijft doorheen de tijd ongeveer dezelfde","Het gemiddelde niveau van de trek in de hele bevolking blijft over de tijd gelijk"],"a":2,"u":"Rangorde stabiliteit betekent dat je positie ten opzichte van leeftijdsgenoten stabiel blijft: wie hoog scoort, blijft relatief hoog scoren, en wie laag scoort blijft relatief laag. Het gaat over verschillen tussen mensen, niet over het groepsgemiddelde."},{"t":"2","q":"Een onderzoeker stelt vast dat het gemiddelde agressieniveau van een groep mensen over tien jaar nauwelijks verandert, ook al wordt de groep ouder. Om welke vorm van stabiliteit gaat het hier?","o":["Coherentie","Gemiddelde niveau stabiliteit","Rangorde stabiliteit","Validiteit"],"a":1,"u":"Gemiddelde niveau stabiliteit slaat op de score van de groep als geheel: het populatiegemiddelde blijft op hetzelfde niveau, los van de relatieve posities van individuen. Rangorde stabiliteit zou daarentegen gaan over of dezelfde personen relatief hoog of laag blijven scoren."},{"t":"2","q":"Iemand met een autoritaire stijl gedraagt zich dominant tegenover ondergeschikten en onderdanig tegenover superieuren. Waarom is dit volgens de brontekst geen echte persoonlijkheidsverandering wanneer de persoon van de ene naar de andere groep wisselt?","o":["Omdat de verandering niet intern in de persoon zit maar enkel in de omgeving of situatie","Omdat de persoon zowel hoog als laag scoort op dezelfde schaal","Omdat dominantie geen persoonlijkheidstrek is maar een tijdelijke toestand","Omdat de verandering te kort duurt om betrouwbaar gemeten te worden"],"a":0,"u":"Echte persoonlijkheidsverandering moet intern zijn: ze zit in de persoon zelf, niet enkel in een gewijzigde omgeving of groep. De autoritaire persoon reageert simpelweg anders op verschillende situaties, wat pas verandering zou zijn als hij bijvoorbeeld ook tegenover superieuren dominant zou worden."},{"t":"2","q":"Waarom is verhoogde extraversie en agressie bij iemand die dronken is volgens de brontekst geen voorbeeld van persoonlijkheidsverandering?","o":["Omdat de relatieve positie ten opzichte van anderen gelijk blijft","Omdat extraversie geen deel uitmaakt van de persoonlijkheid","Omdat de verandering tijdelijk is en niet aanhoudt doorheen de tijd","Omdat de verandering enkel in de omgeving plaatsvindt"],"a":2,"u":"Naast intern moet een echte verandering ook aanhoudend zijn: ze houdt aan doorheen de tijd en is niet tijdelijk. Effecten van dronkenschap, goed of slecht nieuws zijn voorbeelden van kortstondige toestanden, geen blijvende persoonlijkheidsverandering."},{"t":"2","q":"Op welk analyseniveau situeert zich de vaststelling dat impulsiviteit en risicogedrag bij zowat iedereen afnemen naarmate men ouder wordt?","o":["Individueel verschilniveau","Groepsverschillen niveau","Cohorteniveau","Populatieniveau"],"a":3,"u":"Op populatieniveau bekijkt men algemene trends die voor zowat iedereen gelden op bepaalde momenten in de tijd, zoals de algemene afname in impulsiviteit met de leeftijd. Het groepsverschillen niveau zou daarentegen gaan over patronen die specifiek zijn voor bepaalde groepen."},{"t":"2","q":"Uit het temperamentsonderzoek van Rothbart bleek dat de schalen activiteitsniveau en lachen consistent hogere correlaties tussen meetmomenten vertoonden dan de andere schalen. Wat betekent dit?","o":["Deze twee dimensies zijn minder betrouwbaar te meten bij baby's","Deze twee dimensies hangen niet samen met sociaal gedrag","Deze twee dimensies zijn stabieler over de tijd dan de andere temperamentsdimensies","Deze twee dimensies veranderen sterker over de tijd dan de andere dimensies"],"a":2,"u":"Hogere correlaties tussen meetmomenten wijzen op een hogere stabiliteit over de tijd. Activiteitsniveau en lachen, beide prosociaal gedrag, vertoonden vroeg al de meest stabiele individuele verschillen."},{"t":"2","q":"Wat is het verschil tussen een stabiliteitscoëfficiënt en een validiteitscoëfficiënt zoals gebruikt in de studie van Saudino?","o":["Een stabiliteitscoëfficiënt correleert dezelfde maat op twee tijdstippen, een validiteitscoëfficiënt correleert twee verschillende meetmethoden op hetzelfde tijdstip","Beide meten hetzelfde, maar de stabiliteitscoëfficiënt gebruikt tweelingen en de validiteitscoëfficiënt niet","Een stabiliteitscoëfficiënt meet het groepsgemiddelde, een validiteitscoëfficiënt meet de relatieve positie","Een stabiliteitscoëfficiënt correleert twee meetmethoden op hetzelfde tijdstip, een validiteitscoëfficiënt correleert dezelfde maat op twee tijdstippen"],"a":0,"u":"De stabiliteitscoëfficiënt is de correlatie tussen dezelfde maat op verschillende momenten (test-hertest, hoe stabiel zijn verschillen over de tijd). De validiteitscoëfficiënt is de correlatie tussen twee verschillende manieren om dezelfde trek te meten op hetzelfde moment, bijvoorbeeld actometer versus ouderbeoordeling."},{"t":"2","q":"Wat gebeurt er volgens de longitudinale studies met de stabiliteitscoëfficiënten naarmate het tijdsinterval tussen twee metingen groter wordt?","o":["De coëfficiënten blijven exact gelijk, ongeacht het tijdsinterval","De coëfficiënten worden negatief bij lange tijdsintervallen","De coëfficiënten worden lager: hoe langer het interval, hoe minder accuraat de voorspelling","De coëfficiënten worden hoger: langere intervallen geven stabielere voorspellingen"],"a":2,"u":"Hoe langer het tijdsinterval tussen de originele meting en het voorspelde moment, des te lager worden de stabiliteitscoëfficiënten. Persoonlijkheid als kind blijft een voorspeller van latere persoonlijkheid, maar de voorspelbaarheid daalt met de afstand in tijd."},{"t":"2","q":"Roberts en DelVecchio (2000) concludeerden dat de consistentie van trekken lineair toeneemt en piekt na 50 jaar. Waarom noemt de brontekst dit een te globale uitspraak?","o":["Omdat rangorde stabiliteit en gemiddelde niveau stabiliteit hetzelfde zijn","Omdat per domein verschillen bestaan: consciëntieusheid blijft bijvoorbeeld toenemen zonder piek rond 50 jaar","Omdat de studie enkel bij kinderen en niet bij volwassenen werd uitgevoerd","Omdat de consistentie in werkelijkheid afneemt met de leeftijd"],"a":1,"u":"De globale conclusie klopt in grote lijnen, maar per Big Five domein zijn er verschillen. Volgens Specht, Egloff en Schmukle blijft de rangorde stabiliteit van consciëntieusheid toenemen zonder piek rond 50, terwijl extraversie net iets voor 50 piekt."},{"t":"2","q":"Uit het onderzoek van Twenge naar de assertiviteit van vrouwen doorheen de 20ste eeuw bleek dat scores meestegen en -daalden met de sociale status en rolpatronen van de periode waarin vrouwen opgroeiden, terwijl dit bij mannen niet zo was. Welk fenomeen illustreert dit?","o":["Rangorde stabiliteit binnen een generatie","Het gipsmodel van persoonlijkheid","Gemiddelde niveau stabiliteit op populatieniveau","Een cohort effect: veranderingen die toe te schrijven zijn aan het leven in andere tijden"],"a":3,"u":"Een cohort effect verwijst naar veranderingen doorheen de tijd die toe te schrijven zijn aan het leven in andere maatschappelijke omstandigheden, in plaats van aan echte inherente persoonlijkheidsverandering. Dat assertiviteit samenhing met de tijdsgeest waarin vrouwen opgroeiden toont dat persoonlijkheid ook kneedbaar is."},{"t":"3","q":"Wat wordt bedoeld met erfelijkheid (overerfbaarheid) in de gedragsgenetica?","o":["De mate waarin de persoonlijkheid van een individu vastligt in zijn genen","De zekerheid waarmee een eigenschap ongewijzigd wordt doorgegeven aan het nageslacht","De proportie van de geobserveerde variatie in een groep die toegeschreven kan worden aan genetische variatie","Het percentage genen dat een kind exact deelt met beide ouders"],"a":2,"u":"Erfelijkheid is de proportie fenotypische variatie in een groep die toegeschreven kan worden aan genotypische variatie. Bij een erfelijkheid van .20 betekent dit dat 20% van de verschillen in de groep samenhangt met genetische verschillen."},{"t":"3","q":"Een student stelt dat de erfelijkheid van intelligentie bij een bepaald persoon 50% is. Waarom is dit fout?","o":["Erfelijkheid slaat op variatie binnen een groep en kan nooit op een enkel individu toegepast worden","De erfelijkheid van intelligentie is in werkelijkheid veel hoger dan 50%","Intelligentie is niet erfelijk, enkel persoonlijkheidstrekken zijn dat","Bij een individu bepaalt de omgeving altijd meer dan de genen"],"a":0,"u":"Een veelgemaakte misvatting is erfelijkheid toepassen op een persoon. Erfelijkheid geldt enkel voor een groep individuen, want bij een individu zijn genen en omgeving onlosmakelijk verbonden en steeds beide noodzakelijk."},{"t":"3","q":"Wat is het kernprobleem van familiestudies als methode om erfelijkheid te schatten?","o":["De correlaties tussen familieleden zijn bijna altijd negatief","Familieleden willen zelden meewerken aan langdurig onderzoek","Familieleden delen naast hun genen vaak ook hun omgeving, waardoor beide invloeden vermengd raken (confound)","De genetische overlap tussen ouder en kind is te klein om verschillen te meten"],"a":2,"u":"Familieleden met gedeelde genen hebben doorgaans ook een gedeelde omgeving. Genetische en omgevingsinvloeden kunnen zo niet uit elkaar getrokken worden, waardoor familiestudies nooit een sluitend antwoord geven."},{"t":"3","q":"Op welk principe berust de schatting van erfelijkheid in tweelingstudies?","o":["Meten hoeveel genen een tweeling deelt met de ouders","Vergelijken in welke mate MZ-tweelingen meer op elkaar lijken dan DZ-tweelingen op een bepaalde trek","Nagaan of tweelingen sterker op elkaar lijken dan gewone broers en zussen","Bepalen of tweelingen die samen opgroeien meer verschillen dan tweelingen die apart opgroeien"],"a":1,"u":"MZ-tweelingen zijn zo goed als 100% genetisch identiek, DZ-tweelingen delen gemiddeld 50%. Als MZ substantieel meer op elkaar lijken dan DZ op een trek, levert dat bewijs voor erfelijkheid van die eigenschap."},{"t":"3","q":"Met de eenvoudige formule h2 = 2(rMZ - rDZ) en correlaties van 0.90 (MZ) en 0.48 (DZ) voor lengte, wat is de geschatte erfelijkheid?","o":["0.48","0.84","0.42","1.38"],"a":1,"u":"De formule verdubbelt het verschil tussen de MZ- en DZ-correlatie: 2 x (0.90 - 0.48) = 2 x 0.42 = 0.84. Dit is een klassiek voorbeeld voor de erfelijkheid van lengte."},{"t":"3","q":"Waarom leveren adoptiestudies krachtige resultaten vergeleken met tweelingstudies?","o":["Ze hebben de gelijke-omgevingsassumptie niet nodig omdat genen en omgeving volledig gescheiden zijn","Adoptiekinderen zijn altijd volledig representatief voor de algemene bevolking","Ze kunnen de erfelijkheid van een individu exact berekenen","Ze vereisen geen enkele aanname over representativiteit"],"a":0,"u":"Bij adoptie deelt het kind de omgeving met de adoptieouders (geen genetische overlap) en de genen met de biologische ouders (geen gedeelde omgeving). Door die volledige scheiding is er geen confound en is de gelijke-omgevingsassumptie niet nodig."},{"t":"3","q":"Rond welk niveau schat recent onderzoek de erfelijkheid van de Big Five-trekken (NEOAC) in?","o":["Ongeveer 10%","Nagenoeg 100%","Ongeveer 50%","Ongeveer 90%"],"a":2,"u":"Recent onderzoek zoals Caspi et al. (2005) plaatst de erfelijkheid van de Big Five rond de 50%. Meta-analyses van neuroticisme en extraversie geven vergelijkbare cijfers van 48% en 49%."},{"t":"3","q":"Voor de meeste persoonlijkheidstrekken blijkt de omgevingsinvloed het grootst te zijn bij welk type omgeving?","o":["Uitsluitend de prenatale omgeving in de baarmoeder","Gedeelde omgeving, zoals het thuismilieu en de opvoedingsstijl","Niet-gedeelde omgeving, zoals unieke ervaringen en eigen vrienden","De schoolomgeving die alle siblings gemeenschappelijk hebben"],"a":2,"u":"In tegenstelling tot de algemene opvatting blijkt de omgevingsinvloed op persoonlijkheid het grootst voor niet-gedeelde aspecten. Het gaat dus niet zozeer om opvoeding of thuismilieu, maar om de unieke ervaringen van de persoon."},{"t":"3","q":"In de studies van Caspi et al. (2003) reageerden mishandelde kinderen verschillend afhankelijk van hun MAOA-niveau. Welk fenomeen illustreert dit?","o":["Actieve genotype-omgevingscorrelatie: het kind zoekt zelf een bepaalde omgeving op","Omgevingsbepaaldheid: de omgeving verklaart alle verschillen tussen de kinderen","Passieve genotype-omgevingscorrelatie: ouders geven zowel genen als omgeving door","Genotype-omgevingsinteractie: dezelfde omgeving leidt tot een ander effect naargelang het genotype"],"a":3,"u":"Bij dezelfde omgeving (misbruik) ontwikkelden kinderen met een laag MAOA-niveau vaker antisociale trekken, en kinderen met een hoog niveau veel minder. Dezelfde omgeving met een verschillend genotype geeft een verschillend effect, wat de definitie van genotype-omgevingsinteractie is."},{"t":"3","q":"Een sensatiebeluste adolescent (erfelijke aanleg) zoekt zelf risicovolle situaties zoals skydiven op. Welk type genotype-omgevingscorrelatie is dit?","o":["Passief","Reactief","Actief","Interactief"],"a":2,"u":"Bij een actieve genotype-omgevingscorrelatie gaat de persoon met een bepaald genotype zelf actief op zoek naar een passende omgeving. Bij passief geven ouders genen en omgeving door, bij reactief reageert de omgeving op het genotype van het kind."},{"t":"4","q":"Wat is volgens de tekst het onderscheid tussen een fysiologische indicator en een fysiologisch (biologisch) causaal substraat?","o":["Een indicator meet je met bloed, een causaal substraat meet je met EEG","Er is geen verschil, beide begrippen betekenen precies hetzelfde","Een indicator is altijd de oorzaak van gedrag, terwijl een causaal substraat enkel meebeweegt","Een indicator hangt samen met persoonlijkheid of gedrag zonder noodzakelijke oorzakelijke band, terwijl een causaal substraat wel de oorzaak is van een eigenschap"],"a":3,"u":"Een fysiologische indicator correleert met persoonlijkheid of gedrag zonder dat er een causaal verband hoeft te zijn (bv. hartslag en angst), terwijl een causaal substraat wel de onderliggende oorzaak vormt van een eigenschap."},{"t":"4","q":"Een verlegen student krijgt voor een publiek een verhoogde hartslag. Waarom is die hartslag volgens de tekst een indicator en geen bewijs van een oorzaak?","o":["Omdat de hartslag altijd fout gemeten wordt bij verlegen mensen","Omdat een verhoogde hartslag samenhangt met de angstrespons, maar je niet verlegen bent doordat je hartslag stijgt","Omdat een verhoogde hartslag juist bewijst dat iemand extravert is","Omdat verlegenheid enkel via zelfrapportage bestaat en nooit fysiologisch"],"a":1,"u":"De verhoogde hartslag is een fysieke indicator van de angstrespons die situatie en persoonlijkheid samen uitlokken. Het is niet omdat je een verhoogde hartslag hebt dat je een verlegen persoon bent, dus er is geen causale conclusie."},{"t":"4","q":"Wat meet de elektrodermale respons (huidgeleiding) en waardoor wordt ze aangestuurd?","o":["De bloeddruk in de handpalm, aangestuurd door het musculaire stelsel","De hoeveelheid zweet via elektrische geleiding, aangestuurd door het sympathische deel van het autonoom zenuwstelsel","De elektrische activiteit van hersencellen, aangestuurd door neurotransmitters","Het zuurstofgehalte in het bloed, aangestuurd door het parasympathische zenuwstelsel"],"a":1,"u":"Bij arousal produceren de zweetklieren zweet, wat de elektrische geleiding tussen twee punten verhoogt. De zweetklieren worden beinvloed door het sympathische deel van het autonoom zenuwstelsel dat het lichaam voorbereidt op actie."},{"t":"4","q":"Bij de terugwaartse seriele aftrektaak (bijvoorbeeld snel aftellen vanaf 4576 per 7) wordt hartreactiviteit gemeten. Met welk persoonlijkheidsprofiel is een hoge reactiviteit vooral geassocieerd?","o":["Hoge aangenaamheid, met een neutraal cardiovasculair risico","Hoge introversie, met een lager risico op hart- en vaatziekten","Lage sensatiezucht, zonder enig gezondheidsrisico","Type A persoonlijkheid: ongeduldig, competitief en vijandig, met een verhoogd risico op hart- en vaatziekten"],"a":3,"u":"De mate van hartreactiviteit bij zo'n stresstaak hangt samen met type A persoonlijkheid (ongeduldig, competitief, vijandig). Dit patroon van hartreactiviteit gaat samen met een verhoogd risico op hart- en vaatziekten."},{"t":"4","q":"In de fMRI-studie van Canli et al. (2001) keken proefpersonen naar emotionele foto's. Welk verband werd vastgesteld?","o":["Negatieve foto's gaven frontale activatie bij mensen hoog op Neuroticisme, positieve foto's bij mensen hoog op Extraversie","Enkel neutrale foto's leidden tot frontale activatie, bij mensen hoog op Consciëntieusheid","Alle foto's gaven dezelfde activatie ongeacht de persoonlijkheid","Negatieve foto's gaven frontale activatie bij mensen hoog op Extraversie, positieve foto's bij mensen hoog op Neuroticisme"],"a":0,"u":"Bij negatieve foto's zag men frontale activatie bij personen hoog op Neuroticisme, wat wijst op een verhoogde gevoeligheid voor negatieve stimuli. Bij positieve foto's trad frontale activatie op bij personen hoog op Extraversie, wat wijst op gevoeligheid voor positieve stimuli."},{"t":"4","q":"Hoe verfijnde Eysenck zijn oorspronkelijke ARAS-theorie nadat onderzoek zijn eerste aanname tegensprak?","o":["Introverten en extraverten verschillen enkel in hun basisniveau van arousal en nooit in reactiviteit","Zowel het basisniveau als de reactiviteit zijn identiek voor introverten en extraverten","Extraverten zijn reactiever bij gemiddelde stimulatie dan introverten","Het verschil tussen introverten en extraverten ligt niet in het basisniveau van arousal, maar in de reactiviteit bij stimulatie, waarbij introverten reactiever zijn"],"a":3,"u":"Onderzoek toonde dat introverten en extraverten niet verschillen in het basisniveau van arousal in rust, maar dat introverten wel reactiever zijn bij gemiddelde stimulatie. Daarom verfijnde Eysenck zijn theorie: het verschil zit in de reactiviteit bij arousal, niet in de basislijn."},{"t":"4","q":"In de studie van Geen presteerden studenten het slechtst in welke situatie?","o":["Introverten die moesten leren op het lawaainiveau dat door extraverten was gekozen","Introverten die mochten leren op hun eigen gekozen, stillere niveau","Extraverten die moesten leren op het lawaainiveau dat door extraverten was gekozen","Extraverten die mochten leren op hun eigen gekozen, lawaaierige niveau"],"a":0,"u":"De slechtste prestatie leverden introverten die op het door extraverten gekozen lawaainiveau moesten leren (gemiddeld 9,1 pogingen tegenover 5,8 in hun stillere omgeving). De conclusie is dat iedereen het best presteert onder het eigen gekozen stimulatieniveau."},{"t":"4","q":"Wat is volgens Gray's reinforcement sensitivity theory de functie van het gedragsinhibitiesysteem (BIS)?","o":["Het reageert op signalen van beloning en reguleert toenaderingsgedrag, en werkt als een versneller","Het regelt de corticale opwinding via het ARAS in de hersenen","Het reageert op signalen van bestraffing, frustratie en onzekerheid en reguleert vermijdingsgedrag, en werkt als een rem","Het breekt neurotransmitters af om een optimaal niveau te bewaren"],"a":2,"u":"Het BIS reageert op signalen van bestraffing, frustratie en onzekerheid en reguleert inhibitie en vermijdingsgedrag, waardoor het als rem werkt. De activiteit van het BIS produceert bovendien gevoelens van angst."},{"t":"4","q":"Volgens Zuckerman hebben mensen met een hoge sensatiezucht een bepaald fysiologisch profiel op het vlak van het enzym MAO. Wat houdt dat in?","o":["Ze hebben lagere niveaus van cortisol, waardoor ze minder stress ervaren","Ze hebben lagere niveaus van MAO, waardoor er meer neurotransmitters aanwezig zijn en er minder makkelijk inhibitie plaatsvindt","Ze hebben hogere niveaus van MAO, waardoor er minder neurotransmitters aanwezig zijn en er meer inhibitie is","Ze hebben een normaal MAO-niveau maar een tekort aan dopaminereceptoren"],"a":1,"u":"MAO breekt neurotransmitters af en werkt zo als een rem voor het zenuwstelsel. Hoge sensatiezoekers hebben lagere MAO-niveaus, waardoor er meer neurotransmitters aanwezig zijn, inhibitie moeilijker wordt en ze impulsiever zijn."},{"t":"4","q":"Wat is volgens het onderzoek naar hersenasymmetrie en affectieve stijl het verband tussen hemisferische activiteit en emotie?","o":["Enkel de rechterhemisfeer is betrokken bij zowel positieve als negatieve emoties","Beide hemisferen zijn even actief bij alle emoties, er is geen lateralisatie","De linkerhemisfeer is relatief actiever bij positieve emoties en toenadering, de rechterhemisfeer bij negatieve emoties en vermijding","De linkerhemisfeer is relatief actiever bij negatieve emoties en vermijding, de rechterhemisfeer bij positieve emoties en toenadering"],"a":2,"u":"De linkerhemisfeer is relatief actiever bij het ervaren van positieve emoties en toenadering, terwijl de rechterhemisfeer relatief actiever is bij negatieve emoties en vermijding. De lateralisatie slaat wel vooral op toenadering versus vermijding, wat meestal maar niet altijd overlapt met positief versus negatief."},{"t":"5","q":"Wat wordt in de evolutionaire benadering verstaan onder een adaptatie?","o":["Een aangeleerde gewoonte die een individu tijdens zijn leven ontwikkelt","Een bijkomend effect van een structuur die voor een ander doel is geëvolueerd","Een toevallige variatie in een eigenschap die neutraal is tegenover selectie","Een overgeërfde oplossing voor overlevings- en voortplantingsproblemen die door vijandige krachten in de omgeving worden veroorzaakt"],"a":3,"u":"Een adaptatie is een overgeërfde, betrouwbaar ontwikkelende oplossing voor overlevings- en voortplantingsproblemen die door vijandige krachten in de omgeving worden veroorzaakt, zoals parasieten, voedseltekort en ziekten."},{"t":"5","q":"Een pauw draagt een enorme, opvallende staart die hem niet beschermt tegen roofdieren. Welk principe verklaart volgens Darwin het ontstaan van zo'n eigenschap?","o":["Ad random variatie of ruis","Seksuele selectie op voortplantingswaarde","Differentiële genreproductie zonder verwantschap","Natuurlijke selectie op overlevingswaarde"],"a":1,"u":"Eigenschappen die de overlevingskans niet verhogen of zelfs verlagen, maar wel bijdragen aan reproductief succes, worden verklaard door seksuele selectie. De staart geeft de pauw een voordeel in de competitie om een gewenste voortplantingspartner."},{"t":"5","q":"Wat is het verschil tussen intraseksuele en interseksuele competitie?","o":["Bij intraseksuele competitie wedijveren leden van hetzelfde geslacht om toegang tot het andere geslacht, bij interseksuele competitie kiest een sekse partners op basis van hun eigenschappen","Bij intraseksuele competitie kiest een sekse haar partner, bij interseksuele competitie vechten leden van hetzelfde geslacht met elkaar","Intraseksuele competitie speelt enkel bij mannen, interseksuele competitie enkel bij vrouwen","Intraseksuele competitie gaat over overleving, interseksuele competitie over voedsel"],"a":0,"u":"Bij intraseksuele competitie wedijveren leden van hetzelfde geslacht om seksuele toegang tot het andere geslacht, bijvoorbeeld herten die met hun gewei kruisen. Bij interseksuele competitie kiezen leden van een sekse hun partner op basis van diens eigenschappen, zoals een schitterende pauwenstaart."},{"t":"5","q":"Wat beschouwen moderne evolutionaire biologen als het basismechanisme van evolutie?","o":["Natuurlijke selectie","Functionaliteit","Seksuele selectie","Differentiële genreproductie"],"a":3,"u":"Hedendaagse evolutionaire biologen herformuleerden Darwins theorie naar differentiële genreproductie: sommige genen, namelijk die welke tot overleving en voortplanting leiden, hebben meer kans om overgeërfd te worden dan andere."},{"t":"5","q":"Volgens de theorie van inclusieve fitheid (Hamilton, 1964) bestaat de fitheid van een individu uit het persoonlijke reproductieve succes plus welk element?","o":["Het effect dat het individu heeft op de voortplanting van genetische verwanten, gewogen naar de graad van verwantschap","Het aantal seksuele partners dat het individu in zijn leven heeft gehad","De mate waarin het individu zich aanpast aan moderne omgevingen","De totale hoeveelheid voedsel die het individu voor de groep verzamelt"],"a":0,"u":"Inclusieve fitheid stelt de overerving van de eigen genen centraal en telt bij het persoonlijke reproductieve succes ook het effect op de voortplanting van genetische verwanten op, gewogen door hun graad van genetisch verwantschap, aangezien verwanten deels dezelfde genen dragen."},{"t":"5","q":"Je deelt ongeveer 50 procent van je genen met een broer of zus. Volgens de logica van inclusieve fitheid: wanneer is helpen dat het eigen leven riskeert evolutionair voordelig?","o":["Nooit, omdat het eigen overleven altijd voorgaat","Alleen als de kans om succesvol te helpen minstens twee keer zo groot is als de kans dat het je het leven kost","Alleen als de verwant ouder is dan jezelf","Altijd, omdat familie helpen per definitie voordelig is"],"a":1,"u":"De baten van zorg voor verwanten mogen niet ten koste gaan van het eigen reproductieve succes. Omdat je 50 procent deelt met je zus, moet de kans op succesvol helpen minstens twee keer zo groot zijn als het risico op eigen overlijden, anders is er geen evolutionair voordeel aan het helpende gedrag."},{"t":"5","q":"Welk voorbeeld illustreert het best een nevenproduct van een adaptatie in plaats van een adaptatie zelf?","o":["Een voorkeur voor zoet en vetrijk voedsel","Het vermogen om een bril op de neus te laten rusten","Angst voor negatieve beoordeling door anderen","Zweetklieren om de lichaamstemperatuur te regelen"],"a":1,"u":"Nevenproducten zijn toevallige effecten of bijkomende functies van adaptaties die niet voor dat doel geëvolueerd zijn. De neus evolueerde niet om een bril te dragen, maar dat een bril er handig op past is een nevenproduct."},{"t":"5","q":"Wat houdt het principe van domein-specificiteit in de evolutionaire psychologie in?","o":["Er is één algemeen leermechanisme dat alle adaptieve problemen tegelijk oplost","Selectie zorgt voor specifieke mechanismen die telkens op één bepaald adaptief probleem gericht zijn","Psychologische adaptaties zijn identiek bij mannen en vrouwen","Alle adaptaties komen enkel voor in het domein van partnerkeuze"],"a":1,"u":"Domein-specificiteit betekent dat selectie voor elk adaptief probleem een specifiek mechanisme ontwikkelt. Een algemene regel zou bijvoorbeeld leiden tot het eten van giftige planten, terwijl onze voorkeur juist gericht is op rijp, calorierijk en zoet voedsel."},{"t":"5","q":"Een onderzoeker stelt vast dat mannen vaker agressie plegen dan vrouwen en zoekt daarna naar een verklaring en theorie. Welke onderzoeksmethode past deze onderzoeker toe?","o":["De inductieve bottom-up methode","De methode van frequentie-afhankelijke selectie","De methode van domein-specificiteit","De deductieve top-down methode"],"a":0,"u":"De inductieve of bottom-up methode vertrekt van een empirische bevinding en stelt daarop een theorie op, dus data-gestuurd. Vertrekken vanuit een empirische vaststelling zoals meer agressie bij mannen en pas daarna verklaringen zoeken, is kenmerkend voor deze aanpak."},{"t":"5","q":"In de studie van Clark en Hatfield (1989) stemde 75 procent van de mannen in met het voorstel van een vreemde om die avond seks te hebben, tegenover 0 procent van de vrouwen. Hoe verklaren evolutionaire psychologen dit verschil?","o":["Mannen hebben een groter geheugen voor aantrekkelijke partners","Vrouwen zijn van nature minder geïnteresseerd in seksualiteit dan mannen","De sekse die minder in nakomelingen investeert, is minder selectief en zoekt eerder meerdere partners","Het verschil komt volledig voort uit culturele opvoeding zonder biologische basis"],"a":2,"u":"Vanuit de principes van ouderlijke investering en seksuele selectie voorspelt men dat de sekse die minder in nakomelingen investeert, hier de man, minder selectief is en meer geneigd is meerdere seksuele partners te zoeken, waardoor hij zijn reproductieve succes kan verhogen."},{"t":"5","q":"Linkshandigheid geeft een voordeel in een gevecht, maar alleen zolang slechts een minderheid van de populatie linkshandig is. Welk mechanisme voor individuele verschillen illustreert dit?","o":["Frequentie-afhankelijke selectie","Overerfbare verschillen door omgevingsinvloeden op algemene mechanismen","Een optimaal niveau dat varieert over tijd en plaats","Reactief erfelijke verschillen die contingent zijn op andere trekken"],"a":0,"u":"Bij frequentie-afhankelijke selectie heeft een eigenschap enkel evolutionaire waarde als ze in een beperkte proportie in de populatie voorkomt: hoe zeldzamer de strategie, hoe succesvoller. Linkshandigheid biedt daarom enkel een gevechtsvoordeel zolang linkshandigen een minderheid vormen."},{"t":"6","q":"Wat is het onderscheid tussen impliciete en expliciete intelligentietheorieen?","o":["Impliciete theorieen berusten op overtuigingen van leken, expliciete theorieen zijn formeel afgeleid door experts en empirisch onderbouwd","Impliciete theorieen zijn cultuuronafhankelijk, expliciete theorieen verschillen per cultuur","Impliciete theorieen meten enkel snelheid, expliciete theorieen meten enkel geheugen","Impliciete theorieen worden door experts opgesteld, expliciete theorieen door het brede publiek"],"a":0,"u":"Impliciete theorieen zijn oordelen gebaseerd op de overtuigingen van leken, terwijl expliciete theorieen formeler zijn afgeleid door experts en meer op empirische basis onderbouwd zijn."},{"t":"6","q":"Welk van de volgende kenmerken hoort NIET bij de top zes essentiele componenten van intelligentie?","o":["Abstract redeneren","Emotionele stabiliteit","Mentale snelheid","Geheugen"],"a":1,"u":"De zes essentiele componenten zijn abstract redeneren, probleemoplossend vermogen, capaciteit tot verwerven van kennis, geheugen, aanpassing aan de omgeving en mentale snelheid. Emotionele stabiliteit hoort daar niet bij."},{"t":"6","q":"Een leerkracht overtuigt leerlingen ervan dat intelligentie kneedbaar is en kan toenemen. Op welke opvatting over de aard van intelligentie steunt deze boodschap?","o":["De incrementele theorie","De triarchische theorie","De psychometrische theorie","De entiteitstheorie"],"a":0,"u":"De incrementele theorie beschouwt intelligentie als kneedbaar, iets dat kan toenemen. Kinderen met zo'n opvatting behaalden in onderzoek na verloop van tijd hogere academische resultaten, terwijl de entiteitstheorie intelligentie als vast beschouwt."},{"t":"6","q":"Hoe werd het intelligentiequotient (IQ) volgens de oorspronkelijke berekening van Stern bepaald?","o":["Chronologische leeftijd delen door mentale leeftijd en vermenigvuldigen met 100","Mentale leeftijd delen door chronologische leeftijd en vermenigvuldigen met 100","Ruwe score delen door de standaardafwijking van de groep","Actuele testscore optellen bij de verwachte testscore"],"a":1,"u":"Stern introduceerde het IQ, dat wordt berekend door de mentale leeftijd te delen door de chronologische leeftijd en te vermenigvuldigen met 100. Deze aanpak werkt goed bij kinderen maar minder bij volwassenen."},{"t":"6","q":"Wat houdt Spearmans g-factor in?","o":["Een verzameling van zeven onafhankelijke primaire mentale vaardigheden","Een specifieke vaardigheid die enkel de prestatie op verbale taken bepaalt","De mate waarin intelligentie kneedbaar is doorheen de levensloop","Een algemene mentale energie die van de ene taak naar de andere kan worden getransfereerd, waardoor scores op taken positief correleren"],"a":3,"u":"Spearman stelde dat er een algemene g-factor bestaat, opgevat als mentale energie die voor alle taken van belang is en van de ene naar de andere taak overgedragen kan worden, zodat scores op taken positief met elkaar correleren."},{"t":"6","q":"Wat is het kenmerkende verschil tussen gekristalliseerde (gc) en vloeiende (gf) intelligentie volgens Cattell?","o":["Gekristalliseerde intelligentie is aangeboren, vloeiende intelligentie wordt volledig aangeleerd via scholing","Gekristalliseerde intelligentie neemt af met de leeftijd, vloeiende intelligentie blijft levenslang stabiel","Gekristalliseerde intelligentie is verworven feitenkennis die toeneemt in de levensloop, vloeiende intelligentie is het zien van verbanden zonder voorkennis en neemt af met de leeftijd","Gekristalliseerde intelligentie meet reactietijd, vloeiende intelligentie meet woordenschat"],"a":2,"u":"Gekristalliseerde intelligentie bestaat uit feitenkennis die men door scholing en leven verwerft, zoals woordenschat, en neemt toe tijdens de levensloop. Vloeiende intelligentie is het vermogen verbanden te zien zonder voorkennis en neemt af naarmate men ouder wordt."},{"t":"6","q":"Waarom vonden psychologen het intelligentiemodel van Guilford moeilijk toepasbaar?","o":["Het ging uit van slechts een enkele algemene factor","Het verwierp elke vorm van meting van intelligentie","Het onderscheidde 120 elementaire vaardigheden, wat het model onhandig in gebruik maakte","Het was uitsluitend gebaseerd op emotionele vaardigheden"],"a":2,"u":"Guilford stelde dat er 120 elementaire vaardigheden bestaan, gegroepeerd onder de dimensies verrichtingen, inhouden en producten. Door dat grote aantal vaardigheden vonden psychologen zijn model niet gemakkelijk toepasbaar."},{"t":"6","q":"Vier van de volgende termen zijn brede factoren uit het Cattell-Horn-Carroll (CHC) model. Welke term past NIET in het rijtje?","o":["Vloeiende intelligentie (Gf)","Korte termijn geheugen (Gsm)","Analytische intelligentie","Verwerkingssnelheid (Gs)"],"a":2,"u":"Vloeiende intelligentie, verwerkingssnelheid en korte termijn geheugen zijn brede factoren binnen het CHC model. Analytische intelligentie hoort niet bij het CHC model, maar bij Sternbergs triarchische theorie."},{"t":"6","q":"Welke kritiek geldt volgens de bron voor Gardners theorie van meervoudige intelligenties?","o":["Ze meet uitsluitend praktische intelligentie via reactietijd","Ze wordt beschouwd als het meest gevalideerde model van cognitief functioneren","Ze reduceert intelligentie tot een enkele algemene factor","Ze is populair bij opvoeders, maar kreeg weinig empirische ondersteuning"],"a":3,"u":"Gardner onderscheidde zeven of meer onafhankelijke intelligenties en verwierp een unitaire algemene factor. Zijn theorie is populair bij opvoeders maar kreeg weinig empirische ondersteuning, zodat men kritisch moet blijven."},{"t":"6","q":"Iemand krijgt een casus voorgelegd en moet in een winkelcentrum op een plattegrond de kortste weg tussen twee winkels aanduiden. Welke component uit Sternbergs triarchische theorie wordt hier vooral aangesproken?","o":["Praktische intelligentie","Analytische intelligentie","Creatieve intelligentie","Gekristalliseerde intelligentie"],"a":0,"u":"Praktische intelligentie draait om het toepassen en implementeren van kennis in concrete situaties. Het aanduiden van de kortste route op een plattegrond is een typisch voorbeeld en is uniek aan Sternbergs benadering."},{"t":"6","q":"Wat houdt het principe van neurale efficientie in als biologische benadering van intelligentie?","o":["Intelligentie hangt uitsluitend af van het totale hersenvolume","Meer intelligente personen verbruiken minder glucose en tonen sterkere gelokaliseerde hersenactivatie tijdens taken","Intelligentie wordt bepaald door een enkel gen met een groot effect","Meer intelligente personen verbruiken meer glucose en tonen diffuse activatie over de hele cortex"],"a":1,"u":"Volgens de neurale efficientiebenadering verbruiken intelligentere individuen minder glucose en vertonen ze een sterkere gelokaliseerde hersenactivatie tijdens taken. Dit effect is vooral zichtbaar bij taken van lage tot gemiddelde moeilijkheid."},{"t":"6","q":"Wat wordt bedoeld met het Flynn-effect?","o":["Het IQ daalt bij elke volgende generatie door minder scholing","Het gemiddelde IQ neemt toe bij elke opeenvolgende generatie, vooral in vloeiende intelligentie","Trainingswinst in werkgeheugen verdwijnt na verloop van tijd volledig","Erfelijkheid van intelligentie daalt naarmate mensen ouder worden"],"a":1,"u":"Het Flynn-effect verwijst naar de stijging van het IQ bij elke volgende generatie, een patroon dat universeel lijkt. Een meta-analyse toont dat het vooral gaat om een toename in vloeiende intelligentie."},{"t":"7","q":"Volgens de brontekst wordt een emotie in termen van bestanddelen gedefinieerd. Welke vier componenten worden onderscheiden?","o":["Subjectieve ervaring, lichaamsveranderingen, denken/cognitie en specifieke actietendensen","Prikkel, respons, bekrachtiging en uitdoving","Gezichtsexpressie, taal, gedrag en cultuur","Arousal, valentie, motivatie en herinnering"],"a":0,"u":"De tekst definieert een emotie via vier componenten: een specifieke subjectieve ervaring (gevoel/affect), lichamelijke veranderingen (meestal in het zenuwstelsel), een invloed op denken/cognitie en specifieke actietendensen waarbij de kans op bepaald gedrag stijgt."},{"t":"7","q":"Een student interpreteert dezelfde onvoldoende heel anders dan een klasgenoot en ervaart daardoor een andere emotie. Op welke theorie van emotionele toestanden wijst dit voorbeeld?","o":["De universaliteitshypothese","De appraisal- of waardetheorie","Eysencks biologische theorie","De drempeltheorie"],"a":1,"u":"Volgens de appraisal- of waardetheorie interpreteert een persoon de omgeving in functie van eigen zorgen, attitudes en noden, zodat verschillen in interpretatie van dezelfde situatie tot verschillende emoties leiden."},{"t":"7","q":"Wat is het kernverschil tussen een emotionele toestand (state) en een emotionele trek (trait)?","o":["Een toestand is voorbijgaand en situatiegebonden, terwijl een trek een stabiel patroon van emotionele reacties over uiteenlopende situaties is","Een toestand is meetbaar, terwijl een trek niet gemeten kan worden","Een toestand komt enkel bij extraverten voor, een trek enkel bij neurotici","Een toestand is aangeboren, terwijl een trek volledig aangeleerd is"],"a":0,"u":"Een emotionele toestand is van voorbijgaande aard en hangt af van de interactie tussen individu en omgeving, terwijl een emotionele trek een dispositie is: een patroon van emotionele reacties dat iemand geneigd is te stellen over een reeks uiteenlopende situaties."},{"t":"7","q":"Wat is het belangrijkste onderscheid tussen de categorische en de dimensionale benadering van emoties?","o":["De categorische benadering meet enkel intensiteit, de dimensionale enkel inhoud","De categorische benadering steunt op factoranalyse, de dimensionale op gezichtsexpressies","De categorische benadering geldt alleen voor negatieve emoties, de dimensionale alleen voor positieve","De categorische benadering ziet emoties als afzonderlijke basisemoties, de dimensionale plaatst elke emotie op onderliggende affectieve dimensies"],"a":3,"u":"De categorische benadering gaat uit van een beperkt aantal onderscheiden basisemoties met elk eigen kenmerken, terwijl de dimensionale benadering elke emotie voorstelt als een positie op enkele onderliggende affectieve dimensies zoals aangenaam/onaangenaam en opwinding/geen opwinding."},{"t":"7","q":"Welke twee basisdimensies worden in de dimensionale benadering breed gedeeld om emoties te ordenen?","o":["Inhoud en stijl","Aangenaam/onaangenaam (plezier) en opwinding/geen opwinding (arousal)","Extraversie en neuroticisme","Adjacency en bipolariteit"],"a":1,"u":"Er bestaat consensus over twee basisdimensies: aangenaam versus onaangenaam (pleasure) en opwinding versus geen opwinding (arousal); elke emotie correspondeert met een combinatie van beide in deze tweedimensionale ruimte."},{"t":"7","q":"In het circumplexmodel van Russell betekent het principe dat de dimensies onderling onafhankelijk zijn:","o":["Adjacency","Bipolariteit","Appraisal","Orthogonaliteit"],"a":3,"u":"Orthogonaliteit houdt in dat de dimensies onafhankelijk (orthogonaal) van elkaar staan. Adjacency verwijst naar sterkere samenhang van nabije emoties, en bipolariteit naar de twee tegengestelde polen per dimensie."},{"t":"7","q":"In de positieve psychologie bestaat geluk uit twee componenten. Welke omschrijving klopt?","o":["Lage neuroticisme en lage extraversie","Tevredenheid met het leven en een overwicht van positieve op negatieve emoties","Afwezigheid van elke negatieve emotie en constante euforie","Een hoog inkomen en een hoge sociale status"],"a":1,"u":"De hedendaagse definitie omvat twee componenten: tevreden zijn met het leven en een overwicht van positieve ten opzichte van negatieve emoties (de hedonistische balans, geschat op ongeveer 2.9 volgens Fredrickson en Losada)."},{"t":"7","q":"De brontekst gebruikt de drempeltheorie om de relatie tussen geld en geluk te verklaren. Wat stelt deze theorie?","o":["Onder een bepaalde inkomensdrempel stijgt de kans op ongelukkig zijn, maar boven die drempel is er nauwelijks nog verband tussen rijkdom en geluk","Hoe rijker het land, hoe ongelukkiger de bevolking","Meer inkomen leidt altijd evenredig tot meer geluk, zonder plafond","Enkel erfelijkheid bepaalt geluk, geld speelt geen enkele rol"],"a":0,"u":"Volgens de drempeltheorie brengt het ontbreken van voldoende inkomen miserie (onder de drempel meer kans op ongelukkig zijn), maar boven een bepaalde drempel is er geen verband meer tussen geluk en rijkdom; de aanwezigheid van rijkdom garandeert dus geen geluk."},{"t":"7","q":"Volgens Eysencks biologische theorie ligt neuroticisme aan de basis van welk hersenmechanisme?","o":["Een neiging van het limbisch systeem om snel geactiveerd te raken","Een tekort aan dopamine in het striatum","Een tragere werking van de rechterhemisfeer","Een verhoogde activiteit van de prefrontale cortex"],"a":0,"u":"Eysenck stelt dat neuroticisme voortkomt uit de neiging van het limbisch systeem om snel geactiveerd te raken; dit systeem staat in voor emoties en vecht-vluchtreacties bij stress. Hij bood indirecte aanwijzingen zoals de stabiliteit en overerfbaarheid van N."},{"t":"8","q":"Wat verstaan onderzoekers onder het begrip 'uitgelokte cultuur' (evoked culture)?","o":["Overtuigingen en waarden die door observatie en interactie van lid op lid worden doorgegeven","Persoonlijkheidstrekken die in elke cultuur ter wereld op dezelfde manier voorkomen","Culturele verschillen die ontstaan doordat een universeel mechanisme verschillend reageert op uiteenlopende omgevingsinvloeden","Waarden die oorspronkelijk enkel bij een kleine groep met hoge status leefden"],"a":2,"u":"Uitgelokte cultuur ziet culturele verschillen als kenmerken die ontstaan als voorspelbare respons op verschillende omgevingsinvloeden. Ze vereist een universeel onderliggend mechanisme en omgevingsverschillen die dat mechanisme anders uitlokken, zoals zweten bij verschillende buitentemperaturen."},{"t":"8","q":"Volgens de verklaring rond het delen van voedsel zullen groepen elkaars opbrengsten vooral verdelen wanneer:","o":["de groepsleden dezelfde religieuze overtuiging delen","de cultuur sterk hierarchisch is met grote economische ongelijkheid","de opbrengst vooral van de eigen inspanning afhangt, zoals bij gekweekte gewassen","de voedselvoorraad van dag tot dag sterk wisselt, zoals bij het jagen op wild"],"a":3,"u":"Bij hoge variatie in de voedselvoorraad, bijvoorbeeld jagers die de ene dag geluk hebben en de andere niet, is dagelijks delen een verstandig besluit. Dit gaat samen met meer gelijkheid, terwijl lage variatie tot egoistischer en hierarchischer gedrag leidt."},{"t":"8","q":"Volgens de theorie van Belsky en collega's ontwikkelen kinderen die opgroeien in een onstabiele, onvoorspelbare omgeving later vaker:","o":["een sterk gewetensvolle houding met laat seksueel debuut","een stabiele lange termijn bindingsstrategie met een vaste partner","een uitgesproken voorkeur voor kuisheid en maagdelijkheid","korte termijn en promiscue seksuele strategieen"],"a":3,"u":"Belsky et al. stellen dat een instabiele omgeving korte termijn en promiscue strategieen uitlokt, omdat kinderen leren dat ze niet op iemand kunnen rekenen en onmiddellijke voldoening zoeken. Kinderen uit stabiele gezinnen ontwikkelen eerder conscientieusheid en worden later seksueel actief."},{"t":"8","q":"In China duren huwelijken volgens de besproken voorbeelden langer en is scheiding zeldzaam, terwijl er in Zweden meer echtscheidingen en buitenechtelijke kinderen zijn. Hoe past dit in het model van uitgelokte cultuur?","o":["Beide culturen tonen exact dezelfde strategie, enkel de display rules verschillen","Verschillen in opvoedingsstijl en omgeving lokken verschillende seksuele strategieen uit, die zichzelf vervolgens in stand houden","Het bewijst dat seksuele strategieen volledig genetisch bepaald zijn","De westerse trektermen zijn niet vertaalbaar naar de Chinese context"],"a":1,"u":"Sterke ouderlijke investering in China hangt samen met een lange termijn strategie en veel belang aan kuisheid, terwijl Zweden meer neigt naar een korte termijn strategie. Deze omgevings- en opvoedingsverschillen lokken ander gedrag uit dat zichzelf in stand houdt."},{"t":"8","q":"Nisbett verklaart de sterkere goedkeuring van agressie na provocatie in het zuiden van de VS vooral door:","o":["de sterkere nadruk op inter-afhankelijkheid en collectivisme","de grotere prevalentie van ziektekiemen in het zuiden","een aangeboren hoger testosterongehalte bij zuiderlingen","het grote belang dat aan eer wordt gehecht, gekoppeld aan de economische wijze van onderhoud"],"a":3,"u":"Volgens Nisbett draait het bepalende verschil om het belang van eer, dat samenhangt met de economische achtergrond. Bij een kudde-economie loont een sterke reactie op provocatie, bijvoorbeeld veediefstal, want een agressieve reputatie schrikt dieven af, terwijl landbouwmiddelen moeilijker te stelen zijn."},{"t":"8","q":"In de labostudie van Cohen en collega's werden blanke mannen door een handlanger beledigd. Wat was het opvallende resultaat bij mannen uit het zuiden?","o":["Ze reageerden sterker, met onder meer een stijging van testosteron en minder uitwijken bij een nieuwe ontmoeting","Ze pasten hun antwoord aan afhankelijk van de aanwezigheid van de testleider","Ze vertoonden lagere agressie dan mannen uit het noorden","Ze negeerden de belediging volledig om hun kalmte te tonen"],"a":0,"u":"De belediging had een grotere impact op mannen uit het zuiden, de cultuur van de eer. Zij toonden meer agressie, een stijgend testosterongehalte en weken bij een nieuwe ontmoeting met de handlanger minder uit."},{"t":"8","q":"Markus en Kitayama beschrijven twee fundamentele culturele taken. Wat houdt de taak 'onafhankelijkheid' (agency) in?","o":["Rekening houden met wat anderen denken om niet bespot te worden","Je zelfbeeld volledig baseren op hoe ouders en anderen je zien","Je inzetten voor de groep en je verbondenheid met familie en cultuurgenoten benadrukken","Jezelf differentieren van de grotere groep en je eigen ideeen en vaardigheden nastreven"],"a":3,"u":"Onafhankelijkheid of agency verwijst naar hoe iemand zich onderscheidt van de grotere groep, eigen ideeen nastreeft en eigen vaardigheden inzet, wat samenhangt met individualiteit. Inter-afhankelijkheid of communion draait daarentegen om verbondenheid met de groep."},{"t":"8","q":"Een atleet uit de VS zegt na een overwinning: 'Ik heb alles gegeven en mijn inspanningen worden nu beloond.' Een Chinese atleet benadrukt vooral de steun van trainer, ploeggenoten en familie. Welk cultureel verschil illustreert dit?","o":["Self-enhancement tegenover display rules","Uitgelokte cultuur tegenover overgedragen cultuur","Analytische tegenover holistische emotieherkenning","Individualisme met nadruk op het zelf tegenover collectivisme met nadruk op de groep"],"a":3,"u":"De Amerikaanse atleet beschrijft de prestatie in individualistische, op het zelf gerichte termen, terwijl de Chinese atleet de groep en verbondenheid benadrukt. Dit sluit aan bij het onderscheid van Triandis tussen individualisme en collectivisme."},{"t":"8","q":"Wat is de kern van 'self-enhancement' zoals besproken in het hoofdstuk?","o":["Het onderdrukken van emotionele expressie in aanwezigheid van anderen","De neiging om zichzelf in positieve en sociaal wenselijke termen te beschrijven","Het vermogen om vlot woorden uit een categorie te benoemen","Het proces waarbij men de waarden van een nieuwe cultuur overneemt"],"a":1,"u":"Self-enhancement is de tendens om zichzelf in positieve en sociaal wenselijke termen te beschrijven, met kenmerken als aardig, slim en hardwerkend. Proefpersonen uit de VS neigen hier sterker toe dan proefpersonen uit Aziatische landen zoals Korea en Japan."},{"t":"8","q":"Wat concluderen McCrae en collega's uit hun grootschalige OCEAN-onderzoek bij 51 culturen, en wat blijkt uit vertaalde vragenlijsten?","o":["Landenstereotypen over persoonlijkheid worden sterk bevestigd door de gemeten trekken","De persoonlijkheidsprofielen tonen slechts kleine verschillen en de factorstructuur van het vijffactorenmodel wordt cross-cultureel grotendeels gerepliceerd","Het vijffactorenmodel faalt volledig buiten westerse, individualistische culturen","Elke cultuur heeft een volledig uniek en niet vergelijkbaar persoonlijkheidsprofiel"],"a":1,"u":"McCrae et al. vonden slechts kleine verschillen tussen culturen en het is opvallend hoe gelijk de profielen zijn. Vertaalde B5-vragenlijsten leveren in veel landen dezelfde structuur op, al blijft de vijfde factor openheid soms wat afwijken en worden landenstereotypen niet ondersteund."},{"t":"9","q":"Wat wordt in dit hoofdstuk verstaan onder een 'geslachtsverschil'?","o":["Een aangeboren biologisch verschil dat nooit door de omgeving beïnvloed wordt","Elk waarneembaar verschil tussen twee willekeurige individuen","Het gemiddelde verschil tussen mannen en vrouwen op een bepaald kenmerk","Een stereotype overtuiging over hoe mannen en vrouwen zich zouden gedragen"],"a":2,"u":"Een geslachtsverschil wordt gedefinieerd als het gemiddelde verschil tussen mannen en vrouwen op het vlak van een bepaald kenmerk, bijvoorbeeld dat mannen gemiddeld een bal verder gooien."},{"t":"9","q":"Waarom geeft een meta-analyse met Cohen's d een beter beeld van geslachtsverschillen dan enkel een significantietoets (t-toets)?","o":["Omdat d altijd aantoont dat verschillen groter zijn dan gedacht","Omdat een t-toets nooit gebruikt kan worden bij grote groepen","Omdat d enkel significante resultaten telt en de rest weglaat","Omdat d de grootte van het verschil weergeeft en niet afhankelijk is van de steekproefgrootte"],"a":3,"u":"Significantie hangt sterk af van de steekproefgrootte, waardoor bij grote groepen bijna alles significant wordt. Cohen's d drukt het verschil uit in standaarddeviaties en geeft zo een objectieve maat voor de grootte los van de steekproef."},{"t":"9","q":"Wat is het centrale verschil tussen minimalisten en maximalisten in het debat over geslachtsverschillen?","o":["Minimalisten geloven enkel in biologische oorzaken, maximalisten enkel in socialisatie","Minimalisten gebruiken t-toetsen, maximalisten gebruiken uitsluitend stereotypen","Minimalisten onderzoeken kinderen, maximalisten enkel volwassenen","Minimalisten benadrukken de overlap tussen groepen, terwijl maximalisten stellen dat zelfs kleine effecten belangrijke gevolgen kunnen hebben"],"a":3,"u":"Minimalisten omschrijven geslachtsverschillen als klein en zonder grote gevolgen en focussen op de overlap. Maximalisten vinden dat de grootte niet geminimaliseerd mag worden omdat zelfs kleine effecten, bijvoorbeeld op agressie, over lange tijd grote gevolgen kunnen hebben."},{"t":"9","q":"Volgens Bandura's sociale leertheorie ontstaan verschillen tussen jongens en meisjes vooral doordat kinderen:","o":["Automatisch androgyne eigenschappen ontwikkelen","Andere adaptieve problemen tegenkomen dan het andere geslacht","Gedrag leren door seksegenoten te observeren","Hogere testosteronniveaus ontwikkelen na de puberteit"],"a":2,"u":"In de socialisatiebenadering stelt Bandura's sociale leertheorie dat jongens en meisjes gedrag leren door seksegenoten te observeren, naast het feit dat mannelijk en vrouwelijk gedrag afzonderlijk bekrachtigd wordt."},{"t":"9","q":"De studie van Schmitt et al. (2008) bij meer dan 17.000 personen uit 55 culturen leverde welk resultaat op dat lastig te rijmen is met de sociale roltheorie?","o":["Persoonlijkheidsverschillen verdwenen volledig in landen met gelijke rollen","In alle culturen waren de persoonlijkheidsverschillen exact even groot","Enkel in armere landen bestonden er persoonlijkheidsverschillen","Landen met meer seksuele gelijkheid vertoonden juist de grootste persoonlijkheidsverschillen tussen mannen en vrouwen"],"a":3,"u":"De sociale roltheorie zou voorspellen dat meer gelijke rollen tot gelijkere persoonlijkheden leiden. Schmitt et al. vonden echter het tegengestelde patroon: juist landen met meer seksuele gelijkheid toonden de grootste persoonlijkheidsverschillen."},{"t":"9","q":"Studies koppelen testosteron aan gedrag zoals seksueel verlangen, maar waarschuwen dat men voorzichtig moet zijn met conclusies. Waarom?","o":["Testosteron heeft bewezen geen enkel verband met gedrag","Testosteron kan niet gemeten worden in bloed","Het gaat om correlaties en de link kan bi-directioneel zijn, want ook de omgeving beïnvloedt het testosteronniveau","Enkel mannen hebben testosteron, dus een vergelijking is onmogelijk"],"a":2,"u":"De verbanden zijn correlationeel en doen geen uitspraak over oorzaak. De richting kan bi-directioneel zijn: zo stijgt testosteron bij fans wanneer hun sportteam wint en daalt het bij verlies, wat toont dat de omgeving het niveau kan sturen."},{"t":"9","q":"Op welk domein voorspelt de evolutionair-psychologische benadering (Buss) geslachtsverschillen?","o":["Op domeinen waar mannen en vrouwen andere adaptieve problemen tegenkomen, zoals seksualiteit en agressie","Enkel op cognitieve vaardigheden zoals wiskunde en taal","Enkel op domeinen die volledig door socialisatie bepaald worden","Op alle persoonlijkheidsdomeinen in gelijke mate"],"a":0,"u":"Volgens Buss worden geslachtsverschillen enkel verwacht op die domeinen waar mannen en vrouwen andere adaptieve problemen en uitdagingen tegenkomen. Onderzoek vindt hiervoor evidentie op vlakken zoals seksualiteit, partnerselectie en agressie."},{"t":"9","q":"In de meta-analyse van Else-Quest et al. (2006) naar temperament bij kinderen scoorden jongens hoger op 'surgency'. Wat omvat surgency?","o":["Het detecteren van subtiele stimuli in de omgeving","Gevoelens van angst en vrees","Het vermogen om ongepaste reacties af te remmen","Toenaderingsgedrag, hoge activiteit en impulsiviteit"],"a":3,"u":"Surgency verwijst naar toenaderingsgedrag, hoge activiteit en impulsiviteit, waarop jongens hoger scoorden (d = +.38). Inhiberende controle en perceptuele sensitiviteit waren juist hoger bij meisjes."},{"t":"9","q":"Bij agressie neemt de effectgrootte toe naargelang de meetmethode. Welke volgorde weerspiegelt dit correct (van klein naar groot)?","o":["Zelfrapportage (d = .40), peervragenlijsten (d = .63), projectieve technieken (d = .86)","Peervragenlijsten (d = .40), zelfrapportage (d = .63), fantasieën (d = .86)","Alle methodes geven exact hetzelfde effect (d = .60)","Projectieve technieken (d = .40), peervragenlijsten (d = .63), zelfrapportage (d = .86)"],"a":0,"u":"Mannen scoren hoger op fysieke agressie, maar het effect groeit met de methode: zelfrapportage geeft een klein effect (d = .40, omdat mensen niet graag toegeven agressief te zijn), peervragenlijsten een medium effect (d = .63), en fantasieën en projectieve technieken grote effecten (d = .84 en .86)."},{"t":"9","q":"Wat betekende het concept 'androgynie' dat in de jaren 1970 werd ontwikkeld door onder meer Bem en Spence?","o":["Dat mannelijkheid en vrouwelijkheid aparte, onafhankelijke dimensies zijn waarop iemand tegelijk ho
