og kan scoren","Dat mannelijkheid en vrouwelijkheid de twee polen van een enkele dimensie vormen","Dat gender volledig biologisch bepaald is door hormonen","Dat enkel mannelijke eigenschappen als een ideaal gelden"],"a":0,"u":"Vanaf de jaren 1970 zag men mannelijkheid en vrouwelijkheid niet langer als tegenpolen van een dimensie, maar als aparte onafhankelijke dimensies met eigen schalen. Wie hoog scoort op beide werd androgyn genoemd, wat destijds als een ideaal werd gezien."},{"t":"10","q":"Wat is het onderscheid tussen het indirecte en het directe model van de relatie tussen persoonlijkheid en emotie?","o":["Het indirecte model gaat uit van erfelijkheid en het directe model van omgeving","Het indirecte model verklaart negatieve emoties en het directe model uitsluitend positieve emoties","Het indirecte model stelt dat persoonlijkheid via de levensstijl tot emotionele reacties leidt, terwijl het directe model stelt dat persoonlijkheid rechtstreeks verschillen in emotionele ervaring veroorzaakt","Het indirecte model geldt enkel voor extraverten en het directe model enkel voor neurotici"],"a":2,"u":"In het indirecte model bepaalt persoonlijkheid de levensstijl die vervolgens emoties oproept, bijvoorbeeld extraversie leidt tot socialer gedrag en zo tot meer positieve ervaringen. In het directe model beinvloedt persoonlijkheid de emotionele reactie meteen, zoals hoog neuroticisme dat leidt tot sterkere negatieve emoties op dezelfde gebeurtenis."},{"t":"10","q":"Onderzoek naar het directe model (Larsen; Zelenski & Larsen) toonde welk verband aan bij reacties op emotie-inducerende stimuli?","o":["Zowel extraversie als neuroticisme voorspellen enkel neutrale reacties","Extraversie voorspelt het best positieve reacties op positieve stimuli en neuroticisme het best negatieve reacties op negatieve stimuli","Extraversie voorspelt het best negatieve reacties en neuroticisme het best positieve reacties","Enkel neuroticisme heeft een effect, extraversie speelt geen rol"],"a":1,"u":"Extraversie was de beste voorspeller van positieve emotionele reacties op positieve stimuli, en neuroticisme de beste voorspeller van negatieve reacties op negatieve stimuli. Persoonlijkheid heeft dus een rechtstreeks effect op emotionele reacties, in interactie met de omgeving."},{"t":"10","q":"De meta-analyse van Lyubomirsky et al. (2005) over de causale richting tussen geluk en levensuitkomsten kwam tot welk besluit?","o":["Er is wederzijdse causaliteit: geluk komt vaak eerst en leidt tot positieve uitkomsten, maar die uitkomsten voeden ook het geluk","Er bestaat geen aantoonbaar verband tussen geluk en levensuitkomsten","Geluk is uitsluitend een gevolg van positieve levensuitkomsten, nooit een oorzaak","Positieve levensuitkomsten leiden tot geluk, maar geluk leidt nooit tot betere uitkomsten"],"a":0,"u":"Longitudinale en experimentele studies toonden dat geluk vaak voorafgaat en leidt tot uitkomsten zoals productief werk, goede relaties en gezondheid. Toch werkt de causaliteit in beide richtingen, waardoor het besluit wederzijdse causaliteit is."},{"t":"10","q":"Welke drie sleutelmechanismen beschrijven de interactie tussen persoonlijkheid en de sociale omgeving?","o":["Attributie, evocatie en compensatie","Manipulatie, projectie en identificatie","Selectie, evocatie en manipulatie","Selectie, imitatie en bekrachtiging"],"a":2,"u":"Persoonlijkheid staat in continue interactie met de sociale omgeving via selectie (situaties kiezen), evocatie (reacties uit de omgeving oproepen) en manipulatie (de omgeving intentioneel vormgeven en beinvloeden)."},{"t":"10","q":"Wat blijkt uit empirisch onderzoek over partnerkeuze met betrekking tot complementariteit versus similariteit?","o":["Tegengestelden trekken elkaar aan op vrijwel alle persoonlijkheidskenmerken","Er is veel steun voor aantrekking op basis van gelijkheid; het enige kenmerk waarop tegengestelden aantrekken is geslacht","Complementariteit en similariteit worden even sterk empirisch ondersteund","Er is geen enkele empirische steun voor similariteit bij partnerkeuze"],"a":1,"u":"Studies vinden zeer veel steun voor aantrekking op basis van gelijkheid, het zogenaamde assortative mating. Het enige kenmerk waarop tegengestelden zich tot elkaar aangetrokken voelen is geslacht, dus voor complementaire behoefte is er geen empirische ondersteuning."},{"t":"10","q":"Volgens onderzoek van Botwin (1997) hangt relatietevredenheid vooral samen met welke factor?","o":["De mate van gelijkheid tussen de persoonlijkheid van beide partners","De mate waarin de partner tegengesteld is aan zichzelf","Uitsluitend de fysieke aantrekkelijkheid van de partner","De persoonlijkheid van de partner op zich, zoals aangenaam, emotioneel stabiel en open zijn"],"a":3,"u":"Relatietevredenheid hangt niet samen met de gelijkheid tussen partners, maar wel met de persoonlijkheid van de partner op zich. Mensen zijn zeer gelukkig met een zeer aangename, emotioneel stabiele en open partner, ook al zoeken we wel iemand die op ons lijkt."},{"t":"10","q":"Iemand rijdt net voor jou een parkeerplaats in en jij interpreteert dit meteen als opzettelijke vijandigheid. Welk concept illustreert dit voorbeeld het best?","o":["Assortative mating","Vijandige attributie bias","Impression management","Affective forecasting"],"a":1,"u":"De vijandige attributie bias is de neiging om gedrag van anderen als vijandig te interpreteren, vooral in ambigue situaties. Omdat men vijandigheid verwacht, stelt men zich agressief op, wat weer agressie uitlokt en zo een spiraal van geweld vormt."},{"t":"10","q":"Wat houdt verwachtingsbevestiging (expectancy confirmation) als specifieke vorm van evocatie in?","o":["Het beeld dat men van iemands persoonlijkheid heeft, stuurt het eigen gedrag zo dat de ander zich conform dat beeld gaat gedragen","Het bewust manipuleren van anderen door beloningen in te zetten","Het selecteren van omgevingen die passen bij je persoonlijkheid","Het accuraat voorspellen van je eigen toekomstige emoties in een bepaalde situatie"],"a":0,"u":"Bij verwachtingsbevestiging beinvloedt het beeld dat men van iemands persoonlijkheid heeft de manier waarop men met die persoon omgaat, zodat die zich gedraagt conform het beeld. Dit lijkt sterk op een self fulfilling prophecy, zoals aangetoond in het onderzoek van Snyder en Swann waarin proefpersonen agressiever werden behandeld en zelf agressiever reageerden."},{"t":"10","q":"Wat kenmerkt volgens de leerstof een persoon die hoog scoort op machiavellisme in sociale interactie?","o":["Manipulatief, cynisch, weinig vertrouwen in anderen en zonder empathie, met een kortetermijn uitbuitende strategie","Empathisch en geneigd anderen als fundamenteel goed te zien","Vermijdt elke vorm van sociale beinvloeding en trekt zich terug","Sterk gericht op wederzijdsheid, samenwerking en langetermijnstrategieen"],"a":0,"u":"Wie hoog scoort op machiavellisme is manipulatief, cynisch, vertrouwt anderen niet en toont geen empathie, en gebruikt anderen om te krijgen wat men wil. De kortetermijnstrategie is uitbuitend en zelfbedienend, en het succes ervan hangt af van de context, met name situaties met weinig regels en structuur."}],"theory":[{"h":"Inleiding & kennisdomeinen","items":["Universele benadering: uitgangspunt van klassieke theorieen dat fundamentele processen en kenmerken voor alle mensen gelden.","Freuds model: universeel voorbeeld waarbij iedereen een Id, ego en superego heeft.","Differentiele psychologie: hedendaagse aanpak die de nadruk legt op individuele en groepsverschillen in plaats van op universele kenmerken.","Perspectief: elke onderzoeker vertrekt vanuit een eigen invalshoek die slechts een deel van de waarheid omvat.","Kennisdomein: gespecialiseerd gebied binnen de psychologie gericht op specifieke, beperkte aspecten van de menselijke natuur.","Integratie: het samenbrengen van de expertise uit alle domeinen om een volledig beeld van de persoonlijkheid te krijgen.","Dispositioneel domein: richt zich op de manieren waarop individuen van elkaar verschillen en doorkruist daardoor alle andere domeinen.","Fundamentele disposities: de belangrijkste, te identificeren manieren waarop individuen van elkaar verschillen.","Biologisch domein: beschouwt mensen als verzamelingen biologische systemen en bestudeert de genetische, fysiologische en evolutionaire basis van persoonlijkheid.","Intrapsychiatrisch domein: bestudeert vaak onbewuste mentale mechanismen, zoals afweermechanismen (onderdrukking, ontkenning, projectie) en motieven voor power, achievement en intimacy.","Cognitief en ervaringsdomein: richt zich op bewuste gedachten, gevoelens en overtuigingen, waaronder zelfconcept, streefdoelen, emotionele ervaringen en intelligentie.","Sociaal en cultureel domein: onderzoekt hoe persoonlijkheid cultuur en sociale context beinvloedt en er zelf door beinvloed wordt, bv. culturele verschillen in agressie.","Domein van aanpassing: bekijkt de sleutelrol van persoonlijkheid bij coping en aanpassing, en de band met gezondheid en persoonlijkheidsstoornissen.","TAT: projectieve methode die binnen het intrapsychiatrische domein motieven zoals power, achievement en intimacy in kaart brengt."]},{"h":"Trekken over de tijd: stabiliteit & verandering","items":["Persoonlijkheidsontwikkeling: de samenhang, consistentie en stabiliteit van eigenschappen doorheen de tijd, samen met de manieren waarop mensen veranderen.","Coherentie: een vorm van stabiliteit waarbij de onderliggende trek gelijk blijft, ook al verandert de concrete gedragsuiting met de leeftijd.","Rangorde stabiliteit: je relatieve positie ten opzichte van anderen blijft doorheen de tijd ongeveer dezelfde.","Gemiddelde niveau stabiliteit: het gemiddelde niveau van een trek in de bevolking blijft over de tijd gelijk, ook al wordt de groep ouder.","Intern (kenmerk van verandering): een echte verandering zit in de persoon zelf, niet enkel in een gewijzigde omgeving of situatie.","Aanhoudend (kenmerk van verandering): een echte verandering houdt aan doorheen de tijd en is niet tijdelijk zoals een stemming of roes.","Drie analyseniveaus: populatieniveau (trends voor iedereen), groepsverschillen niveau (specifiek voor bepaalde groepen) en individueel verschilniveau (voorspellingen voor specifieke personen).","Temperament: individuele verschillen die vroeg tot uiting komen, meestal erfelijk zijn en te maken hebben met emotioneel gedrag en prikkelbaarheid (arousal).","Temperamentsmodel of gipsmodel: de opvatting dat persoonlijkheid biologisch bepaald en aangeboren is en dus weinig verandert over de tijd.","Longitudinale studie: onderzoek waarbij dezelfde groep individuen op verschillende tijdstippen gevolgd en gemeten wordt.","Stabiliteitscoëfficiënt: de correlatie tussen dezelfde maat op twee tijdstippen (test-hertest), die daalt naarmate het tijdsinterval groter wordt.","Validiteitscoëfficiënt: de correlatie tussen twee verschillende meetmethoden van dezelfde trek op hetzelfde moment.","Cohort effect: veranderingen doorheen de tijd die toe te schrijven zijn aan het leven in andere tijden in plaats van aan echte inherente persoonlijkheidsverandering.","Persoonlijkheidsfluctuatie: variabiliteit rond een stabiel trekniveau van moment tot moment, te stabiel om verandering te heten en te veranderlijk om stabiel te heten."]},{"h":"Genen & persoonlijkheid","items":["Genoom: de volledige verzameling genen van een organisme, ongeveer 20.000 tot 25.000 genen verdeeld over 23 paar chromosomen.","Genotype: de genetische constellatie van een organisme, dus de onderliggende erfelijke aanleg.","Fenotype: het uiterlijke voorkomen en eindproduct zoals gedrag, fysieke kenmerken en persoonlijkheid zoals die zich voordoen.","Erfelijkheid: de proportie van de fenotypische variatie in een groep die toegeschreven kan worden aan genotypische (genetische) variatie.","Omgevingsbepaaldheid: de proportie geobserveerde variatie in een groep die aan omgevingsvariatie te wijten is, doorgaans omgekeerd evenredig aan de erfelijkheid.","Nature-nurture debat: de discussie over genen versus omgeving die enkel zinvol is voor variatie in een groep, niet voor een individu waar beide altijd samenwerken.","Selectief kweken: dieren met bepaalde eigenschappen laten paren; als dit slaagt wijst het op deels erfelijke trekken, maar het is niet ethisch bij mensen.","Familiestudies: correleren genetische overlap met gelijkenis, maar kampen met een confound omdat verwanten ook hun omgeving delen.","Monozygoot (MZ) versus dizygoot (DZ): eeneiige tweelingen zijn zo goed als 100% genetisch identiek, twee-eiige delen gemiddeld 50% zoals gewone siblings.","Adoptiestudies: scheiden genen en omgeving volledig en hebben de gelijke-omgevingsassumptie niet nodig, al blijft representativiteit een aandachtspunt.","Gedeelde versus niet-gedeelde omgeving: siblings delen bepaalde aspecten (thuismilieu), maar voor persoonlijkheid wegen vooral de niet-gedeelde, unieke ervaringen door.","Genotype-omgevingsinteractie: individuen met een verschillend genotype reageren anders op dezelfde omgeving.","Genotype-omgevingscorrelatie: personen met een bepaald genotype worden systematisch aan andere omgevingen blootgesteld, in een passieve, reactieve of actieve vorm.","Moleculaire genetica: zoekt specifieke genen zoals DRD4 (gelinkt aan novelty seeking) en SNP's, al blijven de gevonden effecten klein en moeilijk te repliceren."]},{"h":"Fysiologische benaderingen","items":["Fysiologische indicator: fysiologisch kenmerk dat samenhangt met persoonlijkheid of gedrag zonder noodzakelijk causaal verband, zoals hartslag bij angst.","Fysiologisch causaal substraat: fysiologisch kenmerk dat de werkelijke oorzaak vormt van een persoonlijkheidseigenschap, zoals verschillen in hersenactiviteit die emotionaliteit veroorzaken.","Elektrodermale respons: meting van huidgeleiding die stijgt bij zweten, aangestuurd door het sympathische deel van het autonoom zenuwstelsel en gelinkt aan angst en Neuroticisme.","Cardiovasculaire activiteit: bloeddruk en hartslag als maat voor reactiviteit op stress, waarbij een hogere waarde voorbereiding tot actie weergeeft.","Hartreactiviteit: individuele verschillen in hoe sterk de hartactiviteit verandert onder stimulatie, geassocieerd met type A persoonlijkheid en risico op hart- en vaatziekten.","EEG: meting van spontane elektrische hersenactiviteit via elektroden op het hoofd, ook gebruikt in de evoked potential techniek bij het aanbieden van een stimulus.","Brain imaging (PET en fMRI): technieken die functie en structuur van hersengebieden tonen door bloeddoorstroming te meten tijdens een taak.","ARAS: het Ascending Reticular Activating System dat de corticale opwinding regelt en centraal staat in Eysencks theorie over extraversie en introversie.","Reactiviteitsverfijning van Eysenck: introverten en extraverten verschillen niet in basisarousal maar in reactiviteit, waarbij introverten sneller en sterker opgewonden raken bij stimulatie.","Gedragsactivatiesysteem (BAS): systeem van Gray dat reageert op beloning, toenaderingsgedrag reguleert en impulsiviteit produceert, de versneller.","Gedragsinhibitiesysteem (BIS): systeem van Gray dat reageert op straf, frustratie en onzekerheid, vermijdingsgedrag reguleert en angst produceert, de rem.","Sensatiezucht: tendens om spanning en risico op te zoeken en verveling tegen te gaan, door Zuckerman gelinkt aan lage MAO-niveaus en gemeten met de Sensation Seeking Scale.","Neurotransmitters en persoonlijkheid: dopamine hangt samen met plezier, een tekort aan serotonine met depressie en agressie, en norepinefrine met de vecht- of vluchtrespons.","Ochtendtype en avondtype: stabiele verschillen in wanneer mensen actief zijn, veroorzaakt door verschillen in het onderliggende circadiaanse ritme met een cyclus rond 24 tot 25 uur."]},{"h":"Evolutionaire benadering","items":["Natuurlijke selectie: eigenschappen met overlevingswaarde krijgen een grotere kans om overgeërfd te worden.","Seksuele selectie: eigenschappen met voortplantingswaarde krijgen een grotere kans om overgeërfd te worden, ook als ze de overleving niet dienen.","Adaptatie: een betrouwbaar ontwikkelende, overgeërfde structuur die een oplossing vormt voor een adaptief probleem door interactie met de terugkerende structuur van de wereld.","Adaptief probleem: alles wat overleving of reproductie belemmert, zoals natuurgeweld, rivalen, voedseltekort en ziekten.","Intraseksuele competitie: leden van hetzelfde geslacht wedijveren onderling om seksuele toegang tot het andere geslacht.","Interseksuele competitie: leden van een sekse kiezen hun partner op basis van diens eigenschappen, zoals gezondheid of status.","Differentiële genreproductie: het basismechanisme van evolutie waarbij genen die tot overleven en voortplanten leiden vaker worden doorgegeven.","Inclusieve fitheid (Hamilton, 1964): het eigen reproductieve succes plus het effect op de voortplanting van verwanten, gewogen naar graad van verwantschap.","Nevenproduct: een toevallig effect of bijkomende functie van een adaptatie dat niet voor dat doel geëvolueerd is, zoals de neus die een bril draagt.","Domein-specificiteit: selectie ontwikkelt voor elk adaptief probleem een apart, gericht mechanisme in plaats van één algemene regel.","Need to belong: de fundamentele menselijke nood om ergens bij te horen, met status en aanvaarding door de groep als basismotivaties.","Universele emoties: emoties worden via het gezicht op een universele manier uitgedrukt en herkend omdat hun adaptieve functies universeel zijn (onderzoek van Ekman).","Frequentie-afhankelijke selectie: een eigenschap heeft enkel waarde als ze in beperkte mate voorkomt, waardoor zeldzame strategieën succesvoller zijn dan frequente.","Big Five als adaptief landschap: mensen hebben detectiemechanismen om te zien hoe anderen met adaptieve problemen omgaan, waarbij zowel hoge als lage scores voor- en nadelen kennen (trade-off)."]},{"h":"Intelligentie","items":["Impliciete intelligentietheorieen: oordelen over intelligentie gebaseerd op de overtuigingen van leken.","Expliciete intelligentietheorieen: formeel door experts afgeleide, empirisch onderbouwde opvattingen over intelligentie.","Entiteitstheorie: de opvatting dat intelligentie een vast, onveranderlijk gegeven is.","Incrementele theorie: de opvatting dat intelligentie kneedbaar is en kan toenemen, samenhangend met betere prestaties en meer zelfregulatie.","g-factor: de algemene intelligentiefactor van Spearman, opgevat als mentale energie die over taken heen transfereerbaar is.","Specifieke vaardigheden (s): unieke vaardigheden die de prestatie op een bepaalde taak mee bepalen naast de g-factor.","Gekristalliseerde intelligentie (gc): verworven feitenkennis zoals woordenschat, die toeneemt tijdens de levensloop.","Vloeiende intelligentie (gf): het vermogen verbanden te zien zonder voorkennis, dat afneemt met de leeftijd.","CHC model: hierarchisch model met een algemene g, brede cognitieve factoren en specifieke vaardigheden, sterk empirisch ondersteund.","Triarchische intelligentietheorie: Sternbergs onderscheid tussen analytische, creatieve en praktische intelligentie.","Meervoudige intelligenties: Gardners theorie van zeven of meer onafhankelijke intelligenties, populair maar weinig empirisch ondersteund.","Deviatie IQ: IQ-maat waarbij de actuele testscore vergeleken wordt met de verwachte score, met gemiddelde 100 en standaardafwijking 15.","Neurale efficientie: intelligentere personen verbruiken minder glucose en tonen sterkere gelokaliseerde hersenactivatie tijdens taken.","Flynn-effect: de generatie na generatie stijgende IQ-scores, vooral in vloeiende intelligentie."]},{"h":"Persoonlijkheid & emoties","items":["Vier emotiecomponenten: een emotie bestaat uit subjectieve ervaring, lichaamsveranderingen, cognitie en specifieke actietendensen.","Functionele definitie: emoties zijn ontwikkeld om de overlevingskansen te verhogen en hebben evolutionair voordeel bij bepaalde omgevingsgebeurtenissen (Darwin, Nesse).","Emotionele toestand (state): een voorbijgaande emotie die afhangt van de interactie tussen individu en omgeving.","Emotionele trek (trait): een stabiel patroon van emotionele reacties dat iemand over uiteenlopende situaties geneigd is te stellen, bijvoorbeeld trek woede of trek angst.","Appraisaltheorie: de waarde die een situatie voor een persoon heeft, kleurt de emotionele ervaring, waardoor mensen verschillend reageren op dezelfde gebeurtenis.","Categorische benadering: een beperkt aantal basisemoties met elk eigen uitlokkers, responssysteem, actietendens en gezichtsexpressie, zoals Ekmans zes primaire emoties.","Universaliteitshypothese: primaire emoties worden overal herkend en op dezelfde manier getoond via vaste neurale en lichamelijke componenten.","Dimensionale benadering: emoties liggen op onderliggende dimensies, met consensus over aangenaam/onaangenaam (pleasure) en opwinding/geen opwinding (arousal).","Circumplex van Russell: georganiseerd volgens adjacency (nabije emoties correleren sterker), bipolariteit (tegengestelde polen) en orthogonaliteit (onafhankelijke dimensies).","Achtergrondemoties (Damasio): bijna onmerkbare, continu aanwezige toestanden zoals vermoeidheid of ontspanning die ons gedrag en denken subtiel sturen.","Inhoud versus stijl: inhoud is welke emoties iemand ervaart (positief of negatief), stijl is hoe iemand ze ervaart (intensiteit en variabiliteit).","Hedonistische balans: de verhouding van positieve tot negatieve emoties, met ongeveer drie keer meer positieve emoties als richtwaarde voor geluk.","Neuroticisme (N): negatieve affectiviteit met angst als kernkenmerk, gekoppeld aan een voorkeurverwerking van negatieve zelfinformatie en aan geluk via lage N.","Affectieve intensiteit: het stabiele individuele verschil in de typische sterkte waarmee emoties beleefd worden, samenhangend met hoge E, hoge N en meer stemmingsvariabiliteit."]},{"h":"Cultuur & persoonlijkheid","items":["Cultuur: opvallende patronen van gelijkenis binnen een lokale groep en verschillen tussen groepen op fysisch, psychologisch en gedragsmatig vlak.","WEIRD: waarschuwing om onderzoek niet te beperken tot Western, Educated, Industrialised, Rich en Democratic populaties.","Uitgelokte cultuur (evoked culture): verschillen ontstaan doordat een universeel mechanisme verschillend reageert op uiteenlopende omgevingsinvloeden.","Overgedragen cultuur (transmitted culture): overtuigingen, waarden en attituden die via observatie en interactie van lid op lid worden doorgegeven.","Culturele universaliteit: trekken en eigenschappen die in bijna alle culturen aanwezig zijn, aansluitend bij evolutionaire psychologie.","Cultuur van eer: culturen waarin een belediging als ernstige provocatie geldt waarop directe agressie de gepaste reactie is, samenhangend met de economische wijze van onderhoud.","Zelfconcept: hoe we onszelf zien en definieren, wat mede door cultuur wordt beinvloed.","Inter-afhankelijkheid (communion): verbondenheid met de groep, jezelf inzetten voor familie, omgeving en cultuurgenoten.","Onafhankelijkheid (agency): jezelf differentieren van de groep en eigen ideeen en vaardigheden nastreven.","Collectivisme versus individualisme (Triandis): het zelf als deel van de groep tegenover het zelf als autonoom met voorrang voor persoonlijke doelen.","Self-enhancement: neiging om zichzelf in positieve en sociaal wenselijke termen te beschrijven, sterker in individualistische culturen.","Acculturatie: proces waarbij iemand de waarden, attituden en gedragingen van een nieuwe cultuur overneemt.","Display rules: cultureel bepaalde regels die voorschrijven hoe emoties zoals walging, trots of woede mogen worden geuit.","Vijffactorenmodel (VFM): OCEAN-structuur die cross-cultureel grotendeels repliceert, al blijkt openheid soms cultuurafhankelijk en dook een zesde factor eerlijkheid en bescheidenheid op."]},{"h":"Geslacht, gender & persoonlijkheid","items":["Geslachtsverschil: het gemiddelde verschil tussen mannen en vrouwen op een bepaald kenmerk.","Gender: een sociale interpretatie van wat het betekent om man of vrouw te zijn.","Cohen's d: maat voor effectgrootte die het verschil tussen groepen uitdrukt in standaarddeviaties, los van de steekproefgrootte (.20 klein, .50 medium, .80 groot).","Minimalisten versus maximalisten: minimalisten benadrukken de overlap en kleine gevolgen, maximalisten stellen dat zelfs kleine effecten belangrijke gevolgen kunnen hebben.","Socialisatietheorie: jongens en meisjes verschillen omdat ze anders opgevoed en bekrachtigd worden, mede via observatie van seksegenoten (sociale leertheorie van Bandura).","Sociale roltheorie (Eagly en Wood): sekseverschillen ontstaan doordat mannen en vrouwen in andere beroeps- en familierollen terechtkomen (mannen leidinggevend, vrouwen zorgend).","Hormonale theorie: fysiologische verschillen zoals testosteron liggen aan de basis van geslachtsverschillen in agressie, dominantie en seksuele drift.","Aangeboren bijnierhyperplasie (CAH): een overactieve bijnier die een vrouwelijke foetus in de baarmoeder hormonaal vermannelijkt.","Evolutionaire theorie (Buss): geslachtsverschillen worden enkel verwacht op domeinen met andere adaptieve problemen, verklaard via ouderinvestering en seksuele selectie.","Temperament (Else-Quest et al.): meisjes scoren hoger op inhiberende controle en perceptuele sensitiviteit, jongens hoger op surgency (toenadering, activiteit, impulsiviteit).","Vijffactorenmodel: doorgaans kleine effecten, met mannen hoger op assertiviteit en agressie en vrouwen hoger op zachtaardigheid en emotionele reactiviteit.","Depressie: in de kindertijd geen verschil, maar vanaf de puberteit twee tot drie keer vaker bij vrouwen, mede verklaard door ruminatie (piekeren over stress).","Jaloezie: mannen zijn vooral seksueel jaloers (onzekerheid over vaderschap), vrouwen vooral emotioneel jaloers (belang van een investerende partner).","Genderstereotypen: overtuigingen over eigenschappen van mannen en vrouwen (cognitief, affectief, gedragsmatig) die echte verschillen overschatten."]},{"h":"Persoonlijkheid & sociale interactie","items":["Indirect model: persoonlijkheid bepaalt de levensstijl, en die levensstijl roept vervolgens emotionele reacties op.","Direct model: persoonlijkheid veroorzaakt rechtstreeks verschillen in emotionele ervaring, bijvoorbeeld hoog neuroticisme geeft sterkere negatieve emoties.","Wederzijdse causaliteit: geluk leidt tot positieve levensuitkomsten, maar die uitkomsten voeden op hun beurt ook het geluk (Lyubomirsky et al.).","Selectie: op basis van je persoonlijkheid zoek je bepaalde situaties, omgevingen en mensen op of vermijd je ze.","Evocatie: je persoonlijkheid lokt reacties uit bij anderen, en hun kenmerken lokken op hun beurt reacties bij jou uit (continue wisselwerking).","Manipulatie: de manieren waarop je intentioneel het gedrag, de gevoelens en het denken van anderen probeert te beinvloeden of te veranderen.","Assortative mating: selectief koppelen waarbij partners op elkaar lijken op kenmerken zoals persoonlijkheid, achtergrond en intelligentie (similariteitshypothese).","Violation of desire theorie: scheiding komt vaker voor wanneer de partner de gewenste kenmerken zoals betrouwbaarheid en emotionele stabiliteit mist (Buss).","Verlegenheid: neiging tot spanning en angst bij (anticipatie van) sociale interactie, met vermijding van sociale situaties en risico op isolatie.","Vijandige attributie bias: neiging om gedrag van anderen, vooral in ambigue situaties, als vijandig te interpreteren, wat een spiraal van geweld voedt.","Verwachtingsbevestiging (expectancy confirmation): je beeld van iemand stuurt je gedrag zo dat die persoon zich conform dat beeld gedraagt, verwant aan de self fulfilling prophecy.","Impression management: het sturen van de indruk die anderen van je krijgen, bijvoorbeeld door enkel de beste foto's op sociale media te plaatsen.","Machiavellisme: manipulatieve strategie waarbij mensen gebruikt worden om te krijgen wat men wil, gemeten met een zelfrapportageschaal (Christie & Geis).","Dark triad: cluster van machiavellisme, narcisme en psychopathie, dat samengaat met meer agressie en normoverschrijdend gedrag en negatief correleert met de HEXACO-factor eerlijkheid-oprechtheid."]}],"hacks":[{"h":"De 6 domeinen: 'Bij Immers Blijft Iedere Coach Sociaal Alert'","t":"De zes kennisdomeinen zijn Dispositioneel, Biologisch, Intrapsychiatrisch, Cognitief-ervaring, Sociaal-cultureel en Aanpassing. Onthoud dat het Dispositionele domein (over verschillen) als enige alle andere domeinen doorkruist, want dat is precies de rode draad van differentiele psychologie."},{"h":"RANG blijft, GEMIDDELDE ligt vast","t":"Onthoud de twee soorten stabiliteit met hun kernwoord: RANGorde gaat over jouw plaats in de RANG ten opzichte van anderen (individueel, relatief), terwijl GEMIDDELDE niveau over het GEMIDDELDE van de hele groep gaat (populatie). Zo verwar je een persoonlijke positie nooit met een groepsscore."},{"h":"PRA: de drie soorten genotype-omgevingscorrelatie","t":"Onthoud PRA voor Passief, Reactief en Actief. Passief: ouders geven genen en omgeving door (kind speelt geen rol). Reactief: de omgeving reageert op het genotype van het kind. Actief: het kind zoekt zelf een passende omgeving op."},{"h":"BAS is de gaspedaal, BIS is de rem","t":"Onthoud Gray's twee systemen met de auto-metafoor: BAS begint met dezelfde letter als 'benzine' en is de versneller die reageert op beloning en toenadering, terwijl BIS klinkt als 'biezen naar de rem' en reageert op straf en vermijding. Zo koppel je BAS aan impulsiviteit en positieve emoties, en BIS aan angst en vermijding."},{"h":"OAI voor de drie domeinen van de evolutionaire psychologie","t":"Onthoud OAI: Overkoepelende menselijke natuur, Andere sekse (geslachtsverschillen) en Individuele verschillen. Zo herinner je de drie domeinen waarover de evolutionaire psychologie hypothesen formuleert, van het meest algemene tot het moeilijkst te verklaren niveau."},{"h":"APC voor Sternbergs triarchische theorie","t":"Onthoud A-P-C: Analytisch (evalueren en vergelijken), Praktisch (toepassen en implementeren) en Creatief (ontdekken en inbeelden). Zo houd je de drie componenten van Sternbergs succesvolle intelligentie uit elkaar."},{"h":"PLADA voor de vier emotiecomponenten","t":"Onthoud PLADA: Plezier/gevoel (subjectieve ervaring), Lichaam (lichaamsveranderingen), Denken (cognitie) en Actietendens. Zo vergeet je geen van de vier bestanddelen waaruit een emotie is opgebouwd."},{"h":"UOU: de drie sleutels tot cultuurverschillen","t":"Onthoud de drie benaderingen met UOU: Uitgelokt (omgeving lokt gedrag uit), Overgedragen (van lid op lid doorgegeven) en Universeel (overal aanwezig). Zeg het als U-Oh-U om de volgorde vast te houden."},{"h":"SHE: de drie theorielagen van geslachtsverschillen","t":"Onthoud SHE voor de drie aanvullende verklaringsniveaus: Socialisatie, Hormonen en Evolutie. Een omvattende theorie brengt deze niveaus samen, want elk levert een plausibele maar op zich onvolledige verklaring."},{"h":"SEM: de drie manieren waarop persoonlijkheid en omgeving elkaar raken","t":"Onthoud SEM: Selectie (je kiest je omgeving), Evocatie (je lokt reacties uit en die lokken reacties bij jou uit) en Manipulatie (je vormt je omgeving actief). Narcisme is het schoolvoorbeeld waarin alle drie samenkomen: bewonderaars selecteren, bewondering of irritatie oproepen en anderen uitbuiten."}]};
</script>

  function ic(n,c){ return '<svg class="ic'+(c?" "+c:"")+'" viewBox="0 0 24 24" aria-hidden="true">'+(P[n]||"")+'</svg>'; }

  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }

  var calm=lget("diffpsy_calm",true);
  function applyCalm(){ document.documentElement.classList.toggle("snappy", !calm); }

  var WARM=["Geen zorgen, hier leer je nu net van.","Bijna! Dit type vraag krijg je zo onder de knie.","Foutje mag, nu weet je wat je nog moet herhalen.","Niet erg, dit onthoud je de volgende keer wél.","Rustig, één foutje zegt niets over je examen."];

  function getProg(){ var p=lget("diffpsy_prog",{ans:{}}); if(!p||typeof p!=="object"||!p.ans)p={ans:{}}; return p; }
  function recordProg(qid,ok){ var p=getProg(); p.ans[qid]=ok?1:0; lset("diffpsy_prog",p); }
  function resetProg(){ lset("diffpsy_prog",{ans:{}}); }
  function chapterStats(){ var p=getProg(); var st={}; Object.keys(TOPICS).forEach(function(k){st[k]={total:0,done:0,correct:0};}); D.questions.forEach(function(q){ var s=st[q.t]; if(!s)return; s.total++; if(Object.prototype.hasOwnProperty.call(p.ans,q.id)){ s.done++; if(p.ans[q.id])s.correct++; } }); return st; }
  function startChapter(k){ var items=shuffle(D.questions.filter(function(q){return q.t===k;})); state.view="quiz"; tabBtns.forEach(function(b){b.classList.toggle("on",b.dataset.view==="quiz");}); startQuiz(items); window.scrollTo(0,0); }

  var TABS=[{v:"home",l:"Start",i:"book"},{v:"quiz",l:"Oefenvragen",i:"target"},{v:"theory",l:"Theorie",i:"search"},{v:"hacks",l:"Studie-hacks",i:"bulb"},{v:"feedback",l:"Feedback",i:"msg"}];

  var tabBtns=[].slice.call(tabsEl.querySelectorAll("button"));

  function renderTrack(){

    var st=chapterStats(); var tD=0,tQ=0,tC=0; Object.keys(st).forEach(function(k){tD+=st[k].done;tQ+=st[k].total;tC+=st[k].correct;});

        '<p>Oefenvragen per hoofdstuk, met uitleg</p></div>'+
      '</div>'+
      '<a class="brandstrip" href="https://beriesexamspace.github.io/" title="Naar Berie’s exam space"><span class="bs-logo">B</span><span class="bs-txt"><b>Berie’s exam space</b><small>Een ander vak leren? Bekijk alle vakken</small></span><span class="bs-go">'+ic("arrowR")+'</span></a>'+
      '<a class="brandstrip" href="https://beriesexamspace.github.io/?deel=1" title="Deel je samenvattingen"><span class="bs-logo">📚</span><span class="bs-txt"><b>Help mee, deel je vak</b><small>Heb jij samenvattingen of oude examenvragen? Stuur ze in (élk jaar).</small></span><span class="bs-go">'+ic("arrowR")+'</span></a>'+
      '<div class="seclabel">'+ic("rocket")+'Hoe wil je oefenen?</div>'+
      '<div class="tracks">'+
        '<button class="track" data-track="training"><span class="tile">'+ic("book")+'</span><b>Examen Training</b><small>Oefen op examenniveau. Vragen met directe feedback en uitleg.</small><span class="go">Normaal niveau '+ic("arrowR")+'</span></button>'+
        '<button class="track alt" data-track="herkansing"><span class="tile">'+ic("heart")+'</span><b>Herkansing</b><small>Rustig opbouwen, met aanmoediging. Jij bepaalt het tempo.</small><span class="go">Met begeleiding '+ic("arrowR")+'</span></button>'+
      '</div>'+
      '<div class="card pad choverview" style="margin-top:18px">'+
        '<div class="row" style="justify-content:space-between;align-items:center"><b>Kies een hoofdstuk</b>'+(tD>0?'<button type="button" class="bnlink" id="resetProg">'+ic("refresh")+'Reset</button>':'')+'</div>'+
        '<p class="muted" style="font-size:12.5px;margin:6px 0 12px">Klik een hoofdstuk om alleen dat te oefenen.'+(tD>0?' &middot; '+tD+'/'+tQ+' geoefend &middot; '+pct(tC,tD)+'% juist':'')+'</p>'+
        '<div class="chlist">'+Object.keys(TOPICS).map(function(k){var s=st[k];var w=pct(s.done,s.total);return '<button type="button" class="chrow" data-ch="'+k+'"><span class="chname">'+esc(TOPICS[k])+'</span><span class="chbar"><i style="width:'+w+'%"></i></span><span class="chval">'+s.done+'/'+s.total+'</span>'+ic("chevR","caret")+'</button>';}).join("")+'</div></div>';
    setHTML(html);
    [].slice.call(document.querySelectorAll(".chrow")).forEach(function(el){ el.onclick=function(){ startChapter(el.dataset.ch); }; });
    var _rp=document.getElementById("resetProg"); if(_rp) _rp.onclick=function(){ resetProg(); renderHome(); };
    [].slice.call(document.querySelectorAll(".track")).forEach(function(el){ el.onclick=function(){ var t=el.dataset.track; state.track=t; lset("diffpsy_track",t); state.step=(t==="herkansing"?"herkansing":"practice"); renderHome(); window.scrollTo(0,0); }; });
  }

  function renderHerkansing(){
    var html=
      '<button class="backlink" id="backBtn">'+ic("back")+'Terug</button>'+
      '<div class="seclabel" style="margin-top:2px">'+ic("heart")+'Herkansing</div>'+
      (calm?'<div class="card pad warmcard"><div class="row" style="gap:11px;flex-wrap:nowrap;align-items:flex-start">'+ic("heart")+'<div><b>Een nieuwe kans, rustig aan.</b><p class="muted" style="margin:5px 0 0;font-size:13.5px">Herkansen betekent niet dat je het niet kunt. Stap voor stap kom je er. Jij kunt dit. 💙</p></div></div></div>':'')+
      '<div class="card pad" style="margin-top:12px"><div class="row" style="justify-content:space-between;align-items:center;gap:14px"><div><b>Rustige modus</b><div class="muted" style="font-size:12.5px">Aanmoediging en kalme sfeer. Zet uit als je liever recht-voor-z’n-raap oefent.</div></div><button class="toggle'+(calm?" on":"")+'" id="calmToggle" role="switch" aria-checked="'+(calm?"true":"false")+'" aria-label="Rustige modus aan of uit"><span class="knob"></span></button></div></div>'+
      '<div class="row" style="margin-top:16px"><button class="btn" id="beginBtn">Begin met oefenen '+ic("arrowR")+'</button></div>';
    setHTML(html);
    document.getElementById("backBtn").onclick=function(){ state.step="track"; renderHome(); window.scrollTo(0,0); };
    document.getElementById("calmToggle").onclick=function(){ calm=!calm; lset("diffpsy_calm",calm); applyCalm(); renderHerkansing(); };
    document.getElementById("beginBtn").onclick=function(){ state.step="practice"; renderHome(); window.scrollTo(0,0); };
  }

  function renderPractice(){
    var herk=state.track==="herkansing";
    var html=
      '<button class="backlink" id="backBtn">'+ic("back")+'Terug</button>'+
      '<div class="modebanner'+(herk?" v":"")+'">'+ic(herk?"heart":"book")+'<span>'+modeLabel()+'</span><button type="button" class="bnlink" id="changeMode">wijzig</button></div>'+
      '<div class="seclabel">'+ic("rocket")+'Waarmee wil je oefenen?</div>'+
      '<div class="grid g2">'+
        '<button class="mode" data-mode="quiz"><span class="me">'+ic("target")+'</span><b>Oefenvragen</b><small>Meerkeuze met directe feedback en uitleg. Kies je onderwerpen.</small></button>'+
        '<button class="mode" id="quickStart"><span class="me">'+ic("rocket")+'</span><b>Snelle ronde</b><small>15 willekeurige vragen uit alle onderwerpen.</small></button>'+
      '</div>';
    setHTML(html);
    document.getElementById("backBtn").onclick=function(){ if(state.fromHub){ location.href="https://beriesexamspace.github.io/"; return; } state.step=(herk?"herkansing":"track"); renderHome(); window.scrollTo(0,0); };
    document.getElementById("changeMode").onclick=function(){ if(state.fromHub){ location.href="https://beriesexamspace.github.io/"; return; } state.step="track"; renderHome(); window.scrollTo(0,0); };
    document.querySelector('[data-mode="quiz"]').onclick=function(){ go("quiz"); };
    document.getElementById("quickStart").onclick=function(){ state.view="quiz"; tabBtns.forEach(function(b){b.classList.toggle("on",b.dataset.view==="quiz");}); startQuiz(shuffle(D.questions.slice()).slice(0,15)); window.scrollTo(0,0); };
  }

  function renderQuizGate(){
    if(state.quiz) return renderQuiz();
    var s=state.sel;
    function pool(){ return D.questions.filter(function(q){return s.topics[q.t];}); }
    var html='<div class="card pad"><h2 style="margin-top:0">Oefenvragen</h2>'+
      '<p class="muted">Kies onderwerpen en het aantal vragen. Na elk antwoord krijg je meteen feedback én de uitleg.</p>'+
      '<label class="fld">Onderwerpen</label><div class="chips" id="tps">'+
        Object.keys(TOPICS).map(function(k){return '<button class="chip'+(s.topics[k]?" on":"")+'" data-tp="'+k+'">'+esc(TOPICS[k])+'</button>';}).join("")+'</div>'+
      '<label class="fld">Aantal vragen</label><div class="chips" id="cnt">'+
        [10,15,20,999].map(function(n){return '<button class="chip'+(s.count===n?" on":"")+'" data-n="'+n+'">'+(n===999?"Alle":n)+'</button>';}).join("")+'</div>'+
      '<label class="fld">Volgorde van de vragen</label><div class="chips" id="ord">'+'<button class="chip'+(s.shuffle?" on":"")+'" data-sh="1">Door elkaar</button>'+'<button class="chip'+(s.shuffle?"":" on")+'" data-sh="0">Op volgorde</button>'+'</div>'+
      '<div class="row" style="margin-top:18px"><button class="btn" id="startQ">Start '+ic("arrowR")+'</button><span class="muted" id="poolN"></span></div></div>';
    setHTML(html);
    function refresh(){ var n=pool().length; document.getElementById("poolN").textContent=n+" vragen beschikbaar"; document.getElementById("startQ").disabled=n===0; }
    [].slice.call(document.querySelectorAll("#tps .chip")).forEach(function(b){ b.onclick=function(){ s.topics[b.dataset.tp]=!s.topics[b.dataset.tp]; b.classList.toggle("on"); refresh(); }; });
    [].slice.call(document.querySelectorAll("#cnt .chip")).forEach(function(b){ b.onclick=function(){ s.count=+b.dataset.n; renderQuizGate(); }; });
    [].slice.call(document.querySelectorAll("#ord .chip")).forEach(function(b){ b.onclick=function(){ s.shuffle=b.dataset.sh==="1"; [].slice.call(document.querySelectorAll("#ord .chip")).forEach(function(x){x.classList.toggle("on",x===b);}); }; });
    document.getElementById("startQ").onclick=function(){ var p=pool(); if(s.shuffle)p=shuffle(p); if(s.count<p.length)p=p.slice(0,s.count); startQuiz(p); };
    refresh();
  }

  function startQuiz(items){ bump("berat-diffpsy", state.track==="herkansing"?"herkansing":"training"); state.quiz={items:items.map(function(q){return {q:q,opts:shuffle(q.o.map(function(t,i){return {text:t,ok:i===q.a};}))};}), picks:[], idx:0, answered:false, picked:-1, correct:0, wrong:[], done:false}; renderQuiz(); }

  function renderQuiz(){
    var Q=state.quiz; if(Q.done) return renderResult();
    var cur=Q.items[Q.idx], q=cur.q; if(!Q.picks)Q.picks=[]; if(Q.picks[Q.idx]!=null){Q.answered=true;Q.picked=Q.picks[Q.idx];}else{Q.answered=false;Q.picked=-1;}
    var html='<button class="backlink" id="backBtn">'+ic("back")+'Terug</button>'+
      '<div class="card pad">'+
      '<div class="runtop"><span class="pill">'+esc(TOPICS[q.t])+'</span><div class="bar"><i data-w="'+pct(Q.idx,Q.items.length)+'"></i></div><span>'+(Q.idx+1)+'/'+Q.items.length+'</span></div>'+
      '<div class="qtext">'+esc(q.q)+'</div>'+
      '<div id="opts">'+cur.opts.map(function(o,i){return '<button class="opt" data-i="'+i+'" style="--oi:'+(i*55)+'ms"><span class="k">'+String.fromCharCode(65+i)+'</span><span>'+esc(o.text)+'</span></button>';}).join("")+'</div>'+
      '<div id="fb"></div>'+
      '<div class="row" style="justify-content:space-between;margin-top:6px"><div class="row" style="gap:10px;align-items:center">'+(Q.idx>0?'<button class="btn ghost" id="prevBtn">'+ic("back")+'Vorige</button>':'')+'<span class="muted" style="font-size:12px">Toets <span class="kbd">A–D</span> · <span class="kbd">Enter</span> = volgende</span></div><button class="btn hide" id="nextBtn">Volgende '+ic("arrowR")+'</button></div></div>';
    setHTML(html);
    var i2=document.querySelector(".bar>i"); requestAnimationFrame(function(){ if(i2) i2.style.width=i2.getAttribute("data-w")+"%"; });
    document.getElementById("backBtn").onclick=function(){ state.quiz=null; renderQuizGate(); };
    var optBtns=[].slice.call(document.querySelectorAll("#opts .opt"));
    var nb=document.getElementById("nextBtn"); nb.onclick=next; var pb=document.getElementById("prevBtn"); if(pb)pb.onclick=function(){ if(Q.idx>0){ Q.idx--; renderQuiz(); } };
    function showAnswered(i){
      optBtns.forEach(function(b){ var bi=+b.dataset.i; b.disabled=true; if(cur.opts[bi].ok)b.classList.add("correct"); else if(bi===i)b.classList.add("wrong"); });
      var ok=cur.opts[i].ok, fb=document.getElementById("fb"); fb.className="feedback "+(ok?"ok":"no");
      var juist=cur.opts.filter(function(o){return o.ok;})[0].text;
      fb.innerHTML=ok?"<b>"+rnd(PRAISE)+" ✓</b>":"<b>"+wrongLead()+"</b><span class=\"sub\">Juiste antwoord: "+esc(juist)+"</span>";
      var w=document.createElement("div"); w.innerHTML='<div class="whybox"><h4>'+ic("sparkles")+'Waarom?</h4>'+esc(q.u)+'</div>'; fb.appendChild(w);
      nb.classList.remove("hide"); nb.innerHTML=(Q.idx+1>=Q.items.length)?"Bekijk resultaat "+ic("arrowR"):"Volgende "+ic("arrowR");
    }
    function pick(i){ if(Q.answered)return; Q.answered=true; Q.picked=i; Q.picks[Q.idx]=i; var ok=cur.opts[i].ok; if(ok)Q.correct++; else Q.wrong.push(q); recordProg(q.id, ok); showAnswered(i); nb.focus(); }
    optBtns.forEach(function(b){ b.onclick=function(){ pick(+b.dataset.i); }; });
    function next(){ if(!Q.answered)return; Q.idx++; Q.answered=false; Q.picked=-1; if(Q.idx>=Q.items.length)Q.done=true; renderQuiz(); }
    if(Q.answered) showAnswered(Q.picked);
    state.key=function(e){ if(!Q.answered){ var k=e.key.toLowerCase(); var idx="abcde".indexOf(k); if(idx<0&&/[1-5]/.test(k))idx=+k-1; if(idx>=0&&idx<cur.opts.length){pick(idx);e.preventDefault();} } else if(e.key==="Enter"||e.key===" "){ next(); e.preventDefault(); } };
  }

  function renderResult(){
    var Q=state.quiz, p=pct(Q.correct,Q.items.length);
    var msg=p>=80?"Sterk werk! 🎉":p>=60?"Goed bezig 👍":"Blijf oefenen, je komt er 💪";
    var html='<div class="card pad results center"><span class="pill">Differentiële Psychologie</span><div class="big">'+p+'%</div>'+
      '<p style="font-weight:600;margin:0 0 4px;font-size:17px">'+msg+'</p><p class="muted">'+Q.correct+' van '+Q.items.length+' juist</p>'+
      '<div class="row" style="justify-content:center;margin-top:14px">'+
        (Q.wrong.length?'<button class="btn" id="retry">Herhaal '+Q.wrong.length+' foute vragen</button>':'')+
        '<button class="btn ghost" id="again">Nieuwe ronde</button><button class="btn ghost" id="home">Naar start</button></div></div>';
    setHTML(html);
    var rt=document.getElementById("retry"); if(rt) rt.onclick=function(){ startQuiz(shuffle(Q.wrong)); };
    document.getElementById("again").onclick=function(){ state.quiz=null; renderQuizGate(); };
    document.getElementById("home").onclick=function(){ state.quiz=null; go("home"); };
    state.key=null;
  }

  function renderTheory(){
    var q=state.sumq||"";
    var html='<div class="card pad" style="margin-bottom:14px"><h2 style="margin:0 0 8px">Theorie en samenvatting</h2>'+
      '<input type="search" id="sq" placeholder="Zoek een begrip… (bv. temperament, erfelijkheid, Big Five)" value="'+esc(q)+'"></div><div id="list">'+theoryList(q)+'</div>';
    setHTML(html);
    var si=document.getElementById("sq"); si.oninput=function(){ state.sumq=si.value; document.getElementById("list").innerHTML=theoryList(si.value); si.focus(); };
  }
  function theoryList(query){
    var Q=query.trim().toLowerCase(), out="", n=0;
    D.theory.forEach(function(sec){
      var items=sec.items.filter(function(it){ return !Q || it.toLowerCase().indexOf(Q)>=0 || sec.h.toLowerCase().indexOf(Q)>=0; });
      if(!items.length) return; n++;
      out+='<details class="acc"'+(Q?" open":(n===1?" open":""))+'><summary><span class="n">'+ic("search")+'</span>'+esc(sec.h)+ic("chevR","caret")+'</summary><div class="body"><ul>'+items.map(function(it){return '<li>'+hl(esc(it),Q)+'</li>';}).join("")+'</ul></div></details>';
    });
    return out||'<p class="muted center">Geen resultaten voor "'+esc(query)+'".</p>';
  }
  function hl(t,q){ if(!q)return t; try{ return t.replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>"); }catch(e){ return t; } }

  function renderHacks(){
    var html='<div class="card pad" style="margin-bottom:16px"><h2 style="margin:0 0 6px">Studie-hacks</h2><p class="muted" style="margin:0">Ezelsbruggetjes om de kernideeën van de differentiële psychologie te onthouden.</p></div>'+
      '<div class="tipgrid">'+D.hacks.map(function(t){return '<div class="tip"><h4>'+ic("bulb")+esc(t.h)+'</h4><p>'+esc(t.t)+'</p></div>';}).join("")+'</div>';
    setHTML(html);
  }

  function renderFeedback(){
    var html='<div class="card pad"><h2 style="margin-top:0">Feedback &amp; klachten</h2>'+
      '<p class="muted">Fout in een vraag, een idee, of werkt iets niet? Laat het hier weten, het komt rechtstreeks bij de maker terecht. Een review of compliment mag ook: de mooiste tonen we op de hub. 💬</p>'+
      '<label class="fld" for="fbMsg">Je bericht</label><textarea id="fbMsg" rows="5" placeholder="Beschrijf de fout of je idee…"></textarea>'+
      '<label class="fld" for="fbWaar">Over welke vraag? <span class="muted">(optioneel)</span></label><input type="text" id="fbWaar" placeholder="bv. de vraag over de p-waarde">'+
      '<label class="fld" for="fbNaam">Je naam <span class="muted">(optioneel)</span></label><input type="text" id="fbNaam" placeholder="zodat we je kunnen bedanken">'+
      '<label class="fld" for="fbEmail">Je e-mail <span class="muted">(optioneel, als je een antwoord wilt)</span></label><input type="email" id="fbEmail" placeholder="naam@voorbeeld.be">'+
      '<input type="text" id="fbBot" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0">'+
      '<div class="row" style="margin-top:16px;align-items:center"><button class="btn" id="fbSend">'+ic("send")+'Versturen</button><span id="fbStatus" style="font-size:13px"></span></div></div>';
    setHTML(html);
    document.getElementById("fbSend").onclick=function(){
      var status=document.getElementById("fbStatus");
      if(document.getElementById("fbBot").value) return;
      var msg=document.getElementById("fbMsg").value.trim();
      if(!msg){ status.style.color="var(--bad)"; status.textContent="Schrijf eerst een bericht."; return; }
      var btn=document.getElementById("fbSend"); btn.disabled=true; status.style.color="var(--muted)"; status.textContent="Versturen…";
      var em=document.getElementById("fbEmail").value.trim();
      var nm=document.getElementById("fbNaam").value.trim();
      var waar=document.getElementById("fbWaar").value.trim();
      var payload={_subject:"Differentiële Psychologie-tool: feedback", _template:"table", _captcha:"false",
        Naam:nm||"-", Over_welke_vraag:waar||"-", email:em||"-", Bericht:msg};
      if(em) payload._replyto=em;
      // vangnet: als de verzenddienst blokkeert (bv. spamfilter) of er is geen verbinding,
      // bieden we een directe mailto-knop aan zodat de melding NOOIT stilletjes verdwijnt.
      function failFallback(reden){
        var body="Feedback Differentiële Psychologie-tool%0D%0A%0D%0ANaam: "+encodeURIComponent(nm||"-")+"%0D%0AOver welke vraag: "+encodeURIComponent(waar||"-")+"%0D%0AE-mail: "+encodeURIComponent(em||"-")+"%0D%0A%0D%0ABericht:%0D%0A"+encodeURIComponent(msg);
        var mailto="mailto:berat007yildirim@gmail.com?subject="+encodeURIComponent("Differentiële Psychologie-tool: feedback")+"&body="+body;
        setHTML('<div class="card pad"><h2 style="margin-top:0">Automatisch versturen lukte niet</h2><p class="muted">'+reden+' Geen zorgen, klik hieronder en je melding wordt geopend in je e-mail, helemaal klaar om te versturen:</p><a class="btn" href="'+mailto+'">'+ic("send")+'Mail mijn melding direct</a><div style="margin-top:14px"><button class="btn ghost" id="bk">Terug naar start</button></div></div>');
        document.getElementById("bk").onclick=function(){go("home");};
      }
      fetch("https://formsubmit.co/ajax/Berat007yildirim@gmail.com",{method:"POST",headers:{Accept:"application/json"},body:new URLSearchParams(payload)})
        .then(function(r){return r.json();}).then(function(d){
          if(d&&(d.success===true||d.success==="true")){ setHTML('<div class="card pad results center"><div style="font-size:42px">✅</div><h2 style="margin:6px 0">Bedankt!</h2><p class="muted">Je melding is verstuurd.</p><button class="btn" id="bk" style="margin-top:8px">Terug naar start</button></div>'); document.getElementById("bk").onclick=function(){go("home");}; }
          else { failFallback("Het automatisch versturen lukte niet."); }
        }).catch(function(){ failFallback("Er was even geen verbinding."); });
    };
  }

  document.addEventListener("keydown",function(e){ if(state.key) state.key(e); });
  // bezoeker tellen (1x per toestel)
  try{ if(!localStorage.getItem("diffpsy_seen")){ localStorage.setItem("diffpsy_seen","1"); bump("berat-diffpsy","gebruikers"); } }catch(e){ bump("berat-diffpsy","gebruikers"); }
  // traject vanuit de hub overnemen → direct naar de oefenpagina
  try{ var _q=new URLSearchParams(location.search); var _m=_q.get("m");
    if(_m==="training"||_m==="herkansing"){ state.track=_m; lset("diffpsy_track",_m);
      var _c=_q.get("calm"); if(_c!=null){ calm=(_c!=="0"); lset("diffpsy_calm",calm); applyCalm(); }
      state.step="practice"; state.fromHub=true; }
  }catch(e){}
  render();
  // launch-splash netjes laten verdwijnen
  (function(){ var _sp=document.getElementById("splash"); if(!_sp) return; var _red=false; try{_red=window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){} setTimeout(function(){ _sp.classList.add("hide"); setTimeout(function(){ if(_sp&&_sp.parentNode) _sp.parentNode.removeChild(_sp); }, 700); }, _red?300:1850); })();
})();
</script>
