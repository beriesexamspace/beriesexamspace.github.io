<style>
  :root{
    --bg:#f4f2ee; --bg2:#ebe8e2; --card:#ffffff; --ink:#1b232c; --muted:#5d6873;
    --line:#e2ddd4; --accent:#0f6e6a; --accent-ink:#0b4f4c; --accent-soft:#dcefed;
    --amber:#c9821f; --amber-soft:#f7ecd9; --violet:#6d5bd0; --violet-soft:#e9e6fa;
    --good:#1f8a4c; --good-soft:#e2f3e8; --bad:#c23b54; --bad-soft:#fbe5ea;
    --shadow:0 1px 2px rgba(20,30,40,.05),0 6px 18px rgba(20,30,40,.05);
    --shadow-lg:0 2px 6px rgba(20,30,40,.06),0 18px 40px rgba(20,30,40,.10);
    --r:14px; --r-lg:20px; --ease:cubic-bezier(.2,.8,.2,1);
  }
  html[data-theme="dark"]{
    --bg:#11151a; --bg2:#161b22; --card:#1b222b; --ink:#e7ecf1; --muted:#9aa6b2;
    --line:#2a323c; --accent:#3fb9b2; --accent-ink:#7fd6d0; --accent-soft:#163230;
    --amber:#e0a64a; --amber-soft:#2e2515; --violet:#a99cf0; --violet-soft:#221d3a;
    --good:#46c178; --good-soft:#16301f; --bad:#ef6b82; --bad-soft:#331620;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 2px 8px rgba(0,0,0,.4),0 22px 48px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;letter-spacing:-.01em}
  button,a{font-family:inherit;cursor:pointer;color:inherit}
  .wrap{max-width:880px;margin:0 auto;padding:0 18px 96px}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
  .ic{width:1.25em;height:1.25em;flex:none;vertical-align:-.18em;stroke:currentColor;stroke-width:1.75;
    stroke-linecap:round;stroke-linejoin:round;fill:none}

  header.top{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(160%) blur(16px);-webkit-backdrop-filter:saturate(160%) blur(16px);box-shadow:inset 0 -1px 0 0 rgba(0,0,0,.04)}
  .topin{max-width:880px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:700}
  .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,var(--accent),var(--accent-ink));
    color:#fff;display:grid;place-items:center;font-family:Georgia,serif;font-weight:700;font-size:16px;flex:none;
    box-shadow:0 2px 6px rgba(15,110,106,.35)}
  .brand small{display:block;font-weight:500;color:var(--muted);font-size:11px}
  .spacer{flex:1}
  .iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:38px;
    padding:7px 11px;font-size:13.5px;display:inline-flex;gap:7px;align-items:center;text-decoration:none;
    transition:border-color .2s var(--ease),transform .12s var(--ease)}
  .iconbtn:hover{border-color:var(--accent)} .iconbtn:active{transform:scale(.96)}
  nav.tabs{display:flex;gap:2px;overflow:auto;max-width:880px;margin:0 auto;padding:6px 12px 0;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{border:none;background:none;color:var(--muted);padding:10px 13px;border-radius:9px 9px 0 0;
    font-size:14px;font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px;transition:color .2s var(--ease)}
  nav.tabs button .ic{width:16px;height:16px}
  nav.tabs button.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
  nav.tabs button:hover{color:var(--ink)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:20px}
  .muted{color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
  .pill.amber{background:var(--amber-soft);color:var(--amber)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;gap:14px}
  @media(min-width:620px){.g2{grid-template-columns:1fr 1fr}}

  .hero{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin:20px 0 8px}
  .count{flex:none;background:linear-gradient(150deg,var(--accent),var(--accent-ink));color:#fff;border-radius:var(--r);padding:14px 20px;text-align:center;min-width:118px;box-shadow:0 8px 20px rgba(15,110,106,.28)}
  .count b{font-family:Georgia,serif;font-size:32px;display:block;line-height:1}
  .count span{font-size:12px;opacity:.92}
  .herotext h1{margin:0 0 4px;font-size:25px}
  .herotext p{margin:0;color:var(--muted)}

  .brandstrip{display:flex;align-items:center;gap:13px;width:100%;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 16px;margin:14px 0 2px;box-shadow:var(--shadow);transition:border-color .2s var(--ease),transform .15s var(--ease)}
  .brandstrip:hover{border-color:var(--accent);transform:translateY(-1px)}
  .brandstrip .bs-logo{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:17px;background:linear-gradient(145deg,var(--accent),var(--accent-ink))}
  .brandstrip .bs-txt{flex:1;min-width:0} .brandstrip .bs-txt b{display:block;font-size:14.5px} .brandstrip .bs-txt small{color:var(--muted);font-size:12.5px}
  .brandstrip .bs-go{color:var(--accent-ink);flex:none;display:inline-flex} .brandstrip .bs-go .ic{width:18px;height:18px}

  .seclabel{display:flex;align-items:center;gap:8px;margin:24px 0 12px;font-weight:700;font-size:15px}
  .seclabel .ic{width:18px;height:18px;color:var(--accent-ink)}
  .backlink{display:inline-flex;align-items:center;gap:5px;border:none;background:none;color:var(--muted);font-size:13.5px;font-weight:600;padding:6px 0;margin-bottom:4px;transition:color .2s var(--ease)}
  .backlink:hover{color:var(--accent-ink)} .backlink .ic{width:16px;height:16px}
  .tracks{display:grid;gap:14px} @media(min-width:600px){.tracks{grid-template-columns:1fr 1fr}}
  .track{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);transition:transform .22s var(--ease),border-color .22s var(--ease),box-shadow .22s var(--ease)}
  .track:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow-lg)} .track:active{transform:translateY(-1px) scale(.995)}
  .track .tile{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;margin-bottom:4px;background:linear-gradient(150deg,var(--accent),var(--accent-ink))}
  .track.alt .tile{background:linear-gradient(150deg,var(--violet),#4f40a8)} .track .tile .ic{width:24px;height:24px}
  .track b{font-size:18px} .track small{color:var(--muted);font-size:13.5px;line-height:1.5}
  .track .go{margin-top:6px;display:inline-flex;align-items:center;gap:6px;color:var(--accent-ink);font-weight:600;font-size:13.5px} .track.alt .go{color:var(--violet)} .track .go .ic{width:16px;height:16px}
  .toggle{width:48px;height:28px;border-radius:999px;border:none;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s var(--ease)}
  .toggle .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s var(--ease)}
  .toggle.on{background:var(--violet)} .toggle.on .knob{left:23px}
  .warmcard{border-color:var(--violet)!important;background:var(--violet-soft)} .warmcard .ic{width:22px;height:22px;color:var(--violet);flex:none}
  .modebanner{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:11px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent-ink);font-size:13.5px;font-weight:600}
  .modebanner.v{background:var(--violet-soft);color:var(--violet)} .modebanner .ic{width:18px;height:18px} .modebanner a,.modebanner .bnlink{margin-left:auto;font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;color:inherit;border:none;background:none;font-family:inherit;padding:0}
  html.snappy .card,html.snappy .mode,html.snappy .tip,html.snappy .track{animation-duration:.12s!important}
  .mode{display:flex;flex-direction:column;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:17px;gap:7px;box-shadow:var(--shadow);transition:transform .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease)}
  .mode:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .mode .me{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)} .mode .me .ic{width:22px;height:22px}
  .mode b{font-size:16px} .mode small{color:var(--muted);font-size:13px}

  label.fld{display:block;font-size:13px;font-weight:600;margin:16px 0 7px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;min-height:38px;padding:7px 13px;font-size:13.5px;transition:all .18s var(--ease)}
  .chip:hover{border-color:var(--accent)} .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:11px;min-height:46px;padding:12px 20px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;box-shadow:0 4px 12px rgba(15,110,106,.25);transition:background .2s var(--ease),transform .12s var(--ease)}
  .btn:hover{background:var(--accent-ink)} .btn:active{transform:scale(.97) translateY(1px)} .btn .ic{width:18px;height:18px}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none} .btn.ghost:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  input[type=search],input[type=text],input[type=email],textarea{font-family:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
  input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .runtop{display:flex;align-items:center;gap:12px;margin:2px 0 14px;font-size:13px;color:var(--muted)}
  .bar{height:8px;border-radius:6px;background:var(--bg2);overflow:hidden;flex:1}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .7s var(--ease)}
  .qtext{font-size:19px;font-weight:600;margin:8px 0 16px;font-family:Georgia,serif;line-height:1.45}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px 15px;margin-bottom:10px;font-size:15px;transition:border-color .15s var(--ease),background .15s var(--ease),transform .12s var(--ease)}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)} .opt:active:not(:disabled){transform:scale(.99)}
  .opt .k{flex:none;width:27px;height:27px;border-radius:8px;background:var(--bg2);color:var(--muted);display:grid;place-items:center;font-weight:700;font-size:13px}
  .opt.correct{border-color:var(--good);background:var(--good-soft)} .opt.correct .k{background:var(--good);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default}
  .feedback{border-radius:12px;padding:13px 15px;margin:4px 0 12px;font-size:14.5px}
  .feedback.ok{background:var(--good-soft);color:var(--good)} .feedback.no{background:var(--bad-soft);color:var(--bad)}
  .feedback b{font-weight:700} .feedback .sub{display:block;margin-top:3px;color:var(--ink);font-weight:500;opacity:.92}
  .whybtn{border:1px solid var(--line);background:var(--card);color:var(--accent-ink);border-radius:10px;min-height:40px;padding:9px 14px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:border-color .2s var(--ease),background .2s var(--ease)}
  .whybtn:hover{border-color:var(--accent);background:var(--accent-soft)} .whybtn .ic{width:16px;height:16px}
  .whybox{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:14px 16px;margin:12px 0 4px;font-size:14px;line-height:1.55}
  .whybox h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent-ink);font-family:system-ui;display:flex;align-items:center;gap:7px}
  .whybox .ic{width:16px;height:16px}

  .acc{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
  .acc>summary{padding:15px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:11px}
  .acc>summary::-webkit-details-marker{display:none}
  .acc>summary .n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
  .acc>summary .caret{margin-left:auto;color:var(--muted);transition:transform .25s var(--ease)} .acc[open]>summary .caret{transform:rotate(90deg)}
  .acc[open]>summary{border-bottom:1px solid var(--line)} .acc .body{padding:6px 18px 16px}
  .acc h4{margin:14px 0 6px;font-size:13px;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.4px;font-family:system-ui}
  .acc ul{margin:0;padding-left:20px} .acc li{margin:6px 0;font-size:14.5px;line-height:1.5}
  .acc.hack li::marker{content:"💡  "} .acc.hack>summary .n{background:var(--violet-soft);color:var(--violet)}
  mark{background:var(--amber-soft);color:inherit;padding:0 2px;border-radius:3px}

  .tip{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}
  .tip h4{margin:0 0 5px;font-size:14.5px;display:flex;align-items:center;gap:8px;font-family:system-ui} .tip h4 .ic{width:18px;height:18px;color:var(--violet)}
  .tip p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}
  .tipgrid{display:grid;gap:12px} @media(min-width:620px){.tipgrid{grid-template-columns:1fr 1fr}}

  .results .big{font-family:Georgia,serif;font-size:54px;text-align:center;margin:8px 0;line-height:1}
  .center{text-align:center} .hide{display:none!important}
  footer{margin-top:34px;text-align:center;color:var(--muted);font-size:13px}
  .kbd{font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--muted)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.03)}100%{transform:scale(1)}}
  @keyframes optIn{from{opacity:0;transform:translateX(-9px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: no-preference){
    .card,.mode,.tip{animation:fadeUp .34s var(--ease) both}
    .acc{animation:fadeUp .32s var(--ease) both}
    .opt{animation:optIn .3s var(--ease) backwards;animation-delay:var(--oi,0s)}
    .chip.on{animation:pop .22s var(--ease)}
    .feedback{animation:slideIn .26s var(--ease) both} .whybox{animation:slideIn .28s var(--ease) .07s both} .opt.correct{animation:pop .34s var(--ease)}
  }
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  /* ---- Premium launch (Gemini-stijl) + header-logo gloed ---- */
  @property --bes-a{syntax:'<angle>';initial-value:0deg;inherits:false}
  #splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(125% 125% at 50% 38%,var(--bg2) 0%,var(--bg) 68%);transition:opacity .6s var(--ease),transform .7s var(--ease)}
  #splash.hide{opacity:0;transform:scale(1.07);pointer-events:none}
  .sp-inner{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
  .sp-mark{position:relative;width:100px;height:100px;display:grid;place-items:center}
  .sp-mark::before{content:"";position:absolute;inset:-16px;border-radius:34px;z-index:0;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));filter:blur(17px);opacity:.75}
  .sp-mark::after{content:"";position:absolute;inset:-3px;border-radius:27px;z-index:1;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));padding:3px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .sp-logo{position:relative;z-index:2;width:92px;height:92px;border-radius:24px;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:46px;background:linear-gradient(150deg,var(--accent),var(--accent-ink));box-shadow:0 14px 38px rgba(15,110,106,.4)}
  .sp-spark{position:absolute;z-index:3;top:-7px;right:-7px;width:30px;height:30px;color:#fff;filter:drop-shadow(0 2px 7px rgba(0,0,0,.35))}
  .sp-name{position:relative;font-family:Georgia,serif;font-size:26px;font-weight:700;letter-spacing:-.01em;color:var(--ink);overflow:hidden}
  .sp-name::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(-130%)}
  .sp-tag{font-size:13px;color:var(--muted);margin-top:-8px;letter-spacing:.03em}
  @media (prefers-reduced-motion: no-preference){
    .sp-mark::before{animation:bes-spin 3s linear infinite,bes-breathe 2.4s var(--ease) infinite}
    .sp-mark::after{animation:bes-spin 3s linear infinite}
    .sp-logo{animation:bes-pop .7s var(--ease) both}
    .sp-spark{animation:bes-pop .6s var(--ease) .12s both,bes-twinkle 1.9s var(--ease) .9s infinite}
    .sp-name{animation:bes-rise .6s var(--ease) .14s both}
    .sp-name::after{animation:bes-shimmer 1.5s var(--ease) .5s 1}
    .sp-tag{animation:bes-rise .6s var(--ease) .26s both}
  }
  @keyframes bes-spin{to{--bes-a:360deg}}
  @keyframes bes-breathe{0%,100%{opacity:.55;filter:blur(16px)}50%{opacity:.95;filter:blur(22px)}}
  @keyframes bes-shimmer{to{transform:translateX(130%)}}
  @keyframes bes-twinkle{0%,100%{opacity:1;transform:scale(1) rotate(0deg)}50%{opacity:.65;transform:scale(.82) rotate(18deg)}}
  @keyframes bes-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  /* mobiel: header-knoppen alleen iconen zodat niks zijwaarts overflowt */
  @media(max-width:440px){ header.top .iconbtn span{display:none} header.top .iconbtn{padding:7px 9px;min-width:38px;justify-content:center} .topin{gap:8px} }
</style>
</head>
<body>
<div id="splash"><div class="sp-inner">
  <div class="sp-mark">
    <div class="sp-logo">O1</div>
    <svg class="sp-spark" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.5c.4 4.6 2.4 6.6 7 7-4.6.4-6.6 2.4-7 7-.4-4.6-2.4-6.6-7-7 4.6-.4 6.6-2.4 7-7Z"/></svg>
  </div>
  <div><div class="sp-name">OMT I: Psychometrie</div><div class="sp-tag">slim oefenen voor je examen</div></div>
</div></div>
<header class="top">
  <div class="topin">

<script>
window.OMT1 = {"questions":[{"t":"1","q":"Wat is psychometrie?","o":["De wetenschappelijke studie van de kwaliteit van psychologische testen","Het afnemen van intelligentietesten bij kinderen","De statistiek van gemiddelden en standaarddeviaties","Een therapie voor angststoornissen"],"a":0,"u":"Psychometrie is de wetenschappelijke studie van (de kwaliteit van) psychologische testen, vooral toegepast op psychologische testen en assessment, maar ook bruikbaar in andere domeinen zoals criminologie of onderwijswetenschappen."},{"t":"1","q":"Wat is het verschil tussen 'testing' en 'assessment'?","o":["Testing gebruikt 1 test voor 1 conclusie; assessment combineert testen met andere technieken","Testing is voor kinderen, assessment voor volwassenen","Assessment gebruikt enkel vragenlijsten, testing enkel experimenten","Er is geen verschil"],"a":0,"u":"Testing betekent dat je 1 test gebruikt om 1 conclusie te trekken. Assessment gebruikt psychologische testen samen met andere technieken (interviews, observaties) om tot een beslissing te komen."},{"t":"1","q":"Wat is een 'staal van gedrag' bij een psychologische test?","o":["Een selectie van items die representatief gedrag moeten meten","Een bloedstaal dat wordt afgenomen voor het testonderzoek","Een gemiddelde van alle testscores","De normgroep waarmee vergeleken wordt"],"a":0,"u":"Een test bestaat uit een eindig aantal items; de selectie van items moet een representatief staal opleveren van het gedrag dat gemeten wordt, ook als items niet rechtstreeks lijken op dat gedrag."},{"t":"1","q":"Waarom is standaardisatie van testafname belangrijk?","o":["Zodat verschillen in scores komen door verschil in gemeten gedrag, niet door verschil in afnamewijze","Omdat de wet dit verplicht voor alle examens","Om testen goedkoper te maken","Om altijd dezelfde testleider te kunnen gebruiken"],"a":0,"u":"Testafname moet gestandaardiseerd zijn: verschillende testscores moeten het gevolg zijn van verschillen in het gemeten gedrag, en niet van verschillen in de manier waarop de test werd afgenomen."},{"t":"1","q":"Wat betekent 'norm-referenced' testen?","o":["De score wordt vergeleken met de scores van andere mensen","De score wordt vergeleken met een vast criterium","Er is geen normgroep nodig","De test heeft altijd 20 vragen"],"a":0,"u":"Norm-referenced testen vergelijken jouw score met de scores van andere mensen (een normgroep). Criterion-referenced testen vergelijken jouw score met een vast criterium, zoals slagen bij minstens de helft juist."},{"t":"1","q":"Wie ontwikkelde de eerste 'moderne' intelligentietest en waarop lag de focus?","o":["Binet & Simon, op hogere mentale processen i.p.v. sensorische testen","Wundt, op reactiesnelheid","Galton, op lichaamskenmerken","Cattell, op handgripkracht"],"a":0,"u":"Binet en Simon ontwikkelden in 1905 de eerste moderne intelligentietest, met de focus op hogere mentale processen in plaats van louter sensorische/fysieke testen zoals bij Galton en Cattell."},{"t":"1","q":"Wat ging er mis bij Wissler's onderzoek naar mentale testen van Cattell?","o":["Hij testte enkel topstudenten, waardoor de steekproef te homogeen was","Hij gebruikte te weinig proefpersonen","Hij vergat de studieresultaten te registreren","De testen waren niet gestandaardiseerd"],"a":0,"u":"Wissler's mistake: hij onderzocht enkel topstudenten (homogene steekproef) die allemaal hoog en gelijkaardig scoorden, waardoor hij ten onrechte concludeerde dat mentale testen niets voorspelden."},{"t":"1","q":"Wat is het verschil tussen fysiognomie en frenologie?","o":["Fysiognomie leidt kenmerken af uit het uiterlijk/gezicht, frenologie uit knobbels op het hoofd","Fysiognomie is wetenschappelijk bewezen, frenologie niet","Frenologie is ouder dan fysiognomie","Beide meten intelligentie via IQ-tests"],"a":0,"u":"Fysiognomie leidt psychologische kenmerken af uit het uiterlijk (bv. het gezicht), frenologie (Gall) uit de knobbels op het hoofd. Beide bleken onbetrouwbaar."},{"t":"1","q":"Wat introduceerde de IQ-formule van Stern en waarom?","o":["IQ = mentale leeftijd / chronologische leeftijd, omdat mentale achterstand een andere betekenis heeft naargelang de leeftijd","IQ = ruwe score / maximumscore, om vergelijken makkelijker te maken","IQ = percentiel, om normen overbodig te maken","IQ = gemiddelde van 5 subtests"],"a":0,"u":"Stern voerde het intelligentiequotiënt in als mentale leeftijd gedeeld door chronologische leeftijd, omdat een achterstand van bv. 3 jaar op 6-jarige leeftijd een groter probleem is dan diezelfde achterstand op 18-jarige leeftijd."},{"t":"1","q":"Wat is het verschil tussen empirische en hypothetische constructen?","o":["Empirische constructen zijn rechtstreeks waarneembaar, hypothetische niet","Empirische constructen zijn abstract, hypothetische zijn meetbaar","Er bestaat geen onderscheid in de psychometrie","Hypothetische constructen kunnen enkel bij dieren gemeten worden"],"a":0,"u":"Empirische constructen (zoals reactietijd) zijn rechtstreeks waarneembaar. Hypothetische constructen (zoals angst) zijn dat niet en moeten indirect, via meerdere manieren, gemeten worden."},{"t":"2","q":"Wat zijn de drie vereisten voor een nominale meetschaal?","o":["Identiteit, mutueel exclusief, exhaustief","Orde, kwantiteit, absoluut nulpunt","Betrouwbaarheid, validiteit, objectiviteit","Normaliteit, homogeniteit, lineariteit"],"a":0,"u":"Een nominale schaal vereist identiteit (metingen in dezelfde categorie zijn identiek op het kenmerk), mutuele exclusiviteit (een meting hoort bij precies 1 categorie) en exhaustiviteit (alle metingen zijn in te delen)."},{"t":"2","q":"Wat voegt een ordinale meetschaal toe aan een nominale schaal?","o":["Informatie over de rangorde van metingen","Een absoluut nulpunt","Gelijke afstanden tussen categorieën","Een standaard meeteenheid"],"a":0,"u":"Een ordinale schaal geeft naast identiteit ook informatie over de relatieve rangorde (orde), maar zegt niets over hoe groot het verschil tussen metingen is."},{"t":"2","q":"Wat is het verschil tussen een interval- en een ratio-meetschaal?","o":["Een ratioschaal heeft een absoluut nulpunt, een intervalschaal niet","Een intervalschaal heeft een absoluut nulpunt, een ratioschaal niet","Beide hebben geen kwantiteit","Er is geen verschil, beide zijn synoniemen"],"a":0,"u":"Beide schalen hebben kwantiteit (gelijke, gestandaardiseerde meeteenheden), maar enkel de ratioschaal heeft een absoluut nulpunt dat werkelijke afwezigheid van het kenmerk betekent (bv. 0 seconden)."},{"t":"2","q":"Waarom is 0 graden Celsius een relatief (arbitrair) nulpunt?","o":["Omdat het een afgesproken punt is en geen afwezigheid van temperatuur betekent","Omdat temperatuur nooit gemeten kan worden","Omdat het een ratioschaal is","Omdat er geen negatieve temperaturen bestaan"],"a":0,"u":"0°C is een arbitrair afgesproken punt, geen absolute afwezigheid van temperatuur (het kan ook kouder). Veel psychologische constructen, zoals intelligentie, hebben eveneens een relatief nulpunt."},{"t":"2","q":"Welke meetschalen horen bij parametrische versus non-parametrische testen?","o":["Interval en ratio bij parametrisch, nominaal en ordinaal bij non-parametrisch","Nominaal en ordinaal bij parametrisch, interval en ratio bij non-parametrisch","Alle vier de schalen zijn parametrisch","Enkel ratio is parametrisch"],"a":0,"u":"Interval- en ratiometingen bevatten meer informatie en worden gebruikt bij parametrische testen (bv. ANOVA); nominale en ordinale metingen horen bij non-parametrische testen (bv. Mann-Whitney)."},{"t":"2","q":"Waarom is de aanname dat een Likert-schaal op intervalniveau gemeten is soms moeilijk te verdedigen?","o":["Vooral wanneer de test uit weinig items bestaat","Omdat Likert-schalen altijd nominaal zijn","Omdat Likert-schalen geen antwoordopties hebben","Omdat de schaalscore nooit een som van itemscores is"],"a":0,"u":"Onderzoekers behandelen veel psychologische testen alsof ze intervalniveau hebben, maar die aanname is moeilijker te verdedigen als de test weinig items bevat waardoor de schaalscore minder een 'gelijke meeteenheid' benadert."},{"t":"3","q":"Wat is het verschil tussen interindividuele en intra-individuele verschillen?","o":["Interindividueel is tussen personen, intra-individueel is binnen 1 persoon","Interindividueel is binnen 1 persoon, intra-individueel is tussen personen","Beide begrippen betekenen hetzelfde","Interindividueel geldt enkel voor tweelingen"],"a":0,"u":"Interindividuele verschillen zijn verschillen tussen personen; intra-individuele verschillen zijn verschillen binnen dezelfde persoon (bv. op verschillende momenten)."},{"t":"3","q":"Wanneer is een verdeling van scores negatief scheef?","o":["Wanneer het gemiddelde kleiner is dan de mediaan","Wanneer het gemiddelde groter is dan de mediaan","Wanneer gemiddelde en mediaan gelijk zijn","Wanneer de modus ontbreekt"],"a":0,"u":"Een negatief scheve verdeling heeft een gemiddelde dat kleiner is dan de mediaan (x̄ < x̃); bij een positief scheve verdeling geldt het omgekeerde (x̄ > x̃)."},{"t":"3","q":"Wat geeft de covariantie weer, in tegenstelling tot de correlatie?","o":["Enkel de richting van het verband, niet de sterkte","Enkel de sterkte van het verband, niet de richting","Zowel richting als sterkte, net als correlatie","Niets, covariantie en correlatie zijn identiek"],"a":0,"u":"Covariantie geeft enkel de richting van het verband weer (positief of negatief), niet de grootte of sterkte ervan. De correlatiecoëfficiënt van Pearson geeft wél informatie over beide."},{"t":"3","q":"Binnen welk bereik ligt de Pearson-correlatiecoëfficiënt?","o":["Tussen -1 en +1","Tussen 0 en 1","Tussen -100 en 100","Er is geen vast bereik"],"a":0,"u":"De correlatiecoëfficiënt van Pearson ligt tussen -1 en +1 en geeft informatie over zowel de richting als de sterkte van het verband tussen twee variabelen."},{"t":"3","q":"Wat meet lambda bij het verband tussen dichotome variabelen?","o":["Hoe goed je voorspellingen kan doen over y als je x kent","De correlatie tussen twee continue variabelen","De standaarddeviatie van een verdeling","De vorm van een normaalverdeling"],"a":0,"u":"Lambda drukt uit hoe goed voorspellingen over y verbeteren als je x kent, berekend als het verschil in aantal fouten (zonder versus met kennis van x) gedeeld door het aantal fouten zonder x."},{"t":"3","q":"Wat vergelijkt de chi-kwadraattoets?","o":["Verwachte waarden met geobserveerde waarden","Twee gemiddelden met elkaar","De standaarddeviatie van twee groepen","De helling van een regressielijn"],"a":0,"u":"De chi-kwadraattoets (χ² = Σ(O-E)²/E) vergelijkt geobserveerde waarden met verwachte waarden om een verband tussen categorische variabelen na te gaan."},{"t":"4","q":"Wat is het grootste nadeel van 'percentage juist' als transformatiemaat?","o":["Er wordt geen rekening gehouden met de moeilijkheid van de test","Ze is afhankelijk van de steekproefgrootte","Ze kan niet berekend worden bij examens","Ze vereist een normaalverdeling"],"a":0,"u":"Percentage juist houdt geen rekening met de moeilijkheidsgraad van de test: je weet niet of een score van 60% normaal is voor die specifieke test."},{"t":"4","q":"Wat is een nadeel van rangnummers als transformatiemaat?","o":["Ze zijn afhankelijk van de (toevallige) samenstelling van de referentiegroep","Ze houden geen rekening met de moeilijkheid van de test","Ze kunnen niet berekend worden bij gelijke scores","Ze zijn enkel bruikbaar bij nominale data"],"a":0,"u":"Rangnummers zijn afhankelijk van wie er toevallig in de referentiegroep zit (bv. 3e worden van 5 is iets anders dan 3e van 1000) en van de steekproefgrootte."},{"t":"4","q":"Wat is een voordeel van percentiele rangen ten opzichte van rangnummers?","o":["De interpretatie is onafhankelijk van de steekproefgrootte","Ze respecteren de afstanden tussen ruwe scores","Je mag er een gemiddelde van berekenen","Ze zijn op intervalniveau gemeten"],"a":0,"u":"Percentiele rangen zijn onafhankelijk van de steekproefgrootte qua interpretatie, maar blijven ordinaal: ze respecteren de afstanden tussen ruwe scores niet en je mag er geen gemiddelde van nemen."},{"t":"4","q":"Hoe wordt een lineaire z-score berekend?","o":["z = (x - gemiddelde) / standaarddeviatie","z = x / standaarddeviatie","z = (x - mediaan) / variantie","z = gemiddelde / x"],"a":0,"u":"De lineaire z-score wordt berekend als z = (x - μ) / σ, en zet de ruwe score om naar de standaardnormale verdeling N(0,1)."},{"t":"4","q":"Wat is de relatie tussen z-scores en T-scores?","o":["T = 10 × z + 50","T = z / 10 + 50","T = 50 × z + 10","T = z + 50"],"a":0,"u":"T-scores worden berekend als T = 10 × z + 50, waardoor ze de T-normaalverdeling N(50,10) volgen in plaats van N(0,1)."},{"t":"4","q":"Wat is het verschil tussen leeftijdsnormen, klasnormen en standaardnormen?","o":["Leeftijdsnormen vergelijken per leeftijd, klasnormen per leerjaar/leerstof, standaardnormen gebruiken gestandaardiseerde scores zoals T-scores","Ze zijn drie namen voor exact dezelfde norm","Klasnormen gelden enkel voor volwassenen","Standaardnormen zijn enkel bruikbaar bij intelligentietests"],"a":0,"u":"Leeftijdsnormen bepalen de verdeling voor een representatieve groep van een bepaalde leeftijd (bv. groeicurve), klasnormen zijn gericht op onderwijs (leerstof/leerjaar), en standaardnormen gebruiken gestandaardiseerde scores zoals T-scores."},{"t":"5","q":"Hoe wordt betrouwbaarheid gedefinieerd in de klassieke testtheorie?","o":["De mate waarin verschillen tussen geobserveerde scores het gevolg zijn van verschillen tussen true scores, en niet van meetfouten","De mate waarin een test meet wat ze zou moeten meten","De correlatie tussen twee verschillende constructen","De kans dat een gokantwoord correct is"],"a":0,"u":"Betrouwbaarheid is de mate waarin verschillen tussen geobserveerde scores toe te schrijven zijn aan verschillen tussen true scores, en niet aan verschillen tussen meetfouten."},{"t":"5","q":"Wat is het verschil tussen toevallige en systematische meetfouten?","o":["Toevallige fouten zijn onvoorspelbaar, systematische fouten zijn consistent en voorspelbaar","Toevallige fouten zijn altijd groter dan systematische","Systematische fouten bestaan enkel bij projectieve testen","Er is geen verschil, beide beïnvloeden de betrouwbaarheid evenveel"],"a":0,"u":"Toevallige meetfouten zijn onvoorspelbaar (bv. slecht geslapen hebben) en zijn cruciaal voor betrouwbaarheid. Systematische meetfouten zijn consistent en voorspelbaar (bv. rater bias, instrument bias)."},{"t":"5","q":"Wat zijn de assumpties van de klassieke testtheorie over meetfouten?","o":["Meetfouten zijn volledig toevallig, gemiddeld 0, en niet gecorreleerd met true scores","Meetfouten zijn altijd positief","Meetfouten zijn gelijk aan de standaarddeviatie","Meetfouten verdwijnen bij grote steekproeven automatisch"],"a":0,"u":"De klassieke testtheorie veronderstelt dat meetfouten volledig toevallig zijn, dat de gemiddelde meetfout over alle personen 0 is, en dat meetfouten niet gecorreleerd zijn met true scores."},{"t":"5","q":"Wat gebeurt er met de betrouwbaarheid als de variantie van de meetfouten daalt?","o":["De betrouwbaarheid stijgt","De betrouwbaarheid daalt","De betrouwbaarheid blijft exact gelijk","Er is geen verband tussen beide"],"a":0,"u":"Aangezien X = T + E en σ²x = σ²t + σ²e, geldt: hoe kleiner de variantie van de meetfouten, hoe hoger de betrouwbaarheid (Rxx = σ²t/σ²x)."},{"t":"5","q":"Wanneer worden twee testen 'parallel' genoemd in de klassieke testtheorie?","o":["Als hun true scores gelijk zijn en de varianties van hun meetfouten gelijk zijn","Als ze exact dezelfde items bevatten","Als ze op hetzelfde moment worden afgenomen","Als hun betrouwbaarheid boven 0,70 ligt"],"a":0,"u":"Twee testen zijn parallel als hun true scores gelijk zijn (x̄t = ȳt) en de varianties van hun meetfouten gelijk zijn (σ²e1 = σ²e2). Bij parallelle testen geldt Rxx' = r."},{"t":"5","q":"Wat vertelt de standaardmeetfout (se) ons?","o":["Hoe accuraat een individuele geobserveerde score is","Hoeveel items een test heeft","De correlatie tussen twee subtests","Het percentage juist beantwoorde items"],"a":0,"u":"De standaardmeetfout is de standaarddeviatie van de meetfouten en vertelt hoe groot de gemiddelde afwijking is die je kan verwachten tussen de geobserveerde score en de true score."},{"t":"6","q":"Wat is een risico van test-hertestbetrouwbaarheid?","o":["Uitval van participanten en hoge tijdsinvestering doordat de test 2 keer afgenomen moet worden","Je kan de test maar 1 keer afnemen","Er is geen tijdsinterval nodig tussen beide afnames","Het werkt enkel bij dichotome items"],"a":0,"u":"Test-hertestbetrouwbaarheid vereist dat dezelfde test op 2 tijdstippen wordt afgenomen bij dezelfde mensen, wat een grote tijdsinvestering vraagt, tot uitval kan leiden en soms onmogelijk is (bv. anonieme data)."},{"t":"6","q":"Wat is het basisidee van split-halfbetrouwbaarheid?","o":["De items van een test in twee helften verdelen en deze als parallelle testen behandelen","De test twee keer op twee verschillende dagen afnemen","Enkel de moeilijkste items van de test gebruiken","Twee verschillende testen bij dezelfde groep afnemen"],"a":0,"u":"Bij split-halfbetrouwbaarheid verdeel je de items van 1 test in 2 subtesten, bereken je de schaalscores van beide helften, en pas je de Spearman-Brown formule toe op hun correlatie."},{"t":"6","q":"Wat is een probleem bij split-halfbetrouwbaarheid?","o":["Er zijn veel manieren om items te verdelen in subtesten, en de keuze beïnvloedt het resultaat","Ze kan enkel bij dichotome items gebruikt worden","Ze vereist altijd twee afnamemomenten","Ze werkt niet bij vragenlijsten met Likert-schalen"],"a":0,"u":"Een probleem bij split-half is dat er meerdere manieren zijn om items in twee subtesten te verdelen, en welke verdeling je kiest kan de geschatte betrouwbaarheid beïnvloeden."},{"t":"6","q":"Wat veronderstelt (ruwe) Cronbachs alpha die omega niet veronderstelt?","o":["Tau-equivalentie: elk item heeft dezelfde factorlading","Dat alle items dichotoom zijn","Dat de test minstens 20 items heeft","Dat er geen meetfouten zijn"],"a":0,"u":"Ruwe en gestandaardiseerde Cronbachs alpha (en KR20) veronderstellen tau-equivalentie, waarbij elk item exact even goed het construct meet. Omega, gebaseerd op factoranalyse, veronderstelt dit niet."},{"t":"6","q":"Wat is KR20 en wanneer wordt het gebruikt?","o":["Een betrouwbaarheidsmaat speciaal ontwikkeld voor testen met dichotome items, mathematisch equivalent aan ruwe Cronbachs alpha","Een IRT-model voor polytome items","Een maat voor sociale wenselijkheid","Een correctie voor gokgedrag bij examens"],"a":0,"u":"Kuder-Richardson 20 (KR20) is speciaal ontwikkeld voor testen met dichotome items (juist/fout) en is mathematisch equivalent aan de ruwe Cronbachs alpha."},{"t":"6","q":"Wat gebeurt er typisch met de betrouwbaarheid als je een test verlengt met even goede items?","o":["De betrouwbaarheid stijgt","De betrouwbaarheid daalt","De betrouwbaarheid blijft exact gelijk","De betrouwbaarheid wordt onmogelijk te schatten"],"a":0,"u":"Hoe meer items een test bevat, hoe hoger de betrouwbaarheid doorgaans is, mits de nieuwe items minstens even intern consistent zijn als de bestaande (Spearman-Brown-formule voor testverlenging)."},{"t":"6","q":"Waarom leidt een homogene steekproef tot een lagere geschatte betrouwbaarheid?","o":["Omdat er weinig variantie in testscores zit, zoals bij Wissler's mistake","Omdat homogene steekproeven altijd te klein zijn","Omdat homogene steekproeven meer meetfouten veroorzaken","Dit klopt niet, homogeniteit verhoogt net de betrouwbaarheid"],"a":0,"u":"Bij een homogene steekproef (weinig variantie in scores) zal de geschatte betrouwbaarheid automatisch zwakker zijn, zoals bij Wissler's mistake — betrouwbaarheid moet dus steeds opnieuw geschat worden per steekproef."},{"t":"7","q":"Wat is constructvaliditeit?","o":["De mate waarin bewijs en theorie de interpretatie van testscores volgens de vooropgestelde doelen ondersteunen","De mate waarin een test dezelfde resultaten geeft bij herhaling","De correlatie tussen twee subtests van dezelfde test","Het percentage correct beantwoorde items"],"a":0,"u":"Constructvaliditeit is de mate waarin theoretisch en empirisch bewijs de interpretatie van testscores, zoals bedoeld volgens de doelen van de test, ondersteunt. Het gaat dus over interpretatie en gebruik, niet enkel over de test zelf."},{"t":"7","q":"Wat is het verschil tussen inhoudsvaliditeit en indruksvaliditeit?","o":["Inhoudsvaliditeit wordt beoordeeld door experten, indruksvaliditeit door leken","Inhoudsvaliditeit wordt beoordeeld door leken, indruksvaliditeit door experten","Beide zijn identiek en inwisselbaar","Indruksvaliditeit is belangrijker voor het nut van de test"],"a":0,"u":"Inhoudsvaliditeit (content validity) wordt beoordeeld door experten en gaat over of de test de volledige inhoud van het construct dekt. Indruksvaliditeit (face validity) wordt beoordeeld door leken en gaat over of de test relevant lijkt, wat vooral de motivatie van respondenten beïnvloedt."},{"t":"7","q":"Wat is het verschil tussen een unidimensionele en een multidimensionele test?","o":["Bij unidimensioneel correleren alle items sterk en meten ze 1 construct; bij multidimensioneel vormen items clusters/subdimensies","Unidimensioneel heeft meer items dan multidimensioneel","Multidimensioneel wordt enkel gebruikt bij intelligentietests","Er is geen verschil in interne structuur"],"a":0,"u":"Een unidimensionele test heeft items die allemaal sterk met elkaar correleren en 1 onderliggend construct meten. Een multidimensionele test heeft clusters van items die sterk correleren binnen een cluster (subdimensie) maar zwak tussen clusters."},{"t":"7","q":"Wat is het verschil tussen exploratorische (EFA) en confirmatorische factoranalyse (CFA)?","o":["EFA is data-driven zonder voorkennis van het aantal factoren, CFA test een vooraf bepaalde theoretische structuur","CFA is data-driven, EFA test een vooraf bepaalde structuur","Beide zijn identiek qua doel","EFA kan enkel bij dichotome items gebruikt worden"],"a":0,"u":"Bij EFA weet je op voorhand niet hoeveel factoren er zijn; de data-analyse suggereert dit. Bij CFA ken je de theoretische structuur al en test je of die structuur past bij de verzamelde data."},{"t":"7","q":"Wat is convergente validiteit?","o":["Een (positieve of negatieve) correlatie tussen je test en een criterion variabele die er theoretisch mee zou moeten samenhangen","Een correlatie van 0 tussen twee constructen die niets met elkaar te maken hebben","De correlatie tussen twee helften van dezelfde test","De mate waarin een test dezelfde score geeft bij herhaling"],"a":0,"u":"Convergente validiteit toon je aan wanneer scores op je test correleren met een criterion variabele waarmee ze theoretisch verwacht worden samen te hangen (bv. stress en angst)."},{"t":"7","q":"Wat is discriminante validiteit?","o":["Een zwakke of afwezige correlatie tussen je test en een variabele die er theoretisch NIET mee zou moeten samenhangen","Een sterke correlatie met een gerelateerd construct","Het vermogen van een test om te discrimineren tussen hoog- en laagscoorders","De mate waarin een test bevooroordeeld is tegen een groep"],"a":0,"u":"Discriminante validiteit toon je aan wanneer scores op je test zwak of niet correleren met variabelen waarmee theoretisch geen verband verwacht wordt."},{"t":"7","q":"Waarom vormt betrouwbaarheid een bovengrens voor constructvaliditeit?","o":["Omdat r ≤ √Rxx, dus een zwakke betrouwbaarheid beperkt hoe hoog een validiteitscorrelatie kan zijn","Omdat betrouwbaarheid en validiteit exact dezelfde formule gebruiken","Omdat validiteit altijd hoger is dan betrouwbaarheid","Omdat betrouwbaarheid geen invloed heeft op validiteit"],"a":0,"u":"De correlatie tussen geobserveerde en true scores is r = √Rxx. Een zwakke betrouwbaarheid houdt daardoor een lage bovengrens in voor de haalbare validiteitscorrelatie — goede betrouwbaarheid is dus noodzakelijk maar niet voldoende voor goede constructvaliditeit."},{"t":"8","q":"Wat is een nomologisch netwerk?","o":["Een weergave van de relaties tussen testscores en andere (criterium)variabelen, gebaseerd op theorie","Een netwerk van alle items binnen 1 test","Een grafiek van de normaalverdeling","Een schema van alle mogelijke antwoordopties"],"a":0,"u":"Een nomologisch netwerk geeft de theoretisch verwachte relaties weer tussen testscores en criteriumvariabelen; je vertrekt vanuit de theorie om te voorspellen of een verband positief, negatief of afwezig zou moeten zijn."},{"t":"8","q":"Wat is het basisidee van de multitrait-multimethod (MTMM) methode?","o":["Meerdere constructen meten met meerdere methoden om op een minder subjectieve manier bewijs voor validiteit te verzamelen","1 construct meten met 1 methode zo vaak mogelijk","Enkel zelfrapportagevragenlijsten gebruiken voor alle constructen","De betrouwbaarheid van een test vervangen door validiteit"],"a":0,"u":"MTMM meet meerdere constructen (bv. extraversie, neuroticisme) met meerdere methoden (bv. zelfrapportage, partnerbeoordeling, observatie) om op een minder subjectieve manier convergente en discriminante validiteit te onderzoeken."},{"t":"8","q":"Welk patroon van correlaties verwacht men in een MTMM-matrix?","o":["Monotrait-monomethode > monotrait-heteromethode > heterotrait-monomethode > heterotrait-heteromethode","Heterotrait-heteromethode > monotrait-monomethode","Alle correlaties zijn gelijk in een goede MTMM-matrix","Enkel de diagonaal telt mee"],"a":0,"u":"Men verwacht: |monotrait-monomethode| > |monotrait-heteromethode| > |heterotrait-monomethode| > |heterotrait-heteromethode|, wat wijst op zowel convergente als discriminante validiteit."},{"t":"8","q":"Wat is 'range restriction' en welk effect heeft het op een correlatie?","o":["Beperkte variantie in een variabele, waardoor de correlatie automatisch zwakker wordt","Een te grote steekproef, waardoor correlaties overschat worden","Het afronden van scores op hele getallen","Een correctie die correlaties altijd sterker maakt"],"a":0,"u":"Range restriction betekent dat er weinig variantie is in een variabele (bv. door een homogene steekproef). Omdat correlatie co-variabiliteit weerspiegelt, wordt de correlatie daardoor automatisch zwakker."},{"t":"8","q":"Waarom is een validiteitscoëfficiënt gebaseerd op twee verschillende meetmethoden sterker bewijs dan met dezelfde methode?","o":["Omdat gedeelde methode-variantie de correlatie kunstmatig sterker maakt bij dezelfde methode","Omdat verschillende methoden altijd zwakkere correlaties geven","Omdat dezelfde methode nooit een correlatie kan opleveren","Omdat methode-variantie geen effect heeft op correlaties"],"a":0,"u":"Wanneer variabelen met dezelfde methode gemeten worden, ontstaat gedeelde methode-variantie die de correlatie kunstmatig versterkt. Verschillende methoden geven daarom sterker bewijs voor een werkelijk verband."},{"t":"8","q":"Hoe corrigeer je een validiteitscoëfficiënt voor onbetrouwbaarheid van de criteriumvariabele?","o":["r-gecorrigeerd = r-origineel gedeeld door de wortel van Ryy'","r-gecorrigeerd = r-origineel maal Rxx'","r-gecorrigeerd = r-origineel min 1","Corrigeren is nooit mogelijk"],"a":0,"u":"Om enkel te corrigeren voor de onbetrouwbaarheid van de criteriumvariabele geldt: r-gecorrigeerd = r-origineel / √Ryy'."},{"t":"9","q":"Wat is responsbias?","o":["Een consistente neiging om inaccurate antwoorden te geven op vragen in een psychologische test","Een fout in het scoringsalgoritme van een test","Het gebrek aan normen bij een nieuwe test","Een synoniem voor toevallige meetfouten"],"a":0,"u":"Responsbias is de consistente neiging om inaccurate antwoorden te geven (dus antwoorden die afwijken van de werkelijke, ware mening), en vormt een fundamenteel probleem bij psychologische testen, vooral in high-stakes contexten."},{"t":"9","q":"Wat is het verschil tussen responsset en responsstijl?","o":["Responsset wordt uitgelokt door de context, responsstijl is consistent ongeacht de context","Responsstijl wordt uitgelokt door de context, responsset is altijd aanwezig","Beide begrippen zijn identiek","Responsset komt enkel voor bij projectieve testen"],"a":0,"u":"Responsset is responsbias die uitgelokt wordt door een specifieke context (in een andere context geen bias). Responsstijl is een bias die consistent aanwezig is, ongeacht de context."},{"t":"9","q":"Wat is acquiescence bias?","o":["De neiging om (niet) akkoord te gaan met een uitspraak zonder aandacht voor de inhoud","De neiging om altijd extreme antwoordopties te kiezen","Bewust slechter scoren dan de werkelijkheid","Het gokken van antwoorden bij meerkeuzevragen"],"a":0,"u":"Acquiescence bias is de neiging om akkoord (yay-saying) of niet akkoord (nay-saying) te gaan met uitspraken, zonder echt op de inhoud te letten. Dit is vooral een probleem bij items die allemaal in dezelfde richting geformuleerd zijn."},{"t":"9","q":"Wat is malingering?","o":["Bewust een slechter of negatiever beeld van zichzelf geven dan de werkelijkheid","De neiging om sociaal wenselijk te antwoorden","Het gebrek aan variabiliteit in antwoorden","Een vorm van gokken bij meerkeuzevragen"],"a":0,"u":"Malingering (faking-bad) is het tegenovergestelde van sociale wenselijkheid: bewust een negatiever beeld schetsen dan de realiteit, bijvoorbeeld bij een test naar cognitieve klachten na een arbeidsongeval."},{"t":"9","q":"Wat is een kenmerk van achteloze antwoorden (insufficient effort responding)?","o":["Gebrek aan variabiliteit in antwoorden (straight-lining) en snelle reactietijden","Extreem trage reactietijden op elke vraag","Enkel voorkomend bij mondelinge testafname","Enkel voorkomend bij projectieve testen"],"a":0,"u":"Achteloze antwoorden worden gekenmerkt door een gebrek aan variabiliteit (straight-lining), snelle reactietijden en inconsistente antwoorden, en ontstaan door kenmerken van de schaal, de respondent of de context."},{"t":"9","q":"Wat is het doel van een gebalanceerde schaal met reverse-scoring?","o":["Effecten van acquiescence bias minimaliseren door zowel positief als negatief geformuleerde items op te nemen","De testlengte verkorten","Sociale wenselijkheid volledig elimineren","Gokgedrag bij examens tegengaan"],"a":0,"u":"Een gebalanceerde schaal neemt zowel positief als negatief geformuleerde items op; antwoorden op negatief geformuleerde items worden omgescoord (reverse-scoring), wat de effecten van acquiescence bias vermindert."},{"t":"9","q":"Wat meet de longstringindex?","o":["Hoe vaak dezelfde antwoordoptie na elkaar gekozen wordt (invariabiliteit)","De reactietijd per vraag","De correlatie tussen twee semantisch gelijkaardige items","Het aantal correct beantwoorde items"],"a":0,"u":"De longstringindex telt hoe vaak achtereenvolgens dezelfde antwoordoptie gekozen wordt, om invariabiliteit (bv. altijd 'neutraal' aanduiden) en dus achteloos antwoorden te detecteren."},{"t":"10","q":"Wat is de optimale waarde voor de item-moeilijkheidsindex (pi) bij een niet-meerkeuzevraag?","o":["0,50","0,10","1,00","0,00"],"a":0,"u":"De item-moeilijkheidsindex is de proportie respondenten die een item correct beantwoordt. Bij een gewone vraag is pi = 0,50 optimaal (met een vuistregel tussen 0,30 en 0,70)."},{"t":"10","q":"Hoe wordt de optimale item-moeilijkheidsindex aangepast bij meerkeuzevragen?","o":["pi-optimaal = (1 + g) / 2, waarbij g de gokkans is","pi-optimaal blijft altijd 0,50","pi-optimaal = g / 2","pi-optimaal hangt niet af van het aantal antwoordopties"],"a":0,"u":"Bij meerkeuzevragen moet rekening gehouden worden met de kans op een juiste gok (g): pi-optimaal = (1 + g) / 2."},{"t":"10","q":"Wat meet de item-betrouwbaarheidsindex (si·riT)?","o":["De bijdrage van een item aan de betrouwbaarheid, via de correlatie tussen itemscore en schaalscore","De correlatie tussen een item en een extern criterium","Het percentage respondenten dat het item correct beantwoordt","De moeilijkheidsgraad van het item"],"a":0,"u":"De item-betrouwbaarheidsindex combineert de standaarddeviatie van het item (si) met de correlatie tussen de itemscore en de totale schaalscore (riT)."},{"t":"10","q":"Wat is het verschil tussen de item-betrouwbaarheidsindex en de item-validiteitsindex?","o":["De betrouwbaarheidsindex gebruikt de correlatie met de schaalscore, de validiteitsindex de correlatie met een criterion variabele","Beide gebruiken exact dezelfde correlatie","De validiteitsindex wordt enkel gebruikt bij dichotome items","De betrouwbaarheidsindex bestaat niet voor meerkeuzevragen"],"a":0,"u":"De item-betrouwbaarheidsindex (si·riT) gebruikt de correlatie tussen het item en de totale schaalscore. De item-validiteitsindex (si·riC) gebruikt de correlatie tussen het item en een extern criterium."},{"t":"10","q":"Hoe wordt de item-discriminantie-index (Di) berekend?","o":["(Uc - Lc) / U, met U de hoog- en L de laagscoorders (top/bottom 27%)","Het gemiddelde van alle itemscores","De variantie van de schaalscore gedeeld door het aantal items","De correlatie tussen twee subtests"],"a":0,"u":"De item-discriminantie-index vergelijkt hoogscoorders (top 27%) en laagscoorders (bottom 27%): Di = (Uc - Lc) / U, waarbij Uc en Lc het aantal correcte antwoorden zijn in elke groep."},{"t":"11","q":"Waar kijkt itemresponstheorie (IRT) naar, in tegenstelling tot de klassieke testtheorie?","o":["Naar de vragen/items zelf, met parameters zoals moeilijkheid en discriminerend vermogen","Enkel naar de totale schaalscore","Enkel naar de betrouwbaarheid van de hele test","Naar de leeftijd van de respondenten"],"a":0,"u":"IRT kijkt naar de kwaliteit van individuele items, met parameters zoals moeilijkheid en discriminerend vermogen, in plaats van enkel naar de test als geheel zoals in de klassieke testtheorie."},{"t":"11","q":"Wat voegt het 2-parameter logistisch model (2PL) toe aan het 1PL-model?","o":["Het discriminerend vermogen van het item (ai)","De kans op een juiste gok (c)","De leeftijd van de respondent","Het aantal antwoordopties"],"a":0,"u":"Het 1PL-model gebruikt enkel vaardigheid van de respondent en moeilijkheid van het item. Het 2PL-model voegt het discriminerend vermogen van het item (ai) toe: hoe goed het item onderscheid maakt tussen respondenten."},{"t":"11","q":"Wat voegt het 3-parameter logistisch model (3PL) toe aan het 2PL-model?","o":["De kans op een juiste gok (c)","Het discriminerend vermogen van het item","De moeilijkheid van het item","De vaardigheid van de respondent"],"a":0,"u":"Het 3PL-model voegt aan het 2PL-model een parameter c toe: de kans dat een respondent het item correct gokt, ook als hij het niet kent."},{"t":"11","q":"Wanneer wordt het graded response model gebruikt?","o":["Bij testen met polytome items (meer dan 2 antwoordopties, zoals nooit-zelden-soms-vaak-altijd)","Bij testen met enkel dichotome items","Enkel bij intelligentietests","Enkel wanneer er geen gokkans bestaat"],"a":0,"u":"Het graded response model is relevant bij polytome items met meerdere geordende antwoordopties, en berekent de kans dat je een bepaalde optie of hoger selecteert, in functie van vaardigheid, drempels en discriminerend vermogen."},{"t":"11","q":"Wat is Differential Item Functioning (DIF)?","o":["Wanneer item-parameters (moeilijkheid, discriminerend vermogen) verschillen tussen groepen, wat wijst op een gebrek aan fairness","Wanneer alle items exact dezelfde moeilijkheidsgraad hebben","Een synoniem voor Cronbachs alpha","Het verschil tussen twee testversies van dezelfde lengte"],"a":0,"u":"DIF onderzoekt of item-parameters verschillen tussen groepen (bv. mannen versus vrouwen), wat betekent dat een test niet even goed functioneert voor elke groep — een bedreiging voor fairness/constructvaliditeit."},{"t":"11","q":"Wat is het verschil tussen uniforme en non-uniforme DIF?","o":["Bij uniforme DIF blijven de curves parallel, bij non-uniforme DIF kunnen ze elkaar kruisen","Uniforme DIF komt enkel voor bij 1PL-modellen","Non-uniforme DIF betekent dat er geen DIF is","Beide termen zijn synoniemen"],"a":0,"u":"Bij uniforme DIF verschilt de locatie van de Item Characteristic Curves tussen subgroepen, maar blijven ze parallel. Bij non-uniforme DIF kunnen de curves elkaar ook kruisen."},{"t":"12","q":"Wat is een cut-offscore?","o":["De waarde waarmee een testscore vergeleken wordt om een diagnose of beslissing te nemen","De gemiddelde score van de normgroep","De hoogst mogelijke score op een test","De standaardmeetfout van een test"],"a":0,"u":"Een cut-offscore is de waarde waarmee een testscore vergeleken wordt om op basis van de test een diagnose te stellen of beslissing te nemen."},{"t":"12","q":"Hoe wordt sensitiviteit berekend?","o":["TP / (TP + FN)","TN / (TN + FP)","TP / (TP + FP)","TN / (TN + FN)"],"a":0,"u":"Sensitiviteit (true positive rate) is de proportie correct geïdentificeerde personen mét het kenmerk, ten opzichte van alle personen die het kenmerk werkelijk hebben: TP / (TP + FN)."},{"t":"12","q":"Hoe wordt specificiteit berekend?","o":["TN / (TN + FP)","TP / (TP + FN)","TP / (TP + FP)","TN / (TN + FN)"],"a":0,"u":"Specificiteit (true negative rate) is de proportie correct geïdentificeerde personen zonder het kenmerk, ten opzichte van alle personen die het kenmerk werkelijk niet hebben: TN / (TN + FP)."},{"t":"12","q":"Wat is de positive predictive value?","o":["De kans dat iemand met een positief testresultaat het kenmerk ook werkelijk heeft: TP / (TP + FP)","De kans dat iemand met het kenmerk een positief testresultaat krijgt","Een ander woord voor sensitiviteit","De kans dat een negatieve diagnose correct is"],"a":0,"u":"De positive predictive value geeft de kans weer dat iemand die positief test ook werkelijk het gemeten kenmerk heeft: TP / (TP + FP). Deze waarde is sterk afhankelijk van de prevalentie in de populatie."},{"t":"12","q":"Wat toont een ROC-curve en hoe kies je de optimale cut-off?","o":["Sensitiviteit tegen false positive rate; het punt dichtst bij de linkerbovenhoek is optimaal","Enkel de accuraatheid van de test in 1 getal","De verdeling van ruwe scores op de test","De correlatie tussen twee subtests"],"a":0,"u":"Een ROC-curve zet sensitiviteit (y-as) uit tegen de false positive rate (x-as, oftewel 1 - specificiteit) voor elke mogelijke cut-off. Het punt dat het dichtst bij de linkerbovenhoek ligt, geeft de beste balans tussen sensitiviteit en specificiteit."},{"t":"12","q":"Hoe interpreteer je een AUC (area under the curve) tussen 0,70 en 0,90?","o":["Gemiddelde accuraatheid","Zeer goede accuraatheid","Zwakke accuraatheid","De test is compleet nutteloos"],"a":0,"u":"Een AUC tussen 0,70 en 0,90 wijst op gemiddelde accuraatheid. Boven 0,90 spreekt men van zeer goede accuraatheid, tussen 0,50 en 0,70 van zwakke accuraatheid."},{"t":"12","q":"Waarom verlaagt een lagere cut-offwaarde de specificiteit maar verhoogt ze de sensitiviteit?","o":["Omdat meer mensen als positief geclassificeerd worden, waardoor je meer echte positieven maar ook meer valse positieven vindt","Omdat een lagere cut-off altijd tot minder foute diagnoses leidt","Omdat sensitiviteit en specificiteit onafhankelijk zijn van de cut-off","Omdat een lagere cut-off de steekproefgrootte verandert"],"a":0,"u":"Een lagere cut-off classificeert meer mensen als positief: dit vangt meer echte positieven (hogere sensitiviteit) maar ook meer valse positieven (lagere specificiteit) — een klassieke trade-off."}],"hacks":[{"h":"Betrouwbaarheid vs. validiteit onthouden","t":"Betrouwbaarheid = precisie (consistentie, toevallige fouten). Validiteit = accuraatheid (meet je écht het juiste construct, systematische fouten). Een weegschaal die altijd 2kg te veel aangeeft is betrouwbaar maar niet valide."},{"h":"Sensitiviteit en specificiteit niet verwisselen","t":"Sensitiviteit = 'SN-out': hoge Sensitiviteit, Negatieve test sluit ziekte redelijk goed uit. Specificiteit = 'SP-in': hoge Specificiteit, Positieve test bevestigt ziekte redelijk goed."},{"h":"TP/TN/FP/FN als 2x2-tabel tekenen","t":"Zet 'test positief/negatief' verticaal en 'werkelijk aan-/afwezig' horizontaal. Sensitiviteit en specificiteit lees je dan af als kolomverhoudingen, predictive values als rijverhoudingen."},{"h":"Convergent = 'komt samen', discriminant = 'maakt onderscheid'","t":"Convergente validiteit: scores hangen samen met wat er theoretisch bij hoort. Discriminante validiteit: scores hangen NIET samen met wat er theoretisch los van staat."},{"h":"Nominaal-Ordinaal-Interval-Ratio = NOIR, hoe verder, hoe meer info","t":"Elke volgende schaal erft de eigenschappen van de vorige en voegt er 1 aan toe: identiteit → orde → kwantiteit → absoluut nulpunt."},{"h":"Wissler's mistake = homogene steekproef","t":"Een steekproef met weinig variatie (bv. enkel topstudenten) onderschat altijd betrouwbaarheid én validiteit, ongeacht hoe goed de test zelf is."},{"h":"EFA zoekt, CFA test","t":"Exploratorische factoranalyse: je weet nog niet hoeveel factoren er zijn. Confirmatorische factoranalyse: je test een structuur die je al verwacht vanuit theorie."},{"h":"Meer items = meer betrouwbaarheid (Spearman-Brown)","t":"Een test verlengen met gelijkwaardige items verhoogt bijna altijd de betrouwbaarheid — dit is de kern van de Spearman-Brown-formule voor testverlenging."},{"h":"Responsbias-rijtje: Acquiescence, Extreme/neutrale bias, Sociale wenselijkheid, Malingering, Achteloosheid, Gokken","t":"Onthoud de volgorde AESMAG om snel alle soorten responsbias uit hoofdstuk 9 op te sommen bij een examenvraag."},{"h":"IRT-parameters opbouwen als 1-2-3PL","t":"1PL: enkel moeilijkheid. 2PL: + discriminerend vermogen. 3PL: + gokkans. Elk model erft de parameters van het vorige en voegt er 1 bij."}],"theory":[{"h":"1. Psychometrie & psychologische testen","items":["Psychometrie is de wetenschappelijke studie van (de kwaliteit van) psychologische testen.","Testing = 1 test, 1 conclusie. Assessment = combinatie van testen en andere technieken.","Een psychologische test is een systematische procedure om gedrag tussen personen (inter-individueel) of binnen 1 persoon over tijd (intra-individueel) te vergelijken.","Een test bestaat uit een eindig, representatief 'staal van gedrag' (items); items hoeven niet rechtstreeks op het gemeten gedrag te lijken.","Systematische procedures spelen op 3 niveaus: testontwikkeling, testafname (standaardisatie) en testscore/interpretatie.","X = T (true score) + E (meetfout): elke testscore bevat een schatting én een meetfout.","Norm-referenced (vergelijking met anderen) versus criterion-referenced (vergelijking met een vast criterium) testen.","Geschiedenis: China (Zhou-dynastie) als eerste testsysteem; fysiognomie en frenologie als onbetrouwbare voorlopers; Wundt (experimentele psychologie, individuele verschillen), Galton (erfelijkheid, differentiële psychologie), Cattell ('mentale test'), Wissler's mistake (homogene steekproef).","Binet & Simon (1905) ontwikkelen de eerste moderne intelligentietest, gericht op hogere mentale processen; Stern voert het IQ in (mentale leeftijd/chronologische leeftijd); Terman past dit aan tot de Stanford-Binet test (puntenschaal).","Misbruik van intelligentietesten bij immigranten (Goddard) en WOI/WOII (Army alpha/beta) toonden het belang van standaardisatie, taal/cultuur en testomstandigheden aan."]},{"h":"2. Meetschalen","items":["Meten = getallen toekennen aan objecten/gebeurtenissen volgens een set van regels (de schaalmethode).","Nominale schaal: enkel identiteit (categorieën), vereist identiteit, mutuele exclusiviteit en exhaustiviteit.","Ordinale schaal: identiteit + orde (rangorde), maar geen informatie over de grootte van verschillen.","Intervalschaal: identiteit + orde + kwantiteit (gestandaardiseerde, gelijke meeteenheden), maar geen absoluut nulpunt.","Ratioschaal: alle vorige eigenschappen + een absoluut nulpunt (afwezigheid van het kenmerk).","Relatief/arbitrair nulpunt (bv. 0°C, intelligentie) versus absoluut nulpunt (bv. 0 cm, 0 sec).","Nominaal/ordinaal → non-parametrische testen (bv. Mann-Whitney); interval/ratio → parametrische testen (bv. ANOVA).","Psychologische testen worden vaak behandeld alsof ze intervalniveau hebben; deze aanname is zwakker bij korte testen."]},{"h":"3. Individuele verschillen","items":["Interindividuele verschillen (tussen personen) versus intra-individuele verschillen (binnen 1 persoon).","Karakteristieke waarden van positie: modus (meest frequent), mediaan (middelste score), rekenkundig gemiddelde.","Kwantielen: kwartielen (Q1-Q4), decielen (D1-D10), percentielen (P1-P100).","Karakteristieke waarden van spreiding: variantie (s² = Σ(Xi-X̄)²/n) en standaarddeviatie (s = √s²).","Vorm van de verdeling: negatief scheef (x̄ < x̃) versus positief scheef (x̄ > x̃); Pearson's median skewness.","Covariantie geeft enkel de richting van een verband; de Pearson-correlatie (tussen -1 en +1) geeft richting én sterkte.","Vuistregels sterkte correlatie: |r|=0,10 zwak, |r|=0,30 gemiddeld, |r|=0,50 sterk.","Lambda (voorspelling bij dichotome variabelen) en chi-kwadraat (verwachte versus geobserveerde waarden) voor verbanden tussen categorische variabelen."]},{"h":"4. Transformatiewaarden & normen","items":["Ruwe scores zijn moeilijk te interpreteren zonder context (moeilijkheid van de test, prestatie van anderen, wat is normaal).","Absolute transformatiemeetwaarden (bv. percentage juist) zijn onafhankelijk van andermans prestaties, maar houden geen rekening met testmoeilijkheid.","Relatieve transformatiemeetwaarden met een niet-representatieve referentiegroep: rangnummers en percentiele rangen.","Rangnummers houden rekening met testmoeilijkheid, maar zijn afhankelijk van de (toevallige) samenstelling en grootte van de referentiegroep.","Percentiele rangen zijn onafhankelijk van steekproefgrootte, maar blijven ordinaal (geen gemiddelde nemen, geen gelijke afstanden).","Lineaire standaardmeetwaarden: z-score (z=(x-μ)/σ) en T-score (T=10z+50); genormaliseerde standaardmeetwaarden en stanines.","Normen (representatieve referentiegroep) zijn de sterkste vorm van transformatiemeetwaarden: leeftijdsnormen, klasnormen, standaardnormen.","Normen moeten periodiek herzien worden (bv. stijgende intelligentiescores door de tijd)."]},{"h":"5. Betrouwbaarheid","items":["Betrouwbaarheid = mate waarin verschillen tussen geobserveerde scores het gevolg zijn van verschillen tussen true scores, niet van meetfouten.","Toevallige meetfouten (onvoorspelbaar, bv. vermoeidheid) versus systematische meetfouten (rater bias, instrument bias, respons bias).","Klassieke testtheorie: X = T + E; meetfouten zijn volledig toevallig, gemiddeld 0, en niet gecorreleerd met true scores.","Variantie van meetfouten bepaalt betrouwbaarheid: σ²x = σ²t + σ²e, dus hoe kleiner σ²e, hoe hoger de betrouwbaarheid.","4 manieren om naar betrouwbaarheid te kijken: verhouding van varianties (true/observed of error/observed) en correlaties (observed-true of observed-error).","Rxx ≥ 0,70 is een vuistregel; Rxx geeft aan welk percentage van de variantie in geobserveerde scores toe te schrijven is aan true score variantie.","Standaardmeetfout (se = sx·√(1-Rxx)) geeft de gemiddelde afwijking weer die je kan verwachten tussen geobserveerde en true score.","Parallelle testen (gelijke true scores, gelijke foutvarianties) lossen het probleem op dat we enkel geobserveerde scores kennen: bij parallelle testen is Rxx' = r."]},{"h":"6. Betrouwbaarheid schatten","items":["Parallelletestenbetrouwbaarheid: 2 parallelle testen afnemen; risico op carry-over/spill-over effecten die de betrouwbaarheid overschatten.","Test-hertestbetrouwbaarheid: dezelfde test op 2 tijdstippen; assumpties over stabiliteit van true scores (trait vs. state) en gelijke testomstandigheden; praktisch duur en gevoelig voor uitval.","Interne consistentie: 1 test op 1 moment afnemen en opdelen in (pseudo-)parallelle delen.","Split-halfbetrouwbaarheid: items verdelen in 2 subtesten, correlatie berekenen, Spearman-Brown-correctie toepassen; probleem: subjectieve keuze van verdeling.","Ruwe Cronbachs alpha: meest gebruikte methode; item-level benadering; veronderstelt tau-equivalentie (gelijke factorladingen).","Gestandaardiseerde Cronbachs alpha: nuttig bij verschillende antwoordschalen/itemvarianties; gebaseerd op gemiddelde inter-itemcorrelatie.","KR20: speciaal voor dichotome items, mathematisch equivalent aan ruwe Cronbachs alpha.","Omega: gebaseerd op factoranalyse, vereist geen tau-equivalentie (voordeel t.o.v. Cronbachs alpha en KR20).","Factoren die betrouwbaarheid beïnvloeden: testlengte (Spearman-Brown voor testverlenging) en samenstelling van de steekproef (Wissler's mistake bij homogene steekproeven)."]},{"h":"7. Constructvaliditeit","items":["Constructvaliditeit = mate waarin bewijs en theorie de interpretatie van testscores volgens de vooropgestelde doelen ondersteunen; gaat over gebruik/interpretatie, niet enkel de test zelf; geen alles-of-niets.","Interne, externe en statistische validiteit zijn andere onderzoeksvaliditeitsbegrippen, te onderscheiden van constructvaliditeit van een test.","5 soorten bewijs voor constructvaliditeit: inhoud van de test, interne structuur, verbanden met andere variabelen, gevolgen van gebruik, antwoordprocessen.","Inhoudsvaliditeit (content validity, door experten) versus indruksvaliditeit (face validity, door leken, belangrijk voor motivatie).","Interne structuur: unidimensioneel (1 construct) versus multidimensioneel (subdimensies/clusters); EFA (data-driven, aantal factoren onbekend) versus CFA (theoriegedreven, structuur getest).","Antwoordprocessen: interpretatieproblemen bij vage vragen; oplossing via duidelijke vragen en thinking-aloud protocollen.","Verbanden met andere variabelen: convergente validiteit (verwacht verband aanwezig), discriminante validiteit (geen verband waar geen verwacht wordt), concurrente (zelfde moment) versus predictieve validiteit (later moment), known-groups validiteit (verschil tussen groepen zoals verwacht).","Gevolgen van testgebruik: fairness, meetinvariantie (CFA in subgroepen) en differential item functioning.","Betrouwbaarheid (precisie) versus constructvaliditeit (accuraatheid): r ≤ √Rxx, dus betrouwbaarheid is een bovengrens (noodzakelijk, niet voldoende) voor validiteit."]},{"h":"8. Constructvaliditeit & verbanden","items":["Nomologisch netwerk: relaties tussen testscores en criteriumvariabelen, vertrekkend vanuit theoretische verwachtingen.","Validiteitscoëfficiënten (correlaties of andere statistieken) worden getoetst aan die theoretische verwachtingen; 1 studie is onvoldoende bewijs, validiteitsgeneralisatie via meta-analyse is sterker.","MTMM-methode: meerdere constructen met meerdere methoden meten, resulterend in een correlatiematrix om op een minder subjectieve manier convergente en discriminante validiteit te tonen.","Verwacht patroon: monotrait-monomethode > monotrait-heteromethode > heterotrait-monomethode > heterotrait-heteromethode correlaties.","Correlaties worden beïnvloed door: true-score correlatie, (toevallige) meetfouten (r_xy ≈ r_TxTy·√(Rxx·Ryy)), range restriction (beperkte variantie verzwakt correlaties), en gedeelde methode-variantie (versterkt correlaties kunstmatig).","Correctie voor onbetrouwbaarheid: r-gecorrigeerd = r-origineel / √(Rxx·Ryy') (beide) of / √Ryy' (enkel criterium).","Interpretatie van effect sizes is niet universeel vastgelegd (bv. Meyer: klein=0,11, gemiddeld=0,33, sterk=0,55) — rapporteer altijd welke richtlijn je gebruikt."]},{"h":"9. Responsbias","items":["Responsbias = consistente neiging om inaccurate antwoorden te geven; historisch voorbeeld: sociaal wenselijke antwoorden bij de peilingen rond Tom Bradley (1982).","Responsset (contextafhankelijk) versus responsstijl (consistent, ongeacht context).","Acquiescence bias (yay-/nay-saying): akkoord gaan zonder aandacht voor inhoud, vooral bij moeilijke/ambigue items of afleiding tijdens afname.","Extreme-antwoordenbias en neutrale-antwoordenbias: voorkeur voor respectievelijk extreme of neutrale antwoordopties, wat gecorreleerde meetfouten en overschatte verbanden veroorzaakt.","Sociale wenselijkheid (faking good, impression management/self-deception) versus malingering (faking bad), beide leiden tot niet-valide scores en overschatte verbanden.","Achteloze antwoorden (insufficient effort responding): straight-lining, snelle reactietijden, inconsistentie; verzwakt betrouwbaarheid, kan verbanden kunstmatig versterken of verzwakken.","Gokken: relevant bij testen met juiste/foute antwoorden, vooral bij beperkt aantal antwoordopties.","Preventie: anonimiteit, kortere testen, duidelijke/neutrale vragen, goede testomstandigheden, forced-choice of minimal-choice antwoordformaten.","Vermindering van effecten: gebalanceerde schalen met reverse-scoring; giscorrectie; situational judgement tests.","Detectie: bogusitems, responstijd, longstringindex (invariabiliteit), consistentie-indexen, self-reportitems, validiteitsschalen, gespecialiseerde testen (bv. Marlowe-Crowne, Dot Counting Test)."]},{"h":"10. Itemanalyse","items":["Itemanalyse beoordeelt de kwaliteit van individuele vragen binnen een test.","Item-moeilijkheidsindex (pi) = proportie respondenten die het item correct beantwoordt; optimaal rond 0,50 (vuistregel 0,30-0,70); bij meerkeuzevragen pi-optimaal = (1+g)/2.","Item-betrouwbaarheidsindex (si·riT): standaarddeviatie van het item gecombineerd met correlatie tussen itemscore en schaalscore.","Item-validiteitsindex (si·riC): standaarddeviatie van het item gecombineerd met correlatie tussen itemscore en een extern criterium.","Beide indexen samen interpreteren: de beste items scoren goed op zowel betrouwbaarheid als validiteit.","Item-discriminantie-index (Di = (Uc-Lc)/U): vergelijkt hoog- (top 27%) en laagscoorders (bottom 27%) op wie het item correct beantwoordt.","Bij meerkeuzevragen ook kijken naar welke foute optie (afleider) gekozen wordt."]},{"h":"11. Itemresponstheorie","items":["IRT kijkt naar de kwaliteit van individuele items (in plaats van enkel de test als geheel).","1-parameter logistisch model (1PL/Rasch): kans op correct antwoord hangt af van vaardigheid (θ) en moeilijkheid (β) van het item.","2-parameter logistisch model (2PL): voegt discriminerend vermogen (a) toe: hoe goed een item onderscheid maakt tussen respondenten.","3-parameter logistisch model (3PL): voegt gokkans (c) toe.","Graded response model: voor polytome items (meerdere geordende antwoordopties); gebruikt m-1 drempelparameters bij m antwoordopties.","Item Characteristic Curve (ICC): grafische weergave van de kans op correct antwoord per trait-level; 1PL-curves lopen parallel, 2PL-curves kunnen elkaar kruisen bij een gemeenschappelijk punt, 3PL-curves starten hoger door gokkans.","Item- en testinformatiewaarde: hoeveelheid informatie die (het geheel van) items geeft voor verschillende trait-levels; IRT laat toe dat kwaliteit verschilt per respondent, in tegenstelling tot klassieke testtheorie.","Differential Item Functioning (DIF): verschil in item-parameters tussen groepen, een bedreiging voor fairness; uniforme DIF (parallelle curves) versus non-uniforme DIF (curves kunnen kruisen)."]},{"h":"12. Testaccuraatheid","items":["Cut-offscore: waarde waarmee een testscore vergeleken wordt om een diagnose/beslissing te nemen; testaccuraatheid = overeenstemming met een referentietest (gold standard).","True positive (TP), true negative (TN), false positive (FP), false negative (FN) als basis van alle accuraatheidsmaten.","Sensitiviteit = TP/(TP+FN); specificiteit = TN/(TN+FP); beide dichter bij 1 is beter.","False positive rate = FP/(FP+TN) = 1-specificiteit; false negative rate = FN/(FN+TP) = 1-sensitiviteit.","Positive predictive value = TP/(TP+FP); negative predictive value = TN/(TN+FN); beide afhankelijk van de prevalentie van het kenmerk in de populatie.","Likelihood ratio's: positief (sensitiviteit/(1-specificiteit)) en negatief ((1-sensitiviteit)/specificiteit) geven aan hoeveel een testresultaat je vertrouwen in de diagnose verandert.","Bayes' theorema: berekent P(kenmerk aanwezig | positieve diagnose) op basis van sensitiviteit, specificiteit en prevalentie.","Keuze van cut-off: verlagen verhoogt sensitiviteit maar verlaagt specificiteit, en omgekeerd; een goede balans hangt af van de gewenste foutentypes.","ROC-curve (sensitiviteit tegen false positive rate) helpt de optimale cut-off kiezen (dichtst bij linkerbovenhoek); AUC vat de globale accuraatheid samen (>0,90 zeer goed, 0,70-0,90 gemiddeld, 0,50-0,70 zwak).","Beperkingen: accuraatheidsschattingen zijn afhankelijk van de representativiteit van de steekproef en van de kwaliteit van de gebruikte referentietest."]}]};
</script>
