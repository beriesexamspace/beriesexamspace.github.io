<meta name="theme-color" content="#FFFFFF">
  <script>
    (() => {
      // Ingelogd: meteen naar je eigen hub. De kaart is voor wie nog moet kiezen.
      try {
        if (Object.keys(window.localStorage).some(key => key.startsWith('sb-') && key.endsWith('-auth-token'))) {
          window.location.replace('hub.html');
          return;
        }
      } catch {}
      // Intro: de zoekbalk begint in het midden boven een vervaagde kaart (zie kaart.js). Niet bij minder beweging.
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('kaart-intro');
      let keuze;
      try { keuze = window.localStorage.getItem('bes_thema'); } catch {}
      const donker = keuze === 'donker' || (keuze !== 'licht' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = donker ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]').content = donker ? '#0B0B0C' : '#FFFFFF';
    })();
  </script>
