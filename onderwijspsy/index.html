 men niet met schalen maar met smileys, gezichten en barometers."},{"t":"9","q":"Wat blijkt uit het onderzoek over de samenhang tussen wiskundeangst en metacognitie?","o":["Enkel latere wiskundeangst voorspelt vroegere monitoring, nooit omgekeerd","Er is samenhang tussen wiskundeangst en metacognitie; angstig zijn maakt je minder goed in metacognitie, wat het productiedeficiet ondersteunt","Wiskundeangst verbetert de metacognitieve monitoring omdat kinderen alerter worden","Wiskundeangst staat volledig los van metacognitie en rekenen"],"a":1,"u":"Er bestaat samenhang tussen wiskundeangst en metacognitie, en vroege wiskundeangst voorspelt latere monitoring. Angstig zijn maakt je minder goed in metacognitie, wat gezien wordt als ondersteuning voor een productiedeficiet."},{"t":"9","q":"Wat zegt de brontekst over de verhouding tussen executieve functies (EF) en metacognitie (MC) in onderzoek?","o":["EF en MC vertonen sterke overlap, waardoor het moeilijk is om de unieke bijdrage van elk vast te stellen","EF vervangt metacognitie zodra kinderen de lagere school starten","EF en MC zijn volledig gescheiden processen zonder enige overlap","MC is een onderdeel van de motivatie en heeft niets met executieve functies te maken"],"a":0,"u":"De brontekst stelt dat EF sterk overlapt met MC, waardoor je er moeilijk een onderscheid tussen maakt. Daardoor is het lastig te bepalen wat een gedeelde en wat een unieke bijdrage is, en ligt de nadruk op die unieke bijdrage."},{"t":"10","q":"Wat wordt bedoeld met 'number sense' of getalgevoel?","o":["Het gemak waarmee iemand met getallen kan omspringen","Het vermogen om lange rekensommen foutloos op papier op te lossen","De snelheid waarmee iemand cijfers kan overschrijven","De kennis van formele wiskundige formules uit het middelbaar onderwijs"],"a":0,"u":"Number sense verwijst naar het gemak waarmee je met getallen kan omspringen en is een belangrijke voorspeller van reken- en wiskundevaardigheid."},{"t":"10","q":"Uit onderzoek met de number line task bij 55 uur oude baby's bleek dat zij significant meer juiste inschattingen maakten. Wat toonde dit vooral aan?","o":["Dat alleen kinderen zonder erfelijke belasting getallen kunnen inschatten","Dat de inschattingen enkel klopten bij zeer grote stippen","Dat een vorm van getalgevoel al vroeg en deels aangeboren aanwezig is","Dat getalgevoel volledig wordt aangeleerd op de lagere school"],"a":2,"u":"Pasgeborenen maakten met habituatietechnieken significant meer juiste inschattingen, onafhankelijk van de grootte van de stippen. Dit wijst op een aangeboren, vroeg aanwezig getalgevoel dat ook bij dieren zoals bijen wordt teruggevonden."},{"t":"10","q":"Wat is het belangrijkste verschil tussen 'early number sense' en 'mature number sense'?","o":["Er is geen inhoudelijk verschil, het zijn synoniemen voor hetzelfde begrip","Early number sense is volledig aangeboren, terwijl mature number sense enkel bij dieren voorkomt","Early number sense betreft basisvaardigheden zoals tellen bij jonge kinderen, terwijl mature number sense flexibiliteit, redeneren en oplossingsvermogen omvat","Early number sense komt pas na de volwassenheid, mature number sense in de kleuterklas"],"a":2,"u":"Early number sense wordt formeel aangeleerd bij peuters en kleuters en bouwt op aangeboren vaardigheden zoals tellen. Mature number sense bouwt hierop verder met flexibiliteit, mentale conceptualisatie en redenerend oplossingsvermogen, van lagere school tot volwassenheid."},{"t":"10","q":"Wat houdt wiskundeangst in en hoe vaak komt het voor volgens de tekst?","o":["Angst voor examens in het algemeen, bij minder dan 5% van de jongeren","Angst die optreedt bij het manipuleren van getallen of cijfers in een schoolse context, bij ongeveer 60% van de jongeren","Angst voor grote klassen, bij ongeveer 10% van de jongeren","Angst om te tellen op de kleuterleeftijd, bij alle kinderen"],"a":1,"u":"Wiskundeangst is de angst die optreedt wanneer je getallen of cijfers moet manipuleren in een schoolse of academische context, met een prevalentie van 60% van de jongeren. Ze gaat vaak samen met stress, faalangst en vooroordelen."},{"t":"10","q":"Welke stelling over dyscalculie en IQ klopt volgens de tekst?","o":["Het IQ voorspelt exact de ernst van de dyscalculie","Er is geen link met IQ, hoewel dat vaak wel zo gedacht wordt","Dyscalculie komt alleen voor bij mensen met een hoog IQ","Dyscalculie hangt rechtstreeks samen met een laag IQ"],"a":1,"u":"Er is geen link tussen dyscalculie en IQ, maar dit wordt vaak wel zo gedacht. Hierdoor blijft er onbenut potentieel omdat mensen richtingen met wiskunde durven te vermijden."},{"t":"10","q":"Een kleuter zegt bij het tellen '1, 2, 4, 5, 8...' zonder een 1-op-1 koppeling tussen woord en voorwerp. Welke telfase past hier het best bij?","o":["Formeel wiskundeonderwijs vanaf 6 jaar","Resultatief tellen vanaf 5 jaar","Gestructureerd, synchroon tellen vanaf 4-5 jaar","Akoestisch tellen vanaf 3 jaar"],"a":3,"u":"Bij akoestisch tellen, vanaf ongeveer 3 jaar, telt het kind wel, maar zonder 1-op-1 representatie en vaak in willekeurige volgorde, zoals '1, 2, 4, 5, 8'. Imitatie speelt hierbij een belangrijke rol."},{"t":"10","q":"Wat is een kenmerkend verschil tussen het abstract code model van McCloskey en het triple code model van Dehaene en Cohen?","o":["Beide modellen stellen dat taal de centrale schakel is tussen alle componenten","McCloskey ontkent het bestaan van een amodaal rekensysteem, Dehaene en Cohen niet","Bij McCloskey speelt de semantische representatie een centrale mediërende rol, terwijl bij Dehaene en Cohen taal geen centrale rol speelt en elk netwerk zijn eigen functie vervult","Bij McCloskey bepaalt de manier van aanleren welk netwerk activeert, bij Dehaene en Cohen niet"],"a":2,"u":"In het abstract code model van McCloskey speelt de semantische representatie een centrale mediërende rol tussen de componenten. In het triple code model van Dehaene en Cohen speelt taal geen centrale rol en stelt elk kader een neuraal netwerk voor met een eigen specifieke functie."},{"t":"10","q":"Volgens het model 'multiple encoding' hoe verloopt de rekenontwikkeling?","o":["Als een proces waarbij enkel de irrelevante representaties worden gestimuleerd","Als een systeem waarin taal de enige toegestane representatievorm is","Als een reeks strikt afgebakende vaardigheden die in vaste volgorde worden afgewerkt","Als verweven representatievormen waartussen heen en weer wordt bewogen om maximale efficiëntie te bereiken"],"a":3,"u":"In het model multiple encoding zijn de representatievormen verweven in een netwerk waarbij relevante representaties worden gestimuleerd en irrelevante geïnhibeerd, met maximale efficiëntie als doel. Rekenontwikkeling bestaat niet uit afgebakende vaardigheden, maar uit heen en weer bewegen tussen representaties."},{"t":"11","q":"Hoe wordt didactiek in de brontekst omschreven?","o":["Het geheel van digitale hulpmiddelen dat een leerkracht inzet om leerstof aantrekkelijk te maken","De wetenschappelijke studie van erfelijke factoren die het leren van kinderen bepalen","De theorie van de systematische, intentionele hulp die leerkrachten via cultuurgoed bieden aan lerende leerlingen op weg naar cultuurwezen","Het commercieel ontwikkelen van leermethoden door externe uitgevers voor scholen"],"a":2,"u":"Didactiek is de theorie van de systematische, intentionele hulp die leerkrachten via cultuurgoed bieden aan zich vormende leerlingen op weg tot cultuurwezen."},{"t":"11","q":"Wat houdt het geleidelijkheidsprincipe binnen de didactische principes in?","o":["De leerstof kaderen binnen de bredere maatschappelijke context","Modelleren waarbij de leerkracht het eerst voordoet, het dan samen doet en de leerling het uiteindelijk zelf doet","De moeilijkheidsgraad afstemmen op de individuele verschillen tussen leerlingen","De leerstof zoveel mogelijk laten aansluiten bij de reële leefwereld van de leerling"],"a":1,"u":"Het geleidelijkheidsprincipe staat voor modelleren: voordoen, samen doen, zelf doen. Het baseert zich op de zone van naaste ontwikkeling waarbij je geleidelijk opbouwt."},{"t":"11","q":"Welke wiskundedidactische stroming vertrekt van de realiteit om regels aan te leren en focust sterk op inzicht?","o":["De empirische stroming","De realistische stroming","De mechanische stroming","De formeel-structuralistische stroming"],"a":1,"u":"De realistische stroming baseert zich op de realiteit om regels aan te leren en is gefocust op inzicht via progressieve mathematisering. Ze wordt het vaakst gebruikt in het onderwijs."},{"t":"11","q":"Een leerkracht laat leerlingen eerst de abstracte rekenregels uit het hoofd leren en die daarna toepassen, met veel nadruk op het geheugen en weinig op inzicht. Bij welke stroming past deze aanpak?","o":["De mechanische stroming","De formeel-structuralistische stroming","De empirische stroming","De realistische stroming"],"a":0,"u":"De mechanische stroming leert eerst de abstracte regels en past ze daarna toe via een deductieve aanpak. Ze speelt sterk in op het geheugen en minder op inzicht, wat ook de belangrijkste kritiek is."},{"t":"11","q":"Wat beschrijft progressieve mathematisering binnen de realistische stroming?","o":["Het eerst aanbieden en vervolgens empirisch toetsen van rekenregels","De stapsgewijze weg van een realistische situatie naar schematisering, symbolisering en verkorting","Het wettig en overtuigend afleiden van regels binnen het formele vaksysteem","Het uit het hoofd leren van rekenregels om ze daarna deductief toe te passen"],"a":1,"u":"Progressieve mathematisering verloopt van een realistische situatie via schematisering en symbolisering naar verkorting. Het ijsbergmodel geeft dit stapsgewijze proces van realiteit naar abstractie weer."},{"t":"11","q":"Wat is het kernidee van het alfabetisch principe bij het leren lezen?","o":["Het ontcijferen van de code via de relatie tussen grafemen en fonemen","Meerdere zintuigen inzetten om leesinformatie te verwerken","Het inzetten van context en prenten om betekenis af te leiden","Woorden in hun geheel herkennen zonder ze te ontleden"],"a":0,"u":"Het alfabetisch principe is het ontcijferen van de code: het leggen van de relatie tussen grafemen (letters) en fonemen (klanken)."},{"t":"11","q":"Wat is een kenmerkend verschil tussen de phonics-methode en de whole-language-methode?","o":["Phonics is bedoeld voor gevorderde lezers, whole language enkel voor beginners","Phonics splitst woorden in fonemen gekoppeld aan grafemen, terwijl whole language het decoderingsproces overslaat en woorden in hun geheel leert herkennen","Phonics gebruikt uitsluitend digitale hulpmiddelen, whole language werkt enkel op papier","Phonics leert woorden in hun geheel herkennen, terwijl whole language woorden in losse klanken opdeelt"],"a":1,"u":"Phonics is een bottom-up benadering die woorden in fonemen splitst en aan grafemen koppelt. Whole language is een top-down benadering die begint bij het hele woord en het decoderingsproces overslaat."},{"t":"11","q":"Wat wordt als voordeel en als nadeel van de whole-language-benadering genoemd?","o":["Voordeel: makkelijk nieuwe woorden leren; nadeel: cognitief belastend","Voordeel: snel nieuwe klank-tekenkoppelingen; nadeel: trager woordherkennen","Voordeel: sterke spellingontwikkeling; nadeel: geen aandacht voor context","Voordeel: minder cognitief belastend; nadeel: minder makkelijk nieuwe woorden leren of lezen"],"a":3,"u":"Whole language is minder cognitief belastend omdat woorden als geheel worden herkend, maar het maakt het moeilijker om nieuwe woorden te leren of te lezen."},{"t":"11","q":"Wat toont het onderzoek van Boyer en Ehri bij 4- à 5-jarigen over instructie met letters en mondprentjes (LPA)?","o":["Instructie met letters en mondprentjes (LPA) was het beste in leren lezen","Instructie met enkel letters (LO) was superieur voor het leren lezen","Alle condities scoorden even goed, ongeacht de instructievorm","Enkel de controleconditie zonder instructie leidde tot betere spelling"],"a":0,"u":"In het onderzoek van Boyer en Ehri scoorden LPA en LO beter in spelling, foneemsegmentatie, woorden lezen en nazeggen van nonsenswoorden, maar LPA was specifiek het best in leren lezen."},{"t":"11","q":"Wat houdt orthographic mapping volgens Ehri in?","o":["De fonologische code van een woord dient als geheugensteun en ankerpunt bij het orthografisch leren schrijven","Elke lettercombinatie krijgt een vaste route toegewezen die niet meer kan veranderen","Homofonen leest men op basis van hun betekenisverschillen in plaats van hun schrijfwijze","Woorden worden uitsluitend via een zuiver bottom-up mechanisme letter voor letter opgebouwd"],"a":0,"u":"Bij orthographic mapping fungeert de fonologische code, de foneemreeks van een woord, als geheugensteun en ankerpunt bij het orthografisch leren. Je vertrekt van hoe een woord klinkt om te bepalen hoe je het schrijft."},{"t":"11","q":"Wat kenmerkt volgens het stabiliteits-plasticiteitsdilemma de traditionele leesmodellen zoals het dual route model?","o":["Veel stabiliteit en veel plasticiteit, want de vaste routes zijn eindeloos uitbreidbaar","Weinig stabiliteit en weinig plasticiteit, want de inconsistente routes zijn onbetrouwbaar","Weinig stabiliteit en veel plasticiteit, want er kunnen steeds nieuwe routes worden aangelegd","Veel stabiliteit maar weinig plasticiteit, want woorden lopen via dezelfde vaste routes en nieuwe routes kunnen niet worden aangeleerd"],"a":3,"u":"Traditionele leesmodellen zoals het dual route model kennen veel stabiliteit: woorden worden via dezelfde routes herkend. Er is echter weinig plasticiteit, want je hebt maar twee routes en nieuwe routes kunnen niet worden aangeleerd."},{"t":"11","q":"Wat concludeert de meta-analyse van Slavin over extra begeleiding bij kinderen met ernstige leesproblemen?","o":["Taakklassen zorgen voor een blijvende transfer naar de volgende schooljaren","Een interventie van 1 à 2 keer per week levert al een blijvend effect op","Enkel de combinatie van een goed uitgebouwd programma met aanvullende individuele begeleiding zorgt voor langetermijneffecten","Computergestuurde leesoefeningen zijn de meest effectieve vorm van begeleiding"],"a":2,"u":"Volgens Slavin geeft een interventie van 1 à 2 keer per week geen effect en zijn computeroefeningen en taakklassen slechts beperkt of tijdelijk effectief. Enkel de combinatie van een goed programma met individuele begeleiding zorgt voor langetermijneffecten."},{"t":"11","q":"Wat is het onderscheid tussen gamification en game-based learning?","o":["Bij gamification is het spel zelf de leerstof, bij game-based learning zijn het losse spelelementen","Gamification is bedoeld voor dyslexie, game-based learning voor gewone lezers","Gamification gebruikt spelelementen in een niet-spelcontext om gedrag te motiveren, terwijl bij game-based learning het spel zelf de leerstof is","Gamification werkt enkel bij jongens, game-based learning enkel bij meisjes"],"a":2,"u":"Gamification gebruikt spelelementen in een niet-spelcontext om gedrag te motiveren wanneer er iets te winnen valt. Bij game-based learning gebeurt het leren binnen het spel zelf en is het spel de leerstof."}],"theory":[{"h":"Inleiding: leerstoornissen & DSM","items":["Ontwikkelingsstoornis: parapluterm voor een neurologische of psychische aandoening die de normale ontwikkeling verstoort.","Leerproblemen: brede problemen met leren over verschillende vakken en gebieden heen.","Specifieke leerstoornis: problemen met een afgebakende vaardigheid zoals lezen of rekenen.","Dyslexie: onnauwkeurig, langzaam en moeizaam lezen, met moeite om betekenis te begrijpen en om te spellen en zich schriftelijk uit te drukken.","Dyscalculie: moeite met getallengevoel, berekeningen en cijfermatig redeneren, slechter ontwikkeld dan verwacht voor de leeftijd.","DSM-criterium duur: de moeilijkheden moeten persisterend aanwezig zijn gedurende minstens zes maanden.","Grijze zone (IQ 70 tot 85): men oordeelt milder op lees- en rekenfouten omdat niet alles door een verstandelijke beperking verklaard wordt, terwijl onder een IQ van 70 alles door de verstandelijke beperking wordt verklaard.","Specificiteitsparadox: het probleem dat dyslexie en dyscalculie pure beschrijvingen zijn, waardoor discussie ontstaat of het echte stoornissen zijn of gewoon zwakke leerlingen.","Normaalverdelingskritiek: er is geen bi-modaliteit in de normaalverdeling, dus de grenzen van leerstoornissen zijn arbitrair.","Stoornis, beperking en handicap: een stoornis is een afwijking van een structuur of functie, een beperking is een verminderd vermogen tot activiteiten, en een handicap is de nadelige situatie die de normale rolvervulling belemmert.","Remedial teaching: beperkte, binnenschoolse ondersteuning voor leerlingen zonder diagnose van een leerstoornis.","Orthodidactische behandeling: gespecialiseerde, buitenschoolse ondersteuning voor leerlingen met een diagnose van een leerstoornis.","Redelijke aanpassingen: een relatief begrip, met ingeburgerde maatregelen zoals voorleessoftware, kladpapier en aangepast lettertype, terwijl bijvoorbeeld extra tijd bij evaluatie minder evidence-based is.","Rollen van de onderwijspsycholoog: brugfiguur tussen psychologie en onderwijs met zeven rollen, waaronder expert, hulpverlener, scientist-practitioner, professional, communicator, samenwerkingspartner en systeemondersteuner."]},{"h":"Het dyslexiedebat","items":["Exclusiecriterium: externe factoren mogen de leesproblemen niet verklaren; de oorzaak moet intern (cognitief) in het kind liggen.","Discrepantiemodel: dyslexie werd gedefinieerd als een kloof tussen de op IQ verwachte prestatie en de werkelijk geleverde leesprestatie.","Response to Instruction/Intervention (RTI): leerlingen krijgen steeds intensievere instructie; wie non-responder blijft, wordt als dyslectisch beschouwd.","Hardnekkigheid: het enige betrouwbare criterium voor dyslexie, mits de remediëring gestandaardiseerd is en bij alle leerlingen gecontroleerd wordt.","Mattheus-effect: goede lezers lezen intrinsiek meer, terwijl zwakke lezers apathie ontwikkelen, waardoor de leeskloof groeit.","Specificiteitsparadox: dyslexie is niet volledig door de algemene cognitie te verklaren, maar ook niet door één specifieke oorzaak.","RAN (snelbenoemen): het snel benoemen van bekende symbolen zoals letters; een gedeeld proces dat bij dyslexie een rol speelt.","Geslachtsgebonden penetrantie: dyslexie is niet X-chromosoomgebonden, maar treft jongens vaker dan meisjes.","Genetische comorbiditeit: genen die bijdragen aan dyslexie staan ook mee in voor andere (leer)stoornissen.","Modellen van Plomin en Kovas: model 3 (meerdere gecorreleerde mechanismen) benadert het best de werkelijkheid van dyslexie.","Multiple deficit model: dyslexie ontstaat uit meerdere erfelijke en cognitieve tekortkomingen via probabilistische, niet-deterministische risicofactoren.","Gen-omgevingscorrelatie (rGE): passieve, evocatieve, gedeelde en actieve wisselwerking tussen genetische aanleg en leesomgeving.","STICORDI: maatregelen om Stimuleren, Compenseren, Remediëren, Differentiëren en Dispenseren bij leerlingen met leerstoornissen.","Neuraal leesnetwerk: drie actieve leesregio's in de linker hemisfeer, namelijk de inferieure frontale, temporo-pariëtale en occipito-temporale cortex."]},{"h":"Cognitieve oorzaken van dyslexie","items":["Defectmodel: klassiek deterministisch medisch model dat één achterliggende oorzaak voor de symptomen aanneemt, nu verlaten omdat er geen 1-op-1 relaties bestaan.","Multifactorieel verklaringsmodel: dyslexie wordt verklaard door een samenspel van genetische factoren, breinstructuur en functies, cognitieve vaardigheden en omgevingsfactoren.","Fonologisch bewustzijn: het kunnen herkennen en doelbewust manipuleren van de klankstructuur van woorden, zoals fonemen isoleren, weglaten, blenden, substitueren of toevoegen.","Foneem: de kleinste klankeenheid die een betekenisverschil kan weergeven.","Fonologische deficiethypothese: stelt dat de kern van het leesprobleem in een tekort van de fonologische verwerking ligt, oorspronkelijk als enkelvoudig causaal model.","Risicofactor: fonologisch bewustzijn is geen enkelvoudige oorzaak maar de sterkste en specifieke risicofactor binnen het multifactorieel model.","Verbaal kortetermijngeheugen: getest met de non-woord-repetitietaak, waarbij dyslectici vooral slechter scoren door comorbiditeit met zwakkere mondelinge taalvaardigheid.","Letterkennis: kennis van de letters van het alfabet en de snelheid waarmee letters aan klanken gekoppeld worden, een specifieke risicofactor.","Snelbenoemen: getest met RAN, het zo snel mogelijk benoemen van bekende symbolen, waarbij vooral snelheid telt omdat er weinig fouten gemaakt worden. In een transparante taal is het de beste voorspeller van leesvaardigheid.","RAN en fonologisch bewustzijn: onafhankelijke, specifieke risicofactoren voor dyslexie die ook na controle voor elkaar met leesvaardigheid samenhangen.","Visuele aandachtspanne (VAS): het aantal orthografische elementen dat in één oogopslag verwerkt kan worden, met twijfels of het een specifieke risicofactor is.","Defect in impliciet volgorde leren: recente hypothese dat een probleem met het impliciet leren van volgorde-informatie dyslexie zou veroorzaken, maar recent onderzoek spreekt dit tegen.","Plafondeffect: het verschijnsel dat een taak zonder snelheidsmeting te makkelijk wordt, vooral voor oudere kinderen, waardoor het leesprobleem niet tot uiting komt."]},{"h":"Lees(ontwikkelings)theorieën","items":["Twee-routemodel van Coltheart: leesmodel met een directe lexicale route en een indirecte niet-lexicale route.","Directe (lexicale) route: rechtstreekse associatie tussen spelling en betekenis, nodig voor gekende woorden en uitzonderingen.","Indirecte (niet-lexicale) route: fonologische mediatie via GPC-regels die grafemen omzetten in fonemen, nodig voor nieuwe woorden.","GPC-regels: grapheme-phoneme correspondence, de koppelingsregels tussen letters (grafemen) en klanken (fonemen).","Oppervlakte dyslexie: verstoring van de directe route, waardoor uitzonderingswoorden slechter gelezen worden dan regelmatige.","Diepte dyslexie: verstoring van de indirecte route, waarbij het benoemde woord vaak semantisch verwant is met het gespelde woord.","Woordsuperioriteitseffect: bestaande woorden worden vlotter verwerkt dan betekenisloze pseudo- of nonsenswoorden.","Woordfrequentie-effect: hoogfrequente woorden worden sneller verwerkt dan laagfrequente woorden.","Interactieve-activatiemodel (IAM) van McClelland en Rumelhart: model dat bottom-up en top-down effecten combineert via een feedbacklus.","Connectionistisch model van Van Orden en Goldinger: model met covariaat leren en zelfconsistentie waarin fonologische codering woordherkenning domineert.","Stage-based theorieën: leesvaardigheid ontwikkelt geleidelijk in opeenvolgende fasen met steeds complexere vaardigheden.","Item-based theorieën: de manier waarop een woord gelezen wordt hangt af van hoe goed dat woord al gekend is.","Fasetheorie van Frith: leesontwikkeling via een logografische, alfabetische en orthografische fase, elk met nieuwe deelvaardigheden.","Self-teaching hypothese van Share: orthografische kennis wordt opgebouwd wanneer semantiek, fonologie en orthografie samen geactiveerd worden, waarbij fonologisch decoderen als ingebouwde leraar werkt."]},{"h":"Hoogbegaafdheid","items":["Prevalentie: ongeveer 1 leerling per klas en circa 2,5% van de Vlamingen; bij jongeren vaak niet erkend of onderzocht.","CHC-model: het meest invloedrijke en empirisch onderbouwde intelligentiemodel, bruikbaar voor klinische en normale populaties en basis van de WISC-V.","Vloeiende intelligentie: redeneervermogen om nieuwe problemen aan te pakken in nieuwe situaties.","Gekristalliseerde kennis: cultureel gebonden kennis, in tegenstelling tot vloeiende intelligentie.","G-factor: overkoepelende factor waarin veel aspecten vervat zitten; HB scoort op de meeste hoog, maar zeker niet op alles.","Subtypes van HB: succesvol (goedkeuring van de omgeving), autonoom (goedkeuring van zichzelf, meesterschap), uitdagend (divergent, storend), onderduikend (conformeert, internaliserende problemen) en risicogroep (drop-outs, gedragsproblemen).","Dubbel bijzonder: co-morbiditeit met andere stoornissen die versterkend of beperkend kan werken, waardoor de HB-diagnose nauwelijks wordt gesteld.","Overlap met ADHD, ASS en leerstoornis: gedeelde kenmerken maken onderscheiden moeilijk; leerstoornis en HB maskeren elkaar.","Mönks en Mason model (2000): persoonsgebonden capaciteiten ontwikkelen zich enkel tot HB-potentieel in een ondersteunende en bevorderende omgeving.","Multifactorenmodel van Heller: niet-cognitieve persoonlijkheidskenmerken (zoals locus of control, faalangst, leerstrategieën, prestatiemotivatie) en omgevingskenmerken bepalen de prestaties.","Delphi-model van Kooijman en van Thiel: HB omvat voelen, zijn, denken, willen en doen, met kenmerken als hoog sensitief waarnemen en creatief denken.","Groeimodel van Kieboom en Venderickx: kijkt naar mentaal welzijn en emotioneel welbevinden, met een zijnsluik van niet-cognitieve factoren.","Veerkracht- versus risicobenadering: HB kan beschermen (veerkrachtig omgaan met stressoren) of valkuilen vormen (meer kans op sociaal-emotionele moeilijkheden en kwetsbaarheid).","Ongelijke kansen: HB moet gelijke ontwikkelingskansen krijgen als leerbeperkten, maar herkenning wordt beïnvloed door achtergrondcovariaten zoals SES en opleiding van ouders."]},{"h":"Zittenblijvers","items":["Deficitvisie: homogeen perspectief dat de leerling afmeet aan de norm in plaats van aan individuele leerwinst.","Enkelvoudig lineair ontwikkelingsmodel: aanname dat alle kinderen zich sequentieel en op eenzelfde universeel tempo ontwikkelen in vaste leeftijdsfases.","Grammar of schooling: de manier waarop een onderwijssysteem is gestructureerd, in Vlaanderen sterk pro-zittenblijven en gebaseerd op het jaarklassensysteem.","Meetinvariantie: probleem dat de test niet hetzelfde meet omdat zittenblijvers en doorstromers opgaven anders oplossen door verschillende kennis.","Verticaal gelijkgestelde scores: oplossing waarbij kennis van twee leerjaren via ankeritems op één leerlijn wordt geplaatst.","Double dosage effect: vertekening doordat de zittenblijver de leerstof al eens gezien heeft bij vergelijking met klasgenoten.","Selectiebias: geconstateerde verschillen zijn toe te wijzen aan verschillen die al bestonden voor het onderzoek en zijn moeilijk weg te werken.","Propensity score matching: techniek die de kans op zittenblijven via logistische regressie berekent en zo een vergelijkbare controlegroep matcht.","Positiviteitsassumptie: veronderstelling dat er voor elke covariaatcombinatie overlap is tussen beide groepen, met als nadeel dat ongeveer de helft van de zittenblijvers wegvalt.","Paradox van disjunctie: als alle determinanten van zittenblijven gekend en gemeten zijn, kan men de groepen juist niet meer matchen omdat de verschillen dan al bekend zijn.","Big fish little pond effect: zittenblijvers voelen zich beter door sociale vergelijking met de zwakkere leerlingen in hun nieuwe klas.","Sneeuwbaleffect: mogelijke verklaring voor negatieve langetermijneffecten doordat leerlingen geleidelijk meer wantrouwen tegenover school ontwikkelen.","Retention plus: zittenblijven gecombineerd met extra ondersteuning zoals tutoring of summer school, wat het meest voordelig is.","A la carte integratie: aanpak waarbij een C-attest een laatste redmiddel is en men eerder inzet op alternatieven zoals ability grouping.","Algemene effectiviteit van zittenblijven: in de praktijk nul, met gedifferentieerde effectgroottes tussen ongeveer -.2 en .2."]},{"h":"Inclusief onderwijs & gelijke kansen","items":["Exclusie: mensen krijgen geen rechten en worden uit de maatschappij verbannen.","Separatie: aparte instituten en speciale instellingen worden voorzien, historisch de meest voorkomende oplossing.","Integratie of normalisatie: mensen maken op sommige aspecten deel uit van de maatschappij en krijgen een zo normaal mogelijk leven.","Inclusie: een proces dat start met het waarderen van diversiteit en steunt op gelijke mensenrechten, waardoor iedereen volledig kan deelnemen.","Dubbele opdracht bij integratie: een mentaliteitsverandering en technische of materiele veranderingen zodat iedereen zich welkom voelt.","Systematische fout op klasniveau: de leerkracht past de verwachtingen aan op basis van mythes over de leerling.","Sociale cohesie: inzetten op verbondenheid in de klas om discriminatie en racisme aan te pakken.","Onderwijskundig leiderschap: de mate van inclusiviteit hangt sterk af van de directeur.","ICT-infrastructuur: een hoge voorspeller van schoolsucces, waardoor ook online alternatieven belangrijk zijn.","Witte invulling van ouderbetrokkenheid: ouders niet betrekken en aannemen dat afwezigheid gebrek aan betrokkenheid is, zonder oog voor context.","Maatwerk: de nodige aanpassingen doorvoeren zodat elke leerling kan deelnemen aan het gewone onderwijs.","Deficit denken: veronderstellen dat het kind iets tekortkomt in plaats van dat er een tekort is aan een krachtige leeromgeving.","Inclusieve cultuur: geloven dat elk kind recht heeft op gelijke onderwijskansen.","Attitudes: een multidimensioneel concept met een affectieve, een gedrags- en een cognitieve component, en de beste voorspeller van succes in een inclusieve leeromgeving."]},{"h":"Dyscalculie: deel 1","items":["Rekenen: proces waarin je de wereld ordent of herordent en uitdrukt in hoeveelheden en symbolen volgens logische regels.","Prevalentie: dyscalculie komt bij 2 tot 8 procent voor, ongeveer even vaak bij mannen en vrouwen, met verhoogd risico bij kinderen van een ouder met de stoornis.","Comorbiditeit met ADHD: bij 20 tot 40 procent van de gevallen komt dyscalculie samen met ADHD voor.","Math anxiety: wiskundeangst is een subjectieve beleving waarvoor meer maatschappelijk begrip bestaat dan voor leesangst.","DSM-5-criteria: discrepantie tussen mogelijkheden en rekenkennis, minstens twee jaar achterstand en weinig progressie ondanks gerichte hulp (hardnekkigheid).","Hardnekkigheidscriterium: er blijft weinig vooruitgang na goede, gerichte hulp, wat de stoornis van een gewoon rekenprobleem onderscheidt.","Rekenprocesonderzoek: het proces is belangrijker dan het product, want men zoekt waar het fout loopt om instructienood en niveau te bepalen.","Redactieopgave versus contextopgave: bij een redactieopgave los je zonder meer op, bij een contextopgave zijn extra logische redeneringen nodig.","Subitizing: het herkennen van hoeveelheden zonder te tellen, een non-symbolische vaardigheid die bij dyscalculie moeizamer verloopt.","Transcoderen: het omzetten van getallen, cijfers en hoeveelheden, bijvoorbeeld van decimaal naar binair of van geheel naar kommagetal.","Fenotypes: procedurele, semantische geheugen- of verbale, visuospatiële en getallenkennisdyscalculie beschrijven verschillende foutpatronen.","Neuronaal netwerk: de angular gyrus verwerkt rekenfeiten, de frontale cortex bewerkingen en de intrapariëtale sulcus rekenprocedures.","Multiple deficit model en genetica: dyscalculie is deels erfelijk, onderzocht via GWAS, maar gevonden genvariaties verklaren slechts een verwaarloosbaar deel van de variantie.","Neuro-anatomische basis: minder volume in en rond de intrapariëtale sulcus en verschillen in witte stof tussen pariëtale, temporale en frontale gebieden."]},{"h":"Metacognitie in het leerproces","items":["Functionele reorganisatie of neuronal recycling: plasticiteit waarbij de hersenen cognitieve functies en strategieen herzien en aanpassen om effectiever te leren; lukt dit niet, dan ontstaan leerproblemen.","Metacognitieve vaardigheden: denken over je eigen denken, dus beseffen of je fout zit en waar hiaten in je kennis zitten.","Error monitoring: weten of je al dan niet fout bent en hoe zeker je van die inschatting bent.","Thinking aloud protocols: hardop kunnen expliciteren wat je denkt tijdens een taak.","Declaratieve metacognitieve kennis: kennis over cognitie en leren, zoals hoe je taken vervult en plannen en strategieen maakt.","Procedurele metacognitieve kennis: hogere orde processen en zelfreflectie, zoals jezelf monitoren en onder controle houden via executieve functies.","Retention: het inschatten hoe goed je iets kan en of je zal slagen.","Acquisition: het verwerkingsdeel, met inschattingen als hoe lang je nog moet studeren.","Retrieval: het moment waarop je een antwoord geeft en stopt met studeren of nadenken.","Ontwikkeling van metacognitie: al vroeg aanwezig, robuust vanaf ongeveer 5 a 7 jaar, met een graduele shift van domeinspecifiek naar algemener.","Meetuitdaging: metacognitie verschilt in niveau (globaal versus itemspecifiek), bron (observatie versus self reports) en timing (offline versus online).","Meten bij jonge kinderen: geen schalen gebruiken maar smileys, gezichten en barometers.","Overlap executieve functies en metacognitie: beide overlappen sterk, waardoor het moeilijk is de unieke bijdrage van elk te bepalen.","Wiskundeangst en metacognitie: er is samenhang, vroege angst voorspelt latere monitoring, en angst verzwakt metacognitie (productiedeficiet); de relatie is bidirectioneel."]},{"h":"Dyscalculie: deel 2","items":["Number sense (getalgevoel): het gemak waarmee je met getallen omspringt, deels aangeboren en een belangrijke voorspeller van rekenvaardigheid.","Number line task: onderzoek waarbij 55 uur oude baby's met habituatietechnieken significant meer juiste inschattingen maakten, onafhankelijk van de stipgrootte.","Early number sense: formeel aangeleerde basisvaardigheden zoals tellen en getalvergelijking bij peuters en kleuters, bouwend op aangeboren vaardigheden.","Mature number sense: aangeleerd vermogen dat op basisvaardigheden voortbouwt met flexibiliteit, mentale conceptualisatie en redenerend oplossingsvermogen.","Executieve functies (EF): vaardigheden voor plannen, strategisch denken, monitoren, toepassen en controleren, die bij dyscalculie problematisch kunnen zijn.","Wiskundeangst: angst bij het manipuleren van getallen in een schoolse context, met een prevalentie van 60% en gekoppeld aan stress, faalangst en vooroordelen.","Beschikbaarheidsdeficiet: hypothese waarbij een tekort aan cognitieve controle en EF leidt tot falende wiskundeangstregulatie en een negatief zelfbeeld.","Productiedeficiet: hypothese waarbij faalangst zorgt voor cognitieve overload, waardoor cognitieve controle en EF falen en het zelfbeeld daalt.","Probleemsignalen kleuter: trager benoemen van dagen en vormen, moeite met subitizing en problemen met tellen.","Probleemsignalen lagere school: moeite met bewerkingen, analoge klok lezen, symbolen verwarren en breuken.","Tedi-math: test voor de diagnostiek van basale mathematische kennis en vaardigheden, gericht op vroegdetectie van dyscalculie bij 4 tot 6 jaar.","Abstract code model (McCloskey): model waarin de semantische representatie de centrale mediërende rol vervult en bewerkingen amodaal in het rekensysteem gebeuren.","Triple code model (Dehaene en Cohen): model waarin taal geen centrale rol speelt en elk neuraal netwerk een eigen functie vervult afhankelijk van de manier van aanleren.","Multiple encoding (Campbell en Clark): model waarin representatievormen verweven zijn, relevante worden gestimuleerd en irrelevante geïnhibeerd, gericht op maximale efficiëntie.","Subitizing: het snel herkennen van kleine patronen als shortcut om cognitieve ruimte vrij te maken bij het tellen."]},{"h":"Didactiek van lezen en rekenen","items":["Didactiek: de theorie van de systematische, intentionele hulp die leerkrachten via cultuurgoed bieden aan lerende leerlingen op weg naar cultuurwezen.","Aanschouwelijkheidsprincipe: de leerstof laten spreken via bijvoorbeeld didactische video's en afbeeldingen.","Realiteitsprincipe: aansluiting zoeken bij de reële leefwereld van de leerling.","Geleidelijkheidsprincipe: modelleren volgens voordoen, samen doen en zelf doen, gebaseerd op de zone van naaste ontwikkeling.","Mechanische stroming: eerst de abstracte regels leren en ze daarna deductief toepassen, met veel nadruk op geheugen en weinig op inzicht.","Realistische stroming: regels aanleren vanuit de realiteit met focus op inzicht via progressieve mathematisering, het vaakst gebruikt in het onderwijs.","Progressieve mathematisering: de stapsgewijze weg van een realistische situatie naar schematisering, symbolisering en verkorting.","IJsbergmodel: het stapsgewijze proces van realiteit naar abstractie in het rekenonderwijs.","Alfabetisch principe: het ontcijferen van de code via de relatie tussen grafemen en fonemen.","Phonics: een bottom-up leesmethode die woorden in fonemen splitst en aan grafemen koppelt.","Whole language: een top-down leesmethode die woorden in hun geheel herkent en het decoderingsproces overslaat, minder belastend maar trager bij nieuwe woorden.","Fonologisch bewustzijn: het expliciete besef van klanken in woorden, belangrijk bij het aanleren van teken-klankkoppelingen.","Orthographic mapping volgens Ehri: de fonologische code van een woord dient als geheugensteun en ankerpunt bij het orthografisch leren schrijven.","Stabiliteits-plasticiteitsdilemma: traditionele leesmodellen bieden veel stabiliteit maar weinig plasticiteit, terwijl connectionistische modellen weinig stabiliteit maar veel plasticiteit hebben."]}],"hacks":[{"h":"Lees bij Lezen, Reken bij Rekenen","t":"Om dyslexie en dyscalculie niet te verwisselen: dysLEXie zit dicht bij LEXicon en tekst, dus dat gaat over lezen en spellen. DysCALCulie lijkt op CALCulator, dus dat gaat over getallen en rekenen."},{"h":"STICORDI onthouden","t":"STICORDI = STImuleren, COmpenseren, Remediëren, DIfferentiëren, DIspenseren. Denk aan de vijf stappen om een leerling met een leerstoornis te ondersteunen, van aanmoedigen tot leerstof vervangen."},{"h":"GENUL onthoudt het multifactorieel model","t":"Denk aan GENUL: GENetica, breinstructuur en functies, cognitieve vaardigheden (bv. fonologisch bewustzijn) en omgeving. Zo onthoud je dat dyslexie nooit één oorzaak heeft maar altijd een samenspel van factoren."},{"h":"LAO: de drie fasen van Frith","t":"Onthoud LAO voor de fasetheorie van Frith: Logografisch (herkennen aan visuele kenmerken), Alfabetisch (fonologisch decoderen via letter-klank) en Orthografisch (automatisch hele woorden herkennen uit het lexicon). Het loopt van kijken, naar klinken, naar kennen."},{"h":"SAUOR voor de subtypes","t":"Onthoud de vijf HB-subtypes met SAUOR: Succesvol (wil goedkeuring van de omgeving), Autonoom (wil goedkeuring van zichzelf), Uitdagend (divergent en storend), Onderduikend (conformeert en verbergt) en Risicogroep (drop-outs en gedragsproblemen)."},{"h":"MDP: de drie valkuilen van matching","t":"Onthoud MDP voor de kernproblemen bij het vergelijken van zittenblijvers: Meetinvariantie (test meet niet hetzelfde), Double dosage (stof al gezien) en Positiviteitsassumptie (halve groep valt weg). Wie deze drie kent, ziet meteen waarom zuiver experimenteel onderzoek naar zittenblijven onmogelijk is."},{"h":"ESII: de trap naar inclusie","t":"Onthoud de vier maatschappelijke modellen als een oplopende trap met E-S-I-I: Exclusie (verbannen), Separatie (apart), Integratie (deels erbij) en Inclusie (volledig erbij op basis van gelijke rechten). Elke stap sluit mensen iets meer in."},{"h":"AG-FC-IPS: drie gebieden, drie taken","t":"Onthoud de drie hersengebieden op alfabetische volgorde: Angular gyrus doet rekenFeiten, Frontale cortex doet Bewerkingen, en de IntrapariëtaleSulcus doet Procedures. Handig: de twee klinische clusters zijn AG-hypoactivatie bij semantische geheugendyscalculie en IPS-hypoactivatie bij procedurele dyscalculie."},{"h":"ARR: de drie fasen van het leren","t":"Onthoud de volgorde van procedurele metacognitie met ARR: Acquisition (hoe lang moet ik studeren), Retention (kan ik het en ga ik slagen) en Retrieval (ik geef een antwoord en stop). Zo koppel je elke fase aan de juiste vraag die je jezelf stelt."},{"h":"Twee modellen, twee centra","t":"Onthoud de C's: bij McCloskey staat het Centrale mediërende punt gelijk aan de seMantische representatie (M van McCloskey), terwijl bij Dehaene en Cohen taal juist géén Centrale rol speelt en elk netwerk een eigen functie vervult."},{"h":"BU en TD: Bottom-Up bouwt, Top-Down toont","t":"Bij Phonics werk je Bottom-Up: je Bouwt het woord op vanuit de kleinste eenheid, de fonemen. Bij Whole language werk je Top-Down: je Toont het hele woord en herkent het in zijn geheel."}]};
</script>

      '<input type="search" id="sq" placeholder="Zoek een begrip… (bv. dyslexie, dyscalculie, metacognitie)" value="'+esc(q)+'"></div><div id="list">'+theoryList(q)+'</div>';
    setHTML(html);
    var si=document.getElementById("sq"); si.oninput=function(){ state.sumq=si.value; document.getElementById("list").innerHTML=theoryList(si.value); si.focus(); };
  }
  function theoryList(query){
    var Q=query.trim().toLowerCase(), out="", n=0;
    D.theory.forEach(function(sec){
      var items=sec.items.filter(function(it){ return !Q || it.toLowerCase().indexOf(Q)>=0 || sec.h.toLowerCase().indexOf(Q)>=0; });
      if(!items.length) return; n++;
      out+='<details class="acc"'+(Q?" open":(n===1?" open":""))+'><summary><span class="n">'+ic("search")+'</span>'+esc(sec.h)+ic("chevR","caret")+'</summary><div class="body"><ul>'+items.map(function(it){return '<li>'+hl(esc(it),Q)+'</li>';}).join("")+'</ul></div></details>';
    });
    return out||'<p class="muted center">Geen resultaten voor "'+esc(query)+'".</p>';
  }
  function hl(t,q){ if(!q)return t; try{ return t.replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>"); }catch(e){ return t; } }

  function renderHacks(){
    var html='<div class="card pad" style="margin-bottom:16px"><h2 style="margin:0 0 6px">Studie-hacks</h2><p class="muted" style="margin:0">Ezelsbruggetjes om de kernideeën van onderwijspsychologie en leerstoornissen te onthouden.</p></div>'+
      '<div class="tipgrid">'+D.hacks.map(function(t){return '<div class="tip"><h4>'+ic("bulb")+esc(t.h)+'</h4><p>'+esc(t.t)+'</p></div>';}).join("")+'</div>';
    setHTML(html);
  }

  function renderFeedback(){
    var html='<div class="card pad"><h2 style="margin-top:0">Feedback &amp; klachten</h2>'+
      '<p class="muted">Fout in een vraag, een idee, of werkt iets niet? Laat het hier weten, het komt rechtstreeks bij de maker terecht. Een review of compliment mag ook: de mooiste tonen we op de hub. 💬</p>'+
      '<label class="fld" for="fbMsg">Je bericht</label><textarea id="fbMsg" rows="5" placeholder="Beschrijf de fout of je idee…"></textarea>'+
      '<label class="fld" for="fbWaar">Over welke vraag? <span class="muted">(optioneel)</span></label><input type="text" id="fbWaar" placeholder="bv. de vraag over de p-waarde">'+
      '<label class="fld" for="fbNaam">Je naam <span class="muted">(optioneel)</span></label><input type="text" id="fbNaam" placeholder="zodat we je kunnen bedanken">'+
      '<label class="fld" for="fbEmail">Je e-mail <span class="muted">(optioneel, als je een antwoord wilt)</span></label><input type="email" id="fbEmail" placeholder="naam@voorbeeld.be">'+
      '<input type="text" id="fbBot" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0">'+
      '<div class="row" style="margin-top:16px;align-items:center"><button class="btn" id="fbSend">'+ic("send")+'Versturen</button><span id="fbStatus" style="font-size:13px"></span></div></div>';
    setHTML(html);
    document.getElementById("fbSend").onclick=function(){
      var status=document.getElementById("fbStatus");
      if(document.getElementById("fbBot").value) return;
      var msg=document.getElementById("fbMsg").value.trim();
      if(!msg){ status.style.color="var(--bad)"; status.textContent="Schrijf eerst een bericht."; return; }
      var btn=document.getElementById("fbSend"); btn.disabled=true; status.style.color="var(--muted)"; status.textContent="Versturen…";
      var em=document.getElementById("fbEmail").value.trim();
      var nm=document.getElementById("fbNaam").value.trim();
      var waar=document.getElementById("fbWaar").value.trim();
      var payload={_subject:"Onderwijspsychologie & Leerstoornissen-tool: feedback", _template:"table", _captcha:"false",
        Naam:nm||"-", Over_welke_vraag:waar||"-", email:em||"-", Bericht:msg};
      if(em) payload._replyto=em;
      // vangnet: als de verzenddienst blokkeert (bv. spamfilter) of er is geen verbinding,
      // bieden we een directe mailto-knop aan zodat de melding NOOIT stilletjes verdwijnt.
      function failFallback(reden){
        var body="Feedback Onderwijspsychologie & Leerstoornissen-tool%0D%0A%0D%0ANaam: "+encodeURIComponent(nm||"-")+"%0D%0AOver welke vraag: "+encodeURIComponent(waar||"-")+"%0D%0AE-mail: "+encodeURIComponent(em||"-")+"%0D%0A%0D%0ABericht:%0D%0A"+encodeURIComponent(msg);
        var mailto="mailto:berat007yildirim@gmail.com?subject="+encodeURIComponent("Onderwijspsychologie & Leerstoornissen-tool: feedback")+"&body="+body;
        setHTML('<div class="card pad"><h2 style="margin-top:0">Automatisch versturen lukte niet</h2><p class="muted">'+reden+' Geen zorgen, klik hieronder en je melding wordt geopend in je e-mail, helemaal klaar om te versturen:</p><a class="btn" href="'+mailto+'">'+ic("send")+'Mail mijn melding direct</a><div style="margin-top:14px"><button class="btn ghost" id="bk">Terug naar start</button></div></div>');
        document.getElementById("bk").onclick=function(){go("home");};
      }
      fetch("https://formsubmit.co/ajax/Berat007yildirim@gmail.com",{method:"POST",headers:{Accept:"application/json"},body:new URLSearchParams(payload)})
        .then(function(r){return r.json();}).then(function(d){
          if(d&&(d.success===true||d.success==="true")){ setHTML('<div class="card pad results center"><div style="font-size:42px">✅</div><h2 style="margin:6px 0">Bedankt!</h2><p class="muted">Je melding is verstuurd.</p><button class="btn" id="bk" style="margin-top:8px">Terug naar start</button></div>'); document.getElementById("bk").onclick=function(){go("home");}; }
          else { failFallback("Het automatisch versturen lukte niet."); }
        }).catch(function(){ failFallback("Er was even geen verbinding."); });
    };
  }

  document.addEventListener("keydown",function(e){ if(state.key) state.key(e); });
  // bezoeker tellen (1x per toestel)
  try{ if(!localStorage.getItem("onderwijs_seen")){ localStorage.setItem("onderwijs_seen","1"); bump("berat-onderwijs","gebruikers"); } }catch(e){ bump("berat-onderwijs","gebruikers"); }
  // traject vanuit de hub overnemen → direct naar de oefenpagina
  try{ var _q=new URLSearchParams(location.search); var _m=_q.get("m");
    if(_m==="training"||_m==="herkansing"){ state.track=_m; lset("onderwijs_track",_m);
      var _c=_q.get("calm"); if(_c!=null){ calm=(_c!=="0"); lset("onderwijs_calm",calm); applyCalm(); }
      state.step="practice"; state.fromHub=true; }
  }catch(e){}
  render();
  // launch-splash netjes laten verdwijnen
  (function(){ var _sp=document.getElementById("splash"); if(!_sp) return; var _red=false; try{_red=window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){} setTimeout(function(){ _sp.classList.add("hide"); setTimeout(function(){ if(_sp&&_sp.parentNode) _sp.parentNode.removeChild(_sp); }, 700); }, _red?300:1850); })();
})();
</script>
