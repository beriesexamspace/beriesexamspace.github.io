<!DOCTYPE html>

<head>

<style>
  :root{
    --bg:#f4f2ee; --bg2:#ebe8e2; --card:#ffffff; --ink:#1b232c; --muted:#5d6873;
    --line:#e2ddd4; --accent:#0f6e6a; --accent-ink:#0b4f4c; --accent-soft:#dcefed;
    --amber:#c9821f; --amber-soft:#f7ecd9; --violet:#6d5bd0; --violet-soft:#e9e6fa;
    --good:#1f8a4c; --good-soft:#e2f3e8; --bad:#c23b54; --bad-soft:#fbe5ea;
    --shadow:0 1px 2px rgba(20,30,40,.05),0 6px 18px rgba(20,30,40,.05);
    --shadow-lg:0 2px 6px rgba(20,30,40,.06),0 18px 40px rgba(20,30,40,.10);
    --r:14px; --r-lg:20px; --ease:cubic-bezier(.2,.8,.2,1);
  }
  html[data-theme="dark"]{
    --bg:#11151a; --bg2:#161b22; --card:#1b222b; --ink:#e7ecf1; --muted:#9aa6b2;
    --line:#2a323c; --accent:#3fb9b2; --accent-ink:#7fd6d0; --accent-soft:#163230;
    --amber:#e0a64a; --amber-soft:#2e2515; --violet:#a99cf0; --violet-soft:#221d3a;
    --good:#46c178; --good-soft:#16301f; --bad:#ef6b82; --bad-soft:#331620;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 2px 8px rgba(0,0,0,.4),0 22px 48px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;letter-spacing:-.01em}
  button,a{font-family:inherit;cursor:pointer;color:inherit}
  .wrap{max-width:880px;margin:0 auto;padding:0 18px 96px}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
  .ic{width:1.25em;height:1.25em;flex:none;vertical-align:-.18em;stroke:currentColor;stroke-width:1.75;
    stroke-linecap:round;stroke-linejoin:round;fill:none}

  header.top{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(160%) blur(16px);-webkit-backdrop-filter:saturate(160%) blur(16px);box-shadow:inset 0 -1px 0 0 rgba(0,0,0,.04)}
  .topin{max-width:880px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:700}
  .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,var(--accent),var(--accent-ink));
    color:#fff;display:grid;place-items:center;font-family:Georgia,serif;font-weight:700;font-size:16px;flex:none;
    box-shadow:0 2px 6px rgba(15,110,106,.35)}
  .brand small{display:block;font-weight:500;color:var(--muted);font-size:11px}
  .spacer{flex:1}
  .iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:38px;
    padding:7px 11px;font-size:13.5px;display:inline-flex;gap:7px;align-items:center;text-decoration:none;
    transition:border-color .2s var(--ease),transform .12s var(--ease)}
  .iconbtn:hover{border-color:var(--accent)} .iconbtn:active{transform:scale(.96)}
  nav.tabs{display:flex;gap:2px;overflow:auto;max-width:880px;margin:0 auto;padding:6px 12px 0;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{border:none;background:none;color:var(--muted);padding:10px 13px;border-radius:9px 9px 0 0;
    font-size:14px;font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px;transition:color .2s var(--ease)}
  nav.tabs button .ic{width:16px;height:16px}
  nav.tabs button.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
  nav.tabs button:hover{color:var(--ink)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:20px}
  .muted{color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
  .pill.amber{background:var(--amber-soft);color:var(--amber)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;gap:14px}
  @media(min-width:620px){.g2{grid-template-columns:1fr 1fr}}

  .hero{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin:20px 0 8px}
  .count{flex:none;background:linear-gradient(150deg,var(--accent),var(--accent-ink));color:#fff;border-radius:var(--r);padding:14px 20px;text-align:center;min-width:118px;box-shadow:0 8px 20px rgba(15,110,106,.28)}
  .count b{font-family:Georgia,serif;font-size:32px;display:block;line-height:1}
  .count span{font-size:12px;opacity:.92}
  .herotext h1{margin:0 0 4px;font-size:25px}
  .herotext p{margin:0;color:var(--muted)}

  .brandstrip{display:flex;align-items:center;gap:13px;width:100%;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 16px;margin:14px 0 2px;box-shadow:var(--shadow);transition:border-color .2s var(--ease),transform .15s var(--ease)}
  .brandstrip:hover{border-color:var(--accent);transform:translateY(-1px)}
  .brandstrip .bs-logo{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:17px;background:linear-gradient(145deg,var(--accent),var(--accent-ink))}
  .brandstrip .bs-txt{flex:1;min-width:0} .brandstrip .bs-txt b{display:block;font-size:14.5px} .brandstrip .bs-txt small{color:var(--muted);font-size:12.5px}
  .brandstrip .bs-go{color:var(--accent-ink);flex:none;display:inline-flex} .brandstrip .bs-go .ic{width:18px;height:18px}

  .seclabel{display:flex;align-items:center;gap:8px;margin:24px 0 12px;font-weight:700;font-size:15px}
  .seclabel .ic{width:18px;height:18px;color:var(--accent-ink)}
  .backlink{display:inline-flex;align-items:center;gap:5px;border:none;background:none;color:var(--muted);font-size:13.5px;font-weight:600;padding:6px 0;margin-bottom:4px;transition:color .2s var(--ease)}
  .backlink:hover{color:var(--accent-ink)} .backlink .ic{width:16px;height:16px}
  .tracks{display:grid;gap:14px} @media(min-width:600px){.tracks{grid-template-columns:1fr 1fr}}
  .track{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);transition:transform .22s var(--ease),border-color .22s var(--ease),box-shadow .22s var(--ease)}
  .track:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow-lg)} .track:active{transform:translateY(-1px) scale(.995)}
  .track .tile{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;margin-bottom:4px;background:linear-gradient(150deg,var(--accent),var(--accent-ink))}
  .track.alt .tile{background:linear-gradient(150deg,var(--violet),#4f40a8)} .track .tile .ic{width:24px;height:24px}
  .track b{font-size:18px} .track small{color:var(--muted);font-size:13.5px;line-height:1.5}
  .track .go{margin-top:6px;display:inline-flex;align-items:center;gap:6px;color:var(--accent-ink);font-weight:600;font-size:13.5px} .track.alt .go{color:var(--violet)} .track .go .ic{width:16px;height:16px}
  .toggle{width:48px;height:28px;border-radius:999px;border:none;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s var(--ease)}
  .toggle .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s var(--ease)}
  .toggle.on{background:var(--violet)} .toggle.on .knob{left:23px}
  .warmcard{border-color:var(--violet)!important;background:var(--violet-soft)} .warmcard .ic{width:22px;height:22px;color:var(--violet);flex:none}
  .modebanner{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:11px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent-ink);font-size:13.5px;font-weight:600}
  .modebanner.v{background:var(--violet-soft);color:var(--violet)} .modebanner .ic{width:18px;height:18px} .modebanner a,.modebanner .bnlink{margin-left:auto;font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;color:inherit;border:none;background:none;font-family:inherit;padding:0}
  html.snappy .card,html.snappy .mode,html.snappy .tip,html.snappy .track{animation-duration:.12s!important}
  .mode{display:flex;flex-direction:column;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:17px;gap:7px;box-shadow:var(--shadow);transition:transform .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease)}
  .mode:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .mode .me{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)} .mode .me .ic{width:22px;height:22px}
  .mode b{font-size:16px} .mode small{color:var(--muted);font-size:13px}

  label.fld{display:block;font-size:13px;font-weight:600;margin:16px 0 7px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;min-height:38px;padding:7px 13px;font-size:13.5px;transition:all .18s var(--ease)}
  .chip:hover{border-color:var(--accent)} .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:11px;min-height:46px;padding:12px 20px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;box-shadow:0 4px 12px rgba(15,110,106,.25);transition:background .2s var(--ease),transform .12s var(--ease)}
  .btn:hover{background:var(--accent-ink)} .btn:active{transform:scale(.97) translateY(1px)} .btn .ic{width:18px;height:18px}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none} .btn.ghost:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  input[type=search],input[type=text],input[type=email],textarea{font-family:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
  input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .runtop{display:flex;align-items:center;gap:12px;margin:2px 0 14px;font-size:13px;color:var(--muted)}
  .bar{height:8px;border-radius:6px;background:var(--bg2);overflow:hidden;flex:1}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .7s var(--ease)}
  .qtext{font-size:19px;font-weight:600;margin:8px 0 16px;font-family:Georgia,serif;line-height:1.45}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px 15px;margin-bottom:10px;font-size:15px;transition:border-color .15s var(--ease),background .15s var(--ease),transform .12s var(--ease)}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)} .opt:active:not(:disabled){transform:scale(.99)}
  .opt .k{flex:none;width:27px;height:27px;border-radius:8px;background:var(--bg2);color:var(--muted);display:grid;place-items:center;font-weight:700;font-size:13px}
  .opt.correct{border-color:var(--good);background:var(--good-soft)} .opt.correct .k{background:var(--good);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default}
  .feedback{border-radius:12px;padding:13px 15px;margin:4px 0 12px;font-size:14.5px}
  .feedback.ok{background:var(--good-soft);color:var(--good)} .feedback.no{background:var(--bad-soft);color:var(--bad)}
  .feedback b{font-weight:700} .feedback .sub{display:block;margin-top:3px;color:var(--ink);font-weight:500;opacity:.92}
  .whybtn{border:1px solid var(--line);background:var(--card);color:var(--accent-ink);border-radius:10px;min-height:40px;padding:9px 14px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:border-color .2s var(--ease),background .2s var(--ease)}
  .whybtn:hover{border-color:var(--accent);background:var(--accent-soft)} .whybtn .ic{width:16px;height:16px}
  .whybox{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:14px 16px;margin:12px 0 4px;font-size:14px;line-height:1.55}
  .whybox h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent-ink);font-family:system-ui;display:flex;align-items:center;gap:7px}
  .whybox .ic{width:16px;height:16px}

  .acc{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
  .acc>summary{padding:15px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:11px}
  .acc>summary::-webkit-details-marker{display:none}
  .acc>summary .n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
  .acc>summary .caret{margin-left:auto;color:var(--muted);transition:transform .25s var(--ease)} .acc[open]>summary .caret{transform:rotate(90deg)}
  .acc[open]>summary{border-bottom:1px solid var(--line)} .acc .body{padding:6px 18px 16px}
  .acc h4{margin:14px 0 6px;font-size:13px;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.4px;font-family:system-ui}
  .acc ul{margin:0;padding-left:20px} .acc li{margin:6px 0;font-size:14.5px;line-height:1.5}
  .acc.hack li::marker{content:"💡  "} .acc.hack>summary .n{background:var(--violet-soft);color:var(--violet)}
  mark{background:var(--amber-soft);color:inherit;padding:0 2px;border-radius:3px}

  .tip{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}
  .tip h4{margin:0 0 5px;font-size:14.5px;display:flex;align-items:center;gap:8px;font-family:system-ui} .tip h4 .ic{width:18px;height:18px;color:var(--violet)}
  .tip p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}
  .tipgrid{display:grid;gap:12px} @media(min-width:620px){.tipgrid{grid-template-columns:1fr 1fr}}

  .results .big{font-family:Georgia,serif;font-size:54px;text-align:center;margin:8px 0;line-height:1}
  .center{text-align:center} .hide{display:none!important}
  footer{margin-top:34px;text-align:center;color:var(--muted);font-size:13px}
  .kbd{font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--muted)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.03)}100%{transform:scale(1)}}
  @keyframes optIn{from{opacity:0;transform:translateX(-9px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: no-preference){
    .card,.mode,.tip{animation:fadeUp .34s var(--ease) both}
    .acc{animation:fadeUp .32s var(--ease) both}
    .opt{animation:optIn .3s var(--ease) backwards;animation-delay:var(--oi,0s)}
    .chip.on{animation:pop .22s var(--ease)}
    .feedback{animation:slideIn .26s var(--ease) both} .whybox{animation:slideIn .28s var(--ease) .07s both} .opt.correct{animation:pop .34s var(--ease)}
  }
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  /* ---- Premium launch (Gemini-stijl) + header-logo gloed ---- */
  @property --bes-a{syntax:'<angle>';initial-value:0deg;inherits:false}
  #splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(125% 125% at 50% 38%,var(--bg2) 0%,var(--bg) 68%);transition:opacity .6s var(--ease),transform .7s var(--ease)}
  #splash.hide{opacity:0;transform:scale(1.07);pointer-events:none}
  .sp-inner{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
  .sp-mark{position:relative;width:100px;height:100px;display:grid;place-items:center}
  .sp-mark::before{content:"";position:absolute;inset:-16px;border-radius:34px;z-index:0;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));filter:blur(17px);opacity:.75}
  .sp-mark::after{content:"";position:absolute;inset:-3px;border-radius:27px;z-index:1;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));padding:3px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .sp-logo{position:relative;z-index:2;width:92px;height:92px;border-radius:24px;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:46px;background:linear-gradient(150deg,var(--accent),var(--accent-ink));box-shadow:0 14px 38px rgba(15,110,106,.4)}
  .sp-spark{position:absolute;z-index:3;top:-7px;right:-7px;width:30px;height:30px;color:#fff;filter:drop-shadow(0 2px 7px rgba(0,0,0,.35))}
  .sp-name{position:relative;font-family:Georgia,serif;font-size:26px;font-weight:700;letter-spacing:-.01em;color:var(--ink);overflow:hidden}
  .sp-name::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(-130%)}
  .sp-tag{font-size:13px;color:var(--muted);margin-top:-8px;letter-spacing:.03em}
  @media (prefers-reduced-motion: no-preference){
    .sp-mark::before{animation:bes-spin 3s linear infinite,bes-breathe 2.4s var(--ease) infinite}
    .sp-mark::after{animation:bes-spin 3s linear infinite}
    .sp-logo{animation:bes-pop .7s var(--ease) both}
    .sp-spark{animation:bes-pop .6s var(--ease) .12s both,bes-twinkle 1.9s var(--ease) .9s infinite}
    .sp-name{animation:bes-rise .6s var(--ease) .14s both}
    .sp-name::after{animation:bes-shimmer 1.5s var(--ease) .5s 1}
    .sp-tag{animation:bes-rise .6s var(--ease) .26s both}
  }
  @keyframes bes-spin{to{--bes-a:360deg}}
  @keyframes bes-breathe{0%,100%{opacity:.55;filter:blur(16px)}50%{opacity:.95;filter:blur(22px)}}
  @keyframes bes-shimmer{to{transform:translateX(130%)}}
  @keyframes bes-twinkle{0%,100%{opacity:1;transform:scale(1) rotate(0deg)}50%{opacity:.65;transform:scale(.82) rotate(18deg)}}
  @keyframes bes-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  /* mobiel: header-knoppen alleen iconen zodat niks zijwaarts overflowt */
  @media(max-width:440px){ header.top .iconbtn span{display:none} header.top .iconbtn{padding:7px 9px;min-width:38px;justify-content:center} .topin{gap:8px} }
</style>
</head>
<body>
<div id="splash"><div class="sp-inner">
  <div class="sp-mark">
    <div class="sp-logo">On</div>
    <svg class="sp-spark" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.5c.4 4.6 2.4 6.6 7 7-4.6.4-6.6 2.4-7 7-.4-4.6-2.4-6.6-7-7 4.6-.4 6.6-2.4 7-7Z"/></svg>
  </div>
  <div><div class="sp-name">Onderwijspsychologie & Leerstoornissen</div><div class="sp-tag">slim oefenen voor je examen</div></div>
</div></div>
<header class="top">
  <div class="topin">

<script>
window.OW = {"questions":[{"t":"1","q":"Wat is het onderscheid tussen algemene leerproblemen en een specifieke leerstoornis?","o":["Leerproblemen betreffen problemen met leren over verschillende vakken en gebieden heen, terwijl een specifieke leerstoornis gaat over een afgebakende vaardigheid zoals lezen of rekenen.","Leerproblemen betreffen enkel het rekenen, terwijl een specifieke leerstoornis enkel het lezen betreft.","Leerproblemen zijn altijd genetisch bepaald, terwijl een specifieke leerstoornis louter door de omgeving ontstaat.","Leerproblemen zijn tijdelijk en verdwijnen vanzelf, terwijl een specifieke leerstoornis pas op volwassen leeftijd begint."],"a":0,"u":"Leerproblemen zijn brede problemen met leren op verschillende vakken en gebieden, terwijl een specifieke leerstoornis draait om problemen met een specifieke vaardigheid zoals lezen of rekenen."},{"t":"1","q":"Een leerling leest onnauwkeurig en langzaam, heeft moeite om de betekenis van gelezen tekst te achterhalen en maakt veel spelfouten. Bij welke stoornis passen deze kenmerken volgens de leerstof?","o":["Dyslexie","Verstandelijke beperking","Dyspraxie","Dyscalculie"],"a":0,"u":"Dyslexie wordt gekenmerkt door onnauwkeurig, langzaam en moeizaam lezen, moeite om gelezen tekst te begrijpen, en moeite met spellen en schriftelijke uitdrukking."},{"t":"1","q":"Volgens de DSM-criteria voor een specifieke leerstoornis moeten de moeilijkheden aan welke voorwaarde qua duur voldoen?","o":["Ze moeten dagelijks en levenslang aanwezig zijn zonder onderbreking.","Ze mogen maximaal drie maanden aanhouden.","Ze moeten persisterend aanwezig zijn gedurende minstens zes maanden.","Ze moeten pas na de puberteit optreden."],"a":2,"u":"De DSM-criteria vereisen een persisterende aanwezigheid van de moeilijkheden gedurende minstens zes maanden."},{"t":"1","q":"Wat kenmerkt dyscalculie volgens de besproken criteria?","o":["Een verstoorde motoriek die het schrijven bemoeilijkt.","Moeite met getallengevoel, berekeningen en cijfermatig redeneren, slechter ontwikkeld dan verwacht voor de kalenderleeftijd.","Moeite met het achterhalen van de betekenis van geschreven tekst.","Een algemeen verlaagd IQ onder de 70 dat alle prestaties verklaart."],"a":1,"u":"Dyscalculie betreft moeite met getallengevoel, berekeningen en cijfermatig redeneren die slechter ontwikkeld zijn dan verwacht op basis van de kalenderleeftijd en die beperkingen geven in het dagelijks en schools functioneren."},{"t":"1","q":"Waarom is een IQ tussen 70 en 85 (de zogenaamde grijze zone) relevant bij het uitsluiten van andere verklaringen voor een leerstoornis?","o":["In deze zone is een diagnose van dyslexie of dyscalculie volledig uitgesloten.","In deze zone kan niet zomaar alles door een verstandelijke beperking worden verklaard, waardoor men milder oordeelt over lees- of rekenfouten.","In deze zone geldt dat de leerling geen recht meer heeft op enige ondersteuning.","In deze zone worden alle prestaties automatisch volledig verklaard door een verstandelijke beperking."],"a":1,"u":"Bij een IQ onder 70 wordt alles verklaard door een verstandelijke beperking, maar de zone tussen 70 en 85 is een grijze zone waarin men milder is op lees- en rekenfouten en niet alles zomaar aan een verstandelijke beperking toeschrijft."},{"t":"1","q":"De normaalverdelingskritiek op de DSM-criteria voor specifieke leerstoornissen houdt in dat:","o":["de diagnose altijd te laat wordt gesteld voor toegang tot hulpverlening.","compensatie door de leerling nooit mogelijk is.","de criteria te weinig uitsluitende voorwaarden hanteren.","er geen bi-modaliteit in de normaalverdeling te zien is, waardoor de grenzen van leerstoornissen arbitrair zijn."],"a":3,"u":"De normaalverdelingskritiek stelt dat er geen bi-modaliteit in de normaalverdeling zichtbaar is, waardoor de grens tussen wel en geen leerstoornis arbitrair is."},{"t":"1","q":"Wat is volgens de leerstof het verschil tussen remedial teaching en een orthodidactische behandeling?","o":["Remedial teaching is beperkte, binnenschoolse ondersteuning voor leerlingen zonder diagnose, terwijl een orthodidactische behandeling gespecialiseerde, buitenschoolse ondersteuning is voor leerlingen met een diagnose.","Remedial teaching vereist een strikt protocol met diagnose, terwijl een orthodidactische behandeling zonder enige diagnose plaatsvindt.","Remedial teaching gebeurt altijd buiten de school, terwijl een orthodidactische behandeling altijd binnen de klas gebeurt.","Remedial teaching is uitsluitend voor hoogbegaafde leerlingen, terwijl een orthodidactische behandeling voor zwakke leerlingen is."],"a":0,"u":"Remedial teaching is beperkte, binnenschoolse ondersteuning voor leerlingen zonder diagnose van een leerstoornis, terwijl een orthodidactische behandeling meer gespecialiseerde, buitenschoolse ondersteuning is voor leerlingen met een diagnose."},{"t":"1","q":"Hoe verhouden de begrippen stoornis, beperking en handicap zich volgens de besproken definities?","o":["Een beperking betreft enkel het onderwijs, een stoornis enkel de thuissituatie en een handicap enkel de werkcontext.","Een handicap is de anatomische afwijking zelf, een beperking is de oorzaak ervan en een stoornis is het gevolg voor de rolvervulling.","Alle drie zijn synoniemen die eenzelfde verlies van een lichaamsfunctie beschrijven.","Een stoornis is een afwijking van een structuur of functie, een beperking is een verminderd vermogen om activiteiten te verrichten, en een handicap is de nadelige situatie die de normale rolvervulling belemmert."],"a":3,"u":"Een stoornis is een verlies of afwijking van een structuur of functie, een beperking is een verminderd vermogen om activiteiten te verrichten of gedrag te vertonen, en een handicap is de nadelige situatie die de normale rolvervulling begrenst of verhindert."},{"t":"1","q":"Bij 'redelijke aanpassingen' voor leerlingen met een leerstoornis geldt dat sommige maatregelen goed ingeburgerd zijn, maar niet even sterk onderbouwd. Welke uitspraak past bij de leerstof?","o":["Voorleessoftware, kladpapier en een aangepast lettertype zijn ingeburgerd, terwijl extra tijd bij evaluatie minder evidence-based is.","Extra tijd bij evaluatie is de best onderbouwde maatregel, terwijl voorleessoftware wordt afgeraden.","Wat als 'redelijk' geldt, ligt wettelijk vast en is voor elke school en leerling identiek.","Redelijke aanpassingen zijn enkel toegestaan voor leerlingen zonder diagnose van een leerstoornis."],"a":0,"u":"Wat 'redelijk' is, is een relatief begrip; ingeburgerde maatregelen zijn voorleessoftware, kladpapier en aangepast lettertype, terwijl bijvoorbeeld extra tijd bij evaluatie minder evidence-based is."},{"t":"2","q":"Wat houdt het exclusiecriterium bij de afbakening van dyslexie precies in?","o":["Het kind moet minstens gemiddeld begaafd zijn om de diagnose te krijgen","De leesproblemen moeten zich ook buiten het leesproces manifesteren","Comorbide stoornissen zoals ADHD sluiten de diagnose dyslexie altijd uit","De leesproblemen mogen niet toe te schrijven zijn aan externe factoren en moeten intern in het kind liggen"],"a":3,"u":"Externe factoren gelden als exclusiecriteria: het probleem moet intern in het kind liggen, namelijk op cognitief niveau, en mag niet te wijten zijn aan externe omstandigheden."},{"t":"2","q":"Volgens de Response to Instruction/Intervention-aanpak (RTI) worden welke leerlingen als dyslectici beschouwd?","o":["De leerlingen die het laagst scoren bij de eerste klassikale screening","De leerlingen bij wie een grote discrepantie tussen IQ en leesniveau bestaat","De 20% die onvoldoende profiteert van de gewone groepsinstructie","De leerlingen die na aangepaste, intensievere instructie blijven achterblijven (non-responders)"],"a":3,"u":"Bij RTI worden de metingen herhaald en de instructie telkens geïntensiveerd; de leerlingen die ondanks die aangepaste instructie non-responder blijven, worden als dyslectici beschouwd."},{"t":"2","q":"Welke verdeling van effectiviteit hoort bij de gelaagde instructie binnen de RTI-aanpak?","o":["90% groepsinstructie, 5% verlengde instructie, 5% individuele instructie","80% individuele instructie, 15% verlengde instructie, 5% groepsinstructie","80% groepsinstructie, 15% verlengde instructie, 5% intensieve individuele instructie","50% groepsinstructie, 30% verlengde instructie, 20% individuele instructie"],"a":2,"u":"Groepsinstructie is effectief voor 80% van de leerlingen, verlengde instructie voor 15% en intensieve individuele instructie voor de resterende 5%."},{"t":"2","q":"Wat is het kernprobleem van het discrepantiemodel dat oorspronkelijk IQ als exclusiecriterium gebruikte?","o":["Kinderen met een lager IQ zouden dan minder kans hebben op de diagnose dyslexie, wat niet klopt","Het model kan geen onderscheid maken tussen dyslexie en dyscalculie","Het model overschat systematisch het leesniveau van hoogbegaafde kinderen","Het vervangt de intra-individuele vergelijking ten onrechte door een interindividuele norm"],"a":0,"u":"Als onderpresteren wordt gedefinieerd als een discrepantie tussen de op IQ verwachte en de geleverde prestatie, zouden kinderen met een lager IQ minder kans op dyslexie hebben, en dat klopt niet."},{"t":"2","q":"Welk bezwaar tegen het discrepantiecriterium wordt in de leerstof genoemd?","o":["Het IQ voorspelt precies hoe snel een kind zal leren lezen","De cognitieve profielen van discrepante en niet-discrepante groepen zijn erg gelijkend en hun prognose is vergelijkbaar","Het verband tussen IQ en leesvaardigheid is een sterke correlatie die de diagnose overbodig maakt","De discrepante en niet-discrepante groepen hebben totaal verschillende cognitieve profielen"],"a":1,"u":"Het IQ voorspelt weinig over de verwachte leesvaardigheid; de cognitieve profielen van beide groepen lijken sterk op elkaar en ook hun ontwikkeling en interventie-effecten zijn vergelijkbaar."},{"t":"2","q":"Wat beschrijft het Mattheus-effect in de context van leesproblemen?","o":["Kinderen die goed lezen doen dit intrinsiek vaker, terwijl zwakke lezers geleidelijk apathie voor lezen ontwikkelen","Het genetische risico op dyslexie stijgt met elke volgende generatie","Zwakke lezers halen hun achterstand vanzelf in zodra ze formeel onderwijs volgen","De hersenactiviteit in de linker hemisfeer neemt toe naarmate men meer oefent"],"a":0,"u":"Het Mattheus-effect is een voorbeeld van een extern probleem: goede lezers lezen intrinsiek meer, terwijl zwakke lezers langzaam apathie voor lezen ontwikkelen, waardoor de kloof groeit."},{"t":"2","q":"Wat wordt bedoeld met de specificiteitsparadox rond dyslexie?","o":["Dyslexie is niet volledig te wijten aan de algemene cognitie, maar evenmin aan één specifieke oorzaak","Dyslexie komt alleen voor bij normaal begaafde kinderen maar wordt toch veroorzaakt door een laag IQ","Lezen is een aangeboren vaardigheid die evolutionair al lang geselecteerd is","Dyslexie is uitsluitend erfelijk maar treft toch enkel kinderen uit taalarme gezinnen"],"a":0,"u":"De specificiteitsparadox stelt dat dyslexie niet volstrekt te verklaren is vanuit de algemene cognitie (een hoog IQ kan samengaan met zwak lezen), maar ook niet vanuit één enkele specifieke oorzaak."},{"t":"2","q":"Wat blijkt uit het erfelijkheids- en tweelingonderzoek naar dyslexie?","o":["Kinderen van een dyslectische ouder hebben minder dan 10% kans op dyslexie","Dyslexie is volledig te herleiden tot één ziektegen op het X-chromosoom","Er is geen aantoonbare familiale of genetische correlatie voor dyslexie","De erfelijkheidsfactor bij tweelingonderzoek ligt tussen 45 en 85%, met een geslachtsgebonden penetrantie waarbij jongens vaker getroffen worden"],"a":3,"u":"Tweelingonderzoek wijst op een erfelijkheidsfactor tussen 45 en 85%; dyslexie is niet aan het X-chromosoom gebonden maar kent een geslachtsgebonden penetrantie waarbij jongens vaker getroffen zijn dan meisjes."},{"t":"2","q":"Welk model van Plomin en Kovas benadert volgens de leerstof het best de werkelijkheid van dyslexie?","o":["Model 2: meerdere onafhankelijke genen die elk afzonderlijk een mechanisme aansturen","Een model zonder enige genetische component, volledig omgevingsbepaald","Model 3: meerdere gecorreleerde mechanismen waarvan de onderlinge relaties niet zeker zijn","Model 1: één enkel fundamenteel gen dat een cognitief deficit veroorzaakt"],"a":2,"u":"Hoogstwaarschijnlijk komt de realiteit overeen met model 3: meerdere genen die elkaar beïnvloeden via gecorreleerde mechanismen, waarvan de precieze onderlinge relaties onduidelijk blijven."},{"t":"2","q":"Waarvoor staat de C in de STICORDI-maatregelen, en wat betekent die concreet?","o":["Controleren: de leerling regelmatig testen om achterstand op te sporen","Combineren: verschillende leerstijlen samenbrengen in één aanpak","Compenseren: het gebruik van een hulpmiddel toelaten, zoals leessoftware of een rekenregel","Categoriseren: de leerling indelen in een specifieke stoornisgroep"],"a":2,"u":"De C staat voor Compenseren: het toelaten van een hulpmiddel, bijvoorbeeld leessoftware of een rekenregel, zodat de leerling het probleem kan omzeilen."},{"t":"2","q":"Waarom spreekt men bij dyslexie van 'geen ziektegenen', ook al is de aanleg sterk erfelijk?","o":["Omdat er één specifiek dyslexiegen bestaat dat alleen de stoornis veroorzaakt","Omdat de betrokken genen ook instaan voor de gewone variatie in leesvaardigheid en niet enkel voor de stoornis","Omdat genen rechtstreeks coderen voor leesgedrag in plaats van voor eiwitten","Omdat dyslexie uitsluitend door de omgeving en niet door genen wordt bepaald"],"a":1,"u":"De genen die bijdragen aan dyslexie staan ook mee in voor de gewone variantie in leesvaardigheid; het zijn dus geen aparte ziektegenen maar kwantitatieve loci die in de hele populatie voorkomen."},{"t":"2","q":"Wat is een voorbeeld van een passieve gen-omgevingscorrelatie (rGE) bij leesontwikkeling?","o":["Een kind zoekt op basis van zijn aanleg zelf een boekenclub op","De overheid en school zorgen voor toegang tot een bibliotheek voor alle gezinnen","De omgeving reageert op het gedrag van het kind door minder samen te lezen","Dyslectische ouders halen doorgaans minder boeken in huis, waardoor hun kind minder aan taal wordt blootgesteld"],"a":3,"u":"Bij een passieve rGE gaat genetische en culturele transmissie samen: dyslectische ouders halen vaak minder boeken in huis en lezen minder voor, waardoor het kind minder aan taal wordt blootgesteld."},{"t":"2","q":"Welke drie regio's vormen volgens de leerstof het neurale leesnetwerk in de linker hemisfeer?","o":["De prefrontale cortex, de hippocampus en het cerebellum","De rechter frontale, de rechter pariëtale en de rechter occipitale cortex","De amygdala, de thalamus en de motorische schors","De inferieure frontale, de temporo-pariëtale en de occipito-temporale cortex"],"a":3,"u":"Het neurale leesnetwerk bestaat uit drie actieve regio's in de linker hemisfeer: de inferieure frontale cortex (herkennen van gesproken woorden), de temporo-pariëtale cortex (fonologische verwerking) en de occipito-temporale cortex (herkennen van geschreven woorden)."},{"t":"3","q":"Waarom wordt het klassieke medische model (defectmodel) niet langer als adequaat beschouwd om dyslexie te verklaren?","o":["Omdat er geen 1-op-1 relatie tussen één oorzaak en de symptomen is gevonden en symptomen ook zonder de vermoedelijke oorzaak kunnen voorkomen","Omdat dyslexie enkel door omgevingsfactoren blijkt te worden veroorzaakt","Omdat er geen genetische component bij dyslexie is teruggevonden","Omdat het model uitgaat van te veel verschillende oorzaken tegelijk"],"a":0,"u":"Het deterministische defectmodel gaat uit van één achterliggende oorzaak, maar er zijn geen 1-op-1 relaties gevonden en symptomen kunnen ook aanwezig zijn zonder de vermoede oorzaak."},{"t":"3","q":"Welke omschrijving past het best bij het multifactorieel verklaringsmodel van dyslexie?","o":["Dyslexie is een gevolg van onvoldoende leesonderwijs alleen","Uitsluitend genetische factoren en breinstructuur verklaren het leesprobleem","Een samenspel van genetische factoren, breinstructuur en functies, cognitieve vaardigheden en omgevingsfactoren verklaart dyslexie","Eén dominante cognitieve factor bepaalt volledig of iemand dyslexie ontwikkelt"],"a":2,"u":"Volgens het multifactorieel model ontstaat dyslexie door de combinatie van genetische factoren, breinstructuur en functies, cognitieve vaardigheden en omgevingsfactoren."},{"t":"3","q":"Een kind splitst het woord 'kat' in de klanken 'k', 'a' en 't'. Welke deelvaardigheid van fonologisch bewustzijn wordt hier geoefend?","o":["Blenden of mixen van geluiden","Substitueren van geluiden","Toevoegen van fonemen","Isoleren van geluiden"],"a":3,"u":"Bij het isoleren van geluiden worden de afzonderlijke klanken van een woord losgemaakt, zoals kat opsplitsen in k, a en t."},{"t":"3","q":"Bij welke oefening in fonologisch bewustzijn worden losse fonemen juist samengevoegd tot een geheel woord, bijvoorbeeld van 'k-a-t' naar 'kat'?","o":["Onset en rime splitsen","Weglaten van fonemen","Substitueren van geluiden","Blenden of mixen van geluiden"],"a":3,"u":"Bij het blenden of mixen van geluiden voegt het kind afzonderlijke fonemen samen tot een woord, zoals k-a-t tot kat."},{"t":"3","q":"Wat stelt de fonologische deficiethypothese in haar oorspronkelijke vorm?","o":["Dat trage benoemsnelheid de enige oorzaak van dyslexie is","Dat dyslexie vooral door een visueel verwerkingsprobleem ontstaat","Dat de kern van het leesprobleem ligt in een tekort in de fonologische verwerking, opgevat als enkelvoudig causaal model","Dat het probleem uitsluitend in de spraakontwikkeling zit"],"a":2,"u":"De fonologische deficiethypothese ging oorspronkelijk uit van een enkelvoudig causaal model waarin een tekort in de fonologische verwerking de kern van het leesprobleem vormt."},{"t":"3","q":"Hoe wordt de rol van fonologisch bewustzijn binnen het huidige multifactorieel model het best getypeerd?","o":["Als een factor die pas na de volwassenheid een rol begint te spelen","Als de enige en voldoende oorzaak van elke vorm van dyslexie","Als geen enkelvoudige oorzaak, maar wel de specifieke en sterkste risicofactor","Als een factor die geen enkel verband met leesvaardigheid vertoont"],"a":2,"u":"Fonologisch bewustzijn heeft de sterkste causale rol, maar is geen eenvoudige oorzaak. Het geldt als de specifieke en sterkste risicofactor uit het multifactorieel model, want niet iedereen met dyslexie heeft een fonologisch defect en omgekeerd."},{"t":"3","q":"Waarom moet men bij het meten van fonologisch bewustzijn of letterkennis niet alleen accuratesse maar ook snelheid meenemen?","o":["Omdat de taak anders te makkelijk wordt en een plafondeffect optreedt waardoor het probleem niet tot uiting komt","Omdat de taak anders te moeilijk wordt voor jonge kinderen","Omdat snelheid de enige factor is die met leesvaardigheid samenhangt","Omdat oudere kinderen anders veel meer fouten maken"],"a":0,"u":"Zonder de snelheid mee te meten wordt de taak te makkelijk, vooral voor oudere kinderen, en ontstaat een plafondeffect waardoor het leesprobleem niet zichtbaar wordt."},{"t":"3","q":"Dyslectici scoren slechter op de non-woord-repetitietaak, die het verbaal kortetermijngeheugen test. Waaraan wordt dit slechtere presteren vooral toegeschreven?","o":["Aan een verkleinde visuele aandachtspanne","Aan de comorbiditeit met een zwakkere mondelinge taalvaardigheid","Aan een probleem in het impliciet leren van volgorde-informatie","Aan een tekort in het snelbenoemen van kleuren en cijfers"],"a":1,"u":"Op de non-woord-repetitietaak scoren dyslectici slechter, maar dit komt vooral door de comorbiditeit met een zwakkere mondelinge taalvaardigheid en een taalontwikkelingsstoornis, niet door een specifiek geheugendefect."},{"t":"3","q":"Wat wordt gemeten met de rapid automatized naming (RAN) taak?","o":["Het weglaten en verwisselen van klanken in een woord","Het herhalen van een reeks niet-bestaande woorden","Het aantal letters dat in één oogopslag verwerkt kan worden","De snelheid waarmee een reeks bekende symbolen zoals letters, cijfers, kleuren of plaatjes benoemd wordt"],"a":3,"u":"RAN meet snelbenoemen, namelijk hoe snel iemand een set bekende symbolen zoals letters, cijfers, kleuren of plaatjes kan benoemen."},{"t":"3","q":"In een transparante taal, waarbij de koppeling tussen letters en klanken eenvoudig en overeenkomstig is, geldt snelbenoemen als:","o":["een taak die vooral de accuratesse en nauwelijks de snelheid meet","een maat die volledig samenvalt met fonologisch bewustzijn","de beste voorspeller van leesvaardigheid, waarbij vooral snelheid belangrijk is","een factor zonder aantoonbaar verband met leesvaardigheid"],"a":2,"u":"In een transparante taal is snelbenoemen de beste voorspeller van leesvaardigheid, waarbij vooral snelheid telt omdat er weinig fouten worden gemaakt."},{"t":"3","q":"Wat is het centrale idee van de visuele aandachtspanne (VAS) hypothese?","o":["Dyslectici hebben een tekort in het impliciet leren van volgorde-informatie","Dyslectici koppelen fonologie niet goed aan orthografie door een tekort in het verbaal kortetermijngeheugen","Dyslectici scoren slechter door een comorbide taalontwikkelingsstoornis","Dyslectici kunnen minder orthografische elementen in één oogopslag verwerken, waardoor het hele woord niet herkend wordt en de verwerking langer duurt"],"a":3,"u":"De VAS-hypothese stelt dat dyslectici minder letters of lettergrepen in één oogopslag kunnen verwerken, waardoor het volledige woord niet herkend wordt en de verwerking langer duurt."},{"t":"3","q":"Hoe staat het volgens recent onderzoek met de hypothese van een defect in het impliciet leren van volgorde-informatie als oorzaak van dyslexie?","o":["Recent onderzoek spreekt de hypothesen tegen, waardoor dit geen specifieke risicofactor blijkt","Recent onderzoek bevestigt deze hypothese als de belangrijkste oorzaak","Recent onderzoek wijst uit dat dit fonologisch bewustzijn volledig vervangt","Recent onderzoek toont aan dat dit uitsluitend bij transparante talen speelt"],"a":0,"u":"Hoewel leren lezen deels steunt op het impliciet onthouden van letters en klanken in een bepaalde volgorde, spreekt recent onderzoek de hypothesen over een defect in impliciet volgorde leren tegen, zodat het geen specifieke risicofactor is."},{"t":"4","q":"Waarvoor dient de directe (lexicale) route in het twee-routemodel van Coltheart?","o":["Voor het decoderen van pseudowoorden zonder lexicale kennis","Voor het bewust toepassen van pas geleerde uitspraakregels","Voor de rechtstreekse associatie tussen de spelling van een woord en zijn betekenis, vooral bij gekende woorden en uitzonderingen","Voor het letter voor letter omzetten van grafemen naar fonemen bij nieuwe woorden"],"a":2,"u":"De directe of lexicale route legt een rechtstreekse link tussen spelling en semantiek en is nodig voor reeds gekende woorden en uitzonderingswoorden. Ze doet aan herkenbaarheid, terwijl de indirecte route via GPC-regels decodeert."},{"t":"4","q":"Waarvoor is de indirecte (niet-lexicale) route in het twee-routemodel van Coltheart nodig?","o":["Om reeds gekende woorden meteen aan hun betekenis te koppelen","Om het orthografische patroon van een woord in het lexicon op te slaan","Om uitzonderingswoorden herkenbaar te maken zonder verklanking","Om nieuwe regels te leren en toe te passen door grafemen via GPC-regels om te zetten in fonemen"],"a":3,"u":"De indirecte of niet-lexicale route werkt via fonologische mediatie met GPC-regels, die grafemen omzetten in fonemen. Ze is nodig om nieuwe regeltjes te leren en toe te passen en verzorgt de decodering van woorden."},{"t":"4","q":"Een lezer met een hersenletsel leest woorden die volgens de regels verklankbaar zijn beter dan uitzonderingswoorden. Bij welke stoornis past dit en welke route is verstoord?","o":["Diepte dyslexie, met een verstoring van de indirecte (niet-lexicale) route","Oppervlakte dyslexie, met een verstoring van de directe (lexicale) route","Item-based leesachterstand, zonder routeverstoring","Fonologisch bewustzijnstekort, met een verstoring van beide routes"],"a":1,"u":"Bij oppervlakte dyslexie, verworven na hersenletsel, is de directe of lexicale route verstoord. Daardoor lukt regelmatig verklankbaar lezen nog wel, maar uitzonderingswoorden worden slechter gelezen."},{"t":"4","q":"Wat kenmerkt diepte dyslexie zoals beschreven in het twee-routemodel?","o":["Er treedt geen enkele semantische verwarring op tijdens het lezen","Het benoemde woord is vaak semantisch verwant met het gespelde woord, en inhoudswoorden worden beter gelezen dan functiewoorden","Uitzonderingswoorden worden beter gelezen dan regelmatige woorden","Pseudowoorden worden vlot gelezen omdat de GPC-regels intact blijven"],"a":1,"u":"Bij diepte dyslexie is de indirecte, niet-lexicale route verstoord. Typisch is dat het uitgesproken woord semantisch verwant is met het gespelde woord en dat inhoudswoorden beter gelezen worden dan functiewoorden of woorden met lage voorstelbaarheid."},{"t":"4","q":"Hoe verklaart het interactieve-activatiemodel (IAM) van McClelland en Rumelhart het woordsuperioriteitseffect?","o":["Doordat pseudowoorden een hogere basisactivatie krijgen dan echte woorden","Door een feedbacklus waarbij top-down input eerst het woordniveau activeert, dat vervolgens het letterniveau activeert","Door uitsluitend bottom-up verwerking vanaf het kenmerkniveau, zonder terugkoppeling","Doordat losse letters altijd sneller worden herkend dan letters in een woord"],"a":1,"u":"Het IAM combineert bottom-up en top-down effecten via een feedbacklus. Letters in een echt woord worden sneller herkend omdat top-down input eerst het woordniveau activeert, dat daarna het letterniveau versterkt."},{"t":"4","q":"Volgens het IAM lezen hoogfrequente woorden sneller dan laagfrequente woorden. Hoe wordt dit woordfrequentie-effect verklaard?","o":["Laagfrequente woorden worden via analogie herkend en zijn daardoor sneller","Frequentie speelt in het IAM geen rol, alleen woordlengte telt","Elke unit in het netwerk heeft een basisactivatie, en hoogfrequente woorden hebben een hogere basisactivatie","Hoogfrequente woorden activeren enkel de directe route en slaan het letterniveau over"],"a":2,"u":"In het IAM heeft elke unit een bepaalde basisactivatie. Hoogfrequente woorden hebben een hogere basisactivatie dan laagfrequente woorden, waardoor ze sneller worden verwerkt."},{"t":"4","q":"Wat stelt de fonologische mediatietheorie in het connectionistische model van Van Orden en Goldinger, en welke kritiek krijgt ze?","o":["Fonologische codering domineert woordherkenning; kritiek is dat de voorstelling te eenzijdig is omdat ook semantische symbolen connecties oproepen","Beide routes zijn gelijkwaardig; kritiek is dat het model geen leren toelaat","Semantiek domineert woordherkenning; kritiek is dat fonologie geen enkele rol speelt","Orthografie domineert woordherkenning; kritiek is dat fonemen en grafemen niet co-variëren"],"a":0,"u":"In deze theorie domineert de fonologische codering de woordherkenning, mede omdat fonemen en grafemen co-variëren. De kritiek luidt dat dit te eenzijdig is, aangezien een semantisch symbool ook connecties kan oproepen."},{"t":"4","q":"Wat is het verschil tussen de logografische fase en de alfabetische fase in de fasetheorie van Frith?","o":["In de logografische fase decodeert het kind letter voor letter, in de alfabetische fase herkent het hele woorden automatisch","In de logografische fase is er al een orthografisch lexicon, in de alfabetische fase nog niet","In de logografische fase herkent het kind woorden aan opvallende visuele kenmerken, in de alfabetische fase leert het fonologisch decoderen via letter-klank associaties","In beide fasen worden woorden globaal herkend, alleen de snelheid verschilt"],"a":2,"u":"In de logografische fase herkent het kind woorden aan opvallende visuele kenmerken zonder ze globaal te herkennen. In de alfabetische fase leert het fonologisch decoderen door letter-klank associaties te maken en letter voor letter te verklanken."},{"t":"4","q":"In het onderzoek van Ehri en Wilce kregen kinderen nonwoorden gekoppeld aan nummers; de ene helft zag de spelling, de andere niet. Wat toonde dit aan?","o":["Kinderen die de spelling gezien hadden herinnerden de nonwoorden veel beter, want grafeem-foneem koppeling werkt als geheugensteun","Enkel regelmatige woorden profiteerden van de spelling, onregelmatige niet","De spelling maakte geen verschil, want beide groepen presteerden gelijk","Kinderen die de spelling niet zagen onthielden de nonwoorden beter, omdat spelling afleidt"],"a":0,"u":"De kinderen die de spelling gezien hadden, herinnerden de nonwoorden veel beter. Dit toont dat de grafeem-foneem koppeling als geheugensteun werkt om nieuwe woorden sneller aan te leren en op te slaan, zowel voor regelmatige als onregelmatige woorden."},{"t":"4","q":"Wat stelt de self-teaching hypothese van Share over hoe orthografische kennis wordt opgebouwd?","o":["Orthografische kennis ontstaat pas nadat een leraar elk woord expliciet heeft aangeleerd","Orthografische kennis wordt opgebouwd wanneer semantiek, fonologie en orthografie samen geactiveerd worden, waarbij fonologisch decoderen als ingebouwde leraar werkt","Orthografische kennis hangt volledig af van de fase waarin de lezer zich bevindt, los van het specifieke woord","Orthografische kennis komt enkel voort uit het globaal herkennen van visuele woordvormen"],"a":1,"u":"Volgens de self-teaching hypothese wordt een link in het geheugen opgeslagen wanneer semantiek, fonologie en orthografie samen geactiveerd worden. Fonologisch decoderen werkt daarbij als een ingebouwde leraar, zodat het woord bij een volgende blootstelling meteen herkend wordt."},{"t":"4","q":"Wat is volgens de tekst het onderscheid tussen stage-based en item-based leestheorieën?","o":["Stage-based theorieën gelden enkel voor dyslectici, item-based theorieën enkel voor goede lezers","Stage-based theorieën stellen dat lezen in opeenvolgende fasen verloopt, item-based theorieën dat het lezen afhangt van hoe goed een woord al gekend is","Stage-based theorieën focussen op fonologie, item-based theorieën uitsluitend op semantiek","Beide zijn identiek, alleen de benaming verschilt per onderzoeker"],"a":1,"u":"Stage-based theorieën zien leesvaardigheid als een geleidelijk proces in opeenvolgende fasen met steeds complexere vaardigheden. Item-based theorieën stellen dat de manier waarop een woord gelezen wordt afhangt van hoe goed dat woord al gekend is."},{"t":"5","q":"Welk intelligentiemodel wordt in dit hoofdstuk beschreven als het meest invloedrijke en empirisch onderbouwde model voor de structuur van intelligentie, en ligt aan de basis van de WISC-V?","o":["Het Cattell-Horn-Carroll model (CHC-model)","Het groeimodel van Kieboom en Venderickx","Het multifactorenmodel van Heller","Het Delphi-model van Kooijman en van Thiel"],"a":0,"u":"De brontekst noemt het CHC-model als het meest invloedrijke en empirisch onderbouwde intelligentiemodel, bruikbaar voor zowel klinische als normale populaties, dat aan de basis van de WISC-V ligt."},{"t":"5","q":"Een leerling scoort sterk op redeneertaken waarbij hij volledig nieuwe problemen moet oplossen in ongekende situaties. Welke brede cognitieve vaardigheid uit het CHC-model past hier het best bij?","o":["Verwerkingssnelheid","Gekristalliseerde kennis","Vloeiende intelligentie","Kwantitatieve kennis"],"a":2,"u":"Vloeiende intelligentie verwijst volgens de bron naar het redeneervermogen om nieuwe problemen aan te pakken in nieuwe situaties, terwijl gekristalliseerde kennis juist cultureel gebonden is."},{"t":"5","q":"Wat is een centraal uitgangspunt over hoogbegaafdheid (HB) in de brontekst?","o":["HB valt volledig samen met een hoog IQ en is daarmee zuiver aangeboren zonder rol van context","HB wordt uitsluitend bepaald door omgevingsfactoren en niet door aanleg","HB valt niet enkel samen met IQ en vormt geen garantie op succes in het latere leven","HB garandeert dat het latere leven zonder problemen verloopt"],"a":2,"u":"De bron stelt dat HB niet enkel samenvalt met IQ en geen garantie op succes in het latere leven biedt. Een longitudinaal onderzoek van 25 jaar ontkrachtte de mythe dat alles vanzelf goed gaat voor HB."},{"t":"5","q":"Een hoogbegaafd kind verbergt zijn begaafdheid en past zich sterk aan het gedrag van de groep aan om erbij te horen, waardoor het internaliserende problemen ontwikkelt. Bij welk subtype past dit?","o":["Het succesvolle subtype","Het autonome subtype","Het onderduikende subtype","Het uitdagende subtype"],"a":2,"u":"Het onderduikende subtype verbergt de hoogbegaafdheid en ontwikkelt door conformisme, het aanpassen aan de groep, internaliserende problemen."},{"t":"5","q":"Wat is het verschil tussen het succesvolle en het autonome subtype van hoogbegaafdheid?","o":["Het succesvolle subtype zoekt goedkeuring van de omgeving, terwijl het autonome subtype goedkeuring van zichzelf zoekt en meesterschap nastreeft","Het succesvolle subtype wordt zelden herkend, terwijl het autonome subtype altijd tot drop-out leidt","Het succesvolle subtype denkt divergent en wordt als storend ervaren, terwijl het autonome subtype conformeert","Het succesvolle subtype ontwikkelt gedragsproblemen, terwijl het autonome subtype internaliserende problemen krijgt"],"a":0,"u":"Beide subtypes zijn aangepast aan de maatschappij en worden meestal correct herkend, maar het succesvolle subtype wil goedkeuring van de omgeving, terwijl het autonome subtype goedkeuring van zichzelf wil en meesterschap over iets nastreeft."},{"t":"5","q":"Wat betekent 'dubbel bijzonder' in de context van hoogbegaafdheid?","o":["Dat er co-morbiditeit is met andere aandoeningen of stoornissen, die de HB kunnen versterken of beperken","Dat het kind zowel op school als thuis presteert","Dat de HB door twee onafhankelijke onderzoekers is vastgesteld","Dat het kind op twee intelligentietests hoog scoort"],"a":0,"u":"Dubbel bijzonder verwijst naar co-morbiditeit met andere aandoeningen of stoornissen. Deze kan versterkend werken, bijvoorbeeld ASS die het niet hanteren van een studiemethode versterkt, of beperkend, bijvoorbeeld een leerstoornis die het talent tegenhoudt."},{"t":"5","q":"Volgens het Mönks en Mason model (2000) worden de persoonsgebonden capaciteiten pas naar het HB-potentieel geduwd onder welke voorwaarde?","o":["Alleen wanneer het kind een uitzonderlijk hoog IQ heeft","Alleen wanneer specifieke prestatiedomeinen exact bekend zijn","Alleen wanneer er sprake is van co-morbiditeit met een stoornis","Alleen in aanwezigheid van ondersteunende en bevorderende omgevingsfactoren en invloeden"],"a":3,"u":"Het Mönks en Mason model stelt dat de persoonsgebonden factoren enkel in aanwezigheid van ondersteunende en bevorderende omgevingsfactoren optimaal ontwikkelen tot HB-potentieel."},{"t":"5","q":"Waarom wordt de diagnose hoogbegaafdheid volgens de bron nauwelijks gegeven wanneer er een leerstoornis in het spel is?","o":["Omdat een leerstoornis en HB elkaar maskeren, waardoor het kind vaak geen adequate begeleiding krijgt","Omdat een leerstoornis het IQ structureel verhoogt en zo de HB overschaduwt","Omdat een leerstoornis de vloeiende intelligentie volledig blokkeert","Omdat vragenlijsten voor leerstoornissen HB automatisch uitsluiten"],"a":0,"u":"Volgens de bron maskeren een leerstoornis en HB elkaar, waardoor kinderen vaak geen adequate begeleiding krijgen. Dit brengt niet-cognitieve gevolgen mee zoals laag zelfvertrouwen en een slechte relatie met school."},{"t":"5","q":"Waarom hebben vragenlijsten volgens de bron een beperkt onderscheidend vermogen wanneer men HB van ADHD wil onderscheiden?","o":["Omdat ADHD nooit voorkomt bij hoogbegaafde kinderen","Omdat ADHD altijd samengaat met een lager IQ dan HB","Omdat HB en ADHD veel kenmerken delen, zoals beperkte aandacht en het vermijden van inspannende taken","Omdat vragenlijsten enkel de vloeiende intelligentie meten"],"a":2,"u":"De bron stelt dat vragenlijsten beperkt onderscheidend vermogen hebben door gedeelde kenmerken van HB en ADHD, zoals beperkte aandacht, suboptimale werkstrategieën en het vermijden van taken die inspanning vragen."},{"t":"5","q":"In het multifactorenmodel van Heller wordt gesteld dat de problemen zich vooral bij welke groep factoren situeren?","o":["Bij het aantal co-morbide stoornissen","Bij de niet-cognitieve persoonlijkheidskenmerken, zoals locus of control, faalangst en prestatiemotivatie","Bij de mate van vloeiende intelligentie","Bij de specifieke prestatiedomeinen, die als belangrijkst gelden"],"a":1,"u":"Volgens het model van Heller situeren de problemen zich bij de niet-cognitieve persoonlijkheidskenmerken, zoals locus of control, faalangst, werk- en leerstrategieën, prestatiemotivatie en het omgaan met stress."},{"t":"5","q":"Wat is de prevalentie van hoogbegaafdheid volgens de brontekst?","o":["Ongeveer 25% van de Vlamingen is hoogbegaafd","Ongeveer de helft van elke klas is hoogbegaafd","Ongeveer 1 leerling per klas en circa 2,5% van de Vlamingen","Hoogbegaafdheid komt bij minder dan 0,1% van de bevolking voor"],"a":2,"u":"De bron vermeldt een prevalentie van ongeveer 1 leerling per klas en circa 2,5% van de Vlamingen, en merkt op dat HB bij jongeren vaak niet erkend of onderzocht wordt."},{"t":"5","q":"Wat is volgens de brontekst het onderscheidende kenmerk van de veerkrachtbenadering tegenover de risicobenadering van hoogbegaafdheid?","o":["De veerkrachtbenadering meet enkel het IQ, de risicobenadering enkel de omgeving","De veerkrachtbenadering stelt dat HB altijd tot drop-out leidt, de risicobenadering niet","In de veerkrachtbenadering is HB steeds co-morbide, in de risicobenadering nooit","In de veerkrachtbenadering beschermt HB en kan men veerkrachtig met stressoren omgaan, terwijl HB in de risicobenadering juist valkuilen vormt"],"a":3,"u":"Volgens de bron ziet de veerkrachtbenadering HB als beschermend, waarbij men veerkrachtig met stressoren kan omgaan, terwijl de risicobenadering HB als bron van valkuilen ziet met meer kans op sociaal-emotionele moeilijkheden en kwetsbaarheid."},{"t":"6","q":"Wat houdt de deficitvisie in waarop het zittenblijven volgens de tekst berust?","o":["Een homogeen onderwijsperspectief waarbij de leerling wordt beoordeeld ten opzichte van de norm in plaats van op individuele leerwinst","Een aanpak die elke leerling een eigen leerlijn en tempo toekent","Een visie die uitsluitend kijkt naar de sociaal-emotionele groei van de leerling","Een model dat de vooruitgang van de leerling meet ten opzichte van zichzelf over de tijd"],"a":0,"u":"De deficitvisie is een homogeen onderwijsperspectief dat de prestatie afmeet aan de norm, in tegenstelling tot het boeken van individuele leerwinst."},{"t":"6","q":"Wat wordt bedoeld met het enkelvoudig, lineair ontwikkelingsmodel dat aan zittenblijven ten grondslag ligt?","o":["De aanname dat ontwikkeling vooral wordt bepaald door de thuistaal en SES van de leerling","De aanname dat alle kinderen zich sequentieel en op eenzelfde universeel tempo ontwikkelen in vooraf bepaalde, leeftijdsgebonden fases","De aanname dat cognitieve en sociaal-emotionele ontwikkeling onafhankelijk van elkaar verlopen","De aanname dat kinderen zich in verschillende richtingen en tempo's ontwikkelen afhankelijk van hun context"],"a":1,"u":"Dit model veronderstelt dat alle kinderen zich sequentieel en op een universeel, leeftijdsadequaat tempo ontwikkelen in vooraf bepaalde fases."},{"t":"6","q":"Wat is 'grammar of schooling' zoals de tekst dit begrip in de Vlaamse context beschrijft?","o":["De wettelijke regel die bepaalt hoeveel keer een leerling mag blijven zitten","Een lesmethode die de nadruk legt op taal- en grammaticaonderwijs in het basisonderwijs","Een internationale toets die de onderwijskwaliteit van landen met elkaar vergelijkt","De manier waarop het onderwijssysteem gestructureerd is, in Vlaanderen voornamelijk pro-zittenblijven en gebaseerd op het jaarklassensysteem"],"a":3,"u":"Grammar of schooling verwijst naar hoe het onderwijssysteem wordt gestructureerd; in de Vlaamse context is dit vooral pro-zittenblijven en steunt het op het jaarklassensysteem."},{"t":"6","q":"Wat blijkt uit de PISA-gegevens over het verband tussen zittenblijven en prestaties?","o":["Zittenblijven hangt samen met hogere PISA-scores in landen met kleine SES-spreiding","Er is geen significant verband tussen zittenblijven en lage PISA-scores, maar wel een sterk verband met minder spreiding in SES","Landen met een kleine SES-spreiding gebruiken zittenblijven het vaakst als differentiatiemethode","Er is een sterk negatief verband tussen zittenblijven en PISA-scores in alle landen"],"a":1,"u":"PISA toont geen significant verband tussen zittenblijven en lage scores, maar wel een sterk verband met minder SES-spreiding; landen met grote SES-spreiding zetten zittenblijven juist in als differentiatie."},{"t":"6","q":"Waarom wordt Zweden in de tekst als gidsland genoemd?","o":["Omdat het strikt vasthoudt aan het jaarklassensysteem met veel zittenblijvers","Omdat het een totaal andere maatschappelijke context heeft dan België","Omdat het weinig zittenblijvers kent en holistisch inzet op zowel cognitie als sociaal-emotioneel welbevinden, met focus op individuele leerwinst","Omdat het lagere onderwijsstandaarden hanteert zoals in de No Child Left Behind act"],"a":2,"u":"Zweden heeft weinig zittenblijvers (6,4%), een vergelijkbare context met België en een holistische aanpak die inzet op cognitie en welbevinden en op individuele leerwinst."},{"t":"6","q":"Waarom is echt experimenteel onderzoek naar de effecten van zittenblijven volgens de tekst onmogelijk?","o":["Omdat scholen weigeren mee te werken aan longitudinaal onderzoek","Omdat de meetinstrumenten voor beide groepen identieke resultaten opleveren","Omdat er te weinig zittenblijvers zijn om een groep te vormen","Omdat leerlingen niet willekeurig kunnen worden toegewezen aan wel of niet blijven zitten, wat praktisch en ethisch niet kan"],"a":3,"u":"Randomisatie is praktisch en ethisch niet mogelijk, waardoor men uitwijkt naar quasi-experimenteel onderzoek dat via statistische technieken controleert voor verschillen."},{"t":"6","q":"Wat is het probleem van meetinvariantie bij het vergelijken van zittenblijvers en doorstromers?","o":["De twee groepen worden op verschillende momenten getoetst","De geconstateerde verschillen bestonden al voorafgaand aan het onderzoek","De test meet niet hetzelfde omdat de groepen opgaven anders oplossen door verschillende kennis","De zittenblijvers hebben de leerstof al eerder gezien, waardoor ze een voordeel hebben"],"a":2,"u":"Bij meetinvariantie meet de test niet hetzelfde: de resultaten verschillen omdat de leerlingen opgaven anders oplossen door hun verschillende kennis. Verticaal gelijkgestelde scores via ankeritems vormen een oplossing."},{"t":"6","q":"Bij het vergelijken met klasgenoten (jaarklasvergelijking) speelt het double dosage effect. Wat houdt dit in?","o":["Twee groepen kunnen niet uitgewisseld worden door differentiële kenmerken","Voor elke covariaatcombinatie moet men tot beide groepen kunnen behoren","De verschillen tussen groepen bestonden al voor het onderzoek begon","De zittenblijver heeft de leerstof al een keer gezien en heeft daardoor een voordeel"],"a":3,"u":"Het double dosage effect verwijst naar het feit dat de zittenblijver de leerstof al gezien heeft, waardoor de vergelijking met klasgenoten vertekend raakt."},{"t":"6","q":"Wat is de kern van propensity score matching als statistische techniek?","o":["Leerlingen willekeurig toewijzen aan een controle- of experimentele groep","Een niet-zittenblijvergroep met vergelijkbare kans om te blijven zitten vergelijken met de effectieve zittenblijvers, waarbij die kans via logistische regressie op demografische gegevens wordt berekend","Kennis en vaardigheden van twee leerjaren op één leerlijn plaatsen","Zittenblijvers direct matchen op elke covariaat afzonderlijk in categorieën"],"a":1,"u":"Bij propensity score matching wordt de kans om te blijven zitten via logistische regressie op gegevens zoals SES, thuistaal en geslacht berekend, waarna een vergelijkbare niet-zittenblijvergroep tegenover de echte zittenblijvers wordt gezet."},{"t":"6","q":"Wat is het nadeel van de positiviteitsassumptie bij matching, volgens de tekst?","o":["Ze verdubbelt de tijd die nodig is voor het longitudinaal onderzoek","Ze maakt het onmogelijk om demografische gegevens mee te nemen","Ze vereist dat leerlingen willekeurig aan groepen worden toegewezen","Ze zorgt ervoor dat men ongeveer de helft van de zittenblijvers uit de analyse mist"],"a":3,"u":"De positiviteitsassumptie veronderstelt dat er voor elke covariaatcombinatie overlap is tussen beide groepen; het nadeel is dat hierdoor ongeveer de helft van de zittenblijvers wegvalt."},{"t":"6","q":"Wat is een centrale conclusie uit de meta-analyses over de kwaliteit van de matching en het effect van zittenblijven?","o":["Hoe beter de kwaliteit van de matching, hoe minder negatief of zelfs positief het effect van zittenblijven uitvalt","Methodologisch sterke studies vinden consequent sterk negatieve effecten","De kwaliteit van de matching heeft geen invloed op het gevonden effect","Hoe zwakker de studie, hoe positiever het gevonden effect van zittenblijven"],"a":0,"u":"De meta-analyses tonen dat betere matchingkwaliteit gepaard gaat met minder negatieve of zelfs positieve effecten; zo werd bij goede studies een heel zwak positief effect gevonden en bij zwakke studies een matig sterk negatief effect."},{"t":"6","q":"Wat is volgens het bredere meta-analytische onderzoek de algemene effectiviteit van zittenblijven?","o":["Alleen positief in landen die uniforme integratie hanteren","In de praktijk nul, met gedifferentieerde effectgroottes die tussen ongeveer -.2 en .2 schommelen","Sterk positief, met effectgroottes ruim boven 1","Consequent sterk negatief in alle landen en contexten"],"a":1,"u":"Het bredere onderzoek komt uit op een algemene effectiviteit van zittenblijven van nul, met gedifferentieerde effectgroottes die tussen ongeveer -.2 en .2 liggen."},{"t":"6","q":"Wat verklaart volgens de tekst waarom zittenblijvers zich op korte termijn beter kunnen voelen (big fish little pond effect)?","o":["Ze vergelijken zich sociaal met de zwakkere leerlingen in hun nieuwe klas en voelen zich daardoor beter","Ze worden door de leerkracht bewust gunstiger beoordeeld","Ze halen structureel hogere punten dan al hun oorspronkelijke leeftijdsgenoten","Ze krijgen extra individuele bijles die hun zelfvertrouwen opkrikt"],"a":0,"u":"Het big fish little pond effect verwijst naar sociale vergelijking: de zittenblijver voelt zich beter ten opzichte van de zwakkere leerlingen in de nieuwe klas."},{"t":"6","q":"Waardoor wordt het mogelijke negatieve langetermijneffect van zittenblijven verklaard via het sneeuwbaleffect?","o":["Doordat het aantal zittenblijvers per klas jaar na jaar toeneemt","Doordat scholen zittenblijvers automatisch naar het buitengewoon onderwijs verwijzen","Doordat de leerling geleidelijk steeds meer wantrouwen tegenover school ontwikkelt","Doordat de leerstof elk jaar exponentieel moeilijker wordt"],"a":2,"u":"Het sneeuwbaleffect verklaart het negatieve langetermijneffect doordat de leerling beetje bij beetje meer argwaan tegenover school opbouwt."},{"t":"6","q":"Wat kenmerkt 'a la carte integratie' als alternatief voor klassiek zittenblijven?","o":["Alle zittenblijvers volgen verplicht summer school","Een C-attest geldt als ultiem redmiddel, terwijl men eerder inzet op alternatieven zoals ability grouping","Leerlingen krijgen standaard een C-attest zodra ze één vak niet halen","Het jaarklassensysteem wordt volledig vervangen door individueel onderwijs"],"a":1,"u":"Bij a la carte integratie is het C-attest een laatste redmiddel en wordt eerder ingezet op alternatieven zoals ability grouping, het groeperen volgens kunnen."},{"t":"7","q":"Welk maatschappelijk model wordt in de brontekst beschreven als de historisch meest voorkomende oplossing voor mensen met een beperking, waarbij aparte instituten en speciale instellingen werden voorzien?","o":["Integratie","Inclusie","Normalisatie","Separatie"],"a":3,"u":"Separatie of scheiding houdt in dat men speciale instellingen en aparte instituten voorziet, en dit wordt in de tekst benoemd als de meest voorkomende oplossing."},{"t":"7","q":"Wat is volgens de brontekst het kernonderscheid tussen inclusie en integratie?","o":["Inclusie vertrouwt op gelijke mensenrechten, terwijl integratie mensen slechts op sommige aspecten deel laat uitmaken van de maatschappij","Integratie streeft naar volledige deelname, inclusie slechts naar gedeeltelijke deelname","Inclusie richt zich enkel op onderwijs, integratie op de hele samenleving","Integratie start bij het waarderen van diversiteit, inclusie bij scheiding"],"a":0,"u":"Bij integratie of normalisatie maken mensen slechts op sommige aspecten deel uit van de maatschappij, terwijl inclusie steunt op gelijke mensenrechten en begint bij het waarderen van diversiteit."},{"t":"7","q":"Een leerkracht verlaagt onbewust de verwachtingen voor een leerling met een migratieachtergrond, in de veronderstelling dat deze minder zal presteren. Welke systematische fout op klasniveau illustreert dit?","o":["De leerkracht zet onvoldoende in op sociale cohesie","De leerkracht past de verwachtingen aan op basis van mythes over de leerling","De leerkracht gaat uit van deficit denken","De leerkracht hanteert een witte invulling van ouderbetrokkenheid"],"a":1,"u":"De systematische fout op klasniveau is dat de leerkracht de verwachtingen aanpast aan de persoon die hij of zij voor zich heeft, op basis van mythes. Bij blinde verbetering bleken de resultaten nochtans dezelfde."},{"t":"7","q":"Wat houdt de systematische fout van deficit denken op individueel niveau in?","o":["Men legt de nadruk op ambachtelijk onderwijs omdat leerlingen moeten afzien","Men gaat ervan uit dat de leeromgeving te weinig krachtig is in plaats van naar het kind te kijken","Men betrekt de ouders niet bij de ontwikkeling van het kind","Men veronderstelt dat het kind iets tekortkomt in plaats van dat er een tekort is aan een krachtige leeromgeving"],"a":3,"u":"Deficit denken betekent dat men veronderstelt dat het kind iets tekortkomt, terwijl het probleem eigenlijk een tekort aan een krachtige leeromgeving is."},{"t":"7","q":"Attitudes worden in de brontekst beschreven als een multidimensioneel concept. Welke drie componenten worden onderscheiden?","o":["Een mentale, een fysieke en een emotionele component","Een affectieve, een gedrags- en een cognitieve component","Een sociale, een culturele en een economische component","Een affectieve, een materiële en een technische component"],"a":1,"u":"Attitudes bestaan uit een affectieve component gebaseerd op gevoelens, een gedragscomponent gebaseerd op feitelijk of vooringenomen gedrag, en een cognitieve component gebaseerd op overtuigingen of kennis."},{"t":"7","q":"Wat blijkt volgens de brontekst het effect te zijn van meer blootstelling aan personen met een handicap in combinatie met erover rapporteren?","o":["De lesvoorbereidingen gaan minder lang duren","De afstand tot deze personen verkleint na verloop van tijd","De sociale cohesie in de klas neemt af","De attitudes worden vooral negatiever beïnvloed"],"a":1,"u":"Onderzoek toont dat hoe meer men zich blootstelt aan personen met een handicap en hierover rapporteert, hoe meer de afstand in de loop van de tijd verkleint."},{"t":"7","q":"Op schoolniveau wordt in de brontekst een factor genoemd die een hoge voorspeller is van schoolsucces. Welke factor is dit?","o":["Het aantal betrokken medeleerlingen","De ICT-infrastructuur van de school","De leeftijd van de leerkracht","De grootte van de klasgroep"],"a":1,"u":"Volgens de tekst is de ICT-infrastructuur een hoge voorspeller van schoolsucces, waardoor scholen ook moeten inzetten op online alternatieven om alle leerlingen te betrekken."},{"t":"8","q":"Welke omschrijving past het best bij rekenen zoals dat in dit hoofdstuk wordt gedefinieerd?","o":["Het correct kunnen aflezen van een klok en het inschatten van tijdsduur","Het bewerken van de tastbare wereld (of een abstractie ervan) door te ordenen of herordenen, uitgedrukt in hoeveelheden en symbolen volgens logische regels","Het herkennen van geschreven getalsymbolen zonder betekenis toe te kennen","Het snel uit het hoofd oproepen van eerder geleerde rekenfeiten zonder tussenstappen"],"a":1,"u":"Rekenen wordt beschreven als een proces waarin we de wereld ordenen of herordenen, een bewerking die uitgedrukt wordt in hoeveelheden en symbolen op basis van logische regels en wetmatigheden."},{"t":"8","q":"Wat klopt over de prevalentie en risicofactoren van dyscalculie volgens de brontekst?","o":["De prevalentie ligt tussen 2 en 8 procent en een ouder met dyscalculie verhoogt het risico bij het kind vijf- tot tienvoudig","Dyscalculie komt duidelijk vaker voor bij jongens dan bij meisjes","Dyscalculie treft ongeveer 15 procent van de bevolking en heeft geen erfelijke component","De comorbiditeit met ADHD ligt tussen 60 en 80 procent"],"a":0,"u":"De prevalentie ligt tussen 2 en 8 procent, komt ongeveer even vaak voor bij mannen en vrouwen, en het risico is vijf tot tien keer hoger wanneer een ouder de stoornis heeft. De comorbiditeit met ADHD is 20 tot 40 procent."},{"t":"8","q":"Op welke manier verschilt dyscalculie volgens het hoofdstuk van dyslexie?","o":["Dyscalculie kent geen enkele overlap met dyslexie","Bij dyscalculie geldt het hardnekkigheidscriterium niet","Naar dyscalculie is meer onderzoek verricht dan naar dyslexie","Naar dyscalculie is minder onderzoek gedaan en er bestaat meer maatschappelijk begrip voor wiskundeangst dan voor leesangst"],"a":3,"u":"In vergelijking met dyslexie is er minder onderzoek naar dyscalculie, en de subjectieve beleving verschilt: voor math anxiety bestaat meer begrip dan voor read anxiety."},{"t":"8","q":"Een leerkracht wil niet alleen weten of een som fout is, maar ook waar het misloopt en welk niveau van hulp de leerling nodig heeft. Welke aanpak past hierbij?","o":["Een GWAS die genvariaties in kaart brengt","Een eenmalige productmeting die enkel het aantal foute antwoorden telt","Subitizing trainen tot de leerling hoeveelheden vlot herkent","Rekenprocesonderzoek, waarbij het proces belangrijker is dan het product"],"a":3,"u":"Bij rekenprocesonderzoek staat het proces centraal boven de uitkomst: men onderzoekt waar het fout loopt om zo de instructienood en het niveau van de leerling te bepalen."},{"t":"8","q":"Wat is het verschil tussen een redactieopgave en een contextopgave?","o":["Bij een redactieopgave maak je de opgave zonder meer, bij een contextopgave zijn extra logische redeneringen nodig","Een redactieopgave test subitizing, een contextopgave test transcoderen","Een redactieopgave berust op geheugen, een contextopgave op tussenstappen","Een redactieopgave gaat over kommagetallen, een contextopgave over natuurlijke getallen"],"a":0,"u":"Bij een redactieopgave los je de opgave zonder meer op, terwijl een contextopgave ook extra logische redeneringen vraagt, bijvoorbeeld continue getallen afronden naar natuurlijke."},{"t":"8","q":"Wat wordt bedoeld met subitizing als kenmerkende moeilijkheid bij dyscalculie?","o":["Het herkennen van een hoeveelheid zonder te tellen, zoals in één oogopslag zien wie de hoogste worp gooide","Het foutief overslaan van stappen in een rekenprocedure","Het ruimtelijk kunnen ordenen van een getal op een getallenlijn","Het omzetten van getallen van decimaal naar binair"],"a":0,"u":"Subitizing is het herkennen van hoeveelheden zonder te tellen, bijvoorbeeld bij yatzee meteen zien dat jij meer hebt gegooid. Het valt onder het verwerken van non-symbolische hoeveelheden."},{"t":"8","q":"Welke koppeling tussen een fenotype van dyscalculie en het bijhorende hersengebied klopt volgens het hersenonderzoek?","o":["Procedurele dyscalculie hangt samen met hypoactivatie van de angular gyrus","Visuospatiële dyscalculie hangt samen met hyperactivatie van de frontale cortex","Semantische geheugendyscalculie hangt samen met hypoactivatie van de angular gyrus","Getallenkennisdyscalculie hangt samen met hypoactivatie van de intrapariëtale sulcus"],"a":2,"u":"In het hersenonderzoek werden twee klinische clusters gevonden: semantische geheugendyscalculie gaat samen met hypoactivatie van de angular gyrus, en procedurele dyscalculie met hypoactivatie van de intrapariëtale sulcus."},{"t":"9","q":"Wat wordt in dit hoofdstuk verstaan onder metacognitieve vaardigheden?","o":["Het automatisch ophalen van feitenkennis uit het langetermijngeheugen","Het nadenken over je eigen denken, bijvoorbeeld weten of je fout zit en waar hiaten in je kennis zitten","Het vermogen om nieuwe hersencellen aan te maken tijdens het studeren","Het aanleren van motorische vaardigheden door herhaalde oefening"],"a":1,"u":"Metacognitie wordt omschreven als denken over je eigen denken. Voorbeelden zijn error monitoring (weten of je fout zit en hoe zeker je bent) en beseffen waar de hiaten in je kennis zitten."},{"t":"9","q":"Wat is het verschil tussen declaratieve en procedurele metacognitieve kennis?","o":["Declaratieve kennis betreft enkel taal, procedurele kennis enkel wiskunde","Er is geen inhoudelijk verschil; het zijn synoniemen voor hetzelfde begrip","Declaratieve kennis draait om hogere orde processen en zelfreflectie, procedurele kennis om feitenkennis","Declaratieve kennis is kennis over cognitie en leren, procedurele kennis betreft hogere orde processen zoals monitoren en zelfregulatie"],"a":3,"u":"Declaratieve metacognitieve kennis is kennis over cognitie en leren, zoals hoe je taken vervult en plannen maakt. Procedurele metacognitieve kennis omvat hogere orde processen en zelfreflectie, zoals monitoren en jezelf onder controle houden."},{"t":"9","q":"Een leerling schat tijdens het studeren in hoe lang zij nog moet leren en denkt: 'ik ga hier veel tijd voor moeten nemen'. Welk procedureel metacognitief proces past hierbij het best?","o":["Retention, het inschatten of ze zal slagen","Error monitoring, het nagaan of een gegeven antwoord fout is","Acquisition, het inschatten van hoeveel tijd en verwerking het leren nog vraagt","Retrieval, het beslissen om te stoppen met studeren"],"a":2,"u":"Acquisition (aan het leren of verwerken) gaat over inschattingen als hoe lang je nog moet studeren, bijvoorbeeld 'ik ga veel tijd moeten nemen'. Retrieval slaat juist op het moment waarop je stopt en een antwoord geeft."},{"t":"9","q":"Welke uitspraak over de ontwikkeling van metacognitie sluit aan bij de brontekst?","o":["Alle aspecten van metacognitie ontwikkelen volgens exact hetzelfde tijdspad","Metacognitie verdwijnt na de lagere school en speelt geen rol meer bij volwassenen","Metacognitie ontstaat pas in de adolescentie en ontbreekt bij jonge kinderen","Metacognitie is al vroeg aanwezig en wordt vanaf ongeveer 5 a 7 jaar robuust, met een graduele shift van domeinspecifiek naar algemener"],"a":3,"u":"Metacognitie is al vroeg aanwezig en vanaf ongeveer 5 a 7 jaar zijn er robuuste vaardigheden. Er is een graduele shift van domeinspecifiek naar een algemener proces, en verschillende aspecten kennen verschillende ontwikkelingspaden."},{"t":"9","q":"Waarom is het meten van metacognitie bij jonge kinderen een uitdaging, en hoe wordt daar volgens de brontekst mee omgegaan?","o":["De meting is eenvoudig omdat kinderen hun prestaties altijd correct inschatten","Jonge kinderen hebben geen metacognitie, dus meten is onmogelijk","Meten is complex omdat niveau, bron en timing verschillen; bij jonge kinderen gebruikt men daarom smileys, gezichten en barometers in plaats van schalen","Men gebruikt bij jonge kinderen enkel uitgebreide schriftelijke vragenlijsten"],"a":2,"u":"Goede meting van metacognitie is lastig door verschillen in niveau (globaal versus itemspecifiek), bron (observatie versus self reports) en timing (offline versus online). Bij jonge kinderen werkt
