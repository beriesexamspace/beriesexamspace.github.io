<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js; connect-src 'self' https://*.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Aanvraag beoordelen</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/auth.css">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: auto; min-height: 100%; overflow: auto; }
    /* Zelfde tokens als de mindmap (css/app.css): kleuren, lettertype, beweging. */
    body { margin: 0; min-height: 100vh; background: var(--bm-bg); color: var(--bm-text);
      font-family: var(--bm-font); padding: 0 16px 8px; }
    .kaart { max-width: 440px; margin: 12vh auto 0; padding: 28px 24px; background: var(--bm-panel-strong);
      border: 1px solid var(--bm-line-strong); border-radius: 18px; box-shadow: var(--bm-shadow);
      animation: in 320ms var(--bm-ease) both; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .logo { display: flex; align-items: center; gap: 10px; margin: 0 0 18px; font-size: 14px; font-weight: 600; }
    .logo::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: #fff;
      box-shadow: 0 0 0 4px rgba(255,255,255,.08), 0 0 18px rgba(255,255,255,.35); }
    h1 { margin: 0 0 12px; font-size: 20px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.3; word-break: break-word; }
    .kaart p { margin: 0 0 10px; color: var(--bm-text-dim); font-size: 14px; line-height: 1.55; }
    .kaart p strong { color: var(--bm-text); }
    .knop { display: block; width: 100%; min-height: 44px; margin-top: 16px; padding: 12px 18px;
      border: 1px solid transparent; border-radius: 11px; font: inherit; font-size: 14px; font-weight: 600;
      cursor: pointer; color: #fff; background: var(--bm-accent);
      box-shadow: 0 10px 22px -12px rgba(var(--bm-accent-rgb), 1);
      -webkit-tap-highlight-color: transparent;
      transition: background-color 160ms var(--bm-ease), transform 150ms var(--bm-ease),
        box-shadow 200ms var(--bm-ease), opacity 160ms var(--bm-ease); }
    .knop:hover { background: var(--bm-accent-hover); transform: translateY(-1px); }
    .knop:active { transform: scale(.98); }
    .knop:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--bm-panel-strong), 0 0 0 4px var(--bm-accent); }
    .knop.nee { background: rgba(255, 255, 255, 0.05); border-color: var(--bm-line-strong); color: var(--bm-text); box-shadow: none; }
    .knop.nee:hover { background: rgba(255, 255, 255, 0.09); }
    .knop[disabled] { opacity: .6; cursor: default; transform: none; }
    [hidden] { display: none !important; }
    @media (prefers-reduced-motion: reduce) { .kaart, .knop { animation: none; transition: none; } }
  </style>
  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
  <script src="js/beslis.js" defer></script>
</head>
<body>
  <main class="kaart">
    <div class="logo">Berie's mindmap</div>
    <h1 id="titel">Even laden...</h1>
    <p id="uitleg"></p>
    <button id="knop" class="knop" type="button" hidden></button>
  </main>

  <section class="bm-beheer" id="beheer" aria-labelledby="beheer-kop">
    <div class="bm-beheer__kaart">
      <h2 class="bm-beheer__kop" id="beheer-kop">Beheer</h2>
      <p class="bm-beheer__status" id="beheer-status">Even laden...</p>
      <a class="bm-beheer__link" id="beheer-inloggen" href="index.html" hidden>Naar de mindmap om in te loggen</a>

      <div class="bm-beheer__werk" id="beheer-werk" hidden>
        <div class="bm-beheer__blok">
          <h3 class="bm-beheer__blok-kop">Berie kent jou</h3>
          <div class="bm-veld">
            <label class="bm-veld__label" for="bekend-mail">Mailadres van de persoon</label>
            <input class="bm-veld__invoer" id="bekend-mail" type="email" autocomplete="off" spellcheck="false" inputmode="email" placeholder="naam@voorbeeld.nl">
          </div>
          <div class="bm-beheer__rij">
            <span class="bm-beheer__rij-tekst" id="bekend-tekst">Berie kent deze persoon</span>
            <button class="bm-schakel" id="bekend-schakel" type="button" role="switch" aria-checked="false" aria-labelledby="bekend-tekst" disabled></button>
          </div>
          <p class="bm-beheer__info">De stand van deze persoon zie je hier niet. Zet de schakelaar aan of uit om op te slaan.</p>
        </div>

        <div class="bm-beheer__blok">
          <h3 class="bm-beheer__blok-kop">Scholen</h3>
          <div class="bm-veld">
            <label class="bm-veld__label" for="school-zoek">Zoek op naam of gemeente</label>
            <input class="bm-veld__invoer" id="school-zoek" type="search" autocomplete="off" spellcheck="false" placeholder="Bijvoorbeeld Mosa">
          </div>
          <p class="bm-beheer__info" id="school-info">Typ minstens 2 tekens.</p>
          <ul class="bm-beheer__lijst" id="school-lijst"></ul>
        </div>

        <p class="bm-beheer__melding" id="beheer-melding" role="status" aria-live="polite"></p>
      </div>
    </div>
  </section>
</body>
</html>
