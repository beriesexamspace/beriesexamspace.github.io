<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />

<style>
  :root{
    --bg:#f4f2ee; --bg2:#ebe8e2; --card:#ffffff; --ink:#1b232c; --muted:#5d6873;
    --line:#e2ddd4; --accent:#0f6e6a; --accent-ink:#0b4f4c; --accent-soft:#dcefed;
    --amber:#c9821f; --amber-soft:#f7ecd9; --violet:#6d5bd0; --violet-soft:#e9e6fa;
    --good:#1f8a4c; --good-soft:#e2f3e8; --bad:#c23b54; --bad-soft:#fbe5ea;
    --shadow:0 1px 2px rgba(20,30,40,.05),0 6px 18px rgba(20,30,40,.05);
    --shadow-lg:0 2px 6px rgba(20,30,40,.06),0 18px 40px rgba(20,30,40,.10);
    --r:14px; --r-lg:20px; --ease:cubic-bezier(.2,.8,.2,1);
  }
  html[data-theme="dark"]{
    --bg:#11151a; --bg2:#161b22; --card:#1b222b; --ink:#e7ecf1; --muted:#9aa6b2;
    --line:#2a323c; --accent:#3fb9b2; --accent-ink:#7fd6d0; --accent-soft:#163230;
    --amber:#e0a64a; --amber-soft:#2e2515; --violet:#a99cf0; --violet-soft:#221d3a;
    --good:#46c178; --good-soft:#16301f; --bad:#ef6b82; --bad-soft:#331620;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 2px 8px rgba(0,0,0,.4),0 22px 48px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;letter-spacing:-.01em}
  button,a{font-family:inherit;cursor:pointer;color:inherit}
  .wrap{max-width:880px;margin:0 auto;padding:0 18px 96px}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
  .ic{width:1.25em;height:1.25em;flex:none;vertical-align:-.18em;stroke:currentColor;stroke-width:1.75;
    stroke-linecap:round;stroke-linejoin:round;fill:none}

  header.top{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(160%) blur(16px);-webkit-backdrop-filter:saturate(160%) blur(16px);box-shadow:inset 0 -1px 0 0 rgba(0,0,0,.04)}
  .topin{max-width:880px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:700}
  .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,var(--accent),var(--accent-ink));
    color:#fff;display:grid;place-items:center;font-family:Georgia,serif;font-weight:700;font-size:16px;flex:none;
    box-shadow:0 2px 6px rgba(15,110,106,.35)}
  .brand small{display:block;font-weight:500;color:var(--muted);font-size:11px}
  .spacer{flex:1}
  .iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:38px;
    padding:7px 11px;font-size:13.5px;display:inline-flex;gap:7px;align-items:center;text-decoration:none;
    transition:border-color .2s var(--ease),transform .12s var(--ease)}
  .iconbtn:hover{border-color:var(--accent)} .iconbtn:active{transform:scale(.96)}
  nav.tabs{display:flex;gap:2px;overflow:auto;max-width:880px;margin:0 auto;padding:6px 12px 0;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{border:none;background:none;color:var(--muted);padding:10px 13px;border-radius:9px 9px 0 0;
    font-size:14px;font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px;transition:color .2s var(--ease)}
  nav.tabs button .ic{width:16px;height:16px}
  nav.tabs button.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
  nav.tabs button:hover{color:var(--ink)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:20px}
  .muted{color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
  .pill.amber{background:var(--amber-soft);color:var(--amber)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;gap:14px}
  @media(min-width:620px){.g2{grid-template-columns:1fr 1fr}}

  .hero{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin:20px 0 8px}
  .count{flex:none;background:linear-gradient(150deg,var(--accent),var(--accent-ink));color:#fff;border-radius:var(--r);padding:14px 20px;text-align:center;min-width:118px;box-shadow:0 8px 20px rgba(15,110,106,.28)}
  .count b{font-family:Georgia,serif;font-size:32px;display:block;line-height:1}
  .count span{font-size:12px;opacity:.92}
  .herotext h1{margin:0 0 4px;font-size:25px}
  .herotext p{margin:0;color:var(--muted)}

  .brandstrip{display:flex;align-items:center;gap:13px;width:100%;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 16px;margin:14px 0 2px;box-shadow:var(--shadow);transition:border-color .2s var(--ease),transform .15s var(--ease)}
  .brandstrip:hover{border-color:var(--accent);transform:translateY(-1px)}
  .brandstrip .bs-logo{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:17px;background:linear-gradient(145deg,var(--accent),var(--accent-ink))}
  .brandstrip .bs-txt{flex:1;min-width:0} .brandstrip .bs-txt b{display:block;font-size:14.5px} .brandstrip .bs-txt small{color:var(--muted);font-size:12.5px}
  .brandstrip .bs-go{color:var(--accent-ink);flex:none;display:inline-flex} .brandstrip .bs-go .ic{width:18px;height:18px}

  .seclabel{display:flex;align-items:center;gap:8px;margin:24px 0 12px;font-weight:700;font-size:15px}
  .seclabel .ic{width:18px;height:18px;color:var(--accent-ink)}
  .backlink{display:inline-flex;align-items:center;gap:5px;border:none;background:none;color:var(--muted);font-size:13.5px;font-weight:600;padding:6px 0;margin-bottom:4px;transition:color .2s var(--ease)}
  .backlink:hover{color:var(--accent-ink)} .backlink .ic{width:16px;height:16px}
  .tracks{display:grid;gap:14px} @media(min-width:600px){.tracks{grid-template-columns:1fr 1fr}}
  .track{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);transition:transform .22s var(--ease),border-color .22s var(--ease),box-shadow .22s var(--ease)}
  .track:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow-lg)} .track:active{transform:translateY(-1px) scale(.995)}
  .track .tile{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;margin-bottom:4px;background:linear-gradient(150deg,var(--accent),var(--accent-ink))}
  .track.alt .tile{background:linear-gradient(150deg,var(--violet),#4f40a8)} .track .tile .ic{width:24px;height:24px}
  .track b{font-size:18px} .track small{color:var(--muted);font-size:13.5px;line-height:1.5}
  .track .go{margin-top:6px;display:inline-flex;align-items:center;gap:6px;color:var(--accent-ink);font-weight:600;font-size:13.5px} .track.alt .go{color:var(--violet)} .track .go .ic{width:16px;height:16px}
  .toggle{width:48px;height:28px;border-radius:999px;border:none;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s var(--ease)}
  .toggle .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s var(--ease)}
  .toggle.on{background:var(--violet)} .toggle.on .knob{left:23px}
  .warmcard{border-color:var(--violet)!important;background:var(--violet-soft)} .warmcard .ic{width:22px;height:22px;color:var(--violet);flex:none}
  .modebanner{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:11px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent-ink);font-size:13.5px;font-weight:600}
  .modebanner.v{background:var(--violet-soft);color:var(--violet)} .modebanner .ic{width:18px;height:18px} .modebanner a,.modebanner .bnlink{margin-left:auto;font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;color:inherit;border:none;background:none;font-family:inherit;padding:0}
  html.snappy .card,html.snappy .mode,html.snappy .tip,html.snappy .track{animation-duration:.12s!important}
  .mode{display:flex;flex-direction:column;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:17px;gap:7px;box-shadow:var(--shadow);transition:transform .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease)}
  .mode:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .mode .me{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)} .mode .me .ic{width:22px;height:22px}
  .mode b{font-size:16px} .mode small{color:var(--muted);font-size:13px}

  label.fld{display:block;font-size:13px;font-weight:600;margin:16px 0 7px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;min-height:38px;padding:7px 13px;font-size:13.5px;transition:all .18s var(--ease)}
  .chip:hover{border-color:var(--accent)} .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:11px;min-height:46px;padding:12px 20px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;box-shadow:0 4px 12px rgba(15,110,106,.25);transition:background .2s var(--ease),transform .12s var(--ease)}
  .btn:hover{background:var(--accent-ink)} .btn:active{transform:scale(.97) translateY(1px)} .btn .ic{width:18px;height:18px}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none} .btn.ghost:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  input[type=search],input[type=text],input[type=email],textarea{font-family:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
  input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .runtop{display:flex;align-items:center;gap:12px;margin:2px 0 14px;font-size:13px;color:var(--muted)}
  .bar{height:8px;border-radius:6px;background:var(--bg2);overflow:hidden;flex:1}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .7s var(--ease)}
  .qtext{font-size:19px;font-weight:600;margin:8px 0 16px;font-family:Georgia,serif;line-height:1.45}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px 15px;margin-bottom:10px;font-size:15px;transition:border-color .15s var(--ease),background .15s var(--ease),transform .12s var(--ease)}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)} .opt:active:not(:disabled){transform:scale(.99)}
  .opt .k{flex:none;width:27px;height:27px;border-radius:8px;background:var(--bg2);color:var(--muted);display:grid;place-items:center;font-weight:700;font-size:13px}
  .opt.correct{border-color:var(--good);background:var(--good-soft)} .opt.correct .k{background:var(--good);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default}
  .feedback{border-radius:12px;padding:13px 15px;margin:4px 0 12px;font-size:14.5px}
  .feedback.ok{background:var(--good-soft);color:var(--good)} .feedback.no{background:var(--bad-soft);color:var(--bad)}
  .feedback b{font-weight:700} .feedback .sub{display:block;margin-top:3px;color:var(--ink);font-weight:500;opacity:.92}
  .whybtn{border:1px solid var(--line);background:var(--card);color:var(--accent-ink);border-radius:10px;min-height:40px;padding:9px 14px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:border-color .2s var(--ease),background .2s var(--ease)}
  .whybtn:hover{border-color:var(--accent);background:var(--accent-soft)} .whybtn .ic{width:16px;height:16px}
  .whybox{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:14px 16px;margin:12px 0 4px;font-size:14px;line-height:1.55}
  .whybox h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent-ink);font-family:system-ui;display:flex;align-items:center;gap:7px}
  .whybox .ic{width:16px;height:16px}

  .acc{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
  .acc>summary{padding:15px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:11px}
  .acc>summary::-webkit-details-marker{display:none}
  .acc>summary .n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
  .acc>summary .caret{margin-left:auto;color:var(--muted);transition:transform .25s var(--ease)} .acc[open]>summary .caret{transform:rotate(90deg)}
  .acc[open]>summary{border-bottom:1px solid var(--line)} .acc .body{padding:6px 18px 16px}
  .acc h4{margin:14px 0 6px;font-size:13px;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.4px;font-family:system-ui}
  .acc ul{margin:0;padding-left:20px} .acc li{margin:6px 0;font-size:14.5px;line-height:1.5}
  .acc.hack li::marker{content:"💡  "} .acc.hack>summary .n{background:var(--violet-soft);color:var(--violet)}
  mark{background:var(--amber-soft);color:inherit;padding:0 2px;border-radius:3px}

  .tip{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}
  .tip h4{margin:0 0 5px;font-size:14.5px;display:flex;align-items:center;gap:8px;font-family:system-ui} .tip h4 .ic{width:18px;height:18px;color:var(--violet)}
  .tip p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}
  .tipgrid{display:grid;gap:12px} @media(min-width:620px){.tipgrid{grid-template-columns:1fr 1fr}}

  .results .big{font-family:Georgia,serif;font-size:54px;text-align:center;margin:8px 0;line-height:1}
  .center{text-align:center} .hide{display:none!important}
  footer{margin-top:34px;text-align:center;color:var(--muted);font-size:13px}
  .kbd{font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--muted)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.03)}100%{transform:scale(1)}}
  @keyframes optIn{from{opacity:0;transform:translateX(-9px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: no-preference){
    .card,.mode,.tip{animation:fadeUp .34s var(--ease) both}
    .acc{animation:fadeUp .32s var(--ease) both}
    .opt{animation:optIn .3s var(--ease) backwards;animation-delay:var(--oi,0s)}
    .chip.on{animation:pop .22s var(--ease)}
    .feedback{animation:slideIn .26s var(--ease) both} .whybox{animation:slideIn .28s var(--ease) .07s both} .opt.correct{animation:pop .34s var(--ease)}
  }
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  /* ---- Premium launch (Gemini-stijl) + header-logo gloed ---- */
  @property --bes-a{syntax:'<angle>';initial-value:0deg;inherits:false}
  #splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(125% 125% at 50% 38%,var(--bg2) 0%,var(--bg) 68%);transition:opacity .6s var(--ease),transform .7s var(--ease)}
  #splash.hide{opacity:0;transform:scale(1.07);pointer-events:none}
  .sp-inner{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
  .sp-mark{position:relative;width:100px;height:100px;display:grid;place-items:center}
  .sp-mark::before{content:"";position:absolute;inset:-16px;border-radius:34px;z-index:0;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));filter:blur(17px);opacity:.75}
  .sp-mark::after{content:"";position:absolute;inset:-3px;border-radius:27px;z-index:1;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));padding:3px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .sp-logo{position:relative;z-index:2;width:92px;height:92px;border-radius:24px;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:46px;background:linear-gradient(150deg,var(--accent),var(--accent-ink));box-shadow:0 14px 38px rgba(15,110,106,.4)}
  .sp-spark{position:absolute;z-index:3;top:-7px;right:-7px;width:30px;height:30px;color:#fff;filter:drop-shadow(0 2px 7px rgba(0,0,0,.35))}
  .sp-name{position:relative;font-family:Georgia,serif;font-size:26px;font-weight:700;letter-spacing:-.01em;color:var(--ink);overflow:hidden}
  .sp-name::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(-130%)}
  .sp-tag{font-size:13px;color:var(--muted);margin-top:-8px;letter-spacing:.03em}
  @media (prefers-reduced-motion: no-preference){
    .sp-mark::before{animation:bes-spin 3s linear infinite,bes-breathe 2.4s var(--ease) infinite}
    .sp-mark::after{animation:bes-spin 3s linear infinite}
    .sp-logo{animation:bes-pop .7s var(--ease) both}
    .sp-spark{animation:bes-pop .6s var(--ease) .12s both,bes-twinkle 1.9s var(--ease) .9s infinite}
    .sp-name{animation:bes-rise .6s var(--ease) .14s both}
    .sp-name::after{animation:bes-shimmer 1.5s var(--ease) .5s 1}
    .sp-tag{animation:bes-rise .6s var(--ease) .26s both}
  }
  @keyframes bes-spin{to{--bes-a:360deg}}
  @keyframes bes-breathe{0%,100%{opacity:.55;filter:blur(16px)}50%{opacity:.95;filter:blur(22px)}}
  @keyframes bes-shimmer{to{transform:translateX(130%)}}
  @keyframes bes-twinkle{0%,100%{opacity:1;transform:scale(1) rotate(0deg)}50%{opacity:.65;transform:scale(.82) rotate(18deg)}}
  @keyframes bes-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  /* mobiel: header-knoppen alleen iconen zodat niks zijwaarts overflowt */
  @media(max-width:440px){ header.top .iconbtn span{display:none} header.top .iconbtn{padding:7px 9px;min-width:38px;justify-content:center} .topin{gap:8px} }
</style>
</head>
<body>
<div id="splash"><div class="sp-inner">
  <div class="sp-mark">
    <div class="sp-logo">Gz</div>
    <svg class="sp-spark" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.5c.4 4.6 2.4 6.6 7 7-4.6.4-6.6 2.4-7 7-.4-4.6-2.4-6.6-7-7 4.6-.4 6.6-2.4 7-7Z"/></svg>
  </div>
  <div><div class="sp-name">Gezondheidspsychologie</div><div class="sp-tag">slim oefenen voor je examen</div></div>
</div></div>
<header class="top">
  <div class="topin">

<script>
window.GZ = {"questions":[{"t":"1","q":"Wat is het belangrijkste kenmerk van het biomedische model van gezondheid?","o":["Het houdt rekening met geestelijk welbevinden naast lichamelijke klachten","Het gaat verder dan een eenvoudige oorzaak-gevolgrelatie tussen A en B","Het reduceert geest, lichaam en gedrag tot fysische problemen en baseert zich op waarneembare zaken","Het besteedt vooral aandacht aan sociaaleconomische en culturele invloeden"],"a":2,"u":"Het biomedische model, gehanteerd door artsen, baseert zich op waarneembare zaken en een causale relatie A naar B, en reduceert geest, lichaam en gedrag tot fysische problemen (reductionisme)."},{"t":"1","q":"Wat onderscheidt het bio-psychosociaal model van het biomedische model?","o":["Het negeert individuele, unieke reacties van patiënten","Het baseert zich ook op niet-waarneembare zaken en geeft meer aandacht aan geestelijk welbevinden","Het wordt uitsluitend door artsen toegepast","Het beperkt zich strikt tot een causale relatie A naar B"],"a":1,"u":"Het bio-psychosociaal model, gebruikt door psychologen, baseert zich ook op niet-waarneembare zaken, gaat verder dan A naar B en geeft meer aandacht aan geestelijk welbevinden."},{"t":"1","q":"Volgens de WHO-definitie is gezondheid een toestand van volledig lichamelijk, geestelijk en sociaal welzijn. Welke kritiek wordt in de les op deze definitie gegeven?","o":["Ze richt zich uitsluitend op lichamelijke fitheid","Ze houdt geen rekening met sociaaleconomische en culturele invloeden op gezondheid en ziekte","Ze is enkel toepasbaar op zieke mensen","Ze definieert gezondheid enkel als de afwezigheid van ziekte"],"a":1,"u":"De WHO-definitie baseert zich niet op sociaaleconomische en culturele invloeden op gezondheid, ziekte en de beslissingen daarover, wat als tekortkoming wordt genoemd."},{"t":"1","q":"Volgens Krause en Jay is de interpretatie van gezondheid leeftijdsafhankelijk. Waarnaar kijken jongeren volgens hen vooral?","o":["Naar homeostase en een toestand van evenwicht","Naar gezondheidsproblemen die met ouder worden gepaard gaan","Naar de aan- of afwezigheid van symptomen binnen hun referentiekader","Naar gezondheidsgedrag, oftewel wat ze wel of niet kunnen doen"],"a":3,"u":"Volgens Krause en Jay kijken jongeren naar gezondheidsgedrag (wat kan ik wel of niet), terwijl ouderen vooral naar de aan- of afwezigheid van symptomen kijken."},{"t":"1","q":"Welke culturele benadering van gezondheid koppelt ziekte aan het niet langer ten goede kunnen komen van de groep?","o":["De ziekte-attributiebenadering","De individualistische benadering","De holistische benadering","De collectivistische benadering"],"a":3,"u":"In de collectivistische benadering betekent ziek zijn dat men de groep niet meer ten goede kan komen, terwijl de individualistische benadering ziekte koppelt aan het eigen welbevinden."},{"t":"1","q":"Volgens Bibace en Walsh leggen kinderen van 8 tot 11 jaar concretere oorzaak-gevolgverbanden. Welk concept hoort bij deze leeftijdsfase?","o":["Magische verklaringen op basis van pure associatie","Besmetting, waarbij een concretere oorzaak-gevolgrelatie wordt gelegd","Onbegrip, waarbij absurde verbanden worden gelegd","Fenomenalisme, waarbij geen duidelijke oorzaak wordt aangewezen"],"a":1,"u":"Bij Bibace en Walsh hoort in de fase van 8 tot 11 jaar besmetting, waarbij kinderen concretere oorzaak-gevolgverbanden kunnen leggen, en internalisatie met basiskennis over organen."},{"t":"1","q":"Wat wordt in de les verstaan onder nudging in de context van gezond gedrag?","o":["De situatie zodanig wijzigen dat mensen gezonder gedrag gaan stellen","Het verschuiven van ziekte-inzicht doorheen de levensfases","Het cultuurafhankelijk toeschrijven van de oorzaak van een ziekte","Het reduceren van gedrag tot louter fysische problemen"],"a":0,"u":"Nudging betekent de situatie zodanig wijzigen dat mensen gezonder gedrag gaan stellen, bijvoorbeeld door reminders te plaatsen."},{"t":"1","q":"Het sociale causaliteitsmodel en het sociale driftmodel verklaren beide het verband tussen SES en gezondheid. Wat stelt het sociale causaliteitsmodel?","o":["Een lage SES leidt tot gezondheidsproblemen","Gezondheidsproblemen leiden tot een lage SES","Enkel biologische verschillen bepalen de gezondheid","SES en gezondheid staan volledig los van elkaar"],"a":0,"u":"Het sociale causaliteitsmodel stelt dat een lage SES leidt tot gezondheidsproblemen en wordt door wetenschappelijk onderzoek ondersteund; het driftmodel keert die richting om."},{"t":"1","q":"Wat toonde de Whitehall-studie aan over maatschappelijke ongelijkheid en gezondheid?","o":["Biologische verschillen verklaren volledig het verschil in sterfte","Er is geen verband tussen inkomen en levensduur bij ambtenaren","Hoger betaalde ambtenaren sterven eerder door meer werkstress","Lager betaalde ambtenaren sterven eerder, wat wijst op de rol van een lagere SES en psychosociale factoren"],"a":3,"u":"De Whitehall-studie toonde aan dat lager betaalde ambtenaren eerder sterven, waarbij een lagere SES als psychosociale factor een rol speelt."},{"t":"1","q":"Het werkstressmodel van Karasek en Theorell onderscheidt verschillende factoren. Welke factor werd later toegevoegd via het sociale interactiemodel?","o":["De mate van veeleisendheid, oftewel de hoeveelheid werk","De mate van sociale ondersteuning","De mate van autonomie, oftewel de inspraak in het werk","De verstoorde balans tussen inspanning en beloning"],"a":1,"u":"Bij Karasek en Theorell zijn veeleisendheid en autonomie de kernfactoren; later werd via het sociale interactiemodel de mate van sociale ondersteuning toegevoegd als derde as."},{"t":"2","q":"Wat is het onderscheid tussen primaire, secundaire en tertiaire preventie binnen de ziektepreventie?","o":["Primaire preventie viseert bepaalde groepen, secundaire iedereen en tertiaire alleen wie al ziek is","Primaire preventie behandelt bestaande ziekte, secundaire voorkomt terugval en tertiaire neemt oorzaken weg","Primaire preventie deelt beschermingsmateriaal uit, secundaire richt zich op iedereen en tertiaire op risicogroepen","Primaire preventie elimineert oorzaken, secundaire spoort ziekte vroegtijdig op en behandelt, tertiaire voorkomt verdere invalidering"],"a":3,"u":"Volgens de bron elimineert primaire preventie de oorzaken, spoort secundaire preventie ziekte vroegtijdig op en behandelt ze, en voorkomt tertiaire preventie verdere invalidering."},{"t":"2","q":"Een campagne richt borstkankeronderzoek specifiek op vrouwen. Om welke doelgroepbenadering binnen de ziektepreventie gaat het?","o":["Zorg-gerelateerde preventie","Selectieve preventie","Geindiceerde preventie","Universele preventie"],"a":1,"u":"Selectieve preventie viseert bepaalde groepen, zoals vrouwen voor borstkanker. Universele preventie richt zich juist op iedereen."},{"t":"2","q":"Wat houdt het streven naar equity in plaats van equality in bij gezondheidsongelijkheid?","o":["Iedereen exact dezelfde middelen geven ongeacht behoefte","Gezondheidszorg volledig privatiseren","Enkel de rijkste groepen extra ondersteunen","Middelen zo verdelen dat rekening wordt gehouden met verschillen in behoefte en toegang"],"a":3,"u":"De bron benadrukt dat men niet naar equality maar naar equity moet streven, omdat de toegang tot zorg ongelijk is voor onder meer armere mensen en mensen met een migratieachtergrond."},{"t":"2","q":"In het gedragswiel wordt onderscheid gemaakt tussen competenties, drijfveren en context. Wat valt onder competenties?","o":["De sociaal-culturele en economische omgeving buiten het individu","De motivaties en overtuigingen van een persoon","De beloningen die iemand ontvangt voor gezond gedrag","De mogelijkheden om gedrag te stellen, zoals fysiek en psychosociaal in staat zijn"],"a":3,"u":"Competenties zijn in het gedragswiel de mogelijkheden om gedrag te stellen of te veranderen, met een fysieke en psychosociale component. Drijfveren gaan over motivatie en context over factoren buiten het individu."},{"t":"2","q":"Wat is nudging als gedragsveranderingstechniek?","o":["Mensen uitgebreide informatie geven over gezondheidsrisico's","Mensen straffen wanneer ze ongezond gedrag stellen","Mensen een duwtje in de juiste richting geven zonder keuzes te verplichten","Mensen verplichten tot gezond gedrag via wetgeving"],"a":2,"u":"Nudging is volgens de bron een techniek om mensen een duwtje in de juiste richting te geven, waarbij men vooral inwerkt op de context of omgeving."},{"t":"2","q":"Volgens het gedragswiel verloopt gedrag grotendeels op een bepaalde manier. Welke verhouding klopt?","o":["5% reflectief/automatisch en 95% bewust","50% reflectief/automatisch en 50% bewust","95% reflectief/automatisch en 5% bewust","75% reflectief/automatisch en 25% bewust"],"a":2,"u":"De bron stelt dat ongeveer 95% van het gedrag reflectief of automatisch verloopt en slechts 5% bewust, waarbij bewuste controle veel inspanning vraagt van de prefrontale cortex."},{"t":"2","q":"Wat is het verschil tussen vrijwillige motivatie en MOETivatie?","o":["Vrijwillige motivatie komt van buitenaf, MOETivatie komt van jezelf","Vrijwillige motivatie ontstaat omdat gedrag plezierig is en bij je waarden past, MOETivatie omdat het toch moet","Vrijwillige motivatie is altijd zwakker dan MOETivatie","Vrijwillige motivatie geldt alleen voor kinderen, MOETivatie alleen voor volwassenen"],"a":1,"u":"Volgens de bron is gedrag bij vrijwillige motivatie plezierig, zinvol en passend bij eigen waarden en identiteit, terwijl MOETivatie betekent dat men gemotiveerd is omdat het toch moet."},{"t":"2","q":"Wat is een centraal uitgangspunt van motiverende gespreksvoering?","o":["De client confronteren met alle gezondheidsrisico's tot hij overtuigd is","Een op samenwerking gerichte stijl die iemands autonome motivatie versterkt, met reflectief luisteren en het vermijden van discussie","De client overtuigen door discussie en tegenargumenten","Beloningen uitdelen bij elke stap in de goede richting"],"a":1,"u":"Motiverende gespreksvoering is een op samenwerking gerichte gespreksstijl die de autonome motivatie versterkt, waarbij men discussie vermijdt en vooral reflectief luistert en terugkoppelt."},{"t":"2","q":"Volgens het model van mentaal welbevinden komt geestelijke gezondheid tot stand door de wisselwerking tussen twee continua. Wat kenmerkt optimale geestelijke gezondheid?","o":["Enkel de afwezigheid van psychische klachten, ongeacht het welbevinden","De volledige afwezigheid van tegenslag in het leven","Minimale aanwezigheid van symptomen of psychopathologie samen met een hoog mentaal welbevinden","Een hoge aanwezigheid van psychische symptomen gecombineerd met veel welbevinden"],"a":2,"u":"Optimale geestelijke gezondheid is volgens de bron de wisselwerking tussen minimale aanwezigheid van symptomen of psychopathologie en de aanwezigheid van een hoog mentaal welbevinden."},{"t":"2","q":"In geestelijke gezondheidsbevordering wordt gewerkt op een salutogenetische en een pathogenische as. Wat kenmerkt de primaire, salutogenetische aanpak?","o":["Het opsporen van suicidaal gedrag bij jongeren","Het verminderen van de impact van risicofactoren","Het behandelen van bestaande psychopathologie","Het versterken van protectieve factoren en positieve geestelijke gezondheid, zoals veerkrachtversterkende interventies"],"a":3,"u":"De primaire, salutogenetische as richt zich op het versterken van protectieve factoren en positieve geestelijke gezondheid, waar veerkrachtversterkende interventies een plek krijgen. De pathogenische as verlaagt juist de impact van risicofactoren."},{"t":"2","q":"Wat is volgens de bron de kern van het gedragswiel, de gedragsanalyse?","o":["Het meten van de luchtkwaliteit in een gemeente","Het opstellen van beloningssystemen voor gezond gedrag","Het bepalen welk gedrag je in een project wil veranderen, voor welke doelgroep en of dit haalbaar is","Het uitschrijven van de biologische factoren die gezondheid bepalen"],"a":2,"u":"De gedragsanalyse vormt de kern van het grote wiel en gaat na welk gedrag je wil veranderen, voor welke doelgroep en of dat haalbaar is."},{"t":"2","q":"Wat beschrijft het health field concept over de bepalende factoren van gezondheid?","o":["Gezondheid wordt bepaald door leefstijl, omgeving, voorzieningen in de gezondheidszorg en biologische factoren","Gezondheid hangt enkel af van de kwaliteit van de gezondheidszorg","Gezondheid wordt uitsluitend bepaald door de erfelijke aanleg van een persoon","Gezondheid wordt volledig bepaald door de individuele leefstijl"],"a":0,"u":"In het health field concept wordt gezondheid bepaald door leefstijl, omgeving, voorzieningen van de gezondheidszorg en biologische factoren."},{"t":"3","q":"Wat houdt onrealistisch optimisme in het kader van risicoperceptie in?","o":["Het geloof dat een gezondheidsprobleem ons persoonlijk niet zal overkomen","Het volledig ontkennen van elke vorm van risico in de samenleving","Het bewust opzoeken van informatie over mogelijke gevaren","Het systematisch overschatten van gezondheidsrisico's bij anderen"],"a":0,"u":"Onrealistisch optimisme is het geloven dat het ons niet zal overkomen, waarbij mensen denken hun gedrag onder controle te hebben terwijl dat feitelijk niet zo is."},{"t":"3","q":"Welke uitspraak beschrijft het verschil tussen een interne en een externe locus of control (MHLC) correct?","o":["Bij interne locus legt men de verantwoordelijkheid bij zichzelf, bij externe locus bij de omgeving","Interne locus verwijst naar erfelijkheid, externe locus naar aangeleerd gedrag","Beide leggen de verantwoordelijkheid volledig bij gezaghebbende anderen zoals de arts","Bij interne locus geeft men de omgeving de schuld, bij externe locus zichzelf"],"a":0,"u":"Bij een interne locus of control legt men de verantwoordelijkheid bij zichzelf, terwijl men bij een externe locus die bij de omgeving legt, zoals het opvolgen van advies van gezaghebbende anderen."},{"t":"3","q":"Een roker weet dat roken ongezond is maar rookt toch omdat het een goed gevoel geeft. Welk begrip beschrijft deze tegenstrijdigheid?","o":["Neofobie","Selectieve aandacht","Zelfredzaamheid","Cognitieve dissonantie"],"a":3,"u":"Cognitieve dissonantie is de aanwezigheid van tegenstrijdige attitudes, zoals het cognitief weten dat roken ongezond is terwijl men het gedrag toch stelt om zich er goed bij te voelen."},{"t":"3","q":"Welk van de drie basismodellen van de overheid gaat ervan uit dat gedrag verandert doordat een angstwekkende boodschap eerst de attitude verandert?","o":["Het tijdsbom model","Het Goliath model","Het transtheoretisch model","Het lege vaten model"],"a":0,"u":"Het tijdsbom model werkt via angst die tot attitudeverandering en vervolgens gedragsverandering leidt, met als kritiek dat een angstoproepende boodschap eerder afkeer dan gedragsverandering veroorzaakt."},{"t":"3","q":"Wat is een belangrijke beperking van het Health Belief Model?","o":["Het overschat de rol van individuele opvattingen volledig","Het houdt geen rekening met sociale invloeden en is een statisch model","Het besteedt te veel aandacht aan gefaseerde gedragsverandering","Het is uitsluitend bruikbaar om risicovol gedrag te reduceren"],"a":1,"u":"Het Health Belief Model is een statisch model dat geen rekening houdt met sociale invloeden en context of met de mogelijkheid tot veranderen, en enkel preventief gedrag voorspelt."},{"t":"3","q":"Wat is het kernverschil tussen de Theory of Reasoned Action (TRA) en de Theory of Planned Behaviour (TPB)?","o":["De TRA gaat uit van gefaseerde motivatiebereidheid over zes maanden","De TPB veronderstelt dat mensen nooit rationeel handelen","De TPB voegt vermeende gedragscontrole (PBC) toe aan het model","De TRA voegt de vermeende gedragscontrole toe die in de TPB ontbreekt"],"a":2,"u":"De TPB breidt de TRA uit met perceived behavioral control (PBC), het geloof dat het individu controle heeft over bepaalde situaties."},{"t":"3","q":"In welke fase van het transtheoretisch model (TTM) ontkennen mensen het probleem, zijn ze ongemotiveerd en willen ze hun gedrag niet veranderen?","o":["Onderhoudsfase","Preparatiefase","Precontemplatie","Contemplatiefase"],"a":2,"u":"De precontemplatiefase kenmerkt zich door ontkenning, ongemotiveerdheid en de wens het gedrag niet te veranderen, met veel struikelblokken."},{"t":"3","q":"Op welk punt onderscheidt het Precaution Adoption Process Model (PAPM) zich van het TTM?","o":["Het laat de tijdslimiet vallen en geeft meer aandacht aan de precontemplatiefase","Het werkt uitsluitend met een vaste tijdsperiode van zes maanden","Het vervangt alle motivatiefasen door een enkele actiefase","Het houdt als enige model rekening met gedrag uit het verleden"],"a":0,"u":"Het PAPM is een herwerking van het TTM zonder tijdslimiet en met meer aandacht voor mensen in de pre-contemplatiefase."},{"t":"3","q":"Waarom wordt de Health Action Process Approach (HAPA) als een invloedrijk model beschouwd?","o":["Omdat het uitsluitend op de motivatiefase focust en de uitvoering negeert","Omdat het gezondheidsactie opsplitst in een pre-intentionele en een post-intentionele volitiefase","Omdat het geen enkele rol toekent aan zelfredzaamheid","Omdat het angst als enige drijfveer voor gedragsverandering gebruikt"],"a":1,"u":"De HAPA is invloedrijk omdat gezondheidsactie er ten minste bestaat uit een pre-intentionele motivatiefase en een post-intentionele volitiefase, met een belangrijke rol voor planning en zelfredzaamheid."},{"t":"4","q":"Wat is een centraal nadeel van individuele interventies dat de les aanhaalt als argument voor een populatiebenadering?","o":["Ze werken uitsluitend bij mensen met een hoog risico","Ze zijn duur en bereiken slechts weinig mensen, waardoor de kosten-batenverhouding tegenvalt","Ze zijn wettelijk verboden buiten de huisartspraktijk","Ze veroorzaken altijd meer angst dan groepsinterventies"],"a":1,"u":"De les bekritiseert individuele interventies omdat ze duur en onpraktisch zijn en slechts bij relatief weinig mensen verandering teweegbrengen, wat de kosten-batenverhouding minder indrukwekkend maakt."},{"t":"4","q":"Bij erfelijkheidsonderzoek wordt iemand ingedeeld naar risiconiveau. Wat gebeurt er volgens de les bij een matig risico?","o":["De persoon krijgt een jaarlijkse opvolging","De persoon wordt doorverwezen naar spoedeisende zorg","De persoon ondergaat meteen een preventieve ingreep","De persoon wordt geschrapt en terugverwezen naar de huisarts"],"a":0,"u":"De les onderscheidt laag risico (geschrapt, terug naar de huisarts), matig risico (jaarlijkse opvolging) en hoog risico (preventieve ingreep)."},{"t":"4","q":"Een hulpverlener probeert de motivatie van een cliënt te versterken zonder te overtuigen tegen diens eigen wensen in, en werkt uitnodigend in plaats van confronterend. Welke strategie past hij toe?","o":["Benadering via probleemoplossing van Egan","Motiveringsgesprek","Informatieverstrekking over valkuilen","Cognitieve gedragstherapie via Socratische dialoog"],"a":1,"u":"Het motiveringsgesprek wil de motivatie versterken en ambivalentie oproepen. Het is niet confronterend maar uitdagend en uitnodigend, met neutraliteit zodat de persoon niet tegen zijn eigen wensen in wordt overtuigd."},{"t":"4","q":"Volgens het Elaboration Likelihood Model (ELM) van Petty en Cacioppo bewandelen niet-geïnteresseerde mensen welke route bij het verwerken van een boodschap?","o":["De reflexieve route","De centrale route","De perifere route","De affectieve route"],"a":2,"u":"In het ELM verwerken mensen met geringe betrokkenheid, incongruente opvattingen of weinig interesse de boodschap via de perifere route, terwijl geïnteresseerden met persoonlijk belang de centrale route volgen."},{"t":"4","q":"Wat is volgens de les het belangrijkste risico van te sterk inzetten op angst en agressieve boodschappen in gezondheidscommunicatie?","o":["Angstopwekking motiveert niet tot verandering en er ligt te veel nadruk op kwetsbaarheid en te weinig op effectiviteit","Angst versterkt altijd de centrale route en maakt de boodschap te overtuigend","Angstboodschappen zijn effectiever naarmate ze vaker herhaald worden","Angst leidt uitsluitend tot een adaptieve reactie bij de ontvanger"],"a":0,"u":"Volgens de protectie-motivatietheorie en het werk van Witte en Allen nodigt angstopwekking niet uit tot verandering. Te veel nadruk op kwetsbaarheid en te weinig op effectiviteit werkt averechts."},{"t":"4","q":"Wat houdt de knowledge gap in de context van gezondheidsongelijkheid in?","o":["De kloof tussen het huidige en het ideale zelfbeeld van een cliënt","Het gebrek aan wetenschappelijke geletterdheid bij complotdenkers","Het verschil in toegang tot vaccinatiecentra tussen stad en platteland","Het feit dat kennis niet gelijk verdeeld is onder de bevolking"],"a":3,"u":"De knowledge gap verwijst naar de ongelijke verdeling van kennis in de bevolking, wat samenhangt met ongelijke toegang tot en interpretatie van informatie."},{"t":"4","q":"Peervoorlichting kan leerlingen mondiger maken, maar de les noemt ook een duidelijk nadeel. Welk?","o":["Deficiency training, waarbij net negatieve attitudes worden bevorderd","De boodschap verwatert doordat te veel doelgroepen worden bereikt","Rolmodellen zijn ook maar mensen en falen soms","De counseling gebeurt met iedereen in plaats van enkel wie het nodig heeft"],"a":0,"u":"Bij peervoorlichting worden invloedrijke leerlingen getraind om medeleerlingen in te lichten. Het nadeel is deficiency training, waarbij ongewild negatieve attitudes worden bevorderd."},{"t":"4","q":"Welke aanpak past het beste bij het principe van inoculatie tegen misinformatie zoals besproken in het vaccinatiecommunicatie-luik?","o":["Het onderwerp van twijfel uit de weg gaan om weerstand te vermijden","Uitsluitend numerieke risicogegevens herhalen tot de boodschap doordringt","Enkel positieve emoties zoals trots en hoop opwekken zonder tegenargumenten","Waarschuwen voor nepnieuws, het blootleggen ervan en vervolgens een tegenargument presenteren en benadrukken"],"a":3,"u":"Inoculatie werkt door mensen vooraf te waarschuwen voor nepnieuws, het bloot te leggen (exposing fake news) en dan een tegenargument te presenteren en te benadrukken, zodat ze weerbaarder worden."},{"t":"4","q":"Waarom is targeting, het benaderen van een specifieke doelgroep, volgens de les vaak beter dan een brede massaboodschap?","o":["Omdat rolmodellen enkel binnen een kleine groep geloofwaardig zijn","Omdat een specifieke groep goedkoper te bereiken is dan de hele bevolking","Omdat massamedia geen cumulatief effect over lange tijd kunnen hebben","Omdat een brede boodschap verwatert en aan kracht verliest"],"a":3,"u":"De les stelt dat een boodschap gericht op iedereen verwatert. Door een specifieke groep te benaderen (targeting) blijft de boodschap krachtiger en beter afgestemd."},{"t":"5","q":"Volgens Cassell is er een onderscheid tussen een kwaal en een ziekte. Wat is een kwaal in deze betekenis?","o":["Een aandoening die pas na een doktersbriefje officieel bestaat","Een louter cultureel bepaald oordeel over gezondheid","Een objectief vastgestelde afwijking van organen, cellen of weefsels","De subjectieve ervaring van een symptoom die de patiënt voelt wanneer hij naar de dokter gaat"],"a":3,"u":"Bij Cassell is een kwaal wat de patiënt voelt en meebrengt naar de dokter, namelijk de ervaring van een symptoom. Een ziekte is daarentegen de vastgestelde afwijking van organen, cellen of weefsels waarmee hij naar huis gaat."},{"t":"5","q":"Wat is de juiste volgorde van de drie fasen van ziekte zoals in de les beschreven?","o":["Actie plannen, symptomen waarnemen, symptomen interpreteren","Medische hulp inroepen, symptomen waarnemen, symptomen interpreteren","Symptomen waarnemen, symptomen als ziekte interpreteren, actie plannen en ondernemen","Symptomen interpreteren, symptomen waarnemen, actie ondernemen"],"a":2,"u":"De les onderscheidt drie fasen: eerst het waarnemen van symptomen, dan het interpreteren van die symptomen als ziekte, en ten slotte het plannen en ondernemen van actie."},{"t":"5","q":"Het attentionele model van Pennebaker verklaart symptoomperceptie vooral vanuit welk principe?","o":["Symptomen worden altijd nauwkeurig geregistreerd zodra ze optreden","Elke lichamelijke afwijking leidt automatisch tot een doktersbezoek","Verschillende prikkels concurreren om aandacht, waardoor het al dan niet opmerken van een symptoom afhangt van de context","Symptomen worden enkel opgemerkt door mensen met een chronische ziekte"],"a":2,"u":"In het attentionele model van Pennebaker is er concurrentie om aandacht tussen verschillende prikkels. Of een somatisch signaal wordt opgemerkt, hangt daardoor af van de context en van de beschikbare aandacht."},{"t":"5","q":"Welk kenmerk van een lichamelijk signaal verhoogt volgens de les de kans op symptoomperceptie?","o":["Het signaal verdwijnt snel vanzelf","Het signaal is nieuw, pijnlijk en sleept lang aan","Het signaal is vertrouwd en hoort bij het normale functioneren","Het signaal treedt enkel bij anderen op"],"a":1,"u":"Signalen die pijnlijk zijn en het normaal functioneren verstoren, die nieuw zijn, en die hardnekkig lang aanslepen verhogen de kans dat ze als symptoom worden waargenomen. Een bestaande chronische ziekte werkt dit eveneens in de hand."},{"t":"5","q":"Iemand met een verdringende of repressieve copingstijl (het 'grootmoedertype') reageert typisch hoe op symptomen?","o":["Vraagt voortdurend informatie aan mensen in de omgeving","Analyseert elk signaal zeer grondig en introspectief","Merkt symptomen minder vaak op en houdt vol dat alles in orde is","Zoekt onmiddellijk en vaak medische hulp op"],"a":2,"u":"De verdringende of repressieve copingstijl kenmerkt zich door minder vaak symptomen opmerken en een houding van 'ik ben oké hoor'. Deze personen blijven als het ware steken in de interpretatiefase."},{"t":"5","q":"Wat is het verschil tussen monitors en blunters bij het omgaan met symptomen?","o":["Monitors negeren stimuli, terwijl blunters actief naar informatie zoeken","Monitors zoeken informatie in de omgeving en merken meer symptomen op, terwijl blunters stimuli negeren en minimaliseren","Beide groepen zoeken evenveel medische hulp op","Monitors verdringen symptomen, terwijl blunters ze uitvergroten"],"a":1,"u":"Monitors gaan actief op zoek naar informatie in hun omgeving en merken daardoor meer symptomen op. Blunters negeren en minimaliseren stimuli en willen symptomen liever niet opmerken."},{"t":"5","q":"Over sekseverschillen in symptoomperceptie stelt de les dat vrouwen vaker naar de dokter gaan. Hoe wordt dit verschil verklaard?","o":["Mannen ervaren nooit lichamelijke signalen","Vrouwen nemen objectief meer symptomen waar dan mannen","Er is geen verschil in symptoomperceptie, maar wel in het melden ervan","Vrouwen hebben een sterker onrealistisch optimisme over hun gezondheid"],"a":2,"u":"Volgens de les is er geen verschil tussen mannen en vrouwen in de symptoomperceptie zelf, maar wel in het melden van klachten. Vrouwen leggen meer doktersbezoeken af."},{"t":"5","q":"Welke van de vijf dimensies van Leventhal verwijst naar de vraag of een ziekte acuut, chronisch of episodisch verloopt?","o":["Identiteit","Oorzaak","Tijdsduur","Gevolgen"],"a":2,"u":"De dimensie tijdsduur beschrijft of een ziekte acuut, chronisch of episodisch is. De andere dimensies zijn identiteit, gevolgen, oorzaak en genezing of behandeling."},{"t":"5","q":"Waarom wordt chronisch vermoeidheidssyndroom volgens de les vaak anders onthaald dan de ziekte van Addison?","o":["Chronische vermoeidheid wordt door artsen als ernstiger beschouwd","De ziekte van Addison is volledig subjectief en wordt niet serieus genomen","Chronische vermoeidheid is minder objectief waarneembaar en wordt daardoor vaker als luiheid gezien","Beide ziekten leiden altijd tot dezelfde ziekterepresentaties"],"a":2,"u":"Verschillende ziekten leiden tot verschillende ziekterepresentaties. Chronisch vermoeidheidssyndroom is minder objectief waarneembaar en wordt daarom vaker als luiheid geïnterpreteerd, terwijl de ziekte van Addison door meer objectiviteit serieuzer wordt genomen."},{"t":"5","q":"Bij gezamenlijke besluitvorming in het consult verschuift de rol van de patiënt. Welke omschrijving past hierbij?","o":["Er is participatie, gedeelde informatie en meer verantwoordelijkheid bij de patiënt zelf","De patiënt wordt volledig buiten de besluitvorming gehouden","De zorgverlener neemt alle beslissingen zonder overleg","De arts stelt gesloten vragen en de patiënt aanvaardt alles passief"],"a":0,"u":"Gezamenlijke besluitvorming vereist minstens twee deelnemers, participatie, het delen van informatie en overeenstemming. De patiënt draagt hierbij meer verantwoordelijkheid, in tegenstelling tot het oudere model waarin de zorgverlener centraal stond."},{"t":"5","q":"Volgens het protocol van Buckman voor een slechtnieuwsgesprek, wat doe je vooraleer je de eigenlijke diagnose meedeelt?","o":["De patiënt alleen laten en later schriftelijk informeren","De emotionele reactie van de patiënt negeren om rationeel te blijven","Een waarschuwingsschot geven zoals 'het spijt mij, het is geen goed nieuws' en het nieuws in kleine stukjes brengen","Meteen alle medische details in vakjargon opsommen"],"a":2,"u":"Het protocol van Buckman schrijft voor om eerst na te gaan wat de patiënt weet en wil weten, en daarna een waarschuwingsschot te geven. Het nieuws wordt in kleine stukjes gebracht, met erkenning van de emotionele reactie en voldoende nazorg."},{"t":"6","q":"Hoe omschrijft de les het begrip kwaliteit van leven (quality of life)?","o":["De duur waarin iemand vrij is van elke aandoening","De hoeveelheid gezondheidsbudget die een patiënt gebruikt","De objectieve meting van lichamelijke gezondheid via medische tests","De subjectieve ervaring van het functioneren op fysiek, psychisch en sociaal gebied"],"a":3,"u":"Kwaliteit van leven is volgens de les de subjectieve beleving van het functioneren op fysiek, psychisch en sociaal vlak, niet een louter objectieve maat."},{"t":"6","q":"Welke stelling past bij hoe de WHO kwaliteit van leven benadert?","o":["Het is uitsluitend het ontbreken van ziekte en gebreken","Het is de perceptie van iemand over zijn positie in het leven binnen zijn eigen culturele context, waarden en verwachtingen","Het is de inschatting van de arts over de prognose van de patiënt","Het is het aantal jaren dat iemand nog te leven heeft"],"a":1,"u":"De WHO beschrijft kwaliteit van leven als de perceptie die iemand heeft over zijn positie in het leven, gerelateerd aan de eigen culturele context, waarden, doelen en verwachtingen."},{"t":"6","q":"De les noemt vier soorten factoren die de kwaliteit van leven bepalen. Welk rijtje klopt?","o":["Genetische, klimatologische, financiële en religieuze factoren","Demografische factoren, de aandoening, de behandeling en psychosociale factoren","Voeding, beweging, slaap en medicatie","Enkel de aandoening en de behandeling"],"a":1,"u":"Volgens de les wordt kwaliteit van leven bepaald door demografische factoren, de aandoening zelf, de behandeling en psychosociale factoren."},{"t":"6","q":"Waarom hebben ouderen volgens de les vaak een kleinere kwaliteit van leven?","o":["Omdat zij minder gebruik maken van het gezondheidsbudget","Omdat zij meer fysieke beperkingen ervaren en daardoor afhankelijker worden","Omdat zij geen doelstellingen meer nastreven","Omdat zij zelden psychosociale steun krijgen van hun gezin"],"a":1,"u":"De les koppelt vergrijzing aan meer fysieke beperkingen, wat leidt tot afhankelijkheid en zo tot een kleinere kwaliteit van leven."},{"t":"6","q":"Waar gaat de zelfregulatietheorie van Carver en Scheier volgens de les over?","o":["Het voorschrijven van medicatie op basis van leeftijd","Het indelen van gezinnen in drie sociale klassen","Het meten van bloedwaarden bij chronische ziekte","Het proces van het verwezenlijken van doelstellingen bij confrontatie met verstoringen zoals ziekte"],"a":3,"u":"De zelfregulatietheorie van Carver en Scheier beschrijft hoe iemand doelstellingen probeert te bereiken wanneer die verstoord worden, bijvoorbeeld door ziekte."},{"t":"6","q":"In welke volgorde verlopen de emotionele fasen bij ziekte volgens de les?","o":["Onzekerheid, verstoring, streven naar herstel, herstel van welzijn","Herstel van welzijn, streven naar herstel, verstoring, onzekerheid","Streven naar herstel, verstoring, onzekerheid, herstel van welzijn","Verstoring, onzekerheid, herstel van welzijn, streven naar herstel"],"a":0,"u":"De les beschrijft ziekte als een proces van onzekerheid (symptomen plaatsen), verstoring (diagnose en crisis), streven naar herstel (actieve coping) en herstel van welzijn (nieuw evenwicht op basis van acceptatie)."},{"t":"6","q":"Wat is volgens de les het verschil tussen een functionele en een voedende relatie?","o":["Een functionele relatie is altijd familie, een voedende relatie is altijd een vriendschap","Een functionele relatie is emotioneel intens, een voedende relatie is oppervlakkig","Een functionele relatie berust op omstandigheden zoals dezelfde school, een voedende relatie houdt stand wat er ook gebeurt","Een functionele relatie kost geld, een voedende relatie niet"],"a":2,"u":"Een functionele relatie ontstaat uit een gedeelde omstandigheid, zoals samen naar dezelfde school gaan, terwijl een voedende relatie blijft bestaan ongeacht wat er gebeurt."},{"t":"6","q":"Welke drie fasen doorloopt een gezinssysteem volgens de les wanneer het zich aanpast aan ziekte?","o":["Afweer, herstructurering en consolidering","Isolatie, communicatie, genezing","Diagnose, behandeling, herstel","Ontkenning, woede, aanvaarding"],"a":0,"u":"Het gezinssysteem beweegt volgens de les over een continuüm van aanpassing: een fase van afweer, een fase van herstructurering en een fase van consolidering waarin men naar cohesie zoekt."},{"t":"6","q":"Welke van deze wordt in de les genoemd als voordeel van sociale ondersteuning bij ziekte?","o":["Toegenomen therapietrouw en betere emotionele aanpassing aan stressvolle gebeurtenissen","Minder contact met het gezin","Een hogere ziektekost voor de patiënt","Een snellere terugval in ongezond gedrag"],"a":0,"u":"De les somt bij ondersteunende relaties onder meer toegenomen therapietrouw, betere zelfzorg en een betere emotionele aanpassing aan stressvolle gebeurtenissen op als voordelen."},{"t":"7","q":"Wat is volgens de les de belangrijkste functionele betekenis van pijn?","o":["Ze waarschuwt voor beschadiging van het lichaam en geeft rust voor herstel","Ze verhoogt de bloeddruk zodat wonden sneller genezen","Ze onderdrukt emoties zodat men rustig blijft functioneren","Ze versterkt spontaan de spieren rond een beschadigd gebied"],"a":0,"u":"Pijn is functioneel: ze waarschuwt voor beschadigingen, geeft het lichaam rust om te herstellen en maakt via een leerproces duidelijk wat verzorgd moet worden."},{"t":"7","q":"Iemand heeft al meer dan zes maanden rugpijn zonder dat er een duidelijke oorzaak gevonden wordt. Hoe wordt dit het best getypeerd?","o":["Chronische progressieve pijn","Recidiverende acute pijn","Acute specifieke pijn","Chronische niet-specifieke pijn"],"a":3,"u":"Pijn die langer dan drie tot zes maanden duurt is chronisch, en zonder duidelijke oorzaak heet ze niet-specifiek. Ongeveer 85 procent van de rugpijngevallen is niet-specifiek."},{"t":"7","q":"Wat is het verschil tussen chronische goedaardige en chronische progressieve pijn?","o":["Goedaardige pijn heeft geen oorzaak, progressieve pijn wel","Goedaardige pijn stagneert, terwijl progressieve pijn steeds heviger wordt","Goedaardige pijn is stekend, progressieve pijn is brandend","Goedaardige pijn duurt korter dan drie maanden, progressieve pijn langer"],"a":1,"u":"Bij chronische goedaardige pijn stagneert de pijn, terwijl chronische progressieve pijn na verloop van tijd heviger wordt."},{"t":"7","q":"Een patiënt met chronische pijn krijgt zoveel zorg en sympathie van familie dat hij steeds passiever wordt. Welk begrip beschrijft deze positieve consequentie van pijn het best?","o":["Secundaire ziektewinst","Aangeleerde hulpeloosheid","Tertiaire ziektewinst","Primaire ziektewinst"],"a":0,"u":"Secundaire, interpersoonlijke ziektewinst verwijst naar de positieve gevolgen van pijn, zoals het krijgen van zorg en uitingen van sympathie van anderen."},{"t":"7","q":"Welk verschijnsel vormt de sterkste kritiek op de klassieke biologische modellen die pijnperceptie koppelen aan lichamelijke beschadiging?","o":["Pijn die pas na jaren verdwijnt","Pijn die door placebo's afneemt","Pijn die verergert door catastroferen","Fantoompijn in ledematen die er niet meer zijn"],"a":3,"u":"Fantoompijn toont dat men pijn kan ervaren in een ledemaat dat er niet meer is, dus zonder lichamelijke beschadiging ter plaatse. Dat weerlegt de een-op-eenkoppeling tussen beschadiging en pijnperceptie."},{"t":"7","q":"Wat kenmerkt de aandoening Congenital Universal Insensitivity to Pain (CUIP)?","o":["De pijnreceptoren zijn overactief waardoor men constant pijn voelt","Pijn wordt gevoeld in ledematen die geamputeerd zijn","De pijnreceptoren werken niet, waardoor men zich herhaaldelijk verwondt zonder het te beseffen","Pijn ontstaat pas nadat een bepaalde drempel wordt overschreden"],"a":2,"u":"Bij CUIP werken de pijnreceptoren niet. Door het ontbreken van pijn en dus van een leerproces vertonen deze mensen herhaaldelijk schadelijk gedrag en verwonden ze zichzelf zonder het te beseffen."},{"t":"7","q":"Volgens de poorttheorie van Melzack en Wall bepalen ook cognities en emoties de pijnbeleving. Wat gebeurt er met de poorten?","o":["Angst en depressie openen de poorten, kalmerende gedachten sluiten ze","Enkel sensorische prikkels beïnvloeden de poorten, emoties niet","Kalmerende gedachten openen de poorten en verhogen de pijn","Angst en depressie sluiten de poorten en verlagen de pijn"],"a":0,"u":"In de poorttheorie openen angst en depressie de poorten, waardoor meer pijn wordt doorgegeven, terwijl kalmerende gedachten de poorten sluiten."},{"t":"7","q":"Waarom werd de neuromatrixtheorie ontwikkeld als aanvulling op de poorttheorie?","o":["Omdat de poorttheorie het placebo-effect ontkende","Omdat de poorttheorie geen rol toekende aan het ruggenmerg","Omdat de poorttheorie enkel op acute pijn van toepassing was","Omdat de poorttheorie de fantoompijn niet kon verklaren"],"a":3,"u":"Een belangrijk kritiekpunt op de gate control theory is dat ze fantoompijn niet verklaart. Melzack ontwikkelde daarom de complexere neuromatrixtheorie."},{"t":"7","q":"Wat is de kern van het behandelingsmodel van Fordyce bij chronische pijn?","o":["De onwaarneembare innerlijke pijnbeleving rechtstreeks wegnemen met medicatie","Endorfine vrijmaken via ontspanning van specifieke spiergroepen","Elektroden in het lichaam sturen om pijnsignalen te blokkeren","Waarneembaar pijngedrag tot doelwit van interventie maken en niet-pijngedrag belonen"],"a":3,"u":"Fordyce stelt dat het waarneembare pijngedrag, en niet de onwaarneembare innerlijke beleving, het doel van interventie moet zijn. Men beloont niet-pijngerelateerd, adaptief gedrag zodat pijngedrag afneemt."},{"t":"7","q":"In de koude druktest werd onderzocht hoelang mensen hun hand in koud water houden. Wat bleek over de rol van aandacht?","o":["Wie afgeleid werd, gaf net sneller op door onzekerheid","Aandacht had geen enkele invloed op de pijnbeleving","Wie zich met een computertaak bezighield, hield het langer vol","Wie zich volledig op de pijn concentreerde, hield het langer vol"],"a":2,"u":"Als je niet op de pijn gefocust bent, ervaar je minder pijn. In de koude druktest hielden deelnemers die zich met een computertaak bezighielden het langer vol."},{"t":"7","q":"Een patiënt dient via een infuus zelf pijnstillers toe volgens de zelfmedicatiehypothese. Welk gevolg wordt in de les genoemd?","o":["De patiënt voelt meer controle en is tevredener over de behandeling","De patiënt overschrijdt vaak de veilige dosis","De patiënt gebruikt meer pijnstillers dan bij vaste toediening","De patiënt verliest het vertrouwen in de zorgverlener"],"a":0,"u":"Door zelf pijnstillers toe te dienen krijgt de patiënt meer controle, wat leidt tot meer tevredenheid over de pijnbestrijding en zelfs minder gebruik van pijnstillers, terwijl de dosis niet overschreden kan worden."},{"t":"7","q":"Welke zenuwvezels zorgen voor een zacht, prettig gevoel waardoor bijvoorbeeld wrijven de pijn kan verminderen?","o":["Polymodale C-vezels","A-bètacellen","Reticulospinale vezels","A-deltavezels"],"a":1,"u":"A-bètacellen zorgen voor een zacht en prettig gevoel, zoals bij wrijven of warmte, waardoor men minder pijn kan ervaren. A-deltavezels geven juist scherpe, kortdurende pijn en C-vezels doffe, trage pijn."}],"theory":[{"h":"Wat is gezondheid? & sociale verschillen","items":["Biomedisch model: benadering van artsen die zich richt op waarneembare zaken, een causale relatie A naar B en reductionisme.","Bio-psychosociaal model: benadering van psychologen die ook niet-waarneembare zaken meeneemt en aandacht heeft voor geestelijk welbevinden.","Conversiehysterie (Freud): lichamelijke klachten zonder medische verklaring, die het belang van geestelijke factoren illustreren.","Lekentheorieen: opvattingen die achterhalen hoe gewone mensen gezondheid zelf ervaren en beschrijven.","WHO-definitie: gezondheid als toestand van volledig lichamelijk, geestelijk en sociaal welzijn, met kritiek dat sociaaleconomische en culturele invloeden ontbreken.","Cross-culturele perspectieven: collectivistische, individualistische en holistische benaderingen plus cultuurafhankelijke ziekte-attributie.","Bibace en Walsh: ontwikkelingsfases van ziekteconcepten bij kinderen, van onbegrip en fenomenalisme naar besmetting en internalisatie.","Nudging: de situatie zo aanpassen dat mensen vanzelf gezonder gedrag gaan stellen, bijvoorbeeld met reminders.","Gezondheidspsychologie: studie van gezondheid, ziekte en zorg om gedrag te beschrijven, verklaren, voorspellen en waar mogelijk te interveniren.","Socio-economische status (SES): macht, geld en middelen die via zeggenschap, zekerheid en stress de gezondheid beinvloeden.","Sociale causaliteitsmodel versus driftmodel: lage SES veroorzaakt gezondheidsproblemen, tegenover gezondheidsproblemen die tot lage SES leiden.","Whitehall-studie: lager betaalde ambtenaren sterven eerder door lagere SES en psychosociale factoren.","Omgekeerde preventiewet: wie er het slechtst aan toe is, heeft de minste toegang tot de gezondheidszorg.","Werkstressmodel van Karasek en Theorell: veeleisendheid, autonomie en later sociale ondersteuning bepalen het risico op burn-out."]},{"h":"Gezond leven in een gezonde omgeving","items":["Ziektepreventie: geheel van strategieen om ziekte of aandoeningen te voorkomen via primaire, secundaire en tertiaire preventie.","Primaire preventie: het elimineren van de oorzaken van ziekte voordat ze ontstaat.","Secundaire preventie: het vroegtijdig opsporen en behandelen van een aandoening.","Tertiaire preventie: het voorkomen van verdere invalidering wanneer de ziekte er al is.","Doelgroepbenadering: universeel (iedereen), selectief (bepaalde groepen), geindiceerd (net voor de ziekte) en zorg-gerelateerd (ziekte al aanwezig).","Equity versus equality: streven naar een eerlijke verdeling volgens behoefte in plaats van voor iedereen exact hetzelfde.","Health field concept: gezondheid wordt bepaald door leefstijl, omgeving, voorzieningen in de gezondheidszorg en biologische factoren.","Leefstijl: het geheel van gedragingen en gewoonten van mensen, waarvan een deel effect heeft op de gezondheid.","Gedragswiel: samenvattend model van de drempels voor gedrag, met een gedragsanalyse in de kern en een determinantenanalyse eromheen.","Determinanten van gedrag: competenties (mogelijkheden), drijfveren (motivaties) en context (factoren buiten het individu).","MOETivatie versus vrijwillige motivatie: iets doen omdat het moet tegenover gedrag dat plezierig en zinvol is en bij je waarden past.","Nudging: gedragsveranderingstechniek die mensen via de omgeving een duwtje in de juiste richting geeft.","Motiverende gespreksvoering: op samenwerking gerichte gespreksstijl die de autonome motivatie versterkt via empathie en reflectief luisteren.","Veerkracht: het vermogen om na tegenslag terug te veren en er sterker uit te komen; optimaal mentaal welbevinden is nooit blijvend bereikbaar."]},{"h":"Modellen voor gezondheidsgedrag","items":["Moderatorvariabele: een persoonlijkheidskenmerk dat de relatie met gezondheidsgedrag mee bepaalt en beinvloedt.","Locus of control (MHLC): interne variant legt verantwoordelijkheid bij jezelf, externe variant bij de omgeving of gezaghebbende anderen.","Attitude: een niet direct waarneembare, stabiele psychologische bereidheid met cognitieve, emotionele en gedragsmatige componenten die de evaluatieve beoordeling stuurt.","Cognitieve dissonantie: onprettige spanning door de aanwezigheid van tegenstrijdige attitudes, zoals weten dat roken ongezond is maar toch roken.","Onrealistisch optimisme: het geloof dat een gezondheidsprobleem ons niet zal overkomen, versterkt door gebrek aan persoonlijke ervaring.","Zelfredzaamheid (self-efficacy): het geloof en vertrouwen in het eigen vermogen om een situatie aan te pakken.","Tijdsbom model: overheidsmodel waarbij angst leidt tot attitudeverandering en gedragsverandering, met afkeer als kritiek.","Lege vaten model: overheidsmodel dat ervan uitgaat dat informatie de attitude en het gedrag verandert, terwijl die informatie vaak niet geactiveerd wordt.","Goliath model: overheidsmodel waarbij macht en straf gedrag sturen, met als kritiek dat verandering intern zou moeten komen.","Health Belief Model: veel gebruikt model dat preventief gedrag voorspelt, maar statisch is en sociale invloeden negeert.","Theory of Planned Behaviour (TPB): breidt de TRA uit met perceived behavioral control, de vermeende controle over een situatie.","Transtheoretisch model (TTM): gefaseerd model met precontemplatie, contemplatie, preparatie, actie en onderhoud over een periode van zes maanden.","Precaution Adoption Process Model (PAPM): herwerking van het TTM zonder tijdslimiet en met extra aandacht voor de pre-contemplatiefase.","Health Action Process Approach (HAPA): model met een motivatiefase en een volitiefase, opgesplitst in een pre-intentioneel en post-intentioneel deel."]},{"h":"Risico verkleinen & populatiebenadering","items":["Screeningprogramma: preventief opsporen van ziekte zoals mammografie, hart- en vaatziekten of diabetes, met voor- en nadelen voor de deelnemer.","Erfelijkheidsonderzoek: indeling in laag risico (terug naar huisarts), matig risico (jaarlijkse opvolging) of hoog risico (preventieve ingreep).","One-stop testing: alle testen op een dag afleggen, wat stress vermindert maar weinig ruimte laat voor een weloverwogen keuze over een ingreep.","Motiveringsgesprek: motivatie versterken en ambivalentie oproepen op een uitnodigende, niet-confronterende manier met behoud van neutraliteit.","Benadering via probleemoplossing van Egan: in de juiste volgorde probleem verkennen, een doel formuleren en belonen bij het bereikte resultaat.","Cognitieve strategieen: uit de cognitieve gedragstherapie, waarbij gedachten centraal staan en overtuigingen als hypothesen en niet als feiten worden gezien.","Socratische dialoog: veel vragen stellen en de persoon uitdagen om zo naar actieve gedragsverandering te leiden.","Populatiebenadering: het gedrag van grote groepen veranderen, met per individu een kleiner effect maar potentieel rendabel door het grote bereik.","Injectiemodel: gaat uit van een stabiele koppeling tussen cognitie, emotie en gedrag, met overtuigende informatie uit een deskundige bron.","Elaboration Likelihood Model (ELM): geinteresseerden verwerken via de centrale route, niet-geinteresseerden via de perifere route.","Protectie-motivatietheorie: mensen reageren adaptief of maladaptief afhankelijk van hun oordeel over hun vermogen om de bedreiging te minimaliseren.","Targeting: een specifieke doelgroep benaderen omdat een brede massaboodschap verwatert.","Knowledge gap: kennis is ongelijk verdeeld in de bevolking, wat samenhangt met gezondheidsongelijkheid en moeilijk bereikbare groepen.","Inoculatie: mensen weerbaar maken tegen misinformatie door te waarschuwen voor nepnieuws, het bloot te leggen en een tegenargument te benadrukken."]},{"h":"Symptomen ervaren & het consult","items":["Kwaal versus ziekte (Cassell): een kwaal is de subjectieve ervaring van een symptoom waarmee de patiënt naar de dokter gaat, een ziekte is de vastgestelde afwijking van organen, cellen of weefsels.","Drie fasen van ziekte: symptomen waarnemen, ze als ziekte interpreteren en vervolgens actie plannen en ondernemen.","Attentioneel model (Pennebaker): prikkels concurreren om aandacht, zodat het opmerken van een symptoom afhangt van de context en beschikbare aandacht.","Cognitief-perceptueel model (Cioffi): somatische informatie leidt via selectieve aandacht en detectie tot het attribueren en toekennen van een symptoom.","Kenmerken die symptoomperceptie verhogen: pijnlijke en verstorende, nieuwe of hardnekkige signalen, en een reeds bestaande chronische ziekte.","Onrealistisch optimisme: het onderschatten van de eigen problemen, bijvoorbeeld borstkanker bij mannen minimaliseren.","Sekseverschil: vrouwen gaan vaker naar de dokter, niet door meer perceptie maar door een verschil in het melden van klachten.","Positieve versus negatieve affectiviteit: een positieve instelling doet minder snel symptomen ervaren, terwijl neuroticisme sneller symptomen doet ervaren.","Copingstijlen: type A gedrag (competitief, prestatiegericht), repressieve coping (grootmoedertype dat symptomen negeert) en monitors versus blunters.","Zelfregulatiemodel van Leventhal: ziektecognities zijn impliciete overtuigingen over een ziekte, met een feedbackloop en nadruk op de perceptie van de situatie.","Vijf dimensies van Leventhal: identiteit, gevolgen, oorzaak, tijdsduur en genezing of behandeling.","Ziekterepresentaties (IR): beïnvloeden de ziekteprognose via coping, gebruik van medische hulp, emotionele reacties, therapietrouw en return to work.","Uitstelgedrag: symptomen worden genegeerd en het zoeken van hulp wordt uitgesteld door onder meer schaamte, angst, financiële of culturele redenen.","Gezamenlijke besluitvorming in het consult: participatie, gedeelde informatie, overeenstemming en meer verantwoordelijkheid bij de patiënt, wat leidt tot meer tevredenheid en betere therapietrouw."]},{"h":"Ziekte, kwaliteit van leven & het gezin","items":["Kwaliteit van leven (QoL): de subjectieve ervaring van het functioneren op fysiek, psychisch en sociaal gebied.","WHO-definitie van QoL: de perceptie van iemand over zijn positie in het leven binnen de eigen culturele context, waarden, doelen en verwachtingen.","Bepalende factoren van QoL: demografische factoren, de aandoening, de behandeling en psychosociale factoren.","Cumulatieve problemen: opeenstapeling van moeilijkheden, bijvoorbeeld bij kinderen die gepest of afgewezen worden.","Vergrijzing: ouderen ervaren meer fysieke beperkingen en afhankelijkheid, wat de QoL verkleint.","Zelfregulatietheorie van Carver en Scheier: een proces om doelstellingen te verwezenlijken bij verstoringen zoals ziekte.","Neerwaartse vergelijking: het belang van iets leuks naar beneden bijstellen wanneer doelen door ziekte niet haalbaar zijn.","Emotioneel ziekteproces: onzekerheid, verstoring (crisis), streven naar herstel (actieve coping) en herstel van welzijn via acceptatie.","Functionele relatie: vriendschap op basis van omstandigheden, zoals samen naar dezelfde school gaan.","Voedende relatie: relatie die blijft bestaan ongeacht wat er gebeurt.","Gezinssysteemfasen: afweer, herstructurering en consolidering als continuüm van aanpassing aan ziekte.","Sociale ondersteuning: verhoogt therapietrouw en zelfzorg, verbetert emotionele aanpassing en fysiologisch functioneren.","Psycho-educatie: communicatie naar het gezin om psychisch lijden te verlichten.","Geluksdriehoek: hedonisch welbevinden (je goed voelen), eudaimonisch welbevinden (jezelf kunnen zijn) en sociaal welbevinden (goed omringd zijn)."]},{"h":"Pijn","items":["Acute pijn: pijn die ongeveer drie tot zes maanden duurt en later opnieuw kan optreden, zoals migraine.","Chronische pijn: pijn die langer dan drie tot zes maanden aanhoudt.","Specifieke versus niet-specifieke pijn: pijn met een duidelijke oorzaak tegenover pijn zonder aanwijsbare oorzaak, zoals de meeste rugpijn.","Chronische goedaardige versus progressieve pijn: pijn die stagneert tegenover pijn die geleidelijk heviger wordt.","Primaire ziektewinst: intrapersoonlijk voordeel doordat pijnuitingen een vervelende consequentie doen stoppen of afnemen.","Secundaire ziektewinst: interpersoonlijk voordeel doordat pijn zorg en sympathie oplevert.","Aangeleerde hulpeloosheid: afhankelijkheid van anderen die coping vermindert en zo via een vicieuze cirkel meer stress en meer pijn geeft.","Fantoompijn: pijn ervaren in een ledemaat dat geamputeerd of verlamd is.","CUIP: aangeboren ongevoeligheid voor pijn waarbij de pijnreceptoren niet werken en men zich herhaaldelijk verwondt.","Poorttheorie van Melzack en Wall: sensorische prikkels, angst en depressie openen de pijnpoorten, terwijl kalmerende gedachten ze sluiten.","Nociceptoren: A-deltavezels geven scherpe kortdurende pijn, C-vezels doffe trage pijn en A-bètacellen een zacht prettig gevoel dat pijn kan dempen.","Aandacht en stemming: focus op de pijn of op nare aspecten geeft meer pijn, afleiding en ontspanning geven minder pijn.","Zelfmedicatiehypothese: zelf pijnstillers toedienen geeft meer controle, meer tevredenheid en zelfs minder gebruik van pijnstillers.","Neuromatrix: netwerk van thalamus, hersenschors en limbisch systeem dat pijn verwerkt en ook fantoompijn kan verklaren.","Behandelingsmodel van Fordyce: via operante conditionering waarneembaar pijngedrag verminderen door niet-pijngedrag te belonen.","Biofeedback: registratietechniek waarbij men via auditieve of visuele feedback autonome lichaamsfuncties zoals spierspanning leert beïnvloeden."]}],"hacks":[{"h":"SES via 3 M-en","t":"Onthoud SES als de drie M-en: Macht, geld en Middelen. Macht geeft zeggenschap en controle, geld geeft zekerheid en minder stress, en middelen (via opleiding en beroep) bepalen je plaats op de sociale ladder."},{"h":"PST voor preventieniveaus","t":"Onthoud PST: Primair Schrapt de oorzaak, Secundair Spoort vroeg op, Tertiair Temt verdere schade. Zo koppel je elk preventieniveau meteen aan zijn kernactie."},{"h":"TTM-fasen onthouden: PCPAO","t":"Onthoud de vijf TTM-fasen met PCPAO: Precontemplatie, Contemplatie, Preparatie, Actie, Onderhoud. Denk aan iemand die eerst ontkent, dan overweegt, plannen maakt, handelt en tot slot volhoudt."},{"h":"CPI: van individu naar populatie","t":"Onthoud de opbouw van de les met CPI: eerst het individuele risico verkleinen via Counseling en screening, dan de Populatiebenadering via massamedia, en ten slotte Inoculatie tegen misinformatie in de vaccinatiecommunicatie."},{"h":"Leventhals 5 dimensies: GO-TIG","t":"Onthoud de vijf dimensies van Leventhal met GO-TIG: Gevolgen, Oorzaak, Tijdsduur, Identiteit en Genezing/behandeling. Zo weet je meteen langs welke lijnen een patiënt zijn ziekte beoordeelt."},{"h":"AHC voor het gezinssysteem","t":"Onthoud de drie gezinsfasen met AHC: Afweer, Herstructurering, Consolidering. Denk aan een gezin dat eerst schrikt (Afweer), daarna de boel herorganiseert (Herstructurering) en ten slotte naar elkaar toegroeit (Consolidering)."},{"h":"Poorten open of dicht","t":"Denk aan de poorttheorie als een deur: Angst en Depressie duwen de poort Open, terwijl Kalme gedachten de poort Kalm dicht doen. Negatieve emoties laten meer pijn binnen, rust houdt pijn buiten."}]};
</script>
