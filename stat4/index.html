<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<!-- Berie's exam space © 2026 Berat Yildirim. Alle rechten voorbehouden. Originele bron: https://beriesexamspace.github.io  Kopieren of hergebruiken zonder schriftelijke toestemming is niet toegestaan. -->
<style>
  :root{
    --bg:#f4f2ee; --bg2:#ebe8e2; --card:#ffffff; --ink:#1b232c; --muted:#5d6873;
    --line:#e2ddd4; --accent:#0f6e6a; --accent-ink:#0b4f4c; --accent-soft:#dcefed;
    --amber:#c9821f; --amber-soft:#f7ecd9; --violet:#6d5bd0; --violet-soft:#e9e6fa;
    --good:#1f8a4c; --good-soft:#e2f3e8; --bad:#c23b54; --bad-soft:#fbe5ea;
    --shadow:0 1px 2px rgba(20,30,40,.05),0 6px 18px rgba(20,30,40,.05);
    --shadow-lg:0 2px 6px rgba(20,30,40,.06),0 18px 40px rgba(20,30,40,.10);
    --r:14px; --r-lg:20px; --ease:cubic-bezier(.2,.8,.2,1);
  }
  html[data-theme="dark"]{
    --bg:#11151a; --bg2:#161b22; --card:#1b222b; --ink:#e7ecf1; --muted:#9aa6b2;
    --line:#2a323c; --accent:#3fb9b2; --accent-ink:#7fd6d0; --accent-soft:#163230;
    --amber:#e0a64a; --amber-soft:#2e2515; --violet:#a99cf0; --violet-soft:#221d3a;
    --good:#46c178; --good-soft:#16301f; --bad:#ef6b82; --bad-soft:#331620;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 2px 8px rgba(0,0,0,.4),0 22px 48px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;letter-spacing:-.01em}
  button,a{font-family:inherit;cursor:pointer;color:inherit}
  .wrap{max-width:880px;margin:0 auto;padding:0 18px 96px}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
  .ic{width:1.25em;height:1.25em;flex:none;vertical-align:-.18em;stroke:currentColor;stroke-width:1.75;
    stroke-linecap:round;stroke-linejoin:round;fill:none}

  header.top{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(160%) blur(16px);-webkit-backdrop-filter:saturate(160%) blur(16px);box-shadow:inset 0 -1px 0 0 rgba(0,0,0,.04)}
  .topin{max-width:880px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:700}
  .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,var(--accent),var(--accent-ink));
    color:#fff;display:grid;place-items:center;font-family:Georgia,serif;font-weight:700;font-size:16px;flex:none;
    box-shadow:0 2px 6px rgba(15,110,106,.35)}
  .brand small{display:block;font-weight:500;color:var(--muted);font-size:11px}
  .spacer{flex:1}
  .iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:38px;
    padding:7px 11px;font-size:13.5px;display:inline-flex;gap:7px;align-items:center;text-decoration:none;
    transition:border-color .2s var(--ease),transform .12s var(--ease)}
  .iconbtn:hover{border-color:var(--accent)} .iconbtn:active{transform:scale(.96)}
  nav.tabs{display:flex;gap:2px;overflow:auto;max-width:880px;margin:0 auto;padding:6px 12px 0;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{border:none;background:none;color:var(--muted);padding:10px 13px;border-radius:9px 9px 0 0;
    font-size:14px;font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px;transition:color .2s var(--ease)}
  nav.tabs button .ic{width:16px;height:16px}
  nav.tabs button.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
  nav.tabs button:hover{color:var(--ink)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:20px}
  .muted{color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
  .pill.amber{background:var(--amber-soft);color:var(--amber)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;gap:14px}
  @media(min-width:620px){.g2{grid-template-columns:1fr 1fr}}

  .hero{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin:20px 0 8px}
  .count{flex:none;background:linear-gradient(150deg,var(--accent),var(--accent-ink));color:#fff;border-radius:var(--r);padding:14px 20px;text-align:center;min-width:118px;box-shadow:0 8px 20px rgba(15,110,106,.28)}
  .count b{font-family:Georgia,serif;font-size:32px;display:block;line-height:1}
  .count span{font-size:12px;opacity:.92}
  .herotext h1{margin:0 0 4px;font-size:25px}
  .herotext p{margin:0;color:var(--muted)}

  .brandstrip{display:flex;align-items:center;gap:13px;width:100%;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 16px;margin:14px 0 2px;box-shadow:var(--shadow);transition:border-color .2s var(--ease),transform .15s var(--ease)}
  .brandstrip:hover{border-color:var(--accent);transform:translateY(-1px)}
  .brandstrip .bs-logo{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:17px;background:linear-gradient(145deg,var(--accent),var(--accent-ink))}
  .brandstrip .bs-txt{flex:1;min-width:0} .brandstrip .bs-txt b{display:block;font-size:14.5px} .brandstrip .bs-txt small{color:var(--muted);font-size:12.5px}
  .brandstrip .bs-go{color:var(--accent-ink);flex:none;display:inline-flex} .brandstrip .bs-go .ic{width:18px;height:18px}

  .seclabel{display:flex;align-items:center;gap:8px;margin:24px 0 12px;font-weight:700;font-size:15px}
  .seclabel .ic{width:18px;height:18px;color:var(--accent-ink)}
  .backlink{display:inline-flex;align-items:center;gap:5px;border:none;background:none;color:var(--muted);font-size:13.5px;font-weight:600;padding:6px 0;margin-bottom:4px;transition:color .2s var(--ease)}
  .backlink:hover{color:var(--accent-ink)} .backlink .ic{width:16px;height:16px}
  .tracks{display:grid;gap:14px} @media(min-width:600px){.tracks{grid-template-columns:1fr 1fr}}
  .track{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);transition:transform .22s var(--ease),border-color .22s var(--ease),box-shadow .22s var(--ease)}
  .track:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow-lg)} .track:active{transform:translateY(-1px) scale(.995)}
  .track .tile{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;margin-bottom:4px;background:linear-gradient(150deg,var(--accent),var(--accent-ink))}
  .track.alt .tile{background:linear-gradient(150deg,var(--violet),#4f40a8)} .track .tile .ic{width:24px;height:24px}
  .track b{font-size:18px} .track small{color:var(--muted);font-size:13.5px;line-height:1.5}
  .track .go{margin-top:6px;display:inline-flex;align-items:center;gap:6px;color:var(--accent-ink);font-weight:600;font-size:13.5px} .track.alt .go{color:var(--violet)} .track .go .ic{width:16px;height:16px}
  .toggle{width:48px;height:28px;border-radius:999px;border:none;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s var(--ease)}
  .toggle .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s var(--ease)}
  .toggle.on{background:var(--violet)} .toggle.on .knob{left:23px}
  .warmcard{border-color:var(--violet)!important;background:var(--violet-soft)} .warmcard .ic{width:22px;height:22px;color:var(--violet);flex:none}
  .modebanner{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:11px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent-ink);font-size:13.5px;font-weight:600}
  .modebanner.v{background:var(--violet-soft);color:var(--violet)} .modebanner .ic{width:18px;height:18px} .modebanner a,.modebanner .bnlink{margin-left:auto;font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;color:inherit;border:none;background:none;font-family:inherit;padding:0}
  html.snappy .card,html.snappy .mode,html.snappy .tip,html.snappy .track{animation-duration:.12s!important}
  .mode{display:flex;flex-direction:column;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:17px;gap:7px;box-shadow:var(--shadow);transition:transform .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease)}
  .mode:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .mode .me{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)} .mode .me .ic{width:22px;height:22px}
  .mode b{font-size:16px} .mode small{color:var(--muted);font-size:13px}

  label.fld{display:block;font-size:13px;font-weight:600;margin:16px 0 7px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;min-height:38px;padding:7px 13px;font-size:13.5px;transition:all .18s var(--ease)}
  .chip:hover{border-color:var(--accent)} .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:11px;min-height:46px;padding:12px 20px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;box-shadow:0 4px 12px rgba(15,110,106,.25);transition:background .2s var(--ease),transform .12s var(--ease)}
  .btn:hover{background:var(--accent-ink)} .btn:active{transform:scale(.97) translateY(1px)} .btn .ic{width:18px;height:18px}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none} .btn.ghost:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  input[type=search],input[type=text],input[type=email],textarea{font-family:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
  input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .runtop{display:flex;align-items:center;gap:12px;margin:2px 0 14px;font-size:13px;color:var(--muted)}
  .bar{height:8px;border-radius:6px;background:var(--bg2);overflow:hidden;flex:1}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .7s var(--ease)}
  .qtext{font-size:19px;font-weight:600;margin:8px 0 16px;font-family:Georgia,serif;line-height:1.45}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px 15px;margin-bottom:10px;font-size:15px;transition:border-color .15s var(--ease),background .15s var(--ease),transform .12s var(--ease)}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)} .opt:active:not(:disabled){transform:scale(.99)}
  .opt .k{flex:none;width:27px;height:27px;border-radius:8px;background:var(--bg2);color:var(--muted);display:grid;place-items:center;font-weight:700;font-size:13px}
  .opt.correct{border-color:var(--good);background:var(--good-soft)} .opt.correct .k{background:var(--good);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default}
  .feedback{border-radius:12px;padding:13px 15px;margin:4px 0 12px;font-size:14.5px}
  .feedback.ok{background:var(--good-soft);color:var(--good)} .feedback.no{background:var(--bad-soft);color:var(--bad)}
  .feedback b{font-weight:700} .feedback .sub{display:block;margin-top:3px;color:var(--ink);font-weight:500;opacity:.92}
  .whybtn{border:1px solid var(--line);background:var(--card);color:var(--accent-ink);border-radius:10px;min-height:40px;padding:9px 14px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:border-color .2s var(--ease),background .2s var(--ease)}
  .whybtn:hover{border-color:var(--accent);background:var(--accent-soft)} .whybtn .ic{width:16px;height:16px}
  .whybox{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:14px 16px;margin:12px 0 4px;font-size:14px;line-height:1.55}
  .whybox h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent-ink);font-family:system-ui;display:flex;align-items:center;gap:7px}
  .whybox .ic{width:16px;height:16px}

  .acc{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
  .acc>summary{padding:15px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:11px}
  .acc>summary::-webkit-details-marker{display:none}
  .acc>summary .n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
  .acc>summary .caret{margin-left:auto;color:var(--muted);transition:transform .25s var(--ease)} .acc[open]>summary .caret{transform:rotate(90deg)}
  .acc[open]>summary{border-bottom:1px solid var(--line)} .acc .body{padding:6px 18px 16px}
  .acc h4{margin:14px 0 6px;font-size:13px;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.4px;font-family:system-ui}
  .acc ul{margin:0;padding-left:20px} .acc li{margin:6px 0;font-size:14.5px;line-height:1.5}
  .acc.hack li::marker{content:"💡  "} .acc.hack>summary .n{background:var(--violet-soft);color:var(--violet)}
  mark{background:var(--amber-soft);color:inherit;padding:0 2px;border-radius:3px}

  .tip{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}
  .tip h4{margin:0 0 5px;font-size:14.5px;display:flex;align-items:center;gap:8px;font-family:system-ui} .tip h4 .ic{width:18px;height:18px;color:var(--violet)}
  .tip p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}
  .tipgrid{display:grid;gap:12px} @media(min-width:620px){.tipgrid{grid-template-columns:1fr 1fr}}

  .results .big{font-family:Georgia,serif;font-size:54px;text-align:center;margin:8px 0;line-height:1}
  .center{text-align:center} .hide{display:none!important}
  footer{margin-top:34px;text-align:center;color:var(--muted);font-size:13px}
  .kbd{font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--muted)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.03)}100%{transform:scale(1)}}
  @keyframes optIn{from{opacity:0;transform:translateX(-9px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: no-preference){
    .card,.mode,.tip{animation:fadeUp .34s var(--ease) both}
    .acc{animation:fadeUp .32s var(--ease) both}
    .opt{animation:optIn .3s var(--ease) backwards;animation-delay:var(--oi,0s)}
    .chip.on{animation:pop .22s var(--ease)}
    .feedback{animation:slideIn .26s var(--ease) both} .whybox{animation:slideIn .28s var(--ease) .07s both} .opt.correct{animation:pop .34s var(--ease)}
  }
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  /* ---- Premium launch (Gemini-stijl) + header-logo gloed ---- */
  @property --bes-a{syntax:'<angle>';initial-value:0deg;inherits:false}
  #splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(125% 125% at 50% 38%,var(--bg2) 0%,var(--bg) 68%);transition:opacity .6s var(--ease),transform .7s var(--ease)}
  #splash.hide{opacity:0;transform:scale(1.07);pointer-events:none}
  .sp-inner{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
  .sp-mark{position:relative;width:100px;height:100px;display:grid;place-items:center}
  .sp-mark::before{content:"";position:absolute;inset:-16px;border-radius:34px;z-index:0;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));filter:blur(17px);opacity:.75}
  .sp-mark::after{content:"";position:absolute;inset:-3px;border-radius:27px;z-index:1;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));padding:3px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .sp-logo{position:relative;z-index:2;width:92px;height:92px;border-radius:24px;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:46px;background:linear-gradient(150deg,var(--accent),var(--accent-ink));box-shadow:0 14px 38px rgba(15,110,106,.4)}
  .sp-spark{position:absolute;z-index:3;top:-7px;right:-7px;width:30px;height:30px;color:#fff;filter:drop-shadow(0 2px 7px rgba(0,0,0,.35))}
  .sp-name{position:relative;font-family:Georgia,serif;font-size:26px;font-weight:700;letter-spacing:-.01em;color:var(--ink);overflow:hidden}
  .sp-name::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(-130%)}
  .sp-tag{font-size:13px;color:var(--muted);margin-top:-8px;letter-spacing:.03em}
  @media (prefers-reduced-motion: no-preference){
    .sp-mark::before{animation:bes-spin 3s linear infinite,bes-breathe 2.4s var(--ease) infinite}
    .sp-mark::after{animation:bes-spin 3s linear infinite}
    .sp-logo{animation:bes-pop .7s var(--ease) both}
    .sp-spark{animation:bes-pop .6s var(--ease) .12s both,bes-twinkle 1.9s var(--ease) .9s infinite}
    .sp-name{animation:bes-rise .6s var(--ease) .14s both}
    .sp-name::after{animation:bes-shimmer 1.5s var(--ease) .5s 1}
    .sp-tag{animation:bes-rise .6s var(--ease) .26s both}
  }
  @keyframes bes-spin{to{--bes-a:360deg}}
  @keyframes bes-breathe{0%,100%{opacity:.55;filter:blur(16px)}50%{opacity:.95;filter:blur(22px)}}
  @keyframes bes-shimmer{to{transform:translateX(130%)}}
  @keyframes bes-twinkle{0%,100%{opacity:1;transform:scale(1) rotate(0deg)}50%{opacity:.65;transform:scale(.82) rotate(18deg)}}
  @keyframes bes-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  /* mobiel: header-knoppen alleen iconen zodat niks zijwaarts overflowt */
  @media(max-width:440px){ header.top .iconbtn span{display:none} header.top .iconbtn{padding:7px 9px;min-width:38px;justify-content:center} .topin{gap:8px} }
</style>
</head>
<body>
<div id="splash"><div class="sp-inner">
  <div class="sp-mark">
    <div class="sp-logo">S4</div>
    <svg class="sp-spark" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.5c.4 4.6 2.4 6.6 7 7-4.6.4-6.6 2.4-7 7-.4-4.6-2.4-6.6-7-7 4.6-.4 6.6-2.4 7-7Z"/></svg>
  </div>
  <div><div class="sp-name">Statistiek IV</div><div class="sp-tag">slim oefenen voor je examen</div></div>
</div></div>
<header class="top">
  <div class="topin">

<script>
window.S4 = {"questions":[{"t":"1","q":"Een onderzoeker wil een continue afhankelijke variabele voorspellen op basis van een andere continue variabele en nagaan hoe y varieert bij veranderingen in x. Welke techniek past het best?","o":["Factoranalyse","Clusteranalyse","Enkelvoudige regressieanalyse","Logistische regressie"],"a":2,"u":"Regressieanalyse gebruik je wanneer men een continue variabele wil voorspellen aan de hand van een andere continue variabele en wil weten hoe y varieert bij veranderingen in x."},{"t":"1","q":"Waarom rapporteert men bij meervoudige regressie vaak de aangepaste R2 in plaats van de gewone R2?","o":["Omdat de aangepaste R2 rekening houdt met het aantal predictoren en niet vanzelf stijgt bij het toevoegen van variabelen","Omdat de aangepaste R2 altijd hoger uitvalt en zo het model beter doet lijken","Omdat de gewone R2 enkel bruikbaar is bij logistische regressie","Omdat de aangepaste R2 de collineariteit tussen predictoren corrigeert"],"a":0,"u":"Bij meervoudige regressie gebruikt men een aangepaste R2 in plaats van R2 omdat die corrigeert voor het aantal predictoren en dus niet automatisch toeneemt wanneer je variabelen toevoegt."},{"t":"1","q":"Op welk verschijnsel moet je specifiek controleren wanneer je in een meervoudig regressiemodel meerdere onderling samenhangende predictoren hebt?","o":["Interpolatie","Collineariteit","Non-random missingness","Heteroscedasticiteit"],"a":1,"u":"Bij meervoudige regressie hoort men te controleren op collineariteit, dat wil zeggen onderlinge samenhang tussen de predictoren."},{"t":"1","q":"Wat beschrijft de centrale limietstelling?","o":["Dat de empirische frequentieverdeling van een steekproef altijd normaal verdeeld is","Dat ontbrekende gegevens toevallig verdeeld zijn over alle subjecten","Dat bij herhaald trekken van toevallige steekproeven met voldoende grote n de steekproevenverdeling van het gemiddelde een normaalverdeling benadert","Dat de variantie gelijk blijft over de range van de onafhankelijke variabele"],"a":2,"u":"De centrale limietstelling stelt dat wanneer men herhaaldelijk toevallige steekproeven met grootte n trekt uit een willekeurig verdeelde populatie en n voldoende groot is (vuistregel n groter dan 30), de steekproevenverdeling van het steekproefgemiddelde een normaalverdeling benadert."},{"t":"1","q":"Bij het controleren van de assumptie van homoscedasticiteit geeft Levene's test aan dat er heteroscedasticiteit is. Wat betekent heteroscedasticiteit inhoudelijk?","o":["De afhankelijke variabelen vertonen overal vergelijkbare niveaus van variantie","De data zijn volledig at random ontbrekend","Predicties zijn beter voor sommige waarden van de onafhankelijke variabele dan voor andere","Er is een sterke onderlinge correlatie tussen de predictoren"],"a":2,"u":"Heteroscedasticiteit betekent dat predicties beter zijn voor sommige waarden van de onafhankelijke variabele dan voor andere, in tegenstelling tot homoscedasticiteit waarbij de variantie vergelijkbaar is over de hele range."},{"t":"1","q":"Een onderzoeker constateert dat de gegevens van bepaalde subjecten systematisch ontbreken doordat een procedure niet correct verliep. Hoe typeer je dit soort missing data?","o":["Missing Completely At Random (MCAR)","Verwaarloosbare missing data (random missingness)","Imputatietechniek","Gekende niet-verwaarloosbare missing data (non-random missingness)"],"a":3,"u":"Gekende niet-verwaarloosbare missing data of non-random missingness slaat op systematisch missende gegevens die te wijten zijn aan procedurele factoren."},{"t":"1","q":"Wat is het verschil tussen standaard listwise deletion en pairwise deletion bij het omgaan met ontbrekende gegevens?","o":["Listwise gebruikt enkel de means, pairwise gebruikt z-scores","Listwise schat de ontbrekende waarde en voegt ze toe, pairwise verwijdert het hele subject","Listwise past een logaritmische transformatie toe, pairwise centreert de waarnemingen","Listwise verwijdert alle gegevens van een subject zodra er iets ontbreekt, pairwise verwijdert enkel het ontbrekende gegeven en gebruikt de rest nog"],"a":3,"u":"Bij standaard listwise deletion verwijder je alle gegevens van een subject zodra er data ontbreekt, terwijl je bij pairwise deletion enkel het ontbrekende gegeven verwijdert en de overige beschikbare gegevens toch nog gebruikt."},{"t":"1","q":"Welke techniek gebruik je om extreme waarden (outliers) te detecteren?","o":["Mahalanobis","Cronbach's alfa","Ipsatizing","P-P plot"],"a":0,"u":"Mahalanobis is de techniek waarmee je extreme waarden (outliers) kunt detecteren."},{"t":"1","q":"Er blijkt een link te bestaan tussen een variabele en het ontbreken van data, maar de oorzaak van dat ontbreken is niet die variabele zelf. Welk type missing data is dit?","o":["Missing Completely At Random (MCAR)","Missing At Random (MAR)","Verwaarloosbare missing data","Non-random missingness"],"a":1,"u":"Bij Missing At Random (MAR) is er wel een link tussen de variabele en de missing data, maar ligt de oorzaak van het ontbreken niet aan de variabele zelf. Bij MCAR ligt de oorzaak niet aan de test."},{"t":"1","q":"Je hebt een niet-metrische onafhankelijke variabele met verschillende categorieën die je in een regressiemodel wilt opnemen. Welk begrip beschrijft de dichotome variabele met waarde 0 of 1 die telkens één categorie representeert?","o":["Sensitiviteitsanalyse","Interpolatie","Dummy variabele","Ipsatizing"],"a":2,"u":"Een dummy variabele is een dichotome variabele die één categorie van een niet-metrische onafhankelijke variabele representeert en de waarde 0 of 1 aanneemt."},{"t":"2","q":"Een onderzoeker wil een continue, interval-geschaalde afhankelijke variabele voorspellen uit meerdere onafhankelijke variabelen. Welke techniek past hier het best?","o":["Meervoudige (lineaire) regressie","Multinomiale logistische regressie","Chi-square test","Binaire logistische regressie"],"a":0,"u":"Bij lineaire regressie is de verklaarde variabele (AV) continu en op interval-niveau. Meerdere OV samen leiden tot meervoudige regressie."},{"t":"2","q":"De afhankelijke variabele in een studie is dichotoom (geslaagd of niet geslaagd). Welke techniek is het meest aangewezen?","o":["Binaire logistische regressie","Aangepaste R2","Meervoudige lineaire regressie","Kolmogorov-Smirnov test"],"a":0,"u":"Logistische regressie herleidt de AV naar een nominale of ordinale schaal. Met twee categorieen is dit binaire logistische regressie."},{"t":"2","q":"Waarom rapporteer je bij een meervoudige regressie bij voorkeur de aangepaste (adjusted) R2 in plaats van de gewone R2?","o":["Omdat ze rekening houdt met het aantal OV in verhouding tot de steekproefgrootte","Omdat ze de multicollineariteit tussen OV wegneemt","Omdat ze de odds naar een continue schaal transformeert","Omdat ze de normaliteit van de AV-verdeling toetst"],"a":0,"u":"De aangepaste R2 verlaagt de R2 naarmate er minder waarnemingen per variabele zijn en is daarom geschikt om modellen met verschillende aantallen variabelen en waarnemingen te vergelijken."},{"t":"2","q":"Wat beschrijft het begrip multicollineariteit in een meervoudige regressie?","o":["De onderlinge verbanden tussen de onafhankelijke variabelen","De verdeling van het aantal successen bij herhaalde experimenten","Het percentage variantie van de AV dat het model verklaart","De kans op succes ten opzichte van de kans op mislukking"],"a":0,"u":"Multicollineariteit verwijst naar de onderlinge verbanden tussen de OV. Het vergroot de errors, de betrouwbaarheidsintervallen en de p-waarden."},{"t":"2","q":"In de SPSS-output van een meervoudige regressie vind je een lage tolerantie voor een variabele. Wat wijst dit aan?","o":["Dat de AV normaal verdeeld is","Dat er een probleem met multicollineariteit kan zijn","Dat het model een goede goodness of fit heeft","Dat de effectgrootte klinisch relevant is"],"a":1,"u":"Tolerantie is een maat voor multicollineariteit, namelijk het percentage variantie van een OV dat niet door de andere OV verklaard wordt. Het moet minstens 50% zijn, dus een lage waarde signaleert een probleem."},{"t":"2","q":"Hoe interpreteer je een gestandaardiseerde coefficient (beta) in de SPSS-output van een meervoudige regressie?","o":["Als de OV met een eenheid stijgt, verdubbelt de odds op succes","Het is de kans op een fout van de eerste soort","Het is het percentage van de variantie dat niet verklaard wordt","Als de OV met een standaardafwijking stijgt, neemt de AV met beta standaardafwijkingen toe"],"a":3,"u":"De gestandaardiseerde beta drukt uit hoeveel standaardafwijkingen de AV verandert wanneer de OV met een standaardafwijking stijgt."},{"t":"2","q":"Bij een logistische regressie wil je nagaan of het volledige model goed past bij de data. Welke maten of test gebruik je daarvoor?","o":["De Variance Inflation Factor (VIF)","De gestandaardiseerde beta-coefficient","Pseudo R2 maten zoals Cox & Snell en Nagelkerke, en de Hosmer test","De aangepaste R2 en de tolerantie"],"a":2,"u":"Bij dichotome variabelen geven pseudo R2 maten zoals Cox & Snell en Nagelkerke de model of fit aan. De Hosmer test is een goodness of fit test voor logistische regressiemodellen."},{"t":"2","q":"Welk begrip staat voor het principe om de afhankelijke variabele zo goed mogelijk te voorspellen met zo weinig mogelijk onafhankelijke variabelen?","o":["Redundantie","Substitutie","Paneldata","Parsimonie"],"a":3,"u":"Parsimonie staat voor het zo goed mogelijk voorspellen van de AV met zo min mogelijk OV. Redundantie gaat over overlap tussen voorspellers en paneldata over herhaald gemeten subjecten."},{"t":"2","q":"Wat is het verschil tussen statistische en klinische significantie?","o":["Statistische significantie toetst de normaliteit, klinische significantie de multicollineariteit","Beide betekenen exact hetzelfde in de praktijk","Statistische significantie betekent p groter dan 0,05, klinische significantie een kleine effectgrootte","Statistische significantie geldt bij p kleiner dan 0,05, klinische significantie wanneer de interventie klinisch relevant is met een grote effectgrootte"],"a":3,"u":"Statistische significantie treedt op wanneer de p-waarde kleiner is dan 0,05. Klinische significantie gaat over een klinisch relevante interventie, in statistische termen een grote effectgrootte."},{"t":"2","q":"Wanneer gebruik je bij het toetsen van de normaliteit van een verdeling eerder de Shapiro-Wilcoxon test dan de Kolmogorov-Smirnov test?","o":["Bij grote steekproeven","Wanneer de AV dichotoom is","Wanneer er multicollineariteit optreedt","Bij kleine n"],"a":0,"u":"De Shapiro-Wilcoxon test wordt gebruikt om de normaliteit na te gaan bij grote steekproeven, terwijl Kolmogorov-Smirnov bedoeld is voor kleine n. Bij beide geldt: normaal verdeeld indien p groter dan 0,05."},{"t":"3","q":"Een onderzoeker wil nagaan of het gemiddelde van een continue uitkomstvariabele verschilt tussen drie of meer groepen (categorische indeling). Welke techniek is hiervoor de aangewezen keuze?","o":["ANOVA","Logistische regressie","Bootstrapping","Factoranalyse"],"a":0,"u":"ANOVA is de techniek waarmee men de verhoudingen tussen verschillende categorische groepen ontdekt aan de hand van een continue variabele."},{"t":"3","q":"Waarom voert men na een significante ANOVA niet zomaar heel veel losse t-tests uit tussen alle groepen?","o":["Omdat de vrijheidsgraden dan negatief worden","Omdat het totale risico op een Type I fout dan sterk toeneemt (capitalizing by chance)","Omdat de continue variabele dan categorisch wordt","Omdat de omnibustest daardoor conservatiever wordt"],"a":1,"u":"Door veel testen uit te voeren stijgt de kans op toevallige significante resultaten, waardoor het totale risico op een Type I fout zeer groot wordt (kanskapitalisatie)."},{"t":"3","q":"Wat is het belangrijkste nadeel van de Bonferroni correctie tegenover haar voordeel?","o":["Ze verstrengt de kans op een Type I fout, maar vergroot daardoor de kans op een Type II fout","Ze vervangt de continue variabele door rangen","Ze maakt de test permissiever en dus liberaler","Ze vergroot zowel de kans op een Type I als een Type II fout"],"a":0,"u":"De Bonferroni correctie is conservatief: ze verkleint de kans op een Type I fout, maar vergroot daardoor de kans op een Type II fout."},{"t":"3","q":"Welke test gebruikt men om na te gaan of aan de assumptie van homoscedasticiteit is voldaan bij een ANOVA?","o":["Kruskal-Wallis test","Levene's test","Mauchly's W","Tukey's HSD test"],"a":1,"u":"Levene's test toetst de homoscedasticiteit bij ANOVA: bij p<0,05 is er heteroscedasticiteit, bij p>0,05 is er homoscedasticiteit."},{"t":"3","q":"Een onderzoeker stelt vast dat de invloed van één onafhankelijke variabele op de afhankelijke variabele verschilt naargelang het niveau van een andere onafhankelijke variabele. Hoe noemt men dit fenomeen?","o":["Een hoofdeffect","Redundantie","Een confounder","Een interactie-effect"],"a":3,"u":"Een interactie-effect treedt op wanneer de invloed van een OV op een AV verschilt bij een andere OV. Een factoriële ANOVA legt zulke interactie-effecten bloot."},{"t":"3","q":"Wanneer is een repeated measures (herhaalde meting) ANOVA de aangewezen techniek in plaats van een gewone ANOVA?","o":["Wanneer de grootste sd gedeeld door de kleinste sd groter dan twee is","Wanneer de groepen in de OV niet onafhankelijk van elkaar zijn","Wanneer er meer dan één continue afhankelijke variabele is","Wanneer men enkel de globale model fit wil nagaan"],"a":1,"u":"Een repeated measures ANOVA wordt gebruikt indien de groepen in de OV niet onafhankelijk zijn van elkaar, bijvoorbeeld bij herhaalde metingen bij dezelfde proefpersonen."},{"t":"3","q":"Wat toetst men met Mauchly's W bij een mixed model ANOVA, en wat doe je bij een significant resultaat?","o":["De effectgrootte; bij p<0,05 rapporteer je partiële eta-kwadraat","De homoscedasticiteit; bij p<0,05 voer je een post-hoc test uit","De sfericiteit (bolvormigheid); bij p<0,05 pas je een sfericiteitscorrectie toe","De normaliteit; bij p<0,05 transformeer je naar rangen"],"a":2,"u":"Mauchly's W toetst de bolvormigheid (sfericiteit). Is de test significant (p<0,05), dan is er geen bolvormigheid en moet men een sfericiteitscorrectie toepassen."},{"t":"3","q":"Welke sfericiteitscorrectie is aangewezen wanneer de epsilon-schatting kleiner is dan 0,75?","o":["Tukey's HSD","Greenhouse-Geisser","Huynh-Feldt","Bonferroni-Holm"],"a":1,"u":"De Greenhouse-Geisser correctie wordt toegepast wanneer niet voldaan is aan de bolvormigheidsvuistregel, dat wil zeggen bij een epsilon-schatting kleiner dan 0,75. Boven 0,75 is Huynh-Feldt aangewezen."},{"t":"3","q":"Een variabele versterkt de correlatie tussen twee andere variabelen zonder ze te veroorzaken. Hoe noemt men zo'n variabele?","o":["Een covariaat","Een confounder","Een mediator","Een moderator"],"a":3,"u":"Een moderator versterkt de correlatie tussen twee variabelen. Een mediator verklaart die correlatie beter, terwijl een confounder een gemeenschappelijke achterliggende oorzaak is."},{"t":"3","q":"Wat is het kenmerkende verschil tussen een factoriële ANOVA en een enkelvoudige (one-way) ANOVA?","o":["Een factoriële ANOVA werkt altijd met afhankelijke (niet-onafhankelijke) groepen","Een factoriële ANOVA gebruikt meer dan één categorische onafhankelijke variabele","Een factoriële ANOVA gebruikt een continue in plaats van een categorische uitkomst","Een factoriële ANOVA vervangt de F-waarde door rangen"],"a":1,"u":"Een factoriële ANOVA gebruikt meer dan één categorische onafhankelijke variabele (bijvoorbeeld een two-way ANOVA) en legt zo interactie-effecten bloot."},{"t":"4","q":"Een onderzoeker wil geen a-priori structuur toetsen maar puur op zoek gaan naar onderliggende dimensies in een grote set variabelen om die te reduceren. Welke aanpak past hierbij?","o":["Split file-analyse","Exploratieve factoranalyse","Repeated measures ANOVA","Confirmatorische factoranalyse"],"a":1,"u":"Exploratieve factoranalyse is een zoektocht naar structuur in een set variabelen en dient voor data-reductie. Confirmatorische factoranalyse toetst juist een vooraf op theorie gebaseerde samenhang."},{"t":"4","q":"Wat drukt een factorlading uit in de output van een factoranalyse?","o":["De som van alle unieke varianties","Een schatting van de factorwaarde voor een individu","De hoeveelheid variantie die een hele factor verklaart","De correlatie van elke variabele met de factor"],"a":3,"u":"Een factorlading is de correlatie van elke variabele met de factor, oftewel de coefficient die de samenhang tussen de oorspronkelijke variabele en de factor meet."},{"t":"4","q":"Een variabele laadt significant op meer dan een factor tegelijk. Hoe noemt men zulke variabelen?","o":["Kruisladingen (bridge)","Eigenvectoren","Centroiden","Communaliteiten"],"a":0,"u":"Variabelen die significant laden op meer dan een factor of component worden kruisladingen of bridge-variabelen genoemd."},{"t":"4","q":"Wat is het onderscheidende kenmerk van Principal Component Analysis (PCA) tegenover Principal Factor Analysis (PFA)?","o":["PCA werkt alleen met genormaliseerde eigenvectoren, PFA niet","PCA is confirmatorisch, PFA is exploratief","PCA vertrekt vanuit de totale variantie, PFA enkel vanuit de gemeenschappelijke variantie","PCA gebruikt enkel gemeenschappelijke variantie, PFA de totale variantie"],"a":2,"u":"PCA gaat uit van de totale variantie en vat zoveel mogelijk oorspronkelijke variantie samen in weinig factoren, terwijl PFA enkel uitgaat van de gemeenschappelijke variantie."},{"t":"4","q":"Bij welk soort rotatie blijven de componenten volledig onafhankelijk van elkaar, waardoor het assenstelsel rechthoekig gedraaid wordt?","o":["Kaiser-normalisatie","Functionele componentenanalyse","Scheve (oblique) rotatie via Direct Oblimin","Orthogonale rotatie via Varimax"],"a":3,"u":"Bij orthogonale (factoriele) rotatie zijn de componenten volledig onafhankelijk en wordt het assenstelsel rechthoekig gedraaid; in SPSS gebeurt dit via Varimax. Bij scheve of oblique rotatie mogen componenten wel gerelateerd zijn."},{"t":"4","q":"Wat geeft de eigenwaarde van een dimensie aan in een factoranalyse?","o":["De hoeveelheid variantie die door die dimensie wordt verklaard","De individuele factorscore van een respondent","Het aandeel unieke variantie van een enkele variabele","De correlatie tussen twee variabelen"],"a":0,"u":"De eigenwaarde geeft de hoeveelheid variantie aan die door elke dimensie wordt verklaard; hoe hoger de eigenwaarde, hoe meer variantie de dimensie verklaart."},{"t":"4","q":"Een onderzoeker zet de eigenwaardes uit in een grafiek en zoekt naar de knik om te beslissen hoeveel factoren te behouden. Welke techniek en welk criterium worden hier gecombineerd?","o":["KMO-maat met Bartlett-toets","Scree plot met het Kattell- of elbowcriterium","Identiteitsmatrix met MSA","Spaghetti plot met de hoogtefactor"],"a":1,"u":"In een scree plot worden de eigenwaardes uitgezet en het Kattell- of elbowcriterium kijkt waar de knik zit om te beslissen hoeveel factoren te behouden. Het Kaisercriterium behoudt daarnaast enkel factoren met een eigenwaarde groter dan 1."},{"t":"4","q":"Wat vertelt de communaliteit van een oorspronkelijke variabele je?","o":["Hoeveel variantie de factor in totaal verklaart","Welk deel van de variantie van die variabele door alle dimensies samen wordt verklaard","Of de correlatiematrix bolvormig is","De weging om individuele factorscores te berekenen"],"a":1,"u":"De communaliteit geeft aan welk deel van de variantie in een oorspronkelijke variabele wordt verklaard door alle dimensies samen, berekend als de som van de gekwadrateerde ladingen voor die variabele over de factoren."},{"t":"4","q":"Waarvoor dient de KMO-maat (Kaiser-Meyer-Olkin) bij een factoranalyse?","o":["Ze bepaalt hoeveel factoren je moet behouden op basis van de knik","Ze geeft het percentage unieke variantie van een variabele weer","Ze beoordeelt de kwaliteit van de intercorrelaties en moet groter dan 0,5 zijn","Ze meet de correlatie van elke variabele met haar factor"],"a":2,"u":"De KMO-maat (Kaiser-Meyer-Olkin) is een maat voor de kwaliteit van de intercorrelaties, moet groter zijn dan 0,5 en wordt zeker gerapporteerd."},{"t":"4","q":"Wat toetst de Bartlett's test of sphericity in een factoranalyse?","o":["Of elke variabele perfect voorspeld kan worden door de andere","Of de componenten na rotatie onafhankelijk blijven","Hoeveel variantie elke dimensie verklaart","Of de correlatiematrix een significant aantal correlaties tussen de variabelen bevat"],"a":3,"u":"De Bartlett's test of sphericity toetst of de correlatiematrix een significant aantal correlaties tussen de variabelen bevat; als de toets significant is, wordt de matrix bolvormig genoemd."},{"t":"5","q":"Een onderzoeker wil objecten stapsgewijs groeperen op basis van hun onderlinge gelijkenis, waarbij het eindresultaat de hiërarchische relaties tussen de objecten visueel moet weergeven. Welke output hoort typisch bij deze aanpak?","o":["Een scatterplot van eigenwaarden","Een correlatiematrix","Een dendrogram","Een scree plot"],"a":2,"u":"Bij hiërarchische clustering worden objecten stapsgewijs geclusterd op basis van gelijkenis of afstand. Het resultaat is een dendrogram dat de hiërarchische relaties tussen de objecten weergeeft."},{"t":"5","q":"Bij welke clusteringmethode moet je vooraf zelf bepalen hoeveel clusters je in de oplossing wil hebben?","o":["Single linkage","Agglomeratieve clustering","Ward's methode","K-means clustering"],"a":3,"u":"K-means clustering is een clusteringmethode waarbij je zelf bepaalt hoeveel clusters je wil. In SPSS vind je dit onder Analyze, Classify, K-means cluster."},{"t":"5","q":"Agglomeratieve clustering wordt omschreven als een bottom-up benadering. Wat is kenmerkend voor het startpunt van deze benadering?","o":["De objecten worden willekeurig aan een vast aantal centra toegewezen","Alle objecten zitten aanvankelijk in één grote cluster die stapsgewijs wordt opgesplitst","Het aantal clusters wordt vooraf vastgelegd op basis van een scree plot","Elk object vormt aanvankelijk een afzonderlijke cluster die daarna iteratief wordt samengevoegd"],"a":3,"u":"Agglomeratieve clustering is een bottom-up benadering waarbij men begint met elk object als een afzonderlijke cluster en vervolgens iteratief de meest vergelijkbare clusters samenvoegt tot alle objecten in één cluster zitten."},{"t":"5","q":"Twee afstandsmaten vallen onder de Minkowski metriek. Wat is het onderscheid tussen de city block (Manhattan) afstand en de Euclidische afstand?","o":["City block is de vogelvlucht (rechte lijn), Euclidisch volgt de baan rond de blokken","City block kan enkel bij K-means, Euclidisch enkel bij hiërarchische clustering","City block neemt de som van de absolute verschillen, Euclidisch kwadrateert de verschillen en benadrukt de kortste rechte lijn","Beide maten leveren altijd exact dezelfde afstandswaarde op"],"a":2,"u":"Bij p=1 (city block/Manhattan) neem je de som van de absolute verschillen zonder te kwadrateren, de baan rond de blok. Bij p=2 (Euclidisch) kwadrateer je de verschillen en benadruk je de kortste rechte lijn, de vogelvlucht, vergelijkbaar met de stelling van Pythagoras."},{"t":"5","q":"Bij een samenvoegingsmethode wordt de afstand tussen twee clusters bepaald door de minimale afstand tussen een paar punten uit de afzonderlijke clusters. Hoe heet deze methode, ook wel nearest neighbour in SPSS?","o":["Average linkage","Ward's methode","Single linkage","Complete linkage"],"a":2,"u":"Single linkage (enkelvoudige samenvoeging, in SPSS nearest neighbour) bepaalt de afstand tussen twee clusters op basis van de minimale afstand tussen een paar punten uit afzonderlijke clusters."},{"t":"5","q":"Een onderzoeker wil clusters vormen die zo homogeen mogelijk zijn door de variantie binnen elke cluster te minimaliseren bij het samenvoegen. Welke methode past hierbij, en welke afstandsmaat is daarvoor vereist?","o":["Average linkage, met Minkowski afstand p=1","Ward's methode, met squared Euclidische afstand","Single linkage, met city block afstand","K-means clustering, zonder afstandsmaat"],"a":1,"u":"Ward's methode is een agglomeratieve methode die de variantie binnen elke cluster minimaliseert om zo homogeen mogelijke clusters te vormen. Voor Ward moet je de squared Euclidische afstand nemen."},{"t":"6","q":"Wat is de kern van Structural Equation Modeling (SEM)?","o":["Een confirmatorische benadering die latente factoren schat op basis van geobserveerde indicatoren en meetfouten in rekening brengt","Een techniek die uitsluitend geschikt is voor 1 onafhankelijke en 1 afhankelijke variabele","Een methode die causaliteit met zekerheid aantoont tussen geobserveerde variabelen","Een louter exploratieve techniek die zonder theorie clusters opspoort in de data"],"a":0,"u":"SEM is een confirmatorische benadering die latente factoren schat op basis van geobserveerde indicatoren, meetfouten in rekening brengt en complexe modellen met meerdere OV en AV in kaart brengt."},{"t":"6","q":"Een onderzoeker beweert dat SEM causaliteit tussen constructen bewijst. Wat is de correcte nuance volgens de brontekst?","o":["SEM toont causaliteit volledig aan zodra de fit goed is","SEM gaat causaliteit na, maar toont het niet aan","SEM kan geen enkele uitspraak over causale effecten doen","SEM vervangt elk experimenteel design om causaliteit te bewijzen"],"a":1,"u":"Volgens de brontekst gaat SEM causaliteit na, maar toont het die niet aan. Het model kan causale effecten specificeren zonder ze te bewijzen."},{"t":"6","q":"Wat is het doel van een confirmatorische factoranalyse binnen SEM?","o":["Het testen en valideren van hypothesen over de structuur van een set meetbare variabelen","Het samennemen van indicatoren tot item parcels om de steekproef te verkleinen","Het verminderen van de invloed van outliers bij niet normaal verdeelde gegevens","Het vrij laten opduiken van onbekende factoren zonder vooraf gestelde hypothesen"],"a":0,"u":"Confirmatorische factoranalyse test en valideert hypothesen over de structuur van een set meetbare variabelen en onderzoekt de relaties tussen observeerbare variabelen en hun onderliggende latente constructen."},{"t":"6","q":"Wat kenmerkt een just-identified model?","o":["Het bevat alle mogelijke relaties tussen geobserveerde variabelen","Het heeft 0 vrijheidsgraden, waardoor de fit niet beoordeeld kan worden","Het heeft altijd een uitstekende fit-index dankzij veel vrijheidsgraden","Het bevat geen enkele relatie tussen de geobserveerde variabelen"],"a":1,"u":"Een just-identified model heeft 0 vrijheidsgraden en daardoor kan de fit ervan niet beoordeeld worden."},{"t":"6","q":"Een onderzoeker wil weten hoeveel misfit er per vrijheidsgraad is, als indicatie van absolute fit. Welke maat past hierbij?","o":["Goodness of Fit Index (GFI) als incrementele fit-index","Standardised Root Mean Square Residual (RMSR)","Modification index","Root Mean Square Error of Approximation (RMSEA)"],"a":3,"u":"RMSEA is een indicatie van absolute fit en geeft de hoeveelheid misfit per vrijheidsgraad weer; lagere waarden zijn beter."},{"t":"6","q":"Waarom is het gevaarlijk om te veel modification indices te gebruiken bij het aanpassen van een SEM-model?","o":["Je model wordt te specifiek en niet meer veralgemeenbaar, met een shift van confirmatief naar exploratief","De latente variabelen verdwijnen en enkel de indicatoren blijven over","De vrijheidsgraden worden automatisch nul, waardoor de fit perfect wordt","Robuuste foutberekening wordt onmogelijk bij niet normaal verdeelde data"],"a":0,"u":"Te veel modification indices maken het model te specifiek en niet meer veralgemeenbaar, waardoor je verschuift van een confirmatieve naar een exploratieve aanpak."},{"t":"6","q":"Wat is het onderscheidende kenmerk van padanalyse ten opzichte van een volledig SEM-model?","o":["Padanalyse voegt extra latente variabelen toe om de fit te verbeteren","Padanalyse vergelijkt het model steeds met een baseline model","Padanalyse schat causale effecten rechtstreeks tussen geobserveerde variabelen en skipt het measurement model en de latente variabelen","Padanalyse schat enkel de meetfouten en negeert alle causale effecten"],"a":2,"u":"Bij padanalyse worden causale effecten rechtstreeks tussen geobserveerde variabelen geschat, waarbij het measurement model en dus ook de latente variabelen worden overgeslagen."},{"t":"6","q":"In een netwerkanalyse (Pairwise Markov Random Field) stelt een edge (boog) tussen twee nodes iets specifieks voor. Wat?","o":["Een gemiddelde van de gekwadrateerde residuen tussen de twee variabelen","De totale, ongecontroleerde correlatie tussen twee symptomen","De voorwaardelijke afhankelijkheid tussen twee variabelen wanneer je controleert voor alle andere variabelen","De mate waarin een node met alle andere nodes in het netwerk verbonden is"],"a":2,"u":"Een edge is de link tussen twee variabelen als je controleert voor alle andere; in een PMRF stelt een edge de voorwaardelijke afhankelijkheid tussen twee nodes voor. De centraliteit, niet de edge, gaat over hoe verbonden een node in het netwerk is."},{"t":"6","q":"Wat meet bridge centraliteit in een netwerkanalyse?","o":["De mate waarin een node uitsluitend met nodes van dezelfde cluster verbonden is","Het gemiddelde aantal edges dat een willekeurige node bevat","Hoe nodes van een bepaalde cluster met nodes van andere clusters verbonden zijn, vergelijkbaar met kruisladingen in factoranalyse","De hoeveelheid misfit die een node in het gehele netwerkmodel introduceert"],"a":2,"u":"Bridge centraliteit lijkt op normale centraliteitsmaten maar kijkt naar hoe nodes van een bepaalde cluster met nodes van andere clusters verbonden zijn; dit is te vergelijken met de kruisladingen van factoranalyse."},{"t":"6","q":"Wat is de functie van robust error calculation in een SEM-analyse?","o":["Het toevoegen van latente variabelen om de meetfout te elimineren","Het vergelijken van het geschatte model met een saturated model","Het samennemen van indicatoren van dezelfde latente variabele tot item parcels","Het verminderen van de invloed van outliers bij niet normaal verdeelde of heteroscedastische gegevens"],"a":3,"u":"Robust error calculation is een techniek die de effecten van outliers of afwijkende waarnemingen op de schattingen vermindert bij niet normaal verdeelde of heteroscedastische gegevens."}],"theory":[{"h":"Inleiding, data verkennen & enkelvoudige regressie","items":["Regressieanalyse: techniek om een continue variabele te voorspellen aan de hand van een andere continue variabele, waarbij je nagaat hoe y varieert bij veranderingen in x.","Aangepaste R2: variant van R2 die corrigeert voor het aantal predictoren, zodat de waarde niet vanzelf stijgt bij het toevoegen van variabelen.","Collineariteit: onderlinge samenhang tussen predictoren in een meervoudig regressiemodel, waarop je hoort te controleren.","Steekproefverdeling (sample distribution): empirische, gekende frequentieverdeling van de uitkomsten van de steekproef.","Steekproevenverdeling (sampling distribution): theoretische, benaderde kansverdeling van alle mogelijke waarden die een steekproefgrootheid kan aannemen.","Centrale limietstelling: bij herhaald trekken van toevallige steekproeven met voldoende grote n (vuistregel n groter dan 30) benadert de steekproevenverdeling van het gemiddelde een normaalverdeling.","Homoscedasticiteit: de afhankelijke variabelen vertonen vergelijkbare niveaus van variantie over de hele range van de onafhankelijke variabelen.","Heteroscedasticiteit: predicties zijn beter voor sommige waarden van de onafhankelijke variabele dan voor andere.","MCAR (Missing Completely At Random): de oorzaak van het ontbreken van data ligt niet aan de test.","MAR (Missing At Random): er is een link tussen de variabele en de missing data, maar de oorzaak is niet de variabele zelf.","Non-random missingness: systematisch missende gegevens die te wijten zijn aan procedurele factoren.","Listwise deletion: alle gegevens van een subject verwijderen zodra er bij die persoon data ontbreekt.","Pairwise deletion: enkel het ontbrekende gegeven van een subject verwijderen en de overige beschikbare gegevens nog gebruiken.","Dummy variabele: dichotome variabele (waarde 0 of 1) die één categorie van een niet-metrische onafhankelijke variabele representeert.","Mahalanobis: techniek waarmee je extreme waarden (outliers) kunt detecteren.","Fit: de voorspelde waarden van de afhankelijke variabele, berekend door de regressievergelijking toe te passen op de onafhankelijke variabele(n) en de geschatte regressiecoëfficiënt(en)."]},{"h":"Meervoudige & logistische regressie","items":["Meervoudige regressie: voorspelt een continue AV uit meerdere OV, ook bruikbaar wanneer OV categorisch, binair of nominaal zijn via dummy's.","Aangepaste (adjusted) R2: verlaagt de R2 naarmate er minder waarnemingen per variabele zijn, geschikt om modellen met verschillende aantallen variabelen te vergelijken.","Gestandaardiseerde beta: geeft aan met hoeveel standaardafwijkingen de AV toeneemt als de OV met een standaardafwijking stijgt.","Multicollineariteit: de onderlinge verbanden tussen OV, wat de errors, betrouwbaarheidsintervallen en p-waarden vergroot.","Tolerantie: maat voor multicollineariteit, het percentage variantie van een OV dat niet door de andere OV verklaard wordt, moet minstens 50% zijn.","Variance Inflation Factor (VIF): een andere manier om tolerantie uit te drukken via 1 gedeeld door de tolerantie.","Logistische regressie: herleidt de AV naar een nominale of ordinale schaal, binair bij twee categorieen en multinomiaal bij meer dan twee.","Odds: de kans op succes ten opzichte van de kans op mislukking, lopend van 0 tot plus oneindig.","Logit (log odd unit): de odds herleid naar een eindeloze schaal zodat dichotome variabelen op een continue wijze voorspeld kunnen worden.","Pseudo R2 maten: geven de model of fit aan bij dichotome variabelen, met Cox & Snell en Nagelkerke als voorbeelden.","Hosmer test: een goodness of fit test voor logistische regressiemodellen.","Parsimonie: de AV zo goed mogelijk voorspellen met zo min mogelijk OV.","Statistische versus klinische significantie: statistisch bij p kleiner dan 0,05, klinisch wanneer het effect klinisch relevant is met een grote effectgrootte.","Normaliteitstoetsen: Kolmogorov-Smirnov bij kleine n en Shapiro-Wilcoxon bij grote steekproeven, normaal verdeeld indien p groter dan 0,05."]},{"h":"Variantie-analyse (ANOVA/MANOVA)","items":["ANOVA: techniek om verschillen in een continue variabele tussen categorische groepen te ontdekken.","Omnibustest: vergelijkt de verklaarde met de niet-verklaarde variantie om de globale model fit na te gaan.","Capitalizing by chance: door veel testen uit te voeren stijgt het totale risico op een Type I fout (permissief).","Bonferroni correctie: deelt de p-waarde door het aantal gevallen; conservatief, dus meer kans op Type II fout.","Levene's test: toetst homoscedasticiteit bij ANOVA (p<0,05 betekent heteroscedasticiteit).","Post-hoc testing: testen die men uitvoert nadat een significante ANOVA is vastgesteld, zoals paarsgewijze t-tests.","Contrast: post-hoc test die kanskapitalisatie tegengaat en meer power heeft dan de F-waarde van ANOVA.","Partiele eta-kwadraat: maat voor de effectgrootte bij ANOVA.","Factoriele ANOVA: ANOVA met meer dan één categorische OV die interactie-effecten bloot legt.","Interactie-effect: de invloed van een OV op de AV verschilt naargelang een andere OV.","Repeated measures ANOVA: gebruikt wanneer de groepen in de OV niet onafhankelijk van elkaar zijn.","Sfericiteit: de variantie van de verschillen tussen metingen is constant over alle combinaties; getoetst met Mauchly's W.","Mixed model ANOVA: combineert between- en within-subjects om hoofd- en interactie-effecten te onderzoeken.","Moderator versus mediator: een moderator versterkt de correlatie, een mediator verklaart ze beter."]},{"h":"Factoranalyse","items":["Factoranalyse: techniek om data te reduceren en samen te vatten door onderliggende dimensies te vinden.","Exploratieve factoranalyse: zoektocht naar structuur in een set variabelen zonder vooraf bepaalde theorie.","Confirmatorische factoranalyse: toetsen van een a-priori samenhang tussen variabelen op basis van theorie of eerder onderzoek.","Factor: een groepje variabelen dat sterk correleert of samen oplaadt op een onderliggend construct.","Factorlading: de correlatie van elke oorspronkelijke variabele met de factor.","KMO (Kaiser-Meyer-Olkin): maat voor de kwaliteit van de intercorrelaties, moet groter zijn dan 0,5 en wordt zeker gerapporteerd.","Bartlett's test of sphericity: toetst of de correlatiematrix een significant aantal correlaties bevat; significant betekent bolvormig.","Communaliteit: het deel van de variantie van een variabele dat door alle dimensies samen wordt verklaard, als som van de gekwadrateerde ladingen.","Eigenwaarde: de hoeveelheid variantie die door een dimensie wordt verklaard; hoger betekent meer verklaarde variantie.","PCA (Principal Component Analysis): vertrekt vanuit de totale variantie en vat zoveel mogelijk oorspronkelijke variantie samen.","PFA (Principal Factor Analysis): vertrekt enkel vanuit de gemeenschappelijke variantie, in SPSS Principal Axis Factoring.","Orthogonale rotatie: componenten blijven onafhankelijk, assenstelsel wordt rechthoekig gedraaid, in SPSS Varimax.","Scheve (oblique) rotatie: componenten mogen aan elkaar gerelateerd zijn, in SPSS Direct Oblimin.","Scree plot: grafiek van eigenwaardes waarbij het Kattell-criterium naar de knik kijkt en het Kaisercriterium factoren met eigenwaarde onder 1 weglaat."]},{"h":"Clusteranalyse","items":["K-means clustering: clusteringmethode waarbij je zelf vooraf bepaalt hoeveel clusters je wil (SPSS: Analyze, Classify, K-means cluster).","Hiërarchische clustering: objecten worden stapsgewijs geclusterd op basis van gelijkenis of afstand, met een dendrogram als resultaat.","Dendrogram: boomdiagram dat de hiërarchische relaties tussen de geclusterde objecten weergeeft.","Agglomeratieve clustering: bottom-up benadering die start met elk object als eigen cluster en telkens de meest vergelijkbare clusters samenvoegt tot één cluster.","Iteratie: herhaling van een stap in het clusteringproces.","Minkowski metriek: overkoepelende afstandsmaat om de afstand tussen punten in een meerdimensionale ruimte te meten.","City block / Manhattan afstand (p=1): som van de absolute verschillen tussen de coördinaten, zonder te kwadrateren, de baan rond de blok.","Euclidische afstand (p=2): kortste rechte lijn tussen twee punten (vogelvlucht), waarbij de verschillen gekwadrateerd worden, vergelijkbaar met Pythagoras.","Single linkage (nearest neighbour): afstand tussen clusters is de minimale afstand tussen een paar punten uit afzonderlijke clusters.","Complete linkage: afstand tussen clusters is de maximale afstand tussen een paar punten uit afzonderlijke clusters.","Average linkage: afstand tussen clusters is de gemiddelde afstand tussen twee afzonderlijke clusters.","Cluster membership: de toewijzing van individuele waarnemingen aan specifieke clusters in de analyse.","Ward's methode: agglomeratieve methode die de variantie binnen elke cluster minimaliseert voor zo homogeen mogelijke clusters, met squared Euclidische afstand.","ESS (error sum of squares): de coëfficiënten die je verkrijgt via Ward's methode."]},{"h":"SEM & netwerkanalyses","items":["SEM: confirmatorische benadering die latente factoren schat uit geobserveerde indicatoren, meetfouten in rekening brengt en meerdere OV en AV modelleert; gaat causaliteit na maar toont die niet aan.","Confirmatorische factoranalyse: techniek om hypothesen over de structuur van meetbare variabelen te testen en de relaties met onderliggende latente constructen te onderzoeken.","Latent construct: iets dat niet rechtstreeks observeerbaar is en met een meetinstrument (via indicatoren) gemeten moet worden.","Just-identified model: model met 0 vrijheidsgraden, waarvan de fit niet beoordeeld kan worden.","Baseline model: model zonder relaties tussen de geobserveerde variabelen.","Saturated of unconstrained model: model met alle mogelijke relaties tussen de geobserveerde variabelen.","RMSEA: indicatie van absolute fit die de hoeveelheid misfit per vrijheidsgraad aangeeft; lagere waarden zijn beter.","Incremental fit indices: fit-maten die het model vergelijken met het baseline model.","Modification index: het toevoegen of verwijderen van specifieke parameters; te veel gebruik maakt het model te specifiek en niet meer veralgemeenbaar (shift van confirmatief naar exploratief).","Padanalyse: schat causale effecten rechtstreeks tussen geobserveerde variabelen en slaat het measurement model en de latente variabelen over.","Robust error calculation: techniek om de invloed van outliers te verminderen bij niet normaal verdeelde of heteroscedastische gegevens.","Netwerkanalyse: maakt visuele relaties tussen symptomen mogelijk; een undirected netwerk kan gebruikt worden voor niet-oorzakelijke verbanden.","Edge en node: een edge is de link tussen twee variabelen als je voor alle andere controleert, een node is de knoop die een specifieke componentvariabele voorstelt.","Centraliteit en bridge centraliteit: centraliteit is de mate waarin een variabele met andere variabelen verbonden is, bridge centraliteit kijkt hoe nodes van een cluster met nodes van andere clusters verbonden zijn, vergelijkbaar met kruisladingen in factoranalyse.","Pairwise Markov Random Fields (PMRF): undirected netwerk met edges die de voorwaardelijke afhankelijkheid tussen twee nodes voorstellen."]}],"hacks":[{"h":"Listwise = Lijst weg","t":"Bij Listwise deletion gooi je de hele Lijst (het volledige subject) weg zodra er iets ontbreekt. Pairwise houdt de rest van het Paar aan gegevens wel, en schrapt enkel het ene ontbrekende punt."},{"h":"Continu of hokjes?","t":"Kies de techniek op basis van de AV. Is de AV een continue meetwaarde, dan lineaire of meervoudige regressie. Valt de AV in hokjes (categorieen), dan logistische regressie, binair bij twee hokjes en multinomiaal bij meer."},{"h":"Levene voor de start, Mauchly voor de herhaling","t":"Levene's test check je vooraf bij een gewone ANOVA (gelijke varianties tussen groepen). Mauchly's W hoort bij herhaalde metingen en toetst de bolvormigheid tussen condities. Zo verwar je de twee assumptietoetsen niet."},{"h":"PCA versus PFA: Totaal versus Gedeeld","t":"PCA begint met een P van Plaatje-van-alles: het gebruikt de totale variantie. PFA staat voor de Focus op wat variabelen gemeen hebben, dus enkel de gemeenschappelijke variantie."},{"h":"Single = Minimum, Complete = Maximum","t":"Onthoud de linkage-methoden via het uiteinde van het woord: Single linkage kijkt naar de kleinste (minimale) afstand tussen twee punten, Complete linkage naar de grootste (maximale) afstand, en Average zit er letterlijk gemiddeld tussenin."},{"h":"Confirmatief blijven","t":"SEM en confirmatorische factoranalyse zijn CONFIRMATIEF: je test een vooraf bedacht model. Zodra je te veel modification indices toevoegt, verschuif je naar exploratief en verlies je de veralgemeenbaarheid. Onthoud: modificeren mag, maar overdrijven verandert je speurtocht in gokwerk."}]};
</script>

    var html='<div class="card pad" style="margin-bottom:16px"><h2 style="margin:0 0 6px">Studie-hacks</h2><p class="muted" style="margin:0">Ezelsbruggetjes om de kernideeën van Statistiek IV te onthouden.</p></div>'+
      '<div class="tipgrid">'+D.hacks.map(function(t){return '<div class="tip"><h4>'+ic("bulb")+esc(t.h)+'</h4><p>'+esc(t.t)+'</p></div>';}).join("")+'</div>';
    setHTML(html);
  }

  function renderFeedback(){
    var html='<div class="card pad"><h2 style="margin-top:0">Feedback &amp; klachten</h2>'+
      '<p class="muted">Fout in een vraag, een idee, of werkt iets niet? Laat het hier weten, het komt rechtstreeks bij de maker terecht. Een review of compliment mag ook: de mooiste tonen we op de hub. 💬</p>'+
      '<label class="fld" for="fbMsg">Je bericht</label><textarea id="fbMsg" rows="5" placeholder="Beschrijf de fout of je idee…"></textarea>'+
      '<label class="fld" for="fbWaar">Over welke vraag? <span class="muted">(optioneel)</span></label><input type="text" id="fbWaar" placeholder="bv. de vraag over de p-waarde">'+
      '<label class="fld" for="fbNaam">Je naam <span class="muted">(optioneel)</span></label><input type="text" id="fbNaam" placeholder="zodat we je kunnen bedanken">'+
      '<label class="fld" for="fbEmail">Je e-mail <span class="muted">(optioneel, als je een antwoord wilt)</span></label><input type="email" id="fbEmail" placeholder="naam@voorbeeld.be">'+
      '<input type="text" id="fbBot" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0">'+
      '<div class="row" style="margin-top:16px;align-items:center"><button class="btn" id="fbSend">'+ic("send")+'Versturen</button><span id="fbStatus" style="font-size:13px"></span></div></div>';
    setHTML(html);
    document.getElementById("fbSend").onclick=function(){
      var status=document.getElementById("fbStatus");
      if(document.getElementById("fbBot").value) return;
      var msg=document.getElementById("fbMsg").value.trim();
      if(!msg){ status.style.color="var(--bad)"; status.textContent="Schrijf eerst een bericht."; return; }
      var btn=document.getElementById("fbSend"); btn.disabled=true; status.style.color="var(--muted)"; status.textContent="Versturen…";
      var em=document.getElementById("fbEmail").value.trim();
      var nm=document.getElementById("fbNaam").value.trim();
      var waar=document.getElementById("fbWaar").value.trim();
      var payload={_subject:"Statistiek IV-tool: feedback", _template:"table", _captcha:"false",
        Naam:nm||"-", Over_welke_vraag:waar||"-", email:em||"-", Bericht:msg};
      if(em) payload._replyto=em;
      // vangnet: als de verzenddienst blokkeert (bv. spamfilter) of er is geen verbinding,
      // bieden we een directe mailto-knop aan zodat de melding NOOIT stilletjes verdwijnt.
      function failFallback(reden){
        var body="Feedback Statistiek IV-tool%0D%0A%0D%0ANaam: "+encodeURIComponent(nm||"-")+"%0D%0AOver welke vraag: "+encodeURIComponent(waar||"-")+"%0D%0AE-mail: "+encodeURIComponent(em||"-")+"%0D%0A%0D%0ABericht:%0D%0A"+encodeURIComponent(msg);
        var mailto="mailto:berat007yildirim@gmail.com?subject="+encodeURIComponent("Statistiek IV-tool: feedback")+"&body="+body;
        setHTML('<div class="card pad"><h2 style="margin-top:0">Automatisch versturen lukte niet</h2><p class="muted">'+reden+' Geen zorgen, klik hieronder en je melding wordt geopend in je e-mail, helemaal klaar om te versturen:</p><a class="btn" href="'+mailto+'">'+ic("send")+'Mail mijn melding direct</a><div style="margin-top:14px"><button class="btn ghost" id="bk">Terug naar start</button></div></div>');
        document.getElementById("bk").onclick=function(){go("home");};
      }
      fetch("https://formsubmit.co/ajax/Berat007yildirim@gmail.com",{method:"POST",headers:{Accept:"application/json"},body:new URLSearchParams(payload)})
        .then(function(r){return r.json();}).then(function(d){
          if(d&&(d.success===true||d.success==="true")){ setHTML('<div class="card pad results center"><div style="font-size:42px">✅</div><h2 style="margin:6px 0">Bedankt!</h2><p class="muted">Je melding is verstuurd.</p><button class="btn" id="bk" style="margin-top:8px">Terug naar start</button></div>'); document.getElementById("bk").onclick=function(){go("home");}; }
          else { failFallback("Het automatisch versturen lukte niet."); }
        }).catch(function(){ failFallback("Er was even geen verbinding."); });
    };
  }

  document.addEventListener("keydown",function(e){ if(state.key) state.key(e); });
  // bezoeker tellen (1x per toestel)
  try{ if(!localStorage.getItem("stat4_seen")){ localStorage.setItem("stat4_seen","1"); bump("berat-stat4","gebruikers"); } }catch(e){ bump("berat-stat4","gebruikers"); }
  // traject vanuit de hub overnemen → direct naar de oefenpagina
  try{ var _q=new URLSearchParams(location.search); var _m=_q.get("m");
    if(_m==="training"||_m==="herkansing"){ state.track=_m; lset("stat4_track",_m);
      var _c=_q.get("calm"); if(_c!=null){ calm=(_c!=="0"); lset("stat4_calm",calm); applyCalm(); }
      state.step="practice"; state.fromHub=true; }
  }catch(e){}
  render();
  // launch-splash netjes laten verdwijnen
  (function(){ var _sp=document.getElementById("splash"); if(!_sp) return; var _red=false; try{_red=window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){} setTimeout(function(){ _sp.classList.add("hide"); setTimeout(function(){ if(_sp&&_sp.parentNode) _sp.parentNode.removeChild(_sp); }, 700); }, _red?300:1850); })();
})();
</script>
