t winst."},{"t":"9","q":"Waarop moet een organisatie letten bij het opstellen van een pay structure om competitief te zijn?","o":["Je vergelijkt werknemers van je eigen bedrijf met die van andere bedrijven zodat het loon competitief is","Het loon moet elk jaar met minstens 10 procent stijgen","Je vergelijkt enkel functies binnen je eigen bedrijf, want interne verhoudingen bepalen of een loon competitief is","Enkel het diploma van de werknemer telt bij de loonbepaling"],"a":0,"u":"Bij een pay structure vergelijk je lonen intern tussen eigen werknemers en extern met andere bedrijven, zodat het loon competitief blijft. Dit hangt samen met het doel van equity."}],"theory":[{"h":"Inleiding HRM & HR-rollen","items":["Sustainable competitive advantage: een capaciteit die waarde creëert voor klanten en die rivalen niet snel of makkelijk kunnen kopiëren, waardoor de organisatie zich differentieert.","Resource based view: theorie die stelt dat mensen als resources een concurrentievoordeel bieden wanneer ze waardevol, zeldzaam, moeilijk te imiteren en niet-substitueerbaar zijn.","KSAO's: de skills, kennis en capaciteiten van werknemers die in balans moeten zijn met hun motivatie om productief te zijn.","Bundels van resources: middelen zoals financiën, human resources en technologie die samenwerken om een basis voor concurrentievoordeel te vormen.","Alignment: het afstemmen van HR op de strategie, zowel verticaal als horizontaal.","Contingency theory: theorie die stelt dat er geen universele best practices zijn, omdat de beste HR-aanpak afhangt van de context en de strategie.","AMO framework: model dat stelt dat naast Abilities en Motivation ook de Opportunity to participate nodig is voor goede prestaties.","Discretionary effort: de inspanning die mensen kunnen leveren als ze willen, boven het minimaal vereiste.","Cost center: een departement dat geld kost en geen winst oplevert, zoals HR vroeger werd gezien.","Productivity center: hoe HR nu wordt getypeerd, omdat het via hogere productiviteit van werknemers bijdraagt aan de winstgevendheid.","Administratieve expert: Ulrich-rol gericht op het optimaliseren van dagelijkse processen en infrastructuur, vaak administratief van aard.","Employee champion: Ulrich-rol gericht op een gemotiveerd en competent personeel, met aandacht voor work engagement en het psychologisch contract.","Change agent: Ulrich-rol gericht op de toekomst, die werknemers voorbereidt op verandering en de verandering laat beklijven (refreezing).","Strategische partner: Ulrich-rol die HR oplijnt met de business strategie en zo de zichtbaarheid en waarde van HR duidelijk maakt."]},{"h":"Geschiedenis van HR","items":["Cost center: onderdeel van de organisatie dat geen omzet of winst binnenbrengt, zoals HR vroeger werd gezien.","Gilden: verenigingen van ambachtslieden die bepaalden wie een vak mocht uitoefenen, welke skills geleerd moesten worden en wanneer er gewerkt werd, de HRM van toen.","Interne versus externe arbeidsmarkt: de verschuiving van zelfstandig werk naar werken als werknemer onder een baas tijdens de industriele revolutie.","Rationalization of work: het vergroten van de effectiviteit door het productieproces te vereenvoudigen, met arbeidsverdeling op basis van taken in plaats van vaardigheden.","Labor division: het opdelen van werk in gespecialiseerde subtaken, waardoor het werk repetitief en saai wordt en weinig skills vereist.","Autocratisch leiderschap: directief en hierarchisch leiderschap dat motiveert via beloning en straf en absolute gehoorzaamheid eist.","Paternalistisch leiderschap: de baas als vaderfiguur die bescherming biedt en in ruil extreme loyaliteit en eerbied verwacht.","Industrial welfare: welzijnsvoorzieningen die de indruk wekten van betrokkenheid, vaak enkel voor niet-vakbondsleden, om loyaliteit te bevorderen.","Trade unions: vakbonden die ontstonden als reactie op demotivatie, lage lonen en het mishandelen van werknemers.","Scientific management: rationele benadering van Frederick Taylor die werk opbreekt in componenten om wetenschappelijk de beste werkwijze te bepalen.","Human relations movement: reactie op het taylorisme die aantoont dat sociale en psychologische behoeften de productiviteit beinvloeden, bevestigd door de Hawthorne-experimenten.","Theorie X en Y: theorie X ziet werknemers als lui en controleerbaar, theorie Y als intrinsiek gemotiveerd en creatief.","Resource based view: benadering waarbij mensen als een resource of bron worden gezien die concurrentievoordeel kan opleveren.","Strategic HRM: HR als strategische partner en change agent, waarbij men met minder mensen meer doet en beter probeert te zijn dan concurrenten."]},{"h":"De toekomst van HRM","items":["Cost center: een onderdeel van de organisatie dat geen omzet of winst genereert, zoals HR vroeger werd gezien.","Revenue center: een afdeling die geldelijke opbrengsten genereert voor de organisatie.","Productivity center: een revenue center dat de winstgevendheid verhoogt door de productiviteit van de mensen te vergroten, de ideale kijk op HR vandaag.","Theory X: de aanname dat je werknemers niet kan vertrouwen, wat autonomie wegneemt en bij bedreiging tot controlemodus leidt.","Evidence-based HRM: beslissingen nemen op basis van betrouwbare informatie in plaats van willekeurig of intuïtief.","Organisational evidence: informatie die beschikbaar is binnen de organisatie, zoals selectie- en gebruikersdata.","Experiental evidence: kennis uit je eigen ervaringen en geleerde lessen uit het verleden.","Pyramid of trust: rangschikking van bewijs, met systematische reviews en meta-analyses bovenaan en non-peer review onderaan.","HR-outsourcing: HR-activiteiten uitbesteden, gaande van out-tasking en co- of multi-sourcing tot business process outsourcing.","Talent management: focussen op spilposities (A-posities) en topmedewerkers (A-spelers) die een onevenredige bijdrage leveren en meer middelen krijgen.","Sustainable HRM: HRM met aandacht voor de mens (emoties en noden) en voor de human resource (belangrijk voor de strategie).","Job crafting: het idee dat jobs niet vastliggen en dat werknemers verantwoordelijkheid nemen om hun job aan te passen.","New ways of working: het gegeven dat mensen altijd en overal kunnen werken, waarbij enkel een laptop nodig is.","Engagement: toewijding (dedication) en inzet (commitment) bij het werk, vaak verbonden met intrinsieke motivatie."]},{"h":"Resource Based View & alignment","items":["Resource based view: benadering die focust op de interne resources die al in het bedrijf aanwezig zijn als bron van voordeel.","Valuable (waardevol): menselijke resources zijn waardevol omdat mensen van elkaar verschillen en verschillende jobs met verschillende skills uitoefenen.","Rare (zeldzaam): hoogwaardige menselijke prestaties zijn zeldzaam, wat de 20/80-vaststelling illustreert waarbij weinig toppresteerders het gros van de prestaties leveren.","Talentmanagement: het identificeren, selecteren en trainen van de kleine groep toppresteerders die verantwoordelijk zijn voor de meeste prestaties.","Inimitable: menselijke resources zijn moeilijk te imiteren omdat ze afhangen van cultuur, teamdynamiek, persoonlijkheid en KSAOs.","Path dependency: historisch gegroeide, met het bedrijf verbonden regels en cultuur die moeilijk te kopieren zijn.","Causal ambiguity: het is vaak onduidelijk waarom een team hoog presteert, wat imitatie bemoeilijkt.","Social complexity: opgebouwde formele en informele netwerken waarin kennis makkelijker gedeeld wordt.","Emergence: hoe afhankelijker mensen van elkaar en het bedrijf zijn, hoe meer ze elkaar stimuleren; gedrag is de som van individuele en contextuele karakteristieken.","Non-substitutable: menselijke resources zijn moeilijk vervangbaar omdat kopieren moeilijk is door historische, causale en sociale factoren.","Alignment: HR-systeem en onderdelen moeten hetzelfde doel nastreven en op elkaar afgestemd zijn, wat samen SHRM vormt.","Strategie: lange termijn is de visie, korte termijn bepaalt welke acties en resources ingezet worden om winst te maken.","Sustainable competitive advantage: capaciteit die waarde creeert voor klanten en die rivalen niet snel of makkelijk kunnen kopieren.","Generieke strategieen van Porter: kostenleiderschap (lagere kosten), differentiatie (uniek aanbod tegen premium prijs) en focus (nichemarkt).","Organisatiestructuur: complexity (verticale, horizontale en ruimtelijke differentiatie), formalization (standaardisatie) en centralization (concentratie van beslissingen).","Michigan Matching model: benadrukt horizontale overeenstemming tussen firmastrategie en HR-praktijken zoals performance appraisal, compensatie en training."]},{"h":"HR-metrics & functieanalyse","items":["Benchmarking: je organisatie vergelijken met andere bedrijven, wat vaak moeilijk is omdat elke organisatie uniek is.","HRMS: Human Resource Management Systems, systemen die HR-data meten en bewaren in een database om situaties te beschrijven en te voorspellen.","HR scorecard: instrument dat via een strategie-map relevante HR-indicatoren verzamelt, opgebouwd uit deliverables, performance drivers, enablers en doables.","HR deliverables: gedrag en uitkomsten die direct verband houden met de strategie, bijvoorbeeld het aantal gemaakte patenten.","HR performance drivers: persoonlijke eigenschappen of KSAO's die aanwezig moeten zijn om HR deliverables te bereiken.","HR doables: KPI's zoals gewerkte uren of aantal getrainde mensen, die niet noodzakelijk een effect hebben op de strategie.","HR analytics: het voorspellen van uitkomsten en het effect van interventies, in tegenstelling tot HR metrics die de situatie enkel beschrijven.","HR triad: het decentraliseren van HR-activiteiten naar lijnmanagers en werknemers, waarbij iedereen mee verantwoordelijk is voor ontwikkeling.","Job description: identificeert de belangrijkste taken, plichten en verantwoordelijkheden van een job, oftewel wat de job is.","Job specification: identificeert de kwalificaties die iemand nodig heeft om de taken uit de job description uit te voeren.","SME's: Subject Matter Experts als informatiebron, met risico op bias en een normatieve kijk op hoe het werk zou moeten gebeuren.","O*NET: database met beroepsvereisten en werknemersattributen die de D.O.T. vervangt en voortdurend bijgewerkt wordt.","Competentie: een cluster van gedrag met observeerbare en meetbare gedragsindicatoren, gelinkt aan core competences en de resource based view.","Scenario planning: strategic job modeling waarbij men denkt aan meerdere mogelijke toekomsten om te bepalen wat relevant is voor jobs die nog niet bestaan."]},{"h":"Werving (recruitment)","items":["Recruitment: het identificeren en motiveren van geschikte mensen om applicant te blijven en te solliciteren.","Selectie: het afromen van een gekwalificeerde applicant pool op basis van criteria, waarbij de macht naar de organisatie verschuift.","Michigan Matching Model: traditioneel recruitmentmodel met een feedbackloop van in dienst nemen, performance, beoordeling en compensatie of training.","Verticale uitlijning: het afstemmen van de bedrijfsstrategie op het HR-systeem, bijvoorbeeld selecteren op creativiteit bij een innovatiestrategie.","Homogeniteit versus heterogeniteit: kiezen voor gelijkaardige mensen (complementair) of net verschillende mensen die meer innovatie brengen (supplementair).","Interne recruitment: aanwerven van binnenuit, goedkoper en met opklimmogelijkheden, past het beste bij cost-leadership.","Peter principle: mensen worden gepromoveerd tot het niveau waarop ze niet meer effectief zijn.","Externe recruitment: aanwerven van buitenaf, meer innovatie en diverse kandidaten, past het beste bij differentiation.","Targeted recruitment: het recruitmentbericht aanpassen aan de persoon die je wilt aanwerven, bijvoorbeeld campus recruitment voor makkelijk aan te leren jobs.","Formele recruitmentbron: online en toegankelijk voor iedereen, levert meer en diversere kandidaten op.","Informele recruitmentbron: niet voor iedereen toegankelijk, levert vaak betere maar homogenere kandidaten op met eerlijkere jobinformatie.","Employer branding: een sterk werkgeversmerk opbouwen zodat applicanten en insiders zich meer betrokken voelen.","Employer value proposition: het communiceren van de kernwaarden van de organisatie en waarom die verschilt van andere bedrijven.","Employer image dimensions: instrumentele (tastbare, nut) versus symbolische (niet-tastbare) attributen die job pursuit intentions voorspellen.","E-recruitment: online werven, goedkoper en grotere populatie, maar met een risico op minder gekwalificeerde kandidaten."]},{"h":"Selectie & psychometrie","items":["Werkanalyse (job analysis): het startpunt van alle HR-functies, waarbij de KSAO's worden geanalyseerd om te bepalen wat goede performantie is.","Criterion domain: de performantie die we via selectie willen voorspellen, opgesplitst in task, contextual en counterproductive performance.","Task performance: prestaties die letterlijk in de jobbeschrijving staan, ook in-role performance genoemd.","Contextual performance: extra inzet die verder gaat dan de jobbeschrijving, zoals collega's helpen (organisationeel burgerschap).","Criteriumdeficiëntie: het conceptuele criterium (wat echt belangrijk is en gedaan moet worden) wordt niet volledig door de meting gedekt.","Criteriumbesmetting: de meting bevat irrelevante invloeden en geeft daardoor niet zuiver weer wat we willen meten.","Predictor construct: de informatie of eigenschappen (bv. IQ, EQ) die nodig zijn om toekomstige prestaties te voorspellen.","Sign versus sample: een sign leidt geschiktheid af uit algemene kenmerken (indicatie), een sample laat het relevante gedrag effectief tonen (bewijs).","BIG-5 (OCEAN): vijf normaal verdeelde persoonlijkheidstrekken, namelijk openness, conscientiousness, extraversion, agreeableness en neuroticism.","Constructvaliditeit: aantonen via opeenstapeling van bewijs dat een test daadwerkelijk het bedoelde construct meet.","Voorspellende validiteit: aantonen dat testscores van sollicitanten samenhangen met hun latere werkprestatiescores.","Interrater reliability: de mate waarin verschillende beoordelaars dezelfde kandidaat op eenzelfde manier inschatten.","Selection ratio: het aantal geaccepteerde kandidaten gedeeld door het totale aantal sollicitanten.","Adverse impact: ongelijke uitkomsten van een selectie-instrument voor bepaalde groepen, bv. etnische verschillen in IQ-scores die op testbias kunnen wijzen."]},{"h":"Training, ontwikkeling & performance","items":["Training als investering: training zien als investering in plaats van kost, omdat werknemers daardoor beter presteren.","Development: gericht op de lange termijn en breder dan gewone training.","Needs analysis: behoefteanalyse in drie subanalyses op organisatie-, task- en personniveau.","AMO-model: kader dat aan action learning wordt gelinkt, waarbij de werknemer inspraak en betrokkenheid krijgt.","Transfer: het doortrekken van geleerd gedrag naar de werkplek, waarbij de werkomgeving als bemiddelaar tussen learning en transfer werkt.","Zelf-determinatietheorie: theorie waarop het belang van intrinsieke motivatie is gebaseerd, met verschillende vormen van motivatie en regulatie.","Intrinsieke motivatie: in actie komen door interne prikkels, iets doen uit interesse.","Extrinsieke motivatie: in actie komen door externe prikkels, met vormen als external, introjection en identification.","Introjection: iets doen omdat het stemmetje in je hoofd het zegt, bijvoorbeeld om schaamte te voorkomen.","Kirkpatrick-taxonomie: evaluatiemodel met vier niveaus, namelijk reacties, learning, behavior en results.","Performance management: het proces van identificeren, meten, managen en ontwikkelen van de prestatie van medewerkers.","Performance appraisal: het doorlopende proces van het evalueren van werknemersprestatie met regelmatige, eerlijke feedback.","Trait appraisals: beoordeling op basis van persoonskenmerken, moeilijk te rechtvaardigen en snel als persoonlijke aanval ervaren.","Relative rankings: kwantitatieve methode met weinig criteria, waarbij de onderste 10 procent ontslagen wordt en het halo-effect kan meespelen.","Tell and listen: gespreksmethode waarbij de supervisor luistert maar uiteindelijk zelf beslist, ook wel pseudo-democracy genoemd.","Management-by-objectives (MBO): methode gericht op een geaccepteerd doel, gebaseerd op de goal-setting theory van Locke en Latham."]},{"h":"Compensation management","items":["Incentive-effect: de motivationele werking van beloning die het gedrag in het hele bedrijf beinvloedt.","Sorting effect: een beloningssysteem trekt de mensen aan die er het best op afgestemd zijn, zoals risicozoekers bij pay for performance.","Relational return: niet-financiele factoren rond de job en de werkomgeving die als beloning ervaren worden.","Pay for performance: beloning gekoppeld aan prestatie, waarbij beloond gedrag toeneemt maar niet-beloond gedrag verwaarloosd kan worden.","Merit pay: een loonsverhoging die duur is omdat ze jaarlijks herhaald moet worden en pas motiveert vanaf ongeveer 10 procent.","Bonuses: vaak op de firmabonus gebaseerde extra beloning, die werknemers soms niet goed kunnen linken aan hun eigen gedrag.","Sales commissions: beloning per verkoop, in Belgie gecombineerd met een basisloon, met minder focus op langetermijnrelaties.","Piecework en standard hour plans: stukloonvormen zoals straight piece-rate, differential piece-rate en het standard hour plan.","Group pay-for-performance: groepsbeloning waarbij social loafing optreedt, want meer groepsleden betekent minder bijdrage per persoon.","Profit sharing: winstdeling waarbij de causale richting tussen productiviteit en winst onduidelijk is, maar wat werknemers waarderen.","Gainsharing: het delen van besparingen, populairder dan profit sharing en uitgekeerd ook als er geen winst is.","Stock options: aandelenopties die vooral een sorting effect hebben.","Flexibele benefits plans: pakketten van extralegale voordelen die werknemers als fair ervaren.","Pay structure en equity: loonstructuur waarbij intern en extern vergeleken wordt om het loon competitief en billijk te houden."]}],"hacks":[{"h":"AMO onthouden","t":"Denk aan AMO als Ability, Motivation, Opportunity. Skills en motivatie alleen volstaan niet: pas als mensen ook de kans krijgen om te participeren, komt hun discretionary effort echt vrij."},{"h":"Van gild tot strateeg","t":"Onthoud de tijdlijn met GRIPS: Gilden, Rationalisatie (industriele revolutie), Industrial welfare (personnel management), Psychologie van werk (scientific management en human relations) en Strategische HR. Zo loop je de hoofdstukken in de juiste volgorde af."},{"h":"Pyramid of trust: SMRCN","t":"Onthoud de rangorde van bewijs van sterk naar zwak met SMRCN: Systematische review, Meta-analyse, Randomized control, Cross-sectioneel, Non-peer review. Hoe hoger in de piramide, hoe betrouwbaarder de basis voor je HR-beslissing."},{"h":"VRIN onthouden","t":"Denk aan VRIN om te weten wanneer menselijke resources een duurzaam voordeel geven: Valuable, Rare, Inimitable en Non-substitutable. Alleen wie op alle vier scoort, levert een voordeel dat rivalen niet snel kopieren."},{"h":"De 4 D's van de HR scorecard","t":"Onthoud de vier componenten van de HR scorecard als 4 D's: Deliverables (uitkomsten gelinkt aan strategie), Drivers (KSAO's als performance drivers), Doables (KPI's zonder strategie-effect) en enablers als de praktijken die je Doet. De eerste drie beginnen letterlijk met een D, en enablers link je aan Doen zodat je alle vier onthoudt."},{"h":"COST blijft intern","t":"Onthoud de match tussen strategie en bron: Cost-leadership matcht met interne recruitment (goedkoper, kennis blijft binnen), en differentiation matcht met externe recruitment (nieuwe ideeen, meer innovatie). Cost hoort bij Cost-besparen en dus intern."},{"h":"OCEAN voor de BIG-5","t":"Onthoud de vijf persoonlijkheidstrekken met het woord OCEAN: Openness, Conscientiousness, Extraversion, Agreeableness, Neuroticism. Zo vergeet je geen enkele dimensie op het examen."},{"h":"De vier trappen van Kirkpatrick","t":"Onthoud de Kirkpatrick-taxonomie als een ladder van vier niveaus: reacties, learning, behavior en results. Je klimt van hoe deelnemers reageren, naar wat ze leren, naar hun gedrag op de werkplek, tot het effect op de bedrijfsresultaten."},{"h":"ISR: de drie effecten van belonen","t":"Onthoud ISR voor wat belonen doet: Incentive (motivatie in het hele bedrijf), Sorting (je trekt mensen aan die passen bij de beloning) en Relational return (job en werkomgeving als beloning). Zo koppel je elk beloningssysteem meteen aan zijn effect."}]};
</script>

  function renderQuiz(){

    setHTML(html);

    if(tl){ var doel=+tl.getAttribute("data-telop")||0;

      if(stil||doel<=0){ tl.textContent=doel; }
      else { tl.textContent=0; var t0=null, duur=900;
        requestAnimationFrame(function stap(ts){ if(t0===null)t0=ts;
          var p=Math.min(1,(ts-t0)/duur), e=1-Math.pow(1-p,3);
          tl.textContent=Math.round(doel*e);
          if(p<1) requestAnimationFrame(stap); else tl.textContent=doel; }); } }
    var i2=document.querySelector(".bar>i"); requestAnimationFrame(function(){ if(i2) i2.style.width=i2.getAttribute("data-w")+"%"; });
    document.getElementById("backBtn").onclick=function(){ state.quiz=null; renderQuizGate(); };

    var nb=document.getElementById("nextBtn"); nb.onclick=next; var pb=document.getElementById("prevBtn"); if(pb)pb.onclick=function(){ if(Q.idx>0){ Q.idx--; renderQuiz(); } };
    function showAnswered(i){

      var ok=cur.opts[i].ok, fb=document.getElementById("fb"); fb.className="feedback "+(ok?"ok":"no");
      var juist=cur.opts.filter(function(o){return o.ok;})[0].text;
      fb.innerHTML=ok?"<b>"+rnd(PRAISE)+" ✓</b>":"<b>"+wrongLead()+"</b><span class=\"sub\">Juiste antwoord: "+esc(juist)+"</span>";
      var w=document.createElement("div"); w.innerHTML='<div class="whybox"><h4>'+ic("sparkles")+'Waarom?</h4>'+esc(q.u)+'</div>'; fb.appendChild(w);
      nb.classList.remove("hide"); nb.innerHTML=(Q.idx+1>=Q.items.length)?"Bekijk resultaat "+ic("arrowR"):"Volgende "+ic("arrowR");
    }
    function pick(i){ if(Q.answered)return; Q.answered=true; Q.picked=i; Q.picks[Q.idx]=i; var ok=cur.opts[i].ok; if(ok)Q.correct++; else Q.wrong.push(q); recordProg(q.id, ok); showAnswered(i); nb.focus(); }
    optBtns.forEach(function(b){ b.onclick=function(){ pick(+b.dataset.i); }; });
    function next(){ if(!Q.answered)return; Q.idx++; Q.answered=false; Q.picked=-1; if(Q.idx>=Q.items.length)Q.done=true; renderQuiz(); }
    if(Q.answered) showAnswered(Q.picked);
    state.key=function(e){ if(!Q.answered){ var k=e.key.toLowerCase(); var idx="abcde".indexOf(k); if(idx<0&&/[1-5]/.test(k))idx=+k-1; if(idx>=0&&idx<cur.opts.length){pick(idx);e.preventDefault();} } else if(e.key==="Enter"||e.key===" "){ next(); e.preventDefault(); } };

<script>
/* gedeelde interactie: klik-animatie en zacht openschuivende theorieblokken */
(function(){
  // Elk theorieblok krijgt precies een wikkel-element, anders klapt een blok met
  // meerdere kinderen niet volledig dicht (MBG had er tien).
  function wikkel(){
    var lijst=document.querySelectorAll(".acc>.body");
    for(var i=0;i<lijst.length;i++){
      var b=lijst[i];
      if(b.children.length===1 && b.firstElementChild && b.firstElementChild.className==="bes-wrap") continue;
      var w=document.createElement("div"); w.className="bes-wrap";
      while(b.firstChild) w.appendChild(b.firstChild);
      b.appendChild(w);
    }
  }
  var gepland=false;
  function planWikkel(){ if(gepland)return; gepland=true; setTimeout(function(){ gepland=false; wikkel(); },0); }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",wikkel); else wikkel();
  try{ new MutationObserver(planWikkel).observe(document.documentElement,{childList:true,subtree:true}); }catch(e){}
  var KLIK="button,.btn,.iconbtn,.opt,.track,.chrow,.backlink,.chip,.mode,.toggle,.scard,.ccard,.qcard,.srclink,.bnlink,.navlink,.ycard,.excat,.brandstrip,summary";
  document.addEventListener("pointerdown",function(e){
    var el=(e.target&&e.target.closest)?e.target.closest(KLIK):null; if(!el)return;
    el.classList.remove("bes-klik"); void el.offsetWidth; el.classList.add("bes-klik");
    setTimeout(function(){ el.classList.remove("bes-klik"); },260);
  },true);
  document.addEventListener("click",function(e){
    var s=(e.target&&e.target.closest)?e.target.closest("details.acc>summary"):null; if(!s)return;
    var d=s.parentNode; if(!d) return;
    e.preventDefault();
    if(d.open){
      d.classList.add("bes-dicht");
      setTimeout(function(){ d.open=false; d.classList.remove("bes-dicht"); },250);
    } else {
      d.open=true; d.classList.add("bes-open");
      var los=function(){ d.classList.remove("bes-open"); };
      requestAnimationFrame(function(){ requestAnimationFrame(los); });
      setTimeout(los,400);
    }
  },false);
})();
</script>
