<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />

<style>
  :root{
    --bg:#f4f2ee; --bg2:#ebe8e2; --card:#ffffff; --ink:#1b232c; --muted:#5d6873;
    --line:#e2ddd4; --accent:#0f6e6a; --accent-ink:#0b4f4c; --accent-soft:#dcefed;
    --amber:#c9821f; --amber-soft:#f7ecd9; --violet:#6d5bd0; --violet-soft:#e9e6fa;
    --good:#1f8a4c; --good-soft:#e2f3e8; --bad:#c23b54; --bad-soft:#fbe5ea;
    --shadow:0 1px 2px rgba(20,30,40,.05),0 6px 18px rgba(20,30,40,.05);
    --shadow-lg:0 2px 6px rgba(20,30,40,.06),0 18px 40px rgba(20,30,40,.10);
    --r:14px; --r-lg:20px; --ease:cubic-bezier(.2,.8,.2,1);
  }
  html[data-theme="dark"]{
    --bg:#11151a; --bg2:#161b22; --card:#1b222b; --ink:#e7ecf1; --muted:#9aa6b2;
    --line:#2a323c; --accent:#3fb9b2; --accent-ink:#7fd6d0; --accent-soft:#163230;
    --amber:#e0a64a; --amber-soft:#2e2515; --violet:#a99cf0; --violet-soft:#221d3a;
    --good:#46c178; --good-soft:#16301f; --bad:#ef6b82; --bad-soft:#331620;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 2px 8px rgba(0,0,0,.4),0 22px 48px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;letter-spacing:-.01em}
  button,a{font-family:inherit;cursor:pointer;color:inherit}
  .wrap{max-width:880px;margin:0 auto;padding:0 18px 96px}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
  .ic{width:1.25em;height:1.25em;flex:none;vertical-align:-.18em;stroke:currentColor;stroke-width:1.75;
    stroke-linecap:round;stroke-linejoin:round;fill:none}

  header.top{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(160%) blur(16px);-webkit-backdrop-filter:saturate(160%) blur(16px);box-shadow:inset 0 -1px 0 0 rgba(0,0,0,.04)}
  .topin{max-width:880px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:700}
  .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,var(--accent),var(--accent-ink));
    color:#fff;display:grid;place-items:center;font-family:Georgia,serif;font-weight:700;font-size:16px;flex:none;
    box-shadow:0 2px 6px rgba(15,110,106,.35)}
  .brand small{display:block;font-weight:500;color:var(--muted);font-size:11px}
  .spacer{flex:1}
  .iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:38px;
    padding:7px 11px;font-size:13.5px;display:inline-flex;gap:7px;align-items:center;text-decoration:none;
    transition:border-color .2s var(--ease),transform .12s var(--ease)}
  .iconbtn:hover{border-color:var(--accent)} .iconbtn:active{transform:scale(.96)}
  nav.tabs{display:flex;gap:2px;overflow:auto;max-width:880px;margin:0 auto;padding:6px 12px 0;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{border:none;background:none;color:var(--muted);padding:10px 13px;border-radius:9px 9px 0 0;
    font-size:14px;font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px;transition:color .2s var(--ease)}
  nav.tabs button .ic{width:16px;height:16px}
  nav.tabs button.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
  nav.tabs button:hover{color:var(--ink)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:20px}
  .muted{color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
  .pill.amber{background:var(--amber-soft);color:var(--amber)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;gap:14px}
  @media(min-width:620px){.g2{grid-template-columns:1fr 1fr}}

  .hero{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin:20px 0 8px}
  .count{flex:none;background:linear-gradient(150deg,var(--accent),var(--accent-ink));color:#fff;border-radius:var(--r);padding:14px 20px;text-align:center;min-width:118px;box-shadow:0 8px 20px rgba(15,110,106,.28)}
  .count b{font-family:Georgia,serif;font-size:32px;display:block;line-height:1}
  .count span{font-size:12px;opacity:.92}
  .herotext h1{margin:0 0 4px;font-size:25px}
  .herotext p{margin:0;color:var(--muted)}

  .brandstrip{display:flex;align-items:center;gap:13px;width:100%;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 16px;margin:14px 0 2px;box-shadow:var(--shadow);transition:border-color .2s var(--ease),transform .15s var(--ease)}
  .brandstrip:hover{border-color:var(--accent);transform:translateY(-1px)}
  .brandstrip .bs-logo{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:17px;background:linear-gradient(145deg,var(--accent),var(--accent-ink))}
  .brandstrip .bs-txt{flex:1;min-width:0} .brandstrip .bs-txt b{display:block;font-size:14.5px} .brandstrip .bs-txt small{color:var(--muted);font-size:12.5px}
  .brandstrip .bs-go{color:var(--accent-ink);flex:none;display:inline-flex} .brandstrip .bs-go .ic{width:18px;height:18px}

  .seclabel{display:flex;align-items:center;gap:8px;margin:24px 0 12px;font-weight:700;font-size:15px}
  .seclabel .ic{width:18px;height:18px;color:var(--accent-ink)}
  .backlink{display:inline-flex;align-items:center;gap:5px;border:none;background:none;color:var(--muted);font-size:13.5px;font-weight:600;padding:6px 0;margin-bottom:4px;transition:color .2s var(--ease)}
  .backlink:hover{color:var(--accent-ink)} .backlink .ic{width:16px;height:16px}
  .tracks{display:grid;gap:14px} @media(min-width:600px){.tracks{grid-template-columns:1fr 1fr}}
  .track{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);transition:transform .22s var(--ease),border-color .22s var(--ease),box-shadow .22s var(--ease)}
  .track:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow-lg)} .track:active{transform:translateY(-1px) scale(.995)}
  .track .tile{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;margin-bottom:4px;background:linear-gradient(150deg,var(--accent),var(--accent-ink))}
  .track.alt .tile{background:linear-gradient(150deg,var(--violet),#4f40a8)} .track .tile .ic{width:24px;height:24px}
  .track b{font-size:18px} .track small{color:var(--muted);font-size:13.5px;line-height:1.5}
  .track .go{margin-top:6px;display:inline-flex;align-items:center;gap:6px;color:var(--accent-ink);font-weight:600;font-size:13.5px} .track.alt .go{color:var(--violet)} .track .go .ic{width:16px;height:16px}
  .toggle{width:48px;height:28px;border-radius:999px;border:none;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s var(--ease)}
  .toggle .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s var(--ease)}
  .toggle.on{background:var(--violet)} .toggle.on .knob{left:23px}
  .warmcard{border-color:var(--violet)!important;background:var(--violet-soft)} .warmcard .ic{width:22px;height:22px;color:var(--violet);flex:none}
  .modebanner{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:11px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent-ink);font-size:13.5px;font-weight:600}
  .modebanner.v{background:var(--violet-soft);color:var(--violet)} .modebanner .ic{width:18px;height:18px} .modebanner a,.modebanner .bnlink{margin-left:auto;font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;color:inherit;border:none;background:none;font-family:inherit;padding:0}
  html.snappy .card,html.snappy .mode,html.snappy .tip,html.snappy .track{animation-duration:.12s!important}
  .mode{display:flex;flex-direction:column;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:17px;gap:7px;box-shadow:var(--shadow);transition:transform .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease)}
  .mode:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .mode .me{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)} .mode .me .ic{width:22px;height:22px}
  .mode b{font-size:16px} .mode small{color:var(--muted);font-size:13px}

  label.fld{display:block;font-size:13px;font-weight:600;margin:16px 0 7px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;min-height:38px;padding:7px 13px;font-size:13.5px;transition:all .18s var(--ease)}
  .chip:hover{border-color:var(--accent)} .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:11px;min-height:46px;padding:12px 20px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;box-shadow:0 4px 12px rgba(15,110,106,.25);transition:background .2s var(--ease),transform .12s var(--ease)}
  .btn:hover{background:var(--accent-ink)} .btn:active{transform:scale(.97) translateY(1px)} .btn .ic{width:18px;height:18px}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none} .btn.ghost:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  input[type=search],input[type=text],input[type=email],textarea{font-family:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
  input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .runtop{display:flex;align-items:center;gap:12px;margin:2px 0 14px;font-size:13px;color:var(--muted)}
  .bar{height:8px;border-radius:6px;background:var(--bg2);overflow:hidden;flex:1}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .7s var(--ease)}
  .qtext{font-size:19px;font-weight:600;margin:8px 0 16px;font-family:Georgia,serif;line-height:1.45}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px 15px;margin-bottom:10px;font-size:15px;transition:border-color .15s var(--ease),background .15s var(--ease),transform .12s var(--ease)}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)} .opt:active:not(:disabled){transform:scale(.99)}
  .opt .k{flex:none;width:27px;height:27px;border-radius:8px;background:var(--bg2);color:var(--muted);display:grid;place-items:center;font-weight:700;font-size:13px}
  .opt.correct{border-color:var(--good);background:var(--good-soft)} .opt.correct .k{background:var(--good);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default}
  .feedback{border-radius:12px;padding:13px 15px;margin:4px 0 12px;font-size:14.5px}
  .feedback.ok{background:var(--good-soft);color:var(--good)} .feedback.no{background:var(--bad-soft);color:var(--bad)}
  .feedback b{font-weight:700} .feedback .sub{display:block;margin-top:3px;color:var(--ink);font-weight:500;opacity:.92}
  .whybtn{border:1px solid var(--line);background:var(--card);color:var(--accent-ink);border-radius:10px;min-height:40px;padding:9px 14px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:border-color .2s var(--ease),background .2s var(--ease)}
  .whybtn:hover{border-color:var(--accent);background:var(--accent-soft)} .whybtn .ic{width:16px;height:16px}
  .whybox{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:14px 16px;margin:12px 0 4px;font-size:14px;line-height:1.55}
  .whybox h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent-ink);font-family:system-ui;display:flex;align-items:center;gap:7px}
  .whybox .ic{width:16px;height:16px}

  .acc{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
  .acc>summary{padding:15px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:11px}
  .acc>summary::-webkit-details-marker{display:none}
  .acc>summary .n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
  .acc>summary .caret{margin-left:auto;color:var(--muted);transition:transform .25s var(--ease)} .acc[open]>summary .caret{transform:rotate(90deg)}
  .acc[open]>summary{border-bottom:1px solid var(--line)} .acc .body{padding:6px 18px 16px}
  .acc h4{margin:14px 0 6px;font-size:13px;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.4px;font-family:system-ui}
  .acc ul{margin:0;padding-left:20px} .acc li{margin:6px 0;font-size:14.5px;line-height:1.5}
  .acc.hack li::marker{content:"💡  "} .acc.hack>summary .n{background:var(--violet-soft);color:var(--violet)}
  mark{background:var(--amber-soft);color:inherit;padding:0 2px;border-radius:3px}

  .tip{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}
  .tip h4{margin:0 0 5px;font-size:14.5px;display:flex;align-items:center;gap:8px;font-family:system-ui} .tip h4 .ic{width:18px;height:18px;color:var(--violet)}
  .tip p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}
  .tipgrid{display:grid;gap:12px} @media(min-width:620px){.tipgrid{grid-template-columns:1fr 1fr}}

  .results .big{font-family:Georgia,serif;font-size:54px;text-align:center;margin:8px 0;line-height:1}
  .center{text-align:center} .hide{display:none!important}
  footer{margin-top:34px;text-align:center;color:var(--muted);font-size:13px}
  .kbd{font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--muted)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.03)}100%{transform:scale(1)}}
  @keyframes optIn{from{opacity:0;transform:translateX(-9px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: no-preference){
    .card,.mode,.tip{animation:fadeUp .34s var(--ease) both}
    .acc{animation:fadeUp .32s var(--ease) both}
    .opt{animation:optIn .3s var(--ease) backwards;animation-delay:var(--oi,0s)}
    .chip.on{animation:pop .22s var(--ease)}
    .feedback{animation:slideIn .26s var(--ease) both} .whybox{animation:slideIn .28s var(--ease) .07s both} .opt.correct{animation:pop .34s var(--ease)}
  }
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  /* ---- Premium launch (Gemini-stijl) + header-logo gloed ---- */
  @property --bes-a{syntax:'<angle>';initial-value:0deg;inherits:false}
  #splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(125% 125% at 50% 38%,var(--bg2) 0%,var(--bg) 68%);transition:opacity .6s var(--ease),transform .7s var(--ease)}
  #splash.hide{opacity:0;transform:scale(1.07);pointer-events:none}
  .sp-inner{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
  .sp-mark{position:relative;width:100px;height:100px;display:grid;place-items:center}
  .sp-mark::before{content:"";position:absolute;inset:-16px;border-radius:34px;z-index:0;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));filter:blur(17px);opacity:.75}
  .sp-mark::after{content:"";position:absolute;inset:-3px;border-radius:27px;z-index:1;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));padding:3px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .sp-logo{position:relative;z-index:2;width:92px;height:92px;border-radius:24px;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:46px;background:linear-gradient(150deg,var(--accent),var(--accent-ink));box-shadow:0 14px 38px rgba(15,110,106,.4)}
  .sp-spark{position:absolute;z-index:3;top:-7px;right:-7px;width:30px;height:30px;color:#fff;filter:drop-shadow(0 2px 7px rgba(0,0,0,.35))}
  .sp-name{position:relative;font-family:Georgia,serif;font-size:26px;font-weight:700;letter-spacing:-.01em;color:var(--ink);overflow:hidden}
  .sp-name::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(-130%)}
  .sp-tag{font-size:13px;color:var(--muted);margin-top:-8px;letter-spacing:.03em}
  @media (prefers-reduced-motion: no-preference){
    .sp-mark::before{animation:bes-spin 3s linear infinite,bes-breathe 2.4s var(--ease) infinite}
    .sp-mark::after{animation:bes-spin 3s linear infinite}
    .sp-logo{animation:bes-pop .7s var(--ease) both}
    .sp-spark{animation:bes-pop .6s var(--ease) .12s both,bes-twinkle 1.9s var(--ease) .9s infinite}
    .sp-name{animation:bes-rise .6s var(--ease) .14s both}
    .sp-name::after{animation:bes-shimmer 1.5s var(--ease) .5s 1}
    .sp-tag{animation:bes-rise .6s var(--ease) .26s both}
  }
  @keyframes bes-spin{to{--bes-a:360deg}}
  @keyframes bes-breathe{0%,100%{opacity:.55;filter:blur(16px)}50%{opacity:.95;filter:blur(22px)}}
  @keyframes bes-shimmer{to{transform:translateX(130%)}}
  @keyframes bes-twinkle{0%,100%{opacity:1;transform:scale(1) rotate(0deg)}50%{opacity:.65;transform:scale(.82) rotate(18deg)}}
  @keyframes bes-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  /* mobiel: header-knoppen alleen iconen zodat niks zijwaarts overflowt */
  @media(max-width:440px){ header.top .iconbtn span{display:none} header.top .iconbtn{padding:7px 9px;min-width:38px;justify-content:center} .topin{gap:8px} }
</style>
</head>
<body>
<div id="splash"><div class="sp-inner">
  <div class="sp-mark">
    <div class="sp-logo">HR</div>
    <svg class="sp-spark" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.5c.4 4.6 2.4 6.6 7 7-4.6.4-6.6 2.4-7 7-.4-4.6-2.4-6.6-7-7 4.6-.4 6.6-2.4 7-7Z"/></svg>
  </div>
  <div><div class="sp-name">Principles of HR Management</div><div class="sp-tag">slim oefenen voor je examen</div></div>
</div></div>
<header class="top">
  <div class="topin">

<script>
window.HR = {"questions":[{"t":"1","q":"Wat is volgens de cursus het kernidee waarmee een organisatie zich kan onderscheiden van concurrenten?","o":["Door de mensen in de organisatie","Door zoveel mogelijk technologie aan te kopen","Door de laagste prijzen aan te bieden","Door het grootste marktaandeel te veroveren"],"a":0,"u":"Het kernidee van de cursus is dat je je van andere organisaties kunt differentiëren via de mensen in je organisatie. Wil een bedrijf innovatief zijn, dan moeten ook de mensen innovatief kunnen zijn."},{"t":"1","q":"Een sustainable competitive advantage wordt in de cursus omschreven als een capaciteit die:","o":["volledig gebaseerd is op patenten en technologie","de loonkost van werknemers structureel verlaagt","waarde creëert voor klanten en die rivalen niet snel of makkelijk kunnen kopiëren","elk kwartaal een hogere omzet garandeert zolang de concurrentie niet in dezelfde markt investeert"],"a":2,"u":"Een duurzaam concurrentievoordeel creëert waarde voor klanten die rivalen niet snel of makkelijk kunnen kopiëren, waardoor de organisatie zich kan onderscheiden van concurrenten."},{"t":"1","q":"Welke drie theorieën verklaren volgens de cursus de HR-performance link?","o":["Cost center, revenue center en productivity center","Resource based view, contingency theory en AMO framework","Scientific management, human relations en systeemtheorie","Recruitment, performance appraisal en talentmanagement"],"a":1,"u":"De HR-performance link wordt in de cursus verklaard door drie op onderzoek gebaseerde theorieën: de resource based view, de contingency theory en het AMO framework."},{"t":"1","q":"Volgens de resource based view moet een resource waarde bieden, zeldzaam zijn, moeilijk te imiteren zijn en:","o":["zo goedkoop mogelijk aangekocht zijn","identiek zijn aan wat concurrenten bezitten","niet-substitueerbaar zijn","volledig door technologie vervangbaar zijn"],"a":2,"u":"In de resource based view moet een resource waarde bieden (heterogeniteit), zeldzaam zijn, moeilijk te imiteren zijn en niet-substitueerbaar, dus moeilijk of niet vervangbaar."},{"t":"1","q":"Wat drukken KSAO's uit binnen de resource based view en hoe verhouden ze zich tot motivatie?","o":["KSAO's zijn aangeboren persoonlijkheidstrekken die vastliggen en motivatie overbodig maken","KSAO's zijn financiële middelen die training bekostigen","KSAO's zijn de administratieve processen van een HR-afdeling","KSAO's zijn skills, kennis en capaciteiten die in balans moeten zijn met motivatie"],"a":3,"u":"KSAO's verwijzen naar de human resources zoals skills en kennis. Het is niet genoeg om skills te hebben, KSAO's en motivatie moeten in balans zijn."},{"t":"1","q":"Wat stelt de contingency theory over HR-praktijken?","o":["Alleen financiële middelen bepalen het concurrentievoordeel","Er bestaan universele best practices die overal werken","HR-praktijken hebben geen invloed op de performantie","De beste HR-aanpak hangt af van de context en de strategie"],"a":3,"u":"De contingency theory zegt dat het afhankelijk is: er zijn geen universele best practices, want de beste aanpak hangt af van de context. Zo moet je bij een innovatieve strategie ook innovatieve mensen aanwerven (verticale fit)."},{"t":"1","q":"Wat voegt het AMO framework toe aan het hebben van skills en motivatie?","o":["Een verplichte standaardisatie van alle processen","Een strikte hiërarchie waarin werknemers enkel uitvoeren","De opportuniteit om te participeren","Een focus op de laagste loonkost per werknemer"],"a":2,"u":"Het AMO framework stelt dat skills en motivatie niet volstaan: je moet mensen ook de kans of opportuniteit geven om te participeren, zodat ze discretionary effort kunnen leveren."},{"t":"1","q":"Waarom werd HR in het verleden vaak als een cost center gezien, in tegenstelling tot hoe het nu wordt getypeerd?","o":["Omdat HR uitsluitend voor recruitment verantwoordelijk was","Omdat HR enkel de naleving van de nationale wetgeving bewaakte en dus buiten de productie stond","Omdat HR geen winst opleverde en geld kostte, terwijl het nu een productivity center is","Omdat HR de winst rechtstreeks binnenbracht als revenue center"],"a":2,"u":"HR werd gezien als een cost center, een departement dat geld kost en geen winst oplevert. Nu wordt het beschouwd als een productivity center dat via hogere productiviteit van werknemers bijdraagt aan de winstgevendheid."},{"t":"1","q":"Volgens Dave Ulrich richt de rol van administratieve expert zich vooral op:","o":["het voorbereiden van werknemers op verandering","het optimaliseren van de dagelijkse processen en infrastructuur","het oplijnen van HR met de langetermijnstrategie","het versterken van motivatie en betrokkenheid van werknemers"],"a":1,"u":"De administratieve expert richt zich op de day-to-day processen en infrastructuur, zoals recruitment en performance appraisal, en het zo optimaal mogelijk organiseren van die vaak administratieve processen."},{"t":"1","q":"Welke twee HR-rollen van Ulrich staan volgens de cursus lijnrecht tegenover elkaar en veroorzaken frictie?","o":["Administratieve expert en change agent","Strategische partner en change agent","Employee champion en administratieve expert","Strategische partner en administratieve expert"],"a":0,"u":"De administratieve expert wil de status quo behouden, terwijl de change agent net verandering nastreeft. Deze tegenstelling zorgt voor frictie, net zoals tussen employee champion en de strategische rol."},{"t":"2","q":"Hoe werd HR volgens het boek in het verleden vaak beschouwd?","o":["Als een winstgevende afdeling die producten verkoopt","Als de belangrijkste bron van innovatie in het bedrijf","Als een cost center dat geen omzet of winst binnenbrengt","Als een strategische partner die concurrentievoordeel oplevert"],"a":2,"u":"HR werd in het verleden gezien als een cost center, een onderdeel van de organisatie dat geen omzet of winst genereert. De strategische rol kwam pas veel later."},{"t":"2","q":"Welke rol vervulden de gilden in de pre-industriele steden?","o":["Zij beheerden de machines in de eerste fabrieken en bepaalden hoeveel arbeiders per uur uitbetaald kregen","Zij verkochten grond aan boeren op het platteland","Zij stelden managers aan om het productieproces te rationaliseren","Zij bepaalden wie een vak mocht uitoefenen, welke vaardigheden geleerd moesten worden en wanneer er gewerkt werd"],"a":3,"u":"Gilden waren verenigingen van ambachtslieden die bepaalden wie een vak of trade kon uitoefenen, welke skills geleerd moesten worden en wanneer er gewerkt werd. Zij voerden taken uit die nu tot het personeelsbeheer horen."},{"t":"2","q":"Wat veranderde er op het gebied van arbeid tijdens de industriele revolutie?","o":["Het gildensysteem werd hersteld en bepaalde opnieuw wie welk vak mocht uitoefenen","De arbeidsverdeling werd volledig op vaardigheden gebaseerd","Machines vervingen menselijk werk en mensen werden werknemers in dienst van bedrijven","Mensen gingen van werknemer terug naar zelfstandige ambachtsman"],"a":2,"u":"Tijdens de industriele revolutie vervingen machines het menselijk werk en ontstond het fabriekssysteem. Mensen gingen van zelfstandig werk over naar werknemer in dienst van een bedrijf, een verschuiving van externe naar interne arbeidsmarkt."},{"t":"2","q":"Wat houdt rationalization of work in?","o":["Het vinden van manieren om de effectiviteit te vergroten door het productieproces te vereenvoudigen, met arbeidsverdeling op basis van taken","Het motiveren van werknemers met intrinsieke motivatie in plaats van beloning","Het geven van meer autonomie aan werknemers over hun eigen werkmethode","Het opnieuw invoeren van volledig vakmanschap van A tot Z, waarbij elke arbeider het hele product zelf afwerkt en de arbeidsverdeling verdwijnt"],"a":0,"u":"Rationalization of work is het vergroten van de effectiviteit door het productieproces te vereenvoudigen, met een arbeidsverdeling die minder op vaardigheden en meer op afzonderlijke taken gebaseerd is. De taken werden daardoor repetitief en saai."},{"t":"2","q":"Wat kenmerkt paternalistisch leiderschap volgens de leerstof?","o":["De leider baseert alle beslissingen op wetenschappelijk onderzoek van de taak","De leider heeft geen enkele betrokkenheid bij het persoonlijke leven van werknemers","De leider gedraagt zich als vaderfiguur die bescherming biedt en in ruil extreme loyaliteit verwacht","De leider laat werknemers volledig autonoom werken en grijpt enkel in wanneer de cijfers tegenvallen"],"a":2,"u":"Bij paternalistisch leiderschap is de baas vriendelijker en lijkt hij een vaderfiguur die bescherming biedt aan zijn ondergeschikten. In ruil verwacht hij extreme loyaliteit en eerbied, en werknemers mogen het niet oneens zijn met hun baas."},{"t":"2","q":"Wat was een kenmerkend gevolg van de industrial welfare-aanpak in de periode van personnel management?","o":["De lonen werden fors verhoogd om stakingen te voorkomen, waardoor vakbonden overbodig werden en voorzieningen verdwenen","Voorzieningen waren vaak alleen beschikbaar voor werknemers die niet bij een vakbond zaten, om loyaliteit te bevorderen","Werknemers kregen volledige autonomie over hun taken terug","Alle werknemers kregen gelijke bescherming ongeacht hun lidmaatschap"],"a":1,"u":"Industrial welfare wekte de indruk dat men in de werknemers geinteresseerd was, maar de voorzieningen waren vaak enkel beschikbaar voor werknemers die niet in een vakbond zaten. Het doel was werknemers loyaal te houden, met een welzijnssecretaris die toezicht hield op lunchrooms en recreatie."},{"t":"2","q":"Wie was de pionier van het scientific management en waar draaide zijn benadering om?","o":["Max Weber, die de nadruk legde op intrinsieke motivatie","Elton Mayo, die de sociale behoeften centraal stelde","Douglas McGregor, die het werk in kleine bewegingen opdeelde om de snelste werkwijze te vinden","Frederick Taylor, die werk rationeel opbrak in componenten om de beste manier te bepalen"],"a":3,"u":"Frederick Taylor was de pionier van het scientific management. Scientific staat voor rationeel: emoties en motivaties werden weggehaald en het werk werd opgebroken in componenten om wetenschappelijk de beste manier van werken te bepalen."},{"t":"2","q":"Wat toonden de Hawthorne-experimenten van de human relations movement aan?","o":["Dat enkel financiele prikkels de productiviteit bepalen","Dat het labor problem vooral een organisatorisch probleem is, geen managementprobleem","Dat sociale en psychologische behoeften een rol spelen en Taylors aannames dus onjuist waren","Dat autonomie geen invloed heeft op de motivatie van werknemers"],"a":2,"u":"De Hawthorne-experimenten bewezen dat het taylorisme onjuist was: sociale en psychologische behoeften spelen een rol. Mensen willen gezien worden en kunnen participeren, en vriendschappen beinvloeden gedrag meer dan bijvoorbeeld een baas."},{"t":"2","q":"Wat is het onderscheid tussen theorie X en theorie Y over hoe werknemers gesuperviseerd worden?","o":["Theorie X stelt dat mensen niet van werk houden en gecontroleerd moeten worden, terwijl theorie Y stelt dat mensen intrinsiek gemotiveerd en creatief zijn","Theorie X stelt dat mensen creatief zijn en zichzelf sturen, terwijl theorie Y stelt dat mensen werk vermijden en van dichtbij gecontroleerd moeten worden","Theorie X hoort bij human relations, theorie Y bij scientific management","Theorie X gaat over interne arbeidsmarkt, theorie Y over externe arbeidsmarkt"],"a":0,"u":"Theorie X stelt dat mensen niet van werk houden, financiele prikkels nodig hebben en gecontroleerd moeten worden, wat aansluit bij autoritair leiderschap. Theorie Y stelt dat mensen vanuit zichzelf gemotiveerd, intrinsiek gedreven en creatief zijn."},{"t":"3","q":"Hoe wordt HR vandaag volgens de leerstof idealiter bekeken?","o":["Als een out-tasking-functie waarbij alle personeelstaken permanent aan externe partners worden overgelaten","Als een administratie-expert die enkel personeelsdossiers beheert","Als een productivity center dat de winstgevendheid verhoogt door de productiviteit van de mensen te vergroten","Als een cost center dat geen omzet of winst genereert"],"a":2,"u":"In het verleden werd HR gezien als een cost center. Vandaag wordt het idealiter gezien als een productivity center: een revenue center dat de winstgevendheid verhoogt door de productiviteit van de mensen binnen de organisatie te vergroten."},{"t":"3","q":"Welk effect had Covid-19 volgens de tekst op de rol van HR?","o":["Het maakte HR grotendeels overbodig omdat telewerk en automatisering het personeelsbeleid overnamen","Het zette druk op HR als strategische partner en bracht het terug naar HR als administratie-expert","Het versterkte definitief de rol van HR als strategische partner","Het verschoof HR volledig naar een zuivere cost center-rol"],"a":1,"u":"Covid zorgde voor druk op HR als strategische partner en bracht het terug naar de rol van administratie-expert. Er ontstond spanning tussen de status-quo en de toekomstige focus, en tussen processen en mensen."},{"t":"3","q":"Waarom is performance appraisal moeilijker bij telewerk volgens de tekst?","o":["Omdat metrics en output volledig verdwijnen bij thuiswerk","Omdat het moeilijk is goede feedback te geven zonder de werknemer te zien en werknemers niet vergeleken kunnen worden","Omdat recruiting en selectie niet meer geautomatiseerd kunnen worden","Omdat de prestaties van thuiswerkers enkel nog in gewerkte uren worden gemeten en de kwaliteit van het werk wegvalt"],"a":1,"u":"Bij telewerk is het moeilijk goede feedback te geven als je de werknemer niet ziet, kan je werknemers niet vergelijken en zie je onbewuste processen niet. Bedrijven gaan daarom meer software gebruiken om te monitoren en zetten meer in op harde evaluaties zoals output en metrics."},{"t":"3","q":"Wat houdt Theory X in volgens de leerstof over de neiging tot controle?","o":["Dat je je werknemers niet kan vertrouwen, wat de autonomie wegneemt en tot controlemodus leidt bij bedreiging","Dat werknemers vanzelf gemotiveerd blijven en dat toezicht daarom kan verdwijnen zodra er druk ontstaat","Dat jobs niet vastliggen en aangepast mogen worden door de werknemer","Dat beslissingen best op betrouwbaar bewijs gebaseerd worden"],"a":0,"u":"Theory X gaat ervan uit dat je je werknemers niet kan vertrouwen, wat de autonomie wegneemt. Wanneer organisaties onder bedreiging staan, gaan ze in controlemodus."},{"t":"3","q":"Wat is de onderliggende assumptie van evidence-based HRM?","o":["Dat enkel cijfers uit de eigen organisatie tellen en dat wetenschappelijk onderzoek van buitenaf niet bruikbaar is","Dat oude, intuïtief logische theorieën steeds betrouwbaar zijn","Dat het beter is beslissingen te maken op basis van betrouwbare informatie dan willekeurig of intuïtief te beslissen","Dat intuïtieve en willekeurige beslissingen sneller en dus beter zijn"],"a":2,"u":"Evidence-based HRM gaat ervan uit dat het beter is beslissingen te nemen op basis van betrouwbare informatie dan random of intuïtief. Bruikbare bronnen zijn onder meer organisational evidence, experiental evidence en de waarden en zorgen van stakeholders."},{"t":"3","q":"Welk type bewijs staat bovenaan de pyramid of trust bij evidence-based HRM?","o":["Non-peer reviewed bronnen, wegens de snelheid","Cross-sectionele studies, omdat ze causaliteit aantonen","Systematische reviews, met de hoogste impact","Persoonlijkheidstests zoals Myers-Briggs of het Eneagram"],"a":2,"u":"In de pyramid of trust hebben systematische reviews de hoogste impact, gevolgd door meta-analyses en randomized control-studies. Cross-sectionele studies zeggen niets over causaliteit en non-peer review kent geen kwaliteitscontrole."},{"t":"3","q":"Wat kritiseert de tekst aan tests en modellen zoals Myers-Briggs, het Eneagram en de piramide van Maslow?","o":["Dat ze te weinig extreme profielen opleveren voor selectie","Dat ze enkel bruikbaar zijn om mensen aan te nemen of te promoten","Dat ze wetenschappelijk goed onderbouwd zijn maar te duur en te tijdrovend om in organisaties af te nemen","Dat ze allesbehalve wetenschappelijk zijn en er weinig of geen bewijs voor de veronderstelde structuren bestaat"],"a":3,"u":"Volgens de tekst zijn deze modellen allesbehalve wetenschappelijk: de meeste mensen zijn gemiddeld en zowel introvert als extravert, en er is weinig bewijs dat behoeften georganiseerd zijn volgens de hiërarchie die Maslow voorstelt. Zulke instrumenten mogen niet gebruikt worden om aan te nemen of te promoten."},{"t":"3","q":"Wat kenmerkt talent management met betrekking tot A-posities en A-spelers?","o":["Elke functie in het bedrijf als even strategisch beschouwen en de middelen voor opleiding gelijk over alle medewerkers verdelen","HR volledig outsourcen omdat het geen strategische waarde heeft","Het identificeren van spilposities en topmedewerkers en meer middelen investeren waar een strategisch rendement wordt verwacht","Enkel focussen op individuele verschillen die losstaan van de bedrijfsstrategie"],"a":2,"u":"Talent management focust op individuele verschillen die direct belangrijk zijn voor het bedrijf. Je identificeert spilposities (A-posities) en A-spelers die een onevenredige bijdrage leveren aan de prestaties, en investeert meer middelen waar een strategisch rendement wordt verwacht."},{"t":"3","q":"Wat wordt met out-tasking bedoeld binnen HR-outsourcing?","o":["Dat recruiting en selectie strategisch worden afgestemd op de bedrijfsstrategie","Dat het volledige HR-proces wordt uitbesteed omdat het geen strategische waarde heeft","Dat de eigen HR-afdeling samenwerkt met één of meerdere adviesbureaus","Dat een HR-activiteit slechts eenmalig wordt geoutsourced"],"a":3,"u":"Out-tasking is de situatie waarin een activiteit maar eenmalig wordt geoutsourced. Dit staat naast co- of multi-sourcing en business process outsourcing als vormen van HR-outsourcing."},{"t":"3","q":"Wat kenmerkt sustainable HRM volgens de leerstof?","o":["Enkel de human resource benadrukken en emoties buiten beschouwing laten","Aandacht voor zowel de mens met emoties en noden als de human resource die belangrijk is voor de strategie","Jobs strikt vastleggen in procedures zodat werknemers hun taken nooit zelf kunnen aanpassen aan hun noden","Werknemers uitsluitend beoordelen op harde output en metrics"],"a":1,"u":"Sustainable HRM heeft twee delen: de menselijke kant, waar je mensen ziet als personen met emoties en noden, en de human resource als bron die belangrijk is voor de strategie. Er is meer aandacht voor welzijn, autonomie en positieve psychologie."},{"t":"4","q":"Waar richt de resource based view of the firm zich in de eerste plaats op?","o":["De externe marktomgeving en concurrentiedruk","De interne resources die al in het bedrijf aanwezig zijn","De wettelijke verplichtingen die de overheid aan arbeid oplegt","De prijszetting van producten en diensten"],"a":1,"u":"De resource based view gaat over interne resources die het bedrijf al bezit. Het idee is dat werken met de mensen die je al hebt vaak makkelijker verloopt dan telkens nieuwe mensen aanwerven."},{"t":"4","q":"Volgens de resource based view zijn menselijke resources waardevol (valuable). Wat is de kern van die redenering?","o":["Omdat mensen goedkoper inzetbaar zijn dan machines en hun loonkost makkelijk te drukken valt","Omdat alle werknemers dezelfde standaardvaardigheden bezitten","Omdat werknemers wettelijk beschermd zijn","Omdat mensen van elkaar verschillen en verschillende jobs met verschillende skills uitoefenen"],"a":3,"u":"Waarde komt uit verschil: werknemers verschillen van elkaar en oefenen andere jobs met andere skills uit op de arbeidsmarkt. Daarom is HRM waardevol."},{"t":"4","q":"Bij welke benadering van werk worden jobs gezien als taken zonder veel expertise, waardoor HR als een commodity kan worden beschouwd?","o":["Scientific management","Human relations movement","Path dependency","Talentmanagement"],"a":0,"u":"Bij scientific management zijn er voor die jobs geen bijzondere skills nodig, waardoor HR als een commodity kan worden gezien. In dat geval zijn menselijke resources dus niet zeldzaam."},{"t":"4","q":"Waar wijst de vaststelling op dat ongeveer 20% van de werknemers verantwoordelijk is voor ongeveer 80% van de prestaties?","o":["Dat menselijke prestaties niet vervangbaar zijn","Dat de prestatieverschillen tussen werknemers klein zijn en opleiding voor iedereen hetzelfde rendement oplevert","Dat HR administratief in plaats van strategisch moet werken","Dat hoogwaardige menselijke prestaties zeldzaam (rare) zijn en talenten dus geidentificeerd en getraind moeten worden"],"a":3,"u":"De 20/80-vaststelling benadrukt dat hoogwaardige menselijke prestaties zeldzaam zijn, mogelijk zeldzamer dan verwacht. Daarom is het belangrijk deze talenten te identificeren, te selecteren en te trainen."},{"t":"4","q":"Welk begrip beschrijft dat het vaak niet duidelijk is waarom een bepaald team goed werkt of een hoge performantie haalt?","o":["Causal ambiguity","Social complexity","Path dependency","Emergence"],"a":0,"u":"Causal ambiguity houdt in dat het vaak onduidelijk is welke oorzaken tot de hoge performantie van een team leiden. Dat maakt de resource moeilijk te imiteren."},{"t":"4","q":"Wat wordt in de resource based view bedoeld met path dependency als reden waarom menselijke resources moeilijk te imiteren zijn?","o":["Dat werknemers makkelijk vervangbaar zijn door goedkopere arbeid","Dat prestaties enkel afhangen van individuele persoonlijkheid","Dat de opgebouwde regels en cultuur historisch gegroeid en met het bedrijf verbonden zijn","Dat de loopbaanpaden die werknemers eerder volgden hun latere prestaties volledig vastleggen"],"a":2,"u":"Path dependency verwijst naar historisch gegroeide condities: gezamenlijk opgebouwde regels en een cultuur waarin je floreert, sterk verbonden met het bedrijf. Dat maakt kopieren door anderen moeilijk."},{"t":"4","q":"Volgens de tekst is gedrag de som van individuele karakteristieken en contextuele karakteristieken. Wat betekent dit voor de rol van context?","o":["Gedrag hangt uitsluitend af van compensatie","Context is voor een groot deel verantwoordelijk voor hoe een persoon zich gedraagt","Context speelt enkel een rol bij nieuwe werknemers en verdwijnt zodra iemand is ingewerkt","Alleen persoonlijkheid bepaalt gedrag volledig"],"a":1,"u":"Gedrag is de som van individuele en contextuele karakteristieken, waarbij context voor een groot deel bepaalt hoe iemand zich gedraagt. Dit hangt samen met emergence: hoe afhankelijker mensen van elkaar zijn, hoe meer ze elkaar stimuleren."},{"t":"4","q":"Welke verschuiving in HR-rollen benadrukt Dave Ulrich als steeds belangrijker?","o":["Van het ontwikkelen van interne resources naar het permanent aanwerven van externe specialisten","Van strategische partner naar louter administratieve rol","Van dag tot dag administratie naar de rol van strategische, proactieve partner","Van proactief naar reactief werken"],"a":2,"u":"Volgens Ulrich wordt de rol van HR als strategische partner belangrijker. Administratief werk is dag tot dag en reactief, terwijl de strategische rol proactief en toekomstgericht is."},{"t":"4","q":"Wat is volgens de cursus een sustainable competitive advantage?","o":["Een structuur waarbij beslissingen sterk gecentraliseerd zijn","Een cultuur waarin samenwerking centraal staat","Een voorsprong die volledig berust op technologie en patenten en die concurrenten met voldoende middelen op korte termijn kunnen overnemen","Een capaciteit die waarde creeert voor klanten die rivalen niet snel of makkelijk kunnen kopieren en die differentiatie mogelijk maakt"],"a":3,"u":"Een sustainable competitive advantage is een capaciteit die waarde creeert voor klanten die concurrenten niet snel of makkelijk kunnen kopieren, en die de organisatie toelaat haar producten of diensten te onderscheiden."},{"t":"4","q":"Welke generieke strategie van Porter draait om lagere kosten via schaalvoordelen, efficienter gebruik van faciliteiten en goedkope distributie, met voorbeelden als IKEA, Southwest en Aldi?","o":["Matrixstrategie","Kostenleiderschap","Focus","Differentiatie"],"a":1,"u":"Kostenleiderschap verlaagt de kosten om producten of diensten te produceren, via onder meer schaalvoordelen, lage overheadkosten en goedkope distributiekanalen. Voorbeelden zijn IKEA, Southwest en Aldi."},{"t":"4","q":"Welke generieke strategie van Porter probeert voordeel te behalen door iets aan te bieden dat niemand anders biedt, zodat een premium prijs gevraagd kan worden (bijvoorbeeld Apple, Tesla)?","o":["Differentiatie","Kostenleiderschap","Focus","Klant-/marktstructuur"],"a":0,"u":"Differentiatie draait niet zozeer om prijs maar om het product: je biedt iets uniek aan (extra functies, kwaliteit, imago) waardoor je een premium prijs kunt vragen. Voorbeelden zijn Apple en Tesla."},{"t":"4","q":"Wat verstaat men bij de basiskenmerken van organisatiestructuur onder formalization?","o":["De mate waarin beslissingen in de organisatie geconcentreerd zijn","Het aantal hierarchische lagen tussen de top en de werkvloer en de omvang van elke afdeling","De mate waarin de organisatie fysiek gespreid is over locaties","De mate waarin jobs binnen een organisatie gestandaardiseerd zijn via beleid, procedures en regels"],"a":3,"u":"Formalization is de mate waarin jobs binnen een organisatie gestandaardiseerd zijn, bijvoorbeeld via beleid, procedures en regels. Centralization gaat over de concentratie van besluitvorming."},{"t":"4","q":"Waarom zijn menselijke resources volgens de conclusie van de resource based view moeilijk vervangbaar (non-substitutable)?","o":["Omdat ze moeilijk te kopieren zijn door historische, causale en sociale factoren","Omdat werknemers wettelijk niet ontslagen mogen worden","Omdat machines op lange termijn altijd goedkoper werken dan mensen met dezelfde output","Omdat elke skill en job volledig identiek en uitwisselbaar is"],"a":0,"u":"Menselijke resources zijn moeilijk vervangbaar omdat ze moeilijk te kopieren zijn, en dat door drie factoren: de historische ontwikkeling van de organisatie, causale factoren en sociale factoren zoals netwerken. Zelfs een kopieerpoging heeft mogelijk geen effect."},{"t":"4","q":"Wat toont het Michigan Matching model vooral aan over HRM-praktijken?","o":["Dat centralisatie de enige juiste structuur is","Het belang van horizontale overeenstemming, waarbij HR-onderdelen op elkaar afgestemd zijn","Dat HR-praktijken los van de firmastrategie ontwikkeld worden en elk apart hun doel nastreven","Dat kostenleiderschap altijd de beste strategie is"],"a":1,"u":"Het Michigan Matching model toont het belang van horizontale overeenstemming: wat een goede performantie is wordt bepaald door de firmastrategie, en HR-praktijken zoals performance appraisal, compensatie en training moeten mooi op elkaar afgestemd zijn."},{"t":"5","q":"Wat is het belangrijkste verschil tussen HR metrics en HR analytics?","o":["HR metrics voorspellen de toekomst, terwijl HR analytics enkel de huidige situatie vastleggen","HR metrics beschrijven automatisch de situatie, terwijl HR analytics de uitkomsten van interventies proberen te voorspellen","HR metrics zijn subjectieve inschattingen van leidinggevenden, terwijl HR analytics enkel met objectieve loongegevens werken","HR metrics gebruiken enkel externe databases, terwijl HR analytics enkel interne databases gebruiken"],"a":1,"u":"Volgens de bron gaan HR metrics automatisch en beschrijven ze de situatie, terwijl HR analytics de uitkomsten willen voorspellen en het effect van een interventie willen zien."},{"t":"5","q":"Waarom is benchmarking (je bedrijf vergelijken met andere organisaties) volgens de leerstof vaak moeilijk?","o":["Omdat er geen HRM-systemen bestaan om data te bewaren","Omdat elke organisatie uniek is","Omdat HR niet gelinkt kan worden aan performantie","Omdat andere bedrijven hun cijfers nooit delen"],"a":1,"u":"De bron benadrukt dat benchmarking vaak moeilijk is omdat je organisatie uniek is, waardoor een vergelijking met andere bedrijven niet zomaar opgaat."},{"t":"5","q":"In de HR scorecard beschrijven KSAO's (persoonlijke eigenschappen zoals open mindedness) welk component?","o":["HR performance drivers","HR enablers","HR efficiency measures","HR deliverables"],"a":0,"u":"HR performance drivers zijn de persoonlijke eigenschappen (KSAO's) die aanwezig moeten zijn om de HR deliverables te kunnen realiseren, bijvoorbeeld de persoonlijkheidseigenschap open mindedness."},{"t":"5","q":"Wat is volgens de leerstof het onderscheid tussen een job description en een job specification?","o":["Een job description slaat op de context, een job specification op de strategie","Een job description beschrijft de nodige kwalificaties, een job specification beschrijft de taken","Een job description beschrijft de taken en verantwoordelijkheden, een job specification beschrijft de kwalificaties die nodig zijn om de job te doen","Beide documenten sommen de vereiste kwalificaties op, maar de job description doet dat voor de afdeling en de job specification voor het individu"],"a":2,"u":"Een job description identificeert de belangrijkste taken, plichten en verantwoordelijkheden (wat is de job?), terwijl een job specification de kwalificaties bepaalt van wie de job kan uitvoeren (wat is nodig om de job te doen?)."},{"t":"5","q":"Wat is een belangrijk kritiekpunt op de traditionele job analysis?","o":["Ze gaat ervan uit dat jobs statisch zijn, terwijl jobs eerder fluïde zijn en veranderen","Ze levert enkel bruikbare informatie op voor routineus handwerk en schiet tekort zodra het werk cognitief wordt","Ze focust uitsluitend op de persoon in plaats van op de job","Ze houdt te veel rekening met de strategie van de organisatie"],"a":0,"u":"Een centraal kritiekpunt is dat traditionele job analysis aanneemt dat jobs statisch zijn, terwijl jobs in werkelijkheid fluïde zijn en veranderen, waardoor de aanpak anachronistisch wordt."},{"t":"5","q":"Waarom werd de Dictionary of Occupational Titles (D.O.T.) vervangen door O*NET?","o":["De D.O.T. focuste op taakinformatie ten koste van KSAO's, gaf geen contextinformatie en was moeilijk te onderhouden","De D.O.T. liet toe om alle jobs vlot met elkaar te vergelijken, wat verwarrend was","De D.O.T. beschreef enkel de vereiste KSAO's van de werknemer en liet de concrete taken en werkomstandigheden buiten beschouwing","De D.O.T. bevatte te weinig verschillende beroepen om bruikbaar te zijn"],"a":0,"u":"De D.O.T. focuste op taakinformatie ten koste van KSAO's, hield geen rekening met context, liet geen kruislingse vergelijking van jobs toe en bleek moeilijk te onderhouden, waardoor ze vervangen werd door O*NET."},{"t":"5","q":"Wat is volgens de leerstof het verschil tussen abilities en skills?","o":["Abilities zijn geleerde gedragingen, skills zijn natuurlijk gegeven","Abilities zijn natuurlijk gegeven, skills zijn geleerde gedragingen","Abilities zijn observeerbaar, skills zijn nooit meetbaar","Abilities horen bij de job, skills horen bij de context"],"a":1,"u":"In de bron worden abilities omschreven als natuurlijk gegeven, terwijl skills geleerde gedragingen zijn."},{"t":"5","q":"Hoe wordt een competentie in het competentiemodel omschreven, en waarom verkiest men dit boven KSAO's?","o":["Als een cluster van gedrag, omdat gedrag observeerbaar en meetbaar is, zodat er een onderscheid ontstaat met een persoonlijkheidstrek","Als een vaste lijst van taken en verantwoordelijkheden, omdat een competentie pas bruikbaar wordt wanneer ze losstaat van het gedrag van de werknemer","Als een vaste jobtitel, omdat titels stabiel blijven doorheen de tijd","Als een persoonlijkheidstrek, omdat mensen zelf het best kunnen zeggen wie ze zijn"],"a":0,"u":"Een competentie is een cluster van gedrag met observeerbare en meetbare gedragsindicatoren, waardoor selectietesten mogelijk worden. Zo focust men op gedrag in plaats van op wat mensen over zichzelf zeggen, wat het onderscheidt van een persoonlijkheidstrek."},{"t":"5","q":"Welke methode past de leerstof toe om een profiel te bepalen voor jobs die nog niet bestaan, bijvoorbeeld na een overname?","o":["Naturalistic observation van bestaande jobholders","Scenario planning, waarbij men denkt aan meerdere mogelijke toekomsten en een gemeenschappelijke noemer gebruikt","Een klassieke think-aloud-procedure bij de huidige werknemers","De Dictionary of Occupational Titles raadplegen en de bestaande beroepsbeschrijvingen samenvoegen tot een profiel voor de nieuwe functie"],"a":1,"u":"Voor jobs die nog niet bestaan gebruikt men strategic job modeling via scenario planning: men denkt aan meerdere verschillende toekomsten en gebruikt de gemeenschappelijke noemer om te bepalen wat relevant is."},{"t":"6","q":"Wat is het onderscheid tussen recruitment en selectie zoals besproken in dit hoofdstuk?","o":["Recruitment gebruikt criteria om te schiften, terwijl selectie enkel gaat over het motiveren van kandidaten","Recruitment volgt pas na de aanwerving en dient om het personeelsbestand op peil te houden, terwijl selectie het proces is dat kandidaten warm maakt voor de vacature","Recruitment en selectie zijn synoniemen die naar hetzelfde HR-proces verwijzen","Recruitment identificeert en motiveert mensen om applicant te blijven, terwijl selectie een gekwalificeerde applicant pool afromt op basis van criteria"],"a":3,"u":"Recruitment gaat over het identificeren en motiveren van mensen om applicant te blijven. Selectie gebruikt criteria om een gekwalificeerde applicant pool te vinden die past bij de organisatie, waarbij de macht verschuift naar de organisatie."},{"t":"6","q":"Waarom wordt recruitment in dit hoofdstuk 'de fundering van al het andere' genoemd?","o":["Omdat het de enige HR-taak is die met strategie te maken heeft","Omdat het de goedkoopste HR-activiteit is waarop een organisatie haar volledige personeelsbeleid kan bouwen","Omdat de mensen die je in de organisatie brengt, bepalen hoe de organisatie zich zal ontwikkelen","Omdat recruitment wettelijk verplicht is voor elke organisatie"],"a":2,"u":"Recruitment is de fundering omdat de instromende mensen bepalen hoe de organisatie zich ontwikkelt. Kies je voor homogeniteit (complementair) of heterogeniteit (supplementair, meer innovatie)?"},{"t":"6","q":"Wat houdt het 'Peter principle' in als nadeel van interne recruitment?","o":["Externe kandidaten zijn altijd beter gekwalificeerd dan interne","Werknemers verlaten de organisatie zodra ze gepromoveerd zijn, omdat een hogere functie hen op de externe arbeidsmarkt aantrekkelijker maakt","Mensen worden gepromoveerd tot ze niet meer effectief zijn, bijvoorbeeld een goede ingenieur wordt geen goede manager","Interne recruitment kost meer dan een extern bedrijf inhuren"],"a":2,"u":"Volgens het Peter principle worden mensen gepromoveerd tot het niveau waarop ze niet meer effectief zijn. Een goede ingenieur is daarom niet automatisch een goede manager."},{"t":"6","q":"Bij welke bedrijfsstrategie past interne recruitment het beste volgens het hoofdstuk?","o":["Differentiation, met focus op innovatie","Marktpenetratie via lage prijzen","Cost-leadership","Focus-strategie gericht op een niche"],"a":2,"u":"Interne recruitment past het beste bij cost-leadership omdat het goedkoper is en de kennis in de organisatie blijft. Externe recruitment met focus op innovatie past beter bij differentiation."},{"t":"6","q":"Waarom presteren informele recruitmentbronnen volgens het hoofdstuk vaak beter dan formele bronnen?","o":["Omdat informele bronnen zorgen voor meer diversiteit onder de kandidaten","Omdat informele bronnen minder kosten en de organisatie het uitgespaarde budget in de selectieprocedure zelf kan investeren","Omdat iedereen zich online kan aanmelden en er zo meer kandidaten zijn","Omdat kandidaten via informele bronnen beter weten wat de job inhoudt en complexe informatie eerlijker wordt overgedragen"],"a":3,"u":"Informele bronnen doen het beter omdat kandidaten vaker weten wat de job inhoudt en complexe, face-to-face informatie eerlijker weergeeft hoe de situatie in een bedrijf echt is."},{"t":"6","q":"Waarom gebruiken organisaties nog steeds formele recruitmentbronnen, ondanks de voordelen van informele bronnen?","o":["Omdat informele bronnen homogenere mensen aantrekken, terwijl formele bronnen meer en meer diverse kandidaten opleveren","Omdat formele bronnen goedkoper zijn dan informele bronnen","Omdat formele bronnen de regie bij de kandidaat leggen, waardoor die zelf bepaalt wanneer hij solliciteert en de organisatie minder werk heeft","Omdat formele bronnen complexe informatie beter overdragen"],"a":0,"u":"Via informele bronnen neem je meer homogene mensen aan. Wil je diversere kandidaten aantrekken en meer kandidaten krijgen, dan gebruik je beter een formele bron."},{"t":"6","q":"Wat is de kern van 'employer branding' zoals beschreven in recruitment today?","o":["Het reactief invullen van een openstaande job zodra die vrijkomt, waarbij de organisatie pas over haar imago nadenkt wanneer er een tekort ontstaat","Een sterk werkgeversmerk opbouwen, waarbij insiders vaak de beste recruiters zijn en een betere image ook hun sociale status verhoogt","Kandidaten selecteren op basis van harde criteria en testresultaten","Uitsluitend het plaatsen van vacatures op zoveel mogelijk formele jobsites"],"a":1,"u":"Employer branding draait om een sterk werkgeversmerk. Insiders zijn soms de beste recruiters, en een beter bedrijfsimago verhoogt ook de sociale status van de eigen werknemers."},{"t":"6","q":"Welke twee dimensies van employer image worden in het hoofdstuk onderscheiden?","o":["Interne (door werknemers ervaren) versus externe (door sollicitanten ervaren) dimensies","Instrumentele (tastbare) versus symbolische (niet-tastbare) dimensies","Formele versus informele dimensies","Reactieve versus strategische dimensies"],"a":1,"u":"Employer image kent instrumentele attributen (tastbaar, bruikbaarheid en nut) en symbolische attributen (niet-tastbaar, bijvoorbeeld dat werknemers speels zijn). In de studie bij het Belgisch leger werd meer dan 40% van de job pursuit intentions verklaard door symbolische attributen."},{"t":"6","q":"Wat is de belangrijkste kritiek op traditionele recruitment die aanleiding geeft tot recruitment today?","o":["Het is reactief in plaats van strategisch en heeft geen link met de strategie en met hoe jobs veranderen","Het is te duur, want elke wervingsronde vraagt opnieuw advertenties en tijd, terwijl er telkens te weinig kandidaten opdagen","Het focust te sterk op employer branding in plaats van op de job zelf","Het maakt te veel gebruik van artificiële intelligentie en metrics"],"a":0,"u":"Traditionele recruitment wordt bekritiseerd omdat het reactief is, enkel reageert wanneer een job openstaat, en geen link heeft met de strategie of met hoe jobs veranderen."},{"t":"6","q":"Wat betekent 'targeted recruitment' zoals uitgelegd in het hoofdstuk?","o":["Kandidaten targeten op basis van hun testresultaten na de selectie","Het recruitmentbericht aanpassen aan de persoon die je wilt aanwerven, zoals campus recruitment voor een makkelijk aan te leren job","Alle kandidaten hetzelfde standaardbericht sturen om iedereen gelijk te behandelen","Enkel werven wanneer er een concrete vacature vrijkomt, zodat het recruitmentbudget nooit aan langetermijnplannen wordt uitgegeven"],"a":1,"u":"Bij targeted recruitment pas je je bericht aan aan de persoon die je aanwerft. Voor een job die makkelijk te leren is kan je campus recruitment doen, terwijl je voor een HR-manager een HR-magazine of podcast target."},{"t":"6","q":"Wat is een genoemd nadeel van e-recruitment in het hoofdstuk?","o":["Omdat iedereen de vacature kan zien, zijn de kandidaten waarschijnlijk minder gekwalificeerd","Het kan geen persoonlijke relatie met applicanten opbouwen, waardoor kandidaten tijdens de procedure sneller afhaken","Het is enkel bruikbaar voor interne kandidaten","Het is duurder dan traditionele recruitment en bereikt een kleinere populatie"],"a":0,"u":"E-recruitment is goedkoper en bereikt een grotere populatie, maar het nadeel is dat iedereen de vacature kan zien, waardoor de kandidaten waarschijnlijk minder gekwalificeerd zijn."},{"t":"6","q":"Wat is de kern van een 'employer value proposition'?","o":["Het meten van hoeveel sollicitanten doorstromen naar een volgende ronde, om zo de wervingskanalen te vergelijken","Het vastleggen van het salaris en de secundaire voorwaarden per functie","Het aanpassen van het jobbericht aan systeem 1 in plaats van systeem 2","Het communiceren van de kernwaarden van de organisatie en waarom die verschilt van andere bedrijven"],"a":3,"u":"Een employer value proposition lijkt op het opbouwen van een visie en missie voor werknemers. Het draait vooral om het communiceren van de kernwaarden van de organisatie en waarom je verschilt van andere bedrijven."},{"t":"7","q":"Wat is volgens het basismodel van selectie het criterion domain dat we willen voorspellen?","o":["De duur van de wervingsprocedure","De performantie (prestatie) van de werknemer","Het salaris dat de werknemer zal ontvangen","De grootte van de sollicitantenpool"],"a":1,"u":"Het eerste component in het basismodel is performantie: dit is het criterion domain en dat is precies wat we via de selectie willen voorspellen."},{"t":"7","q":"Welke drie vormen van performantie onderscheidt de leerstof?","o":["Kwantitatieve output, kwalitatieve output en interpersoonlijke performantie","Analytische, praktische en creatieve performantie","Complementaire, verticale en horizontale performantie","Task performance, contextual performance en counterproductive performance"],"a":3,"u":"De bron onderscheidt task performance (in-role, volgens jobbeschrijving), contextual performance (organisationeel burgerschap) en counterproductive performance (bv. stelen of te laat komen)."},{"t":"7","q":"Wat wordt bedoeld met criteriumbesmetting (criterion contamination)?","o":["Dat objectieve en subjectieve maten perfect gecorreleerd zijn","Dat een test irrelevante zaken meebemeet, waardoor ze niet zuiver weergeeft wat we willen meten","Dat de test vooral extreme scores oplevert, zodat kandidaten in het midden nauwelijks van elkaar te onderscheiden zijn","Dat het conceptuele criterium volledig ontbreekt in de meting"],"a":1,"u":"Bij criteriumbesmetting meet de test iets anders mee dan bedoeld. Voorbeeld: een agent arresteert meer mensen omdat zijn district moeilijker is, waardoor de maat niet zuiver de prestatie weergeeft."},{"t":"7","q":"Wat is het verschil tussen een sign en een sample bij selectie-instrumenten?","o":["Een sample laat de kandidaat het relevante gedrag effectief stellen, een sign leidt geschiktheid af uit algemene kenmerken","Een sample meet intelligentie, een sign meet fysieke kracht","Een sign toont het gedrag rechtstreeks, een sample meet enkel karaktertrekken","Een sign en een sample zijn twee benamingen voor hetzelfde instrument, waarbij beide de eerdere werkervaring van de kandidaat in kaart brengen"],"a":0,"u":"Een sample (bv. een Excel-test) is bewijs dat iemand het gedrag kan stellen. Een sign (bv. een IQ- of persoonlijkheidstest) is enkel een indicatie op basis van algemene karakteristieken."},{"t":"7","q":"Waar staat het acroniem OCEAN van de BIG-5 voor?","o":["Openness, Conscientiousness, Extraversion, Agreeableness, Neuroticism","Objectivity, Creativity, Efficiency, Assertiveness, Nervousness","Openness, Cooperation, Endurance, Analysis, Numeracy","Optimism, Charisma, Empathy, Ambition, Neuroticism"],"a":0,"u":"De BIG-5 traits worden samengevat met OCEAN: Openness, Conscientiousness, Extraversion, Agreeableness en Neuroticism. Deze traits zijn normaal verdeeld op een continuum."},{"t":"7","q":"Wat kenmerkt volgens de theorie van Sternberg de praktische intelligentie?","o":["Ze is identiek aan academische intelligentie en volledig door de g-factor bepaald","Ze meet uitsluitend verbale en logische vaardigheden zoals klassieke IQ-tests","Ze omvat tacit kennis die niet expliciet onderwezen wordt maar in veel praktijksituaties vereist is","Ze is een verzamelnaam voor muzikale en lichamelijke vaardigheden die je vooral buiten de werkcontext nodig hebt"],"a":2,"u":"Sternberg onderscheidt analytische, praktische en creatieve intelligentie. Praktische intelligentie is het vermogen om te gaan met echte problemen en steunt op tacit kennis die niet expliciet wordt onderwezen."},{"t":"7","q":"Wat is een centraal kritiekpunt van psychologen en psychometristen op de theorie van meervoudige intelligenties van Gardner?","o":["Dat hij emotionele intelligentie als apart domein negeert in zijn opsomming","Dat hij enkel analytische intelligentie erkent","Dat zijn theorie te weinig populair is bij pedagogen","Dat zijn zogenaamd onafhankelijke domeinen in feite met elkaar gecorreleerd zijn"],"a":3,"u":"Een belangrijke kritiek is dat veel van Gardners zogenaamd onafhankelijke intelligentiedomeinen in werkelijkheid met elkaar gecorreleerd zijn, en dat sommige eerder talenten of vaardigheden zijn dan intelligenties."},{"t":"7","q":"Wat houdt interrater reliability in bij een selectieprocedure?","o":["Dat eenzelfde test bij herhaling dezelfde score geeft","Dat de testscores voorspellend zijn voor latere werkprestaties","Dat het instrument daadwerkelijk meet wat het beweert te meten, los van wie de beoordeling uitvoert","Dat verschillende beoordelaars die dezelfde kandidaat evalueren tot ongeveer dezelfde conclusie komen"],"a":3,"u":"Interrater reliability verwijst naar consistentie tussen beoordelaars: verschillende recruiters die eenzelfde sollicitant interviewen, komen min of meer tot dezelfde conclusie."},{"t":"7","q":"Wat is het verschil tussen normatief en ipsatief scoren bij persoonlijkheidsvragenlijsten?","o":["Normatief meet enkel neuroticisme, ipsatief meet enkel extraversie","Normatief vergelijkt de score met die van anderen, ipsatief laat de kandidaat uitspraken onderling rangschikken","Normatief is altijd onbetrouwbaar, ipsatief is altijd betrouwbaar","Normatief werkt met een gedwongen keuze tussen uitspraken, terwijl ipsatief scoren de antwoorden op een Likertschaal laat invullen"],"a":1,"u":"Bij normatief scoren wordt het antwoord vergeleken met dat van anderen op een schaal. Bij ipsatief scoren rangschikt de aanvrager uitspraken van minst tot meest op zichzelf van toepassing (gedwongen keuze)."},{"t":"7","q":"Wat is het belangrijkste nadeel van de assessment center method zoals beschreven in de leerstof?","o":["Ze kan enkel bij kandidaten met een hoog IQ worden afgenomen","Ze meet uitsluitend fysieke en psychomotorische vaardigheden","Ze is bijzonder goedkoop in gebruik, maar de oefeningen lijken zo weinig op het echte werk dat kandidaten afhaken","De scores worden grotendeels bepaald door de oefening in plaats van door stabiele competenties"],"a":3,"u":"Het nadeel is dat scores vooral door de specifieke oefening worden bepaald, terwijl we net veronderstellen dat competenties zoals communicatie, empathie en determinatie stabiele voorspellers van performantie zijn."},{"t":"7","q":"Waarom hebben situational judgment tests een meerwaarde in een selectieprocedure?","o":["Ze hebben incrementele validiteit en kunnen in het begin samen met IQ-tests gebruikt worden","Ze zijn de goedkoopste vorm van ongestructureerd interview","Ze meten vooral de fysieke geschiktheid voor de job en vullen zo de leemte die IQ-tests laten liggen","Ze vervangen elke andere test omdat ze perfect valide zijn"],"a":0,"u":"Situational judgment tests hebben incrementele validiteit en kunnen vroeg in de procedure gecombineerd worden met bijvoorbeeld IQ-tests, waarbij vooral general intelligence en conscientiousness de werkperformantie goed voorspellen."},{"t":"7","q":"Wat is het onderscheid tussen een situationeel en een behavior-gestructureerd interview?","o":["Het situationele interview vraagt naar toekomstig fysiek uithoudingsvermogen","Het situationele interview peilt naar de salariswensen van de kandidaat, terwijl het behavior-interview vooral zijn diploma's en opleiding overloopt","Het situationele interview is ongestructureerd, het behavior-interview volgt geen vaste vragen","Het situationele interview vraagt wat je zou doen in een situatie, het behavior-interview vraagt wat je in het verleden hebt gedaan"],"a":3,"u":"Het situationele interview steunt op intenties als voorspeller en vraagt wat je zou doen in een gegeven situatie. Het behavior-interview gaat ervan uit dat gedrag uit het verleden toekomstig gedrag voorspelt en vraagt wat je hebt gedaan, vaak via de STAR-methodiek."},{"t":"8","q":"Hoe kun je training volgens de leerstof het best benaderen ten opzichte van de kosten ervan?","o":["Als een beloning waarvan het effect op prestatie niet relevant is","Als een zuivere kostenpost die zoveel mogelijk beperkt moet worden","Als een verplichting die voor alle medewerkers exact gelijk moet zijn","Als een investering, omdat werknemers daardoor beter presteren"],"a":3,"u":"De brontekst benadrukt dat training niet als een cost maar als een investering gezien moet worden, omdat werknemers daardoor beter presteren. Het is bovendien zinvol om iets meer te investeren in bepaalde medewerkers."},{"t":"8","q":"Uit welke drie deelanalyses bestaat de needs analysis in het ideale trainingsmodel?","o":["Strategie-, cultuur- en beloningsniveau","Organisatie-, task- en person level","Input-, throughput- en outputniveau","Markt-, product- en klantniveau"],"a":1,"u":"De needs analysis bestaat uit drie subanalyses: het organisatieniveau, het taskniveau en het personniveau. Op organisatieniveau zit vaak een mismatch tussen cultuur en aanbod."},{"t":"8","q":"Wat is volgens de brontekst een belangrijk aandachtspunt op het person level van de needs analysis?","o":["Dat de doelen door zowel werkgever als werknemer worden geaccepteerd","Dat je geen mensen toevoegt die de basisskills of mogelijkheden missen","Dat er altijd een controlegroep wordt opgezet","Dat de bedrijfscultuur past bij het trainingsaanbod"],"a":1,"u":"Op het personniveau geldt dat je geen mensen moet toevoegen die de basisskills of mogelijkheden niet hebben. Deze analyse richt zich op de individuele deelnemer."},{"t":"8","q":"Waarmee wordt action learning in de brontekst expliciet gelinkt?","o":["De taxonomie van Kirkpatrick","Het Michigan Matching Model","Het AMO-model","Het Peter Principle"],"a":2,"u":"Action learning wordt gekoppeld aan het AMO-model; bij deze methode krijg je onder meer inspraak. Het benadrukt betrokkenheid van de werknemer bij het leerproces."},{"t":"8","q":"Welke rol speelt de werkomgeving volgens de leerstof bij het overdragen van getraind gedrag naar de werkplek?","o":["Ze bepaalt volledig de intrinsieke motivatie van de deelnemer","Ze vervangt de noodzaak van een needs analysis","Ze heeft geen aantoonbaar effect op de transfer","Ze fungeert als bemiddelaar tussen learning en transfer"],"a":3,"u":"De werkomgeving is een soort bemiddelaar tussen learning en transfer. Leren zet zich alleen door als er ondersteuning uit de omgeving is, bijvoorbeeld van een aanmoedigende supervisor."},{"t":"8","q":"Op welke theorie is de nadruk op intrinsieke motivatie in de leerstof gebaseerd?","o":["Goal-setting theory van Locke en Latham","Resource based view","Scientific management van Taylor","Zelf-determinatietheorie"],"a":3,"u":"De nadruk op intrinsieke motivatie, waarbij je iets doet uit interesse, is gebaseerd op de zelf-determinatietheorie. Deze theorie onderscheidt verschillende vormen van motivatie en regulatie."},{"t":"8","q":"Wat kenmerkt introjection als vorm van extrinsieke motivatie?","o":["Je doet iets omdat het een blijvend deel van je identiteit is geworden","Je onderneemt geen enkele actie meer omdat je het nut van de opdracht niet inziet en er niets tegenover staat","Je doet iets omdat het stemmetje in je hoofd het zegt, bijvoorbeeld om schaamte te voorkomen","Je doet iets puur uit interesse en plezier"],"a":2,"u":"Bij introjection doe je iets omdat de persoon in je hoofd zegt dat het moet, bijvoorbeeld om schaamte te voorkomen. Het is een van de minder zelfbepaalde vormen van extrinsieke motivatie."},{"t":"8","q":"Welk niveau van de Kirkpatrick-taxonomie meet gedrag voor en na de training?","o":["Level 2, learning","Level 1, reacties","Level 4, results","Level 3, behavior"],"a":3,"u":"Level 3 (behavior) meet het gedrag voor en na de training. Level 1 betreft reacties, level 2 het leren en level 4 de resultaten."},{"t":"8","q":"Wat is volgens de brontekst een nadeel van trait appraisals?","o":["Ze geven werknemers te veel autonomie over hun beoordeling","Ze focussen te sterk op meetbare resultaten en negeren de persoon","Ze zijn moeilijk te rechtvaardigen en voelen als een persoonlijke aanval","Ze kosten managers extreem veel tijd om bij te houden"],"a":2,"u":"Bij trait appraisals draait het om de kenmerken van een persoon en niet om gedrag. Doordat je geen gedrag beoordeelt, kun je de beoordeling moeilijk rechtvaardigen en wordt ze snel als een persoonlijke aanval ervaren."},{"t":"8","q":"Waarop ligt de nadruk bij Management-by-objectives (MBO)?","o":["Op het doel dat wordt opgesteld en door beide partijen wordt geaccepteerd","Op het onderling rangschikken van medewerkers volgens hun behaalde resultaten","Op het verzamelen van kritische incidenten door de manager","Op de persoonlijkheidskenmerken van de werknemer"],"a":0,"u":"MBO gaat minder over de persoon en meer over het opgestelde doel, dat is gebaseerd op de goal-setting theory van Locke en Latham. Belangrijk is dat het doel door zowel werknemer als werkgever wordt geaccepteerd."},{"t":"8","q":"Wat is een voorbeeld van een impliciet motief dat de accuraatheid van performance management ondermijnt?","o":["Increase transfer: het geleerde uit een training doortrekken naar de werkplek","Needs analysis: de trainingsbehoefte per niveau in kaart brengen","Task maturity: onzekere werknemers extra begeleiding geven","Maintain positive atmosphere: iedereen goed scoren om competitie te vermijden"],"a":3,"u":"Een impliciet motief is maintain positive atmosphere: om competitie te vermijden scoor je iedereen goed. Zulke motieven, zoals ook al genomen beslissingen rechtvaardigen of competent lijken, maken de ratings vaak inaccuraat."},{"t":"8","q":"Hoe verschilt development volgens de terminologie in de leerstof van gewone training?","o":["Development is meer op lange termijn en breder van opzet","Development slaat enkel op het verplichte kostenluik","Development betreft uitsluitend de evaluatie achteraf","Development is meer op korte termijn en enger gericht"],"a":0,"u":"In de terminologie geldt dat development meer op de lange termijn is gericht en breder is dan gewone training. Training is doorgaans specifieker en korter van opzet."},{"t":"8","q":"Wat is volgens de brontekst een kenmerk van relative rankings als kwantitatieve beoordelingsmethode?","o":["Werknemers onder de 10% moeten volgens deze aanpak ontslagen worden","Er zijn veel criteria waarop je gedetailleerd kunt scoren","Managers zijn er dol op omdat ze weinig competitie oproept","De methode werkt zeer informatief omdat je verschillen kunt uitleggen"],"a":0,"u":"Bij relative rankings horen weinig criteria en kan het halo-effect de score kleuren. Werknemers onder de 10% moeten volgens deze aanpak ontslagen worden, wat managers als extreem competitief ervaren."},{"t":"8","q":"Wat houdt de methode tell and listen bij het functioneringsgesprek in?","o":["De beoordeling wordt volledig aan externe raters overgelaten","Er wordt enkel verteld en verkocht, zonder inbreng van de werknemer","De supervisor luistert wel, maar neemt uiteindelijk zelf de beslissing","De werknemer beslist volledig autonoom over de uitkomst"],"a":2,"u":"Bij tell and listen luister je naar de werknemer, maar uiteindelijk maakt de supervisor de beslissing, wat als pseudo-democracy wordt omschreven. Het kan wel leiden tot een betere relatie tussen werkgever en werknemer."},{"t":"9","q":"Belonen zorgt volgens de theorie voor motivationele effecten die het hele bedrijf beinvloeden. Hoe wordt dit effect genoemd?","o":["Relational return","Incentive-effect","Sorting effect","Social loafing"],"a":1,"u":"Het incentive-effect verwijst naar de motivationele werking van beloning: het beinvloedt het gedrag in het hele bedrijf. Het staat naast het sorting effect en de relational return."},{"t":"9","q":"Wat wordt bedoeld met het sorting effect van een beloningssysteem?","o":["Het beloningssysteem trekt mensen aan die er goed op afgestemd zijn, zoals risicozoekers bij pay for performance","Het beloningssysteem verlaagt de totale loonkosten voor het bedrijf","Het beloningssysteem sorteert werknemers automatisch op ancienniteit","Het beloningssysteem zorgt ervoor dat alle werknemers even hard gaan werken, omdat iedereen dezelfde bonus voor ogen heeft"],"a":0,"u":"Door een bepaald type beloning te kiezen trek je de mensen aan die er meer op afgestemd zijn. Wie van risico houdt verkiest pay for performance, wie risico mijdt verkiest een vast loon."},{"t":"9","q":"Waar verwijst de term relational return in het beloningskader naar?","o":["Het rendement van aandelenopties op lange termijn","De verhouding tussen basisloon en commissie","Factoren die te maken hebben met de job en de werkomgeving","Het variabele deel van het loon dat afhangt van de bedrijfswinst"],"a":2,"u":"Relational return verwijst naar niet-financiele factoren die samenhangen met de job en de werkomgeving, zoals het voorbeeld van de omgeving bij Google."},{"t":"9","q":"Wat is een centraal kenmerk, en tegelijk valkuil, van pay for performance systemen?","o":["Ze werken enkel bij grote organisaties met veel werknemers","Waar je voor betaald wordt zal je meer doen, waardoor het niet-beloonde gedrag verwaarloosd kan worden","Ze zijn voor het bedrijf goedkoper dan een vast loon, omdat er enkel uitbetaald wordt in de maanden dat de doelen gehaald worden","Ze verhogen automatisch de langetermijnrelaties met klanten"],"a":1,"u":"Bij pay for performance zal gedrag dat beloond wordt vaker voorkomen. Het nadeel is dat ander, niet-beloond gedrag daardoor verwaarloosd kan worden, zoals blijkt uit de restaurantcase."},{"t":"9","q":"Waarom is merit pay duur voor een bedrijf om in te voeren?","o":["Het vereist verplicht aandelen uit te delen aan alle werknemers","Het is wettelijk verboden om het na een jaar terug te schroeven","Het kan alleen ingevoerd worden samen met een winstdelingsplan, waardoor het bedrijf twee systemen tegelijk moet financieren","Het moet elk jaar opnieuw gegeven worden, en mensen zijn pas gemotiveerd vanaf een verhoging van ongeveer 10 procent"],"a":3,"u":"Merit pay is duur omdat een verhoging die je geeft in principe elk jaar herhaald moet worden. Bovendien raken mensen pas gemotiveerd vanaf een verhoging rond de 10 procent."},{"t":"9","q":"Wat beschrijft het begrip social loafing bij group pay-for-performance?","o":["Hoe groter de groep, hoe meer inzicht mensen hebben in het eindresultaat","Hoe meer mensen aan de groep worden toegevoegd, hoe minder elk individu bijdraagt","De groep verdeelt de winst gelijk over alle leden","Werknemers verlaten de groep zodra de beloning daalt"],"a":1,"u":"Social loafing houdt in dat naarmate er meer mensen aan een groep worden toegevoegd, elk individu minder bijdraagt. In grote organisaties hebben mensen te weinig inzicht in hun eigen bijdrage, waardoor de motivatie daalt."},{"t":"9","q":"Wat is het verschil tussen gainsharing en profit sharing zoals in de tekst beschreven?","o":["Bij gainsharing deel je besparingen, ook als er geen winst is, terwijl profit sharing aan winst gekoppeld is","Profit sharing keert enkel uit wanneer een afdeling kosten bespaart, terwijl gainsharing gekoppeld is aan de winst van het hele bedrijf","Gainsharing geldt enkel voor het management en profit sharing voor iedereen","Gainsharing keert alleen uit in aandelen en profit sharing in cash"],"a":0,"u":"Gainsharing deelt besparingen, dus zelfs als er geen winst is wordt er nog uitgekeerd. Het is nog populairder dan profit sharing, maar leidt niet noodzakelijk to
