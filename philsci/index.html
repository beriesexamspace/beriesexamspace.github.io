<script>
window.PS = {"questions":[{"t":"1","q":"According to the lecture, this course's philosophy of science mainly focuses on:","o":["Metaphysics","Epistemology","Ethics","Aesthetics"],"a":1,"u":"The course focuses on epistemology (how we obtain, justify and compare knowledge), even though metaphysics and epistemology are deeply intertwined."},{"t":"1","q":"According to the JTB (justified true belief) account, which condition is missing in the case of someone who sees a dog but calls it a sheep, while a real sheep happens to be hidden behind a tree?","o":["The belief is not true","The belief is not justified","The person does not believe it","There is no sheep at all"],"a":1,"u":"The belief happens to be true (there is a sheep) and the person believes it, but the belief is not justified: it was based on a wrong observation (a dog, not the sheep)."},{"t":"1","q":"What is the main idea behind why scientific justifications are considered special?","o":["Scientists rely purely on armchair reflection like Aristotle","Scientific claims are 'battle-hardened' through empirical testing, openness to being wrong, and peer review","Scientific knowledge is never revised","Science avoids induction entirely"],"a":1,"u":"Science's justifications are special because claims are tested empirically, scientists remain open to revising their views, and work is checked through peer review before publication."},{"t":"1","q":"What is the purpose of peer review, as described in the lecture?","o":["To let the original author decide alone whether their work is correct","To let other scientists judge whether proposed work is good enough to be published","To replace empirical testing with expert opinion","To guarantee that a theory is permanently true"],"a":1,"u":"Peer review means that before a scientific claim is published, other scientists assess whether the work is good and worthy of publication - it is not just a single person's judgement."},{"t":"1","q":"Which pair does the lecture use as an example of a largely settled scientific fact versus a publicly disputed one?","o":["Heliocentrism (settled) vs. climate change (disputed in public debate)","Astrology (settled) vs. the smoking-cancer link (disputed)","Creationism (settled) vs. evolution (disputed)","Vaccines (settled) vs. heliocentrism (disputed)"],"a":0,"u":"The lecture lists heliocentrism and smoking as largely settled scientific facts, while climate change and vaccines are given as examples where public disagreement persists despite scientific consensus."},{"t":"1","q":"Why, according to the lecture, can't deductive reasoning generate wholly new knowledge?","o":["Because it always leads to false conclusions","Because the conclusion only makes explicit what was already logically contained in the premises","Because it can only be used in mathematics","Because it requires empirical testing to work"],"a":1,"u":"A deductive argument's conclusion follows necessarily from its premises, so you are just making explicit what you already implicitly knew - you don't generate a genuinely new source of knowledge."},{"t":"1","q":"Which of these is the clearest example of inductive reasoning as described in the lecture?","o":["If it rains, the street gets wet; it is raining; therefore the street is wet.","All observed swans are white, therefore all swans are white.","2+2=4, therefore 4-2=2.","If Peter is guilty, he broke the law; Peter broke the law."],"a":1,"u":"Generalising from a limited number of observed cases (all swans seen so far are white) to a universal claim about all swans is the classic example of inductive reasoning given in the lecture."},{"t":"2","q":"According to naive verificationism, an inductive generalisation is justified when:","o":["At least one observation supports it","All observations accord with it and none contradict it","A famous scientist proposed it","It can never be tested"],"a":1,"u":"Naive verificationism holds that an inductive leap is justified if all observations accord with the generalisation and no known observations contradict it."},{"t":"2","q":"What is Hume's problem of induction, as presented in the lecture?","o":["Induction can only be justified by using induction itself, which is circular","Induction always produces false conclusions","Deduction is impossible without induction","Scientists never use inductive reasoning"],"a":0,"u":"Hume points out that the only way to justify using induction is to argue it has worked before - but that argument is itself inductive, making the justification circular."},{"t":"2","q":"What was, according to the lecture, the main historical battleground for the demarcation problem around 1900?","o":["Whether physics is a science","Whether the new social sciences (e.g. Marxism, psychoanalysis) count as scientific","Whether mathematics is empirical","Whether astrology should be taught in schools"],"a":1,"u":"Around 1900 the central debate was whether newer theories such as Marx's and Freud's, which claimed comparability with Darwin and Copernicus, were genuinely scientific."},{"t":"2","q":"Why, according to Popper, is it 'too easy' to confirm theories like Marxism or psychoanalysis?","o":["Because they make extremely precise, falsifiable predictions","Because they are so general that almost any observation can be read as confirming them","Because nobody has ever tested them","Because they rely only on deductive logic"],"a":1,"u":"Popper argued Marxism and psychoanalysis are so broad and flexible that virtually any event can be interpreted as supporting them, giving them suspiciously 'too much explanatory power'."},{"t":"2","q":"Is the demarcation problem, as discussed in the lecture, a normative or a descriptive question?","o":["Descriptive, because it asks how science actually behaves","Normative, because it asks what science ought to be like","Neither, it is a purely empirical question","Both equally, with no real difference between them"],"a":1,"u":"The demarcation problem asks what SHOULD count as science - i.e. what science ought to be like - which makes it a normative rather than a purely descriptive question."},{"t":"2","q":"According to naive verificationism's answer to the demarcation problem, which of the following would NOT count as scientific?","o":["An observational statement such as 'it is 38°C today'","A universal generalisation obtained through justified induction from observations","A statement that follows logically from established scientific theories","A claim that is deliberately shielded from any possible empirical test"],"a":3,"u":"Naive verificationism ties scientific status to observation, justified induction, and logical derivation from established science; a claim shielded from any test cannot be verified this way."},{"t":"3","q":"According to Popper, what is the true hallmark of a scientific theory?","o":["That it can be confirmed by many observations","That it can be falsified by a possible observation","That it agrees with common sense","That it has been accepted by a majority of scientists"],"a":1,"u":"For Popper, falsifiability - the possibility that an observation could prove the theory wrong - is what makes a theory scientific, not the accumulation of confirming evidence."},{"t":"3","q":"In the swan example associated with Popper's view, what does finding a single black swan illustrate?","o":["That confirming evidence is always more valuable than disconfirming evidence","That a single disconfirming observation can falsify a general claim like 'all swans are white'","That swans cannot be studied scientifically","That induction always leads to certain knowledge"],"a":1,"u":"One black swan is enough to falsify the universal claim 'all swans are white', illustrating why Popper saw falsification, not confirmation, as decisive for testing theories."},{"t":"3","q":"What does 'disconfirmation' mean in Popper's framework, and why is it important?","o":["An observation that supports a theory's predictions; it is unimportant","An observation that conflicts with a theory's predictions; it is highly relevant because it can force the theory to be revised or rejected","A statement that cannot be tested at all","A theory that has been proven permanently true"],"a":1,"u":"Disconfirming observations conflict with what a theory predicts. For Popper these are especially important because they are what genuinely test - and can refute - a theory."},{"t":"3","q":"What does Popper mean when he says that, at best, a scientific theory 'is not yet disproven'?","o":["That science can never make progress","That a surviving theory has a strong, permanent claim to absolute truth","That a theory which has survived attempts at falsification has not been shown false yet, but this is not a strong claim to truth","That falsified theories are still considered scientific"],"a":2,"u":"For Popper, surviving falsification only means a theory hasn't been refuted yet - it is not thereby proven true; this is a modest, provisional status rather than a guarantee of truth."},{"t":"3","q":"A good scientific theory, according to Popper, should:","o":["Be vague enough to fit any possible outcome","Be clear about what will NOT happen, i.e. make risky, falsifiable predictions","Avoid making any predictions at all","Only be evaluated by its number of confirming instances"],"a":1,"u":"Popper wanted theories to make bold, detailed predictions about what should not happen, since such falsifiable claims are what allow a theory to be genuinely tested."},{"t":"4","q":"In the Ptolemaic (geocentric) system, why was celestial motion assumed to be circular?","o":["Because circular orbits were empirically measured to be circular","Because circles were considered perfect, fitting the Aristotelian idea that the heavens are perfect","Because Ptolemy could not do the mathematics for other shapes","Because the Church demanded circular orbits"],"a":1,"u":"The Aristotelian background assumption was that the heavens are perfect, and since circles were seen as the perfect shape, celestial motion had to be circular."},{"t":"4","q":"What is meant by 'saving the phenomena' in Ptolemy's astronomical project?","o":["Ignoring observed phenomena that don't fit the theory","Mathematically describing (and for Ptolemy, also predicting) observed astronomical phenomena","Physically preserving ancient astronomical instruments","Proving that the earth does not exist"],"a":1,"u":"'Saving the phenomena' originally meant mathematically describing what had been observed; Ptolemy extended this by also using his model to predict future phenomena."},{"t":"4","q":"Why, according to the lecture, did Ptolemy's geocentric system persist for so long?","o":["It made no predictions at all","It was empirically adequate, fit with Aristotelian physics and Christian theology, and there were no observed alternatives like stellar parallax","It was falsified immediately but kept for tradition","Copernicus's model was clearly worse in every respect"],"a":1,"u":"Ptolemy's system worked well enough in practice, matched the dominant physical and religious worldview, and rival phenomena such as parallax simply couldn't be observed yet."},{"t":"4","q":"What insight does the Ptolemy case illustrate about empirical success and truth?","o":["Empirical success guarantees that a theory is true","A theory can predict phenomena well while still being conceptually false","Only false theories can be empirically successful","Empirical success is irrelevant to scientific theories"],"a":1,"u":"Ptolemy's system predicted celestial phenomena reasonably well for over a thousand years despite being, we now think, fundamentally false - success in prediction does not guarantee truth."},{"t":"4","q":"What problem did Copernicus's heliocentric model share with Ptolemy's geocentric model?","o":["Neither model used any circles","Copernicus's model still used circles upon circles and could not observe stellar parallax either","Copernicus's model was immediately far more accurate","Copernicus rejected all mathematical description"],"a":1,"u":"Despite putting the sun at the centre, Copernicus's model still relied on circular orbits and additional circles, and it likewise could not detect the stellar parallax that was still unobservable."},{"t":"4","q":"According to the lecture, how did Galileo's observation of the phases of Venus function as evidence?","o":["It was irrelevant to the geocentrism/heliocentrism debate","It showed that Venus can be fully illuminated, which disconfirms Ptolemy's version of geocentrism","It proved that the earth does not move","It confirmed that circles are the only possible orbit shape"],"a":1,"u":"Ptolemy's system could not allow Venus to appear fully illuminated, so Galileo's telescopic observation of full and crescent phases of Venus counted as evidence against Ptolemy and for Copernicus."},{"t":"4","q":"What does 'theory-ladenness of observation' mean in the context of the phases-of-Venus discussion?","o":["Observations are made independently of any theoretical assumptions","What counts as evidence (e.g. what a telescope shows) already depends on theoretical assumptions about how the instrument works","Theories can never be tested by observation","Only naked-eye observations count as scientific evidence"],"a":1,"u":"Telescopic evidence only counts as evidence if we already trust the theory behind how telescopes work - so even 'raw' observations are shaped by background theoretical commitments."},{"t":"4","q":"Why does the lecture suggest Kepler's analysis of Mars's motion might NOT count as a 'crucial experiment'?","o":["Because Kepler manipulated Mars directly in a lab","Because Kepler analysed existing data rather than performing a controlled experiment, and the same data was compatible with more than one theoretical framework","Because Mars's motion was never actually measured","Because Kepler agreed completely with Ptolemy"],"a":1,"u":"Kepler worked with Brahe's existing observational data rather than intervening experimentally, and that same data could be accounted for by both Tycho's and Copernicus's frameworks - underdetermination by data."},{"t":"5","q":"Why does Kuhn propose replacing 'theory talk' with the concept of a 'paradigm'?","o":["Because scientific communities share more than abstract theories - they share methods, examples, and a common way of seeing and doing","Because paradigms are easier to falsify than theories","Because he wanted to agree fully with Popper","Because paradigms only refer to symbolic formulas"],"a":0,"u":"Kuhn argues that a theory is too narrow to describe the shared methods, standards, and communal practices of a scientific community, so he introduces 'paradigm' to capture this richer, shared way of seeing and doing science."},{"t":"5","q":"What are 'exemplars' within Kuhn's disciplinary matrix?","o":["Purely symbolic mathematical formulas with no examples","Concrete, shared example problems/solutions that give meaning to the community's formal tools and are used to train new scientists","Metaphysical assumptions about the world","Ethical values scientists should hold"],"a":1,"u":"Exemplars are the standard worked examples (like textbook problems) that a scientific community uses to teach newcomers how to actually apply formulas and concepts, not just state them abstractly."},{"t":"5","q":"During 'normal science', what are scientists mainly doing according to Kuhn?","o":["Constantly trying to falsify the reigning paradigm, as Popper suggested","Solving puzzles within the accepted paradigm, rather than testing or challenging it","Searching for a completely new paradigm every day","Ignoring all anomalies permanently"],"a":1,"u":"Kuhn stresses that scientists in normal science mostly do puzzle-solving inside a shared paradigm - calculating, predicting and refining - rather than actively trying to falsify their basic framework."},{"t":"5","q":"What happens during a 'crisis' phase, in Kuhn's four phases of scientific development?","o":["The community immediately abandons science altogether","Anomalies accumulate, confidence weakens, and previously fixed assumptions become open to question","Everyone instantly agrees on a new paradigm","Nothing changes; crisis is identical to normal science"],"a":1,"u":"In a crisis, persistent unexplained anomalies build up, trust in the current paradigm erodes, rival ideas appear, and even the basic rules of the field can be questioned."},{"t":"5","q":"What does Kuhn mean by 'incommensurability' between paradigms?","o":["That paradigms can always be perfectly translated into each other's terms","That successive paradigms are not fully translatable into one another's conceptual and linguistic frameworks, e.g. key terms change meaning","That paradigms are commercially incompatible","That only one paradigm can ever exist in the history of science"],"a":1,"u":"Incommensurability means that when a paradigm shift occurs, key terms (like 'planet') and standards can genuinely change meaning, so the old and new paradigms cannot be neatly compared or translated term-for-term."},{"t":"5","q":"The duck-rabbit image is used in the lecture to illustrate which dimension of incommensurability?","o":["Semantic incommensurability","Methodological incommensurability","Perceptual incommensurability (a 'gestalt switch')","Historical incommensurability"],"a":2,"u":"The duck-rabbit (and looking at the same night sky differently before/after Copernicus) illustrates perceptual incommensurability: scientists literally 'see' phenomena differently after a paradigm shift."},{"t":"5","q":"According to the lecture, is Kuhn's account normative or descriptive?","o":["Purely normative - he tells scientists exactly what they should do","Mainly descriptive - he describes how science has historically behaved, rather than prescribing an ideal method","Neither normative nor descriptive - purely mathematical","Identical to Popper's normative falsificationism"],"a":1,"u":"Kuhn is presented as giving a historical, descriptive account of how science actually develops (through normal science, crisis and revolution), rather than a normative answer to how science ought to proceed."},{"t":"6","q":"What is Popper's main criticism of 'normal science' as Kuhn describes it?","o":["That normal science does not exist at all","That treating a paradigm as unquestionable risks making science dogmatic","That normal science is too focused on falsification","That Kuhn agrees with him entirely"],"a":1,"u":"Popper worried that if scientists behave the way Kuhn describes - rarely challenging their paradigm - this risks dogmatism, since science should always remain open to critical testing."},{"t":"6","q":"Which claim would Popper reject in the Popper-Kuhn debate?","o":["That science should be open to criticism","That truth is objective and independent of paradigms","That competing paradigms are simply incommensurable with no rational way to compare them","That falsifiability matters for scientific theories"],"a":2,"u":"Popper rejects paradigm relativism: he holds that competing theories can be rationally compared (e.g. by their predictions) and that truth is objective, not relative to a paradigm."},{"t":"6","q":"In the debate about 'is' versus 'ought', what point is being made about Kuhn's approach?","o":["Kuhn only talks about what science ought to be, never what it is","Describing how scientists actually behave (is) does not by itself tell us how science ought to proceed (ought)","There is no difference between is and ought in philosophy of science","Popper only cares about descriptive claims"],"a":1,"u":"The is/ought distinction highlights that Kuhn's descriptive account of scientific behaviour does not automatically settle the normative question of how science should ideally behave."},{"t":"6","q":"According to the lecture, what does Lakatos try to do in relation to the Popper-Kuhn debate?","o":["Ignore both Popper and Kuhn completely","Combine a normative answer to the demarcation problem with a description that stays faithful to the actual history of science","Argue that science should be entirely anarchic","Prove that paradigms do not exist"],"a":1,"u":"Lakatos wants a normative account of good science (unlike Kuhn) that is nonetheless historically realistic about how science actually develops (unlike, he argues, Popper)."},{"t":"7","q":"In Lakatos's model, what is the 'hard core' of a scientific research programme (SRP)?","o":["Auxiliary hypotheses that are freely revised","The fundamental assumptions that, if given up, mean giving up the whole programme","A list of falsified predictions","The peer-review process itself"],"a":1,"u":"The hard core consists of the fundamental, non-negotiable assumptions of a research programme; abandoning the hard core means abandoning the programme itself."},{"t":"7","q":"What is the function of the 'protective belt' around a research programme's hard core?","o":["To make the hard core easier to falsify directly","To absorb anomalies through auxiliary hypotheses, shielding the hard core from falsification","To replace the hard core entirely","To prevent any new predictions from being made"],"a":1,"u":"The protective belt is made of auxiliary hypotheses that can be adjusted or abandoned to explain away anomalies, protecting the hard core itself from being directly falsified."},{"t":"7","q":"What distinguishes a 'positive heuristic' from a 'negative heuristic' in Lakatos's framework?","o":["The positive heuristic drives the programme forward with new predictions; the negative heuristic defends the hard core from problems","The negative heuristic makes new predictions; the positive heuristic only defends the programme","They are two names for the same thing","Only the negative heuristic is ever fallible"],"a":0,"u":"The positive heuristic is the creative, forward-looking strategy (suggesting new experiments, predicting new facts), while the negative heuristic is defensive, protecting the hard core from anomalies."},{"t":"7","q":"What makes a scientific research programme 'progressive' rather than 'degenerating', according to Lakatos?","o":["It only fends off anomalies with ad hoc fixes and never predicts anything new","It generates novel predictions that get confirmed, and adjustments lead to new discoveries rather than just damage control","It has existed for the longest amount of time","It has never faced any anomalies"],"a":1,"u":"A progressive SRP produces new, confirmed predictions and its adjustments lead to genuinely new discoveries; a degenerating one only patches anomalies without any real forward momentum."},{"t":"7","q":"Why does Lakatos reject Popper's idea of 'instant rationality' (immediately abandoning a falsified theory)?","o":["Because he agrees theories should be dropped the instant they are falsified","Because in practice scientists don't discard a theory the moment it faces anomalies, and the rationality of a research programme can only be judged over time","Because falsification never actually happens in real science","Because Lakatos denies that any theories are ever falsified"],"a":1,"u":"Lakatos argues that judging a research programme's rationality requires looking at its development over time (progressive vs. degenerating), not applying an 'instant' verdict the moment an anomaly appears."},{"t":"8","q":"What does Feyerabend's slogan 'anything goes' actually claim, according to the lecture?","o":["That scientists may do literally whatever they like with no need for rationality","That the normative project of finding one fixed method for demarcating science is doomed to fail, though rationality still matters, just not as one fixed rule set","That there is one single correct scientific method after all","That falsification is always the correct method"],"a":1,"u":"'Anything goes' is a provocative way of saying no single set of rules can capture scientific rationality or solve demarcation normatively - it does not mean scientists should abandon reason altogether."},{"t":"8","q":"Feyerabend's theoretical anarchism targets which kinds of philosophical projects?","o":["Only Popper's falsificationism","Only Kuhn's account of paradigms","Normative attempts to demarcate science from non-science in general, including Popper's and Lakatos's approaches","Only feminist philosophy of science"],"a":2,"u":"Feyerabend argues that ALL normative demarcation projects - Popper's falsificationism, Lakatos's SRPs, and others - are doomed to fail at giving fixed criteria for what counts as science."},{"t":"8","q":"What is 'scientific pluralism', as connected to Feyerabend's ideas in the lecture?","o":["The idea that there must always be exactly one unified scientific theory","The idea that having multiple, even conflicting, theories in use at the same time can be beneficial for science","The rejection of all scientific theories","A method for guaranteeing which theory is objectively true"],"a":1,"u":"Scientific pluralism holds that competing theories coexisting and challenging each other is good for science, building on Feyerabend's legacy that diversity of approaches helps progress."},{"t":"8","q":"According to the lecture's discussion of Galileo and the church, what does that historical episode show?","o":["That scientific theories are accepted purely on the basis of evidence, with no role for power or politics","That acceptance of scientific theories can be shaped by power, politics, and social/ethical concerns, not evidence alone","That the church was scientifically correct about geocentrism","That Galileo never faced any opposition"],"a":1,"u":"Galileo's persecution for defending Copernicus shows that political and institutional power - not evidence alone - can shape whether a scientific theory is accepted, and Feyerabend argues such factors are sometimes reasonably at play."},{"t":"8","q":"What is the distinction between the 'context of discovery' and the 'context of justification', and how did Popper use it?","o":["Discovery concerns how ideas are tested; justification concerns how they are born","Discovery concerns the creative, often irrational process of coming up with ideas; justification concerns the logical testing and defending of ideas - Popper thought philosophy should only concern itself with justification","These two contexts are identical in Popper's view","Feyerabend agrees they should be kept strictly separate"],"a":1,"u":"Discovery is about the (often messy, creative) genesis of ideas, while justification is about logically testing and defending them; Popper held that philosophy of science should focus only on justification, a distinction Feyerabend, Kuhn and Lakatos challenge."},{"t":"9","q":"In the lecture's discussion of mathematical 'cranks', what best characterises a crank?","o":["Someone who is always right but modest about it","Someone who fails to meet accepted standards of mathematical reasoning yet stubbornly insists they are correct and others are missing the point","A professional mathematician with a peer-reviewed publication record","Someone who has never attempted to solve a mathematical problem"],"a":1,"u":"Cranks are described as stubborn and often absurd: they don't meet standard mathematical reasoning criteria, yet insist their critics - not them - are mistaken."},{"t":"9","q":"What is the 'three-tiered model of argumentation' (exposure, attention & trust, engagement) used to explain?","o":["Why any argument, however good, automatically gets adopted by the scientific community","Why merely presenting an argument is not enough - it also needs attention, trust, and engagement before it is taken seriously","The three steps of the scientific method","The structure of a peer-reviewed journal article"],"a":1,"u":"The model explains that being exposed to an argument doesn't guarantee it gets attention, trust, or engagement - part of why practitioners often don't engage with cranks' work, whatever its merits."},{"t":"9","q":"In standard academic publishing as described in the lecture, what is 'double-blind reviewing'?","o":["Neither the authors nor the reviewers know each other's identities","Only the authors know the reviewers' identities","Only the reviewers know the authors' identities, which is actually called single-blind","Reviewers do not exist in double-blind reviewing"],"a":0,"u":"Double-blind reviewing means the manuscript is anonymised so reviewers don't know who wrote it, AND the authors are not told who reviewed it - both directions are 'blind'."},{"t":"9","q":"Which of these is NOT one of the time-saving strategies mentioned for validating mathematical proofs in practice?","o":["Deference to authority (trusting a known expert's argument)","Example-based reasoning (checking only a few example cases instead of the general claim)","Fully re-deriving all of mathematics from first principles for every single submission","Comparison with proofs that are already known to be correct"],"a":2,"u":"The lecture lists shortcuts like deference to authority, example-based reasoning, and comparison with known proofs precisely because fully re-deriving everything from scratch for every submission would take far too long."},{"t":"9","q":"What is the difference between a 'manifest' and an 'operative' concept, using the example of cranks?","o":["Manifest = the hidden, implicit criteria; operative = the explicit, public definition","Manifest = the explicit/public idea (e.g. 'gets it wrong, stubborn, absurd'); operative = the implicit, actually-practiced criteria (e.g. not embedded in the literature)","They mean exactly the same thing","Operative concepts apply only to biological parents, not cranks"],"a":1,"u":"The manifest concept of 'crank' is the explicit, intuitive idea (wrong, stubborn), while the operative concept captures what actually, implicitly determines who is excluded in practice (lack of embedding in the literature, non-standard formalisms, etc.)."},{"t":"10","q":"According to the lecture, what is a common misconception about first-wave feminism?","o":["That it focused exclusively on legal and voting rights for all women worldwide equally","That it is often remembered as being about white women's rights only, even though many non-white women also worked on women's issues without as much recognition","That it happened after the second wave","That it had nothing to do with voting rights"],"a":1,"u":"First-wave feminism is often mistakenly remembered as purely a movement of and for white women, when in fact many non-white women contributed to these issues but received less recognition."},{"t":"10","q":"Which of these is presented as an argument against the idea that science is completely 'value-free'?","o":["All scientists agree perfectly on the interpretation of every dataset","Underdetermination of theory by data: different theories can equally fit the same evidence, so evidence alone doesn't determine the 'true' theory","Research agendas are set entirely at random, independent of funding or social priorities","Bias can always be fully eliminated from science"],"a":1,"u":"Underdetermination shows that the same empirical evidence can support multiple competing theories (e.g. Ptolemy and Copernicus both explaining retrograde motion), meaning background values can influence which theory is favoured."},{"t":"10","q":"What does 'standpoint theory' claim about knowledge, as discussed in the lecture?","o":["Everyone's social location is irrelevant to what they can know","One's social location affects what one can perceive and know, and excluding certain groups can lead to incomplete or distorted knowledge","Only people in positions of power can produce reliable knowledge","Standpoint theory denies that knowledge is ever social"],"a":1,"u":"Standpoint theory holds that social position shapes perception and understanding, so excluding certain groups (e.g. from research on their own communities) leads to knowledge gaps or distortions."},{"t":"10","q":"What is Sandra Harding's notion of 'strong objectivity'?","o":["Only dominant groups can produce truly objective knowledge","Knowledge produced from marginalised standpoints can be MORE objective because it can reveal assumptions invisible to dominant perspectives","Objectivity requires ignoring all social standpoints entirely","Strong objectivity means a claim can never be revised"],"a":1,"u":"Harding argues that people at the margins of a dominant group can notice biases and assumptions that are invisible to those in power, so incorporating marginalised standpoints can make science MORE objective, not less."},{"t":"10","q":"According to Longino, what is the primary bearer of 'objectivity' in science?","o":["An individual scientist's personal detachment from all values","The epistemic process/community that generates and critically tests a claim, not the isolated sentence or individual","A single formula that eliminates all social values from research","The seniority of the scientist making the claim"],"a":1,"u":"For Longino, objectivity is a property of the social, critical process by which a scientific community generates, criticises and revises claims - it is a social achievement, not an individual virtue or property of an isolated statement."},{"t":"10","q":"Which of the following is NOT one of Longino's four criteria for an objective scientific community?","o":["Recognised avenues for criticising methods, evidence and assumptions","Shared standards that critics can invoke","Intellectual authority concentrated in a small group of senior gatekeepers","The community as a whole responds to and takes up criticism"],"a":2,"u":"Longino's fourth criterion is that authority should be shared EQUALLY among qualified practitioners, not concentrated among a few gatekeepers - the opposite of what this option states."},{"t":"10","q":"What is Longino's central worry about feminist critiques that fully reject rationality and objectivity?","o":["That rejecting these tools would strip feminists of the resources needed to argue that science is biased in the first place","That objectivity is already perfectly achieved in science","That feminism has nothing to say about science","That rationality and bias are unrelated concepts"],"a":0,"u":"Longino argues that if feminists throw away the ideas of rationality and objectivity altogether, they lose the standards needed to show that certain science IS biased - so she argues for reclaiming, not rejecting, these concepts."},{"t":"11","q":"What is the key claim of scientific realism, as presented in the lecture?","o":["Scientific theories are just useful fictions with no bearing on what's real","Successful scientific theories are (at least approximately) true descriptions of reality, including unobservable parts of it","Science should avoid talking about unobservable entities altogether","Only directly observable things can be discussed by realists"],"a":1,"u":"Realism holds that science aims to describe the world as it really is, and that our best, successful theories are approximately true - even about things we cannot directly observe, like atoms."},{"t":"11","q":"According to anti-realism as presented in the lecture, what are scientific theories?","o":["Literal, true descriptions of unobservable reality","Useful tools for navigating and predicting experience, not necessarily literal truths about unobservable reality","Completely arbitrary stories with no predictive value","Identical in status to realist theories"],"a":1,"u":"The anti-realist sees theories as instruments for organising and predicting our experience - useful even if their descriptions of unobservable entities aren't literally true."},{"t":"11","q":"What are 'natural kinds', according to the lecture's account?","o":["Arbitrary human-made categories with no basis in the world's structure, like national borders","Real categories in nature that things belong together in because of the world's own structure, not because humans invented the grouping","Categories that only apply to living things","Categories that can never be used in scientific explanation"],"a":1,"u":"Natural kinds are categories that reflect real structure in the world (e.g. all electrons sharing the same charge), rather than being merely conventional groupings like political borders."},{"t":"11","q":"In the realist vs. anti-realist debate about depression, what does the anti-realist position claim?","o":["That people cannot actually suffer from depression","That depression may be a heterogeneous, human-made category rather than corresponding to one single natural mechanism, which does not deny people's suffering","That depression definitely has one single biomarker waiting to be discovered","That depression is exactly the same kind of thing as a natural kind like water"],"a":1,"u":"The anti-realist about depression suggests it may group together varied causes/features under one convenient label rather than reflecting one unified natural mechanism - while still accepting that people really do suffer."},{"t":"11","q":"What is the difference between entity realism and theory realism?","o":["They are exactly the same position","Entity realism concerns whether unobservable entities (like electrons) exist and can be manipulated; theory realism concerns whether a well-confirmed theory's overall claims are approximately true","Entity realism only applies to visible objects","Theory realism denies that any entities exist"],"a":1,"u":"Entity realism is about the reality of specific unobservable things we can intervene on, whereas theory realism is the broader claim that a theory's central descriptive claims are approximately true."},{"t":"11","q":"In the Rapa Nui (Easter Island) example, why does Hacking think entity-based evidence (rats, seeds, ecological processes) can be stronger than purely historical theorising?","o":["Because we can experimentally intervene on rats and seeds today, but we cannot intervene on 13th-century Rapa Nui society itself","Because historical theories are always false","Because Theory A (ecocidal collapse) can be directly tested by intervention on the past society","Because intervention is impossible in all sciences, including physics"],"a":0,"u":"Hacking's point is that where we can causally manipulate something (like rats or seeds) in the present, our evidence is stronger; but we cannot intervene on a historical society itself, so theories about it remain more underdetermined."},{"t":"12","q":"What is Descartes' 'interaction problem' for mind-body dualism?","o":["How the body can affect the body","How an immaterial mind, which has no physical properties, spatial location or extension, could causally interact with a physical body","Why the mind and body never interact at all","Why dualism has no critics"],"a":1,"u":"If the mind is truly non-physical and non-spatial, it is unclear how it could causally push or move a physical body, since causal interaction was thought to require contact, energy transfer and spatial location."},{"t":"12","q":"According to logical behaviourism, what does a mental state like 'pain' actually consist of?","o":["A hidden inner substance located in the pineal gland","A behavioural disposition, e.g. the tendency to wince, cry out or avoid the injured limb under certain circumstances","An immaterial thinking substance","A specific pattern of neuron firing, identical across all species"],"a":1,"u":"Logical behaviourists like Ryle and Carnap analyse mental states as behavioural dispositions - conditional patterns of behaviour - rather than as hidden inner entities or substances."},{"t":"12","q":"What is the 'perfect actor' or 'stoic' objection to behaviourism?","o":["It shows that behaviourism perfectly explains all mental states","It shows someone can display pain-behaviour without truly being in pain (actor), or be in pain without displaying the behaviour (stoic), separating mental state from behaviour","It proves that actors cannot have mental states","It has nothing to do with behaviourism"],"a":1,"u":"A skilled actor can convincingly display the behaviour associated with a mental state without actually having it, and a stoic can suppress typical pain-behaviour while still feeling pain - both cases challenge the idea that mental states just ARE behavioural dispositions."},{"t":"12","q":"According to (type) identity theory, what is the mental state of pain identical to?","o":["A behavioural disposition only","A specific physical/brain state, such as the firing of C-fibres","An immaterial substance","A purely functional role that can be realised in any material"],"a":1,"u":"Type identity theory claims mental states are identical to specific brain states - e.g. pain just IS the firing of C-fibres - reducing mental phenomena directly to physical brain processes."},{"t":"12","q":"What does 'multiple realizability' show as a problem for identity theory?","o":["That the exact same mental state (e.g. seeing red) can be produced in radically different physical systems (humans, octopuses, AI), so it cannot be identical to one specific type of brain state","That mental states can never occur in more than one species","That identity theory is completely correct and unchallenged","That behaviourism solves the multiple realizability problem"],"a":0,"u":"If very different physical structures (a human brain, an octopus's nervous system, potentially an AI) can all realise 'seeing red', then that mental state cannot be strictly identical to any single specific type of physical/brain state."},{"t":"12","q":"What is the core idea of functionalism about mental states?","o":["Mental states are identical to one specific brain-state, always the same physical structure","A mental state is defined by its causal/functional role - what causes it and what it in turn causes - rather than by what physical material realises it","Mental states are purely behavioural dispositions with no internal causal role","Functionalism denies that mental states exist"],"a":1,"u":"Functionalism defines mental states by their functional role (inputs, outputs, and connections to other mental states), making them medium-independent - like how a mousetrap is defined by its function, not its material."},{"t":"12","q":"What is Searle's Chinese Room argument meant to show?","o":["That any system producing correct output must genuinely understand the input","That a system can produce correct outputs (e.g. answers in Chinese) via rule-following without genuinely understanding the meaning of the input","That Chinese cannot be learned by computers under any circumstances","That functionalism has no critics"],"a":1,"u":"The person in the room manipulates symbols correctly according to rules without understanding Chinese at all, suggesting that correct functional/computational behaviour alone doesn't guarantee real understanding."},{"t":"12","q":"What is a 'philosophical zombie' in Chalmers' argument, and what is it meant to show?","o":["A creature physically and behaviourally identical to a human but with no conscious experience at all; its conceivability suggests functionalism cannot fully explain consciousness","A horror-movie monster used to disprove dualism","A being that behaves completely differently from humans","Proof that functionalism is definitely true"],"a":0,"u":"A philosophical zombie is functionally and physically identical to a normal human but lacks any inner conscious experience; if such a being is conceivable, this suggests functional states alone cannot be identical to consciousness."},{"t":"12","q":"What is Chalmers' 'hard problem of consciousness'?","o":["Explaining behaviour, memory and learning, which he calls easy problems","Explaining why and how physical processes are accompanied by subjective experience ('what it is like' to be conscious)","A purely engineering problem about building faster computers","A problem that has already been fully solved by neuroscience"],"a":1,"u":"The hard problem is explaining why physical processes (like brain activity) give rise to subjective, felt experience at all - unlike the 'easy problems' of explaining behaviour, which Chalmers thinks are more tractable."},{"t":"12","q":"In the Mary's Room thought experiment, what does it mean if Mary learns something new upon seeing colour for the first time?","o":["It supports the idea that physical facts alone are enough to know what an experience is like","It is often taken as evidence against physicalism, suggesting there are non-physical facts (qualia) about experience","It proves that behaviourism is correct","It shows that Mary already knew everything, with nothing new learned"],"a":1,"u":"If Mary, who knew all the physical facts about colour, still learns something new by experiencing it, this suggests that not all facts about the mind are physical facts - a challenge to physicalism (though the ability/old-fact hypotheses offer replies)."},{"t":"13","q":"According to the lecture, technology can be understood as which three things (not just artifacts)?","o":["Artifacts, practices, and systems","Only artifacts and nothing else","Only abstract theories","Artifacts and emotions"],"a":0,"u":"The lecture distinguishes artifacts (tools/devices), practices (embodied ways of doing things), and systems (stabilised networks of artifacts, practices, people and norms) as three kinds of technology."},{"t":"13","q":"What does the lecture mean by 'technology as a system'?","o":["A single tool used in isolation","A coordinated network of artifacts, practices, people, norms, standards and infrastructure that stabilises how science is done, e.g. the entire psychological research system","Any technology that runs on electricity","A system that has nothing to do with what counts as scientific knowledge"],"a":1,"u":"A technological system is the whole coordinated network (tests, software, review boards, journals, training, etc.) that stabilises scientific practice, shaping what can even count as a fact or phenomenon."},{"t":"13","q":"What is wrong, according to the lecture, with the 'linear model' claiming technology is simply applied science?","o":["Nothing is wrong with it; it is historically accurate","It is historically false: technologies like better lenses or fMRI often came BEFORE and enabled the relevant scientific theories, rather than the reverse","Technology and science have never influenced each other","Science always precedes technology in every single historical case"],"a":1,"u":"The lecture gives examples (better lenses preceding cell theory, fMRI reshaping ideas about mental states) showing technology is often 'upstream' of science, contradicting the simple 'science first, then technology' picture."},{"t":"13","q":"Are technologies value-neutral, according to the discussion of the 'neutrality thesis' and its critics?","o":["Yes, technologies are always neutral tools; only their use carries values","Critics argue design itself embeds values - what is optimised, measured, or ignored (e.g. facial recognition trained mainly on white faces) - so technology is not simply neutral","Only weapons carry values; all other technology is neutral","Values only ever come from users, never from designers"],"a":1,"u":"While the neutrality thesis claims technology is a neutral tool, the lecture's critique is that design choices themselves embed values - who is included, optimised for, or excluded - as in biased facial recognition systems."},{"t":"13","q":"What tension does AI create for the classical scientific ideal linking explanation and prediction?","o":["AI has no relevance to explanation or prediction at all","AI systems can often predict outcomes (e.g. psychiatric risk) very well while explaining almost nothing about why, breaking the traditional link between explanation and prediction","AI always explains phenomena perfectly and never merely predicts","The classical ideal was never about explanation and prediction"],"a":1,"u":"Many AI/machine learning systems predict outcomes accurately using complex correlations without providing an understandable causal explanation, challenging the classical assumption that good prediction requires genuine explanatory understanding."},{"t":"13","q":"How does the lecture describe machine learning in relation to traditional programming?","o":["Machine learning uses explicit, human-written rules for every case, just like traditional programming","In machine learning, computers learn patterns from data instead of being explicitly programmed with fixed rules","Machine learning and traditional programming are identical","Deep learning has nothing to do with machine learning"],"a":1,"u":"Unlike traditional programming, where humans write explicit rules, machine learning lets computers learn patterns directly from data, and deep learning is a type of machine learning using many-layered neural networks."},{"t":"13","q":"What is meant by 'technological mediation' as a takeaway of the philosophy of technology lecture?","o":["Technologies are always separate from and irrelevant to what counts as scientific knowledge","We don't just use technologies instrumentally - they help define and shape what science and knowledge even are","Technology never changes scientific methods or explanations","Mediation means technology always makes science less accurate"],"a":1,"u":"Technological mediation is the idea that technologies actively help constitute what counts as scientific knowledge and practice, not just serve as neutral instruments used after the fact."}],"hacks":[{"h":"JTB minus one letter: JTB = 'Just The Belief' isn't enough","t":"Justified True Belief needs all three: true, believed, AND justified. The sheep-on-the-hill case is true + believed but NOT justified (wrong reason) - so remember: no justification, no knowledge, even if you got lucky."},{"h":"Popper: 'Prove me wrong, not right'","t":"Falsificationism in one line: a theory is scientific only if you can say in advance what observation WOULD prove it false. If nothing could ever falsify it (like astrology's vague predictions), it isn't science."},{"h":"Kuhn's four seasons of science","t":"Remember the cycle as seasons: Pre-paradigm (chaos, no shared view) -> Normal science (calm, puzzle-solving) -> Crisis (anomalies pile up, cracks show) -> Revolution (paradigm shift) -> back to Normal science. It repeats, it doesn't end."},{"h":"Lakatos: hard core = the crown jewels","t":"Hard core = the crown jewels you never touch. Protective belt = the guards you sacrifice first to protect the jewels. Positive heuristic = expanding the treasury (new predictions); negative heuristic = just defending what's already there."},{"h":"Feyerabend: 'anything goes' ≠ 'no rules'","t":"Don't confuse 'anything goes' with 'do whatever you want'. It means: no single fixed rulebook can capture what makes good science across all of history - rationality still exists, just not as one universal method."},{"h":"Natural kinds: nature's own groupings","t":"Ask: 'did humans invent this category, or did nature already group these things together?' Electrons, water, sodium = natural kinds (nature's grouping). Country borders, calendar months = human-made, not natural kinds."},{"h":"Functionalism: it's the job, not the uniform","t":"Think 'mousetrap logic': wood or metal, spring or glue - if it catches mice, it's a mousetrap. Same with pain: brain, silicon or alien goo - if it plays the causal role of pain (caused by damage, causes wincing), it counts as pain."},{"h":"Mary's Room in one image","t":"Mary knows every physics fact about red but has only ever seen black-and-white. The moment she finally sees red, does she learn something new, or not? If yes -> hints that not everything about experience is physical fact (a challenge to physicalism)."},{"h":"Tech as A-P-S: Artifact, Practice, System","t":"A hammer is an Artifact. Knowing HOW to swing it properly is a Practice. The whole construction industry (codes, training, suppliers) around hammers is a System. Science works the same way at all three levels."}],"theory":[{"h":"1. Introduction & justification","items":["Metaphysics: what entities exist, and in what sense? Epistemology: what is knowledge, and how do we obtain, justify, transmit and compare it? The course focuses on epistemology.","JTB account: someone knows something if they believe it, it is true, AND they are justified in believing it. All three are needed - a true, believed guess based on a wrong observation is not knowledge.","Justification is what makes scientific knowledge special: science is 'battle-hardened' through empirical testing, an open-minded willingness to be proven wrong, and peer review.","Peer review: an article is checked by other scientists (usually anonymised) before publication - it is a group of people proposing an idea and a second group checking if it is worthy.","Deductive reasoning: the conclusion follows necessarily from the premises, but generates no genuinely new knowledge - it only makes explicit what was already implied.","Inductive reasoning: generalising from a limited number of observations to a universal claim (e.g. 'all swans are white'); necessary for science, but the sample is always limited."]},{"h":"2. The demarcation problem I","items":["The demarcation problem: when is a theory scientific, and when is it pseudo-science? This is a NORMATIVE question (what science ought to be), not a purely descriptive one.","Naive verificationism: an inductive generalisation is justified if all observations accord with it and none contradict it.","Hume's problem of induction: induction can only be justified by using induction itself, which is circular reasoning.","Around 1900 the demarcation debate centred on whether new social sciences (Marxism, psychoanalysis) were genuinely scientific, using physics and astrology as clear test cases.","Confirmationism: theories are validated by accumulating confirming evidence - Popper rejected this because it is 'too easy' to find confirming instances for very general theories like Marxism or Freudian psychoanalysis."]},{"h":"3. Confirmationism & falsificationism","items":["Popper: the true hallmark of a scientific theory is falsifiability - the possibility that some observation could prove it wrong.","Disconfirmation (an observation conflicting with a prediction) is highly relevant; confirmation is secondary and less decisive.","A good scientific theory is clear about what will NOT happen; the more detailed and risky the prediction, the better the test.","At best, a surviving theory is 'not yet disproven' - this is a modest, provisional status, not proof of truth.","Falsificationism became a widely accepted, celebrated philosophical thesis among scientists."]},{"h":"4. Case study: the Copernican revolution","items":["Ptolemaic (geocentric) system: earth motionless at the centre; heavens perfect, so celestial motion must be circular (Aristotelian background assumption). Ptolemy's goal was to 'save the phenomena' - describe and predict them mathematically.","Ptolemy's system persisted for so long due to empirical adequacy, coherence with Aristotelian physics and Christian theology, and the absence of observable alternatives (e.g. stellar parallax).","Insight: empirical success does not equal truth - a theory can predict well while being conceptually false.","Copernicus proposed heliocentrism, but it still used circles upon circles, didn't solve the equant problem elegantly by itself, and also could not observe parallax - not clearly simpler or more accurate than Ptolemy's model.","Brahe's Tychonic model: earth at centre, sun and moon orbit earth, but planets orbit the sun (geocentrism with heliocentric flavour). Kepler, using Brahe's data, proposed elliptical (not circular) orbits.","Galileo's telescopic observation of the full phases of Venus disconfirmed Ptolemy's geocentrism and supported Copernicus - but this evidence is theory-laden (it presupposes trust in how telescopes work).","A crucial experiment decisively falsifies a theory. Both the phases of Venus and Kepler's analysis of Mars's motion are debated as crucial experiments - the latter is questioned because it involved analysing existing data (not a controlled experiment) and both Tychonic and Copernican models fit the same data (underdetermination)."]},{"h":"5. Kuhn: paradigms & revolutions","items":["Kuhn rejects 'theory talk': what unifies a scientific community is not just abstract theories but a shared way of seeing and doing - a paradigm (or 'disciplinary matrix').","Disciplinary matrix includes: symbolic generalisations (formulas), shared metaphysical commitments, values (e.g. accuracy, simplicity), and exemplars (shared textbook examples used to train scientists).","Four phases of scientific development: pre-paradigmatic (no consensus) -> normal science (puzzle-solving under a shared paradigm) -> crisis (anomalies accumulate, confidence weakens) -> revolution (a new paradigm replaces the old) -> back to normal science.","During normal science, scientists mostly solve puzzles within the paradigm rather than constantly trying to falsify it, contra Popper.","Incommensurability: successive paradigms are not fully translatable into each other's frameworks, across three dimensions: semantic (terms change meaning), methodological (criteria for a 'good' theory change), and perceptual (a 'gestalt switch', e.g. the duck-rabbit)."]},{"h":"6. The Popper-Kuhn debate","items":["Central question: does science progress through rational testing and falsification (Popper), or through paradigm shifts that change the standards of rationality itself (Kuhn)?","Kuhn's critique of Popper: normal science is not constant falsification; paradigms shape what counts as evidence; scientific change is revolutionary, not simply cumulative; paradigms are incommensurable.","Popper's reply: normal science risks becoming dogmatic; he rejects paradigm relativism, holds that truth is objective (independent of paradigms), and stresses the difference between the history/psychology of science (is) and its logic (ought).","The debate is also about what philosophy of science should do: be normative (Popper's ideal of rationality) or descriptive (Kuhn's account of actual scientific behaviour). Lakatos later tries to combine both."]},{"h":"7. Lakatos: research programmes","items":["Lakatos wants a normative answer to demarcation (unlike Kuhn) that stays faithful to the actual history of science (unlike, he argues, Popper).","A Scientific Research Programme (SRP) has: a hard core (fundamental, non-negotiable assumptions - giving these up means giving up the SRP), a protective belt (auxiliary hypotheses that can be revised to absorb anomalies), and heuristics (problem-solving strategies).","Positive heuristic: drives the SRP forward with new predictions and experiments. Negative heuristic: defends the hard core against anomalies.","A progressive SRP generates novel, confirmed predictions and its adjustments lead to new discoveries. A degenerating SRP only makes ad hoc fixes to survive, without producing new discoveries.","No 'instant rationality': Lakatos argues scientists don't drop a theory the moment an anomaly appears - rationality of an SRP can only be judged over time, and a degenerating SRP can become progressive again (and vice versa)."]},{"h":"8. Feyerabend: anything goes","items":["Theoretical anarchism: ALL normative demarcation projects (Popper's falsificationism, Lakatos's SRPs, etc.) are doomed to fail - science is 'an essentially anarchic enterprise'.","'Anything goes' does NOT mean scientists should do whatever they like; it means no single fixed method can capture scientific rationality across all of history - rationality is temporary and local, not universal.","Scientific pluralism: it can be beneficial for multiple, even conflicting, theories to compete at the same time; no single unified 'scientific method' exists (Feyerabend, later also Longino/Chang).","Galileo and the church: acceptance of scientific theories is shaped by power and politics, not evidence alone - and sometimes such political/ethical interference is reasonable (e.g. climate, public health).","Context of discovery (how ideas are born - creative, psychological) vs. context of justification (how ideas are tested and defended - logical). Popper thought philosophy should concern itself only with justification; Feyerabend, Kuhn and Lakatos challenge this separation."]},{"h":"9. Philosophy of mathematics","items":["Mathematical 'cranks': fail to meet accepted standards of reasoning yet stubbornly insist they are right and others are missing the point.","Three-tiered model of argumentation: exposure (knowing an argument exists) -> attention & trust (willingness to engage, trusting the source) -> engagement with content. Cranks' work often fails at the first two stages.","Standard academic publishing: author submits -> editor selects reviewers -> (often unpaid) reviewers assess quality, correctness and novelty -> decision (accept / minor or major revisions / reject) -> possible resubmission cycle.","Double-blind review: neither side knows the other's identity. Single-blind: only the authors are anonymous to the reviewer.","Time-saving validation shortcuts (not just for cranks): quick judgement, line-by-line checking, comparison with known proofs, deference to authority, inconsistency-with-literature checks, example-based reasoning, non-validation, deflection.","Manifest vs. operative concept: the manifest concept of 'crank' is explicit (wrong, stubborn); the operative concept is what actually, implicitly determines exclusion in practice (non-standard formalism, not embedded in the literature)."]},{"h":"10. Feminist philosophy of science","items":["Four waves of feminism: 1st (legal/voting rights), 2nd (workplace, reproductive rights - 'the personal is political'), 3rd (identity, intersectionality), 4th (technology-driven activism). Often wrongly remembered as only about white women.","Science is not value-free: underdetermination of theory by data (same evidence fits multiple theories), research agendas depend on funding/social priorities, and background assumptions can embed cultural stereotypes.","Standpoint theory: social location shapes what one can perceive and know; excluding groups produces incomplete or distorted knowledge. Harding's 'strong objectivity': marginalised standpoints can reveal biases invisible to dominant groups.","Longino's concern: rejecting rationality/objectivity entirely would remove the tools needed to argue science is biased - so she argues for reclaiming, not rejecting, these ideas.","For Longino, objectivity is a property of the social, critical epistemic PROCESS/community, not of an individual or an isolated statement.","Longino's four criteria for an objective community: recognised avenues for criticism; shared standards critics can invoke; the community responds to criticism; intellectual authority shared equally among qualified practitioners."]},{"h":"11. Metaphysics: realism & anti-realism","items":["Realism: successful scientific theories are (approximately) true descriptions of reality, including unobservable parts of it (e.g. atoms really exist).","Anti-realism: theories are useful tools for predicting/organising experience, not necessarily literal truths about unobservable reality.","Natural kinds: real categories grounded in the world's own structure (electrons, water, sodium), not human-made groupings (like national borders).","Realist vs. anti-realist about depression: realist sees it as one unified natural mechanism; anti-realist sees it as a heterogeneous, human-made category grouping varied causes - without denying that people suffer.","Entity realism/anti-realism concerns whether unobservable entities we can manipulate are real; theory realism/anti-realism concerns whether a theory's overall claims are approximately true.","Hacking: where we can experimentally intervene (e.g. on rats, seeds), realism about entities is stronger; where intervention is impossible (e.g. 13th-century Rapa Nui society), theory-choice remains more underdetermined."]},{"h":"12. Philosophy of mind","items":["Descartes' dualism: res cogitans (immaterial, thinking mind) vs. res extensa (physical, extended body). The interaction problem: how can something with no physical properties or location causally affect a physical body? The pineal-gland answer just relocates the problem.","Logical behaviourism (Ryle, Carnap): mental states are behavioural dispositions (e.g. pain = disposition to wince, avoid). Problems: qualia (the actor/stoic objection - behaviour and mental state can come apart) and internal causes seem to matter.","Type identity theory: a mental state (e.g. pain) IS identical to a specific brain state (e.g. C-fibre firing). Problem: multiple realizability - the same mental state (seeing red) can be realised in radically different physical systems (human, octopus, AI), so it can't be just one brain-state type.","Functionalism: a mental state is defined by its causal/functional role (what causes it, what it causes), not by its physical material - medium-independent, like a mousetrap is defined by function, not material.","Searle's Chinese Room: a system can produce correct outputs via rule-following without genuine understanding - a challenge to functionalism/strong AI.","Chalmers' philosophical zombie: physically and functionally identical to a human but with no conscious experience; if conceivable, functionalism cannot fully explain consciousness.","The Hard Problem (Chalmers): explaining WHY physical processes are accompanied by subjective experience at all (unlike the 'easy problems' of behaviour, memory, attention).","Mary's Room: Mary knows all physical facts about colour but has never seen it; if she learns something new upon seeing red, this challenges physicalism (replies: ability hypothesis, old fact hypothesis)."]},{"h":"13. Philosophy of technology & AI","items":["Three kinds of technology: artifacts (tools/devices), practices (embodied, often tacit ways of doing), and systems (coordinated networks of artifacts, practices, people and norms that stabilise a way of doing science).","Against the 'linear model' (science first, then applied as technology): often false historically - e.g. better lenses preceded cell theory, fMRI reshaped what counts as a mental state. Technology is often upstream of science, not just downstream.","Neutrality thesis ('technology is just a neutral tool') vs. critique: design embeds values - what is optimised, measured or ignored (e.g. facial recognition biased toward certain faces, hostile architecture).","AI and explanation vs. prediction: the classical scientific ideal links understanding, explanation and prediction (Newton explained AND predicted). AI often predicts very well (e.g. psychiatric risk) while explaining almost nothing - breaking the traditional link between prediction and explanation.","Machine learning: computers learn patterns from data instead of following explicit human-written rules. Deep learning: a type of machine learning using many-layered neural networks.","Technological mediation: technologies don't just help us reach fixed goals - they help shape and define what our goals, methods and even our concept of knowledge are."]}]};
</script>

    var i2=document.querySelector(".bar>i"); requestAnimationFrame(function(){ if(i2) i2.style.width=i2.getAttribute("data-w")+"%"; });
    document.getElementById("backBtn").onclick=function(){ state.quiz=null; renderQuizGate(); };
    var optBtns=[].slice.call(document.querySelectorAll("#opts .opt"));
    var nb=document.getElementById("nextBtn"); nb.onclick=next; var pb=document.getElementById("prevBtn"); if(pb)pb.onclick=function(){ if(Q.idx>0){ Q.idx--; renderQuiz(); } };
    function showAnswered(i){
      optBtns.forEach(function(b){ var bi=+b.dataset.i; b.disabled=true; if(cur.opts[bi].ok)b.classList.add("correct"); else if(bi===i)b.classList.add("wrong"); });
      var ok=cur.opts[i].ok, fb=document.getElementById("fb"); fb.className="feedback "+(ok?"ok":"no");
      var juist=cur.opts.filter(function(o){return o.ok;})[0].text;
      fb.innerHTML=ok?"<b>"+rnd(PRAISE)+" ✓</b>":"<b>"+wrongLead()+"</b><span class=\"sub\">Juiste antwoord: "+esc(juist)+"</span>";
      var w=document.createElement("div"); w.innerHTML='<div class="whybox"><h4>'+ic("sparkles")+'Waarom?</h4>'+esc(q.u)+'</div>'; fb.appendChild(w);
      nb.classList.remove("hide"); nb.innerHTML=(Q.idx+1>=Q.items.length)?"Bekijk resultaat "+ic("arrowR"):"Volgende "+ic("arrowR");
    }
    function pick(i){ if(Q.answered)return; Q.answered=true; Q.picked=i; Q.picks[Q.idx]=i; var ok=cur.opts[i].ok; if(ok)Q.correct++; else Q.wrong.push(q); recordProg(q.id, ok); showAnswered(i); nb.focus(); }
    optBtns.forEach(function(b){ b.onclick=function(){ pick(+b.dataset.i); }; });
    function next(){ if(!Q.answered)return; Q.idx++; Q.answered=false; Q.picked=-1; if(Q.idx>=Q.items.length)Q.done=true; renderQuiz(); }
    if(Q.answered) showAnswered(Q.picked);
    state.key=function(e){ if(!Q.answered){ var k=e.key.toLowerCase(); var idx="abcde".indexOf(k); if(idx<0&&/[1-5]/.test(k))idx=+k-1; if(idx>=0&&idx<cur.opts.length){pick(idx);e.preventDefault();} } else if(e.key==="Enter"||e.key===" "){ next(); e.preventDefault(); } };
  }

  function renderResult(){
    var Q=state.quiz, p=pct(Q.correct,Q.items.length);
    var msg=p>=80?"Sterk werk! 🎉":p>=60?"Goed bezig 👍":"Blijf oefenen, je komt er 💪";
    var html='<div class="card pad results center"><span class="pill">Philosophy of Science</span><div class="big">'+p+'%</div>'+
      '<p style="font-weight:600;margin:0 0 4px;font-size:17px">'+msg+'</p><p class="muted">'+Q.correct+' van '+Q.items.length+' juist</p>'+
      '<div class="row" style="justify-content:center;margin-top:14px">'+
        (Q.wrong.length?'<button class="btn" id="retry">Herhaal '+Q.wrong.length+' foute vragen</button>':'')+

    var rt=document.getElementById("retry"); if(rt) rt.onclick=function(){ startQuiz(shuffle(Q.wrong)); };

  function renderTheory(){
    var q=state.sumq||"";
    var html='<div class="card pad" style="margin-bottom:14px"><h2 style="text-align:center;margin:0 0 8px">Theorie en samenvatting</h2>'+
      '<input type="search" id="sq" placeholder="Zoek een begrip… (bv. Popper, Kuhn, falsificationism)" value="'+esc(q)+'"></div><div id="list">'+theoryList(q)+'</div>';
    setHTML(html);
    var si=document.getElementById("sq"); si.oninput=function(){ state.sumq=si.value; document.getElementById("list").innerHTML=theoryList(si.value); si.focus(); };
  }
  function theoryList(query){
    var Q=query.trim().toLowerCase(), out="", n=0;
    D.theory.forEach(function(sec){
      var items=sec.items.filter(function(it){ return !Q || it.toLowerCase().indexOf(Q)>=0 || sec.h.toLowerCase().indexOf(Q)>=0; });
      if(!items.length) return; n++;
      out+='<details class="acc"'+(Q?" open":(n===1?" open":""))+'><summary><span class="n">'+ic("search")+'</span>'+esc(sec.h)+ic("chevR","caret")+'</summary><div class="body"><ul>'+items.map(function(it){return '<li>'+hl(esc(it),Q)+'</li>';}).join("")+'</ul></div></details>';
    });
    return out||'<p class="muted center">Geen resultaten voor "'+esc(query)+'".</p>';
  }
  function hl(t,q){ if(!q)return t; try{ return t.replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>"); }catch(e){ return t; } }

  function renderHacks(){
    var html='<div class="card pad" style="margin-bottom:16px"><h2 style="text-align:center;margin:0 0 6px">Studie-hacks</h2><p class="muted" style="text-align:center;margin:0">Ezelsbruggetjes om de kernideeën van philosophy of science te onthouden.</p></div>'+
      '<div class="tipgrid">'+D.hacks.map(function(t){return '<div class="tip"><h4>'+ic("bulb")+esc(t.h)+'</h4><p>'+esc(t.t)+'</p></div>';}).join("")+'</div>';
    setHTML(html);
  }

  function renderFeedback(){
    var html='<div class="card pad"><h2 style="text-align:center;margin-top:0">Feedback &amp; klachten</h2>'+
      '<p class="muted" style="text-align:center">Fout in een vraag, een idee, of werkt iets niet? Laat het hier weten, het komt rechtstreeks bij de maker terecht. Een review of compliment mag ook: de mooiste tonen we op de hub. 💬</p>'+
      '<label class="fld" for="fbMsg">Je bericht</label><textarea id="fbMsg" rows="3" placeholder="Beschrijf de fout of je idee…"></textarea>'+
      '<div class="fbextra"><div class="fbveld fbwaar"><label class="fld" for="fbWaar">Over welke vraag? <span class="muted">(optioneel)</span></label><input type="text" id="fbWaar" placeholder="bv. de vraag over de p-waarde"></div>'+
      '<div class="fbveld"><label class="fld" for="fbNaam">Je naam <span class="muted">(optioneel)</span></label><input type="text" id="fbNaam" placeholder="zodat we je kunnen bedanken"></div>'+
      '<div class="fbveld"><label class="fld" for="fbEmail">Je e-mail <span class="muted">(optioneel, als je een antwoord wilt)</span></label><input type="email" id="fbEmail" placeholder="naam@voorbeeld.be"></div></div>'+
      '<input type="text" id="fbBot" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0">'+
      '<div class="row" style="margin-top:16px;align-items:center"><button class="btn" id="fbSend">'+ic("send")+'Versturen</button><span id="fbStatus" style="font-size:13px"></span></div></div>';
    setHTML(html);
    document.getElementById("fbSend").onclick=function(){
      var status=document.getElementById("fbStatus");
      if(document.getElementById("fbBot").value) return;
      var msg=document.getElementById("fbMsg").value.trim();
      if(!msg){ status.style.color="var(--bad)"; status.textContent="Schrijf eerst een bericht."; return; }
      var btn=document.getElementById("fbSend"); btn.disabled=true; status.style.color="var(--muted)"; status.textContent="Versturen…";
      var em=document.getElementById("fbEmail").value.trim();
      var nm=document.getElementById("fbNaam").value.trim();
      var waar=document.getElementById("fbWaar").value.trim();
      var payload={_subject:"Philosophy of Science-tool: feedback", _template:"table", _captcha:"false",
        Naam:nm||"-", Over_welke_vraag:waar||"-", email:em||"-", Bericht:msg};
      if(em) payload._replyto=em;
      // vangnet: als de verzenddienst blokkeert (bv. spamfilter) of er is geen verbinding,
      // bieden we een directe mailto-knop aan zodat de melding NOOIT stilletjes verdwijnt.
      function failFallback(reden){
        var body="Feedback Philosophy of Science-tool%0D%0A%0D%0ANaam: "+encodeURIComponent(nm||"-")+"%0D%0AOver welke vraag: "+encodeURIComponent(waar||"-")+"%0D%0AE-mail: "+encodeURIComponent(em||"-")+"%0D%0A%0D%0ABericht:%0D%0A"+encodeURIComponent(msg);
        var mailto="mailto:berat007yildirim@gmail.com?subject="+encodeURIComponent("Philosophy of Science-tool: feedback")+"&body="+body;
        setHTML('<div class="card pad"><h2 style="margin-top:0">Automatisch versturen lukte niet</h2><p class="muted">'+reden+' Geen zorgen, klik hieronder en je melding wordt geopend in je e-mail, helemaal klaar om te versturen:</p><a class="btn" href="'+mailto+'">'+ic("send")+'Mail mijn melding direct</a><div style="margin-top:14px"><button class="btn ghost" id="bk">Terug naar start</button></div></div>');
        document.getElementById("bk").onclick=function(){go("home");};
      }
      fetch("https://formsubmit.co/ajax/Berat007yildirim@gmail.com",{method:"POST",headers:{Accept:"application/json"},body:new URLSearchParams(payload)})
        .then(function(r){return r.json();}).then(function(d){
          if(d&&(d.success===true||d.success==="true")){ setHTML('<div class="card pad results center"><div style="font-size:42px">✅</div><h2 style="margin:6px 0">Bedankt!</h2><p class="muted">Je melding is verstuurd.</p><button class="btn" id="bk" style="margin-top:8px">Terug naar start</button></div>'); document.getElementById("bk").onclick=function(){go("home");}; }
          else { failFallback("Het automatisch versturen lukte niet."); }

  document.addEventListener("keydown",function(e){ if(state.key) state.key(e); });
  // bezoeker tellen (1x per toestel)
  try{ if(!localStorage.getItem("philsci_seen")){ localStorage.setItem("philsci_seen","1"); bump("berat-philsci","gebruikers"); } }catch(e){ bump("berat-philsci","gebruikers"); }
  // traject vanuit de hub overnemen → direct naar de oefenpagina
  try{ var _q=new URLSearchParams(location.search); var _m=_q.get("m");
    if(_m==="training"||_m==="herkansing"){ state.track=_m; lset("philsci_track",_m);
      var _c=_q.get("calm"); if(_c!=null){ calm=(_c!=="0"); lset("philsci_calm",calm); applyCalm(); }
      state.step="practice"; state.fromHub=true; }
  }catch(e){}
  render();
  // launch-splash netjes laten verdwijnen
  (function(){ var _sp=document.getElementById("splash"); if(!_sp) return; var _red=false; try{_red=window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){} setTimeout(function(){ _sp.classList.add("hide"); setTimeout(function(){ if(_sp&&_sp.parentNode) _sp.parentNode.removeChild(_sp); }, 700); }, _red?300:1850); })();

<script>
/* gedeelde interactie: klik-animatie en zacht openschuivende theorieblokken */
(function(){
  // Elk theorieblok krijgt precies een wikkel-element, anders klapt een blok met
  // meerdere kinderen niet volledig dicht (MBG had er tien).
  function wikkel(){
    var lijst=document.querySelectorAll(".acc>.body");
    for(var i=0;i<lijst.length;i++){
      var b=lijst[i];
      if(b.children.length===1 && b.firstElementChild && b.firstElementChild.className==="bes-wrap") continue;
      var w=document.createElement("div"); w.className="bes-wrap";
      while(b.firstChild) w.appendChild(b.firstChild);
      b.appendChild(w);
    }
  }
  var gepland=false;
  function planWikkel(){ if(gepland)return; gepland=true; setTimeout(function(){ gepland=false; wikkel(); },0); }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",wikkel); else wikkel();
  try{ new MutationObserver(planWikkel).observe(document.documentElement,{childList:true,subtree:true}); }catch(e){}
  var KLIK="button,.btn,.iconbtn,.opt,.track,.chrow,.backlink,.chip,.mode,.toggle,.scard,.ccard,.qcard,.srclink,.bnlink,.navlink,.ycard,.excat,.brandstrip,summary";
  document.addEventListener("pointerdown",function(e){
    var el=(e.target&&e.target.closest)?e.target.closest(KLIK):null; if(!el)return;
    el.classList.remove("bes-klik"); void el.offsetWidth; el.classList.add("bes-klik");
    setTimeout(function(){ el.classList.remove("bes-klik"); },260);
  },true);
  document.addEventListener("click",function(e){
    var s=(e.target&&e.target.closest)?e.target.closest("details.acc>summary"):null; if(!s)return;
    var d=s.parentNode; if(!d) return;
    e.preventDefault();
    if(d.open){
      d.classList.add("bes-dicht");
      setTimeout(function(){ d.open=false; d.classList.remove("bes-dicht"); },250);
    } else {
      d.open=true; d.classList.add("bes-open");
      var los=function(){ d.classList.remove("bes-open"); };
      requestAnimationFrame(function(){ requestAnimationFrame(los); });
      setTimeout(los,400);
    }
  },false);
})();
</script>
