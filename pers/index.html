<style>
  :root{
    --bg:#f4f2ee; --bg2:#ebe8e2; --card:#ffffff; --ink:#1b232c; --muted:#5d6873;
    --line:#e2ddd4; --accent:#0f6e6a; --accent-ink:#0b4f4c; --accent-soft:#dcefed;
    --amber:#c9821f; --amber-soft:#f7ecd9; --violet:#6d5bd0; --violet-soft:#e9e6fa;
    --good:#1f8a4c; --good-soft:#e2f3e8; --bad:#c23b54; --bad-soft:#fbe5ea;
    --shadow:0 1px 2px rgba(20,30,40,.05),0 6px 18px rgba(20,30,40,.05);
    --shadow-lg:0 2px 6px rgba(20,30,40,.06),0 18px 40px rgba(20,30,40,.10);
    --r:14px; --r-lg:20px; --ease:cubic-bezier(.2,.8,.2,1);
  }
  html[data-theme="dark"]{
    --bg:#11151a; --bg2:#161b22; --card:#1b222b; --ink:#e7ecf1; --muted:#9aa6b2;
    --line:#2a323c; --accent:#3fb9b2; --accent-ink:#7fd6d0; --accent-soft:#163230;
    --amber:#e0a64a; --amber-soft:#2e2515; --violet:#a99cf0; --violet-soft:#221d3a;
    --good:#46c178; --good-soft:#16301f; --bad:#ef6b82; --bad-soft:#331620;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 2px 8px rgba(0,0,0,.4),0 22px 48px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;letter-spacing:-.01em}
  button,a{font-family:inherit;cursor:pointer;color:inherit}
  .wrap{max-width:880px;margin:0 auto;padding:0 18px 96px}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
  .ic{width:1.25em;height:1.25em;flex:none;vertical-align:-.18em;stroke:currentColor;stroke-width:1.75;
    stroke-linecap:round;stroke-linejoin:round;fill:none}

  header.top{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(160%) blur(16px);-webkit-backdrop-filter:saturate(160%) blur(16px);box-shadow:inset 0 -1px 0 0 rgba(0,0,0,.04)}
  .topin{max-width:880px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:700}
  .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,var(--accent),var(--accent-ink));
    color:#fff;display:grid;place-items:center;font-family:Georgia,serif;font-weight:700;font-size:16px;flex:none;
    box-shadow:0 2px 6px rgba(15,110,106,.35)}
  .brand small{display:block;font-weight:500;color:var(--muted);font-size:11px}
  .spacer{flex:1}
  .iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:38px;
    padding:7px 11px;font-size:13.5px;display:inline-flex;gap:7px;align-items:center;text-decoration:none;
    transition:border-color .2s var(--ease),transform .12s var(--ease)}
  .iconbtn:hover{border-color:var(--accent)} .iconbtn:active{transform:scale(.96)}
  nav.tabs{display:flex;gap:2px;overflow:auto;max-width:880px;margin:0 auto;padding:6px 12px 0;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{border:none;background:none;color:var(--muted);padding:10px 13px;border-radius:9px 9px 0 0;
    font-size:14px;font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px;transition:color .2s var(--ease)}
  nav.tabs button .ic{width:16px;height:16px}
  nav.tabs button.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
  nav.tabs button:hover{color:var(--ink)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:20px}
  .muted{color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
  .pill.amber{background:var(--amber-soft);color:var(--amber)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;gap:14px}
  @media(min-width:620px){.g2{grid-template-columns:1fr 1fr}}

  .hero{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin:20px 0 8px}
  .count{flex:none;background:linear-gradient(150deg,var(--accent),var(--accent-ink));color:#fff;border-radius:var(--r);padding:14px 20px;text-align:center;min-width:118px;box-shadow:0 8px 20px rgba(15,110,106,.28)}
  .count b{font-family:Georgia,serif;font-size:32px;display:block;line-height:1}
  .count span{font-size:12px;opacity:.92}
  .herotext h1{margin:0 0 4px;font-size:25px}
  .herotext p{margin:0;color:var(--muted)}

  .brandstrip{display:flex;align-items:center;gap:13px;width:100%;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 16px;margin:14px 0 2px;box-shadow:var(--shadow);transition:border-color .2s var(--ease),transform .15s var(--ease)}
  .brandstrip:hover{border-color:var(--accent);transform:translateY(-1px)}
  .brandstrip .bs-logo{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:17px;background:linear-gradient(145deg,var(--accent),var(--accent-ink))}
  .brandstrip .bs-txt{flex:1;min-width:0} .brandstrip .bs-txt b{display:block;font-size:14.5px} .brandstrip .bs-txt small{color:var(--muted);font-size:12.5px}
  .brandstrip .bs-go{color:var(--accent-ink);flex:none;display:inline-flex} .brandstrip .bs-go .ic{width:18px;height:18px}

  .seclabel{display:flex;align-items:center;gap:8px;margin:24px 0 12px;font-weight:700;font-size:15px}
  .seclabel .ic{width:18px;height:18px;color:var(--accent-ink)}
  .backlink{display:inline-flex;align-items:center;gap:5px;border:none;background:none;color:var(--muted);font-size:13.5px;font-weight:600;padding:6px 0;margin-bottom:4px;transition:color .2s var(--ease)}
  .backlink:hover{color:var(--accent-ink)} .backlink .ic{width:16px;height:16px}
  .tracks{display:grid;gap:14px} @media(min-width:600px){.tracks{grid-template-columns:1fr 1fr}}
  .track{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);transition:transform .22s var(--ease),border-color .22s var(--ease),box-shadow .22s var(--ease)}
  .track:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow-lg)} .track:active{transform:translateY(-1px) scale(.995)}
  .track .tile{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;margin-bottom:4px;background:linear-gradient(150deg,var(--accent),var(--accent-ink))}
  .track.alt .tile{background:linear-gradient(150deg,var(--violet),#4f40a8)} .track .tile .ic{width:24px;height:24px}
  .track b{font-size:18px} .track small{color:var(--muted);font-size:13.5px;line-height:1.5}
  .track .go{margin-top:6px;display:inline-flex;align-items:center;gap:6px;color:var(--accent-ink);font-weight:600;font-size:13.5px} .track.alt .go{color:var(--violet)} .track .go .ic{width:16px;height:16px}
  .toggle{width:48px;height:28px;border-radius:999px;border:none;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s var(--ease)}
  .toggle .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s var(--ease)}
  .toggle.on{background:var(--violet)} .toggle.on .knob{left:23px}
  .warmcard{border-color:var(--violet)!important;background:var(--violet-soft)} .warmcard .ic{width:22px;height:22px;color:var(--violet);flex:none}
  .modebanner{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:11px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent-ink);font-size:13.5px;font-weight:600}
  .modebanner.v{background:var(--violet-soft);color:var(--violet)} .modebanner .ic{width:18px;height:18px} .modebanner a,.modebanner .bnlink{margin-left:auto;font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;color:inherit;border:none;background:none;font-family:inherit;padding:0}
  html.snappy .card,html.snappy .mode,html.snappy .tip,html.snappy .track{animation-duration:.12s!important}
  .mode{display:flex;flex-direction:column;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:17px;gap:7px;box-shadow:var(--shadow);transition:transform .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease)}
  .mode:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .mode .me{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)} .mode .me .ic{width:22px;height:22px}
  .mode b{font-size:16px} .mode small{color:var(--muted);font-size:13px}

  label.fld{display:block;font-size:13px;font-weight:600;margin:16px 0 7px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;min-height:38px;padding:7px 13px;font-size:13.5px;transition:all .18s var(--ease)}
  .chip:hover{border-color:var(--accent)} .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:11px;min-height:46px;padding:12px 20px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;box-shadow:0 4px 12px rgba(15,110,106,.25);transition:background .2s var(--ease),transform .12s var(--ease)}
  .btn:hover{background:var(--accent-ink)} .btn:active{transform:scale(.97) translateY(1px)} .btn .ic{width:18px;height:18px}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none} .btn.ghost:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  input[type=search],input[type=text],input[type=email],textarea{font-family:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
  input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .runtop{display:flex;align-items:center;gap:12px;margin:2px 0 14px;font-size:13px;color:var(--muted)}
  .bar{height:8px;border-radius:6px;background:var(--bg2);overflow:hidden;flex:1}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .7s var(--ease)}
  .qtext{font-size:19px;font-weight:600;margin:8px 0 16px;font-family:Georgia,serif;line-height:1.45}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px 15px;margin-bottom:10px;font-size:15px;transition:border-color .15s var(--ease),background .15s var(--ease),transform .12s var(--ease)}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)} .opt:active:not(:disabled){transform:scale(.99)}
  .opt .k{flex:none;width:27px;height:27px;border-radius:8px;background:var(--bg2);color:var(--muted);display:grid;place-items:center;font-weight:700;font-size:13px}
  .opt.correct{border-color:var(--good);background:var(--good-soft)} .opt.correct .k{background:var(--good);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default}
  .feedback{border-radius:12px;padding:13px 15px;margin:4px 0 12px;font-size:14.5px}
  .feedback.ok{background:var(--good-soft);color:var(--good)} .feedback.no{background:var(--bad-soft);color:var(--bad)}
  .feedback b{font-weight:700} .feedback .sub{display:block;margin-top:3px;color:var(--ink);font-weight:500;opacity:.92}
  .whybtn{border:1px solid var(--line);background:var(--card);color:var(--accent-ink);border-radius:10px;min-height:40px;padding:9px 14px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:border-color .2s var(--ease),background .2s var(--ease)}
  .whybtn:hover{border-color:var(--accent);background:var(--accent-soft)} .whybtn .ic{width:16px;height:16px}
  .whybox{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:14px 16px;margin:12px 0 4px;font-size:14px;line-height:1.55}
  .whybox h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent-ink);font-family:system-ui;display:flex;align-items:center;gap:7px}
  .whybox .ic{width:16px;height:16px}

  .acc{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
  .acc>summary{padding:15px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:11px}
  .acc>summary::-webkit-details-marker{display:none}
  .acc>summary .n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
  .acc>summary .caret{margin-left:auto;color:var(--muted);transition:transform .25s var(--ease)} .acc[open]>summary .caret{transform:rotate(90deg)}
  .acc[open]>summary{border-bottom:1px solid var(--line)} .acc .body{padding:6px 18px 16px}
  .acc h4{margin:14px 0 6px;font-size:13px;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.4px;font-family:system-ui}
  .acc ul{margin:0;padding-left:20px} .acc li{margin:6px 0;font-size:14.5px;line-height:1.5}
  .acc.hack li::marker{content:"💡  "} .acc.hack>summary .n{background:var(--violet-soft);color:var(--violet)}
  mark{background:var(--amber-soft);color:inherit;padding:0 2px;border-radius:3px}

  .tip{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}
  .tip h4{margin:0 0 5px;font-size:14.5px;display:flex;align-items:center;gap:8px;font-family:system-ui} .tip h4 .ic{width:18px;height:18px;color:var(--violet)}
  .tip p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}
  .tipgrid{display:grid;gap:12px} @media(min-width:620px){.tipgrid{grid-template-columns:1fr 1fr}}

  .results .big{font-family:Georgia,serif;font-size:54px;text-align:center;margin:8px 0;line-height:1}
  .center{text-align:center} .hide{display:none!important}
  footer{margin-top:34px;text-align:center;color:var(--muted);font-size:13px}
  .kbd{font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--muted)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.03)}100%{transform:scale(1)}}
  @keyframes optIn{from{opacity:0;transform:translateX(-9px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: no-preference){
    .card,.mode,.tip{animation:fadeUp .34s var(--ease) both}
    .acc{animation:fadeUp .32s var(--ease) both}
    .opt{animation:optIn .3s var(--ease) backwards;animation-delay:var(--oi,0s)}
    .chip.on{animation:pop .22s var(--ease)}
    .feedback{animation:slideIn .26s var(--ease) both} .whybox{animation:slideIn .28s var(--ease) .07s both} .opt.correct{animation:pop .34s var(--ease)}
  }
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  /* ---- Premium launch (Gemini-stijl) + header-logo gloed ---- */
  @property --bes-a{syntax:'<angle>';initial-value:0deg;inherits:false}
  #splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(125% 125% at 50% 38%,var(--bg2) 0%,var(--bg) 68%);transition:opacity .6s var(--ease),transform .7s var(--ease)}
  #splash.hide{opacity:0;transform:scale(1.07);pointer-events:none}
  .sp-inner{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
  .sp-mark{position:relative;width:100px;height:100px;display:grid;place-items:center}
  .sp-mark::before{content:"";position:absolute;inset:-16px;border-radius:34px;z-index:0;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));filter:blur(17px);opacity:.75}
  .sp-mark::after{content:"";position:absolute;inset:-3px;border-radius:27px;z-index:1;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));padding:3px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .sp-logo{position:relative;z-index:2;width:92px;height:92px;border-radius:24px;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:46px;background:linear-gradient(150deg,var(--accent),var(--accent-ink));box-shadow:0 14px 38px rgba(15,110,106,.4)}
  .sp-spark{position:absolute;z-index:3;top:-7px;right:-7px;width:30px;height:30px;color:#fff;filter:drop-shadow(0 2px 7px rgba(0,0,0,.35))}
  .sp-name{position:relative;font-family:Georgia,serif;font-size:26px;font-weight:700;letter-spacing:-.01em;color:var(--ink);overflow:hidden}
  .sp-name::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(-130%)}
  .sp-tag{font-size:13px;color:var(--muted);margin-top:-8px;letter-spacing:.03em}
  @media (prefers-reduced-motion: no-preference){
    .sp-mark::before{animation:bes-spin 3s linear infinite,bes-breathe 2.4s var(--ease) infinite}
    .sp-mark::after{animation:bes-spin 3s linear infinite}
    .sp-logo{animation:bes-pop .7s var(--ease) both}
    .sp-spark{animation:bes-pop .6s var(--ease) .12s both,bes-twinkle 1.9s var(--ease) .9s infinite}
    .sp-name{animation:bes-rise .6s var(--ease) .14s both}
    .sp-name::after{animation:bes-shimmer 1.5s var(--ease) .5s 1}
    .sp-tag{animation:bes-rise .6s var(--ease) .26s both}
  }
  @keyframes bes-spin{to{--bes-a:360deg}}
  @keyframes bes-breathe{0%,100%{opacity:.55;filter:blur(16px)}50%{opacity:.95;filter:blur(22px)}}
  @keyframes bes-shimmer{to{transform:translateX(130%)}}
  @keyframes bes-twinkle{0%,100%{opacity:1;transform:scale(1) rotate(0deg)}50%{opacity:.65;transform:scale(.82) rotate(18deg)}}
  @keyframes bes-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  /* mobiel: header-knoppen alleen iconen zodat niks zijwaarts overflowt */
  @media(max-width:440px){ header.top .iconbtn span{display:none} header.top .iconbtn{padding:7px 9px;min-width:38px;justify-content:center} .topin{gap:8px} }
</style>
</head>
<body>
<div id="splash"><div class="sp-inner">
  <div class="sp-mark">
    <div class="sp-logo">Pe</div>
    <svg class="sp-spark" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.5c.4 4.6 2.4 6.6 7 7-4.6.4-6.6 2.4-7 7-.4-4.6-2.4-6.6-7-7 4.6-.4 6.6-2.4 7-7Z"/></svg>
  </div>
  <div><div class="sp-name">Persoonlijkheidspsychologie</div><div class="sp-tag">slim oefenen voor je examen</div></div>
</div></div>
<header class="top">
  <div class="topin">

<script>
window.PE = {"questions":[{"t":"1","q":"Welke omschrijving past het best bij wat persoonlijkheid volgens de cursus is?","o":["Een patroon van relatief blijvende karaktertrekken en unieke kenmerken dat zorgt voor zowel consistentie als individualiteit in iemands gedrag","Een tijdelijke stemming die per situatie sterk wisselt en losstaat van hoe iemand info verwerkt","Een verzameling testbare hypotheses die via logisch deductief redeneren is opgebouwd en die het gedrag van mensen in elke situatie exact voorspelt","Een neutrale beschrijving die mensen enkel in categorieen indeelt zonder verklaring"],"a":0,"u":"Persoonlijkheid is een patroon van relatief permanente traits en unieke kenmerken die zowel consistentie als individualiteit in het gedrag geven."},{"t":"1","q":"Wat wordt in de cursus bedoeld met een theorie?","o":["Een losse speculatie over hoe mensen zich waarschijnlijk gedragen","Een set gerelateerde veronderstellingen die via logisch deductief redeneren toelaat testbare hypotheses te formuleren","Een enkele hypothese die nog getest moet worden en die na een geslaagd experiment tot een algemene wet wordt verheven","Een taxonomie die verschijnselen enkel ordent en beschrijft"],"a":1,"u":"Een theorie is een set gerelateerde veronderstellingen waarmee je op basis van logisch deductief redeneren testbare hypotheses kunt afleiden. Het is dus geen speculatie, losse hypothese of taxonomie."},{"t":"1","q":"Waarom bestaan er volgens de cursus meerdere persoonlijkheidstheorieen naast elkaar?","o":["Omdat oudere theorieen telkens volledig fout bleken en vervangen moesten worden","Omdat er nog te weinig onderzoek is gedaan om tot een enkele theorie te komen","Omdat theoretici verschillen in persoonlijkheid, in welke data ze kiezen te observeren en in hun filosofische kijk op de wereld","Omdat elke theorie maar op een enkele leeftijdsgroep van toepassing is, waardoor er voor elke levensfase een aparte theorie nodig blijft"],"a":2,"u":"Theorieen ontstaan vaak uit de persoonlijkheid van de theoreticus zelf, uit de data die men kiest te observeren en uit verschillende filosofische orientaties."},{"t":"1","q":"Een onderzoeker vindt dat een nieuwe angstvragenlijst hoog correleert met een al bestaande, valide angsttest. Om welk soort validiteit gaat het hier?","o":["Divergerende validiteit","Predictieve validiteit","Test-hertest betrouwbaarheid","Convergerende validiteit"],"a":3,"u":"Convergerende validiteit betekent dat het instrument hoog correleert met valide metingen die hetzelfde construct meten. Een hoge correlatie met een bestaande angsttest is daar een voorbeeld van."},{"t":"1","q":"Welk kenmerk hoort NIET bij de eigenschappen van een zinvolle theorie zoals de cursus die opsomt?","o":["Ze is spaarzaam en dus niet complexer dan nodig","Ze is falsifieerbaar en dus controleerbaar","Ze garandeert dat haar voorspellingen altijd juist blijken","Ze ordent de reeds gekende data en zet aan tot nieuw onderzoek"],"a":2,"u":"Een zinvolle theorie genereert onderzoek, is falsifieerbaar, organiseert data, leidt handelen, is intern consistent en spaarzaam. Een garantie dat voorspellingen altijd kloppen hoort daar niet bij, falsifieerbaarheid betekent juist dat ze weerlegbaar moet zijn."},{"t":"1","q":"Onder welke klassieke theoretische orientatie plaatst de cursus Allport samen met McCrae en Costa?","o":["Bij de dispositionele theorieen","Bij de psychodynamische theorieen","Bij de humanistische of existentiele theorieen","Bij de biologische theorieen"],"a":0,"u":"In het overzicht van klassieke orientaties vallen Allport en McCrae en Costa onder de dispositionele theorieen."},{"t":"2","q":"Op welk niveau van het mentale leven zit informatie die nu even niet in je bewustzijn is, maar die je snel kunt oproepen zodra je er aandacht aan geeft, zoals wat je gisteren gegeten hebt?","o":["Het voorbewuste","Het onbewuste","Het bewuste niveau","De doodsdrift"],"a":0,"u":"Het voorbewuste bevat tijdelijk vergeten informatie die snel weer opgehaald kan worden zodra je er aandacht aan besteedt."},{"t":"2","q":"Welk deel van de persoonlijkheid werkt volgens het plezierprincipe, is vanaf de geboorte aanwezig en zoekt onmiddellijke bevrediging van de basisinstincten?","o":["Het ego","Het id","Het superego","Het ego-ideaal"],"a":1,"u":"Het id is het primitieve, onbewuste deel dat via het plezierprincipe onmiddellijke voldoening van de driften nastreeft en al vanaf de geboorte aanwezig is."},{"t":"2","q":"Iemand voelt onbewuste seksuele of agressieve verlangens die niet rechtstreeks geuit mogen worden en zet die om in kunst, wat een sociale waarde heeft. Welk afweermechanisme is dit?","o":["Verplaatsing","Reactieformatie","Sublimatie","Regressie"],"a":2,"u":"Bij sublimatie worden onaanvaarde driften geherkanaliseerd naar iets met een sociale waarde dat bijdraagt aan het welzijn van de maatschappij, zoals kunst."},{"t":"2","q":"Welke functie schrijft Freud toe aan het ego binnen de structuur van de persoonlijkheid?","o":["Het bewaart de idealen en beslist wat goed en fout is","Het levert vanaf de geboorte de ruwe driften en instincten","Het bemiddelt volgens het realiteitsprincipe tussen id en superego","Het slaat overgeerfde ervaringen van vorige generaties op"],"a":2,"u":"Het ego werkt volgens het realiteitsprincipe en zoekt hoe het aan de impulsen van het id kan voldoen zonder de morele eisen van het superego te schaden."},{"t":"2","q":"Een medewerker wordt door zijn baas hard aangepakt op het werk, maar durft daar niets van te zeggen. Thuis reageert hij zijn woede af op zijn gezin. Welk afweermechanisme herken je hierin?","o":["Projectie","Verplaatsing","Introjectie","Repressie"],"a":1,"u":"Bij verplaatsing worden onaanvaardbare driften heroriënteerd naar een ander, veiliger persoon of object dan de eigenlijke bron."},{"t":"2","q":"Wat houdt neurotische angst volgens Freud in?","o":["Angst die voortkomt uit sterke morele gevoelens en op schuld lijkt","Bezorgdheid doordat het ego de controle over de impulsen van het id dreigt te verliezen","Angst voor concrete gevaren in de buitenwereld, zoals druk verkeer","Een vage aanhoudende spanning zonder object die aangeboren is en losstaat van de driften van het id"],"a":1,"u":"Neurotische angst komt voort uit de relatie tussen id en ego: het ego verliest de greep op de impulsen van het id en de angst generaliseert zich over situaties."},{"t":"2","q":"Welk subsysteem van het superego verwijst naar het beeld van de persoon die je zou willen zijn en naar je idealen?","o":["Het geweten","Het plezierprincipe","Het ego-ideaal","Het primaire proces"],"a":2,"u":"Het superego werkt via het geweten, wat hoort en niet hoort, en het ego-ideaal, het beeld van wie je zou willen zijn."},{"t":"2","q":"In de metafoor van het buizensysteem onder druk staat het volledig openzetten van de kranen, waarbij je de controle verliest, voor welke toestand?","o":["Morele angst door een streng superego","Neurotische angst doordat het id de controle overneemt","Realistische angst voor de buitenwereld","Een ego dat de opgebouwde druk beheerst en gecontroleerd afvoert"],"a":1,"u":"In de kranenmetafoor staan open kranen voor het id dat je controle doet verliezen, wat samengaat met neurotische angst; dichte kranen staan voor het superego en morele angst."},{"t":"2","q":"Wat is volgens Freud kenmerkend voor een fixatie als afweermechanisme?","o":["De psychische energie blijft geblokkeerd in een bepaald ontwikkelingsstadium","Men valt bij tegenslag terug op kinderlijk gedrag dat bij een vroegere fase paste","Men onderdrukt een impuls door net het tegengestelde te doen","Men neemt positieve eigenschappen van een rolmodel in zich op"],"a":0,"u":"Een fixatie ontstaat wanneer de psychische energie in een bepaald ontwikkelingsstadium geblokkeerd raakt en daar blijft steken."},{"t":"2","q":"Volgens Freud hoort het oedipuscomplex bij de fallische fase. Wat hoort daar bij jongens bij?","o":["Penisnijd tegenover de moeder","Het castratiecomplex en angst voor de vader","Moeilijkheden met de toilettraining","Plezier dat vooral via de mond wordt beleefd"],"a":1,"u":"In de fallische fase kent de jongen volgens Freud een castratiecomplex: hij vreest hetzelfde lot dat hij denkt dat de moeder is overkomen, waardoor het superego zegt dat de gevoelens voor de moeder niet mogen."},{"t":"2","q":"Hoe omschrijft Freud het verschil tussen de manifeste en de latente inhoud van een droom?","o":["De manifeste inhoud is de onderdrukte betekenis, de latente inhoud is wat je bewust navertelt","De manifeste inhoud is wat je bewust kunt beschrijven, de latente inhoud is de onderdrukte betekenis","Beide zijn volledig bewust en verschillen enkel in helderheid","De manifeste inhoud komt uit het id, de latente inhoud uit de buitenwereld"],"a":1,"u":"De manifeste inhoud is wat de persoon bewust over de droom kan vertellen, terwijl de latente inhoud de onderdrukte, verborgen betekenis is."},{"t":"2","q":"Welke omschrijving past het best bij Freuds mensbeeld zoals in de tekst beschreven?","o":["Optimistisch en gericht op vrije keuze en toekomstdoelen","Deterministisch en pessimistisch, met nadruk op oorzaak en het onbewuste","Vooral cultureel bepaald, waardoor veel verandering mogelijk is","Uitsluitend gericht op wat mensen uniek maakt, niet op wat ze delen"],"a":1,"u":"Freuds mensbeeld is deterministisch en pessimistisch: hij legt de nadruk op causaliteit boven teleologie, het onbewuste boven het bewuste en biologie boven cultuur, wat weinig ruimte laat voor verandering."},{"t":"3","q":"Wat bepaalt volgens Horney in belangrijke mate hoe iemands persoonlijkheid zich vormt?","o":["De sociale en culturele omstandigheden tijdens de kindertijd","Aangeboren biologische driften en instincten","De erfelijke temperamentfactoren die kinderen van hun ouders meekrijgen","Het toeval van de seksuele rijping in de puberteit"],"a":0,"u":"Waar Freud biologische driften centraal stelt, ziet Horney juist de sociale en culturele condities in de kindertijd als grotendeels verantwoordelijk voor de persoonlijkheid."},{"t":"3","q":"Een kind waarvan de ouders niet ingaan op de behoefte aan veiligheid en bevrediging, ontwikkelt volgens Horney eerst welke reactie?","o":["Een geïdealiseerd zelfbeeld","Neurotische trots","Fundamentele vijandigheid","Een oedipuscomplex"],"a":2,"u":"Fundamentele vijandigheid ontstaat wanneer ouders niet tegemoetkomen aan de behoeften van het kind aan veiligheid en bevrediging. Die onderdrukte vijandigheid leidt daarna tot fundamentele angst."},{"t":"3","q":"Wat bedoelt Horney met fundamentele angst?","o":["De schrik die een kind voelt bij fysiek gevaar van buitenaf","Het gevoel van faalangst dat opkomt bij prestaties waarop anderen je zullen beoordelen","Een aangeboren doodsdrift die zich tegen het zelf keert","Gevoelens van onzekerheid en spanning die voortkomen uit onderdrukte vijandigheid"],"a":3,"u":"Bij Horney leidt onderdrukte vijandigheid tot fundamentele angst: gevoelens van onzekerheid en spanning tegenover een als vijandig ervaren wereld."},{"t":"3","q":"Waarin verschilt de toon van Horney's theorie van die van Freud?","o":["Horney is optimistischer, omdat sociale factoren kunnen veranderen","Horney is pessimistischer, omdat zij gedrag als onveranderlijk beschouwt","Beiden zijn even pessimistisch over de vaste biologische aard","Freud is optimistischer, omdat hij cultuur centraal stelt"],"a":0,"u":"Horney is optimistischer dan Freud: Freud legt de nadruk op biologische, weinig veranderlijke factoren, terwijl Horney sociale factoren benadrukt die wel kunnen veranderen."},{"t":"3","q":"Iemand vreest vooral om alleen achter te blijven en klampt zich daarom koste wat het kost vast aan iemand sterks. Welke neurotische behoefte past hier het best bij?","o":["Behoefte aan persoonlijke bewondering","Behoefte aan onafhankelijkheid","Behoefte aan een machtige partner","Behoefte aan perfectie"],"a":2,"u":"De neurotische behoefte aan een machtige partner komt voort uit de angst om alleen achter te blijven, waardoor iemand meent per se een sterke partner te moeten hebben."},{"t":"3","q":"Hoe gedraagt een neuroticus met de trend 'tegen mensen' zich volgens Horney typisch?","o":["Onderwerpt zich aan anderen en zoekt vooral affectie en goedkeuring","Trekt zich terug in privacy en weigert elke vorm van hulp","Gaat ervan uit dat iedereen vijandig is en wil anderen uitbuiten en controleren","Wisselt flexibel tussen toenadering en afstand naargelang de situatie"],"a":2,"u":"De agressieve trend 'tegen mensen' neemt aan dat iedereen vijandig is; deze persoon wil machtig zijn, anderen uitbuiten en erkenning, prestige en bewondering krijgen."},{"t":"3","q":"Wat kenmerkt volgens Horney de trend 'weg van mensen', de onthechte persoonlijkheid?","o":["Dwangmatig afstand houden, op privacy staan en geen hulp aanvaarden","Zich onderwerpen aan een sterke partner voor veiligheid","Anderen uitbuiten en domineren om zelf altijd de controle te houden","Iedereen behagen zodat men graag gezien wordt"],"a":0,"u":"De onthechte persoonlijkheid staat op privacy en onafhankelijkheid, aanvaardt geen hulp en maakt dwangmatig afstand tussen zichzelf en anderen, terwijl ze in de eigen wereld naar perfectie streeft."},{"t":"3","q":"Wat is volgens Horney het kernverschil tussen een gezond en een neurotisch persoon in de omgang met de drie trends?","o":["De gezonde persoon gebruikt geen enkele trend, de neuroticus gebruikt ze allemaal","De neuroticus wisselt te snel tussen strategieën, de gezonde houdt er één vast","Het verschil zit enkel in de mate van fundamentele angst, want beide gebruiken de drie trends op precies dezelfde manier","De gezonde persoon is flexibel, terwijl de neuroticus star aan één strategie vasthangt en erin overdrijft"],"a":3,"u":"Een gezonde persoon is flexibel en kan alle drie de trends inzetten; de neuroticus kiest star één strategie, past die altijd toe en overdrijft erin."},{"t":"3","q":"Hoe verklaart Horney het ontstaan van het geïdealiseerde zelfbeeld?","o":["Als een gezonde vorm van zelfvertrouwen bij kinderen met veel affectie","Als oplossing bij kinderen die te weinig affectie kregen en zich minderwaardig en vervreemd voelen","Als een rechtstreeks gevolg van aangeboren superioriteitsgevoelens","Als het rechtstreekse gevolg van een geslaagd doorlopen oedipale fase waarin het kind zich met de ouder identificeert"],"a":1,"u":"Kinderen die te weinig affectie krijgen, voelen zich eenzaam, minderwaardig en vervreemd van zichzelf; als oplossing bouwen ze een overdreven positief zelfbeeld op waarin hun capaciteiten onbeperkt lijken."},{"t":"3","q":"Waarom slaat het geïdealiseerde zelfbeeld volgens Horney uiteindelijk om in zelfhaat?","o":["Omdat anderen de neuroticus voortdurend bekritiseren","Omdat de neuroticus zijn geïdealiseerde beeld op tijd loslaat","Omdat het echte zelf niet overeenkomt met het geïdealiseerde zelfbeeld","Omdat de therapeut de neurotische trots afbreekt"],"a":2,"u":"Neurotische individuen houden niet van zichzelf, want hun echte zelf strookt niet met hun geïdealiseerde zelfbeeld; roem, claims en trots slaan zo om in meedogenloze zelfbeschuldiging en zelfverachting."},{"t":"3","q":"Welke stelling past het best bij Horney's opvatting van de mens?","o":["Determinisme weegt zwaarder dan vrije keuze, ook bij gezonde mensen","Het onbewuste bepaalt vrijwel alles, en bewuste keuzes hebben nauwelijks invloed op de persoonlijkheid","Uniekheid weegt volledig zwaarder dan de overeenkomst tussen mensen","Sociale invloed weegt zwaarder dan biologie, en de mens is optimistisch te benaderen"],"a":3,"u":"Horney benadrukt sociale invloed boven biologie en is optimistisch: zelfs een neurotisch persoon behoudt de vrije keuze om naar zelfrealisatie te evolueren. Bewuste en onbewuste spelen een gelijke rol."},{"t":"4","q":"Waar kwam de persoonsgeoriënteerde theorie van Rogers volgens de tekst vandaan?","o":["Uit zijn ervaringen als psychotherapeut in de praktijk","Uit puur theoretisch denkwerk zonder praktijkervaring","Uit dieronderzoek in het laboratorium","Uit een systematische herformulering van eerdere theorieën"],"a":0,"u":"Rogers' theorie ontstond vanuit zijn praktijkervaring als psychotherapeut, en hij wou die met empirisch onderzoek onderbouwen."},{"t":"4","q":"Wat houdt de actualiserende tendens in?","o":["De neiging van elk organisme om terug te keren naar een eerdere, spanningsloze begintoestand van rust","De neiging van levende wezens om naar vervolmaking te bewegen en hun potentieel volledig te benutten","De neiging om zich altijd aan te passen aan de voorwaarden van anderen","De neiging om ervaringen die niet in het zelfconcept passen te vervormen"],"a":1,"u":"De actualiserende tendens is de drang van alle levende wezens om naar volmaking te gaan en al hun mogelijkheden in te zetten."},{"t":"4","q":"Wat wordt in de tekst beschreven als een kenmerk van een ongezonde persoonlijkheid?","o":["Een klein verschil tussen het zelfconcept en het ideale zelf","Een sterk basisvertrouwen in de menselijke aard","Incongruentie: een zeer groot verschil tussen zelfconcept en ideale zelf","Het volledig opgaan in het huidige moment en openstaan voor nieuwe ervaringen"],"a":2,"u":"Een ongezonde persoonlijkheid kenmerkt zich door incongruentie, een zeer groot verschil tussen zelfconcept en ideale zelf."},{"t":"4","q":"Iemand hoort een compliment maar past het onbewust aan zodat het beter bij zijn negatieve zelfbeeld past. Welke manier van omgaan met de ervaring past hierbij?","o":["Zoals ze is toegelaten in het bewustzijn, zonder aanpassing","Toegelaten in het bewustzijn maar aangepast aan het zelfconcept","Volledig geweigerd en niet toegelaten in het bewustzijn","Onbewust versterkt tot een positiever zelfbeeld"],"a":1,"u":"Bij het vervormde niveau laat je een ervaring wel toe in je bewustzijn, maar pas je ze aan zodat ze in je zelfconcept past."},{"t":"4","q":"Hoe ontstaat zelfachting volgens Rogers, en wat gebeurt er daarna?","o":["Ze ligt bij de geboorte al vast en blijft je hele leven op hetzelfde niveau, wat er ook aan feedback binnenkomt","Ze ontstaat door positieve feedback en waardering, en wordt daarna autonoom zodat je ze niet constant nodig hebt","Ze ontstaat pas in therapie en verdwijnt zodra de therapie stopt","Ze hangt volledig af van je biologische aanleg en niet van contact met anderen"],"a":1,"u":"Zelfachting wordt opgebouwd via ervaringen van positieve feedback en waardering, en eens opgebouwd heb je die niet constant nodig, je wordt autonoom."},{"t":"4","q":"Wat bedoelt Rogers met het introjecteren van voorwaarden van anderen?","o":["Dat je de gevoelens van anderen empathisch aanvoelt en die als je eigen ervaring beleeft","Dat je jezelf aanpast aan de voorwaarden van anderen, wat je uit balans brengt","Dat je onvoorwaardelijk aanvaard wordt door je omgeving","Dat je onbewuste ervaringen in je bewustzijn toelaat zoals ze zijn"],"a":1,"u":"Hoe meer we voorwaarden van anderen introjecteren en ons aanpassen, hoe meer we voor onszelf uit balans raken."},{"t":"4","q":"Welke drie voorwaarden moet de therapeut volgens Rogers vervullen in de psychotherapie?","o":["Interpreteren van dromen, vrije associatie en overdracht","Congruentie, onvoorwaardelijke positieve houding en empathisch luisteren","Beloning, straf en systematische desensitisatie","Diagnose stellen, medicatie voorschrijven en observeren op afstand"],"a":1,"u":"De therapeut moet congruent zijn, een onvoorwaardelijke positieve houding aannemen en empathisch luisteren zodat de patiënt zich veilig voelt."},{"t":"4","q":"Wat gebeurt er volgens Rogers als iemands defensiemechanismen niet meer werken?","o":["De persoon bereikt automatisch zelfactualisatie","De incongruentie verdwijnt vanzelf","De persoon kan psychotisch of gedesorganiseerd worden","De actualiserende tendens stopt volledig"],"a":2,"u":"Wanneer de defensiviteit faalt, kan er desorganisatie optreden en kunnen mensen psychotisch of gedesorganiseerd worden."},{"t":"4","q":"Wat kenmerkt de laatste fase (fase 7) van therapeutische verandering?","o":["De cliënt praat niet over zichzelf en ontkent dat er persoonlijke problemen te bespreken zijn","De cliënt praat over zichzelf als een object","Onomkeerbare verandering waarbij men zichzelf kan helpen en zelfactualisatie bereikt","De cliënt legt de schuld volledig bij externe gebeurtenissen"],"a":2,"u":"In fase 7 is de verandering onomkeerbaar, men kan zichzelf helpen en bereikt zelfactualisatie."},{"t":"4","q":"Welke uitspraak past bij Rogers' mensbeeld?","o":["Determinisme staat boven vrije keuze","Het onbewuste weegt zwaarder door dan het bewuste","Biologie is belangrijker dan sociale invloed","Vrije keuze, optimisme en teleologie krijgen voorrang"],"a":3,"u":"Rogers benadrukt vrije keuze boven determinisme, optimisme boven pessimisme en teleologie boven causaliteit."},{"t":"5","q":"Allport onderscheidt drie niveaus van persoonlijke disposities zonder scherpe grenzen ertussen. Welk niveau is zo overheersend dat het zowat het volledige leven van iemand stuurt?","o":["Kardinale disposities","Centrale disposities","Secundaire disposities","Stilistische disposities"],"a":0,"u":"Kardinale disposities zijn volgens Allport dominerend en zo overheersend dat ze bijna al het gedrag sturen. De grenzen tussen de niveaus zijn volgens hem niet scherp."},{"t":"5","q":"Iemand reageert enkel in heel bepaalde omstandigheden op een vaste manier, bijvoorbeeld zenuwachtig tijdens een sollicitatie maar verder nergens. Welk type dispositie sluit hier het best bij aan?","o":["Kardinale dispositie","Centrale dispositie","Secundaire dispositie","Gemeenschappelijke trek"],"a":2,"u":"Secundaire disposities zijn volgens Allport enkel van toepassing in specifieke situaties. Ze beschrijven de persoon minder algemeen dan centrale of kardinale disposities."},{"t":"5","q":"Wat verstaat Allport onder het proprium?","o":["De aangeboren driften die los van het bewustzijn het gedrag sturen","De kenmerken en gedragingen die mensen zelf als warm en centraal in hun leven zien","De algemene trekken die je in zowat elke persoon van eenzelfde cultuur terugvindt","De reflexmatige reacties op prikkels uit de omgeving"],"a":1,"u":"Het proprium omvat de kenmerken en gedragingen die iemand zelf als warm en centraal in het eigen leven ervaart. Het gaat dus over wat je echt als van jezelf beschouwt."},{"t":"5","q":"Wat houdt het principe van functionele autonomie bij Allport precies in?","o":["Gedrag wordt volledig bepaald door onbewuste jeugdervaringen","Gedrag blijft afhankelijk van voortdurende bekrachtiging van buitenaf","Gedrag verdwijnt zodra de oorspronkelijke behoefte bevredigd is","Gedrag raakt los van het oorspronkelijke motief zodra het een nieuw doel krijgt"],"a":3,"u":"Volgens Allport is gedrag functioneel autonoom zodra het een nieuw doel heeft gekregen. Het raakt dan los van het motief waaruit het ontstond, zoals koken uit honger dat een plezier op zich wordt."},{"t":"5","q":"Iemand begon te lopen om te vermageren, zit intussen op streefgewicht, maar blijft lopen puur omdat het een leuke hobby werd. Welk begrip van Allport illustreert dit het duidelijkst?","o":["Propriate functionele autonomie","Extrinsieke oriëntatie","Perseveratieve functionele autonomie","Gemeenschappelijke trek"],"a":0,"u":"Wanneer gedrag deel wordt van iemands interesses, zoals een hobby, spreekt Allport van propriate functionele autonomie. Het oorspronkelijke doel, vermageren, speelt geen rol meer."},{"t":"5","q":"Waarom aanvaardt Allport wat iemand over zichzelf vertelt als een valide bron van informatie, anders dan Freud?","o":["Omdat onbewuste motieven volgens hem het belangrijkst zijn","Omdat gezonde volwassenen zich bewust zijn van hun handelen en het waarom ervan kennen","Omdat gedrag altijd verklaard moet worden vanuit de vroege kindertijd","Omdat mensen hun ware motieven verbergen en enkel projectieve tests die kunnen blootleggen"],"a":1,"u":"Allport gaat ervan uit dat gezonde volwassenen zich bewust zijn van hun handelen en de reden ervan kennen. Daarom aanvaardt hij zelfrapportage als valide, in tegenstelling tot Freud."},{"t":"5","q":"Welk onderscheid maakt Allport tussen gemotiveerde en stilistische disposities?","o":["Gemotiveerde disposities zijn aangeboren, stilistische zijn aangeleerd","Gemotiveerde disposities zetten aan tot actie, stilistische bepalen de manier waarop je die actie uitvoert","Gemotiveerde disposities zijn kardinale trekken die het hele leven beheersen, stilistische zijn slechts secundaire trekken","Gemotiveerde disposities gelden voor iedereen, stilistische enkel voor gezonde mensen"],"a":1,"u":"Een gemotiveerde dispositie is sterk genoeg om actie te starten, zoals honger dat leidt tot eten. Een stilistische dispositie bepaalt de stijl waarin je die actie uitvoert, zoals belang hechten aan tafelmanieren."},{"t":"5","q":"Wat wordt bedoeld met de morfogenetische (morfogenische) wetenschap bij Allport?","o":["Het zoeken naar algemene wetten die voor alle mensen gelden","Het bestuderen van een persoon tegelijk en van wat specifiek is voor die persoon","Het berekenen van groepsgemiddelden om trekken te vergelijken","Het verklaren van gedrag vanuit aangeboren reflexen die bij iedereen op dezelfde prikkels reageren"],"a":1,"u":"De morfogenetische aanpak bestudeert een persoon tegelijk en richt zich op de structuur die specifiek is voor dat individu. Dat staat tegenover de nomothetische wetenschap, die algemene wetten zoekt."},{"t":"5","q":"Allport omschrijft persoonlijkheid als de 'dynamische organisatie in het individu van psychofysische systemen'. Wat drukt die definitie volgens hem uit?","o":["Persoonlijkheid is louter een verzameling aangeleerde gewoonten","Persoonlijkheid omvat zowel fysieke als psychologische eigenschappen, met plaats voor stabiliteit en flexibiliteit","Persoonlijkheid ligt volledig in het onbewuste vast en verandert na de kindertijd niet meer, hoe de omgeving ook wijzigt","Persoonlijkheid gaat enkel over wat iemand is, niet over wat iemand doet"],"a":1,"u":"Allport ziet persoonlijkheid als een dynamische organisatie van psychofysische systemen, dus zowel fysiek als psychologisch. Ze bevat zowel stabiliteit als flexibiliteit en gaat over is en doet."},{"t":"6","q":"Costa en McCrae kwamen via factoranalyse tot een bepaald aantal persoonlijkheidsfactoren. Hoeveel factoren onderscheiden zij, en hoe verhoudt zich dat tot Cattell en Eysenck?","o":["Vijf factoren, meer dan Eysenck maar veel minder dan Cattell","Zestien factoren, net als Cattell","Drie factoren, net als Eysenck","Vijfendertig factoren, afgeleid uit de eerste-orde traits"],"a":0,"u":"Cattell kwam op zestien factoren, Eysenck op drie en Costa en McCrae op vijf. Het vijffactorenmodel zit qua aantal tussen die twee in."},{"t":"6","q":"De vijf grote dimensies worden samengevat met het letterwoord OCEAN. Welke opsomming komt overeen met de vijf factoren uit de tekst?","o":["Optimisme, controle, empathie, ambitie, nervositeit","Openheid, consciëntieusheid, extraversie, altruïsme, neuroticisme","Openheid, competitie, emotie, autonomie, neurologie","Objectiviteit, creativiteit, extraversie, agressie, nostalgie"],"a":1,"u":"De vijf factoren zijn openheid voor ervaring, consciëntieusheid, extraversie, altruïsme en neuroticisme. Samen vormen ze het letterwoord OCEAN."},{"t":"6","q":"In de tekst wordt een taxonomie tegenover een theorie geplaatst. Waarom is het werk van Costa en McCrae volgens die tekst meer dan alleen een taxonomie?","o":["Omdat ze de trekken enkel benoemen en classificeren zonder verder te gaan","Omdat een taxonomie en een theorie in de praktijk hetzelfde doen, namelijk verschijnselen in vaste categorieën onderbrengen","Omdat ze het aantal factoren met factoranalyse vastlegden en daar stopten","Omdat ze de trekken niet alleen beschrijven, maar ook gedrag proberen te voorspellen en te verklaren"],"a":3,"u":"Een taxonomie is louter beschrijvend en classificerend. Costa en McCrae gaan verder door gedrag te willen voorspellen en verklaren, waardoor het een theorie wordt."},{"t":"6","q":"Het model onderscheidt centrale en perifere componenten. Welk drietal hoort bij de centrale componenten van de persoonlijkheid?","o":["Fundamentele tendensen, karakteristieke aanpassingen en zelfconcept","Biologische basis, objectieve biografie en externe invloeden","Genen, hormonen en hersenstructuren","L-data, Q-data en T-data"],"a":0,"u":"De centrale componenten zijn de fundamentele tendensen, de karakteristieke aanpassingen en het zelfconcept. De biologische basis, objectieve biografie en externe invloeden zijn perifeer."},{"t":"6","q":"Hoe worden de 'fundamentele tendensen' binnen het vijffactorenmodel omschreven?","o":["De attitudes en kennis die iemand over zichzelf heeft","De aanpassingen die iemand ontwikkelt aan zijn concrete omgeving","Het universele, ruwe basismateriaal van de persoonlijkheid","Alles wat iemand in de loop van zijn leven denkt en doet"],"a":2,"u":"Fundamentele tendensen worden omschreven als het universele, ruwe materiaal van de persoonlijkheid. Ze vormen de kern waaruit de rest zich ontwikkelt."},{"t":"6","q":"Het axioma 'origine' gaat over de herkomst van persoonlijkheidstrekken. Wat stelt dit axioma precies?","o":["Dat elke persoon een uniek patroon van trekken bezit dat hem van alle andere mensen onderscheidt","Dat trekken ontstaan uit biologische factoren zoals genen, hormonen en hersenstructuren","Dat trekken hiërarchisch geordend zijn van eng naar algemeen","Dat trekken vooral door de sociale omgeving worden gevormd"],"a":1,"u":"Het axioma origine stelt dat persoonlijkheidstrekken hun oorsprong hebben in biologische factoren: genen, hormonen en hersenstructuren."},{"t":"6","q":"Iemand scoort hoog op neuroticisme. Volgens het structuur-axioma is die algemene trek nog verder onder te verdelen. Welk voorbeeld past hierbij?","o":["Neuroticisme valt uiteen in extraversie, openheid en altruïsme","Neuroticisme valt uiteen in angst, depressie en kwetsbaarheid","Neuroticisme valt uiteen in L-data, Q-data en T-data","Neuroticisme valt uiteen in genen, hormonen en hersenstructuren"],"a":1,"u":"Het structuur-axioma zegt dat trekken hiërarchisch geordend zijn van eng naar algemeen. Zo wordt de algemene trek neuroticisme onderverdeeld in facetten als angst, depressie en kwetsbaarheid."},{"t":"6","q":"Onderzoek in de tekst wijst op zowel stabiliteit als verandering van trekken. Wat wordt gemeld over de ontwikkeling van altruïsme (A) en consciëntieusheid (C)?","o":["A en C blijven volledig onveranderd van kindertijd tot volwassenheid","A en C nemen toe van adolescentie naar late volwassenheid","A en C nemen af naarmate men ouder wordt","A en C worden alleen door hersenschade beïnvloed"],"a":1,"u":"Volgens het aangehaalde onderzoek is er een zekere mate van verandering: altruïsme en consciëntieusheid nemen toe van adolescentie naar late volwassenheid."},{"t":"6","q":"Hoe kan het mensbeeld van McCrae en Costa volgens de tekst het best worden getypeerd?","o":["Ze benadrukken sociale invloed boven biologie en het onbewuste boven het bewuste","Ze leggen de nadruk op vrije keuze, want volgens hen kan iemand zijn trekken door wilskracht bijsturen","Ze hechten meer belang aan biologie dan aan sociale invloed en aan het bewuste boven het onbewuste","Ze beschouwen mensen vooral als onderling gelijk in plaats van uniek"],"a":2,"u":"In hun mensbeeld weegt biologie zwaarder dan sociale invloed en het bewuste zwaarder dan het onbewuste. Ze zien de mens als uniek en houden zich niet bezig met vrije keuze versus determinisme."},{"t":"7","q":"Hoe kun je de manier waarop Eysenck zijn onderzoek aanpakte het best omschrijven?","o":["Hij vertrok van een theorie en overtuiging en zocht daar vervolgens empirisch, repliceerbaar bewijs voor via factoranalyse","Hij verzamelde eerst willekeurig data en liet daar pas achteraf een theorie uit ontstaan","Hij baseerde zich vooral op klinische gesprekken in plaats van op vragenlijsten","Hij verwierp genetische verklaringen volledig en zocht de oorsprong van de dimensies uitsluitend in opvoeding en cultuur"],"a":0,"u":"Eysenck vertrok eerst van een theorie en zocht daar dan empirisch, repliceerbaar bewijs voor via factoranalyse en vragenlijsten (deductieve methode)."},{"t":"7","q":"Waar staat de afkorting PEN bij Eysenck voor?","o":["Perceptie, Emotie en Neurologie","Persoonlijkheid, Erfelijkheid en Neuroticisme","Psychoticisme, Extraversie en Neuroticisme","Passiviteit, Extraversie en Nervositeit"],"a":2,"u":"PEN verwijst naar de drie superfactoren Psychoticisme, Extraversie en Neuroticisme, die elk een bipolair persoonlijkheidstype vormen."},{"t":"7","q":"Eysenck situeerde het verschil tussen extraverten en introverten op het niveau van de corticale opwinding. Wat klopt hierover?","o":["Introverten hebben een lage opwindbaarheid en zoeken daarom extra prikkels","Extraverten hebben een hoge opwindbaarheid en vermijden daarom stimulatie","Introverten hebben een hoge corticale opwindbaarheid en vermijden te veel stimulatie","Er is geen biologisch verschil, het gaat puur om aangeleerd gedrag"],"a":2,"u":"Introverten hebben een hoog niveau van corticale opwindbaarheid en vermijden daarom te veel prikkels, terwijl extraverten een laag niveau hebben en juist extra sensorische stimulatie opzoeken."},{"t":"7","q":"Iemand raakt snel emotioneel opgewonden en kalmeert daarna maar moeilijk, vaak met lichamelijke klachten. Bij welke dimensie hoort dit vooral?","o":["Een hoge score op extraversie","Een hoge score op neuroticisme","Een lage score op psychoticisme","Een hoge score op het superego"],"a":1,"u":"Neurotische mensen overreageren emotioneel en keren moeilijk naar een gewoon niveau terug, gelinkt aan een lagere drempel in het limbisch systeem en de amygdala, vaak met lichamelijke symptomen."},{"t":"7","q":"Welk biologisch profiel hoort volgens de tekst bij een hoge score op psychoticisme?","o":["Hoog testosteron en een laag niveau van MAO, waardoor remmingen wegvallen","Laag testosteron en een hoog niveau van MAO, waardoor iemand extra remt","Een verhoogde activiteit in de amygdala en meer zweten","Een lage corticale opwinding waardoor iemand prikkels opzoekt"],"a":0,"u":"Bij een hoge psychoticismescore hoort een hoog testosterongehalte en een laag niveau van de inhibitor MAO, waardoor remmingen wegvallen."},{"t":"7","q":"Iemand scoort laag op psychoticisme. Welke omschrijving past daar volgens Eysenck bij?","o":["Egoistisch, koud en agressief, met weinig invoelingsvermogen voor anderen","Altruistisch, sociaal empathisch en samenwerkend, met een goed superego","Sociaal teruggetrokken, bedaard en voorzichtig","Emotioneel instabiel met veel lichamelijke klachten"],"a":1,"u":"Een lage score op psychoticisme wijst op altruistisch, sociaal empathisch, conventioneel en samenwerkend gedrag, dus een goed superego."},{"t":"7","q":"Wat zegt Eysenck over de erfelijkheid van de persoonlijkheidsdimensies?","o":["Ongeveer de helft is erfelijk en de helft komt door de omgeving","Ongeveer een kwart is erfelijk en driekwart komt door de omgeving","Ongeveer driekwart van de variatie is erfelijk en een kwart komt door de omgeving","De dimensies zijn volledig aangeleerd, waardoor de omgeving alle variatie verklaart"],"a":2,"u":"Volgens Eysenck kan ongeveer driekwart van de variatie in de persoonlijkheidsdimensies aan erfelijkheid worden toegeschreven en een kwart aan de omgeving."},{"t":"7","q":"In Eysencks hierarchie van gedragsorganisatie staan de types of superfactoren bovenaan. Wat wordt daar precies mee bedoeld?","o":["Losse, eenmalige handelingen of gedachten van een persoon","Gewoontes die iemand bij bepaalde handelingen vertoont","Verzamelingen van trekken die met elkaar geassocieerd zijn, zoals introversie","Trekken die worden afgeleid uit steeds terugkerende gewoontes, zoals impulsiviteit"],"a":2,"u":"Types of superfactoren staan bovenaan de hierarchie en bestaan uit trekken die met elkaar geassocieerd zijn, bijvoorbeeld introversie, dat sociaal teruggetrokken en volhardend zijn combineert."},{"t":"8","q":"Welke elementen rekent Mischel tot de cognitieve factoren die persoonlijkheid mee vormgeven?","o":["Aangeboren temperament en biologische rijping","Onbewuste driften en verdrongen conflicten","Verwachtingen, subjectieve percepties, waarden en doelen","Vaste karaktertrekken die los van de situatie stabiel blijven"],"a":2,"u":"Volgens Mischel spelen cognitieve factoren zoals verwachtingen, subjectieve percepties, waarden en doelen een centrale rol bij het vormen van persoonlijkheid."},{"t":"8","q":"Waarom zette Mischel zich oorspronkelijk af tegen de trektheorie?","o":["Omdat ze de invloed van onbewuste processen negeerde","Omdat ze te sterk de nadruk legde op de consistentie van persoonlijkheid","Omdat ze persoonlijkheid volledig herleidde tot aangeboren biologische aanleg","Omdat ze enkel op kinderen van toepassing zou zijn"],"a":1,"u":"Mischel vond dat de trektheorie te veel de klemtoon legde op consistentie, terwijl volgens hem de specifieke situaties belangrijker zijn."},{"t":"8","q":"Onder welke voorwaarde gedragen mensen zich volgens Mischel wel consistent over verschillende situaties heen?","o":["Wanneer die situaties tot gelijke gevolgen leiden","Wanneer er geen sociale druk aanwezig is","Wanneer hun trekken sterk genoeg ontwikkeld zijn","Wanneer ze er bewust voor kiezen hun gedrag niet aan te passen"],"a":0,"u":"We gedragen ons enkel consistent als situaties tot gelijke gevolgen leiden. Leiden ze tot verschillende gevolgen, dan maken we onderscheid en gedragen we ons anders."},{"t":"8","q":"Wat houdt de consistentieparadox binnen het CAPS-model in?","o":["De paradox houdt in dat persoonlijkheid volledig inconsistent is en dat trekken dus niet bestaan, zodat enkel de situatie bepaalt hoe iemand zich gedraagt","Gedrag is enkel consistent bij mensen met een gezonde persoonlijkheid","Mensen zijn consistent, maar denken zelf dat ze inconsistent zijn","Zowel leken als professionals zien gedrag als vrij consistent, terwijl onderzoek weinig bewijs vindt voor consistentie over situaties heen"],"a":3,"u":"De consistentieparadox: leken en professionals neigen ertoe gedrag als consistent te zien, maar onderzoek toont weinig bewijs dat trekken consistent zijn over situaties heen."},{"t":"8","q":"Hoe wordt gedrag volgens Mischel het best voorspeld?","o":["Enkel op basis van de stabiele trekken van de persoon","Op basis van de situatie alleen, omdat trekken geen voorspellende waarde hebben","Vanuit de persoon, de situatie en vooral de interactie tussen beide","Vanuit onbewuste conflicten uit de vroege kindertijd"],"a":2,"u":"Mischel is ervan overtuigd dat gedrag het best voorspeld wordt vanuit een begrip van de persoon, de situatie en vooral de interactie tussen beide."},{"t":"8","q":"Wat zijn cognitief-affectieve eenheden binnen het CAPS-model?","o":["Alle psychologische, sociale en fysieke aspecten die iemand toelaten met de omgeving om te gaan met een zekere gedragsstabiliteit","Alle stimuli waaraan mensen in een bepaalde situatie aandacht geven","De aangeboren trekken die over alle situaties heen stabiel blijven","De onbewuste afweermechanismen waarmee iemand bedreigende situaties uit het bewustzijn houdt en die samen de kern van de persoonlijkheid vormen"],"a":0,"u":"Cognitief-affectieve eenheden zijn alle psychologische, sociale en fysieke aspecten die iemand toelaten met de omgeving om te gaan met een zekere gedragsstabiliteit, met de nadruk op de interactie."},{"t":"8","q":"Een student ziet een streng examen als een bedreiging, terwijl haar vriend hetzelfde examen als een uitdaging ziet. Welke cognitief-affectieve eenheid illustreert dit vooral?","o":["Competenties, oftewel de gedragingen waarover men denkt te beschikken","Codeerstrategieën, oftewel geïndividualiseerde manieren om externe gebeurtenissen te categoriseren","Situationele variabelen, oftewel alle aanwezige stimuli","Affectieve responsen, oftewel gevoelens die door de situatie zelf worden opgewekt los van interpretatie"],"a":1,"u":"Codeerstrategieën of constructen zijn de geïndividualiseerde manieren waarop mensen externe gebeurtenissen categoriseren, zoals hetzelfde examen anders labelen."},{"t":"8","q":"Wat is het meest kenmerkend voor Mischels mensbeeld?","o":["Gedrag ligt volledig vast door eerdere bekrachtiging, zodat vrije keuze een illusie is","Biologische factoren wegen zwaarder dan sociale factoren","Onbewuste processen wegen zwaarder dan bewuste","De perceptie op een gebeurtenis is belangrijker dan de gebeurtenis zelf"],"a":3,"u":"Voor Mischel is de perceptie op een gebeurtenis belangrijker dan de gebeurtenis zelf. Hij benadrukt daarnaast vrije keuze, bewuste en sociale factoren, en is vooral realistisch en pragmatisch."}],"theory":[{"h":"Inleiding","items":["Persoonlijkheid: een patroon van relatief permanente karaktertrekken en unieke kenmerken dat zorgt voor zowel consistentie als individualiteit in iemands gedrag.","Trait (karaktertrek): een relatief blijvend kenmerk dat mee bepaalt hoe iemand zich consistent gedraagt.","Theorie: een set gerelateerde veronderstellingen waarmee je via logisch deductief redeneren testbare hypotheses kunt formuleren, dus geen speculatie of losse beschrijving.","Waarom meerdere theorieen: ze ontstaan uit de persoonlijkheid van de theoreticus, uit welke data men kiest te observeren en uit uiteenlopende filosofische orientaties.","Zinvolle theorie: een theorie die onderzoek genereert, data ordent en zichzelf kan blijven uitbreiden volgens verschillende criteria.","Falsifieerbaar: de eigenschap dat een theorie te verifieren en controleerbaar is, dus in principe weerlegbaar.","Spaarzaam: de eis dat een theorie niet complexer mag zijn dan strikt noodzakelijk.","Concept over de mensheid: de dimensies waarop mensbeelden verschillen, zoals determinisme versus vrije keuze, pessimisme versus optimisme en bewuste versus onbewuste determinanten.","Betrouwbaarheid: het empirische criterium dat aangeeft of een meting stabiel is, bijvoorbeeld via test-hertest betrouwbaarheid en interne consistentie.","Validiteit: het empirische criterium dat aangeeft of een instrument echt meet wat het hoort te meten.","Convergerende validiteit: het instrument correleert hoog met valide metingen van hetzelfde construct.","Divergerende validiteit: lage of niet-significante correlaties met vragenlijsten die een ander construct meten.","Discriminante validiteit: de vragenlijst maakt onderscheid tussen groepen waarvan men weet dat ze op het gemeten construct verschillen.","Predictieve validiteit: de mate waarin een test toekomstig gedrag kan voorspellen."]},{"h":"Freud (psychodynamisch)","items":["Bewuste: het enige niveau van mentaal leven dat direct beschikbaar is voor jou.","Voorbewuste: informatie die nu niet bewust is, maar makkelijk opgeroepen kan worden zodra je er aandacht aan geeft.","Onbewuste: verzameling van geblokkeerde emoties, verlangens en herinneringen die angst opwekken of maatschappelijk niet geuit mogen worden; voor Freud het belangrijkste niveau.","Id: het primitieve, onbewuste deel dat via het plezierprincipe onmiddellijke bevrediging van driften zoekt en aanwezig is vanaf de geboorte.","Ego: het rationele deel dat volgens het realiteitsprincipe bemiddelt tussen id en superego en over afweermechanismen beschikt.","Superego: het idealistische deel dat via geweten en ego-ideaal bepaalt wat goed en fout is en waar je naartoe wilt.","Repressie: het basismechanisme waarbij je ongewenste impulsen of angstige ervaringen uit het bewuste blokkeert.","Verplaatsing: onaanvaardbare driften heroriënteren naar een veiliger persoon of object dan de echte bron.","Sublimatie: onaanvaarde driften herkanaliseren naar iets met sociale waarde, zoals kunst.","Neurotische angst: bezorgdheid doordat het ego de controle over de impulsen van het id dreigt te verliezen.","Morele angst: angst die op schuld lijkt en voortkomt uit sterke morele gevoelens vanuit het superego.","Fixatie: het blijven steken van psychische energie in een bepaald psychoseksueel ontwikkelingsstadium.","Oedipuscomplex: fenomeen in de fallische fase, bij jongens gekoppeld aan het castratiecomplex en bij meisjes aan penisnijd.","Manifeste en latente inhoud: wat je bewust over een droom kunt vertellen tegenover de verborgen, onderdrukte betekenis ervan."]},{"h":"Horney","items":["Psychoanalytische sociale theorie: visie dat vooral sociale en culturele omstandigheden in de kindertijd de persoonlijkheid vormen, in plaats van biologische driften.","Fundamentele vijandigheid: vijandigheid die ontstaat wanneer ouders niet tegemoetkomen aan de behoefte van het kind aan veiligheid en bevrediging.","Fundamentele angst: gevoelens van onzekerheid en spanning tegenover een vijandige wereld, gevolg van onderdrukte vijandigheid.","Compulsieve drijfveren: dwangmatige patronen waarbij de neuroticus vastzit in een vicieuze cirkel en steeds dezelfde onproductieve strategie herhaalt.","Neurotische behoeften: tien overdreven behoeften (o.a. affectie, machtige partner, macht, perfectie) die dienen als poging om de fundamentele angst in te perken.","Bewegen naar mensen: inschikkelijke, submissieve trend waarbij men zich onderwerpt en vooral affectie en goedkeuring zoekt.","Bewegen tegen mensen: agressieve trend die ervan uitgaat dat iedereen vijandig is, gericht op macht, uitbuiting en erkenning.","Bewegen weg van mensen: onthechte trend waarbij men dwangmatig afstand houdt, op privacy staat en geen hulp aanvaardt.","Gezonde versus neurotische persoonlijkheid: de gezonde mens zet de drie trends flexibel in, de neuroticus houdt star aan één strategie vast en overdrijft erin.","Geïdealiseerd zelfbeeld: overdreven positief zelfbeeld met onbeperkte capaciteiten, opgebouwd als oplossing bij een gebrek aan affectie, met neurotisch zoeken naar roem, claims en trots.","Zelfhaat: afkeer van zichzelf omdat het echte zelf niet strookt met het geïdealiseerde zelfbeeld, met zelfbeschuldiging en zelfverachting als gevolg.","Intrapsychische conflicten: conflicten die uit interpersoonlijke ervaringen ontstaan maar een eigen leven gaan leiden, met als kern het geïdealiseerde zelfbeeld en zelfhaat.","Oedipuscomplex volgens Horney: geen universeel biologisch gegeven maar aangeleerd, een uitdrukking van de neurotische behoefte aan liefde en veiligheid zonder seksuele component.","Zelfrealisatie en authenticiteit: gezonde ontwikkeling waarbij men de eigen sterktes en zwaktes erkent, tegenover het niet-authentieke geïdealiseerde zelf."]},{"h":"Rogers (humanistisch)","items":["Persoonsgeoriënteerde theorie: benadering die ontstond uit Rogers' praktijk als psychotherapeut en die zijn client-centered therapie wil verklaren en voorspellen.","Formatieve tendens: de neiging van alles om te evolueren van iets eenvoudigs naar iets complex.","Actualiserende tendens: de drang van alle levende wezens om naar vervolmaking te bewegen en hun volledige potentieel te benutten.","Zelfconcept: je identiteit, het beeld dat je van jezelf hebt en dat moeilijk te veranderen is eens gevormd.","Ideale zelf: datgene wat je nastreeft, het beeld van wie je wil zijn.","Incongruentie: psychologisch onevenwicht door een groot verschil tussen zelfconcept en ideale zelf, of tussen waargenomen zelf en ervaringen als organisme.","Niveaus van bewustzijn: ervaringen zijn ofwel onder de drempelwaarde (ontkend), vervormd (aangepast aan het zelfconcept) of consistent (zoals ze zijn toegelaten).","Onvoorwaardelijke positieve houding: de andere volledig aanvaarden zonder voorwaarden, iets wat iedereen ooit gehad moet hebben.","Empathie: je kunnen inleven in de ander zodat die zich veilig en aanvaard voelt.","Congruentie: als therapeut kijken naar en overeenstemmen met de echte, authentieke gevoelens.","Introjectie van voorwaarden: jezelf aanpassen aan de voorwaarden van anderen, wat je uit balans brengt.","Defensiviteit: ervaringen vervormen of ontkennen om het zelfconcept te behouden.","De persoon van morgen: het beeld van de psychologisch gezonde mens die flexibel, open, existentieel levend en geïntegreerd is.","Q sort techniek: methode uit de Chicago studies om aanpassing en de afstand tussen echt en ideaal zelf te meten."]},{"h":"Allport (dispositioneel)","items":["Dispositie (trek): een persoonlijk kenmerk dat samen met andere de persoonlijkheid vormt en aanzet tot consistent gedrag.","Kardinale dispositie: een dominerende trek die zo overheersend is dat ze zowat al het gedrag van iemand kleurt.","Centrale dispositie: de handvol trekken die de persoon in het algemeen goed beschrijven.","Secundaire dispositie: een trek die alleen in specifieke situaties naar voren komt.","Gemeenschappelijke versus persoonlijke trekken: gemeenschappelijke trekken vind je bij veel mensen, persoonlijke trekken zijn eigen aan het individu.","Proprium: de kenmerken en gedragingen die iemand zelf als warm, eigen en centraal in het leven ervaart.","Gemotiveerde dispositie: een dispositie die sterk genoeg is om actie op gang te brengen, zoals honger dat tot eten leidt.","Stilistische dispositie: de manier of stijl waarop je een actie uitvoert eens die begonnen is, zoals letten op tafelmanieren.","Functionele autonomie: gedrag raakt los van het oorspronkelijke motief zodra het een nieuw doel dient.","Propriate functionele autonomie: gedrag dat deel wordt van je interesses en zelfbeeld, zoals een hobby.","Proactieve benadering: het idee dat mensen niet alleen reageren op hun omgeving maar die ook actief vormgeven en soms zelf spanning opzoeken om te groeien.","Zelfrapportage als valide bron: omdat gezonde volwassenen weten waarom ze handelen, wordt hun eigen verslag als geldig beschouwd.","Morfogenetische wetenschap: het bestuderen van een individu tegelijk, gericht op het patroon dat specifiek is voor die persoon.","Mensbeeld van Allport: nadruk op het unieke individu, bewuste motivatie en groei naar psychologische gezondheid."]},{"h":"McCrae & Costa (Big Five)","items":["Vijffactorenmodel: model dat persoonlijkheid samenvat in vijf grote dimensies, gebaseerd op vragenlijstonderzoek.","OCEAN: letterwoord voor de vijf factoren openheid, consciëntieusheid, extraversie, altruïsme en neuroticisme.","Neuroticisme: algemene trek rond emotionele instabiliteit, met facetten zoals angst, depressie en kwetsbaarheid.","Extraversie: dimensie die aangeeft hoe naar buiten gericht en sociaal actief iemand is.","Openheid voor ervaring: dimensie die staat voor nieuwsgierigheid en openheid voor nieuwe ideeën en ervaringen.","Altruisme (vriendelijkheid): dimensie die aangeeft in welke mate iemand meelevend en op anderen gericht is.","Consciëntieusheid: dimensie die staat voor ordelijkheid, plichtsbesef en doelgerichtheid.","Factoranalyse: statistische methode die veel scores reduceert tot enkele algemene dimensies door correlaties tussen variabelen te bundelen.","Taxonomie versus theorie: een taxonomie beschrijft en classificeert enkel, terwijl een theorie ook gedrag voorspelt en verklaart.","Fundamentele tendensen: het universele, ruwe basismateriaal van de persoonlijkheid en centrale component van het model.","Karakteristieke aanpassingen: manieren waarop iemand zich aanpast aan zijn concrete omgeving.","Zelfconcept: de kennis en attitudes die iemand over zichzelf heeft.","Axioma origine: grondstelling dat trekken ontstaan uit biologische factoren zoals genen, hormonen en hersenstructuren.","Axioma structuur: grondstelling dat trekken hiërarchisch geordend zijn van eng naar algemeen."]},{"h":"Eysenck (biologisch)","items":["PEN: de drie superfactoren van Eysenck, namelijk Psychoticisme, Extraversie en Neuroticisme, elk een bipolair persoonlijkheidstype met een genetische component.","Superfactor (type): het hoogste niveau in de gedragshierarchie, een bundel van samenhangende trekken zoals introversie die uit teruggetrokken en volhardend zijn bestaat.","Hierarchie van gedragsorganisatie: opbouw van specifieke handelingen, naar gewoontes, naar trekken, naar types of superfactoren.","Extraversie: sociaal, impulsief, vrolijk en optimistisch zijn, met een lage corticale opwindbaarheid waardoor men extra prikkels opzoekt.","Introversie: teruggetrokken, rustig en voorzichtig zijn, met een hoge corticale opwindbaarheid waardoor men te veel stimulatie vermijdt.","Corticale opwinding: het niveau van activatie in de hersenschors dat volgens Eysenck het verschil tussen introvert en extravert verklaart.","Neuroticisme: de neiging om emotioneel te overreageren en moeilijk te kalmeren, met vaak lichamelijke klachten en een kwetsbaarheid voor stoornissen.","Limbisch systeem en amygdala: hersengebieden met een lagere drempel bij neurotische mensen, waardoor emoties sneller op gang komen (diathese-stress model).","Psychoticisme: een kwetsbaarheid die zich uit in egoisme, kilte, impulsiviteit en agressie, gekoppeld aan hoog testosteron en laag MAO, niet hetzelfde als een psychotische stoornis.","Superego (lage psychoticismepool): altruistisch, empathisch, conventioneel en samenwerkend gedrag.","Erfelijkheid: ongeveer driekwart van de variatie in de dimensies is erfelijk en een kwart komt door de omgeving, ondersteund door tweelingonderzoek.","Vragenlijsten van Eysenck: meetinstrumenten zoals de MPI, EPI, EPQ(-R) en EPP om de superfactoren te meten, met een lifescale zodat men zich niet beter voordoet.","Mensbeeld van Eysenck: gedrag is causaal en deels onbewust bepaald, met een biologische basis maar ook sociale invloed, en zowel individualiteit als similariteit tussen mensen."]},{"h":"Mischel (cognitief-sociaal)","items":["Cognitieve factoren: verwachtingen, percepties, waarden en doelen die de persoonlijkheid mee vormgeven en je gedrag bepalen.","Kritiek op trektheorie: Mischel vond dat die te veel nadruk legde op consistentie, terwijl specifieke situaties belangrijker zijn.","Situatieafhankelijke consistentie: we gedragen ons enkel consistent als situaties tot gelijke gevolgen leiden, anders maken we onderscheid.","Compromis met trektheorie: gedrag is ook een functie van relatief stabiele cognitief-affectieve eenheden, een verzoening van twee benaderingen.","Consistentieparadox: gedrag lijkt consistent, maar onderzoek vindt weinig bewijs voor consistentie van trekken over situaties heen.","Persoon-situatie-interactie: gedrag wordt het best voorspeld vanuit persoon, situatie en de interactie tussen beide.","CAPS: cognitief-affectief persoonlijkheidssysteem, waarbij inconsistent gedrag ook wijst op stabiele patronen van variatie binnen een persoon.","Situationele variabelen: alle stimuli waar mensen aandacht aan geven in een bepaalde situatie.","Cognitief-affectieve eenheden: alle psychologische, sociale en fysieke aspecten die iemand toelaten met de omgeving om te gaan met gedragsstabiliteit.","Codeerstrategieën (constructen): geïndividualiseerde manieren waarop je externe gebeurtenissen categoriseert.","Competenties en zelfregulerende strategieën: gedragingen waarover we denken te beschikken, zoals intelligentie.","Zelfregulatie: vaardigheden als aandacht afleiden en cognitief herstructureren voorspellen een gezonde, flexibele persoonlijkheid.","Mensbeeld: perceptie op een gebeurtenis weegt zwaarder dan de gebeurtenis zelf, met nadruk op vrije keuze, bewuste en sociale factoren.","Realistisch-pragmatisch standpunt: Mischel zit tussen pessimisme en optimisme in, maar is vooral realistisch en pragmatisch."]}],"hacks":[{"h":"PICOS voor een zinvolle theorie","t":"Denk aan PICOS om de zes kenmerken van een zinvolle theorie te onthouden: Praktisch (leidt handelen), Intern consistent, Consistente data (organiseert gekende data), Onderzoek genererend, Spaarzaam. En vergeet niet de rode draad: falsifieerbaar (controleerbaar). Handig geheugensteuntje voor bij het opsommen op het examen."},{"h":"ISE: Id, Superego, Ego als team van drie","t":"Onthoud de drie structuren als een driehoek: het Id wil ALLES nu (plezierprincipe), het Superego wil het PERFECT en netjes (idealistisch principe), en het Ego is de bemiddelaar die REALISTISCH tussen die twee schippert. Trucje: id = kind, superego = ouder, ego = onderhandelaar in het midden."},{"h":"NAAR, TEGEN, WEG: de drie deuren","t":"Stel je een kind voor bij een gesloten deur naar liefde. Het kan drie dingen doen. NAAR mensen: aankloppen en smeken om binnen te mogen (inschikkelijk, zoekt affectie). TEGEN mensen: de deur intrappen en de baas spelen (agressief, wil macht). WEG van mensen: weglopen en zich in een eigen kamer opsluiten (onthecht, wil privacy). Gezond = alle drie de deuren naar keuze gebruiken. Neurotisch = altijd star dezelfde deur."},{"h":"CEO van de groei","t":"De drie groeivoorwaarden van Rogers onthoud je met CEO: Congruentie (echte gevoelens tonen), Empathie (inleven zodat de ander zich veilig voelt) en Onvoorwaardelijke positieve houding (volledig aanvaarden). Een goede therapeut is de CEO van jouw groei."},{"h":"KA-CE-SE: van breed naar smal","t":"Onthoud de drie niveaus van disposities via KA-CE-SE: KArdinaal beheerst alles (breedst), CEntraal beschrijft je in het algemeen, SEcundair enkel in specifieke situaties (smalst). Je gaat dus van meest naar minst allesbepalend."},{"h":"OCEAN houdt de vijf factoren drijvend","t":"Denk aan de zee: O-C-E-A-N staat voor Openheid, Consciëntieusheid, Extraversie, Altruïsme en Neuroticisme. Zo vergeet je nooit een van de vijf grote dimensies."},{"h":"PEN onthouden: de 3 superfactoren van Eysenck","t":"Denk aan de PEN waarmee je je persoonlijkheid tekent. P = Psychoticisme (koud, agressief, egoistisch · laag testosteron-remmer MAO), E = Extraversie (sociaal, zoekt prikkels want lage corticale opwinding), N = Neuroticisme (emotioneel overreageren via limbisch systeem/amygdala). Drie letters, drie bipolaire dimensies met een genetische basis."},{"h":"CAPS zet een 'dop' op simpele voorspellingen","t":"Denk aan CAPS als een petje (cap) dat je opzet: het herinnert je aan Cognitief-Affectief PersoonlijkheidsSysteem. De boodschap onder de pet: gedrag = Persoon x Situatie x hoe jij die situatie percipieert. Wie enkel naar vaste trekken kijkt, houdt de pet verkeerd om."}]};
</script>
