<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />

<style>
  :root{
    --bg:#f4f2ee; --bg2:#ebe8e2; --card:#ffffff; --ink:#1b232c; --muted:#5d6873;
    --line:#e2ddd4; --accent:#0f6e6a; --accent-ink:#0b4f4c; --accent-soft:#dcefed;
    --amber:#c9821f; --amber-soft:#f7ecd9; --violet:#6d5bd0; --violet-soft:#e9e6fa;
    --good:#1f8a4c; --good-soft:#e2f3e8; --bad:#c23b54; --bad-soft:#fbe5ea;
    --shadow:0 1px 2px rgba(20,30,40,.05),0 6px 18px rgba(20,30,40,.05);
    --shadow-lg:0 2px 6px rgba(20,30,40,.06),0 18px 40px rgba(20,30,40,.10);
    --r:14px; --r-lg:20px; --ease:cubic-bezier(.2,.8,.2,1);
  }
  html[data-theme="dark"]{
    --bg:#11151a; --bg2:#161b22; --card:#1b222b; --ink:#e7ecf1; --muted:#9aa6b2;
    --line:#2a323c; --accent:#3fb9b2; --accent-ink:#7fd6d0; --accent-soft:#163230;
    --amber:#e0a64a; --amber-soft:#2e2515; --violet:#a99cf0; --violet-soft:#221d3a;
    --good:#46c178; --good-soft:#16301f; --bad:#ef6b82; --bad-soft:#331620;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 2px 8px rgba(0,0,0,.4),0 22px 48px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;letter-spacing:-.01em}
  button,a{font-family:inherit;cursor:pointer;color:inherit}
  .wrap{max-width:880px;margin:0 auto;padding:0 18px 96px}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
  .ic{width:1.25em;height:1.25em;flex:none;vertical-align:-.18em;stroke:currentColor;stroke-width:1.75;
    stroke-linecap:round;stroke-linejoin:round;fill:none}

  header.top{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(160%) blur(16px);-webkit-backdrop-filter:saturate(160%) blur(16px);box-shadow:inset 0 -1px 0 0 rgba(0,0,0,.04)}
  .topin{max-width:880px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:700}
  .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,var(--accent),var(--accent-ink));
    color:#fff;display:grid;place-items:center;font-family:Georgia,serif;font-weight:700;font-size:16px;flex:none;
    box-shadow:0 2px 6px rgba(15,110,106,.35)}
  .brand small{display:block;font-weight:500;color:var(--muted);font-size:11px}
  .spacer{flex:1}
  .iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:38px;
    padding:7px 11px;font-size:13.5px;display:inline-flex;gap:7px;align-items:center;text-decoration:none;
    transition:border-color .2s var(--ease),transform .12s var(--ease)}
  .iconbtn:hover{border-color:var(--accent)} .iconbtn:active{transform:scale(.96)}
  nav.tabs{display:flex;gap:2px;overflow:auto;max-width:880px;margin:0 auto;padding:6px 12px 0;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{border:none;background:none;color:var(--muted);padding:10px 13px;border-radius:9px 9px 0 0;
    font-size:14px;font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px;transition:color .2s var(--ease)}
  nav.tabs button .ic{width:16px;height:16px}
  nav.tabs button.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
  nav.tabs button:hover{color:var(--ink)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:20px}
  .muted{color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
  .pill.amber{background:var(--amber-soft);color:var(--amber)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;gap:14px}
  @media(min-width:620px){.g2{grid-template-columns:1fr 1fr}}

  .hero{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin:20px 0 8px}
  .count{flex:none;background:linear-gradient(150deg,var(--accent),var(--accent-ink));color:#fff;border-radius:var(--r);padding:14px 20px;text-align:center;min-width:118px;box-shadow:0 8px 20px rgba(15,110,106,.28)}
  .count b{font-family:Georgia,serif;font-size:32px;display:block;line-height:1}
  .count span{font-size:12px;opacity:.92}
  .herotext h1{margin:0 0 4px;font-size:25px}
  .herotext p{margin:0;color:var(--muted)}

  .brandstrip{display:flex;align-items:center;gap:13px;width:100%;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 16px;margin:14px 0 2px;box-shadow:var(--shadow);transition:border-color .2s var(--ease),transform .15s var(--ease)}
  .brandstrip:hover{border-color:var(--accent);transform:translateY(-1px)}
  .brandstrip .bs-logo{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:17px;background:linear-gradient(145deg,var(--accent),var(--accent-ink))}
  .brandstrip .bs-txt{flex:1;min-width:0} .brandstrip .bs-txt b{display:block;font-size:14.5px} .brandstrip .bs-txt small{color:var(--muted);font-size:12.5px}
  .brandstrip .bs-go{color:var(--accent-ink);flex:none;display:inline-flex} .brandstrip .bs-go .ic{width:18px;height:18px}

  .seclabel{display:flex;align-items:center;gap:8px;margin:24px 0 12px;font-weight:700;font-size:15px}
  .seclabel .ic{width:18px;height:18px;color:var(--accent-ink)}
  .backlink{display:inline-flex;align-items:center;gap:5px;border:none;background:none;color:var(--muted);font-size:13.5px;font-weight:600;padding:6px 0;margin-bottom:4px;transition:color .2s var(--ease)}
  .backlink:hover{color:var(--accent-ink)} .backlink .ic{width:16px;height:16px}
  .tracks{display:grid;gap:14px} @media(min-width:600px){.tracks{grid-template-columns:1fr 1fr}}
  .track{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);transition:transform .22s var(--ease),border-color .22s var(--ease),box-shadow .22s var(--ease)}
  .track:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow-lg)} .track:active{transform:translateY(-1px) scale(.995)}
  .track .tile{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;margin-bottom:4px;background:linear-gradient(150deg,var(--accent),var(--accent-ink))}
  .track.alt .tile{background:linear-gradient(150deg,var(--violet),#4f40a8)} .track .tile .ic{width:24px;height:24px}
  .track b{font-size:18px} .track small{color:var(--muted);font-size:13.5px;line-height:1.5}
  .track .go{margin-top:6px;display:inline-flex;align-items:center;gap:6px;color:var(--accent-ink);font-weight:600;font-size:13.5px} .track.alt .go{color:var(--violet)} .track .go .ic{width:16px;height:16px}
  .toggle{width:48px;height:28px;border-radius:999px;border:none;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s var(--ease)}
  .toggle .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s var(--ease)}
  .toggle.on{background:var(--violet)} .toggle.on .knob{left:23px}
  .warmcard{border-color:var(--violet)!important;background:var(--violet-soft)} .warmcard .ic{width:22px;height:22px;color:var(--violet);flex:none}
  .modebanner{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:11px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent-ink);font-size:13.5px;font-weight:600}
  .modebanner.v{background:var(--violet-soft);color:var(--violet)} .modebanner .ic{width:18px;height:18px} .modebanner a,.modebanner .bnlink{margin-left:auto;font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;color:inherit;border:none;background:none;font-family:inherit;padding:0}
  html.snappy .card,html.snappy .mode,html.snappy .tip,html.snappy .track{animation-duration:.12s!important}
  .mode{display:flex;flex-direction:column;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:17px;gap:7px;box-shadow:var(--shadow);transition:transform .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease)}
  .mode:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .mode .me{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)} .mode .me .ic{width:22px;height:22px}
  .mode b{font-size:16px} .mode small{color:var(--muted);font-size:13px}

  label.fld{display:block;font-size:13px;font-weight:600;margin:16px 0 7px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;min-height:38px;padding:7px 13px;font-size:13.5px;transition:all .18s var(--ease)}
  .chip:hover{border-color:var(--accent)} .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:11px;min-height:46px;padding:12px 20px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;box-shadow:0 4px 12px rgba(15,110,106,.25);transition:background .2s var(--ease),transform .12s var(--ease)}
  .btn:hover{background:var(--accent-ink)} .btn:active{transform:scale(.97) translateY(1px)} .btn .ic{width:18px;height:18px}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none} .btn.ghost:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  input[type=search],input[type=text],input[type=email],textarea{font-family:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
  input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .runtop{display:flex;align-items:center;gap:12px;margin:2px 0 14px;font-size:13px;color:var(--muted)}
  .bar{height:8px;border-radius:6px;background:var(--bg2);overflow:hidden;flex:1}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .7s var(--ease)}
  .qtext{font-size:19px;font-weight:600;margin:8px 0 16px;font-family:Georgia,serif;line-height:1.45}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px 15px;margin-bottom:10px;font-size:15px;transition:border-color .15s var(--ease),background .15s var(--ease),transform .12s var(--ease)}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)} .opt:active:not(:disabled){transform:scale(.99)}
  .opt .k{flex:none;width:27px;height:27px;border-radius:8px;background:var(--bg2);color:var(--muted);display:grid;place-items:center;font-weight:700;font-size:13px}
  .opt.correct{border-color:var(--good);background:var(--good-soft)} .opt.correct .k{background:var(--good);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default}
  .feedback{border-radius:12px;padding:13px 15px;margin:4px 0 12px;font-size:14.5px}
  .feedback.ok{background:var(--good-soft);color:var(--good)} .feedback.no{background:var(--bad-soft);color:var(--bad)}
  .feedback b{font-weight:700} .feedback .sub{display:block;margin-top:3px;color:var(--ink);font-weight:500;opacity:.92}
  .whybtn{border:1px solid var(--line);background:var(--card);color:var(--accent-ink);border-radius:10px;min-height:40px;padding:9px 14px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:border-color .2s var(--ease),background .2s var(--ease)}
  .whybtn:hover{border-color:var(--accent);background:var(--accent-soft)} .whybtn .ic{width:16px;height:16px}
  .whybox{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:14px 16px;margin:12px 0 4px;font-size:14px;line-height:1.55}
  .whybox h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent-ink);font-family:system-ui;display:flex;align-items:center;gap:7px}
  .whybox .ic{width:16px;height:16px}

  .acc{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
  .acc>summary{padding:15px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:11px}
  .acc>summary::-webkit-details-marker{display:none}
  .acc>summary .n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
  .acc>summary .caret{margin-left:auto;color:var(--muted);transition:transform .25s var(--ease)} .acc[open]>summary .caret{transform:rotate(90deg)}
  .acc[open]>summary{border-bottom:1px solid var(--line)} .acc .body{padding:6px 18px 16px}
  .acc h4{margin:14px 0 6px;font-size:13px;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.4px;font-family:system-ui}
  .acc ul{margin:0;padding-left:20px} .acc li{margin:6px 0;font-size:14.5px;line-height:1.5}
  .acc.hack li::marker{content:"💡  "} .acc.hack>summary .n{background:var(--violet-soft);color:var(--violet)}
  mark{background:var(--amber-soft);color:inherit;padding:0 2px;border-radius:3px}

  .tip{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}
  .tip h4{margin:0 0 5px;font-size:14.5px;display:flex;align-items:center;gap:8px;font-family:system-ui} .tip h4 .ic{width:18px;height:18px;color:var(--violet)}
  .tip p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}
  .tipgrid{display:grid;gap:12px} @media(min-width:620px){.tipgrid{grid-template-columns:1fr 1fr}}

  .results .big{font-family:Georgia,serif;font-size:54px;text-align:center;margin:8px 0;line-height:1}
  .center{text-align:center} .hide{display:none!important}
  footer{margin-top:34px;text-align:center;color:var(--muted);font-size:13px}
  .kbd{font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--muted)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.03)}100%{transform:scale(1)}}
  @keyframes optIn{from{opacity:0;transform:translateX(-9px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: no-preference){
    .card,.mode,.tip{animation:fadeUp .34s var(--ease) both}
    .acc{animation:fadeUp .32s var(--ease) both}
    .opt{animation:optIn .3s var(--ease) backwards;animation-delay:var(--oi,0s)}
    .chip.on{animation:pop .22s var(--ease)}
    .feedback{animation:slideIn .26s var(--ease) both} .whybox{animation:slideIn .28s var(--ease) .07s both} .opt.correct{animation:pop .34s var(--ease)}
  }
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  /* ---- Premium launch (Gemini-stijl) + header-logo gloed ---- */
  @property --bes-a{syntax:'<angle>';initial-value:0deg;inherits:false}
  #splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(125% 125% at 50% 38%,var(--bg2) 0%,var(--bg) 68%);transition:opacity .6s var(--ease),transform .7s var(--ease)}
  #splash.hide{opacity:0;transform:scale(1.07);pointer-events:none}
  .sp-inner{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
  .sp-mark{position:relative;width:100px;height:100px;display:grid;place-items:center}
  .sp-mark::before{content:"";position:absolute;inset:-16px;border-radius:34px;z-index:0;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));filter:blur(17px);opacity:.75}
  .sp-mark::after{content:"";position:absolute;inset:-3px;border-radius:27px;z-index:1;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));padding:3px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .sp-logo{position:relative;z-index:2;width:92px;height:92px;border-radius:24px;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:46px;background:linear-gradient(150deg,var(--accent),var(--accent-ink));box-shadow:0 14px 38px rgba(15,110,106,.4)}
  .sp-spark{position:absolute;z-index:3;top:-7px;right:-7px;width:30px;height:30px;color:#fff;filter:drop-shadow(0 2px 7px rgba(0,0,0,.35))}
  .sp-name{position:relative;font-family:Georgia,serif;font-size:26px;font-weight:700;letter-spacing:-.01em;color:var(--ink);overflow:hidden}
  .sp-name::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(-130%)}
  .sp-tag{font-size:13px;color:var(--muted);margin-top:-8px;letter-spacing:.03em}
  @media (prefers-reduced-motion: no-preference){
    .sp-mark::before{animation:bes-spin 3s linear infinite,bes-breathe 2.4s var(--ease) infinite}
    .sp-mark::after{animation:bes-spin 3s linear infinite}
    .sp-logo{animation:bes-pop .7s var(--ease) both}
    .sp-spark{animation:bes-pop .6s var(--ease) .12s both,bes-twinkle 1.9s var(--ease) .9s infinite}
    .sp-name{animation:bes-rise .6s var(--ease) .14s both}
    .sp-name::after{animation:bes-shimmer 1.5s var(--ease) .5s 1}
    .sp-tag{animation:bes-rise .6s var(--ease) .26s both}
  }
  @keyframes bes-spin{to{--bes-a:360deg}}
  @keyframes bes-breathe{0%,100%{opacity:.55;filter:blur(16px)}50%{opacity:.95;filter:blur(22px)}}
  @keyframes bes-shimmer{to{transform:translateX(130%)}}
  @keyframes bes-twinkle{0%,100%{opacity:1;transform:scale(1) rotate(0deg)}50%{opacity:.65;transform:scale(.82) rotate(18deg)}}
  @keyframes bes-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  /* mobiel: header-knoppen alleen iconen zodat niks zijwaarts overflowt */
  @media(max-width:440px){ header.top .iconbtn span{display:none} header.top .iconbtn{padding:7px 9px;min-width:38px;justify-content:center} .topin{gap:8px} }
</style>
</head>
<body>
<div id="splash"><div class="sp-inner">
  <div class="sp-mark">
    <div class="sp-logo">PG</div>
    <svg class="sp-spark" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.5c.4 4.6 2.4 6.6 7 7-4.6.4-6.6 2.4-7 7-.4-4.6-2.4-6.6-7-7 4.6-.4 6.6-2.4 7-7Z"/></svg>
  </div>
  <div><div class="sp-name">Psychologische Gespreksvoering</div><div class="sp-tag">slim oefenen voor je examen</div></div>
</div></div>
<header class="top">
  <div class="topin">

<script>
window.PG = {"questions":[{"t":"1","q":"Volgens het model van communicatie bevat elke boodschap vier elementen die tegelijkertijd aanwezig zijn. Welk element verwijst naar het feit dat de zender wil dat de ander iets doet met de boodschap?","o":["De letterlijke inhoud","De informatie over de relatie","Het appelerende deel van de boodschap","Het expressieve deel van de boodschap"],"a":2,"u":"Het appelerende deel is het element waarin de zender een appel doet en wil dat de ander iets met de boodschap aanvangt. De vier elementen zitten gelijktijdig in een boodschap."},{"t":"1","q":"Wat is het onderscheid tussen het inhoudsniveau en het betrekkingsniveau van communicatie?","o":["Het inhoudsniveau wordt volledig door de ontvanger bepaald bij het interpreteren, terwijl het betrekkingsniveau vastligt in de woorden die de zender kiest.","Het inhoudsniveau is de feitelijke boodschap die wordt overgebracht, terwijl het betrekkingsniveau weergeeft hoe de zender de relatie tot de ontvanger ziet.","Het inhoudsniveau geldt enkel bij geschreven boodschappen, het betrekkingsniveau enkel bij gesproken boodschappen.","Het inhoudsniveau bevat de non-verbale signalen, terwijl het betrekkingsniveau de feitelijke woorden bevat."],"a":1,"u":"Het inhoudsniveau is de feitelijke boodschap die wordt overgebracht. Het betrekkingsniveau bevat de informatie over hoe de zender de relatie met de ontvanger ziet en wordt geinterpreteerd via toon en non-verbale aspecten."},{"t":"1","q":"Een student verklaart een slecht examen door de moeilijke examenomstandigheden, maar denkt van een medestudent dat die gezakt is omdat hij nu eenmaal lui is. Welke heuristiek illustreert dit?","o":["De verankering met onvoldoende bijstelling","De causale actor-observator attributieneiging","De confirmatorische strategie","De beschikbaarheidsheuristiek"],"a":1,"u":"Bij de actor-observator attributieneiging verklaart men eigen gedrag uit instabiele, externe situationele factoren en het gedrag van anderen uit stabiele, interne factoren die eigen zijn aan de persoon."},{"t":"1","q":"Iemand vermoedt dat een partner vreemdgaat en gaat vervolgens gericht op zoek naar aanwijzingen die dit vermoeden bevestigen, terwijl tegenbewijs genegeerd wordt. Welk begrip past hier het best bij?","o":["Waardenoverdracht","De causale attributieneiging","De beschikbaarheidsheuristiek","De confirmatorische strategie"],"a":3,"u":"De confirmatorische strategie is de neiging alleen informatie te zoeken die overeenkomt met de eigen veronderstelling, waardoor tegensprekende informatie minder wordt opgemerkt."},{"t":"1","q":"Wat is volgens de tekst het verschil tussen waarden en normen?","o":["Waarden gelden enkel in de hulpverlening, normen enkel in het dagelijks leven.","Waarden zijn gedragsregels die iedereen deelt, normen zijn persoonlijke voorkeuren.","Waarden liggen vast in wetten en reglementen, terwijl normen per cultuur wisselen en enkel binnen een gezin worden doorgegeven.","Waarden zijn eigen vooronderstellingen over wat goed of fout is, normen zijn de gedragsregels die daaruit worden afgeleid."],"a":3,"u":"Waarden zijn eigen vooronderstellingen van wat goed of fout is, zoals gelijkwaardigheid. Normen zijn de gedragsregels die uit die waarden worden afgeleid, zoals dat beide partners evenveel meehelpen in het huishouden."},{"t":"1","q":"Welke drie kernelementen vormen samen de zijnshouding die als voedingsbodem voor een veranderingsproces bij de client geldt?","o":["Transparantie, spontaniteit en afstand","Echtheid, empathie en onvoorwaardelijk respect","Beschikbaarheid, attributie en confirmatie","Sturing, advies en confrontatie"],"a":1,"u":"De zijnshouding steunt op echtheid, empathie en onvoorwaardelijk respect. Deze vormen een noodzakelijke voedingsbodem en tegelijk het cruciale medium waardoor verandering bij de client mogelijk wordt."},{"t":"1","q":"In de dubbele gelaagdheid van echtheid wordt onderscheid gemaakt tussen onderstroom en bovenstroom. Waar verwijst de bovenstroom naar?","o":["Naar de hier-en-nu gedachten en gevoelens die de client bij de psycholoog oproept","Naar de feitelijke inhoud van wat de client vertelt","Naar de vaste persoonlijke uitstraling die de psycholoog altijd meebrengt","Naar de gedragsregels die de psycholoog vooraf heeft afgesproken"],"a":0,"u":"De bovenstroom betreft de aandacht voor de hier-en-nu gedachten en gevoelens die deze client bij de psycholoog opwekt, met betrekking tot de interactie tussen therapeut en client. De onderstroom is de blijvende persoonlijke uitstraling die als bodem fungeert."},{"t":"1","q":"Wat wordt bedoeld met de gedisciplineerde spontaniteit van de psycholoog wanneer die transparant is?","o":["Dat de psycholoog uitdrukt wat er in zichzelf leeft, maar enkel wanneer dit relevant is voor het proces en de client kan helpen","Dat de psycholoog altijd en over alles volledig open moet zijn tegenover de client","Dat de psycholoog zijn eigen gevoelens volledig moet onderdrukken om neutraal te blijven","Dat de psycholoog zich strikt aan een vooraf ingeoefend gespreksschema houdt en enkel de feitelijke inhoud van het gesprek benoemt"],"a":0,"u":"Transparantie betekent uitdrukken wat er in zichzelf leeft, maar met gedisciplineerde spontaniteit. Het is niet de bedoeling om in alles transparant te zijn; de eigen inbreng wordt beperkt tenzij ze het proces van de client kan helpen."},{"t":"2","q":"Wat betekent transparantie 'in proces' volgens de brontekst?","o":["De therapeut deelt uitgebreid persoonlijke verhalen om vertrouwen te winnen","De therapeut stelt zich op als expert die de cliënt stap voor stap naar de oplossing leidt en het probleem zo snel mogelijk zelf uitklaart","De therapeut houdt zijn eigen gevoelens en hypotheses altijd volledig verborgen","De therapeut toont zich in zijn mensheid en durft niet te weten, in plaats van zich als alwetende probleemoplosser op te stellen"],"a":3,"u":"Transparantie in proces houdt in dat je je toont in je mensheid en niet als alwetende expert of supermens. Je werkt vanuit een niet-wetende houding en zoekt samen naar verandering in plaats van het probleem voor de cliënt op te lossen."},{"t":"2","q":"Een therapeut onthult op een sobere manier iets over zichzelf tijdens een sessie. Hoe wordt dit in de brontekst genoemd?","o":["Automatische piloot","Zelfonthulling","Procesdirectief","Evocerende reflectie"],"a":1,"u":"Wanneer een therapeut zeer zeldzaam en op een sobere manier iets over zichzelf onthult, spreekt men van zelfonthulling. Dit valt onder transparantie die functioneel en afgestemd wordt ingezet."},{"t":"2","q":"Waarom moet een therapeut emoties met 'verteerbare porties' en op het juiste moment delen?","o":["Omdat emoties delen altijd remmend werkt op het proces","Omdat de therapeut zijn gevoelens pas mag delen nadat hij ze in supervisie heeft besproken, zodat de cliënt nooit met onverwerkte emoties wordt belast","Omdat de cliënt anders het beroepsgeheim zou kunnen schenden","Bij te lang wachten voelt de cliënt zich mogelijk afgewezen en kunnen de gevoelens van de therapeut te heftig worden om nog te verwoorden"],"a":3,"u":"De therapeut deelt emoties niet te laat maar ook niet te vroeg. Bij te lang wachten voelt de cliënt zich misschien afgewezen en zou de therapeut zijn gevoelens niet meer onder woorden kunnen brengen omdat ze te heftig worden."},{"t":"2","q":"Een therapeut zorgt er bewust voor dat collega's aanwezig zijn bij een afspraak met een agressieve cliënt, uit angst, en uit dit niet. Welk niveau van onechtheid is dit?","o":["Niveau 3: verbergen van bewuste hier-en-nu gevoelens waar de cliënt baat bij zou hebben","Niveau 2: niet transparant zijn uit eigenbelang of angst om de relatie te schaden","Automatische piloot zonder werkelijke betrokkenheid","Niveau 1: gedrag komt niet overeen met wat je innerlijk denkt en voelt"],"a":1,"u":"Bij niveau 2 is de therapeut niet transparant uit eigenbelang of uit angst om de relatie met de cliënt te schaden. De therapeut kiest ervoor de angst niet te uiten en is daardoor niet congruent."},{"t":"2","q":"Hoe wordt empathie in de brontekst gedefinieerd ('binnenkant')?","o":["Volledig samenvallen met de gevoelens van de cliënt en die overnemen","Objectief de feiten van het verhaal ordenen zonder emotie","Vanuit je eigen ervaring invoelen hoe jij je in die situatie zou voelen en dat gevoel als vertrekpunt nemen om de cliënt te begrijpen","Het eigen referentiekader ter zijde leggen en meekijken en meevoelen vanuit het referentiekader van de ander, zonder ermee samen te vallen"],"a":3,"u":"Empathie is een wijze van in-relatie zijn waarbij je je eigen referentiekader ter zijde legt en meekijkt en meevoelt vanuit het referentiekader van de ander, zonder ermee samen te vallen."},{"t":"2","q":"Wat wordt bij empathie bedoeld met de 'container'?","o":["De techniek om houding en gebaren van de cliënt over te nemen","Een lijst van betekeniseenheden die de therapeut letterlijk noteert","Het kader van praktische afspraken over tijd, plaats en frequentie waarbinnen de sessies telkens opnieuw plaatsvinden","De ruimte waarin de therapeut bevat wat de cliënt aandraagt en van waaruit hij dingen benoemd en verwerkt teruggeeft"],"a":3,"u":"De container is de ruimte van de therapeut waarin hij bevat wat de cliënt aandraagt en van waaruit hij dingen meer of minder benoemd en verwerkt teruggeeft. Eigen levenservaring en persoonlijke kenmerken vormen de bodem en wand van de container."},{"t":"2","q":"Waarom worden 'waarom'-vragen in de brontekst afgeraden?","o":["Ze dwingen de cliënt om meteen een oplossing te formuleren, waardoor het gesprek te vroeg bij concrete adviezen belandt","Ze zijn altijd gesloten vragen waarop enkel ja of nee past","Ze lokken louter rationele verklaringen uit en hebben een beschuldigend karakter dat aanzet tot verantwoording","Ze zijn te vaag zodat de cliënt niet weet wat te antwoorden"],"a":2,"u":"Waarom-vragen worden vermeden omdat ze louter rationele verklaringen uitlokken en een beschuldigend karakter hebben, waardoor de cliënt zich moet verantwoorden."},{"t":"2","q":"Wat is het verschil tussen niet-selectieve en selectieve luistervaardigheden?","o":["Niet-selectief luister je enkel in het eerste gesprek, selectief pas nadat de diagnose gesteld is en het behandelplan vastligt","Niet-selectief betekent enkel non-verbaal reageren, selectief enkel verbaal","Bij niet-selectief volg je de verteller met weinig invloed, bij selectief geef je bewust sommige onderdelen extra aandacht","Selectief luisteren betekent dat je delen van het gesprek negeert die niet passen bij je diagnose"],"a":2,"u":"Bij niet-selectieve luistervaardigheden volg je de verteller en oefen je weinig of geen invloed uit op het gesprek. Bij selectieve luistervaardigheden kies je ervoor sommige onderdelen van het gesprek extra aandacht te geven, zoals parafraseren of reflecteren."},{"t":"2","q":"Wat houdt parafraseren in?","o":["Een gevoel benoemen dat je oppikt uit de lichaamshouding en de stem van de cliënt, zonder de inhoud te herhalen","Een korte herhaling in eigen bewoordingen van wat de ander net gezegd heeft, waarop die kan reageren","De orde en duidelijkheid in het gesprek bewaken door doelen te stellen","De cliënt zo nauwkeurig mogelijk laten vertellen wat hij precies bedoelt"],"a":1,"u":"Parafraseren is een korte, in eigen bewoordingen gestelde herhaling van wat de ander net gezegd heeft. De cliënt kan daarop reageren door nuances aan te brengen. Het heeft onder meer een belonende, controlerende, sturende en stimulerende functie."},{"t":"2","q":"Waarom is het belangrijk dat een gevoelsreflectie tentatief (in vragende toon) wordt gegeven?","o":["Omdat een stellige reflectie altijd het gesprek afsluit","Zodat de cliënt wordt uitgenodigd om te toetsen of het klopt en kan bijsturen","Omdat de therapeut zo zijn eigen mening kan opleggen aan de cliënt","Omdat een vragende toon de cliënt verplicht zijn verhaal uitgebreider te vertellen"],"a":1,"u":"Een gevoelsreflectie moet tentatief zijn omdat compleet foute reflecties een ondermijnend effect kunnen hebben op de therapeutische relatie. Door de vragende toon voelt de cliënt zich uitgenodigd om te toetsen of het klopt en om bij te sturen."},{"t":"2","q":"Wat is volgens de brontekst een kernkenmerk van peer feedback?","o":["Feedback wordt anoniem gegeven zonder enige onderlinge discussie","Studenten geven elkaar een cijfer zonder toelichting, waarna de docent die scores overneemt in de eindbeoordeling van het werk","Studenten treden in dialoog met gedetailleerde commentaar op elkaars werk op basis van vooraf vastgelegde beoordelingscriteria","Enkel de docent beoordeelt het werk aan de hand van vaste criteria"],"a":2,"u":"Bij peer feedback treden studenten met elkaar in dialoog aan de hand van gedetailleerde commentaar over elkaars werk, gedrag of prestaties, op basis van vooraf vastgelegde beoordelingscriteria. Dit verschilt van peer evaluatie, waarbij studenten elkaar punten geven."},{"t":"2","q":"Wat wordt in de brontekst bedoeld met respect als grondhouding?","o":["De eigen mening zo duidelijk mogelijk verdedigen tegenover de cliënt","De cliënt in alles bevestigen en zijn keuzes uitdrukkelijk goedkeuren, omdat onvoorwaardelijke aanvaarding samenvalt met instemming","De cliënt op zijn fouten wijzen zodat hij zijn gedrag verandert","Luisteren zonder vooroordelen, evaluatie of kritiek, waarbij onvoorwaardelijke aanvaarding niet hetzelfde is als goedkeuring"],"a":3,"u":"Respect betekent luisteren zonder vooroordelen, evaluatie of kritiek. Je hoeft het niet eens te zijn met de ander, maar je schort je mening op om open te luisteren naar zijn wereld en perspectief. Onvoorwaardelijke aanvaarding is niet gelijk aan goedkeuring."},{"t":"2","q":"Waar staat de letter A voor in het SMART-principe voor het opstellen van doelen?","o":["Autonoom en aangenaam","Afgestemd op de doelgroep en aantrekkelijk","Acceptabel of aanvaardbaar, en ambitieus","Analytisch en abstract"],"a":2,"u":"In SMART staat de A voor Acceptabel of Aanvaardbaar en ambitieus, dat wil zeggen: zijn de doelen aanvaardbaar en bewerkstelligen ze een echte verandering? De overige letters zijn Specifiek, Meetbaar, Realistisch en Tijdgebonden."},{"t":"3","q":"Wat wordt bedoeld met de 'juiste verhouding' die een therapeut nastreeft ten opzichte van emoties?","o":["Contact maken met de emotie zonder ermee samen te vallen","Volledig samenvallen met de emotie van de client","De emotie zo snel mogelijk laten verdwijnen","De emotie negeren tot de client er zelf over begint"],"a":0,"u":"De juiste verhouding is contact maken maar niet samenvallen. Wordt dit contact niet gemaakt, dan ontstaan er inadequate reacties."},{"t":"3","q":"In de focusing therapy volgens Gendlin ligt de nadruk vooral op:","o":["De aandacht voor de lichamelijke gewaarwording die aan de emotie voorafgaat","Het opleggen van concrete gedragsdoelen","Het systematisch analyseren van jeugdherinneringen om de oorsprong van het gevoel te vinden","Het uitdagen van irrationele gedachten"],"a":0,"u":"Focusing therapy richt de aandacht op de lichamelijke gewaarwording, hetgeen dat voor de emotie komt. Gendlin beschrijft hiervoor zes stappen."},{"t":"3","q":"Wat is het doel van het 'symboliseren' of 'objectiveren' van angst, bijvoorbeeld door de angst voor te stellen als een voorwerp op afstand?","o":["De client zich laten verhouden tot de angst zonder erin meegesleept te worden","Met logische tegenargumenten aantonen dat de angst nergens op gebaseerd is","De client afleiden van zijn probleem","De angst volledig laten verdwijnen"],"a":0,"u":"Symbolisering of dis-identificatie geeft de client het vermogen om zich tot de angst te verhouden zonder erin meegesleept te worden of ermee samen te vallen, doordat de emotie loskoppelbaar wordt."},{"t":"3","q":"Een client raakt tijdens de sessie overspoeld door angst: hij bibbert en zit in elkaar gedoken. Welke techniek past hier het best?","o":["De sessie onmiddellijk beeindigen","Dieper exploreren van de angst","Nieuwe angstbeelden oproepen om te wennen","Ankeren door aanraking en de naam te zeggen"],"a":3,"u":"Bij overspoeling wordt geankerd, bijvoorbeeld door aanraking en het zeggen van de naam, om de client terug in het hier en nu te brengen en de veilige ruimte te behouden."},{"t":"3","q":"Waarom laat een therapeut bij een client met veel kwaadheid bewust de 'exit vrij' en houdt hij vast aan regels en grenzen?","o":["Uit beveiliging voor zichzelf, omdat deze clienten vaak grenzeloos zijn","Om de client te straffen voor zijn gedrag","Om de sessie strak binnen de voorziene tijd te houden zodat de agenda niet uitloopt","Om de client sneller kwijt te raken"],"a":0,"u":"Bij kwaadheid laat de therapeut de exit vrij als beveiliging voor zichzelf en houdt hij vast aan regels en grenzen, omdat deze clienten vaak grenzeloos zijn, zoals uitlopen in tijd of te vroeg komen."},{"t":"3","q":"Wat is de eerste stap in het omgaan met een client die kwaadheid uit?","o":["Eerst de kwaadheid begrenzen zodat het gesprek werkbaar blijft","Eerst laten ventileren zodat de ruwe brok emoties geuit kan worden","De client confronteren met zijn foute gedrag","Meteen de dieperliggende kwetsuur benoemen"],"a":1,"u":"Bij kwaadheid laat de therapeut de client eerst ventileren, waarbij de ruwe brok emoties wordt geuit, en erkent hij de gevoelens. Pas daarna komt men in de dieperliggende laag."},{"t":"3","q":"Bij negatieve overdrachtsgevoelens wordt een therapeut plots verweten 'je maakt nooit tijd voor mij'. Wat is een passende therapeutische reactie?","o":["De uitspraak meteen als overdracht duiden en terugvoeren op de ouders van de client","De client gelijk geven om de rust te bewaren","De aandacht verleggen naar wat de client op dat moment beleeft en gewaarwordt","Zich uitgebreid verdedigen en de agenda uitleggen"],"a":2,"u":"De therapeut blijft aanwezig zonder aangetast te worden en verlegt de aandacht naar wat de client beleeft, bijvoorbeeld door te benoemen dat de client zich in de steek gelaten voelt. Zo helpt hij inzien dat de gevoelens vaak oorsprong vinden in andere tijden en mensen."},{"t":"3","q":"Wat is een kenmerk van 'inauthentieke' kwaadheid, zoals getoond in het besproken casusvoorbeeld?","o":["Ze vereist onmiddellijke confrontatie zonder werkrelatie","Ze komt voort uit een tekort aan sociale vaardigheden en staat los van eerdere kwetsuren","Onder de kwaadheid ligt een diepere kwetsuur, zoals het gevoel zichzelf niet waard te zijn","Ze verdwijnt zodra de client feiten hoort"],"a":2,"u":"Bij inauthentieke kwaadheid haalt de therapeut de angel eruit, waardoor de kwaadheid zakt en men bij een dieper thema komt, zoals het gevoel dat de client zichzelf niet waard is. Dit vereist wel een sterke werkrelatie."},{"t":"3","q":"Hoe kan een therapeut het best omgaan met ontevredenheid of kritiek van een client?","o":["Luisteren, vage verwijten concretiseren en het eigen aandeel opnemen","De kritiek doorverwijzen naar supervisie en er zelf niet op ingaan","De feedback negeren om de relatie te beschermen","De client overtuigen dat de kritiek onterecht is"],"a":0,"u":"Bij ontevredenheid luistert de therapeut, tracht zich niet te verantwoorden en concretiseert vage verwijten. Het opnemen van je aandeel is niet hetzelfde als fouten toegeven, en de client wordt bedankt voor de feedback."},{"t":"3","q":"Een client is bang om te overspoelen bij verdriet. Wat heeft hij op dat moment vooral nodig?","o":["Dieper exploreren van de oorzaak","Steun, begrip en acceptatie met respect voor het tempo","Uitgebreide moederlijke zorg en troost tot het huilen stopt","Aanmoediging om het verdriet snel los te laten"],"a":1,"u":"Bij verdriet vraagt de client om steun, begrip en acceptatie, niet om dieper te exploreren. Men respecteert het tempo en past op om niet door te slaan in moederlijke gevoelens, wat afhankelijkheid vergroot."},{"t":"3","q":"Wat kenmerkt een client die een 'afwezigheid van emoties' (alexithymie) vertoont?","o":["Intense en overspoelende emoties die de client tijdens de sessie niet kan begrenzen","Gericht op oppervlakkige gevoelens en feiten, veel stiltes en geen woorden vinden","Een sterke focus op de eigen innerlijke beleving","Voortdurend wisselende stemmingen"],"a":1,"u":"Bij afwezigheid van emoties is de client gericht op oppervlakkige gevoelens en feiten, vooral bezig met dingen buiten zichzelf, met veel stiltes en geen woorden of uitdrukking. De aanpak begint met verbondenheid opbouwen."},{"t":"3","q":"Wat is het doel van de techniek van het 'imaginaire kind' bij een client met een ernstige gebeurtenis in de vroege kindertijd?","o":["Zelfcompassie teweegbrengen en milder naar zichzelf leren kijken","De herinnering volledig uitwissen zodat ze de client niet langer belast","De therapeut als goede moeder laten fungeren","De client laten inzien dat hij het verdiend heeft"],"a":0,"u":"Bij het imaginaire kind vraagt men wat het kind nodig had, om zelfcompassie teweeg te brengen en mild naar zichzelf te leren kijken. De valkuil is dat de therapeut zelf geen goede moeder mag gaan spelen."},{"t":"4","q":"Volgens de leerstof boek je de meeste winst in het therapieproces tijdens de eerste sessies. Wat is hierop de belangrijkste uitzondering?","o":["Relatie- en rouwproblematiek","Trauma en persoonlijkheidsstoornissen","Angst- en paniekklachten","Werkgerelateerde aanpassingsstoornissen"],"a":1,"u":"De tekst stelt dat de meeste winst in de eerste acht sessies wordt geboekt, met als uitzondering trauma en persoonlijkheidsstoornissen, waar het proces trager verloopt."},{"t":"4","q":"Het eerste gesprek bevat volgens de leerstof zowel relationele als taakgerichte componenten. Welke drie attitudes staan centraal in de relationele component?","o":["Neutraliteit, afstand en objectiviteit","Structureren, doorvragen en samenvatten","Empathie, echtheid en aanvaarding","Diagnosticeren, informeren en contracteren"],"a":2,"u":"De ondersteunende en verdiepende functie van het gesprek steunt op de attitudes empathie, echtheid en aanvaarding, die vanaf de aanvang voelbaar moeten zijn voor de cliënt."},{"t":"4","q":"Wat is volgens de leerstof de gebruikelijke volgorde in het algemene verloop van een eerste gesprek?","o":["Openen, bepalen van de hulpvraag, verwachtingen afstemmen, verkennen van de situatie, afsluiten","Verwachtingen afstemmen, openen van het gesprek, de situatie verkennen, de hulpvraag bepalen, afsluiten","Hulpvraag bepalen, openen, situatie verkennen, verwachtingen afstemmen, afsluiten","Openen, situatie verkennen, hulpvraag bepalen, afsluiten, verwachtingen afstemmen"],"a":0,"u":"Het algemeen verloop is: openen van het gesprek, bepalen van de hulpvraag, verwachtingen afstemmen, verkennen van de situatie en afsluiten van het gesprek."},{"t":"4","q":"Een cliënt vraagt zich af: 'Waarom is dit met mij aan de hand?' Bij welk type hulpvraag hoort deze vraag?","o":["Predictie","Indicatie","Onderkenning","Verklaring"],"a":3,"u":"De verklaringsvraag betreft het waarom van de klachten. Onderkenning gaat over wat er aan de hand is, predictie over wat komen zal en indicatie over hoe men geholpen kan worden."},{"t":"4","q":"De therapeut gebruikt de wondervraag: 'Stel dat er vannacht een wonder gebeurt, hoe zou jouw dag er dan uitzien?' Wat is hiervan volgens de leerstof het voornaamste doel?","o":["Zicht krijgen op wat de cliënt eigenlijk wil bereiken en welke doelen relevant zijn","De ernst en de frequentie van de symptomen in kaart brengen met het oog op een diagnose","De cliënt confronteren met onrealistische fantasieën","Het therapiecontract juridisch vastleggen"],"a":0,"u":"De wondervraag laat de cliënt vooruitblikken op een ideale situatie. Het verschil met de huidige situatie levert aanknopingspunten voor relevante doelen en hulpvragen."},{"t":"4","q":"Wat is volgens de leerstof een valkuil van meteen vragen naar 'de problemen die jullie naar hier brengen'?","o":["De hulpvraag wordt te vroeg juridisch vastgelegd","De cliënt vertelt enkel over de klachten van de ander en niet over zijn eigen aandeel daarin","De cliënt voelt zich onmiddellijk begrepen en stopt te vroeg","De focus komt te liggen op wat fout gaat en je suggereert dat jij het probleem zal oplossen"],"a":3,"u":"Door meteen naar problemen te vragen ontstaat een probleemgesatureerd verhaal en suggereer je bovendien dat jij het probleem oplost, terwijl het aan de cliënt zelf is om aan de slag te gaan."},{"t":"4","q":"Wat houdt de techniek 'taxeren in rondes' bij het verkennen van de situatie precies in?","o":["Alle problemen in één keer laten opsommen en pas aan het einde van het gesprek wegen","De cliënt telkens een cijfer laten geven aan de ernst van elk probleem","Verschillende sessies plannen om de klachten te rangschikken","Per onderwerp of levensgebied een ronde besteden en dit afsluiten met een samenvatting"],"a":3,"u":"Bij taxeren in rondes wordt elk levensgebied een aparte ronde die besproken wordt tot er een adequaat beeld ontstaat, waarna de hulpverlener afsluit met een samenvatting om te controleren of hij het goed begreep."},{"t":"4","q":"Waarom is het volgens de leerstof zinvol om de aarzelingen van de cliënt te exploreren, ook al is die uiteindelijk toch gekomen?","o":["Om vast te stellen of de cliënt gemotiveerd genoeg is om te blijven","Om de eerdere hulpverleners in een kwaad daglicht te stellen","Om de weerstand bij de cliënt weg te nemen voordat het echte werk kan beginnen","Omdat het exploreren van aarzelingen bijdraagt aan de veiligheid in de relatie"],"a":3,"u":"Het exploreren van de aarzelingen draagt bij aan de veiligheid. De cliënt heeft al een hele weg afgelegd en besloten dat de nood groter is dan de vrees, maar het benoemen van twijfels versterkt het vertrouwen."},{"t":"4","q":"Wat is volgens de leerstof kenmerkend voor de techniek 'reflectie', in tegenstelling tot een eenvoudige parafrasering?","o":["Ze herhaalt letterlijk de kernwoorden van de cliënt","Ze vat het hele gesprek beknopt samen","Ze verwijst expliciet naar gevoelens of naar het non-verbale","Ze legt verbanden tussen heden en verleden en duidt weerstanden"],"a":2,"u":"Reflectie is een herhaling of herformulering met een expliciete verwijzing naar gevoelens of het non-verbale, terwijl parafrasering enkel weergeeft wat de cliënt zegt in eigen woorden."},{"t":"4","q":"Een goede interviewvraag is volgens de leerstof onder meer enkelvoudig. Welke vraag schendt dit principe?","o":["Kun je vertellen wat er die avond precies gebeurde?","Hoe voelde je je toen dat gebeurde?","Is het zo dat je bang was, of boos, of teleurgesteld?","Wat maakte dat je vandaag contact opnam?"],"a":2,"u":"Een enkelvoudige vraag bevat één element. De vraag 'is het zo, of, of' stapelt meerdere opties op elkaar en is daardoor niet enkelvoudig, wat de leerstof expliciet afraadt."},{"t":"4","q":"Feedbackgericht werken (FGW) past binnen het Evidence Based Practice-model. Wat noemt de leerstof als een van de positieve effecten ervan?","o":["Meer afhankelijkheid van de cliënt van de therapeut","Drop-out reductie en een betere dosis/effect-ratio","Een langere gemiddelde therapieduur","Het overbodig maken van RCT-onderzoek"],"a":1,"u":"FGW levert een betere outcome, drop-out reductie en een betere dosis/effect-ratio op, onder meer door het verminderen van afhankelijkheid en het sneller detecteren van problemen in de alliantie."},{"t":"4","q":"Voor ongeveer 60% van de cliënten blijkt na een tiental sessies dat de klachten uitingen zijn van dieperliggende patronen. Wanneer kan de therapie in dat geval volgens de leerstof afgerond worden?","o":["Zodra de externe omstandigheden van de cliënt veranderd zijn, want daarmee vallen ook de dieperliggende patronen weg","Na precies dertig sessies, zoals de algemene regel voorschrijft","Wanneer de cliënt zich op belangrijke levensterreinen zichzelf kan zijn, kan werken, genieten en hulpbronnen kan aanwenden","Zodra de cliënt na vijf tot tien sessies meldt dat het beter gaat"],"a":2,"u":"Bij dieperliggende patronen betekent 'het gaat beter' niet dat stoppen wenselijk is. Afronden hangt af van de beoogde levenskwaliteit: zichzelf kunnen zijn, relatief standvastige relaties, kunnen werken en genieten, en hulpbronnen aanwenden."},{"t":"4","q":"Wat is volgens de leerstof een noodzakelijke voorwaarde om te kunnen verkennen en informatie te verzamelen bij de cliënt?","o":["Een opgestelde diagnose vóór het eerste gesprek","Een werkrelatie en vertrouwen tussen therapeut en cliënt","De aanwezigheid van een tolk of intercultureel bemiddelaar","Een volledig ingevuld therapiecontract"],"a":1,"u":"De tekst stelt dat werkrelatie en vertrouwen een noodzakelijke voorwaarde zijn om te kunnen verkennen en informatie te verzamelen."},{"t":"4","q":"Wat moet de therapeut bij het afsluiten van een gesprek volgens de leerstof zeker doen in de laatste minuten?","o":["De cliënt een huiswerkopdracht meegeven zonder samenvatting","In de laatste minuten nog een nieuw en gevoelig thema openen zodat de cliënt gemotiveerd terugkeert","Aankondigen dat de tijd bijna op is, samenvatten en eindigen met de gemaakte afspraken","Het gesprek laten uitlopen tot de cliënt zelf stopt"],"a":2,"u":"In de laatste minuten kondigt de therapeut aan dat de tijd er bijna op zit, geeft een beknopte opsomming van wat besproken is en eindigt met de gemaakte afspraken. Er worden geen nieuwe onderwerpen meer aangesneden."},{"t":"5","q":"Waarvan hangt volgens de tekst het vermogen af om zich met een ontvankelijke houding op het eigen lichamelijk gevoeld proces te richten en daarvoor de juiste uitdrukkingen te vinden?","o":["Van de aangeboren intelligentie van de persoon","Van het aantal therapiesessies dat iemand heeft gevolgd","Van de manier waarop anderen tijdens de kindertijd met hem omgingen","Van de cognitieve vaardigheden die op school werden aangeleerd"],"a":2,"u":"De omgangswijze van anderen wordt verinnerlijkt en wordt kenmerkend voor de manier waarop iemand zich met zichzelf verhoudt. De innerlijke relatie ontwikkelt zich dus vanuit de vroege interacties met anderen."},{"t":"5","q":"Welke drie onderdelen omvat volgens de tekst het ontwikkelingsproces van een gezonde innerlijke relatie?","o":["Identificeren, dis-identificeren en internaliseren","Ruimte maken voor de klacht, het probleem in concepten benoemen en samen met de therapeut een oplossing vastleggen","Ontvangen van een lichamelijk gevoelde betekenis, vormgeving via symbolisering en ontwikkelen van een richtinggevoel","Empathie, echtheid en onvoorwaardelijk respect"],"a":2,"u":"Bij een gezonde ontwikkeling is de client in staat om een lichamelijk gevoelde betekenis te ontvangen, deze vorm te geven via symbolisering en een richtinggevoel te ontwikkelen, telkens afhankelijk van de interactie met anderen in de levensloop."},{"t":"5","q":"Wat gebeurt er volgens de tekst wanneer iemand als kind slecht of niet gemoederd is?","o":["Het kind ontwikkelt geen vertrouwen in het lichamelijk gewaarworden en zoekt houvast in de buitenwereld","Het kind ontwikkelt een strak innerlijk regelsysteem waardoor het zichzelf voortdurend begrenst en weinig ruimte voelt","Het kind wordt automatisch een sterke externe autoriteit","Het kind ontwikkelt een overdreven vertrouwen in de eigen lichaamssignalen"],"a":0,"u":"Bij slechte bemoedering ontwikkelt het kind geen vertrouwen in het lichamelijk gewaarworden en is het als volwassene niet in staat lichaamssignalen te onderkennen. Het zoekt houvast in de buitenwereld en kan zo in afhankelijke, destructieve relaties terechtkomen."},{"t":"5","q":"Waarom benadrukt de tekst dat het wijzen op lichamelijke signalen NIET mag gebeuren in een stijl van ontmaskeren of betrappen?","o":["Omdat de client dan te snel tot symboliseren zou overgaan","Omdat de therapeut anders de rol van wijze vader opneemt en de client zijn eigen richtinggevoel uit handen geeft","Omdat dit past bij een goede bemoedering waarbij de client tijd en ruimte krijgt om te voelen","Omdat de therapeut anders de regels van het gesprek overtreedt"],"a":2,"u":"Een goede bemoedering vraagt tijd en ruimte om te voelen, zonder de client te betrappen of te ontmaskeren. Zo krijgt de gevoelde betekenis plaats en trekt het overspoelende karakter weg."},{"t":"5","q":"Wat is volgens de tekst een gevolg van slechte bevadering, waarbij het kind te weinig structuur en begrenzing krijgt?","o":["Het kind ontwikkelt te veel innerlijk houvast","Het kind gaat externe autoriteiten sterk overwaarderen","Woorden worden holle symboliseringen die niet vanuit een innerlijke bron komen","De beleving blijft steken in een diffuus stadium en vindt geen adequate weg naar buiten"],"a":3,"u":"Bij slechte bevadering met dominerende moederlijke aanwezigheid blijft de beleving steken in een diffuus stadium en vindt ze geen adequate weg naar buiten. Het onbestemde gevoel zoekt aansluiting op het niveau dat het kent, zoals lijfelijk ageren of orale bevrediging."},{"t":"5","q":"Een therapeut gaat eindeloos in op de gevoelens en noden van de client zonder hem te stimuleren tot het conceptualiseren van zijn ervaringsproces. Wat illustreert dit volgens de tekst?","o":["Een goede bevadering die de autonomie bevordert","Slechte bevadering, omdat de therapeut geen grenzen stelt","Een geslaagde focusingbeweging waarin de client volledig ontvangt","Een correcte toepassing van het richtinggevoel"],"a":1,"u":"Als de therapeut geen grenzen stelt en geen cognitieve bewerking bevordert, kunnen er geen verbanden ontstaan tussen belevingen en de buitenwereld. Zonder structuur en het ter zake komen ontstaat onproductieve therapie, wat neerkomt op slechte bevadering."},{"t":"5","q":"Hoe bevordert de therapeut volgens de tekst het richtinggevoel en de autonomie van de client?","o":["Door duidelijke adviezen en meningen te geven over de juiste richting","Door ruimte te laten zodat de client zijn eigen richting vindt, zonder interferentie vanuit eigen noden","Door te moraliseren over goed en fout, zodat de client zijn keuzes leert toetsen aan duidelijke normen","Door verantwoordelijkheid voor het leven van de client over te nemen"],"a":1,"u":"De therapeut bevordert autonomie door ruimte te laten om een eigen richting te vinden, zonder in de weg te staan met meningen en adviezen en zonder te moraliseren of de verantwoordelijkheid over te nemen."},{"t":"5","q":"Welke zes onderdelen onderscheidt Gendlin binnen het focusingproces?","o":["Ontvangen, symboliseren, richten, begrenzen, spiegelen en afronden","Ruimte maken, gevoelde betekenis laten komen, handvat vinden, resoneren, vragen of exploreren en ontvangen","Identificeren, dis-identificeren, visualiseren, exploreren, erkennen en internaliseren","Empathisch luisteren, respect tonen, echt aanwezig zijn, stiltes toelaten, gevoelens spiegelen en de kern markeren"],"a":1,"u":"Gendlin verdeelt het focusingproces in zes onderdelen: ruimte maken, de gevoelde betekenis laten komen, een handvat vinden, resoneren, vragen of exploreren en ontvangen."},{"t":"5","q":"Een client praat veel, twijfelt aan zijn gevoelens, rationaliseert weg en verwijst naar externe autoriteiten. Wat wijst dit aan en wat is een gepaste stap?","o":["De client heeft een verschuiving bereikt, er is geen verdere stap nodig","De client resoneert al volledig met zijn gevoelde betekenis, de therapeut kan meteen afronden met een appreciatie","De client zit te dichtbij, de therapeut moet het probleem een plaats buiten hem geven","De client zit te ver, iets lichaamsgericht introduceren om hem in contact te brengen met de eigen innerlijke autoriteit"],"a":3,"u":"Wie te ver zit, weet niet waarover te praten, rationaliseert weg of benoemt externe autoriteiten. De noodzakelijke stap is iets lichaamsgericht introduceren, bijvoorbeeld met aandacht in het lichaam gaan, om contact te maken met de eigen innerlijke autoriteit."},{"t":"5","q":"Uit welke vier componenten bestaat een volledig lichamelijk gevoelde betekenis, waarvan de aanwezigheid samenhangt met een verschuiving of shift?","o":["Een lichamelijke sensatie, emoties, een situatie in de buitenwereld en symboliseringen of beelden","Ademhaling, ontspanning, metafoor en stilte","Interne criticus, zelfbescherming, introjectie en dis-identificatie","Empathisch begrijpen, onvoorwaardelijk respect, echtheid van de therapeut en congruentie in de relatie"],"a":0,"u":"De gevoelde betekenis komt tot vervollediging door de verbinding tussen een lichamelijke sensatie, emoties, een situatie in de buitenwereld en symboliseringen of beelden. Als deze vier componenten zich uiten, treedt een verschuiving of shift op."},{"t":"5","q":"Een client raakt overspoeld door een ervaring die te intens wordt en waarin hij verzinkt. Welke werkwijze stelt de tekst voor om weer de juiste afstand te vinden?","o":["De client aansporen om de ervaring zo diep mogelijk te doorleven zonder onderbreking","De client vragen om de gevoelens stap voor stap weg te redeneren tot ze verdwijnen, zodat hij de situatie opnieuw zakelijk bekijkt","Het probleem een plaats buiten zichzelf geven met behulp van verbeelding en metaforen, bijvoorbeeld door het verder weg te laten gaan","Meteen overgaan tot de afronding van de sessie om verdere overspoeling te vermijden"],"a":2,"u":"Wie te dichtbij zit, is overspoeld of ervaart aversie. De therapeut gebruikt verbeelding en metaforen en geeft het probleem een plaats buiten de client, bijvoorbeeld door te vragen of het wat verder weg kan gaan. Afstand nemen is niet hetzelfde als het probleem wegzetten."},{"t":"5","q":"Wat zijn interfererende karakters volgens de tekst en waarom vragen ze om aandacht?","o":["Reactiewijzen die ooit helpend waren maar nu te pas en te onpas opduiken en de client vasthouden in oude gedragspatronen","Grondhoudingen van de therapeut, zoals empathie en onvoorwaardelijk respect, die de client helpen zijn oude patronen los te laten","Lichamelijke sensaties die het begin van een verschuiving of shift aankondigen","Nieuwe symboliseringen die de client zelf ontwikkelt om zijn beleving vorm te geven"],"a":0,"u":"Interfererende karakters zijn structuurgebonden reactiewijzen die ooit helpend waren, maar nu ongeacht de omstandigheden opduiken en de client in oude gedragspatronen vasthouden. Ze vragen extra aandacht omdat ze de client op een onproductief zijspoor zetten."},{"t":"5","q":"Welke stap hoort volgens de tekst bij de afronding van een focusingsessie?","o":["Een betekenisvolle uitdrukking markeren en appreciatie uitspreken, ook als het maar een klein stapje was","De client confronteren met de momenten waarop hij tijdens de sessie afhaakte, zodat hij het de volgende keer beter aanpakt","Het probleem definitief wegzetten zodat de client er niet meer aan denkt","De therapeut neemt de verantwoordelijkheid voor de volgende stappen over"],"a":0,"u":"Bij de afronding markeert de therapeut een uitdrukking die tijdens de sessie betekenisvol was en spreekt hij appreciatie uit, zelfs als het maar een klein stapje was. Ook internaliseren en een goede plaats geven aan nieuwe dingen horen bij de afronding."},{"t":"6","q":"Wat kenmerkt de positie van de therapeut in de cliëntgerichte therapie tegenover de gedragstherapie?","o":["In de cliëntgerichte therapie is de therapeut empathisch volgend en niet-directief, terwijl de gedragstherapeut eerder als regisseur optreedt","Beide stromingen gaan uit van de therapeut als neutrale, afzijdige waarnemer die het proces van buitenaf volgt zonder de relatie zelf in te zetten","In beide stromingen staat de expertise van de therapeut volledig centraal boven die van de cliënt","In de cliëntgerichte therapie treedt de therapeut op als regisseur, terwijl de gedragstherapeut empathisch volgt"],"a":0,"u":"De cliëntgerichte therapie werkt empathisch volgend en niet-directief, terwijl de therapeut in de gedragstherapie eerder de rol van regisseur opneemt."},{"t":"6","q":"Wat betekent de houding van het 'niet weten' (Anderson en Goolishian) bij de therapeut?","o":["Dat de therapeut alle beslissingen aan de cliënt overlaat zonder structuur te bieden","Dat de therapeut geen theoretische kennis nodig heeft om te behandelen","Dat de therapeut bewust informatie achterhoudt zodat de cliënt zelf tot de juiste diagnose van zijn probleem komt","Dat de therapeut aanvaardt dat hij niet weet wat de beleving van de cliënt is en zich bescheiden opstelt"],"a":3,"u":"Het 'niet weten' verwijst naar de bescheiden participant-facilitatorhouding waarbij de therapeut erkent dat hij de beleving van de cliënt niet kent en zich niet als alwetende expert opstelt."},{"t":"6","q":"Waarnaar verwijst het onderscheid tussen 'said', 'not yet said' en 'not known'?","o":["Naar drie fasen in de opleiding van de psycholoog, van theoretische kennis over stage tot zelfstandige praktijkvoering","Naar drie lagen van wat een cliënt uit: wat gezegd is, wat nog niet gezegd kan worden en wat niet gekend is","Naar drie niveaus van neutraliteit die de therapeut kan innemen","Naar drie soorten interventies in de gedragstherapie"],"a":1,"u":"De drie lagen onderscheiden wat wel is gezegd, wat nog niet gezegd kan worden (bijvoorbeeld te snel of nog geen woorden voor) en wat niet gekend is, zoals bij trauma waar geen kader voor bestaat."},{"t":"6","q":"Wat houdt aandacht voor tegenoverdracht (pre-verbale communicatie) volgens het hoofdstuk in?","o":["De therapeut is attent op eigen emoties zoals irritatie of verdriet en communiceert daarover, omdat dit anders nefaste effecten kan hebben","De therapeut houdt zijn eigen beleving strikt buiten het therapeutisch proces","De therapeut brengt zijn eigen emoties bewust over op de cliënt, zodat die in de sessie leert herkennen welke gevoelens er in de relatie spelen","De therapeut vermijdt elk gevoel tijdens de sessie om objectief te blijven"],"a":0,"u":"Tegenoverdracht betekent dat de therapeut attent is op eigen gevoelens zoals irritatie, verdriet of woede en hierover communiceert, omdat het niet-communiceren nefaste effecten op de behandeling kan hebben."},{"t":"6","q":"Wat is het innerlijke gesprek van de therapeut volgens Rober?","o":["Een gesprek tussen de therapeut en zijn supervisor na de sessie","Een innerlijke monoloog waarin de therapeut zijn diagnose opstelt","Een gesprek tussen de verschillende gezinsleden onderling dat de therapeut in stilte volgt en achteraf samenvat","Een gesprek tussen de stemmen van het ervarende zelf en het professionele zelf van de therapeut"],"a":3,"u":"Rober omschrijft het innerlijke gesprek als een dialoog tussen stemmen van het ervarende zelf (de therapeut als mens) en stemmen van het professionele zelf (de therapeut als verantwoordelijke professional)."},{"t":"6","q":"Wat is het verschil tussen het ervarende zelf en het professionele zelf van de therapeut?","o":["Het ervarende zelf stelt hypothesen op, terwijl het professionele zelf herinneringen en emoties bevat","Beide zelven zijn in wezen identiek en verwijzen naar de neutrale positie van waaruit de therapeut het gesprek van buitenaf en zonder eigen beleving volgt","Het ervarende zelf bevat innerlijke overwegingen, emoties en beelden, terwijl het professionele zelf hypothesen vormt en het ervarende zelf waarneemt","Het ervarende zelf is de professional en het professionele zelf is de mens achter de therapeut"],"a":2,"u":"Het ervarende zelf omvat de therapeut als mens met innerlijke overwegingen, herinneringen, emoties en beelden, terwijl het professionele zelf hypothesen en overwegingen vormt en het ervarende zelf waarneemt."},{"t":"6","q":"Hoeveel bepaalt de zogenaamde 'g-factor' van de persoon van de hulpverlener aan de effectiviteit van de behandeling?","o":["Ongeveer 1 tot 18 procent van de variabiliteit van de effectiviteit","Geen enkel meetbaar deel van de effectiviteit","Ongeveer 50 tot 60 procent van de variabiliteit van de effectiviteit","Vrijwel de volledige effectiviteit van de behandeling"],"a":0,"u":"De persoon van de hulpverlener bepaalt 1 tot 18 procent van de variabiliteit van de effectiviteit van de behandeling, waarbij professionele reflectie en zelfliefde hand in hand gaan."},{"t":"6","q":"Volgens het CER-model staat welke categorie op de eerste plaats qua belangrijkheid?","o":["Professionele ontwikkeling","Nederigheid","Ruime ervaring met uiteenlopende cliënten","Uitzonderlijke klinische vaardigheden"],"a":3,"u":"Uitzonderlijke klinische vaardigheden staan bovenaan: 'to be in sync', waarbij de therapeut relationele vaardigheden inzet om timing, tempo en dosering van interventies af te stemmen op de cliënt."},{"t":"6","q":"Wat illustreert de metafoor van het schuurpapier bij de relationele oriëntatie van mastertherapeuten?","o":["Dat therapeuten hun eigen pijn moeten wegschuren om objectief te blijven","Dat therapie een langzaam en schurend proces is dat weerstand oproept","Dat de therapeut een ruwe en confronterende houding moet aannemen zodat de weerstand van de cliënt stap voor stap wordt afgeschuurd","Dat de eigen emotionele pijn de therapeut sensitiever maakt voor anderen, zoals beschadigde vingertoppen beter aanvoelen"],"a":3,"u":"De schuurpapier-metafoor laat zien dat eigen emotionele pijn de therapeut gevoeliger maakt voor anderen: net zoals vingertoppen beschadigd door schuurpapier beter kunnen aanvoelen."},{"t":"6","q":"Wat betekent 'nederigheid' als categorie van de mastertherapeut in het CER-model?","o":["Zijn expertise verbergen om de cliënt niet te overweldigen","De cliënt steeds gelijk geven en eigen inzichten inslikken om conflict in de relatie te vermijden","De eigen limitaties aanvaarden, leren uit fouten en cliëntfeedback benutten om te groeien","Zich terughoudend opstellen en geen interventies durven voorstellen"],"a":2,"u":"Nederigheid houdt in dat de therapeut eigen limitaties accepteert, uit fouten leert en de bijdrage als gelimiteerd aanvaardt, waarbij feedback van de cliënt heel belangrijk is om te groeien."},{"t":"6","q":"Een therapeut vertelt de cliënt open dat een bepaalde interventie voor hem ineffectief aanvoelde, zonder de cliënt te overspoelen met eigen emoties. Welke basishouding illustreert dit?","o":["Transparantie of zelfonthulling","Neutraliteit tegenover elk gezinslid","Meerzijdige partijdigheid","Circulair bevragen"],"a":0,"u":"Dit is transparantie of zelfonthulling: de therapeut deelt authentiek iets van zijn binnenkant, maar met de bedoeling iets te delen en nooit om de cliënt te overspoelen, wat het onderscheidt van zelfbekritisering."},{"t":"6","q":"Waarom moet volgens het hoofdstuk professionele zelfbevraging gecombineerd worden met persoonlijke zelfliefde?","o":["Omdat therapeutische vaardigheden louter technieken zijn los van de persoon","Omdat therapeutische vaardigheden deel worden van het wezen van de therapeut, zodat professionele reflectie en zelfliefde hand in hand gaan","Omdat cliënten enkel geholpen worden door een emotioneel afstandelijke therapeut","Omdat zelfliefde bij de therapeut de nood aan professionele reflectie overbodig maakt, zodat hij vooral op zijn eigen aanvoelen vertrouwt"],"a":1,"u":"Therapeutische vaardigheden worden via training en toewijding deel van het wezen van de therapeut, geen los gereedschap zoals bij een loodgieter, waardoor professionele reflectie en zelfliefde samen moeten gaan."}],"theory":[{"h":"Communicatie, proces & boodschap","items":["Letterlijke inhoud: de feitelijke betekenis van wat er letterlijk wordt gezegd.","Expressief deel: de manier waarop de boodschap wordt weergegeven, bijvoorbeeld fluisterend of roepend.","Informatie over de relatie: het deel dat weergeeft hoe de zender op dat moment de relatie tot de ontvanger ziet.","Appelerend deel: het deel waarin de zender een appel doet en wil dat de ander iets met de boodschap doet.","Inhoudsniveau: de feitelijke boodschap die wordt overgebracht.","Betrekkingsniveau: de informatie over de relatie tussen zender en ontvanger, af te lezen uit toon en non-verbale aspecten.","Actor-observator attributieneiging: eigen gedrag verklaren uit externe situationele factoren en gedrag van anderen uit interne eigenschappen.","Gedragsconfirmatie: het uitlokken van responsen die de eigen vooronderstelling bevestigen.","Beschikbaarheidsheuristiek: interpreteren op basis van wat gemakkelijk beschikbaar is in het geheugen.","Confirmatorische strategie: enkel informatie zoeken die overeenkomt met de eigen veronderstelling.","Waarden: eigen vooronderstellingen over wat goed of fout is, zoals gelijkwaardigheid.","Normen: gedragsregels die uit waarden worden afgeleid, zoals gelijk verdeeld huishoudelijk werk.","Zijnshouding: de grondhouding van echtheid, empathie en onvoorwaardelijk respect als voedingsbodem voor verandering.","Congruentie en transparantie: zonder facade authentiek voelen en handelen, en met gedisciplineerde spontaniteit uitdrukken wat leeft wanneer dit het proces helpt."]},{"h":"Basishouding, grondhouding & feedback","items":["Transparantie: jezelf tonen in je mensheid vanuit een niet-wetende houding, functioneel en afgestemd op wat helpend is voor de cliënt.","Zelfonthulling: het zeer zeldzaam en op sobere manier iets over jezelf onthullen als therapeut.","Echtheid en congruentie: gedrag en uitspraken laten overeenstemmen met wat je innerlijk denkt en voelt, tegenover de drie niveaus van onechtheid.","Empathie (binnenkant): je eigen referentiekader ter zijde leggen en meevoelen vanuit het referentiekader van de ander, zonder ermee samen te vallen.","Container: de ruimte waarin je bevat wat de cliënt aandraagt en van waaruit je verwerkt teruggeeft, met eigen levenservaring als bodem en wand.","Reflectie: krachtige empathische vorm om over te brengen dat je de cliënt gehoord hebt en zijn innerlijke beleving meer naar buiten helpt brengen.","Tentatief reflecteren: reflecties in vragende toon geven zodat de cliënt kan toetsen en bijsturen, want foute reflecties ondermijnen de relatie.","Respect: luisteren zonder vooroordeel of kritiek, met onvoorwaardelijke aanvaarding die niet gelijk is aan goedkeuring.","Parafraseren: een korte herhaling in eigen woorden van wat de ander zei, met belonende, controlerende, sturende en stimulerende functie.","Gevoelsreflectie: in eigen bewoordingen de gevoelens weergeven die doorklinken in woorden of lichaamshouding van de ander.","Concretiseren: via wat- en hoe-vragen de cliënt zo nauwkeurig mogelijk laten vertellen wat hij bedoelt en ontbrekende facetten laten oplichten.","Waarom-vragen vermijden: ze lokken louter rationele verklaringen uit en hebben een beschuldigend, verantwoordend karakter.","SMART-doelen: doelstellingen die Specifiek, Meetbaar, Acceptabel of Ambitieus, Realistisch en Tijdgebonden zijn.","Feedback: terugkoppeling van informatie over iemands gedrag of prestaties om ongewenst gedrag bij te stellen of gewenst gedrag te stimuleren."]},{"h":"Emoties in therapie","items":["Juiste verhouding: contact maken met een emotie maar er niet mee samenvallen, anders ontstaan inadequate reacties.","Inadequate reacties: reacties die onbegrijpelijk, intens, niet in verhouding of onbereikbaar zijn omdat emoties geblokkeerd of vervormd zijn.","Focusing therapy: benadering die de aandacht richt op de lichamelijke gewaarwording die aan de emotie voorafgaat, met zes stappen volgens Gendlin.","Symbolisering / dis-identificatie: een emotie zoals angst objectiveren of op afstand plaatsen zodat de client zich ertoe kan verhouden zonder ermee samen te vallen.","Ankeren: bij overspoeling de client via aanraking en het zeggen van de naam terugbrengen in het hier en nu.","Couperen: een te overweldigende emotie of stroom van nieuwe beelden afremmen om de veilige ruimte te bewaren.","Metaforen: beeldspraak, zoals een put zonder bodem, gebruiken om afstand te creeren en op imaginair niveau verandering en steun mogelijk te maken.","Kwaadheid: een emotie die beschermt en kracht geeft; men laat eerst ventileren, erkent gevoelens en zoekt de onderliggende kwetsuur.","Tegenoverdracht: kwaadheid op de therapeut door vervormingen, waarbij gevoelens eigenlijk naar significant anderen verwijzen.","Inauthentieke kwaadheid: oppervlakkige woede waaronder een diepere kwetsuur schuilt, zoals het gevoel zichzelf niet waard te zijn.","Attunement: afstemmen op de client via stemvolume en tempo om rust te brengen.","Alexithymie / afwezigheid van emoties: gericht zijn op oppervlakkige feiten met veel stiltes en geen woorden voor gevoelens; men bouwt eerst verbondenheid op.","Imaginaire kind: de client zich laten voorstellen wat het kind nodig had, om zelfcompassie op te wekken zonder zelf de goede moeder te spelen.","Overspoeling bij verdriet: paniek, eisen of extreem destructief gedrag, waarbij men afbakent en in behapbare porties werkt in plaats van te exploreren."]},{"h":"Intake, diagnostiek & informatie geven","items":["Relationele componenten: de ondersteunende en verdiepende functie van het eerste gesprek, gedragen door empathie, echtheid en aanvaarding die vanaf de aanvang voelbaar zijn.","Taakgerichte componenten: informatie inwinnen en geven om de mogelijkheden en valkuilen van de cliënt in te schatten en samen een passend traject en therapiecontract af te spreken.","Deontologisch kader: afspraken over beroepsgeheim, vertrouwelijkheid en de meldingsplicht bij gevaar voor de cliënt zelf of voor de maatschappij.","Hulpvraag: wat de cliënt wil bereiken of veranderen, uitgesplitst in onderkenning, verklaring, predictie, indicatie en evaluatie.","Wondervraag: toekomstgerichte vraag waarbij de cliënt een ideale situatie schetst, zodat het verschil met de huidige situatie relevante doelen oplevert.","Probleemgesatureerd verhaal: een verhaal waarin de cliënt vooral het negatieve belicht, wat ontstaat als de focus meteen op de problemen wordt gelegd.","Taxeren in rondes: per levensgebied of onderwerp een aparte ronde bespreken en afsluiten met een samenvatting ter controle van het begrip.","Aarzelingen exploreren: navragen wat de cliënt deed twijfelen om te komen, wat de veiligheid en het vertrouwen in de relatie versterkt.","Parafrasering: weergeven van wat de cliënt zegt in eigen woorden, als vorm van steunend en structurerend luisteren.","Reflectie: herhaling of herformulering met expliciete verwijzing naar gevoelens of het non-verbale, dieper dan een gewone parafrase.","Interpretatie: uitspraak die verder gaat dan wat de cliënt letterlijk zegt, met aandacht voor beleving, verbanden, thema's, patronen en weerstanden.","Interviewvragen: bij voorkeur duidelijk, enkelvoudig, neutraal en niet suggestief, met open vragen bij exploratie en gesloten vragen voor specifieke informatie.","Feedbackgericht werken (FGW): het inzetten van feedbackinstrumenten binnen Evidence Based Practice, met betere outcome, drop-out reductie en een betere dosis/effect-ratio.","Afronden van therapie: proces dat duidelijk, tijdig aangekondigd en zorgvuldig begeleid moet worden, waarbij de cliënt leert het proces ook zonder de therapeut verder te zetten."]},{"h":"Innerlijke relatie & afronding","items":["Innerlijke relatie: de verinnerlijkte omgangswijze van anderen die bepaalt hoe iemand zich met zichzelf verhoudt.","Bemoedering: de moederlijke functie die lijfelijk zelfvertrouwen en innerlijk houvast geeft; bij slechte bemoedering ontbreekt vertrouwen in het lichamelijk gewaarworden.","Bevadering: de vaderlijke functie van structuur en begrenzing; bij slechte bevadering blijft de beleving diffuus of worden woorden holle symboliseringen.","Ontvangen van een lichamelijk gevoelde betekenis: leren onderkennen van signalen uit het lichaam als bron van weten in zichzelf.","Vormgeving via symbolisering: begrenzing en structuur geven houvast en maken authentieke communicatie met de buitenwereld mogelijk.","Richtinggevoel: de innerlijke sterkte om een eigen vormgeving te ontwikkelen en zich los te maken van moederlijke of vaderlijke figuren.","Focusingproces: aandacht geven aan iets dat aanvankelijk vaag aanwezig is, zodat het zich kan verduidelijken via symboliseringen.","Zes onderdelen (Gendlin): ruimte maken, gevoelde betekenis laten komen, handvat vinden, resoneren, vragen of exploreren en ontvangen.","Juiste afstand vinden: verhoudelijk werken, dicht genoeg om te voelen maar met afstand om niet in de beleving te verzinken.","Verschuiving of shift: een groeistap met lichamelijke ontspanning, teken dat de gevoelde betekenis zich volledig heeft geuit.","Vier componenten: lichamelijke sensatie, emoties, situatie in de buitenwereld en symboliseringen of beelden.","Interfererende karakters: ooit helpende reactiewijzen die nu structuurgebonden te pas en te onpas opduiken en de client vasthouden in oude patronen.","Dis-identificatie: het interfererend deel als iets waar men niet mee samenvalt herkennen en er zeggenschap over verwerven.","Afronding: focusingattitude, markering, internaliseren, metafoor, een goede plaats geven en appreciatie uitspreken."]},{"h":"De persoon van de hulpverlener","items":["Leerproces van de psycholoog: opleiding, bijkomende psychotherapieopleiding en blijvende bijscholing via intervisie en supervisie.","Plaats van de therapeut: van empathisch volgend en niet-directief (cliëntgericht) tot regisseur (gedragstherapie), met evolutie naar meer neutrale posities.","Niet weten (Anderson en Goolishian): de therapeut erkent dat hij de beleving van de cliënt niet kent en stelt zich bescheiden op als participant-facilitator.","Drie lagen said, not yet said, not known: wat gezegd is, wat nog niet gezegd kan worden en wat niet gekend is, zoals bij trauma zonder woorden.","Tegenoverdracht: eigen emoties van de therapeut zoals irritatie of verdriet, die attent opgemerkt en gecommuniceerd moeten worden om nefaste effecten te vermijden.","Innerlijk gesprek (Rober): dialoog tussen stemmen van het ervarende zelf en het professionele zelf van de therapeut.","Ervarende zelf: de therapeut als mens, met innerlijke overwegingen, herinneringen, emoties, beelden en fantasieën die door de sessie geactiveerd worden.","Professionele zelf: de therapeut als verantwoordelijke professional die hypothesen vormt, interventies voorbereidt en het ervarende zelf waarneemt.","G-factor van de hulpverlener: de persoon van de therapeut bepaalt 1 tot 18 procent van de variabiliteit van de behandelingseffectiviteit.","CER-model: acht categorieën van de mastertherapeut, met uitzonderlijke klinische vaardigheden bovenaan en professionele ontwikkeling als laatste.","Uitzonderlijke klinische vaardigheden: to be in sync, afstemmen van timing, tempo en dosering van interventies op wat de cliënt aankan.","Relationele oriëntatie en schuurpapier-metafoor: eigen emotionele pijn maakt de therapeut sensitiever voor anderen.","Nederigheid: eigen limitaties aanvaarden, leren uit fouten en cliëntfeedback benutten om te groeien.","Transparantie of zelfonthulling: authentiek iets van de eigen binnenkant delen zonder de cliënt te overspoelen."]}],"hacks":[{"h":"LEIA voor de vier boodschapdelen","t":"Onthoud LEIA: Letterlijke inhoud, Expressie, Informatie over de relatie en Appel. Deze vier delen zitten altijd tegelijk in een boodschap."},{"h":"SMART onthouden","t":"Denk aan SMART als checklist voor elk doel in je ontwikkelingsplan: Specifiek, Meetbaar, Acceptabel of Ambitieus, Realistisch, Tijdgebonden. Loop de vijf letters af en je doel is eenduidig en controleerbaar geformuleerd."},{"h":"AC bij kwaadheid: Ventileren, Erkennen, Zoeken","t":"Onthoud de volgorde bij kwaadheid als 'V-E-Z': eerst Ventileren (de ruwe brok laten uiten), dan Erkennen en accepteren van de gevoelens, en pas dan Zoeken naar de onderliggende kwetsuur. Zo val je pas op het einde in de dieperliggende laag en jaag je de client niet meteen hoger in zijn boosheid."},{"h":"OVPIE voor de hulpvraag","t":"Onthoud de vijf soorten hulpvragen met OVPIE: Onderkenning (wat is er aan de hand?), Verklaring (waarom?), Predictie (wat komt er?), Indicatie (hoe geholpen worden?) en Evaluatie (wat is veranderd?). Zo loop je de hele hulpvraag van klacht tot resultaat af."},{"h":"RGHRVO voor het focusingproces","t":"Onthoud de zes stappen van Gendlin met de eerste letters: Ruimte maken, Gevoelde betekenis, Handvat, Resoneren, Vragen of exploreren, Ontvangen. Denk aan de zin Rustige Gidsen Helpen Rustig Voelen en Ontvangen."},{"h":"CER-volgorde: Klinisch Relateren Aan Client Zorgt Nooit Echt Professioneel","t":"De acht CER-categorieën van meest naar minst belangrijk: Klinische vaardigheden, Relationele orientatie, Alliantie, Cognitieve complexiteit, Zelfkennis, Nederigheid, Ervaring, Professionele ontwikkeling. Onthoud dat 'klinische vaardigheden' altijd bovenaan staat en 'professionele ontwikkeling' onderaan."}]};
</script>

<script>
(function(){
