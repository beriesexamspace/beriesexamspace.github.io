<!DOCTYPE html>
<html lang="nl">

<style>
  :root{
    --bg:#f4f2ee; --bg2:#ebe8e2; --card:#ffffff; --ink:#1b232c; --muted:#5d6873;
    --line:#e2ddd4; --accent:#0f6e6a; --accent-ink:#0b4f4c; --accent-soft:#dcefed;
    --amber:#c9821f; --amber-soft:#f7ecd9; --violet:#6d5bd0; --violet-soft:#e9e6fa;
    --good:#1f8a4c; --good-soft:#e2f3e8; --bad:#c23b54; --bad-soft:#fbe5ea;
    --shadow:0 1px 2px rgba(20,30,40,.05),0 6px 18px rgba(20,30,40,.05);
    --shadow-lg:0 2px 6px rgba(20,30,40,.06),0 18px 40px rgba(20,30,40,.10);
    --r:14px; --r-lg:20px; --ease:cubic-bezier(.2,.8,.2,1);
  }
  html[data-theme="dark"]{
    --bg:#11151a; --bg2:#161b22; --card:#1b222b; --ink:#e7ecf1; --muted:#9aa6b2;
    --line:#2a323c; --accent:#3fb9b2; --accent-ink:#7fd6d0; --accent-soft:#163230;
    --amber:#e0a64a; --amber-soft:#2e2515; --violet:#a99cf0; --violet-soft:#221d3a;
    --good:#46c178; --good-soft:#16301f; --bad:#ef6b82; --bad-soft:#331620;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 2px 8px rgba(0,0,0,.4),0 22px 48px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;letter-spacing:-.01em}
  button,a{font-family:inherit;cursor:pointer;color:inherit}
  .wrap{max-width:880px;margin:0 auto;padding:0 18px 96px}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
  .ic{width:1.25em;height:1.25em;flex:none;vertical-align:-.18em;stroke:currentColor;stroke-width:1.75;
    stroke-linecap:round;stroke-linejoin:round;fill:none}

  header.top{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(160%) blur(16px);-webkit-backdrop-filter:saturate(160%) blur(16px);box-shadow:inset 0 -1px 0 0 rgba(0,0,0,.04)}
  .topin{max-width:880px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:700}
  .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,var(--accent),var(--accent-ink));
    color:#fff;display:grid;place-items:center;font-family:Georgia,serif;font-weight:700;font-size:16px;flex:none;
    box-shadow:0 2px 6px rgba(15,110,106,.35)}
  .brand small{display:block;font-weight:500;color:var(--muted);font-size:11px}
  .spacer{flex:1}
  .iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:38px;
    padding:7px 11px;font-size:13.5px;display:inline-flex;gap:7px;align-items:center;text-decoration:none;
    transition:border-color .2s var(--ease),transform .12s var(--ease)}
  .iconbtn:hover{border-color:var(--accent)} .iconbtn:active{transform:scale(.96)}
  nav.tabs{display:flex;gap:2px;overflow:auto;max-width:880px;margin:0 auto;padding:6px 12px 0;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{border:none;background:none;color:var(--muted);padding:10px 13px;border-radius:9px 9px 0 0;
    font-size:14px;font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px;transition:color .2s var(--ease)}
  nav.tabs button .ic{width:16px;height:16px}
  nav.tabs button.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
  nav.tabs button:hover{color:var(--ink)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:20px}
  .muted{color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
  .pill.amber{background:var(--amber-soft);color:var(--amber)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;gap:14px}
  @media(min-width:620px){.g2{grid-template-columns:1fr 1fr}}

  .hero{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin:20px 0 8px}
  .count{flex:none;background:linear-gradient(150deg,var(--accent),var(--accent-ink));color:#fff;border-radius:var(--r);padding:14px 20px;text-align:center;min-width:118px;box-shadow:0 8px 20px rgba(15,110,106,.28)}
  .count b{font-family:Georgia,serif;font-size:32px;display:block;line-height:1}
  .count span{font-size:12px;opacity:.92}
  .herotext h1{margin:0 0 4px;font-size:25px}
  .herotext p{margin:0;color:var(--muted)}

  .brandstrip{display:flex;align-items:center;gap:13px;width:100%;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 16px;margin:14px 0 2px;box-shadow:var(--shadow);transition:border-color .2s var(--ease),transform .15s var(--ease)}
  .brandstrip:hover{border-color:var(--accent);transform:translateY(-1px)}
  .brandstrip .bs-logo{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:17px;background:linear-gradient(145deg,var(--accent),var(--accent-ink))}
  .brandstrip .bs-txt{flex:1;min-width:0} .brandstrip .bs-txt b{display:block;font-size:14.5px} .brandstrip .bs-txt small{color:var(--muted);font-size:12.5px}
  .brandstrip .bs-go{color:var(--accent-ink);flex:none;display:inline-flex} .brandstrip .bs-go .ic{width:18px;height:18px}

  .seclabel{display:flex;align-items:center;gap:8px;margin:24px 0 12px;font-weight:700;font-size:15px}
  .seclabel .ic{width:18px;height:18px;color:var(--accent-ink)}
  .backlink{display:inline-flex;align-items:center;gap:5px;border:none;background:none;color:var(--muted);font-size:13.5px;font-weight:600;padding:6px 0;margin-bottom:4px;transition:color .2s var(--ease)}
  .backlink:hover{color:var(--accent-ink)} .backlink .ic{width:16px;height:16px}
  .tracks{display:grid;gap:14px} @media(min-width:600px){.tracks{grid-template-columns:1fr 1fr}}
  .track{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);transition:transform .22s var(--ease),border-color .22s var(--ease),box-shadow .22s var(--ease)}
  .track:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow-lg)} .track:active{transform:translateY(-1px) scale(.995)}
  .track .tile{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;margin-bottom:4px;background:linear-gradient(150deg,var(--accent),var(--accent-ink))}
  .track.alt .tile{background:linear-gradient(150deg,var(--violet),#4f40a8)} .track .tile .ic{width:24px;height:24px}
  .track b{font-size:18px} .track small{color:var(--muted);font-size:13.5px;line-height:1.5}
  .track .go{margin-top:6px;display:inline-flex;align-items:center;gap:6px;color:var(--accent-ink);font-weight:600;font-size:13.5px} .track.alt .go{color:var(--violet)} .track .go .ic{width:16px;height:16px}
  .toggle{width:48px;height:28px;border-radius:999px;border:none;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s var(--ease)}
  .toggle .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s var(--ease)}
  .toggle.on{background:var(--violet)} .toggle.on .knob{left:23px}
  .warmcard{border-color:var(--violet)!important;background:var(--violet-soft)} .warmcard .ic{width:22px;height:22px;color:var(--violet);flex:none}
  .modebanner{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:11px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent-ink);font-size:13.5px;font-weight:600}
  .modebanner.v{background:var(--violet-soft);color:var(--violet)} .modebanner .ic{width:18px;height:18px} .modebanner a,.modebanner .bnlink{margin-left:auto;font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;color:inherit;border:none;background:none;font-family:inherit;padding:0}
  html.snappy .card,html.snappy .mode,html.snappy .tip,html.snappy .track{animation-duration:.12s!important}
  .mode{display:flex;flex-direction:column;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:17px;gap:7px;box-shadow:var(--shadow);transition:transform .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease)}
  .mode:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .mode .me{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)} .mode .me .ic{width:22px;height:22px}
  .mode b{font-size:16px} .mode small{color:var(--muted);font-size:13px}

  label.fld{display:block;font-size:13px;font-weight:600;margin:16px 0 7px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;min-height:38px;padding:7px 13px;font-size:13.5px;transition:all .18s var(--ease)}
  .chip:hover{border-color:var(--accent)} .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:11px;min-height:46px;padding:12px 20px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;box-shadow:0 4px 12px rgba(15,110,106,.25);transition:background .2s var(--ease),transform .12s var(--ease)}
  .btn:hover{background:var(--accent-ink)} .btn:active{transform:scale(.97) translateY(1px)} .btn .ic{width:18px;height:18px}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none} .btn.ghost:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  input[type=search],input[type=text],input[type=email],textarea{font-family:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
  input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .runtop{display:flex;align-items:center;gap:12px;margin:2px 0 14px;font-size:13px;color:var(--muted)}
  .bar{height:8px;border-radius:6px;background:var(--bg2);overflow:hidden;flex:1}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .7s var(--ease)}
  .qtext{font-size:19px;font-weight:600;margin:8px 0 16px;font-family:Georgia,serif;line-height:1.45}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px 15px;margin-bottom:10px;font-size:15px;transition:border-color .15s var(--ease),background .15s var(--ease),transform .12s var(--ease)}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)} .opt:active:not(:disabled){transform:scale(.99)}
  .opt .k{flex:none;width:27px;height:27px;border-radius:8px;background:var(--bg2);color:var(--muted);display:grid;place-items:center;font-weight:700;font-size:13px}
  .opt.correct{border-color:var(--good);background:var(--good-soft)} .opt.correct .k{background:var(--good);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default}
  .feedback{border-radius:12px;padding:13px 15px;margin:4px 0 12px;font-size:14.5px}
  .feedback.ok{background:var(--good-soft);color:var(--good)} .feedback.no{background:var(--bad-soft);color:var(--bad)}
  .feedback b{font-weight:700} .feedback .sub{display:block;margin-top:3px;color:var(--ink);font-weight:500;opacity:.92}
  .whybtn{border:1px solid var(--line);background:var(--card);color:var(--accent-ink);border-radius:10px;min-height:40px;padding:9px 14px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:border-color .2s var(--ease),background .2s var(--ease)}
  .whybtn:hover{border-color:var(--accent);background:var(--accent-soft)} .whybtn .ic{width:16px;height:16px}
  .whybox{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:14px 16px;margin:12px 0 4px;font-size:14px;line-height:1.55}
  .whybox h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent-ink);font-family:system-ui;display:flex;align-items:center;gap:7px}
  .whybox .ic{width:16px;height:16px}

  .acc{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
  .acc>summary{padding:15px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:11px}
  .acc>summary::-webkit-details-marker{display:none}
  .acc>summary .n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
  .acc>summary .caret{margin-left:auto;color:var(--muted);transition:transform .25s var(--ease)} .acc[open]>summary .caret{transform:rotate(90deg)}
  .acc[open]>summary{border-bottom:1px solid var(--line)} .acc .body{padding:6px 18px 16px}
  .acc h4{margin:14px 0 6px;font-size:13px;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.4px;font-family:system-ui}
  .acc ul{margin:0;padding-left:20px} .acc li{margin:6px 0;font-size:14.5px;line-height:1.5}
  .acc.hack li::marker{content:"💡  "} .acc.hack>summary .n{background:var(--violet-soft);color:var(--violet)}
  mark{background:var(--amber-soft);color:inherit;padding:0 2px;border-radius:3px}

  .tip{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}
  .tip h4{margin:0 0 5px;font-size:14.5px;display:flex;align-items:center;gap:8px;font-family:system-ui} .tip h4 .ic{width:18px;height:18px;color:var(--violet)}
  .tip p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}
  .tipgrid{display:grid;gap:12px} @media(min-width:620px){.tipgrid{grid-template-columns:1fr 1fr}}

  .results .big{font-family:Georgia,serif;font-size:54px;text-align:center;margin:8px 0;line-height:1}
  .center{text-align:center} .hide{display:none!important}
  footer{margin-top:34px;text-align:center;color:var(--muted);font-size:13px}
  .kbd{font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--muted)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.03)}100%{transform:scale(1)}}
  @keyframes optIn{from{opacity:0;transform:translateX(-9px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: no-preference){
    .card,.mode,.tip{animation:fadeUp .34s var(--ease) both}
    .acc{animation:fadeUp .32s var(--ease) both}
    .opt{animation:optIn .3s var(--ease) backwards;animation-delay:var(--oi,0s)}
    .chip.on{animation:pop .22s var(--ease)}
    .feedback{animation:slideIn .26s var(--ease) both} .whybox{animation:slideIn .28s var(--ease) .07s both} .opt.correct{animation:pop .34s var(--ease)}
  }
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  /* ---- Premium launch (Gemini-stijl) + header-logo gloed ---- */
  @property --bes-a{syntax:'<angle>';initial-value:0deg;inherits:false}
  #splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(125% 125% at 50% 38%,var(--bg2) 0%,var(--bg) 68%);transition:opacity .6s var(--ease),transform .7s var(--ease)}
  #splash.hide{opacity:0;transform:scale(1.07);pointer-events:none}
  .sp-inner{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
  .sp-mark{position:relative;width:100px;height:100px;display:grid;place-items:center}
  .sp-mark::before{content:"";position:absolute;inset:-16px;border-radius:34px;z-index:0;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));filter:blur(17px);opacity:.75}
  .sp-mark::after{content:"";position:absolute;inset:-3px;border-radius:27px;z-index:1;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));padding:3px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .sp-logo{position:relative;z-index:2;width:92px;height:92px;border-radius:24px;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:46px;background:linear-gradient(150deg,var(--accent),var(--accent-ink));box-shadow:0 14px 38px rgba(15,110,106,.4)}
  .sp-spark{position:absolute;z-index:3;top:-7px;right:-7px;width:30px;height:30px;color:#fff;filter:drop-shadow(0 2px 7px rgba(0,0,0,.35))}
  .sp-name{position:relative;font-family:Georgia,serif;font-size:26px;font-weight:700;letter-spacing:-.01em;color:var(--ink);overflow:hidden}
  .sp-name::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(-130%)}
  .sp-tag{font-size:13px;color:var(--muted);margin-top:-8px;letter-spacing:.03em}
  @media (prefers-reduced-motion: no-preference){
    .sp-mark::before{animation:bes-spin 3s linear infinite,bes-breathe 2.4s var(--ease) infinite}
    .sp-mark::after{animation:bes-spin 3s linear infinite}
    .sp-logo{animation:bes-pop .7s var(--ease) both}
    .sp-spark{animation:bes-pop .6s var(--ease) .12s both,bes-twinkle 1.9s var(--ease) .9s infinite}
    .sp-name{animation:bes-rise .6s var(--ease) .14s both}
    .sp-name::after{animation:bes-shimmer 1.5s var(--ease) .5s 1}
    .sp-tag{animation:bes-rise .6s var(--ease) .26s both}
  }
  @keyframes bes-spin{to{--bes-a:360deg}}
  @keyframes bes-breathe{0%,100%{opacity:.55;filter:blur(16px)}50%{opacity:.95;filter:blur(22px)}}
  @keyframes bes-shimmer{to{transform:translateX(130%)}}
  @keyframes bes-twinkle{0%,100%{opacity:1;transform:scale(1) rotate(0deg)}50%{opacity:.65;transform:scale(.82) rotate(18deg)}}
  @keyframes bes-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  /* mobiel: header-knoppen alleen iconen zodat niks zijwaarts overflowt */
  @media(max-width:440px){ header.top .iconbtn span{display:none} header.top .iconbtn{padding:7px 9px;min-width:38px;justify-content:center} .topin{gap:8px} }
</style>
</head>
<body>
<div id="splash"><div class="sp-inner">
  <div class="sp-mark">
    <div class="sp-logo">Fp</div>
    <svg class="sp-spark" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.5c.4 4.6 2.4 6.6 7 7-4.6.4-6.6 2.4-7 7-.4-4.6-2.4-6.6-7-7 4.6-.4 6.6-2.4 7-7Z"/></svg>
  </div>
  <div><div class="sp-name">Forensische Psychiatrie</div><div class="sp-tag">slim oefenen voor je examen</div></div>
</div></div>
<header class="top">
  <div class="topin">

<script>
window.FO = {"questions":[{"t":"1","q":"Welke van de volgende begrippen is GEEN erkende parafilie binnen de forensische psychiatrie?","o":["Frotteurisme","Xenofilie","Fetisjisme","Voyeurisme"],"a":1,"u":"Frotteurisme, voyeurisme en fetisjisme zijn erkende parafilieen in de klinische classificatie. Xenofilie komt niet voor als een erkende parafiele categorie."},{"t":"1","q":"Wat is het klinische synoniem voor een seksuele stoornis waarbij sprake is van een intense en aanhoudende afwijkende seksuele interesse?","o":["Psychose","Parafilie","Dissociatie","Katatonie"],"a":1,"u":"Een parafilie wordt gedefinieerd als een intense en persistente seksuele interesse die afwijkt van interesse in genitale stimulatie met een volwassen, instemmende partner. Het is de klinische term voor een seksuele stoornis in deze context."},{"t":"1","q":"In de typologie van Groth wordt seksueel sadisme, waarbij de pleger opwinding ontleent aan het pijnigen en vernederen van het slachtoffer, gekoppeld aan welk type verkrachting?","o":["Power reassurance","Power assertive","Anger retaliation","Anger excitation"],"a":3,"u":"Anger excitation, de sadistische verkrachting, is de kleinste maar meest gevaarlijke groep, waarbij de pleger seksuele opwinding ontleent aan het toebrengen van pijn en lijden. Dit sluit aan bij seksueel sadisme."},{"t":"1","q":"Een volwassen man voelt zich seksueel aangetrokken tot de borsten en genitalien van een fysiek volwassen, instemmende partner. Welke conclusie is klinisch correct?","o":["Dit is geen parafilie","Dit is partialisme","Dit is voyeurisme","Dit is fetisjisme"],"a":0,"u":"Seksuele interesse in de geslachtskenmerken van een volwassen, instemmende partner valt binnen de normale seksualiteit en vormt geen parafilie. Een parafilie vereist juist een interesse die hiervan afwijkt."},{"t":"1","q":"Een 18-jarige man heeft anale seks met een 6-jarige jongen. Welke classificatie past het best bij dit feit?","o":["Frotteurisme","Homoseksuele pedofilie","Transvestisch fetisjisme","Efebofilie"],"a":1,"u":"Een 6-jarige is prepuberaal, waardoor seksueel contact door een persoon van minstens 16 jaar en 5 jaar ouder onder pedofilie valt. Omdat het slachtoffer mannelijk is, spreekt men van het homoseksuele type."},{"t":"1","q":"Een lerares heeft seksueel contact met haar 14-jarige leerling, die ermee instemde en er naar eigen zeggen van genoot. Hoe wordt dit juridisch en forensisch beoordeeld?","o":["Een zedendelict","Frotteurisme","Efebofilie zonder strafbaarheid","Geen strafbaar feit door instemming"],"a":0,"u":"Een 14-jarige kan niet geldig instemmen met seksueel contact met een volwassene in een gezagsrelatie. De vermeende instemming en het genot van het slachtoffer heffen de strafbaarheid niet op, waardoor het een zedendelict blijft."},{"t":"1","q":"Wat is de correcte verhouding tussen efebofilie en pedofilie?","o":["Efebofilie betreft aantrekking tot bejaarden","Efebofilie betreft aantrekking tot puberende adolescenten, pedofilie tot prepuberale kinderen","Het zijn synoniemen","Pedofilie is louter biologisch en geen stoornis"],"a":1,"u":"Efebofilie verwijst naar seksuele aantrekking tot puberende adolescenten, terwijl pedofilie zich richt op prepuberale kinderen. Het zijn dus verschillende begrippen en geen synoniemen."},{"t":"1","q":"Op de computer van een man wordt een grote hoeveelheid pornografisch materiaal aangetroffen dat wijst op een afwijkende seksuele interesse. Wat kan hieruit met de meeste zekerheid worden afgeleid?","o":["Dat er sprake is van een parafiele interesse","Dat de man exclusief homoseksueel is","Dat de man ontoerekeningsvatbaar is","Dat de man psychotisch is"],"a":0,"u":"Het bezit van omvangrijk materiaal dat aansluit bij een afwijkende seksuele voorkeur wijst op een parafiele interesse. Uitspraken over seksuele orientatie, psychose of toerekeningsvatbaarheid kunnen hier niet uit worden afgeleid."},{"t":"2","q":"Welke vorm van stalking komt volgens de cursus het meest voor?","o":["Triangulering","Roofzuchtige stalking","Collectieve stalking","Cyberstalking"],"a":3,"u":"Cyberstalking wordt aangeduid als de meest voorkomende verschijningsvorm, mede door de brede beschikbaarheid van digitale communicatiemiddelen. Triangulering is geen stalkingsvorm maar een relationeel manipulatiepatroon."},{"t":"2","q":"Welke stalkertypes onderscheiden Mullen en Pathe in hun typologie?","o":["Afgewezen, wraaklustige, roofzuchtige, naar intimiteit zoekende en incompetente stalker","Psychotische, neurotische, antisociale en borderline stalker","Overte, coverte, instrumentele en expressieve stalker","Power-, anger-, sadistische en opportunistische stalker"],"a":0,"u":"De typologie van Mullen en Pathe onderscheidt vijf types op basis van context en motivatie: afgewezen, wraaklustig (rancuneus), roofzuchtig (jager), naar intimiteit zoekend en incompetente stalker. De andere reeksen horen bij psychopathologie of bij verkrachtertypologieën."},{"t":"2","q":"Een man aanvaardt het einde van zijn relatie niet en blijft zijn ex-partner achtervolgen om verzoening of wraak. Welk stalkertype past hier het best?","o":["De afgewezen stalker","De incompetente stalker","De naar intimiteit zoekende stalker","De wraaklustige stalker"],"a":0,"u":"De afgewezen stalker treedt op na het einde van een relatie waarin een partij zich niet neerlegt bij de breuk. De initiele motivatie is verzoening of wraak, en het stalken wordt een substituut voor de verloren relatie."},{"t":"2","q":"Voor welke stalkertypes staat vooral een psychiatrische behandeling centraal, omdat aan hun gedrag doorgaans een psychopathologie of sociale problematiek ten grondslag ligt?","o":["De wraaklustige en de roofzuchtige stalker","De roofzuchtige en de afgewezen stalker","De naar intimiteit zoekende en de incompetente stalker","De afgewezen en de wraaklustige stalker"],"a":2,"u":"Bij de naar intimiteit zoekende stalker, vaak met erotomane of andere wanen, en de incompetente stalker staat de aanpak van onderliggende psychiatrische of sociale problematiek voorop. Bij de wraaklustige en roofzuchtige stalker ligt de nadruk sterker op controle, risicobeheersing en justitiele opvolging."},{"t":"2","q":"Wat kenmerkt de naar intimiteit zoekende stalker?","o":["Hij verzamelt informatie over het slachtoffer met sadistisch-seksuele motieven","Hij is eenzaam en verlangt naar liefde, en houdt liever een gefantaseerde relatie levend dan helemaal geen relatie","Hij handelt vanuit ervaren onrecht en zoekt wraak en controle","Hij achtervolgt een ex-partner na het einde van een relatie"],"a":1,"u":"De naar intimiteit zoekende stalker wordt gedreven door eenzaamheid en een gebrek aan liefde en gelooft dat de liefde al bestaat of zeker zal komen. Hij verkiest de gefantaseerde liefde boven geen liefde, wat de persistentie verklaart."},{"t":"2","q":"Welke stalker uit de typologie van Mullen komt het minst frequent voor maar vormt doorgaans de moeilijkste casussen?","o":["De wraaklustige stalker","De afgewezen stalker","De roofzuchtige stalker","De incompetente stalker"],"a":2,"u":"De roofzuchtige stalker is het minst prevalente type en wordt gekenmerkt door sadistische seksualiteit; het motief is informatie verzamelen, met voyeurisme en anticiperende fantasieen. Dit maakt deze casussen doorgaans het moeilijkst. De afgewezen stalker is daarentegen de grootste groep."},{"t":"3","q":"Waarop hebben de negatieve symptomen van schizofrenie vooral betrekking?","o":["Auditieve en visuele hallucinaties","Wanen en achterdocht ten aanzien van de omgeving","Gedesorganiseerde, onsamenhangende spraak","Affectieve afvlakking en terugtrekking op sociaal vlak"],"a":3,"u":"Negatieve symptomen verminderen of remmen iets bij de patiënt, zoals affectieve afstomping, anhedonie en sociale terugtrekking. Wanen, hallucinaties en gedesorganiseerde spraak zijn daarentegen positieve of gedragssymptomen."},{"t":"3","q":"Welke neurotransmitter wordt klassiek in verband gebracht met het ontstaan van psychose?","o":["GABA","Noradrenaline","Serotonine","Dopamine"],"a":3,"u":"Psychose, en met name de positieve symptomen van schizofrenie, wordt klassiek gelinkt aan een verhoogde dopaminerge activiteit, de dopaminehypothese. De overige neurotransmitters spelen vooral een rol bij andere stoornissen."},{"t":"3","q":"Waardoor wordt katatoon gedrag in het kader van een psychotische stoornis vooral gekenmerkt?","o":["Spierverstijving en verstoorde psychomotoriek","Volledig intacte motorische controle","Versnelde, ongeremde spraakproductie","Selectief geheugenverlies voor de feiten"],"a":0,"u":"Katatoon gedrag is een gedesorganiseerd psychomotorisch symptoom dat zich onder meer uit in spierverstijving en bewegingsstoornissen. Het valt onder de gedragssymptomen binnen het schizofreniespectrum."},{"t":"3","q":"Welke uitspraken over een mild head injury, een licht hersentrauma, zijn correct? 1) Het gaat om een lichte hersenschudding. 2) Er is zowel een voor-achterwaartse beweging als een rotatiebeweging betrokken. 3) De aandoening komt vooral voor in de leeftijdsgroep 20 tot 40 jaar.","o":["Enkel uitspraken 1 en 2 zijn juist","Enkel uitspraken 2 en 3 zijn juist","Uitspraken 1, 2 en 3 zijn juist","Enkel uitspraak 1 is juist"],"a":2,"u":"Een mild head injury komt overeen met een lichte hersenschudding, ontstaat door zowel lineaire, voor-achterwaartse, als rotationele krachten op de hersenen en komt relatief vaak voor bij jongvolwassenen van 20 tot 40 jaar. Alle drie de uitspraken zijn dus juist."},{"t":"3","q":"Welk type symptomatologie hangt bij mensen met een psychotische stoornis het sterkst samen met een verhoogd risico op geweld?","o":["Vooral de negatieve symptomen","Uitsluitend somatische symptomen","Uitsluitend cognitieve symptomen","Vooral de positieve symptomen"],"a":3,"u":"Onderzoek koppelt vooral positieve symptomen, zoals wanen en hallucinaties, aan een verhoogd risico op geweld, en niet zozeer de negatieve symptomen. Geweldpleging vereist doorgaans de samenkomst van meerdere heterogene risicofactoren."},{"t":"3","q":"Onder welke DSM-5-categorie valt schizofrenie?","o":["Persoonlijkheidsstoornissen, cluster A","Bipolaire en verwante stoornissen","Neurocognitieve stoornissen","Schizofreniespectrum- en andere psychotische stoornissen"],"a":3,"u":"De DSM-5 groepeert schizofrenie samen met onder meer de waanstoornis, de schizoaffectieve stoornis, de schizofreniforme stoornis en de kortdurende psychotische stoornis onder de schizofreniespectrum- en andere psychotische stoornissen."},{"t":"3","q":"Wat is binnen het strafrecht een van de meest voorkomende oorzaken van amnesie voor de feiten?","o":["Middelen- of alcoholintoxicatie","Aangeboren verstandelijke beperking","Selectieve auditieve hallucinaties","Chronische slaapstoornissen"],"a":0,"u":"Amnesie voor de feiten wordt binnen het strafrecht vooral verklaard door middelen- of alcoholintoxicatie, een psychotische toestand of psychologische verdringing. Een aangeboren verstandelijke beperking is geen typische oorzaak van dergelijk geheugenverlies."},{"t":"4","q":"De PCL-R (Psychopathy Checklist-Revised) is een instrument dat in de forensische praktijk wordt ingezet. Wat meet dit instrument primair?","o":["Psychopathie","Suggestibiliteit tijdens verhoor","De ernst van een depressieve episode","Algemene intelligentie"],"a":0,"u":"De PCL-R is het referentie-instrument voor het meten van psychopathie op basis van gestructureerde interviewdata en dossierstudie. De prototypische score is 40, met cutoffs rond 30 (VS) of 25 tot 28 (Europa)."},{"t":"4","q":"Welk kenmerk hoort NIET bij de borderline persoonlijkheidsstoornis?","o":["Emotionele instabiliteit","Zwart-wit denken","Sterke verlatingsangst","Stabiel en accuraat empathisch vermogen"],"a":3,"u":"Splitting, oftewel zwart-wit denken, emotionele instabiliteit en verlatingsangst zijn kernkenmerken van borderline. Een stabiel en intact empathisch vermogen is dat niet, want de emotieregulatie en de interpersoonlijke relaties zijn juist verstoord."},{"t":"4","q":"Welk kenmerk past NIET bij de theatrale (histrionische) persoonlijkheidsstoornis?","o":["Suggestibel en sterk beïnvloedbaar door anderen","Teruggetrokken, emotioneel vlak en op zichzelf gericht gedrag","Voortdurende behoefte aan aandacht en bevestiging","Overdreven en labiele emotionele expressie"],"a":1,"u":"De theatrale persoonlijkheidsstoornis kenmerkt zich door aandachtzoekend, dramatisch en suggestibel gedrag met overdreven emoties. Teruggetrokken en emotioneel vlak gedrag is het tegenovergestelde en past eerder bij schizoïde trekken."},{"t":"4","q":"Voor welke van de volgende toepassingen wordt risicotaxatie in de forensische praktijk ingezet?","o":["Enkel bij seksueel delinquenten","Enkel bij het inschatten van psychopathie","Bij voorwaardelijke invrijheidstelling, seksueel delinquenten en het inschatten van psychopathie","Enkel bij de beslissing over voorwaardelijke invrijheidstelling"],"a":2,"u":"Risicotaxatie schat het risico op toekomstig gewelddadig of niet-gewelddadig gedrag in en wordt breed gebruikt, onder meer bij beslissingen over voorwaardelijke invrijheidstelling, bij seksueel delinquenten en in combinatie met de inschatting van psychopathie."},{"t":"4","q":"Waarvoor wordt de PCL-R NIET gebruikt?","o":["Het inschatten van probleemoplossend gedrag","Het meten van psychopathie","Het ondersteunen van risicotaxatie bij seksueel delinquenten","Het inschatten van het risico op agressief gedrag"],"a":0,"u":"De PCL-R meet psychopathie en levert daarmee een consistente bijdrage aan de inschatting van gewelddadig, agressief en seksueel delinquent gedrag. Het is geen instrument om probleemoplossend gedrag te meten."},{"t":"4","q":"Bij welke benadering van risicotaxatie wordt het risico bepaald via een vaste optelsom van empirisch gewogen risicofactoren, vergeleken met normgroepen?","o":["Gestructureerd klinisch oordeel","Actuariële risicotaxatie","Ongestructureerde dossierstudie","Ongestructureerd klinisch oordeel"],"a":1,"u":"Bij actuariële risicotaxatie worden empirisch onderbouwde risicofactoren gewogen en opgeteld tot een score die wordt vergeleken met normgroepen. Het gestructureerd klinisch oordeel weegt factoren per cliënt af in plaats van via vaste normtabellen."},{"t":"4","q":"Waar richt het risicoprincipe binnen het Risk-Need-Responsivity-model (RNR) zich op?","o":["De leerstijl en motivatie van de pleger afstemmen op de behandeling","De intensiteit van de behandeling afstemmen op het ingeschatte recidiverisico","Uitsluitend de statische, onveranderlijke risicofactoren behandelen","Het aanleren van prosociale levensdoelen los van het risiconiveau"],"a":1,"u":"Het risicoprincipe stelt dat de intensiteit van de behandeling moet aansluiten bij het recidiverisico: laag risico weinig of geen intensieve behandeling, hoog risico intensieve behandeling. Een verkeerde afstemming, zoals intensieve behandeling bij laag risico, kan het recidiverisico juist verhogen."},{"t":"5","q":"Wat voor soort begrip is toerekeningsvatbaarheid?","o":["Een juridisch begrip","Een criminologisch begrip","Een medisch begrip","Een psychologisch begrip"],"a":0,"u":"Toerekeningsvatbaarheid is een juridisch begrip; de invulling ervan verschilt tussen rechtssystemen. De deskundige heeft hierbij enkel een adviserende rol, de rechter beslist."},{"t":"5","q":"Welke van de volgende vragen wordt bij een forensisch psychiatrisch deskundigenonderzoek niet aan de gerechtspsychiater voorgelegd?","o":["Of de persoon op het ogenblik van de feiten leed aan een geestesstoornis die zijn oordeelsvermogen of de controle over zijn daden tenietdeed of ernstig aantastte","Of de persoon financieel in staat is de opgelegde schadevergoeding te betalen","Of er mogelijk een oorzakelijk verband bestaat tussen de geestesstoornis en de feiten","Dat en hoe de persoon kan worden behandeld, begeleid en verzorgd met het oog op re-integratie in de maatschappij"],"a":1,"u":"De wettelijke opdracht aan de deskundige betreft de geestesstoornis op het moment van feiten en onderzoek, het oorzakelijk verband, het recidivegevaar en de behandelbaarheid. De financiele draagkracht van de dader hoort daar niet bij."},{"t":"5","q":"Een verdachte was ontoerekeningsvatbaar op het ogenblik van de feiten, maar is toerekeningsvatbaar op het ogenblik van de berechting. Welke beslissing volgt hier volgens de standaardmatrix?","o":["Vrijspraak","Uitstel van vervolging","Veroordeling","Internering"],"a":0,"u":"Bij ontoerekeningsvatbaarheid op het moment van de feiten en toerekeningsvatbaarheid op het moment van berechting volgt vrijspraak. Internering vereist een geestesstoornis op het ogenblik van de beslissing zelf."},{"t":"5","q":"In welke situatie leidt de beoordeling van toerekeningsvatbaarheid tot internering?","o":["Verminderd toerekeningsvatbaar op het moment van de feiten met volledig herstel","Toerekeningsvatbaar op het moment van de feiten en toerekeningsvatbaar op het moment van berechting","Ontoerekeningsvatbaar op het moment van de feiten en ontoerekeningsvatbaar op het moment van berechting","Ontoerekeningsvatbaar op het moment van de feiten en toerekeningsvatbaar op het moment van berechting"],"a":2,"u":"Internering volgt wanneer de persoon ontoerekeningsvatbaar is op het moment van de feiten en er ook op het ogenblik van de beslissing een geestesstoornis is die het oordeelsvermogen of de controle tenietdoet of ernstig aantast. Internering volgt ook wanneer iemand toerekeningsvatbaar was op de feiten maar ontoerekeningsvatbaar bij berechting."},{"t":"5","q":"Wat betekent het juridische principe culpa in causa?","o":["Dat een geestesstoornis automatisch tot ontoerekeningsvatbaarheid leidt","Dat het slachtoffer mede schuld draagt aan het delict","Dat iemand door eigen schuld of opzet in een situatie is terechtgekomen waaruit een strafbaar feit voortvloeit","Dat de rechter altijd het advies van de deskundige moet volgen"],"a":2,"u":"Culpa in causa betekent schuld in de oorzaak: de betrokkene is door eigen schuld of opzet in de toestand geraakt van waaruit het strafbare feit voortkwam. De rechter toetst dan de mate van schuld, ook bij noodweer of psychische overmacht."},{"t":"5","q":"Waarop moet een deskundige bij de correctionele rechtbank in de eerste plaats letten bij het uitbrengen van zijn verslag?","o":["Op tegenspraak enkel bij burgerlijke zaken","Op het volledig ontbreken van tegenspraak","Op altijd geldende tegenspraak","Op de wens van het slachtoffer"],"a":2,"u":"Het beginsel van tegenspraak geldt steeds: het deskundigenverslag moet aan tegenspraak van de partijen kunnen worden onderworpen, zodat het advies controleerbaar en betwistbaar blijft."},{"t":"5","q":"Wat is het belangrijkste voordeel van diagnostische classificatiesystemen in de forensische context?","o":["Ze vervangen het klinisch oordeel van de deskundige volledig","Ze zorgen voor duidelijkheid en uniformiteit in de diagnosestelling","Ze garanderen dat een dader niet zal recidiveren","Ze bepalen rechtstreeks de arbeidsgeschiktheid van de dader"],"a":1,"u":"Classificatiesystemen bieden vooral duidelijkheid en uniformiteit, zodat verschillende clinici tot een vergelijkbare diagnose komen en die onderling controleerbaar is. Het vaststellen van arbeidsgeschiktheid is geen doel van deze systemen."},{"t":"5","q":"Welke worden gezien als de meest voorkomende oorzaken van amnesie binnen het strafrecht?","o":["Middelen of alcohol, een psychotische toestand en psychologische afweermechanismen zoals verdringing","Enkel een aangeboren geheugenstoornis","Uitsluitend een depressie","Uitsluitend het bewust simuleren van geheugenverlies"],"a":0,"u":"De meest genoemde oorzaken zijn intoxicatie door middelen of alcohol, een psychotische toestand en psychologische afweermechanismen zoals verdringing. Depressie alleen geldt niet als een van de voornaamste oorzaken."},{"t":"5","q":"Wat is het uitgangspunt van het strafrecht ten aanzien van de verantwoordelijkheid van een dader?","o":["Elke dader met een psychiatrische diagnose is per definitie ontoerekeningsvatbaar","De verantwoordelijkheid wordt uitsluitend door de behandelend psychiater vastgesteld","Iedere dader wordt in principe verantwoordelijk geacht voor zijn daden, tenzij een geestesstoornis dit tenietdoet","Een dader is nooit verantwoordelijk zolang er geen risicotaxatie is uitgevoerd"],"a":2,"u":"Het strafrecht gaat ervan uit dat iedere dader verantwoordelijk is voor zijn daden en de gevolgen ervan kan inschatten en dragen. Ontoerekeningsvatbaarheid door een geestesstoornis vormt hierop de uitzondering."},{"t":"5","q":"Wat is het hoofddoel van de maatregel internering?","o":["Het financieel compenseren van de slachtoffers van het delict","Uitsluitend het straffen van de dader voor de gepleegde feiten","De maatschappij beschermen en tegelijk zorg op maat bieden met het oog op re-integratie","Het definitief uitsluiten van de dader uit de samenleving zonder behandeling"],"a":2,"u":"Internering is een veiligheidsmaatregel die de maatschappij beschermt en tegelijk aan de geinterneerde persoon de zorg biedt die zijn toestand vereist, gericht op maatschappelijke re-integratie."},{"t":"6","q":"Door welke dienst wordt de begeleiding en pre-therapie van gedetineerden binnen de Belgische gevangenis doorgaans verzorgd?","o":["De onderzoeksrechter","De politionele recherche","Het Openbaar Ministerie","De Psychosociale Dienst (PSD)"],"a":3,"u":"De Psychosociale Dienst (PSD) staat binnen de gevangenis in voor de psychosociale begeleiding en voorbereidende pre-therapie van gedetineerden. De andere diensten hebben een gerechtelijke of vervolgingsfunctie, geen behandelende rol."},{"t":"6","q":"Welke afkorting hoort bij de instelling die specifiek geïnterneerde personen opvangt en behandelt met het oog op re-integratie?","o":["Forensic Psychiatric Clinic","Federatie Psychiatrische Centra","Forensische Preventiecel","Forensisch Psychiatrisch Centrum (FPC)"],"a":3,"u":"FPC staat voor Forensisch Psychiatrisch Centrum, de gesloten instelling waar geïnterneerden zorg en behandeling krijgen met het oog op maatschappelijke re-integratie. De overige opties zijn geen bestaande instellingsbenamingen in deze context."},{"t":"6","q":"Welke twee vormen behoren tot de nagebootste (factitieuze) stoornissen?","o":["Kleptomanie en pyromanie","Somatisatie en conversie","Münchausen en Münchausen by proxy","Hypochondrie en malingering"],"a":2,"u":"De nagebootste stoornis omvat het syndroom van Münchausen, waarbij iemand symptomen bij zichzelf voorwendt, en Münchausen by proxy, waarbij symptomen bij een ander, meestal een kind, worden uitgelokt of voorgewend. Simulatie (malingering) valt hier juist buiten, omdat daar een extern voordeel het doel is."},{"t":"6","q":"Welke twee stoornissen behoren tot de impulscontrolestoornissen?","o":["Necrofilie en zoöfilie","Anorexie en boulimie","Pyromanie en kleptomanie","Fobie en paniekstoornis"],"a":2,"u":"Pyromanie (dwangmatig vuur stichten) en kleptomanie (dwangmatig stelen zonder materieel motief) zijn klassieke impulscontrolestoornissen. Wraak of een hulpkreet vormen geen diagnostische categorie binnen deze groep."},{"t":"6","q":"Wat wordt in de forensische context bedoeld met criminogenese?","o":["De sporen die op de plaats delict worden aangetroffen","De uitwerking van hoe een dader vanuit zijn persoonlijkheid en psychopathologie op een bepaald moment tot de feiten is gekomen","Het strafblad of criminele verleden van de dader","De eigen verklaring van de dader over hoe hij de feiten pleegde"],"a":1,"u":"Criminogenese beschrijft het ontstaansproces van het delict: hoe persoonlijkheid, psychopathologie en context samenkomen zodat de dader op een gegeven moment tot de feiten overgaat. Het gaat dus om een verklarend model, niet om forensische sporen of het strafblad."},{"t":"6","q":"De verklaring waarbij afwijkend seksueel gedrag wordt teruggevoerd op associatief leren, naar analogie met de conditionering bij Pavlovs hond, sluit het nauwst aan bij welke benadering?","o":["De ontwikkelingsgerichte benadering","De psychodynamische benadering","De levensloopbenadering","De gedragstherapeutische benadering"],"a":3,"u":"Conditionering en associatief leren, zoals bij Pavlov, vormen de kern van de gedragstherapeutische of leertheoretische benadering. Psychodynamische, levensloop- en ontwikkelingsmodellen vertrekken vanuit andere verklaringsprincipes."},{"t":"6","q":"Vanaf welke IQ-grens spreekt men doorgaans van een verstandelijke (mentale) beperking?","o":["Vanaf een IQ tussen 75 en 80","Vanaf een IQ lager dan 70","Vanaf een IQ hoger dan 115","Vanaf een IQ tussen 85 en 115"],"a":1,"u":"Een IQ lager dan 70 geldt, samen met beperkingen in het adaptief functioneren, als grens voor een verstandelijke beperking. Een IQ tussen 85 en 115 valt binnen het gemiddelde bereik."},{"t":"6","q":"Welke twee instrumenten worden als projectieve tests beschouwd?","o":["De WAIS en de WISC","De PCL-R en de HCR-20","De MMPI en de BDI","De Rorschach-test en de Thematische Apperceptietest (TAT)"],"a":3,"u":"De Rorschach-inktvlekkentest en de TAT zijn klassieke projectieve tests, waarbij de betrokkene innerlijke inhoud projecteert op ambigue stimuli. De WAIS is een intelligentietest, de PCL-R een risicotaxatie-instrument en de MMPI een gestructureerde zelfrapportagevragenlijst."},{"t":"6","q":"Katatoon gedrag uit zich in eerste instantie vooral in welk verschijnsel?","o":["Vlakke, afgestompte stemming","Wisselende, grootse wanen","Uitgesproken spierverstijving en bewegingsstoornissen","Aanhoudende akoestische hallucinaties"],"a":2,"u":"Katatonie is een psychomotorisch syndroom dat zich onder meer uit in spierverstijving, houdingsverstarring en andere bewegingsstoornissen. Hallucinaties, affectvervlakking en wanen zijn andere symptoomdomeinen die niet de kern van katatoon gedrag vormen."}],"theory":[{"h":"Seksuele stoornissen & parafilieen","items":["Parafilie: een intense en aanhoudende seksuele interesse die afwijkt van interesse in genitale stimulatie met een volwassen, instemmende partner.","Parafiele stoornis: een parafilie die actueel lijden of beperking veroorzaakt, of waarvan de bevrediging schade of risico op schade aan anderen inhoudt.","Exhibitionisme: seksuele opwinding door zichzelf te tonen aan ongewillige slachtoffers.","Voyeurisme: seksuele opwinding door het heimelijk begluren van anderen.","Frotteurisme: seksuele opwinding door zich tegen een niet-instemmende persoon aan te wrijven.","Seksueel sadisme: seksuele opwinding door een ander pijn of vernedering toe te brengen.","Seksueel masochisme: seksuele opwinding door zelf gepijnigd of vernederd te worden.","Fetisjisme: seksuele opwinding door niet-levende objecten.","Pedofilie: seksuele aantrekking tot prepuberale kinderen, waarbij de persoon minstens 16 jaar is en 5 jaar ouder dan het kind.","Efebofilie: seksuele aantrekking tot puberende adolescenten, te onderscheiden van pedofilie.","Exclusieve versus niet-exclusieve pedofilie: uitsluitend aangetrokken tot kinderen, tegenover ook nog in staat tot een relatie met een volwassene.","Anger excitation (Groth): sadistisch type verkrachting waarbij de pleger opwinding ontleent aan het lijden van het slachtoffer, de kleinste maar gevaarlijkste groep."]},{"h":"Stalking & stalkertypologie","items":["Stalking: patroon van herhaald intrusief en hinderlijk gedrag gericht op een specifieke persoon, waarbij het slachtoffer zich angstig, onrustig en bedreigd voelt.","Juridische visie (art. 442bis): belaging waarbij de dader wist of moest weten dat hij de rust van het slachtoffer ernstig zou verstoren; sinds de wetswijziging van 2016 is geen voorafgaande klacht meer vereist.","Afgewezen stalker: grootste groep, treedt op na een relatiebreuk vanuit een streven naar verzoening of wraak, waarbij stalken een substituut voor de relatie wordt.","Naar intimiteit zoekende stalker: gedreven door eenzaamheid en gebrek aan liefde, houdt een gefantaseerde relatie levend en gelooft dat de liefde al bestaat of zal komen.","Incompetente stalker: heeft geen partner en probeert aantrekking op te wekken, maar mist de sociale vaardigheden, wat leidt tot irritatie, woede en angst bij het slachtoffer.","Wraaklustige (rancuneuze) stalker: ervaart zichzelf als slachtoffer van onrecht of vernedering en stalkt vanuit een motief van wraak, controle en macht.","Roofzuchtige stalker: minst prevalent maar moeilijkste casussen, gekenmerkt door sadistische seksualiteit, informatie verzamelen, voyeurisme en anticiperende fantasieen.","Escalerend stalkingsgedrag: hierarchische opbouw van intimiteit zoeken, nabijheid zoeken, binnendringen, intimidatie tot geweld, dat niet altijd wordt bereikt.","Relational goal pursuit theory: stalkers koppelen een lager doel aan een hoger relationeel doel dat disproportioneel belangrijk wordt, wat via ruminatie en emotionele flooding tot volharding leidt.","Prevalentie: levensloopprevalentie van slachtofferschap ongeveer 25 procent, gemiddelde duur circa 22 maanden, en in ongeveer 79 procent van de gevallen kent het slachtoffer de dader.","Stalking Risk Profile: gestructureerd instrument dat risico's inschat op geweld, volharding, herhaling na interventie en psychosociale schade voor de stalker zelf.","Stalking Assessment and Management (SAM): beoordeelt de aard van de stalking, de risicofactoren van de pleger en de kwetsbaarheden van het slachtoffer."]},{"h":"Psychose, schizofrenie & hersenletsel","items":["Positieve symptomen: symptomen die extra optreden en niet bij een gezond persoon voorkomen, zoals wanen en hallucinaties.","Negatieve symptomen: symptomen die het functioneren verminderen of remmen, zoals affectieve afvlakking, anhedonie en sociale terugtrekking.","Dopaminehypothese: verhoogde dopaminerge activiteit wordt klassiek gelinkt aan psychose en aan de positieve symptomen van schizofrenie.","Katatoon gedrag: gedesorganiseerd psychomotorisch symptoom met onder meer spierverstijving en bewegingsstoornissen.","Schizofreniespectrumstoornissen: DSM-5-categorie met schizofrenie, waanstoornis, schizoaffectieve, schizofreniforme en kortdurende psychotische stoornis.","Anosognosie: gebrekkig ziekte-inzicht dat als psychopathologische risicofactor voor geweld geldt.","Prevalentie psychose in detentie: ongeveer 3,6 procent binnen de gedetineerdenpopulatie.","Geweld en psychose: vooral positieve symptomen verhogen het risico, terwijl geweldpleging de samenkomst van meerdere heterogene factoren vereist.","Mild head injury: lichte hersenschudding door voor-achterwaartse en rotationele krachten, vaak bij jongvolwassenen van 20 tot 40 jaar.","Cognitieve symptomen: gedesorganiseerd denken, verwardheid, wanen en verminderde aandacht, werkgeheugen en executieve functies.","Somatische symptomen: onder meer een ontregeld slaappatroon, verlies van interesse in voedsel en seksualiteit en hallucinaties in diverse zintuiglijke vormen.","Amnesie in het strafrecht: vaak veroorzaakt door middelen- of alcoholintoxicatie, een psychotische toestand of psychologische verdringing.","Middelenmisbruik: recente en voorafgaande intoxicatie is een belangrijke risicofactor voor geweld bij psychotische stoornissen."]},{"h":"Persoonlijkheidsstoornissen, psychopathie & risicotaxatie","items":["Psychopathie: affectief en interpersoonlijk deficit met oppervlakkige charme, gebrek aan empathie, wroeging en schuld; gelinkt aan antisociaal, niet noodzakelijk crimineel gedrag.","PCL-R: gestructureerd instrument dat psychopathie meet via interview en dossierstudie; prototypische score 40, cutoff rond 30 (VS) of 25 tot 28 (Europa).","Antisociale persoonlijkheidsstoornis: DSM-5-diagnose met minstens drie criteria zoals normovertreding, impulsiviteit, prikkelbaarheid en ontbreken van spijt.","Borderline persoonlijkheidsstoornis: emotionele instabiliteit, zwart-wit denken (splitting), verlatingsangst en impulsiviteit; empathie is geen kernkenmerk dat ontbreekt op de manier van psychopathie, maar de emotieregulatie is verstoord.","Theatrale (histrionische) persoonlijkheidsstoornis: aandachtzoekend, dramatisch, overdreven emotioneel en sterk suggestibel gedrag.","Risicotaxatie: het inschatten van het risico op toekomstig gewelddadig of niet-gewelddadig gedrag, nooit met 100 procent zekerheid.","Ongestructureerd klinisch oordeel: risico ingeschat op intuïtie en ervaring, met lage interbeoordelaarsbetrouwbaarheid en beperkte voorspellende waarde.","Actuariële risicotaxatie: empirisch gewogen risicofactoren opgeteld tot een score en vergeleken met normgroepen.","Gestructureerd klinisch oordeel: empirisch onderbouwde risicofactoren, aangevuld met klinische expertise en per cliënt gewogen in plaats van via normtabellen.","Statische versus dynamische risicofactoren: statische factoren zijn historisch en onveranderbaar, dynamische factoren zijn (soms snel) veranderbaar en vormen aangrijpingspunten voor behandeling.","Risk-Need-Responsivity (RNR): risicoprincipe (intensiteit afstemmen op risico), behoefteprincipe (focus op criminogene noden) en responsiviteit (afstemmen op leerstijl en motivatie).","Good Lives Model: strength-based benadering die plegers uitrust met vaardigheden om prosociale doelen (primary goods) te bereiken in plaats van enkel recidive te vermijden."]},{"h":"Toerekeningsvatbaarheid, recht & procedure","items":["Toerekeningsvatbaarheid: juridisch begrip dat aangeeft of iemand verantwoordelijk kan worden gehouden voor zijn daden; de invulling verschilt per rechtssysteem.","Uitgangspunt strafrecht: iedere dader is verantwoordelijk voor zijn daden en kan de gevolgen ervan inschatten en dragen; ontoerekeningsvatbaarheid is de uitzondering.","Ontoerekeningsvatbaarheid: wanneer een geestesstoornis het oordeelsvermogen of de controle over de daden tenietdoet of ernstig aantast.","Adviserende rol deskundige: de forensisch psychiater of psycholoog adviseert, maar de rechter beslist uiteindelijk over toerekeningsvatbaarheid en straf of maatregel.","Internering: veiligheidsmaatregel die de maatschappij beschermt en tegelijk zorg op maat biedt aan de geinterneerde met het oog op re-integratie.","Vier deskundigenvragen: geestesstoornis op het moment van feiten en onderzoek, oorzakelijk verband met de feiten, recidivegevaar door de stoornis, en de behandelbaarheid met het oog op re-integratie.","Moment feiten versus moment berechting: de combinatie van de toestand op beide momenten bepaalt de uitkomst (veroordeling, vrijspraak of internering).","Vrijspraak: volgt wanneer de persoon ontoerekeningsvatbaar was op het moment van de feiten maar toerekeningsvatbaar is op het moment van berechting.","Internering: volgt bij ontoerekeningsvatbaarheid op zowel het moment van de feiten als de berechting, en ook bij toerekeningsvatbaarheid op de feiten maar ontoerekeningsvatbaarheid bij de berechting.","Culpa in causa: schuld in de oorzaak, waarbij iemand door eigen schuld of opzet in de toestand raakte waaruit het strafbare feit voortvloeide; de rechter toetst de mate van schuld.","Dimensionele opdeling: naast de binaire opdeling toerekeningsvatbaar of niet, bestaat een glijdende schaal van licht via verminderd tot sterk verminderd toerekeningsvatbaar.","Tegenspraak: het deskundigenverslag moet steeds aan tegenspraak van de partijen kunnen worden onderworpen, zodat het advies controleerbaar blijft.","Classificatiesystemen: bieden duidelijkheid en uniformiteit in de diagnosestelling en maken diagnoses tussen clinici onderling controleerbaar.","Amnesie in strafrecht: de meest voorkomende oorzaken zijn intoxicatie door middelen of alcohol, een psychotische toestand en afweermechanismen zoals verdringing."]},{"h":"Forensische instellingen, diagnostiek & overige","items":["Psychosociale Dienst (PSD): dienst binnen de gevangenis die instaat voor psychosociale begeleiding en voorbereidende pre-therapie van gedetineerden.","Forensisch Psychiatrisch Centrum (FPC): gesloten instelling waar geïnterneerden zorg en behandeling krijgen, gericht op maatschappelijke re-integratie.","Internering: veiligheidsmaatregel voor personen met een geestesstoornis, die tegelijk de maatschappij beschermt en de betrokkene passende zorg biedt.","Nagebootste stoornis: stoornis waarbij symptomen worden voorgewend of opgewekt, met als varianten Münchausen (bij zichzelf) en Münchausen by proxy (bij een ander).","Impulscontrolestoornis: stoornis met falende impulsbeheersing, zoals pyromanie (vuur stichten) en kleptomanie (stelen zonder materieel motief).","Criminogenese: verklarend proces van hoe persoonlijkheid, psychopathologie en context samen tot het delict leiden.","Gedragstherapeutische benadering: leertheoretisch model dat gedrag verklaart via conditionering en associatief leren, in de lijn van Pavlov.","Projectieve test: diagnostisch instrument met ambigue stimuli waarop de betrokkene innerlijke inhoud projecteert, zoals de Rorschach-test en de TAT.","Verstandelijke beperking: significant verlaagd intellectueel functioneren, doorgaans bij een IQ lager dan 70, samen met beperkingen in adaptief gedrag.","Katatonie: psychomotorisch syndroom met onder meer spierverstijving, houdingsverstarring en andere bewegingsstoornissen.","Toerekeningsvatbaarheid: juridisch begrip dat aangeeft in welke mate iemand voor zijn daden verantwoordelijk kan worden gehouden.","Gestructureerd klinisch oordeel: risicotaxatie die empirisch onderbouwde risicofactoren combineert met klinische weging per individu."]}],"hacks":[{"h":"Parafilie = fascinatie, parafiele stoornis = fascinatie PLUS schade","t":"Onthoud: een parafilie op zich is enkel een afwijkende fascinatie. Pas wanneer er lijden bij de persoon of schade aan anderen bijkomt, spreek je van een parafiele stoornis. Denk: fascinatie alleen is nog geen stoornis, fascinatie plus negatieve gevolgen wel."},{"h":"AWIRR: de vijf types","t":"Onthoud de vijf Mullen-types met AWIRR: Afgewezen (grootste groep), Wraaklustig, Intimiteit zoekend, Roofzuchtig (kleinste groep) en incompetente Rokkenjager. Zo koppel je meteen de uitersten: Afgewezen is het meest voorkomend, Roofzuchtig het minst."},{"h":"Positief = erbij, negatief = eraf","t":"Positieve symptomen komen er extra bij (wanen, hallucinaties), negatieve symptomen halen iets weg (affect, sociaal contact, motivatie). Denk aan een plus- en een minteken op je functioneren."},{"h":"RNR onthouden","t":"Denk aan de drie R-N-R-vragen: hoeveel behandeling (Risico), waaraan werken (Need, oftewel criminogene noden) en hoe aanbieden (Responsiviteit, afgestemd op de persoon). Zo verwar je het risicoprincipe niet met het behoefte- of responsiviteitsprincipe."},{"h":"Feiten en berechting: de twee momenten","t":"Onthoud dat je altijd naar twee momenten kijkt: het moment van de feiten en het moment van de berechting. Vrijspraak hoort bij ontoerekeningsvatbaar op de feiten maar toerekeningsvatbaar bij berechting, terwijl internering een geestesstoornis vereist die ook op het moment van de beslissing nog aanwezig is."},{"h":"PSD zit binnen, FPC vangt geïnterneerden op","t":"Onthoud: de PSD begeleidt binnen de gevangenis (Psychosociale Dienst, Pre-therapie, Penitentiair), terwijl het FPC de geïnterneerden opvangt. Twee P's voor de gevangenisdienst, F van Forensisch voor de gesloten zorginstelling."}]};
</script>

    var html='<div class="card pad"><h2 style="margin-top:0">Feedback &amp; klachten</h2>'+
      '<p class="muted">Fout in een vraag, een idee, of werkt iets niet? Laat het hier weten, het komt rechtstreeks bij de maker terecht. Een review of compliment mag ook: de mooiste tonen we op de hub. 💬</p>'+
      '<label class="fld" for="fbMsg">Je bericht</label><textarea id="fbMsg" rows="5" placeholder="Beschrijf de fout of je idee…"></textarea>'+
      '<label class="fld" for="fbWaar">Over welke vraag? <span class="muted">(optioneel)</span></label><input type="text" id="fbWaar" placeholder="bv. de vraag over de p-waarde">'+
      '<label class="fld" for="fbNaam">Je naam <span class="muted">(optioneel)</span></label><input type="text" id="fbNaam" placeholder="zodat we je kunnen bedanken">'+
      '<label class="fld" for="fbEmail">Je e-mail <span class="muted">(optioneel, als je een antwoord wilt)</span></label><input type="email" id="fbEmail" placeholder="naam@voorbeeld.be">'+
      '<input type="text" id="fbBot" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0">'+
      '<div class="row" style="margin-top:16px;align-items:center"><button class="btn" id="fbSend">'+ic("send")+'Versturen</button><span id="fbStatus" style="font-size:13px"></span></div></div>';
    setHTML(html);
    document.getElementById("fbSend").onclick=function(){
      var status=document.getElementById("fbStatus");
      if(document.getElementById("fbBot").value) return;
      var msg=document.getElementById("fbMsg").value.trim();
      if(!msg){ status.style.color="var(--bad)"; status.textContent="Schrijf eerst een bericht."; return; }
      var btn=document.getElementById("fbSend"); btn.disabled=true; status.style.color="var(--muted)"; status.textContent="Versturen…";
      var em=document.getElementById("fbEmail").value.trim();
      var nm=document.getElementById("fbNaam").value.trim();
      var waar=document.getElementById("fbWaar").value.trim();
      var payload={_subject:"Forensische Psychiatrie-tool: feedback", _template:"table", _captcha:"false",
        Naam:nm||"-", Over_welke_vraag:waar||"-", email:em||"-", Bericht:msg};
      if(em) payload._replyto=em;
      // vangnet: als de verzenddienst blokkeert (bv. spamfilter) of er is geen verbinding,
      // bieden we een directe mailto-knop aan zodat de melding NOOIT stilletjes verdwijnt.
      function failFallback(reden){
        var body="Feedback Forensische Psychiatrie-tool%0D%0A%0D%0ANaam: "+encodeURIComponent(nm||"-")+"%0D%0AOver welke vraag: "+encodeURIComponent(waar||"-")+"%0D%0AE-mail: "+encodeURIComponent(em||"-")+"%0D%0A%0D%0ABericht:%0D%0A"+encodeURIComponent(msg);
        var mailto="mailto:berat007yildirim@gmail.com?subject="+encodeURIComponent("Forensische Psychiatrie-tool: feedback")+"&body="+body;
        setHTML('<div class="card pad"><h2 style="margin-top:0">Automatisch versturen lukte niet</h2><p class="muted">'+reden+' Geen zorgen, klik hieronder en je melding wordt geopend in je e-mail, helemaal klaar om te versturen:</p><a class="btn" href="'+mailto+'">'+ic("send")+'Mail mijn melding direct</a><div style="margin-top:14px"><button class="btn ghost" id="bk">Terug naar start</button></div></div>');
        document.getElementById("bk").onclick=function(){go("home");};
      }
      fetch("https://formsubmit.co/ajax/Berat007yildirim@gmail.com",{method:"POST",headers:{Accept:"application/json"},body:new URLSearchParams(payload)})
        .then(function(r){return r.json();}).then(function(d){
          if(d&&(d.success===true||d.success==="true")){ setHTML('<div class="card pad results center"><div style="font-size:42px">✅</div><h2 style="margin:6px 0">Bedankt!</h2><p class="muted">Je melding is verstuurd.</p><button class="btn" id="bk" style="margin-top:8px">Terug naar start</button></div>'); document.getElementById("bk").onclick=function(){go("home");}; }
          else { failFallback("Het automatisch versturen lukte niet."); }
        }).catch(function(){ failFallback("Er was even geen verbinding."); });
    };
  }

  document.addEventListener("keydown",function(e){ if(state.key) state.key(e); });
  // bezoeker tellen (1x per toestel)
  try{ if(!localStorage.getItem("forens_seen")){ localStorage.setItem("forens_seen","1"); bump("berat-forens","gebruikers"); } }catch(e){ bump("berat-forens","gebruikers"); }
  // traject vanuit de hub overnemen → direct naar de oefenpagina
  try{ var _q=new URLSearchParams(location.search); var _m=_q.get("m");
    if(_m==="training"||_m==="herkansing"){ state.track=_m; lset("forens_track",_m);
      var _c=_q.get("calm"); if(_c!=null){ calm=(_c!=="0"); lset("forens_calm",calm); applyCalm(); }
      state.step="practice"; state.fromHub=true; }
  }catch(e){}
  render();
  // launch-splash netjes laten verdwijnen
  (function(){ var _sp=document.getElementById("splash"); if(!_sp) return; var _red=false; try{_red=window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){} setTimeout(function(){ _sp.classList.add("hide"); setTimeout(function(){ if(_sp&&_sp.parentNode) _sp.parentNode.removeChild(_sp); }, 700); }, _red?300:1850); })();
})();
</script>
</body>
</html>
