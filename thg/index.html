<script>
window.THG = {"questions":[{"t":"1","q":"Waarom ontstaat de psychologie volgens de tekst pas laat als zelfstandige wetenschap?","o":["Ze maakt zich als een van de laatste vakken los van de filosofie","Universiteiten erkenden haar pas na de biologie officieel","Ze had tot in de 20ste eeuw geen eigen studieobject","Ze bleef bewust een tak van de geneeskunde"],"a":0,"u":"De tekst zegt dat de psychologie als een van de laatste wetenschappen loskomt van de filosofie. De etymologie psyche-logos betekent studie van de geest."},{"t":"1","q":"Wat wordt binnen het positivisme bedoeld met sciëntisme?","o":["De regel dat elke theorie eerst gefalsifieerd moet zijn","De opvatting dat wetenschap geen enkel maatschappelijk doel mag dienen","Het geloof dat wetenschap op alle problemen een antwoord biedt","Het idee dat wetenschap alleen beschrijft en nooit verklaart"],"a":2,"u":"Sciëntisme is het geloof dat wetenschap op alle problemen een antwoord zal bieden, waardoor wetenschap bijna als een religie wordt beschouwd."},{"t":"1","q":"Hoe vat de tekst het inductieprobleem van Hume samen als kritiek op het positivisme?","o":["Men verwart deductie met een echte causale verklaring","Feiten laten zich nooit los van een theorie waarnemen","De wetenschap houdt geen rekening met andere maatschappelijke belangen","Je kunt vanuit enkele observaties niet veralgemenen naar een algemene wet"],"a":3,"u":"Volgens Hume vormt inductie een probleem, want op basis van een beperkt aantal observaties kun je niet zomaar besluiten tot een algemene wet."},{"t":"1","q":"Wat betekent de term nomologisch in het deductief-nomologische model?","o":["Redeneren van het bijzondere naar het algemene","Werken vanuit wetten of wetmatigheden","Verklaren via het doel of de functie van iets","Uitspraken doen over slechts één individu"],"a":1,"u":"Nomologisch verwijst naar het werken vanuit wetten. Het DN-model koppelt deductie, dus van algemeen naar specifiek, aan deze wetmatige benadering."},{"t":"1","q":"Wat houdt het gevaar van een circulaire redenering in binnen het DN-model?","o":["De hypothese wordt getoetst met een te ruwe meting","Men gebruikt probabilistische termen zonder wetten te vinden","Het explanandum zit al verwerkt in het explanans","De feiten blijken achteraf theoriegeladen"],"a":2,"u":"Een circulaire redenering ontstaat als het verklaarde, het explanandum, al in het verklarende, het explanans, zit, bijvoorbeeld bij verklaren via geoperationaliseerde begrippen."},{"t":"1","q":"Wat is volgens Poppers kritiek op confirmatie het eigenlijke doel van de wetenschapper?","o":["Een hypothese proberen te falsifiëren omdat wetenschap open en veranderlijk is","Zo veel mogelijk bevestigingen voor een hypothese verzamelen","Elke waarneming eerst verifiëren voordat men verdergaat","Wetten afleiden uit accidentiële veralgemeningen en die als noodzakelijke wetmatigheden zien"],"a":0,"u":"Popper stelt dat wetenschap open en veranderlijk is, dus je moet veronderstellen dat een hypothese fout is. Het doel is falsifiëren en niet bevestigen."},{"t":"1","q":"Hoe omschrijft de tekst het onderscheid tussen een nomotetische en een ideografische benadering?","o":["Nomotetisch verklaart via functie, ideografisch via causaliteit","Nomotetisch hoort bij realisme, ideografisch bij instrumentalisme","Nomotetisch beschrijft één uniek geval, ideografisch formuleert wetten over groepen","Nomotetisch doet uitspraken over groepen, ideografisch gaat voort op één individu"],"a":3,"u":"Nomotetisch betekent uitspraken doen over groepen, terwijl ideografisch voortgaat op één individu. Psychologie zit tussen beide benaderingen in."},{"t":"1","q":"Een therapeut past enkel algemeen bewezen technieken toe zonder de cliënt echt te begrijpen. Welk risico noemt de tekst hierbij?","o":["De verklaring wordt circulair en mist causaliteit","De patiënt krijgt de trucjes door en voelt zich niet begrepen","De patiënt wordt begrepen maar niet geholpen","De therapeut wordt zelf te sterk beïnvloed door zijn eigen theorie"],"a":1,"u":"Een louter nomotetische aanpak zorgt ervoor dat de patiënt de trucjes doorheeft en zich niet begrepen voelt. Een louter ideografische aanpak begrijpt wel maar helpt niet."},{"t":"1","q":"Wat kenmerkt volgens de tekst een functionalistische of teleologische verklaring?","o":["Ze herleidt de werkelijkheid volledig tot materie","Ze zoekt uit waarom iets in de natuur gebeurt","Ze biedt een verklaring in functie van iets anders","Ze werkt uitsluitend met correspondentieregels"],"a":2,"u":"Functionalistisch of teleologisch verklaren biedt een verklaring in functie van iets anders, met als gevaar circulaire redeneringen zonder onderscheid tussen oorzaak en gevolg."},{"t":"1","q":"Hoe beschouwde Niels Bohr volgens de tekst zijn eigen theorieën, in lijn met het instrumentalisme?","o":["Als de werkelijkheid zelf van het bestaan","Als een sociaal geconstitueerde levensvorm","Als een noodzakelijke en voldoende voorwaarde","Als een beschrijving en niet als de werkelijkheid"],"a":3,"u":"Bohr beschouwde zijn theorieën niet als de werkelijkheid maar als een beschrijving. Dat past bij de instrumentalistische visie waarin begrippen instrumenten zijn."},{"t":"1","q":"Wat zegt het zuinigheidsprincipe van Ockham (Ockham's razor) over de wetenschap?","o":["Eenvoud is het kenmerk van de wetenschap","Wetenschap en religie vormen samen één geheel","Feiten zijn altijd geladen met een theorie","Eén weerlegging volstaat om een theorie te verwerpen"],"a":0,"u":"Ockham's razor stelt dat eenvoud het kenmerk van de wetenschap is. Men kiest de meest eenvoudige verklaring."},{"t":"1","q":"Wat bedoelt de tekst met het onderscheid tussen een primaire en een secundaire kwaliteit?","o":["Primair is subjectief en verschilt per persoon, secundair is objectief","Primair betreft groepen, secundair betreft individuen","Primair is objectief en rechtstreeks waarneembaar, secundair is subjectief","Primair hoort bij inductie, secundair bij deductie"],"a":2,"u":"Een primaire kwaliteit (Galilei) is puur objectief en rechtstreeks waarneembaar, terwijl een secundaire kwaliteit (Nagel) subjectief is met individuele verschillen in waarneming."},{"t":"1","q":"Wat is volgens de tekst het verschil tussen een naturalistische en een normatieve benadering van de wetenschap?","o":["De naturalistische stelt een norm, de normatieve beschrijft de geschiedenis","De naturalistische beschrijft hoe wetenschap verloopt, de normatieve hoe ze zou moeten verlopen","De naturalistische werkt met axioma's, de normatieve met correspondentieregels","De naturalistische bestudeert de natuurwetenschappen, de normatieve enkel de menswetenschappen"],"a":1,"u":"De naturalistische benadering beschrijft hoe wetenschap feitelijk verloopt, terwijl de normatieve benadering een norm stelt over hoe wetenschap zou moeten verlopen, zoals Poppers falsificationisme."},{"t":"1","q":"Welke uitspraak sluit het best aan bij de Newtoniaanse stijl van wetenschapsbeoefening?","o":["Wetenschappelijke wetten beschrijven de verborgen essentie van de natuur.","Een wet is vooral een compacte samenvatting van geobserveerde regelmatigheden.","Een verklaring is pas wetenschappelijk als ze een achterliggend mechanisme specificeert.","Metafysische hypothesen zijn nodig om observaties betekenis te geven.","Een wetenschappelijke theorie moet in de eerste plaats moreel richtinggevend zijn."],"a":1,"u":"De Newtoniaanse stijl beschrijft hoe verschijnselen zich gedragen, niet waarom. Newton weigerde hypothesen over de verborgen oorzaak van zwaartekracht: een wet vat regelmatigheden samen."},{"t":"1","q":"Welke combinatie is correct volgens het positivisme van Comte?","o":["Hypothesen, metafysica en causale mechanismen.","Descriptie, predictie en controle.","Interpretatie, historiciteit en zingeving.","Realisme, noodzakelijkheid en modale termen.","Introspectie, ethiek en teleologie."],"a":1,"u":"Bij Comte dient kennis om te beschrijven, te voorspellen en te beheersen. Metafysische vragen naar de essentie vallen daarbuiten."},{"t":"1","q":"Een onderzoeker zegt: “Agressieve personen gedragen zich agressief omdat zij een agressieve persoonlijkheid hebben.” Wat is vanuit het D-N-model het voornaamste probleem?","o":["De uitspraak is probabilistisch.","De explanans bevat geen algemene wet.","Het explanandum is inhoudelijk al opgenomen in het explanans.","De uitspraak is niet falsifieerbaar omdat agressie niet observeerbaar is.","Er wordt een causale in plaats van een nomologische verklaring gegeven."],"a":2,"u":"Dit is een circulaire verklaring: het te verklaren feit zit al in de verklaring. Agressief gedrag verklaren door een agressieve persoonlijkheid voegt niets toe."},{"t":"1","q":"Welke uitspraak over het D-N-model is NIET juist?","o":["Verklaren wordt opgevat als het logisch afleiden van een gebeurtenis uit algemene wetmatigheden.","Het model sluit nauw aan bij het logisch positivisme.","Volgens het model zijn verklaren en voorspellen structureel verwant.","Het model lost het inductieprobleem op doordat voldoende confirmaties een wet definitief bewijzen.","Het model stelt strikte eisen aan wetenschappelijke verklaringen."],"a":3,"u":"Het D-N-model lost het inductieprobleem juist niet op. Hoeveel bevestigingen er ook zijn, een algemene wet blijft weerlegbaar. De andere uitspraken kloppen wel."},{"t":"1","q":"Waarom vormden dispositionele termen zoals “breekbaar” een probleem voor het oorspronkelijke verificatieprincipe?","o":["Ze zijn alleen betekenisvol in de humane wetenschappen.","Ze verwijzen naar eigenschappen die kunnen bestaan zonder dat ze op dat moment geobserveerd worden.","Ze kunnen uitsluitend via introspectie worden vastgesteld.","Ze zijn per definitie causaal en niet empirisch.","Ze kunnen nooit in een theorie worden gebruikt."],"a":1,"u":"Dispositionele termen verwijzen naar wat iets zou doen onder bepaalde omstandigheden. Een glas is breekbaar ook als het nu niet breekt, dus strikte verificatie schiet tekort."},{"t":"1","q":"Welke uitspraak illustreert het probleem van accidentele veralgemeningen het best?","o":["Alle metalen zetten uit bij verwarming.","Alle planeten bewegen volgens stabiele regelmatigheden.","Alle munten die ik nu in mijn zak heb, zijn van koper.","Alle levende organismen bevatten genetisch materiaal.","Alle proefpersonen kregen dezelfde instructie."],"a":2,"u":"Dat alle munten in je zak van koper zijn, is toevallig waar. Een echte wet draagt contrafeitelijke uitspraken, een accidentele veralgemening niet."},{"t":"1","q":"Welke uitspraak past het best bij een functionele verklaring?","o":["Een geheugenfout ontstaat doordat neuronen in gebied X beschadigd zijn.","Het geheugen dient om informatie te bewaren en later opnieuw beschikbaar te maken.","Een persoon herinnert zich iets omdat hij een goed geheugen heeft.","Een score op een geheugentest is de operationele definitie van geheugen.","Geheugen is waar als de term correspondeert met een onafhankelijke werkelijkheid."],"a":1,"u":"Een functionele verklaring zegt waartoe iets dient. Ze noemt het nut, niet het onderliggende mechanisme."},{"t":"1","q":"Wat maakt een geselecteerde functie anders dan een loutere causale rol?","o":["Een geselecteerde functie verwijst naar het effect waarvoor een kenmerk evolutionair behouden werd.","Een geselecteerde functie beschrijft enkel wat een onderdeel op dit moment doet.","Een geselecteerde functie vermijdt elke verwijzing naar evolutie.","Een geselecteerde functie vereist dat het organisme bewust een doel nastreeft.","Een geselecteerde functie is alleen bruikbaar in de psychologie."],"a":0,"u":"Een geselecteerde functie is het effect waarvoor een kenmerk evolutionair behouden bleef. Een causale rol is wat het nu feitelijk doet: het hart pompt bloed en maakt ook geluid."},{"t":"1","q":"Welke bewering over teleologische verklaringen is het meest correct?","o":["De evolutietheorie veronderstelt dat evolutie bewust naar een vooraf bepaald doel werkt.","Teleologische taal kan bruikbaar lijken, maar evolutie zelf hoeft geen doelgericht proces te zijn.","Teleologische verklaringen zijn identiek aan causale mechanistische verklaringen.","Een teleologische verklaring is alleen geldig als het doel empirisch observeerbaar is.","Teleologische verklaringen spelen geen rol in de biologie."],"a":1,"u":"Teleologische taal is handig, maar evolutie werkt zonder vooropgezet doel. Natuurlijke selectie streeft niets na."},{"t":"1","q":"Een wetenschapper behandelt intelligentie uitsluitend als “wat een IQ-test meet”. Welke positie wordt hiermee het sterkst uitgedrukt?","o":["Wetenschappelijk realisme.","Operationalisme, nauw verbonden met instrumentalisme.","Semantisch realisme.","Sociaal constructionisme.","Falsificationisme."],"a":1,"u":"Operationalisme laat een begrip samenvallen met de meetprocedure. Dat sluit aan bij instrumentalisme, waarin theorieën instrumenten zijn en geen beschrijving van een verborgen werkelijkheid."},{"t":"1","q":"Welke combinatie van denker en positie is correct?","o":["Mach, realisme over atomen.","Mendeljev, strikt instrumentalisme over atomen.","Bohr, instrumentalistische houding tegenover de kwantumbeschrijving.","Einstein, positivistische afwijzing van onderliggende realiteit.","Ockham, sociaal constructionisme."],"a":2,"u":"Bohr behandelde de kwantumbeschrijving instrumentalistisch: de formules werken, of er een onderliggende realiteit achter zit liet hij open. Mach was juist antirealist over atomen."},{"t":"1","q":"Wat is volgens de semantische benadering het beste beeld van een wetenschappelijke theorie?","o":["Een verzameling axioma’s waarvan alle theoretische termen volledig operationeel gedefinieerd moeten zijn.","Een model dat bepaalde aspecten van de werkelijkheid representeert zonder alles letterlijk te hoeven omvatten.","Een lijst observaties zonder theoretische begrippen.","Een verzameling uitspraken waarvan enkel de syntactische vorm belangrijk is.","Een consensus die binnen een onderzoeksgroep ontstaat."],"a":1,"u":"De semantische benadering ziet een theorie als een model dat bepaalde aspecten representeert, niet als een axiomatisch stelsel van uitspraken."},{"t":"1","q":"Welke uitspraak past NIET bij Thomas Kuhns naturalistische benadering van wetenschapsverandering?","o":["Wetenschap ontwikkelt zich binnen paradigma’s.","Anomalieën kunnen bijdragen aan een wetenschappelijke crisis.","Wetenschappelijke verandering kan revoluties bevatten.","Er bestaan vaste, tijdloze methodologische regels waarmee elke theoriewissel rationeel wordt afgedwongen.","Historische studie van feitelijke wetenschapsontwikkeling is belangrijk."],"a":3,"u":"Kuhn ontkent juist vaste tijdloze regels. Theoriewissels verlopen via paradigma's, anomalieën, crisis en revolutie, en zijn historisch te bestuderen."},{"t":"1","q":"Wat is de centrale demarcatiegedachte bij Popper?","o":["Een theorie is wetenschappelijk als ze vaak bevestigd is.","Een theorie is wetenschappelijk als ze in principe risico loopt door waarnemingen weerlegd te worden.","Een theorie is wetenschappelijk als ze eenvoudig is.","Een theorie is wetenschappelijk als ze door de meerderheid wordt aanvaard.","Een theorie is wetenschappelijk als ze alleen observeerbare termen bevat."],"a":1,"u":"Falsifieerbaarheid is bij Popper het demarcatiecriterium. Een theorie is wetenschappelijk als ze iets verbiedt en dus kan sneuvelen aan waarneming."},{"t":"1","q":"Welke uitspraak ondersteunt het best het idee dat de vraag of wetenschap “de echte realiteit” onthult een schijnprobleem kan zijn?","o":["Omdat waarneming soms fout is, kan correcte waarneming nooit bestaan.","Dat organismen overleven toont dat waarneming onfeilbaar is.","Het begrip wetenschappelijke fout veronderstelt al de mogelijkheid tot correctie binnen wetenschappelijk onderzoek.","Dubbelzinnige figuren tonen dat elke interpretatie even waar is.","Realisme en antirealisme hebben exact dezelfde betekenis."],"a":2,"u":"Dat we van een wetenschappelijke fout kunnen spreken en die kunnen corrigeren, veronderstelt al dat onderzoek zich laat bijsturen door iets buiten onszelf."},{"t":"2","q":"Wat noemt dit hoofdstuk de kern van de 'ware moraal'?","o":["Het ego centraal stellen en persoonlijk succes najagen","Alle bestaansvragen herleiden tot meetbare feiten","Versmelten met de kosmische eenheid","Volledig steunen op instrumentele rationaliteit"],"a":2,"u":"De tekst opent met de stelling dat de ware moraal samenvalt met versmelting met de kosmische eenheid, tegenover het hyperindividualisme waarin het ego centraal staat."},{"t":"2","q":"Hoe staat Nietzsche volgens de tekst tegenover het zelfbewustzijn?","o":["Uitgesproken pessimistisch","Voorzichtig optimistisch","Volledig neutraal","Onverschillig"],"a":0,"u":"De tekst noemt Nietzsche zeer pessimistisch over het zelfbewustzijn, terwijl denkers als Jonas en Heidegger juist positieve emoties aan het bewustzijn koppelen."},{"t":"2","q":"Iemand zegt: 'We denken allemaal dat we belangrijk zijn, maar op lange termijn zijn we allemaal dood en slechts een lichtflits.' Bij welk idee uit de tekst past dit het best?","o":["Het universele gelijkheidsideaal van Kant","De cognitieve rationaliteit","De vergankelijkheid van het bestaan volgens Keynes","De onvermijdelijke vooruitgang van de wetenschap volgens Comte"],"a":2,"u":"Dit is precies de gedachte over de vergankelijkheid van het bestaan die de tekst aan Keynes koppelt: we voelen ons belangrijk, maar zijn maar een lichtflits."},{"t":"2","q":"Wat is volgens de tekst het onderscheid tussen cognitieve en instrumentele rationaliteit?","o":["Cognitief is weten om te weten, instrumenteel is weten om toe te passen","Cognitief is waardenvrij, instrumenteel is cultuurgebonden","Cognitief hoort bij het hart, instrumenteel bij de rede","Cognitief is transcendent, instrumenteel is direct waarneembaar"],"a":0,"u":"De tekst omschrijft cognitieve rationaliteit als weten om te weten en instrumentele rationaliteit als weten om toe te passen."},{"t":"2","q":"Welke kenmerken horen volgens de tabel bij de Lebenswelt (zingeving) en niet bij de wetenschap?","o":["Empirische kwaliteiten en kennisvragen","Kritische ingesteldheid en afstandelijkheid","Waardenvrijheid en directe waarneembaarheid","Bestaansvragen en diep vertrouwen"],"a":3,"u":"In de tegenstelling wetenschap versus Lebenswelt staan bij de Lebenswelt onder meer bestaansvragen, nabijheid, hermeneutische kwaliteiten en diep vertrouwen, tegenover de kennisvragen en kritische ingesteldheid van de wetenschap."},{"t":"2","q":"Welke uitspraak geeft correct weer wat Scruton volgens de tekst over de wetenschap zegt?","o":["Wetenschap kan de afstand tussen subject en object volledig overbruggen","Wetenschap is te reductionistisch, want de realiteit is meer dan feiten","Wetenschap brengt vooral positieve emoties met zich mee","Wetenschap is de enige echte bron van zingeving"],"a":1,"u":"Volgens Scruton is de wetenschap te reductionistisch omdat ze alles in feiten wil vatten, terwijl de realiteit meer is dan dat."},{"t":"2","q":"Wat vormt de kern van het tragikomische karakter van het menselijke bestaan in hoofdstuk 2?","o":["Dat mensen geen toegang hebben tot objectieve kennis.","Dat het individuele ik tegelijk als uiterst belangrijk en als vluchtig wordt ervaren.","Dat mensen uitsluitend rationeel handelen.","Dat bewustzijn enkel door taal bestaat.","Dat mensen volledig kunnen opgaan in de wereld."],"a":1,"u":"Het tragikomische zit in de dubbelheid: het ik ervaart zichzelf als centrum van de wereld en beseft tegelijk hoe klein en vergankelijk het is."},{"t":"2","q":"Welke uitspraak wordt gekoppeld aan Keynes?","o":["God dobbelt niet met het universum.","In the long run we are all dead.","Het hart heeft zijn redenen die het verstand niet begrijpt.","Ik denk, dus ik ben.","Eenvoud is het kenmerk van de waarheid."],"a":1,"u":"Van Keynes komt de uitspraak In the long run we are all dead, een spottende relativering van redeneringen op lange termijn."},{"t":"2","q":"Wat bedoelt Kant in deze cursuscontext met de rede tegenover het verstand?","o":["De rede beperkt zich tot zintuiglijke waarneming.","De rede stelt vragen die uit onze menselijke aard voortkomen maar ons kenvermogen kunnen overstijgen.","Het verstand houdt zich alleen bezig met moraal.","De rede is hetzelfde als instrumentele rationaliteit.","Het verstand is volgens Kant volledig waardeloos voor wetenschap."],"a":1,"u":"Bij Kant ordent het verstand de ervaring, terwijl de rede vragen stelt die uit onze aard voortkomen maar het kenvermogen overstijgen."},{"t":"2","q":"Wat deed Pascal volgens de cursus inzien dat het typisch menselijke niet enkel in het verstand ligt?","o":["Zijn ontdekking van de zwaartekracht.","Het bouwen van een rekenmachine die bepaalde mentale bewerkingen kon uitvoeren.","Een experiment met apen.","Zijn kritiek op de kwantumfysica.","Zijn theorie over taalspelen."],"a":1,"u":"Pascal bouwde een rekenmachine. Dat een machine bewerkingen kon overnemen die als typisch menselijk golden, verschoof het eigene van de mens weg van het pure rekenen."},{"t":"2","q":"Welke tegenstelling hoort bij Pascal?","o":["Correspondentie versus consensus.","Les raisons de la raison versus les raisons du coeur.","Type versus token materialisme.","Normale wetenschap versus revolutie.","Verificatie versus confirmatie."],"a":1,"u":"Van Pascal komt de gedachte dat het hart zijn redenen heeft die de rede niet kent. Naast les raisons de la raison staan les raisons du coeur."},{"t":"2","q":"Welke vraag behoort het duidelijkst tot de Lebenswelt en niet tot een strikt empirisch wetenschappelijk probleem?","o":["Hoe vaak komt depressie voor bij studenten?","Welke hersengebieden activeren tijdens taalverwerking?","Wat maakt een leven voor iemand betekenisvol?","Is er een correlatie tussen slaapduur en concentratie?","Welke behandeling verlaagt gemiddeld de angstscore?"],"a":2,"u":"Wat een leven betekenisvol maakt, is een zinvraag binnen de Lebenswelt. De andere vragen zijn met onderzoek te beantwoorden."},{"t":"2","q":"Wat kenmerkt de Lebenswelt het best?","o":["Afstandelijke observatie van waardevrije feiten.","Interne vertrouwdheid met cultureel ingebedde betekenissen, gewoonten en waarden.","Volledige reductie van ervaring tot hersenprocessen.","Universele wetten die onafhankelijk van context gelden.","Uitsluitend logische analyse van taal."],"a":1,"u":"De Lebenswelt is de geleefde wereld van betekenissen, gewoonten en waarden waarin we van binnenuit staan, niet als afstandelijke waarnemer."},{"t":"2","q":"Welke combinatie is correct?","o":["Cognitieve rationaliteit, kennis gebruiken om een praktisch doel te bereiken.","Instrumentele rationaliteit, kennis nastreven enkel om te weten.","Cognitieve rationaliteit, kennen om te kennen.","Instrumentele rationaliteit, afwijzen van wetenschap.","Les raisons du coeur, afstandelijke objectieve analyse."],"a":2,"u":"Cognitieve rationaliteit is kennen om te kennen. Instrumentele rationaliteit gebruikt kennis om een praktisch doel te bereiken."},{"t":"2","q":"Welke situatie past het MINST bij zingeving?","o":["Ontroerd worden door muziek.","Medelijden voelen met iemand die lijdt.","Je verbonden voelen met de sterrenhemel.","Een object afstandelijk analyseren en uitsluitend meetbare kenmerken noteren.","Een situatie ervaren als betekenisvol binnen je levensgeschiedenis."],"a":3,"u":"Zingeving veronderstelt betrokkenheid. Puur afstandelijk meten is precies de tegenovergestelde houding."},{"t":"2","q":"Welke uitspraak over de relatie subject-object in het kennisdomein is correct?","o":["Subject en object vallen volledig samen.","De afstand tussen subject en object wordt principieel als onoverbrugbaar beschouwd.","Het object wordt benaderd via een afstandelijke houding, met de bedoeling de afstand in kennis te overbruggen.","Alleen emoties kunnen de afstand overbruggen.","Het object is uitsluitend een sociale constructie."],"a":2,"u":"In het kennisdomein neemt het subject afstand van het object, met de bedoeling die afstand via kennis te overbruggen."},{"t":"2","q":"Wat bedoelt Schopenhauer met de gedachte dat we geen “gevleugelde engelenhoofden zonder lijf” zijn?","o":["Menselijke kennis is volledig onafhankelijk van het lichaam.","Onze ervaring van de wereld is onlosmakelijk verbonden met ons lichamelijke bestaan.","Het lichaam verhindert elke vorm van bewustzijn.","De mens kan alleen via zuivere rede tot kennis komen.","Het bewustzijn is een toevallig computerprogramma."],"a":1,"u":"Schopenhauer benadrukt dat we belichaamde wezens zijn. Onze ervaring van de wereld is niet los te maken van het lichaam."},{"t":"2","q":"Welke uitspraak past het best bij Kierkegaards tragische visie op bewustzijn?","o":["De mens kan zichzelf volledig vergeten zodra hij slaapt.","Bewustzijn maakt het mogelijk volledig met de wereld samen te vallen.","De mens kan niet volledig opgaan in zichzelf en evenmin volledig in de wereld.","Het menselijke probleem verdwijnt door wetenschappelijke kennis.","De mens is alleen een object tussen andere objecten."],"a":2,"u":"Bij Kierkegaard kan de mens niet samenvallen met zichzelf en evenmin volledig opgaan in de wereld. Die tussenpositie maakt het bestaan tragisch."},{"t":"2","q":"Welke uitspraak past het best bij Nietzsche in hoofdstuk 2?","o":["Het ik moet zoveel mogelijk gecultiveerd worden als hoogste morele doel.","Altruïsme is volledig tegengesteld aan egoïsme.","Het ik en het individualisme worden kritisch bekeken, met aandacht voor het overschrijden van het individuele.","Bewustzijn is volgens hem het bewijs van een stabiele ziel.","De rationele mens is voor hem het hoogste eindpunt van de evolutie."],"a":2,"u":"Nietzsche bekijkt het ik en het individualisme kritisch en heeft juist oog voor vormen waarin het individuele wordt overschreden."},{"t":"2","q":"Een onderzoeker vraagt niet “Hoe vaak ervaren mensen rouw?”, maar “Wat betekent het verlies van een ouder binnen iemands levensverhaal?” Welke verschuiving maakt hij?","o":["Van Lebenswelt naar positivisme.","Van zingeving naar louter predictie.","Van een afstandelijke kennisvraag naar een betekenisvraag binnen de Lebenswelt.","Van hermeneutiek naar reductionisme.","Van instrumentele naar uitsluitend wiskundige rationaliteit."],"a":2,"u":"De vraag verschuift van hoe vaak iets voorkomt naar wat het betekent in iemands levensverhaal. Dat is de stap van kennisvraag naar betekenisvraag."},{"t":"2","q":"Welke uitspraak onderscheidt een wetenschappelijke bestaansvraag het best van een vraag uit de Lebenswelt?","o":["Wetenschap kan empirische of conceptuele vragen over een verschijnsel onderzoeken, maar de persoonlijke zin ervan is van een andere orde.","Elke bestaansvraag is per definitie empirisch toetsbaar.","Lebenswelt-vragen zijn fout geformuleerde wetenschappelijke hypothesen.","Alle betekenisvragen kunnen opgelost worden door meer data te verzamelen.","Alleen religie kan uitspraken doen over de Lebenswelt."],"a":0,"u":"Wetenschap kan het verschijnsel onderzoeken, maar de persoonlijke zin ervan ligt op een ander vlak en volgt niet uit meer data."},{"t":"3","q":"Wat is binnen deze benadering de kern van hermeneutiek?","o":["Het interpreteren van (wetenschappelijke) teksten en literatuur, met oog voor historiciteit","Het meten en kwantificeren van gedrag met natuurwetenschappelijke methoden","Het vastleggen van de ene ware betekenis van een tekst, los van elke lezer en elk tijdperk","Het buiten beschouwing laten van geschiedenis om neutraal te blijven"],"a":0,"u":"Hermeneutiek gaat over het interpreteren van (wetenschappelijke) teksten en literatuur en neemt de geschiedenis mee in acht."},{"t":"3","q":"Waarom moeten we volgens Gadamer de naieve verleiding van het objectivisme weerstaan?","o":["Omdat objectiviteit alleen in de harde wetenschappen zou tellen","Omdat volledig bewustzijn nooit mogelijk is, waardoor ook neutraliteit onmogelijk is en er altijd vooroordelen meespelen","Omdat de onderzoeker zijn vooroordelen eerst volledig moet uitschakelen om daarna tot een volledig neutrale blik te kunnen komen","Omdat de geschiedenis geen enkele invloed op onze standpunten zou hebben"],"a":1,"u":"Gadamer stelt dat volledig bewustzijn nooit mogelijk is, dus neutraliteit ook niet, en dat onze observaties altijd vooroordelen bevatten. Realisme bereik je door in dialoog te gaan en telkens een ander perspectief in te nemen."},{"t":"3","q":"Een onderzoeker plaatst een ritueel volledig in zijn context om de betekenis te vatten in plaats van het enkel feitelijk te noteren. Welk begrip past hierbij?","o":["Decontextualisering volgens Dreyfus","Correspondentietheorie","Thick description volgens Geertz","Discours-analyse"],"a":2,"u":"Volgens Geertz vraagt begrijpen om een thick description: je contextualiseert om tot een volledige beschrijving te komen, wat aansluit bij het hermeneutisch begrijpen (Verstehen)."},{"t":"3","q":"Hoe verhoudt Verstehen (begrijpen) zich tot erklaren (verklaren)?","o":["Verstehen staat recht tegenover verklaren en geldt als een aparte kwaliteit","Verstehen en verklaren zijn twee namen voor precies dezelfde methode","Verstehen is een natuurwetenschappelijk kenmerk en verklaren een humanistisch","Verstehen vervangt het verklaren volledig in alle wetenschappen"],"a":0,"u":"Het hermeneutisch begrijpen (Verstehen) is humanistisch en staat recht tegenover het verklaren, dat een natuurwetenschappelijk kenmerk is. Het geldt als een aparte kwaliteit en wordt ingezet voor kwalitatief onderzoek."},{"t":"3","q":"Welke rol speelt taal volgens Wittgenstein in deze tekst?","o":["Taal is overbodig zodra de data zuiver gemeten zijn","Taal bewijst dat er een onafhankelijke werkelijkheid buiten de geest bestaat","Taal geeft betekenis aan de data, en foute taal kan tot een foute interpretatie leiden","Taal is enkel nuttig binnen de harde wetenschappen"],"a":2,"u":"Volgens Wittgenstein dient taal om betekenis aan de data te geven. Data kan bovendien fout geinterpreteerd worden, waardoor ook de gebruikte taal fout is."},{"t":"3","q":"Iemand vindt dat de hermeneutische cirkel iets zegt over de structuur van de werkelijkheid zelf. Om welke interpretatie gaat het dan?","o":["De methodologische interpretatie van Schleiermacher","De holistische interpretatie van Taylor","De ontologische interpretatie van Heidegger en Gadamer","De consensustheorie van de waarheid"],"a":2,"u":"De ontologische interpretatie (Heidegger en Gadamer) zegt iets over de structuur van de werkelijkheid. De methodologische (Schleiermacher) gaat over hoe men de werkelijkheid moet opvatten en de holistische (Taylor) over de wisselwerking tussen delen en geheel."},{"t":"3","q":"Wat stelt het sociaal constructionisme volgens de tekst?","o":["Dat er waardevrije beschrijvingen bestaan die losstaan van de samenleving","Dat wetenschappelijke termen de werkelijkheid reeel en exact weergeven","Dat kennis de werkelijkheid passief representeert","Dat alle kennis sociaal geconstrueerd is en daardoor onderhandelbaar wordt"],"a":3,"u":"Het sociaal constructionisme stelt dat alle kennis sociaal geconstrueerd is en zo onderhandelbaar wordt. Realiteit ontstaat door actieve constructie in plaats van passieve representatie, en waardevrije beschrijvingen bestaan niet."},{"t":"3","q":"Welke waarheidsopvatting stelt dat beweringen waar zijn wanneer ze de realiteit correct beschrijven, met aanhangers die geloven in een onafhankelijke werkelijkheid buiten de geest?","o":["Correspondentietheorie","Coherentietheorie","Consensustheorie","Pragmatische opvatting"],"a":0,"u":"De correspondentietheorie (realisme) stelt dat beweringen waar zijn wanneer ze de realiteit beschrijven. De aanhangers zijn ontologische realisten die in een onafhankelijke werkelijkheid buiten de geest geloven."},{"t":"3","q":"Wat is een centraal kenmerk van hermeneutiek?","o":["Zoeken naar contextvrije universele wetten.","Betekenis begrijpen vanuit geschiedenis, context en interpretatie.","Alle theoretische termen operationeel definiëren.","Menselijk gedrag reduceren tot fysiologie.","Alleen observeerbaar gedrag beschrijven."],"a":1,"u":"Hermeneutiek richt zich op het begrijpen van betekenis, en dat gebeurt altijd vanuit geschiedenis, context en interpretatie."},{"t":"3","q":"Wat bedoelt Gadamer met kritiek op het naïeve objectivisme?","o":["Dat objectiviteit eenvoudig te bereiken is als onderzoekers hun vooroordelen negeren.","Dat begrijpen altijd vanuit een historisch en vooraf gevormd perspectief gebeurt.","Dat alleen natuurwetenschappen objectief kunnen zijn.","Dat taal geen rol speelt in interpretatie.","Dat de werkelijkheid volgens hem niet bestaat."],"a":1,"u":"Gadamer stelt dat er geen standpunt buiten de geschiedenis bestaat. We begrijpen altijd vanuit een voorgevormd perspectief, en dat is geen gebrek maar een voorwaarde."},{"t":"3","q":"Welke uitspraak over vooroordelen in de hermeneutiek is het meest correct?","o":["Vooroordelen kunnen volledig worden uitgeschakeld door training.","Vooroordelen zijn altijd fouten en moeten verdwijnen.","Een poging om alle vooroordelen van buitenaf te herkennen veronderstelt zelf een neutraal standpunt en kan daardoor problematisch zijn.","Vooroordelen hebben alleen betrekking op politieke overtuigingen.","Vooroordelen zijn irrelevant omdat betekenissen vastliggen."],"a":2,"u":"Wie beweert alle vooroordelen van buitenaf te kunnen aanwijzen, claimt zelf een neutraal standpunt. Precies dat bestaat volgens de hermeneutiek niet."},{"t":"3","q":"Wat houdt de hermeneutische cirkel in?","o":["Een theorie wordt waar door herhaalde confirmatie.","De betekenis van delen wordt begrepen vanuit het geheel en het geheel vanuit de delen.","Alle interpretaties keren uiteindelijk terug naar dezelfde objectieve betekenis.","Een explanandum wordt afgeleid uit een explanans.","Een onderzoeker wisselt inductie en deductie mechanisch af."],"a":1,"u":"In de hermeneutische cirkel begrijp je de delen vanuit het geheel en het geheel vanuit de delen. Begrip beweegt heen en weer."},{"t":"3","q":"Welke combinatie is correct?","o":["Schleiermacher, hermeneutische cirkel met vooral methodologische betekenis.","Gadamer, hermeneutische cirkel uitsluitend als technische leesmethode.","Heidegger, afwijzing van historiciteit.","Taylor, alle wetenschappen moeten volledig hermeneutisch zijn.","Rorty, natuurwetenschappen vereisen altijd een volledig andere methode dan menswetenschappen."],"a":0,"u":"Bij Schleiermacher heeft de cirkel vooral een methodologische betekenis. Bij Heidegger en Gadamer wordt hij existentieel."},{"t":"3","q":"Wat is volgens Taylor belangrijk bij het begrijpen van menselijk handelen?","o":["Handelingen hebben betekenis onafhankelijk van elke context.","Betekenis ontstaat in een veld van andere betekenissen en praktijken.","Alle redenen voor gedrag moeten tot neurale oorzaken worden gereduceerd.","Alle subjectiviteit moet worden verwijderd.","Alle handelingen zijn alleen statistische gebeurtenissen."],"a":1,"u":"Bij Taylor krijgt een handeling betekenis binnen een veld van andere betekenissen en praktijken, niet los daarvan."},{"t":"3","q":"Welke uitspraak onderscheidt Dilthey en Taylor het best van Rorty en Gadamer in de cursus?","o":["Dilthey en Taylor verdedigen een onderscheid tussen verklaren in natuurwetenschappen en verstehen in humane wetenschappen.","Rorty en Gadamer verwerpen elke vorm van interpretatie.","Dilthey en Taylor vinden natuurwetenschappen onwetenschappelijk.","Rorty en Gadamer verdedigen uitsluitend positivisme.","Dilthey en Taylor ontkennen dat context bij mensen relevant is."],"a":0,"u":"Dilthey en Taylor verdedigen het onderscheid tussen verklaren in de natuurwetenschappen en verstehen in de humane wetenschappen."},{"t":"3","q":"Wat bedoelt universele hermeneutiek?","o":["Hermeneutiek is alleen geschikt voor oude religieuze teksten.","Alle wetenschappen moeten uitsluitend kwalitatief onderzoek gebruiken.","Hermeneutiek wordt opgevat als een algemene intellectuele houding die niet tot de humane wetenschappen beperkt blijft.","Alle wetenschappelijke uitspraken zijn per definitie onwaar.","Alleen psychologen mogen interpreteren."],"a":2,"u":"Universele hermeneutiek ziet interpretatie als een algemene intellectuele houding, dus niet als exclusief gereedschap van de menswetenschappen."},{"t":"3","q":"Welke uitspraak past het best bij Wittgensteins idee van taalspelen en levensvormen?","o":["Wetenschappelijke taal is volledig onafhankelijk van cultuur en praktijken.","De betekenis van taal hangt samen met het gebruik binnen een gedeelde levensvorm.","Elk woord heeft één onveranderlijke betekenis.","Alle taal verwijst rechtstreeks naar objecten in de werkelijkheid.","Taal is alleen een instrument om hypotheses te falsifiëren."],"a":1,"u":"Bij Wittgenstein is betekenis gebruik. Een taalspel hoort bij een levensvorm, dus bij gedeelde praktijken."},{"t":"3","q":"Waarmee komt sociaal constructionisme het meest overeen wat betreft waarheid?","o":["Correspondentietheorie.","Consensustheorie.","Naïef realisme.","Zuiver falsificationisme.","Biologisch reductionisme."],"a":1,"u":"Sociaal constructionisme sluit aan bij de consensustheorie: waar is wat binnen een gemeenschap als waar wordt aanvaard."},{"t":"3","q":"Welke uitspraak is een intern probleem voor radicaal relativisme?","o":["Het stelt dat sommige kennis cultureel bepaald kan zijn.","De bewering dat alles relatief is, lijkt zelf als algemene waarheid te worden gepresenteerd.","Het gebruikt te weinig experimentele data.","Het accepteert de correspondentietheorie.","Het veronderstelt dat taal altijd letterlijk is."],"a":1,"u":"Radicaal relativisme is zelfweerleggend. De uitspraak dat alles relatief is, presenteert zichzelf als algemeen geldige waarheid."},{"t":"3","q":"Welke uitspraak over de correspondentietheorie is correct?","o":["Een bewering is waar wanneer de groep ermee instemt.","Een bewering is waar wanneer ze praktisch nuttig is.","Een bewering is waar wanneer ze overeenstemt met een onafhankelijke werkelijkheid.","Een bewering is waar wanneer ze logisch past in om het even welk systeem.","Een bewering kan nooit waar zijn."],"a":2,"u":"In de correspondentietheorie is een bewering waar wanneer ze overeenstemt met de werkelijkheid zoals die onafhankelijk van ons bestaat."},{"t":"3","q":"Twee theorieën zijn elk intern logisch en coherent, maar spreken elkaar tegen. Welk probleem van de coherentietheorie wordt hier zichtbaar?","o":["Ze kan niet verklaren hoe empirische data worden verzameld.","Interne samenhang alleen bepaalt niet vanzelf welke van twee concurrerende coherente systemen waar is.","Ze vereist altijd consensus.","Ze veronderstelt een onafhankelijke werkelijkheid.","Ze is identiek aan pragmatisme."],"a":1,"u":"Coherentie alleen volstaat niet. Twee onderling strijdige systemen kunnen elk intern samenhangend zijn, en dan kies je er met samenhang alleen niet tussen."},{"t":"3","q":"Welke uitspraak past het best bij pragmatisme?","o":["Waarheid is wat rechtstreeks met de werkelijkheid correspondeert.","Waarheid is wat door alle mensen wordt aanvaard.","Waarheid wordt mede beoordeeld aan de hand van praktische gevolgen en wat werkt.","Waarheid is uitsluitend wat logisch afleidbaar is uit axioma’s.","Waarheid is onmogelijk."],"a":2,"u":"Pragmatisme beoordeelt waarheid mede aan de hand van praktische gevolgen: waar is wat in de praktijk werkt."},{"t":"3","q":"Een psycholoog wil het gedrag van één cliënt begrijpen door diens redenen, levensgeschiedenis, taal en culturele context te reconstrueren. Welke benadering sluit daar het meest bij aan?","o":["Strict positivisme.","Deductief-nomologische verklaring.","Hermeneutisch verstehen.","Operationalisme.","Eliminatief materialisme."],"a":2,"u":"Redenen, levensgeschiedenis, taal en culturele context reconstrueren is precies wat hermeneutisch verstehen doet."},{"t":"4","q":"Welke tegenstelling wordt in hoofdstuk 4 gebruikt om verschillende waarderingen van bewustzijn te tonen?","o":["Nietzsche ziet bewustzijn vooral kritisch, Hans Jonas ziet het ook als een hoogtepunt van menselijke mogelijkheden.","Nietzsche ziet bewustzijn als goddelijk, Hans Jonas als een ziekte.","Beiden beschouwen bewustzijn als puur artificieel.","Beiden ontkennen dat bewustzijn evolutionair ontwikkeld is.","Nietzsche en Jonas verdedigen identiek behaviorisme."],"a":0,"u":"Nietzsche kijkt kritisch naar bewustzijn, Hans Jonas ziet het juist als een hoogtepunt van wat de mens kan. Samen tonen ze de dubbele waardering."},{"t":"4","q":"Waarom worden witte bloedcellen in het hoofdstuk gebruikt als contrast met mensen?","o":["Omdat ze een complex zelfbewustzijn hebben zonder taal.","Omdat ze doelgericht lijken te handelen zonder zich vragen te stellen of rancune te voelen.","Omdat ze morele keuzes maken.","Omdat ze alternatieve toekomstscenario’s plannen.","Omdat ze volgens de cursus een primitieve vorm van religie bezitten."],"a":1,"u":"Witte bloedcellen handelen doelgericht zonder zich iets af te vragen. Ze tonen dat doelgericht gedrag geen reflectie vereist."},{"t":"4","q":"Wat illustreert het voorbeeld van termieten vooral?","o":["Dat complexe, georganiseerde activiteit noodzakelijk bewustzijn vereist.","Dat een organisme of kolonie complex kan functioneren zonder reflectief bewustzijn.","Dat termieten counterfactuals gebruiken.","Dat individuele termieten morele regels formuleren.","Dat bewustzijn alleen uit taal ontstaat."],"a":1,"u":"Een termietenkolonie bouwt bijzonder complexe structuren zonder dat er reflectief bewustzijn aan te pas komt."},{"t":"4","q":"Waarom is bedrog bij chimpansees volgens William Calvin relevant voor het ontstaan van bewustzijn?","o":["Bedrog vereist alleen een reflex.","Bedrog kan erop wijzen dat een dier alternatieve scenario’s kan voorstellen en gedrag daarop afstemt.","Bedrog bewijst dat chimpansees hetzelfde zelfbewustzijn hebben als moderne mensen.","Bedrog ontstaat alleen door menselijke training.","Bedrog is een puur fysiologische reactie zonder cognitieve betekenis."],"a":1,"u":"Om te bedriegen moet je je kunnen voorstellen wat de ander zal denken. Volgens Calvin wijst dat op het vermogen alternatieve scenario's te overwegen."},{"t":"4","q":"Welke conclusie mag volgens de cursus NIET te snel uit experimenten over schijnbaar moreel gedrag bij apen worden getrokken?","o":["Dat dieren gedrag kunnen vertonen dat op empathie lijkt.","Dat vergelijkbaar gedrag ook bij andere dieren kan voorkomen.","Dat dergelijk gedrag automatisch bewijst dat dieren dezelfde morele reflectie hebben als mensen.","Dat interpretatie van diergedrag voorzichtig moet gebeuren.","Dat gedrag niet altijd rechtstreeks de onderliggende mentale toestand onthult."],"a":2,"u":"Gedrag dat op empathie lijkt, bewijst niet dat het dier dezelfde morele reflectie heeft als een mens. Voorzichtigheid bij interpretatie blijft nodig."},{"t":"4","q":"Welke uitspraak over de ontwikkeling van het menselijke bewustzijn past het best bij de cursus?","o":["Het moderne individuele zelfbewustzijn was vanaf het begin van Homo sapiens volledig gevormd.","Het ontwikkelde zich langzaam onder invloed van culturele en historische veranderingen.","Het ontstond plots door de uitvinding van de computer.","Het bestond pas vanaf de twintigste eeuw.","Het is volledig genetisch en onafhankelijk van cultuur."],"a":1,"u":"Het moderne zelfbewustzijn is geleidelijk gegroeid, mede onder invloed van culturele en historische veranderingen."},{"t":"4","q":"Welke ontwikkeling wordt gekoppeld aan de hoge middeleeuwen en renaissance?","o":["Het verdwijnen van individuele identiteit.","De opkomst van biografieën, persoonlijke portretten en andere vormen van zelfreflectie.","Het einde van geschreven taal.","De afschaffing van morele verantwoordelijkheid.","De overgang van bewustzijn naar louter reflexgedrag."],"a":1,"u":"In de hoge middeleeuwen en de renaissance komen biografie, portret en zelfreflectie op. Dat wijst op een sterker individueel zelfbesef."},{"t":"4","q":"Wat is de betekenis van de verschuiving van Homerische helden naar Socrates en Plato in het verhaal over bewustzijn?","o":["Van persoonlijke verantwoordelijkheid naar volledige goddelijke sturing.","Van kritische rede naar puur mythisch denken.","Van een mens die sterk door goden wordt gestuurd naar een mens die zelf moet denken en verantwoordelijkheid draagt.","Van individualisme naar afwezigheid van het ik.","Van taal naar uitsluitend lichamelijke communicatie."],"a":2,"u":"Bij Homerus worden helden nog gestuurd door goden. Bij Socrates en Plato moet de mens zelf denken en verantwoordelijkheid dragen."},{"t":"4","q":"Wat bedoelt Cioran met jaloezie tegenover de natuur?","o":["Dat de natuur technologisch geavanceerder is dan de mens.","Dat niet-bewuste natuur geen last draagt van reflectief bewustzijn zoals de mens dat doet.","Dat dieren meer wetenschappelijke kennis hebben.","Dat mensen geen deel uitmaken van de natuur.","Dat bewustzijn volgens hem een objectieve illusie zonder gevolgen is."],"a":1,"u":"Cioran wijst erop dat de niet-bewuste natuur de last van reflectie niet draagt, en juist daarom benijdenswaardig lijkt."},{"t":"4","q":"Welke situatie past het best bij participerend bewustzijn?","o":["Je meet de lichtsterkte van een zonsondergang.","Je analyseert een muziekstuk uitsluitend op frequenties.","Je gaat tijdens muziek of een groepsritueel zo op in de ervaring dat de grens tussen jezelf en de omgeving tijdelijk minder sterk voelt.","Je berekent de gemiddelde duur van een concert.","Je beschrijft enkel observeerbaar gedrag van het publiek."],"a":2,"u":"Bij participerend bewustzijn ga je op in de ervaring en vervaagt de grens tussen jezelf en de omgeving tijdelijk."},{"t":"4","q":"Wat bedoelt Nietzsche met het Dionysische in de context van verbondenheid?","o":["Een strikt rationele en individuele analyse.","Een extatische ervaring waarin de scheiding tussen individuen tijdelijk vervaagt.","Een wetenschappelijke methode voor causaliteit.","Een vorm van instrumentele rationaliteit.","Een afwijzing van elke gemeenschappelijkheid."],"a":1,"u":"Het Dionysische staat bij Nietzsche voor roes en extase waarin de afgrenzing tussen individuen wegvalt, tegenover het Apollinische van vorm en maat."},{"t":"4","q":"Welke uitspraak past het MINST bij de ontwikkeling van bewustzijn zoals in het hoofdstuk beschreven?","o":["Bewustzijn hangt samen met het vermogen alternatieven te overwegen.","Culturele veranderingen droegen bij aan een sterker individueel zelfbesef.","Historische vormen van zelfbewustzijn waren identiek aan het huidige.","Morele en juridische systemen helpen spanningen tussen individu en gemeenschap regelen.","Zelfreflectie krijgt in latere cultuurvormen meer nadruk."],"a":2,"u":"Vormen van zelfbewustzijn zijn historisch veranderd. Beweren dat ze altijd identiek waren, gaat juist in tegen het hoofdstuk."},{"t":"4","q":"Een dier vindt voedsel, maar onderdrukt zijn normale signaal zodat soortgenoten het niet merken. Welke interpretatie past het best bij de cursus?","o":["Dit kan een aanwijzing zijn voor een prille vorm van scenario-denken.","Dit bewijst zonder twijfel volledig menselijk bewustzijn.","Dit is alleen mogelijk bij mensen.","Dit toont dat bewustzijn niet met gedrag verbonden is.","Dit is een voorbeeld van het D-N-model."],"a":0,"u":"Een signaal onderdrukken zodat soortgenoten het voedsel niet vinden, kan wijzen op een prille vorm van scenario-denken. Bewijs voor volledig menselijk bewustzijn is het niet."},{"t":"4","q":"Waarom leidt sterker individueel bewustzijn volgens het hoofdstuk ook tot maatschappelijke systemen?","o":["Omdat bewustzijn alle conflicten uitschakelt.","Omdat spanningen tussen persoonlijke en gemeenschappelijke belangen geregeld moeten worden.","Omdat wetten alleen ontstaan in organismen zonder bewustzijn.","Omdat cultuur door bewustzijn overbodig wordt.","Omdat individuele belangen altijd gelijk zijn aan groepsbelangen."],"a":1,"u":"Sterker individueel bewustzijn brengt spanning tussen eigen belang en groepsbelang. Moraal en recht zijn systemen die die spanning regelen."},{"t":"4","q":"Welke uitspraak vat de ambivalente visie op bewustzijn in hoofdstuk 4 het best samen?","o":["Bewustzijn is alleen een voordeel.","Bewustzijn is alleen een biologische fout.","Bewustzijn maakt cultuur, moraal en reflectie mogelijk, maar brengt ook onrust, afstand en lijden mee.","Bewustzijn heeft geen invloed op menselijk bestaan.","Bewustzijn is uitsluitend een taalverschijnsel."],"a":2,"u":"Bewustzijn maakt cultuur, moraal en reflectie mogelijk, maar brengt ook onrust, afstand en lijden mee. Die dubbelheid is de kern van het hoofdstuk."},{"t":"5","q":"Wat is volgens de tekst de kern van het 'modern dualisme' waar Searle achter staat?","o":["Bewustzijn blijft een raadsel en innerlijke toestanden zijn iets privé","Bewustzijn valt volledig samen met en herleidbaar tot fysieke hersenprocessen","Bewustzijn is een programma dat op om het even welke machine kan draaien","Bewustzijn is een illusie zonder enige echte functie"],"a":0,"u":"Searle ziet het bewustzijn als een mysterie, is voorstander van het modern dualisme en beschouwt innerlijke toestanden als een privéaangelegenheid."},{"t":"5","q":"Welke kijk hebben Dennett en Calvin op het ontstaan van het menselijk bewustzijn?","o":["Het is doelbewust door de evolutie ontworpen om te overleven","Het is een Goddelijke eigenschap die de mens van dieren scheidt","Het zetelt in minieme rotaties van de microtubuli in de cellen","Het is een onbedoeld evolutionair bijverschijnsel"],"a":3,"u":"Volgens Dennett en Calvin is het menselijk bewustzijn een onbedoeld evolutionair bijverschijnsel, dus geen doelgericht ontworpen eigenschap."},{"t":"5","q":"Iemand met blind zicht zegt niets te zien, maar antwoordt bij navraag toch meestal juist. Wat toont dit fenomeen volgens de tekst aan?","o":["Dat de menselijke hersenen gelaagder zijn dan je op het eerste zicht denkt","Dat het bewustzijn volledig losstaat van de hersenen","Dat visuele informatie pas kan worden verwerkt nadat ze bewust is waargenomen","Dat de betrokken persoon liegt over wat hij ziet"],"a":0,"u":"Bij visuele agnosie of blind zicht is men zich niet bewust iets te zien, maar de antwoorden kloppen meestal wel, wat wijst op de gelaagdheid van de menselijke hersenen."},{"t":"5","q":"Dennett noemt Searles standpunt een vorm van 'obscurantisme'. Wat bedoelt hij daarmee?","o":["Het idee dat de mens vooral een rationeel wezen is","Het herleiden van bewustzijn tot een universele Turing-machine","Het doelbewust in onwetendheid houden van mensen en zelfstandig denken verhinderen","Het vasthouden aan gezond verstand in plaats van aan wetenschappelijke argumenten"],"a":2,"u":"Volgens Dennett is Searles positie obscurantisme, oftewel het doelbewust streven om mensen in onwetendheid te houden en zelfstandig denken tegen te gaan."},{"t":"5","q":"Hoe reageert Searle op Dennetts verwijt van obscurantisme?","o":["Hij geeft toe dat innerlijke toestanden onwetendheid creëren","Hij verwerpt voortaan het modern dualisme","Hij stelt dat pijn geen obscurantisme is","Hij beweert dat een Turing-machine net als een mens werkt"],"a":2,"u":"Searle brengt in dat pijn geen obscurantisme is, dus dat een privé innerlijke toestand zoals pijn wel degelijk reëel is."},{"t":"5","q":"Welke opvatting past volgens de tekst bij de opkomst van computers en AI als nieuw perspectief op bewustzijn?","o":["Enkel top-down processen maken zelfsturing mogelijk","De Turing-machine, een universele machine, werkt net zoals een mens","Bewustzijn is een Goddelijke eigenschap die niet te modelleren valt","AI kan de evolutionair ontwikkelde organismen niet overstijgen"],"a":1,"u":"In de context van computers en AI stelt men dat de Turing-machine, een universele machine, net zoals een mens werkt."},{"t":"5","q":"Wat is de kern van Penrose zijn opvatting over waar het bewustzijn zich bevindt (Orch OR-theorie)?","o":["Het bewustzijn ontstaat enkel via top-down processen in de grote hersenschors","Het bewustzijn is een privéaangelegenheid die niet fysiek te lokaliseren valt","Het bewustzijn is een onbedoeld bijverschijnsel van de evolutie","Het bewustzijn zetelt in de cellen via heel kleine rotaties van de microtubuli"],"a":3,"u":"Volgens fysicus Penrose vestigt het bewustzijn zich binnen de cellen door heel kleine rotaties van de microtubuli, zoals in de Orch OR-theorie."},{"t":"5","q":"Wat houdt het 'Faust-Frankenstein syndroom' volgens de tekst in?","o":["Het gevaar je moraliteit en menselijkheid te verliezen door zonder oog voor ethiek een wetenschappelijke, alwetende utopie na te jagen","Het onvermogen van AI om menselijke organismen te overstijgen","De illusie dat wetenschappers hun kennis altijd volledig onder controle houden zodra ze de ethische regels van hun vakgebied naleven","De onbeperkte hoeveelheid impliciete kennis die een mens bezit"],"a":0,"u":"Het Faust-Frankenstein syndroom is het gevaar om je moraliteit en menselijkheid te verliezen door zonder ethiek een wetenschappelijke, alwetende utopie te willen bereiken."},{"t":"5","q":"Een informaticus stelt dat een computer nooit een dier of mens in zijn geheel zal evenaren. Welke positie uit de tekst sluit hier het best bij aan?","o":["Copeland: AI kan de evolutionair ontwikkelde organismen niet overstijgen","Pinker: de hoeveelheid impliciete kennis van een mens is oneindig","Draaisma: enkel top-down processen maken zelfsturing mogelijk","Calvin: het participerend bewustzijn bestrijdt het bewustzijn als ziekteverschijnsel"],"a":0,"u":"Volgens logicus Copeland is AI niet in staat om de evolutionair ontwikkelde organismen te overstijgen, wat aansluit bij de bewering dat een computer een organisme niet volledig evenaart."},{"t":"5","q":"Wat stelt taalpsycholoog Pinker over de kennis die een mens bezit?","o":["Dat menselijke kennis strikt beperkt is tot bewuste, expliciete regels","Dat kennis enkel via top-down processen tot stand komt","Dat kennis een onbedoeld evolutionair bijverschijnsel is","Dat de hoeveelheid impliciete kennis die een mens bezit oneindig is"],"a":3,"u":"Volgens taalpsycholoog Pinker is de hoeveelheid impliciete kennis die een mens bezit oneindig."},{"t":"5","q":"Welke positie ligt het dichtst bij Daniel Dennetts benadering van bewustzijn?","o":["Bewustzijn is een niet-fysieke substantie die los van het brein bestaat.","Bewustzijn is volledig afhankelijk van fysieke hersenprocessen en kan mechanistisch worden benaderd.","Bewustzijn kan alleen hermeneutisch begrepen worden en nooit wetenschappelijk onderzocht.","Bewustzijn is een onveranderlijke kosmische eigenschap.","Bewustzijn ontstaat uitsluitend uit consensus."],"a":1,"u":"Dennett behandelt bewustzijn als volledig afhankelijk van fysieke hersenprocessen, en dus als iets dat mechanistisch onderzocht kan worden."},{"t":"5","q":"Wat bedoelt Dennett met het bewustzijn als een soort virtuele machine?","o":["Dat bewustzijn letterlijk buiten het brein draait.","Dat een functioneel patroon op fysieke hardware kan draaien zonder dat één specifiek materiaal essentieel hoeft te zijn.","Dat hersenen geen materiële basis hebben.","Dat alleen digitale computers bewust kunnen zijn.","Dat bewustzijn een religieuze constructie is."],"a":1,"u":"Zoals software op verschillende hardware draait, is bewustzijn voor Dennett een functioneel patroon dat niet aan één specifiek materiaal vastzit."},{"t":"5","q":"Welke uitspraak past het best bij functionalisme in de discussie over kunstmatige intelligentie?","o":["Alleen biologische neuronen kunnen mentale functies realiseren.","Dezelfde mentale functie kan in principe door verschillende fysieke dragers gerealiseerd worden.","Mentale toestanden bestaan niet.","Alleen introspectie kan mentale functies vaststellen.","Een functie is hetzelfde als een anatomisch onderdeel."],"a":1,"u":"Functionalisme kijkt naar de functionele rol, niet naar het materiaal. Dezelfde mentale functie kan door verschillende dragers gerealiseerd worden."},{"t":"5","q":"Wat test de Turingtest in de klassieke betekenis vooral?","o":["Of een computer dezelfde neuronen heeft als een mens.","Of een machine in interactie gedrag kan vertonen dat niet van menselijk denkgedrag te onderscheiden is.","Of een computer bewustzijn biologisch kan produceren.","Of een computer kwantumprocessen gebruikt.","Of een computer emoties daadwerkelijk voelt."],"a":1,"u":"De Turingtest kijkt naar gedrag in interactie: kan een beoordelaar de machine niet van een mens onderscheiden."},{"t":"5","q":"Wat is het centrale punt van Searles Chinese-kamerargument?","o":["Correcte symboolmanipulatie is voldoende voor werkelijk begrip.","Een systeem kan regels voor symbolen correct toepassen zonder de betekenis ervan te begrijpen.","Menselijke taal is volledig aangeleerd.","Computers kunnen geen syntaxis verwerken.","Bewustzijn is identiek aan een Turingmachine."],"a":1,"u":"In de Chinese kamer manipuleert iemand tekens volgens regels zonder Chinees te begrijpen. Syntaxis levert dus geen semantiek op."},{"t":"5","q":"Welke uitspraak past het best bij Searles opvatting?","o":["Hij is een klassiek dualist die lichaam en geest volledig scheidt.","Hij ziet bewustzijn als een biologisch verschijnsel van hogere orde dat niet eenvoudig tot losse microprocessen gereduceerd kan worden.","Hij ontkent dat het lichaam een rol speelt in bewustzijn.","Hij beschouwt bewustzijn als een puur softwareprobleem.","Hij verdedigt dat symbolen alleen al begrip produceren."],"a":1,"u":"Searle ziet bewustzijn als een biologisch verschijnsel van hogere orde. Het wordt door het brein veroorzaakt, maar is niet zomaar tot losse microprocessen te herleiden."},{"t":"5","q":"Waarom is visuele agnosie relevant in de discussie over hersenen en bewustzijn?","o":["Ze toont dat zien één ondeelbare functie is.","Ze laat zien dat verschillende aspecten van visuele verwerking van elkaar kunnen dissociëren.","Ze bewijst dat perceptie niet door hersenen wordt beïnvloed.","Ze toont dat taal noodzakelijk is om licht waar te nemen.","Ze is een voorbeeld van sociaal constructionisme."],"a":1,"u":"Bij visuele agnosie blijft zien deels intact terwijl herkennen wegvalt. Dat toont dat visuele verwerking uit deelfuncties bestaat die los van elkaar kunnen uitvallen."},{"t":"5","q":"Welke uitspraak wordt in de cursus aan Steven Pinker gekoppeld?","o":["Het taalvermogen is volledig het resultaat van expliciete grammatica-instructie.","Het vermogen om taal te verwerven heeft een sterke aangeboren basis en taal is een gespecialiseerde menselijke vaardigheid.","Taal is irrelevant voor bewustzijn.","Alle talen zijn door één historische groep ontworpen.","Taal bestaat alleen uit imitatie van ouders."],"a":1,"u":"Pinker verdedigt dat het taalvermogen een sterke aangeboren basis heeft en een gespecialiseerde menselijke vaardigheid is."},{"t":"5","q":"Een kind zegt “ik heb geloopt”, hoewel volwassenen die vorm niet gebruiken. Waarom is dit voorbeeld relevant?","o":["Het toont dat kinderen alleen letterlijk imiteren.","Het ondersteunt het idee dat kinderen zelf grammaticale regels toepassen en over een aangeboren taalvermogen beschikken.","Het bewijst dat grammatica volledig cultureel willekeurig is.","Het toont dat taal zonder fouten wordt geleerd.","Het is bewijs voor het Chinese-kamerargument."],"a":1,"u":"Ik heb geloopt is een overgeneralisatie van een regel die het kind zo nooit gehoord heeft. Het kind past dus zelf regels toe in plaats van te imiteren."},{"t":"5","q":"Wat bedoelt Penrose in de cursuscontext met zijn kritiek op een volledig computationele verklaring van bewustzijn?","o":["Menselijk denken is volledig herleidbaar tot klassieke algoritmen.","Er kunnen fysische processen betrokken zijn bij bewustzijn die niet door gewone algoritmische berekening worden uitgeput.","Bewustzijn is alleen een sociaal taalspel.","Alle intelligentie is een illusie.","De Turingtest bewijst dat computers bewust zijn."],"a":1,"u":"Penrose meent dat menselijk inzicht niet volledig door algoritmen wordt uitgeput, en zoekt naar fysische processen die daarbuiten vallen."},{"t":"5","q":"Welke uitspraak sluit het best aan bij Penrose en Hameroff zoals in de reconstructies bevraagd?","o":["Bewustzijn is uitsluitend een gevolg van klassieke software.","Bewustzijn kan samenhangen met fundamentele fysische processen die niet pas met menselijke cognitie zijn ontstaan.","Bewustzijn is identiek aan observeerbaar gedrag.","Bewustzijn bestaat alleen door cultuur.","Bewustzijn is een consensusbegrip zonder biologische basis."],"a":1,"u":"Penrose en Hameroff koppelen bewustzijn aan fundamentele fysische processen, die dus niet pas met menselijke cognitie zouden zijn ontstaan."},{"t":"5","q":"Wat is volgens de cursus een belangrijk verschil tussen associatie, causaliteit en counterfactuals bij AI?","o":["Associatie zegt wat samen voorkomt, causaliteit gaat over wat iets teweegbrengt, counterfactuals vragen wat er zou gebeuren als de situatie anders was.","Associatie en causaliteit zijn identiek.","Counterfactuals zijn eenvoudiger dan correlaties.","AI werkt nu uitsluitend op counterfactual niveau.","Causaliteit vereist geen informatie over veranderingen."],"a":0,"u":"De drie niveaus zijn associatie, wat samen voorkomt, causaliteit, wat iets teweegbrengt, en counterfactuals, wat er zou gebeuren als de situatie anders was."},{"t":"5","q":"Wat wordt in de reconstructies als huidig niveau van veel AI-systemen aangeduid?","o":["Volledig counterfactual redeneren.","Voornamelijk associatief of correlationeel niveau.","Menselijk zelfbewustzijn.","Biologisch causaal begrip.","Participerend bewustzijn."],"a":1,"u":"Veel AI blijft op het associatieve of correlationele niveau en redeneert niet werkelijk causaal of contrafeitelijk."},{"t":"5","q":"Welke uitspraak over type- en tokenmaterialisme is het meest correct in deze cursuscontext?","o":["Type-materialisme vereist dat elke mentale toestand exact aan één soort fysische toestand gelijk is, token-materialisme laat meer variatie in concrete realisaties toe.","Token-materialisme ontkent elk fysiek substraat.","Type-materialisme is hetzelfde als dualisme.","Beide posities stellen dat bewustzijn niet fysiek kan zijn.","Token-materialisme is hetzelfde als sociaal constructionisme."],"a":0,"u":"Type-materialisme koppelt elke mentale toestand aan precies één soort fysische toestand. Token-materialisme laat toe dat dezelfde mentale toestand verschillend gerealiseerd wordt."},{"t":"5","q":"Welke uitspraak vormt de sterkste tegenstelling tussen Dennett en Searle?","o":["Dennett ziet mentale functies als volledig fysisch en sterk mechanistisch verklaarbaar, Searle benadrukt dat biologische hogere-orde-eigenschappen en betekenis niet zomaar tot formele symboolmanipulatie herleid kunnen worden.","Beiden verdedigen klassiek dualisme.","Searle ontkent het bestaan van hersenprocessen.","Dennett stelt dat alleen menselijke biologie bewustzijn kan dragen.","Beiden beschouwen de Turingtest als definitief bewijs van bewustzijn."],"a":0,"u":"Dennett verklaart mentale functies fysisch en mechanistisch. Searle houdt vol dat betekenis en biologische hogere-orde-eigenschappen niet tot formele symboolmanipulatie te herleiden zijn."}],"theory":[{"h":"Kenmerken van de moderne wetenschap","items":["Epistemologie: de studie van hoe kennis over de wereld tot stand komt.","Positivisme: stroming die enkel beschrijft en geen verklaringen biedt, en wetenschap een maatschappelijk belang toekent.","Sciëntisme: het geloof dat wetenschap op alle problemen een antwoord zal geven, waardoor ze bijna als religie wordt gezien.","Inductieprobleem (Hume): je kunt niet op basis van enkele observaties veralgemenen naar één algemene wet.","Deductief-nomologisch model: verklaringsmodel dat van algemeen naar specifiek redeneert vanuit wetten, waarbij het explanans tot het explanandum concludeert.","Falsificationisme (Popper): omdat wetenschap open en veranderlijk is, is het doel een hypothese te weerleggen in plaats van te bevestigen.","Nomotetisch versus ideografisch: uitspraken doen over groepen tegenover voortgaan op één individu.","Functionalistisch of teleologisch verklaren: een verklaring geven in functie van iets anders, met risico op circulaire redeneringen.","Instrumentalisme: wetenschappelijke begrippen zien als instrument om iets te beschrijven, tegenover realisme dat begrippen als de echte werkelijkheid ziet.","Ockham's razor: het zuinigheidsprincipe dat eenvoud beschouwt als het kenmerk van de wetenschap.","Primaire versus secundaire kwaliteit: het objectieve en rechtstreeks waarneembare tegenover het subjectieve dat per persoon verschilt.","Corroboratie: de mate van weerstand die een theorie biedt tegen weerleggingen; meerdere anomalieën zijn nodig om te verwerpen."]},{"h":"Het tragikomische bestaan","items":["Ware moraal: het versmelten met de kosmische eenheid in plaats van het ego centraal te stellen.","Hyperindividualisme: westerse tendens waarbij het ego centraal staat en het individu zichzelf belangrijk vindt.","Vergankelijkheid van het bestaan: het idee (bij Keynes) dat we onszelf belangrijk achten, maar op lange termijn allemaal sterven en slechts een lichtflits zijn.","Cognitieve rationaliteit: weten om te weten, kennis omwille van de kennis zelf.","Instrumentele rationaliteit: weten om toe te passen, kennis gericht op nut en gebruik.","Lebenswelt: de leefwereld van zingeving, met nabijheid, betrokkenheid, bestaansvragen en diep vertrouwen.","Wetenschap als kennisdomein: gericht op kennisvragen, empirische kwaliteiten, afstand en kritische ingesteldheid.","Explanatory gap: de geestelijke kloof tussen object en subject die volgens Proust blijft bestaan.","Embodiment: de verankering van ons bewustzijn aan deze wereld, die volgens Schopenhauer ons onvermijdelijke lot is.","Raison du coeur versus raison du raison: de strijd tussen wat het hart wil en de rede, waarin Pascal een voorloper van het existentialisme is.","Universeel gelijkheidsideaal: het geloof (bij Kant) in individualisme en emancipatie, waarbij iedereen rationeel kan denken.","Paradigma van de pijn: het idee (bij Sloterdijk) dat ons bestaan gestuurd wordt door pijn."]},{"h":"Hermeneutiek en verstehen","items":["Hermeneutiek: de interpretatie van (wetenschappelijke) teksten en literatuur, met veel aandacht voor historiciteit (de geschiedenis meenemen).","Verstehen (hermeneutisch begrijpen): een humanistische, betekenisgevende benadering die recht tegenover het verklaren staat en gebruikt wordt voor kwalitatief onderzoek.","Erklaren (verklaren): het natuurwetenschappelijke kenmerk dat tegenover Verstehen staat en gezien wordt als een aparte kwaliteit.","Thick description (Geertz): een dichte, gecontextualiseerde beschrijving die nodig is om iets volledig te begrijpen.","Vooroordelen en objectivisme (Gadamer): volledig bewustzijn en dus neutraliteit zijn onmogelijk, er spelen altijd vooroordelen mee, en realisme bereik je via dialoog en wisselende perspectieven.","Hermeneutische cirkel: het samenspel waarin je delen en geheel op elkaar betrekt om te begrijpen, met ontologische (Heidegger, Gadamer), methodologische (Schleiermacher) en holistische (Taylor) interpretaties.","Taal en betekenis (Wittgenstein): taal geeft betekenis aan data, en foute taal kan leiden tot foute interpretatie van die data.","Sociaal constructionisme: alle kennis is sociaal geconstrueerd en daardoor onderhandelbaar, waarbij realiteit ontstaat door actieve constructie in plaats van passieve representatie.","Sociaal constructivisme: de onderwijsvariant van het sociaal constructionisme.","Correspondentietheorie: beweringen zijn waar als ze de realiteit beschrijven, aangehangen door ontologische realisten die een werkelijkheid buiten de geest aannemen.","Coherentietheorie: waarheid als afwezigheid van interne tegenstrijdigheden, verbonden met idealisme (alles is geest) en relativisme.","Consensustheorie: de werkelijkheid ontstaat door overeenstemming tussen mensen (relativisme en sociaal constructivisme).","Discursieve psychologie: het analyseren van dagelijkse conversaties en teksten, waarbij bijvoorbeeld emoties niet louter neuronaal zijn maar begrepen worden door erover te praten.","Kritische psychologie: een niet-empirische psychologie die kritiek uit op de maatschappij, waarbij emancipatie (gelijke rechten, zelfstandigheid) centraal staat."]},{"h":"Ontstaan en betekenis van bewustzijn","items":["Doelgericht zonder reflectie: witte bloedcellen en termieten handelen doelgericht en complex, zonder zich vragen te stellen. Doelgerichtheid vraagt dus geen bewustzijn.","Bedrog en scenario-denken: volgens William Calvin veronderstelt bedrog bij chimpansees dat een dier alternatieve scenario's kan voorstellen. Dat wordt gezien als een prille aanzet tot bewustzijn.","Voorzichtig interpreteren: gedrag dat op empathie of moraal lijkt bij dieren, bewijst niet dat er dezelfde morele reflectie achter zit als bij mensen.","Historisch gegroeid zelfbesef: het moderne individuele zelfbewustzijn was er niet vanaf het begin, maar groeide onder invloed van cultuur en geschiedenis.","Van Homerus naar Socrates: bij Homerus worden helden door goden gestuurd, bij Socrates en Plato moet de mens zelf denken en verantwoordelijkheid dragen.","Middeleeuwen en renaissance: de opkomst van biografie, portret en zelfreflectie wijst op een sterker individueel zelfbesef.","Participerend bewustzijn: opgaan in muziek of een ritueel, waarbij de grens tussen jezelf en de omgeving tijdelijk vervaagt. Bij Nietzsche heet dat het Dionysische.","Nietzsche tegenover Hans Jonas: bewustzijn kritisch bekeken tegenover bewustzijn als hoogtepunt van menselijke mogelijkheden.","Cioran en de jaloezie tegenover de natuur: wat niet bewust is, draagt de last van reflectie niet.","Ambivalentie: bewustzijn maakt cultuur, moraal en reflectie mogelijk, maar brengt ook onrust, afstand en lijden mee. Sterker individueel besef vraagt om morele en juridische systemen die de spanning tussen individu en gemeenschap regelen."]},{"h":"Opvattingen over hersenen en bewustzijn","items":["Modern dualisme: positie van Searle waarbij bewustzijn een mysterie blijft en innerlijke toestanden een privéaangelegenheid zijn.","Bewustzijn als bijverschijnsel: idee van Dennett en Calvin dat menselijk bewustzijn een onbedoeld evolutionair bijverschijnsel is.","Turing-machine: universele machine die volgens sommigen net zoals een mens werkt, in het licht van computers en AI.","Visuele agnosie / blind zicht: men is zich niet bewust iets te zien, maar antwoordt bij navraag toch vaak correct, wat wijst op de gelaagdheid van de hersenen.","Obscurantisme: kritiek van Dennett op Searle, namelijk het doelbewust in onwetendheid houden van mensen en zelfstandig denken verhinderen.","Orch OR-theorie (Penrose): opvatting dat het bewustzijn in de cellen zetelt via kleine rotaties van de microtubuli.","Faust-Frankenstein syndroom: gevaar om je moraliteit en menselijkheid te verliezen door zonder ethiek een wetenschappelijke, alwetende utopie na te streven.","Participerend bewustzijn: volgens Calvin een bestrijding van het ziekteverschijnsel dat men het bewustzijn noemt.","Impliciete kennis (Pinker): de hoeveelheid onbewuste kennis die een mens bezit is oneindig.","Top-down zelfsturing (Draaisma): enkel top-down processen maken zelfsturing bij de mens mogelijk.","Grens van AI (Copeland): AI is niet in staat de evolutionair ontwikkelde organismen te overstijgen."]}],"hacks":[{"h":"NID: nomotetisch is de groep","t":"Onthoud NID: Nomotetisch = de groep (algemene wetten), en dus is Ideografisch het aparte inDividu. Zo verwar je de twee benaderingen nooit meer: de N van nomotetisch lijkt op de N van 'nen hoop mensen', terwijl de I van ideografisch bij het Individu hoort."},{"h":"KIS: de drie K's van het bewustzijn","t":"Onthoud de kern met KIS: Kosmische eenheid (de ware moraal), Individualisme dat te ver gaat (hyperindividualisme met het ego centraal) en het feit dat we Sterfelijk zijn en maar een lichtflits (vergankelijkheid, Keynes). Zo heb je in een woord de rode draad van het tragikomische bestaan te pakken."},{"h":"Verstehen VERSUS erklaren: de V van Verhaal","t":"Onthoud dat Verstehen begint met dezelfde V als Verhaal, betekenis en context: het is de humanistische, interpretatieve kant (thick description, taal, kwalitatief). Erklaren begint met E van Exact meten: de natuurwetenschappelijke kant. Ze staan recht tegenover elkaar, dus koppel V aan begrijpen en E aan verklaren."},{"h":"SPORT-CODE: wie zegt wat over bewustzijn","t":"Onthoud de posities met SPORT-CODE. Searle = mysterie plus modern dualisme (Privé innerlijke toestanden). Penrose = microtubuli (Orch OR, Rotaties in cellen). Dennett en calvin = evolutionair bijverschijnsel (Toeval). Copeland = AI kan Organismen niet Overstijgen. Draaisma = top-Down zelfsturing. Elke naam koppel je zo aan één kernwoord."}]};
</script>

  document.addEventListener("keydown",function(e){ if(state.key) state.key(e); });
  // bezoeker tellen (1x per toestel)
  try{ if(!localStorage.getItem("thg_seen")){ localStorage.setItem("thg_seen","1"); bump("berat-thg","gebruikers"); } }catch(e){ bump("berat-thg","gebruikers"); }
  // traject vanuit de hub overnemen → direct naar de oefenpagina
  try{ var _q=new URLSearchParams(location.search); var _m=_q.get("m");
    if(_m==="training"||_m==="herkansing"){ state.track=_m; lset("thg_track",_m);
      var _c=_q.get("calm"); if(_c!=null){ calm=(_c!=="0"); lset("thg_calm",calm); applyCalm(); }
      state.step="practice"; state.fromHub=true; }
  }catch(e){}
  render();
  // launch-splash netjes laten verdwijnen
  (function(){ var _sp=document.getElementById("splash"); if(!_sp) return; var _red=false; try{_red=window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){} setTimeout(function(){ _sp.classList.add("hide"); setTimeout(function(){ if(_sp&&_sp.parentNode) _sp.parentNode.removeChild(_sp); }, 700); }, _red?300:1850); })();
})();
</script>
<script>
/* gedeelde interactie: klik-animatie en zacht openschuivende theorieblokken */
(function(){
  // Elk theorieblok krijgt precies een wikkel-element, anders klapt een blok met
  // meerdere kinderen niet volledig dicht (MBG had er tien).
  function wikkel(){
    var lijst=document.querySelectorAll(".acc>.body");
    for(var i=0;i<lijst.length;i++){
      var b=lijst[i];
      if(b.children.length===1 && b.firstElementChild && b.firstElementChild.className==="bes-wrap") continue;
      var w=document.createElement("div"); w.className="bes-wrap";
      while(b.firstChild) w.appendChild(b.firstChild);
      b.appendChild(w);
    }
  }
  var gepland=false;
  function planWikkel(){ if(gepland)return; gepland=true; setTimeout(function(){ gepland=false; wikkel(); },0); }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",wikkel); else wikkel();
  try{ new MutationObserver(planWikkel).observe(document.documentElement,{childList:true,subtree:true}); }catch(e){}
  var KLIK="button,.btn,.iconbtn,.opt,.track,.chrow,.backlink,.chip,.mode,.toggle,.scard,.ccard,.qcard,.srclink,.bnlink,.navlink,.ycard,.excat,.brandstrip,summary";
  document.addEventListener("pointerdown",function(e){
    var el=(e.target&&e.target.closest)?e.target.closest(KLIK):null; if(!el)return;
    el.classList.remove("bes-klik"); void el.offsetWidth; el.classList.add("bes-klik");
    setTimeout(function(){ el.classList.remove("bes-klik"); },260);
  },true);
  document.addEventListener("click",function(e){
    var s=(e.target&&e.target.closest)?e.target.closest("details.acc>summary"):null; if(!s)return;
    var d=s.parentNode; if(!d) return;
    e.preventDefault();
    if(d.open){
      d.classList.add("bes-dicht");
      setTimeout(function(){ d.open=false; d.classList.remove("bes-dicht"); },250);
    } else {
      d.open=true; d.classList.add("bes-open");
      var los=function(){ d.classList.remove("bes-open"); };
      requestAnimationFrame(function(){ requestAnimationFrame(los); });
      setTimeout(los,400);
    }
  },false);
})();
</script>
