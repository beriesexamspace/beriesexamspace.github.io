<script>
window.ORTHO = {"questions":[{"t":"1","q":"De prefix ortho in de term orthopedagogiek kan op verschillende manieren begrepen worden. Voor de orthopedagogiek kan slechts een betekenis van toepassing zijn. Welke?","o":["als rechtzetten wat krom gegroeid is, als een vorm van rechtzetten","afkomstig van 'orthopedie mentale' zoals gebruikt door Binet","als een vorm van terug binnen de norm leiden van wat ervan afwijkt","als aangepast aan, naar de maat van"],"a":3,"u":""},{"t":"1","q":"De orthopedagogiek kent een drievoudige oorsprong. Welke?","o":["het onderwijs aan kinderen met een handicap, de zorg voor verwaarloosde kinderen en de ambulante hulpverlening aan kinderen met gedragsproblemen","het onderwijs aan kinderen met een handicap, de zorg voor verwaarloosde kinderen en de residentiele hulpverlening aan kinderen met gedragsproblemen","het onderwijs aan chronisch zieke kinderen, de zorg voor verwaarloosde kinderen en de ambulante hulpverlening aan kinderen met gedragsproblemen","het onderwijs aan kinderen met een handicap, de zorg voor zwakzinnige kinderen en de ambulante hulpverlening aan kinderen met gedragsproblemen"],"a":0,"u":""},{"t":"1","q":"Hoe definieerde Hanselmann, ook wel eens de grondlegger van de orthopedagogiek genoemd, het object ervan?","o":["als kinderen met ontwikkelingsbelemmeringen","als de problematische opvoedingssituatie","als de opvoeding van het kind met tekorten","als kinderen met opvoedingsbelemmeringen"],"a":3,"u":""},{"t":"1","q":"In de ontwikkeling van de orthopedagogiek als wetenschap kunnen een drietal fasen worden onderscheiden. Welke opsomming is juist?","o":["Een eerste fase is het onderwijs aan het afwijkende kind, een tweede fase de opvang van het verwaarloosde kind en een derde fase de ambulante zorg aan gezinnen in opvoedingsnood.","Een eerste fase is de opvoeding van het afwijkende kind, een tweede de hulpverlening aan het kind in opvoedingsnood en een derde fase de hulpverlening bij een problematische opvoedingssituatie.","Een eerste fase is de opvoeding van het afwijkende kind, een tweede fase de hulpverlening aan het gehandicapte kind en een derde fase de hulpverlening aan het gezin in opvoedingsnood.","Een eerste fase is de opvoeding van het kind met een handicap, een tweede fase de hulpverlening aan het kind in opvoedingsnood, een derde fase de hulpverlening aan ouders met een verstandelijke beperking."],"a":1,"u":""},{"t":"2","q":"Opvoedingsdoelen kunnen gebruikt worden om opvoedingsproblemen te omschrijven. Snelle probeert opvoedingsdoelen uit te leggen in termen van minimale rationaliteit en minimale moraliteit. Hij maakt een onderscheid tussen interne opvoedingsimpassen en externe opvoedingsimpassen. Welke uitspraak is correct?","o":["in het geval van een interne opvoedingsimpasse meent een opvoeder dat de ontwikkeling van de opvoedeling niet verloopt in de gewenste richting (van minimale rationaliteit en minimale moraliteit)","in het geval van een externe opvoedingsimpasse meent een opvoeder dat de ontwikkeling (in termen van minimale rationaliteit en minimale moraliteit) van de opvoedeling negatief beinvloed wordt door negatieve externe factoren","in het geval van een interne opvoedingsimpasse meent een buitenstander dat de ontwikkeling van de opvoedeling niet verloopt in de gewenste richting (mr en mm) als gevolg van interne factoren bij de opvoedeling of de opvoeder","in het geval van een externe opvoedingsimpasse betreft het kinderen die traditioneel tot het onderzoeksdomein van de orthopedagogiek worden gerekend zoals kinderen met verstandelijke beperking, met autisme etc."],"a":0,"u":""},{"t":"7","q":"Welke uitspraak is fout?","o":["Het doel van classificatie is het ordenen van informatie, communicatie en predictie.","De verhouding tussen diagnostiek en behandeling of begeleiding is duidelijk. Daar waar de diagnostiek stopt, begint de begeleiding.","Een classificatie is de beschrijving van de problematiek en geen etiologische uitspraak.","Het hedendaagse classificeren van kinderen doet een beroep op een mengeling van verschillende modellen waarbij twee modellen op het voorplan staan: het medische en het sociale model."],"a":1,"u":""},{"t":"7","q":"Welke uitspraak is correct?","o":["Het ASEBA systeem van Achenbach is een orthopedagogisch classificatiesysteem.","Het ASEBA systeem van Achenbach is een non-categoriaal classificatiesysteem.","Het ASEBA systeem van Achenbach is een systeem dat afwijkingen op een zeer nauwkeurige kwalitatieve wijze uitdrukt.","Het ASEBA systeem van Achenbach is een systeem dat steeds onverzoenbaar zal zijn met psychiatrische classificatiesystemen."],"a":1,"u":""},{"t":"7","q":"Welke stelling over orthopedagogische diagnostiek is correct?","o":["Orthopedagogische diagnostiek is in de eerste plaats een classificerende activiteit. Zodra de stoornis van het kind volgens een classificatiesysteem is benoemd, is het diagnostisch proces afgerond en komt de opvoedingssituatie pas in beeld bij de behandeling.","Orthopedagogische diagnostiek moet een bijdrage leveren aan de beschrijving en de analyse van de POS. Deze informatie kan aanleiding geven tot een handelingsplan enz. Dit laatste is echter niet noodzakelijk. De diagnosticus kan volstaan met beschrijven en verklaren.","Orthopedagogische diagnostiek gebeurt in een spanningsveld. De diagnosticus moet heel wat keuzes maken. Duidelijk is wel dat hij steeds zal kiezen voor de deductieve werkwijze.","Orthopedagogische diagnostiek waarbij een beroep wordt gedaan op de deductieve werkwijze impliceert een binnenperspectief. De orthopedagoog voert een dialoog met de hulpvrager."],"a":1,"u":""},{"t":"8","q":"Welke uitspraak is juist?","o":["Inclusie heeft geen internationale rechtsbasis.","Inclusie heeft te maken met een geloof in een tolerante en accepterende samenleving.","Inclusie beperkt zich tot het onderwijs en speelt geen rol bij wonen, werken of vrije tijd.","Inclusie kan gesitueerd worden in het ontwikkelingsparadigma."],"a":1,"u":""},{"t":"3","q":"In de mensenrechtenbenadering is een verstandelijke beperking...","o":["een anomalie of afwijking","een ontwikkeling die kan worden voorkomen dmv stimuleringsprogramma's","het resultaat van een niet op gelijkwaardige manier te kunnen participeren aan de maatschappij","het resultaat van een niet kunnen beantwoorden van een persoon aan de verwachting van de omgeving"],"a":2,"u":""},{"t":"3","q":"Welke uitspraak is fout? Een verstandelijke handicap...","o":["Een verstandelijke handicap is steeds genetisch bepaald.","Een verstandelijke handicap gaat gepaard met een beneden gemiddeld cognitief functioneren.","Een verstandelijke handicap gaat gepaard met beperkingen op het vlak van de sociale redzaamheid.","Een verstandelijke handicap moet zich manifesteren voor de leeftijd van 18 jaar."],"a":0,"u":""},{"t":"3","q":"We onderscheiden 4 subgroepen binnen de auditieve handicaps. Welke groep bestaat niet?","o":["doven","slechthorenden","perilinguale gehoorstoornis","postlinguale gehoorstoornis"],"a":2,"u":""},{"t":"8","q":"Welke stelling is correct?","o":["De toelating tot het BO wordt bepaald door de directie van de school, die op basis van een intakegesprek zelf beslist over de inschrijving.","De toelating tot het BO kan slechts mits het voorleggen van een inschrijvingsverslag dat bestaat uit een attest en verantwoordingsprotocol.","De toelating tot het BO kan slechts na doorverwijzing door een huisarts, pediater of psycholoog/orthopedagoog.","De toelating tot het BO kan slechts na doorverwijzing door een algemene CLB-medewerker zonder verslag."],"a":1,"u":""},{"t":"3","q":"Welke uitspraak is juist?","o":["De diagnose van een verstandelijke handicap berust uitsluitend op een intelligentiemeting.","De diagnose van een verstandelijke handicap is een omvattende term voor een stoornis in het ontwikkelingsproces en andere op volwassen leeftijd verworven intellectuele beperkingen zoals een hersenletsel.","De diagnose van een verstandelijke handicap houdt een IQ tussen de grenzen 70/75-85 in.","De diagnose van een verstandelijke handicap houdt een beperking in inzake persoonlijke onafhankelijkheid, sociale verantwoordelijkheid en redzaamheid."],"a":3,"u":""},{"t":"7","q":"Welke groep termen hoort niet thuis in het rijtje van het ICF-model?","o":["Anatomische eigenschappen, functies en stoornissen","Contextuele factoren: externe omgeving en persoonlijke factoren","Gunstige ontwikkeling en problematische opvoedingssituatie","Participatie en participatieproblemen"],"a":2,"u":""},{"t":"3","q":"Welke uitspraak is fout?","o":["In de cognitieve informatieverwerkingsbenadering probeert men kinderen met een verstandelijke beperking metacognitieve vaardigheden bij te brengen.","Ondersteuning is er in de eerste plaats op gericht dat personen met een verstandelijke beperking zelf keuzes kunnen maken en de regie over hun dagelijkse leven behouden.","Factoren die de kwaliteit van leven van personen met een verstandelijke beperking bepalen, verschillen fundamenteel van deze factoren van personen zonder verstandelijke beperking.","Recente modellen van gezinsgericht werken geven een specifieke invulling aan de wijze waarop ouders het best ondersteund worden."],"a":2,"u":""},{"t":"1","q":"Wie was historisch gezien het eerst?","o":["Valentin Haüy","Charles-Michel de l'Épée","M.T. De Brabandere","Jean-Marc Gaspard Itard"],"a":1,"u":""},{"t":"8","q":"Opleidingsvorm 2 van het buitengewoon onderwijs (BO)...","o":["wordt georganiseerd voor het BO type 1","Heeft tot doel leerlingen een sociale vorming te geven ten einde hun integratie mogelijk te maken in een beschermd leefmilieu","Wordt georganiseerd voor het BO type 4","Heeft tot doel leerlingen een algemene en sociale vorming en beroepsvorming te geven ten einde hun integratie mogelijk te maken in een gewoon arbeids- en leefmilieu"],"a":1,"u":""},{"t":"8","q":"Het Geïntegreerd Onderwijs (GON) is sedert 1994 mogelijk ...","o":["enkel voor leerlingen met een attest 4, 6 of 7","voor alle typen van het BO met uitzondering van type 5","voor type 8 in het kader van reintegratie (deze na minstens 6 maanden in het BO)","voor leerlingen met een matige en ernstige verstandelijke beperking slechts op het niveau van het kleuter- en lager onderwijs"],"a":1,"u":""},{"t":"8","q":"Opleidingsvorm 3 van het BO bestaat uit 3 fasen. Welke fase bestaat niet?","o":["Observatiefase","Diagnostische fase","Orienteeringsfase","Kwalificatiefase"],"a":1,"u":""},{"t":"8","q":"Welke uitspraak is fout?","o":["Een cruciaal element in het afstemmen van het onderwijsaanbod op de specifieke noden van de leerling betreft de verdeling ervan in pedagogische eenheden.","Een groepswerkplan wordt opgesteld voor een groep leerlingen en vormt de leidraad voor het dagelijkse functioneren","De leerlingen uit een pedagogische eenheid kunnen tot verschillende leerjaren behoren.","Leerlingen van een pedagogische eenheid behoren steeds tot hetzelfde type van het BO"],"a":3,"u":""},{"t":"8","q":"Er bestaat heel veel kritiek op het BO. Welke uitspraak is fout?","o":["Steeds meer wordt de rol van het onderwijs benadrukt in het ontstaan van leerproblemen. Het BO vervult er een alibifunctie.","Het BO creeert etiketten, self-fulfilling prophecy's en stigmatiseert.","De verschillende soorten beperkingen vertonen veel meetbare verschillen op het gebied van leer- en gedragskenmerken. Het onderwijsaanbod moet dan ook bestaan uit een voldoende groot aantal verschillende onderwijstypes.","Kinderen uit gezinnen met een migratieachtergrond en uit kansarme gezinnen worden opvallend vaker naar het BO verwezen, wat aantoont dat ook sociale achtergrond en taal meespelen bij een verwijzing."],"a":2,"u":""},{"t":"5","q":"De meeste definities van leerstoornissen zijn een combinatie van een aantal criteria. Welke?","o":["Het specificiteitcriterium, het discrepantiecriterium en het exclusiviteitscriterium","Het specificiteitcriterium, het normaliteitscriterium en het exclusiviteitscriterium","Het discrepantiecriterium, het exclusiviteitcriterium en het normaliteitscriterium","Het specificiteitcriterium, het discrepantiecriterium en het co-morbiditeitscriterium"],"a":0,"u":""},{"t":"5","q":"Prevalentiecijfers van leerstoornissen verschillen sterk van onderzoek tot onderzoek. Van welk element zijn zij NIET afhankelijk?","o":["de onderzochte populatie","de gebruikte definitie","de tijdsperiode waarin het onderzoek werd uitgevoerd","de prevalentie van depressie bij kinderen"],"a":3,"u":""},{"t":"5","q":"Welke stelling over de behandeling van leerstoornissen is correct?","o":["De behandeling van leerstoornissen hoort in de eerste plaats bij de medische sector, omdat de oorzaak neurologisch is","De behandeling van leerstoornissen gebeurt liefst vanuit het basisfunctiemodel","De behandeling van leerstoornissen gebeurt adhv lateralisatie-oefeningen","De behandeling van leerstoornissen moet in de eerste plaats vanuit een pedagogisch perspectief vorm krijgen"],"a":3,"u":""},{"t":"6","q":"Welke uitspraak over de secundaire preventie van kindermishandeling is juist?","o":["Deze vorm van preventie gaat ervan uit dat alle gezinnen een even groot risico op kindermishandeling dragen","Het taxeren van de risico's op en het voorspellen of zich al dan niet kindermishandeling zal voordoen is moeilijk","De POS-schaal is het enige instrument dat geen aanzienlijke foutenmarge heeft","De secundaire preventie resulteert in een uithuisplaatsing"],"a":1,"u":""},{"t":"8","q":"De nota van minister F. Vandenbroucke onderscheidt vier zorgniveaus. Welke uitspraak is correct?","o":["Op zorgniveau 1 en 2 geldt het gewone curriculum en de normale eindcertificering","Zorgniveau 1 en 2 worden aangeboden door gewone scholen, zorgniveau 3 en 4 door de scholen voor BO.","Voor cluster 2 worden alle zorgniveaus georganiseerd","Iets vergelijkbaars met het huidige GON-onderwijs zal worden georganiseerd voor zorgniveau 2 en 3"],"a":0,"u":""},{"t":"1","q":"Welke uitspraak is fout? Volgens Kok is...","o":["Bij specifiek opvoeden plant de opvoeder zijn handelen bewust, voert hij het uit en evalueert hij het achteraf, telkens vanuit de hele opvoedingssituatie","Specifiek opvoeden is nodig wanneer opvoeden niet meer spontaan en vanzelfsprekend verloopt","Bij het specifiek opvoeden staat het tweedegraadstrategisch handelen centraal. Het is leidend voor het eerstegraads- en derdegraadstrategisch handelen","In de opvoedrelatie vormt het kind zich aan een voor-geleefde omgeving"],"a":2,"u":""},{"t":"2","q":"Wat verstaat Wim Ter Horst precies onder 'problematische opvoedingssituatie' (POS)?","o":["Het is een opvoedingssituatie waarin de opvoeders de zogenaamde grondvormen (aanraken, spelen, feesten, ...) moeten toepassen","Het is een opvoedingssituatie waarin de openheid van de opvoeder wordt beperkt door een tekort aan vitaliteit","Het is een opvoedingssituatie waarin het menselijke plannen in het gedrag komt.","Het is een opvoedingssituatie die door de betrokkenen als uitzichtloos, zinloos, bedreigend wordt ervaren. Er is geen perspectief meer."],"a":3,"u":""},{"t":"6","q":"De langetermijngevolgen van mishandeling zijn ernstig. Welke uitspraak is correct?","o":["Uit longitudinaal onderzoek blijkt dat de intergenerationele overdracht van mishandeling vooral erfelijk bepaald is, waardoor latere ondersteuning van de ouders er weinig aan verandert","Het hebben van een gehechtheidsband met een of meerdere volwassenen tijdens de kindertijd kan de langetermijngevolgen verzachten en de intergenerationele overdracht tegengaan","Hierbij geldt de dosishypothese. De ernst van de mishandeling bepaalt uitsluitend de fysieke symptomen","Mishandelde ouders laten het eigen perspectief meer los ten voordele van het kind."],"a":1,"u":""},{"t":"3","q":"Rioux schrijft dat we inzake verstandelijke handicap verschillende benaderingen kunnen onderscheiden. Welke?","o":["defectbenadering, de ontwikkelingsbenadering en de burgerschapsbenadering","de biomedische benadering, de functionele benadering, de omgevingsbenadering en de mensenrechtenbenadering","de defectbenadering, de gedragsbenadering, de functionele benadering en de burgerschapsbenadering","de medisch-biologische benadering, de ontwikkelingsbenadering, de functionele benadering en de mensenrechtenbenadering"],"a":1,"u":""},{"t":"7","q":"De cognitieve as in het orthopedagogische classificatiesysteem van Kok heeft twee polen. Welke?","o":["De s-pool waar zich het kind bevindt dat veel structuur nodig heeft en de v-pool waar zich het kind bevindt met een overdreven behoefte aan variatie.","De s-pool waar de vraag naar structuur moet worden gesitueerd en de v-pool waar we de vraag naar langzamerhand variëren moeten lokaliseren.","De s-pool waar zich het kind bevindt met een gebrek aan structuur en de v-pool waar zich het kind bevindt met een tekort aan variatie","De s-pool waar zich het kind met ADHD bevindt en de v-pool waar zich het autistische kind bevindt"],"a":1,"u":""},{"t":"8","q":"Wil inclusief onderwijs slagen, moet aan een aantal voorwaarden worden voldaan. Welke uitspraak is fout?","o":["De regelgeving moet worden aangepast. Een voorbeeld hiervan is het doorbreken van het leerstofjaarklassensysteem en het afschaffen van de eindtermen","Leerkrachten moeten vooral proberen tegemoet te komen aan de behoeften van iedere leerling. Een democratische houding en een geloof in gelijkwaardigheid zijn slechts van secundair belang","De directeur van de school moet zelf in inclusie geloven, een duidelijke visie uitdragen en zijn leerkrachten concreet ondersteunen met overleg, vorming en tijd om samen les voor te bereiden","De leerling speelt een actieve rol bij de bepaling van wat zal worden geleerd. Deze stelt een persoonlijk leer- of studieplan op"],"a":1,"u":""},{"t":"8","q":"In het leerzorgkader van Frank Vandenbroucke worden clusters van specifieke onderwijs- en opvoedingsbehoeften onderscheiden. Welke cluster is fout gedefinieerd?","o":["cluster 1: deze leerlingen hebben geen beperkingen","cluster 2: deze leerlingen hebben leerbeperkingen zoals leerstoornissen of een ontwikkelingsachterstand","cluster 3: deze kinderen hebben functiebeperkingen","cluster 4: deze leerlingen hebben uitsluitend een autismespectrumstoornis of ADHD"],"a":3,"u":""},{"t":"3","q":"Kruis de juiste uitspraak aan omtrent gehoorstoornissen:","o":["Een geleidingsstoornis is een stoornis in de overbrenging van het geluid thv het binnenoor, het middenoor of de uitwendige gehoorgang","Een perceptiestoornis is een gehoorsverlies als gevolg van een stoornis van het binnenoor, gehoorszenuwen, gehoorbanen en hersenschors","een geleidingsstoornis gaat gepaard met een abnormaal snelle toename van waargenomen luidheid bij versterking van het geluid","Een perceptiestoornis resulteert in een maximaal gehoorsverlies van 60 dB"],"a":1,"u":""},{"t":"8","q":"Een orthopedagogische interventie wil resulteren in een verbetering van het handelen. Dit is mogelijk op drie niveaus. Kruis het foute niveau aan.","o":["technische of instrumentele verbeteringen","verbeteringen in het interpretatiekader","verbetering van de levensomstandigheden","verbeteren van het absolute welbevinden"],"a":3,"u":""},{"t":"8","q":"Hanteren van situaties door de opvoeder...","o":["is een gerichte actie van de opvoeder om een dagelijkse of incidentele gebeurtenis groeibevorderend te laten zijn","houdt in het nadenken over de totale materiele en immateriele omgeving van het kind","moet steeds ook als zich geen problemen of incidenten voordoen plaatsvinden","komt pas aan bod nadat het handelingsplan is opgesteld en beperkt zich tot het bijsturen van probleemgedrag op het moment zelf"],"a":0,"u":""},{"t":"7","q":"Aan de dialoog worden een aantal postulaten verondersteld. Kruis het foute alternatief aan:","o":["Intentionaliteit","Rationaliteit","Authenticiteit","Behoeftebeginsel"],"a":3,"u":""},{"t":"8","q":"Klimaatcreatie impliceert dat er nagedacht wordt over...?","o":["de totale materiele en immateriele omgeving van het kind","gerichte acties van een opvoeder om een incidentele gebeurtenis groeibevorderend te laten zijn","welke de onderhandelbare en niet-onderhandelbare situaties zijn","hoe aan de opvoedrelatie wordt vormgegeven en hoe deze relatie wordt onderhouden"],"a":0,"u":""},{"t":"5","q":"Er kan een onderscheid gemaakt worden tussen primaire leerstoornissen en secundaire leerproblemen. Kruis het foute alternatief aan:","o":["Primaire leerstoornissen zijn het gevolg van specifieke problemen bij het leren van schoolse vaardigheden zonder dat andere gebieden vertraagd hoeven te zijn","Primaire leerstoornissen zijn algemene taalontwikkelingsproblemen waardoor alle schoolse vaardigheden automatisch moeilijker verlopen","Secundaire leerproblemen zijn het gevolg van omstandigheden buiten het leren van die vaardigheden zelf","Secundaire leerproblemen zijn te situeren in de omgeving (gezin, school) en het kind zelf (gedragsproblemen)"],"a":1,"u":""},{"t":"1","q":"Jan Waterink introduceerde de volgende benamingen in ons vakgebied:","o":["Hij introduceerde de term speciale pedagogiek omdat opvoeding van speciale kinderen betreft.","Hij introduceerde de term klinische pedagogiek en wilde orthopedagogiek voor lichtere handicaps reserveren.","Hij introduceerde de term therapeutische pedagogiek omdat hij wilde beklemtonen dat kinderen recht hebben op effectieve therapieën","Hij introduceerde de term genezende pedagogiek"],"a":1,"u":""},{"t":"8","q":"Over ziekenhuisopnames van kinderen:","o":["De meeste kindergeneeskundige ziekenhuisopnames zijn gepland","Als gevolg van een grotere overlevingskans neemt de gemiddelde duur toe","Het aantal ziekenhuisopnames bleef stabiel de laatste 20 jaar","Dagopnames vervangen steeds meer een echte ziekenhuisopname met overnachting"],"a":3,"u":""},{"t":"6","q":"Over het probleem van definities van kindermishandeling. Welke uitspraak is fout?","o":["Het is zeer moeilijk om een duidelijke definitie te geven van wat kindermishandeling nu juist is","Opvattingen over het slaan van kinderen wijzigen in de loop van de tijd","Wanneer kinderen seksueel misbruik rapporteerden werden ze historisch gezien altijd direct geloofd door rechters","In sommige culturen wordt het slaan van kinderen getolereerd terwijl het in andere landen bij wet is verboden"],"a":2,"u":""},{"t":"8","q":"Over psychosomatosen en somatoforme klachten:","o":["In geval van psychosomatosen is er een aantoonbare lichamelijke ziekte","Somatoforme stoornissen en psychosomatische problemen kunnen duidelijk van elkaar worden onderscheiden","In geval van somatoforme aandoeningen is een patho-fysiologisch substraat aanwezig","Functionele klachten en somatoforme stoornissen zijn hetzelfde"],"a":0,"u":""},{"t":"1","q":"Broekaert schrijft dat studenten in de orthopedagogiek moeten leren 'met Bocuse naar de markt te gaan'. Wat bedoelt hij hiermee?","o":["Net als koks, gaan orthopedagogen op een zeer intuïtieve manier te werk.","De vraag van de cliënt bepaalt wat de orthopedagoog zal aanbieden, net zoals de markt bepaalt wat de kok klaar zal maken.","Koks trekken zich weinig aan van waarom een gerecht lekker smaakt. Als het maar lekker smaakt! Zo ook orthopedagogen.","Bocuse is de uitvinder van de 'nouvelle cuisine', een keuken gekenmerkt door eenvoud. Orthopedagogen streven bij het integreren van verschillende methoden ook eenvoud na."],"a":1,"u":""},{"t":"1","q":"Louis Van Gelder (1962) heeft het over de drievoudige oorsprong van de orthopedagogiek. Wat bedoelt hij daarmee?","o":["Hij bedoelt dat de orthopedagogiek haar oorsprong vindt in onderwijs aan doven, blinden en zwakzinnigen.","Hij bedoelt dat de orthopedagogiek haar ontstaan heeft te danken aan drie specifieke grondleggers.","Hij bedoelt dat de orthopedagogiek is voortgekomen uit drie wetenschappen die elk een deel van het vakgebied opeisten, namelijk de geneeskunde, de psychologie en de rechtswetenschap, en dat die drie nog steeds om voorrang strijden.","Hij bedoelt dat de orthopedagogiek haar oorsprong vindt in het onderwijs aan kinderen met een handicap, in de zorg voor verlaten en verwaarloosde kinderen en in de hulpverlening met de bedoeling crimineel gedrag te voorkomen."],"a":3,"u":""},{"t":"1","q":"Prof. A. Van Gennep (2000) onderscheidt drie paradigma's. Waarom kunnen we Paul Moor een voorloper van het burgerschapsparadigma noemen?","o":["Omdat hij de aandacht niet toespitst op dat waarin het kind teleurstelt maar op dat wat we voor het kind kunnen doen.","Omdat hij niet zozeer een stoornis centraal stelt, maar veeleer een bedreiging van de opvoeding.","Omdat hij aangeeft dat een opvoedingsbelemmering hieruit bestaat dat de in een gemeenschap gangbare opvoedingsvormen niet toegankelijk zijn.","Omdat hij al beklemtoonde dat de mens pas mens wordt door opvoeding."],"a":0,"u":""},{"t":"2","q":"Wat verstaat Wim Ter Horst precies onder problematische opvoedingssituatie (POS)?","o":["Het is een opvoedingssituatie waarin de opvoeders de zogenaamde grondvormen moeten toepassen.","Het is een opvoedingssituatie waarin de openheid van de opvoeders wordt beperkt door een tekort aan vitaliteit.","Het is een opvoedingssituatie waarin bij het kind een stoornis is vastgesteld door een specialist, waardoor de opvoeding zwaarder verloopt.","Het is een opvoedingssituatie die door de betrokkenen als uitzichtloos, zinloos, bedreigend wordt ervaren. Er is geen perspectief meer."],"a":3,"u":""},{"t":"1","q":"De uitgangspunten en theoretische inzichten overziend, kunnen we concluderen dat:","o":["Wim Ter Horst een hermeneutisch-fenomenologische orthopedagoog moet worden genoemd en Jacobus Kok een empirisch-analytische.","Wim Ter Horst een hermeneutisch-fenomenologische orthopedagoog moet worden genoemd en Jacobus Kok een kritische.","Wim Ter Horst een kritische orthopedagoog moet worden genoemd en Jacobus Kok een empirisch-analytische.","Wim Ter Horst en Jacobus Kok beiden hermeneutisch-fenomenologische orthopedagogen moeten worden genoemd."],"a":0,"u":""},{"t":"7","q":"Het medisch model heeft de volgende drie fundamentele kenmerken:","o":["Het betreft een algoritmische vertaling van de werkelijkheid; het is een stoornissenmodel; het is een deficit-model.","De oorzaak van deviant gedrag wordt gesitueerd in biologische anomalieën; het is een deficit-model; het is een cross-cultureel model.","Het is typisch voor de wijze waarop in de geneeskunde problemen worden aangepakt; het schrijft deviant gedrag toe aan biologisch-biochemische oorzaken; deficits zijn een cross-cultureel fenomeen.","Problemen worden gesitueerd in het individu en niet in de omgeving; anomalieën zijn onafhankelijk van de sociale status of culturele groep; het is een heuristisch model dat niet letterlijk is op te vatten."],"a":2,"u":""},{"t":"7","q":"Twee soorten van classificatiesystemen kunnen worden onderscheiden. Welke omschrijving is juist?","o":["Klinisch-psychiatrische systemen waarin stoornissen als onafhankelijke entiteiten worden beschouwd; empirisch-statistische systemen steunen op uitkomsten van multivariate analyses op grote steekproeven.","Klinisch-psychiatrische systemen kenschetsen de etiologie; empirisch-statistische systemen zijn uitsluitend top-down modellen.","Klinisch-psychiatrische systemen ontstaan uit factoranalyses op vragenlijsten bij grote groepen kinderen; empirisch-statistische systemen worden door commissies van clinici opgesteld en beschrijven stoornissen als aparte entiteiten.","Klinisch-psychiatrische systemen zijn uitsluitend top-down experimentele modellen; empirisch-statistische zijn inductieve modellen."],"a":0,"u":""},{"t":"5","q":"In de discussie over oorzaken van leerstoornissen onderscheiden Ghesquière en Ruijssenaars (2001) drie belangrijke benaderingen:","o":["De genetische benadering; de neuro(psycho)logische; en de cognitieve benadering gebaseerd op de cognitieve psychologie.","De genetische benadering die zeer oud is; de neuropsychologische; en de emotionele benadering.","De genetische benadering; de taakanalytische benadering; en de uitsluitend medische benadering.","De neurologische benadering; de omgevingsbenadering die uitgaat van de kwaliteit van het onderwijs; en de gedragstherapeutische benadering."],"a":0,"u":""},{"t":"7","q":"Ghesquière en Ruijssenaars (2001) schrijven dat handelingsgerichte diagnostiek verschillende niveaus kent, namelijk:","o":["het taakniveau, het niveau van de probleemgeschiedenis en het niveau van de algemene cognitieve processen;","het taakniveau, het niveau van de probleemanalyse en het niveau van de foutenanalyse;","het verklarende niveau, het niveau van de ontwikkelingsanamnese en het niveau van het cognitief functioneren;","het niveau van de probleemgeschiedenis, het niveau van de ontwikkelingsanamnese en het niveau van het taakgedrag."],"a":1,"u":""},{"t":"3","q":"Maes (2001) schrijft dat onderzoek naar de etiologie van een verstandelijke handicap vooral van belang is in het kader van preventie. Wat houden deze niveaus in?","o":["Primaire preventie is erop gericht de stoornis te voorkomen, secundaire wil door vroegtijdige onderkenning de ernst verminderen en tertiaire probeert de negatieve gevolgen zoveel mogelijk te vermijden.","Primaire preventie betekent genetisch advies; secundaire omvat genetische manipulatie; tertiaire is opname in een instelling.","Primaire preventie richt zich op kinderen bij wie de stoornis al is vastgesteld, secundaire preventie op hun ouders en broers en zussen, en tertiaire preventie op de brede bevolking via voorlichting.","Primaire voorkomt de geboorte; secundaire voorkomt elk probleem; tertiaire haalt het kind uit het gezin."],"a":0,"u":""},{"t":"1","q":"Jan Waterink was hoogleraar aan de VU Amsterdam. Welke benamingen introduceerde hij?","o":["Hij introduceerde de term orthopedagogiek voor lichtere handicaps en wilde de term klinische pedagogiek voorbehouden voor ernstige handicaps.","Hij introduceerde de term klinische pedagogiek (voor lichtere handicaps) en wilde orthopedagogiek reserveren voor ernstige handicaps.","Hij introduceerde de term therapeutische pedagogiek.","Hij introduceerde de termen genezende pedagogiek en speciale pedagogiek."],"a":1,"u":""},{"t":"1","q":"Waarom gaat Vliegenthart niet akkoord met het concept 'beperkte opvoedbaarheid' van Van Gelder?","o":["Vliegenthart wil de hulp uitsluitend laten afhangen van de subjectieve beleving van het kind.","Vliegenthart sluit zich aan bij Langeveld en accentueert de actieve rol van het kind, wat onverzoenbaar is met 'onopvoedbaarheid'.","Vliegenthart gaat ervan uit dat opvoeding het kind innerlijke houvast moet bieden en dat elk kind in principe opvoedbaar is.","Vliegenthart gaat ermee akkoord dat sommige kinderen onopvoedbaar zijn."],"a":1,"u":""},{"t":"1","q":"Volgens Wim Ter Horst is het orthopedagogisch handelen:","o":["gericht op het herstellen van de verstoorde dialoog tussen het kind en zijn opvoeders én tussen het kind en de volle werkelijkheid;","gericht op het herstellen van de verstoorde transactie tussen het kind en zijn opvoeders;","gericht op de alledaagse dingen des levens en open gesprekken, daarom is het een platvloerse wetenschap.","gericht op het aanleren van vaardigheden aan het kind, zodat het zich zonder tussenkomst van zijn opvoeders aan de eisen van de omgeving aanpast;"],"a":0,"u":""},{"t":"8","q":"'Gebruik maken van cultureel gewaardeerde middelen met de bedoeling persoonlijke gedragingen te ontwikkelen die in de samenleving gebruikelijk zijn'. Wie gaf deze definitie aan normalisatie?","o":["Wolfensberger","Van Weelden","Van Gennep","Bank-Mikkelsen"],"a":0,"u":""},{"t":"8","q":"Uit onderzoek van Forlin (1998) blijkt dat leerkrachten bezorgdheden uiten tegenover inclusie. Welke zijn de belangrijkste?","o":["angst om te mislukken; het gevaar dat het om een modetrend gaat; onvoldoende vaardigheden;","angst om te mislukken; de haalbaarheid van samen school lopen van kinderen met een zware handicap en normale kinderen; onvoldoende vaardigheden om het waar te maken; het gevaar van burn-out;","angst om te mislukken; de vrees voor te veel administratie; de overtuiging dat kinderen met een handicap in een gewone klas minder bijleren dan in een school voor buitengewoon onderwijs;","angst om te mislukken; te veel een 'belief' en te weinig ondersteund door onderzoek;"],"a":1,"u":""},{"t":"2","q":"Grietens en Hellinckx (2001) gebruiken de term gedragsproblemen voor:","o":["alle gedrag dat door de omgeving als storend wordt ervaren en dat volgens de DSM als een stoornis kan worden geclassificeerd;","alle zichtbaar ongewoon of abnormaal gedrag, welke ook de ernst, oorzaak of context is van dat gedrag.","alle probleemgedrag dat niet het gevolg is van een emotioneel probleem;","alle opvoedingsproblemen die niet tot de ontwikkelingsstoornissen behoren."],"a":1,"u":""},{"t":"5","q":"Ghesquière en Ruijssenaars (2001) delen leerproblemen in op basis van vermoedelijke oorzaken. Welke?","o":["enerzijds verbale en anderzijds niet-verbale leerstoornissen","enerzijds leerproblemen met een aanwijsbare neurologische oorzaak, en anderzijds leerproblemen die louter het gevolg zijn van te weinig motivatie en te weinig inzet bij de leerling zelf","primaire versus secundaire stoornissen gebaseerd op contextuele factoren","enerzijds de primaire leerproblemen die het gevolg zijn van problemen in het leren zelf, en anderzijds secundaire leerproblemen die het gevolg zijn van de omgeving of van een ander probleem."],"a":3,"u":""},{"t":"7","q":"Ghesquière en Ruijssenaars (2001) schrijven dat handelingsgerichte diagnostiek verschillende niveaus kent, namelijk:","o":["het taakniveau, het niveau van de probleemgeschiedenis en het niveau van de algemene cognitieve processen;","het taakniveau, het niveau van de probleemanalyse en het niveau van de foutenanalyse;","het verklarende niveau, het niveau van de ontwikkelingsanamnese en het niveau van het cognitief en psychosociaal functioneren;","het niveau van de probleemgeschiedenis, het niveau van de ontwikkelingsanamnese en het niveau van het taakgedrag."],"a":1,"u":""},{"t":"3","q":"Maes (2001) schrijft dat onderzoek naar de etiologie van verstandelijke handicap vooral van belang is in het kader van preventie. Wat is de juiste omschrijving van de niveaus?","o":["Primaire preventie is erop gericht de stoornis te voorkomen, secundaire wil door vroegtijdige onderkenning en interventie de ernst verminderen en tertiaire probeert de negatieve gevolgen van de stoornis zoveel mogelijk te vermijden.","Primaire preventie betekent genetisch advies; secundaire omvat vaccinaties; tertiaire is opname.","Preventie verloopt in drie stappen die elkaar opvolgen: eerst wordt de erfelijke aanleg in kaart gebracht, daarna volgt de medische behandeling van de stoornis en pas als laatste stap komt de begeleiding van het gezin aan bod.","Primaire voorkomt de geboorte; secundaire voorkomt problemen; tertiaire haalt het kind uit het gezin."],"a":0,"u":""},{"t":"3","q":"Nakken e.a. (1998) maakten een overzicht van frequent gebruikte programma's in de zorg voor mensen met een ernstig meervoudige beperking:","o":["snoezelen, basale stimulatie van Andreas Fröhlich en het programma van Veronica Sherborne;","cognitieve gedragstherapie, beeldcommunicatie en gentle teaching;","gentle teaching, snoezelen, speltherapie en ruilversterking;","het programma van Veronica Sherborne, basale stimulatie, gentle teaching en ruilversterking."],"a":0,"u":""},{"t":"1","q":"Jacobus Kok vat opvoeden in essentie op als een proces met een functioneel karakter. Wat bedoelt hij hiermee?","o":["Er is direct uit af te leiden hoe het opvoeden gestalte moet krijgen.","Opvoeder en opvoedeling gaan functioneel met elkaar om zonder intenties. Slechts af en toe treedt verdichting op en spreken we van specifiek opvoeden.","De opvoeder schrijft en voert een compositie uit die het kind doet bloeien.","Opvoeden moet worden opgevat als het optimaliseren van het ontwikkelingsproces. Het heeft m.a.w. een functie, geen intentie."],"a":3,"u":""},{"t":"1","q":"Wie definieerde de orthopedagogiek als 'de studie van het handelen, dat een pedagogisch antwoord zoekt en geeft op de problematiek die in de opvoedingssituatie is ontstaan'?","o":["Vliegenthart","Van Acker","Ter Horst (die de orthopedagogiek een planwetenschap noemt)","Kok (die de afstemming tussen vraag en antwoord centraal stelt)"],"a":3,"u":""},{"t":"1","q":"Volgens Ter Horst is de orthopedagogiek een praktische, menselijke planwetenschap. Waarom?","o":["Omdat ze geen object heeft, maar een veld van actie, met name de problematische opvoedingssituatie.","Omdat ze beoogt een wetenschappelijke theorie te construeren die primair bijdraagt tot het bieden van een perspectiefvolle hulpverlening aan de bij een POS betrokkenen.","Omdat ze slechts bekommerd is om het concrete, praktische handelen.","Omdat ze het opstellen en uitvoeren van handelingsplannen als haar kerntaak beschouwt en zich daarbij baseert op de regels en richtlijnen van het hulpverleningsbeleid."],"a":1,"u":""},{"t":"3","q":"Volgens Van Gennep rust het burgerschapsparadigma op vier pijlers:","o":["burgerschapsperspectief, keuze, controle en ondersteuning.","burgerschapsperspectief, ondersteuning, kwaliteit van het leven en keuzevrijheid.","burgerschapsperspectief, empowerment, kwaliteit van het leven en keuzevrijheid.","burgerschapsperspectief, ondersteuning, kwaliteit van het leven, keuze en controle."],"a":3,"u":""},{"t":"7","q":"Grietens en Hellinckx (2001) schrijven dat classificatie niet hetzelfde is als diagnose. Wat is het verschil?","o":["Classificeren en diagnosticeren verwijzen naar hetzelfde proces: zodra het gedrag met een label uit een classificatiesysteem is benoemd, liggen ook de verklaring en de behandeling vast.","Bij classificeren gaat het om benoemen. Bij diagnosticeren wil men ook uitzoeken hoe het probleem is ontstaan, hoe het kan worden behandeld en wat de prognose is.","Diagnose is de act waarvan classificatie het resultaat is.","Classificatie is de eerste stap in het diagnostisch proces."],"a":1,"u":""},{"t":"8","q":"Wat is volgens Grietens en Hellinckx (2001) het innoverende van de behandeling van gedragsproblemen door Kok?","o":["de aandacht voor het hele gezinsfunctioneren, de gezinsstructuur en -organisatie, de communicatievormen en het probleemoplossend vermogen in het gezin","dat binnen de context van een warme, echte relatie het kind inzicht krijgt in zijn gedrag","dat voor het eerst een orthopedagogische aanpak wordt gepresenteerd die wortels heeft in de empirie. Kok noemt zijn model daarom een empirische theorie","dat opvoedingshulp wordt geboden op basis van participerende observatie"],"a":2,"u":""},{"t":"5","q":"Volgens Ghesquière en Ruijssenaars (2001) kunnen we in de behandeling van leerstoornissen de volgende benaderingen onderscheiden:","o":["De procesgerichte benadering die ervan uitgaat dat het inoefenen van de leertaak zelf volstaat; de taakgerichte benadering die eerst de onderliggende basisfuncties zoals geheugen en visuele waarneming traint voor men met de leerstof begint.","De procesgerichte benadering gericht op basisfunctietraining; de taakgerichte benadering via zelfinstructie.","De procesgerichte benadering gericht op neurologische deficits; de taakgerichte benadering via deelstappen.","De procesgerichte benadering die veronderstelt dat basisfunctietraining en/of neuropsychologische training de prestaties doet toenemen; de taakgerichte benadering die via directe instructie en strategie-instructie de behandeling stuurt."],"a":3,"u":""},{"t":"3","q":"Verstandelijke handicaps worden o.a. ingedeeld volgens intelligentieniveau. Welke indeling (DSM) is correct?","o":["Licht verstandelijke handicap IQ 50-55 tot 70; matig verstandelijke handicap IQ 35-40 tot 50-55; ernstig verstandelijke handicap IQ 20-25 tot 35-40; diep verstandelijke handicap IQ < 20-25.","Licht verstandelijke handicap IQ 55-60 tot 75; matig verstandelijke handicap IQ 40-45 tot 55-60; ernstig verstandelijke handicap IQ 25-30 tot 40-45; diep verstandelijke handicap IQ < 25-30.","Licht IQ 50-55 tot 70; matig IQ 40-45 tot 50-55; ernstig IQ 25-30 tot 40-45.","Licht IQ 55-60 tot 80; matig IQ 40-45 tot 55-60; ernstig IQ 20-25 tot 40-45."],"a":0,"u":""},{"t":"3","q":"Maes (2001) schrijft dat het concept kwaliteit van het leven zowel een objectieve als een subjectieve component omvat. Wat houden deze in?","o":["De objectieve component verwijst naar de tevredenheid van de persoon zelf, de subjectieve naar de door begeleiders ingeschatte levensomstandigheden.","De objectieve component verwijst naar de omstandigheden waarin de persoon leeft, de subjectieve refereert aan de gevoelens van welbevinden en tevredenheid.","De objectieve component verwijst naar het meetbare ontwikkelingsniveau; de subjectieve naar de gedragsvraag.","De objectieve component verwijst naar meetbare persoonsfactoren; de subjectieve naar de ondersteuningsbehoefte."],"a":1,"u":""},{"t":"1","q":"Volgens Kobi (1983) laat de geschiedenis zien dat de opvoeding van het 'abnormale' kind geen vanzelfsprekendheid is. Hoe verklaart hij dat?","o":["De pedagogiek ging ervan uit dat elk kind opvoedbaar is, waardoor het abnormale kind vanzelf een plaats kreeg binnen het gewone opvoedingsdenken.","Het abnormale kind paste niet in het orde- en harmoniedenken en evenmin in de idealistisch-waardengebonden normen van de pedagogiek.","De pedagogiek was wijsbegeerte, de orthopedagogiek geneeskunde.","De pedagogiek werd beïnvloed door Rousseau die weigerde gehandicapten op te voeden."],"a":1,"u":""},{"t":"1","q":"Vaak wordt Vliegenthart beschouwd als grondlegger van de algemene of theoretische orthopedagogiek in het Nederlandse taalgebied. Waarom?","o":["Hij was de eerste die een orthopedagogische encyclopedie heeft gepubliceerd.","Hij was de eerste die orthopedagogiek definieerde in termen van belemmering in de opvoeding en de latere orthopedagogische theorieën zijn daarvan een uitwerking.","Hij heeft als eerste de drie stromingen in de orthopedagogiek geïntegreerd.","Hij heeft als eerste de orthopedagogiek losgemaakt van de algemene pedagogiek door haar volledig te baseren op empirisch onderzoek naar kindkenmerken, waarna latere auteurs die werkwijze overnamen."],"a":1,"u":""},{"t":"7","q":"De conatieve as in het orthopedagogisch classificatiesysteem van Kok is de as van de eigenheid. Hij heeft twee polen:","o":["De h-pool (harmonisatie) en de z-pool (Zelf).","De z-pool waar zich een gebrek aan eigenheid bevindt en de h-pool.","De h-pool waar de vraag naar harmonisering met de omgeving moet worden gesitueerd en de z-pool waar we de vraag naar ondersteuning van het Zelf moeten lokaliseren.","De h-pool waar de vraag naar houvast en vaste regels moet worden gesitueerd en de z-pool waar we de vraag naar zelf beslissen over de dagindeling moeten lokaliseren."],"a":2,"u":""},{"t":"7","q":"De cognitieve as in het orthopedagogisch classificatiesysteem van Kok heeft twee polen:","o":["De s-pool voor structuur en de v-pool voor variatie.","De s-pool waar de vraag naar structuur moet worden gesitueerd en de v-pool waar we de vraag naar langzamerhand variëren moeten lokaliseren.","De s-pool voor gebrek aan structuur en de v-pool voor tekort aan variatie.","De s-pool waar de vraag naar veiligheid en geborgenheid moet worden gesitueerd en de v-pool waar we de vraag naar meer bewegingsvrijheid moeten lokaliseren."],"a":1,"u":""},{"t":"2","q":"Piet Schoorl (1997) schrijft dat de meeste orthopedagogen het object situeren in de POS. Er zijn echter notoire uitzonderingen, met name:","o":["Jan Rispens die problemen bij het kind opnieuw tot uitgangspunt wil nemen en Juliaan Van Acker die voor de opvoeding belangrijke volwassenen bij wil staan.","Jan Rispens (te hermeneutisch) en Juliaan Van Acker (POS te problematisch).","Jan Rispens (internationaal discours) en Juliaan Van Acker (pedagogiek versus orthopedagogiek).","Jan Rispens die het gezinsklimaat als enige object van de discipline erkent en Juliaan Van Acker die de POS wil vervangen door een strikt gedragstherapeutische probleemanalyse."],"a":0,"u":""},{"t":"8","q":"Hanteren van het pedagogisch klimaat en van de situatie betekent volgens Kok:","o":["Dat we het kind accepteren zoals het is, dat we grenzen stellen om het kind kansen te bieden en dat we de situatie min of meer structureren, programmeren en/of variëren.","Dat we een vast systeem van belonen en sanctioneren consequent toepassen, dat we het pedagogisch klimaat onveranderd laten zodat het kind zekerheid krijgt en dat we voorvallen pas bespreken wanneer de rust in de groep volledig is teruggekeerd.","Dat we het kind accepteren zoals het worden kan, dat we kansen bieden door grenzen te stellen, dat we de aanwezige structuur afzwakken of meer verhelderen en scherper uit laten komen en dat we de situatie zo nodig programmeren en variëren.","Dat we het cliëntgeoriënteerde denken van Rogers toepassen."],"a":2,"u":""},{"t":"5","q":"Het NLD-syndroom (Non-verbal Learning Disabilities) wordt gekenmerkt door:","o":["problemen in de visueel-ruimtelijke en de tactiele processen, psychomotorische problemen, rekenproblemen, gedrags- en emotionele problemen;","een tekort in de fonologische verwerking, moeizaam lezen en spellen, een zwak verbaal geheugen en problemen met de auditieve aandacht;","rekenproblemen, visueel-auditieve processen, sociale aanpassing, concentratieproblemen;","pan-modal deficits, rekenproblemen, visuo-spatiële problemen en gedragsproblemen."],"a":0,"u":""},{"t":"3","q":"Nakken e.a. (1998) maakten een overzicht van frequent gebruikte therapieën en programma's in de zorg voor mensen met ernstig meervoudige beperkingen:","o":["snoezelen, basale stimulatie van Andreas Fröhlich en het programma van Veronica Sherborne;","cognitieve gedragstherapie, beeldcommunicatie en gentle teaching;","gentle teaching, snoezelen, speltherapie en ruilversterking;","het programma van Veronica Sherborne, basale stimulatie, gentle teaching en ruilversterking."],"a":0,"u":""},{"t":"1","q":"Prof. A. Van Gennep (2000) schrijft dat in de gehandicaptenzorg drie paradigma's te onderscheiden zijn (defect-, ontwikkelings-, en burgerschapsparadigma). Waarom is Paul Moor een voorloper van het burgerschapsparadigma?","o":["Omdat hij de aandacht niet toespitst op dat waarin het kind teleurstelt maar op dat wat we voor het kind kunnen doen.","Omdat hij het accent legt op het herstellen van de defecten van het kind voordat er van opvoeding sprake kan zijn.","Omdat hij aangeeft dat een opvoedingsbelemmering een relatief begrip is.","Omdat hij al beklemtoonde dat de mens pas mens wordt door opvoeding."],"a":0,"u":""},{"t":"7","q":"Rispens gelooft dat het onzinnig is om een orthopedagogisch classificatiesysteem te ontwerpen. Waarom?","o":["Omdat elke vorm van classificeren volgens hem de beleving van de opvoeder negeert en de hulpverlening daardoor onvermijdelijk terugbrengt tot een medische diagnose.","Omdat veel bezwaren tegen classificeren kunnen worden geuit, zoals de onbetrouwbaarheid, het situeren van het probleem in het kind, etiketteren en stigmatiseren.","Omdat classificeren op geen enkele manier aanwijzingen biedt voor het handelen.","Omdat classificeren tot het prerogatief behoort van psychologen en psychiaters."],"a":1,"u":""},{"t":"8","q":"Responsief onderwijs betekent volgens Stevens:","o":["dat de leerling moet worden geresponsabiliseerd;","dat leerling en leerkracht samen onderwijs maken in en door transacties met elkaar;","dat de leerkracht nauwlettend adequate respons moet geven op wat de leerling vraagt;","dat de leerkracht responsabel is voor wat de leerling leert."],"a":1,"u":""},{"t":"8","q":"Bayliss (1995) bestudeerde situaties waar kinderen met en zonder handicap elkaar ontmoeten. Wat constateerde hij?","o":["Hij stelde vast dat een kortdurend vormingsprogramma over handicap volstaat om kinderen zonder handicap uit zichzelf pro-sociaal gedrag te laten stellen.","Hij constateerde dat kinderen zonder handicap de kinderen met een handicap niet zomaar verwelkomen. Pro-sociaal gedrag moet blijkbaar worden aangeleerd.","Kinderen zonder handicap nemen onbewust altijd de leidende rol op zich.","De positie is niet denderend, er moet keihard gewerkt worden."],"a":1,"u":""},{"t":"5","q":"In de meeste definities van leerstoornissen treffen we een combinatie van drie criteria aan, schrijven Ghesquière en Ruijssenaars (2001):","o":["Het specificiteitscriterium, het intelligentiecriterium en het discrepantiecriterium.","Het leerpotentieelcriterium, het discrepantiecriterium en het normaliteitscriterium.","Het discrepantiecriterium, het specificiteitscriterium en het normaliteitscriterium.","Het harmonische-ontwikkelingscriterium, het discrepantiecriterium en het leerpotentieelcriterium."],"a":2,"u":""},{"t":"3","q":"Vraag 1 (Etiologie & Prevalentie)\nHoe beïnvloeden factoren de prevalentie van een verstandelijke beperking (VB) over de tijd heen?","o":["Doordat prenatale diagnostiek steeds vaker wordt ingezet en zwangerschappen daardoor worden afgebroken, stijgt het aandeel kinderen dat met een verstandelijke beperking geboren wordt.","De vooruitgang van de geneeskunde (zoals verhoogde overlevingskansen van jonge kinderen met ernstige aandoeningen) zorgt voor een hogere prevalentie.","Er is sprake van een sterke daling in de totale prevalentie omdat risicofactoren volledig zijn weggenomen.","Factoren zoals vaccinaties en het beheersen van infectieziekten verhogen de totale prevalentie."],"a":1,"u":""},{"t":"4","q":"Vraag 2 (Autismespectrumstoornis - FOUT)\nWelke uitspraak over de prevalentie van Autismespectrumstoornis (ASS) is FOUT?","o":["Er is vandaag de dag daadwerkelijk sprake van een epidemie waarbij veel meer ASS aanwezig is dan vroeger.","Er is sprake van een toegenomen prevalentie van geregistreerde klinische diagnoses door toegenomen bekendheid en bewustzijn.","Er is sprake van een verbreding van definities en criteria ten opzichte van de oudere definities.","De classificatie ASS is van groter belang geworden omdat het fungeert als toegang tot de hulpverlening."],"a":0,"u":""},{"t":"6","q":"Vraag 3 (Kindermishandeling)\nWelk percentage van de minderjarige slachtoffers van kindermishandeling vertoont op korte termijn geen klinisch significante symptomen?","o":["10% - 20%","20% - 30%","30% - 40%","40% - 50%"],"a":2,"u":""},{"t":"6","q":"Vraag 4 (Kindermishandeling)\nWelke vijf categorieën van kindermishandeling (KMH) onderscheiden we in de literatuur?","o":["Fysieke mishandeling, ontvoering, emotionele mishandeling, verwaarlozing, getuige van geweld.","Fysieke mishandeling, verwaarlozing, emotionele mishandeling, seksueel misbruik, getuige van geweld.","Fysieke mishandeling, emotionele verwaarlozing, psychische druk, opsluiting, seksuele intimidatie.","Fysieke mishandeling, medische verwaarlozing, pedagogische verwaarlozing, economisch misbruik, intiem geweld."],"a":1,"u":""},{"t":"7","q":"Vraag 5 (ICF-model)\nHet menselijke functioneren en de problemen daarbij worden binnen het ICF-kader (WHO) beschreven vanuit welke drie niveaus/perspectieven?","o":["Body functions (functies/anatomische eigenschappen), Activity (activiteiten), en Participation (participatie).","Cognitive thinking (cognitief denken), Social relations (sociale relaties), en Physical health (fysieke gezondheid).","Environment (omgeving), Personal factors (persoonlijke factoren), en Mental capacity (mentale capaciteit).","Individual behavior (individueel gedrag), Family structure (gezinsstructuur), en Social adaptation (sociale aanpassing)."],"a":0,"u":""},{"t":"2","q":"Vraag 6 (Orthopedagogische casuïstiek)\nBinnen de orthopedagogiek spreken we van een externe opvoedingsimpasse wanneer:","o":["De spanningen zich louter intern binnen de gezinsdynamiek tussen ouder en kind afspelen zonder inmenging van buitenaf.","Het kind zelfstandig aangeeft dat het de opvoedingssituatie niet meer ziet zitten.","Derden uit de omgeving (zoals buren, de school, de jeugdrechter...) klagen of signaleren dat men geen weg meer weet met dit kind.","Er sprake is van een biologische stoornis bij het kind die de opvoeding bemoeilijkt."],"a":2,"u":""},{"t":"8","q":"Vraag 7 (Klimaatcreatie volgens Kok)\nBij de eerstegraadstrategie van Kok (klimaatcreatie) gaat het om het doelgericht inrichten en structureren van:","o":["Enkel de fysieke en materiële leefomgeving van het kind.","De immateriële (pedagogische houding, sfeer) en materiële (fysieke ruimte, dagschema's) omgeving.","Uitsluitend de therapeutische behandelsetting buiten de alledaagse situatie.","De psychosociale netwerken van de ouders en hun familie, waarbinnen het kind zijn opvoeding indirect meekrijgt."],"a":1,"u":""},{"t":"7","q":"Vraag 8 (Orthopedagogische Diagnostiek - FOUT)\nWelke bewering over de classificatiecriteria en screening van ontwikkelingsstoornissen is FOUT?","o":["Een criteria-afwijking van 2 standaarddeviaties (-2 SD) op een intelligentietest is een kernkenmerk ter onderkenning van een verstandelijke beperking.","Binnen het genotype (genetisch niveau) van ASS wordt gekeken naar polygene mechanismen en de herhalingskans bij siblings.","Een tekort op vlak van de 'Theory of Mind' (ToM) wordt in de diagnostiek vastgesteld wanneer een kind een afwijking van exact 2 standaarddeviaties (-2 SD) scoort op een ToM-taak.","Het stellen van een diagnose bij ASS gebeurt altijd op gedragsniveau (fenotype), aangezien er geen biologische of cognitieve markers zijn die universeel en specifiek genoeg zijn."],"a":2,"u":""},{"t":"8","q":"Vraag 9 (Vraagstijlen van Kok - FOUT)\nWelke uitspraak over de opvoedingsstrategieën van Kok is FOUT?","o":["De eerstegraadstrategie richt zich op klimaatcreatie: het doelbewust inrichten van een stabiel en voorspelbaar basis-, leef- en leerklimaat waarbinnen het alledaagse opvoedingshandelen vorm krijgt.","De derdegraadstrategie biedt individuele en vraaggestuurde zorg op maat wanneer algemene interventies niet volstaan.","Bij het specifiek opvoeden staat het tweedegraadstrategisch handelen centraal; dit handelen is leidend en overstijgt volledig het eerstegraads- en derdegraadstrategisch handelen.","De tweedegraadstrategie omvat aanvullende, specifieke psychosociale of pedagogische interventies (zoals vaardigheidstraining of therapie)."],"a":2,"u":""},{"t":"6","q":"Vraag 10 (Kindermishandeling)\nUit wetenschappelijk overzichtsonderzoek blijkt dat het behalen van effectieve resultaten en vooruitgang via hulpverlening het allermoeilijkst blijkt te zijn bij welke vorm van kindermishandeling?","o":["Seksueel misbruik","Fysieke mishandeling","Emotionele mishandeling","Verwaarlozing"],"a":3,"u":""},{"t":"8","q":"Vraag 11 (Onderwijs en communicatie bij doofheid)\nWelke van de onderstaande modaliteiten/methoden bestaat NIET in de geschiedenis en praktijk van de dovenpedagogiek?","o":["De manuele methode (gebarentaal)","De aurale-orale benadering (gesproken taal via gehoorversterking)","De Totale Communicatie (TC)","De lichamelijke methode"],"a":3,"u":""},{"t":"6","q":"Vraag 12 (Kindermishandeling & Hulpverleners)\nWat verstaan we onder het begrip secundaire traumatisering bij professionals die werken met slachtoffers van kindermishandeling?","o":["De hulpverlener ontwikkelt zelf actieve PTSS-symptomen door de blootstelling aan de traumatische verhalen en ervaringen van de cliënt.","De professional ervaart een verandering in zijn persoonlijke wereldbeeld en verliest het algemene vertrouwen in de mensheid.","De cliënt reageert zijn of haar agressie secundair af op de hulpverlener tijdens een therapiesessie.","De instelling waar de hulpverlener werkt faalt in het aanbieden van een veilige werkomgeving."],"a":0,"u":""},{"t":"4","q":"Vraag 13 (ASS op vier niveaus - FOUT)\nWelke stelling over de genetische en familiale aspecten (genotype-niveau) van ASS is FOUT?","o":["ASS kent een multifactoriële etiologie: meerdere genen met elk een klein effect werken samen en interageren met omgevingsfactoren, zonder dat één enkel gen de stoornis kan verklaren.","De familiale lading bij ASS is aanzienlijk: voor siblings (broers en zussen) ligt de herhalingskans gemiddeld rond de 20%.","Familieleden van een persoon met ASS vertonen in hun genenpatroon uitsluitend een 'nauw fenotype', wat betekent dat zij nooit trekken van ASS vertonen tenzij ze de volledige klinische diagnose hebben.","Familieleden kunnen kenmerken van het 'bredere fenotype' vertonen; dit betekent dat ze milde ASS-kenmerken hebben zonder te voldoen aan de volledige diagnostische criteria."],"a":2,"u":""},{"t":"1","q":"Vraag 14 (Definitie Orthopedagogiek)\nWat is de exacte definitie van de orthopedagogiek als wetenschappelijke discipline?","o":["De wetenschappelijke studie van de biologische en neurologische oorzaken van ontwikkelingsachterstanden bij minderjarigen.","De wetenschappelijke studie van de preventie van en de hulpverlening aan zij die betrokken zijn of dreigen te worden betrokken bij ernstige opvoedingsproblemen (een interne of externe opvoedingsimpasse).","De klinische benadering van gedragsstoornissen die zich uitsluitend manifesteert binnen residentiële jeugdhulpvoorzieningen.","De wetenschappelijke studie van de alledaagse opvoeding van kinderen zonder problemen, waarbij men vertrekt van de normale ontwikkeling en pas achteraf nagaat welke afwijkingen daarvan als problematisch gelden."],"a":1,"u":""},{"t":"1","q":"Vraag 15 (Historische oorsprong Orthopedagogiek)\nDe historische ontwikkeling en de drievoudige oorsprong van de orthopedagogiek als praktijk- en wetenschapsgebied is te herleiden tot:","o":["De medische psychiatrie, de opkomst van de psychoanalyse en de evolutie van het algemeen basisonderwijs.","Het onderwijs aan kinderen met een handicap, de zorg voor verwaarloosde kinderen en de ambulante hulpverlening aan kinderen met gedragsproblemen.","De residentiële opvang van wezen, de introductie van de leerplicht en het opstarten van de jeugdrechtbanken.","De experimentele psychologie van Wundt, de opkomst van de erfelijkheidsleer en de sociologische studie van het arbeidersgezin in de negentiende eeuw."],"a":1,"u":""},{"t":"7","q":"Vraag 16 (Orthopedagogische Diagnostiek)\nWelke stelling over de orthopedagogische diagnostiek is correct?","o":["De orthopedagogische diagnosticus kan te allen tijde volstaan met louter beschrijven en verklaren van een probleem; een aansluitend handelingsplan is een optionele luxe.","Orthopedagogische diagnostiek gebeurt in een spanningsveld waarin de diagnosticus heel wat keuzes moet maken (hoe gegevens te ordenen, welke bronnen te wegen...).","Diagnostiek binnen de orthopedagogiek hanteert een puur positivistisch paradigma waarbij de omgeving van het kind buiten beschouwing wordt gelaten.","De classificerende diagnose is het hoogste einddoel van de orthopedagogische diagnosticus."],"a":1,"u":""},{"t":"3","q":"Vraag 17 (Verstandelijke Beperking - FOUT)\nWelke uitspraak over de kwaliteit van leven (QOL) bij personen met een verstandelijke beperking is FOUT?","o":["Factoren die de kwaliteit van leven van personen met een verstandelijke beperking bepalen, verschillen fundamenteel van de factoren die gelden voor personen zonder verstandelijke beperking, waardoor compleet andere conceptuele dimensies noodzakelijk zijn.","Kwaliteit van leven is een omvattend concept dat drie basiscomponenten kent: welbevinden, onafhankelijkheid en sociale participatie.","QOL kan zowel op een subjectieve wijze (tevredenheidsbevraging van de persoon zelf) als op een objectieve wijze (beoordeling van indicatoren) worden geëvalueerd.","Het model van kwaliteit van leven vertrekt van wat de persoon zelf belangrijk en betekenisvol vindt, en gebruikt die persoonlijke doelen als vertrekpunt voor ondersteuning, waardoor de ondersteuningsvraag en niet de beperking centraal staat."],"a":0,"u":""},{"t":"5","q":"Vraag 18 (Leerstoornissen)\nVanuit welk perspectief moet de behandeling van specifieke leerstoornissen (zoals dyslexie of dyscalculie) in de allereerste plaats vorm krijgen?","o":["Een medisch-farmacologisch perspectief","Een neurobiologisch perspectief","Een pedagogisch perspectief","Een psychotherapeutisch perspectief"],"a":2,"u":""},{"t":"8","q":"Vraag 19 (Secundaire preventie bij KMH)\nWelke stelling over de secundaire preventie van kindermishandeling (KMH) is correct?","o":["Het taxeren van de risico's op en het voorspellen of zich al dan niet kindermishandeling zal voordoen is uiterst eenvoudig via gestandaardiseerde screeningslijsten.","Het taxeren van de risico's op en het voorspellen of zich al dan niet kindermishandeling zal voordoen is moeilijk, omdat er geen vaste, eenduidige set van factoren is die KMH verklaart.","Er bestaat bij secundaire preventie geen enkel risico op vals-positieve of vals-negatieve beoordelingen.","Secundaire preventie richt zich uitsluitend via universele campagnes op de volledige nationale bevolking."],"a":1,"u":""},{"t":"6","q":"De langetermijngevolgen van kindermishandeling zijn ernstig. Welke stelling hierover is correct?","o":["De dosishypothese stelt dat de ernst van de mishandeling geen enkele invloed heeft op de latere psychische klachten.","Het hebben van een gezonde gehechtheidsband met een of meerdere volwassenen tijdens de kindertijd kan de langetermijngevolgen verzachten en de intergenerationele overdracht tegengaan.","Een trauma uit de kindertijd leidt in 100% van de gevallen onvermijdelijk tot exact hetzelfde mishandelende gedrag op de volgende generatie.","De psychosociale langetermijngevolgen zijn per vorm van mishandeling volledig specifiek: seksueel misbruik, fysiek geweld en verwaarlozing leiden elk tot een eigen, scherp af te bakenen klachtenpatroon."],"a":1,"u":""},{"t":"8","q":"De cognitieve as binnen het orthopedagogische classificatiesysteem van Kok kent twee polen. Welke zijn dit?","o":["De i-pool (waar de vraag naar inzicht in de eigen situatie thuishoort) en de g-pool (waar de vraag naar het bijsturen van gedrag wordt gesitueerd).","De s-pool (waar de vraag naar structuur moet worden gesitueerd) en de v-pool (waar de vraag naar variëren moet worden gelokaliseerd).","De c-pool (communicatie) en de a-pool (adaptatie).","De m-pool (materiële rust) en de p-pool (psychische ondersteuning)."],"a":1,"u":""},{"t":"8","q":"Wat verstaan we onder het begrip 'Hanteren van situaties' door de opvoeder?","o":["Het fysiek ingrijpen en afzonderen van een escalerende jongere in een residentiële leefgroep.","Een gerichte actie van de opvoeder om een alledaagse of incidentele gebeurtenis bewust groeibevorderend te laten zijn voor het kind.","Het strikt administratief opvolgen van het individuele handelingsplan van de cliënt.","Het bewust plannen van bijzondere activiteiten buiten de leefgroep, waardoor het kind even losgemaakt wordt van de alledaagse gebeurtenissen."],"a":1,"u":""},{"t":"7","q":"Welke stelling over het ICF-model (International Classification of Functioning, Disability and Health) is FOUT?","o":["Het ICF-kader is expliciet ontworpen om uitsluitend de etiologie (de exacte medische of genetische oorzaak) van een aandoening te bepalen.","Het ICF-kader beschrijft het menselijke functioneren vanuit de wisselwerking tussen biologische, individuele en maatschappelijke factoren.","Het model erkent de invloed van zowel persoonlijke factoren als externe omgevingsfactoren op het functioneren van de mens.","Het ICF-model is een herwerking en verbetering van het oudere, meer lineaire ICIDH-model."],"a":0,"u":""},{"t":"8","q":"Welke van de onderstaande situaties is GEEN voorbeeld van orthopedagogisch handelen?","o":["Een teammeeting over de hulpverlening informeel nabespreken met de teamcoördinator tijdens de middagpauze (zonder professionele structuur of pedagogische finaliteit).","Met een kind van 8 jaar in dialoog gaan over seksueel misbruik, na seksueel overschrijdend gedrag door een leeftijdsgenoot.","Samen met de ouders van een tienerdochter met een drugsverslaving een handelingsplan opstellen en hen wekelijks begeleiden bij het stellen van duidelijke grenzen thuis.","Het geven van specifiek pedagogisch advies aan een leerkracht in het buitengewoon onderwijs (BO) omtrent emotieregulatie in de klas."],"a":0,"u":""},{"t":"7","q":"Binnen het diagnostische proces in de orthopedagogiek onderscheiden we drie basisvormen (onderkennende, verklarende en handelingsgerichte/indicerende diagnostiek). Welke van de onderstaande termen hoort NIET thuis in dit rijtje van basisvormen?","o":["Onderkennende diagnostiek","Verklarende diagnostiek","Indicerende / Handelingsgerichte diagnostiek","Verhelderende diagnostiek"],"a":3,"u":""},{"t":"3","q":"Op basis van de criteria (stoornis ontstaan tijdens de ontwikkelingsperiode, t.e.m. 18 jaar), welke van de onderstaande casussen is GEEN verstandelijke beperking?","o":["Een meisje met een IQ van 68 en duidelijke tekorten in adaptieve vaardigheden (lichte VB).","Een man van 23 jaar die op zijn 22e een zware hersenbloeding (NAH) opliep en wiens IQ nu gedaald is tot 65.","Een kind met een IQ van 36 dat intensieve ondersteuning nodig heeft bij dagelijkse ADL-taken (ernstige VB).","Een jongen met een matige verstandelijke beperking die blijvende training en ondersteuning behoeft bij het nemen van belangrijke levenskeuzes."],"a":1,"u":""},{"t":"8","q":"Binnen de orthopedagogiek worden 'Kwaliteit van leven' (individueel niveau), 'Kwaliteit van het gezinsleven' (gezinsniveau) en 'Sociale inclusie' (maatschappelijk niveau) gezien als nauw samenhangende visies. Welk model hoort hier in deze specifieke trits NIET bij op dit niveau?","o":["Kwaliteit van leven (QOL)","Kwaliteit van het gezinsleven (KvGL)","Sociale inclusie / Maatschappelijke participatie","Het prestatiegericht-economische organisatiemodel"],"a":3,"u":""},{"t":"5","q":"Welk van de onderstaande psychologische modellen is GEEN theoretisch verklaringsmodel dat gebruikt wordt binnen de cognitieve methoden bij leerstoornissen?","o":["Het basisfunctiemodel","Het taak-analytisch model","Het informatieverwerkingstheorie-model","Het geheugendeficit-model"],"a":3,"u":""},{"t":"7","q":"Binnen de klinische orthopedagogiek kent classificatie duidelijke doelstellingen (zoals betrouwbaar communiceren, hypotheses opstellen, een passende behandeling kiezen). Welke doelstelling is echter FOUT of behoort hier NIET toe?","o":["Classificatie met als primaire en directe doelstelling het aanleggen van een historisch-pedagogisch archief.","Classificatie als middel om betrouwbare informatie te verzamelen en alternatieve differentiaaldiagnostische hypotheses te maken.","Classificatie als noodzakelijk instrument om de juiste, wetenschappelijk onderbouwde behandelingslijn te kiezen.","Classificatie om een eenduidige communicatie tussen multidisciplinaire professionals te waarborgen."],"a":0,"u":""},{"t":"5","q":"Er kan een onderscheid gemaakt worden tussen primaire leerstoornissen (specifieke problemen met schoolse vaardigheden) en secundaire leerproblemen (ten gevolge van een andere factor, bv. VB of zintuiglijke beperking). Welke bewering over de causale mechanismen is FOUT?","o":["Primaire leerstoornissen zijn louter het gevolg van algemene, brede taalontwikkelingsstoornissen (TOS) waardoor álle schoolse vaardigheden die hierop beroep doen automatisch en op identieke wijze uitvallen.","Primaire leerstoornissen zijn het gevolg van specifieke neurologische informatieverwerkingsproblemen bij het leren van schoolse vaardigheden, zonder dat de algemene intelligentie beperkt hoeft te zijn.","Secundaire leerproblemen kunnen ontstaan wanneer de zintuiglijke input (zoals bij doofheid of slechthorendheid) de toegang tot de instructietaal bemoeilijkt.","Bij een primaire leerstoornis is er sprake van hardnekkigheid (weerstand tegen een kwaliteitsvol instructie-aanbod)."],"a":0,"u":""},{"t":"4","q":"Volgens de educatieve en ontwikkelingsgerichte benadering van Rutter (1985) worden er drie specifieke behandelingsdoelen voor kinderen met ASS onderscheiden. Welke van de onderstaande acties behoort NIET tot deze doelen?","o":["Het stimuleren van de normale ontwikkeling (spel, communicatie).","Het verminderen van specifieke, direct uit autisme voortvloeiende problemen (rigiditeit, stereotypieën).","Deelname verplichten aan een gestandaardiseerd, universeel voorprogramma dat voor elk kind met ASS identiek is.","Het elimineren van niet-specifieke en geassocieerde gedragsproblemen (agressie, eet- en slaapproblemen)."],"a":2,"u":""},{"t":"8","q":"Het bepalen van de exacte graad van een gehoorverlies binnen de audiologie gebeurt op basis van welke fysieke eigenschappen van de geluidsgolf?","o":["De geluidsfrequentie (uitgedrukt in Hertz, Hz) alleen.","De geluidssterkte of intensiteit (uitgedrukt in decibel, dB) alleen.","Zowel de geluidsfrequentie (Hz) als de geluidssterkte (dB).","Een puur functioneel-maatschappelijk criterium."],"a":2,"u":""},{"t":"3","q":"Welke omschrijving van de drie niveaus van preventie bij een verstandelijke beperking (VB) is correct?","o":["Primaire preventie beperkt de negatieve gevolgen; secundaire preventie voorkomt de stoornis; tertiaire preventie start pas na het 18e levensjaar.","Primaire preventie is gericht op het voorkòmen van de stoornis (bv. vaccinatie, genetisch advies); secundaire preventie wil de ontwikkeling van de stoornis voorkomen (bv. vroege opsporing/dieet); tertiaire preventie is gericht op het beperken van de negatieve maatschappelijke gevolgen via aangepaste behandeling.","Primaire preventie richt zich uitsluitend op de ouders; secundaire preventie op de school; tertiaire preventie op de tewerkstelling.","Primaire, secundaire en tertiaire preventie verwijzen alle drie naar biomedisch-genetische ingrepen vóór de geboorte, zoals genetisch advies en prenataal onderzoek; het onderscheid tussen de drie niveaus wordt enkel bepaald door het moment in de zwangerschap waarop de ingreep gebeurt en niet door het doel dat men ermee nastreeft."],"a":1,"u":""},{"t":"5","q":"Welke drie wetenschappelijke criteria moeten gelijktijdig getoetst worden om te kunnen spreken van een specifieke leerstoornis?","o":["Het intelligentiecriterium, het gedragscriterium en het psychosociale criterium.","Het achterstandscriterium, het hardnekkigheidscriterium (didactische resistentie) en het exclusiviteitscriterium (uitsluiten van andere primaire oorzaken).","Het neurologische criterium (aantoonbare hersenschade), het frequentiecriterium (hoe vaak de fout in een tekst voorkomt) en het gezinscriterium (dezelfde stoornis bij een ouder).","Het leertheoretische criterium, het gezinsfrequentie-criterium en het schoolsituatie-criterium."],"a":1,"u":""},{"t":"7","q":"Welke vorm van diagnostiek richt zich specifiek op het opstellen van een breed sterkte/zwakteprofiel van het kind én zijn opvoedingsomgeving, met als direct doel het formuleren van concrete indicaties voor behandeling en aanpak?","o":["Classificerende / Onderkennende diagnostiek","Verklarende diagnostiek","Handelingsgerichte diagnostiek (HGD)","Categoriale diagnostiek"],"a":2,"u":""},{"t":"2","q":"Binnen het theoretische model van de orthopedagogiek, hoe verhoudt het voorkomen van 'afwijkende discrepanties' bij het kind of de opvoeder zich tot het vaststellen van een Problematische Opvoedingssituatie (POS)?","o":["Het louter voorkomen van afwijkende discrepanties is een noodzakelijke én voldoende voorwaarde om te spreken van een POS.","Het voorkomen van afwijkende discrepanties is geen voldoende voorwaarde en tevens géén noodzakelijke voorwaarde om te kunnen spreken van een POS (de subjectieve lijdensdruk en de stagnatie in de interactie zijn bepalend).","Alleen wanneer de ouders afwijkende discrepanties vertonen, is er sprake van een POS.","Afwijkende discrepanties bij het kind vormen een noodzakelijke voorwaarde: zolang de ontwikkeling binnen de normale spreiding blijft, kan er per definitie geen sprake zijn van een POS, hoe zwaar de ouders de situatie ook beleven."],"a":1,"u":""}],"theory":[{"h":"1 · Grondslagen & geschiedenis","items":["Orthopedagogiek bestudeert de problematische opvoedingssituatie (POS). De prefix \"ortho\" betekent hier: aangepast aan, naar de maat van.","Drievoudige oorsprong: (1) onderwijs aan kinderen met een handicap, (2) zorg voor verwaarloosde kinderen, (3) ambulante hulpverlening aan kinderen met gedragsproblemen.","Hanselmann, vaak de grondlegger genoemd, definieerde het object als kinderen met opvoedingsbelemmeringen.","Drie ontwikkelingsfasen: opvoeding van het afwijkende kind → hulpverlening aan het kind in opvoedingsnood → hulpverlening bij een problematische opvoedingssituatie."]},{"h":"2 · Problematische opvoedingssituatie (POS)","items":["Snelle beschrijft opvoedingsdoelen in termen van minimale rationaliteit (mr) en minimale moraliteit (mm).","Interne opvoedingsimpasse: de opvoeder meent dat de ontwikkeling niet in de gewenste richting (mr/mm) verloopt.","Externe opvoedingsimpasse: de ontwikkeling wordt negatief beïnvloed door externe factoren."]},{"h":"3 · Verstandelijke beperking (VB)","items":["Kenmerken: beneden-gemiddeld cognitief functioneren + beperkingen in de sociale redzaamheid + manifesteert zich vóór de leeftijd van 18 jaar.","Een verstandelijke beperking is NIET altijd genetisch bepaald.","Mensenrechtenbenadering: VB is het gevolg van het niet op een gelijkwaardige manier kunnen participeren aan de maatschappij.","Auditieve handicaps: doven, slechthorenden, pre- en postlinguale gehoorstoornis. Gehoorverlies wordt objectief gemeten in frequentie (Hz) én geluidssterkte (dB)."]},{"h":"4 · Autisme (ASS)","items":["De gestegen geregistreerde prevalentie komt door toegenomen bekendheid/bewustzijn en een verbreding van definities en criteria, niet door een echte \"epidemie\".","De classificatie ASS is van groter belang geworden omdat ze fungeert als toegang tot de hulpverlening."]},{"h":"5 · Leerstoornissen","items":["Drie criteria: het achterstandscriterium, het hardnekkigheidscriterium (resistentie) en het exclusiviteitscriterium.","Primaire leerstoornissen zijn specifiek en niet synoniem aan een globale taalontwikkelingsstoornis (TOS).","Behandeling van leerstoornissen moet in de eerste plaats pedagogisch ingestoken worden."]},{"h":"6 · Kindermishandeling & verwaarlozing (KMH)","items":["Een gezonde, veilige gehechtheidsrelatie fungeert als een krachtige buffer/beschermfactor.","Risicotaxatie bij KMH is uiterst complex bij gebrek aan één eenduidige causale factor.","Een deel van de minderjarige slachtoffers vertoont op korte termijn geen klinisch significante symptomen."]},{"h":"7 · Diagnostiek & classificatie","items":["Doelen van classificatie: het ordenen van informatie, communicatie en predictie. Een classificatie is een beschrijving van de problematiek, GEEN etiologische uitspraak.","Het ICF-model is functioneel en is niet ontworpen om de medische etiologie te bepalen.","Het ASEBA-systeem (Achenbach) is een non-categoriaal classificatiesysteem.","Drie klassieke basistypen diagnostiek: onderkennend, verklarend en indicerend. Handelingsgerichte diagnostiek (HGD) richt zich op een profiel ten behoeve van een concreet handelingsplan."]},{"h":"8 · Hulpverlening, preventie & behandeling","items":["Preventie: primair (stoornis voorkomen), secundair (vroege opsporing/ontwikkeling stuiten), tertiair (gevolgen beperken).","Inclusie steunt op een geloof in een tolerante en accepterende samenleving (mensenrechtenbenadering), heeft een internationale rechtsbasis en beperkt zich niet tot het onderwijs.","Toelating tot het buitengewoon onderwijs (BO) kan enkel via een inschrijvingsverslag (attest + verantwoordingsprotocol)."]}],"hacks":[{"h":"Drievoudige oorsprong","t":"Onthoud de 3: (1) onderwijs aan kinderen met een handicap, (2) zorg voor verwaarloosde kinderen, (3) ambulante hulpverlening bij gedragsproblemen."},{"h":"Verstandelijke beperking = 3 criteria","t":"Beneden-gemiddeld cognitief functioneren + beperkte sociale redzaamheid + manifesteert zich vóór 18 jaar. En let op: NIET altijd genetisch."},{"h":"Classificatie = 3 doelen","t":"Ordenen · communiceren · predictie. Een classificatie beschrijft de problematiek, het is GEEN etiologische (oorzaak-)uitspraak."},{"h":"Preventie in 3 niveaus","t":"Primair = voorkomen · secundair = vroege opsporing · tertiair = gevolgen beperken."},{"h":"Leerstoornissen = 3 criteria","t":"Achterstandscriterium · hardnekkigheid (resistentie) · exclusiviteit."},{"h":"Let op de FOUT-vragen","t":"Lees goed of er naar de JUISTE of de FOUTE stelling gevraagd wordt, dat draait het hele antwoord om."}]};
</script>

    if(_m==="training"||_m==="herkansing"){ state.track=_m; lset("ortho_track",_m);
      var _c=_q.get("calm"); if(_c!=null){ calm=(_c!=="0"); lset("ortho_calm",calm); applyCalm(); }
      state.step="practice"; state.fromHub=true; }
  }catch(e){}
  render();
  // launch-splash netjes laten verdwijnen
  (function(){ var _sp=document.getElementById("splash"); if(!_sp) return; var _red=false; try{_red=window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){} setTimeout(function(){ _sp.classList.add("hide"); setTimeout(function(){ if(_sp&&_sp.parentNode) _sp.parentNode.removeChild(_sp); }, 700); }, _red?300:1850); })();
})();
</script>
<script>
/* gedeelde interactie: klik-animatie en zacht openschuivende theorieblokken */
(function(){
  // Elk theorieblok krijgt precies een wikkel-element, anders klapt een blok met
  // meerdere kinderen niet volledig dicht (MBG had er tien).
  function wikkel(){
    var lijst=document.querySelectorAll(".acc>.body");
    for(var i=0;i<lijst.length;i++){
      var b=lijst[i];
      if(b.children.length===1 && b.firstElementChild && b.firstElementChild.className==="bes-wrap") continue;
      var w=document.createElement("div"); w.className="bes-wrap";
      while(b.firstChild) w.appendChild(b.firstChild);
      b.appendChild(w);
    }
  }
  var gepland=false;
  function planWikkel(){ if(gepland)return; gepland=true; setTimeout(function(){ gepland=false; wikkel(); },0); }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",wikkel); else wikkel();
  try{ new MutationObserver(planWikkel).observe(document.documentElement,{childList:true,subtree:true}); }catch(e){}
  var KLIK="button,.btn,.iconbtn,.opt,.track,.chrow,.backlink,.chip,.mode,.toggle,.scard,.ccard,.qcard,.srclink,.bnlink,.navlink,.ycard,.excat,.brandstrip,summary";
  document.addEventListener("pointerdown",function(e){
    var el=(e.target&&e.target.closest)?e.target.closest(KLIK):null; if(!el)return;
    el.classList.remove("bes-klik"); void el.offsetWidth; el.classList.add("bes-klik");
    setTimeout(function(){ el.classList.remove("bes-klik"); },260);
  },true);
  document.addEventListener("click",function(e){
    var s=(e.target&&e.target.closest)?e.target.closest("details.acc>summary"):null; if(!s)return;
    var d=s.parentNode; if(!d) return;
    e.preventDefault();
    if(d.open){
      d.classList.add("bes-dicht");
      setTimeout(function(){ d.open=false; d.classList.remove("bes-dicht"); },250);
    } else {
      d.open=true; d.classList.add("bes-open");
      var los=function(){ d.classList.remove("bes-open"); };
      requestAnimationFrame(function(){ requestAnimationFrame(los); });
      setTimeout(los,400);
    }
  },false);
})();
</script>
