ale (rug) kant. Je ziet vier kleine heuveltjes (de corpora quadrigemina). Hoe heet dit specifieke gebied van het mesencephalon?","o":["Tegmentum","Tectum","Vermis","Pons"],"a":1,"u":"Het tectum (' dak') bevat de 4 colliculi."},{"t":"1","q":"Hoeveel van de volgende stellingen over gedragsgenetica en evolutie zijn JUIST? 1. De' equal environment assumption' stelt dat eeneiige en twee-eiige tweelingen exact dezelfde omgevingsinvloeden delen, wat er in de praktijk vaak voor zorgt dat genetische effecten worden overschat. 2. Pleiotropie betekent dat één fenotypische eigenschap (zoals intelligentie) door honderden verschillende genen wordt bepaald. 3. Mensen hebben het absoluut zwaarste brein en het meeste aantal neuronen van alle levende diersoorten. 4. GWAS 5. Genome-Wide Association Study) is een methode die vertrekt vanuit het fenotype.","o":["1","2","3","4"],"a":1,"u":"Stelling 1 is JUIST (de equal environment assumption overschat vaak de erfelijke factor omdat eeneiige tweelingen ook prenatale omgevingen zoals placenta vaker delen). Stelling 4 is JUIST GWAS vertrekt vanuit het fenotype). Stelling 2 is FOUT Pleiotropie = 1 gen voor meerdere eigenschappen. Polygenetisch = meerdere genen voor 1 eigenschap). Stelling 3 is FOUT Olifanten/potvissen hebben grotere en zwaardere hersenen dan mensen)."},{"t":"3","q":"Welke stelling over de actiepotentiaal is FOUT?","o":["De natrium-kaliumpomp verbruikt heel veel energie (ATP) en is cruciaal voor het herstellen van de concentratiegradiënten op lange termijn.","Tijdens depolarisatie openen de spanningsafhankelijke natriumkanalen en stroomt natrium massaal de cel binnen.","Hyperpolarisatie ontstaat doordat de kaliumkanalen traag sluiten, waardoor er te veel kalium de cel verlaat en de membraanpotentiaal negatiever wordt dan 70 mV.","Een actiepotentiaal in een ongemyeliniseerd axon verplaatst zich via saltatorische conductie."],"a":3,"u":"Saltatorische (springende) conductie gebeurt uitsluitend in gemyeliniseerde axonen. Bij ongemyeliniseerde axonen schuift het signaal traag en continu op. Stellingen A, B en C zijn correcte beschrijvingen van de actiepotentiaal."},{"t":"4","q":"Je wil onderzoeken of een proefpersoon onbewust andermans gezichtsuitdrukkingen imiteert (automatische mimicry). Welke methode en welke spier ga je hiervoor primair gebruiken?","o":["EDA; Corrugator supercilii","EMG; Zygomaticus major","EEG; Masseter","MEG; Zygomaticus major"],"a":1,"u":"EMG meet de spieractiviteit. De Zygomaticus major is de glimlachspier en wordt gebruikt om onbewuste mimicry (of leedvermaak) te meten. De Corrugator is de fronsspier."},{"t":"3","q":"Hoeveel van de volgende stellingen over steuncellen (glia) zijn JUIST? 1. Astrocyten spelen een cruciale rol in de energievoorziening door glucose uit het bloed om te zetten in lactaat voor de neuronen. 2. Oligodendrocyten vormen myelineschedes in het centrale zenuwstelsel. 3. Microglia fungeren als het immuunsysteem van het brein en ruimen dode cellen op (fagocytose). 4. Schwann-cellen kunnen bijdragen aan het herstel van beschadigde axonen in het perifere zenuwstelsel.","o":["1","2","3","4"],"a":3,"u":"Alle functies van de gliacellen zijn hier perfect correct beschreven."},{"t":"3","q":"Een antagonistische drug heeft als effect dat de synaptische transmissie wordt afgeremd. Welk van de volgende mechanismen is ANTAGONISTISCH?","o":["Het blokkeren van de reuptake-eiwitten.","Het inactiveren van het enzym dat de neurotransmitter in de synapsspleet afbreekt.","Het stimuleren van de presynaptische autoreceptoren.","Het toedienen van een precursor (voorloperstof) van de neurotransmitter."],"a":2,"u":"Autoreceptoren zijn de \" rem \" van het presynaptisch neuron. Als je de rem stimuleert, rem je de afgifte van de neurotransmitter af. Dat is dus antagonistisch! De opties A, B en D zorgen juist voor méér activiteit (agonistisch)."},{"t":"4","q":"Welke van de volgende onderzoeksmethoden heeft een ZEER SLECHTE temporele resolutie, maar kan wel gebruikt worden om specifieke neurotransmitters (zoals dopamine) in het levende menselijke brein in kaart te brengen?","o":["fMRI","PET-scan","MEG","DTI"],"a":1,"u":"Een PET-scan heeft een extreem slechte temporele resolutie (tientallen seconden), maar doordat je een radioactieve vloeistof inspuit (zoals L (DOPA) kun je perfect specifieke neurotransmitters in levend weefsel zien."},{"t":"2","q":"Hoeveel van de volgende stellingen over de hersenstam en het ruggenmerg zijn JUIST? 1. De ventrale hoorn van het ruggenmerg bevat de cellichamen van efferente motorneuronen. 2. De DCML-baan (dorsal column/medial lemniscus) is een stijgende baan die zintuiglijke informatie naar de hersenen brengt. 3. De pons en het cerebellum behoren beide tot het metencephalon. 4. De medulla oblongata bevat kernen die vitale functies zoals ademhaling en hartslag reguleren.","o":["1","2","3","4"],"a":3,"u":"Dit zijn stuk voor stuk feiten uit de anatomie van het ruggenmerg en de hersenstam."},{"t":"4","q":"Wat is een nadeel van experimentele ablatie (zoals een radiofrequente laesie bij proefdieren) ten opzichte van tijdelijke chemische inhibitie (met muscimol)?","o":["Ablatie vernietigt uitsluitend de cellichamen en niet de axonen.","Ablatie is onomkeerbaar en vereist een \" sham \" (schijn) controleprocedure om de effecten van de operatie zelf uit te sluiten.","Ablatie activeert de cellen in plaats van ze te remmen.","Ablatie kan alleen worden toegepast op de buitenste schorslaag (cortex)."],"a":1,"u":"Chemische inhibitie (met muscimol) verdrijft vanzelf, waardoor het dier weer normaal functioneert. Ablatie verbrandt/vernietigt de cellen permanent, waardoor je een controlegroep moet opensnijden zonder de cellen te verbranden (sham) om te zien of het effect niet gewoon van de operatie zelf kwam."},{"t":"2","q":"Welke stelling over het autonome zenuwstelsel is JUIST?","o":["Het parasympathisch zenuwstelsel zorgt voor pupilverwijding en het stimuleren van zweetklieren.","De preganglionaire neuronen van het sympathisch zenuwstelsel ontspringen voornamelijk in het craniosacrale (hersenstam en heiligbeen) gebied.","Het enterisch zenuwstelsel (\" gut brain \") bevat miljoenen neuronen en beïnvloedt onder andere de spijsvertering onafhankelijk van het brein.","Een hoge hartslagvariabiliteit (HRV) is een indicatie van een overactief sympathisch zenuwstelsel en chronische stress."],"a":2,"u":"C is juist. A is fout Parasympathisch vernauwt de pupil, sympathisch verwijdt). B is fout Sympathisch is thoracaal/lumbaal, parasympathisch is craniosacraal). D is fout HOGE hartslagvariabiliteit wijst op een gezonde, rustige en flexibele parasympathische toestand)."},{"t":"4","q":"Bij EEG-onderzoek kijkt men vaak naar specifieke frequentiebanden (hersengolven). Welke combinatie van frequentieband en mentale toestand is JUIST?","o":["Delta-golven – Actieve concentratie","Bèta-golven – Diepe slaap","Alpha-golven – Ontspanning/Rust","Theta-golven – Hoge cognitieve functies"],"a":2,"u":"Delta = diepe slaap. Bèta = actieve concentratie/alertheid. Theta = slaperig/dagdromen."},{"t":"2","q":"Welke van de volgende structuren behoort NIET tot het limbisch systeem?","o":["Gyrus cingulus","Amygdala","Globus pallidus","Corpora mammilaria"],"a":2,"u":"De globus pallidus behoort tot de Basale Ganglia (motoriek), niet tot het limbisch systeem (emotie/geheugen)."},{"t":"4","q":"Hoeveel van de volgende stellingen over ERP's (Event-Related Potentials) zijn FOUT? 1. De N 400- piek treedt op wanneer een proefpersoon een woord leest dat semantisch (qua betekenis) niet in de zin past. 2. Een ERP wordt zichtbaar door de EEG-signalen van slechts één enkele trial (prikkel) nauwkeurig te bekijken zonder ruis te filteren. 3. De P 300- piek ontstaat alleen bij zeer verwachte en voorspelbare stimuli. 4. Om ERP's te meten heb je een apparaat nodig met een zeer hoge temporele resolutie, zoals fMRI.","o":["1","2","3","4"],"a":2,"u":"Alleen stelling 1 is JUIST (N 400 = semantische fouten). 2 is FOUT (je moet juist het gemiddelde van heel veel trials nemen om ruis weg te filteren). 3 is FOUT P 300 ontstaat juist bij onverwachte, zeldzame stimuli). 4 is FOUT (fMRI heeft een slechte temporele resolutie, je gebruikt hier EEG of MEG voor)."},{"t":"4","q":"Wat is het primaire doel van Nissl-kleuring in histologisch onderzoek?","o":["Het zichtbaar maken van axonen in de witte stof.","Het selectief aankleuren van de cellichamen (soma's), wat helpt om de dichtheid van neuronen in de cortex te zien.","Het detecteren van virussen in transneuronale tracing.","Het live volgen van de bloeddoorstroming in een proefdier."],"a":1,"u":"Nissl-kleuring bindt zich aan het ruw endoplasmatisch reticulum in het cellichaam (soma) en niet aan de axonen. Hierdoor zie je heel mooi de dichtheid van cellen."},{"t":"2","q":"Wat is JUIST over de bloed-breinbarrière?","o":["Ze is overal in het brein even sterk, zonder uitzonderingen.","Ze ontstaat doordat er kleine kiertjes zitten tussen de cellen van de haarvaatjes in het CZS.","Ze is zwakker in de area postrema, het gebied in de hersenstam dat instaat voor de braakreflex.","Ze laat grote moleculen zoals neurotransmitters moeiteloos passeren via diffusie."],"a":2,"u":"Het braakcentrum (area postrema) moet de giftige stoffen in het bloed kunnen \" proeven \" om te beslissen of je moet overgeven, daarom is de barrière hier zwakker. De rest is fout: de cellen sluiten naadloos op elkaar aan zonder kiertjes (B is fout)."},{"t":"2","q":"Welk onderdeel van het brein wordt beschouwd als het \" verdeelcentrum \" voor sensorische informatie (behalve geur)?","o":["Thalamus","Hypothalamus","Tectum","Basale ganglia"],"a":0,"u":"De thalamus (\" binnenste kamer \") stuurt alle zintuiglijke informatie, behalve de reuk, door naar de juiste plekken in de cortex."},{"t":"3","q":"Bij een metabotrope receptor (G-proteïne gekoppeld):","o":["Opent het ionkanaal direct na binding van de neurotransmitter, wat zorgt voor een zeer snelle reactie.","Komt er een cascade aan reacties op gang (\" second messenger \"), wat leidt tot een tragere maar langdurigere en veelzijdigere verandering in de cel.","Ontstaat er altijd onmiddellijk een actiepotentiaal.","Wordt de neurotransmitter onmiddellijk afgebroken door enzymen."],"a":1,"u":"Een ionotrope receptor opent onmiddellijk. Een metabotrope receptor (G-proteïne) werkt trager, maar veelzijdiger via een second messenger."},{"t":"4","q":"Welke hersenzenuw is gemengd (zowel sensorisch als motorisch) en heeft belangrijke vertakkingen naar het parasympathische zenuwstelsel in de romp (borst en buik)?","o":["N. Opticus II","N. Facialis VII","N. Vagus X","N. Hypoglossus XII"],"a":2,"u":"De nervus vagus (' zwervende zenuw') zwerft helemaal naar beneden naar de organen in de borst en buik en is cruciaal voor het parasympathisch zenuwstelsel."},{"t":"2","q":"Wat is de juiste omschrijving van de \" Massa intermedia \"?","o":["Het is een andere naam voor het corpus callosum.","Het is een vouw in de dura mater tussen de twee hersenhelften.","Het is een bruggetje van grijze stof dat dwars door de derde ventrikel loopt en de linker-en rechterkant van de thalamus verbindt.","Het is de plek in de medulla waar de motorische piramidebanen kruisen."],"a":2,"u":"De massa intermedia is het grijze bruggetje dat door de derde ventrikel loopt en de twee thalamus-helften verbindt."},{"t":"3","q":"Hoeveel stellingen over synapsen zijn JUIST? 1. Bij een chemische synaps smelten de vesikels samen met het presynaptisch membraan om neurotransmitters vrij te geven via exocytose. 2. Calcium-ionen 3. $Ca ^ 4. 2 5. $) zijn essentieel voor het vrijgeven van neurotransmitters in de synapsspleet. 6. Autoreceptoren bevinden zich op het postsynaptisch membraan en triggeren altijd een EPSP. 7. Bij elektrische synapsen (gap junctions) diffunderen ionen direct van cel naar cel.","o":["1","2","3","4"],"a":2,"u":"Stelling 3 is FOUT. Autoreceptoren bevinden zich op het PREsynaptisch membraan, niet het postsynaptische, en ze werken altijd modulerend/remmend op de eigen cel."},{"t":"2","q":"Welk gebied in de hersenen staat bekend als het belangrijkste beloningscentrum en speelt een cruciale rol bij verslaving?","o":["Nucleus ruber","Cerebellum","Nucleus accumbens (ventraal striatum)","Gyrus dentatus"],"a":2,"u":"De nucleus accumbens (het ventraal striatum) speelt een gigantische rol in beloning en het ervaren van genot/euforie, en is dus de hoofdrolspeler bij verslavingen."},{"t":"2","q":"Je bekijkt de hersenen in een midsagittale doorsnede. Je ziet de pons. Welke structuur bevindt zich direct DORS А AL (aan de rugkant) van de pons?","o":["Hypothalamus","Cerebellum","Medulla","Thalamus"],"a":1,"u":"Als je aan de buikkant (ventraal) de pons ziet uitstulpen, ligt het cerebellum daar direct achter aan de rugkant (dorsaal)."},{"t":"2","q":"Een patiënt heeft schade opgelopen aan de primaire motorische cortex. In welke kwab, en ten opzichte van de sulcus centralis, bevindt deze schade zich?","o":["Pariëtale kwab; posterieur van de sulcus centralis.","Frontale kwab; anterieur van de sulcus centralis.","Frontale kwab; posterieur van de sulcus centralis.","Pariëtale kwab; anterieur van de sulcus centralis."],"a":1,"u":"De sulcus centralis scheidt de frontale en pariëtale kwab. Ervoor (anterieur) ligt de primaire motorische cortex, erachter (posterieur) de primaire somatosensorische cortex."},{"t":"2","q":"Tussen welke twee hersenvliezen stroomt het cerebrospinaal vocht (CSF) en bevindt zich het spinnenweb-achtige weefsel?","o":["Tussen de schedel en de dura mater.","Tussen de dura mater en de arachnoïde mater.","Tussen de arachnoïde mater en de pia mater (subarachnoïdale ruimte).","Tussen de pia mater en de cortex."],"a":2,"u":"Het vocht (CSF) en het spinnenweb-weefsel bevinden zich in de sub arachnoïdale ruimte, oftewel ónder de arachnoïde mater en bóven de pia mater."},{"t":"2","q":"Welke hersenstructuur heeft de vorm van een' C' of een grote boog en ligt direct boven de thalamus, omgeven door de laterale ventrikels?","o":["Fornix","Corpus callosum","Chiasma opticum","Tentorium cerebelli"],"a":1,"u":"Het corpus callosum (hersenbalk) is de grote witte boog over de thalamus heen die de linker-en rechterhemisfeer verbindt en het' dak' van de laterale ventrikels vormt."},{"t":"2","q":"Als we via de \" Neuraxis \" van de hersenstam richting de prefrontale cortex navigeren, in welke richting bewegen we ons dan primair?","o":["Caudaal","Ventraal","Rostraal/Anterieur","Posterieur"],"a":2,"u":"De neuraxis loopt van het ruggenmerg naar boven en buigt dan af naar voren richting je neus/voorhoofd. Je beweegt je dus rostraal (richting de neus) of anterieur (voorkant)."},{"t":"2","q":"Waar bevindt zich de vierde ventrikel?","o":["In het diencephalon, precies tussen de twee helften van de thalamus.","In het mesencephalon, als een smal buisje (aquaduct).","In het rhombencephalon, tussen de pons/medulla en het cerebellum.","In het telencephalon, diep in de frontale kwab."],"a":2,"u":"De 4 e ventrikel is de ruimte tussen de pons/medulla aan de voorkant en het cerebellum aan de achterkant."},{"t":"2","q":"Je kijkt naar een horizontale snede van het brein. De' hoorn' van de laterale ventrikel die naar voren (richting het voorhoofd) wijst, bevindt zich in de...","o":["Occipitale kwab","Pariëtale kwab","Temporale kwab","Frontale kwab"],"a":3,"u":"De laterale ventrikels hebben hoorns. De anterieure hoorn (voorste hoorn) wijst recht in de frontale kwab."},{"t":"2","q":"Welk deel van de basale ganglia ligt als een grote, ronde \" schelp \" helemaal aan de buitenkant (lateraal) van de globus pallidus?","o":["Putamen","Caudatus","Amygdala","Substantia nigra"],"a":0,"u":"Putamen betekent letterlijk' schelp'. Het is het meest lateraal gelegen deel van het striatum in de basale ganglia."},{"t":"2","q":"Op een afbeelding van het limbisch systeem zie je een ronde, amandelvormige kern die aan het uiteinde (vaak net voor/onder) de hippocampus ligt. Dit is de...","o":["Gyrus cingulus","Amygdala","Septum pellucidum","Olfactorische bulbus"],"a":1,"u":"Amygdala is letterlijk Latijn voor' amandel'. Deze zit vast aan het uiteinde van de hippocampus."},{"t":"2","q":"Waar bevinden de colliculi superiores en colliculi inferiores (corpora quadrigemina) zich exact?","o":["Op het ventrale oppervlak van de medulla.","Op het dorsale oppervlak van de pons.","Op het dorsale oppervlak van het mesencephalon (het Tectum).","Aan de onderkant van de thalamus."],"a":2,"u":"Het tectum (' dak') is het achterste/dorsale deel van de middenhersenen, waarop de 4 heuveltjes (colliculi superiores en inferiores) liggen."}],"theory":[{"h":"Evolutie & gedragsgenetica","items":["Natuurlijke selectie: proces waarbij overerfbare eigenschappen die in een context samenhangen met meer nakomelingen vaker gaan voorkomen.","Verwantenselectie: evolutieproces waarbij niet individuen maar genen worden geselecteerd, doordat ook voor- of nadeel voor verwanten meetelt.","Seksuele selectie: selectie op kenmerken die je aantrekkelijkheid voor seksuele partners vergroten, zelfs als die kenmerken onhandig zijn.","Gedragsgenetica: de leer van de overerfbaarheid van gedrag, een discipline met een beladen reputatie door onder meer eugenetica.","Exceptioneel brein: het menselijk brein valt op door dicht opeengepakte corticale neuronen en, voor zover geweten, het grootste aantal ervan, vooral prefrontaal.","Obstetrisch dilemma-hypothese: het idee dat een groot brein plus een door rechtop lopen versmald geboortekanaal complicaties en rijpingsvertraging veroorzaakt.","Pruning: het wegknippen van bestaande hersenverbindingen om de beste te behouden en de bedrading af te stemmen op de omgeving.","Sociale brein-hypothese: de complexiteit van het sociale leven als drijvende factor achter de vergroting van vooral de frontale cortex.","Evolutionaire psychologie: het bekijken van psychologie via processen van natuurlijke selectie, vaak met kritiek dat verklaringen niet empirisch getoetst worden.","Heritabiliteit: de mate waarin variabiliteit in een eigenschap wordt verklaard door genetische variabiliteit binnen een bepaalde groep of omgeving.","Concordantie: de mate waarin tweelingen dezelfde eigenschap vertonen, zowel voor categorische als continue kenmerken.","Formule van Falconer: heritabiliteit geschat als het verschil in concordantie tussen MZ en DZ maal twee.","Genotype en fenotype: de genetische code van een individu tegenover de observeerbare eigenschappen die uit het samenspel van genen en omgeving voortkomen.","Pleiotropie: het verschijnsel waarbij een enkel gen meerdere afzonderlijke fenotypische eigenschappen beinvloedt."]},{"h":"Structuur van het zenuwstelsel","items":["Neuraxis: denkbeeldige lengteas door het centraal zenuwstelsel, van onderaan het ruggenmerg tot vooraan de hersenen.","Centraal zenuwstelsel: de hersenen en het ruggenmerg, weefsels die door bot beschermd worden.","Perifeer zenuwstelsel: hersenzenuwen, ruggenmergzenuwen en perifere ganglia buiten het botpantser, met slechts twee vliezen en geen CSV.","Hersenvliezen: de drie beschermlagen rond hersenen en ruggenmerg, van buiten naar binnen dura mater, arachnoïde mater en pia mater.","Cerebrospinaal vocht (CSV): vloeistof in de subarachnoïdale ruimte en ventrikels die het brein laat drijven, schokken buffert en afvalstoffen afvoert.","Ventrikels: holle, verbonden kamers gevuld met CSV, met de choroïde plexus die dat vocht continu produceert.","Cortex: de ongeveer 3 mm dikke buitenlaag grijze stof met vooral cellichamen, verdeeld in gyri door de sulci.","Witte stof: verbindingen tussen neuronen die door myeline geïsoleerd zijn, waardoor signalen sneller worden doorgegeven.","Limbisch systeem: samenhangend geheel van structuren zoals hippocampus en amygdala, cruciaal voor emotie, motivatie en geheugen.","Thalamus: centraal gelegen verdeelcentrum dat zintuiginformatie (behalve geur) naar de juiste delen van de cortex doorstuurt.","Hypothalamus: cockpit van het hormoon- en autonome systeem, sturend voor homeostase, stressrespons en de vier F-en.","Hersenstam: mesencephalon, pons en medulla samen (zonder cerebellum), met kernen voor vitale functies en neuromodulatie.","Cerebellum: de kleine hersenen met twee hemisferen, klassiek voor coördinatie en evenwicht en met circa 80% van alle neuronen.","Autonoom zenuwstelsel: het onbewuste deel van het perifere zenuwstelsel met sympathische, parasympathische en enterische divisie voor homeostase."]},{"h":"Microstructuur van het zenuwstelsel","items":["Neuron: zenuwcel opgebouwd uit soma, dendrieten, axon en eindknopen, die signalen ontvangt en doorgeeft.","Dendrieten: vertakte voelertjes van het neuron die signalen van andere neuronen ontvangen.","Axon: de zender van het neuron die de elektrische boodschap in de regel in één richting vervoert.","Myelineschede: isolerende vetlaag rond het axon die de geleiding versnelt, in het CZS gevormd door oligodendrocyten en in het PZS door Schwann-cellen.","Astrocyten: stervormige gliacellen die weefsel ondersteunen, synapsen isoleren, rommel opruimen en neuronen van energie voorzien.","Bloed-breinbarrière: selectief permeabele barrière tussen bloed en CZS die het brein beschermt en het extracellulaire milieu in balans houdt.","Natrium-kaliumpomp: transmembraaneiwit dat 3 Na+ naar buiten en 2 K+ naar binnen pompt en zo indirect de negatieve rustpotentiaal opbouwt.","Rustpotentiaal: de negatieve membraanspanning van rond -70mV, vooral bepaald door het weglekken van K+ tot een evenwicht.","Actiepotentiaal: een zelfstandig opgewekte golf van elektrische ontlading over het membraan die volgens het alles-of-niets-principe verloopt.","Saltatorische conductie: springende geleiding in gemyeliniseerde axonen waarbij de actiepotentiaal enkel bij de knopen van Ranvier opnieuw wordt opgewekt.","Synaps: contactplaats tussen de eindknoop van het presynaptische neuron en het membraan van het postsynaptische neuron.","Neurotransmitter: boodschapperstof die via exocytose wordt vrijgegeven en over de synaptische spleet diffundeert om het volgende neuron te beïnvloeden.","Ionotrope receptor: eenvoudige receptor waarbij binding van de ligand rechtstreeks een ionkanaal in de receptor opent.","Metabotrope receptor: indirecte receptor die via een G-proteïne trager en langduriger een naburig ionkanaal of enzym beïnvloedt."]},{"h":"Onderzoeksmethodes","items":["Laesie-studie: het bestuderen van het verband tussen een natuurlijk voorkomend hersenletsel en het gedrag, wat correlationeel blijft.","Experimentele ablatie: het doelbewust vernietigen van hersenweefsel om causale verbanden tussen structuur en functie te onderzoeken.","Radiofrequente (RF-) laesie: methode waarbij hoogfrequente wisselstroom door een geïsoleerde elektrode alle nabijgelegen weefsel vernietigt, zowel cellichamen als axonen.","Excito-toxische laesie: infusie van een exciterend aminozuur zoals kaïnezuur die enkel cellichamen vernietigt en passerende axonen spaart, dus preciezer werkt.","Stereotactisch apparaat: toestel dat de schedel fixeert en op basis van coördinaten en referentiepunten een elektrode nauwkeurig naar de doelregio brengt.","Optogenetica: techniek bij proefdieren waarbij neuronen via virussen lichtgevoelige proteïnen aanmaken, zodat je ze met bepaald licht kunt aan- of uitzetten.","Transcraniële magnetische stimulatie (TMS): non-invasieve techniek die met magnetische pulsen door de schedel heen een regio tijdelijk exciteert of verstoort zonder weefselschade.","Targeted mutation: het inbrengen van gemuteerde genen (knock-out of knock-in) om de expressie van proteïnen te verhinderen of te stimuleren.","Histologie: weefselleer waarbij weefsel via perfusie, fixatie, versnijden en kleuring zichtbaar en bestudeerbaar wordt gemaakt.","Tracing: het volgen van axonen met merkstoffen, anterograad (efferente output, bv. PHA-L) of retrograad (afferente input, bv. fluorogold).","EEG: registratie via macro-elektrodes van de optelsom van postsynaptische potentialen van vele neuronen, met hoge temporele en lage spatiale resolutie.","ERP (event related potential): het stukje EEG-respons dat volgt op een specifieke stimulus, gedefinieerd door locatie, polariteit, timing en functionele samenhang.","MEG: registratie van de kleine magnetische veldjes die door hersenactiviteit ontstaan, met betere spatiale resolutie dan EEG maar zeer dure apparatuur.","Functionele MRI (fMRI): meting van hersenfunctie via het BOLD-signaal, een indirecte maat voor metabolisme op basis van regionale bloedtoevoer."]}],"hacks":[{"h":"De 3 O's van natuurlijke selectie","t":"Onthoud de drie voorwaarden voor natuurlijke selectie als de 3 O's: Overerving (eigenschappen gaan over op nakomelingen), Ontwikkeling van variatie (verschillen, bv. door mutatie) en Overleving via reproductie (selectie: wie meer nakomelingen krijgt). Zonder een van de drie geen selectie."},{"h":"De drie moeders (hersenvliezen)","t":"Onthoud de hersenvliezen van buiten naar binnen als 'Dikke, Spinnende, Vrome moeder': Dura mater (harde, dikke moeder buiten), Arachnoïde mater (spinnenweb in het midden) en Pia mater (vrome, dunne moeder die zich meteen rond de hersenen plooit). De volgorde D · A · P loopt van de schedel naar binnen toe."},{"h":"Anterograde vs retrograde: 'A' als in 'Away'","t":"Anterograde transport gaat van het soma weg naar de eindknoop (Away van de kern), aangedreven door kinesine. Retrograde gaat de andere kant op, terug (Retour) naar het soma, met dyneïne. Onthou: A = Away van het cellichaam, R = Retour naar het cellichaam."},{"h":"Anterograad vs. retrograad: volg de A","t":"Anterograad label je met PHA-L en volg je met de stroom mee, van soma Af naar de eindknopen (efferente output). Retrograad label je met fluorogold en ga je Retour, van de eindknopen terug naar de soma (afferente input). Onthoud: Anterograad = Af (output), Retrograad = Retour (input)."}]};
</script>

      '<div class="card pad" style="margin-top:12px"><div class="row" style="justify-content:space-between;align-items:center;gap:14px"><div><b>Rustige modus</b><div class="muted" style="font-size:12.5px">Aanmoediging en kalme sfeer. Zet uit als je liever recht-voor-z’n-raap oefent.</div></div><button class="toggle'+(calm?" on":"")+'" id="calmToggle" role="switch" aria-checked="'+(calm?"true":"false")+'" aria-label="Rustige modus aan of uit"><span class="knob"></span></button></div></div>'+
      '<div class="row" style="margin-top:16px"><button class="btn" id="beginBtn">Begin met oefenen '+ic("arrowR")+'</button></div>';
    setHTML(html);
    document.getElementById("backBtn").onclick=function(){ state.step="track"; renderHome(); window.scrollTo(0,0); };
    document.getElementById("calmToggle").onclick=function(){ calm=!calm; lset("biopsy1_calm",calm); applyCalm(); renderHerkansing(); };
    document.getElementById("beginBtn").onclick=function(){ state.step="practice"; renderHome(); window.scrollTo(0,0); };
  }

  function renderPractice(){
    var herk=state.track==="herkansing";
    var html=
      '<button class="backlink" id="backBtn">'+ic("back")+'Terug</button>'+
      '<div class="modebanner'+(herk?" v":"")+'">'+ic(herk?"heart":"book")+'<span>'+modeLabel()+'</span><button type="button" class="bnlink" id="changeMode">wijzig</button></div>'+
      '<div class="seclabel">'+ic("rocket")+'Waarmee wil je oefenen?</div>'+
      '<div class="grid g2">'+
        '<button class="mode" data-mode="quiz"><span class="me">'+ic("target")+'</span><b>Oefenvragen</b><small>Meerkeuze met directe feedback en uitleg. Kies je onderwerpen.</small></button>'+
        '<button class="mode" id="quickStart"><span class="me">'+ic("rocket")+'</span><b>Snelle ronde</b><small>15 willekeurige vragen uit alle onderwerpen.</small></button>'+
      '</div>';
    setHTML(html);
    document.getElementById("backBtn").onclick=function(){ if(state.fromHub){ location.href="https://beriesexamspace.github.io/"; return; } state.step=(herk?"herkansing":"track"); renderHome(); window.scrollTo(0,0); };
    document.getElementById("changeMode").onclick=function(){ if(state.fromHub){ location.href="https://beriesexamspace.github.io/"; return; } state.step="track"; renderHome(); window.scrollTo(0,0); };
    document.querySelector('[data-mode="quiz"]').onclick=function(){ go("quiz"); };
    document.getElementById("quickStart").onclick=function(){ state.view="quiz"; tabBtns.forEach(function(b){b.classList.toggle("on",b.dataset.view==="quiz");}); startQuiz(shuffle(D.questions.slice()).slice(0,15)); window.scrollTo(0,0); };
  }

  function renderQuizGate(){
    if(state.quiz) return renderQuiz();
    var s=state.sel;
    function pool(){ return D.questions.filter(function(q){return s.topics[q.t];}); }
    var html='<div class="card pad"><h2 style="text-align:center;margin-top:0">Oefenvragen</h2>'+
      '<p class="muted" style="text-align:center">Kies onderwerpen en het aantal vragen. Na elk antwoord krijg je meteen feedback én de uitleg.</p>'+
      '<label class="fld">Onderwerpen</label><div class="chips" id="tps">'+
        Object.keys(TOPICS).map(function(k){return '<button class="chip'+(s.topics[k]?" on":"")+'" data-tp="'+k+'">'+esc(TOPICS[k])+'</button>';}).join("")+'</div>'+
      '<label class="fld">Aantal vragen</label><div class="chips" id="cnt">'+
        [10,15,20,999].map(function(n){return '<button class="chip'+(s.count===n?" on":"")+'" data-n="'+n+'">'+(n===999?"Alle":n)+'</button>';}).join("")+'</div>'+
      '<label class="fld">Volgorde van de vragen</label><div class="chips" id="ord">'+'<button class="chip'+(s.shuffle?" on":"")+'" data-sh="1">Door elkaar</button>'+'<button class="chip'+(s.shuffle?"":" on")+'" data-sh="0">Op volgorde</button>'+'</div>'+
      '<div class="row" style="margin-top:18px"><button class="btn" id="startQ">Start '+ic("arrowR")+'</button><span class="muted" id="poolN"></span></div></div>';
    setHTML(html);
    function refresh(){ var n=pool().length; document.getElementById("poolN").textContent=n+" vragen beschikbaar"; document.getElementById("startQ").disabled=n===0; }
    [].slice.call(document.querySelectorAll("#tps .chip")).forEach(function(b){ b.onclick=function(){ s.topics[b.dataset.tp]=!s.topics[b.dataset.tp]; b.classList.toggle("on"); refresh(); }; });
    [].slice.call(document.querySelectorAll("#cnt .chip")).forEach(function(b){ b.onclick=function(){ s.count=+b.dataset.n; renderQuizGate(); }; });
    [].slice.call(document.querySelectorAll("#ord .chip")).forEach(function(b){ b.onclick=function(){ s.shuffle=b.dataset.sh==="1"; [].slice.call(document.querySelectorAll("#ord .chip")).forEach(function(x){x.classList.toggle("on",x===b);}); }; });
    document.getElementById("startQ").onclick=function(){ var p=pool(); if(s.shuffle)p=shuffle(p); if(s.count<p.length)p=p.slice(0,s.count); startQuiz(p); };
    refresh();
  }

  function startQuiz(items){ bump("berat-biopsy1", state.track==="herkansing"?"herkansing":"training"); state.quiz={items:items.map(function(q){return {q:q,opts:shuffle(q.o.map(function(t,i){return {text:t,ok:i===q.a};}))};}), picks:[], idx:0, answered:false, picked:-1, correct:0, wrong:[], done:false}; renderQuiz(); }

  function renderQuiz(){
    var Q=state.quiz; if(Q.done) return renderResult();
    var cur=Q.items[Q.idx], q=cur.q; if(!Q.picks)Q.picks=[]; if(Q.picks[Q.idx]!=null){Q.answered=true;Q.picked=Q.picks[Q.idx];}else{Q.answered=false;Q.picked=-1;}
    var html='<button class="backlink" id="backBtn">'+ic("back")+'Terug</button>'+
      '<div class="card pad">'+
      '<div class="runtop"><span class="pill">'+esc(TOPICS[q.t])+'</span><div class="bar"><i data-w="'+pct(Q.idx,Q.items.length)+'"></i></div><span>'+(Q.idx+1)+'/'+Q.items.length+'</span></div>'+
      '<div class="qtext">'+esc(q.q)+'</div>'+
      '<div id="opts">'+cur.opts.map(function(o,i){return '<button class="opt" data-i="'+i+'" style="--oi:'+(i*55)+'ms"><span class="k">'+String.fromCharCode(65+i)+'</span><span>'+esc(o.text)+'</span></button>';}).join("")+'</div>'+
      '<div id="fb"></div>'+
      '<div class="row" style="justify-content:space-between;margin-top:6px"><div class="row" style="gap:10px;align-items:center">'+(Q.idx>0?'<button class="btn ghost" id="prevBtn">'+ic("back")+'Vorige</button>':'')+'<span class="muted" style="font-size:12px">Toets <span class="kbd">A–D</span> · <span class="kbd">Enter</span> = volgende</span></div><button class="btn hide" id="nextBtn">Volgende '+ic("arrowR")+'</button></div></div>';
    setHTML(html);
    var tl=document.querySelector("b[data-telop]");
    if(tl){ var doel=+tl.getAttribute("data-telop")||0;
      var stil=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if(stil||doel<=0){ tl.textContent=doel; }
      else { tl.textContent=0; var t0=null, duur=900;
        requestAnimationFrame(function stap(ts){ if(t0===null)t0=ts;
          var p=Math.min(1,(ts-t0)/duur), e=1-Math.pow(1-p,3);
          tl.textContent=Math.round(doel*e);
          if(p<1) requestAnimationFrame(stap); else tl.textContent=doel; }); } }
    var i2=document.querySelector(".bar>i"); requestAnimationFrame(function(){ if(i2) i2.style.width=i2.getAttribute("data-w")+"%"; });
    document.getElementById("backBtn").onclick=function(){ state.quiz=null; renderQuizGate(); };
    var optBtns=[].slice.call(document.querySelectorAll("#opts .opt"));
    var nb=document.getElementById("nextBtn"); nb.onclick=next; var pb=document.getElementById("prevBtn"); if(pb)pb.onclick=function(){ if(Q.idx>0){ Q.idx--; renderQuiz(); } };
    function showAnswered(i){
      optBtns.forEach(function(b){ var bi=+b.dataset.i; b.disabled=true; if(cur.opts[bi].ok)b.classList.add("correct"); else if(bi===i)b.classList.add("wrong"); });
      var ok=cur.opts[i].ok, fb=document.getElementById("fb"); fb.className="feedback "+(ok?"ok":"no");
      var juist=cur.opts.filter(function(o){return o.ok;})[0].text;
      fb.innerHTML=ok?"<b>"+rnd(PRAISE)+" ✓</b>":"<b>"+wrongLead()+"</b><span class=\"sub\">Juiste antwoord: "+esc(juist)+"</span>";
      var w=document.createElement("div"); w.innerHTML='<div class="whybox"><h4>'+ic("sparkles")+'Waarom?</h4>'+esc(q.u)+'</div>'; fb.appendChild(w);
      nb.classList.remove("hide"); nb.innerHTML=(Q.idx+1>=Q.items.length)?"Bekijk resultaat "+ic("arrowR"):"Volgende "+ic("arrowR");
    }
    function pick(i){ if(Q.answered)return; Q.answered=true; Q.picked=i; Q.picks[Q.idx]=i; var ok=cur.opts[i].ok; if(ok)Q.correct++; else Q.wrong.push(q); recordProg(q.id, ok); showAnswered(i); nb.focus(); }
    optBtns.forEach(function(b){ b.onclick=function(){ pick(+b.dataset.i); }; });
    function next(){ if(!Q.answered)return; Q.idx++; Q.answered=false; Q.picked=-1; if(Q.idx>=Q.items.length)Q.done=true; renderQuiz(); }
    if(Q.answered) showAnswered(Q.picked);
    state.key=function(e){ if(!Q.answered){ var k=e.key.toLowerCase(); var idx="abcde".indexOf(k); if(idx<0&&/[1-5]/.test(k))idx=+k-1; if(idx>=0&&idx<cur.opts.length){pick(idx);e.preventDefault();} } else if(e.key==="Enter"||e.key===" "){ next(); e.preventDefault(); } };
  }

  function renderResult(){
    var Q=state.quiz, p=pct(Q.correct,Q.items.length);
    var msg=p>=80?"Sterk werk! 🎉":p>=60?"Goed bezig 👍":"Blijf oefenen, je komt er 💪";
    var html='<div class="card pad results center"><span class="pill">Biologische Psychologie I</span><div class="big">'+p+'%</div>'+
      '<p style="font-weight:600;margin:0 0 4px;font-size:17px">'+msg+'</p><p class="muted">'+Q.correct+' van '+Q.items.length+' juist</p>'+
      '<div class="row" style="justify-content:center;margin-top:14px">'+
        (Q.wrong.length?'<button class="btn" id="retry">Herhaal '+Q.wrong.length+' foute vragen</button>':'')+
        '<button class="btn ghost" id="again">Nieuwe ronde</button><button class="btn ghost" id="home">Naar start</button></div></div>';
    setHTML(html);
    var rt=document.getElementById("retry"); if(rt) rt.onclick=function(){ startQuiz(shuffle(Q.wrong)); };
    document.getElementById("again").onclick=function(){ state.quiz=null; renderQuizGate(); };
    document.getElementById("home").onclick=function(){ state.quiz=null; go("home"); };
    state.key=null;
  }

  function renderTheory(){
    var q=state.sumq||"";
    var html='<div class="card pad" style="margin-bottom:14px"><h2 style="text-align:center;margin:0 0 8px">Theorie en samenvatting</h2>'+
      '<input type="search" id="sq" placeholder="Zoek een begrip… (bv. neuron, synaps, natuurlijke selectie)" value="'+esc(q)+'"></div><div id="list">'+theoryList(q)+'</div>';
    setHTML(html);
    var si=document.getElementById("sq"); si.oninput=function(){ state.sumq=si.value; document.getElementById("list").innerHTML=theoryList(si.value); si.focus(); };
  }
  function theoryList(query){
    var Q=query.trim().toLowerCase(), out="", n=0;
    D.theory.forEach(function(sec){
      var items=sec.items.filter(function(it){ return !Q || it.toLowerCase().indexOf(Q)>=0 || sec.h.toLowerCase().indexOf(Q)>=0; });
      if(!items.length) return; n++;
      out+='<details class="acc"'+(Q?" open":(n===1?" open":""))+'><summary><span class="n">'+ic("search")+'</span>'+esc(sec.h)+ic("chevR","caret")+'</summary><div class="body"><ul>'+items.map(function(it){return '<li>'+hl(esc(it),Q)+'</li>';}).join("")+'</ul></div></details>';
    });
    return out||'<p class="muted center">Geen resultaten voor "'+esc(query)+'".</p>';
  }
  function hl(t,q){ if(!q)return t; try{ return t.replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>"); }catch(e){ return t; } }

  function renderHacks(){
    var html='<div class="card pad" style="margin-bottom:16px"><h2 style="text-align:center;margin:0 0 6px">Studie-hacks</h2><p class="muted" style="text-align:center;margin:0">Ezelsbruggetjes om de kernideeën van biologische psychologie I te onthouden.</p></div>'+
      '<div class="tipgrid">'+D.hacks.map(function(t){return '<div class="tip"><h4>'+ic("bulb")+esc(t.h)+'</h4><p>'+esc(t.t)+'</p></div>';}).join("")+'</div>';
    setHTML(html);
  }

  function renderFeedback(){
    var html='<div class="card pad"><h2 style="text-align:center;margin-top:0">Feedback &amp; klachten</h2>'+
      '<p class="muted" style="text-align:center">Fout in een vraag, een idee, of werkt iets niet? Laat het hier weten, het komt rechtstreeks bij de maker terecht. Een review of compliment mag ook: de mooiste tonen we op de hub. 💬</p>'+
      '<label class="fld" for="fbMsg">Je bericht</label><textarea id="fbMsg" rows="3" placeholder="Beschrijf de fout of je idee…"></textarea>'+
      '<div class="fbextra"><div class="fbveld fbwaar"><label class="fld" for="fbWaar">Over welke vraag? <span class="muted">(optioneel)</span></label><input type="text" id="fbWaar" placeholder="bv. de vraag over de p-waarde"></div>'+
      '<div class="fbveld"><label class="fld" for="fbNaam">Je naam <span class="muted">(optioneel)</span></label><input type="text" id="fbNaam" placeholder="zodat we je kunnen bedanken"></div>'+
      '<div class="fbveld"><label class="fld" for="fbEmail">Je e-mail <span class="muted">(optioneel, als je een antwoord wilt)</span></label><input type="email" id="fbEmail" placeholder="naam@voorbeeld.be"></div></div>'+
      '<input type="text" id="fbBot" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0">'+
      '<div class="row" style="margin-top:16px;align-items:center"><button class="btn" id="fbSend">'+ic("send")+'Versturen</button><span id="fbStatus" style="font-size:13px"></span></div></div>';
    setHTML(html);
    document.getElementById("fbSend").onclick=function(){
      var status=document.getElementById("fbStatus");
      if(document.getElementById("fbBot").value) return;
      var msg=document.getElementById("fbMsg").value.trim();
      if(!msg){ status.style.color="var(--bad)"; status.textContent="Schrijf eerst een bericht."; return; }
      var btn=document.getElementById("fbSend"); btn.disabled=true; status.style.color="var(--muted)"; status.textContent="Versturen…";
      var em=document.getElementById("fbEmail").value.trim();
      var nm=document.getElementById("fbNaam").value.trim();
      var waar=document.getElementById("fbWaar").value.trim();
      var payload={_subject:"Biologische Psychologie I-tool: feedback", _template:"table", _captcha:"false",
        Naam:nm||"-", Over_welke_vraag:waar||"-", email:em||"-", Bericht:msg};
      if(em) payload._replyto=em;
      // vangnet: als de verzenddienst blokkeert (bv. spamfilter) of er is geen verbinding,
      // bieden we een directe mailto-knop aan zodat de melding NOOIT stilletjes verdwijnt.
      function failFallback(reden){
        var body="Feedback Biologische Psychologie I-tool%0D%0A%0D%0ANaam: "+encodeURIComponent(nm||"-")+"%0D%0AOver welke vraag: "+encodeURIComponent(waar||"-")+"%0D%0AE-mail: "+encodeURIComponent(em||"-")+"%0D%0A%0D%0ABericht:%0D%0A"+encodeURIComponent(msg);
        var mailto="mailto:berat007yildirim@gmail.com?subject="+encodeURIComponent("Biologische Psychologie I-tool: feedback")+"&body="+body;
        setHTML('<div class="card pad"><h2 style="margin-top:0">Automatisch versturen lukte niet</h2><p class="muted">'+reden+' Geen zorgen, klik hieronder en je melding wordt geopend in je e-mail, helemaal klaar om te versturen:</p><a class="btn" href="'+mailto+'">'+ic("send")+'Mail mijn melding direct</a><div style="margin-top:14px"><button class="btn ghost" id="bk">Terug naar start</button></div></div>');
        document.getElementById("bk").onclick=function(){go("home");};
      }
      fetch("https://formsubmit.co/ajax/Berat007yildirim@gmail.com",{method:"POST",headers:{Accept:"application/json"},body:new URLSearchParams(payload)})
        .then(function(r){return r.json();}).then(function(d){
          if(d&&(d.success===true||d.success==="true")){ setHTML('<div class="card pad results center"><div style="font-size:42px">✅</div><h2 style="margin:6px 0">Bedankt!</h2><p class="muted">Je melding is verstuurd.</p><button class="btn" id="bk" style="margin-top:8px">Terug naar start</button></div>'); document.getElementById("bk").onclick=function(){go("home");}; }
          else { failFallback("Het automatisch versturen lukte niet."); }
        }).catch(function(){ failFallback("Er was even geen verbinding."); });
    };
  }

  document.addEventListener("keydown",function(e){ if(state.key) state.key(e); });
  // bezoeker tellen (1x per toestel)
  try{ if(!localStorage.getItem("biopsy1_seen")){ localStorage.setItem("biopsy1_seen","1"); bump("berat-biopsy1","gebruikers"); } }catch(e){ bump("berat-biopsy1","gebruikers"); }
  // traject vanuit de hub overnemen → direct naar de oefenpagina
  try{ var _q=new URLSearchParams(location.search); var _m=_q.get("m");
    if(_m==="training"||_m==="herkansing"){ state.track=_m; lset("biopsy1_track",_m);
      var _c=_q.get("calm"); if(_c!=null){ calm=(_c!=="0"); lset("biopsy1_calm",calm); applyCalm(); }
      state.step="practice"; state.fromHub=true; }
  }catch(e){}
  render();
  // launch-splash netjes laten verdwijnen
  (function(){ var _sp=document.getElementById("splash"); if(!_sp) return; var _red=false; try{_red=window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){} setTimeout(function(){ _sp.classList.add("hide"); setTimeout(function(){ if(_sp&&_sp.parentNode) _sp.parentNode.removeChild(_sp); }, 700); }, _red?300:1850); })();
})();
</script>
<script>
/* gedeelde interactie: klik-animatie en zacht openschuivende theorieblokken */
(function(){
  // Elk theorieblok krijgt precies een wikkel-element, anders klapt een blok met
  // meerdere kinderen niet volledig dicht (MBG had er tien).
  function wikkel(){
    var lijst=document.querySelectorAll(".acc>.body");
    for(var i=0;i<lijst.length;i++){
      var b=lijst[i];
      if(b.children.length===1 && b.firstElementChild && b.firstElementChild.className==="bes-wrap") continue;
      var w=document.createElement("div"); w.className="bes-wrap";
      while(b.firstChild) w.appendChild(b.firstChild);
      b.appendChild(w);
    }
  }
  var gepland=false;
  function planWikkel(){ if(gepland)return; gepland=true; setTimeout(function(){ gepland=false; wikkel(); },0); }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",wikkel); else wikkel();
  try{ new MutationObserver(planWikkel).observe(document.documentElement,{childList:true,subtree:true}); }catch(e){}
  var KLIK="button,.btn,.iconbtn,.opt,.track,.chrow,.backlink,.chip,.mode,.toggle,.scard,.ccard,.qcard,.srclink,.bnlink,.navlink,.ycard,.excat,.brandstrip,summary";
  document.addEventListener("pointerdown",function(e){
    var el=(e.target&&e.target.closest)?e.target.closest(KLIK):null; if(!el)return;
    el.classList.remove("bes-klik"); void el.offsetWidth; el.classList.add("bes-klik");
    setTimeout(function(){ el.classList.remove("bes-klik"); },260);
  },true);
  document.addEventListener("click",function(e){
    var s=(e.target&&e.target.closest)?e.target.closest("details.acc>summary"):null; if(!s)return;
    var d=s.parentNode; if(!d) return;
    e.preventDefault();
    if(d.open){
      d.classList.add("bes-dicht");
      setTimeout(function(){ d.open=false; d.classList.remove("bes-dicht"); },250);
    } else {
      d.open=true; d.classList.add("bes-open");
      var los=function(){ d.classList.remove("bes-open"); };
      requestAnimationFrame(function(){ requestAnimationFrame(los); });
      setTimeout(los,400);
    }
  },false);
})();
</script>
