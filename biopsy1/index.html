<!DOCTYPE html>
<html lang="nl">
<head>

<style>
  :root{
    --bg:#f4f2ee; --bg2:#ebe8e2; --card:#ffffff; --ink:#1b232c; --muted:#5d6873;
    --line:#e2ddd4; --accent:#0f6e6a; --accent-ink:#0b4f4c; --accent-soft:#dcefed;
    --amber:#c9821f; --amber-soft:#f7ecd9; --violet:#6d5bd0; --violet-soft:#e9e6fa;
    --good:#1f8a4c; --good-soft:#e2f3e8; --bad:#c23b54; --bad-soft:#fbe5ea;
    --shadow:0 1px 2px rgba(20,30,40,.05),0 6px 18px rgba(20,30,40,.05);
    --shadow-lg:0 2px 6px rgba(20,30,40,.06),0 18px 40px rgba(20,30,40,.10);
    --r:14px; --r-lg:20px; --ease:cubic-bezier(.2,.8,.2,1);
  }
  html[data-theme="dark"]{
    --bg:#11151a; --bg2:#161b22; --card:#1b222b; --ink:#e7ecf1; --muted:#9aa6b2;
    --line:#2a323c; --accent:#3fb9b2; --accent-ink:#7fd6d0; --accent-soft:#163230;
    --amber:#e0a64a; --amber-soft:#2e2515; --violet:#a99cf0; --violet-soft:#221d3a;
    --good:#46c178; --good-soft:#16301f; --bad:#ef6b82; --bad-soft:#331620;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 2px 8px rgba(0,0,0,.4),0 22px 48px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;letter-spacing:-.01em}
  button,a{font-family:inherit;cursor:pointer;color:inherit}
  .wrap{max-width:880px;margin:0 auto;padding:0 18px 96px}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
  .ic{width:1.25em;height:1.25em;flex:none;vertical-align:-.18em;stroke:currentColor;stroke-width:1.75;
    stroke-linecap:round;stroke-linejoin:round;fill:none}

  header.top{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(160%) blur(16px);-webkit-backdrop-filter:saturate(160%) blur(16px);box-shadow:inset 0 -1px 0 0 rgba(0,0,0,.04)}
  .topin{max-width:880px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:700}
  .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,var(--accent),var(--accent-ink));
    color:#fff;display:grid;place-items:center;font-family:Georgia,serif;font-weight:700;font-size:16px;flex:none;
    box-shadow:0 2px 6px rgba(15,110,106,.35)}
  .brand small{display:block;font-weight:500;color:var(--muted);font-size:11px}
  .spacer{flex:1}
  .iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:38px;
    padding:7px 11px;font-size:13.5px;display:inline-flex;gap:7px;align-items:center;text-decoration:none;
    transition:border-color .2s var(--ease),transform .12s var(--ease)}
  .iconbtn:hover{border-color:var(--accent)} .iconbtn:active{transform:scale(.96)}
  nav.tabs{display:flex;gap:2px;overflow:auto;max-width:880px;margin:0 auto;padding:6px 12px 0;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{border:none;background:none;color:var(--muted);padding:10px 13px;border-radius:9px 9px 0 0;
    font-size:14px;font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px;transition:color .2s var(--ease)}
  nav.tabs button .ic{width:16px;height:16px}
  nav.tabs button.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
  nav.tabs button:hover{color:var(--ink)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:20px}
  .muted{color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
  .pill.amber{background:var(--amber-soft);color:var(--amber)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;gap:14px}
  @media(min-width:620px){.g2{grid-template-columns:1fr 1fr}}

  .hero{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin:20px 0 8px}
  .count{flex:none;background:linear-gradient(150deg,var(--accent),var(--accent-ink));color:#fff;border-radius:var(--r);padding:14px 20px;text-align:center;min-width:118px;box-shadow:0 8px 20px rgba(15,110,106,.28)}
  .count b{font-family:Georgia,serif;font-size:32px;display:block;line-height:1}
  .count span{font-size:12px;opacity:.92}
  .herotext h1{margin:0 0 4px;font-size:25px}
  .herotext p{margin:0;color:var(--muted)}

  .brandstrip{display:flex;align-items:center;gap:13px;width:100%;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 16px;margin:14px 0 2px;box-shadow:var(--shadow);transition:border-color .2s var(--ease),transform .15s var(--ease)}
  .brandstrip:hover{border-color:var(--accent);transform:translateY(-1px)}
  .brandstrip .bs-logo{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:17px;background:linear-gradient(145deg,var(--accent),var(--accent-ink))}
  .brandstrip .bs-txt{flex:1;min-width:0} .brandstrip .bs-txt b{display:block;font-size:14.5px} .brandstrip .bs-txt small{color:var(--muted);font-size:12.5px}
  .brandstrip .bs-go{color:var(--accent-ink);flex:none;display:inline-flex} .brandstrip .bs-go .ic{width:18px;height:18px}

  .seclabel{display:flex;align-items:center;gap:8px;margin:24px 0 12px;font-weight:700;font-size:15px}
  .seclabel .ic{width:18px;height:18px;color:var(--accent-ink)}
  .backlink{display:inline-flex;align-items:center;gap:5px;border:none;background:none;color:var(--muted);font-size:13.5px;font-weight:600;padding:6px 0;margin-bottom:4px;transition:color .2s var(--ease)}
  .backlink:hover{color:var(--accent-ink)} .backlink .ic{width:16px;height:16px}
  .tracks{display:grid;gap:14px} @media(min-width:600px){.tracks{grid-template-columns:1fr 1fr}}
  .track{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);transition:transform .22s var(--ease),border-color .22s var(--ease),box-shadow .22s var(--ease)}
  .track:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow-lg)} .track:active{transform:translateY(-1px) scale(.995)}
  .track .tile{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;margin-bottom:4px;background:linear-gradient(150deg,var(--accent),var(--accent-ink))}
  .track.alt .tile{background:linear-gradient(150deg,var(--violet),#4f40a8)} .track .tile .ic{width:24px;height:24px}
  .track b{font-size:18px} .track small{color:var(--muted);font-size:13.5px;line-height:1.5}
  .track .go{margin-top:6px;display:inline-flex;align-items:center;gap:6px;color:var(--accent-ink);font-weight:600;font-size:13.5px} .track.alt .go{color:var(--violet)} .track .go .ic{width:16px;height:16px}
  .toggle{width:48px;height:28px;border-radius:999px;border:none;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s var(--ease)}
  .toggle .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s var(--ease)}
  .toggle.on{background:var(--violet)} .toggle.on .knob{left:23px}
  .warmcard{border-color:var(--violet)!important;background:var(--violet-soft)} .warmcard .ic{width:22px;height:22px;color:var(--violet);flex:none}
  .modebanner{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:11px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent-ink);font-size:13.5px;font-weight:600}
  .modebanner.v{background:var(--violet-soft);color:var(--violet)} .modebanner .ic{width:18px;height:18px} .modebanner a,.modebanner .bnlink{margin-left:auto;font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;color:inherit;border:none;background:none;font-family:inherit;padding:0}
  html.snappy .card,html.snappy .mode,html.snappy .tip,html.snappy .track{animation-duration:.12s!important}
  .mode{display:flex;flex-direction:column;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:17px;gap:7px;box-shadow:var(--shadow);transition:transform .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease)}
  .mode:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .mode .me{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)} .mode .me .ic{width:22px;height:22px}
  .mode b{font-size:16px} .mode small{color:var(--muted);font-size:13px}

  label.fld{display:block;font-size:13px;font-weight:600;margin:16px 0 7px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;min-height:38px;padding:7px 13px;font-size:13.5px;transition:all .18s var(--ease)}
  .chip:hover{border-color:var(--accent)} .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:11px;min-height:46px;padding:12px 20px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;box-shadow:0 4px 12px rgba(15,110,106,.25);transition:background .2s var(--ease),transform .12s var(--ease)}
  .btn:hover{background:var(--accent-ink)} .btn:active{transform:scale(.97) translateY(1px)} .btn .ic{width:18px;height:18px}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none} .btn.ghost:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  input[type=search],input[type=text],input[type=email],textarea{font-family:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
  input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .runtop{display:flex;align-items:center;gap:12px;margin:2px 0 14px;font-size:13px;color:var(--muted)}
  .bar{height:8px;border-radius:6px;background:var(--bg2);overflow:hidden;flex:1}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .7s var(--ease)}
  .qtext{font-size:19px;font-weight:600;margin:8px 0 16px;font-family:Georgia,serif;line-height:1.45}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px 15px;margin-bottom:10px;font-size:15px;transition:border-color .15s var(--ease),background .15s var(--ease),transform .12s var(--ease)}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)} .opt:active:not(:disabled){transform:scale(.99)}
  .opt .k{flex:none;width:27px;height:27px;border-radius:8px;background:var(--bg2);color:var(--muted);display:grid;place-items:center;font-weight:700;font-size:13px}
  .opt.correct{border-color:var(--good);background:var(--good-soft)} .opt.correct .k{background:var(--good);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default}
  .feedback{border-radius:12px;padding:13px 15px;margin:4px 0 12px;font-size:14.5px}
  .feedback.ok{background:var(--good-soft);color:var(--good)} .feedback.no{background:var(--bad-soft);color:var(--bad)}
  .feedback b{font-weight:700} .feedback .sub{display:block;margin-top:3px;color:var(--ink);font-weight:500;opacity:.92}
  .whybtn{border:1px solid var(--line);background:var(--card);color:var(--accent-ink);border-radius:10px;min-height:40px;padding:9px 14px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:border-color .2s var(--ease),background .2s var(--ease)}
  .whybtn:hover{border-color:var(--accent);background:var(--accent-soft)} .whybtn .ic{width:16px;height:16px}
  .whybox{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:14px 16px;margin:12px 0 4px;font-size:14px;line-height:1.55}
  .whybox h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent-ink);font-family:system-ui;display:flex;align-items:center;gap:7px}
  .whybox .ic{width:16px;height:16px}

  .acc{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
  .acc>summary{padding:15px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:11px}
  .acc>summary::-webkit-details-marker{display:none}
  .acc>summary .n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
  .acc>summary .caret{margin-left:auto;color:var(--muted);transition:transform .25s var(--ease)} .acc[open]>summary .caret{transform:rotate(90deg)}
  .acc[open]>summary{border-bottom:1px solid var(--line)} .acc .body{padding:6px 18px 16px}
  .acc h4{margin:14px 0 6px;font-size:13px;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.4px;font-family:system-ui}
  .acc ul{margin:0;padding-left:20px} .acc li{margin:6px 0;font-size:14.5px;line-height:1.5}
  .acc.hack li::marker{content:"💡  "} .acc.hack>summary .n{background:var(--violet-soft);color:var(--violet)}
  mark{background:var(--amber-soft);color:inherit;padding:0 2px;border-radius:3px}

  .tip{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}
  .tip h4{margin:0 0 5px;font-size:14.5px;display:flex;align-items:center;gap:8px;font-family:system-ui} .tip h4 .ic{width:18px;height:18px;color:var(--violet)}
  .tip p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}
  .tipgrid{display:grid;gap:12px} @media(min-width:620px){.tipgrid{grid-template-columns:1fr 1fr}}

  .results .big{font-family:Georgia,serif;font-size:54px;text-align:center;margin:8px 0;line-height:1}
  .center{text-align:center} .hide{display:none!important}
  footer{margin-top:34px;text-align:center;color:var(--muted);font-size:13px}
  .kbd{font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--muted)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.03)}100%{transform:scale(1)}}
  @keyframes optIn{from{opacity:0;transform:translateX(-9px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: no-preference){
    .card,.mode,.tip{animation:fadeUp .34s var(--ease) both}
    .acc{animation:fadeUp .32s var(--ease) both}
    .opt{animation:optIn .3s var(--ease) backwards;animation-delay:var(--oi,0s)}
    .chip.on{animation:pop .22s var(--ease)}
    .feedback{animation:slideIn .26s var(--ease) both} .whybox{animation:slideIn .28s var(--ease) .07s both} .opt.correct{animation:pop .34s var(--ease)}
  }
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  /* ---- Premium launch (Gemini-stijl) + header-logo gloed ---- */
  @property --bes-a{syntax:'<angle>';initial-value:0deg;inherits:false}
  #splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(125% 125% at 50% 38%,var(--bg2) 0%,var(--bg) 68%);transition:opacity .6s var(--ease),transform .7s var(--ease)}
  #splash.hide{opacity:0;transform:scale(1.07);pointer-events:none}
  .sp-inner{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
  .sp-mark{position:relative;width:100px;height:100px;display:grid;place-items:center}
  .sp-mark::before{content:"";position:absolute;inset:-16px;border-radius:34px;z-index:0;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));filter:blur(17px);opacity:.75}
  .sp-mark::after{content:"";position:absolute;inset:-3px;border-radius:27px;z-index:1;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));padding:3px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .sp-logo{position:relative;z-index:2;width:92px;height:92px;border-radius:24px;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:46px;background:linear-gradient(150deg,var(--accent),var(--accent-ink));box-shadow:0 14px 38px rgba(15,110,106,.4)}
  .sp-spark{position:absolute;z-index:3;top:-7px;right:-7px;width:30px;height:30px;color:#fff;filter:drop-shadow(0 2px 7px rgba(0,0,0,.35))}
  .sp-name{position:relative;font-family:Georgia,serif;font-size:26px;font-weight:700;letter-spacing:-.01em;color:var(--ink);overflow:hidden}
  .sp-name::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(-130%)}
  .sp-tag{font-size:13px;color:var(--muted);margin-top:-8px;letter-spacing:.03em}
  @media (prefers-reduced-motion: no-preference){
    .sp-mark::before{animation:bes-spin 3s linear infinite,bes-breathe 2.4s var(--ease) infinite}
    .sp-mark::after{animation:bes-spin 3s linear infinite}
    .sp-logo{animation:bes-pop .7s var(--ease) both}
    .sp-spark{animation:bes-pop .6s var(--ease) .12s both,bes-twinkle 1.9s var(--ease) .9s infinite}
    .sp-name{animation:bes-rise .6s var(--ease) .14s both}
    .sp-name::after{animation:bes-shimmer 1.5s var(--ease) .5s 1}
    .sp-tag{animation:bes-rise .6s var(--ease) .26s both}
  }
  @keyframes bes-spin{to{--bes-a:360deg}}
  @keyframes bes-breathe{0%,100%{opacity:.55;filter:blur(16px)}50%{opacity:.95;filter:blur(22px)}}
  @keyframes bes-shimmer{to{transform:translateX(130%)}}
  @keyframes bes-twinkle{0%,100%{opacity:1;transform:scale(1) rotate(0deg)}50%{opacity:.65;transform:scale(.82) rotate(18deg)}}
  @keyframes bes-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  /* mobiel: header-knoppen alleen iconen zodat niks zijwaarts overflowt */
  @media(max-width:440px){ header.top .iconbtn span{display:none} header.top .iconbtn{padding:7px 9px;min-width:38px;justify-content:center} .topin{gap:8px} }
</style>
</head>
<body>
<div id="splash"><div class="sp-inner">
  <div class="sp-mark">
    <div class="sp-logo">B1</div>
    <svg class="sp-spark" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.5c.4 4.6 2.4 6.6 7 7-4.6.4-6.6 2.4-7 7-.4-4.6-2.4-6.6-7-7 4.6-.4 6.6-2.4 7-7Z"/></svg>
  </div>
  <div><div class="sp-name">Biologische Psychologie I</div><div class="sp-tag">slim oefenen voor je examen</div></div>
</div></div>
<header class="top">
  <div class="topin">

<script>
window.BP1 = {"questions":[{"t":"1","q":"Welke drie grondvoorwaarden zijn volgens de tekst nodig om natuurlijke selectie te laten plaatsvinden?","o":["Mutatie, migratie en genetische drift","Overerving, variatie en selectie","Concordantie, heritabiliteit en pleiotropie","Genotype, fenotype en expressie"],"a":1,"u":"Natuurlijke selectie vereist overerfbare eigenschappen (overerving), variabiliteit in die eigenschappen (variatie) en een samenhang tussen bepaalde eigenschappen en groter reproductief succes (selectie)."},{"t":"1","q":"Waarom is 'survival of the fittest' volgens de bron een misleidende omschrijving van natuurlijke selectie?","o":["Omdat selectie enkel op groepsniveau werkt en niet op individuen","Omdat niet per se de sterkste of slimste wordt geselecteerd, maar wie in een context meer nakomelingen krijgt","Omdat selectie in werkelijkheid de individuen kiest die het langst overleven, los van hoeveel nakomelingen ze krijgen","Omdat selectie alleen bij dieren en niet bij mensen optreedt"],"a":1,"u":"De tekst benadrukt dat selectie niet per se de sterkste of slimste betreft; 'natuurlijke selectie' is beter, want het gaat om eigenschappen die in een bepaalde context samenhangen met groter reproductief succes."},{"t":"1","q":"Een steriele werkster bij de honingbij krijgt zelf geen nakomelingen, maar helpt verwanten. Welk begrip verklaart dit het best?","o":["Seksuele selectie","Verwantenselectie","Pleiotropie","Obstetrisch dilemma"],"a":1,"u":"Bij verwantenselectie gaat het niet om selectie van individuen maar van genen; het voor- of nadeel voor verwanten telt mee, wat het altruisme van steriele werksters verklaart."},{"t":"1","q":"De onhandig grote staart van een pauw wordt in de tekst gebruikt als voorbeeld van welk proces?","o":["Verwantenselectie","Rijpingsvertraging","Seksuele selectie","Pruning"],"a":2,"u":"Bij seksuele selectie word je geselecteerd op kenmerken die je aantrekkelijkheid voor seksuele partners vergroten, zelfs als die kenmerken 'onhandig' zijn, zoals de pauwenstaart."},{"t":"1","q":"Wat verklaart volgens de bron waarom gedragsgenetica een 'kwalijke reputatie' heeft?","o":["Omdat het gebruik van tweelingstudies wetenschappelijk verboden is","Omdat het een racistische mantel kan hebben, met een negatieve ondertoon via onder meer eugenetica","Omdat vroegere onderzoekers deelnemers zonder toestemming in adoptiestudies opnamen en zo de privacy van gezinnen schonden","Omdat het aantoont dat omgeving geen enkele rol speelt"],"a":1,"u":"De tekst noemt dat de leer van de overerfbaarheid van gedrag een racistische mantel kan hebben, met een sterke negatieve ondertoon via onder andere eugenetica."},{"t":"1","q":"Waarom is het menselijk brein volgens de tekst 'exceptioneel', ondanks dat het niet de grootste massa heeft?","o":["Omdat het de grootste relatieve massa heeft ten opzichte van het lichaamsgewicht","Omdat het als enige brein een cortex met zes lagen bezit, wat bij alle andere zoogdieren volledig ontbreekt","Omdat het, voor zover geweten, het grootste aantal corticale neuronen heeft, in het bijzonder prefrontaal","Omdat het als enige brein postnataal blijft groeien"],"a":2,"u":"De potvis heeft meer massa en de olifant meer neuronen, maar de mens heeft (voor zover geweten) het grootste aantal corticale neuronen, vooral prefrontaal, en die zitten dicht op elkaar."},{"t":"1","q":"Wat is volgens de tekst de betekenis van de 'rimpeligheid' (groeven) van het brein?","o":["Hoe rimpeliger, hoe meer cortex, wat belangrijk is voor cognitieve functies","Rimpeligheid bepaalt rechtstreeks de absolute breinmassa","Groeven ontstaan pas na de geboorte door leren en weerspiegelen dus vooral de opgedane ervaring","Rimpeligheid staat los van cognitie en is enkel esthetisch"],"a":0,"u":"De rimpeligheid vergroot de buitenste laag (cortex of schors), die belangrijk is voor cognitieve functies; hoe rimpeliger, hoe meer cortex."},{"t":"1","q":"Volgens de obstetrisch dilemma-hypothese ontstaan er complicaties bij de bevalling door een combinatie van twee factoren. Welke?","o":["Een groot brein en een breed geboortekanaal","Een groot brein en een bekken dat versmalde door het klimmen in bomen","Een groot brein en een versmald geboortekanaal door het rechtop lopen","Snelle rijping van het brein en een grote schedel"],"a":2,"u":"Het rechtop lopen versmalt het geboortekanaal, terwijl het grote brein een grotere schedel vereist; die combinatie geeft complicaties en verklaart mee de rijpingsvertraging."},{"t":"1","q":"Wat houdt 'pruning' in de context van de breinontwikkeling in?","o":["Het aanmaken van nieuwe steuncellen na de geboorte","Het wegknippen van bestaande verbindingen om de beste te behouden","Het versnellen van de rijping van de prefrontale cortex","Het koken van voedsel om meer energie voor het brein vrij te maken"],"a":1,"u":"Pruning is het terug wegknippen van bestaande connecties; er worden 'te veel' verbindingen aangemaakt om vervolgens de beste te behouden, waardoor bedrading afgestemd raakt op omgeving en ervaring."},{"t":"1","q":"In welke volgorde verloopt het snoeien (pruning) volgens de tekst door het brein?","o":["Van vooraan naar achteraan, met de prefrontale cortex eerst","Van achteraan naar vooraan, met de prefrontale cortex het laatst","Gelijktijdig in het hele brein binnen de eerste twee jaar","Enkel in de prefrontale cortex, al vanaf de geboorte"],"a":1,"u":"Pruning gebeurt in het hele brein van achteraan naar vooraan, waarbij de prefrontale cortex in de late adolescentie het laatst aan de beurt is; die is cruciaal voor sociaal functioneren en zelfregulatie."},{"t":"1","q":"Wat stelt de sociale brein-hypothese?","o":["Dat de complexiteit van het sociale leven een drijvende factor is achter de vergroting van vooral de frontale cortex","Dat een groter brein vooral ontstond door het koken van voedsel","Dat het brein vooral groeide doordat soorten zich in steeds grotere groepen tegen roofdieren moesten verdedigen","Dat paarvormende soorten altijd een kleinere cortex hebben"],"a":0,"u":"Volgens de sociale brein-hypothese is de complexiteit van het sociale leven een belangrijke drijvende factor achter de vergroting van vooral de frontale cortex; bij primaten voorspelt de groepsgrootte het corticale volume."},{"t":"1","q":"Wat is een belangrijke kritiek op de evolutionaire psychologie volgens de bron?","o":["Dat ze elke culturele invloed op gedrag onmogelijk acht en cultuur dus buiten haar model houdt","Dat verklaringen vaak 'maar verhalen' zijn die niet empirisch getoetst kunnen worden","Dat ze uitsluitend op tweelingstudies steunt","Dat ze het bestaan van natuurlijke selectie verwerpt"],"a":1,"u":"De kritiek is dat een evolutionair perspectief vaak als verklaring wordt gehanteerd zonder dat het empirisch getoetst kan worden, waardoor het 'maar verhalen' blijven, zoals bij geslachtsverschillen in partnerkeuze."},{"t":"1","q":"Wat wordt bedoeld met de 'overschatting van adaptiviteit'?","o":["Het idee dat evolutie altijd trager verloopt dan gedacht","Het idee dat alle kenmerken een functie hebben of het gevolg zijn van adaptieve evolutie","Het idee dat adoptiestudies de erfelijkheid overschatten","Het idee dat organismen zich doelbewust aanpassen en die verworven kenmerken daarna doorgeven"],"a":1,"u":"De overschatting van adaptiviteit is het idee dat alle kenmerken of trekken een functie hebben of het gevolg zijn van adaptieve evolutie, wat een valkuil vormt binnen het evolutionaire perspectief."},{"t":"1","q":"Hoe wordt heritabiliteit (erfelijkheid) in de tekst gedefinieerd?","o":["De mate waarin een eigenschap door de opvoeding wordt bepaald","De mate waarin variabiliteit in een eigenschap verklaard wordt door genetische variabiliteit, in een bepaalde omgeving of groep","De mate waarin een eigenschap volledig vastligt bij de geboorte en dus niet meer door training of omgeving veranderd kan worden","De kans dat een eigenschap op elk individu van toepassing is"],"a":1,"u":"Heritabiliteit is de mate waarin variabiliteit in een eigenschap wordt verklaard door genetische variabiliteit, steeds gemeten in een bepaalde omgeving of groep."},{"t":"1","q":"Wat is het genetische verschil tussen monozygotische en dizygotische tweelingen?","o":["Monozygotische delen ongeveer 75% van hun genen omdat ze uit dezelfde eicel maar uit verschillende zaadcellen ontstaan","Monozygotische zijn genetisch identiek, dizygotische delen ongeveer 50% net als gewone broers of zussen","Beide zijn genetisch identiek maar hebben een verschillend geslacht","Dizygotische zijn genetisch identiek, monozygotische delen 50%"],"a":1,"u":"Monozygotische tweelingen komen uit een gesplitste bevruchte eicel en zijn genetisch identiek; dizygotische ontstaan uit twee bevruchte eicellen en delen ongeveer 50%, net als andere broers of zussen."},{"t":"1","q":"Volgens de formule van Falconer is de heritabiliteit gelijk aan (concordantie MZ min concordantie DZ) maal twee. Als de concordantie voor IQ bij MZ 0,86 is en bij DZ 0,60, wat is dan de heritabiliteit?","o":["26%","86%","52%","60%"],"a":2,"u":"(0,86 min 0,60) maal 2 is gelijk aan 0,52, dus een heritabiliteit van 52%; de x2 is nodig omdat MZ-tweelingen de helft van hun genoom extra delen ten opzichte van DZ."},{"t":"1","q":"Wat betekent het dat een eigenschap 'polygenetisch' bepaald is?","o":["Dat een enkel gen meerdere afzonderlijke eigenschappen beinvloedt","Dat een fenotypische eigenschap door meerdere, mogelijk honderden genen wordt bepaald","Dat meerdere kopieën van hetzelfde gen samen bepalen hoe sterk een eigenschap tot uiting komt","Dat de eigenschap volledig door de omgeving wordt bepaald"],"a":1,"u":"Polygenetisch betekent dat een fenotypische eigenschap wordt bepaald door meerdere genen; voor complexe eigenschappen kunnen mogelijk honderden genen relevant zijn."},{"t":"1","q":"Wat is het verschil tussen de strategie 'genotype eerst' (kandidaat-gen) en 'fenotype eerst' (GWAS)?","o":["Bij genotype eerst vergelijk je het hele genoom van groepen, bij GWAS vertrek je van een enkel bekend gen","Bij genotype eerst vertrek je van een kandidaat-gen met bekende functie, bij GWAS vergelijk je het hele genoom van groepen met een bepaald kenmerk","Beide strategieën vertrekken van het fenotype, maar genotype eerst gebruikt dierenmodellen terwijl GWAS zich beperkt tot menselijke deelnemers","GWAS vertrekt van een kandidaat-gen en genotype eerst van het fenotype"],"a":1,"u":"Bij 'genotype eerst' start je van een kandidaat-gen met enigszins bekende functie; bij GWAS keer je de volgorde om en vergelijk je het hele genoom van groepen met een bepaald fenotype om samenhangende variatie te detecteren."},{"t":"2","q":"Wat is de neuraxis?","o":["Een denkbeeldige lijn die door de lengte van het centraal zenuwstelsel loopt, van onderaan het ruggenmerg tot vooraan de hersenen","De harde buitenste laag van de hersenvliezen","Het holle kanaal in het midden van het ruggenmerg","De bundel zenuwvezels die de linker- en rechterhersenhelft met elkaar verbindt en zo informatie tussen beide zijden overbrengt"],"a":0,"u":"De neuraxis is de denkbeeldige lengteas door het CZS, lopend van onderaan het ruggenmerg tot vooraan de hersenen."},{"t":"2","q":"Iemand beschrijft een structuur die 'aan de rugkant' ligt. Welke term hoort daarbij?","o":["Ventraal","Dorsaal","Rostraal","Mediaal"],"a":1,"u":"Dorsaal betekent rugkant, terwijl ventraal de buikkant aanduidt."},{"t":"2","q":"Wat betekent het als twee structuren zich 'contralateraal' tot elkaar verhouden?","o":["Ze liggen dicht bij het middenvlak","Ze liggen aan dezelfde kant","Ze liggen aan de tegenovergestelde kant","Ze liggen ver van het midden van het zenuwstelsel"],"a":2,"u":"Contralateraal betekent aan de tegenovergestelde kant; ipsilateraal is juist aan dezelfde kant."},{"t":"2","q":"Welke onderdelen behoren tot het centraal zenuwstelsel?","o":["Hersenzenuwen en ruggenmergzenuwen","Perifere ganglia en hersenzenuwen","Hersenen en ruggenmerg","Gladde spieren en klieren"],"a":2,"u":"Het centraal zenuwstelsel bestaat uit de hersenen en het ruggenmerg, weefsels die door bot beschermd worden. Hersenzenuwen en ganglia horen bij het perifere zenuwstelsel."},{"t":"2","q":"Waarom is het brein zo sterk afhankelijk van een continue bloedtoevoer?","o":["Omdat het brein zwaar is en veel bloed nodig heeft om te drijven","Omdat het weinig glucose kan opslaan en niet anaeroob kan verbranden","Omdat het brein voortdurend nieuwe neuronen aanmaakt","Omdat de hersenvliezen constant vernieuwd worden"],"a":1,"u":"Het brein slaat weinig glucose op en kan geen anaerobe verbranding gebruiken, waardoor het continu bloed en dus zuurstof en brandstof nodig heeft."},{"t":"2","q":"Welke van de hersenvliezen is de dikke en stugge buitenste laag?","o":["Pia mater","Arachnoïde mater","Dura mater","Choroïde plexus"],"a":2,"u":"De dura mater ('harde moeder') is de dikke, stugge buitenste laag van de drie hersenvliezen."},{"t":"2","q":"Waar bevindt zich het cerebrospinaal vocht dat het brein laat 'drijven'?","o":["In de subarachnoïdale ruimte tussen arachnoïde en pia mater","Tussen de dura mater en de schedel","In de witte stof van de cortex","In de subdurale ruimte tussen de dura mater en de arachnoïde"],"a":0,"u":"Het cerebrospinaal vocht zit in de subarachnoïdale ruimte tussen de arachnoïde en de pia mater en zorgt er onder meer voor dat het brein drijft."},{"t":"2","q":"Welk weefsel staat in voor de continue productie van cerebrospinaal vocht?","o":["De radiale glia","De choroïde plexus","De massa intermedia","De reticulaire formatie"],"a":1,"u":"De choroïde plexus produceert het cerebrospinaal vocht continu; het totale volume wordt meermaals per dag vervangen."},{"t":"2","q":"Bij een lumbaalpunctie wordt de naald bewust onder L3 geprikt. Wat is daarvan de reden?","o":["Omdat de zenuwwortels onder L3 geen pijnprikkels meer kunnen doorgeven aan de hersenen","Omdat het ruggenmerg rond L2 eindigt en er lager enkel losse zenuwbundels zitten","Omdat de ventrikels daar het dichtst bij de huid liggen","Omdat de choroïde plexus zich daar bevindt"],"a":1,"u":"Het ruggenmerg eindigt rond L2; daaronder liggen de zenuwen in een losse bundel (cauda equina), zodat een prik onder L3 het ruggenmerg zelf niet raakt."},{"t":"2","q":"Tijdens de vroege embryonale ontwikkeling: uit welke van de drie kiemlagen ontwikkelt het zenuwstelsel zich?","o":["Het mesoderm","Het endoderm","De neurale buis","Het ectoderm"],"a":3,"u":"Het zenuwstelsel ontwikkelt zich uit de bovenste kiemlaag, het ectoderm, vanaf ongeveer de derde week na conceptie."},{"t":"2","q":"Tot welke drie primaire hersendelen groeien de rostrale kamers van de neurale buis uit?","o":["Voorhersenen, middenhersenen en achterhersenen","Grote hersenen, kleine hersenen en hersenstam","Telencephalon, pons en medulla","Tectum, tegmentum en hersenstam"],"a":0,"u":"De rostrale kamers vormen de grote driedeling: voorhersenen (prosencephalon), middenhersenen (mesencephalon) en achterhersenen (rhombencephalon)."},{"t":"2","q":"Welke rol spelen radiale glia tijdens de ontwikkeling van de cortex?","o":["Ze produceren cerebrospinaal vocht","Ze vormen een soort ladder waarlangs neuronen naar de oppervlakte migreren","Ze trekken de uitgroeiende axonen met chemische signalen naar hun doelgebied toe","Ze breken overbodige neuronen af via apoptose"],"a":1,"u":"Radiale glia zijn steuncellen waarvan de vezels als een ladder dienen waarlangs neuronen naar de buitenkant van de cortex migreren."},{"t":"2","q":"Wat gebeurt er met neuronen die tijdens de ontwikkeling geen geschikte contacten vinden?","o":["Ze migreren opnieuw naar de ventriculaire zone","Ze worden gemyeliniseerd","Ze sterven af","Ze veranderen in radiale glia"],"a":2,"u":"Bij de geboorte zijn er ongeveer 50% meer neuronen dan uiteindelijk nodig; neuronen zonder geschikte contacten sterven terug af."},{"t":"2","q":"Waarom heeft de witte stof in het brein een witachtige kleur?","o":["Door de myeline die de verbindingen isoleert","Door de cellichamen die er dicht opeen liggen","Door het cerebrospinaal vocht dat er doorheen loopt","Door de piramidale cellen in laag vijf"],"a":0,"u":"De witte stof bestaat uit verbindingen die door myeline geïsoleerd zijn; die isolatielaag geeft de witachtige kleur en versnelt signaaloverdracht."},{"t":"2","q":"Iemand met schade aan de visuele associatiecortex kan objecten wel zien maar niet meer identificeren. Hoe heet dit?","o":["Anterograde amnesie","Blindheid","Visuele agnosie","Tactiele agnosie"],"a":2,"u":"Visuele agnosie is het onvermogen om objecten te identificeren terwijl het basale perceptuele vermogen gespaard blijft."},{"t":"2","q":"Wat houdt somatotopie in?","o":["Naburige delen van de auditieve cortex verwerken nabijgelegen toonhoogtes","Naburige delen van de somatosensorische cortex verwerken nabijgelegen delen van het lichaam","Naburige delen van de visuele cortex verwerken nabijgelegen delen van het netvlies","Beide hemisferen verwerken dezelfde informatie tegelijk"],"a":1,"u":"Somatotopie betekent dat aangrenzende delen van de somatosensorische (of motorische) cortex betrokken zijn bij aangrenzende delen van het lichaam."},{"t":"2","q":"Wat verbindt de linker- en rechterhemisfeer met elkaar, vooral tussen gelijkaardige gebieden?","o":["De fornix","Het corpus callosum","De massa intermedia","De reticulaire formatie"],"a":1,"u":"Het corpus callosum is de grootste bundel verbindingen tussen de twee hemisferen, vooral tussen homologe (gelijkaardige) gebieden."},{"t":"2","q":"Volgens het triune brain-model van MacLean komt het limbisch systeem overeen met welke laag?","o":["Het rationele mensenbrein","Het emotionele zoogdierenbrein","Het instinctieve reptielenbrein","Het rationele neocorticale brein"],"a":1,"u":"In het drievoudig brein-model staat het limbisch systeem voor het 'zoogdierenbrein', het emotionele brein, tussen neocortex en reptielenbrein."},{"t":"2","q":"Welke functie wordt vooral toegeschreven aan de hippocampus?","o":["Detecteren van dreiging en angst","Vloeiend en geautomatiseerd bewegen","Consolidatie van declaratief langetermijngeheugen","Herkennen van vertrouwde gezichten en gezichtsuitdrukkingen"],"a":2,"u":"De hippocampus speelt een cruciale rol in het geheugen, met name de consolidatie van declaratief langetermijngeheugen; bilaterale schade geeft anterograde amnesie."},{"t":"2","q":"Welke structuur wordt vooral in verband gebracht met angst en het detecteren van dreiging?","o":["De amygdala","De thalamus","De nucleus accumbens","Het cerebellum"],"a":0,"u":"De amygdala wordt vooral gelinkt aan negatieve emotie, met name angst, en aan het detecteren van dreiging en onzekerheid."},{"t":"2","q":"Welke rol vervult de thalamus binnen het diencephalon?","o":["Regelen van honger, dorst en lichaamstemperatuur via hormonen","Belangrijkste verdeelcentrum of schakelstation naar de cortex","Productie van dopamine voor het beloningssysteem","Coördinatie van evenwicht en postuur"],"a":1,"u":"De thalamus is het centraal gelegen verdeelcentrum dat informatie van vrijwel alle zintuigen (behalve geur) naar de juiste delen van de cortex doorstuurt."},{"t":"2","q":"Welk deel van het autonome zenuwstelsel mobiliseert de reserves in noodsituaties, met een verhoogde hartslag en verwijde pupillen?","o":["Het parasympathische zenuwstelsel","Het enterische zenuwstelsel","Het sympathische zenuwstelsel","Het somatische zenuwstelsel"],"a":2,"u":"Het sympathische zenuwstelsel 'gaat in het rood': het verhoogt hartslag en ademhaling, verwijdt de pupillen en legt de spijsvertering stil om reserves te mobiliseren."},{"t":"2","q":"Welke functies horen bij de prefrontale cortex?","o":["Het doorgeven van impulsen naar de spieren","Planning, strategie, inhibitie en werkgeheugen","Het verwerken van tast, pijn, temperatuur en lichaamshouding","Het herkennen van klanken en spraak"],"a":1,"u":"De prefrontale cortex staat in voor de executieve functies. De primaire motorische cortex geeft impulsen door aan de spieren, en de premotorische cortex programmeert complexe bewegingen."},{"t":"2","q":"Wat doet de premotorische cortex?","o":["Ze stuurt de spieren rechtstreeks aan via de piramidebaan","Ze verwerkt voortdurend waar je ledematen zich in de ruimte bevinden","Ze programmeert complexe bewegingen voor ze uitgevoerd worden","Ze regelt de aanmaak van dopamine in de hersenstam"],"a":2,"u":"De premotorische cortex bereidt bewegingen voor. Het uitvoeren zelf gebeurt via de primaire motorische cortex, die vooraan in de frontale kwab ligt."},{"t":"2","q":"In welke kwab ligt de primaire somatosensorische cortex, die tast, pijn, temperatuur en lichaamspositie verwerkt?","o":["De frontale kwab","De temporale kwab","De occipitale kwab","De pariëtale kwab"],"a":3,"u":"De pariëtale kwab ligt boven- en achteraan in de cortex en verwerkt de somatosensorische informatie, inclusief proprioceptie: weten waar je lichaam zich bevindt."},{"t":"2","q":"Iemand heeft schade aan de temporale kwab. Welke primaire cortex komt dan het eerst in gevaar?","o":["De auditieve cortex","De visuele cortex","De motorische cortex","De somatosensorische cortex"],"a":0,"u":"De primaire auditieve cortex ligt in de temporale kwab, aan de zijkant van het brein. Het zicht zit achteraan in de occipitale kwab."},{"t":"2","q":"Welke structuur ligt diep weggestopt onder de opercula en is betrokken bij smaak, pijn, walging en lichaamsbewustzijn?","o":["De amygdala","De insula","De gyrus cingulus","De thalamus"],"a":1,"u":"De insula ligt verscholen onder de temporale en pariëtale opercula. Ze speelt zelfs een rol bij morele walging, niet enkel bij walging van smaak of geur."},{"t":"2","q":"Waar ligt de gyrus cingulus?","o":["Op de vloer van de laterale ventrikels","Diep onder de temporale opercula","Als een rand boven het corpus callosum","Boven op de hersenstam, centraal in het brein"],"a":2,"u":"De gyrus cingulus loopt als een boog boven de hersenbalk. Op de vloer van de laterale ventrikels ligt de hippocampus, en boven op de hersenstam ligt de thalamus."},{"t":"2","q":"Welk deel van de gyrus cingulus wordt vooral in verband gebracht met depressie?","o":["Het posterieure deel","Het ventraal-anterieure deel","Het laterale deel","Het deel dat tegen de insula aanligt"],"a":1,"u":"Het ventraal-anterieure deel is kritisch bij depressie. Het posterieure deel wordt vooral met geheugen in verband gebracht."},{"t":"2","q":"Welke kern van de basale voorhersenen geldt als het beloningscentrum en speelt een sleutelrol bij genot en verslaving?","o":["Het septum nuclei","De globus pallidus","De substantia nigra","De nucleus accumbens"],"a":3,"u":"De nucleus accumbens hoort bij de basale voorhersenen en is nauw betrokken bij beloning, genot en verslavingsprocessen."},{"t":"2","q":"Waarvoor zijn het septum nuclei en de kern van Meynert vooral belangrijk?","o":["Voor het vloeiend maken van bewegingen via dopamine","Voor waakzaamheid, slaapregulatie en leren via acetylcholine","Voor het verdelen van zintuiglijke informatie over de cortex","Voor het aanmaken van hormonen in het endocriene systeem"],"a":1,"u":"Deze kernen van de basale voorhersenen maken acetylcholine aan. Dat is de reden waarom ze meespelen bij alertheid, slaap en leren."},{"t":"2","q":"Wat is de belangrijkste taak van de basale ganglia?","o":["Vitale functies zoals hartslag en ademhaling regelen","Het geheugen omzetten in langetermijngeheugen","Corticale activiteit integreren en motoriek automatiseren","Zintuiglijke prikkels van alle zintuigen naar de juiste cortex doorsturen"],"a":2,"u":"Het striatum en de globus pallidus zorgen via motorische, cognitieve en emotionele lussen voor vloeiend en gecoördineerd bewegen dat je niet bewust hoeft te sturen."},{"t":"2","q":"De thalamus verdeelt zintuiglijke informatie naar de cortex. Welk zintuig gaat daar NIET eerst langs?","o":["De reuk","Het gehoor","Het zicht","De tast"],"a":0,"u":"Geur is de uitzondering: reukinformatie bereikt de cortex zonder eerst via de thalamus te passeren. Alle andere zintuigen gaan wel langs dat verdeelcentrum."},{"t":"2","q":"Welke structuur stuurt het endocriene systeem en het autonoom zenuwstelsel aan, en regelt honger, dorst, slaap en de stressrespons?","o":["De thalamus","De hypothalamus","De medulla oblongata","De gyrus cingulus"],"a":1,"u":"De hypothalamus wordt de cockpit van het hormoonsysteem genoemd. Ze regelt de homeostase en de vier F-en: fight, flight, freeze en voortplanting."},{"t":"2","q":"Wat is de functie van de superieure colliculi in het tectum?","o":["Ze geven gehoorinformatie door aan de primaire auditieve cortex in de temporale kwab","Ze vormen een primitief visueel systeem dat aandacht richt op beweging","Ze sturen de ademhaling tijdens de slaap aan","Ze maken dopamine aan voor het beloningssysteem"],"a":1,"u":"De superieure colliculi zorgen onder meer voor automatische aandacht voor beweging. De inferieure colliculi horen bij het auditieve systeem."},{"t":"2","q":"Welke structuren in het tegmentum produceren dopamine en zijn belangrijk voor beloning en motoriek?","o":["De colliculi en het PAG","De pons en de medulla oblongata","Het striatum en de globus pallidus","Het VTA en de substantia nigra"],"a":3,"u":"Het ventrale tegmentale gebied en de substantia nigra liggen aan de buikzijde van de middenhersenen en zijn de belangrijkste dopaminebronnen."},{"t":"2","q":"Waarbij speelt de periaquaductale grijze stof (PAG) een rol?","o":["Bij automatische bewegingen en lichaamseigen pijnstilling","Bij het opslaan van ruimtelijke herinneringen","Bij het regelen van vitale functies zoals bloeddruk en spijsvertering","Bij het programmeren van fijne handbewegingen"],"a":0,"u":"Het PAG ligt in het tegmentum en zorgt onder meer voor pijndemping door het lichaam zelf, naast automatische bewegingspatronen."},{"t":"2","q":"Naast evenwicht, timing en gecoördineerd bewegen wordt het cerebellum ook omschreven als","o":["het verdeelcentrum dat alle zintuiglijke informatie over de cortex spreidt","een hulpcomputer bij hogere cognitieve functies en taal","de zetel van het expliciete geheugen","het centrum voor de vier F-en"],"a":1,"u":"De kleine hersenen doen meer dan motoriek alleen. Ze ondersteunen ook cognitieve processen en taal, vandaar het beeld van een hulpcomputer."},{"t":"2","q":"Waar kruisen de grote motorische banen, de piramides, elkaar?","o":["In de pons","In het cerebellum","In de medulla oblongata","In het ruggenmerg"],"a":2,"u":"De kruising gebeurt in de medulla oblongata, de overgang van de hersenstam naar het ruggenmerg. Daardoor stuurt de linkerhemisfeer de rechterlichaamshelft aan."},{"t":"2","q":"Bij welke structuur horen kernen voor ademhaling, bloeddruk, hartslag en spijsvertering?","o":["Het cerebellum","De pons","De thalamus","De medulla oblongata"],"a":3,"u":"De medulla oblongata regelt vitale functies. De pons zit er vlak boven en speelt vooral mee bij slaap, arousal en ademhaling."},{"t":"2","q":"Waarom trek je je hand al van een hete pan weg voor je brein er iets aan doet?","o":["Het ruggenmerg handelt die reflex zelf af","De medulla oblongata onderschept het signaal","De thalamus stuurt het rechtstreeks naar de spieren","Het cerebellum neemt de beweging over"],"a":0,"u":"Het ruggenmerg is zelf verantwoordelijk voor reflexen. De stijgende banen brengen de informatie pas daarna naar het brein."},{"t":"3","q":"Wat is de belangrijkste functie van de mitochondriën in een cel?","o":["Het opslaan van genetische informatie in chromosomen","Het omzetten van voedingsstoffen in ATP als bruikbare brandstof","Het afbreken van afvalstoffen en versleten onderdelen van de cel","Het isoleren van axonen met een myelineschede"],"a":1,"u":"Mitochondriën spelen een cruciale rol in de energiehuishouding en zetten voedingsstoffen om in ATP, een direct bruikbare brandstof voor de cel."},{"t":"3","q":"Op welke stelling over mitochondriaal DNA is de bron gebaseerd?","o":["Mitochondriën bevatten in de regel enkel moederlijk DNA uit de eicel","Mitochondriaal DNA komt gelijk van beide ouders","De cel maakt mitochondriën volledig zelf aan zonder eigen DNA","Mitochondriaal DNA zit opgeslagen in de celkern"],"a":0,"u":"Mitochondriën bezitten eigen DNA en reproduceren zichzelf; ze bevatten in de regel enkel moederlijk mitochondriaal DNA afkomstig uit de eicel."},{"t":"3","q":"Een neuron ontvangt signalen van andere neuronen. Welk onderdeel is hiervoor het meest verantwoordelijk?","o":["Het axon","De eindknopen","De dendrieten","De myelineschede"],"a":2,"u":"Dendrieten (van dendron, boom) zijn de voelertjes die communicatie en signalen van andere neuronen ontvangen."},{"t":"3","q":"Wat verstaat men onder axoplasmatisch transport?","o":["Het transport van stoffen langs microtubuli tussen soma en zenuwuiteinden, dat energie kost","Het voortbewegen van de actiepotentiaal langs het axon door opeenvolgende stromen van natrium en kalium","De vrijgave van neurotransmitters in de synaptische spleet","De heropname van neurotransmitters door de presynaptische cel"],"a":0,"u":"Axoplasmatisch transport is een actief proces dat energie kost, waarbij eiwitten en stoffen via het cytoskelet (microtubuli) tussen soma en zenuwuiteinden worden vervoerd."},{"t":"3","q":"Welke gliacel vormt in het centrale zenuwstelsel de myelineschede rond axonen?","o":["Astrocyten","Microglia","Schwann-cellen","Oligodendrocyten"],"a":3,"u":"Oligodendrocyten ondersteunen axonen en vormen in het CZS de myelineschede; één oligodendrocyt maakt ongeveer 50 segmenten."},{"t":"3","q":"Wat is een belangrijk verschil tussen Schwann-cellen en oligodendrocyten?","o":["Schwann-cellen omhullen enkel de dendrieten, terwijl oligodendrocyten uitsluitend axonen van myeline voorzien","Elke Schwann-cel vormt slechts één myeline-segment, terwijl één oligodendrocyt er meerdere maakt","Schwann-cellen doen aan fagocytose van glucose","Oligodendrocyten kunnen beschadigde axonen herstellen via buizen"],"a":1,"u":"Schwann-cellen zitten in het PZS en vormen elk één myeline-segment, terwijl één oligodendrocyt in het CZS ongeveer 50 segmenten vormt."},{"t":"3","q":"Waarom kleurt een injectie van blauwe kleurstof wel de meeste weefsels, maar niet het centrale zenuwstelsel?","o":["Omdat de hersenvliezen een gesloten laag vormen waar geen enkele stof uit het bloed doorheen kan geraken","Omdat de bloed-breinbarrière selectief permeabel is en de kiertjes tussen haarvaatcellen daar ontbreken","Omdat de kleurstof door astrocyten wordt opgegeten","Omdat het CZS enkel via lactaat en niet via bloed bevoorraad wordt"],"a":1,"u":"De bloed-breinbarrière is selectief permeabel; de kleine kiertjes tussen de cellen van haarvaatjes ontbreken in het CZS, waardoor de kleurstof het CZS niet bereikt."},{"t":"3","q":"In rusttoestand is de membraanpotentiaal van een neuron ongeveer -70mV. Welke factor draagt hier het sterkst aan bij?","o":["De grote permeabiliteit voor K+, waardoor kalium blijft weglekken tot een evenwicht ontstaat","De directe bijdrage van de natrium-kaliumpomp aan de negatieve lading","Het voortdurend openstaan van voltage-afhankelijke Na+ kanalen","De negatief geladen eiwitten in de cel die het membraan niet kunnen passeren en zo de rustwaarde volledig bepalen"],"a":0,"u":"Het membraan is het meest permeabel voor K+; kalium lekt weg door diffusie tot de opgebouwde elektrostatische druk de diffusie uitmiddelt, rond -70mV."},{"t":"3","q":"Wat doet de natrium-kaliumpomp precies?","o":["Ze duwt 2 Na+ naar buiten in ruil voor 3 K+ naar binnen","Ze duwt 3 Na+ naar buiten in ruil voor 2 K+ naar binnen","Ze laat Ca2+ binnenstromen om vesikels te doen fuseren","Ze breekt neurotransmitters af in de synaptische spleet"],"a":1,"u":"De natrium-kaliumpomp is een transmembraaneiwit dat voortdurend 3 Na+ ionen naar buiten duwt in ruil voor 2 K+ ionen naar binnen, wat veel energie kost."},{"t":"3","q":"Wat gebeurt er meteen nadat de drempelpotentiaal (rond -50mV) wordt bereikt?","o":["De K+ kanalen openen eerst en zorgen voor hyperpolarisatie","De membraanpotentiaal keert direct terug naar de rustwaarde","De voltage-afhankelijke Na+ kanalen openen en Na+ stroomt binnen, wat snelle depolarisatie geeft","De Ca2+ kanalen in het membraan openen en calcium stroomt binnen, wat de depolarisatie op gang brengt"],"a":2,"u":"Bij het bereiken van de drempel openen de voltage-afhankelijke Na+ kanalen; de influx van Na+ zorgt voor een snelle depolarisatie tot ongeveer +40mV."},{"t":"3","q":"Het 'alles of niets'-principe van de actiepotentiaal betekent dat...","o":["de grootte van de actiepotentiaal afhangt van hoe sterk de prikkel is","de actiepotentiaal onderweg langs het axon geleidelijk kleiner wordt naarmate hij verder van het soma raakt","de actiepotentiaal bij het overschrijden van de drempel altijd even groot is en zich tot het uiteinde voortzet","de frequentie geen enkele rol speelt bij de sterkte van een spiercontractie"],"a":2,"u":"Zodra de drempel bereikt wordt, treedt de actiepotentiaal op als een kettingreactie tot het uiteinde van het axon en blijft altijd precies even groot."},{"t":"3","q":"Hoe wordt de intensiteit van een prikkel, zoals fel licht of een sterke spiercontractie, in het zenuwstelsel weergegeven?","o":["Door een langere duur van elke afzonderlijke actiepotentiaal","Door de frequentie van actiepotentialen (rate law)","Door tragere saltatorische conductie","Door meer myeline op het axon"],"a":1,"u":"Volgens de rate law (wet van frequentie) is de frequentie van actiepotentialen doorslaggevend; een sneller vurend neuron geeft bijvoorbeeld een sterkere contractie."},{"t":"3","q":"Waarom verloopt de geleiding in gemyeliniseerde axonen sneller via saltatorische conductie?","o":["Omdat de actiepotentiaal onder de myeline actief wordt opgewekt","Omdat de passieve geleiding door het gemyeliniseerde segment snel gaat en de actiepotentiaal enkel bij de knopen van Ranvier opnieuw wordt getriggerd","Omdat de myelineschede zelf de elektrische stroom versterkt en het signaal daardoor bij elke knoop van Ranvier met een hogere snelheid vertrekt","Omdat de Na-K pompen langs het hele axon extra hard werken"],"a":1,"u":"Onder de myelinesegmenten is het axon impermeabel voor Na+; de snelle passieve geleiding overbrugt het segment en bij elke knoop van Ranvier wordt een nieuwe actiepotentiaal getriggerd."},{"t":"3","q":"Wat kenmerkt een metabotrope receptor in vergelijking met een ionotrope receptor?","o":["Ze opent een ionkanaal dat rechtstreeks in de receptor zelf zit","Ze werkt sneller en kortduriger dan een ionotrope receptor","Ze activeert een G-proteïne en heeft tragere, langduriger en veelzijdiger effecten","Ze bindt uitsluitend neuropeptiden, terwijl ionotrope receptoren klassieke neurotransmitters herkennen"],"a":2,"u":"Bij metabotrope receptoren zit het ionkanaal niet in de receptor zelf; de binding activeert een G-proteïne, wat trager, langduriger en veelzijdiger effecten geeft dan enkel postsynaptische potentialen."},{"t":"3","q":"Een geneesmiddel zoals Prozac (een SSRI) blokkeert de heropname van serotonine. Wat is het gevolg volgens de bron?","o":["De presynaptische cel maakt daardoor meer serotonine aan, waardoor er bij elke prikkel grotere hoeveelheden vrijkomen","De vrijgave van serotonine uit de vesikels stopt volledig","De receptoren voor serotonine verdwijnen uit het membraan","Serotonine blijft langer in de synaptische spleet, waardoor de invloed op de postsynaptische cel toeneemt"],"a":3,"u":"Een SSRI verhindert de reuptake, waardoor er meer en langer serotonine in de spleet blijft en de invloed op de postsynaptische cel toeneemt."},{"t":"3","q":"Wat is kenmerkend voor gap junctions (elektrische synapsen)?","o":["Ze gebruiken neurotransmitters die over een spleet van 20nm diffunderen","Poortjes verbinden de intracellulaire ruimte van twee cellen, zodat ionen rechtstreeks kunnen overgaan voor zeer snelle transmissie","Ze komen enkel axo-axonisch voor en moduleren de neurotransmittervrijgave","De membranen van beide cellen raken elkaar niet, maar een elektrisch veld springt over de spleet en wekt meteen een actiepotentiaal op"],"a":1,"u":"Gap junctions zijn elektrische synapsen waarbij poortjes de intracellulaire ruimte van twee cellen verbinden, zodat ionen rechtstreeks kunnen diffunderen; dit geeft zeer snelle transmissie."},{"t":"4","q":"Wat is het kenmerkende verschil tussen een laesie-studie en experimentele ablatie?","o":["Bij een laesie-studie bestudeer je natuurlijk voorkomende letsels, terwijl je bij ablatie doelbewust weefsel vernietigt","Bij een laesie-studie vernietig je zelf weefsel, terwijl ablatie enkel natuurlijke letsels bekijkt","Beide vernietigen doelbewust weefsel, maar enkel ablatie gebeurt bij dieren","Bij een laesie-studie wordt weefsel tijdelijk uitgeschakeld met een verdovend middel, terwijl ablatie dat weefsel permanent stillegt"],"a":0,"u":"Een laesie-studie bestudeert de relatie tussen natuurlijk voorkomende letsels en gedrag, terwijl bij experimentele ablatie weefsel doelbewust wordt vernietigd."},{"t":"4","q":"Waarom is een klassieke laesie-studie eerder correlationeel dan causaal?","o":["Omdat de schade altijd omkeerbaar is en dus niet betrouwbaar","Omdat de functies niet doelgericht en experimenteel gecontroleerd beïnvloed worden","Omdat er nooit een controlegroep bestaat bij dieren","Omdat de schade nooit tot een enkele regio beperkt blijft en steeds het hele brein aantast"],"a":1,"u":"Bij natuurlijke letsels worden functies niet doelgericht beïnvloed en is er geen experimentele controle, waardoor je enkel verbanden kunt vaststellen en geen oorzaak."},{"t":"4","q":"Een onderzoeker wil enkel de cellichamen in een klein hersengebied uitschakelen zonder de axonen te raken die er doorheen lopen. Welke methode past het best?","o":["Radiofrequente (RF-) laesie","Elektrische stimulatie","Excito-toxische laesie","Lobotomie"],"a":2,"u":"Een excito-toxische laesie met een exciterend aminozuur zoals kaïnezuur vernietigt de cellichamen aan de uitgang van het buisje maar spaart de passerende axonen, waardoor het lokaler werkt."},{"t":"4","q":"Wat maakt de immuunmethode (bv. met saporine) selectiever dan een gewone RF-laesie?","o":["Ze verhit het weefsel zo nauwkeurig dat enkel de cellichamen sterven en alle passerende vezels gespaard blijven","Ze richt zich enkel op basis van locatie in het brein","Ze is omkeerbaar en kan later terug uitgezet worden","Ze bindt via antilichaampjes selectief aan eiwitten die enkel in specifieke neuronen voorkomen"],"a":3,"u":"Bij de immuunmethode wordt een toxisch proteïne gekoppeld aan antilichaampjes die selectief binden aan eiwitten die alleen in bepaalde neuronen zitten, dus selectiviteit gaat verder dan enkel locatie."},{"t":"4","q":"Waarom vereisen laesie- en ablatiemethodes een sham-laesie als controleprocedure?","o":["Omdat deze methodes bijkomstige schade veroorzaken die je moet kunnen uitsluiten","Omdat de sham-groep dezelfde laesie op een andere plaats krijgt en zo de grootte van het effect bepaalt","Omdat proefdieren anders te snel zouden herstellen","Omdat je zonder sham geen temporele resolutie hebt"],"a":0,"u":"Alle laesie- en ablatiemethodes produceren bijkomstige schade, dus een sham-laesie is nodig als adequate controleprocedure om te weten wat door de eigenlijke laesie komt."},{"t":"4","q":"Hoe werkt muscimol als methode voor tijdelijke beïnvloeding van een hersenregio?","o":["Het exciteert de neuronen zodat ze extra actiepotentialen afvuren","Het is een GABA-A agonist die het doorgeven van actiepotentialen tijdelijk voorkomt","Het vernietigt de cellichamen definitief","Het koelt het weefsel plaatselijk af zodat de synaptische overdracht in die regio even stilvalt"],"a":1,"u":"Muscimol is een GABA-A agonist die via lokale injectie het doorgeven van actiepotentialen in een bepaalde regio voorkomt, wat een tijdelijke verstoring van de activiteit geeft."},{"t":"4","q":"Wat is een belangrijke reden waarom optogenetica NIET bij mensen wordt toegepast?","o":["Het vereist een sterk magnetisch veld dat gevaarlijk is voor mensen","De neuronen van mensen zijn te sterk gemyeliniseerd, waardoor het licht de celmembranen niet meer bereikt","Het steunt op genetische manipulatie met gewijzigde virussen, wat enkel bij proefdieren gebeurt","Het is volledig onschadelijk maar te duur voor klinisch gebruik"],"a":2,"u":"Optogenetica vereist genetische manipulatie via gewijzigde virussen die lichtgevoelige proteïnen laten produceren; dit wordt op proefdieren toegepast en niet op mensen."},{"t":"4","q":"Wat is een kernkenmerk van transcraniële magnetische stimulatie (TMS)?","o":["Ze brengt permanente schade toe aan het onderliggende weefsel","Ze werkt door de schedel heen met magnetische pulsen en heeft tijdelijke effecten","Ze vereist een ingeplante elektrode in de cortex","Ze registreert de zuurstofopname in een regio en kan de activiteit daar zelf niet beïnvloeden"],"a":1,"u":"TMS is een non-invasieve techniek die door de schedel heen met sterke magnetische pulsen een regio kan exciteren of verstoren zonder het weefsel schade toe te brengen, met tijdelijke effecten."},{"t":"4","q":"Wat is het verschil tussen een knock-out gen en een knock-in gen bij targeted mutation?","o":["Een knock-out verhindert de expressie van een proteïne, een knock-in stimuleert of introduceert de productie van een proteïne","Een knock-out stimuleert een nieuwe proteïne, een knock-in verhindert alle expressie","Een knock-out schakelt een gen uit in alle lichaamscellen, terwijl een knock-in hetzelfde gen enkel in de hersencellen actief houdt","Een knock-out werkt enkel bij muizen, een knock-in enkel bij ratten"],"a":0,"u":"Een knock-out gen verhindert de gebruikelijke productie van een proteïne, terwijl een knock-in gen die productie stimuleert of zelfs zorgt voor een proteïne die er normaal nooit zou aangemaakt worden."},{"t":"4","q":"Bij welke stap van de histologische verwerking wordt het bloed uit de bloedvaten gespoeld en vervangen door een fixatiemiddel?","o":["Kleuring","Versnijden","Perfusie","Observatie"],"a":2,"u":"Perfusie is de stap waarbij bloed uit de bloedvaten wordt verwijderd en er via de bloedvaten een zoutoplossing en fixatiemiddel wordt doorgepompt zodat afbraakprocessen stoppen."},{"t":"4","q":"Je wilt weten naar welke structuren de neuronen van een bepaalde regio hun axonale output sturen. Welke techniek gebruik je?","o":["Retrograad labelen met fluorogold","Anterograad labelen met PHA-L","Microdialyse van de neurotransmitters","Excito-toxische laesie van de doelregio"],"a":1,"u":"Anterograad labelen volgt de efferente axonen: een stof als PHA-L wordt opgenomen door dendrieten en soma en via axoplasmatisch transport naar de eindknopen gebracht, zodat je ziet waarheen de output gaat."},{"t":"4","q":"Wat is een belangrijk nadeel van CT vergeleken met MRI?","o":["CT geeft geen 3D-beelden","CT gebruikt bestraling die niet geheel onschadelijk is","CT is trager dan MRI","CT kan niet op levend menselijk weefsel toegepast worden"],"a":1,"u":"CT werkt met röntgenopnames en gebruikt bestraling die niet volledig onschadelijk is, terwijl MRI geen schadelijke langetermijngevolgen van het veld heeft."},{"t":"4","q":"Waarom is EEG bijzonder geschikt om het exacte tijdstip van een hersenrespons te bepalen?","o":["Door de zeer hoge spatiale resolutie waarmee je de bron precies lokaliseert","Door de zeer hoge temporele resolutie in de orde van milliseconden","Omdat het diep gelegen kernen scherp in beeld brengt","Omdat het metabole activiteit rechtstreeks meet"],"a":1,"u":"EEG heeft een zeer hoge temporele resolutie in milliseconden, waardoor je met grote precisie kunt zeggen wanneer een verschil tussen condities optreedt; de spatiale resolutie is juist laag."},{"t":"4","q":"Wat meet je precies met een EEG?","o":["De optelsom van postsynaptische potentialen van vele neuronen","De afzonderlijke actiepotentialen van één enkel neuron","De bloedtoevoer naar een hersengebied","De hoeveelheid afgescheiden neurotransmitter"],"a":0,"u":"EEG meet een elektrisch fenomeen dat neerkomt op een optelsom van postsynaptische potentialen van minstens duizenden neuronen, geen individuele actiepotentialen."},{"t":"4","q":"Wat is een voordeel van MEG ten opzichte van EEG?","o":["MEG is veel goedkoper in aankoop en onderhoud dan EEG en kan zonder magnetisch afgeschermde ruimte in elk gewoon labo opgesteld worden","MEG heeft een betere spatiale resolutie omdat de magnetische veldjes minder verstoord worden door scalp en schedel","MEG kan als enige diep gelegen kernen goed meten","MEG heeft een veel betere temporele resolutie dan EEG"],"a":1,"u":"Omdat magnetische veldjes minder beïnvloed worden door scalp en schedel, heeft MEG een betere spatiale resolutie dan EEG, terwijl de temporele resolutie ongeveer gelijk is."},{"t":"4","q":"Wat meet het BOLD-signaal bij functionele MRI (fMRI)?","o":["Het rechtstreekse zuurstofverbruik van elk afzonderlijk neuron in de gemeten regio","Relatieve verschillen in regionale bloedtoevoer als indirecte maat voor metabolisme","De hoeveelheid gesynchroniseerde postsynaptische potentialen","De directe afscheiding van neurotransmitters via een membraan"],"a":1,"u":"Het BOLD-signaal steunt op het verschil in magnetische susceptibiliteit van hemoglobine met of zonder zuurstof en meet zo relatieve verschillen in regionale bloedtoevoer, wat een indirecte maat voor metabolisme is."},{"t":"4","q":"Hoeveel van de volgende stellingen over laesie-studies zijn JUIST? 1. Radiofrequente (RF) laesies vernietigen de cellichamen in een specifieke regio, maar sparen de axonen die door dat gebied lopen. 2. Muscimol is een GABA-agonist die zorgt voor een influx van chloorionen, waardoor een tijdelijke chemische inhibitie ontstaat. 3. Bij immuunmethodes wordt een toxisch eiwit (zoals saporine) ingebracht dat zich bindt aan alle neuronen in een specifieke hersenregio. 4. Experimentele ablatie is bij mensen uitsluitend een historische praktijk (zoals lobotomie) en wordt tegenwoordig klinisch nooit meer toegepast.","o":["0","1","2","3"],"a":1,"u":"Slechts 1 stelling is juist: nr. 2. Stelling 1 is fout: RF-laesies vernietigen ALLES, excitotoxische laesies sparen de axonen. Stelling 3 is fout: Immuunmethodes (saporine) binden enkel aan specifieke eiwitten/neuronen (bv. enkel cholinerge neuronen), niet allemaal. Stelling 4 is fout: resectie/ablatie wordt nog steeds klinisch toegepast bij o. a. ernstige epilepsie."},{"t":"4","q":"Welke stelling over hersenstimulatie is FOUT?","o":["Chemische stimulatie (bv. met glutamaat) is specifieker dan elektrische stimulatie omdat het enkel soma en dendrieten activeert, en geen axonen.","Transcraniële magnetische stimulatie (TMS) kan zowel neuronen exciteren als inhiberen in een bepaalde oppervlakkige regio.","Optogenetica maakt gebruik van lichtgevoelige eiwitten en wordt via glasvezelkabels of LED-lampjes ook klinisch toegepast bij menselijke patiënten.","tDCS is een goedkopere en meer draagbare techniek dan TMS, maar is minder focaal (nauwkeurig)."],"a":2,"u":"Optogenetica wordt (nog) niet bij menselijke patiënten toegepast, enkel bij proefdieren (genetisch gewijzigde virussen inspuiten mag niet zomaar)."},{"t":"4","q":"Je leest een wetenschappelijk artikel over onderzoek naar de ziekte van Parkinson. Men wil via een scan onderzoeken of er een tekort is aan dopamine in het striatum van een levende patiënt. Welke methode is hiervoor het meest geschikt?","o":["Een structurele MRI-scan January 25, 2026 5 21 PM","Een PET-scan met radioactieve L DOPA","Een fMRI-scan","Microdialyse"],"a":1,"u":"Om neurotransmitters of eiwitten in vivo zichtbaar te maken gebruik je PET met een radioactieve tracer (zoals L DOPA."},{"t":"4","q":"Hoeveel van de volgende stellingen over tracing-methoden zijn JUIST? 1. Bij anterograde tracing (zoals met PHA (L) wordt de tracer opgenomen door de dendrieten of het soma en getransporteerd naar de eindknoppen. 2. Fluorogold wordt gebruikt voor retrograde tracing en reist van de eindknoop terug naar het cellichaam. 3. Transneuronale tracing met het pseudorabiësvirus brengt afferente netwerken in kaart. 4. Tracing-methoden kunnen rechtstreeks en pijnloos worden toegepast op levende menselijke proefpersonen.","o":["1","2","3","4"],"a":2,"u":"(1, 2 en 3 zijn juist). Stelling 4 is fout: tracing vereist dissectie van de hersenen om de weefsels na afloop onder de microscoop te bekijken (histologie), en kan dus niet bij levende mensen."},{"t":"4","q":"Welke stelling over EEG en MEG is JUIST?","o":["Een belangrijk voordeel van EEG ten opzichte van MEG is een geringere gevoeligheid voor bewegingsartefacten.","EEG en MEG hebben beide een uitstekende temporele resolutie, maar EEG heeft een betere spatiale resolutie dan MEG.","EEG meet voornamelijk de optelsom van actiepotentialen van corticale neuronen.","Om een duidelijk EEG-signaal te krijgen, is het noodzakelijk dat EPSP's gesynchroniseerd optreden in parallel gelegen piramidale neuronen."],"a":3,"u":"EEG is zeer gevoelig voor bewegingsartefacten (stelling A is fout). EEG heeft een SLECHTE spatiale resolutie, MEG heeft een betere (stelling B is fout). EEG meet EPSP's, géén actiepotentialen (stelling C is fout)."},{"t":"4","q":"Wat past NIET in het rijtje met betrekking tot perifere metingen?","o":["Zygomaticus major","Polysomnografie","Motor-Evoked Potentials MEPs","Galvanic Skin Response GSR"],"a":3,"u":"GSR is een meting van electrodermale activiteit (zweet/arousal). Zygomaticus, MEPs en polysomnografie horen allemaal bij EMG (spieractiviteit meten)."},{"t":"4","q":"Hoeveel van de volgende stellingen over scans en hun resoluties zijn JUIST? 1. PET heeft een betere spatiale resolutie dan MRI. 2. fMRI heeft een betere temporele resolutie dan PET. 3. Bij een CT-scan kunnen metalen implantaten (zoals een stent) zorgen voor stervormige \" streak artifacts \" op het beeld. 4. Een nadeel van MRI is dat het levensgevaarlijk is voor patiënten met een pacemaker.","o":["1","2","3","4"],"a":2,"u":"Stellingen 2, 3 en 4 zijn juist). Stelling 1 is fout: MRI heeft een veel betere spatiale resolutie dan PET (PET geeft' vegen')."},{"t":"4","q":"Welke combinatie is JUIST in verband met ERP-componenten?","o":["N 400; treedt op bij grammaticale fouten in een zin.","P 300; positieve piek die optreedt wanneer de aandacht getrokken wordt door een onverwachte stimulus (zoals een afwijkende toon).","N 400; geeft een hogere piek bij patiënten met schizofrenie.","P 300; treedt enkel op bij visuele, niet bij auditieve stimuli."],"a":1,"u":"P 300 treedt op bij een onverwachte stimulus die de aandacht trekt. N 400 reageert NIET op grammaticale fouten, maar op betekenis (semantiek) en is net kleiner bij schizofrenie."},{"t":"4","q":"Welke uitspraak over gedragsfysiologie is FOUT?","o":["Een hoge hartslagvariabiliteit (HRV) wijst op een dominante activiteit van het parasympathisch zenuwstelsel in rust.","Electrodermale activiteit (EDA) wordt uitsluitend aangestuurd door het sympathisch zenuwstelsel.","Pupilverwijding tijdens een cognitief zware taak (zoals een incongruente Stroop-taak) is uitsluitend een parasympathische reactie.","Automatische mimicry (gemeten via EMG in het gezicht) correleert positief met dispositionele empathie."],"a":2,"u":"Pupilverwijding is niet uitsluitend parasympathisch; het wordt zowel door het sympathisch (verwijding) als parasympathisch (vernauwing) zenuwstelsel gestuurd."},{"t":"4","q":"Bij het voorbereiden van hersenweefsel voor histologisch onderzoek onderneemt men verschillende stappen. Wat is de JUISTE chronologische volgorde?","o":["Fixatie-Perfusie-Versnijden-Kleuring","Perfusie-Kleuring-Fixatie-Versnijden","Perfusie-Fixatie-Versnijden-Kleuring","Fixatie-Versnijden-Perfusie-Kleuring"],"a":2,"u":"Perfusie (bloed eruit) (Fixatie (formol erin) Versnijden Kleuring."},{"t":"4","q":"Welke stelling met betrekking tot conventies is JUIST?","o":["Bij de neurologische conventie bevindt de rechter hemisfeer van de patiënt zich aan de linkerkant van de foto.","Bij de radiologische conventie bekijk je de hersenen vanuit het perspectief van het voeteind van de patiënt.","Een laesie die op een radiologische scan links wordt afgebeeld, bevindt zich daadwerkelijk in de linker hersenhelft.","Functionele MRI-scans gebruiken uitsluitend de neurologische conventie."],"a":1,"u":"Bij radiologische conventie (zoals bij CT/MRI) kijk je vanaf de voeten: jouw links is de rechts van de patiënt. Bij de neurologische conventie (stelling A) is de linker hemisfeer gewoon links op de foto."},{"t":"3","q":"Vul aan: Bij rust zal de elektrostatische druk...","o":["Chloor naar de buitenkant van het axon duwen.","Natrium naar de binnenkant van het axon trekken.","Kalium naar de buitenkant van het axon duwen.","Organische anionen naar de buitenkant van het axon duwen."],"a":1,"u":"Binnen de cel is het in rust negatief."},{"t":"4","q":"Wat hebben elektrische en chemische stimulatie gemeenschappelijk? Hoeveel stellingen zijn JUIST? 1. Ze vernielen beide zowel axonen als het cellichaam. 2. Ze hebben beide invloed op zowel inhiberende als exciterende neuronen in het doelgebied. 3. Ze zijn beide weinig ecologisch valide. 4. Ze zijn beide afhankelijk van het implanteren van een cannula.","o":["1","2","3","4"],"a":1,"u":"(Stellingen 2 en 3 zijn juist). Stelling 1 is fout: elektrische stimulatie vernietigt geen weefsel, het activeert het. Stelling 4 is fout: elektrische stimulatie gebruikt een elektrode, chemische gebruikt een cannula."},{"t":"4","q":"Een onderzoeker wil de verbindingen en vezelbanen (witte stof) in de hersenen van een levende mens in kaart brengen. Welke techniek kiest hij?","o":["Nissl-kleuring","DTI (Diffusion Tensor Imaging)","SPECT-scan","Autoradiografie met 2 DG"],"a":1,"u":"DTI meet waterdiffusie in de axonen (witte stof)."},{"t":"4","q":"Wat past NIET in het rijtje als het gaat om nadelen van een fMRI 1. scan?","o":["Gevoelig voor bewegingsartefacten","Zeer luidruchtig","Blootstelling aan lichte ioniserende röntgenstraling","Temporele resolutie is te traag voor extreem snelle psychische processen"],"a":2,"u":"MRI (en fMRI) werkt met magnetische velden, NIET met röntgenstraling (ioniserende straling is bij CT."},{"t":"1","q":"Een voorwaardelijke (conditionele) knock-out mutatie wordt in de gedragsgenetica vaak gebruikt in plaats van een klassieke knock-out. Waarom?","o":["Omdat het de dieren immuun maakt voor saporine.","Omdat men het gen pas op latere leeftijd uitschakelt, zodat het dier zich eerst normaal kan ontwikkelen en compensatiemechanismen worden vermeden.","Omdat klassieke knock-out genen uitsluitend bij primaten werken, en niet bij muizen.","Omdat het gen enkel uitschakelt als de muis wordt blootgesteld aan specifieke golflengtes van licht."],"a":1,"u":"Bij voorwaardelijke knock-out voorkom je dat het brein van het dier zich tijdens de jeugd al aanpast aan het missen van het gen."},{"t":"3","q":"Welke combinatie beschrijft een AGONISTISCHE werking op een synaps correct?","o":["Inactivatie van het synthetisch enzym én stimulering van de receptor.","Inhibitie van de reuptake én het blokkeren van autoreceptoren.","Het blokkeren van de postsynaptische receptoren én inhibitie van vesikelvulling.","Stimuleren van autoreceptoren én verhogen van enzymatische deactivatie."],"a":1,"u":"Reuptake remmen = meer neurotransmitter in de spleet = agonistisch. Autoreceptoren blokkeren = rem op de vrijgave weghalen = meer neurotransmitter in de spleet = agonistisch."},{"t":"3","q":"In welk type synaps vindt er GEEN chemische transmissie met neurotransmitters plaats, maar diffunderen ionen direct van het ene naar het andere neuron?","o":["Axo-dendritische synapsen","Axo-somatische synapsen","Gap junctions (elektrische synapsen)","Axo-axonische synapsen"],"a":2,"u":"Gap junctions verbinden de cellen fysiek; ionen vloeien direct door."},{"t":"1","q":"Hoeveel van de volgende stellingen over genetica en evolutie zijn JUIST? 1. De mens deelt ongeveer 1% van zijn DNA met een willekeurige andere mens. 2. GWAS 3. Genome-Wide Association Study) vertrekt vanuit het fenotype om polygenetische eigenschappen in kaart te brengen. 4. De Formule van Falconer overschat vaak de genetische effecten door de' equal environment assumption'. 5. Vruchtbaarheidsselectie is een vorm van directe fitness.","o":["1","2","3","4"],"a":2,"u":"Drie stellingen kloppen. De eerste niet: twee willekeurige mensen delen ongeveer 99,9 procent van hun DNA, dus het verschil is maar 0,1 procent."},{"t":"2","q":"Welke combinatie in verband met thalamische projecties is JUIST?","o":["Anterieure nucleus – primaire auditieve cortex","Ventraal laterale kern – primaire visuele cortex","Mediale knievormige kern – somatosensorische cortex","Laterale knievormige kern – primaire visuele cortex"],"a":3,"u":"Laterale knievormige kern gaat naar primair visueel. Mediale = auditief. Ventraal lateraal = motorisch."},{"t":"2","q":"Je bekijkt een hersensnede waarbij je tegelijkertijd een overzicht hebt van de linker-én rechterhemisfeer, en je zowel de anterieure (voorkant) als posterieure (achterkant) structuren kunt zien. Je kijkt van bovenaf. Welke coupe is dit?","o":["Sagittaal","Coronaal","Horizontaal","Frontaal"],"a":2,"u":"Een horizontale snede (ook wel axiaal genoemd) kijkt van bovenaf."},{"t":"2","q":"Bij een mediale sagittale doorsnede van het brein zie je een grote, witte, boogvormige structuur die beide hemisferen met elkaar verbindt. Wat is de naam van deze structuur en uit welk type vezels bestaat deze?","o":["Fornix-Associatievezels","Corpus Callosum-Commissurale vezels","Gyrus cingulus-Projectievezels","Massa intermedia-Commissurale vezels"],"a":1,"u":"Het corpus callosum verbindt homologe gebieden van de twee hemisferen met commissurale vezels."},{"t":"2","q":"Je bekijkt het rhombencephalon. Welke structuur bevindt zich caudaal ten opzichte van de pons en bevat de decussatie (kruising) van de piramidebanen?","o":["Tectum","Cerebellum","Medulla oblongata","Hypothalamus"],"a":2,"u":"De piramidebanen kruisen onderaan in de medulla oblongata."},{"t":"2","q":"Welke hersenzenuw is enorm groot, komt aan de zijkant (lateraal) van de pons naar buiten en staat in voor de gevoeligheid van het hoofd en de kauwspieren?","o":["N. Olfactorius I","N. Opticus II","N. Trigeminus V","N. Vagus X"],"a":2,"u":"De nervus trigeminus (hersenzenuw V) is de gigantische zenuw aan de pons."},{"t":"2","q":"(Op een coronale (frontale) doorsnede van de hersenen zijn de basale ganglia goed te zien. Welke structuur ligt als een langgerekte' staart' net naast de laterale ventrikels?","o":["Globus pallidus","Nucleus caudatus","Amygdala","Substantia nigra"],"a":1,"u":"De nucleus caudatus (\" kern met een staart \") vormt samen met het putamen het dorsaal striatum."},{"t":"2","q":"Welke van de volgende kwabben is de locatie van de sulcus calcarinus, en welke primaire sensorische cortex bevindt zich daar?","o":["Temporale kwab-Auditief","Frontale kwab-Motorisch","Occipitale kwab-Visueel","Pariëtale kwab-Somatosensorisch"],"a":2,"u":"Occipitaal, rondom de calcarine fissuur."},{"t":"2","q":"Waar bevindt zich het periaquaductale grijs (PAG) en wat is de primaire functie?","o":["In het diencephalon; verdeelcentrum voor zintuigen.","Rondom het cerebraal aquaduct in het tegmentum; lichaamseigen pijnstilling en automatische bewegingen.","In het metencephalon; regulatie van slaap en waakzaamheid.","In de medulla; regulatie van hartslag."],"a":1,"u":"Het PAG ligt in het tegmentum rondom het aquaduct."},{"t":"2","q":"De \" hoorn van Ammon \" en de \" gyrus dentatus \" zijn kenmerkende substructuren van een specifiek hersendeel dat eruitziet als een zeepaardje op de vloer van de laterale ventrikel. Welk hersendeel is dit?","o":["Insula","Hippocampus","Corpora mammilaria","Thalamus"],"a":1,"u":"De hippocampus bestaat uit o. a. de CA Cornus Ammonis/Hoorn van Ammon) en gyrus dentatus."},{"t":"2","q":"Welke klier hangt via het infundibulum (steeltje) vast aan de hypothalamus en bestaat uit een anterieur en posterieur deel?","o":["Pijnappelklier (Epifyse)","Hypofyse (Pituitary gland)","Olijfkern","Amygdala"],"a":1,"u":"De hypofyse (bestaande uit de adeno-en neurohypofyse)."},{"t":"2","q":"Je bekijkt de hersenstam vanaf de dors
