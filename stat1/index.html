beeld beter op taal maar zwakker op wiskunde. Samen stijgen is concordant, en een paar met dezelfde rangorde is geknoopt, wat bij tau nog steeds in de noemer meetelt."},{"t":"9","q":"Je berekent voor twee ordinale variabelen een gamma van 0,33. Hoe lees je die waarde rechtstreeks af?","o":["Er is 33% kans dat het verband van richting verandert en 66% kans dat het in dezelfde richting blijft","33% van de paren is geknoopt en de rest is concordant","33% van de verschillen in de ene variabele wordt verklaard door de andere","Het verband is zwak, maar je kan er net als bij tau geen concrete kans aan koppelen"],"a":0,"u":"Gamma heeft als voordeel dat je hem rechtstreeks in kansen kan lezen: 0,33 betekent 33% kans dat het verband van richting verandert en 66% kans dat het dezelfde richting aanhoudt. Dat is precies wat tau niet toelaat, en het gaat niet over geknoopte paren of over verklaarde verschillen."},{"t":"9","q":"De ene onderzoeker rapporteert een rangcorrelatie van -0,60, de andere van +0,60. Wat besluit je?","o":["Het verband van de tweede is sterker, want positieve samenhang weegt zwaarder door","Het verband van de eerste is sterker, want het minteken telt mee in de sterkte","De twee waarden zijn niet vergelijkbaar zolang je het meetniveau niet kent","Even sterke samenhang, alleen de richting verschilt: het teken geeft de richting, de absolute waarde de sterkte"],"a":3,"u":"Bij sterkte kijk je naar de absolute waarde, en |-0,60| is gelijk aan |+0,60|, dus de samenhang is even sterk, alleen loopt ze bij de eerste de andere kant op. Het teken zegt alleen iets over de richting, niet over hoe sterk het verband is."}],"theory":[{"h":"Meetschalen en variabelen","items":["Indicator: een variabel begrip, dus een geoperationaliseerd kenmerk van een individu, waaraan meerdere variabelen gekoppeld kunnen zijn.","Rechtstreeks meetbare variabele: een kenmerk dat je direct kunt observeren zonder operationele definitie, zoals reactietijd of de frequentie van een gedrag.","Niet rechtstreeks meetbare variabele: een abstract kenmerk dat pas meetbaar wordt via een operationele definitie, zoals intelligentie of persoonlijkheid.","Categorische variabele: een variabele die indeelt in niet-numerieke, afzonderlijke categorieen, bijvoorbeeld geslacht of opleidingsniveau.","Numerieke variabele: een variabele die indeelt in numerieke categorieen, bijvoorbeeld leeftijd of inkomen.","Case: het individu, de groep of het object dat beschreven wordt door de meetwaarden van de variabelen.","Dichotomiseren: numerieke scores toekennen aan een categorische variabele, bijvoorbeeld man = 0 en vrouw = 1.","Continue versus discrete variabele: continue variabelen kunnen elke waarde binnen een interval aannemen, discrete variabelen enkel gehele getallen.","Identiteit: de eigenschap van meten waarbij je enkel bepaalt of cases gelijk of ongelijk zijn en ze in klassen indeelt.","Equivalentierelatie: een relatie die reflexief, symmetrisch en transitief is en een verzameling opdeelt in equivalentieklassen.","Partitie: een verdeling van een verzameling in niet-overlappende klassen waarbij elk object tot precies een groep behoort.","Totaalheid: de eigenschap die een totale orde onderscheidt van een partiele orde, want ze zorgt dat elk paar elementen vergelijkbaar is.","Vaste meeteenheid: een standaardmaat waardoor eenzelfde verschil in meetwaarden over de hele schaal dezelfde betekenis heeft.","Absoluut nulpunt: het punt waarop de gemeten eigenschap volledig afwezig is, wat het verschil maakt tussen een interval- en een ratioschaal."]},{"h":"Data visualiseren","items":["Verdeling van een variabele: het overzicht van welke waarden een variabele aanneemt en hoe vaak elke waarde voorkomt.","Frequentietabel: tabel die per meetwaarde of per klasse weergeeft hoeveel waarnemingen erin vallen.","Absolute frequentie (Fi): het aantal waarnemingen met dezelfde waarde xi.","Relatieve frequentie (fi): de absolute frequentie gedeeld door het totaal aantal waarnemingen N.","Cumulatieve frequentie (Cj): de optelling van alle frequenties tot en met een bepaalde waarde of klasse.","Histogram: grafiek van de verdeling van een continue variabele, waarbij de balken zonder ruimte tegen elkaar aansluiten.","Staafdiagram: grafiek die categorieën met elkaar vergelijkt en waarbij er ruimte tussen de balken staat.","Taartdiagram: cirkelgrafiek voor de verdeling van proporties bij categorische variabelen, in de praktijk vaak moeilijk leesbaar.","Stam-en-loofdiagram: weergave voor kleine datasets waarbij de exacte meetwaarden zichtbaar blijven.","Frequentieveelhoek: lijnvormige weergave van een frequentieverdeling die het idee van groei en continue frequentie oproept.","Cumulatieve frequentiecurve: curve van opgetelde frequenties waaruit je onder meer de mediaan kunt aflezen.","Exhaustief en disjunct: elke meetwaarde valt in een klasse en geen enkele klasse overlapt met een andere.","Exacte klassengrenzen: de grenzen die aangeven welk interval van continue waarden door eenzelfde meetwaarde op de discrete schaal wordt voorgesteld.","Klassenmidden (xi): het gemiddelde van de onderste en de bovenste klassengrens, dus (X+Y)/2."]},{"h":"Centrummaten en boxplot","items":["Tijdcurve: grafiek die het gedrag van een variabele over de tijd toont, met de tijd op de horizontale as en de gemeten variabele op de verticale as.","Seizoenschommeling: terugkerend patroon in een tijdcurve dat samenvalt met gekende, zich herhalende perioden.","Rekenkundig gemiddelde: de som van alle waargenomen waarden gedeeld door het aantal waarnemingen.","Gevoeligheid van het gemiddelde: omdat het gemiddelde alle waarden meetelt, wordt het door extreme waarnemingen altijd naar de staart getrokken.","Mediaan: de middelste waarneming, waarbij de helft van de waarnemingen kleiner is en de andere helft groter.","Eerste kwartiel Q1: de mediaan van de waarnemingen die kleiner zijn dan de mediaan.","Tweede kwartiel Q2: de mediaan zelf.","Derde kwartiel Q3: de mediaan van de waarnemingen die groter zijn dan de mediaan.","Interkwartielafstand IKA: het verschil Q3 min Q1, dus de breedte van de middelste helft van de waarnemingen.","Gewone uitschieter: een waarneming kleiner dan Q1 min 1.5 keer de IKA of groter dan Q3 plus 1.5 keer de IKA, ook buitenbeentje genoemd.","Extreme uitschieter: een waarneming kleiner dan Q1 min 3 keer de IKA of groter dan Q3 plus 3 keer de IKA.","Robuuste maat: een karakteristieke waarde zoals de mediaan, de kwantielen of de IKA die niet gevoelig is voor buitenbeentjes, in tegenstelling tot gemiddelde, standaarddeviatie, variatiebreedte, minimum en maximum.","Boxplot: figuur die de verdeling samenvat op basis van de kwartielen en waarin buitenbeentjes zichtbaar worden.","Kwantiel: de waarde van een variabele waarbij de relatieve cumulatieve frequentie het bijhorende niveau bereikt, met kwartielen in vierden, decielen in tienden en percentielen in procenten, zodat mediaan = Q2 = D5 = P50."]},{"h":"Spreidingsmaten","items":["Deviatiescore: het verschil tussen een waarneming en het gemiddelde, dus hoe ver die waarneming van het gemiddelde af ligt.","Gekwadrateerde deviatie: het kwadraat van die afstand, wat de richting (plus of min) wegneemt en grote afstanden extra zwaar laat wegen.","Variantie: de gemiddelde gekwadrateerde afstand van de waarnemingen tot het rekenkundig gemiddelde.","Standaardafwijking: de vierkantswortel uit de variantie, dus de 'gemiddelde afstand' tot het gemiddelde in dezelfde meeteenheid als de data.","Delen door n: je beschrijft gewoon de gegevens die je voor je hebt, van een populatie of van de steekproef zelf.","Delen door n - 1: je schat op basis van steekproefdata de spreiding in de populatie, wat een strengere en iets grotere waarde oplevert.","Vrijheidsgraden: het aantal gegevens dat nog vrij kan variëren wanneer het gemiddelde vastligt, bij een steekproef dus n - 1.","Eigenschappen van s: s is nul als alle waarnemingen gelijk zijn, anders groter dan nul, s is gevoelig voor uitschieters en vereist meetniveau interval of ratio.","Lineaire transformatie: een omrekening naar een andere meeteenheid die de vorm van de verdeling ongemoeid laat, maar centrum en spreiding wel wijzigt.","Modus: de waarde met de hoogste frequentie, dus de meetwaarde die het vaakst voorkomt (bimodaal bij twee toppen, multimodaal bij meer).","Meetkundig gemiddelde: de n-de machtswortel uit het product van alle n getallen, vooral gebruikt in financiële wiskunde.","Variatiebreedte: het verschil tussen de hoogste en de laagste meetwaarde.","Variatiecoëfficiënt: de verhouding tussen de standaardafwijking en het gemiddelde, dus hoe groot de spreiding relatief is ten opzichte van de schaal.","Dichtheidskromme: een gladde curve boven de X-as die de verdeling beschrijft en waaronder de totale oppervlakte gelijk is aan 1."]},{"h":"Normaalverdelingen","items":["Normaalverdeling: een symmetrische, unimodale en klokvormige dichtheidskromme die volledig vastligt door haar gemiddelde en standaarddeviatie, genoteerd als N(mu ; sigma).","Standaardnormaalverdeling: de normaalverdeling met gemiddelde 0 en standaarddeviatie 1, genoteerd als N(0,1), waarvoor de tabellen zijn opgesteld.","68-95-99.7 regel: vuistregel die zegt dat ongeveer 68, 95 en 99,7 procent van de observaties binnen respectievelijk 1, 2 en 3 standaarddeviaties rond het gemiddelde vallen.","Standaardiseren: elke ruwe waarde omzetten met z = (x - mu) / sigma, zodat je afleest hoeveel standaarddeviaties die waarde van het gemiddelde af ligt.","Z-score: de gestandaardiseerde waarde zelf, positief boven het gemiddelde en negatief eronder.","Ontstandaardiseren: de omgekeerde bewerking x = mu + z maal sigma, waarmee je van een z-score terugkeert naar de ruwe meetwaarde.","Complementregel: het gegeven dat de totale oppervlakte 1 is, waardoor een van beide standaardnormaaltabellen volstaat om de ontbrekende oppervlakte af te leiden.","Percentielrang: het percentage observaties onder een score, dat de onderlinge afstanden tussen ruwe meetwaarden niet respecteert.","Continuïteitscorrectie: het volledige klasse-interval rond een afgeronde waarde meerekenen wanneer je een discrete verdeling benadert met een continue verdeling.","Kurtosis: de vormmaat voor gepiektheid of afplatting, waarbij de normaalverdeling als middenreferentie geldt (mesokurtisch).","Scheefheid: de vormmaat voor symmetrie, waarbij linksscheef betekent dat de staart naar links loopt en rechtsscheef dat ze naar rechts loopt.","Empirische coëfficiënt van Pearson: maat die uitdrukt hoeveel standaarddeviaties het verschil tussen gemiddelde en mediaan groot is, negatief bij linksscheef, nul bij symmetrie en positief bij rechtsscheef.","Centrale momenten: veralgemening van de afwijkingen tot het gemiddelde, met m1 gelijk aan nul, m2 gelijk aan de variantie en m3 als maat voor asymmetrie.","Even en oneven momenten: momenten met een even macht werken als spreidingsmaten, momenten met een oneven macht als maten voor asymmetrie, en hogere machten versterken telkens het gewicht van extreme waarden."]},{"h":"Scatterplots en correlatie","items":["Verklaarde variabele: de afhankelijke variabele die de uitkomst van een studie meet.","Verklarende variabele: de onafhankelijke variabele die veranderingen in de verklaarde variabele verklaart of veroorzaakt.","Samenhang: kennis van de waarde van de ene variabele laat toe om de waarde van de andere beter te voorspellen.","Analytisch verband: de meetwaarde van de ene variabele laat een perfecte voorspelling van de andere toe.","Stochastisch verband: de meetwaarde van de ene variabele laat enkel een min of meer correcte schatting van de andere toe.","Monotoon verband: verband waarbij de richting nooit omkeert, dus altijd stijgend of altijd dalend.","Niet-monotoon verband: verband waarbij de richting regelmatig verandert terwijl x toeneemt.","Uitschieter: datapunt dat duidelijk afwijkt van de algemene trend in de scatterplot.","Lambda: associatiemaat voor twee dichotome variabelen, gebaseerd op het deel van de oorspronkelijke fouten dat wegvalt als je de tweede variabele kent.","Determinatiecoëfficiënt r kwadraat: het kwadraat van de Pearson correlatie, oftewel het deel van de variantie in de afhankelijke variabele dat de onafhankelijke variabele verklaart.","Verklarende kracht: r kwadraat gelijk aan 0 betekent geen verklarende kracht, r kwadraat gelijk aan 1 betekent perfecte verklarende kracht.","Correlatiecoëfficiënt r: numerieke maat voor de sterkte en de richting van de lineaire relatie tussen twee variabelen, met bereik van -1 tot 1.","Correlatie en causaliteit: een correlatie toont enkel dat er een verband is, ze bewijst geen oorzakelijk verband en is gevoelig voor uitschieters.","Covariantie: het verband Sxy is gelijk aan Rxy maal Sx maal Sy, dus de correlatie maal de twee standaardafwijkingen."]},{"h":"Regressie en residuen","items":["Lineair regressiemodel: model waarin de regressielijnen vervangen worden door de best passende rechten, zodat je y kunt voorspellen uit x.","Kleinste kwadraten: methode die de best passende rechte zoekt door de som van de gekwadrateerde verticale afstanden van de punten tot die rechte zo klein mogelijk te maken.","Regressievergelijking: y-dak = b0 + b1x, waarbij y-dak de voorspelde waarde van de afhankelijke variabele is.","Intercept b0: de plek waar de rechte de y-as snijdt, dus de voorspelde y wanneer x nul is.","Helling b1: de verandering in y die hoort bij een toename van x met een eenheid, en die de richting en de sterkte van het verband aangeeft.","Eigenschap van de rechte: de regressierechte gaat altijd door het punt van het gemiddelde van x en het gemiddelde van y.","Regressie in z-scores: een toename van 1 standaarddeviatie in x hoort bij een toename van r standaarddeviaties in y, ook wanneer de rechte niet in z-waarden staat.","Dummy variabele: hercodering van een categorische variabele naar 1 en 0, zodat correlatie en determinatiecoëfficiënt op de gewone manier berekend kunnen worden.","T-toets bij correlatie: toets die nagaat of r significant van nul verschilt (significant bij een p-waarde kleiner dan 0,05), met als kritiek dat een heel grote N bijna altijd significantie geeft.","Residu: het verschil tussen de waargenomen waarde en de voorspelde waarde, dus de verticale afstand van het bolletje tot de rechte.","Residuendiagram: spreidingsdiagram van de residuen tegenover de verklarende variabele, waarmee je de fit van de rechte beoordeelt, want patronen wijzen op afwijking van lineariteit.","Uitschieters: punten die ver van de rest liggen, waarbij afwijkers in de y-richting grote residuen hebben en afwijkers in de x-richting de rechte sterk kunnen verschuiven.","Extrapolatie en interpolatie: schatten buiten het bereik van de data, wat onzeker is, tegenover schatten binnen het bereik, wat doorgaans betrouwbaarder is.","Verborgen variabele: een derde variabele die het verband mee bepaalt terwijl ze niet in de analyse zit, waardoor correlatie geen bewijs van causaliteit is."]},{"h":"Contingentietabellen","items":["Contingentietabel: tabel met frequenties in de cellen die de relatie tussen twee categorische variabelen laat zien.","Marginale frequenties: de rij- en kolomtotalen die buiten de eigenlijke tabel staan.","Relatieve frequenties: frequenties omgezet naar verhoudingen of percentages, zodat groepen van ongelijke grootte toch vergelijkbaar worden.","Marginale verdeling: de verdeling van 1 variabele apart, zonder informatie over het verband met de andere.","Voorwaardelijke verdeling: de verdeling van de ene variabele in percentages, berekend binnen de cases met een specifieke waarde op de andere variabele.","Strookdiagram: grafiek waarin je voorwaardelijke verdelingen zij aan zij of gesegmenteerd met elkaar vergelijkt.","Confounding: een derde variabele verstoort het waargenomen verband omdat ze met beide variabelen correleert.","Moderatie: het verband tussen twee variabelen verschilt binnen de subgroepen die door een derde variabele gevormd worden.","Mediatie: de derde variabele is de tussenstap die het verband tussen de twee andere variabelen verklaart.","Paradox van Simpson: de richting van het verband keert om of het verband verdwijnt wanneer subgroepen tot 1 groep worden samengenomen.","Gemeenschappelijke afhankelijkheid: x en y hangen samen omdat ze allebei van eenzelfde variabele z afhangen, zonder onderling causaal verband.","Criteria voor causaliteit zonder experiment: het verband is sterk, consistent en repliceerbaar, hogere dosissen geven sterkere responsen, en de vermoedelijke oorzaak is plausibel en gaat het effect vooraf.","Lambda: associatiemaat voor nominale variabelen die aangeeft hoeveel beter je de ene variabele voorspelt met kennis van de andere.","Chi-kwadraat: maat die de waargenomen frequenties vergelijkt met de verwachte frequenties bij statistische onafhankelijkheid, waarbij een verwachte celfrequentie gelijk is aan het product van de marginalen gedeeld door N."]},{"h":"Rangcorrelaties","items":["Concordant paar: paar waarbij de volgorde tussen de twee scores gerespecteerd wordt, wie hoger scoort op de ene variabele scoort ook hoger op de andere.","Discordant paar: paar waarbij de volgorde niet gerespecteerd wordt, hoger op de ene variabele gaat samen met lager op de andere.","Geknoopt paar (ex aequo): paar waarnemingen dat je niet ten opzichte van elkaar kan ordenen omdat ze dezelfde rangorde hebben.","Aantal paren: bij N waarnemingen vergelijk je N(N-1)/2 koppels, want elke waarneming wordt met elke andere gekoppeld.","Kendall's tau: concordante paren min discordante paren, gedeeld door het totale aantal paren, geknoopte paren inbegrepen.","Gamma: concordante paren min discordante paren, gedeeld door de som van concordante en discordante paren, de geknoopte paren vliegen eruit.","Tau versus gamma: zonder ex aequo geven ze dezelfde waarde, met ex aequo is gamma altijd groter omdat tau wel en gamma niet corrigeert voor ties.","Directe interpretatie van gamma: een gamma van 0,33 betekent 33% kans dat het verband van richting verandert en 66% kans dat het in dezelfde richting blijft.","Spearman (rs): de Pearson-correlatie berekend op rangen, dus je zet de ruwe meetwaarden eerst om naar ordinale data.","Di: het verschil tussen de rangnummers binnen paar i, waarvan de som over alle paren gelijk moet zijn aan 0.","Rangen bij gelijke meetwaarden: gelijke waarden krijgen de gemiddelde rang, bijvoorbeeld allebei 2,5, en de volgende waarneming schuift door naar 4.","Lineair verband: de relatie volgt een rechte lijn, elke toename in X gaat samen met een even grote verandering in Y.","Monotoon verband: de relatie gaat altijd dezelfde richting uit, alleen stijgend of alleen dalend, maar niet per se met gelijke stappen.","Richting en sterkte: alle rangcorrelaties liggen tussen -1 en +1, het teken geeft de richting en de absolute waarde geeft de sterkte."]}],"hacks":[{"h":"NOIR: de trap van meetniveaus","t":"Onthoud de volgorde nominaal, ordinaal, interval, ratio als het woord NOIR. Elke trede krijgt er een eigenschap bij: N staat voor Naam (enkel gelijk of verschillend), O voegt Orde toe (meer of minder), I voegt Identieke intervallen toe (even grote afstanden) en R voegt de echte nul toe (verhoudingen mogen). Zo zie je meteen welke bewerkingen mogen: hoger op de trap mag alles wat lager mag, maar niet omgekeerd. Zak je vrijwillig een trede, dan mag dat wel, maar je verliest informatie."},{"h":"Meten plakt, tellen laat ruimte","t":"Vraag je bij elke grafiek eerst af: heb ik gemeten of geteld? Meten levert continue data op (lengte, gewicht, tijd), en dan plakken de balken tegen elkaar, dat is een histogram. Tellen of indelen levert discrete of categorische data op (aantal juiste antwoorden, haarkleur), en dan laat je ruimte tussen de balken, dat is een staaf- of kolomdiagram. Kort samengevat: meten plakt, tellen laat ruimte."},{"h":"Anderhalf is gewoon, drie is extreem","t":"Denk aan twee hekjes rond de doos van de boxplot: op 1.5 keer de IKA voorbij Q1 en Q3 staat het hekje voor gewone buitenbeentjes, op 3 keer de IKA staat het hekje voor de extreme. Wie over het eerste hekje springt is opvallend, wie over het tweede springt is verdacht. Voor de centrummaten helpt het beeld van de rots en de zwemmer: de mediaan is de rots die blijft liggen, het gemiddelde is de zwemmer die altijd naar de staart drijft."},{"h":"Scheef? Pak de M van mediaan","t":"Karakteristieke maten komen in vaste duo's: gemiddelde hoort bij de standaardafwijking, mediaan hoort bij de interkwartielafstand. Is de verdeling scheef of zitten er uitschieters in, kies dan het mediaan-duo, want geen van beide leden laat zich meeslepen door extreme waarden. Bij een min of meer symmetrische verdeling zonder uitschieters neem je het gemiddelde-duo. En onthou de volgorde van de wortel: eerst variantie, daarna standaardafwijking als vierkantswortel daarvan."},{"h":"Z is een liniaal, geen punt","t":"Denk bij een z-score altijd aan een liniaal met de standaarddeviatie als eenheid: z = 2 betekent twee stappen boven het gemiddelde, niet twee punten. Voor de weg heen trek je eerst af en deel je daarna (min mu, gedeeld door sigma), voor de weg terug doe je alles omgekeerd en in omgekeerde volgorde (maal sigma, plus mu). En de trap 1, 2, 3 hoort bij 68, 95, 99.7, dus hoe verder je op de liniaal stapt, hoe meer je binnen hebt."},{"h":"Tel je continue variabelen: L, T, R","t":"Kijk eerst hoeveel van je twee variabelen continu zijn. Nul continue variabelen (dus twee dichotome) geeft Lambda, een continue met een dichotome geeft de T-test, en twee continue variabelen geven de correlatie R. De letters L, T, R staan netjes op volgorde: hoe meer continue variabelen, hoe verder je in het alfabet opschuift."},{"h":"Residu = Realiteit min Raming","t":"Onthoud een residu als Realiteit min Raming: de echte waarneming min wat de rechte voorspelde. Ligt de realiteit hoger dan de raming, dan is het residu positief en zit het bolletje boven de rechte, ligt ze lager, dan is het residu negatief en zit het punt eronder. De kleinste-kwadratenrechte is dan gewoon de rechte die al die missers samen, in het kwadraat, zo klein mogelijk houdt."},{"h":"Percenteer in de richting van je vraag","t":"Bij een contingentietabel bepaalt de richting van je percentages het antwoord: wil je weten hoe het zit binnen de mannen, dan deel je door het rijtotaal van de mannen en niet door het algemene totaal. Percenteer je in de verkeerde richting, of laat je een derde variabele weg, dan kan het verband zelfs omkeren zodra je opsplitst, en dat is precies de paradox van Simpson. Onthoud de drie rollen van zo'n derde variabele als de drie M's: Meebepalend (verstrengeling), Modererend (het verband verschilt per subgroep) en Mediërend (de tussenstap in de keten)."},{"h":"Recht, of gewoon omhoog?","t":"Pearson vraagt: hoe recht is de lijn? Spearman vraagt: gaan ze samen omhoog of omlaag? Voor de noemer van de paren-maten: Tau neemt het Totaal aantal paren, ties inbegrepen, terwijl Gamma Gewoon concordant plus discordant overhoudt. Een kleinere noemer geeft een grotere breuk, dus bij ex aequo is gamma altijd de hoogste van de twee, en zonder ex aequo vallen ze samen."}]};
</script>

  var PRAISE=["Juist!","Goed zo!","Correct!","Sterk!","Knap!"];

  function getProg(){ var p=lget("stat1_prog",{ans:{}}); if(!p||typeof p!=="object"||!p.ans)p={ans:{}}; return p; }

  function resetProg(){ lset("stat1_prog",{ans:{}}); }
  function chapterStats(){ var p=getProg(); var st={}; Object.keys(TOPICS).forEach(function(k){st[k]={total:0,done:0,correct:0};}); D.questions.forEach(function(q){ var s=st[q.t]; if(!s)return; s.total++; if(Object.prototype.hasOwnProperty.call(p.ans,q.id)){ s.done++; if(p.ans[q.id])s.correct++; } }); return st; }
  function startChapter(k){ var items=shuffle(D.questions.filter(function(q){return q.t===k;})); state.view="quiz"; tabBtns.forEach(function(b){b.classList.toggle("on",b.dataset.view==="quiz");}); startQuiz(items); window.scrollTo(0,0); }

  var TABS=[{v:"home",l:"Start",i:"book"},{v:"quiz",l:"Oefenvragen",i:"target"},{v:"theory",l:"Theorie",i:"search"},{v:"hacks",l:"Studie-hacks",i:"bulb"},{v:"feedback",l:"Feedback",i:"msg"}];
  var tabsEl=document.getElementById("tabs");

  var tabBtns=[].slice.call(tabsEl.querySelectorAll("button"));

  function go(v){ state.view=v; tabBtns.forEach(function(b){b.classList.toggle("on",b.dataset.view===v);}); render(); window.scrollTo(0,0); }

  var state={view:"home", step:"track", track:lget("stat1_track","training"), quiz:null, sel:{topics:{"1":true,"2":true,"3":true,"4":true,"5":true,"6":true,"7":true,"8":true,"9":true}, count:15, shuffle:true}, sumq:""};
  function setHTML(h){ app.innerHTML=h; }

  function render(){
    if(state.view==="home") return renderHome();
    if(state.view==="quiz") return renderQuizGate();
    if(state.view==="theory") return renderTheory();
    if(state.view==="hacks") return renderHacks();
    if(state.view==="feedback") return renderFeedback();
  }

  function renderHome(){

      '</div>'+
      '<a class="brandstrip" href="https://beriesexamspace.github.io/" title="Naar Berie’s exam space"><span class="bs-logo">B</span><span class="bs-txt"><b>Berie’s exam space</b><small>Een ander vak leren? Bekijk alle vakken</small></span><span class="bs-go">'+ic("arrowR")+'</span></a>'+
      '<a class="brandstrip" href="https://beriesexamspace.github.io/?deel=1" title="Deel je samenvattingen"><span class="bs-logo">📚</span><span class="bs-txt"><b>Help mee, deel je vak</b><small>Heb jij samenvattingen of oude examenvragen? Stuur ze in (élk jaar).</small></span><span class="bs-go">'+ic("arrowR")+'</span></a>'+

  function renderHerkansing(){

  function renderQuizGate(){
    if(state.quiz) return renderQuiz();
    var s=state.sel;
    function pool(){ return D.questions.filter(function(q){return s.topics[q.t];}); }
    var html='<div class="card pad"><h2 style="margin-top:0">Oefenvragen</h2>'+
      '<p class="muted">Kies onderwerpen en het aantal vragen. Na elk antwoord krijg je meteen feedback én de uitleg.</p>'+
      '<label class="fld">Onderwerpen</label><div class="chips" id="tps">'+
        Object.keys(TOPICS).map(function(k){return '<button class="chip'+(s.topics[k]?" on":"")+'" data-tp="'+k+'">'+esc(TOPICS[k])+'</button>';}).join("")+'</div>'+
      '<label class="fld">Aantal vragen</label><div class="chips" id="cnt">'+
        [10,15,20,999].map(function(n){return '<button class="chip'+(s.count===n?" on":"")+'" data-n="'+n+'">'+(n===999?"Alle":n)+'</button>';}).join("")+'</div>'+
      '<label class="fld"><input type="checkbox" id="shuf" '+(s.shuffle?"checked":"")+'> Willekeurige volgorde</label>'+
      '<div class="row" style="margin-top:18px"><button class="btn" id="startQ">Start '+ic("arrowR")+'</button><span class="muted" id="poolN"></span></div></div>';
    setHTML(html);
    function refresh(){ var n=pool().length; document.getElementById("poolN").textContent=n+" vragen beschikbaar"; document.getElementById("startQ").disabled=n===0; }
    [].slice.call(document.querySelectorAll("#tps .chip")).forEach(function(b){ b.onclick=function(){ s.topics[b.dataset.tp]=!s.topics[b.dataset.tp]; b.classList.toggle("on"); refresh(); }; });
    [].slice.call(document.querySelectorAll("#cnt .chip")).forEach(function(b){ b.onclick=function(){ s.count=+b.dataset.n; renderQuizGate(); }; });
    document.getElementById("shuf").onchange=function(e){ s.shuffle=e.target.checked; };
    document.getElementById("startQ").onclick=function(){ var p=pool(); if(s.shuffle)p=shuffle(p); if(s.count<p.length)p=p.slice(0,s.count); startQuiz(p); };
    refresh();
  }

  function startQuiz(items){ bump("berat-stat1", state.track==="herkansing"?"herkansing":"training"); state.quiz={items:items.map(function(q){return {q:q,opts:shuffle(q.o.map(function(t,i){return {text:t,ok:i===q.a};}))};}), idx:0, answered:false, picked:-1, correct:0, wrong:[], done:false}; renderQuiz(); }

  function renderQuiz(){
    var Q=state.quiz; if(Q.done) return renderResult();
    var cur=Q.items[Q.idx], q=cur.q;
    var html='<button class="backlink" id="backBtn">'+ic("back")+'Terug</button>'+
      '<div class="card pad">'+
      '<div class="runtop"><span class="pill">'+esc(TOPICS[q.t])+'</span><div class="bar"><i data-w="'+pct(Q.idx,Q.items.length)+'"></i></div><span>'+(Q.idx+1)+'/'+Q.items.length+'</span></div>'+
      '<div class="qtext">'+esc(q.q)+'</div>'+
      '<div id="opts">'+cur.opts.map(function(o,i){return '<button class="opt" data-i="'+i+'" style="--oi:'+(i*55)+'ms"><span class="k">'+String.fromCharCode(65+i)+'</span><span>'+esc(o.text)+'</span></button>';}).join("")+'</div>'+
      '<div id="fb"></div>'+
      '<div class="row" style="justify-content:space-between;margin-top:6px"><span class="muted" style="font-size:12px">Toets <span class="kbd">A–D</span> · <span class="kbd">Enter</span> = volgende</span><button class="btn hide" id="nextBtn">Volgende '+ic("arrowR")+'</button></div></div>';
    setHTML(html);
    var i2=document.querySelector(".bar>i"); requestAnimationFrame(function(){ if(i2) i2.style.width=i2.getAttribute("data-w")+"%"; });
    document.getElementById("backBtn").onclick=function(){ state.quiz=null; renderQuizGate(); };
    var optBtns=[].slice.call(document.querySelectorAll("#opts .opt"));
    var nb=document.getElementById("nextBtn"); nb.onclick=next;
    function showAnswered(i){
      optBtns.forEach(function(b){ var bi=+b.dataset.i; b.disabled=true; if(cur.opts[bi].ok)b.classList.add("correct"); else if(bi===i)b.classList.add("wrong"); });
      var ok=cur.opts[i].ok, fb=document.getElementById("fb"); fb.className="feedback "+(ok?"ok":"no");
      var juist=cur.opts.filter(function(o){return o.ok;})[0].text;
      fb.innerHTML=ok?"<b>"+rnd(PRAISE)+" ✓</b>":"<b>"+wrongLead()+"</b><span class=\"sub\">Juiste antwoord: "+esc(juist)+"</span>";
      var w=document.createElement("div"); w.innerHTML='<div class="whybox"><h4>'+ic("sparkles")+'Waarom?</h4>'+esc(q.u)+'</div>'; fb.appendChild(w);
      nb.classList.remove("hide"); nb.innerHTML=(Q.idx+1>=Q.items.length)?"Bekijk resultaat "+ic("arrowR"):"Volgende "+ic("arrowR");
    }
    function pick(i){ if(Q.answered)return; Q.answered=true; Q.picked=i; var ok=cur.opts[i].ok; if(ok)Q.correct++; else Q.wrong.push(q); recordProg(q.id, ok); showAnswered(i); nb.focus(); }
    optBtns.forEach(function(b){ b.onclick=function(){ pick(+b.dataset.i); }; });
    function next(){ if(!Q.answered)return; Q.idx++; Q.answered=false; Q.picked=-1; if(Q.idx>=Q.items.length)Q.done=true; renderQuiz(); }
    if(Q.answered) showAnswered(Q.picked);
    state.key=function(e){ if(!Q.answered){ var k=e.key.toLowerCase(); var idx="abcde".indexOf(k); if(idx<0&&/[1-5]/.test(k))idx=+k-1; if(idx>=0&&idx<cur.opts.length){pick(idx);e.preventDefault();} } else if(e.key==="Enter"||e.key===" "){ next(); e.preventDefault(); } };
  }

  function renderResult(){
    var Q=state.quiz, p=pct(Q.correct,Q.items.length);
    var msg=p>=80?"Sterk werk! 🎉":p>=60?"Goed bezig 👍":"Blijf oefenen, je komt er 💪";
    var html='<div class="card pad results center"><span class="pill">Statistiek I</span><div class="big">'+p+'%</div>'+
      '<p style="font-weight:600;margin:0 0 4px;font-size:17px">'+msg+'</p><p class="muted">'+Q.correct+' van '+Q.items.length+' juist</p>'+
      '<div class="row" style="justify-content:center;margin-top:14px">'+
        (Q.wrong.length?'<button class="btn" id="retry">Herhaal '+Q.wrong.length+' foute vragen</button>':'')+
        '<button class="btn ghost" id="again">Nieuwe ronde</button><button class="btn ghost" id="home">Naar start</button></div></div>';
    setHTML(html);
    var rt=document.getElementById("retry"); if(rt) rt.onclick=function(){ startQuiz(shuffle(Q.wrong)); };
    document.getElementById("again").onclick=function(){ state.quiz=null; renderQuizGate(); };
    document.getElementById("home").onclick=function(){ state.quiz=null; go("home"); };
    state.key=null;
  }

  function renderTheory(){
    var q=state.sumq||"";
    var html='<div class="card pad" style="margin-bottom:14px"><h2 style="margin:0 0 8px">Theorie en samenvatting</h2>'+
      '<input type="search" id="sq" placeholder="Zoek een begrip… (bv. mediaan, z-score, Spearman)" value="'+esc(q)+'"></div><div id="list">'+theoryList(q)+'</div>';
    setHTML(html);
    var si=document.getElementById("sq"); si.oninput=function(){ state.sumq=si.value; document.getElementById("list").innerHTML=theoryList(si.value); si.focus(); };
  }
  function theoryList(query){
    var Q=query.trim().toLowerCase(), out="", n=0;
    D.theory.forEach(function(sec){
      var items=sec.items.filter(function(it){ return !Q || it.toLowerCase().indexOf(Q)>=0 || sec.h.toLowerCase().indexOf(Q)>=0; });
      if(!items.length) return; n++;
      out+='<details class="acc"'+(Q?" open":(n===1?" open":""))+'><summary><span class="n">'+ic("search")+'</span>'+esc(sec.h)+ic("chevR","caret")+'</summary><div class="body"><ul>'+items.map(function(it){return '<li>'+hl(esc(it),Q)+'</li>';}).join("")+'</ul></div></details>';
    });
    return out||'<p class="muted center">Geen resultaten voor "'+esc(query)+'".</p>';
  }
  function hl(t,q){ if(!q)return t; try{ return t.replace(new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>"); }catch(e){ return t; } }

  function renderHacks(){
    var html='<div class="card pad" style="margin-bottom:16px"><h2 style="margin:0 0 6px">Studie-hacks</h2><p class="muted" style="margin:0">Ezelsbruggetjes om de kernideeën van statistiek te onthouden.</p></div>'+
      '<div class="tipgrid">'+D.hacks.map(function(t){return '<div class="tip"><h4>'+ic("bulb")+esc(t.h)+'</h4><p>'+esc(t.t)+'</p></div>';}).join("")+'</div>';
    setHTML(html);
  }

  function renderFeedback(){
    var html='<div class="card pad"><h2 style="margin-top:0">Feedback &amp; klachten</h2>'+
      '<p class="muted">Fout in een vraag, een idee, of werkt iets niet? Laat het hier weten, het komt rechtstreeks bij de maker terecht. Een review of compliment mag ook: de mooiste tonen we op de hub. 💬</p>'+
      '<label class="fld" for="fbMsg">Je bericht</label><textarea id="fbMsg" rows="5" placeholder="Beschrijf de fout of je idee…"></textarea>'+
      '<label class="fld" for="fbWaar">Over welke vraag? <span class="muted">(optioneel)</span></label><input type="text" id="fbWaar" placeholder="bv. de vraag over de p-waarde">'+
      '<label class="fld" for="fbNaam">Je naam <span class="muted">(optioneel)</span></label><input type="text" id="fbNaam" placeholder="zodat we je kunnen bedanken">'+
      '<label class="fld" for="fbEmail">Je e-mail <span class="muted">(optioneel, als je een antwoord wilt)</span></label><input type="email" id="fbEmail" placeholder="naam@voorbeeld.be">'+
      '<input type="text" id="fbBot" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;opacity:0">'+
      '<div class="row" style="margin-top:16px;align-items:center"><button class="btn" id="fbSend">'+ic("send")+'Versturen</button><span id="fbStatus" style="font-size:13px"></span></div></div>';
    setHTML(html);
    document.getElementById("fbSend").onclick=function(){
      var status=document.getElementById("fbStatus");
      if(document.getElementById("fbBot").value) return;
      var msg=document.getElementById("fbMsg").value.trim();
      if(!msg){ status.style.color="var(--bad)"; status.textContent="Schrijf eerst een bericht."; return; }
      var btn=document.getElementById("fbSend"); btn.disabled=true; status.style.color="var(--muted)"; status.textContent="Versturen…";
      var em=document.getElementById("fbEmail").value.trim();
      var nm=document.getElementById("fbNaam").value.trim();
      var waar=document.getElementById("fbWaar").value.trim();
      var payload={_subject:"Statistiek I-tool: feedback", _template:"table", _captcha:"false",
        Naam:nm||"-", Over_welke_vraag:waar||"-", email:em||"-", Bericht:msg};
      if(em) payload._replyto=em;
      // vangnet: als de verzenddienst blokkeert (bv. spamfilter) of er is geen verbinding,
      // bieden we een directe mailto-knop aan zodat de melding NOOIT stilletjes verdwijnt.
      function failFallback(reden){
        var body="Feedback Statistiek I-tool%0D%0A%0D%0ANaam: "+encodeURIComponent(nm||"-")+"%0D%0AOver welke vraag: "+encodeURIComponent(waar||"-")+"%0D%0AE-mail: "+encodeURIComponent(em||"-")+"%0D%0A%0D%0ABericht:%0D%0A"+encodeURIComponent(msg);
        var mailto="mailto:berat007yildirim@gmail.com?subject="+encodeURIComponent("Statistiek I-tool: feedback")+"&body="+body;
        setHTML('<div class="card pad"><h2 style="margin-top:0">Automatisch versturen lukte niet</h2><p class="muted">'+reden+' Geen zorgen, klik hieronder en je melding wordt geopend in je e-mail, helemaal klaar om te versturen:</p><a class="btn" href="'+mailto+'">'+ic("send")+'Mail mijn melding direct</a><div style="margin-top:14px"><button class="btn ghost" id="bk">Terug naar start</button></div></div>');
        document.getElementById("bk").onclick=function(){go("home");};
      }
      fetch("https://formsubmit.co/ajax/Berat007yildirim@gmail.com",{method:"POST",headers:{Accept:"application/json"},body:new URLSearchParams(payload)})
        .then(function(r){return r.json();}).then(function(d){
          if(d&&(d.success===true||d.success==="true")){ setHTML('<div class="card pad results center"><div style="font-size:42px">✅</div><h2 style="margin:6px 0">Bedankt!</h2><p class="muted">Je melding is verstuurd.</p><button class="btn" id="bk" style="margin-top:8px">Terug naar start</button></div>'); document.getElementById("bk").onclick=function(){go("home");}; }
          else { failFallback("Het automatisch versturen lukte niet."); }
        }).catch(function(){ failFallback("Er was even geen verbinding."); });
    };
  }

  document.addEventListener("keydown",function(e){ if(state.key) state.key(e); });
  // bezoeker tellen (1x per toestel)
  try{ if(!localStorage.getItem("stat1_seen")){ localStorage.setItem("stat1_seen","1"); bump("berat-stat1","gebruikers"); } }catch(e){ bump("berat-stat1","gebruikers"); }
  // traject vanuit de hub overnemen → direct naar de oefenpagina
  try{ var _q=new URLSearchParams(location.search); var _m=_q.get("m");
    if(_m==="training"||_m==="herkansing"){ state.track=_m; lset("stat1_track",_m);
      var _c=_q.get("calm"); if(_c!=null){ calm=(_c!=="0"); lset("stat1_calm",calm); applyCalm(); }
      state.step="practice"; state.fromHub=true; }
  }catch(e){}
  render();
  // launch-splash netjes laten verdwijnen
  (function(){ var _sp=document.getElementById("splash"); if(!_sp) return; var _red=false; try{_red=window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){} setTimeout(function(){ _sp.classList.add("hide"); setTimeout(function(){ if(_sp&&_sp.parentNode) _sp.parentNode.removeChild(_sp); }, 700); }, _red?300:1850); })();
})();
</script>
