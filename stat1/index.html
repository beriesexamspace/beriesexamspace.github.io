<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

<!-- Berie's exam space © 2026 Berat Yildirim. Alle rechten voorbehouden. Originele bron: https://beriesexamspace.github.io  Kopieren of hergebruiken zonder schriftelijke toestemming is niet toegestaan. -->
<style>
  :root{
    --bg:#f4f2ee; --bg2:#ebe8e2; --card:#ffffff; --ink:#1b232c; --muted:#5d6873;
    --line:#e2ddd4; --accent:#0f6e6a; --accent-ink:#0b4f4c; --accent-soft:#dcefed;
    --amber:#c9821f; --amber-soft:#f7ecd9; --violet:#6d5bd0; --violet-soft:#e9e6fa;
    --good:#1f8a4c; --good-soft:#e2f3e8; --bad:#c23b54; --bad-soft:#fbe5ea;
    --shadow:0 1px 2px rgba(20,30,40,.05),0 6px 18px rgba(20,30,40,.05);
    --shadow-lg:0 2px 6px rgba(20,30,40,.06),0 18px 40px rgba(20,30,40,.10);
    --r:14px; --r-lg:20px; --ease:cubic-bezier(.2,.8,.2,1);
  }
  html[data-theme="dark"]{
    --bg:#11151a; --bg2:#161b22; --card:#1b222b; --ink:#e7ecf1; --muted:#9aa6b2;
    --line:#2a323c; --accent:#3fb9b2; --accent-ink:#7fd6d0; --accent-soft:#163230;
    --amber:#e0a64a; --amber-soft:#2e2515; --violet:#a99cf0; --violet-soft:#221d3a;
    --good:#46c178; --good-soft:#16301f; --bad:#ef6b82; --bad-soft:#331620;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 2px 8px rgba(0,0,0,.4),0 22px 48px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;letter-spacing:-.01em}
  button,a{font-family:inherit;cursor:pointer;color:inherit}
  .wrap{max-width:880px;margin:0 auto;padding:0 18px 96px}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
  .ic{width:1.25em;height:1.25em;flex:none;vertical-align:-.18em;stroke:currentColor;stroke-width:1.75;
    stroke-linecap:round;stroke-linejoin:round;fill:none}

  header.top{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(160%) blur(16px);-webkit-backdrop-filter:saturate(160%) blur(16px);box-shadow:inset 0 -1px 0 0 rgba(0,0,0,.04)}
  .topin{max-width:880px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:700}
  .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,var(--accent),var(--accent-ink));
    color:#fff;display:grid;place-items:center;font-family:Georgia,serif;font-weight:700;font-size:16px;flex:none;
    box-shadow:0 2px 6px rgba(15,110,106,.35)}
  .brand small{display:block;font-weight:500;color:var(--muted);font-size:11px}
  .spacer{flex:1}
  .iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:38px;
    padding:7px 11px;font-size:13.5px;display:inline-flex;gap:7px;align-items:center;text-decoration:none;
    transition:border-color .2s var(--ease),transform .12s var(--ease)}
  .iconbtn:hover{border-color:var(--accent)} .iconbtn:active{transform:scale(.96)}
  nav.tabs{display:flex;gap:2px;overflow:auto;max-width:880px;margin:0 auto;padding:6px 12px 0;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{border:none;background:none;color:var(--muted);padding:10px 13px;border-radius:9px 9px 0 0;
    font-size:14px;font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px;transition:color .2s var(--ease)}
  nav.tabs button .ic{width:16px;height:16px}
  nav.tabs button.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
  nav.tabs button:hover{color:var(--ink)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:20px}
  .muted{color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
  .pill.amber{background:var(--amber-soft);color:var(--amber)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;gap:14px}
  @media(min-width:620px){.g2{grid-template-columns:1fr 1fr}}

  .hero{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin:20px 0 8px}
  .count{flex:none;background:linear-gradient(150deg,var(--accent),var(--accent-ink));color:#fff;border-radius:var(--r);padding:14px 20px;text-align:center;min-width:118px;box-shadow:0 8px 20px rgba(15,110,106,.28)}
  .count b{font-family:Georgia,serif;font-size:32px;display:block;line-height:1}
  .count span{font-size:12px;opacity:.92}
  .herotext h1{margin:0 0 4px;font-size:25px}
  .herotext p{margin:0;color:var(--muted)}

  .brandstrip{display:flex;align-items:center;gap:13px;width:100%;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 16px;margin:14px 0 2px;box-shadow:var(--shadow);transition:border-color .2s var(--ease),transform .15s var(--ease)}
  .brandstrip:hover{border-color:var(--accent);transform:translateY(-1px)}
  .brandstrip .bs-logo{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:17px;background:linear-gradient(145deg,var(--accent),var(--accent-ink))}
  .brandstrip .bs-txt{flex:1;min-width:0} .brandstrip .bs-txt b{display:block;font-size:14.5px} .brandstrip .bs-txt small{color:var(--muted);font-size:12.5px}
  .brandstrip .bs-go{color:var(--accent-ink);flex:none;display:inline-flex} .brandstrip .bs-go .ic{width:18px;height:18px}

  .seclabel{display:flex;align-items:center;gap:8px;margin:24px 0 12px;font-weight:700;font-size:15px}
  .seclabel .ic{width:18px;height:18px;color:var(--accent-ink)}
  .backlink{display:inline-flex;align-items:center;gap:5px;border:none;background:none;color:var(--muted);font-size:13.5px;font-weight:600;padding:6px 0;margin-bottom:4px;transition:color .2s var(--ease)}
  .backlink:hover{color:var(--accent-ink)} .backlink .ic{width:16px;height:16px}
  .tracks{display:grid;gap:14px} @media(min-width:600px){.tracks{grid-template-columns:1fr 1fr}}
  .track{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);transition:transform .22s var(--ease),border-color .22s var(--ease),box-shadow .22s var(--ease)}
  .track:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow-lg)} .track:active{transform:translateY(-1px) scale(.995)}
  .track .tile{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;margin-bottom:4px;background:linear-gradient(150deg,var(--accent),var(--accent-ink))}
  .track.alt .tile{background:linear-gradient(150deg,var(--violet),#4f40a8)} .track .tile .ic{width:24px;height:24px}
  .track b{font-size:18px} .track small{color:var(--muted);font-size:13.5px;line-height:1.5}
  .track .go{margin-top:6px;display:inline-flex;align-items:center;gap:6px;color:var(--accent-ink);font-weight:600;font-size:13.5px} .track.alt .go{color:var(--violet)} .track .go .ic{width:16px;height:16px}
  .toggle{width:48px;height:28px;border-radius:999px;border:none;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s var(--ease)}
  .toggle .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s var(--ease)}
  .toggle.on{background:var(--violet)} .toggle.on .knob{left:23px}
  .warmcard{border-color:var(--violet)!important;background:var(--violet-soft)} .warmcard .ic{width:22px;height:22px;color:var(--violet);flex:none}
  .modebanner{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:11px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent-ink);font-size:13.5px;font-weight:600}
  .modebanner.v{background:var(--violet-soft);color:var(--violet)} .modebanner .ic{width:18px;height:18px} .modebanner a,.modebanner .bnlink{margin-left:auto;font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;color:inherit;border:none;background:none;font-family:inherit;padding:0}
  html.snappy .card,html.snappy .mode,html.snappy .tip,html.snappy .track{animation-duration:.12s!important}
  .mode{display:flex;flex-direction:column;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:17px;gap:7px;box-shadow:var(--shadow);transition:transform .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease)}
  .mode:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .mode .me{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)} .mode .me .ic{width:22px;height:22px}
  .mode b{font-size:16px} .mode small{color:var(--muted);font-size:13px}

  label.fld{display:block;font-size:13px;font-weight:600;margin:16px 0 7px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;min-height:38px;padding:7px 13px;font-size:13.5px;transition:all .18s var(--ease)}
  .chip:hover{border-color:var(--accent)} .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:11px;min-height:46px;padding:12px 20px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;box-shadow:0 4px 12px rgba(15,110,106,.25);transition:background .2s var(--ease),transform .12s var(--ease)}
  .btn:hover{background:var(--accent-ink)} .btn:active{transform:scale(.97) translateY(1px)} .btn .ic{width:18px;height:18px}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none} .btn.ghost:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  input[type=search],input[type=text],input[type=email],textarea{font-family:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
  input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .runtop{display:flex;align-items:center;gap:12px;margin:2px 0 14px;font-size:13px;color:var(--muted)}
  .bar{height:8px;border-radius:6px;background:var(--bg2);overflow:hidden;flex:1}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .7s var(--ease)}
  .qtext{font-size:19px;font-weight:600;margin:8px 0 16px;font-family:Georgia,serif;line-height:1.45}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px 15px;margin-bottom:10px;font-size:15px;transition:border-color .15s var(--ease),background .15s var(--ease),transform .12s var(--ease)}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)} .opt:active:not(:disabled){transform:scale(.99)}
  .opt .k{flex:none;width:27px;height:27px;border-radius:8px;background:var(--bg2);color:var(--muted);display:grid;place-items:center;font-weight:700;font-size:13px}
  .opt.correct{border-color:var(--good);background:var(--good-soft)} .opt.correct .k{background:var(--good);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default}
  .feedback{border-radius:12px;padding:13px 15px;margin:4px 0 12px;font-size:14.5px}
  .feedback.ok{background:var(--good-soft);color:var(--good)} .feedback.no{background:var(--bad-soft);color:var(--bad)}
  .feedback b{font-weight:700} .feedback .sub{display:block;margin-top:3px;color:var(--ink);font-weight:500;opacity:.92}
  .whybtn{border:1px solid var(--line);background:var(--card);color:var(--accent-ink);border-radius:10px;min-height:40px;padding:9px 14px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:border-color .2s var(--ease),background .2s var(--ease)}
  .whybtn:hover{border-color:var(--accent);background:var(--accent-soft)} .whybtn .ic{width:16px;height:16px}
  .whybox{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:14px 16px;margin:12px 0 4px;font-size:14px;line-height:1.55}
  .whybox h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent-ink);font-family:system-ui;display:flex;align-items:center;gap:7px}
  .whybox .ic{width:16px;height:16px}

  .acc{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
  .acc>summary{padding:15px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:11px}
  .acc>summary::-webkit-details-marker{display:none}
  .acc>summary .n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
  .acc>summary .caret{margin-left:auto;color:var(--muted);transition:transform .25s var(--ease)} .acc[open]>summary .caret{transform:rotate(90deg)}
  .acc[open]>summary{border-bottom:1px solid var(--line)} .acc .body{padding:6px 18px 16px}
  .acc h4{margin:14px 0 6px;font-size:13px;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.4px;font-family:system-ui}
  .acc ul{margin:0;padding-left:20px} .acc li{margin:6px 0;font-size:14.5px;line-height:1.5}
  .acc.hack li::marker{content:"💡  "} .acc.hack>summary .n{background:var(--violet-soft);color:var(--violet)}
  mark{background:var(--amber-soft);color:inherit;padding:0 2px;border-radius:3px}

  .tip{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}
  .tip h4{margin:0 0 5px;font-size:14.5px;display:flex;align-items:center;gap:8px;font-family:system-ui} .tip h4 .ic{width:18px;height:18px;color:var(--violet)}
  .tip p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}
  .tipgrid{display:grid;gap:12px} @media(min-width:620px){.tipgrid{grid-template-columns:1fr 1fr}}

  .results .big{font-family:Georgia,serif;font-size:54px;text-align:center;margin:8px 0;line-height:1}
  .center{text-align:center} .hide{display:none!important}
  footer{margin-top:34px;text-align:center;color:var(--muted);font-size:13px}
  .kbd{font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--muted)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.03)}100%{transform:scale(1)}}
  @keyframes optIn{from{opacity:0;transform:translateX(-9px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: no-preference){
    .card,.mode,.tip{animation:fadeUp .34s var(--ease) both}
    .acc{animation:fadeUp .32s var(--ease) both}
    .opt{animation:optIn .3s var(--ease) backwards;animation-delay:var(--oi,0s)}
    .chip.on{animation:pop .22s var(--ease)}
    .feedback{animation:slideIn .26s var(--ease) both} .whybox{animation:slideIn .28s var(--ease) .07s both} .opt.correct{animation:pop .34s var(--ease)}
  }
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  /* ---- Premium launch (Gemini-stijl) + header-logo gloed ---- */
  @property --bes-a{syntax:'<angle>';initial-value:0deg;inherits:false}
  #splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(125% 125% at 50% 38%,var(--bg2) 0%,var(--bg) 68%);transition:opacity .6s var(--ease),transform .7s var(--ease)}
  #splash.hide{opacity:0;transform:scale(1.07);pointer-events:none}
  .sp-inner{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
  .sp-mark{position:relative;width:100px;height:100px;display:grid;place-items:center}
  .sp-mark::before{content:"";position:absolute;inset:-16px;border-radius:34px;z-index:0;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));filter:blur(17px);opacity:.75}
  .sp-mark::after{content:"";position:absolute;inset:-3px;border-radius:27px;z-index:1;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));padding:3px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .sp-logo{position:relative;z-index:2;width:92px;height:92px;border-radius:24px;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:46px;background:linear-gradient(150deg,var(--accent),var(--accent-ink));box-shadow:0 14px 38px rgba(15,110,106,.4)}
  .sp-spark{position:absolute;z-index:3;top:-7px;right:-7px;width:30px;height:30px;color:#fff;filter:drop-shadow(0 2px 7px rgba(0,0,0,.35))}
  .sp-name{position:relative;font-family:Georgia,serif;font-size:26px;font-weight:700;letter-spacing:-.01em;color:var(--ink);overflow:hidden}
  .sp-name::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(-130%)}
  .sp-tag{font-size:13px;color:var(--muted);margin-top:-8px;letter-spacing:.03em}
  @media (prefers-reduced-motion: no-preference){
    .sp-mark::before{animation:bes-spin 3s linear infinite,bes-breathe 2.4s var(--ease) infinite}
    .sp-mark::after{animation:bes-spin 3s linear infinite}
    .sp-logo{animation:bes-pop .7s var(--ease) both}
    .sp-spark{animation:bes-pop .6s var(--ease) .12s both,bes-twinkle 1.9s var(--ease) .9s infinite}
    .sp-name{animation:bes-rise .6s var(--ease) .14s both}
    .sp-name::after{animation:bes-shimmer 1.5s var(--ease) .5s 1}
    .sp-tag{animation:bes-rise .6s var(--ease) .26s both}
  }
  @keyframes bes-spin{to{--bes-a:360deg}}
  @keyframes bes-breathe{0%,100%{opacity:.55;filter:blur(16px)}50%{opacity:.95;filter:blur(22px)}}
  @keyframes bes-shimmer{to{transform:translateX(130%)}}
  @keyframes bes-twinkle{0%,100%{opacity:1;transform:scale(1) rotate(0deg)}50%{opacity:.65;transform:scale(.82) rotate(18deg)}}
  @keyframes bes-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  /* mobiel: header-knoppen alleen iconen zodat niks zijwaarts overflowt */
  @media(max-width:440px){ header.top .iconbtn span{display:none} header.top .iconbtn{padding:7px 9px;min-width:38px;justify-content:center} .topin{gap:8px} }
</style>
</head>
<body>
<div id="splash"><div class="sp-inner">
  <div class="sp-mark">
    <div class="sp-logo">S1</div>
    <svg class="sp-spark" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.5c.4 4.6 2.4 6.6 7 7-4.6.4-6.6 2.4-7 7-.4-4.6-2.4-6.6-7-7 4.6-.4 6.6-2.4 7-7Z"/></svg>
  </div>
  <div><div class="sp-name">Statistiek I</div><div class="sp-tag">slim oefenen voor je examen</div></div>
</div></div>
<header class="top">
  <div class="topin">

<script>
window.S1 = {"questions":[{"t":"1","q":"Een onderzoeker wil intelligentie meten bij studenten. Waarom is dat geen rechtstreeks meetbare variabele?","o":["Omdat de scores in de praktijk altijd worden afgerond op gehele getallen","Omdat de variabele wordt ingedeeld in niet-numerieke categorieen","Omdat het een abstract construct is dat een operationele definitie vereist","Omdat er voor deze variabele geen absoluut nulpunt bestaat"],"a":2,"u":"Intelligentie kan je niet direct observeren, je hebt eerst een operationele definitie nodig om er een construct van te maken. Afronden, het soort categorieen en het nulpunt zeggen niets over het onderscheid rechtstreeks versus niet rechtstreeks meetbaar."},{"t":"1","q":"In een databestand krijgt geslacht de codering man = 0 en vrouw = 1. Hoe noem je die stap en wat doet ze met het meetniveau?","o":["Dichotomiseren, en het meetniveau blijft nominaal","Dichotomiseren, en de variabele wordt daardoor een intervalvariabele","Operationaliseren, waardoor de variabele continu wordt","Partitioneren, waardoor er een volgorde tussen de categorieen ontstaat"],"a":0,"u":"Dichotomiseren is het toekennen van numerieke scores aan een categorische variabele, de cijfers zijn hier enkel labels. De variabele blijft dus nominaal: er komt geen orde, geen vaste meeteenheid en zeker geen verhouding bij."},{"t":"1","q":"Bij een examen zonder giscorrectie krijg je enkel hele punten, bij een examen met giscorrectie kunnen er ook tussenliggende waarden uitkomen. Hoe typeer je die twee variabelen?","o":["Allebei continu, want een examenscore is nu eenmaal een getal","De eerste is continu en de tweede is discreet","Allebei discreet, want punten worden in de praktijk toch afgerond","De eerste is discreet en de tweede is continu"],"a":3,"u":"Discrete variabelen kunnen enkel in gehele getallen uitgedrukt worden, dat past bij een score zonder giscorrectie. Met giscorrectie kan de score elke waarde binnen een interval aannemen, en dat is per definitie continu. Dat scores in de praktijk vaak afgerond worden, verandert de aard van de variabele niet."},{"t":"1","q":"Aan welke drie voorwaarden moet een relatie voldoen om een verzameling netjes op te delen in equivalentieklassen?","o":["Reflexiviteit, anti-symmetrie en transitiviteit","Reflexiviteit, symmetrie en transitiviteit","Symmetrie, transitiviteit en totaalheid","Reflexiviteit, symmetrie en totaalheid"],"a":1,"u":"Een equivalentierelatie is reflexief, symmetrisch en transitief, en verdeelt de verzameling zo in klassen waarbij elk object tot precies een klasse behoort. Anti-symmetrie en totaalheid horen bij een orderelatie, dus bij ordening en niet bij loutere identiteit."},{"t":"1","q":"Je rangschikt mensen op lengte, maar mannen en vrouwen worden apart bekeken, waardoor je sommige koppels niet met elkaar kunt vergelijken. Welke eigenschap van de relatie ontbreekt dan?","o":["Totaalheid","Transitiviteit","Anti-symmetrie","Reflexiviteit"],"a":0,"u":"Totaalheid betekent dat je elk willekeurig paar elementen tegenover elkaar kunt plaatsen, en net dat lukt hier niet. De andere drie eigenschappen blijven wel gelden, daarom spreken we van een partiele orde in plaats van een totale orde."},{"t":"1","q":"Waarom mag je bij temperatuur in graden Celsius niet zeggen dat 28 graden dubbel zo warm is als 14 graden?","o":["Omdat verhoudingen enkel mogen bij variabelen in gehele getallen","Omdat temperatuur eigenlijk een categorische variabele is","Omdat de categorieen van deze schaal geen vaste volgorde hebben","Omdat het nulpunt arbitrair is en geen afwezigheid aanduidt"],"a":3,"u":"Nul graden betekent niet dat er geen temperatuur is, dus je mist het absolute nulpunt en verhoudingen zijn zinloos. De schaal is wel numeriek en geordend, en de intervallen zijn gelijk: het verschil tussen 37 en 39 graden is even groot als tussen 23 en 25 graden. Of een variabele in gehele getallen wordt uitgedrukt, heeft niets met verhoudingen te maken."},{"t":"1","q":"Bij welke van deze metingen duidt de waarde nul er echt op dat de gemeten eigenschap volledig afwezig is?","o":["Temperatuur in graden Celsius","Reactietijd in seconden","Een jaartal in onze tijdrekening","Motivatie gescoord op een schaal van 1 tot 5"],"a":1,"u":"Een reactietijd van nul betekent letterlijk geen reactietijd, dat is een absoluut nulpunt en dus een ratioschaal. Bij Celsius en bij een jaartal is het nulpunt afgesproken en dus arbitrair, en de motivatieschaal is een geordende reeks zonder echte nul."},{"t":"1","q":"Een docent zet de ruwe punten op 20 om in enkel de uitkomst geslaagd of niet geslaagd. Wat gebeurt er daarbij?","o":["Er verandert niets, want het meetniveau van de variabele blijft hetzelfde","Het meetniveau stijgt, want twee klassen zijn makkelijker te vergelijken","Het meetniveau daalt en een deel van de informatie gaat verloren","De variabele wordt continu, omdat de grens op een getal ligt"],"a":2,"u":"Een variabele met een hoog meetniveau mag je behandelen als een variabele met een lager meetniveau, maar daarbij gaat informatie verloren. Je gaat hier van een schaal met afstanden naar twee categorieen, dus je weet nog wie geslaagd is maar niet meer met hoeveel punten. Het meetniveau kan door zo een ingreep nooit stijgen."},{"t":"1","q":"Kledingmaten S, M en L staan in een duidelijke volgorde. Wat kan je op basis van die maten NIET besluiten?","o":["Hoe groot het verschil tussen twee maten precies is","Of twee personen exact dezelfde kledingmaat dragen","Welke van twee personen de grootste maat draagt","Of er tussen twee personen een verschil bestaat"],"a":0,"u":"Een ordinale schaal geeft de richting van het verschil, dus meer of minder, maar zegt niets over de grootte van dat verschil. Gelijkheid vaststellen en de volgorde bepalen kan hier wel, want identiteit en orde zitten allebei in dit meetniveau."},{"t":"1","q":"Waarom moeten de categorieen van een nominale variabele exhaustief en mutueel exclusief zijn?","o":["Zodat je de categorieen achteraf kunt ordenen van klein naar groot","Zodat de afstanden tussen de categorieen even groot worden","Zodat er in de codering een absoluut nulpunt ontstaat","Zodat elke case in precies een categorie valt"],"a":3,"u":"Dat is precies wat een partitie doet: de verzameling wordt opgedeeld in niet-overlappende klassen waarbij elk object tot een en slechts een groep behoort. Orde, gelijke afstanden en een absoluut nulpunt horen bij hogere meetniveaus en spelen op nominaal niveau geen rol."},{"t":"2","q":"Wat bedoelt men in dit hoofdstuk precies met de verdeling van een variabele?","o":["Enkel het gemiddelde en de spreiding van de meetwaarden","Enkel de laagste en de hoogste meetwaarde in de dataset","Welke waarden de variabele aanneemt en hoe vaak elke waarde voorkomt","Het verband tussen twee variabelen in eenzelfde tabel"],"a":2,"u":"Een verdeling zegt twee dingen tegelijk: welke waarden er voorkomen en met welke frequentie. Gemiddelde, spreiding en het bereik zijn samenvattende maten die je uit een verdeling haalt, maar ze zijn de verdeling niet, en een verband tussen twee variabelen hoort bij een heel andere analyse."},{"t":"2","q":"Je maakt een grafiek van lichaamslengte en een grafiek van het aantal juiste antwoorden op een examen. Waar mag er ruimte tussen de balkjes staan?","o":["Bij het aantal juiste antwoorden, want die waarden zijn telbaar","Bij lichaamslengte, want mensen verschillen sterk in lengte","Bij allebei, want ruimte maakt elke grafiek leesbaarder","Bij geen van beide, want het gaat in beide gevallen om kwantitatieve variabelen"],"a":0,"u":"Mensen groeien niet in sprongetjes van een centimeter, dus lengte is continu en de balkjes sluiten aan (histogram). Het aantal juiste antwoorden is telbaar, daar bestaan geen tussenwaarden en mag er ruimte tussen. Dat beide variabelen kwantitatief zijn verandert niets: het onderscheid continu versus discreet beslist."},{"t":"2","q":"Hoe verhoudt een staafdiagram zich volgens de cursus tot een kolomdiagram?","o":["Het zijn gewoon twee namen voor exact dezelfde grafiek","Een staafdiagram is een kolomdiagram met kolommen versmald tot lijnen","Een staafdiagram werkt altijd met relatieve frequenties, het andere type met absolute","Een staafdiagram past bij continue data, het andere type enkel bij nominale data"],"a":1,"u":"De cursus waarschuwt expliciet dat de twee niet identiek zijn: de kolommen worden versmald tot lijnen. Het verschil zit dus in de voorstelling, niet in het soort frequentie of in het meetniveau, want beide worden voor categorische of discrete gegevens gebruikt."},{"t":"2","q":"Wat is het voordeel van een histogram met relatieve frequenties tegenover een histogram met absolute frequenties?","o":["Je kunt er groepen mee vergelijken die niet even groot zijn","Je hoeft de klassengrenzen dan niet meer exact te bepalen","De vorm van de verdeling wordt er symmetrisch door","Je kunt er meteen de mediaan uit aflezen zonder verdere stappen"],"a":0,"u":"Relatieve frequenties zijn aandelen van het totaal (Fi gedeeld door N), waardoor groepen met een verschillend aantal waarnemingen toch vergelijkbaar worden. De klassenindeling blijft gewoon nodig, de vorm van de verdeling verandert niet, en voor de mediaan heb je de cumulatieve curve nodig."},{"t":"2","q":"Welke maat lees je het gemakkelijkst af uit een cumulatieve frequentiecurve?","o":["De modus, want dat is het hoogste punt van de curve","Het gemiddelde, want de curve stijgt regelmatig","De mediaan, door de cumulatieve frequentie in twee te splitsen","De klassenbreedte, want die staat op de verticale as"],"a":2,"u":"Splits je de cumulatieve frequentie in twee gelijke helften, dan vind je de middelste waarneming, en dat is de mediaan (bij twee middelste waarnemingen neem je de mediaan van die twee). De curve loopt altijd stijgend naar het totaal, dus haar hoogste punt zegt niets over de modus, en het gemiddelde volgt er evenmin rechtstreeks uit."},{"t":"2","q":"Bij het groeperen van continue meetwaarden moeten de klassen exhaustief en disjunct zijn. Wat houdt dat in?","o":["Alle klassen zijn even breed en starten bij nul","Elke meetwaarde hoort in een klasse thuis en de klassen overlappen elkaar niet","Elke klasse bevat evenveel waarnemingen en er blijft niets over","De klassen sluiten aan bij het meetniveau en mogen elkaar lichtjes overlappen"],"a":1,"u":"Exhaustief wil zeggen dat geen enkele meetwaarde buiten de indeling valt, disjunct dat geen enkele meetwaarde in twee klassen tegelijk past. Gelijke breedte of een gelijk aantal waarnemingen per klasse is geen voorwaarde, en overlap is net wat disjunct uitsluit."},{"t":"2","q":"Wat is het verschil tussen een homogene en een heterogene klasse?","o":["Een homogene klasse telt evenveel waarnemingen, een heterogene niet","Een homogene klasse hoort bij continue data, een heterogene bij nominale data","Een homogene klasse staat altijd onderaan in de frequentietabel, een heterogene bovenaan","Bij een homogene klasse blijft het meetniveau behouden, bij een heterogene niet"],"a":3,"u":"Het onderscheid draait volledig om het meetniveau: behoud ervan levert een homogene klasse op, verlaging een heterogene. Het aantal waarnemingen, de plaats in de tabel en het onderscheid continu versus nominaal spelen daarbij geen rol."},{"t":"2","q":"In welke situatie is een stam-en-loofdiagram de geschikte keuze?","o":["Bij grote datasets waarin je enkel de globale vorm van de verdeling wil zien","Bij nominale variabelen zoals haarkleur of geslacht","Bij tijdsreeksen, om een trend over de jaren heen te tonen","Bij kleine datasets waarbij je de exacte meetwaarden wil kunnen terugvinden"],"a":3,"u":"De sterkte van dit diagram is dat de oorspronkelijke cijfers zichtbaar blijven, en dat is enkel werkbaar bij een beperkte dataset. Voor de globale vorm bij veel data neem je een histogram, voor categorieën een staaf- of taartdiagram, en voor evolutie in de tijd een lijndiagram."},{"t":"2","q":"Wat doe je met de klassengrenzen bij een discrete variabele tegenover een continue variabele?","o":["Bij allebei tel je er 0,5 bij op om de exacte grenzen te krijgen","Bij een continue variabele trek je 0,5 af, bij een discrete laat je de grenzen staan","Bij een discrete variabele trek je 0,5 van de grenzen af, bij een continue niet","Bij allebei laat je de grenzen ongewijzigd en verschuif je enkel het klassenmidden"],"a":2,"u":"Discrete meetwaarden staan op een schaal met sprongen, dus je zet de grens 0,5 lager om de exacte klassengrens te krijgen die het onderliggende continue interval afbakent. Bij een continue variabele is die correctie overbodig, want daar liggen de grenzen al op een doorlopende schaal. Het klassenmidden bereken je pas daarna als (X+Y)/2."},{"t":"2","q":"Wat is het oordeel van de cursus over grafieken in drie dimensies?","o":["Ze zijn af te raden, want ze verminderen de leesbaarheid en vertekenen","Ze zijn de beste keuze bij categorische data omdat er meer informatie in past","Ze mogen zonder bezwaar, zolang je maar met absolute frequenties werkt","Ze vormen enkel bij continue variabelen een probleem, bij categorische niet"],"a":0,"u":"Diepte maakt een figuur visueel aantrekkelijk, maar de blokjes staan niet tegen de achterkant van de bodem, waardoor je bovenaan wat hoogte moet bijtellen en dus verkeerd afleest. Een taartdiagram in drie dimensies gebruik je volgens de cursus zelfs nooit. Een goede grafiek is overzichtelijk, duidelijk en eenvoudig leesbaar, en het type frequentie of het meetniveau lost dat leesprobleem niet op."},{"t":"3","q":"Je maakt een tijdcurve (time plot) van het aantal uren slaap van een deelnemer over twaalf weken. Hoe zet je de assen op?","o":["De gemeten variabele op de horizontale as en de tijd op de verticale as","Beide assen mag je vrij kiezen, zolang je het onderschrift maar duidelijk maakt","De tijd op de horizontale as en de gemeten variabele op de verticale as","De tijd op de horizontale as en de cumulatieve frequentie op de verticale as"],"a":2,"u":"Bij een tijdcurve staat de tijd altijd op de horizontale as en de gemeten variabele op de verticale as, dat is geen vrije keuze. Een cumulatieve frequentie hoort bij kwantielen, niet bij een tijdcurve."},{"t":"3","q":"In een dataset van reactietijden voeg je per ongeluk een deelnemer toe met een absurd hoge score. Wat gebeurt er met de centrummaten?","o":["Het rekenkundig gemiddelde wordt naar de staart getrokken, de mediaan verschuift nauwelijks","De mediaan schuift sterk mee omhoog, terwijl het gemiddelde gelijk blijft","Beide maten schuiven even sterk omhoog, want ze meten hetzelfde centrum","Geen van beide verandert, want een centrummaat gebruikt enkel de middelste waarden"],"a":0,"u":"Het gemiddelde gebruikt alle waarden in de som en wordt daardoor altijd naar de staart getrokken door extreme waarnemingen, het is dus geen robuuste maat. De mediaan kijkt enkel naar de positie van de middelste waarneming en blijft zo goed als op zijn plaats."},{"t":"3","q":"Hoe wordt het eerste kwartiel Q1 in dit hoofdstuk omschreven?","o":["De kleinste waarneming van de hele reeks","Het gemiddelde van de laagste helft van de waarnemingen","De waarde die precies een kwart van de variatiebreedte boven het minimum ligt","De mediaan van de waarnemingen die kleiner zijn dan de mediaan"],"a":3,"u":"Q1 is de mediaan van het deel van de reeks dat onder de mediaan ligt, net zoals Q3 de mediaan is van het deel erboven. Het is dus geen gemiddelde en het heeft niets te maken met de variatiebreedte of met het minimum."},{"t":"3","q":"Een onderzoeker rapporteert Q1 = 12, Q2 = 18 en Q3 = 24. Wat is de interkwartielafstand en wat zegt die?","o":["18, namelijk de mediaan, die het centrum van de reeks aangeeft","12, namelijk Q3 min Q1, de spreiding van de middelste helft van de waarnemingen","36, namelijk Q3 plus Q1, de totale breedte van de verdeling","6, namelijk het verschil tussen twee opeenvolgende kwartielen, de gemiddelde afwijking"],"a":1,"u":"De IKA is per definitie Q3 min Q1, hier dus 24 min 12 is 12, en beschrijft hoe breed de middelste helft van de gegevens ligt. Kwartielen optellen of enkel Q2 min Q1 nemen zijn geen gedefinieerde maten in dit hoofdstuk."},{"t":"3","q":"Bij welke grens spreek je van een extreme uitschieter in plaats van een gewone?","o":["Onder Q1 min 3 keer de IKA of boven Q3 plus 3 keer de IKA","Onder Q1 min 1.5 keer de IKA of boven Q3 plus 1.5 keer de IKA","Onder de mediaan min 3 keer de IKA of boven de mediaan plus 3 keer de IKA","Zodra een waarde buiten het minimum en maximum van de middelste helft valt"],"a":0,"u":"De grens van 1.5 keer de IKA voorbij Q1 of Q3 levert gewone buitenbeentjes op, pas bij 3 keer de IKA heet een waarneming extreem. De grenzen worden bovendien vanaf de kwartielen gerekend, niet vanaf de mediaan."},{"t":"3","q":"Welke van deze karakteristieke waarden is robuust, dus niet gevoelig voor buitenbeentjes?","o":["De variatiebreedte","De standaarddeviatie","De mediaan","Het rekenkundig gemiddelde"],"a":2,"u":"Maten die op alle waarnemingen steunen, zoals gemiddelde en standaarddeviatie, of net op de extreme waarden, zoals variatiebreedte, minimum en maximum, zijn gevoelig voor buitenbeentjes. De mediaan, de kwantielen en de interkwartielafstand zijn dat niet en heten daarom robuust."},{"t":"3","q":"Welke reeks gelijkheden klopt volgens dit hoofdstuk?","o":["Mediaan = Q1 = D1 = P25","Mediaan = Q2 = D5 = P50","Mediaan = Q3 = D5 = P75","Mediaan = Q2 = D2 = P20"],"a":1,"u":"De mediaan is het tweede kwartiel, het vijfde deciel en het vijftigste percentiel, want alle vier wijzen ze naar het punt waar de helft van de waarnemingen bereikt is. Q1 hoort bij P25 en Q3 bij P75, dat zijn andere posities in de verdeling."},{"t":"3","q":"Wat betekent het als in een verslag staat dat D3 gelijk is aan 41?","o":["Dat drie waarnemingen de waarde 41 hebben","Dat 41 procent van alle waarnemingen onder de meetwaarde 3 ligt","Dat de derde grootste waarneming gelijk is aan 41","Dat de cumulatieve frequentie bij 41 op 3/10 van de waarnemingen staat"],"a":3,"u":"Een deciel is een kwantiel dat de reeks in tienden verdeelt, dus D3 is de meetwaarde waar de cumulatieve frequentie 3/10 van alle waarnemingen bereikt. Het gaat om een positie in de opgebouwde verdeling, niet om hoe vaak een waarde voorkomt of om de derde grootste score."},{"t":"3","q":"Je beschrijft de maandinkomens in een steekproef waarin enkele mensen extreem veel verdienen. Welke keuze past het best bij het centrum van die verdeling, en waarom?","o":["De mediaan, omdat die robuust is en dus niet meegetrokken wordt door de hoge staart","Het rekenkundig gemiddelde, omdat het alle waarnemingen gebruikt en daardoor nauwkeuriger is","De variatiebreedte, omdat die meteen laat zien hoe ver de inkomens uit elkaar liggen","Het maximum, omdat de hoogste waarde het meest zegt over de verdeling"],"a":0,"u":"Precies omdat het gemiddelde alle waarden meetelt, wordt het door een paar zeer hoge inkomens naar de rechterstaart getrokken en overschat het het typische inkomen. De mediaan is robuust en geeft hier een eerlijker beeld, terwijl variatiebreedte en maximum spreidings- of randinformatie zijn en helemaal geen centrummaat."},{"t":"3","q":"Een testscore van 118 blijkt overeen te komen met P23. Hoe lees je dat correct?","o":["23 personen scoorden hoger dan die score","Bij die score staat de cumulatieve frequentie op 23 procent","De score ligt 23 punten boven de mediaan van de reeks","23 procent van de waarnemingen heeft precies deze score"],"a":1,"u":"Een percentiel is een kwantiel uitgedrukt in procenten, dus P23 is de meetwaarde waarbij de cumulatieve frequentie 23 procent van alle waarnemingen bedraagt. Het gaat dus om het opgestapelde aandeel tot die score, niet om een aantal personen erboven, niet om een afstand tot de mediaan en niet om hoeveel waarnemingen exact die score halen."},{"t":"4","q":"Een onderzoeker berekent voor elke deelnemer de waarde (xi min het gemiddelde). Wat heeft ze daarmee precies uitgerekend?","o":["De variantie van de steekproef","De variatiebreedte van de reeks","Een deviatiescore, dus hoe ver die waarneming van het gemiddelde ligt","De standaardafwijking van die ene waarneming"],"a":2,"u":"Een deviatiescore is het verschil tussen een waarneming en het gemiddelde en geeft dus de afstand tot het gemiddelde weer. De variantie en de standaardafwijking komen pas daarna, na kwadrateren en middelen, en de variatiebreedte kijkt enkel naar hoogste min laagste."},{"t":"4","q":"Waarom werkt men met gekwadrateerde deviaties in plaats van met de gewone gemiddelde afstand tot het gemiddelde?","o":["Omdat de gewone deviaties elkaar opheffen en je altijd nul zou uitkomen","Omdat kwadrateren de meeteenheid van de data bewaart","Omdat je zonder kwadraten geen mediaan kan bepalen","Omdat kwadrateren de invloed van uitschieters netjes wegwerkt"],"a":0,"u":"Positieve en negatieve afwijkingen heffen elkaar op, dus de gewone gemiddelde afstand is altijd nul en daarom neem je de omweg via de variantie. Kwadrateren negeert juist de richting en versterkt grote afstanden, waardoor uitschieters zwaarder meetellen, en de oorspronkelijke meeteenheid komt pas terug na het worteltrekken."},{"t":"4","q":"Wat is het verband tussen de variantie en de standaardafwijking?","o":["De standaardafwijking is de variantie gedeeld door het aantal waarnemingen","De variantie is de gemiddelde absolute afwijking en de standaardafwijking het kwadraat daarvan","Het zijn twee namen voor exact dezelfde waarde","De standaardafwijking is de vierkantswortel uit de variantie"],"a":3,"u":"De variantie is de gemiddelde gekwadrateerde afstand tot het gemiddelde, en daar trek je de vierkantswortel uit om bij de standaardafwijking te komen. Daardoor staat de standaardafwijking weer in dezelfde meeteenheid als de data, terwijl de variantie in kwadraten blijft steken."},{"t":"4","q":"Een student trekt een steekproef en wil daaruit de spreiding in de populatie schatten. Door welk getal deelt hij bij het berekenen van de variantie, en waarom?","o":["Door n, want anders overschat hij de spreiding systematisch","Door n - 1, want er zijn maar n - 1 vrijheidsgraden","Door n - 1, want een steekproef is per definitie te klein","Door het aantal categorieën van de variabele"],"a":1,"u":"Bij schatten deel je door het aantal vrijheidsgraden, en dat zijn er n - 1, omdat het gemiddelde uit dezelfde gegevens berekend is als de deviaties. Delen door n zou de spreiding onderschatten, de omvang van de steekproef op zich is niet de reden, en het aantal categorieën speelt hier geen enkele rol."},{"t":"4","q":"Voor welke variabele mag je zonder bezwaar een standaardafwijking rapporteren?","o":["Reactietijd in milliseconden","De studierichting van de deelnemers","De rangorde waarin deelnemers een taak afwerkten","De postcode van de woonplaats"],"a":0,"u":"De standaardafwijking is een spreidingsmaat rond het gemiddelde, dus je hebt minstens meetniveau interval of ratio nodig, en reactietijd voldoet daaraan. Studierichting en postcode zijn nominaal en een rangorde is ordinaal, dus daar kan je het gemiddelde niet zinvol berekenen, ook al staan er cijfers."},{"t":"4","q":"De inkomens in een steekproef vormen een duidelijk scheve verdeling met enkele zeer hoge uitschieters. Welk paar maten rapporteer je dan het best?","o":["Het gemiddelde en de standaardafwijking","De modus en de variatiebreedte","Het gemiddelde en de variatiecoëfficiënt","De mediaan en de interkwartielafstand"],"a":3,"u":"Bij scheve verdelingen of uitschieters zijn de mediaan en de interkwartielafstand geschikter, want die laten zich niet meeslepen door extreme waarden. Het gemiddelde en de standaardafwijking zijn juist wel gevoelig voor uitschieters en horen bij min of meer symmetrische verdelingen, en de variatiebreedte wordt volledig bepaald door de twee extreemste scores."},{"t":"4","q":"Temperatuurmetingen worden omgerekend van graden Celsius naar graden Fahrenheit. Wat is het gevolg voor de gegevens?","o":["De verdeling wordt symmetrischer, maar het centrum blijft liggen waar het lag","De vorm van de verdeling blijft dezelfde, maar het gemiddelde en de standaardafwijking krijgen andere waarden","Zowel de vorm als alle karakteristieke maten blijven ongewijzigd","Enkel het centrum verschuift, de spreiding blijft in getalwaarde gelijk"],"a":1,"u":"Een lineaire transformatie verandert niets aan de vorm van de frequentieverdeling, je legt in feite gewoon een andere X-as onder dezelfde data. De maten van centrum en spreiding schuiven en schalen wel mee, dus zowel het gemiddelde als de standaardafwijking krijgt een andere getalwaarde."},{"t":"4","q":"Twee onderzoekers meten op schalen met een heel verschillende grootteorde en willen de spreiding relatief met elkaar vergelijken. Welke maat is daarvoor bedoeld?","o":["De variatiebreedte","De interdecielafstand","De variatiecoëfficiënt","De gemiddelde absolute afwijking"],"a":2,"u":"De variatiecoëfficiënt is de verhouding tussen de standaardafwijking en het gemiddelde en zegt dus hoe groot de spreiding is ten opzichte van de schaal zelf. De drie andere maten blijven in de oorspronkelijke meeteenheid staan en zijn daardoor niet zomaar over verschillende schalen heen te vergelijken."},{"t":"4","q":"Wat geldt altijd voor een dichtheidskromme?","o":["De totale oppervlakte eronder is gelijk aan 1 en de curve blijft boven de X-as","De curve raakt de X-as precies in het midden van de verdeling","De oppervlakte eronder komt overeen met het aantal waarnemingen","De curve is per definitie symmetrisch rond het gemiddelde"],"a":0,"u":"Een dichtheidskromme beschrijft de verdeling met een gladde curve die boven de X-as blijft, want het gaat om kansen, en de totale oppervlakte is precies 1. Symmetrie is geen voorwaarde, en de oppervlakte staat voor een proportie of kans, niet voor een aantal waarnemingen."},{"t":"4","q":"In een tekst lees je dat het centrum gelijk is aan mu en de spreiding aan sigma. Waarover gaat het dan?","o":["Over de waargenomen data van de steekproef","Over een proportie binnen de steekproef","Over de deviatiescores van de ruwe gegevens","Over de dichtheidskromme, dus het model of de populatie erachter"],"a":3,"u":"Griekse letters zoals mu, sigma en pi horen bij de dichtheidskromme, dus bij de populatie of het model. Voor waargenomen data gebruik je x met een streepje, s en p, en deviatiescores krijgen geen apart symbool van dat type."},{"t":"5","q":"Welke twee kengetallen leggen een normaalverdeling volledig vast, zodat je met de notatie N(...) meteen weet over welke kromme het gaat?","o":["De mediaan en het bereik van de scores","De modus en het aantal observaties","Het gemiddelde en de standaarddeviatie","De klassenbreedte en de hoogte van de top"],"a":2,"u":"Elke normaalverdeling wordt volledig bepaald door haar verwachting (gemiddelde) en haar standaarddeviatie, vandaar de notatie N(mu ; sigma). Mediaan, modus, bereik of aantal observaties voegen daar niets aan toe, want de vorm ligt al vast zodra je die twee kent."},{"t":"5","q":"Een student krijgt op een toets een gestandaardiseerde score van z = 1,5. Wat betekent dat getal?","o":["De score ligt anderhalve standaarddeviatie boven het gemiddelde","De score ligt anderhalf punt boven het gemiddelde","Anderhalf procent van de groep scoort hoger dan deze student","De score valt precies op percentielrang 15"],"a":0,"u":"Standaardiseren zet ruwe waarden om via z = (x - mu) / sigma, en een z-score drukt dus uit hoeveel standaarddeviaties een waarde van het gemiddelde af ligt. Het gaat niet om ruwe punten, niet om een percentage en niet om een percentielrang, dat zijn andere schalen."},{"t":"5","q":"Volgens de 68-95-99.7 regel: hoeveel van de observaties liggen in een standaardnormaalverdeling tussen z = -2 en z = 2?","o":["Ongeveer 68 procent","Ongeveer 99,7 procent","Ongeveer 50 procent","Ongeveer 95 procent"],"a":3,"u":"De vuistregel koppelt 1 standaarddeviatie aan ongeveer 68 procent, 2 aan ongeveer 95 procent en 3 aan ongeveer 99,7 procent. De 68 hoort dus bij het interval van -1 tot 1 en de 99,7 bij -3 tot 3; 50 procent is enkel de helft links of rechts van het gemiddelde."},{"t":"5","q":"Je kent de z-score van een observatie en wil de bijbehorende ruwe waarde terugvinden. Welke bewerking hoort bij dat ontstandaardiseren?","o":["De z-score delen door de standaarddeviatie en daarna het gemiddelde eraf trekken","De z-score vermenigvuldigen met de standaarddeviatie en daar het gemiddelde bij optellen","De z-score vermenigvuldigen met het gemiddelde en daar de standaarddeviatie bij optellen","Het gemiddelde van de z-score aftrekken en het resultaat delen door de standaarddeviatie"],"a":1,"u":"Ontstandaardiseren is de omgekeerde weg van standaardiseren: x = mu + z maal sigma. Eerst aftrekken en dan delen door de standaarddeviatie is net de beweging heen, dus standaardiseren, en de varianten die het gemiddelde en de standaarddeviatie van rol wisselen vervormen de schaal onherkenbaar."},{"t":"5","q":"De empirische coëfficiënt van Pearson komt in een dataset uit op een duidelijk positieve waarde. Wat leid je daaruit af over de vorm van de verdeling?","o":["Ze is rechtsscheef, de staart loopt naar de rechterkant","Ze is linksscheef, de staart loopt naar de linkerkant","Ze is perfect symmetrisch rond het gemiddelde","Ze is sterker gepiekt dan een normaalverdeling"],"a":0,"u":"Die coëfficiënt meet in standaarddeviaties hoe groot het verschil tussen gemiddelde en mediaan is: kleiner dan 0 betekent linksscheef, gelijk aan 0 symmetrisch en groter dan 0 rechtsscheef. Gepiektheid is een aparte vormmaat (kurtosis) en zegt niets over scheefheid."},{"t":"5","q":"Waarom kun je in principe met slechts een van de twee standaardnormaaltabellen werken?","o":["Omdat z-waarden nooit negatief kunnen worden, zodat de tweede tabel leeg zou blijven","Omdat de kromme ophoudt bij drie standaarddeviaties en er daarbuiten niets meer te tabelleren valt","Omdat de tabel enkel bruikbaar is voor ruwe X-waarden en niet voor gestandaardiseerde scores","Omdat je met de complementregel de ontbrekende oppervlakte uit de gegeven oppervlakte kunt afleiden"],"a":3,"u":"De totale oppervlakte onder de kromme is 1, dus wat je niet aflezen kunt, haal je met de complementregel uit wat je wel afleest. Negatieve z-waarden bestaan wel degelijk, de staarten lopen theoretisch door voorbij 3, en de tabel is net gemaakt voor z-waarden."},{"t":"5","q":"Wat wordt binnen de maten van vorm bedoeld met kurtosis?","o":["De mate waarin de verdeling scheef ligt ten opzichte van het gemiddelde","De gepiektheid of afplatting van de kromme, met de normaalverdeling als middenreferentie","Het verschil tussen gemiddelde en mediaan, uitgedrukt in standaarddeviaties","De gemiddelde afstand van de scores tot het gemiddelde"],"a":1,"u":"Kurtosis is de vormmaat voor gepiektheid of afplatting, en een normaalverdeling geldt daarbij als de middenklasse (mesokurtisch). Scheefheid is een andere vormmaat, het verschil tussen gemiddelde en mediaan in standaarddeviaties is de empirische coëfficiënt van Pearson, en de gemiddelde afstand van de scores tot het gemiddelde is gewoon een spreidingsmaat."},{"t":"5","q":"Je benadert een discreet gemeten variabele met een continue verdeling en gebruikt bij de waarde 8 het interval van 7,5 tot 8,5. Waarom doe je dat?","o":["Om gemiddelde en standaarddeviatie van beide verdelingen exact gelijk te maken","Omdat een discrete waarde anders een negatieve kans zou krijgen","Omdat een afgeronde waarde in werkelijkheid een hele klasse dekt en je die klasse volledig in de oppervlakte moet meenemen","Omdat de normaalverdeling enkel gedefinieerd is voor gehele getallen"],"a":2,"u":"Dit is de continuïteitscorrectie: door af te ronden verandert een continue meting in een discreet punt, terwijl dat punt eigenlijk voor een heel klasse-interval staat. Je neemt dat volledige interval mee, anders reken je een stuk oppervlakte en dus een stuk kans niet mee."},{"t":"5","q":"Wat is de belangrijkste beperking van percentielrangen, die je in de gaten moet houden bij normaal kwantielplots?","o":["Ze respecteren de afstanden tussen de ruwe meetwaarden niet, want de stap van P40 naar P50 hoeft niet even groot te zijn als die van P50 naar P60","Ze kunnen alleen berekend worden bij verdelingen die perfect symmetrisch zijn","Ze veranderen het gemiddelde en de standaarddeviatie van de oorspronkelijke verdeling","Ze zijn enkel bruikbaar bij variabelen op nominaal meetniveau"],"a":0,"u":"Een percentielrang zegt alleen hoeveel procent onder je zit, niet hoeveel ruwe punten er tussen twee rangen liggen, dus gelijke stappen in rang zijn geen gelijke stappen in meetwaarde. De verdeling zelf wordt er niet door veranderd, en rangorde vraagt minstens ordinaal meetniveau, niet nominaal."},{"t":"5","q":"Bij de centrale momenten hoort een vast rijtje eigenschappen. Welke uitspraak klopt?","o":["Het eerste moment is het gemiddelde, het tweede de mediaan en het derde de modus","Het eerste moment is de variantie, het tweede is nul en het derde meet de gepiektheid","Centrale momenten met een even macht zijn maten voor asymmetrie","Het eerste moment is nul, het tweede is de variantie en het derde is een maat voor asymmetrie"],"a":3,"u":"De afwijkingen tot het gemiddelde tellen samen op tot nul, dus m1 = 0; m2 komt overeen met de variantie en m3 werkt als maat voor asymmetrie. Even machten geven spreidingsmaten en oneven machten maten voor asymmetrie, dus wie de even momenten aan asymmetrie koppelt draait het net om."},{"t":"6","q":"Je onderzoekt of het aantal uren slaap iets doet met de score op een geheugentest. Welke variabele is hier de verklarende (onafhankelijke) variabele?","o":["De testscore, want dat is het cijfer dat je effectief meet","Het aantal uren slaap, want dat verklaart of veroorzaakt de verandering in de andere variabele","Allebei, want bij samenhang zijn de rollen van de twee variabelen altijd inwisselbaar","Geen van beide, want zo'n variabele moet altijd categorisch zijn"],"a":1,"u":"De verklarende variabele verklaart of veroorzaakt veranderingen in de verklaarde variabele, en de verklaarde (afhankelijke) variabele meet de uitkomst van de studie. De testscore is dus de uitkomst, en de rollen liggen vast zodra je bepaalt wat je wil verklaren."},{"t":"6","q":"Bij welk soort verband laat de meetwaarde van de ene variabele toe om de meetwaarde van de andere perfect te voorspellen?","o":["Een analytisch verband","Een stochastisch verband","Een monotoon dalend verband","Een niet-monotoon verband"],"a":0,"u":"Bij een analytisch verband volgt de ene waarde exact uit de andere, bij een stochastisch verband kun je enkel min of meer correct schatten. Monotoon of niet-monotoon gaat over de richting van het verband, niet over hoe perfect de voorspelling is."},{"t":"6","q":"In een scatterplot gaat elke toename op de x-as samen met een toename op de y-as, en de richting keert nergens om. Hoe omschrijf je dat verband?","o":["Niet-monotoon stijgend, want de punten liggen niet exact op een rechte","Analytisch, want de richting blijft dezelfde","Monotoon stijgend","Monotoon dalend"],"a":2,"u":"Monotoon stijgend betekent precies dat: verandering op x gaat altijd samen met een stijging op y, zonder richtingsverandering. Niet-monotoon zou betekenen dat de richting regelmatig omslaat, en analytisch slaat op perfecte voorspelbaarheid, niet op de richting."},{"t":"6","q":"Je wil de samenhang nagaan tussen twee dichotome variabelen, bijvoorbeeld wel of niet gestudeerd en wel of niet geslaagd. Welke associatiemaat hoort daarbij?","o":["De Pearson correlatie r","Lambda","Een t-test","De determinatiecoëfficiënt r kwadraat"],"a":1,"u":"Voor twee dichotome variabelen gebruik je lambda, die uitdrukt welk deel van de oorspronkelijke voorspelfouten wegvalt zodra je de tweede variabele kent. De correlatie r hoort bij twee continue variabelen en een t-test bij een continue met een dichotome variabele."},{"t":"6","q":"Je vergelijkt de reactietijd (continu) tussen twee groepen, namelijk wel of niet uitgeslapen (dichotoom). Welke techniek past bij die combinatie van meetniveaus?","o":["Lambda, omdat die met foutenreductie werkt","Een driedimensionale scatterplot, omdat er twee soorten variabelen zijn","Pearson correlatie, want die kan met elk meetniveau overweg","Een t-test"],"a":3,"u":"Bij een combinatie van een continue en een dichotome variabele hoort de t-test. Lambda vraagt twee dichotome variabelen, en de correlatie r vraagt twee kwantitatieve variabelen (of een kwantitatieve met een dichotome), dus zeker niet elk meetniveau."},{"t":"6","q":"Uit een studie komt een correlatie van 0,60 tussen studietijd en examenscore. Wat leer je uit de bijhorende determinatiecoëfficiënt?","o":["Dat 60 procent van de variantie in de examenscore verklaard wordt door studietijd","Dat studietijd 36 procent van de examenscore veroorzaakt","Dat 36 procent van de variantie in de examenscore verklaard wordt door studietijd","Dat 36 procent van de gegevens uitschieters zijn die het beeld vertekenen"],"a":2,"u":"De determinatiecoëfficiënt is de correlatie in het kwadraat, dus 0,60 maal 0,60 is 0,36 of 36 procent verklaarde variantie. Je mag die 60 procent dus niet rechtstreeks aflezen uit r, en verklaarde variantie is nog altijd geen bewijs van oorzaak."},{"t":"6","q":"Studie A vindt een correlatie van -0,85, studie B vindt 0,40. In welke studie is de lineaire samenhang het sterkst?","o":["In studie B, want een positief verband weegt zwaarder dan een negatief","In allebei even sterk, want enkel het teken verschilt","In studie A, want de sterkte zit in hoe ver de waarde van nul ligt en het minteken geeft enkel de richting aan","Dat valt niet te zeggen zolang je de steekproefgrootte niet kent"],"a":2,"u":"De correlatie loopt van -1 (perfect negatief) over 0 (geen samenhang) tot 1 (perfect positief), dus hoe verder van nul, hoe sterker. Het teken zegt alleen of het verband stijgend of dalend is, niet hoe sterk het is."},{"t":"6","q":"In een dataset hangt het aantal verkochte ijsjes sterk samen met het aantal zonnesteken, met een correlatie van 0,80. Wat mag je daaruit besluiten?","o":["Dat er een verband bestaat, maar niet dat het ene het andere veroorzaakt","Dat ijsjes eten zonnesteken veroorzaakt, want de correlatie is hoog","Dat er nog geen verband is zolang de waarde niet gelijk is aan 1","Dat de rol van verklarende variabele automatisch vastligt bij zo'n hoge waarde"],"a":0,"u":"Correlatie geeft enkel aan dat er een verband is, ze impliceert geen oorzakelijk verband. Een waarde van 0,80 wijst op een sterk lineair verband, dus zeker niet op geen verband, en welke variabele verklarend is bepaal jij op inhoudelijke gronden."},{"t":"6","q":"Waarom is het volgens de cursus een goede gewoonte om altijd eerst een scatterplot te tekenen voor je de correlatie berekent?","o":["Omdat je de correlatie pas mag berekenen vanaf drie variabelen","Omdat je zo een niet-lineair verband kunt uitsluiten, want die maat vat enkel de lineaire samenhang","Omdat de figuur de kans op een sterk resultaat vergroot","Omdat de figuur afwijkende punten automatisch uit de gegevens haalt"],"a":1,"u":"De tip in de cursus is om eerst een scatterplot te maken zodat je een eventueel niet-lineair verband uitsluit, en meteen ziet of er uitschieters zijn, want de correlatie is daar gevoelig voor. Een figuur verwijdert natuurlijk niets uit je data en verandert je resultaat niet."},{"t":"6","q":"Je hebt een scatterplot van studietijd tegenover examenscore en wil daar ook de opleidingsrichting in tonen. Hoe pak je zo'n categorische variabele aan?","o":["Je zet de richting op de y-as en de examenscore op de x-as","Je laat de figuur vallen en rapporteert enkel een aparte correlatie per groep","Dat kan niet, in een scatterplot passen nooit meer dan twee variabelen","Je geeft de datapunten per categorie een andere kleur"],"a":3,"u":"Een categorische variabele voeg je toe door de punten per categorie anders te kleuren, zodat je de twee kwantitatieve assen behoudt. Voeg je een derde variabele op intervalschaal toe, dan kijk je wel naar een driedimensionale figuur."},{"t":"7","q":"Wat wordt er precies zo klein mogelijk gemaakt bij de methode van de kleinste kwadraten voor de rechte van y op x?","o":["De som van de gekwadrateerde verticale afstanden van de datapunten tot de rechte","De som van de gekwadrateerde horizontale afstanden van de datapunten tot de rechte","De som van de afwijkingen zelf, dus zonder ze eerst te kwadrateren","De som van de loodrechte (kortste) afstanden van elk punt tot de rechte"],"a":0,"u":"De kleinste-kwadratenrechte van y op x minimaliseert de som van de kwadraten van de verticale afstanden, en die verticale afstanden zijn net de residuen. Horizontale of loodrechte afstanden horen niet bij dit model, en de gewone afwijkingen zonder kwadraat heffen elkaar op omdat plus en min elkaar wegvegen."},{"t":"7","q":"In de regressievergelijking y-dak = b0 + b1x, wat drukt b1 uit?","o":["De voorspelde waarde van de afhankelijke variabele wanneer de verklarende variabele nul is","Het percentage van de variantie in y dat door x verklaard wordt","Het gemiddelde van de afhankelijke variabele in de steekproef","De verandering in y die hoort bij een toename van x met een eenheid"],"a":3,"u":"b1 is de helling en geeft dus aan hoeveel y verandert als x met een eenheid toeneemt. Het intercept b0 is de voorspelde y bij x gelijk aan nul, en het aandeel verklaarde variantie is r kwadraat, niet de helling."},{"t":"7","q":"Door welk punt loopt een kleinste-kwadratenregressierechte hoe dan ook?","o":["Door de oorsprong, dus door het punt (0,0)","Door het punt gevormd door het gemiddelde van x en het gemiddelde van y","Door de laagste en de hoogste waarneming van de dataset","Door het punt gevormd door de mediaan van x en de mediaan van y"],"a":1,"u":"Een vaste eigenschap van de regressierechte is dat ze altijd door het punt van de twee gemiddelden gaat. Door de oorsprong gaat ze alleen toevallig, en medianen of extreme waarnemingen spelen in dit model geen rol."},{"t":"7","q":"Een onderzoeker vindt r = 0,40 tussen studietijd en examenscore. Iemand scoort 1 standaarddeviatie boven het gemiddelde op studietijd. Wat voorspelt het model voor de examenscore?","o":["Ongeveer 1 standaarddeviatie boven het gemiddelde, want de rechte is lineair","Ongeveer 0,16 standaarddeviatie boven het gemiddelde","Ongeveer 0,40 standaarddeviatie boven het gemiddelde","Niets, want deze regel geldt enkel als je de rechte in z-waarden opschrijft"],"a":2,"u":"In z-scores geldt dat z-dak van y gelijk is aan r maal z van x, dus een verschuiving van 1 standaarddeviatie in x hoort bij r standaarddeviaties in y, hier 0,40. Die regel blijft ook gelden als de rechte niet in z-waarden staat, en 0,16 is r kwadraat, dat gaat over verklaarde variantie."},{"t":"7","q":"Bij een waarneming hoort een negatief residu. Wat weet je dan over dat punt?","o":["Het ligt onder de regressierechte, want de echte waarde is lager dan de voorspelde","Het ligt boven de regressierechte, want de echte waarde is hoger dan de voorspelde","De voorspelling voor dat punt was perfect en er valt niets meer te verklaren","De helling van de rechte is negatief, dus het verband tussen x en y is omgekeerd"],"a":0,"u":"Een residu is de waargenomen waarde min de geschatte waarde, dus negatief betekent dat het bolletje onder de rechte ligt. Een residu van nul zou een perfecte voorspelling zijn, en het teken van een residu zegt niets over de richting van het verband."},{"t":"7","q":"Wat wil je zien in een residuendiagram als de lineaire regressie goed past?","o":["Een duidelijk stijgende lijn van residuen, dat toont een sterk verband","Een mooie kromme, bijvoorbeeld een U-vorm, rond de nullijn","Residuen die allemaal exact nul zijn, anders is het model onbruikbaar","Residuen die willekeurig rond nul verspreid liggen zonder herkenbaar patroon"],"a":3,"u":"Een residuendiagram zet de residuen uit tegenover de verklarende variabele om de fit van de rechte te beoordelen, en een willekeurige wolk rond nul wijst erop dat er niets systematisch overblijft. Elk patroon, zoals een stijging of een kromme, wijst juist op een afwijking van het lineaire verband, en residuen die allemaal precies nul zijn komen in de praktijk niet voor."},{"t":"7","q":"Een deelnemer is een uitschieter in de x-richting: zijn x-waarde ligt ver buiten het bereik van de rest van de groep. Wat is hiervan het typische gevolg?","o":["Hij heeft een heel groot residu en verstoort daardoor vooral de spreiding van y","Hij heeft sowieso geen invloed, zolang zijn y-waarde niet extreem is","Hij heeft veel invloed: de rechte verschuift merkbaar als je hem weglaat","Hij duwt de correlatiecoëfficiënt automatisch naar nul"],"a":2,"u":"Uitschieters in de x-richting hebben vaak een grote invloed op de kleinste-kwadratenrechte, zodat die sterk verandert wanneer je zo een punt verwijdert. Een groot residu hoort bij uitschieters in de y-richting, dus een gewone y-waarde betekent zeker niet dat zo een punt onschuldig is."},{"t":"7","q":"Een model is gebouwd op deelnemers tussen 18 en 25 jaar. Je gebruikt het om de score van een zestigjarige te schatten. Hoe heet dat en wat betekent het voor je schatting?","o":["Interpolatie, en dat is meestal net de betrouwbaarste manier van schatten","Extrapolatie, en dat brengt vaak veel meer onzekerheid mee","Extrapolatie, en dat is even betrouwbaar zolang de rechte goed past binnen het bereik","Interpolatie, al is de onzekerheid groter dan bij schatten buiten het bereik"],"a":1,"u":"Schatten buiten het bereik van de beschikbare data heet extrapoleren en gaat gepaard met veel grotere onzekerheid, zeker ver van de waargenomen x-waarden. Schatten binnen het bereik heet interpoleren en is doorgaans betrouwbaarder, dus die twee begrippen worden hier makkelijk omgewisseld."},{"t":"7","q":"Er wordt een t-toets gebruikt om na te gaan of een correlatiecoëfficiënt significant van nul verschilt. Welke bedenking hoort daarbij?","o":["Die toets werkt enkel wanneer beide variabelen dichotoom zijn","De uitkomst van de toets hangt helemaal niet af van de steekproefgrootte","Een p-waarde onder 0,05 bewijst meteen dat x de oorzaak is van y","Met een voldoende groot aantal deelnemers krijg je vrijwel altijd een significant resultaat"],"a":3,"u":"De kritiek is precies dat N zo groot gekozen kan worden dat de toets bijna altijd een significant verband oplevert, ook bij een piepklein effect. De t-waarde hangt dus juist wel van N af, de toets werkt ook met een kwantitatieve variabele en een dummy, en significantie zegt niets over oorzakelijkheid."},{"t":"7","q":"Twee variabelen vertonen een hoge correlatie. Welke conclusie is verantwoord?","o":["Er kan een verborgen derde variabele meespelen, want samenhang betekent niet automatisch oorzaak en gevolg","Het oorzakelijk verband is aangetoond, zeker als r dicht bij 1 of bij min 1 ligt","Uitschieters spelen bij zo een sterk verband geen rol meer in de analyse","Een spreidingsdiagram bekijken is overbodig zodra r hoog genoeg is"],"a":0,"u":"Correlatie beschrijft een lineair verband, maar impliceert niet altijd causaliteit, en een verborgen derde variabele kan de samenhang veroorzaken zonder dat ze in de analyse zit. Uitschieters beïnvloeden zowel correlatie als regressie sterk, dus een spreidingsdiagram maken en bekijken blijft altijd de eerste stap."},{"t":"8","q":"Waarvoor dient een contingentietabel?","o":["Om de gemiddelden van twee continue variabelen naast elkaar te zetten","Om de spreiding van 1 numerieke variabele in beeld te brengen","Om de relatie tussen twee categorische variabelen te analyseren, met de frequenties in de cellen","Om te toetsen of een variabele normaal verdeeld is"],"a":2,"u":"Een contingentietabel zet twee categorische variabelen tegen elkaar af, met frequenties in de cellen en de marginale frequenties buiten de tabel. Gemiddelden, spreiding en normaliteit horen bij numerieke variabelen en niet bij dit type tabel."},{"t":"8","q":"Waarom is het handig om in zo'n tabel met relatieve in plaats van absolute frequenties te werken?","o":["Omdat je groepen die niet even groot zijn dan toch eerlijk met elkaar kunt vergelijken","Omdat absolute aantallen niet in een tweedimensionele tabel passen","Omdat je de marginale totalen dan niet meer hoeft te berekenen","Omdat je pas met percentages een oorzaak-gevolgverband kunt aantonen"],"a":0,"u":"Percentages of verhoudingen maken vergelijken mogelijk zonder dat je in elke groep identiek dezelfde aantallen nodig hebt. De marginale totalen blijf je gewoon nodig, aantallen passen prima in een tabel, en causaliteit toon je nooit aan met een rekenwijze."},{"t":"8","q":"Iemand berekent alleen de verdeling van elke variabele apart. Wat lukt daarmee niet?","o":["Zien hoeveel cases er in elke categorie van 1 variabele vallen","Uitspraken doen over de samenhang tussen de twee variabelen","De totalen buiten de tabel aflezen","Een grafiek maken van 1 van de twee variabelen"],"a":1,"u":"Marginale verdelingen gaan over 1 variabele tegelijk en zeggen dus niets over het verband tussen de twee. Voor dat verband moet je naar de voorwaardelijke verdelingen kijken, terwijl de andere drie opties net wel uit de marginale info volgen."},{"t":"8","q":"Wat beschrijft een voorwaardelijke verdeling precies?","o":["De ruwe aantallen in elke cel van de tabel","Het totaal aantal cases in de hele steekproef","Het verschil tussen waargenomen en verwachte celfrequenties","De waarden van de ene variabele bij cases die een specifieke waarde hebben op de andere variabele, uitgedrukt in percentages"],"a":3,"u":"Je legt eerst 1 variabele vast op een bepaalde waarde, bijvoorbeeld 1 rij, en kijkt dan hoe de andere variabele zich binnen die groep verdeelt in percentages. Ruwe celaantallen en totalen zijn daarvoor de input, en het verschil met verwachte frequenties hoort bij chi-kwadraat."},{"t":"8","q":"Je hebt per rij de voorwaardelijke verdelingen berekend. Welke stap sluit het stappenplan af?","o":["Ze grafisch vergelijken in een zij-aan-zij of gesegmenteerd strookdiagram","Een spreidingsdiagram met regressielijn tekenen","Een histogram van de marginale totalen maken","Een normaalcurve over de celfrequenties leggen"],"a":0,"u":"Het stappenplan eindigt met een grafiek van de voorwaardelijke verdelingen, en die vergelijk je zij aan zij of in een gesegmenteerde variant. Spreidingsdiagrammen en normaalcurves horen bij numerieke variabelen, en een histogram van de marginalen laat het verband juist weer los."},{"t":"8","q":"Wat is de kern van de paradox van Simpson?","o":["Het verband wordt automatisch sterker zodra je een derde variabele opneemt","De richting van het verband draait om of het verband verdwijnt wanneer je de subgroepen tot 1 groep samenvoegt","Twee variabelen lijken onafhankelijk puur omdat de steekproef te klein is","De cellen van de tabel bevatten te weinig cases om percentages te berekenen"],"a":1,"u":"Bij Simpson zie je binnen elke subgroep een bepaald patroon, maar zodra alles op 1 hoop gaat keert dat patroon om of valt het weg, zoals bij het verband tussen het aantal pagina's en de prijs van een boek. Steekproefgrootte en lege cellen zijn andere problemen, en een derde variabele maakt een verband niet vanzelf sterker."},{"t":"8","q":"In een studie is het verband tussen twee variabelen duidelijk aanwezig bij de ene subgroep en zo goed als afwezig bij de andere. Welk derde-variabele-probleem is dit?","o":["Mediatie, want de derde variabele is de tussenstap die het verband verklaart","Confounding, want de derde variabele correleert met beide variabelen en verstoort zo het verband","Gemeenschappelijke afhankelijkheid, want beide variabelen hangen van eenzelfde oorzaak af","Moderatie, want de sterkte van het verband hangt af van de subgroep"],"a":3,"u":"Moderatie betekent precies dit: de relatie tussen de twee variabelen verschilt binnen de subgroepen die door de derde variabele gedefinieerd worden. Bij mediatie zit de derde variabele als tussenstap in de keten, bij confounding vertekent ze het beeld via correlatie met beide, en bij gemeenschappelijke afhankelijkheid is er tussen x en y zelf geen causaal verband."},{"t":"8","q":"Je bekijkt de samenhang tussen 1 continue en 1 dichotome variabele. Welke techniek hoort daarbij?","o":["Lambda","De correlatie r","Een t-test","Een gesegmenteerd strookdiagram"],"a":2,"u":"Het overzicht koppelt twee dichotome variabelen aan lambda, twee continue variabelen aan de correlatie r, en de combinatie van 1 continue met 1 dichotome variabele aan de t-test. Een strookdiagram is een grafiek en geen associatiemaat."},{"t":"8","q":"Wat vertelt lambda je over twee nominale variabelen?","o":["Welk percentage cellen in de tabel leeg blijft","Hoe steil de rechte is die het beste door de puntenwolk loopt","Hoeveel beter je de uitkomst op de ene variabele voorspelt als je de score op de andere kent","Hoe sterk de waargenomen frequenties afwijken van wat je bij onafhankelijkheid verwacht"],"a":2,"u":"Lambda is een associatiemaat voor nominale data en drukt winst in voorspelbaarheid uit: hoeveel beter voorspel je de ene variabele als je de andere kent. De afwijking tussen waargenomen en verwachte frequenties is chi-kwadraat, en een helling hoort bij numerieke variabelen."},{"t":"8","q":"Waarop steunt de chi-kwadraatbenadering bij een contingentietabel?","o":["Op het vergelijken van de gemiddelden van twee groepen","Op het vergelijken van de waargenomen frequenties met de frequenties die je bij statistische onafhankelijkheid zou verwachten","Op de winst in voorspelbaarheid van de ene variabele door de andere","Op de sterkte van het lineaire verband tussen twee numerieke variabelen"],"a":1,"u":"De verwachte frequentie van een cel volgt uit de marginale verdelingen: je vermenigvuldigt het bijhorende rijtotaal met het kolomtotaal en deelt door N, en dat leg je naast wat je echt geteld hebt. Gemiddelden vergelijken is de t-test, winst in voorspelbaarheid is lambda en een lineair verband is r."},{"t":"9","q":"Waarom wordt de rangcorrelatie van Spearman met hetzelfde symbool aangeduid als de correlatie van Pearson?","o":["Omdat je bij Spearman gewoon de ruwe scores gebruikt, alleen met een andere formule","Omdat Spearman net als Pearson enkel bij interval- of ratiodata mag worden gebruikt","Omdat Spearman letterlijk de Pearson-correlatie is, maar dan berekend op de rangen in plaats van op de ruwe meetwaarden","Omdat beide maten vertrekken van het aantal concordante en discordante paren"],"a":2,"u":"Spearman zet de ruwe meetwaarden eerst om naar rangen (dus naar ordinale data) en berekent daarop een Pearson-correlatie, vandaar hetzelfde symbool met een s erbij. De ruwe scores worden dus juist niet gebruikt, ordinaal niveau volstaat, en het tellen van concordante en discordante paren hoort bij tau en gamma."},{"t":"9","q":"Een onderzoeker ziet een samenhang die altijd stijgt, maar met heel ongelijke stappen, de puntenwolk loopt duidelijk krom. Welke uitspraak klopt?","o":["Spearman kan hier hoog uitvallen omdat die een monotoon verband meet, terwijl Pearson lager blijft omdat die beschrijft hoe goed een rechte lijn past","Pearson valt hier altijd hoger uit, want ruwe scores bevatten meer informatie dan rangen","Beide maten moeten dezelfde waarde geven, want elk monotoon verband is ook lineair","Geen van beide maten mag je hier gebruiken, want de samenhang volgt geen rechte lijn"],"a":0,"u":"Pearson meet hoe goed een rechte lijn de samenhang beschrijft, een rangcorrelatie meet of de variabelen consistent samen stijgen of dalen, ook als de vorm krom is. Elk lineair verband is monotoon, maar niet elk monotoon verband is lineair, dus de maten hoeven zeker niet gelijk te zijn."},{"t":"9","q":"Bij het toekennen van rangen kom je twee personen tegen met exact dezelfde meetwaarde, die samen de plaatsen 2 en 3 innemen. Hoe pak je dat aan?","o":["Allebei krijgen ze rang 2 en de eerstvolgende waarneming krijgt rang 3","Je laat die twee waarnemingen weg, want ze zijn niet te ordenen","Wie het eerst in de tabel staat krijgt rang 2, de andere krijgt rang 3","Allebei krijgen ze 2,5 als rang en de eerstvolgende waarneming krijgt rang 4"],"a":3,"u":"Bij gelijke meetwaarden noteer je de gemiddelde rang van de plaatsen die ze innemen, dus (2+3)/2 = 2,5 voor allebei, en daarna spring je door naar 4 omdat plaats 3 al opgebruikt is. Zomaar 2 en 3 verdelen of naar volgorde in de tabel toekennen is willekeurig, en waarnemingen weglaten mag niet."},{"t":"9","q":"Wat stelt Di voor in de formule van Spearman, en welke controle kan je daarmee doen?","o":["Het verschil tussen de ruwe scores van paar i, de som van alle verschillen hoort 1 te zijn","Het verschil tussen de twee rangnummers binnen paar i, als controle moet de som van alle Di's 0 zijn","Het al gekwadrateerde verschil tussen de rangnummers, waarvan de som per definitie 0 is","Het aantal concordante paren min het aantal discordante paren bij waarneming i"],"a":1,"u":"Di is het verschil tussen de rangnummers binnen eenzelfde paar, en omdat de plussen en de minnen elkaar opheffen moet de som van alle Di's uitkomen op 0, een handige rekencontrole voor je verder gaat. Pas daarna kwadrateer je, want een som van kwadraten is bijna nooit 0, en concordante of discordante paren horen bij tau en gamma."},{"t":"9","q":"Twee variabelen zijn allebei gemeten als een rangorde, bijvoorbeeld de plaats van elke student in een klassement. Welke maat is hier het meest gepast?","o":["Een rangcorrelatiecoëfficiënt, want de gegevens zitten op ordinaal niveau","De Pearson-correlatie, want die is in alle omstandigheden de sterkste maat","De Pearson-correlatie, op voorwaarde dat je de rangen eerst omzet naar z-scores","Geen enkele correlatiemaat, samenhang meten kan pas vanaf intervalniveau"],"a":0,"u":"Pearson veronderstelt interval- of ratiodata, terwijl rangcorrelaties precies gemaakt zijn voor ordinaal niveau of hoger, dus hier is een rangcorrelatie de gepaste keuze. Rangen omzetten naar z-scores maakt de data niet plots intervalgeschikt, en samenhang meten kan wel degelijk bij ordinale gegevens."},{"t":"9","q":"Wat is het verschil tussen de noemer van Kendall's tau en die van gamma?","o":["Tau deelt door concordant plus discordant, gamma deelt door het totale aantal paren","Allebei delen ze door het totale aantal paren, maar gamma trekt daar de discordante paren nog van af","Tau deelt door het aantal concordante paren en gamma door het aantal discordante paren","Tau deelt door het totale aantal paren, geknoopte paren inbegrepen, gamma deelt enkel door concordant plus discordant"],"a":3,"u":"De teller is bij beide maten hetzelfde, namelijk concordante paren min discordante paren, het verschil zit volledig in de noemer: tau houdt alle paren in de noemer, ook de geknoopte, terwijl gamma die geknoopte paren eruit gooit. De noemer van gamma is daardoor gelijk of kleiner, nooit groter."},{"t":"9","q":"In een dataset zitten heel wat gelijke meetwaarden, dus veel ex aequo. Wat verwacht je van tau en gamma?","o":["Tau wordt groter dan gamma, want tau baseert zich op meer paren","Gamma wordt groter dan tau, want gamma laat de geknoopte paren uit de noemer vallen","Tau en gamma blijven exact gelijk, ties spelen bij geen van beide een rol","Gamma wordt kleiner dan tau, want gamma verliest informatie door de ties weg te laten"],"a":1,"u":"Een kleinere noemer bij dezelfde teller geeft een grotere breuk, en omdat gamma de geknoopte paren schrapt komt gamma hoger uit dan tau zodra er ex aequo zijn. Tau corrigeert wel voor die ties, wat een voorzichtiger en realistischer, maar lager cijfer oplevert."},{"t":"9","q":"Wat betekent het dat een paar waarnemingen discordant is?","o":["De twee waarnemingen hebben op allebei de variabelen precies dezelfde score","De twee waarnemingen gaan op beide variabelen samen omhoog","Wie hoger scoort op de ene variabele, scoort lager op de andere, de volgorde wordt dus niet gerespecteerd","Het paar is niet te ordenen en valt daarom sowieso buiten elke berekening"],"a":2,"u":"Discordant wil zeggen dat de volgorde tussen de twee scores niet gerespecteerd wordt, bijvoor
