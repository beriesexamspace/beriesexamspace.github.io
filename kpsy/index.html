<script>
window.KP = {"questions":[{"t":"1","q":"Wat is volgens de tekst het kernonderscheid tussen classificatie en diagnostiek?","o":["Classificatie beschrijft WAT er aan de hand is bij groepen, terwijl diagnostiek verklaart HOE het bij een individu zo gekomen is","Classificatie legt de oorzaken van de klachten vast, terwijl diagnostiek zich beperkt tot het opsommen van symptomen volgens vaste criteria","Classificatie betreft een individu en diagnostiek betreft groepen","Classificatie is voorwaardelijk voor goede hulpverlening en diagnostiek geeft slechts richting"],"a":0,"u":"Classificatie is beschrijvend, gaat over groepen en beantwoordt de wat-vraag. Diagnostiek is verklarend, gaat over het individu, beantwoordt de hoe-vraag en is voorwaardelijk voor goede hulpverlening."},{"t":"1","q":"Waar staat de afkorting DSM voor?","o":["Diagnostic Standard for Mental Diseases","Descriptive and Statistical Model of Mental Disturbances","Diagnostic and Statistical Manual of Mental Disorders","Directory of Somatic and Mental Disorders"],"a":2,"u":"DSM is het Diagnostic and Statistical Manual of Mental Disorders, het classificatiesysteem waarop de klinische psychiatrie zich baseert."},{"t":"1","q":"Een patiënt met een psychotische kwetsbaarheid gaat op jongvolwassen leeftijd risicovolle milieus opzoeken waar hij meer aan cannabis wordt blootgesteld. Welk begrip beschrijft dit best?","o":["Gen-omgevingsinteractie","Gen-omgevingscorrelatie","Gen-geninteractie (epistase)","Heritabiliteit"],"a":1,"u":"Bij gen-omgevingscorrelatie zet de genetische kwetsbaarheid iemand ertoe aan zelf risicovolle milieus op te zoeken die op die kwetsbaarheid inspelen, zoals psychotische aanleg die tot cannabisgebruik leidt."},{"t":"1","q":"Wat is volgens de tekst het grootste kritiekpunt op de DSM-5?","o":["De betrouwbaarheid","De interbeoordelaarsovereenstemming","De validiteit","Het aantal categorieën"],"a":2,"u":"De validiteit (meten we wel het juiste?) is het grootste kritiekpunt, want de DSM zegt niets over beloop, behandeling of uitlokkende en onderhoudende factoren. De betrouwbaarheid is juist redelijk hoog."},{"t":"1","q":"Als wat wordt het bio-psycho-sociaal model in de tekst gehanteerd?","o":["Als medisch ziektemodel waarbij enkel biologische oorzaken de stoornis bepalen","Als stresskwetsbaarheidsmodel op basis van draagkracht en draaglast","Als puur categoriaal classificatiemodel","Als sociologisch model van de ziekterol"],"a":1,"u":"Het model wordt gehanteerd als stresskwetsbaarheidsmodel, waarbij psychopathologie optreedt door een disbalans tussen draagkracht en draaglast."},{"t":"1","q":"Factoren zoals cannabisgebruik dat een psychose uitlokt, noemt men in de structuurdiagnose:","o":["Predisponerende (voorbeschikkende) factoren","Perpetuerende (onderhoudende) factoren","Precipiterende (uitlokkende) factoren","Protectieve factoren"],"a":2,"u":"Precipiterende of uitlokkende factoren zijn de triggers die de stoornis doen ontstaan, zoals cannabis bij psychose. Predisponerende factoren maken kwetsbaar en perpetuerende factoren houden de stoornis in stand."},{"t":"1","q":"Wat kenmerkt een categoriale classificatie?","o":["Een kwalitatief, dichotoom onderscheid tussen ziek en gezond (aan- of afwezig)","Een kwantitatief onderscheid van meer of minder op een continuüm","Situering naar de mate van gelijkenis met een prototypisch voorbeeld","Een score op klachten via vragenlijsten met taxatie"],"a":0,"u":"Categoriale classificatie gaat uit van een kwalitatief onderscheid (alles of niets) tussen ziek en gezond, waarbij stoornissen in afgebakende, niet-overlappende klassen worden ingedeeld."},{"t":"1","q":"Welk verklaringsmodel wordt in de historische indeling aan de DSM-5 gekoppeld?","o":["Het Freud-model","Het Kraepelin-model","Het neurowetenschappen-model","Het antipsychiatrische model"],"a":2,"u":"DSM-I en II worden gekoppeld aan het Freud-model, DSM-III en IV aan het Kraepelin-model, en de DSM-5 aan het neurowetenschappen-model, vooral nuttig voor neurocognitieve ziektes."},{"t":"1","q":"Wat is het verschil tussen incidentie en prevalentie zoals beschreven in de tekst?","o":["Incidentie telt alle oude en nieuwe gevallen, prevalentie enkel de nieuwe","Incidentie telt enkel nieuwe gevallen in een periode, prevalentie telt oude en nieuwe gevallen","Incidentie wordt in de psychiatrie het vaakst gebruikt, prevalentie zelden","Beide tellen enkel nieuwe gevallen, maar incidentie drukt dat uit per leeftijdsgroep en prevalentie per regio"],"a":1,"u":"Incidentie is het aantal nieuwe gevallen in een bepaalde periode, terwijl prevalentie zowel oude als nieuwe gevallen omvat. In de psychiatrie spreekt men vaker over (lifetime) prevalentie."},{"t":"1","q":"Onder de normatieve criteria voor normaliteit wordt integratie verstaan als:","o":["De mate waarin iemand autonoom en zelfredzaam kan functioneren","Dat het steeds dezelfde persoon is die handelt en gebeurtenissen kan integreren in gedachten, gevoelens en gedragingen","De manier waarop iemand zich via coping aanpast aan wisselende omstandigheden","De mate waarin iemand opgenomen wordt in het sociale netwerk en zijn plaats vindt binnen gezin, werk en samenleving"],"a":1,"u":"Integratie betekent dat het steeds dezelfde persoon is die handelt en ervaringen kan integreren in denken, voelen en gedrag. Het tegenovergestelde is psychische desintegratie, zoals bij psychose."},{"t":"1","q":"Wat stelt de tekst over causaliteit in de psychiatrie?","o":["In de psychiatrie is er bijna nooit sprake van causaliteit, wel van risico- of protectieve factoren (correlatie)","Correlatie en causaliteit zijn in de psychiatrie identiek","Elke psychiatrische stoornis heeft een duidelijke wetmatige oorzaak-gevolgrelatie","Causaliteit staat vast zodra een risicofactor bij de grote meerderheid van de patienten met die stoornis aanwezig blijkt"],"a":0,"u":"In de psychiatrie is bijna nooit sprake van echte causaliteit. Men spreekt over risico- of protectieve factoren, dus over samenhang of correlatie, want correlatie is niet gelijk aan causaliteit."},{"t":"1","q":"Bij een eeneiige (MZ) tweeling met schizofrenie is de concordantie 'slechts' ongeveer 48%. Wat leidt de tekst hieruit af?","o":["Het genetisch aandeel is verwaarloosbaar, aangezien de concordantie onder de helft blijft","Unieke, niet-gedeelde omgevingsfactoren maken een groot verschil voor de expressie","Schizofrenie wordt volledig deterministisch door genen bepaald","De gedeelde omgeving is volledig verantwoordelijk voor het verschil"],"a":1,"u":"Ondanks 100% genetische overlap en een gedeelde omgeving is de concordantie bij MZ-tweelingen maar ongeveer 48%. Dat toont dat unieke omgevingsfactoren een groot verschil maken en de expressie niet deterministisch is."},{"t":"1","q":"Welke stelling over de trias psychica (psychische hoofdfuncties) klopt volgens de tekst?","o":["Ze bestaat uit bewustzijn, waarneming en geheugen","Ze bestaat uit denken, voelen en willen","Ze bestaat uit id, ego en superego","Ze bestaat uit nature, nurture en interactie"],"a":1,"u":"De trias psychica omvat de hoofdfuncties denken, voelen en willen, die in het onderzoek terugkeren als cognitieve, affectieve en conatieve functies."},{"t":"1","q":"Wat is volgens de tekst het verschil tussen een obsessie en een waan?","o":["Een obsessie is ego-syntoon en past bij de persoon, terwijl een waan door de patient zelf als vreemd en onjuist wordt ervaren","Bij een obsessie is er geen enkele twijfel, bij een waan wel","Een obsessie is ego-dystoon (dwanggedachte), terwijl bij een waan geen twijfel bestaat over de juistheid ervan","Een obsessie is een inhoudelijke waarnemingsstoornis, een waan een formele denkstoornis"],"a":2,"u":"Obsessies zijn ego-dystone dwanggedachten, terwijl bij wanen geen twijfel bestaat over de juistheid ervan. Overwaardige ideeën zijn juist ego-syntoon en waanachtige ideeën laten nog enige twijfel toe."},{"t":"2","q":"Wat is het belangrijkste kenmerk waarin een delirium zich onderscheidt van een dementie?","o":["Bij een delirium is het bewustzijn verstoord en is acute interventie nodig","Bij een delirium blijven de jeugdherinneringen het langst bewaard","Bij een delirium verloopt het beloop altijd sluipend over jaren","Bij een delirium zijn er nooit lichamelijke oorzaken aanwezig"],"a":0,"u":"Bij de meeste stoornissen is het bewustzijn niet verstoord, maar bij een delirium wel. Daardoor moet men acuter ingrijpen, want het kan levensbedreigend zijn."},{"t":"2","q":"Iemand van 68 raakt bij normaal verouderen soms wat vergeetachtig. Wanneer spreekt de leerstof van een alarmsignaal richting een dementieel proces?","o":["Zodra iemand ouder wordt dan 65 jaar","Bij een combinatie van geheugenaantasting en desoriëntatie","Zodra de kloktest 15 minuten duurt","Alleen als het impliciete geheugen als eerste wegvalt"],"a":1,"u":"Desoriëntatie alleen maakt nog geen dementieel proces. Het moet gaan om een combinatie van geheugenaantasting en desoriëntatie bij een 65-plusser, dat geldt als alarmsignaal."},{"t":"2","q":"In welke volgorde treedt desoriëntatie doorgaans op bij een dementieel proces?","o":["Eerst persoon, dan plaats, dan tijd","Eerst plaats, dan persoon, dan tijd","Eerst tijd, dan plaats, dan persoon","Alle drie tegelijk vanaf het begin"],"a":2,"u":"De gradatie in de leerstof is: eerst desoriëntatie in tijd, dan in plaats en ten slotte in persoon."},{"t":"2","q":"Welke functie heeft de MMSE volgens de bron?","o":["Het is een diagnostisch instrument dat op zich de diagnose dementie stelt","Het is een screeningsinstrument dat het neurocognitief functioneren snel in kaart brengt","Het meet uitsluitend de stemming en het angstniveau, waardoor het vooral bij depressie wordt afgenomen","Het is een behandeltechniek die het aftakelingsproces omkeert"],"a":1,"u":"De MMSE is een screeningsinstrument (niet diagnostisch) om snel het neurocognitief functioneren in kaart te brengen, vooral bij Alzheimer, en wordt herhaald afgenomen om de evolutie te volgen."},{"t":"2","q":"Welke groep symptomen is volgens de leerstof kenmerkend voor de corticale functiestoornissen die Alzheimer onderscheiden van meer subcorticale beelden?","o":["Afasie, apraxie en agnosie","Hypertensie, roken en hartinfarct","Tremor, hypokinesie en houdingsafwijkingen","Confabulaties, tremor en syncope"],"a":0,"u":"Corticale functiestoornissen betreffen de hersenschors en omvatten onder meer afasie, apraxie en agnosie. Zij onderscheiden Alzheimer van meer subcorticale dementiebeelden."},{"t":"2","q":"Wat wordt in de bron bedoeld met apraxie?","o":["Het niet meer kunnen herkennen van voorwerpen via de zintuigen","Het onvermogen om geschreven taal te begrijpen of te produceren ondanks een normaal gezichtsvermogen","Het niet meer op een naam kunnen komen of woorden vinden","Het niet kunnen uitvoeren van een doelgerichte handeling ondanks de fysieke mogelijkheid"],"a":3,"u":"Apraxie is het niet kunnen uitvoeren van een doelgerichte handeling, terwijl de fysieke mogelijkheid er wel is. De persoon wordt onhandig."},{"t":"2","q":"Waarom is het onderscheid tussen depressie en dementie klinisch lastig, en wat is volgens de bron differentiërend voor dementie?","o":["Er is weinig overlap, en enkel de leeftijd is differentiërend","Er is grote overlap, en de corticale functiestoornissen zijn differentiërend voor dementie","Er is grote overlap, en het interesseverlies is differentiërend voor dementie","Er is geen overlap, en de klachten over het geheugen zijn bij dementie altijd sterker uitgesproken dan bij depressie"],"a":1,"u":"Depressie en dementie overlappen sterk (geheugenstoornissen, executieve problemen, interesseverlies). De corticale functiestoornissen (afasie, apraxie, agnosie) zijn differentiërend voor dementie."},{"t":"2","q":"Een patiënt komt geagiteerd op de spoeddienst na alcoholonthouding. Welk subtype delirium past hierbij?","o":["Hypoactief-hypoalert (stil delirium)","Gemengd delirium met wisselende alertheid","Hyperactief-hyperalert (geagiteerd delirium)","Amnestisch delirium"],"a":2,"u":"Het hyperactieve-hyperalerte, geagiteerde delirium is het bekendste subtype. De patiënt komt geagiteerd op de spoedafdeling terecht, meestal door onthouding zoals een alcoholonthoudingsdelier."},{"t":"2","q":"Volgens de vergelijking delirium versus dementie versus depressie: hoe is het begin en de duur bij een delirium?","o":["Acuut begin, met een duur van dagen tot weken","Sluipend begin, met een duur van maanden tot jaren","Begin over enkele weken, met een duur van weken tot maanden","Acuut begin, met een duur van maanden tot jaren"],"a":0,"u":"Een delirium begint acuut en duurt dagen tot weken, terwijl dementie sluipend begint (maanden tot jaren) en depressie over enkele weken (weken tot maanden)."},{"t":"2","q":"Wat is het uitgangspunt van de behandeling bij dementie volgens de leerstof?","o":["Cure: het aftakelingsproces volledig genezen en omkeren","Care: de levenskwaliteit van de patiënt verbeteren","Uitsluitend chirurgisch ingrijpen op de hersenen","De patiënt zo snel mogelijk plaatsen zonder verdere zorg"],"a":1,"u":"De behandeling is somatisch van aard en geënt op quality of life: het gaat om CARE, niet cure. De levenskwaliteit kan wel verbeterd worden."},{"t":"3","q":"Waarom kan een verslaving zorgen voor exclusie bij het vaststellen van een ander ziektebeeld?","o":["Omdat een geintoxiceerde toestand het gedrag al kan verklaren, waardoor geen ander ziektebeeld betrouwbaar kan worden vastgesteld","Omdat verslaving altijd wijst op een onderliggende persoonlijkheidsstoornis die eerst behandeld moet worden","Omdat de patient met verslaving per definitie geen ziektebesef heeft, waardoor elke uitspraak over andere klachten onbetrouwbaar wordt","Omdat middelen de bloed-hersenbarriere niet passeren en daardoor geen invloed hebben op de diagnose"],"a":0,"u":"Volgens de bron geldt exclusie: als de patient geintoxiceerd is, kan dat het gedrag verklaren en kan er geen ander ziektebeeld worden vastgesteld."},{"t":"3","q":"Iemand vergroot voortdurend de hoeveelheid van een middel om nog hetzelfde effect te bereiken. Om welk verschijnsel gaat het?","o":["Craving","Preoccupatie","Tolerantie","Onthouding"],"a":2,"u":"Tolerantie is de behoefte om de hoeveelheid sterk te vergroten om hetzelfde effect te krijgen, of het krijgen van minder effect bij dezelfde hoeveelheid."},{"t":"3","q":"Onder welke groep psychoactieve stoffen vallen cocaine, amfetamine, nicotine en cafeine volgens de indeling in de bron?","o":["Psycholeptica (dempende werking)","Psychodysleptica (verstoring van de waarneming)","Psychoanaleptica (stimulerende werking)","Sedativa (angstremmende werking)"],"a":2,"u":"De bron plaatst cocaine, amfetamine, nicotine en cafeine bij de psychoanaleptica, de stoffen met een stimulerende werking."},{"t":"3","q":"Wat wordt in de bron bedoeld met alcoholhallucinose, in tegenstelling tot een gewone hallucinatie?","o":["Een kortdurende black-out waarbij het geheugen tijdelijk uitvalt","Een zeer levendige, meestal visuele hallucinatie die veel angst en agitatie opwekt","Een ritmische oogbeweging die de patient niet zelf kan sturen","Een voorbijgaande spraakstoornis waarbij de patient moeizaam articuleert maar helder blijft"],"a":1,"u":"De bron beschrijft alcoholhallucinose als een heel levendige, meestal visuele hallucinatie die meestal veel angst en agitatie opwekt, zoals beestjes die over de muur kruipen."},{"t":"3","q":"Een huisarts gebruikt de CAGE-vragenlijst. Wat betekent een enkel bevestigend antwoord volgens de bron?","o":["De patient voldoet meteen aan de diagnose middelenafhankelijkheid","Er is een verhoogd risico dat verder moet worden geexploreerd","De patient moet direct residentieel worden opgenomen","Het gebruik is met zekerheid nog binnen de normale richtlijnen"],"a":1,"u":"Volgens de bron duidt een bevestigend antwoord op een van de CAGE-vragen op een verhoogd risico dat verder moet worden verkend, waarna afstemming met de patient volgt."},{"t":"3","q":"Hoe wordt verslavingspathologie binnen het medisch-biologische model vandaag opgevat volgens de bron?","o":["Als een teken van zwakke wilskracht bij de persoon","Als een louter sociaal aangeleerd gedrag zonder lichamelijke basis","Als in essentie een hersenziekte met veranderingen in het brein","Als een voorbijgaande fase die vanzelf verdwijnt bij volwassenheid"],"a":2,"u":"Vanuit neurowetenschappelijk onderzoek stelt de bron dat iemand met verslavingspathologie in essentie een hersenziekte heeft, tegenover de oudere opvatting dat het om een zwak persoon zou gaan."},{"t":"3","q":"Wat zegt de bron over de prognose na behandeling van zeven jaar alcoholafhankelijkheid?","o":["Ongeveer de helft wordt volledig abstinent en de rest blijft doordrinken","Vrijwel iedereen blijft na de behandeling blijvend abstinent, waardoor terugval binnen tien jaar uitzonderlijk is","De meerderheid sterft binnen twee jaar na de behandeling","Ongeveer een derde blijft abstinent, een derde blijft doordrinken en een derde sterft binnen tien jaar"],"a":3,"u":"De bron beschrijft de prognose als een derde abstinent, een derde die blijft doordrinken en een derde die binnen tien jaar sterft."},{"t":"3","q":"Waarom benadrukt de bron dat motivering vooraf moet gaan aan gedragsverandering bij de behandeling?","o":["Omdat detoxificatie zonder uitdrukkelijke toestemming van de patient wettelijk niet toegelaten is","Omdat je de patient eerst wil meekrijgen, aangezien ziektebesef vaak nog ontbreekt","Omdat farmacotherapie pas werkt nadat het gedrag al veranderd is","Omdat motivering enkel in de onderhoudende fase een rol speelt"],"a":1,"u":"De bron stelt dat je niet eerst het gedrag moet proberen veranderen maar eerst moet motiveren om de patient mee te krijgen, mede omdat ziektebesef vaak nog niet aanwezig is."},{"t":"4","q":"Hoe lang moeten de symptomen bij schizofrenie tijdens de acute fase minstens een groot deel van de tijd aanwezig zijn, en hoe lang moeten er in totaal tekenen van de stoornis zijn?","o":["Minstens een maand actieve symptomen, met in totaal minstens zes maanden tekenen van de stoornis","Minstens twee weken actieve symptomen, met in totaal minstens een maand tekenen van de stoornis","Minstens een dag actieve symptomen, met in totaal minstens een maand tekenen van de stoornis","Minstens zes maanden actieve symptomen, met in totaal minstens een jaar tekenen van de stoornis"],"a":0,"u":"Een maand lang moeten er een groot deel van de tijd minstens twee symptomen zijn, en in totaal minstens zes maanden tekenen van de stoornis, met daarbinnen minstens een maand acute decompensatie."},{"t":"4","q":"Iemand vertoont weinig emotionele reactie, een uitdrukkingsloos gelaat en spraakarmoede. Onder welke symptoomcluster vallen deze verschijnselen?","o":["Positieve symptomen","Katatone symptomen","Negatieve symptomen","Formele denkstoornissen"],"a":2,"u":"Negatieve symptomen verwijzen naar de afwezigheid van zaken die normaal wel aanwezig zijn, zoals affectieve vervlakking, alogie (spraakarmoede) en avolitie."},{"t":"4","q":"Waarom worden negatieve symptomen tegenwoordig als bijzonder belangrijk gezien in het beloop van schizofrenie?","o":["Ze zijn altijd het eerst te behandelen en verdwijnen snel met medicatie","Ze bepalen mee het beloop en de prognose en zijn gelinkt aan suicidaliteit","Ze zijn een teken dat de patient volledig zal herstellen","Ze komen alleen voor bij de waanstoornis"],"a":1,"u":"Vandaag weet men dat negatieve symptomen het beloop en de prognose mee bepalen, en dat hieraan ook suicidaliteit gelinkt is."},{"t":"4","q":"Wat is volgens de dopaminehypothese het neurobiologische mechanisme achter de positieve symptomen van schizofrenie?","o":["Een verlaagde dopaminetransmissie in het limbisch systeem","Een verhoogde dopaminetransmissie in het limbisch systeem","Een verhoogde serotoninetransmissie in de frontale kwab","Een tekort aan noradrenaline in de hippocampus"],"a":1,"u":"De dopaminehypothese koppelt positieve symptomen aan een verhoogde (hyperdopaminerge) transmissie in het limbisch systeem, terwijl negatieve symptomen bij een verlaagde frontale transmissie horen."},{"t":"4","q":"Hoe werken klassieke neuroleptica (eerstegeneratie antipsychotica) volgens de bron?","o":["Ze verhogen de dopamineaanmaak in de frontale kwab","Ze blokkeren de heropname van serotonine","Ze blokkeren de dopamine-D2-receptoren","Ze versterken de histaminerge transmissie"],"a":2,"u":"Neuroleptica blokkeren de dopamine-D2-receptoren; de eerste generatie werkt vooral op de positieve symptomen en niet op de negatieve."},{"t":"4","q":"Een patient met schizofrenie krijgt bewegingsstoornissen zoals rigiditeit, een schuifelende gang en tremoren. Hoe worden deze bijwerkingen genoemd?","o":["Serotonerge bijwerkingen","Cholinerge bijwerkingen","Histaminerge bijwerkingen","Extrapiramidale bijwerkingen"],"a":3,"u":"Bewegingsstoornissen zoals parkinsonisme (rigiditeit, schuifelende gang, tremoren) horen bij de dopaminerge, extrapiramidale bijwerkingen van antipsychotica."},{"t":"4","q":"Wat is het belangrijkste tijdscriterium dat de schizofreniforme stoornis onderscheidt van schizofrenie?","o":["Een episode duurt minstens een maand maar korter dan zes maanden","Een episode duurt langer dan twaalf maanden","Een episode duurt minstens een dag maar korter dan een maand","Er is geen enkel tijdscriterium van toepassing"],"a":0,"u":"Bij de schizofreniforme stoornis duurt een episode minstens een maand maar korter dan zes maanden, terwijl schizofrenie minstens zes maanden tekenen vereist."},{"t":"4","q":"Wat kenmerkt de waanstoornis in vergelijking met schizofrenie?","o":["Bizarre wanen samen met een ernstig verstoorde gedachtegang","Niet-bizarre wanen terwijl het algemene functioneren grotendeels intact blijft","Aanhoudende hallucinaties zonder wanen, met een sterk verstoord dagelijks functioneren","Een volledig beeld van zowel positieve als negatieve symptomen"],"a":1,"u":"Bij de waanstoornis gaat het om niet-bizarre wanen zonder stoornis van de gedachtegang, waarbij het algemene functioneren intact blijft en de prognose gunstiger is."},{"t":"4","q":"Welke vier fasen onderscheidt de bron in het beloop van schizofrenie, in de juiste volgorde?","o":["Prodromale, premorbide, acute en restfase","Acute, premorbide, prodromale en restfase","Premorbide, prodromale, acute fase en restperiode","Restperiode, acute, prodromale en premorbide fase"],"a":2,"u":"Het beloop verloopt in vier fasen: de premorbide fase (biologische kwetsbaarheid), de prodromale fase (gedragsindicatoren), de acute fase en de restperiode."},{"t":"4","q":"Wat beschrijft het stresskwetsbaarheidsmodel als verklaring voor het ontstaan van een psychose?","o":["Een psychose ontstaat uitsluitend door een genetische mutatie zonder rol voor de omgeving","Een aangeboren kwetsbaarheid en een draaglast die de draagkracht overtreft, waardoor decompensatie volgt","Een psychose wordt volledig veroorzaakt door hersenschade zichtbaar op beeldvorming","Een psychose ontstaat pas wanneer de draagkracht groter wordt dan de draaglast die iemand te verwerken krijgt"],"a":1,"u":"In het stresskwetsbaarheidsmodel is er een genetische voorbeschiktheid (diathese) waarbij de kwetsbaarheid groeit; wanneer de draaglast de draagkracht overtreft, volgt een psychotische decompensatie."},{"t":"5","q":"Een patiënt heeft al twee jaar een lichte maar aanhoudende neerslachtige stemming, meer dagen wel dan niet, met wat slaapproblemen en een laag zelfbeeld, zonder dat het ooit uitgroeit tot een volledige depressieve episode. Welke diagnose past hier het best bij?","o":["Dysthyme stoornis","Majeure depressie met seizoenpatroon","Cyclothyme stoornis","Gemengde episode"],"a":0,"u":"De dysthyme stoornis is de mildere, meer chronische unipolaire vorm die minstens twee jaar duurt met een depressieve stemming het grootste deel van de dag, maar zonder de zwaarte van een volledige depressieve episode."},{"t":"5","q":"Wat betekent de term anhedonie zoals die bij de affectieve symptomen van een depressieve episode wordt gebruikt?","o":["Een overheersend gevoel van schuld en zelfverwijt","Het afwezig zijn van het vermogen om plezier te beleven","Een sterk verhoogde afleidbaarheid","Aanhoudende gedachten aan de dood"],"a":1,"u":"Anhedonie wordt in de bron omschreven als de afwezigheid van het vermogen om plezier te beleven, en valt onder de affectieve symptomen van een depressieve episode."},{"t":"5","q":"Hoeveel symptomen zijn er minimaal nodig, en gedurende welke periode, om van een depressieve episode te spreken?","o":["Minstens 3 symptomen gedurende minstens een week","Minstens 5 symptomen gedurende minstens twee weken","Minstens 4 symptomen gedurende minstens vier dagen","Minstens 5 symptomen gedurende minstens twee jaar"],"a":1,"u":"De bron stelt dat een depressieve episode 5 of meer symptomen vereist gedurende ten minste twee weken."},{"t":"5","q":"Wat is het belangrijkste verschil tussen een hypomane en een manische episode volgens de leerstof?","o":["Bij hypomanie is de stemming juist somber in plaats van verhoogd","Een hypomane episode verschilt van manie doordat ze langer aanhoudt en steeds op een depressieve episode volgt","Bij hypomanie ontbreken duidelijke beperkingen in het functioneren en zijn er geen psychotische verschijnselen","Hypomanie komt alleen voor bij bipolaire stoornis type 1"],"a":2,"u":"Een hypomane episode is niet ernstig genoeg om duidelijke beperkingen te veroorzaken of hospitalisatie nodig te maken en gaat niet gepaard met psychotische verschijnselen, in tegenstelling tot een manische episode."},{"t":"5","q":"Een clinicus vergelijkt bipolaire stoornis type 1 en type 2. Wat kenmerkt type 2?","o":["Manische episodes gecombineerd met depressieve episodes","Hypomane episodes gecombineerd met depressieve episodes","Uitsluitend depressieve episodes zonder enige verhoogde stemming","Manische episodes zonder enige depressieve component"],"a":1,"u":"Type 1 bestaat uit manische plus depressieve episodes, terwijl type 2 hypomane episodes combineert met depressieve episodes en een gunstiger beloop kent."},{"t":"5","q":"Wat zegt de leerstof over de erfelijkheid (heritabiliteit) van depressie versus bipolaire stoornis?","o":["Depressie is sterker erfelijk dan bipolaire stoornis","Beide hebben dezelfde heritabiliteit, waarbij de omgeving nauwelijks meespeelt","Bipolaire stoornis heeft een veel hogere heritabiliteit dan depressie","Geen van beide stoornissen is erfelijk bepaald"],"a":2,"u":"De heritabiliteit van depressie is ongeveer 0,35, terwijl die van bipolaire stoornis rond de 0,80 tot 0,85 ligt, dus beduidend hoger."},{"t":"5","q":"Volgens de negatieve triade uit de cognitieve theorie heeft een depressieve persoon een negatief beeld over drie zaken. Welke drie zijn dat?","o":["Het verleden, de familie en het lichaam","Zichzelf, de omgeving en de toekomst","De omgeving, de dood en anderen","Zichzelf, geld en werk"],"a":1,"u":"De negatieve triade omvat een negatief beeld over zichzelf, over de omgeving en over de toekomst."},{"t":"5","q":"Waarom worden SSRI's selectief genoemd, en waarvoor moet men bij deze middelen oppassen?","o":["Ze remmen vooral de afbraak van serotonine en veroorzaken vooral gewichtstoename","Ze werken vooral op serotonine door de heropname te remmen, met risico op een manische episode en suicidaliteit","Ze werken vooral op dopamine en kunnen katatonie uitlokken","Ze remmen de heropname van serotonine en noradrenaline, met vooral een zwaar bijwerkingsprofiel voor het hart"],"a":1,"u":"SSRI's remmen selectief de heropname van serotonine, dus vooral op serotonine en niet op andere neurotransmitters, en de leerstof waarschuwt voor het uitlokken van een manische episode en voor suicidaliteit."},{"t":"5","q":"Bij welke stoornis wordt lithium als stemmingsstabilisator ingezet, en wat hoort daarbij?","o":["Bij bipolaire stoornis, als onderhoudsbehandeling waarbij regelmatige controles nodig zijn","Bij lichte unipolaire depressie, in plaats van psychotherapie","Bij dysthymie, als eenmalige kortdurende kuur zonder dat bloedspiegels opgevolgd moeten worden","Bij atypische depressie, als eerste keuze boven MAO-remmers"],"a":0,"u":"Lithium is een stemmingsstabilisator voor bipolaire stoornissen en wordt als zwaardere onderhoudsbehandeling ingezet waarbij regelmatige controles nodig zijn."},{"t":"5","q":"Wat is bekend over de lifetime prevalentie en de sekseverdeling van depressie volgens de epidemiologie in dit hoofdstuk?","o":["Ongeveer 6%, en tweemaal zo vaak bij mannen","Minder dan 1,9%, en even vaak bij mannen en vrouwen","Ongeveer 10 tot 20%, en tweemaal zo vaak bij vrouwen","Ongeveer 40%, en uitsluitend bij vrouwen"],"a":2,"u":"De lifetime prevalentie van depressie ligt op 10 tot 20% en komt tweemaal zo vaak voor bij vrouwen als bij mannen, deels door hormonale kwetsbaarheid in combinatie met coping."},{"t":"6","q":"Wat onderscheidt pathologische angst (angststoornis) van normale angst volgens de tekst?","o":["Pathologische angst treedt alleen op bij een reeel gevaar en verdwijnt snel","Pathologische angst is buiten proporties intens of langdurig, of komt zonder angstopwekkende prikkel voor","Pathologische angst gaat nooit gepaard met lichamelijke verschijnselen en speelt zich enkel in de gedachten af","Pathologische angst komt uitsluitend bij kinderen voor"],"a":1,"u":"Normale angst is een beschermende reactie op een echte prikkel, terwijl pathologische angst ongewoon intens of langdurig is of optreedt zonder angstopwekkende prikkel, waarbij een neutrale stimulus toch angst uitlokt."},{"t":"6","q":"Waarom ligt bij de meeste angststoornissen het accent op een psychologische in plaats van een biologische behandeling?","o":["Omdat elke vorm van angst per definitie aangeleerd is, waardoor er geen enkele biologische factor bij het ontstaan meespeelt","Omdat het verklaringsmodel vooral psychologisch is, waardoor therapie op de voorgrond staat en farmacologie minder impact heeft","Omdat angststoornissen zeldzaam zijn en therapie goedkoper is","Omdat biologische behandeling altijd tolerantie veroorzaakt"],"a":1,"u":"Bij de verklaringsmodellen ligt het accent op het psychologische model, zodat een therapeutische interventie voorop staat en de biologische of farmacologische behandeling minder impact heeft."},{"t":"6","q":"Een therapeut rangschikt samen met de patient diverse angstklachten op intensiteit om niet meteen met de heftigste angst te beginnen. Welke techniek is dit?","o":["Responspreventie","Angsthierarchie of angstthermometer","EMDR met begeleide ritmische oogbewegingen","Assertiviteitstraining"],"a":1,"u":"Bij de angsthierarchie of angstthermometer worden angstklachten op intensiteit gerangschikt, zodat men in therapie niet direct met de meest intense angst hoeft te starten."},{"t":"6","q":"Welke uitspraak past het best bij de specifieke fobie zoals in de tekst beschreven?","o":["Het gaat om buitensporige bezorgdheid over meerdere gebeurtenissen gedurende zes maanden","Het is een aanhoudende irrationele angst voor een afgelijnd object of situatie, waarbij de persoon erkent dat de angst ongegrond is","Het draait om terugkerende dwanggedachten die de persoon met rituele handelingen probeert te neutraliseren om de spanning te doen dalen","Het is een reactie op een afgelijnd trauma met herbeleving en vermijding"],"a":1,"u":"De specifieke of enkelvoudige fobie is een afgelijnde, aanhoudende en irrationele angst voor een bepaald object of situatie, waarbij de persoon zelf erkent dat de angst feitelijk ongegrond is."},{"t":"6","q":"Volgens het leertheoretisch model bij de specifieke fobie: hoe wordt het vermijdingsgedrag aangeleerd?","o":["Via klassieke conditionering","Via operante conditionering","Via een hyperreactief noradrenaline-systeem","Via een dysfunctie van serotonine en GABA"],"a":1,"u":"In het psychologische leertheoretisch model wordt de angst aangeleerd via klassieke conditionering en het vermijdingsgedrag via operante conditionering."},{"t":"6","q":"Hoeveel symptomen moeten volgens de tekst plotseling ontstaan en binnen ongeveer 10 minuten een maximum bereiken om van een paniekaanval te spreken?","o":["Ten minste twee symptomen","Ten minste drie symptomen","Ten minste vier symptomen","Ten minste zes symptomen"],"a":2,"u":"Een paniekaanval is een begrensde periode van intense angst waarbij vier of meer van de genoemde symptomen plotseling ontstaan en binnen 10 minuten een maximum bereiken."},{"t":"6","q":"Wat wordt in de tekst bedoeld met anticipatieangst bij een paniekstoornis?","o":["Een aanhoudende angst voor een afgelijnd object of dier die meteen opkomt bij confrontatie","Zich voortdurend zorgen maken over het krijgen van nieuwe paniekaanvallen","De onmiddellijke angstreactie tijdens sociale prestaties","De dwanggedachte die aan een compulsie voorafgaat"],"a":1,"u":"Na een paniekaanval maakt de betrokkene zich voortdurend zorgen over nieuwe aanvallen. Dat voortdurend piekeren over toekomstige aanvallen heet anticipatieangst."},{"t":"6","q":"Iemand vermijdt openbaar vervoer, drukke pleinen en in de rij staan uit vrees dat ontsnappen moeilijk is of hulp niet beschikbaar bij panieksymptomen. Welke stoornis past hier het best bij?","o":["Sociale fobie","Agorafobie","Gegeneraliseerde angststoornis","Obsessief-compulsieve stoornis"],"a":1,"u":"Agorafobie is de angst of vrees voor situaties zoals openbaar vervoer, open of afgesloten ruimten en menigten, vanwege de gedachte dat ontsnappen moeilijk is of hulp niet beschikbaar bij panieksymptomen."},{"t":"6","q":"Wat is het kernverschil tussen een obsessie en een compulsie bij OCS volgens de tekst?","o":["Een obsessie is de angstreducerende handeling en een compulsie de spanninggevende gedachte","Een obsessie is een angst- en spanninggevende dwanggedachte, een compulsie de daaropvolgende angst- en spanningsreducerende dwanghandeling","Een obsessie is een lichamelijke spanningsklacht en een compulsie een gedachte die de patient bewust oproept om die spanning te onderdrukken","Een obsessie treedt enkel bij kinderen op, een compulsie enkel bij volwassenen"],"a":1,"u":"Bij OCS gaat het om een angst- en spanninggevende dwanggedachte (obsessie) die gevolgd wordt door een angst- en spanningsreducerende dwanghandeling (compulsie)."},{"t":"6","q":"Een patient met OCS krijgt gedragstherapie waarbij hij wordt blootgesteld aan de angst maar de rituelen niet mag uitvoeren. Hoe heet die tweede component?","o":["Responspreventie","Habituatie","Assertiviteitstraining","Cognitieve herstructurering"],"a":0,"u":"Bij de gedragstherapie voor OCS wordt exposure in vivo gecombineerd met responspreventie, dat wil zeggen het verminderen of tegenhouden van de rituelen."},{"t":"6","q":"Waaruit bestaat de gegeneraliseerde angststoornis (GAS) volgens de tekst vooral?","o":["Uit recidiverende onverwachte paniekaanvallen met veel lichamelijke symptomen","Uit buitensporige angst en bezorgdheid (piekeren) over meerdere gebeurtenissen, gedurende zes maanden vaker wel dan niet","Uit een afgelijnde angst voor een enkel object of situatie","Uit herbeleving, vermijding en verhoogde prikkelbaarheid die aanhouden na een afgelijnde traumatische gebeurtenis"],"a":1,"u":"GAS wordt gekenmerkt door buitensporige angst en bezorgdheid of piekeren over meerdere gebeurtenissen of activiteiten, gedurende zes maanden vaker wel dan niet, in een constante modus van chronische stress."},{"t":"6","q":"Welke behandelmethode wordt in de tekst specifiek gekoppeld aan PTSS naast cognitieve gedragstherapie?","o":["Angstthermometer met exposureoefeningen","EMDR met ritmische oogbewegingen","Assertiviteitstraining","Responspreventie"],"a":1,"u":"Bij PTSS wordt naast cognitieve gedragstherapie ook EMDR ingezet, waarbij ritmische oogbewegingen het informatieverwerkingsproces beinvloeden en helpen bij een afgelijnd trauma."},{"t":"6","q":"Wat is volgens de tekst het belangrijkste onderscheid tussen de acute stressstoornis en PTSS?","o":["Bij de acute stressstoornis duren de symptomen korter dan een maand en staan dissociatieve symptomen op de voorgrond","Bij de acute stressstoornis is er geen sprake van een traumatische gebeurtenis","De acute stressstoornis heeft altijd een chronisch en ongunstig beloop","Bij de acute stressstoornis ontbreken dissociatieve verschijnselen en duren de klachten steeds langer dan zes maanden"],"a":0,"u":"De acute stressstoornis lijkt op PTSS maar de symptomen duren korter dan een maand, met dissociatieve symptomen zoals derealisatie en depersonalisatie, en meestal een gunstig beloop."},{"t":"6","q":"Welke omschrijving hoort bij anorexia nervosa volgens de tekst?","o":["Herhaalde vreetbuien met controleverlies, gevolgd door compenserend gedrag","Weigering om een minimaal normaal gewicht te handhaven, met intense angst om dik te worden en een verstoorde lichaamsbeleving","Een aanhoudende angst dat voedsel besmet is, waardoor de persoon maaltijden vermijdt en zich telkens uitgebreid wast","Buitensporig piekeren over eten gedurende zes maanden zonder gewichtsverlies"],"a":1,"u":"Anorexia nervosa kenmerkt zich door de weigering een minimaal normaal lichaamsgewicht te handhaven, intense angst om in gewicht toe te nemen ondanks ondergewicht, en een stoornis in de beleving van eigen lichaamsomvang."},{"t":"6","q":"Wat is een kernkenmerk van een vreetbui-episode bij bulimia nervosa?","o":["Het over een hele dag verspreid eten van kleine porties, waarbij de persoon de controle behoudt maar zich schuldig voelt","Het in beperkte tijd eten van een duidelijk grote hoeveelheid voedsel met een gevoel van controleverlies","Het volledig vermijden van voedsel gedurende meerdere dagen","Het ordenen en tellen van voedsel volgens vaste rituelen"],"a":1,"u":"Een vreetbui-episode bij bulimia nervosa houdt in dat men binnen een beperkte tijd een hoeveelheid voedsel eet die duidelijk groter is dan normaal, met het gevoel de beheersing over het eten kwijt te zijn."},{"t":"6","q":"Welk psychologisch thema uit het cognitieve model van eetstoornissen wordt in de tekst genoemd?","o":["Perfectionisme, negatief zelfbeeld en zwart-wit-denken","Klassieke conditionering van vermijdingsgedrag","Hyperreactief noradrenaline-systeem","Ritmische oogbewegingen om informatieverwerking te beinvloeden"],"a":0,"u":"De cognitieve theorieen bij eetstoornissen wijzen op disfunctionele cognities zoals hoge eisen aan zichzelf (perfectionisme), een uitgesproken negatieve zelfevaluatie na mislukking en dichotomiserend of zwart-wit-denken."},{"t":"7","q":"Waarom is bij kinderen en jongeren in de psychiatrie altijd sprake van een heteroanamnese, terwijl dat bij volwassenen vaak niet nodig is?","o":["Omdat kinderen wettelijk niet zelf mogen spreken met een hulpverlener","Omdat kinderen afhankelijk zijn van hun gezin en gegevens van andere informanten dan de patiënt zelf sterk meewegen","Omdat kinderen door hun beperkte taalontwikkeling nooit betrouwbare informatie over hun eigen klachten kunnen geven","Omdat de diagnostiek bij kinderen enkel via gestandaardiseerde tests verloopt"],"a":1,"u":"De bron stelt dat kinderen afhankelijk zijn van het gezin en dat bij hen gegevens van andere informanten sterk meewegen, waardoor er altijd een heteroanamnese is. Bij volwassenen richt men zich op de patiënt zelf, tenzij er geen ziekte-inzicht is."},{"t":"7","q":"Een klinisch psycholoog wil weten of een gedragspatroon bij een kind als psychiatrische stoornis telt. Welk criterium hoort daar volgens de bron NIET bij?","o":["De klinische kenmerken doen zich voor in verschillende situaties en levensdomeinen","Het gedrag is niet passend bij de leeftijd op basis van de normale ontwikkeling","Het gedrag beïnvloedt het algemeen functioneren nadelig en doet het kind of de omgeving lijden","Het gedrag verdwijnt vanzelf zodra het kind ouder wordt zonder interventie"],"a":3,"u":"De bron noemt als kenmerken onder meer: niet passend bij de leeftijd, aanwezig in meerdere situaties, nadelige invloed op functioneren, lijden bij kind of omgeving en niet te corrigeren. Spontaan verdwijnen is geen criterium."},{"t":"7","q":"Hoe wordt de symptomentriade van ADHD in de bron omschreven?","o":["Aandachtstekort, hyperactiviteit en impulsiviteit","Angst, somberheid en prikkelbaarheid","Rigiditeit, sensorische overgevoeligheid en echolalie","Agressie, bedrog en regelovertreding"],"a":0,"u":"De bron beschrijft de triade van ADHD als aandachtstekort, hyperactiviteit (motorische of verbale onrust) en impulsiviteit."},{"t":"7","q":"Wat betekent het 'age of onset'-criterium voor ADHD volgens de recente DSM-omschrijving in de bron?","o":["Alle symptomen moeten pas na het twaalfde levensjaar ontstaan","Enkele symptomen moeten al voor het twaalfde levensjaar aanwezig zijn geweest","Alle beschreven symptomen moeten al voor het zevende levensjaar duidelijk aanwezig zijn geweest","De symptomen moeten minstens zes maanden na de puberteit beginnen"],"a":1,"u":"Volgens de bron vraagt het age-of-onset-criterium dat enkele symptomen voor het twaalfde levensjaar aanwezig waren (in DSM-IV was dat nog zeven jaar)."},{"t":"7","q":"Bij ADHD op lagere schoolleeftijd is een zuiver beeld zeldzaam. Wat zegt de bron hierover?","o":["Ongeveer de helft van de gevallen kent geen enkele comorbiditeit","Comorbiditeit komt bij ongeveer een kwart van de kinderen voor en heeft geen invloed op de behandelkeuze","Ongeveer driekwart is comorbide, en die comorbide problemen sturen vaak de behandeling","Comorbiditeit speelt enkel bij volwassenen met ADHD een rol"],"a":2,"u":"De bron stelt dat een zuivere ADHD-problematiek amper voorkomt, dat ongeveer 3/4de comorbide is en dat de comorbide problemen vaak de behandeling sturen."},{"t":"7","q":"Welk kenmerk hoort volgens de bron bij het cluster 'beperkte, repetitieve gedragspatronen' van een autismespectrumstoornis?","o":["Tekorten in het non-verbale communicatieve gedrag tijdens sociale interactie","Verminderd delen van interesses en affect met anderen","Onvermogen om een gespreksinteractie normaal te voeren","Hardnekkig vasthouden aan hetzelfde en rigide vasthouden aan routines"],"a":3,"u":"Rigiditeit, zoals hardnekkig vasthouden aan hetzelfde en aan routines, valt onder het cluster beperkte, repetitieve gedragspatronen. De andere opties horen bij het cluster sociale communicatie en interactie."},{"t":"7","q":"Welke psychopathogenetische verklaring wordt in de bron gekoppeld aan het vastlopen van informatieverwerking op detailniveau bij ASS?","o":["Zwakke centrale coherentie","Theory of mind","Executief functioneren","Extreme male brain-theorie"],"a":0,"u":"De bron omschrijft zwakke centrale coherentie als het vastlopen van de informatieverwerking op het niveau van detailperceptie, waardoor een globaal beeld moeilijker tot stand komt."},{"t":"7","q":"Wat is het verschil in criteria tussen een oppositioneel-opstandige stoornis (ODD) en een normoverschrijdende gedragsstoornis (CD) volgens de bron?","o":["ODD heeft enkel emotionele criteria, CD enkel gedragscriteria","ODD heeft criteria op zowel gedrags- als emotioneel niveau, terwijl CD enkel criteria op gedragsniveau kent","Beide stoornissen hanteren dezelfde criteria, alleen de vereiste duur van de symptomen verschilt tussen ODD en CD","CD kent naast gedrag ook emotionele criteria, ODD enkel gedragscriteria"],"a":1,"u":"Volgens de bron heeft de oppositioneel-opstandige stoornis items op zowel gedrags- als emotioneel niveau, terwijl de normoverschrijdende gedragsstoornis enkel criteria op gedragsniveau bevat."},{"t":"7","q":"Wat drukt de taxonomie van Moffitt uit met het onderscheid tussen 'life-course persistent' en 'adolescent limited'?","o":["Twee cohortes patiënten: een groep met vroege, blijvende problemen door intrinsieke plus psychosociale factoren, en een groep met tijdelijke problemen die in de adolescentie start","Twee behandelmethoden voor gedragsstoornissen bij jongeren","Twee subtypes van ADHD op basis van aandacht en hyperactiviteit","Twee erfelijkheidsprofielen: een groep waarbij de gedragsproblemen volledig genetisch bepaald zijn, en een groep waarbij ze uitsluitend door opvoedingsfouten van de ouders ontstaan"],"a":0,"u":"De bron beschrijft Moffitts taxonomie als twee cohortes: life-course persistent (start in de kinderleeftijd, persistent, samenspel intrinsieke en psychosociale problemen) en adolescent limited (start in de adolescentie, tijdelijk, maturity gap en peers)."},{"t":"7","q":"Aan welke drie voorwaarden moet volgens de wet (WBPG) voldaan zijn voordat een gedwongen behandeling of opname mogelijk is?","o":["Toestemming van de patiënt, een verwijzing van de huisarts en een verblijf van minstens 24 uur","Een ernstige psychiatrische stoornis, een gevaarsituatie met oorzakelijk verband met die stoornis, en het ontbreken van een ander alternatief om te beveiligen en behandelen","Een uitdrukkelijke weigering van behandeling door de patiënt, een strafbaar feit in de voorgeschiedenis en een verslag van een psychiater die de patiënt al langer opvolgt","Aandachtstekort, hyperactiviteit en impulsiviteit gedurende minstens zes maanden"],"a":1,"u":"De bron noemt drie voorwaarden: een ernstige psychiatrische stoornis, een acute gevaarsituatie met oorzakelijk verband met die stoornis, en dat gedwongen opname de enige mogelijkheid is om de patiënt te beveiligen en te behandelen."},{"t":"8","q":"Wat is het onderscheidende kenmerk tussen een dyssomnia en een parasomnia zoals in dit hoofdstuk beschreven?","o":["Bij dyssomnia is het slaapproces zelf verstoord, terwijl bij parasomnia het slaapproces schijnbaar normaal verloopt","Bij dyssomnia gaat het steeds om een te korte slaapduur, terwijl bij parasomnia de slaapduur juist te lang uitvalt","Dyssomnia komt enkel bij kinderen voor en parasomnia enkel bij volwassenen","Parasomnia betreft steeds ademhalingsproblemen en dyssomnia steeds bewegingsproblemen"],"a":0,"u":"Bij dyssomnia (dys verwijst naar kwaliteit) is het slaapproces zelf verstoord. Bij parasomnia (para verwijst naar schijnbaar) verloopt het slaapproces op zich normaal en gaat het om een verschijnsel eromheen."},{"t":"8","q":"Een student valt op wisselende momenten van de dag plots in slaap na een verkwikkende slaap, en verliest bij hevige emoties kortdurend zijn spierspanning. Welke stoornis past hier het best bij?","o":["Primaire hypersomnia","Narcolepsie","Vertraagdeslaapfase-syndroom","Obstructief slaapapneusyndroom"],"a":1,"u":"Narcolepsie geeft onweerstaanbare aanvallen van verkwikkende slaap, samen met kataplexie: kort bilateraal tonusverlies van de spieren dat meestal samengaat met intense emotie."},{"t":"8","q":"Wat wordt in de bron bedoeld met kataplexie?","o":["Een aanhoudende onwillekeurige spasme van de spieren rond de vagina","Een korte episode van plots bilateraal verlies van spierspanning, meestal bij intense emotie","Een hallucinatie die optreedt in de overgang van slaap naar waak","Een kortdurende volledige verlamming bij het inslapen of ontwaken, waarbij de persoon niet kan bewegen of spreken"],"a":1,"u":"De bron omschrijft kataplexie als korte episodes van plotseling bilateraal tonusverlies van de spieren, meestal gepaard aan intense emotie. Het is een kernkenmerk van narcolepsie."},{"t":"8","q":"Wat is de meest voorkomende vorm van een slaapgebonden ademhalingsstoornis en welke behandeling hoort daar volgens de bron typisch bij?","o":["Restless Legs Syndrome, behandeld met L-DOPA","Vertraagdeslaapfase-syndroom, behandeld met fototherapie","Obstructief slaapapneusyndroom, behandeld met CPAP of chirurgie","Pavor nocturnus, behandeld met stressreductie"],"a":2,"u":"De bron noemt het obstructief slaapapneusyndroom (OSAS) als meest voorkomende vorm, met veelvuldige ademstops. Behandeling gebeurt met een CPAP-toestel of chirurgie bij anatomische afwijkingen."},{"t":"8","q":"Hoe onderscheidt pavor nocturnus zich volgens de bron van een gewone nachtmerrie?","o":["Bij pavor nocturnus is er een gedetailleerde droomherinnering en men is meteen helder wakker","Bij pavor nocturnus is er amnesie voor de episode en de persoon is verward en gedesoriënteerd","Pavor nocturnus treedt vooral op in de tweede helft van de nacht","Pavor nocturnus komt vooral bij ouderen voor en verdwijnt bij kinderen"],"a":1,"u":"Bij pavor nocturnus is er geen gedetailleerde droomherinnering en bestaat amnesie voor de episode, terwijl de persoon verward en gedesoriënteerd is. Bij een nachtmerrie is de betrokkene juist snel georiënteerd en alert."},{"t":"8","q":"Wat is een centraal verschil tussen dwang en drang zoals in dit hoofdstuk tegenover elkaar gezet?","o":["Dwang wordt als egodistoon en storend beleefd met interne behandelmotivatie, drang hoort bij de identiteit met vaak externe motivatie","Dwang past bij de identiteit en wordt nauwelijks als storend ervaren, terwijl drang egodistoon is en meestal met interne behandelmotivatie gepaard gaat","Dwang komt enkel voor bij seksuele disfuncties, drang enkel bij slaapstoornissen","Bij dwang ontbreekt elke spanning vooraf, bij drang ontbreekt elk plezier achteraf"],"a":0,"u":"Volgens de bron is dwang egodistoon, vreemd en angstig beleefd met intrinsieke motivatie tot behandeling, terwijl drang deel is van de identiteit, spanning geeft vooraf en lust achteraf, met vaak externe motivatie via justitie."},{"t":"8","q":"Bij een seksuele disfunctie waarbij eerst met psychotherapie wordt gestart: welke biologische aanpak past volgens de bron bij vroegtijdige zaadlozing?","o":["Een erectiepil","SSRI's of clomipramine","Hormoonbehandeling met testosteron","Chemische castratie met anti-androgenen"],"a":1,"u":"De bron koppelt vroegtijdige zaadlozing aan behandeling met SSRI's of clomipramine, terwijl opwindings- en orgasmestoornissen eerder met een erectiepil worden aangepakt. Biologisch behandelen gebeurt pas na de start van psychotherapie."},{"t":"8","q":"Wat is het belangrijkste onderscheid tussen dyspareunie en vaginisme volgens de bron?","o":["Dyspareunie is een orgasmestoornis, vaginisme een verlangenstoornis","Bij dyspareunie ligt de nadruk op de fysische component (genitale pijn), bij vaginisme op de psychische component met onwillekeurige spierspasme","Bij vaginisme staat de genitale pijn tijdens de penetratie centraal, terwijl dyspareunie vooral wijst op een aangeleerde angst voor seksueel contact","Dyspareunie betreft een tekort aan lubricatie, vaginisme een tekort aan verlangen"],"a":1,"u":"De bron plaatst bij dyspareunie de fysische component op de voorgrond (recidiverende genitale pijn bij geslachtsgemeenschap), terwijl vaginisme draait om een onwillekeurige spasme van het buitenste derde van de vagina met grote psychische component."},{"t":"9","q":"Welke omschrijving past het best bij de algemene DSM-definitie van een persoonlijkheidsstoornis?","o":["Een tijdelijke gedragsverandering die pas na het 40ste levensjaar ontstaat en snel weer verdwijnt","Een duurzaam en star patroon van innerlijke ervaringen en gedrag dat afwijkt van wat binnen de cultuur wordt verwacht","Een probleem dat uitsluitend wordt veroorzaakt door middelengebruik of een lichamelijke ziekte","Een aangeboren afwijking van het karakter die volledig genetisch vastligt en zich onafhankelijk van de omgeving ontwikkelt"],"a":1,"u":"Volgens de bron gaat het om een duurzaam, star patroon van innerlijke ervaringen en gedragingen dat binnen de cultuur van de betrokkene afwijkt van de verwachtingen. Middelen of somatische aandoeningen zijn juist uitsluitingscriteria."},{"t":"9","q":"Op welke vier terreinen wordt de afwijking bij een persoonlijkheidsstoornis volgens de bron zichtbaar?","o":["Zelfbeeld, intelligentie, morele ontwikkeling en beroepsfunctioneren","Eetlust, gewicht, energie en concentratie","Cognities, affecten, impulsbeheersing en interpersoonlijke relaties","Waarneming, oriëntatie, bewustzijn en spraak"],"a":2,"u":"De afwijking wordt zichtbaar op minstens twee van de terreinen cognities (denken), affecten (voelen), beheersing van impulsen (doen) en interpersoonlijke relaties."},{"t":"9","q":"Een cliënt trekt zich sterk terug uit sociale contacten, is introvert en toont weinig emotionele expressie, met soms cognitieve of perceptuele stoornissen. Bij welk cluster hoort dit beeld het best?","o":["Cluster A, de vreemde of excentrieke stoornissen","Cluster B, de dramatische stoornissen","Cluster C, de angstige stoornissen","Een cluster dat losstaat van het schizofreniespectrum"],"a":0,"u":"Cluster A (vreemd, excentriek) ligt in het schizofreniespectrum en omvat het teruggetrokken, introverte gedrag met beperkte emotionele expressie en soms cognitieve of perceptuele stoornissen."},{"t":"9","q":"Wat is volgens de bron een kenmerkend verschil tussen cliënten met een cluster C-stoornis en cliënten met andere clusters?","o":["Ze vallen sterk op door flamboyant en dramatisch gedrag","Ze wijzen conflicten en problemen consequent aan anderen toe","Ze vallen weinig op en zoeken de oorzaak van hun problemen vaak bij zichzelf","Ze vertonen vooral normen- en waardenproblematiek met een forensische link"],"a":2,"u":"Bij cluster C is angst het centrale kenmerk; deze cliënten vallen niet op, zoeken de oorzaak van hun problemen vaak bij zichzelf en nemen weinig verantwoordelijkheid daarvoor."},{"t":"9","q":"Welke behandelvorm wordt in de bron specifiek gekoppeld aan impulsief-destructief gedrag, met als doel constructieve vaardigheden en een zinvol bestaan?","o":["Schema-focused therapie","Dialectische gedragstherapie","Psycho-educatie over comorbide problematiek","Medicamenteuze behandeling met SSRI's"],"a":1,"u":"De bron koppelt dialectische gedragstherapie aan impulsief-destructief gedrag, gericht op het aanleren van constructieve vaardigheden en een zinvol bestaan."},{"t":"9","q":"Wat gebeurt er volgens de bron over het algemeen met pathologische persoonlijkheidstrekken naarmate iemand ouder wordt?","o":["Ze nemen bij elke persoonlijkheidsstoornis steeds verder in scherpte toe","Ze verliezen doorgaans aan scherpte, onder meer door neurobiologische veranderingen en maturiteit","Ze wisselen van vorm zodat een cluster B-stoornis met de jaren overgaat in een cluster A-stoornis","Ze blijven volstrekt onveranderlijk gedurende het hele volwassen leven"],"a":1,"u":"Bij het ouder worden verliezen pathologische persoonlijkheidstrekken over het algemeen aan scherpte, onder andere door neurobiologische veranderingen en toegenomen maturiteit van de persoonlijkheid, al verschilt het natuurlijk beloop per stoornis."}],"theory":[{"h":"Inleiding & DSM","items":["DSM-5: het Diagnostic and Statistical Manual of Mental Disorders, het classificatiesysteem of de kapstok waarop de klinische psychiatrie gebaseerd is.","Psychopathologie: de wetenschap of studie van het psychisch lijden, waarbij pas van een aandoening gesproken wordt als er ook echt last (pathos) aanwezig is.","Classificatie vs diagnostiek: classificatie beschrijft groepsmatig WAT er aan de hand is, diagnostiek verklaart individueel HOE het zo gekomen is en is voorwaarde voor goede zorg.","Categoriale classificatie: kwalitatief, dichotoom onderscheid (ziek of gezond) met afgebakende, niet-overlappende klassen.","Dimensionale classificatie: kwantitatief onderscheid waarbij klachten zich op een continuüm of dimensie van meer naar minder bevinden.","Predisponerende, precipiterende en perpetuerende factoren: respectievelijk de voorbeschikkende (kwetsbaarheid), uitlokkende (triggers) en onderhoudende factoren van een stoornis.","Bio-psycho-sociaal model: geïntegreerd of holistisch verklaringsmodel dat als stresskwetsbaarheidsmodel werkt op basis van draagkracht en draaglast.","Heritabiliteit: het deel van de variantie in het fenotype tussen individuen dat verklaard kan worden door genetische factoren.","Gen-omgevingsinteractie vs gen-omgevingscorrelatie: bij interactie beïnvloeden genen de gevoeligheid voor de omgeving, bij correlatie zoeken genetisch kwetsbare personen zelf risicovolle milieus op.","Prevalentie vs incidentie: prevalentie telt oude en nieuwe gevallen (op een moment, in een periode of lifetime), incidentie telt enkel nieuwe gevallen in een periode.","Normatieve criteria: de meest verklarende normaliteitscriteria in de psychiatrie, gebaseerd op autonomie, integratie en aanpassing (coping).","Trias psychica: de drie psychische hoofdfuncties denken, voelen en willen (cognitief, affectief en conatief).","Etiopathogenese: het verklaringsmodel of de leer der oorzaken van een stoornis, opgesplitst in fysiopathogenese (biologisch) en psychopathogenese (psychologisch).","Anamnese: het bevragen en in kaart brengen van de klachten, met een heteroanamnese (bevragen van anderen) wanneer de patiënt zelf minder betrouwbare informatie kan geven."]},{"h":"Neurocognitieve stoornissen","items":["Neurocognitieve stoornissen: verstoringen van de psyche met een lichamelijke oorzaak, op het raakvlak van psychiatrie en somatiek, meestal door een aftakelingsproces.","Dementie: een degeneratief, niet cross-sectioneel proces waarbij hersencellen verloren gaan en het psychisch functioneren over de tijd achteruitgaat.","Delirium: een acuut toestandsbeeld met verstoord bewustzijn dat zich in uren tot dagen ontwikkelt en fluctueert over 24 uur, waarbij snelle interventie nodig is.","Amnestische stoornissen: specifieke (anterograde) geheugenstoornissen zonder andere cognitieve stoornissen, bijvoorbeeld door hersenziekte of chronisch middelengebruik.","MMSE: een screeningsinstrument (niet diagnostisch) dat het neurocognitief functioneren snel meet via oriëntatie, geheugen, taal en praxis, vooral gericht op Alzheimer.","Desoriëntatie: het verlies van besef in tijd, plaats en persoon, doorgaans in die volgorde, wat samen met geheugenaantasting een alarmsignaal vormt bij 65-plussers.","Afasie: een taalstoornis met woordvindproblemen, verwisselingen, begripsproblemen, taalverarming en persevereren, gelokaliseerd in de temporale kwab.","Apraxie: het onvermogen om een doelgerichte handeling uit te voeren ondanks de fysieke mogelijkheid, waardoor iemand onhandig wordt.","Agnosie: het niet meer kunnen herkennen van voorwerpen, wat bij alle zintuigen kan voorkomen zoals horen, ruiken, proeven en voelen.","Corticale functiestoornissen: stoornissen in de hersenschors (afasie, apraxie, agnosie) die Alzheimer onderscheiden van meer subcorticale dementiebeelden.","Dementie van het Alzheimer-type: de meest voorkomende vorm met sluipend begin en progressief verloop, gekenmerkt door plaques en tangles van eiwitten die neuronen doen afsterven.","Vasculaire dementie: dementie door cerebrovasculaire afwijkingen, waarbij atherosclerose en kleine infarcten door zuurstofgebrek onomkeerbare schade veroorzaken.","Confabulatie: het opvullen van geheugengaten met verzonnen informatie, onder meer gezien bij het syndroom van Korsakoff bij chronisch alcoholgebruik.","Care versus cure: het behandelprincipe bij dementie waarbij genezing niet mogelijk is, maar de levenskwaliteit van patiënt en mantelzorger wel verbeterd kan worden."]},{"h":"Middelen & verslaving","items":["Exclusie door verslaving: bij een geintoxiceerde patient kan de intoxicatie het gedrag verklaren, waardoor geen ander ziektebeeld betrouwbaar kan worden vastgesteld.","Stoornissen in het gebruik: verzamelnaam voor middelenmisbruik en middelenafhankelijkheid, gericht op het patroon van gebruik zelf.","Stoornissen door het gebruik: gevolgen van gebruik zoals intoxicatie en onthouding.","Misbruik: een onaangepast gebruikspatroon dat over een periode van 12 maanden significante beperkingen of lijden veroorzaakt, bijvoorbeeld door verwaarlozing van verplichtingen of gevaarlijke situaties.","Afhankelijkheid: toestand waarbij binnen een jaar minstens drie verschijnselen optreden, verdeeld over een lichamelijke, een psychische en een controlecluster.","Tolerantie: de behoefte om de hoeveelheid te vergroten om hetzelfde effect te krijgen, of minder effect bij dezelfde hoeveelheid (cocaine vormt een uitzondering).","Craving: een hevig, dringend verlangen naar het middel en een kernsymptoom van afhankelijkheid.","Intoxicatie: een reversibel, middel-specifiek syndroom door recent gebruik, met onaangepaste gedrags- of psychische veranderingen kort na inname.","Onthouding: somatische en psychische reacties door het staken of verminderen van langdurig, aanzienlijk gebruik van een middel.","Psychoactieve stoffen: middelen die een bewustzijnsverandering veroorzaken, ingedeeld in psycholeptica (dempend), psychoanaleptica (stimulerend) en psychodysleptica (waarnemingsverstorend).","CAGE: een korte screeningslijst waarbij al een bevestigend antwoord wijst op verhoogd risico dat verder verkend moet worden.","Biopsychosociaal model: verklaringsmodel dat verslaving koppelt aan biologische factoren (o.a. limbisch systeem en prefrontale cortex), leerprocessen en de sociale context.","Stepped care: geintegreerde behandelaanpak die start met een ambulant traject voor er residentieel wordt behandeld, bij voorkeur holistisch.","Motivering: het eerst motiveren van de patient voordat je gedrag probeert te veranderen, cruciaal omdat ziektebesef vaak nog ontbreekt."]},{"h":"Schizofrenie & psychose","items":["Positieve symptomen: verschijnselen die erbij komen en normaal niet aanwezig zijn, zoals wanen, hallucinaties en onsamenhangende spraak.","Negatieve symptomen: het wegvallen van normaal aanwezige functies, zoals affectieve vervlakking, apathie (avolitie) en spraakarmoede (alogie).","Waan: een oncorrigeerbare foutieve overtuiging die botst met de realiteit, als absolute zekerheid wordt verdedigd en particulier is aan de persoon.","Hallucinatie: een zintuiglijke waarnemingservaring zonder externe bron waarvan de patiënt volledig overtuigd is, met stemmen (auditief) als meest voorkomend.","Incoherentie: een formele denkstoornis waarbij de vorm van het denken verstoord is en de spraak zeer moeilijk te volgen wordt.","Katatonie: ernstig verstoord psychomotorisch gedrag, zoals katalepsie (spierverstijving), mutisme of negativisme, vooral bij defecte, chronische schizofrenie.","Dopaminehypothese: het model dat positieve symptomen koppelt aan verhoogde dopaminetransmissie in het limbisch systeem en negatieve aan verlaagde frontale transmissie.","Neuroleptica: antipsychotica die de dopamine-D2-receptoren blokkeren; eerste generatie (Haldol) werkt op positieve, tweede generatie (Risperdal) ook op negatieve symptomen.","Extrapiramidale bijwerkingen: dopaminerge bewegingsstoornissen van antipsychotica, zoals parkinsonisme, acute dystonie, acathisie en het maligne neuroleptisch syndroom.","Stresskwetsbaarheidsmodel: verklaringsmodel waarbij een genetische diathese samen met stressfactoren en beschermende factoren bepaalt of iemand decompenseert.","Prodromen: de eerste vroege verschijnselen die op een psychose kunnen wijzen, zoals isolatie, prikkelbaarheid, achterdocht en concentratieverlies.","Schizofreniforme stoornis: beeld zoals schizofrenie maar met een episode van minstens een maand en korter dan zes maanden, met vaak gunstigere prognostische kenmerken.","Schizoaffectieve stoornis: een ononderbroken periode waarin een stemmingsepisode samenvalt met actieve schizofreniesymptomen, met minstens twee weken wanen of hallucinaties zonder opvallende stemmingsstoornis.","Waanstoornis: stoornis met niet-bizarre wanen gedurende minstens een maand zonder denkstoornis, waarbij het functioneren intact blijft en de prognose gunstiger is."]},{"h":"Stemmingsstoornissen","items":["Depressieve episode: toestand met 5 of meer symptomen gedurende minstens twee weken, verdeeld over affectieve, lichamelijke en cognitieve clusters.","Anhedonie: de afwezigheid van het vermogen om plezier of genot te beleven, een kernsymptoom van depressie.","Manische episode: periode van minstens een week met verhoogde, expansieve of prikkelbare stemming plus bijkomende symptomen zoals grootheidsideeen en verminderde slaapbehoefte.","Hypomane episode: mildere verhoogde stemming van minstens vier dagen, zonder duidelijke beperkingen in functioneren en zonder psychotische verschijnselen.","Gemengde episode: toestand waarbij tegelijk aan de criteria van een manische en een depressieve episode wordt voldaan.","Dysthyme stoornis: mildere, meer chronische unipolaire depressie die minstens twee jaar aanhoudt, met een depressieve stemming het grootste deel van de dag.","Cyclothyme stoornis: mildere, chronische bipolaire variant met talrijke hypomane en depressieve symptomen die niet aan de volledige criteria voldoen.","Bipolaire stoornis type 1: afwisseling van manische episodes en depressieve episodes.","Bipolaire stoornis type 2: afwisseling van hypomane episodes en depressieve episodes, met een gunstiger beloop dan type 1.","Negatieve triade: het cognitieve patroon van een negatief beeld over zichzelf, de omgeving en de toekomst.","Rapid cycling: het beloopkenmerk dat aangeeft hoe snel iemand fluctueert tussen manisch en depressief; sneller fluctueren betekent een slechtere prognose.","SSRI: antidepressivum dat selectief de heropname van serotonine remt, met als aandachtspunten het uitlokken van een manische episode en suicidaliteit.","Stemmingsstabilisator: medicatie voor bipolaire stoornissen, zoals lithium als onderhoudsbehandeling die regelmatige controles vereist.","HPA-systeem: hormonale stress-as (hypothalamus, hypofyse, bijnier) die bij aanhoudende stress cortisol vrijstelt en bij depressie een minder goed werkende negatieve feedback vertoont."]},{"h":"Angst- & eetstoornissen","items":["Pathologische angst: angst die ongewoon intens of langdurig en buiten proporties is, of optreedt zonder een echte angstopwekkende prikkel.","Angsthierarchie: het rangschikken van angstklachten op intensiteit, zodat men in therapie niet meteen met de heftigste angst begint.","Exposure: blootstelling aan de angst om na verloop van tijd gewenning (habituatie of extinctie) te creeren.","Specifieke fobie: een afgelijnde, aanhoudende en irrationele angst voor een bepaald object of situatie die de persoon zelf als ongegrond erkent.","Paniekaanval: een begrensde periode van intense angst waarbij vier of meer symptomen plotseling ontstaan en binnen ongeveer 10 minuten pieken.","Anticipatieangst: zich voortdurend zorgen maken over het krijgen van nieuwe paniekaanvallen.","Agorafobie: angst of vermijding van situaties zoals vervoer, open of afgesloten ruimten en menigten, uit vrees dat ontsnappen of hulp moeilijk is.","Sociale fobie: aanhoudende angst voor situaties waarin men sociaal moet functioneren of presteren, uit vrees zich beschamend te gedragen.","Obsessie: een angst- en spanninggevende dwanggedachte die voorafgaat aan een dwanghandeling.","Compulsie: een angst- en spanningsreducerende dwanghandeling die volgt op een obsessie.","Gegeneraliseerde angststoornis: buitensporige, moeilijk te beheersen bezorgdheid over meerdere gebeurtenissen gedurende zes maanden vaker wel dan niet.","EMDR: behandeling van trauma met imaginaire exposure plus ritmische oogbewegingen om het informatieverwerkingsproces te beinvloeden.","Anorexia nervosa: weigering een minimaal normaal gewicht te handhaven, met intense angst om dik te worden en een verstoorde lichaamsbeleving.","Bulimia nervosa: herhaalde vreetbuien met controleverlies, gevolgd door compenserend gedrag om gewichtsstijging te voorkomen."]},{"h":"Ontwikkelings- & gedragsstoornissen","items":["Heteroanamnese: informatie over het kind wordt altijd mee verzameld bij ouders, school en andere informanten, niet enkel bij het kind zelf.","Ontwikkelingspsychopathologie: pathologie beschrijven en bestuderen vanuit het ontwikkelingsbeloop, omdat een stoornis er op elke leeftijd anders kan uitzien.","ADHD-triade: de combinatie van aandachtstekort, hyperactiviteit en impulsiviteit als kern van de stoornis.","Age of onset (ADHD): het criterium dat enkele symptomen al voor het twaalfde levensjaar aanwezig moeten zijn geweest.","ADHD-subtypering: onderverdeling in overwegend onoplettend type (ADD), overwegend hyperactief-impulsief type en gecombineerd type, om de behandeling af te stemmen.","Autismespectrumstoornis (ASS): stoornis met persisterende deficiënties in sociale communicatie en interactie plus beperkte, repetitieve gedragspatronen en interesses.","Echolalie: het dwangmatig herhalen van woorden of zinnen van de gesprekspartner of een andere bron, passend bij het repetitieve cluster van ASS.","Theory of mind: het vermogen om je een voorstelling te maken van de gedachten, gevoelens en intenties van jezelf en anderen, dat bij ASS verminderd is.","Zwakke centrale coherentie: bij ASS loopt de informatieverwerking vast op detailniveau, waardoor een globaal en betekenisvol beeld moeilijker tot stand komt.","Oppositioneel-opstandige stoornis (ODD): gedragsstoornis met criteria op zowel gedrags- als emotioneel niveau, zoals prikkelbaarheid, ruziezoekend gedrag en wraakzucht.","Normoverschrijdende gedragsstoornis (CD): stoornis met enkel gedragscriteria, waarbij agressie het kernsymptoom is en rechten van anderen geschonden worden.","Taxonomie van Moffitt: onderscheid tussen life-course persistent (vroeg startend, blijvend) en adolescent limited (later startend, tijdelijk) antisociaal gedrag.","Model van Patterson: verklaring waarin ouderlijke vaardigheden centraal staan en stap voor stap uitgehold worden bij grensoverschrijdend gedrag, wat richting geeft aan oudergerichte interventie.","Gedwongen behandeling (WBPG): opname zonder toestemming, mogelijk als er een ernstige psychiatrische stoornis is, een gevaarsituatie met oorzakelijk verband, en geen ander alternatief bestaat."]},{"h":"Slaap- & seksuele stoornissen","items":["Dyssomnia: slaapstoornis waarbij het slaapproces zelf qua kwaliteit verstoord is, zoals bij insomnia of hypersomnia.","Parasomnia: stoornis met een op zich normaal slaapproces waarbij ongewone verschijnselen optreden, zoals nachtmerries, pavor nocturnus of slaapwandelen.","Primaire insomnia: minstens één maand moeite met inslapen of doorslapen, of niet uitgerust zijn, zonder situationele of andere oorzaak.","Primaire hypersomnia: overmatige slaperigheid gedurende minstens één maand met verlengde nachtslaap of dagelijkse slaapepisodes overdag.","Narcolepsie: dagelijkse onweerstaanbare aanvallen van verkwikkende slaap gedurende minstens drie maanden, vaak met kataplexie of slaapparalyse.","Kataplexie: korte episode van plots bilateraal verlies van spierspanning, meestal uitgelokt door intense emotie.","Obstructief slaapapneusyndroom (OSAS): meest voorkomende slaapgebonden ademhalingsstoornis met veelvuldige ademstops, vaak door overgewicht of kaakbouw.","Vertraagdeslaapfase-syndroom: circadiane stoornis waarbij men veel later inslaapt en opstaat dan gewenst en de slaapperiode niet kan vervroegen.","Restless Legs Syndrome: sterke bewegingsdrang van de ledematen met onaangename sensaties, het ergst in rust en 's avonds, tijdelijk verlicht door beweging.","Pavor nocturnus: nachtelijke paniekepisode in het eerste deel van de nacht met arousal, verwardheid en amnesie, zonder gedetailleerde droomherinnering.","Seksuele disfunctie: verstoring of remming van één of meer fasen van de seksuele responscyclus (verlangen, opwinding, orgasme).","Dyspareunie: recidiverende of aanhoudende genitale pijn bij de geslachtsgemeenschap met grote fysische component.","Vaginisme: onwillekeurige spasme van het buitenste derde van de vaginamusculatuur die geslachtsgemeenschap belemmert, met grote psychische component.","Parafilie: drangstoornis met terugkerende, intense seksuele fantasieën, impulsen of gedragingen rond ongeschikte objecten of niet-instemmende personen, die minstens zes maanden bestaan."]},{"h":"Persoonlijkheidsstoornissen","items":["Persoonlijkheidsstoornis: een duurzaam, star patroon van innerlijke ervaringen en gedrag dat binnen iemands cultuur afwijkt van de verwachtingen en lijden of beperkingen veroorzaakt.","Vier afwijkingsterreinen: de stoornis toont zich op minstens twee van de vlakken cognities, affecten, impulsbeheersing en interpersoonlijke relaties.","Beginleeftijd: het patroon is stabiel en langdurig en gaat meestal terug tot de adolescentie of vroege volwassenheid, waardoor de diagnose bij consensus vaak pas vanaf 18 jaar wordt gesteld.","Exclusiecriterium: de klachten mogen niet beter verklaard worden door somatische aandoeningen, middelengebruik of een andere psychische stoornis.","Cluster A: de vreemde of excentrieke stoornissen (paranoïde, schizoïde, schizotypische) die in het schizofreniespectrum liggen.","Cluster B: de dramatische stoornissen (antisociaal, borderline, theatraal, narcistisch) waarbij affecten en gedrag op de voorgrond staan.","Cluster C: de angstige stoornissen (ontwijkend, afhankelijk, obsessief-compulsief) met angst als centraal kenmerk en veel coping via vermijding of controle.","Borderline: kenmerkend zijn automutilatie, suïcidepogingen, emotieregulatieproblemen, zwart-witdenken en sterke stemmingswisselingen.","Comorbiditeit: persoonlijkheidsstoornissen komen vaak samen voor met middelengebonden stoornissen, angststoornissen en stemmingsstoornissen, en ook binnen een cluster.","Etiopathogenese: zowel een biologisch model (genetische persoonlijkheidstrekken, HPA-as) als een psychologisch model (trauma, hechting, disfunctionele schema's) speelt een rol.","Tegenoverdracht: het is belangrijk de eigen negatieve tegenoverdracht goed te hanteren, omdat comorbide problematiek (vooral cluster B) die kan oproepen.","Dialectische gedragstherapie: een aanpak gericht op impulsief-destructief gedrag, met nadruk op constructieve vaardigheden en een zinvol bestaan.","Schema-focused therapie: therapie die disfunctionele schema's aanpast en goede resultaten geeft, zeker bij cluster B dat vroeger als zeer statisch werd gezien.","Medicamenteuze behandeling: SSRI's worden ingezet als antidepressiva voor comorbide angst- en stemmingsstoornissen."]}],"hacks":[{"h":"De 3 P's van de structuurdiagnose","t":"Onthoud de drie soorten factoren met de 3 P's, op alfabetische volgorde van tijd. Predisponerend = wat je vooraf kwetsbaar maakt (aanleg, bv. genetische kwetsbaarheid). Precipiterend = wat het Precies op dat moment uitlokt (de trigger, bv. cannabis bij psychose). Perpetuerend = wat het Permanent onderhoudt. Kort: eerst voorbeschikt, dan uitgelokt, dan onderhouden."},{"h":"De 3 corticale A's","t":"Onthoud de corticale functiestoornissen die Alzheimer verraden met de drie A's: Afasie (taal weg), Apraxie (handeling weg) en Agnosie (herkenning weg). Deze drie A's zijn ook precies wat dementie onderscheidt van depressie, want bij depressie ontbreken ze."},{"h":"CAGE onthouden","t":"Denk aan de vier CAGE-vragen als 'Cut down, Annoyed, Guilty, Eye opener': heb je ooit willen minderen, erger je je aan opmerkingen, voel je je schuldig, en drink je 's ochtends om de kater te verdrijven? Al een 'ja' betekent verhoogd risico en verder exploreren."},{"h":"POSITIEF komt erbij, NEGATIEF valt weg","t":"Denk aan een plus en een min. POSITIEVE symptomen zijn een plus: er komt iets bij dat normaal niet aanwezig is, zoals wanen en hallucinaties. NEGATIEVE symptomen zijn een min: er valt iets weg dat normaal wel aanwezig is, zoals emotie (affectieve vervlakking), spraak (alogie) en initiatief (avolitie). Onthoud de min-drie A's: Affect, Alogie, Avolitie zijn de kern van de negatieve kant."},{"h":"ALG voor de depressie-symptoomclusters","t":"Onthoud de drie symptoomclusters van een depressieve episode met ALG: A van Affectief (sombere stemming, anhedonie), L van Lichamelijk (slaap, eetlust, energie, motoriek) en G van Gedachten oftewel cognitief (schuldgevoel, concentratie, gedachten aan de dood). De behandeling ent zich telkens op items uit deze drie clusters, dus als je ALG kent, ken je meteen de structuur van zowel de criteria als de aanpak."},{"h":"Paniek-check: het regeltje van 4 in 10","t":"Onthoud voor een paniekaanval het cijferpaar 4-10: er moeten minstens 4 symptomen plots opkomen en die bereiken binnen 10 minuten een maximum. Denk aan 'in 10 tellen tot 4 raken': binnen 10 minuten piekt het, met 4 of meer klachten. Zo verwar je de paniekaanval-drempel niet met de 6-maanden-regel van GAS of de 3-symptomen van GAS."},{"h":"ODD naar CD: de 3 x 1/3 splitsing","t":"Onthoud dat een ODD in drie richtingen kan uitmonden, elk ongeveer 1/3de. Denk aan 'GEDRAG · GEVOEL · GEDAAN': als de GEDRAGscluster de bovenhand krijgt, evolueert het naar CD (de ernstigere gedragsstoornis); als de GEVOELscluster (prikkelbaar, irritatie) domineert, gaat het richting stemmingsstoornis; en bij het derde deel is het als het ware GEDAAN, want dan dooft het uit en blijft er geen categoriale diagnose. Onthoud er meteen bij dat CD een grotere continuïteit heeft dan ODD en kan doorlopen naar een antisociale persoonlijkheidsstoornis."},{"h":"Dwang vs. Drang: de D-D-truc","t":"Onthoud dwang als egoDIStoon (Distant, het voelt vreemd en storend, de patiënt wil er vanaf en komt uit zichzelf) en drang als deel van je IDentiteit (het hoort bij je, geeft eerst spanning en daarna lust, en de motivatie komt van buitenaf via justitie). Kort: dwang = last en zelf hulp zoeken, drang = lust en geduwd worden."},{"h":"De drie clusters: Apart, Bombastisch, Chagrijnig-bang","t":"Onthoud de clusters met de letters A, B, C. A staat voor Apart en excentriek (vreemd, schizofreniespectrum). B staat voor Bombastisch en dramatisch (affecten en gedrag op de voorgrond, denk aan borderline). C staat voor Chagrijnig van de angst, de bange cluster waar angst centraal staat. Zo koppel je meteen elke letter aan de kernstemming van dat cluster."}]};
</script>
