<!DOCTYPE html>
<html lang="nl">
<head>

<style>
  :root{
    --bg:#f4f2ee; --bg2:#ebe8e2; --card:#ffffff; --ink:#1b232c; --muted:#5d6873;
    --line:#e2ddd4; --accent:#0f6e6a; --accent-ink:#0b4f4c; --accent-soft:#dcefed;
    --amber:#c9821f; --amber-soft:#f7ecd9; --violet:#6d5bd0; --violet-soft:#e9e6fa;
    --good:#1f8a4c; --good-soft:#e2f3e8; --bad:#c23b54; --bad-soft:#fbe5ea;
    --shadow:0 1px 2px rgba(20,30,40,.05),0 6px 18px rgba(20,30,40,.05);
    --shadow-lg:0 2px 6px rgba(20,30,40,.06),0 18px 40px rgba(20,30,40,.10);
    --r:14px; --r-lg:20px; --ease:cubic-bezier(.2,.8,.2,1);
  }
  html[data-theme="dark"]{
    --bg:#11151a; --bg2:#161b22; --card:#1b222b; --ink:#e7ecf1; --muted:#9aa6b2;
    --line:#2a323c; --accent:#3fb9b2; --accent-ink:#7fd6d0; --accent-soft:#163230;
    --amber:#e0a64a; --amber-soft:#2e2515; --violet:#a99cf0; --violet-soft:#221d3a;
    --good:#46c178; --good-soft:#16301f; --bad:#ef6b82; --bad-soft:#331620;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    --shadow-lg:0 2px 8px rgba(0,0,0,.4),0 22px 48px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:Georgia,"Iowan Old Style","Times New Roman",serif;letter-spacing:-.01em}
  button,a{font-family:inherit;cursor:pointer;color:inherit}
  .wrap{max-width:880px;margin:0 auto;padding:0 18px 96px}
  :focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
  .ic{width:1.25em;height:1.25em;flex:none;vertical-align:-.18em;stroke:currentColor;stroke-width:1.75;
    stroke-linecap:round;stroke-linejoin:round;fill:none}

  header.top{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);
    background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(160%) blur(16px);-webkit-backdrop-filter:saturate(160%) blur(16px);box-shadow:inset 0 -1px 0 0 rgba(0,0,0,.04)}
  .topin{max-width:880px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:700}
  .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,var(--accent),var(--accent-ink));
    color:#fff;display:grid;place-items:center;font-family:Georgia,serif;font-weight:700;font-size:16px;flex:none;
    box-shadow:0 2px 6px rgba(15,110,106,.35)}
  .brand small{display:block;font-weight:500;color:var(--muted);font-size:11px}
  .spacer{flex:1}
  .iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;min-height:38px;
    padding:7px 11px;font-size:13.5px;display:inline-flex;gap:7px;align-items:center;text-decoration:none;
    transition:border-color .2s var(--ease),transform .12s var(--ease)}
  .iconbtn:hover{border-color:var(--accent)} .iconbtn:active{transform:scale(.96)}
  nav.tabs{display:flex;gap:2px;overflow:auto;max-width:880px;margin:0 auto;padding:6px 12px 0;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{border:none;background:none;color:var(--muted);padding:10px 13px;border-radius:9px 9px 0 0;
    font-size:14px;font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px;transition:color .2s var(--ease)}
  nav.tabs button .ic{width:16px;height:16px}
  nav.tabs button.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
  nav.tabs button:hover{color:var(--ink)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:20px}
  .muted{color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
  .pill.amber{background:var(--amber-soft);color:var(--amber)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .grid{display:grid;gap:14px}
  @media(min-width:620px){.g2{grid-template-columns:1fr 1fr}}

  .hero{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin:20px 0 8px}
  .count{flex:none;background:linear-gradient(150deg,var(--accent),var(--accent-ink));color:#fff;border-radius:var(--r);padding:14px 20px;text-align:center;min-width:118px;box-shadow:0 8px 20px rgba(15,110,106,.28)}
  .count b{font-family:Georgia,serif;font-size:32px;display:block;line-height:1}
  .count span{font-size:12px;opacity:.92}
  .herotext h1{margin:0 0 4px;font-size:25px}
  .herotext p{margin:0;color:var(--muted)}

  .brandstrip{display:flex;align-items:center;gap:13px;width:100%;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 16px;margin:14px 0 2px;box-shadow:var(--shadow);transition:border-color .2s var(--ease),transform .15s var(--ease)}
  .brandstrip:hover{border-color:var(--accent);transform:translateY(-1px)}
  .brandstrip .bs-logo{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:17px;background:linear-gradient(145deg,var(--accent),var(--accent-ink))}
  .brandstrip .bs-txt{flex:1;min-width:0} .brandstrip .bs-txt b{display:block;font-size:14.5px} .brandstrip .bs-txt small{color:var(--muted);font-size:12.5px}
  .brandstrip .bs-go{color:var(--accent-ink);flex:none;display:inline-flex} .brandstrip .bs-go .ic{width:18px;height:18px}

  .seclabel{display:flex;align-items:center;gap:8px;margin:24px 0 12px;font-weight:700;font-size:15px}
  .seclabel .ic{width:18px;height:18px;color:var(--accent-ink)}
  .backlink{display:inline-flex;align-items:center;gap:5px;border:none;background:none;color:var(--muted);font-size:13.5px;font-weight:600;padding:6px 0;margin-bottom:4px;transition:color .2s var(--ease)}
  .backlink:hover{color:var(--accent-ink)} .backlink .ic{width:16px;height:16px}
  .tracks{display:grid;gap:14px} @media(min-width:600px){.tracks{grid-template-columns:1fr 1fr}}
  .track{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);transition:transform .22s var(--ease),border-color .22s var(--ease),box-shadow .22s var(--ease)}
  .track:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow-lg)} .track:active{transform:translateY(-1px) scale(.995)}
  .track .tile{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;color:#fff;margin-bottom:4px;background:linear-gradient(150deg,var(--accent),var(--accent-ink))}
  .track.alt .tile{background:linear-gradient(150deg,var(--violet),#4f40a8)} .track .tile .ic{width:24px;height:24px}
  .track b{font-size:18px} .track small{color:var(--muted);font-size:13.5px;line-height:1.5}
  .track .go{margin-top:6px;display:inline-flex;align-items:center;gap:6px;color:var(--accent-ink);font-weight:600;font-size:13.5px} .track.alt .go{color:var(--violet)} .track .go .ic{width:16px;height:16px}
  .toggle{width:48px;height:28px;border-radius:999px;border:none;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s var(--ease)}
  .toggle .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s var(--ease)}
  .toggle.on{background:var(--violet)} .toggle.on .knob{left:23px}
  .warmcard{border-color:var(--violet)!important;background:var(--violet-soft)} .warmcard .ic{width:22px;height:22px;color:var(--violet);flex:none}
  .modebanner{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding:11px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent-ink);font-size:13.5px;font-weight:600}
  .modebanner.v{background:var(--violet-soft);color:var(--violet)} .modebanner .ic{width:18px;height:18px} .modebanner a,.modebanner .bnlink{margin-left:auto;font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;color:inherit;border:none;background:none;font-family:inherit;padding:0}
  html.snappy .card,html.snappy .mode,html.snappy .tip,html.snappy .track{animation-duration:.12s!important}
  .mode{display:flex;flex-direction:column;text-align:left;width:100%;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:17px;gap:7px;box-shadow:var(--shadow);transition:transform .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease)}
  .mode:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
  .mode .me{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)} .mode .me .ic{width:22px;height:22px}
  .mode b{font-size:16px} .mode small{color:var(--muted);font-size:13px}

  label.fld{display:block;font-size:13px;font-weight:600;margin:16px 0 7px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;min-height:38px;padding:7px 13px;font-size:13.5px;transition:all .18s var(--ease)}
  .chip:hover{border-color:var(--accent)} .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:11px;min-height:46px;padding:12px 20px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;box-shadow:0 4px 12px rgba(15,110,106,.25);transition:background .2s var(--ease),transform .12s var(--ease)}
  .btn:hover{background:var(--accent-ink)} .btn:active{transform:scale(.97) translateY(1px)} .btn .ic{width:18px;height:18px}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none} .btn.ghost:hover{border-color:var(--accent)}
  .btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  input[type=search],input[type=text],input[type=email],textarea{font-family:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
  input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .runtop{display:flex;align-items:center;gap:12px;margin:2px 0 14px;font-size:13px;color:var(--muted)}
  .bar{height:8px;border-radius:6px;background:var(--bg2);overflow:hidden;flex:1}
  .bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .7s var(--ease)}
  .qtext{font-size:19px;font-weight:600;margin:8px 0 16px;font-family:Georgia,serif;line-height:1.45}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:14px 15px;margin-bottom:10px;font-size:15px;transition:border-color .15s var(--ease),background .15s var(--ease),transform .12s var(--ease)}
  .opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)} .opt:active:not(:disabled){transform:scale(.99)}
  .opt .k{flex:none;width:27px;height:27px;border-radius:8px;background:var(--bg2);color:var(--muted);display:grid;place-items:center;font-weight:700;font-size:13px}
  .opt.correct{border-color:var(--good);background:var(--good-soft)} .opt.correct .k{background:var(--good);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .k{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default}
  .feedback{border-radius:12px;padding:13px 15px;margin:4px 0 12px;font-size:14.5px}
  .feedback.ok{background:var(--good-soft);color:var(--good)} .feedback.no{background:var(--bad-soft);color:var(--bad)}
  .feedback b{font-weight:700} .feedback .sub{display:block;margin-top:3px;color:var(--ink);font-weight:500;opacity:.92}
  .whybtn{border:1px solid var(--line);background:var(--card);color:var(--accent-ink);border-radius:10px;min-height:40px;padding:9px 14px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:border-color .2s var(--ease),background .2s var(--ease)}
  .whybtn:hover{border-color:var(--accent);background:var(--accent-soft)} .whybtn .ic{width:16px;height:16px}
  .whybox{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:14px 16px;margin:12px 0 4px;font-size:14px;line-height:1.55}
  .whybox h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--accent-ink);font-family:system-ui;display:flex;align-items:center;gap:7px}
  .whybox .ic{width:16px;height:16px}

  .acc{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
  .acc>summary{padding:15px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;align-items:center;gap:11px}
  .acc>summary::-webkit-details-marker{display:none}
  .acc>summary .n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
  .acc>summary .caret{margin-left:auto;color:var(--muted);transition:transform .25s var(--ease)} .acc[open]>summary .caret{transform:rotate(90deg)}
  .acc[open]>summary{border-bottom:1px solid var(--line)} .acc .body{padding:6px 18px 16px}
  .acc h4{margin:14px 0 6px;font-size:13px;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.4px;font-family:system-ui}
  .acc ul{margin:0;padding-left:20px} .acc li{margin:6px 0;font-size:14.5px;line-height:1.5}
  .acc.hack li::marker{content:"💡  "} .acc.hack>summary .n{background:var(--violet-soft);color:var(--violet)}
  mark{background:var(--amber-soft);color:inherit;padding:0 2px;border-radius:3px}

  .tip{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:15px;box-shadow:var(--shadow)}
  .tip h4{margin:0 0 5px;font-size:14.5px;display:flex;align-items:center;gap:8px;font-family:system-ui} .tip h4 .ic{width:18px;height:18px;color:var(--violet)}
  .tip p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}
  .tipgrid{display:grid;gap:12px} @media(min-width:620px){.tipgrid{grid-template-columns:1fr 1fr}}

  .results .big{font-family:Georgia,serif;font-size:54px;text-align:center;margin:8px 0;line-height:1}
  .center{text-align:center} .hide{display:none!important}
  footer{margin-top:34px;text-align:center;color:var(--muted);font-size:13px}
  .kbd{font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--muted)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.03)}100%{transform:scale(1)}}
  @keyframes optIn{from{opacity:0;transform:translateX(-9px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: no-preference){
    .card,.mode,.tip{animation:fadeUp .34s var(--ease) both}
    .acc{animation:fadeUp .32s var(--ease) both}
    .opt{animation:optIn .3s var(--ease) backwards;animation-delay:var(--oi,0s)}
    .chip.on{animation:pop .22s var(--ease)}
    .feedback{animation:slideIn .26s var(--ease) both} .whybox{animation:slideIn .28s var(--ease) .07s both} .opt.correct{animation:pop .34s var(--ease)}
  }
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  /* ---- Premium launch (Gemini-stijl) + header-logo gloed ---- */
  @property --bes-a{syntax:'<angle>';initial-value:0deg;inherits:false}
  #splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(125% 125% at 50% 38%,var(--bg2) 0%,var(--bg) 68%);transition:opacity .6s var(--ease),transform .7s var(--ease)}
  #splash.hide{opacity:0;transform:scale(1.07);pointer-events:none}
  .sp-inner{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
  .sp-mark{position:relative;width:100px;height:100px;display:grid;place-items:center}
  .sp-mark::before{content:"";position:absolute;inset:-16px;border-radius:34px;z-index:0;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));filter:blur(17px);opacity:.75}
  .sp-mark::after{content:"";position:absolute;inset:-3px;border-radius:27px;z-index:1;background:conic-gradient(from var(--bes-a),var(--accent),var(--violet),var(--amber),var(--accent));padding:3px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .sp-logo{position:relative;z-index:2;width:92px;height:92px;border-radius:24px;display:grid;place-items:center;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:46px;background:linear-gradient(150deg,var(--accent),var(--accent-ink));box-shadow:0 14px 38px rgba(15,110,106,.4)}
  .sp-spark{position:absolute;z-index:3;top:-7px;right:-7px;width:30px;height:30px;color:#fff;filter:drop-shadow(0 2px 7px rgba(0,0,0,.35))}
  .sp-name{position:relative;font-family:Georgia,serif;font-size:26px;font-weight:700;letter-spacing:-.01em;color:var(--ink);overflow:hidden}
  .sp-name::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(-130%)}
  .sp-tag{font-size:13px;color:var(--muted);margin-top:-8px;letter-spacing:.03em}
  @media (prefers-reduced-motion: no-preference){
    .sp-mark::before{animation:bes-spin 3s linear infinite,bes-breathe 2.4s var(--ease) infinite}
    .sp-mark::after{animation:bes-spin 3s linear infinite}
    .sp-logo{animation:bes-pop .7s var(--ease) both}
    .sp-spark{animation:bes-pop .6s var(--ease) .12s both,bes-twinkle 1.9s var(--ease) .9s infinite}
    .sp-name{animation:bes-rise .6s var(--ease) .14s both}
    .sp-name::after{animation:bes-shimmer 1.5s var(--ease) .5s 1}
    .sp-tag{animation:bes-rise .6s var(--ease) .26s both}
  }
  @keyframes bes-spin{to{--bes-a:360deg}}
  @keyframes bes-breathe{0%,100%{opacity:.55;filter:blur(16px)}50%{opacity:.95;filter:blur(22px)}}
  @keyframes bes-shimmer{to{transform:translateX(130%)}}
  @keyframes bes-twinkle{0%,100%{opacity:1;transform:scale(1) rotate(0deg)}50%{opacity:.65;transform:scale(.82) rotate(18deg)}}
  @keyframes bes-rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  /* mobiel: header-knoppen alleen iconen zodat niks zijwaarts overflowt */
  @media(max-width:440px){ header.top .iconbtn span{display:none} header.top .iconbtn{padding:7px 9px;min-width:38px;justify-content:center} .topin{gap:8px} }
</style>
</head>
<body>
<div id="splash"><div class="sp-inner">
  <div class="sp-mark">
    <div class="sp-logo">S2</div>
    <svg class="sp-spark" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.5c.4 4.6 2.4 6.6 7 7-4.6.4-6.6 2.4-7 7-.4-4.6-2.4-6.6-7-7 4.6-.4 6.6-2.4 7-7Z"/></svg>
  </div>
  <div><div class="sp-name">Sociale Psychologie 2</div><div class="sp-tag">slim oefenen voor je examen</div></div>
</div></div>
<header class="top">
  <div class="topin">

<script>
window.SP2 = {"questions":[{"t":"1","q":"Wat bedoelt Darwin met de 'fitness' van een individu?","o":["De mate waarin je je lichamelijk en emotioneel kunt aanpassen aan je omgeving","De hoeveelheid nakomelingen die je uit je eigen genen voortbrengt vergeleken met anderen in je omgeving","De kracht en snelheid waarmee je aan roofdieren kunt ontsnappen","De hoeveelheid middelen die je gedurende je leven weet te verzamelen"],"a":1,"u":"Fitness gaat volgens de tekst om je aantal nakomelingen uit je eigen genen, in vergelijking met anderen in je omgeving. Optie 1 beschrijft adaptatie, niet fitness."},{"t":"1","q":"Iemand helpt een ander, ook al kost dat hemzelf mogelijk kansen op eigen nakomelingen. Welk begrip past hierbij?","o":["Adaptatie","Reciproque altruïsme","Altruïstisch gedrag","Domesticatie"],"a":2,"u":"Altruïstisch gedrag is anderen helpen, ook al kan dat nadelig zijn voor je eigen fitness."},{"t":"1","q":"Wat is volgens Hamilton de kern van 'inclusieve fitness'?","o":["De fitness van je verwanten met een grote genetische overlap verhogen via altruïstisch gedrag","Je eigen fitness maximaal verhogen door zoveel mogelijk partners te zoeken","De fitness van je hele groep gelijk verdelen over alle leden","Vreemden helpen in de hoop dat zij je later terugbetalen"],"a":0,"u":"Inclusieve fitness draait om het verhogen van de fitness van genetisch verwante familie via altruïstisch gedrag."},{"t":"1","q":"Een stiefkind loopt volgens het onderzoek in de tekst een hoger risico. Wat sluit hierop aan?","o":["Stiefouders investeren juist meer omdat ze zich extra willen bewijzen","Stiefouders geven minder zorg en er komt meer misbruik voor","Er is geen enkel verschil tussen biologische en stiefouders","Stiefkinderen hebben altijd een sterkere hechting met stiefouders"],"a":1,"u":"De tekst noemt bij stiefouders minder zorg en meer misbruik, passend bij een kleinere genetische overlap."},{"t":"1","q":"Volgens Trivers houd je bij wat iemand voor jou deed en compenseer je dat later zelf. Hoe heet dit?","o":["Inclusieve fitness","Groepselectie","Seksuele selectie","Reciproque altruïsme"],"a":3,"u":"Reciproque altruïsme is het bijhouden van eerder gedrag en dat later compenseren met een wederdienst."},{"t":"1","q":"Onder welke voorwaarde werkt reciproque altruïsme volgens de tekst?","o":["Alleen wanneer de betrokkenen genetisch nauw verwant zijn","Alleen wanneer je de ander kunt onthouden en profiteurs gestraft kunnen worden","Alleen in zeer grote, anonieme samenlevingen","Alleen wanneer beide partijen exact evenveel bezitten"],"a":1,"u":"Het werkt alleen als de ander onthoudt wie je bent en als profiteurs of bedriegers gestraft kunnen worden."},{"t":"1","q":"Wat concludeerde het kippenonderzoek over groepselectie?","o":["Een nieuw groepje van de allerbeste individuen legt altijd de meeste eieren","Selectie werkt uitsluitend op het niveau van het losse individu","Een bestaande groep selecteren levert meer eieren op, want het sociale klimaat telt","Groepsgrootte heeft geen enkel effect op de prestatie"],"a":2,"u":"Een bestaande groep kippen selecteren gaf meer eieren dan een nieuw groepje toppers; het sociale klimaat van de groep is belangrijk."},{"t":"1","q":"Wat is volgens de tekst het verband tussen sociaal netwerk en brein?","o":["Hoe groter het sociaal netwerk, hoe kleiner de frontale hersengebieden","Hoe groter de groep, hoe groter het brein dat instaat voor sociaal mentaliseren","Sociale netwerken hebben geen aantoonbaar verband met de hersenen","Alleen kleine netwerken vergroten de frontale hersengebieden"],"a":1,"u":"De grootte van het sociaal netwerk hangt samen met volume en activiteit van de frontale gebieden voor sociaal mentaliseren; hoe groter de groep, hoe groter het brein."},{"t":"1","q":"Waarom zijn vrouwen volgens de tekst over ouderlijke investering selectiever in hun partnerkeuze dan mannen?","o":["Omdat hun verlies groter is als de partner vertrekt en zij alleen met het kind achterblijven","Omdat zij biologisch nauwelijks in nakomelingen investeren","Omdat mannen altijd trouw blijven en dus geen risico vormen","Omdat selectiviteit polygamie bij vrouwen zelf bevordert"],"a":0,"u":"Vrouwen investeren sterk in nakomelingen en blijven bij vertrek alleen achter met het kind, dus kiezen ze vanaf het begin een partner die meehelpt zorgen."},{"t":"1","q":"Volgens de tekst zijn mannen en vrouwen jaloers op verschillende soorten overspel. Hoe zit dat?","o":["Beide seksen zijn vooral jaloers op seksueel overspel","Mannen zijn jaloers op emotioneel overspel, vrouwen op seksueel overspel","Vrouwen zijn jaloers op emotioneel overspel, mannen op seksueel overspel","Geen van beide seksen ervaart jaloezie bij overspel"],"a":2,"u":"Vrouwen zijn jaloers op emotioneel overspel (dreiging voor steun en hulp), mannen op seksueel overspel (dreiging voor een kind dat niet van hen is)."},{"t":"2","q":"Waar staan spiegelsystemen volgens de tekst in de eerste plaats voor?","o":["Het lezen en begrijpen van het lichaam en non-verbale acties","Het abstraheren van persoonlijkheidstrekken uit gedrag","Het verenigen van mensen via mythen en verhalen","Het sequentieel automatiseren van bewegingen"],"a":0,"u":"Spiegelsystemen staan in voor het lezen en begrijpen van het lichaam. We snappen andermans non-verbale acties door ze in onze eigen geest te spiegelen."},{"t":"2","q":"Iemand ziet een hand die naar een kopje reikt. Welk hersengebied herkent volgens de tekst vooral het doel van die beweging?","o":["De Fusiform Face Area (FFA)","De premotorische cortex (PMC)","De precuneus","De medial prefrontale cortex (mPFC)"],"a":1,"u":"De premotorische cortex (PMC) herkent de doelen van een beweging. De FFA is voor gezichten, de precuneus hoort bij de sociale context en de mPFC bij het mentaliserend systeem."},{"t":"2","q":"Wat noemt de tekst als nadeel van anderen begrijpen via het spiegelsysteem?","o":["Het kost meer energie dan mentaliseren","Het werkt alleen bij bekende personen","Het kan enkel gezichten en geen lichaamsdelen lezen","Observeerbaar gedrag voorspelt de interne toestand slecht"],"a":3,"u":"Het voordeel is dat je het gedrag van een ander kan begrijpen, maar het nadeel is dat observeerbaar gedrag een slechte voorspeller is van iemands interne staat."},{"t":"2","q":"Wat houdt de sociale brein hypothese van Dunbar in?","o":["Het cerebellum groeide om bewegingen te automatiseren","Sociale hersengebieden ontwikkelen als laatste bij een individu","Mensen ontwikkelden grotere breinen door het samenleven in grotere groepen","Bij onverwacht gedrag neemt het mentaliserend systeem het over"],"a":2,"u":"Volgens Dunbars sociale brein hypothese kregen mensen grotere breinen door de druk van het samenleven in grotere stammen of groepen."},{"t":"2","q":"Waarom zorgt het mentaliserend systeem volgens de tekst voor veel variabiliteit tussen mensen?","o":["Omdat het als laatste evolueerde en dus ook bij een individu als laatste ontwikkelt","Omdat het bij iedereen op een andere plek in het brein ligt","Omdat het enkel actief wordt bij imitatie-inhibitie","Omdat het volledig samenvalt met het spiegelsysteem"],"a":0,"u":"De sociale gebieden zijn pas laat geëvolueerd, dus ook in de individuele ontwikkeling ontwikkelt dit breindeel als laatste. Dat zorgt voor veel variatie tussen mensen."},{"t":"2","q":"Iemand moet zich in steeds meer standpunten van anderen verplaatsen. Wat gebeurt er volgens het smurfen-experiment met de TPJ?","o":["De TPJ wordt onderdrukt naarmate er meer perspectieven zijn","De TPJ schakelt over naar het spiegelsysteem","De TPJ wordt actiever naarmate je meer perspectieven moet aannemen","De TPJ blijft even actief ongeacht het aantal perspectieven"],"a":2,"u":"In het smurfen-experiment geldt: hoe meer perspectieven je moet aannemen, hoe actiever de TPJ wordt. De TPJ is betrokken bij (her)oriëntatie."},{"t":"2","q":"Welke rol krijgt de medial prefrontale cortex (mPFC) in het proces van doel naar eigenschap?","o":["De mPFC ontvangt verbale input en zet die om in een doel","De mPFC herkent biologische bewegingen","De mPFC plaatst gebeurtenissen in hun sociale context","De mPFC zet een doel om in eigenschappen of trekken"],"a":3,"u":"Bij sociaal mentaliseren zet de TPJ verbale input om in een doel, en de mPFC zet dat doel vervolgens om in eigenschappen of trekken."},{"t":"2","q":"Wat gebeurt er in de hersenen wanneer iemand een onverwachte actie ziet?","o":["Enkel het mentaliserend systeem wordt actief, het spiegelsysteem blijft uit","Eerst het mentaliserend systeem, daarna pas het spiegelsysteem","Beide systemen zijn altijd tegelijk en even sterk actief","Eerst het spiegelsysteem voor de actie, daarna het mentaliserend systeem voor de reden"],"a":3,"u":"Bij een onverwachte actie wordt eerst het spiegelsysteem actief (low level, om de actie te begrijpen) en daarna het mentaliserend systeem (high level, om de reden te begrijpen)."},{"t":"2","q":"Een onderzoeker stelt proefpersonen waarom-vragen over gedrag. Welk systeem wordt daarbij vooral aangesproken?","o":["Het mentaliserend systeem, want dit zijn high level vragen","Het spiegelsysteem, want dit zijn low level vragen","Het cerebellum, want dit zijn sequentievragen","De FFA, want dit zijn herkenningsvragen"],"a":0,"u":"Hoe- en wat-vragen zijn low level en activeren het spiegelsysteem. Waarom-vragen zijn high level en activeren het mentaliserend systeem."},{"t":"2","q":"Wat is volgens de tekst kenmerkend voor psychopaten wat betreft empathie en de TPJ?","o":["Een groter TPJ-volume en volledige afwezigheid van cognitieve empathie","Een verminderd TPJ-volume met wel cognitieve maar geen emotionele empathie","Verhoogde emotionele empathie zonder kennis van morele normen","Een normaal TPJ-volume waarbij psychotherapie altijd werkt"],"a":1,"u":"Psychopaten hebben een verminderd TPJ-volume. Ze hebben wel cognitieve empathie en kennen de morele normen, maar missen emotionele empathie en houden er geen rekening mee."},{"t":"3","q":"Wat kenmerkt volgens de tekst een gemengde motieven situatie (mixed-motive situation)?","o":["De belangen van beide partijen komen volledig overeen, zonder enig conflict","De belangen van de een komen deels overeen met die van de ander, maar botsen ook deels","Het verlies van de een is altijd precies de winst van de ander","Beide partijen hebben identieke doelen en kunnen dus nooit onderhandelen"],"a":1,"u":"Bij een gemengde motieven situatie overlappen de belangen gedeeltelijk, maar zijn ze tegelijk deels in conflict."},{"t":"3","q":"Iemand die vooral de beste uitkomst voor de hele groep nastreeft, hanteert volgens de tekst welke sociale preferentie?","o":["Coöperatief","Competitief","Individualistisch","Altruïstisch"],"a":0,"u":"De coöperatieve preferentie richt zich op de beste uitkomst voor de groep, terwijl competitief 'beter dan de rest' en individualistisch 'goed voor jezelf' betekent."},{"t":"3","q":"Een dorp put een gemeenschappelijke visgrond helemaal uit omdat iedereen op korte termijn zoveel mogelijk wil vangen. Welk begrip past hier het best?","o":["Win-win situatie","Distributieve rechtvaardigheid","Sociale val (dilemma van rijkdommen)","Doelverwachtingstheorie"],"a":2,"u":"Een sociale val is voordelig op korte termijn maar nadelig op lange termijn, omdat mensen de limieten van de hulpbron negeren waardoor die uitgeput raakt."},{"t":"3","q":"Wat is volgens de tekst kenmerkend voor een sociale hindernis (social fence), oftewel het dilemma van publieke goederen?","o":["De winst van de een is per definitie het verlies van de ander","Het is voordelig op korte termijn maar loopt uit op verlies op lange termijn","Vanuit een ingroup-perspectief is het nadelig op korte maar voordelig op lange termijn","Het draait uitsluitend om het eerlijk verdelen van bestaande beloningen"],"a":2,"u":"Bij een sociale hindernis met coöperatieve, ingroup-gerichte insteek is meedoen nadelig op korte termijn maar voordelig op lange termijn."},{"t":"3","q":"Volgens de onderling afhankelijke theorie (interdependence theory) is een nul-som situatie er een waarin...","o":["beide partijen er voordelig uitkomen en samenwerking waarschijnlijk is","het verlies van de een de winst van de ander is, wat vaak tot conflict leidt","niemand invloed heeft op de uitkomst van een ander","de beloningen altijd volledig gelijk verdeeld worden"],"a":1,"u":"In een nul-som situatie is het verlies van de een de winst van de ander, wat waarschijnlijk tot conflict leidt; een win-win situatie leidt juist eerder tot coöperatie."},{"t":"3","q":"In het dual concern model van Pruitt en Rubin hoort een hoge zorg voor de eigen uitkomst met een lage zorg voor de ander bij welke strategie?","o":["Toegeeflijk (yielding)","Probleemoplossend (problem-solving)","Passief (inaction)","Strijden (contending)"],"a":3,"u":"Hoog voor jezelf en laag voor de ander betekent strijden (contending); hoog-hoog is probleemoplossend en laag-laag is passief."},{"t":"3","q":"Een collega belooft: 'Werk jij mee, dan werk ik ook mee, maar saboteer je mij, dan doe ik hetzelfde terug.' Welke tactiek past hij toe?","o":["Tit-for-tat tactiek","Distributieve rechtvaardigheid","Sociale ruiltheorie","Procedurele rechtvaardigheid"],"a":0,"u":"Bij de tit-for-tat tactiek spiegel je het gedrag van de ander: 'als jij dit met mij doet, doe ik hetzelfde bij jou'."},{"t":"3","q":"Bij een verdeling waarbij iedereen een beloning krijgt naar rato van de geleverde inspanning of prestatie, spreken we volgens de tekst over welke norm van distributieve rechtvaardigheid?","o":["Gelijkheid","Noodzaak","Billijkheid","Reciprociteit"],"a":2,"u":"Billijkheid koppelt de beloning aan de geleverde inspanning of prestatie, terwijl gelijkheid iedereen evenveel geeft en noodzaak geeft naar behoefte."},{"t":"3","q":"Wat is volgens de tekst het onderscheid tussen procedurele en distributieve rechtvaardigheid?","o":["Procedurele rechtvaardigheid gaat over de eerlijkheid van het beslissingsproces, distributieve over de eerlijke verdeling van de beloningen zelf","Procedurele rechtvaardigheid gaat over de beloningen zelf, distributieve over het proces","Beide begrippen betekenen hetzelfde en verschillen alleen in naam","Procedurele rechtvaardigheid draait om reciprociteit, distributieve om inspraak"],"a":0,"u":"Bij procedurele rechtvaardigheid staat het eerlijke verloop van het beslissingsproces centraal (mensen willen inspraak), terwijl distributieve rechtvaardigheid over de eerlijke verdeling van de beloningen zelf gaat."},{"t":"4","q":"Wat is volgens de tekst het beste onderscheid tussen agressie en geweld?","o":["Geweld is altijd verbaal, terwijl agressie altijd fysiek is","Agressie gebeurt per ongeluk, terwijl geweld altijd gepland is","Agressie is opzettelijk gedrag om iemand te kwetsen, en geweld is agressie waarbij fysieke kracht wordt gebruikt","Geweld en agressie betekenen precies hetzelfde en zijn inwisselbaar"],"a":2,"u":"Agressie is gedrag dat opzettelijk bedoeld is om iemand die dat niet wil pijn te doen. Geweld is agressie waarbij fysieke kracht komt kijken."},{"t":"4","q":"Een onderzoeker wil in een lab agressie meten zonder mensen echt pijn te doen. Welke aanpak past bij de methodes uit de tekst?","o":["Deelnemers nepstroomstoten, luid geluid of koud water laten toedienen","Deelnemers hun eigen vroegere schoolrapporten laten beoordelen","Deelnemers een IQ-test laten maken en de score noteren","Deelnemers laten kiezen welke muziek ze mooi vinden"],"a":0,"u":"Agressie in het lab wordt onder meer gemeten via valse elektroshocks, luid geluid of koud water. Daarnaast bestaan vragenlijsten en archiefdata."},{"t":"4","q":"Wat stelt de frustratie-agressie hypothese van Miller volgens de tekst?","o":["Frustratie heeft geen enkele invloed op agressief gedrag","Frustratie kan mogelijk tot agressie leiden, en angst voor straf kan die agressie verminderen","Frustratie leidt altijd en zonder uitzondering tot fysiek geweld","Agressie ontstaat uitsluitend door genetische aanleg, niet door frustratie"],"a":1,"u":"Volgens Miller kan frustratie mogelijk tot agressie leiden. Angst voor straf vermindert de agressie."},{"t":"4","q":"Iemand is woedend op zijn baas maar durft niets te zeggen, en snauwt thuis tegen een jonger familielid. Welk mechanisme uit de frustratie-agressie hypothese herken je hier?","o":["Excitatie-transfer door fysiologische arousal","Desensitisatie in de OFC door mediageweld","Verplaatsing van agressie naar een zwakker slachtoffer","Vijandige attributie bias"],"a":2,"u":"Als agressie niet naar de agressor geuit kan worden, wordt ze verplaatst naar een zwakker slachtoffer. Dit is via meta-analyse bevestigd."},{"t":"4","q":"Wat houdt het wapen-effect binnen de frustratie-agressie benadering in?","o":["Wapenbezit vermindert frustratie omdat mensen zich veiliger voelen","Alleen echte wapens, niet foto's, hebben invloed op gedrag","Wapens verhogen enkel de flight-respons via cortisol","Foto's van wapens werken als agressieve cues en verhogen frustratie en agressie"],"a":3,"u":"Foto's van wapens fungeren als agressieve cues die tot meer frustratie en meer agressief gedrag leiden. Dit effect is via meta-analyse bevestigd."},{"t":"4","q":"Volgens de cognitieve neo-associatietheorie van Berkowitz bepaalt vooral welke factor of iemand rudimentaire angst dan wel rudimentaire woede voelt?","o":["De associaties met gebeurtenissen uit het verleden","Het testosterongehalte op dat moment","De omgevingstemperatuur","De hoeveelheid alcohol in het bloed"],"a":0,"u":"Bij Berkowitz hangt de opgeroepen emotie, rudimentaire angst versus rudimentaire woede, af van de associaties met eerdere gebeurtenissen."},{"t":"4","q":"Een wielrenner die net hard heeft gefietst reageert na negatieve feedback agressiever dan iemand die rustig een taak maakte. Welke theorie verklaart dit het best?","o":["Sociale leertheorie","Stoommachinemodel uit de ethologie","Excitatie-transfer theorie van Zillman","Sociale informatieverwerkingsmodellen"],"a":2,"u":"Volgens Zillmans excitatie-transfer theorie versterkt overgebleven fysiologische arousal, verkeerd toegeschreven aan een persoon, de effecten van frustratie. De aroused fietsgroep gedroeg zich agressiever."},{"t":"4","q":"Wat is de kern van de sociale leertheorie zoals in de tekst beschreven, geillustreerd met het Bobo doll experiment?","o":["Agressie zit vast in de genen en wordt via tweelingstudies aangetoond","We leren agressie indirect door een model te imiteren en door beloning van agressief gedrag","Agressie komt enkel voort uit een teveel aan opgehoopte interne energie","Frustratie leidt automatisch tot verplaatste agressie"],"a":1,"u":"In de sociale leertheorie wordt agressief gedrag direct beloond en leren we indirect door een model. In het Bobo doll experiment imiteren kinderen het agressieve gedrag van volwassenen."},{"t":"4","q":"Hoe verhoudt het stoommachinemodel uit de ethologie zich volgens de tekst tot empirische evidentie?","o":["Het heeft geen empirische evidentie, maar wordt nog wel in het discours gebruikt","Het is stevig empirisch onderbouwd door tweelingstudies","Het is bewezen via meta-analyses van labonderzoek","Het is volledig verworpen en verdwenen uit elk discours"],"a":0,"u":"Het stoommachinemodel baseert zich op dierenproeven en heeft geen empirische evidentie, maar het is nog gebruikelijk in het discours."},{"t":"4","q":"Wat is de vijandige attributie bias (hostile attribution bias) volgens de tekst?","o":["De neiging om agressie altijd naar een zwakker slachtoffer te verplaatsen","Het onvermogen om testosteron en cortisol van elkaar te onderscheiden","De overtuiging dat straf agressie altijd effectief vermindert","De neiging om situaties te interpreteren alsof er vijandige bedoelingen achter zitten"],"a":3,"u":"Bij de vijandige attributie bias interpreteren mensen een situatie alsof er vijandige intenties spelen. Volgens meta-analyse leidt dit tot meer vijandig gedrag."},{"t":"4","q":"Welke situationele factor bekrachtigt agressie volgens de tekst enkel bij mensen met weinig empathie?","o":["Hoge temperatuur","Alcohol","Gewelddadige media","Genetische aanleg"],"a":1,"u":"Alcohol bekrachtigt agressief gedrag, maar heeft enkel effect op mensen met weinig empathie, door verminderde aandacht en minder controle over de situatie."},{"t":"5","q":"Iemand geeft bloed en zegt erbij dat het hem vooral een goed gevoel over zichzelf geeft. Onder welk soort motief valt dit volgens de waardenstudie van Van den Vliert?","o":["Een egoistisch motief","Een altruistisch motief","Empathie-altruisme","Inclusieve fitness"],"a":0,"u":"Bij egoistische motieven help je zodat jij jezelf goed voelt, denk aan van dienst willen zijn of nieuwe mensen leren kennen."},{"t":"5","q":"Wat houdt de empathie-altruisme hypothese van Batson in?","o":["Dat we vooral helpen wanneer we ons zelf al goed voelen","Dat empathie voelen een altruistische motivatie doet ontstaan","Dat helpen altijd uit puur eigenbelang voortkomt","Dat naaste familie ons het snelst zal helpen"],"a":1,"u":"Volgens Batson wekt het voelen van empathie voor iemand een altruistische motivatie op om te helpen. Dit werd onderzocht in het Elaine-experiment."},{"t":"5","q":"In het Elaine-experiment kon een deelnemer de plaats van het slachtoffer innemen. Welke hypothese werd hiermee getoetst?","o":["Het negative-state-relief model van Cialdini","De metrostudie van Piliavin","De empathie-altruisme hypothese van Batson","De theorie van inclusieve fitness"],"a":2,"u":"Het Elaine-experiment testte Batsons empathie-altruisme hypothese: de deelnemer kon het geelektrocuteerde slachtoffer helpen door haar plaats over te nemen."},{"t":"5","q":"Waarmee hangt de kans op ingrijpen samen volgens het bijstanderseffect zoals in de tekst beschreven?","o":["Met de ernst van de verwonding van het slachtoffer","Met het aantal aanwezige bijstanders","Met de huidskleur van het slachtoffer","Met de training van de omstaanders"],"a":1,"u":"Het bijstanderseffect zegt: hoe minder bijstanders er zijn, hoe eerder men geneigd is om in te grijpen."},{"t":"5","q":"In een ongewone situatie weet niemand goed hoe te reageren, waardoor mensen elkaars passiviteit lezen als teken dat er niets aan de hand is. Welk begrip uit het model van Latane en Darley past hierbij?","o":["Inhibitie door publiek","Gedeelde verantwoordelijkheid","Pluralistische onwetendheid","We-ness"],"a":2,"u":"Pluralistische onwetendheid is niet weten wat te doen in een ongebruikelijke situatie. Een model om naar te handelen biedt hier een oplossing."},{"t":"5","q":"Iemand grijpt niet in omdat hij twijfelt of hij het wel succesvol kan aanpakken terwijl anderen toekijken. Welk begrip uit het procesmodel past hierbij?","o":["Pluralistische onwetendheid","Gedeelde identiteit","Directe fitness","Inhibitie door publiek"],"a":3,"u":"Inhibitie door publiek (audience inhibition) is het niet geloven dat wij in staat zijn om succesvol in te grijpen. Effectieve training is hiervoor de oplossing."},{"t":"5","q":"Wat lieten de fMRI-studies over het bijstanderseffect zien naarmate er meer omstaanders aanwezig waren?","o":["Een sterkere activatie van het beloningscentrum","Een kleinere activatie van het motor- en mentaliserend systeem","Een grotere activatie van de anterieure insula","Een sterkere activatie van het rechter TPJ"],"a":1,"u":"Volgens de fMRI-studies leidt een groter aantal omstaanders tot een kleinere activatie van het motor- en mentaliserend systeem in het brein."},{"t":"5","q":"Naar welk aspect verwijst 'we-ness' in het herziene arousal/kosten-baten model van Piliavin?","o":["De mate waarin het slachtoffer zelf verantwoordelijk is voor zijn lijden","De hoeveelheid tijd en moeite die het helpen kost","De mate waarin het slachtoffer tot de groep van de bijstander behoort","De dankbaarheid en eer die de helper achteraf krijgt"],"a":2,"u":"We-ness is een bijstanderkenmerk dat aangeeft in welke mate het slachtoffer tot de groep van de bijstander behoort."},{"t":"5","q":"Volgens het onderzoek naar gedeelde identiteit helpen we mensen met gemeenschappelijke kenmerken eerder. Wat is daarvoor de verklaring in de tekst?","o":["Omdat het minder tijd en moeite kost om hen te helpen","Omdat we hun lijden beter kunnen inbeelden, wat meer empathie oproept","Omdat verwanten ons een reproductief voordeel opleveren","Omdat we bang zijn om door hen geevalueerd te worden"],"a":1,"u":"Door gemeenschappelijke kenmerken kunnen we het lijden van de ander beter inbeelden, wat meer empathie en dus meer hulp oproept."},{"t":"5","q":"Welke genderbevinding vonden Levine en Crowther na het observeren van een video van een noodsituatie?","o":["Mannen helpen eerder wanneer ze de situatie alleen observeren","Vrouwen helpen eerder wanneer ze de situatie alleen observeren","Mannen helpen uitsluitend wanneer het om familie gaat","Vrouwen blijven bewust alleen om het gevaar te vergroten"],"a":0,"u":"Mannen helpen eerder wanneer ze alleen observeren, uit angst geevalueerd te worden, terwijl vrouwen eerder helpen in groep om het gevaar te minimaliseren."},{"t":"5","q":"Wat toont het onderzoek naar inclusieve fitness van Burnstein aan over wie ons in noodsituaties eerder helpt?","o":["Mensen die op ons lijken qua kleding","Leden van dezelfde beroepsgroep","Vreemden binnen een grote groep","Dichtere familie"],"a":3,"u":"Het onderzoek naar inclusieve fitness laat zien dat dichtere familie je eerder helpt in noodsituaties, passend bij indirecte fitness, het reproductief voordeel van verwanten."},{"t":"5","q":"Uit welke twee factoren bestaat de prosociale persoonlijkheid volgens Penner?","o":["Directe fitness en indirecte fitness","Ander-orientatie en hulpvaardigheid","Kosten en baten","Empathie en boosaardig plezier"],"a":1,"u":"De prosociale persoonlijkheid volgens Penner bestaat uit ander-orientatie (other-orientation) en hulpvaardigheid (helpfulness)."},{"t":"6","q":"Het halo-effect zorgt ervoor dat we bij mooie mensen automatisch een bepaald beeld vormen. Wat stelt de fysieke-aantrekkelijkheidshypothese precies?","o":["Fysieke aantrekkelijkheid roept een positief stereotype over de persoon op","Fysieke aantrekkelijkheid maakt iemand ongeloofwaardig in de ogen van anderen","Fysieke aantrekkelijkheid heeft geen enkel effect op hoe anderen iemand inschatten","Fysieke aantrekkelijkheid leidt vooral tot jaloezie en afwijzing"],"a":0,"u":"Het principe 'wat mooi is, is goed' betekent dat fysieke aantrekkelijkheid een positief stereotype over de persoon creeert."},{"t":"6","q":"Een baby lacht en huilt om de ouders in de buurt te houden. Volgens welke onderzoeker is dit hechtingssysteem aangeboren en vergroot het de overlevingskans?","o":["Sternberg","Bowlby","Byrne","Rusbult"],"a":1,"u":"Bowlby stelt dat baby's een aangeboren hechtingssysteem hebben en bij gevaar dicht contact met de moeder zoeken, wat de kans op overleven vergroot."},{"t":"6","q":"Iemand voelt zich op zijn gemak bij intiem contact, vertrouwt anderen en heeft geen angst om verlaten te worden of om iemand dichtbij te laten komen. Welk hechtingstype past hierbij, en bij welk percentage komt dit voor?","o":["Ontwijkend (dismissing), 25% van de gevallen","Angstig-ambivalent (preoccupied), 25% van de gevallen","Veilig (secure), 50% van de gevallen","Ontwijkend (dismissing), 50% van de gevallen"],"a":2,"u":"Het veilige hechtingstype voelt zich comfortabel bij contact, vertrouwt anderen en houdt gezonde relaties in stand; dit komt in ongeveer 50% van de gevallen voor."},{"t":"6","q":"Bij Moreland en Beach werden studenten die het vaakst naar de les kwamen op het einde van het semester het tofst en aantrekkelijkst gevonden. Welk aantrekkingsprincipe illustreert dit?","o":["Gelijkenis in belangrijke voorkeuren","Familiariteit door iemand vaak te zien","Billijkheid tussen kosten en baten","Verkeerde toeschrijving van arousal"],"a":1,"u":"Familiariteit houdt in dat je iemand die je vaak ziet aantrekkelijker gaat vinden; het onderzoek van Moreland en Beach toont dit via aanwezigheid in de les."},{"t":"6","q":"Byrne stelt dat we ons meer aangetrokken voelen tot mensen met gelijkaardige attitudes. Welke van onderstaande is volgens hem GEEN reden waarom gelijkenis aantrekkelijk werkt?","o":["Het valideert onze eigen overtuigingen en meningen","De ander is voor ons voorspelbaarder","Tegenpolen vullen elkaar juist beter aan","Het roept een positief affect op"],"a":2,"u":"Byrne noemt onder meer validatie van overtuigingen, positief affect, voorspelbaarheid en beter begrepen worden; 'tegenpolen trekken aan' wordt door zijn bevindingen juist weerlegd."},{"t":"6","q":"In het brugexperiment van Dutton en Aron kregen mannen die over een wankele, enge brug liepen sterkere gevoelens voor de vrouw achter de brug. Hoe verklaart de tekst dit?","o":["De vrouw was fysiek aantrekkelijker dan gemiddeld","De mannen schreven hun hoge arousal ten onrechte toe aan aantrekking","De mannen deelden dezelfde attitudes als de vrouw","De afstand tussen brug en vrouw was extreem klein"],"a":1,"u":"Bij bridge arousal misattribution wordt de opwinding van de gevaarlijke brug verkeerd geinterpreteerd als romantische aantrekking tot de vrouw."},{"t":"6","q":"Wanneer is er volgens de triangulaire theorie van Sternberg sprake van volmaakte liefde (consummate love)?","o":["Wanneer enkel intimiteit en passie in balans zijn","Wanneer enkel toewijding en passie in balans zijn","Wanneer enkel intimiteit aanwezig is","Wanneer alle drie de aspecten (intimiteit, passie en toewijding) in balans zijn"],"a":3,"u":"Voor volmaakte liefde moeten volgens Sternberg alle drie de aspecten, intimiteit, passie en toewijding, in balans zijn."},{"t":"6","q":"Van welke twee aspecten is volgens Sternberg sprake bij compassievolle (vriendschappelijke) liefde?","o":["Intimiteit en toewijding","Intimiteit en passie","Passie en toewijding","Toewijding en jaloezie"],"a":0,"u":"Compassievolle of vriendschappelijke liefde ontstaat wanneer intimiteit en toewijding in balans zijn, zonder de passiecomponent."},{"t":"6","q":"Een partner voelt zich in de relatie duidelijk benadeeld. Wat voorspelt de billijkheidstheorie over deze partner?","o":["Die voelt zich vooral schuldig en trekt zich terug","Die voelt zich gefrustreerd en boos en gaat sneller vreemd","Die wordt automatisch toleranter en investeert net meer","Die ervaart geen enkel effect zolang de liefde sterk blijft"],"a":1,"u":"Volgens de billijkheidstheorie voelt een benadeelde partner zich gefrustreerd, boos en geraakt en zal die sneller scheve schaatsen slaan; de bevoordeelde partner voelt zich juist schuldig."},{"t":"6","q":"In het investeringsmodel van Rusbult bleek een factor uit het longitudinale onderzoek het sterkst gelinkt aan het engagement om in de relatie te blijven. Welke factor was dat?","o":["De kwaliteit van betere alternatieven","De hoeveelheid geinvesteerde tijd en herinneringen","De demografische gelijkenis tussen partners","De baten of beloningen die de relatie oplevert"],"a":3,"u":"Uit het longitudinale onderzoek bleek dat vooral de baten (beloningen) een sterk effect hadden op het engagement, terwijl alternatieven en investeringen een kleiner effect hadden."},{"t":"6","q":"Clark en Mills onderscheiden twee relatietypes op basis van hoe partners met elkaars belangen omgaan. Wat kenmerkt een gemeenschappelijke relatie (communal relation)?","o":["Men geeft om elkaar en richt zich op elkaars belangen","Men houdt strikt bij wie precies wat bijdraagt","Men richt zich vooral op het eigen belang","Men beschouwt elkaar altijd als niet-gelijkwaardig"],"a":0,"u":"In een gemeenschappelijke relatie geven partners om elkaar en richten ze zich op elkaars belangen, terwijl een uitwisselingsrelatie draait om het eigen belang."},{"t":"6","q":"Het sociaal penetratie model wordt in de tekst met een ajuin vergeleken. Wat wil die vergelijking duidelijk maken?","o":["Dat relaties altijd tranen en conflict opleveren","Dat relaties laag per laag dieper gaan, van de oppervlakte naar iemands kern","Dat relaties snel verrotten zonder onderhoud","Dat elke relatie uit precies drie vaste lagen bestaat"],"a":1,"u":"Het sociaal penetratie model beschrijft hoe relaties via communicatie laag per laag dieper gaan, van de oppervlakte naar de kern van iemands bestaan, zoals het pellen van een ajuin."},{"t":"6","q":"Bradbury en Fincham deden een review over attributies bij koppels. Wat gebeurt er volgens hen in een slechte relatie met het gedrag van de partner?","o":["Zowel negatief als positief gedrag wordt positief geinterpreteerd","Enkel negatief gedrag wordt opgemerkt, positief gedrag niet","Al het gedrag wordt neutraal en zonder oordeel bekeken","Zowel negatief als positief gedrag wordt negatief geinterpreteerd"],"a":3,"u":"In een slechte relatie attribueren partners zowel negatief als positief gedrag negatief en ervaren ze beide als negatief; in een goede relatie gebeurt het omgekeerde."},{"t":"7","q":"Wat is volgens de James-Lange theorie de volgorde waarin een emotie tot stand komt?","o":["De gebeurtenis wordt eerst cognitief beoordeeld, en uit die beoordeling ontstaat de emotie","De gebeurtenis lokt eerst een specifieke fysiologische respons van het autonome zenuwstelsel uit, en daaruit volgt de emotie","De gebeurtenis roept eerst de emotie op, en pas daarna geeft het lichaam een fysiologische respons","De gebeurtenis wekt algemene arousal op die samen met een reflex meteen de emotie vormt"],"a":1,"u":"James-Lange stelt: gebeurtenis, dan een specifieke fysiologische respons van het AZS, en daaruit de emotie. Eerst emotie en dan het lichaam is juist de pre-James volgorde."},{"t":"7","q":"Welk verschil tussen een reflex en een emotie geeft de leerstof aan?","o":["Een reflex komt enkel bij dieren voor, een emotie enkel bij mensen","Een reflex is aangeleerd, terwijl een emotie aangeboren is","Bij een reflex komt geen cognitie kijken, terwijl een emotie een impuls tot handelen is waarbij cognities wel meespelen","Een reflex is diffuus en langdurig, terwijl een emotie kort en gericht is"],"a":2,"u":"Volgens de tekst is een reflex een reactie zonder cognitie, terwijl een emotie een impuls tot handelen is waarbij cognities wel betrokken zijn."},{"t":"7","q":"Iemand voelt zich de hele dag somber zonder dat er iets concreets is gebeurd. Bij welk begrip past dit volgens de leerstof het best?","o":["Een gemoed, want dat is een diffuse en langdurende staat die niet als reactie op een concrete gebeurtenis optreedt","Een emotie-episode, want die ontstaat steeds als reactie op een noodsituatie","Een reflex, want die verloopt zonder tussenkomst van cognitie","Een actietendens, want die bereidt gepast gedrag voor"],"a":0,"u":"Een gemoed is een diffuse, langdurende gevoelsstaat die niet als respons op een concrete gebeurtenis optreedt, anders dan een emotie."},{"t":"7","q":"Wanneer treedt volgens de Schachter-Singer theorie misattributie op?","o":["Wanneer iemand precies weet waarom hij aroused is, waardoor de emotie net intenser wordt","Wanneer het fysiologische proces en het cognitieve interpretatieproces niet met elkaar gelinkt worden","Wanneer er helemaal geen fysiologische arousal aanwezig is","Wanneer de gezichtsuitdrukking niet overeenstemt met het gevoel"],"a":1,"u":"Misattributie ontstaat wanneer de perceptie van arousal en de cognitieve interpretatie van de situatie niet aan elkaar gekoppeld worden. Bewust weten waarom je aroused bent maakt de emotie juist minder intens."},{"t":"7","q":"Welk onderscheid tussen twee soorten beoordeling maakt de appraisal theory van Lazarus?","o":["Een positieve tegenover een negatieve beoordeling van de emotie zelf","Een bewuste beoordeling door de OFC tegenover een onbewuste door de amygdala","Een primaire beoordeling van aangenaam of bedreigend tegenover een secundaire beoordeling die context schept en de eerste emotie herevalueert","Een fysiologische beoordeling door het AZS tegenover een motorische beoordeling in het gezicht"],"a":2,"u":"Lazarus onderscheidt een primaire beoordeling (aangenaam of niet, bedreigend of niet) en een secundaire beoordeling die de situatie in context plaatst en de primaire emotie opnieuw evalueert."},{"t":"7","q":"Hoe onderbouwde Ekman dat de gezichtsuitdrukkingen van de zes basisemoties universeel zijn?","o":["Door aan te tonen dat blinde en niet-blinde mensen sterk verschillen in hun emotionele expressie","Door aan te tonen dat stammen westerse gezichtsuitdrukkingen herkenden en dezelfde uitdrukkingen konden nabootsen bij voorgestelde gebeurtenissen","Door aan te tonen dat acteurs hun volledige gezichtsuitdrukking bewust kunnen sturen","Door aan te tonen dat de stem bij boosheid luid en hard en bij angst hoog en dun klinkt"],"a":1,"u":"Ekman liet zien dat stammen zonder westerse invloed de gezichtsuitdrukkingen herkenden en konden imiteren, wat wijst op universaliteit en een aangeboren basis."},{"t":"7","q":"Wat stelt de facial feedback hypothese over de band tussen gezichtsuitdrukking en gevoel?","o":["Als een emotionele gezichtsuitdrukking overeenstemt met de toestand van de persoon, versterkt dat het bijbehorende gevoel","Een gezichtsuitdrukking heeft geen invloed op het gevoel, want gevoel ontstaat enkel in de amygdala","Fysiologische reacties zijn makkelijker te controleren dan gezichtsuitdrukkingen","Het onderdrukken van een gezichtsuitdrukking maakt het gevoel vanzelf sterker"],"a":0,"u":"De facial feedback hypothese stelt dat een gezichtsuitdrukking die overeenstemt met de gevoelstoestand het overeenkomstige gevoel versterkt via proprioceptieve feedback."},{"t":"7","q":"In het onderzoek van Gross keken mensen naar een afschuwelijke film. Wat volgde uit de vergelijking tussen onderdrukking en herwaardering?","o":["Onderdrukking en herwaardering leverden precies hetzelfde resultaat op","Herwaardering verhoogde de arousal, terwijl onderdrukking de aversie verminderde","Onderdrukking verhoogde de arousal en werd afgeraden, terwijl herwaardering de aversie verminderde","Enkel vrouwen slaagden erin hun emoties te onderdrukken"],"a":2,"u":"Bij Gross leidde onderdrukking tot verhoogde arousal (een no-go), terwijl herwaardering, de film als interessant zien, de aversie juist verminderde."}],"theory":[{"h":"Evolutionaire psychologie","items":["Adaptatie: de mate waarin je je kunt aanpassen aan de eisen van je omgeving; in sociale psychologie gaat het om aanpassing in gedrag en emoties.","Fitness: hoeveel nakomelingen je uit je eigen genen voortbrengt vergeleken met anderen in je omgeving.","Natuurlijke selectie: soorten die zich beter aanpassen aan de omgeving overleven beter en krijgen zo een grotere fitness.","Altruistisch gedrag: anderen helpen, ook als dat nadelig kan zijn voor je eigen fitness.","Inclusieve fitness: de fitness van genetisch verwante familie verhogen door altruistisch gedrag te vertonen.","Verwantenselectie: hoe groter de genetische verwantschap, hoe groter de kans dat je iemand helpt.","Reciproque altruisme: bijhouden wat iemand eerder deed en dat later compenseren met een wederdienst.","Groepselectie: selectie die op groepsniveau werkt, omdat het sociale klimaat van een groep de prestatie bepaalt (kippenonderzoek van Haidt).","Domesticatie: het kweken en temmen van dieren zodat ze nuttige functies vervullen, met kenmerken als platte oortjes en een wit vlekje.","Seksuele selectie: natuurlijke selectie op basis van toegang tot verschillende seksuele partners.","Ouderlijke investering: vrouwen investeren vooral in de nakomelingen zelf, mannen vooral in hun zaad.","Reproductieve strategie van vrouwen: selectief kiezen voor een partner die meehelpt zorgen, wat polygamie bij mannen tegengaat.","Competitie tussen mannen: grotere variatie in reproductief succes en het nastreven van meerdere partners.","Jaloezie en overspel: vrouwen zijn jaloers op emotioneel overspel, mannen op seksueel overspel."]},{"h":"Sociaal mentaliseren","items":["Spiegelsysteem: hersensysteem dat het lichaam en non-verbale acties leest door ze in je eigen geest te spiegelen.","Mentaliseersysteem: hersensysteem dat de geest leest, dus andermans gedachten en overtuigingen begrijpt.","Theory of mind / sociaal mentaliseren: de uniek menselijke capaciteit om iemands gedachten en geloof te begrijpen.","FFA (Fusiform Face Area): gebied voor het herkennen van gezichten.","pSTS (posterior Superior Temporale Sulcus): herkent biologische bewegingen, actief bij oog- en lichaamsbewegingen die iets in de buitenwereld aangeven.","PMC (premotorische cortex): herkent de doelen achter een beweging.","TPJ (Temporo Parietal Junction): lateraal gebied betrokken bij (her)oriëntatie en het aannemen van perspectieven; zet verbale input om in een doel.","mPFC (medial prefrontale cortex): centraal gebied dat doelen omzet in persoonlijkheidstrekken en eigenschappen begrijpt.","Sociale brein hypothese (Dunbar): mensen kregen grotere breinen door het samenleven in grotere groepen.","Default mode: als je aan 'niks' denkt, werkt het mentaliserend systeem toch, bijvoorbeeld plannen wat je gaat eten.","Low level vs high level action: hoe/wat-vragen (spiegelsysteem) tegenover waarom-vragen (mentaliserend systeem).","Imitatie-inhibitie: het spiegelsysteem afremmen zodat het mentaliserend systeem gebruikt kan worden.","Sociale cerebellum / sequentie detectie hypothese (Leggio en Molinaro): cerebellum leert sociale acties sequentieel zodat we kunnen anticiperen.","Precuneus: gebied betrokken bij de sociale context waarin gebeurtenissen plaatsvinden."]},{"h":"Sociale interactie","items":["Gemengde motieven situatie: situatie waarin de belangen van twee partijen deels samenvallen maar tegelijk deels botsen.","Sociale ruiltheorie: het idee dat beide partijen in een relatie hun baten willen maximaliseren en hun kosten minimaliseren.","Sociaal dilemma: een collectief actieprobleem waarbij individueel voordeel en groepsvoordeel met elkaar botsen, zoals het prisoner's dilemma.","Sociale val (resource dilemma): competitieve keuze die op korte termijn loont maar op lange termijn schaadt doordat de gedeelde hulpbron uitgeput raakt.","Sociale hindernis (public goods dilemma): keuze die op korte termijn nadelig is maar op lange termijn voordelig, vaak vanuit een coöperatieve ingroup-insteek.","Onderling afhankelijke theorie: de opvatting dat iemands acties mede bepaald worden door de acties van een ander.","Nul-som situatie: situatie waarin het verlies van de een precies de winst van de ander is, wat vaak tot conflict leidt.","Win-win situatie: situatie waarin beide partijen er voordelig uitkomen, wat samenwerking bevordert.","Dual concern model: model van Pruitt en Rubin dat onderhandelingsstrategie verklaart uit de zorg voor de eigen uitkomst en de zorg voor de uitkomst van de ander.","Sociale waarde oriëntatie: iemands persoonlijke voorkeur om al dan niet te delen, waarbij prosociale mensen coöperatiever en antisociale mensen competitiever zijn.","Doelverwachtingstheorie: het idee dat coöperatie wordt bevorderd als iemand meer coöperatieve doelen stelt en meer coöperatie van anderen verwacht.","Tit-for-tat tactiek: strategie waarbij je het gedrag van de ander spiegelt, dus meewerken als de ander meewerkt en terugslaan als de ander tegenwerkt.","Distributieve rechtvaardigheid: de norm die bepaalt dat beloningen eerlijk verdeeld worden, via gelijkheid, billijkheid, noodzaak of reciprociteit.","Procedurele rechtvaardigheid: eerlijkheid niet van de beloningen zelf maar van het beslissingsproces waarmee de middelen verdeeld worden, waarbij mensen vooral inspraak willen."]},{"h":"Agressie","items":["Agressie: gedrag dat opzettelijk bedoeld is om iemand die dat niet wil pijn te doen of te kwetsen","Geweld: agressie waarbij fysieke kracht wordt gebruikt","Frustratie-agressie hypothese (Miller): frustratie kan tot agressie leiden, en angst voor straf remt die agressie af","Verplaatsing: agressie die niet naar de agressor kan, wordt geuit op een zwakker slachtoffer","Wapen-effect: beelden van wapens werken als agressieve cues en verhogen frustratie en agressie","Cognitieve neo-associatietheorie (Berkowitz): of je angst of woede voelt hangt af van associaties met eerdere gebeurtenissen","Excitatie-transfer theorie (Zillman): overgebleven fysiologische arousal wordt verkeerd toegeschreven en versterkt de agressie","Sociale leertheorie: agressie wordt geleerd door imitatie van een model en door beloning, zoals in het Bobo doll experiment","Sociale informatieverwerkingsmodellen: agressie ontstaat door aangeleerde scripts over wat de gepaste norm is","Stoommachinemodel (ethologie): idee dat opgehoopte interne energie door externe signalen wordt vrijgelaten, zonder empirische evidentie","Vijandige attributie bias: de neiging om situaties te lezen alsof er vijandige bedoelingen achter zitten","Trekagressie: agressiekenmerken (fysiek, verbaal, woede, vijandigheid) als stabiele persoonlijkheidstrekken over de tijd","Catharsis: je agressie afreageren op iets anders, wat contraproductief werkt omdat agressieve inhoud toegankelijker wordt","Woedebeheersing (anger management): in fases leren om minder agressief te reageren op provocerende signalen"]},{"h":"Prosociaal gedrag","items":["Helpgedrag: helpen in de meest brede zin van het woord.","Prosociaal gedrag: de intentie om anderen en de maatschappij als geheel te verbeteren.","Altruisme: hulp die voortkomt uit empathie, gericht op het welzijn van de ander.","Empathie-altruisme hypothese (Batson): empathie voelen creeert een altruistische motivatie om te helpen, getest in het Elaine-experiment.","Negative-state-relief model (Cialdini): een egoistisch motief waarbij je helpt om je eigen negatieve gevoel te verlichten.","Bijstanderseffect: hoe minder bijstanders aanwezig zijn, hoe eerder iemand geneigd is in te grijpen.","Pluralistische onwetendheid: niet weten wat te doen in een ongebruikelijke situatie, opgelost door een model om naar te handelen.","Diffusie van verantwoordelijkheid: gedeelde verantwoordelijkheid waarbij niemand zich persoonlijk aangesproken voelt om te helpen.","Audience inhibition: niet geloven dat je zelf in staat bent om succesvol in te grijpen, opgelost door effectieve training.","Arousal/kosten-baten model (Piliavin): helpen weegt kosten (tijd, gevaar, moeite) af tegen baten (zelfvertrouwen, dankbaarheid, eer).","We-ness: bijstanderkenmerk dat aangeeft in welke mate het slachtoffer tot de groep van de bijstander behoort.","Gedeelde identiteit: gemeenschappelijke kenmerken laten ons het lijden van de ander beter inbeelden, wat meer empathie en hulp oproept.","Inclusieve fitness (Burnstein): dichtere familie helpt je eerder, met directe fitness (eigen voordeel) en indirecte fitness (voordeel van verwanten).","Prosociale persoonlijkheid (Penner): stabiele neiging om aan het welzijn van anderen te denken, met de factoren ander-orientatie en hulpvaardigheid."]},{"h":"Aantrekking & dichte relaties","items":["Fysieke-aantrekkelijkheidshypothese (halo-effect): fysieke aantrekkelijkheid roept automatisch een positief stereotype op over iemands persoon ('wat mooi is, is goed').","Zelf vervullende voorspelling: aantrekkelijke mensen krijgen meer aandacht en complimenten, ontwikkelen meer zelfvertrouwen en worden daardoor nog aantrekkelijker.","Veilige hechting: comfortabel met intimiteit, vertrouwen in anderen, geen angst voor verlating; houdt gezonde relaties in stand (ongeveer 50%).","Ontwijkende (dismissing) hechting: oncomfortabel bij intiem contact, weinig vertrouwen, nerveus als iemand dichtbij komt (ongeveer 25%).","Angstig-ambivalente hechting: wil juist meer contact, angst om verlaten te worden en neiging om volledig samen te smelten met de ander (ongeveer 25%).","Proximiteit: hoe dichter iemand fysiek bij je is, hoe aantrekkelijker je die vindt, door minder obstakels, meer contact en meer gedeelde afhankelijkheid.","Familiariteit: hoe vaker je iemand ziet en kent, hoe leuker en aantrekkelijker je die persoon gaat vinden.","Gelijkenis (similarity, Byrne): we voelen ons meer aangetrokken tot wie op ons lijkt, omdat het onze overtuigingen valideert, positief affect geeft en de ander voorspelbaarder maakt.","Arousal misattributie (Dutton & Aron): opwinding uit een andere bron, zoals een enge brug, wordt ten onrechte als romantische aantrekking geinterpreteerd.","Triangulaire theorie (Sternberg): liefde bestaat uit intimiteit, passie en toewijding; alle drie in balans geeft volmaakte liefde, intimiteit plus toewijding geeft compassievolle liefde.","Billijkheidstheorie (equity theory): een relatie werkt best bij een goede balans tussen kosten en baten; bevoordeelde partners voelen schuld, benadeelde partners frustratie.","Investeringsmodel (Rusbult): engagement hangt af van tevredenheid, kwaliteit van alternatieven en investeringen, waarbij vooral de baten sterk voorspellen of men blijft.","Uitwisselings- versus gemeenschappelijke relatie (Clark & Mills): bij uitwisseling telt eigen belang, bij een gemeenschappelijke relatie geef je om elkaars belangen.","Sociaal penetratie model: relaties ontwikkelen zich via communicatie laag per laag, van oppervlakte naar kern, vergeleken met het pellen van een ajuin."]},{"h":"Emoties","items":["James-Lange theorie: een gebeurtenis lokt eerst een specifieke fysiologische respons van het autonome zenuwstelsel uit, en die respons leidt dan pas tot de emotie.","Schachter-Singer theorie: een emotie ontstaat uit een algemene fysiologische arousal plus een cognitieve interpretatie van de situatie; klopt de link tussen die twee niet, dan krijg je misattributie.","Emotie versus reflex: een reflex is een reactie zonder cognitie, terwijl een emotie een impuls tot handelen is waar cognities wel bij betrokken zijn.","Gemoed: een diffuse, langdurende gevoelsstaat die niet als reactie op een specifieke gebeurtenis optreedt, in tegenstelling tot een emotie.","Signaalfunctie: emoties zijn zichtbaar in gezicht en houding en geven aan anderen door hoe iemand zich voelt, wat sociale interactie stuurt.","Appraisaltheorie van Lazarus: eerst een primaire beoordeling (aangenaam of niet, bedreigend of niet) en daarna een secundaire beoordeling die de situatie in context plaatst en de eerste emotie herwaardeert.","Universaliteit van basisemoties: Ekman toonde dat de gezichtsuitdrukkingen van de zes basisemoties overal ter wereld herkend en nagebootst worden, wat wijst op een aangeboren basis.","Facial feedback hypothese: als je gezichtsuitdrukking overeenstemt met je gevoelstoestand, versterkt die uitdrukking het bijbehorende gevoel.","Proprioceptieve feedback: je gezichtsuitdrukking geeft je systeem informatie terug over hoe je je voelt.","Toonregels (display rules): regels om emoties te moduleren door ze te onderdrukken, in intensiteit te verminderen of te maskeren en te vervangen.","Impression management: het strategisch tonen van emoties om een bepaalde indruk te wekken, zoals een stewardess met een geforceerde glimlach of een vakbondleider met een boze stem.","Onderdrukking versus herwaardering (Gross): emoties onderdrukken verhoogt de arousal, terwijl de situatie herwaarderen de aversie juist vermindert.","Misattributie: het verkeerd toeschrijven van fysiologische arousal aan de verkeerde oorzaak, wat vooral optreedt als iemand niet weet waarom hij aroused is.","FACS (Facial Action Coding System): een codeersysteem waarbij alle kleine details van het gezicht worden vastgelegd om de onderliggende emotie te achterhalen."]}],"hacks":[{"h":"FRAG: Fitness, Reciprociteit, Altruisme, Groep","t":"Onthoud de vier pijlers van hoofdstuk 1 met het woord FRAG. F = Fitness (aantal nakomelingen uit je genen). R = Reciprociteit (Trivers, voor wat hoort wat). A = Altruisme, inclusief verwantenselectie (Hamilton, help je familie). G = Groepselectie (Haidt, het sociale klimaat telt). Zo heb je de rode draad van individu naar groep in een woordje."},{"h":"WAT-WAAROM: spiegel eerst, mentaliseer daarna","t":"Onthoud de volgorde bij onverwacht gedrag met de vraagwoorden. Hoe en Wat zijn low level, daar springt eerst het Spiegelsysteem aan (je ziet de actie). Waarom is high level, dan neemt het Mentaliserend systeem het over (je zoekt de reden). W-vragen die bij het lichaam blijven horen bij spiegelen, de 'waarom' gaat naar de geest."},{"h":"VAL versus HINDERNIS: kort of lang lonend?","t":"Bij een sociale VAL trap je erin voor snel gewin, dus voordelig op de korte termijn maar slecht op de lange (denk aan vervuilen). Een sociale HINDERNIS moet je eerst nemen: eerst nadelig, daarna voordelig op de lange termijn. Val = eerst leuk, later kater. Hindernis = eerst zwoegen, later oogsten."},{"h":"FRUSTJ: de bril waardoor je agressie ziet","t":"Denk aan FRUSTJ voor de psychologische verklaringen: Frustratie (Miller), Rudimentaire emoties door associaties (Berkowitz), Uit-arousal misattribueren (Zillman transfer), Sociaal leren via een model (Bobo doll), Trigger-cues zoals het wapen-effect, en Justitie/straf en angst die agressie afremmen. Zo onthoud je in 1 rijtje wie welke stap toevoegt aan de frustratie-agressie-lijn."},{"h":"De 5 stappen van Latane en Darley: 'Belangrijke Nood Vraagt Meteen Hulp'","t":"Elke beginletter staat voor een stap in het procesmodel: Bewustzijn van wat er gebeurt, Noodsituatie herkennen, persoonlijke Verantwoordelijkheid nemen, Middelen om te helpen kennen en Hulp implementeren. Zo onthoud je de volgorde 1 tot 5."},{"h":"Sternberg: de 3 hoeken van de liefdesdriehoek (I-P-T)","t":"Onthoud 'I Pak Toewijding': Intimiteit, Passie en Toewijding zijn de drie hoeken bij Sternberg. Alle drie samen = volmaakte liefde, alleen Intimiteit plus Toewijding (dus zonder Passie) = compassievolle vriendschapsliefde."},{"h":"James-Lange: eerst je lijf, dan je gevoel","t":"Bij de James-Lange theorie draait de volgorde om: eerst reageert je lichaam (het AZS geeft een specifieke fysiologische respons), en pas daarna ontstaat de emotie. Ezelsbruggetje: 'Ik beef, dus ik ben bang' (niet andersom). De pre-James theorie doet het net omgekeerd: gebeurtenis, dan emotie, dan pas het lichaam."}]};
</script>
